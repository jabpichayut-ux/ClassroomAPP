<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},

    heroDeck:{en:"US stocks snapped a three-day slide Wednesday — the S&P 500 +0.5% to 7,667 — as Treasury yields eased from multiyear highs. After the bell, Broadcom beat with AI-chip revenue up 236% YoY, though soft next-quarter guidance capped the pop. The Fed’s Beige Book flagged only ‘modest’ growth and Iran-driven price risks.", th:"หุ้นสหรัฐยุติการร่วง 3 วันในวันพุธ — S&P 500 +0.5% สู่ 7,667 — จากผลตอบแทนพันธบัตรที่ย่อลงจากจุดสูงสุดหลายปี หลังปิดตลาด Broadcom กำไรดีกว่าคาด รายได้ชิป AI พุ่ง 236% เทียบปีก่อน แม้แนวโน้มไตรมาสหน้าที่อ่อนจะจำกัดการปรับขึ้น รายงาน Beige Book ของเฟดชี้เศรษฐกิจโต ‘เล็กน้อย’ และความเสี่ยงราคาจากสงครามอิหร่าน"},
    heroNote:{en:"Illustrated cover · full photos at the linked sources", th:"ภาพหน้าปกจำลอง · ภาพข่าวจริงที่ลิงก์แหล่งข่าว"},
    dbEd:{en:"Edition", th:"ฉบับวันที่"}, dbCov:{en:"Covering", th:"ครอบคลุมการซื้อขาย"}, dbCovVal:{en:"Wed 2 Sep US close → Thu 3 Sep", th:"ปิดสหรัฐ 2 ก.ย. → 3 ก.ย."},

    leadtxt:{en:`<b>A relief rally: stocks bounced as bond yields cooled from multiyear highs — but a September Fed hike is still the base case, so it stays fragile.</b> The S&P 500 rose 0.5% to 7,667, snapping a three-day slide. Broadcom’s blowout (AI revenue +236%) reaffirmed the AI-infrastructure boom even as its guidance capped the reaction. For your clients: yields near multi-year highs keep <b>bonds compelling for income</b>, and Broadcom/Nvidia keep the <b>AI growth theme (UUSTECH) firmly intact</b> — pair the two.`, th:`<b>การรีบาวด์คลายแรงกด: หุ้นเด้งขึ้นเมื่อผลตอบแทนพันธบัตรย่อจากจุดสูงสุดหลายปี — แต่การขึ้นดอกเบี้ยเดือน ก.ย. ยังเป็นกรณีหลัก จึงยังเปราะบาง</b> ดัชนี S&P 500 ขึ้น 0.5% สู่ 7,667 ยุติการร่วง 3 วัน ผลประกอบการ Broadcom ที่ทะลุคาด (รายได้ AI +236%) ตอกย้ำการเติบโตของโครงสร้างพื้นฐาน AI แม้แนวโน้มจะจำกัดการตอบสนอง สำหรับลูกค้าของคุณ: ผลตอบแทนใกล้จุดสูงสุดหลายปีทำให้ <b>ตราสารหนี้น่าสนใจสำหรับรายได้</b> และ Broadcom/Nvidia ทำให้ <b>ธีมการเติบโต AI (UUSTECH) ยังแข็งแรง</b> — จับคู่กัน`},

    watchnote:{en:`Rate-hike odds cooled sharply Wednesday on a weak ADP report, but the real test is still the <b style="color:var(--muted)">official August jobs report on Sep 4</b> — it will decide whether September hike odds (now ~60–64%, down from a 68% peak) climb back up or keep falling ahead of the Fed's Sep 16 decision.`,
      th:`โอกาสขึ้นดอกเบี้ยลดลงชัดเจนวันพุธ หลังตัวเลข ADP ที่อ่อนแอ แต่บททดสอบที่แท้จริงยังคงเป็น <b style="color:var(--muted)">รายงานการจ้างงานทางการเดือน ส.ค. วันที่ 4 ก.ย.</b> ซึ่งจะเป็นตัวชี้ว่าโอกาสขึ้นดอกเบี้ยเดือน ก.ย. (ตอนนี้ราว 60–64% จากจุดสูงสุดที่ 68%) จะกลับขึ้นไปหรือลดลงต่อ ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,666.60", chg:0.46, series:[7631.47,7666.60],
      txt:{en:`<b>US stocks snapped a three-session losing streak Wednesday — the S&P 500 +0.46% to 7,666.60, the Dow +0.56% (+295 pts) to 53,061.95, the Nasdaq +0.45% to 26,217.83 —</b> as Nvidia jumped ~3.8% to lead the market higher, even as the US carried out direct strikes on Iranian military targets and a weak ADP jobs report reshaped the Fed outlook.`, th:`<b>หุ้นสหรัฐฯ พลิกกลับมาบวกวันพุธ หลังปรับลงต่อเนื่องสามวัน — S&P 500 เพิ่มขึ้น 0.46% สู่ 7,666.60, Dow เพิ่มขึ้น 0.56% (+295 จุด) สู่ 53,061.95, Nasdaq เพิ่มขึ้น 0.45% สู่ 26,217.83 —</b> นำโดย Nvidia ที่พุ่งขึ้นราว 3.8% แม้สหรัฐฯ จะโจมตีเป้าหมายทางทหารของอิหร่านโดยตรง และตัวเลขจ้างงาน ADP ที่อ่อนแอเปลี่ยนมุมมองต่อทิศทางเฟด`},
      why:{en:`Stocks rallying on the very day the US struck Iran directly shows rates, not geopolitics, are still the dominant driver of US price action right now — but the pause in yields came from one soft jobs report, and Friday's official data could easily reverse it. That argues for locking in today's still-historically-high coupons rather than assuming this calm holds.`, th:`การที่หุ้นปรับขึ้นในวันเดียวกับที่สหรัฐฯ โจมตีอิหร่านโดยตรง แสดงว่าดอกเบี้ย ไม่ใช่ภูมิรัฐศาสตร์ ยังคงเป็นตัวขับเคลื่อนหลักของราคาหุ้นสหรัฐฯ ในตอนนี้ — แต่การหยุดชะงักของผลตอบแทนพันธบัตรมาจากตัวเลขจ้างงานที่อ่อนแอเพียงชุดเดียว และข้อมูลทางการวันศุกร์อาจพลิกกลับได้ง่าย ๆ จึงสนับสนุนให้ล็อกคูปองที่ยังสูงในระดับประวัติการณ์วันนี้ มากกว่าจะสมมติว่าความสงบนี้จะคงอยู่`},
      full:{en:`US stocks rebounded Wednesday, snapping a three-session losing streak, as Nvidia led gains even as investors weighed a stunning geopolitical escalation against a softer labor market. The S&P 500 rose 0.46% to close at 7,666.60, the Dow Jones Industrial Average added 295.07 points (+0.56%) to 53,061.95, and the Nasdaq Composite gained 0.45% to 26,217.83, with Nvidia jumping roughly 3.8% to lead the Dow higher. The rally came even as the US military carried out what officials called "large and powerful" strikes on Iranian military and air-defense targets near the Strait of Hormuz — a direct escalation beyond prior days' threats — after Iran was accused of mining shipping lanes and striking a US base in Jordan; Iran retaliated with missiles and drones, with explosions reported over Aqaba. Oil extended its surge on the news (Brent above $94, WTI near $90.72), but stocks were driven more by rates: an ADP report showed private payrolls rose just 38,000 in August, the weakest reading since January and well below the roughly 47,000 expected, cooling CME FedWatch's September hike odds to roughly 60–64%, down sharply from 68% Tuesday. The 10-year Treasury yield eased slightly to 4.78%, pausing its five-session climb, while the 2-year fell to 4.38% and the 30-year eased to 5.26%. All eyes now turn to Friday's official August jobs report ahead of the Fed's September 16 decision.`, th:`หุ้นสหรัฐฯ ฟื้นตัววันพุธ หลังปรับลงต่อเนื่องสามวัน นำโดย Nvidia ขณะนักลงทุนชั่งน้ำหนักความขัดแย้งทางภูมิรัฐศาสตร์ที่ยกระดับขึ้นอย่างน่าตกใจ กับตลาดแรงงานที่อ่อนตัวลง ดัชนี S&P 500 เพิ่มขึ้น 0.46% ปิดที่ 7,666.60 ดัชนี Dow Jones เพิ่มขึ้น 295.07 จุด (+0.56%) สู่ 53,061.95 และดัชนี Nasdaq Composite เพิ่มขึ้น 0.45% สู่ 26,217.83 โดย Nvidia พุ่งขึ้นราว 3.8% นำ Dow ขึ้น การฟื้นตัวนี้เกิดขึ้นแม้กองทัพสหรัฐฯ จะโจมตีสิ่งที่เจ้าหน้าที่เรียกว่า "การโจมตีที่ทรงพลัง" ต่อเป้าหมายทางทหารและระบบป้องกันภัยทางอากาศของอิหร่านใกล้ช่องแคบฮอร์มุซ — ยกระดับขึ้นจากการขู่ในวันก่อนหน้า — หลังอิหร่านถูกกล่าวหาว่าวางทุ่นระเบิดในเส้นทางเดินเรือและโจมตีฐานทัพสหรัฐฯ ในจอร์แดน อิหร่านตอบโต้ด้วยขีปนาวุธและโดรน โดยมีรายงานการระเบิดเหนือเมืองอัคอบา ราคาน้ำมันปรับขึ้นต่อจากข่าวนี้ (เบรนท์เหนือ $94 WTI ใกล้ $90.72) แต่หุ้นได้แรงหนุนจากดอกเบี้ยมากกว่า: รายงาน ADP ชี้จ้างงานภาคเอกชนเพิ่มเพียง 38,000 ตำแหน่งในเดือน ส.ค. ต่ำสุดตั้งแต่เดือน ม.ค. และต่ำกว่าคาดการณ์ที่ราว 47,000 มาก ทำให้ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลงเหลือราว 60–64% ลดลงมากจาก 68% วันอังคาร ผลตอบแทนพันธบัตร 10 ปีอ่อนตัวลงเล็กน้อยสู่ 4.78% หยุดการปรับขึ้นต่อเนื่องห้าวัน ขณะพันธบัตร 2 ปีลดลงสู่ 4.38% และ 30 ปีอ่อนตัวลงสู่ 5.26% ทุกสายตาตอนนี้จับตารายงานการจ้างงานทางการเดือน ส.ค. วันศุกร์ ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`},
      sources:[{l:"CNBC",u:"https://www.cnbc.com/2026/09/01/us-strikes-iran-after-new-hormuz-strait-shipping-attacks-centcom.html"},{l:"24/7 Wall St.",u:"https://247wallst.com/cards/all-three-major-indexes-finished-green-with-the-dow-s-324-p-gspc-market-bell-01m1hvgqqs9pk4pyhq877zm73r"},{l:"CNBC — ADP report",u:"https://www.cnbc.com/2026/09/02/private-payrolls-rose-by-38000-in-august-fewer-than-expected-adp-reports/"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,839", chg:-0.50, series:[26020,25839],
      txt:{en:`<b>DAX fell a third straight session to 25,839 Wednesday (about −0.50%),</b> led lower by autos and luxury names (Zalando −5.2%, Volkswagen −3.8%, Porsche −3.4%) — a homegrown European story that didn't get the same relief from cooling Fed-hike odds that lifted Wall Street.`, th:`<b>DAX ลดลงต่อเนื่องเป็นวันที่สามสู่ 25,839 วันพุธ (ราว −0.50%)</b> นำโดยหุ้นกลุ่มยานยนต์และสินค้าหรู (Zalando ลดลง 5.2%, Volkswagen ลดลง 3.8%, Porsche ลดลง 3.4%) — เป็นเรื่องราวเฉพาะของยุโรปเองที่ไม่ได้รับอานิสงส์จากโอกาสขึ้นดอกเบี้ยเฟดที่ลดลงเหมือนวอลล์สตรีท`},
      why:{en:`Europe falling for a third straight session while the US rallied, on its own sector-specific weakness rather than the Iran/rates story, is a reminder that not every developed market reads the same day the same way; that's a useful nuance for clients who assume "global markets" move as one block.`, th:`การที่ยุโรปปรับลงต่อเนื่องเป็นวันที่สาม ขณะสหรัฐฯ กลับบวก จากความอ่อนแอเฉพาะกลุ่มอุตสาหกรรมของยุโรปเอง ไม่ใช่เรื่องอิหร่าน/ดอกเบี้ย เป็นเครื่องเตือนใจว่าไม่ใช่ทุกตลาดพัฒนาแล้วจะเคลื่อนไหวไปในทิศทางเดียวกันเสมอ ซึ่งเป็นประเด็นที่มีประโยชน์สำหรับลูกค้าที่คิดว่า "ตลาดโลก" เคลื่อนไหวเป็นกลุ่มก้อนเดียวกัน`},
      full:{en:`European shares fell for a third straight session Wednesday, with Germany's DAX closing around 25,839, down roughly 0.50% from Tuesday's 26,020 close, led by weakness in autos and luxury names — Zalando dropped 5.2%, Volkswagen 3.8%, and Porsche 3.4% — on demand concerns distinct from the Iran/oil story. Notably, the DAX didn't get the same lift Wall Street did from cooling US rate-hike odds, since the Fed's path affects European borrowing costs only indirectly. Investors now watch the US August jobs report (Sep 4) and the European data calendar for the next signal.`, th:`หุ้นยุโรปปรับลงต่อเนื่องเป็นวันที่สามวันพุธ ดัชนี DAX เยอรมนีปิดตลาดที่ราว 25,839 ลดลงประมาณ 0.50% จากระดับปิด 26,020 เมื่อวันอังคาร นำโดยความอ่อนแอของหุ้นกลุ่มยานยนต์และสินค้าหรู — Zalando ลดลง 5.2%, Volkswagen ลดลง 3.8% และ Porsche ลดลง 3.4% — จากความกังวลด้านดีมานด์ที่แยกจากเรื่องอิหร่าน/น้ำมัน ที่น่าสังเกตคือ DAX ไม่ได้รับอานิสงส์เช่นเดียวกับวอลล์สตรีทจากโอกาสขึ้นดอกเบี้ยสหรัฐฯ ที่ลดลง เนื่องจากทิศทางเฟดส่งผลต่อต้นทุนการกู้ยืมของยุโรปทางอ้อมเท่านั้น นักลงทุนตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ (4 ก.ย.) และปฏิทินข้อมูลเศรษฐกิจยุโรปเป็นสัญญาณถัดไป`},
      sources:[{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"},{l:"CNBC",u:"https://www.cnbc.com/2026/09/01/us-strikes-iran-after-new-hormuz-strait-shipping-attacks-centcom.html"},{l:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-09-01/stock-market-today-dow-s-p-live-updates"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"64,536.79", chg:-2.53, series:[66185.83,64536.79],
      txt:{en:`<b>Nikkei 225 tumbled 2.53% to 64,536.79 Wednesday,</b> its steepest one-day drop in weeks, as a fresh AI-infrastructure-spending scare hit chip and tech suppliers hard (SoftBank −6.4%, Tokyo Electron −3.4%, Advantest −2.5%), erasing roughly ¥31.8tn (~$202bn) in market value — even as the very same Nvidia rally that drove the AI trade lifted Wall Street.`, th:`<b>Nikkei 225 ร่วงหนัก 2.53% สู่ 64,536.79 วันพุธ</b> ปรับลงแรงที่สุดในรอบหลายสัปดาห์ หลังความกังวลใหม่เรื่องการลงทุนโครงสร้างพื้นฐาน AI กระทบหุ้นกลุ่มชิปและซัพพลายเออร์เทคอย่างหนัก (SoftBank ลดลง 6.4%, Tokyo Electron ลดลง 3.4%, Advantest ลดลง 2.5%) มูลค่าตลาดหายไปราว 31.8 ล้านล้านเยน (ราว 2 แสนล้านดอลลาร์) — แม้จะเป็นธีม AI เดียวกับที่ดัน Nvidia และวอลล์สตรีทให้ปรับขึ้น`},
      why:{en:`The same AI theme that lifted Nvidia in the US hammered its Asian supply-chain suppliers on the same day — a genuine geographic split within one theme, not a broad risk-off move. That's a strong case for clients to diversify AI/tech exposure across regions rather than concentrating in any single country's chip names.`, th:`ธีม AI เดียวกันที่ดัน Nvidia ในสหรัฐฯ ขึ้น กลับฉุดซัพพลายเออร์ในห่วงโซ่อุปทานเอเชียลงในวันเดียวกัน — เป็นการแยกทิศทางตามภูมิภาคอย่างแท้จริงภายในธีมเดียว ไม่ใช่การเทขายความเสี่ยงในวงกว้าง เป็นเหตุผลที่ชัดเจนให้ลูกค้ากระจายการลงทุนธีม AI/เทคทั่วภูมิภาค แทนที่จะกระจุกตัวในหุ้นชิปประเทศใดประเทศหนึ่ง`},
      full:{en:`Asian tech and chip stocks sold off sharply Wednesday, decoupled from the Iran story and instead driven by renewed worries over AI-infrastructure capital spending — echoing the July/August chip selloffs. Japan's Nikkei 225 fell about 2.53% to close at 64,536.79, erasing roughly ¥31.8tn (~$202bn) in market capitalization, with SoftBank down 6.4%, Tokyo Electron down 3.4%, Advantest down 2.5%, and Taiyo Yuden down 4.6%. South Korea's KOSPI fell a similar 2.41% to 6,671.12 on the same theme. The move came even as Nvidia jumped roughly 3.8% in the US the same day, leading Wall Street higher — a striking divergence within the same AI trade, split by geography and position in the supply chain. Markets across the region now look to the US August jobs report on September 4 and the Fed's September 16 meeting for the next signal.`, th:`หุ้นเทคและชิปเอเชียเทขายหนักวันพุธ แยกทิศทางออกจากเรื่องอิหร่าน และขับเคลื่อนโดยความกังวลใหม่เรื่องการลงทุนโครงสร้างพื้นฐาน AI แทน — สอดคล้องกับการเทขายหุ้นชิปในเดือน ก.ค./ส.ค. ที่ผ่านมา ดัชนี Nikkei 225 ญี่ปุ่นลดลงราว 2.53% ปิดที่ 64,536.79 มูลค่าตลาดหายไปราว 31.8 ล้านล้านเยน (ราว 2 แสนล้านดอลลาร์) โดย SoftBank ลดลง 6.4%, Tokyo Electron ลดลง 3.4%, Advantest ลดลง 2.5% และ Taiyo Yuden ลดลง 4.6% ดัชนี KOSPI เกาหลีใต้ลดลงในสัดส่วนใกล้เคียงกันที่ 2.41% สู่ 6,671.12 จากธีมเดียวกัน การเคลื่อนไหวนี้เกิดขึ้นแม้ Nvidia จะพุ่งขึ้นราว 3.8% ในสหรัฐฯ วันเดียวกัน นำวอลล์สตรีทขึ้น — เป็นความแตกต่างที่ชัดเจนภายในธีม AI เดียวกัน แบ่งตามภูมิภาคและตำแหน่งในห่วงโซ่อุปทาน ตลาดทั่วภูมิภาคตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. และการประชุมเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"MarketScreener",u:"https://www.marketscreener.com/news/japan-s-nikkei-slumps-sharply-as-tech-sell-off-spreads-ce7859ddde8bf326"},{l:"Invezz",u:"https://invezz.com/news/2026/09/02/nikkei-225-index-analysis-as-japan-bond-yields-surge-softbank-stock-plunges/"},{l:"Trading Economics",u:"https://tradingeconomics.com/japan/stock-market"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,311", chg:-0.05, series:[25324,25311],
      txt:{en:`<b>Hang Seng was little changed Wednesday, easing 0.05% to 25,311,</b> holding up far better than Tokyo's tech-led rout, while mainland China's <b>Shanghai Composite fell 0.97% to 3,941.39</b> as onshore investors also turned cautious on the same AI-capex worries hitting Japan and Korea.`, th:`<b>Hang Seng แทบไม่เปลี่ยนแปลงวันพุธ ลดลงเพียง 0.05% สู่ 25,311</b> ยืนได้ดีกว่าตลาดโตเกียวที่ร่วงหนักจากหุ้นเทคมาก ขณะ <b>Shanghai Composite จีนแผ่นดินใหญ่ลดลง 0.97% สู่ 3,941.39</b> หลังนักลงทุนในประเทศระมัดระวังจากความกังวลเรื่องการลงทุน AI เดียวกับที่กระทบญี่ปุ่นและเกาหลี`},
      why:{en:`Hong Kong holding roughly flat while Tokyo's Nikkei plunged 2.53% on the same AI-capex theme shows this selloff hit Japan/Korea's chip-supply-chain names hardest, not Asian equities broadly — useful for clients who assume any "Asia tech" headline hits every regional market equally.`, th:`การที่ฮ่องกงทรงตัว ขณะ Nikkei ญี่ปุ่นร่วงหนัก 2.53% จากธีมการลงทุน AI เดียวกัน แสดงว่าการเทขายครั้งนี้กระทบหุ้นกลุ่มห่วงโซ่อุปทานชิปของญี่ปุ่น/เกาหลีหนักที่สุด ไม่ใช่หุ้นเอเชียในวงกว้าง — มีประโยชน์สำหรับลูกค้าที่คิดว่าข่าว "หุ้นเทคเอเชีย" กระทบทุกตลาดในภูมิภาคเท่ากัน`},
      full:{en:`Greater China markets were mixed Wednesday, decoupled from the sharp AI-chip selloff hammering Japan and Korea. Hong Kong's Hang Seng closed little changed, down 0.05% to 25,311, holding up far better than the Nikkei's 2.53% plunge, while the Shanghai Composite fell 0.97% to 3,941.39 as onshore investors turned more cautious alongside a global tape unsettled by the direct US-Iran military strikes and their oil-price fallout. Neither Chinese market showed the same acute tech-supply-chain stress seen in Tokyo and Seoul. Markets across the region now look to the US August jobs report on September 4 and the Fed's September 16 meeting for the next signal.`, th:`ตลาดจีนและฮ่องกงเคลื่อนไหวผสมวันพุธ แยกทิศทางออกจากการเทขายหุ้นชิป AI ที่กระทบญี่ปุ่นและเกาหลีอย่างหนัก ดัชนี Hang Seng ฮ่องกงปิดตลาดแทบไม่เปลี่ยนแปลง ลดลง 0.05% สู่ 25,311 ยืนได้ดีกว่า Nikkei ที่ร่วง 2.53% มาก ขณะ Shanghai Composite ลดลง 0.97% สู่ 3,941.39 หลังนักลงทุนในประเทศระมัดระวังมากขึ้นตามบรรยากาศตลาดโลกที่ผันผวนจากการโจมตีทางทหารสหรัฐ-อิหร่านโดยตรงและผลกระทบต่อราคาน้ำมัน ตลาดจีนทั้งสองแห่งไม่ได้แสดงความตึงเครียดในห่วงโซ่อุปทานเทคโนโลยีรุนแรงเท่าที่เห็นในโตเกียวและโซล ตลาดทั่วภูมิภาคตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. และการประชุมเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"Trading Economics",u:"https://tradingeconomics.com/hong-kong/stock-market"},{l:"Armenpress",u:"https://armenpress.am/en/article/1259506"},{l:"Trading Economics",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,575.07", chg:-0.86, series:[1588.68,1575.07],
      txt:{en:`<b>SET Index fell 0.86% to 1,575.07 Wednesday (−13.61pts),</b> on turnover of about THB 64.33bn, as investors de-risked ahead of the widening Middle East conflict and persistent US rate uncertainty, even as Wall Street itself rallied.`, th:`<b>ดัชนี SET ลดลง 0.86% สู่ 1,575.07 วันพุธ (−13.61 จุด)</b> มูลค่าการซื้อขายราว 6.433 หมื่นล้านบาท นักลงทุนลดความเสี่ยงก่อนความขัดแย้งตะวันออกกลางที่ขยายวงกว้างขึ้น และความไม่แน่นอนของดอกเบี้ยสหรัฐฯ ที่ยังคงอยู่ แม้วอลล์สตรีทเองจะกลับมาบวก`},
      why:{en:`The SET falling harder than Wall Street on a day the US actually rallied shows Thai equities are currently pricing the raw geopolitical headline (direct US-Iran strikes), not the softer US rate outlook — a reminder that local sentiment can lag or diverge from the global risk narrative clients read in the news.`, th:`การที่ SET ปรับลงแรงกว่าวอลล์สตรีท ในวันที่สหรัฐฯ เองกลับบวก แสดงว่าหุ้นไทยตอนนี้กำลังสะท้อนพาดหัวข่าวภูมิรัฐศาสตร์ดิบ (การโจมตีสหรัฐ-อิหร่านโดยตรง) มากกว่ามุมมองดอกเบี้ยสหรัฐฯ ที่ผ่อนคลายลง เป็นเครื่องเตือนใจว่าบรรยากาศในประเทศอาจล่าช้าหรือแยกทิศทางจากเรื่องราวความเสี่ยงโลกที่ลูกค้าอ่านจากข่าว`},
      full:{en:`Thailand's SET Index closed Wednesday at 1,575.07, down 13.61 points (-0.86%), on turnover of about THB 64.33 billion, as investors de-risked ahead of a widening Middle East conflict — the US carried out direct strikes on Iranian targets and Iran retaliated — even as Wall Street itself rallied on cooling Fed-hike odds. The decline outpaced the US move, though brokers continue to flag the Fed's rate path as the key swing factor for regional flows. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity, with the next major catalyst being the US August jobs report on September 4 ahead of the Fed's September 16 decision.`, th:`ดัชนี SET ของไทยปิดตลาดวันพุธที่ 1,575.07 ลดลง 13.61 จุด (-0.86%) มูลค่าการซื้อขายราว 6.433 หมื่นล้านบาท นักลงทุนลดความเสี่ยงก่อนความขัดแย้งตะวันออกกลางที่ขยายวงกว้างขึ้น — สหรัฐฯ โจมตีเป้าหมายอิหร่านโดยตรง และอิหร่านตอบโต้กลับ — แม้วอลล์สตรีทเองจะกลับมาบวกจากโอกาสขึ้นดอกเบี้ยเฟดที่ลดลง การปรับลงนี้แรงกว่าการเคลื่อนไหวของสหรัฐฯ แม้โบรกเกอร์จะยังคงระบุว่าทิศทางดอกเบี้ยของเฟดเป็นปัจจัยแกว่งสำคัญของกระแสเงินในภูมิภาค เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว โดยปัจจัยขับเคลื่อนสำคัญถัดไปคือรายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`},
      sources:[{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/589925"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"CNBC",u:"https://www.cnbc.com/2026/09/01/us-strikes-iran-after-new-hormuz-strait-shipping-attacks-centcom.html"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil surged further Wednesday — Brent to ~$94.86/bbl (+3.9%), WTI to ~$90.72 —</b> after the US carried out direct strikes on Iranian military targets and Iran retaliated near Jordan, the sharpest escalation yet in the Hormuz standoff. <b>Gold barely moved, hovering near $4,350, a two-week low,</b> even as the conflict turned kinetic — a sign rate expectations still outweigh the safe-haven bid.`, th:`<b>น้ำมันพุ่งขึ้นต่อวันพุธ — เบรนท์แตะราว $94.86 ต่อบาร์เรล (เพิ่มขึ้น 3.9%), WTI ราว $90.72</b> หลังสหรัฐฯ โจมตีเป้าหมายทางทหารของอิหร่านโดยตรง และอิหร่านตอบโต้ใกล้จอร์แดน นับเป็นการยกระดับความตึงเครียดในฮอร์มุซที่รุนแรงที่สุดจนถึงตอนนี้ <b>ทองคำแทบไม่ขยับ อยู่ใกล้ $4,350 ต่ำสุดในรอบสองสัปดาห์</b> แม้ความขัดแย้งจะกลายเป็นการปะทะจริงแล้ว สะท้อนว่ามุมมองดอกเบี้ยยังคงมีน้ำหนักมากกว่าแรงซื้อสินทรัพย์ปลอดภัย`},
     why:{en:`Actual strikes, not just threats, and gold still going nowhere is the clearest gap yet between live conflict and the gold price — the kind of gap that can close fast if the standoff escalates further or de-escalates suddenly. Frame today's flat gold as a widening discount on portfolio insurance, not evidence the risk has passed.`, th:`การโจมตีจริง ไม่ใช่แค่การขู่ และทองคำที่ยังไม่ขยับ เป็นช่องว่างที่ชัดเจนที่สุดจนถึงตอนนี้ระหว่างความขัดแย้งที่เกิดขึ้นจริงกับราคาทองคำ — เป็นช่องว่างที่อาจปิดลงอย่างรวดเร็วหากสถานการณ์ยกระดับต่อหรือคลี่คลายลงอย่างฉับพลัน นำเสนอทองคำที่ทรงตัววันนี้เป็นส่วนลดที่กว้างขึ้นของสินทรัพย์ประกันความเสี่ยงพอร์ต ไม่ใช่หลักฐานว่าความเสี่ยงผ่านไปแล้ว`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 10-year Treasury yield eased slightly to 4.78% Wednesday, pausing its five-session climb,</b> after a weak ADP report showed just 38,000 August private-payroll additions — the softest since January. <b>CME FedWatch now shows roughly a 60–64% chance of a September hike, down sharply from 68% Tuesday.</b> The <b>2-year yield eased to 4.38%,</b> and the <b>30-year eased to 5.26%.</b>`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีอ่อนตัวลงเล็กน้อยสู่ 4.78% วันพุธ หยุดการปรับขึ้นต่อเนื่องห้าวัน</b> หลังรายงาน ADP ที่อ่อนแอชี้จ้างงานภาคเอกชนเดือน ส.ค. เพิ่มเพียง 38,000 ตำแหน่ง ต่ำสุดตั้งแต่เดือน ม.ค. <b>CME FedWatch ตอนนี้ชี้โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ราว 60–64% ลดลงมากจาก 68% วันอังคาร</b> ผลตอบแทนพันธบัตร <b>2 ปีอ่อนตัวลงสู่ 4.38%</b> และ <b>30 ปีอ่อนตัวลงสู่ 5.26%</b>`},
     why:{en:`One soft jobs report paused a five-day rally, but it didn't reverse it — yields remain near multi-year highs, and Friday's official jobs report could just as easily reignite the climb. The pause doesn't weaken the lock-in case; if anything, it's a reminder how quickly one data print can move the window.`, th:`ตัวเลขจ้างงานที่อ่อนแอเพียงชุดเดียวหยุดการปรับขึ้นต่อเนื่องห้าวันได้ แต่ไม่ได้พลิกกลับทิศทาง — ผลตอบแทนยังคงอยู่ใกล้ระดับสูงสุดในรอบหลายปี และรายงานการจ้างงานทางการวันศุกร์อาจจุดชนวนการปรับขึ้นต่อได้ง่าย ๆ การหยุดชะงักนี้ไม่ได้ทำให้เหตุผลของการล็อกคูปองอ่อนลง แต่กลับเป็นเครื่องเตือนใจว่าข้อมูลเพียงชุดเดียวสามารถขยับหน้าต่างโอกาสได้เร็วเพียงใด`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`The president's focus escalated from threats to action this week: <b>the US carried out direct strikes on Iranian military targets Wednesday,</b> with Iran retaliating near Jordan. Tariff risk hasn't gone away — Section 338 tariffs remain in effect and a possible ~7.5% China "overcapacity" tariff still looms ahead of a planned Trump-Xi summit — but it's the Iran conflict, not trade, dominating headlines and price action right now.`, th:`ประเด็นหลักของทรัมป์สัปดาห์นี้ยกระดับจากการขู่ไปสู่การลงมือจริง: <b>สหรัฐฯ โจมตีเป้าหมายทางทหารของอิหร่านโดยตรงวันพุธ</b> และอิหร่านตอบโต้กลับใกล้จอร์แดน ความเสี่ยงภาษียังไม่หายไป — มาตรการภาษีมาตรา 338 ยังคงมีผลบังคับใช้ และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้ — แต่ตอนนี้ความขัดแย้งกับอิหร่าน ไม่ใช่การค้า ที่ครองพาดหัวข่าวและขับเคลื่อนราคาสินทรัพย์`}, w:{en:`With the Iran conflict now genuinely kinetic, tariff risk still simmering, and the Fed outlook swinging on a single jobs print, this is a good week to reinforce that diversified, bond-anchored portfolios remain the right hedge against any of these largely independent risks resurfacing at once.`, th:`เมื่อความขัดแย้งกับอิหร่านกลายเป็นการปะทะจริงแล้ว ความเสี่ยงภาษียังคุกรุ่นอยู่ และมุมมองเฟดแกว่งไปมาตามตัวเลขจ้างงานเพียงชุดเดียว สัปดาห์นี้เป็นจังหวะดีที่จะย้ำกับลูกค้าว่าพอร์ตที่กระจายความเสี่ยงและมีตราสารหนี้เป็นหลักยังคงเป็นเกราะป้องกันที่เหมาะสม หากความเสี่ยงที่ค่อนข้างเป็นอิสระต่อกันเหล่านี้กลับมาพร้อมกัน`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>The Iran standoff escalated sharply Wednesday:</b> US forces carried out what officials called "large and powerful" strikes on Iranian military and air-defense targets near the Strait of Hormuz, and Iran retaliated with missiles and drones, with explosions reported over Aqaba, Jordan. Oil jumped further on the news — Brent to ~$94.86 (+3.9%).`, th:`<b>ความตึงเครียดกับอิหร่านยกระดับขึ้นอย่างชัดเจนวันพุธ:</b> กองทัพสหรัฐฯ โจมตีสิ่งที่เจ้าหน้าที่เรียกว่า "การโจมตีที่ทรงพลัง" ต่อเป้าหมายทางทหารและระบบป้องกันภัยทางอากาศของอิหร่านใกล้ช่องแคบฮอร์มุซ และอิหร่านตอบโต้ด้วยขีปนาวุธและโดรน โดยมีรายงานการระเบิดเหนือเมืองอัคอบา ประเทศจอร์แดน ราคาน้ำมันพุ่งขึ้นต่อจากข่าวนี้ — เบรนท์แตะราว $94.86 (เพิ่มขึ้น 3.9%)`}, w:{en:`Actual military strikes, not just open threats, is a real step change in escalation risk — and even so, Wall Street rallied and gold stayed flat, meaning today's calm reaction could unwind quickly if the conflict widens further. That's the clearest argument yet for keeping both gold and bond ballast in client portfolios rather than treating the Iran standoff as contained.`, th:`การโจมตีทางทหารจริง ไม่ใช่แค่การขู่ เป็นการเปลี่ยนแปลงที่แท้จริงของระดับความเสี่ยง — และแม้จะเป็นเช่นนั้น วอลล์สตรีทก็ยังคงบวก และทองคำยังทรงตัว หมายความว่าปฏิกิริยาที่สงบในวันนี้อาจพลิกกลับได้เร็วหากความขัดแย้งขยายวงกว้างขึ้นอีก นี่คือเหตุผลที่ชัดเจนที่สุดจนถึงตอนนี้ให้คงทั้งทองคำและตราสารหนี้เป็นตัวถ่วงสมดุลในพอร์ตลูกค้า แทนที่จะมองว่าความตึงเครียดกับอิหร่านถูกควบคุมไว้ได้แล้ว`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`<b>The 10-year Treasury yield eased slightly to 4.78% Wednesday, pausing its five-session climb,</b> after a weak ADP report showed just 38,000 August private-payroll additions, the softest since January. <b>September hike odds fell to roughly 60–64%,</b> from a 68% peak Tuesday, per CME FedWatch. The 2-year yield eased to 4.38%, and the 30-year eased to 5.26%.`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีอ่อนตัวลงเล็กน้อยสู่ 4.78% วันพุธ หยุดการปรับขึ้นต่อเนื่องห้าวัน</b> หลังรายงาน ADP ที่อ่อนแอชี้จ้างงานภาคเอกชนเดือน ส.ค. เพิ่มเพียง 38,000 ตำแหน่ง ต่ำสุดตั้งแต่เดือน ม.ค. <b>โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเหลือราว 60–64%</b> จากจุดสูงสุดที่ 68% เมื่อวันอังคาร ตามข้อมูล CME FedWatch ผลตอบแทนพันธบัตร 2 ปีอ่อนตัวลงสู่ 4.38% และพันธบัตร 30 ปีอ่อนตัวลงสู่ 5.26%`}, w:{en:`One weak jobs report paused the fastest repricing of the year — but it didn't reverse it, and yields remain near multi-year highs. Friday's official jobs report is the real test: a strong print could send hike odds right back up. That argues for locking in today's still-elevated coupons now rather than waiting to see which way Friday breaks.`, th:`ตัวเลขจ้างงานที่อ่อนแอเพียงชุดเดียวหยุดการปรับคาดการณ์ที่เร็วที่สุดของปีนี้ได้ — แต่ไม่ได้พลิกกลับทิศทาง และผลตอบแทนยังคงอยู่ใกล้ระดับสูงสุดในรอบหลายปี รายงานการจ้างงานทางการวันศุกร์คือบททดสอบที่แท้จริง — หากตัวเลขออกมาแข็งแกร่งอาจดันโอกาสขึ้นดอกเบี้ยกลับขึ้นไปได้ทันที สนับสนุนให้ล็อกคูปองที่ยังสูงอยู่วันนี้ มากกว่าจะรอดูว่าวันศุกร์จะออกมาทางไหน`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`Oil's fresh surge to ~$94.86/bbl on direct US-Iran strikes keeps stacking a fresh, independent inflation risk — even as Wednesday's weak ADP report (August's softest hiring since January) argues for a cooling economy. <b>Energy prices and labor-market data are now pulling the inflation story in opposite directions at once,</b> making the Fed's September 16 call genuinely harder.`, th:`น้ำมันที่พุ่งขึ้นใหม่สู่ราว $94.86 ต่อบาร์เรล จากการโจมตีสหรัฐ-อิหร่านโดยตรง ยังคงซ้อนทับความเสี่ยงเงินเฟ้อใหม่ที่เป็นอิสระต่อกัน แม้รายงาน ADP ที่อ่อนแอวันพุธ (การจ้างงานเดือน ส.ค. ที่อ่อนแอที่สุดตั้งแต่เดือน ม.ค.) จะสนับสนุนภาพเศรษฐกิจที่ชะลอตัวลง <b>ตอนนี้ราคาพลังงานและข้อมูลตลาดแรงงานกำลังดึงเรื่องราวเงินเฟ้อไปคนละทิศทางพร้อมกัน</b> ทำให้การตัดสินใจของเฟดวันที่ 16 ก.ย. ยากขึ้นจริง ๆ`}, w:{en:`When energy and labor data disagree this sharply, the Fed's decision gets genuinely harder to call — which is exactly the environment where locking in known bond income beats waiting for clarity that may not arrive by Friday's jobs report.`, th:`เมื่อข้อมูลพลังงานและตลาดแรงงานขัดแย้งกันชัดเจนขนาดนี้ การตัดสินใจของเฟดยากขึ้นจริง ๆ ที่จะคาดเดา ซึ่งเป็นสภาวะที่การล็อกรายได้ตราสารหนี้ที่รู้แน่นอนดีกว่าการรอความชัดเจนที่อาจไม่มาถึงก่อนรายงานการจ้างงานวันศุกร์`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed",th:"พุธ"}, imp:"h", t:{en:"US strikes Iran directly; Wall St rallies as weak jobs data cools Fed bets to ~61%",th:"สหรัฐโจมตีอิหร่านโดยตรง วอลล์สตรีทกลับบวก หลังตัวเลขจ้างงานอ่อนแอลดแรงเดิมพันขึ้นดอกเบี้ยเฟดเหลือราว 61%"}, d:{en:"The US carried out \"large and powerful\" strikes on Iranian military targets near Hormuz and Iran retaliated, sending Brent above $94. Yet US stocks rallied (S&P +0.46%, led by Nvidia +3.8%) after ADP showed just 38,000 August private-payroll additions — the weakest since January — pulling September hike odds down to roughly 60–64% from 68%. A separate AI-chip selloff hit Asia hard (Nikkei −2.53%).",th:"สหรัฐฯ โจมตี \"การโจมตีที่ทรงพลัง\" ต่อเป้าหมายทางทหารของอิหร่านใกล้ฮอร์มุซ และอิหร่านตอบโต้กลับ ดันเบรนท์ทะลุ $94 แต่หุ้นสหรัฐฯ กลับบวก (S&P เพิ่มขึ้น 0.46% นำโดย Nvidia ที่พุ่ง 3.8%) หลัง ADP ชี้จ้างงานภาคเอกชนเดือน ส.ค. เพิ่มเพียง 38,000 ตำแหน่ง ต่ำสุดตั้งแต่ ม.ค. ดันโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเหลือราว 60–64% จาก 68% ขณะหุ้นชิป AI เอเชียเทขายหนักแยกต่างหาก (Nikkei ลดลง 2.53%)"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue",th:"อังคาร"}, imp:"h", t:{en:"10Y yield closes at 4.79% (5th straight rise); Wall St falls a 3rd day, hike odds hit 68%",th:"พันธบัตร 10 ปีปิดที่ 4.79% (ขึ้นต่อเนื่องวันที่ 5); วอลล์สตรีทร่วงวันที่ 3 โอกาสขึ้นดอกเบี้ยแตะ 68%"}, d:{en:"Chip stocks led a third straight session of US losses (S&P −0.71%, Nasdaq −1.03%) as Trump's continued Iran threats kept oil climbing (Brent +0.87% to $91.28) and pushed the 10-year Treasury yield to 4.79%, its highest close since Jan 2025. Gold extended its slide to $4,358.74, a two-week low.",th:"หุ้นกลุ่มชิปนำการปรับลงของสหรัฐฯ ต่อเนื่องเป็นวันที่สาม (S&P ลดลง 0.71%, Nasdaq ลดลง 1.03%) หลังทรัมป์ยังคงขู่โจมตีอิหร่านต่อเนื่อง ดันน้ำมันขึ้นต่อ (เบรนท์เพิ่มขึ้น 0.87% สู่ $91.28) และดันผลตอบแทนพันธบัตร 10 ปีสู่ 4.79% ระดับปิดสูงสุดตั้งแต่ ม.ค. 2025 ทองคำร่วงต่อลงสู่ $4,358.74 ต่ำสุดในรอบสองสัปดาห์"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon",th:"จันทร์"}, imp:"h", t:{en:"Trump threatens more Iran strikes; 10Y yield tops 4.75%, hike odds hit 66%",th:"ทรัมป์ขู่โจมตีอิหร่านเพิ่ม พันธบัตร 10 ปีทะลุ 4.75% โอกาสขึ้นดอกเบี้ยแตะ 66%"}, d:{en:"Oil jumped over 3% intraday (Brent $90.69, WTI above $86) on the president's threat, pushing the 10-year Treasury yield above 4.75% for the first time since Jan 2025. US stocks fell (S&P −0.33%, Dow −0.7%); gold extended its slide below $4,450/oz.",th:"น้ำมันพุ่งขึ้นกว่า 3% ระหว่างวัน (เบรนท์ $90.69, WTI เหนือ $86) จากการขู่ของประธานาธิบดี ดันผลตอบแทนพันธบัตร 10 ปีทะลุ 4.75% เป็นครั้งแรกนับตั้งแต่ ม.ค. 2025 หุ้นสหรัฐฯ ปรับลง (S&P ลดลง 0.33%, Dow ลดลง 0.7%) ทองคำร่วงต่อลงต่ำกว่า $4,450 ต่อออนซ์"}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`<div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div><div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div><div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน และค่าเงิน':'US Treasuries, gold, oil & FX',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p>${f.now?`<div class="fnow"><span>${L==='th'?'ทำไมตอนนี้':'Why now'}</span>${t(f.now)}</div>`:''}<div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');
    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
