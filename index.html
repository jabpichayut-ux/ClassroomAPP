<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Nvidia Beats and Guides to $130bn, Shares Rise After Hours — But First a Fourth Straight Nasdaq Loss: Dow −849, S&P 500 −1.0% to a Five-Month Low, SET −1.7% on US Chip Curbs", th:"Nvidia งบดีเกินคาด คาดรายได้ $130 พันล้าน หุ้นขึ้นหลังตลาดปิด — แต่ก่อนหน้านั้น Nasdaq ลดลงวันที่ 4 ติด Dow −849 จุด S&P 500 −1.0% ต่ำสุดในรอบ 5 เดือน SET −1.7% จากกฎคุมชิปของสหรัฐฯ"},
    heroDeck:{en:`Tuesday's regular session was another down day, but the night ended on better news. Before the bell, software stocks (Salesforce, Intuit, ServiceNow) led a broad selloff and investors trimmed chip holdings ahead of Nvidia: the Dow fell 848.75 points (−1.64%) to 50,759.42, the S&P 500 1.03% to 7,340.53 — a five-month low — and the Nasdaq 0.74% to 24,328.38, its fourth straight loss. Then, after the close, Nvidia's first report under interim CEO Colette Kress beat clearly: revenue about $115.8bn (+103% y/y) against ~$108–109bn expected, adjusted EPS $2.68 vs ~$2.48, and Q4 guidance of $130bn ±3% vs ~$125bn expected, with no China data-centre sales assumed. The shares rose in after-hours trade, though its board also confirmed Jensen Huang will not be reinstated. Bonds were calm: the 10-year eased to about 5.10%, the 2-year ~4.80% and the 30-year ~5.46%, even as St. Louis Fed President Musalem said several more hikes may be needed. Brent slipped to about $91.8 and gold held near $3,855. Elsewhere it was a rough day: Europe's Stoxx 600 had its worst day in eight months (−1.75%) and the DAX fell 1.97% to about 26,076; the Nikkei lost 1.34% to 58,860.43, Korea's Kospi 2.6% to a six-month low and the Hang Seng about 1%. The SET fell 1.66% to 1,474.68 on reports that new US chip-export rules will cover Thailand and other ASEAN data centres. Next: Fed minutes Wednesday and Anthropic's Nasdaq debut, expected Thursday 19 Nov.`, th:`ช่วงเวลาซื้อขายปกติวันอังคารยังเป็นวันลบ แต่ปิดท้ายคืนด้วยข่าวดี ระหว่างวันหุ้นซอฟต์แวร์ (Salesforce, Intuit, ServiceNow) นำการเทขาย และนักลงทุนลดหุ้นชิปก่อนงบ Nvidia: Dow ลดลง 848.75 จุด (−1.64%) สู่ 50,759.42 S&P 500 ลดลง 1.03% สู่ 7,340.53 — ต่ำสุดในรอบ 5 เดือน — และ Nasdaq ลดลง 0.74% สู่ 24,328.38 ลดลงเป็นวันที่ 4 ติด หลังตลาดปิด งบแรกของ Nvidia ภายใต้ซีอีโอรักษาการ Colette Kress ออกมาดีชัดเจน: รายได้ราว $115.8 พันล้าน (+103% จากปีก่อน) เทียบกับที่คาดราว $108–109 พันล้าน กำไรต่อหุ้นปรับปรุง $2.68 เทียบกับคาดราว $2.48 และคาดการณ์รายได้ไตรมาส 4 ที่ $130 พันล้าน ±3% สูงกว่าที่คาดราว $125 พันล้าน โดยไม่รวมยอดขายศูนย์ข้อมูลในจีน หุ้นขึ้นในการซื้อขายหลังตลาดปิด แม้บอร์ดยืนยันว่าจะไม่ให้ Jensen Huang กลับมา ตลาดบอนด์นิ่ง: บอนด์ 10 ปีลดลงสู่ราว 5.10% บอนด์ 2 ปีราว 4.80% และบอนด์ 30 ปีราว 5.46% แม้ประธานเฟดสาขาเซนต์หลุยส์ Musalem บอกว่าอาจต้องขึ้นดอกเบี้ยอีกหลายครั้ง Brent ลดลงสู่ราว $91.8 และทองคำทรงตัวราว $3,855 ตลาดอื่นหนัก: Stoxx 600 ของยุโรปแย่ที่สุดในรอบ 8 เดือน (−1.75%) และ DAX ลดลง 1.97% สู่ราว 26,076 Nikkei ลดลง 1.34% สู่ 58,860.43 Kospi เกาหลีลดลง 2.6% ต่ำสุดในรอบ 6 เดือน และ Hang Seng ราว 1% SET ลดลง 1.66% สู่ 1,474.68 จากรายงานว่ากฎคุมการส่งออกชิปใหม่ของสหรัฐฯ จะครอบคลุมศูนย์ข้อมูลในไทยและประเทศอาเซียนอื่น ถัดไป: บันทึกการประชุมเฟดวันพุธ และ Anthropic เข้าตลาด Nasdaq ที่คาดว่าจะเป็นวันพฤหัสฯ ที่ 19 พ.ย.`},

    dbNext:{en:"Watch whether Nvidia's after-hours gain holds into Wednesday's US open and lifts Asian chip stocks, the Fed minutes on Wed 18 Nov for hike signals, Anthropic's Nasdaq debut (expected Thu 19 Nov), and the final text of the US chip-export rule covering Thailand.", th:"จับตาว่าหุ้น Nvidia ที่ขึ้นหลังตลาดปิดจะยืนได้ถึงตลาดสหรัฐฯ เปิดวันพุธ และช่วยหุ้นชิปเอเชียหรือไม่ บันทึกการประชุมเฟดวันพุธที่ 18 พ.ย. ว่ามีสัญญาณขึ้นดอกเบี้ยหรือไม่ การเข้าตลาด Nasdaq ของ Anthropic (คาดวันพฤหัสฯ ที่ 19 พ.ย.) และรายละเอียดสุดท้ายของกฎคุมส่งออกชิปของสหรัฐฯ ที่ครอบคลุมไทย"},

    leadtxt:{en:`<b>The selloff kept going through Tuesday's session, but Nvidia's results after the close are the first real good news in a week.</b> During the day, <b>software stocks led a broad drop</b>: the <b>Dow fell 849 points (−1.64%)</b>, the <b>S&P 500 1.03% to a five-month low</b> and the <b>Nasdaq 0.74%</b>, its fourth loss in a row. After the bell, <b>Nvidia beat clearly — revenue about $115.8bn (+103%), Q4 guidance $130bn vs ~$125bn expected — and the shares rose after hours</b>, even with no China sales assumed and Huang confirmed out. Rates were calm: the <b>10-year eased to about 5.10%</b>, but a Fed official said <b>several more hikes may be needed</b>. Outside the US it was a hard day: <b>Europe's worst day in eight months</b>, <b>Kospi −2.6%</b>, <b>Nikkei −1.3%</b>, and <b>the SET −1.66% to 1,474.68</b> on reports that new US chip-export rules will include Thailand. <b>For clients: Nvidia removes the biggest near-term risk, but do not chase — wait to see whether the rebound holds through Wednesday and the Fed minutes. Add to diversified tech gradually, keep new bond money in short-duration funds yielding near 4.8%, and keep gold as a small hedge only.</b>`, th:`<b>การเทขายยังต่อเนื่องตลอดวันอังคาร แต่งบ Nvidia หลังตลาดปิดคือข่าวดีจริงครั้งแรกในรอบสัปดาห์</b> ระหว่างวัน <b>หุ้นซอฟต์แวร์นำการลดลงทั้งตลาด</b>: <b>Dow ลดลง 849 จุด (−1.64%)</b> <b>S&P 500 ลดลง 1.03% ต่ำสุดในรอบ 5 เดือน</b> และ <b>Nasdaq ลดลง 0.74%</b> เป็นวันที่ 4 ติด หลังตลาดปิด <b>Nvidia ประกาศงบดีชัดเจน — รายได้ราว $115.8 พันล้าน (+103%) คาดการณ์ไตรมาส 4 ที่ $130 พันล้าน เทียบกับที่คาดราว $125 พันล้าน — และหุ้นขึ้นหลังตลาดปิด</b> แม้ไม่รวมยอดขายในจีนและยืนยันว่า Huang จะไม่กลับมา ดอกเบี้ยนิ่ง: <b>บอนด์ 10 ปีลดลงสู่ราว 5.10%</b> แต่เจ้าหน้าที่เฟดบอกว่า<b>อาจต้องขึ้นดอกเบี้ยอีกหลายครั้ง</b> นอกสหรัฐฯ หนัก: <b>ยุโรปแย่ที่สุดในรอบ 8 เดือน</b> <b>Kospi −2.6%</b> <b>Nikkei −1.3%</b> และ <b>SET −1.66% สู่ 1,474.68</b> จากรายงานว่ากฎคุมส่งออกชิปใหม่ของสหรัฐฯ จะรวมไทยด้วย <b>สำหรับลูกค้า: งบ Nvidia ช่วยปลดความเสี่ยงใหญ่ที่สุดระยะสั้น แต่อย่าไล่ซื้อ — รอดูว่าการฟื้นตัวจะยืนได้ผ่านวันพุธและบันทึกการประชุมเฟดหรือไม่ ทยอยเพิ่มหุ้นเทคแบบกระจายความเสี่ยง วางเงินลงทุนใหม่ในกองทุนตราสารหนี้อายุสั้นที่ให้ราว 4.8% และถือทองคำเป็นสัดส่วนเล็กเพื่อป้องกันความเสี่ยงเท่านั้น</b>`},

    watchnote:{en:`Tuesday's session was weak again — the Dow fell 849 points, the S&P 500 1.03% to a five-month low and the Nasdaq 0.74% — but Nvidia's after-hours beat (revenue ~$115.8bn, Q4 guide $130bn) lifted its shares late. Europe had its worst day in eight months and the SET fell 1.66% on US chip-export rules reaching Thailand. The three things that matter most now: whether Nvidia's rebound holds on Wednesday, the Fed minutes for hike signals, and Anthropic's Nasdaq debut on 19 Nov as a test of AI appetite.`,
      th:`การซื้อขายวันอังคารยังอ่อนแอ — Dow ลดลง 849 จุด S&P 500 ลดลง 1.03% ต่ำสุดในรอบ 5 เดือน และ Nasdaq ลดลง 0.74% — แต่งบ Nvidia ที่ดีเกินคาดหลังตลาดปิด (รายได้ราว $115.8 พันล้าน คาดการณ์ไตรมาส 4 ที่ $130 พันล้าน) ดันหุ้นขึ้นช่วงท้าย ยุโรปแย่ที่สุดในรอบ 8 เดือน และ SET ลดลง 1.66% จากกฎคุมส่งออกชิปของสหรัฐฯ ที่ครอบคลุมไทย 3 เรื่องสำคัญที่สุดตอนนี้: หุ้น Nvidia จะยืนได้ในวันพุธหรือไม่ บันทึกการประชุมเฟดว่ามีสัญญาณขึ้นดอกเบี้ยหรือไม่ และ Anthropic เข้าตลาด Nasdaq วันที่ 19 พ.ย. ซึ่งเป็นบททดสอบความต้องการหุ้น AI`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป ญี่ปุ่น ฮ่องกง และไทย วันอังคารที่ 17 พ.ย. ตัวเลขของ Nvidia มาจากการประกาศงบหลังตลาดปิด ผลตอบแทนบอนด์สหรัฐฯ น้ำมัน ทองคำ และราคาปิด DAX และ Hang Seng เป็นค่าประมาณ (แต่ละแหล่งต่างกันเล็กน้อย) และยังไม่มีราคาปิดเซี่ยงไฮ้ที่ยืนยันได้ ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>US stocks fell again Tuesday: the S&P 500 lost 1.03% to 7,340.53 (a five-month low), the Dow 1.64% (−848.75 pts) to 50,759.42 and the Nasdaq 0.74% to 24,328.38, its fourth straight loss.</b> After the close, Nvidia beat estimates and guided above forecasts, and its shares rose after hours.`, th:`<b>หุ้นสหรัฐฯ ลดลงอีกวันอังคาร: S&P 500 ลดลง 1.03% สู่ 7,340.53 (ต่ำสุดในรอบ 5 เดือน) Dow ลดลง 1.64% (−848.75 จุด) สู่ 50,759.42 และ Nasdaq ลดลง 0.74% สู่ 24,328.38 ลดลงเป็นวันที่ 4 ติด</b> หลังตลาดปิด Nvidia ประกาศงบดีกว่าคาดและให้คาดการณ์สูงกว่าที่ตลาดคาด หุ้นขึ้นหลังตลาดปิด`},
      why:{en:`The day's selling moved from chips to software (Salesforce, Intuit, ServiceNow) and financials, and the Dow fell hardest — a sign of broad de-risking driven by high yields and hike talk, not just AI. Nvidia's beat answers the biggest AI question: demand is still growing fast (Q4 guide $130bn) even without China. If Wednesday's session confirms the after-hours bounce, the Nasdaq's correction may find a floor; if it fades, the problem is rates, not AI demand.`, th:`แรงขายระหว่างวันย้ายจากหุ้นชิปไปหุ้นซอฟต์แวร์ (Salesforce, Intuit, ServiceNow) และหุ้นการเงิน และ Dow ลดลงมากที่สุด — สัญญาณว่านักลงทุนลดความเสี่ยงทั้งตลาดเพราะผลตอบแทนบอนด์สูงและการพูดถึงการขึ้นดอกเบี้ย ไม่ใช่แค่เรื่อง AI งบ Nvidia ตอบคำถามใหญ่ที่สุดของ AI ได้: ความต้องการยังโตเร็ว (คาดการณ์ไตรมาส 4 ที่ $130 พันล้าน) แม้ไม่มีจีน หากตลาดวันพุธยืนยันการเด้งหลังตลาดปิด การปรับฐานของ Nasdaq อาจหาจุดต่ำสุดได้ แต่ถ้าแรงซื้อหายไป ปัญหาคือดอกเบี้ย ไม่ใช่ความต้องการ AI`},
      full:{en:`US stocks closed lower on Tuesday, November 17. The S&P 500 fell 1.03% to 7,340.53, a five-month low; the Dow Jones Industrial Average dropped 848.75 points (−1.64%) to 50,759.42; and the Nasdaq Composite slipped 0.74% to 24,328.38, its fourth consecutive decline. Software names including Salesforce, Intuit and ServiceNow were among the biggest losers, financials lagged and energy held up best, while investors trimmed semiconductor positions before Nvidia's report. After the close, Nvidia — reporting for the first time under interim CEO Colette Kress — posted fiscal Q3 revenue of about $115.8 billion, up 103% from a year earlier, against guidance of about $108 billion, and adjusted EPS of $2.68 against roughly $2.48 expected. It guided Q4 revenue to $130 billion ±3%, above the ~$125 billion consensus, with lower gross margins, an extra week in the quarter and no China data-centre compute sales assumed. The board said it will not reinstate Jensen Huang as CEO. The shares rose in after-hours trading.`, th:`หุ้นสหรัฐฯ ปิดลดลงวันอังคารที่ 17 พ.ย. S&P 500 ลดลง 1.03% สู่ 7,340.53 ต่ำสุดในรอบ 5 เดือน Dow ลดลง 848.75 จุด (−1.64%) สู่ 50,759.42 และ Nasdaq ลดลง 0.74% สู่ 24,328.38 ลดลงเป็นวันที่ 4 ติด หุ้นซอฟต์แวร์อย่าง Salesforce, Intuit และ ServiceNow ลดลงมากที่สุด หุ้นการเงินอ่อนแอที่สุด ส่วนหุ้นพลังงานยืนได้ดีที่สุด และนักลงทุนลดหุ้นเซมิคอนดักเตอร์ก่อนงบ Nvidia หลังตลาดปิด Nvidia ซึ่งประกาศงบครั้งแรกภายใต้ซีอีโอรักษาการ Colette Kress รายงานรายได้ไตรมาส 3 ราว $115.8 พันล้าน เพิ่มขึ้น 103% จากปีก่อน เทียบกับที่บริษัทคาดราว $108 พันล้าน และกำไรต่อหุ้นปรับปรุง $2.68 เทียบกับที่คาดราว $2.48 บริษัทคาดรายได้ไตรมาส 4 ที่ $130 พันล้าน ±3% สูงกว่าที่ตลาดคาดราว $125 พันล้าน โดยอัตรากำไรขั้นต้นต่ำลง ไตรมาสมีสัปดาห์เพิ่ม 1 สัปดาห์ และไม่รวมยอดขายศูนย์ข้อมูลในจีน บอร์ดระบุว่าจะไม่แต่งตั้ง Jensen Huang กลับเป็นซีอีโอ หุ้นขึ้นในการซื้อขายหลังตลาดปิด`},
      sources:[{l:"Yahoo Finance — Nvidia earnings live: Q3 beat as revenue rose 103% to $115.8B; board says it will not reinstate Huang",u:"https://finance.yahoo.com/technology/live/nvidia-earnings-live-nvidia-posts-q3-beat-board-says-it-will-not-reinstate-jensen-huang-as-ceo-221428433.html"},{l:"TechCrunch — Nvidia promises that revenue will keep soaring — for now",u:"https://techcrunch.com/2026/11/17/nvidia-promises-that-revenue-will-keep-soaring-for-now/"},{l:"investingLive — Nvidia tops forecasts by $7 billion as Kress steers first report since Huang exit",u:"https://investinglive.com/stocks/nvidia-price-up-tops-forecasts-by-7-billion-as-kress-steers-first-report-since-huang-exit/"},{l:"TradingKey — Nasdaq drops 0.74%, Dow falls over 800 points as chip stocks sell off",u:"https://tradingkey.com/analysis/stocks/us-stocks/262309739-chip-stocks-fall-ahead-of-nvidia-earnings-nasdaq-hits-seven-month-low-tradingkey"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"≈26,076", chg:-1.97, series:[26598.64,26075.73],
      txt:{en:`<b>Germany's DAX fell 1.97% to about 26,076 Tuesday</b> and the Stoxx 600 lost 1.75% to 650.72 — its worst day in eight months — as tech fell nearly 4% and Deutsche Bank about 6%.`, th:`<b>ดัชนี DAX เยอรมนีลดลง 1.97% สู่ราว 26,076 วันอังคาร</b> และ Stoxx 600 ลดลง 1.75% สู่ 650.72 — แย่ที่สุดในรอบ 8 เดือน — โดยหุ้นเทคลดลงเกือบ 4% และ Deutsche Bank ราว 6%`},
      why:{en:`Europe's cushion ran out: with few AI stocks it had held up, but Tuesday's selling hit SAP, banks and industrials too, showing investors were cutting risk across the board before Nvidia. The DAX is now about 2.5–3% below last week's record. A good Nvidia reaction should help Europe on Wednesday, but higher-for-longer rates remain a drag on its banks and growth names.`, th:`แรงรองรับของยุโรปหมดลง: เดิมยุโรปยืนได้เพราะมีหุ้น AI น้อย แต่การเทขายวันอังคารกระทบ SAP หุ้นธนาคาร และหุ้นอุตสาหกรรมด้วย แสดงว่านักลงทุนลดความเสี่ยงทั้งตลาดก่อนงบ Nvidia ตอนนี้ DAX ต่ำกว่าระดับสูงสุดเมื่อสัปดาห์ก่อนราว 2.5–3% หากตลาดตอบรับงบ Nvidia ดี น่าจะช่วยยุโรปในวันพุธ แต่ดอกเบี้ยที่สูงนานยังกดดันหุ้นธนาคารและหุ้นเติบโต`},
      full:{en:`Germany's DAX closed about 1.97% lower on Tuesday, November 17, at roughly 26,076 (one report gives 26,075.73, down 522.91 points; another 26,045.37, −2.08%). The pan-European Stoxx 600 fell 1.75% to 650.72, its biggest one-day drop since March 20 and about 2.5% below last week's record high, according to Reuters. The tech sector fell nearly 4% before Nvidia's results and Deutsche Bank slid about 6%. France's CAC 40 lost 1.62% and Britain's FTSE 100 1.8%. The DAX figure is approximate until an official Xetra close is confirmed.`, th:`ดัชนี DAX เยอรมนีปิดวันอังคารที่ 17 พ.ย. ลดลงราว 1.97% ที่ประมาณ 26,076 (รายงานหนึ่งระบุ 26,075.73 ลดลง 522.91 จุด อีกรายงานระบุ 26,045.37 −2.08%) ดัชนี Stoxx 600 ของยุโรปลดลง 1.75% สู่ 650.72 ลดลงมากที่สุดในวันเดียวตั้งแต่ 20 มี.ค. และต่ำกว่าสถิติสูงสุดเมื่อสัปดาห์ก่อนราว 2.5% ตามรายงานของ Reuters กลุ่มเทคลดลงเกือบ 4% ก่อนงบ Nvidia และ Deutsche Bank ลดลงราว 6% CAC 40 ของฝรั่งเศสลดลง 1.62% และ FTSE 100 ของอังกฤษ 1.8% ตัวเลข DAX เป็นค่าประมาณจนกว่าจะยืนยันราคาปิดทางการของ Xetra`},
      sources:[{l:"MarketScreener (Reuters) — European stocks mark worst day in eight months on AI jitters, Deutsche Bank slides",u:"https://www.marketscreener.com/news/european-stocks-mark-worst-day-in-eight-months-on-ai-jitters-deutsche-bank-slides-ce785edcdd8df723"},{l:"Investing.com — Germany stocks lower at close of trade; DAX down 1.97%",u:"https://investing.com/news/stock-market-news/germany-stocks-lower-at-close-of-trade-dax-down-197-5033652"},{l:"Trading Economics — Germany stock market",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"58,860.43", chg:-1.34, series:[59662.02,58860.43],
      txt:{en:`<b>Tokyo's Nikkei 225 fell 1.34% to 58,860.43 Tuesday</b> as chip and AI names kept sliding before Nvidia (Advantest −4.4%, SoftBank −3.9%). Korea's Kospi lost 2.6% to a six-month low and Taiwan about 2.3%.`, th:`<b>ดัชนี Nikkei 225 ญี่ปุ่นลดลง 1.34% สู่ 58,860.43 วันอังคาร</b> เพราะหุ้นชิปและ AI ยังถูกขายก่อนงบ Nvidia (Advantest −4.4%, SoftBank −3.9%) Kospi เกาหลีลดลง 2.6% ต่ำสุดในรอบ 6 เดือน และไต้หวันราว 2.3%`},
      why:{en:`Asia traded before Nvidia's numbers, so it took the full pre-results selloff and none of the relief. That makes chip-heavy Japan, Korea and Taiwan the markets most likely to bounce on Wednesday if Nvidia's after-hours gain holds — they are its suppliers. Japan still carries the extra weight of last week's Q3 GDP contraction.`, th:`ตลาดเอเชียซื้อขายก่อนงบ Nvidia จึงรับแรงขายก่อนงบเต็ม ๆ แต่ยังไม่ได้รับผลบวก ทำให้ญี่ปุ่น เกาหลี และไต้หวันที่มีหุ้นชิปมาก น่าจะเป็นตลาดที่เด้งได้มากที่สุดในวันพุธ หากหุ้น Nvidia ยืนได้ — เพราะเป็นซัพพลายเออร์ ญี่ปุ่นยังมีภาระเพิ่มจาก GDP ไตรมาส 3 ที่หดตัว`},
      full:{en:`The Nikkei 225 closed at 58,860.43 on Tuesday, November 17, down 1.34% from Monday's 59,662.02, according to the AP (other reports show about −1.18%). SoftBank Group fell 3.9% and Advantest 4.4%. South Korea's Kospi dropped 2.6% to 4,968.48, its lowest level in six months, and Taiwan's Taiex fell about 2.3% to 40,092.11. Markets traded ahead of Nvidia's results and amid reports of tighter US chip-export curbs.`, th:`Nikkei 225 ปิดที่ 58,860.43 วันอังคารที่ 17 พ.ย. ลดลง 1.34% จาก 59,662.02 ของวันจันทร์ ตามรายงานของ AP (บางรายงานแสดงราว −1.18%) SoftBank Group ลดลง 3.9% และ Advantest 4.4% Kospi เกาหลีใต้ลดลง 2.6% สู่ 4,968.48 ต่ำสุดในรอบ 6 เดือน และ Taiex ไต้หวันลดลงราว 2.3% สู่ 40,092.11 ตลาดซื้อขายก่อนงบ Nvidia และท่ามกลางรายงานว่าสหรัฐฯ จะคุมการส่งออกชิปเข้มขึ้น`},
      sources:[{l:"FXStreet — Asian stocks slide as US tech curbs weigh on sentiment, Nvidia earnings awaited",u:"https://www.fxstreet.com/news/asian-stocks-slide-as-us-tech-curbs-weigh-on-sentiment-nvidia-earnings-awaited-202611170501"},{l:"Baystreet — Asia tanks again, weighed by Kospi",u:"https://www.baystreet.ca/foreignmarketwrap/5066/Asia-Tanks-Again-Weighed-by-Kospi"},{l:"Nikkei Indexes — Nikkei 225 historical data",u:"https://indexes.nikkei.co.jp/en/nkave/archives/data"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"≈23,509", chg:-1.05, series:[23759.37,23509.17],
      txt:{en:`<b>Hong Kong's Hang Seng fell about 1% to roughly 23,509 Tuesday,</b> giving back Monday's gain, while mainland Chinese shares slid toward their lows of the year ahead of high-stakes trade talks.`, th:`<b>ดัชนี Hang Seng ฮ่องกงลดลงราว 1% สู่ประมาณ 23,509 วันอังคาร</b> คืนกำไรของวันจันทร์ ขณะที่หุ้นจีนแผ่นดินใหญ่ลดลงเข้าใกล้ระดับต่ำสุดของปี ก่อนการเจรจาการค้าที่มีเดิมพันสูง`},
      why:{en:`Hong Kong could not stay apart from the region's AI selloff, and the mainland is weighed down by weak data and caution before trade talks. The new US chip-export rules are a double-edged sword for China: they cut access to top chips but push Beijing to build its own. A trade-talk headline is now the main swing factor for Chinese stocks, more than Nvidia.`, th:`ฮ่องกงหนีการเทขายหุ้น AI ในภูมิภาคไม่พ้น และตลาดจีนแผ่นดินใหญ่ถูกกดดันจากข้อมูลเศรษฐกิจอ่อนแอและความระมัดระวังก่อนการเจรจาการค้า กฎคุมส่งออกชิปใหม่ของสหรัฐฯ เป็นดาบสองคมสำหรับจีน: ตัดการเข้าถึงชิประดับสูง แต่ผลักให้จีนพัฒนาชิปเอง ข่าวการเจรจาการค้าจึงเป็นปัจจัยหลักของหุ้นจีนตอนนี้ มากกว่า Nvidia`},
      full:{en:`Hong Kong's Hang Seng Index fell about 1% on Tuesday, November 17, to roughly 23,509 (Baystreet reports 23,509.17; FXStreet had it down 0.77% near 23,570 during the session), reversing Monday's 0.52% gain. Mainland Chinese markets slipped toward yearly lows ahead of high-stakes trade talks, according to FXStreet; a confirmed Shanghai Composite close was not available at the time of writing (it closed at 3,602.57 on Monday).`, th:`ดัชนี Hang Seng ฮ่องกงลดลงราว 1% วันอังคารที่ 17 พ.ย. สู่ประมาณ 23,509 (Baystreet รายงาน 23,509.17 ส่วน FXStreet รายงานระหว่างวันว่าลดลง 0.77% ราว 23,570) กลับทิศจากที่ขึ้น 0.52% วันจันทร์ ตลาดจีนแผ่นดินใหญ่ลดลงเข้าใกล้ระดับต่ำสุดของปีก่อนการเจรจาการค้าที่มีเดิมพันสูง ตามรายงานของ FXStreet ยังไม่มีราคาปิด Shanghai Composite ที่ยืนยันได้ขณะเขียน (ปิดวันจันทร์ที่ 3,602.57)`},
      sources:[{l:"Baystreet — Asia tanks again, weighed by Kospi",u:"https://www.baystreet.ca/foreignmarketwrap/5066/Asia-Tanks-Again-Weighed-by-Kospi"},{l:"FXStreet — Asian stocks slide as US tech curbs weigh on sentiment, Nvidia earnings awaited",u:"https://www.fxstreet.com/news/asian-stocks-slide-as-us-tech-curbs-weigh-on-sentiment-nvidia-earnings-awaited-202611170501"},{l:"Trading Economics — China stock market",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,474.68", chg:-1.66, series:[1499.53,1474.68],
      txt:{en:`<b>SET Index fell 1.66% (−24.85 pts) to 1,474.68 Tuesday</b> on heavy turnover of about THB 86.59bn, breaking below the 1,480–1,500 support zone on reports that new US chip-export rules will cover Thailand.`, th:`<b>ดัชนี SET ลดลง 1.66% (−24.85 จุด) สู่ 1,474.68 วันอังคาร</b> มูลค่าซื้อขายสูงราว 86,590 ล้านบาท หลุดแนวรับ 1,480–1,500 จากรายงานว่ากฎคุมส่งออกชิปใหม่ของสหรัฐฯ จะครอบคลุมไทย`},
      why:{en:`This time Thailand was directly in the story: reports say Washington will require licences for Blackwell-class chips going to data centres in Thailand, Malaysia, Singapore and Indonesia, to stop Chinese firms using them remotely. That threatens part of the data-centre investment wave Thailand has been courting. With weak Q3 GDP already in the price, the SET needs Nvidia's bounce to hold and clarity on the final rule to recover 1,500.`, th:`ครั้งนี้ไทยอยู่ในข่าวโดยตรง: รายงานระบุว่าสหรัฐฯ จะกำหนดให้ต้องขอใบอนุญาตส่งออกชิประดับ Blackwell ไปยังศูนย์ข้อมูลในไทย มาเลเซีย สิงคโปร์ และอินโดนีเซีย เพื่อไม่ให้บริษัทจีนใช้งานจากระยะไกล ซึ่งกระทบคลื่นการลงทุนศูนย์ข้อมูลที่ไทยพยายามดึงดูด เมื่อ GDP ไตรมาส 3 ที่อ่อนแอสะท้อนในราคาแล้ว SET ต้องการให้หุ้น Nvidia ยืนได้และความชัดเจนของกฎฉบับสุดท้าย เพื่อกลับไปที่ 1,500`},
      full:{en:`Thailand's SET Index fell 24.85 points (−1.66%) to close at 1,474.68 on Tuesday, November 17, with trading value of about THB 86.59 billion, according to Kaohoon International's market roundup. Kaohoon attributed the decline to investor concerns over new US restrictions on chip exports to ASEAN countries, following weakness in global markets. The index was at 1,475.53 at the morning break on THB 51.46 billion of turnover. Reports from The Information say Thailand, Malaysia, Singapore and Indonesia are among seven countries where data centres will be barred from letting Chinese AI firms remotely access advanced US chips; the final rule had not been published.`, th:`ดัชนี SET ลดลง 24.85 จุด (−1.66%) ปิดที่ 1,474.68 วันอังคารที่ 17 พ.ย. มูลค่าซื้อขายราว 86,590 ล้านบาท ตามรายงานสรุปตลาดของ Kaohoon International ซึ่งระบุว่าการลดลงมาจากความกังวลของนักลงทุนต่อข้อจำกัดใหม่ของสหรัฐฯ ในการส่งออกชิปไปยังประเทศอาเซียน ตามความอ่อนแอของตลาดโลก ช่วงพักเที่ยงดัชนีอยู่ที่ 1,475.53 มูลค่าซื้อขาย 51,460 ล้านบาท รายงานของ The Information ระบุว่าไทย มาเลเซีย สิงคโปร์ และอินโดนีเซีย อยู่ใน 7 ประเทศที่ศูนย์ข้อมูลจะถูกห้ามให้บริษัท AI จีนเข้าถึงชิปขั้นสูงของสหรัฐฯ จากระยะไกล โดยยังไม่มีการประกาศกฎฉบับสุดท้าย`},
      sources:[{l:"Kaohoon International — Market Roundup 17 November 2026",u:"https://www.kaohooninternational.com/markets/594912"},{l:"Kaohoon International — SET Index falls as new US chip export regulations prompt sell-offs",u:"https://www.kaohooninternational.com/markets/594869"},{l:"W.Media — US to restrict Chinese remote access to AI chips from Southeast Asian data centers",u:"https://w.media/?p=45300"}]},
  ];

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
