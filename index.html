<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Nvidia's Jensen Huang Resigns and the 10-Year Breaks Above 5.1% — Wall Street Slips 0.4% as Trump Drops the Iran Deal and Brent Jumps to $95.8", th:"Jensen Huang ลาออกจาก Nvidia และบอนด์ 10 ปีทะลุ 5.1% — วอลล์สตรีทลดลง 0.4% ขณะที่ทรัมป์ไม่เอาข้อตกลงกับอิหร่าน ดัน Brent พุ่งสู่ $95.8"},
    heroDeck:{en:`Thursday turned the rebound back. Nvidia CEO Jensen Huang resigned with immediate effect after reports of an affair with a woman US intelligence suspects was spying for China; CFO Colette Kress is interim CEO. Nvidia fell as much as 14% early but closed about 4.3% lower, and the market recovered most of its opening drop: the S&P 500 lost 0.35% to 7,592.40, the Nasdaq 0.39% to 25,366.09 and the Dow 0.36% to 52,297.09. Bonds reopened after Veterans Day and sold off hard: the 10-year rose about 13bp to roughly 5.1% and the 2-year about 14bp to ~4.88%, with a weak 30-year auction adding pressure. Trump said the US no longer needs a deal with Iran ("We've got their Strait"), lifting Brent 3.3% to $95.82 and WTI 2.6% to $88.74. Gold fell about 2.9% to $3,878, its lowest close since October 2025, as yields and the dollar rose and December Fed hike bets firmed.`, th:`วันพฤหัสฯ การฟื้นตัวสะดุดลง Jensen Huang ซีอีโอของ Nvidia ลาออกทันที หลังมีรายงานว่ามีความสัมพันธ์กับผู้หญิงที่หน่วยข่าวกรองสหรัฐฯ สงสัยว่าเป็นสายลับให้จีน โดย Colette Kress ซีเอฟโอ รักษาการซีอีโอ หุ้น Nvidia ร่วงสูงสุด 14% ช่วงเปิดตลาด แต่ปิดลดลงราว 4.3% และตลาดฟื้นกลับได้เกือบหมด: S&P 500 ลดลง 0.35% สู่ 7,592.40, Nasdaq ลดลง 0.39% สู่ 25,366.09 และ Dow ลดลง 0.36% สู่ 52,297.09 ตลาดบอนด์เปิดหลังวันทหารผ่านศึกและถูกขายหนัก: ผลตอบแทนบอนด์ 10 ปีขึ้นราว 0.13% สู่ประมาณ 5.1% และบอนด์ 2 ปีขึ้นราว 0.14% สู่ราว 4.88% โดยการประมูลบอนด์ 30 ปีที่อ่อนแอเพิ่มแรงกดดัน ทรัมป์บอกว่าสหรัฐฯ ไม่จำเป็นต้องมีข้อตกลงกับอิหร่านแล้ว ("เราคุมช่องแคบของพวกเขาไว้แล้ว") ดัน Brent ขึ้น 3.3% สู่ $95.82 และ WTI ขึ้น 2.6% สู่ $88.74 ทองคำร่วงราว 2.9% สู่ $3,878 ระดับปิดต่ำสุดตั้งแต่ ต.ค. 2025 จากผลตอบแทนบอนด์และดอลลาร์ที่ขึ้น และโอกาสที่เฟดจะขึ้นดอกเบี้ยในเดือนธันวาคมที่สูงขึ้น`},

    leadtxt:{en:`<b>The rate scare is back, and AI lost its figurehead.</b> When bonds reopened Thursday they finally priced the hot CPI: the <b>10-year jumped to about 5.1%</b> and the 2-year to ~4.88%, and a December Fed hike looks firmer. On top of that, <b>Nvidia CEO Jensen Huang resigned</b> over a personal-conduct and security scandal; Nvidia closed −4.3% after a −14% open, and the S&P 500 slipped 0.35% to 7,592.40. <b>Oil is rising again</b> — Trump said the US no longer needs an Iran deal, sending Brent up 3.3% to $95.82 — while <b>gold fell ~2.9% to $3,878</b> as real yields climbed. Asia was weaker (Hang Seng −1.26%) and the SET slipped 0.20% to 1,499. <b>For clients: stay defensive — favour short-duration bonds now yielding near 4.9%, avoid adding long-duration bonds or concentrated AI single-stocks before Nvidia's 17 Nov results, and treat gold as a hedge, not a trade, while yields are above 5%.</b>`, th:`<b>ความกังวลเรื่องดอกเบี้ยกลับมา และธีม AI เสียผู้นำคนสำคัญ</b> เมื่อตลาดบอนด์เปิดวันพฤหัสฯ ก็ตอบรับ CPI ที่ร้อนแรงในที่สุด: <b>บอนด์ 10 ปีพุ่งสู่ราว 5.1%</b> และ 2 ปีสู่ราว 4.88% และโอกาสที่เฟดจะขึ้นดอกเบี้ยในเดือนธันวาคมสูงขึ้น นอกจากนี้ <b>Jensen Huang ซีอีโอ Nvidia ลาออก</b> จากเรื่องอื้อฉาวด้านความประพฤติส่วนตัวและความมั่นคง หุ้น Nvidia ปิด −4.3% หลังเปิด −14% และ S&P 500 ลดลง 0.35% สู่ 7,592.40 <b>น้ำมันกลับมาขึ้นอีก</b> — ทรัมป์บอกว่าสหรัฐฯ ไม่จำเป็นต้องมีข้อตกลงกับอิหร่าน ดัน Brent ขึ้น 3.3% สู่ $95.82 — ขณะที่<b>ทองคำร่วงราว 2.9% สู่ $3,878</b> จากผลตอบแทนที่แท้จริงที่สูงขึ้น ตลาดเอเชียอ่อนตัว (Hang Seng −1.26%) และ SET ลดลง 0.20% สู่ 1,499 <b>สำหรับลูกค้า: ตั้งรับไว้ก่อน — เน้นตราสารหนี้อายุสั้นที่ตอนนี้ให้ผลตอบแทนราว 4.9% อย่าเพิ่มบอนด์อายุยาวหรือหุ้น AI รายตัวแบบกระจุกตัวก่อนงบ Nvidia วันที่ 17 พ.ย. และถือทองคำไว้เป็นเครื่องมือป้องกันความเสี่ยง ไม่ใช่เพื่อเก็งกำไร ขณะที่ผลตอบแทนบอนด์ยังเกิน 5%</b>`},

    watchnote:{en:`Bonds reopened Thursday and repriced the hot October CPI: the 10-year rose to about 5.1% and the 2-year to ~4.88%, with a weak 30-year auction. Nvidia CEO Jensen Huang resigned (Nvidia −4.3%), and the S&P 500 slipped 0.35%. Trump said the US no longer needs an Iran deal, lifting Brent 3.3% to $95.82, while gold fell ~2.9% to $3,878. The three things that matter most: whether the 10-year holds above 5% as December hike bets firm, Nvidia's Q3 results on 17 Nov under interim CEO Colette Kress, and whether the Iran standoff pushes oil toward $100.`,
      th:`ตลาดบอนด์เปิดวันพฤหัสฯ และตอบรับ CPI เดือน ต.ค. ที่ร้อนแรง: บอนด์ 10 ปีขึ้นสู่ราว 5.1% และ 2 ปีสู่ราว 4.88% พร้อมการประมูลบอนด์ 30 ปีที่อ่อนแอ Jensen Huang ซีอีโอ Nvidia ลาออก (Nvidia −4.3%) และ S&P 500 ลดลง 0.35% ทรัมป์บอกว่าสหรัฐฯ ไม่จำเป็นต้องมีข้อตกลงกับอิหร่าน ดัน Brent ขึ้น 3.3% สู่ $95.82 ขณะที่ทองคำร่วงราว 2.9% สู่ $3,878 3 เรื่องสำคัญที่สุด: บอนด์ 10 ปีจะยืนเหนือ 5% หรือไม่ ขณะที่โอกาสเฟดขึ้นดอกเบี้ยในเดือนธันวาคมสูงขึ้น, งบไตรมาส 3 ของ Nvidia วันที่ 17 พ.ย. ภายใต้ซีอีโอรักษาการ Colette Kress และความขัดแย้งกับอิหร่านจะดันน้ำมันเข้าใกล้ $100 หรือไม่`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,592.40", chg:-0.35, series:[7619.38,7592.40],
      txt:{en:`<b>US stocks slipped Thursday after Nvidia CEO Jensen Huang resigned and Treasury yields jumped: the S&P 500 fell 0.35% (−26.98 pts) to 7,592.40, the Nasdaq Composite 0.39% to 25,366.09 and the Dow 0.36% (−189.40 pts) to 52,297.09.</b> Nvidia fell as much as 14% early but closed about 4.3% lower; AMD and Broadcom rallied.`, th:`<b>หุ้นสหรัฐฯ ลดลงวันพฤหัสฯ หลัง Jensen Huang ซีอีโอ Nvidia ลาออก และผลตอบแทนบอนด์พุ่ง: S&P 500 ลดลง 0.35% (−26.98 จุด) สู่ 7,592.40, Nasdaq ลดลง 0.39% สู่ 25,366.09 และ Dow ลดลง 0.36% (−189.40 จุด) สู่ 52,297.09</b> หุ้น Nvidia ร่วงสูงสุด 14% ช่วงเช้า แต่ปิดลดลงราว 4.3% ส่วน AMD และ Broadcom บวกแรง`},
      why:{en:`The market absorbed a genuine shock well — the S&P 500 erased an early drop of nearly 1% — which says investors see Nvidia's business as intact even without its founder. The bigger problem is rates: the 10-year above 5% makes expensive growth stocks harder to justify. Nvidia's Q3 results on 17 Nov, now under an interim CEO, are the next big test for the AI trade.`, th:`ตลาดรับมือกับข่าวช็อกได้ดี — S&P 500 ลบการลดลงเกือบ 1% ช่วงเช้าได้เกือบหมด — แสดงว่านักลงทุนมองว่าธุรกิจของ Nvidia ยังแข็งแรงแม้ไม่มีผู้ก่อตั้ง ปัญหาที่ใหญ่กว่าคือดอกเบี้ย: บอนด์ 10 ปีที่เกิน 5% ทำให้หุ้นเติบโตที่ราคาแพงดูน่าสนใจน้อยลง งบไตรมาส 3 ของ Nvidia วันที่ 17 พ.ย. ภายใต้ซีอีโอรักษาการ คือบททดสอบใหญ่ถัดไปของธีม AI`},
      full:{en:`US stocks closed lower Thursday, November 12. The S&P 500 fell 26.98 points (−0.35%) to 7,592.40, the Dow Jones Industrial Average lost 189.40 points (−0.36%) to 52,297.09 and the Nasdaq Composite fell about 0.39% to 25,366.09, after the Nasdaq dropped as much as 1.6% in the opening minutes. Nvidia said Jensen Huang had resigned as president, CEO and director effective immediately; CFO Colette Kress is interim CEO while keeping her CFO role, and Harvey C. Jones became board chair. Media reports linked the exit to an investigation into an affair with a woman US intelligence suspects was spying for China; the company's filing gave no reason. Nvidia shares fell as much as 14% before closing about 4.3% lower, while AMD and Broadcom rallied. Rising Treasury yields after the bond market reopened, a weak 30-year auction and higher oil also weighed. The S&P 500 is up about 10.9% year to date.`, th:`หุ้นสหรัฐฯ ปิดลบวันพฤหัสฯ ที่ 12 พ.ย. S&P 500 ลดลง 26.98 จุด (−0.35%) สู่ 7,592.40, Dow ลดลง 189.40 จุด (−0.36%) สู่ 52,297.09 และ Nasdaq ลดลงราว 0.39% สู่ 25,366.09 หลังจาก Nasdaq ร่วงสูงสุด 1.6% ในช่วงแรกของการซื้อขาย Nvidia แจ้งว่า Jensen Huang ลาออกจากตำแหน่งประธานเจ้าหน้าที่บริหาร ซีอีโอ และกรรมการ มีผลทันที Colette Kress ซีเอฟโอ รักษาการซีอีโอโดยยังคงทำหน้าที่ซีเอฟโอ และ Harvey C. Jones ขึ้นเป็นประธานบอร์ด สื่อรายงานว่าการลาออกเกี่ยวข้องกับการสอบสวนเรื่องความสัมพันธ์กับผู้หญิงที่หน่วยข่าวกรองสหรัฐฯ สงสัยว่าเป็นสายลับให้จีน ส่วนเอกสารของบริษัทไม่ได้ระบุเหตุผล หุ้น Nvidia ร่วงสูงสุด 14% ก่อนปิดลดลงราว 4.3% ขณะที่ AMD และ Broadcom บวกแรง ผลตอบแทนบอนด์ที่พุ่งหลังตลาดบอนด์เปิด การประมูลบอนด์ 30 ปีที่อ่อนแอ และน้ำมันที่ขึ้น ก็กดดันตลาดด้วย S&P 500 ยังบวกราว 10.9% ตั้งแต่ต้นปี`},
      sources:[{l:"Washington Post (AP) — How major US stock indexes fared Thursday 11/12/2026",u:"https://www.washingtonpost.com/business/2026/11/12/wall-street-stocks-dow-nasdaq/8ee92692-dede-11f1-912c-4fbb80d73f7f_story.html"},{l:"CNBC — Stock market news for Nov. 12, 2026",u:"https://www.cnbc.com/2026/11/11/stock-market-today-live-updates.html"},{l:"SEC — Nvidia Form 8-K: CEO transition",u:"https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm"},{l:"NBC News — Nvidia stock falls after Huang resigns",u:"https://www.nbcnews.com/business/markets/nvidia-stock-huang-resigns-rcna608958"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,816.06", chg:0.57, series:[26662.77,26816.06],
      txt:{en:`<b>Germany's DAX rose 0.57% to a fresh record close of 26,816.06 Thursday,</b> and the STOXX 600 also closed at a record, as defensive and insurance names (Munich Re) outweighed a chip selloff after Nvidia's CEO exit. The FTSE 100 gained 0.26% to 10,863.56.`, th:`<b>ดัชนี DAX เยอรมนีขึ้น 0.57% ปิดที่ระดับสูงสุดเป็นประวัติการณ์ครั้งใหม่ 26,816.06 วันพฤหัสฯ</b> และ STOXX 600 ก็ปิดที่ระดับสูงสุดเช่นกัน โดยหุ้นกลุ่มตั้งรับและประกันภัย (Munich Re) ชดเชยแรงขายหุ้นชิปหลังซีอีโอ Nvidia ลาออก FTSE 100 ขึ้น 0.26% สู่ 10,863.56`},
      why:{en:`Europe is acting as the relative safe spot: its index is heavy in insurers, industrials and defensives rather than mega-cap AI, so the Nvidia shock hit only the chip names (ASML, Infineon). A second straight record shows money rotating toward cheaper, less AI-dependent markets — but a 10-year US yield above 5% is still a headwind globally.`, th:`ยุโรปทำหน้าที่เป็นที่หลบภัยเชิงเปรียบเทียบ: ดัชนีมีหุ้นประกันภัย อุตสาหกรรม และหุ้นตั้งรับเป็นหลัก มากกว่าหุ้น AI ขนาดใหญ่ ข่าว Nvidia จึงกระทบแค่หุ้นชิป (ASML, Infineon) การทำสถิติใหม่ 2 วันติดแสดงว่าเงินกำลังหมุนไปหาตลาดที่ราคาถูกกว่าและพึ่ง AI น้อยกว่า — แต่ผลตอบแทนบอนด์สหรัฐฯ 10 ปีที่เกิน 5% ยังเป็นแรงกดดันทั่วโลก`},
      full:{en:`Germany's DAX closed at 26,816.06 on Thursday, November 12, up about 153 points (+0.57%) from Wednesday's record 26,662.77, setting another closing high. The pan-European STOXX 600 also finished at a record. Nvidia's Frankfurt-listed shares fell more than 8% by midday after Jensen Huang's resignation, and European chip stocks including ASML and Infineon traded lower, but gains in Burberry, Munich Re and other defensive names outweighed them. The FTSE 100 rose 0.26% to 10,863.56. Rising US yields capped the advance late in the session.`, th:`ดัชนี DAX เยอรมนีปิดที่ 26,816.06 วันพฤหัสฯ ที่ 12 พ.ย. เพิ่มขึ้นราว 153 จุด (+0.57%) จากระดับสูงสุด 26,662.77 ของวันพุธ ทำสถิติปิดสูงสุดใหม่อีกครั้ง STOXX 600 ก็ปิดที่ระดับสูงสุดเช่นกัน หุ้น Nvidia ที่จดทะเบียนในแฟรงก์เฟิร์ตร่วงมากกว่า 8% ช่วงเที่ยงหลัง Jensen Huang ลาออก และหุ้นชิปยุโรปอย่าง ASML และ Infineon ลดลง แต่การขึ้นของ Burberry, Munich Re และหุ้นตั้งรับอื่น ๆ ชดเชยได้ FTSE 100 ขึ้น 0.26% สู่ 10,863.56 ผลตอบแทนบอนด์สหรัฐฯ ที่สูงขึ้นจำกัดการบวกช่วงท้ายตลาด`},
      sources:[{l:"Investing.com — European shares hit record highs as defensive appeal offsets Nvidia shock",u:"https://www.investing.com/news/stock-market-news/european-shares-hit-record-highs-as-defensive-appeal-offsets-nvidia-shock-5020450"},{l:"MLQ — European stocks close higher as Burberry and Munich Re outweigh a chip selloff",u:"https://mlq.ai/news/european-stocks-close-higher-as-burberry-and-munich-re-outweigh-a-chip-selloff-after-nvidias-ceo-exit/"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"60,819.36", chg:-0.70, series:[61248.59,60819.36],
      txt:{en:`<b>Tokyo's Nikkei 225 fell 0.70% (−429.23 pts) to 60,819.36 Thursday,</b> ending a three-day winning streak as chip stocks fell on the Nvidia leadership news.`, th:`<b>ดัชนี Nikkei 225 ญี่ปุ่นลดลง 0.70% (−429.23 จุด) สู่ 60,819.36 วันพฤหัสฯ</b> ยุติการขึ้น 3 วันติด เนื่องจากหุ้นชิปลดลงจากข่าวผู้บริหาร Nvidia`},
      why:{en:`Japan's rally has leaned heavily on chip and AI-supply-chain names, so it is directly exposed to any wobble in Nvidia. Higher US yields and $95 oil (Japan imports almost all its oil) add pressure. With the Nikkei still above 60,000, a pause after a strong run is not surprising.`, th:`การขึ้นของตลาดญี่ปุ่นพึ่งพาหุ้นชิปและห่วงโซ่อุปทาน AI มาก จึงได้รับผลกระทบโดยตรงเมื่อ Nvidia สั่นคลอน ผลตอบแทนบอนด์สหรัฐฯ ที่สูงขึ้นและน้ำมัน $95 (ญี่ปุ่นนำเข้าน้ำมันเกือบทั้งหมด) เพิ่มแรงกดดัน เมื่อ Nikkei ยังอยู่เหนือ 60,000 การพักตัวหลังขึ้นแรงจึงไม่ใช่เรื่องแปลก`},
      full:{en:`The Nikkei 225 closed at 60,819.36 on Thursday, November 12, down 429.23 points (−0.70%) from Wednesday's 61,248.59, snapping a three-session winning streak. Semiconductor and AI-related shares led the decline as news of Nvidia's leadership upheaval spread through Asian trading.`, th:`Nikkei 225 ปิดที่ 60,819.36 วันพฤหัสฯ ที่ 12 พ.ย. ลดลง 429.23 จุด (−0.70%) จาก 61,248.59 ของวันพุธ ยุติการขึ้น 3 วันติด หุ้นเซมิคอนดักเตอร์และหุ้นที่เกี่ยวกับ AI นำการลดลง ขณะที่ข่าวความวุ่นวายในทีมผู้บริหาร Nvidia แพร่ไปทั่วตลาดเอเชีย`},
      sources:[{l:"CNBC — Stock market news for Nov. 12, 2026",u:"https://www.cnbc.com/2026/11/11/stock-market-today-live-updates.html"},{l:"NordFX — Market Pulse, November 12, 2026",u:"https://nordfx.com/market-news/market-pulse-november-12-2026"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,008.55", chg:-1.26, series:[24315.92,24008.55],
      txt:{en:`<b>Hong Kong's Hang Seng fell 1.26% (−307.37 pts) to 24,008.55 Thursday as Alibaba led a tech retreat, while the Shanghai Composite fell 0.67% to 3,655.80.</b>`, th:`<b>ดัชนี Hang Seng ฮ่องกงลดลง 1.26% (−307.37 จุด) สู่ 24,008.55 วันพฤหัสฯ โดย Alibaba นำหุ้นเทคลดลง ขณะที่ Shanghai Composite ลดลง 0.67% สู่ 3,655.80</b>`},
      why:{en:`Hong Kong fell for a second day and is now testing 24,000. Its dollar peg means a 10-year US yield above 5% tightens local conditions, and HK tech is the most rate-sensitive segment. Mainland China fell less but reacted poorly to the latest central-bank support steps, a sign that policy help is no longer enough on its own to lift sentiment.`, th:`ฮ่องกงลดลงเป็นวันที่ 2 และกำลังทดสอบระดับ 24,000 การผูกค่าเงินกับดอลลาร์ทำให้ผลตอบแทนบอนด์สหรัฐฯ 10 ปีที่เกิน 5% ทำให้สภาพคล่องในฮ่องกงตึงขึ้น และหุ้นเทคฮ่องกงไวต่อดอกเบี้ยที่สุด จีนแผ่นดินใหญ่ลดลงน้อยกว่า แต่ตลาดตอบรับมาตรการสนับสนุนล่าสุดของธนาคารกลางไม่ดี แสดงว่าความช่วยเหลือจากนโยบายเพียงอย่างเดียวไม่พอจะดันความเชื่อมั่นแล้ว`},
      full:{en:`Hong Kong's Hang Seng Index closed at 24,008.55 on Thursday, November 12, down 307.37 points (−1.26%) from Wednesday's 24,315.92, with Alibaba leading a retreat in technology shares amid the Nvidia-driven selloff in Asian tech. In mainland China, the Shanghai Composite fell 0.67% to 3,655.80, with one report linking the decline to a weak reaction to central-bank support measures.`, th:`ดัชนี Hang Seng ฮ่องกงปิดที่ 24,008.55 วันพฤหัสฯ ที่ 12 พ.ย. ลดลง 307.37 จุด (−1.26%) จาก 24,315.92 ของวันพุธ โดย Alibaba นำหุ้นเทคลดลงท่ามกลางแรงขายหุ้นเทคเอเชียจากข่าว Nvidia ส่วนจีนแผ่นดินใหญ่ Shanghai Composite ลดลง 0.67% สู่ 3,655.80 โดยมีรายงานว่าการลดลงเกี่ยวข้องกับการที่ตลาดตอบรับมาตรการสนับสนุนของธนาคารกลางไม่ดี`},
      sources:[{l:"BBN Times — Hang Seng Index drops 1.26% to 24,008.55 as Alibaba leads tech retreat",u:"https://www.bbntimes.com/companies/hong-kong-stock-exchange-hang-seng-index-drops-1-26-to-24-008-55-as-alibaba-leads-tech-retreat"},{l:"Trading Economics — China Shanghai Composite",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,499.06", chg:-0.20, series:[1502.11,1499.06],
      txt:{en:`<b>SET Index slipped 0.20% (−3.05 pts) to 1,499.06 Thursday</b> on turnover of about THB 61.92bn, closing just below 1,500 as regional tech weakness weighed.`, th:`<b>ดัชนี SET ลดลง 0.20% (−3.05 จุด) สู่ 1,499.06 วันพฤหัสฯ</b> มูลค่าซื้อขายราว 61,920 ล้านบาท ปิดต่ำกว่า 1,500 เล็กน้อย จากแรงกดดันของหุ้นเทคในภูมิภาค`},
      why:{en:`The SET barely moved, which is a decent result given the Nvidia shock and Hong Kong's 1.3% fall — Thailand has little AI exposure. But 1,500 is a key level, and higher US yields pull foreign money toward dollar assets. Energy stocks may get support from $95 Brent, while yield-play stocks stay under pressure as global rates rise.`, th:`SET แทบไม่ขยับ ถือว่าดีพอสมควรเมื่อเทียบกับข่าว Nvidia และฮ่องกงที่ลดลง 1.3% — ตลาดไทยมีหุ้น AI น้อย แต่ 1,500 เป็นระดับสำคัญ และผลตอบแทนบอนด์สหรัฐฯ ที่สูงขึ้นดึงเงินต่างชาติไปหาสินทรัพย์ดอลลาร์ หุ้นพลังงานอาจได้แรงหนุนจาก Brent $95 ขณะที่หุ้นปันผลสูงยังถูกกดดันเมื่อดอกเบี้ยโลกสูงขึ้น`},
      full:{en:`Thailand's SET Index fell 3.05 points (−0.20%) to close at 1,499.06 on Thursday, November 12, with turnover of about THB 61.92 billion, according to Kaohoon International's market roundup. The index slipped back below the 1,500 mark after Wednesday's close of 1,502.11. Catalysts to watch include the MSCI index review and the SET/TFEX trading-guideline revision on 16 November.`, th:`ดัชนี SET ลดลง 3.05 จุด (−0.20%) ปิดที่ 1,499.06 วันพฤหัสฯ ที่ 12 พ.ย. มูลค่าซื้อขายราว 61,920 ล้านบาท ตามรายงานสรุปตลาดของ Kaohoon International ดัชนีกลับลงต่ำกว่า 1,500 จุด หลังปิดที่ 1,502.11 เมื่อวันพุธ ปัจจัยที่ต้องจับตาคือการปรับดัชนี MSCI และการปรับเกณฑ์การซื้อขายของ SET/TFEX วันที่ 16 พ.ย.`},
      sources:[{l:"Kaohoon International — Market Roundup 12 November 2026",u:"https://www.kaohooninternational.com/markets/594593"},{l:"Kaohoon International — Thai Stock Market Outlook on 12 November 2026",u:"https://www.kaohooninternational.com/markets/594500"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil jumped Thursday after Trump said the US no longer needs a deal with Iran ("We've got their Strait"): Brent settled 3.3% higher at $95.82/bbl and WTI 2.6% higher at $88.74.</b> Gold fell about 2.9% to $3,878/oz (Comex), its lowest close since October 2025, as yields and the dollar rose.`, th:`<b>น้ำมันพุ่งวันพฤหัสฯ หลังทรัมป์บอกว่าสหรัฐฯ ไม่จำเป็นต้องมีข้อตกลงกับอิหร่านแล้ว ("เราคุมช่องแคบของพวกเขาไว้แล้ว"): Brent ปิดขึ้น 3.3% ที่ $95.82 ต่อบาร์เรล และ WTI ขึ้น 2.6% ที่ $88.74</b> ทองคำร่วงราว 2.9% สู่ $3,878 ต่อออนซ์ (Comex) ระดับปิดต่ำสุดตั้งแต่ ต.ค. 2025 จากผลตอบแทนบอนด์และดอลลาร์ที่ขึ้น`},
     why:{en:`Trump's comments remove the main reason oil had fallen earlier in the week — the hope of a deal. With Hormuz shipping still disrupted, $100 Brent is back in view, which also feeds US inflation and the case for Fed hikes. Gold is caught between geopolitical demand and high real yields; for now yields above 5% are winning, so it is behaving like a rate-sensitive asset, not a haven.`, th:`คำพูดของทรัมป์ทำให้เหตุผลหลักที่น้ำมันลดลงต้นสัปดาห์ — ความหวังเรื่องข้อตกลง — หายไป เมื่อการขนส่งในฮอร์มุซยังติดขัด Brent $100 กลับมาอยู่ในสายตา ซึ่งยังซ้ำเติมเงินเฟ้อสหรัฐฯ และเหตุผลให้เฟดขึ้นดอกเบี้ย ทองคำติดอยู่ระหว่างความต้องการจากภูมิรัฐศาสตร์กับผลตอบแทนที่แท้จริงที่สูง ตอนนี้ผลตอบแทนที่เกิน 5% ชนะ ทองคำจึงเคลื่อนไหวเหมือนสินทรัพย์ที่ไวต่อดอกเบี้ย ไม่ใช่สินทรัพย์ปลอดภัย`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Treasuries reopened after Veterans Day and sold off: the 10-year rose about 13bp to roughly 5.1% and the 2-year about 14bp to ~4.88%.</b> A weak 30-year auction added pressure, and firmer December Fed hike expectations weighed on bonds and gold.`, th:`<b>ตลาดบอนด์สหรัฐฯ เปิดหลังวันทหารผ่านศึกและถูกขาย: บอนด์ 10 ปีขึ้นราว 0.13% สู่ประมาณ 5.1% และบอนด์ 2 ปีขึ้นราว 0.14% สู่ราว 4.88%</b> การประมูลบอนด์ 30 ปีที่อ่อนแอเพิ่มแรงกดดัน และความคาดหวังที่เฟดจะขึ้นดอกเบี้ยในเดือนธันวาคมที่สูงขึ้นกดดันบอนด์และทองคำ`},
     why:{en:`This is the delayed CPI reaction the market was waiting for, and it pushed the 10-year decisively above 5%. Weak demand at the 30-year auction is a warning that investors want more yield to hold long bonds. For clients, short-dated bonds near 4.9% offer high income with much less price risk; long-duration bonds remain exposed while a December hike — possibly 50bp — is on the table.`, th:`นี่คือปฏิกิริยาต่อ CPI ที่ล่าช้าซึ่งตลาดรอคอย และดันบอนด์ 10 ปีทะลุ 5% อย่างชัดเจน ความต้องการที่อ่อนแอในการประมูลบอนด์ 30 ปีเป็นสัญญาณเตือนว่านักลงทุนต้องการผลตอบแทนสูงขึ้นเพื่อถือบอนด์อายุยาว สำหรับลูกค้า ตราสารหนี้อายุสั้นที่ให้ราว 4.9% ให้รายได้สูงโดยมีความเสี่ยงด้านราคาน้อยกว่ามาก ส่วนบอนด์อายุยาวยังเสี่ยง ขณะที่เฟดอาจขึ้นดอกเบี้ยในเดือนธันวาคม — อาจถึง 0.50%`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Democrats won both the House and Senate in the Nov 3 midterms and plan a bill to undo Trump's tariffs, but the White House says it will press ahead: the tariffs now sit under Section 301 of trade law (after the Supreme Court struck down the emergency tariffs), so they don't depend on Congress. Trump's harder line on Iran this week shows foreign policy, not just trade, is now a source of market volatility. Expect tariffs to keep adding to goods prices.`, th:`พรรคเดโมแครตชนะทั้งสภาผู้แทนฯ และวุฒิสภาในการเลือกตั้งกลางเทอมวันที่ 3 พ.ย. และวางแผนเสนอกฎหมายยกเลิกภาษีนำเข้าของทรัมป์ แต่ทำเนียบขาวยืนยันจะเดินหน้าต่อ เพราะภาษีถูกย้ายไปใช้มาตรา 301 ของกฎหมายการค้า (หลังศาลสูงสุดล้มภาษีฉุกเฉิน) จึงไม่ต้องพึ่งรัฐสภา ท่าทีที่แข็งกร้าวขึ้นของทรัมป์ต่ออิหร่านสัปดาห์นี้แสดงว่านโยบายต่างประเทศ ไม่ใช่แค่การค้า กลายเป็นต้นเหตุความผันผวนของตลาด คาดว่าภาษีจะยังดันราคาสินค้าขึ้นต่อไป`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Iran peace hopes faded sharply: Trump said Thursday the US no longer needs a deal with Iran — "We've got their Strait" — after tanker mine strikes in Hormuz earlier in the week. Brent jumped 3.3% to $95.82. Separately, Nvidia's CEO resigned amid reports of an affair with a suspected Chinese spy, adding a US–China security angle to the AI trade.`, th:`ความหวังสันติภาพกับอิหร่านลดลงมาก: ทรัมป์บอกวันพฤหัสฯ ว่าสหรัฐฯ ไม่จำเป็นต้องมีข้อตกลงกับอิหร่านแล้ว — "เราคุมช่องแคบของพวกเขาไว้แล้ว" — หลังเหตุเรือบรรทุกน้ำมันชนทุ่นระเบิดในฮอร์มุซต้นสัปดาห์ Brent พุ่ง 3.3% สู่ $95.82 นอกจากนี้ ซีอีโอ Nvidia ลาออกท่ามกลางรายงานเรื่องความสัมพันธ์กับผู้ต้องสงสัยเป็นสายลับจีน ทำให้ธีม AI มีมิติด้านความมั่นคงสหรัฐฯ–จีนเพิ่มขึ้น`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
