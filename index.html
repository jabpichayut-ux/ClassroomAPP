<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
    <div class="grid g2" id="countrygrid"></div>
    <div class="grid g2" style="margin-top:14px" id="extragrid"></div>
    <div class="rule"></div>
    <div class="sechead"><h2 id="s-themes"></h2></div>
    <div class="grid g4" id="themegrid"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Nvidia’s Blowout Ignites a Global Tech Rally; Markets Brace for Warsh’s First Jackson Hole Test", th:"Nvidia กำไรทะลุคาด จุดพลุแรงซื้อหุ้นเทคทั่วโลก ตลาดจับตาบททดสอบแรกของวอร์ชที่ Jackson Hole"},
    heroDeck:{en:"US stocks jumped Thursday — the S&P 500 +0.72% to 7,730.99, the Nasdaq +1.57% to 26,541.35 — after Nvidia crushed Q2 estimates and guided Q3 revenue above consensus, sending the stock up 8.7% and reigniting the AI trade worldwide. The rally comes as sticky July inflation (PCE +3.7% y/y) has markets now pricing real odds of a September rate hike rather than a cut, putting extra weight on Fed Chair Kevin Warsh’s first Jackson Hole keynote later today.", th:"หุ้นสหรัฐฯ พุ่งขึ้นวันพฤหัสบดี — S&P 500 เพิ่มขึ้น 0.72% สู่ 7,730.99, Nasdaq เพิ่มขึ้น 1.57% สู่ 26,541.35 — หลัง Nvidia รายงานผลประกอบการไตรมาส 2 ทะลุคาดและให้คาดการณ์รายได้ไตรมาส 3 สูงกว่าที่ตลาดคาด ดันหุ้นพุ่งขึ้น 8.7% และจุดกระแสการลงทุนธีม AI ทั่วโลกอีกครั้ง แรงซื้อนี้เกิดขึ้นขณะเงินเฟ้อ PCE เดือน ก.ค. ที่ยังเหนียว (+3.7% เทียบปีก่อน) ทำให้ตลาดเริ่มให้น้ำหนักกับโอกาสที่เฟดจะ “ขึ้น” ดอกเบี้ยในเดือน ก.ย. มากกว่าลด เพิ่มความสำคัญให้กับสุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh ที่จะมีขึ้นภายหลังวันนี้"},

    leadtxt:{en:`<b>Nvidia’s blowout quarter — revenue up 106% to $96.2B, with Q3 guidance of $107–108B beating Wall Street’s $104B consensus — sent the stock up 8.7% and lit a fresh rally across global tech and semiconductor names.</b> The S&P 500 and Nasdaq both climbed to fresh highs, but sticky July PCE inflation (3.7% y/y headline, 3.3% core) has markets now pricing real — if still a minority — odds of a September rate hike rather than a cut. For your clients: today's Jackson Hole keynote from Fed Chair Kevin Warsh, who has signalled he won't offer forward guidance, is the week's biggest swing factor for bond yields — a good reason to <b>lock in today's still-elevated coupons</b> rather than wait for a clarity that may not come, while Nvidia's beat reinforces the case for staying invested in the AI growth theme (UUSTECH).`, th:`<b>Nvidia รายงานผลประกอบการทะลุคาด — รายได้โต 106% สู่ $96.2B และให้คาดการณ์ไตรมาส 3 ที่ $107–108B สูงกว่าที่ตลาดคาดที่ $104B — ดันหุ้นพุ่งขึ้น 8.7% และจุดแรงซื้อหุ้นเทคและเซมิคอนดักเตอร์ทั่วโลกอีกครั้ง</b> ทั้ง S&P 500 และ Nasdaq ต่างปรับขึ้นทำจุดสูงใหม่ แต่เงินเฟ้อ PCE เดือน ก.ค. ที่ยังเหนียว (หัวข้อ +3.7% เทียบปีก่อน, พื้นฐาน +3.3%) ทำให้ตลาดเริ่มให้น้ำหนักกับโอกาส — แม้ยังเป็นส่วนน้อย — ที่เฟดจะ “ขึ้น” ดอกเบี้ยในเดือน ก.ย. แทนที่จะลด สำหรับลูกค้าของคุณ: สุนทรพจน์ Jackson Hole ของประธานเฟด Kevin Warsh วันนี้ ซึ่งส่งสัญญาณว่าจะไม่ให้แนวทางล่วงหน้าชัดเจน คือปัจจัยที่จะขยับผลตอบแทนพันธบัตรมากที่สุดในสัปดาห์นี้ — เหตุผลที่ดีให้ <b>ล็อกคูปองที่ยังสูงอยู่วันนี้</b> มากกว่ารอความชัดเจนที่อาจไม่มาถึง ขณะที่ผลประกอบการ Nvidia ที่ทะลุคาดตอกย้ำเหตุผลให้ยังคงลงทุนในธีมการเติบโต AI (UUSTECH)`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,730.99", chg:0.72, series:[7675.70,7730.99],
      txt:{en:`<b>US stocks rallied Thursday — the S&P 500 +0.72% to 7,730.99, the Nasdaq +1.57% to 26,541.35, the Dow +0.2% to 53,569.44 —</b> after Nvidia crushed Q2 estimates and gave stronger-than-expected guidance, sending the chipmaker up 8.7% and lifting semiconductor and AI-linked names broadly ahead of Fed Chair Kevin Warsh's Friday Jackson Hole keynote.`, th:`<b>หุ้นสหรัฐฯ พุ่งขึ้นวันพฤหัสบดี — S&P 500 เพิ่มขึ้น 0.72% สู่ 7,730.99, Nasdaq เพิ่มขึ้น 1.57% สู่ 26,541.35, Dow เพิ่มขึ้น 0.2% สู่ 53,569.44 —</b> หลัง Nvidia รายงานผลประกอบการไตรมาส 2 ทะลุคาดและให้คาดการณ์ที่ดีกว่าที่ตลาดคาด ดันหุ้นชิปพุ่งขึ้น 8.7% และหนุนหุ้นกลุ่มเซมิคอนดักเตอร์และ AI ในวงกว้าง ก่อนสุนทรพจน์ Jackson Hole ของประธานเฟด Kevin Warsh วันศุกร์`},
      why:{en:`A broad, earnings-driven rally — not a Fed-driven one — is the healthiest kind for clients holding growth exposure, but sticky PCE inflation and a market now pricing real odds of a September hike, not a cut, mean today's Jackson Hole speech, not Thursday's rally, is the real swing factor for where yields go next.`, th:`แรงซื้อที่กระจายตัวและมาจากผลประกอบการ — ไม่ใช่จากเฟด — เป็นรูปแบบที่ดีที่สุดสำหรับลูกค้าที่ถือหุ้นเติบโต แต่เงินเฟ้อ PCE ที่ยังเหนียวและตลาดที่เริ่มให้น้ำหนักโอกาสเฟด “ขึ้น” ดอกเบี้ยเดือน ก.ย. แทนที่จะลด หมายความว่าสุนทรพจน์ Jackson Hole วันนี้ ไม่ใช่แรงซื้อวันพฤหัสฯ คือปัจจัยที่แท้จริงที่จะกำหนดทิศทางผลตอบแทนพันธบัตรต่อจากนี้`},
      full:{en:`US stocks rallied Thursday. The S&P 500 rose 0.72% to close at 7,730.99, the Nasdaq Composite jumped 1.57% to 26,541.35, and the Dow Jones Industrial Average added 0.2% (+105.56pts) to 53,569.44. The rally was powered by Nvidia, which crushed Q2 estimates — revenue of $96.2B (+106% y/y) beat its own $91B guidance, and EPS of $2.22 more than doubled from a year ago — while Q3 guidance of $107-108B topped Wall Street's $104B consensus and management pointed to 70% revenue growth in fiscal 2028. Shares jumped 8.7%, and the rally spread across the chip sector, with Marvell and Micron both rising and semiconductor ETFs up 3%+; Salesforce and CrowdStrike earnings also helped lift software stocks. Meanwhile, the Fed's preferred inflation gauge showed the July PCE price index up 0.2% m/m and 3.7% y/y (above the 3.6% forecast), with core PCE holding at 3.3% y/y for essentially a fourth straight month — reinforcing that inflation progress has stalled. That kept Treasury yields elevated even after Treasury Secretary Scott Bessent's Wednesday move to double bond buybacks briefly pulled long yields lower; the relief proved short-lived, with the 10-year back near 4.65% and the 30-year near 5.16% by Thursday. Markets are now pricing meaningful — if still minority — odds of a Fed rate hike in September rather than a cut, ahead of Fed Chair Kevin Warsh's first Jackson Hole keynote as chair on Friday, where he has signalled he will avoid explicit forward guidance.`, th:`หุ้นสหรัฐฯ พุ่งขึ้นวันพฤหัสบดี ดัชนี S&P 500 เพิ่มขึ้น 0.72% ปิดที่ 7,730.99 ดัชนี Nasdaq Composite เพิ่มขึ้น 1.57% สู่ 26,541.35 และดัชนี Dow Jones เพิ่มขึ้น 0.2% (+105.56 จุด) สู่ 53,569.44 แรงซื้อนี้มาจาก Nvidia ที่รายงานผลประกอบการไตรมาส 2 ทะลุคาด — รายได้ $96.2B (+106% เทียบปีก่อน) สูงกว่าคาดการณ์ของบริษัทเองที่ $91B และ EPS ที่ $2.22 เพิ่มขึ้นกว่าเท่าตัวจากปีก่อน — ขณะคาดการณ์ไตรมาส 3 ที่ $107-108B สูงกว่าที่ตลาดคาดที่ $104B และผู้บริหารชี้ว่ารายได้ปีงบประมาณ 2028 จะโตถึง 70% หุ้นพุ่งขึ้น 8.7% และแรงซื้อลามไปทั่วกลุ่มชิป โดย Marvell และ Micron ต่างปรับขึ้น และกองทุน ETF เซมิคอนดักเตอร์เพิ่มขึ้นกว่า 3% ผลประกอบการ Salesforce และ CrowdStrike ก็ช่วยหนุนหุ้นกลุ่มซอฟต์แวร์เช่นกัน ขณะเดียวกัน มาตรวัดเงินเฟ้อที่เฟดให้น้ำหนักมากที่สุดแสดงดัชนีราคา PCE เดือน ก.ค. เพิ่มขึ้น 0.2% เทียบเดือนก่อนและ 3.7% เทียบปีก่อน (สูงกว่าคาดการณ์ที่ 3.6%) ขณะ PCE พื้นฐานยืนที่ 3.3% เทียบปีก่อน ต่อเนื่องเป็นเดือนที่สี่โดยแทบไม่มีความคืบหน้า ตอกย้ำว่าเงินเฟ้อชะงักงัน สิ่งนี้ทำให้ผลตอบแทนพันธบัตรยังยืนสูง แม้การเข้าซื้อคืนพันธบัตรของ รมว.คลัง Bessent เมื่อวันพุธจะกดผลตอบแทนระยะยาวลงชั่วคราว แต่ผลก็จางหายไปเร็ว โดย 10 ปีกลับมาใกล้ 4.65% และ 30 ปีใกล้ 5.16% ในวันพฤหัสฯ ตลาดตอนนี้เริ่มให้น้ำหนักพอสมควร — แม้ยังเป็นส่วนน้อย — กับโอกาสที่เฟดจะขึ้นดอกเบี้ยเดือน ก.ย. แทนที่จะลด ก่อนสุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh วันศุกร์ ซึ่งเขาส่งสัญญาณว่าจะหลีกเลี่ยงการให้แนวทางล่วงหน้าที่ชัดเจน`},
      sources:[{l:"Yahoo Finance",u:"https://finance.yahoo.com/markets/live/stock-market-today-thursday-august-27-dow-sp-500-nasdaq-082144520.html"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/26/feds-preferred-inflation-gauge-shows-core-prices-rose-3point3percent-annually-in-july.html"},{l:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-27/us-stock-futures-climb-as-nvidia-s-outlook-lifts-tech-sector"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,365", chg:0.30, series:[26286,26365],
      txt:{en:`<b>DAX rose 79 points (+0.3%) to 26,365 Thursday,</b> riding the global tech rally sparked by Nvidia's blockbuster guidance, even as weakness in French shares capped the broader European advance.`, th:`<b>DAX เพิ่มขึ้น 79 จุด (+0.3%) สู่ 26,365 วันพฤหัสบดี</b> ตามแรงซื้อหุ้นเทคทั่วโลกจากคาดการณ์ที่ยอดเยี่ยมของ Nvidia แม้หุ้นฝรั่งเศสที่อ่อนแอจะฉุดตลาดยุโรปในภาพรวมไว้`},
      why:{en:`European equities catching only a modest lift from a blockbuster Nvidia beat — with French weakness offsetting the tech bounce — is a reminder that European exposure still behaves more like a ballast than a pure AI play, useful for clients who want diversification alongside US growth names.`, th:`การที่หุ้นยุโรปได้รับอานิสงส์เพียงเล็กน้อยจากผลประกอบการยอดเยี่ยมของ Nvidia — ขณะหุ้นฝรั่งเศสที่อ่อนแอหักล้างแรงหนุนหุ้นเทค — เป็นเครื่องเตือนใจว่าการลงทุนในยุโรปยังทำหน้าที่เป็นตัวถ่วงสมดุลมากกว่าการเดิมพันธีม AI ล้วน ๆ เหมาะสำหรับลูกค้าที่ต้องการกระจายความเสี่ยงควบคู่กับหุ้นเติบโตสหรัฐฯ`},
      full:{en:`European shares were pulled in different directions Thursday even as a blockbuster outlook from Nvidia spurred a global rally in technology stocks. Germany's DAX added 79 points (+0.3%) to close at 26,365, benefiting from the AI-and-semiconductor bid that followed Nvidia's Q3 guidance beat, though falling French stocks weighed on the broader regional move. Investors are now looking ahead to Friday's Jackson Hole symposium, where Fed Chair Kevin Warsh's first keynote as chair could set the tone for global rates into September.`, th:`หุ้นยุโรปเคลื่อนไหวสวนทางกันวันพฤหัสบดี แม้คาดการณ์ที่ยอดเยี่ยมของ Nvidia จะจุดแรงซื้อหุ้นเทคทั่วโลก ดัชนี DAX เยอรมนีเพิ่มขึ้น 79 จุด (+0.3%) ปิดที่ 26,365 ได้อานิสงส์จากแรงซื้อหุ้นกลุ่ม AI และเซมิคอนดักเตอร์หลังคาดการณ์ไตรมาส 3 ของ Nvidia ทะลุคาด แม้หุ้นฝรั่งเศสที่ปรับลงจะกดดันภาพรวมของภูมิภาค นักลงทุนตอนนี้จับตาไปที่งานสัมมนา Jackson Hole วันศุกร์ ซึ่งสุนทรพจน์ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh อาจกำหนดทิศทางดอกเบี้ยทั่วโลกเข้าสู่เดือน ก.ย.`},
      sources:[{l:"Irish Times",u:"https://www.irishtimes.com/business/markets/2026/08/27/nvidias-outlook-fuels-global-tech-stock-rally/"},{l:"Bloomberg",u:"https://www.bloomberg.com/news/newsletters/2026-08-27/tech-stocks-rally-after-nvidia-s-blockbuster-outlook"},{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"66,131.98", chg:-0.20, series:[66265,66132],
      txt:{en:`<b>Nikkei 225 slipped 0.20% to 66,131.98 Thursday,</b> as an early pop on Nvidia's blowout earnings faded through the session, even as regional AI-linked names — including chipmaker Kioxia, up on a reported ¥1 trillion+ investment plan — stayed firm.`, th:`<b>Nikkei 225 ลดลง 0.20% สู่ 66,131.98 วันพฤหัสบดี</b> หลังแรงซื้อช่วงเช้าจากผลประกอบการทะลุคาดของ Nvidia จางหายไปตลอดวัน แม้หุ้นกลุ่ม AI ในภูมิภาค — รวมถึง Kioxia ผู้ผลิตชิปที่ปรับขึ้นจากแผนลงทุนกว่า 1 ล้านล้านเยนที่มีรายงาน — จะยังยืนแข็งแกร่ง`},
      why:{en:`An early AI-driven pop that faded by the close shows Japanese investors booked some profit into strength rather than chasing the rally — a good moment to remind clients that a single earnings beat, however strong, doesn't remove volatility risk around today's Jackson Hole speech.`, th:`แรงซื้อธีม AI ช่วงเช้าที่จางหายไปตอนปิดตลาด แสดงว่านักลงทุนญี่ปุ่นเลือกขายทำกำไรมากกว่าไล่ราคาตาม — เป็นจังหวะดีที่จะเตือนลูกค้าว่าผลประกอบการที่ดีเพียงตัวเดียว แม้จะแข็งแกร่งเพียงใด ก็ไม่ได้ลบล้างความเสี่ยงความผันผวนรอบสุนทรพจน์ Jackson Hole วันนี้`},
      full:{en:`Asian equities were mixed Thursday as investors digested Nvidia's blowout earnings alongside rate concerns. Japan's Nikkei 225 opened higher on the Nvidia read-through but faded to close down 0.20% at 66,131.98, even as related names such as memory chipmaker Kioxia rose about 4% on a reported ¥1 trillion+ investment in a new production facility. Elsewhere in the region, South Korea's Kospi jumped over 1.5% on chip-sector strength. Investors are now turning to Friday's Jackson Hole symposium and Fed Chair Kevin Warsh's first keynote as chair for the next signal on US rates.`, th:`หุ้นเอเชียเคลื่อนไหวผสมวันพฤหัสบดี ขณะนักลงทุนย่อยข่าวผลประกอบการทะลุคาดของ Nvidia ควบคู่กับความกังวลเรื่องดอกเบี้ย ดัชนี Nikkei 225 ญี่ปุ่นเปิดตลาดปรับขึ้นตามอานิสงส์จาก Nvidia แต่จางหายไปตอนปิด ลดลง 0.20% สู่ 66,131.98 แม้หุ้นที่เกี่ยวข้องอย่าง Kioxia ผู้ผลิตชิปหน่วยความจำจะเพิ่มขึ้นราว 4% จากรายงานแผนลงทุนกว่า 1 ล้านล้านเยนสร้างโรงงานผลิตใหม่ ส่วนอื่นในภูมิภาค ดัชนี Kospi เกาหลีใต้พุ่งขึ้นกว่า 1.5% จากความแข็งแกร่งของกลุ่มชิป นักลงทุนตอนนี้หันไปจับตางานสัมมนา Jackson Hole วันศุกร์ และสุนทรพจน์ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh เพื่อหาสัญญาณถัดไปเรื่องดอกเบี้ยสหรัฐฯ`},
      sources:[{l:"Investing.com",u:"https://www.investing.com/news/stock-market-news/asian-stocks-mixed-as-nvidia-lifts-tech-rate-concerns-keep-gains-in-check-4878307"},{l:"IBTimes",u:"https://www.ibtimes.com.au/nikkei-225-dips-nvidia-ai-impact-1874634"},{l:"Business Recorder",u:"https://www.brecorder.com/news/40436634/asian-stocks-rise-for-third-day-as-nvidia-beats"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,565.74", chg:-0.34, series:[25652,25566],
      txt:{en:`<b>Hang Seng slipped 0.34% to 25,565.74 Thursday,</b> lagging the region, while mainland China's <b>Shanghai Composite jumped 1.13% to 3,956.57</b> as an Nvidia-led AI-hardware rally lifted onshore chip and 5G-related names.`, th:`<b>Hang Seng ลดลง 0.34% สู่ 25,565.74 วันพฤหัสบดี</b> ปรับขึ้นน้อยกว่าภูมิภาค ขณะ <b>Shanghai Composite จีนแผ่นดินใหญ่พุ่งขึ้น 1.13% สู่ 3,956.57</b> หลังแรงซื้อหุ้นฮาร์ดแวร์ AI ที่นำโดย Nvidia หนุนหุ้นกลุ่มชิปและ 5G ในประเทศ`},
      why:{en:`Mainland China outperforming Hong Kong on a domestic AI-hardware rally, even as the broader Hang Seng lags, argues for staying selective within China/HK exposure — onshore tech beneficiaries of the AI trade look different from the index-level HK laggards right now.`, th:`การที่จีนแผ่นดินใหญ่ทำผลงานดีกว่าฮ่องกงจากแรงซื้อหุ้นฮาร์ดแวร์ AI ในประเทศ แม้ Hang Seng โดยรวมจะปรับขึ้นน้อยกว่า สนับสนุนให้เลือกลงทุนแบบเจาะจงในสินทรัพย์จีน/ฮ่องกง — หุ้นเทคในประเทศที่ได้อานิสงส์จากธีม AI ต่างจากหุ้นระดับดัชนีฮ่องกงที่ยังตามหลังอยู่ตอนนี้`},
      full:{en:`Greater China diverged Thursday. The Shanghai Composite rose 1.13% to 3,956.57, as an Nvidia-led AI-hardware rally lifted onshore chip and communications names — the 5G Communication index jumped about 4.3% and onshore AI shares rose roughly 3.5%. Hong Kong's Hang Seng lagged, slipping 0.34% to 25,565.74, even as the broader region rode the Nvidia-driven tech bid. Markets across the region are now looking to Friday's Jackson Hole symposium for the next major catalyst.`, th:`จีนแผ่นดินใหญ่และฮ่องกงเคลื่อนไหวสวนทางกันวันพฤหัสบดี ดัชนี Shanghai Composite เพิ่มขึ้น 1.13% สู่ 3,956.57 หลังแรงซื้อหุ้นฮาร์ดแวร์ AI ที่นำโดย Nvidia หนุนหุ้นกลุ่มชิปและสื่อสารในประเทศ โดยดัชนีกลุ่ม 5G พุ่งขึ้นราว 4.3% และหุ้นกลุ่ม AI ในประเทศเพิ่มขึ้นราว 3.5% ขณะ Hang Seng ฮ่องกงปรับขึ้นน้อยกว่า ลดลง 0.34% สู่ 25,565.74 แม้ภูมิภาคโดยรวมจะได้อานิสงส์จากแรงซื้อหุ้นเทคที่นำโดย Nvidia ตลาดทั่วภูมิภาคตอนนี้จับตางานสัมมนา Jackson Hole วันศุกร์เป็นปัจจัยขับเคลื่อนถัดไป`},
      sources:[{l:"Business Recorder",u:"https://www.brecorder.com/news/40436645/china-stocks-climb-on-nvidia-led-ai-hardware-rally-hong-kong-lags"},{l:"Business Recorder",u:"https://www.brecorder.com/news/40436634/asian-stocks-rise-for-third-day-as-nvidia-beats"},{l:"Investing.com",u:"https://www.investing.com/news/stock-market-news/asian-stocks-mixed-as-nvidia-lifts-tech-rate-concerns-keep-gains-in-check-4878307"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,600.70", chg:-0.08, series:[1601.92,1600.70],
      txt:{en:`<b>SET Index dipped 0.08% to 1,600.70 Thursday (−1.22pts),</b> on turnover of about THB 65.27bn, as profit-taking in banking, telecom, energy and AOT offset positive sentiment in electronics names after Nvidia's earnings beat.`, th:`<b>ดัชนี SET ลดลง 0.08% สู่ 1,600.70 วันพฤหัสบดี (−1.22 จุด)</b> มูลค่าการซื้อขายราว 6.527 หมื่นล้านบาท จากแรงขายทำกำไรในกลุ่มธนาคาร สื่อสาร พลังงาน และ AOT ที่หักล้างบรรยากาศบวกในกลุ่มอิเล็กทรอนิกส์หลัง Nvidia รายงานผลประกอบการทะลุคาด`},
      why:{en:`The SET giving back an intraday surge to close only marginally lower, even with a strong regional AI-earnings tailwind, shows local profit-taking in defensives rather than any Thailand-specific risk — UBS's 1,680 SET target for 2026 still argues the broader trend remains higher.`, th:`การที่ SET คืนกำไรระหว่างวันจนปิดลดลงเพียงเล็กน้อย แม้จะมีแรงหนุนจากผลประกอบการ AI ในภูมิภาค แสดงว่าเป็นการขายทำกำไรในหุ้นกลุ่มตั้งรับมากกว่าความเสี่ยงเฉพาะของไทย เป้าหมาย SET ปี 2026 ที่ 1,680 ของ UBS ยังคงสนับสนุนแนวโน้มขาขึ้นในภาพรวม`},
      full:{en:`Thailand's SET Index closed Thursday at 1,600.70, down 1.22 points (−0.08%), on turnover of about THB 65.27 billion. The index surged through the session on positive sentiment in the electronics sector following Nvidia's better-than-expected earnings, but gave back the gains by the close as investors took profits in banking, telecommunications, energy and AOT. The move leaves the SET within its recent 1,600–1,610 range, with UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still framing the longer-term opportunity even as near-term moves track global sentiment and Friday's Jackson Hole event.`, th:`ดัชนี SET ของไทยปิดตลาดวันพฤหัสบดีที่ 1,600.70 ลดลง 1.22 จุด (−0.08%) มูลค่าการซื้อขายราว 6.527 หมื่นล้านบาท ดัชนีปรับขึ้นระหว่างวันจากบรรยากาศบวกในกลุ่มอิเล็กทรอนิกส์หลัง Nvidia รายงานผลประกอบการดีกว่าคาด แต่คืนกำไรตอนปิดตลาดจากแรงขายทำกำไรในกลุ่มธนาคาร สื่อสาร พลังงาน และ AOT การเคลื่อนไหวนี้ทำให้ดัชนียังอยู่ในกรอบล่าสุด 1,600-1,610 โดยเป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว แม้การเคลื่อนไหวระยะสั้นจะยังตามบรรยากาศตลาดโลกและงาน Jackson Hole วันศุกร์`},
      sources:[{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/589612"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/588833"}]},
  ];

    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold eased back toward $4,600/oz Thursday,</b> pulling off Wednesday's push near $4,650 as the hotter-than-expected PCE print and pre-Jackson Hole positioning took some shine off the safe-haven trade. <b>Brent extended its slide to a fourth straight session, falling to $87.65/bbl (WTI $82.90),</b> on signs of diplomatic progress in the Middle East.`, th:`<b>ทองคำย่อลงสู่ราว $4,600 ต่อออนซ์วันพฤหัสบดี</b> ถอยจากที่พุ่งขึ้นใกล้ $4,650 เมื่อวันพุธ หลังดัชนี PCE ออกมาสูงกว่าคาดและการปรับสถานะก่อนสุนทรพจน์ Jackson Hole ลดความน่าสนใจของการเทรดสินทรัพย์ปลอดภัยลงบ้าง <b>เบรนท์ร่วงต่อเนื่องเป็นวันที่สี่ สู่ $87.65 ต่อบาร์เรล (WTI ที่ $82.90)</b> จากสัญญาณความคืบหน้าทางการทูตในตะวันออกกลาง`},
     why:{en:`Gold cooling and oil extending its slide together — even as the market prices real odds of a Fed hike — suggests today's risk sentiment is being driven more by the earnings-and-Jackson-Hole event risk than by a broad flight to safety; use gold's pullback as a reminder to lock in strength rather than chase it, and flag oil's fourth-day slide as a rare piece of good inflation news.`, th:`การที่ทองคำเย็นลงและน้ำมันร่วงต่อเนื่องพร้อมกัน — แม้ตลาดจะเริ่มให้น้ำหนักโอกาสเฟดขึ้นดอกเบี้ย — บ่งชี้ว่าบรรยากาศความเสี่ยงตอนนี้ขับเคลื่อนจากปัจจัยผลประกอบการและ Jackson Hole มากกว่าการหนีความเสี่ยงในวงกว้าง ใช้การย่อตัวของทองคำเป็นเครื่องเตือนใจให้ล็อกกำไรตอนราคาสูง มากกว่าไล่ราคาตาม และควรชี้ให้เห็นว่าน้ำมันที่ร่วงต่อเนื่องเป็นวันที่สี่คือข่าวดีด้านเงินเฟ้อที่หาได้ยาก`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`Treasury yields stayed elevated Thursday even after Wednesday's brief relief from Treasury Secretary Bessent's bond-buyback boost — <b>the 10-year sits near 4.65%, the 2-year near 4.21%, and the 30-year near 5.16%,</b> as July's sticky PCE print (3.7% y/y headline) reinforced expectations the Fed stays cautious into September. Markets are now pricing meaningful odds of a <b>rate hike instead of a cut.</b> All eyes turn to <b>Fed Chair Kevin Warsh's first Jackson Hole keynote as chair today,</b> where he has signalled he will avoid explicit forward guidance — a stance that itself could push long yields higher if investors are left without a clearer signal.`, th:`ผลตอบแทนพันธบัตรยังยืนสูงวันพฤหัสบดี แม้การเข้าซื้อคืนพันธบัตรของ รมว.คลัง Bessent เมื่อวันพุธจะช่วยผ่อนคลายไปชั่วคราว — <b>10 ปียืนใกล้ 4.65%, 2 ปีใกล้ 4.21% และ 30 ปีใกล้ 5.16%</b> หลังดัชนี PCE เดือน ก.ค. ที่ยังเหนียว (หัวข้อ +3.7% เทียบปีก่อน) ตอกย้ำว่าเฟดจะยังระมัดระวังเข้าสู่เดือน ก.ย. ตลาดตอนนี้เริ่มให้น้ำหนักพอสมควรกับโอกาส <b>ขึ้นดอกเบี้ยแทนที่จะลด</b> ทุกสายตาจับจ้องไปที่ <b>สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh วันนี้</b> ซึ่งเขาส่งสัญญาณว่าจะหลีกเลี่ยงการให้แนวทางล่วงหน้าที่ชัดเจน — ท่าทีนี้เองอาจดันผลตอบแทนระยะยาวขึ้นได้ หากนักลงทุนไม่ได้รับสัญญาณที่ชัดเจนกว่านี้`},
     why:{en:`Warsh deliberately withholding forward guidance is itself information: strategists warn long yields could push above 5.5% without a clearer steer, which argues for locking in today's still-attractive coupons now rather than waiting for a clarity that may not arrive this week.`, th:`การที่ Warsh เลือกไม่ให้แนวทางล่วงหน้าชัดเจนโดยตั้งใจ ก็เป็นข้อมูลในตัวมันเอง: นักกลยุทธ์เตือนว่าผลตอบแทนระยะยาวอาจดันขึ้นเหนือ 5.5% หากไม่มีสัญญาณที่ชัดเจนกว่านี้ ซึ่งสนับสนุนให้ล็อกคูปองที่ยังน่าสนใจวันนี้ มากกว่ารอความชัดเจนที่อาจไม่มาถึงในสัปดาห์นี้`}},

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Tariff risk hasn't gone away — the Canada-US truce collapse and a possible new ~7.5% China "overcapacity" tariff both remain live — but neither was Thursday's story. <b>Nvidia's earnings beat, not trade policy, drove the day's rally,</b> a reminder that company-specific catalysts can still dominate over macro/policy risk in the short run.`, th:`ความเสี่ยงภาษียังไม่หายไป — ทั้งข้อตกลงสงบศึกแคนาดา-สหรัฐฯ ที่พังทลายและภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ — แต่ไม่ใช่ประเด็นหลักของวันพฤหัสฯ <b>ผลประกอบการทะลุคาดของ Nvidia ไม่ใช่นโยบายการค้า คือปัจจัยที่ขับเคลื่อนแรงซื้อวันนี้</b> เป็นเครื่องเตือนใจว่าปัจจัยเฉพาะบริษัทยังสามารถครอบงำความเสี่ยงเชิงมหภาค/นโยบายได้ในระยะสั้น`}, w:{en:`With tariff risk still simmering in the background and equities near highs on an earnings-driven rally, this is a good week to reinforce that clients shouldn't read Thursday's calm on trade as an all-clear — diversified, bond-anchored portfolios remain the right hedge against a tariff headline resurfacing.`, th:`เมื่อความเสี่ยงภาษียังคุกรุ่นอยู่เบื้องหลัง ขณะหุ้นใกล้จุดสูงจากแรงซื้อที่มาจากผลประกอบการ สัปดาห์นี้เป็นจังหวะดีที่จะย้ำกับลูกค้าว่าความสงบด้านการค้าวันพฤหัสฯ ไม่ใช่สัญญาณว่าปลอดภัยแล้ว พอร์ตที่กระจายความเสี่ยงและมีตราสารหนี้เป็นหลักยังคงเป็นเกราะป้องกันที่เหมาะสมหากข่าวภาษีกลับมาอีกครั้ง`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>Oil extended its slide to a fourth straight session — Brent down to $87.65/bbl —</b> on signs of diplomatic progress in the Middle East, even as Washington's sweeping Iran-sanctions campaign ("Operation Economic Outcast") remains in force. The disconnect between de-escalation signals and an active sanctions regime keeps the geopolitical picture unsettled heading into the weekend.`, th:`<b>ราคาน้ำมันร่วงต่อเนื่องเป็นวันที่สี่ — เบรนท์ลดลงสู่ $87.65 ต่อบาร์เรล —</b> จากสัญญาณความคืบหน้าทางการทูตในตะวันออกกลาง แม้มาตรการคว่ำบาตรอิหร่านระลอกใหญ่ของสหรัฐฯ ("Operation Economic Outcast") จะยังมีผลบังคับใช้อยู่ ความไม่สอดคล้องกันระหว่างสัญญาณคลี่คลายและมาตรการคว่ำบาตรที่ยังคุมเข้ม ทำให้ภาพภูมิรัฐศาสตร์ยังไม่นิ่งเข้าสู่ช่วงสุดสัปดาห์`}, w:{en:`Oil's fourth straight decline is a genuinely good piece of inflation news for clients worried about imported price pressure — but with an active US sanctions campaign still targeting Iran's trading partners, including China, this is not yet a green light to stop hedging geopolitical risk.`, th:`น้ำมันที่ร่วงต่อเนื่องเป็นวันที่สี่ คือข่าวดีด้านเงินเฟ้อที่แท้จริงสำหรับลูกค้าที่กังวลแรงกดดันราคานำเข้า — แต่เมื่อมาตรการคว่ำบาตรของสหรัฐฯ ยังเล่นงานคู่ค้าของอิหร่าน รวมถึงจีน นี่ยังไม่ใช่สัญญาณให้หยุดป้องกันความเสี่ยงภูมิรัฐศาสตร์`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`Treasury yields stayed elevated Thursday — the 10-year near 4.65%, the 30-year near 5.16% — even after Wednesday's brief relief from Treasury Secretary Bessent's bond-buyback boost proved short-lived. Markets are now pricing meaningful odds of a <b>September rate hike, not a cut,</b> after July's sticky PCE print. <b>Fed Chair Kevin Warsh delivers his first Jackson Hole keynote as chair today,</b> and has signalled he'll avoid explicit forward guidance.`, th:`ผลตอบแทนพันธบัตรยังยืนสูงวันพฤหัสบดี — 10 ปีใกล้ 4.65%, 30 ปีใกล้ 5.16% — แม้การผ่อนคลายชั่วคราวจากมาตรการซื้อคืนพันธบัตรของ รมว.คลัง Bessent เมื่อวันพุธจะจางหายไปเร็ว ตลาดตอนนี้เริ่มให้น้ำหนักพอสมควรกับโอกาส <b>ขึ้นดอกเบี้ยเดือน ก.ย. แทนที่จะลด</b> หลังดัชนี PCE เดือน ก.ค. ที่ยังเหนียว <b>ประธานเฟด Kevin Warsh จะกล่าวสุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานวันนี้</b> และส่งสัญญาณว่าจะหลีกเลี่ยงการให้แนวทางล่วงหน้าที่ชัดเจน`}, w:{en:`Warsh withholding forward guidance is itself a signal — strategists warn long yields could push above 5.5% without a clearer steer — which argues for locking in today's still-elevated coupons now rather than waiting for clarity that may not come this week.`, th:`การที่ Warsh ไม่ให้แนวทางล่วงหน้าชัดเจน ก็เป็นสัญญาณในตัวมันเอง — นักกลยุทธ์เตือนว่าผลตอบแทนระยะยาวอาจดันขึ้นเหนือ 5.5% หากไม่มีสัญญาณที่ชัดเจนกว่านี้ — สนับสนุนให้ล็อกคูปองที่ยังสูงอยู่วันนี้ มากกว่ารอความชัดเจนที่อาจไม่มาถึงในสัปดาห์นี้`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`July's PCE report — the Fed's preferred gauge — came in <b>hotter than expected on the headline (+3.7% y/y vs 3.6% forecast), with core PCE holding at 3.3% y/y</b> for essentially the fourth straight month. Inflation progress has stalled just as markets start pricing real odds of a Fed hike instead of a cut.`, th:`รายงาน PCE เดือน ก.ค. — มาตรวัดที่เฟดให้น้ำหนักมากที่สุด — ออกมา <b>สูงกว่าคาดในหัวข้อ (+3.7% เทียบปีก่อน เทียบคาดการณ์ 3.6%) ขณะ PCE พื้นฐานยืนที่ 3.3% เทียบปีก่อน</b> ต่อเนื่องเป็นเดือนที่สี่โดยแทบไม่มีความคืบหน้า เงินเฟ้อชะงักงันในจังหวะที่ตลาดเริ่มให้น้ำหนักโอกาสเฟดขึ้นดอกเบี้ยแทนที่จะลด`}, w:{en:`Four months of flat core inflation, arriving right as Nvidia's earnings reignite risk appetite, is the clearest "don't get complacent on rates" talking point this week — pair any growth-fund conversation with a reminder that the bond case hasn't weakened, it's arguably gotten stronger.`, th:`เงินเฟ้อพื้นฐานที่ทรงตัวมาสี่เดือน เกิดขึ้นพอดีกับที่ผลประกอบการ Nvidia จุดความกล้าเสี่ยงกลับมา เป็นประเด็นที่ชัดเจนที่สุดให้ "อย่าประมาทเรื่องดอกเบี้ย" ในสัปดาห์นี้ — เมื่อคุยเรื่องกองทุนเติบโตกับลูกค้า ควรย้ำด้วยว่าเหตุผลด้านตราสารหนี้ไม่ได้อ่อนลง แต่กลับแข็งแกร่งขึ้น`}},
  ];

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-themes').textContent=t(S.sThemes); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('s-prices').textContent=t(S.sPrices); $('h-prices').textContent=t(S.hPrices); $('pricenote').textContent=t(S.pricenote);
    $('b-sell').textContent=t(S.bSell); $('s-funds').textContent=t(S.sFunds); $('h-funds').textContent=t(S.hFunds);
    $('sh-off').innerHTML=`${t(S.shOff)} <small>${t(S.shOffSub)}</small>`; $('sh-on').innerHTML=`${t(S.shOn)} <small>${t(S.shOnSub)}</small>`;
    $('s-talk').textContent=t(S.sTalk); $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('countrygrid').innerHTML=COUNTRIES.map((c,i)=>`
      <div class="card ccard">
        <div class="chdr"><div class="ci"><h3 style="margin:0"><span class="flag">${c.flag}</span> ${t(c.name)}</h3><span class="ix">${c.ix}</span></div>
          <div style="text-align:right"><div class="val">${c.val}</div>${chgPill(c.chg)}</div></div>
        <div class="chartbox" data-series='${JSON.stringify(c.series)}' data-chg="${c.chg}"></div>
        <div class="chartcap">${t(S.recent)}</div>
        <p>${t(c.txt)}</p>
        <div class="why"><span>${t(S.foryou)}</span> ${t(c.why)}</div>
        <button class="expand">${t(S.readfull)} <span class="cv">▾</span></button>
        <div class="full" hidden><p style="margin:0">${t(c.full)}</p>
          <div class="srcline"><span class="srclabel">${t(S.sources)}</span>${c.sources.map(s=>`<a class="srcpill" href="${s.u}" target="_blank" rel="noopener">${s.l} ↗</a>`).join('')}</div></div>
      </div>`).join('');
    $('extragrid').innerHTML=EXTRA.map(e=>`<div class="card"><h3><span class="flag">${e.flag}</span> ${t(e.h)}</h3><p>${t(e.txt)}</p><div class="why"><span>${t(S.foryou)}</span> ${t(e.why)}</div></div>`).join('');
    $('themegrid').innerHTML=THEMES.map(x=>`<div class="card themecard"><h3>${t(x.h)}</h3><p>${t(x.p)}</p><div class="why"><span>${t(S.impact)}</span> ${t(x.w)}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`<div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div><div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div><div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน และค่าเงิน':'US Treasuries, gold, oil & FX',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p>${f.now?`<div class="fnow"><span>${L==='th'?'ทำไมตอนนี้':'Why now'}</span>${t(f.now)}</div>`:''}<div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');
    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
