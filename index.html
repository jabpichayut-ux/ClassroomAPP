<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Wall Street Takes Thanksgiving Off, the World Rebounds: DAX +2.08%, Hang Seng +1.19% — but SET −0.98% on an Nvidia Chip Halt", th:"วอลล์สตรีทหยุด Thanksgiving ตลาดโลกดีดกลับ: DAX +2.08% Hang Seng +1.19% — แต่ SET −0.98% จากข่าว Nvidia หยุดส่งชิป"},
    heroDeck:{en:`US markets were closed Thursday for Thanksgiving, so the S&P 500 (7,182.78), Nasdaq (23,585.80) and Dow (50,182.95) still stand at Wednesday's close, and Treasuries did not trade (10-year ~4.86%). The rest of the world priced in Wall Street's late Wednesday comeback and some relief on tariffs: USTR said the new Section 301 duties would be capped at the lower rates already agreed in trade deals. Germany's DAX jumped 513.39 points (+2.08%) to 25,215.52, back above 25,000, with 39 of 40 members higher. Japan's Nikkei rose about 0.86% to 57,499.16 (SoftBank +7.3%, Kioxia +12.6%), the Hang Seng gained 1.19% to 22,226.88 to end a seven-day losing streak, and the Shanghai Composite was flat at 3,476.88. Thailand was the exception: the SET fell about 14 points (−0.98%) to 1,414.44 after a Financial Times report that Nvidia told partners to stop shipping AI servers to Thailand, Malaysia, Singapore and Indonesia under new US export-licence rules; foreigners sold about THB 2.6bn. Oil was firmer (Brent ~$93–96, WTI ~$84; sources differ) and gold was little changed around ~$3,570–3,600. US stocks reopen for a half day on Friday.`, th:`ตลาดสหรัฐฯ ปิดวันพฤหัสฯ วัน Thanksgiving ดังนั้น S&P 500 (7,182.78) Nasdaq (23,585.80) และ Dow (50,182.95) ยังเป็นราคาปิดวันพุธ และบอนด์สหรัฐฯ ไม่มีการซื้อขาย (10 ปีราว 4.86%) ตลาดอื่นทั่วโลกตอบรับการฟื้นตัวช่วงท้ายของวอลล์สตรีทเมื่อวันพุธ และความกังวลเรื่องภาษีที่ผ่อนลง: USTR ระบุว่าภาษีใหม่ตามมาตรา 301 จะจำกัดไว้ที่อัตราต่ำที่ตกลงไว้แล้วในข้อตกลงการค้า DAX เยอรมนีพุ่ง 513.39 จุด (+2.08%) สู่ 25,215.52 กลับเหนือ 25,000 หุ้น 39 จาก 40 ตัวปิดบวก Nikkei ญี่ปุ่นขึ้นราว 0.86% สู่ 57,499.16 (SoftBank +7.3% Kioxia +12.6%) Hang Seng ขึ้น 1.19% สู่ 22,226.88 หยุดการลดลง 7 วันติด และเซี่ยงไฮ้ทรงตัวที่ 3,476.88 ไทยสวนทาง: SET ลดลงราว 14 จุด (−0.98%) สู่ 1,414.44 หลัง Financial Times รายงานว่า Nvidia สั่งพันธมิตรหยุดส่งเซิร์ฟเวอร์ AI ไปไทย มาเลเซีย สิงคโปร์ และอินโดนีเซีย ตามกฎใบอนุญาตส่งออกใหม่ของสหรัฐฯ ต่างชาติขายสุทธิราว 2,600 ล้านบาท น้ำมันขยับขึ้น (Brent ราว $93–96 WTI ราว $84 แต่ละแหล่งต่างกัน) และทองคำแทบไม่เปลี่ยนที่ราว $3,570–3,600 หุ้นสหรัฐฯ กลับมาเปิดครึ่งวันในวันศุกร์`},

    dbNext:{en:"Next", th:"ถัดไป"}, dbNextVal:{en:"US stocks reopen for a half day today (Fri 27 Nov) and should catch up to the global rebound. Then OPEC+ meets on Sun 29 Nov, and the Fed decides on 9 December, where a hike is ~98% priced. In Thailand, watch whether Nvidia's server-shipment halt is temporary.", th:"หุ้นสหรัฐฯ กลับมาเปิดครึ่งวันวันนี้ (ศุกร์ 27 พ.ย.) และน่าจะตามการดีดกลับของตลาดโลก จากนั้น OPEC+ ประชุมวันอาทิตย์ที่ 29 พ.ย. และเฟดตัดสินใจวันที่ 9 ธ.ค. ที่ตลาดให้โอกาสขึ้นดอกเบี้ยราว 98% ในไทย จับตาว่าการหยุดส่งเซิร์ฟเวอร์ของ Nvidia จะเป็นเพียงชั่วคราวหรือไม่"},

    leadtxt:{en:`<b>With Wall Street closed for Thanksgiving, the rest of the world bounced — except Thailand.</b> Markets priced in Wednesday's late US comeback and <b>USTR's promise to cap the new tariffs at existing deal rates</b>. The <b>DAX jumped +2.08% to 25,215.52</b>, the <b>Nikkei +0.86% to 57,499.16</b>, and the <b>Hang Seng +1.19% to 22,226.88</b>, ending a seven-day slide; <b>Shanghai was flat at 3,476.88</b>. The <b>SET fell −0.98% to 1,414.44</b>, a new low for this sell-off, after reports that <b>Nvidia halted AI-server shipments to Thailand, Malaysia, Singapore and Indonesia</b> under new US export-licence rules; <b>foreigners sold ~THB 2.6bn</b>. US prices are unchanged from Wednesday: <b>S&P 500 7,182.78, Nasdaq 23,585.80, Dow 50,182.95</b>, <b>10-year ~4.86%</b>, and a <b>9 December Fed hike ~98% priced</b>. <b>Gold ~$3,570–3,600</b>, <b>Brent ~$93–96</b>. <b>For you:</b> the global rebound is a good sign, but the correction isn't over — keep quality bond income as the core, add to tech only in small steps on dips, and keep Thai equity exposure light until the chip-export and tariff picture clears.`, th:`<b>วอลล์สตรีทหยุด Thanksgiving ตลาดอื่นทั่วโลกดีดกลับ — ยกเว้นไทย</b> ตลาดตอบรับการฟื้นตัวช่วงท้ายของสหรัฐฯ เมื่อวันพุธ และ <b>USTR ยืนยันว่าภาษีใหม่จะไม่เกินอัตราในข้อตกลงเดิม</b> <b>DAX พุ่ง +2.08% สู่ 25,215.52</b> <b>Nikkei +0.86% สู่ 57,499.16</b> และ <b>Hang Seng +1.19% สู่ 22,226.88</b> หยุดการลดลง 7 วันติด <b>เซี่ยงไฮ้ทรงตัวที่ 3,476.88</b> <b>SET ลดลง −0.98% สู่ 1,414.44</b> ต่ำสุดใหม่ของรอบขาลงนี้ หลังมีรายงานว่า <b>Nvidia หยุดส่งเซิร์ฟเวอร์ AI ไปไทย มาเลเซีย สิงคโปร์ และอินโดนีเซีย</b> ตามกฎใบอนุญาตส่งออกใหม่ของสหรัฐฯ <b>ต่างชาติขายสุทธิราว 2,600 ล้านบาท</b> ราคาสหรัฐฯ ยังเท่าวันพุธ: <b>S&P 500 7,182.78 Nasdaq 23,585.80 Dow 50,182.95</b> <b>บอนด์ 10 ปีราว 4.86%</b> และ <b>โอกาสเฟดขึ้นดอกเบี้ยวันที่ 9 ธ.ค. ราว 98%</b> <b>ทองคำราว $3,570–3,600</b> <b>Brent ราว $93–96</b> <b>สำหรับคุณ:</b> การดีดกลับทั่วโลกเป็นสัญญาณดี แต่การปรับฐานยังไม่จบ — ให้รายได้จากบอนด์คุณภาพเป็นแกนหลัก ทยอยเพิ่มหุ้นเทคทีละน้อยตอนย่อ และถือหุ้นไทยน้อยไว้ก่อนจนกว่าเรื่องการส่งออกชิปและภาษีจะชัดเจน`},

    watchnote:{en:`Thursday was calmer: with the US closed, Europe and most of Asia rebounded on Wall Street's Wednesday comeback and USTR's tariff cap, while Thailand fell on Nvidia's ASEAN server halt. The S&P 500 is still about 8.1% below its October peak. The three things that matter most next: Friday's half-day US session and whether it confirms the rebound, OPEC+ on 29 November for oil, and the 9 December Fed hike, now ~98% priced.`,
      th:`วันพฤหัสฯ ตลาดสงบลง: สหรัฐฯ ปิด ยุโรปและเอเชียส่วนใหญ่ดีดกลับตามการฟื้นของวอลล์สตรีทเมื่อวันพุธและการจำกัดเพดานภาษีของ USTR ขณะที่ไทยลดลงจากข่าว Nvidia หยุดส่งเซิร์ฟเวอร์ไปอาเซียน S&P 500 ยังต่ำกว่าจุดสูงสุดเดือนตุลาคมราว 8.1% สามเรื่องที่สำคัญที่สุดถัดไป: ตลาดสหรัฐฯ ครึ่งวันวันศุกร์จะยืนยันการดีดกลับหรือไม่ OPEC+ วันที่ 29 พ.ย. ต่อราคาน้ำมัน และการขึ้นดอกเบี้ยของเฟดวันที่ 9 ธ.ค. ที่ตลาดให้โอกาสราว 98%`},

    disc:{en:`<b>Please read.</b> This is a personal, private morning summary to help you stay on top of the market — <b>not investment advice, a research report, or a solicitation</b>, and not an official document of UOB, UOBAM, Prudential or any issuer. Equity indices, Treasury yields, oil and gold levels are last-available closes as of the Thu 26 Nov Europe, Asia and Thailand close; US stocks and Treasury yields are as of Wed 25 Nov because US markets were closed for Thanksgiving. Treasury yields, gold and oil are approximate (sources differ by timing and contract), and company news is as reported in the press. Prices may be delayed and are <b>not live quotes</b>. The cover is an illustration, not a photo; news photos stay at the linked source (copyright). Verify every number against your firm's approved systems.`,
      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดยุโรป เอเชีย และไทย วันพฤหัสฯ ที่ 26 พ.ย. ส่วนหุ้นและผลตอบแทนบอนด์สหรัฐฯ เป็นของวันพุธที่ 25 พ.ย. เพราะตลาดสหรัฐฯ ปิดวัน Thanksgiving ผลตอบแทนบอนด์สหรัฐฯ ทองคำ และน้ำมันเป็นค่าประมาณ (แต่ละแหล่งต่างกันตามเวลาและสัญญา) และข่าวบริษัทเป็นไปตามที่สื่อรายงาน ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>US markets were closed Thursday for Thanksgiving; prices are Wednesday's close: S&P 500 −0.25% at 7,182.78 (after −3.2% intraday), Nasdaq −0.62% at 23,585.80, Dow +0.33% at 50,182.95.</b> Trading resumes with a half day on Friday; futures and global markets point to a firmer reopen.`, th:`<b>ตลาดสหรัฐฯ ปิดวันพฤหัสฯ วัน Thanksgiving ราคาที่แสดงเป็นราคาปิดวันพุธ: S&P 500 −0.25% ที่ 7,182.78 (หลังเคยลง 3.2% ระหว่างวัน) Nasdaq −0.62% ที่ 23,585.80 Dow +0.33% ที่ 50,182.95</b> กลับมาซื้อขายครึ่งวันวันศุกร์ ตลาดโลกชี้ว่าน่าจะเปิดในทิศทางที่ดีขึ้น`},
      why:{en:`Two shocks hit at once: October core PCE rose to 3.3% (above the 3.2% forecast, headline 3.8%), and the White House proposed new tariffs on 14 trading partners. That pushed a 9 December Fed hike to ~98% priced. The fact that buyers erased most of a 3% drop — and most S&P 500 stocks actually rose — shows money is rotating from AI leaders into the broader market rather than leaving stocks altogether.`, th:`สองแรงกระแทกมาพร้อมกัน: core PCE เดือนตุลาคมขึ้นเป็น 3.3% (สูงกว่าคาด 3.2% ทั่วไป 3.8%) และทำเนียบขาวเสนอภาษีใหม่ต่อคู่ค้า 14 ราย ทำให้ตลาดให้โอกาสเฟดขึ้นดอกเบี้ยวันที่ 9 ธ.ค. ราว 98% การที่แรงซื้อลบการลดลง 3% ได้เกือบหมด — และหุ้นส่วนใหญ่ใน S&P 500 ปิดบวก — แสดงว่าเงินกำลังหมุนจากหุ้นผู้นำ AI ไปหุ้นวงกว้าง ไม่ได้ออกจากตลาดหุ้นทั้งหมด`},
      full:{en:`US stocks ended mixed on Wednesday, November 25, after a dramatic intraday reversal. The S&P 500 fell 18.31 points (−0.25%) to 7,182.78 after being down as much as 3.2%; the Nasdaq Composite fell 147.74 points (−0.62%) to 23,585.80 after being down as much as 4.6%; and the Dow Jones Industrial Average rose about 0.33% to 50,182.95, erasing an intraday decline of more than 1,100 points, according to Yahoo Finance, the Motley Fool and UPI. October PCE inflation rose 3.8% year over year and core PCE 3.3%, above the 3.2% consensus. The White House proposed new tariffs on 14 trading partners including China, the EU and Japan. Nvidia closed down 3.91% at $149.30, Oracle fell more than 5% and Micron about 4%, while Anthropic (ANT) recovered from a near-10% early drop to close up about 1% at ~$82.79, according to CNBC and CNN. US markets are closed Thursday for Thanksgiving and close early Friday.`, th:`หุ้นสหรัฐฯ ปิดผสมวันพุธที่ 25 พ.ย. หลังกลับตัวแรงระหว่างวัน S&P 500 ลดลง 18.31 จุด (−0.25%) สู่ 7,182.78 หลังเคยลงมากสุด 3.2% Nasdaq ลดลง 147.74 จุด (−0.62%) สู่ 23,585.80 หลังเคยลงมากสุด 4.6% และ Dow Jones ขึ้นราว 0.33% สู่ 50,182.95 ลบการลดลงระหว่างวันกว่า 1,100 จุด ตามรายงานของ Yahoo Finance, Motley Fool และ UPI เงินเฟ้อ PCE เดือนตุลาคมขึ้น 3.8% ต่อปี และ core PCE 3.3% สูงกว่าคาดที่ 3.2% ทำเนียบขาวเสนอภาษีใหม่ต่อคู่ค้า 14 ราย รวมจีน ยุโรป และญี่ปุ่น Nvidia ปิดลดลง 3.91% ที่ $149.30 Oracle ลดลงกว่า 5% และ Micron ราว 4% ส่วน Anthropic (ANT) ฟื้นจากการลดลงเกือบ 10% ช่วงเช้า ปิดขึ้นราว 1% ที่ราว $82.79 ตามรายงานของ CNBC และ CNN ตลาดสหรัฐฯ ปิดวันพฤหัสฯ วัน Thanksgiving และปิดเร็ววันศุกร์`},
      sources:[{l:"Motley Fool — Stock Market Today, Nov. 25: Dow erases 1,100-point loss in dramatic late-day comeback",u:"https://www.fool.com/coverage/stock-market-today/2026/11/25/stock-market-today-nov-25-dow-erases-1-100-point-loss-as-wall-street-stages-dramatic-late-day-comeback/"},{l:"Yahoo Finance — Stock market today: Dow erases losses to end positive amid AI sell-off",u:"https://finance.yahoo.com/markets/live/stock-market-today-wednesday-november-25-dow-sp-500-nasdaq-pce-inflation-data-091428237.html"},{l:"CNBC — Tech stocks sink but close well off the lows; Anthropic struggles to rebound above IPO price",u:"https://www.cnbc.com/2026/11/25/nvidia-ai-stock-tech-selloff.html"},{l:"UPI — Stocks slide as inflation, Nvidia losses fuel Wall Street sell-off",u:"https://www.upi.com/Top_News/US/2026/11/25/nasdaq-AI-thanksgiving/8261795629057"},{l:"CNN — Tech stocks are volatile as AI fears overshadow Huang's Nvidia return",u:"https://www.cnn.com/2026/11/25/business/ai-sell-off-despite-huang-nvidia-return"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,215.52", chg:2.08, series:[24702.13,25215.52],
      txt:{en:`<b>Germany's DAX jumped 513.39 points (+2.08%) to 25,215.52 Thursday,</b> back above 25,000, with 39 of its 40 members higher as tech and auto stocks rebounded.`, th:`<b>ดัชนี DAX เยอรมนีพุ่ง 513.39 จุด (+2.08%) สู่ 25,215.52 วันพฤหัสฯ</b> กลับเหนือ 25,000 หุ้น 39 จาก 40 ตัวปิดบวก นำโดยหุ้นเทคและรถยนต์`},
      why:{en:`Europe had closed near Wednesday's lows, so it caught up to Wall Street's late comeback in one day. Tariff relief helped too: USTR said the new Section 301 duties will be capped at the lower rates in existing deals, which protects EU carmakers. The DAX is still about 6% below its 12 November record, and Europe's tech index remains down ~12% for November.`, th:`ยุโรปปิดใกล้จุดต่ำสุดเมื่อวันพุธ จึงไล่ตามการฟื้นช่วงท้ายของวอลล์สตรีทได้ในวันเดียว ความกังวลเรื่องภาษีที่ผ่อนลงก็ช่วย: USTR ระบุว่าภาษีใหม่ตามมาตรา 301 จะไม่เกินอัตราต่ำในข้อตกลงเดิม ซึ่งปกป้องผู้ผลิตรถยุโรป DAX ยังต่ำกว่าสถิติเมื่อ 12 พ.ย. ราว 6% และดัชนีหุ้นเทคยุโรปยังลดลงราว 12% ในเดือนพฤศจิกายน`},
      full:{en:`Germany's DAX closed up 513.39 points (+2.08%) at 25,215.52 on Thursday, November 26, erasing the previous session's losses, according to finanzen.net and Xetra closing reports. The STOXX 600 rose about 1.8%. Investors took comfort from USTR saying it intends to cap the newly proposed duties on 14 partners, including the EU, at the lower levels agreed in completed or ongoing trade deals, and from a rebound in technology shares, with US markets closed for Thanksgiving.`, th:`ดัชนี DAX เยอรมนีปิดขึ้น 513.39 จุด (+2.08%) ที่ 25,215.52 วันพฤหัสฯ ที่ 26 พ.ย. ลบการลดลงของวันก่อน ตามรายงานของ finanzen.net และรายงานปิดตลาด Xetra STOXX 600 ขึ้นราว 1.8% นักลงทุนคลายกังวลหลัง USTR ระบุว่าตั้งใจจำกัดภาษีใหม่ที่เสนอต่อคู่ค้า 14 ราย รวมยุโรป ไว้ที่อัตราต่ำที่ตกลงไว้ในข้อตกลงการค้า และหุ้นเทคฟื้นตัว ขณะที่ตลาดสหรัฐฯ ปิดวัน Thanksgiving`},
      sources:[{l:"ad-hoc-news — DAX closes 2.08% higher as tech and auto stocks rebound",u:"https://www.ad-hoc-news.de/boerse/news/marktberichte/dax-closes-2-08-prozent-higher-as-tech-and-auto-stocks-rebound/70559366"},{l:"MarketScreener — XETRA-SCHLUSS: Deutliche Erholung schiebt DAX wieder klar über 25.000 Punkte",u:"https://de.marketscreener.com/boerse-nachrichten/xetra-schluss-deutliche-erholung-schiebt-dax-wieder-klar-ueber-25-000-punkte-ce7851d9d98ef320"},{l:"Investing.com — European shares rise as benign U.S. tariffs and Thanksgiving lull offer relief",u:"https://investing.com/news/stock-market-news/european-shares-as-benign-us-tariffs-and-thanksgiving-lull-offer-relief-5052089"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"57,499.16", chg:0.86, series:[57011.62,57499.16],
      txt:{en:`<b>The Nikkei 225 rose about 0.86% to 57,499.16 Thursday,</b> recovering part of Wednesday's 2.8% drop as SoftBank (+7.3%) and Kioxia (+12.6%) led an AI rebound; Korea's Kospi added 0.3% after a 6.2% plunge.`, th:`<b>Nikkei 225 ขึ้นราว 0.86% สู่ 57,499.16 วันพฤหัสฯ</b> ฟื้นคืนบางส่วนจากการลดลง 2.8% เมื่อวันพุธ นำโดย SoftBank (+7.3%) และ Kioxia (+12.6%) ในการฟื้นตัวของหุ้น AI ส่วน Kospi เกาหลีขึ้น 0.3% หลังดิ่ง 6.2%`},
      why:{en:`Asia had taken the full hit of the AI sell-off on Wednesday without the late US rebound; Thursday was the catch-up. The tariff cap at existing deal rates matters for Japan, which already has a US trade deal. The bounce was modest compared with Wednesday's fall, so chip and AI names remain the swing factor until US trading resumes.`, th:`เอเชียรับแรงขายหุ้น AI เต็ม ๆ เมื่อวันพุธโดยไม่ได้การฟื้นช่วงท้ายของสหรัฐฯ วันพฤหัสฯ จึงเป็นการไล่ตาม การจำกัดภาษีไว้ที่อัตราในข้อตกลงเดิมสำคัญต่อญี่ปุ่นซึ่งมีข้อตกลงการค้ากับสหรัฐฯ แล้ว การดีดกลับยังน้อยเมื่อเทียบกับการลดลงวันพุธ หุ้นชิปและ AI จึงยังเป็นตัวแปรหลักจนกว่าสหรัฐฯ จะกลับมาซื้อขาย`},
      full:{en:`Japan's Nikkei 225 closed at 57,499.16 on Thursday, November 26, up about 0.86% from Wednesday's 57,011.62, according to AP/BNN Bloomberg. OpenAI investor SoftBank Group jumped 7.3% and memory maker Kioxia Holdings surged 12.6%. South Korea's Kospi gained 0.3% after a 6.2% drop a day earlier. US markets were closed for Thanksgiving.`, th:`Nikkei 225 ญี่ปุ่นปิดที่ 57,499.16 วันพฤหัสฯ ที่ 26 พ.ย. ขึ้นราว 0.86% จาก 57,011.62 เมื่อวันพุธ ตามรายงานของ AP/BNN Bloomberg SoftBank Group ผู้ลงทุนใน OpenAI พุ่ง 7.3% และผู้ผลิตชิปหน่วยความจำ Kioxia Holdings พุ่ง 12.6% Kospi เกาหลีใต้ขึ้น 0.3% หลังลดลง 6.2% วันก่อน ตลาดสหรัฐฯ ปิดวัน Thanksgiving`},
      sources:[{l:"BNN Bloomberg (AP) — Global stocks rise and tech shares rebound as U.S. closes for Thanksgiving",u:"https://www.bnnbloomberg.ca/markets/2026/11/26/global-stocks-rise-and-tech-shares-rebound-as-us-closes-for-thanksgiving/"},{l:"Local 10 (AP) — Global stocks rise and tech shares rebound as US closes for Thanksgiving",u:"https://www.local10.com/business/2026/11/26/world-shares-push-higher-while-markets-in-us-will-be-closed-for-thanksgiving/"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"22,226.88", chg:1.19, series:[21966.01,22226.88],
      txt:{en:`<b>Hong Kong's Hang Seng rose 260.87 points (+1.19%) to 22,226.88 Thursday,</b> snapping a seven-day losing streak, while the Shanghai Composite was flat (+0.01%) at 3,476.88.`, th:`<b>ดัชนี Hang Seng ฮ่องกงขึ้น 260.87 จุด (+1.19%) สู่ 22,226.88 วันพฤหัสฯ</b> หยุดการลดลง 7 วันติด ส่วน Shanghai Composite ทรงตัว (+0.01%) ที่ 3,476.88`},
      why:{en:`Hong Kong had fallen to its lowest since April 2025, so AI developers and gold miners bounced hard. Mainland investors stayed cautious: China still faces the highest proposed US rate (a 20% overcapacity duty), which kept Shanghai flat. Chinese assets are likely to lag the region until tariff rates and any Beijing response are clear.`, th:`ฮ่องกงลงไปต่ำสุดตั้งแต่เมษายน 2025 หุ้นผู้พัฒนา AI และเหมืองทองจึงดีดกลับแรง นักลงทุนจีนแผ่นดินใหญ่ยังระวัง: จีนยังเจออัตราที่สหรัฐฯ เสนอสูงสุด (ภาษีกำลังการผลิตล้นเกิน 20%) เซี่ยงไฮ้จึงทรงตัว สินทรัพย์จีนมีแนวโน้มตามหลังภูมิภาคจนกว่าอัตราภาษีและการตอบโต้ของปักกิ่งจะชัดเจน`},
      full:{en:`Hong Kong's Hang Seng Index closed at 22,226.88 on Thursday, November 26, up 260.87 points (+1.19%), ending a seven-session slide that had taken it to its lowest since April 2025, led by AI model developers and gold miners, according to BBN Times and Armenpress. The Shanghai Composite closed at 3,476.88, up 0.41 points (+0.01%), as semiconductor optimism was offset by concern over fresh US tariff risks.`, th:`ดัชนี Hang Seng ฮ่องกงปิดที่ 22,226.88 วันพฤหัสฯ ที่ 26 พ.ย. ขึ้น 260.87 จุด (+1.19%) หยุดการลดลง 7 วันติดที่ทำให้ลงไปต่ำสุดตั้งแต่เมษายน 2025 นำโดยหุ้นผู้พัฒนาโมเดล AI และเหมืองทอง ตามรายงานของ BBN Times และ Armenpress Shanghai Composite ปิดที่ 3,476.88 ขึ้น 0.41 จุด (+0.01%) เพราะความหวังต่อหุ้นชิปถูกหักล้างด้วยความกังวลเรื่องภาษีใหม่ของสหรัฐฯ`},
      sources:[{l:"BBN Times — Hang Seng snaps seven-day losing streak, rises 1.19% to 22,226.88 on AI rebound",u:"https://www.bbntimes.com/companies/hong-kong-stock-exchange-hang-seng-snaps-seven-day-losing-streak-rises-1-19-to-22-226-88-on-ai-rebound"},{l:"ad-hoc-news — Shanghai Composite closes flat as tariff risks limit rebound",u:"https://www.ad-hoc-news.de/boerse/news/marktberichte/shanghai-composite-closes-flat-as-tariff-risks-limit-rebound/70557915"},{l:"Armenpress — Asian stocks, 26-11-26",u:"https://armenpress.am/en/article/1266750"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,414.44", chg:-0.98, series:[1428.50,1414.44],
      txt:{en:`<b>SET Index fell about 14 pts (−0.98%) to 1,414.44 Thursday</b> on turnover of about THB 64.0bn, a new low for this sell-off, as foreigners sold ~THB 2.6bn while local retail bought ~THB 3.8bn.`, th:`<b>ดัชนี SET ลดลงราว 14 จุด (−0.98%) สู่ 1,414.44 วันพฤหัสฯ</b> มูลค่าซื้อขายราว 64,010 ล้านบาท ต่ำสุดใหม่ของรอบขาลงนี้ ต่างชาติขายสุทธิราว 2,600 ล้านบาท ขณะที่นักลงทุนรายย่อยในประเทศซื้อสุทธิราว 3,800 ล้านบาท`},
      why:{en:`Thailand missed the regional rebound because of a Thailand-specific blow: Nvidia reportedly told partners such as Dell and Supermicro to stop shipping AI servers to Thailand, Malaysia, Singapore and Indonesia after new US export-licence rules took effect. That hits the data-centre and electronics theme that had supported Thai stocks, on top of the proposed tariffs (up to 18%). It may be temporary while compliance is sorted out; until then, the 1,410 support is the line to watch.`, th:`ไทยพลาดการดีดกลับของภูมิภาคเพราะข่าวเฉพาะของไทย: มีรายงานว่า Nvidia สั่งพันธมิตรอย่าง Dell และ Supermicro หยุดส่งเซิร์ฟเวอร์ AI ไปไทย มาเลเซีย สิงคโปร์ และอินโดนีเซีย หลังกฎใบอนุญาตส่งออกใหม่ของสหรัฐฯ มีผล ซึ่งกระทบธีมศูนย์ข้อมูลและอิเล็กทรอนิกส์ที่เคยหนุนหุ้นไทย ซ้ำเติมภาษีที่สหรัฐฯ เสนอ (สูงสุด 18%) อาจเป็นเพียงชั่วคราวระหว่างจัดการเรื่องการปฏิบัติตามกฎ ระหว่างนี้ให้จับตาแนวรับ 1,410`},
      full:{en:`Thailand's SET Index closed at 1,414.44 on Thursday, November 26, down 0.98%, with trading value of about THB 64.01 billion, according to Kaohoon International. The analyst tied the decline to reports that Nvidia is restricting chip exports to Thailand, together with foreign fund outflows, and expects further weakness ahead of the Fed's December meeting. Foreign investors were net sellers of about THB 2.58 billion, while local individuals were net buyers of about THB 3.80 billion. The Financial Times reported that Nvidia told manufacturing partners to stop shipping servers with its chips to Malaysia, Singapore, Thailand and Indonesia after new US export-licence requirements took effect.`, th:`ดัชนี SET ปิดที่ 1,414.44 วันพฤหัสฯ ที่ 26 พ.ย. ลดลง 0.98% มูลค่าซื้อขายราว 64,010 ล้านบาท ตามรายงานของข่าวหุ้น (Kaohoon International) นักวิเคราะห์ระบุว่าการลดลงมาจากข่าว Nvidia จำกัดการส่งออกชิปมาไทย ร่วมกับเงินทุนต่างชาติไหลออก และคาดว่าตลาดยังอ่อนตัวก่อนการประชุมเฟดเดือนธันวาคม ต่างชาติขายสุทธิราว 2,580 ล้านบาท ขณะที่นักลงทุนรายย่อยในประเทศซื้อสุทธิราว 3,800 ล้านบาท Financial Times รายงานว่า Nvidia สั่งพันธมิตรผู้ผลิตหยุดส่งเซิร์ฟเวอร์ที่ใช้ชิปของตนไปมาเลเซีย สิงคโปร์ ไทย และอินโดนีเซีย หลังข้อกำหนดใบอนุญาตส่งออกใหม่ของสหรัฐฯ มีผล`},
      sources:[{l:"Kaohoon International — Market Roundup 26 November 2026",u:"https://www.kaohooninternational.com/markets/595586"},{l:"Kaohoon International — Total trading value of stocks and bonds on 26 November 2026 by investor types",u:"https://www.kaohooninternational.com/markets/595572"},{l:"US News (Reuters) — Nvidia halts server shipments to four Southeast Asian countries, FT reports",u:"https://www.usnews.com/news/top-news/articles/2026-11-26/nvidia-halts-server-shipments-to-four-southeast-asian-countries-ft-reports"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold was little changed Thursday around ~$3,570–3,600/oz</b> (sources differ in direction), still about a third below its January high. <b>Oil was firmer: Brent ~$93–96 and WTI ~$84</b> in thin holiday trading with US exchanges closed; treat levels as approximate.`, th:`<b>ทองคำแทบไม่เปลี่ยนวันพฤหัสฯ ที่ราว $3,570–3,600 ต่อออนซ์</b> (แต่ละแหล่งระบุทิศทางต่างกัน) ยังต่ำกว่าจุดสูงสุดเดือนมกราคมราวหนึ่งในสาม <b>น้ำมันขยับขึ้น: Brent ราว $93–96 และ WTI ราว $84</b> ในการซื้อขายบางเบาช่วงวันหยุดที่ตลาดสหรัฐฯ ปิด จึงถือเป็นค่าประมาณ`},
     why:{en:`Hot inflation should help gold, but a near-certain Fed hike and rising real rates are cancelling that out — keep gold as a small hedge, not a growing bet. Oil is the bigger risk: Gulf attacks are now hitting Saudi infrastructure, and OPEC+ meets on 29 November. Higher oil would add to inflation and Thailand's import bill.`, th:`เงินเฟ้อที่สูงควรหนุนทองคำ แต่การที่เฟดเกือบแน่นอนว่าจะขึ้นดอกเบี้ยและดอกเบี้ยแท้จริงที่สูงขึ้นหักล้างผลนั้น — ถือทองคำสัดส่วนเล็กเพื่อป้องกันความเสี่ยง ไม่ใช่เพิ่มเดิมพัน น้ำมันเป็นความเสี่ยงที่ใหญ่กว่า: การโจมตีในอ่าวเปอร์เซียเริ่มลามถึงโครงสร้างพื้นฐานของซาอุฯ และ OPEC+ ประชุมวันที่ 29 พ.ย. ราคาน้ำมันที่สูงขึ้นจะเพิ่มเงินเฟ้อและค่านำเข้าของไทย`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Treasuries rallied Wednesday as investors bought bonds for protection: the 2-year ~4.63%, the 10-year ~4.86% (down ~5–8 bp) and the 30-year ~5.26%.</b> October core PCE rose to 3.3% y/y (vs 3.2% expected), headline 3.8%. CME FedWatch puts a quarter-point hike on 9 December at ~98%.`, th:`<b>บอนด์สหรัฐฯ ขึ้นวันพุธเพราะนักลงทุนซื้อบอนด์เพื่อป้องกันความเสี่ยง: ผลตอบแทน 2 ปีราว 4.63% 10 ปีราว 4.86% (ลดลงราว 0.05–0.08%) และ 30 ปีราว 5.26%</b> core PCE เดือนตุลาคมขึ้นเป็น 3.3% ต่อปี (คาด 3.2%) ทั่วไป 3.8% CME FedWatch ให้โอกาสเฟดขึ้นดอกเบี้ย 0.25% วันที่ 9 ธ.ค. ราว 98%`},
     why:{en:`This is exactly why bonds anchor the portfolio: on a day inflation surprised higher and stocks fell 3% intraday, bond prices rose. A December hike is fully priced, so the next question is whether the Fed signals more hikes in 2027. Yields near 4.6% (2-year) and 4.9% (10-year) still lock in attractive income.`, th:`นี่คือเหตุผลที่บอนด์เป็นหลักยึดของพอร์ต: ในวันที่เงินเฟ้อสูงเกินคาดและหุ้นดิ่ง 3% ระหว่างวัน ราคาบอนด์กลับขึ้น การขึ้นดอกเบี้ยเดือนธันวาคมสะท้อนในราคาเต็มแล้ว คำถามถัดไปคือเฟดจะส่งสัญญาณขึ้นเพิ่มในปี 2027 หรือไม่ ผลตอบแทนราว 4.6% (2 ปี) และ 4.9% (10 ปี) ยังให้รายได้ที่น่าสนใจ`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`USTR proposed new Section 301 tariffs on 14 economies, including China (20% overcapacity duty), the EU, Japan, South Korea and Thailand (up to 18%). On Thursday markets focused on the fine print: USTR intends to cap the new duties at the lower levels agreed in completed or ongoing trade deals, and they won't stack on July's 10–12.5% tariffs. That relief lifted Europe and Asia. Separately, new US export-licence rules on advanced chips to Southeast Asia led Nvidia to pause AI-server shipments to Thailand, Malaysia, Singapore and Indonesia.`, th:`USTR เสนอภาษีใหม่ตามมาตรา 301 ต่อ 14 เศรษฐกิจ รวมจีน (ภาษีกำลังการผลิตล้นเกิน 20%) ยุโรป ญี่ปุ่น เกาหลีใต้ และไทย (สูงสุด 18%) วันพฤหัสฯ ตลาดสนใจรายละเอียด: USTR ตั้งใจจำกัดภาษีใหม่ไว้ที่อัตราต่ำที่ตกลงไว้ในข้อตกลงการค้าที่เสร็จแล้วหรือกำลังเจรจา และจะไม่ซ้อนกับภาษี 10–12.5% เมื่อเดือนกรกฎาคม ทำให้ยุโรปและเอเชียดีดกลับ อีกด้านหนึ่ง กฎใบอนุญาตส่งออกชิปขั้นสูงไปเอเชียตะวันออกเฉียงใต้ฉบับใหม่ของสหรัฐฯ ทำให้ Nvidia หยุดส่งเซิร์ฟเวอร์ AI ไปไทย มาเลเซีย สิงคโปร์ และอินโดนีเซียชั่วคราว`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
