<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Fed’s Waller Signals Rate Hold; Wall Street’s Best Day Since August, Gold Nears $4,500", th:"วอลเลอร์แห่งเฟดส่งสัญญาณคงดอกเบี้ย; วอลล์สตรีทบวกแรงสุดตั้งแต่ ส.ค., ทองคำใกล้แตะ $4,500"},
    heroDeck:{en:"US stocks stormed higher Thursday — the S&P 500 +1.06% to 7,747.71, its best day since Aug 4 — after Fed Governor Waller said he could back holding rates steady in September, telling markets to “give disinflation a chance.” September hike odds collapsed to roughly a coin flip from ~63%. Yields eased, gold jumped 2% toward $4,500, but Broadcom gave back some of its post-earnings pop on a soft Q4 guide. Friday’s US jobs report — due later today, Bangkok time — is now the swing factor.", th:"หุ้นสหรัฐพุ่งแรงวันพฤหัสฯ — S&P 500 เพิ่มขึ้น 1.06% สู่ 7,747.71 บวกแรงสุดตั้งแต่ 4 ส.ค. — หลังผู้ว่าการเฟด วอลเลอร์ ส่งสัญญาณอาจสนับสนุนให้คงดอกเบี้ยเดือน ก.ย. โดยกล่าวว่าตลาดควร “ให้โอกาสเงินเฟ้อชะลอตัว” ทำให้โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ร่วงลงเหลือใกล้เคียง 50-50 จากราว 63% ผลตอบแทนพันธบัตรย่อลง ทองคำพุ่ง 2% เข้าใกล้ $4,500 แต่ Broadcom คืนกำไรบางส่วนหลังแนวโน้มไตรมาส 4 อ่อนกว่าคาด รายงานการจ้างงานสหรัฐฯ ที่จะออกวันนี้ตามเวลากรุงเทพฯ คือปัจจัยชี้ขาดถัดไป"},

    leadtxt:{en:`<b>A genuine dovish pivot, not just a pause: Fed Governor Waller signaled he could support holding rates steady this month, and Wall Street had its best day since Aug 4.</b> The S&P 500 rose 1.06% to 7,747.71, the Dow +1.18% and Nasdaq +1.4%, as September hike odds collapsed to roughly a coin flip from ~63%. Yields eased and gold jumped 2% toward $4,500 — but the Iran/Hormuz conflict kept oil bid, and Broadcom gave back some of its post-earnings pop on soft guidance. For your clients: <b>today's still-elevated bond coupons may not last if the Fed truly is done hiking</b>, and <b>gold's break toward $4,500 (UOBSG) confirms the safe-haven bid is back</b> — Friday's jobs report, due later today, decides which way this breaks.`, th:`<b>เป็นการเปลี่ยนท่าทีแบบผ่อนคลายจริง ไม่ใช่แค่การหยุดพัก: ผู้ว่าการเฟด วอลเลอร์ ส่งสัญญาณอาจสนับสนุนคงดอกเบี้ยเดือนนี้ วอลล์สตรีทบวกแรงสุดตั้งแต่ 4 ส.ค.</b> ดัชนี S&P 500 ขึ้น 1.06% สู่ 7,747.71, Dow เพิ่มขึ้น 1.18% และ Nasdaq เพิ่มขึ้น 1.4% ขณะโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ร่วงลงเหลือใกล้เคียง 50-50 จากราว 63% ผลตอบแทนพันธบัตรย่อลง และทองคำพุ่ง 2% เข้าใกล้ $4,500 — แต่ความขัดแย้งอิหร่าน/ฮอร์มุซยังคงหนุนราคาน้ำมัน และ Broadcom คืนกำไรบางส่วนหลังแนวโน้มอ่อนกว่าคาด สำหรับลูกค้าของคุณ: <b>คูปองตราสารหนี้ที่ยังสูงอยู่วันนี้อาจไม่คงอยู่นาน หากเฟดหยุดขึ้นดอกเบี้ยจริง</b> และ <b>ทองคำที่ทะลุเข้าใกล้ $4,500 (UOBSG) ยืนยันแรงซื้อสินทรัพย์ปลอดภัยที่กลับมา</b> — รายงานการจ้างงานวันศุกร์ที่จะออกวันนี้ คือตัวชี้ขาดทิศทางถัดไป`},

    watchnote:{en:`Rate-hike odds collapsed to roughly a coin flip Thursday after Fed Governor Waller signaled he could support a hold, down ~12 points from ~63%. The <b style="color:var(--muted)">official August jobs report, due later today (Fri, Bangkok time)</b>, is now the decisive input — a strong print could push hike odds back up, while a soft one could cement the dovish pivot ahead of the Fed's Sep 16 decision.`,
      th:`โอกาสขึ้นดอกเบี้ยร่วงลงเหลือใกล้เคียง 50-50 วันพฤหัสฯ หลังผู้ว่าการเฟด วอลเลอร์ ส่งสัญญาณอาจสนับสนุนให้คงดอกเบี้ย ลดลงราว 12 จุดจากระดับราว 63% <b style="color:var(--muted)">รายงานการจ้างงานทางการเดือน ส.ค. ที่จะออกวันนี้ (ศุกร์ ตามเวลากรุงเทพฯ)</b> คือปัจจัยชี้ขาดถัดไป — หากตัวเลขออกมาแข็งแกร่งอาจดันโอกาสขึ้นดอกเบี้ยกลับขึ้นไป ขณะหากอ่อนแออาจตอกย้ำท่าทีผ่อนคลายของเฟด ก่อนการตัดสินใจวันที่ 16 ก.ย.`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,747.71", chg:1.06, series:[7666.60,7747.71],
      txt:{en:`<b>US stocks stormed higher Thursday, their best day since Aug 4 — the S&P 500 +1.06% to 7,747.71, the Dow +1.18% (+624 pts) to 53,686.11, the Nasdaq +1.4% to 26,584.06 —</b> after Fed Governor Christopher Waller said he could support holding rates steady this month, telling markets to "give disinflation a chance." September hike odds collapsed to roughly a coin flip from ~63%.`, th:`<b>หุ้นสหรัฐฯ พุ่งแรงวันพฤหัสฯ บวกแรงสุดตั้งแต่ 4 ส.ค. — S&P 500 เพิ่มขึ้น 1.06% สู่ 7,747.71, Dow เพิ่มขึ้น 1.18% (+624 จุด) สู่ 53,686.11, Nasdaq เพิ่มขึ้น 1.4% สู่ 26,584.06 —</b> หลังผู้ว่าการเฟด คริสโตเฟอร์ วอลเลอร์ กล่าวว่าอาจสนับสนุนให้คงดอกเบี้ยเดือนนี้ โดยบอกตลาดให้ "ให้โอกาสเงินเฟ้อชะลอตัว" ทำให้โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ร่วงลงเหลือใกล้เคียง 50-50 จากราว 63%`},
      why:{en:`This is a genuine dovish pivot from a sitting Fed governor, not just one soft data print — and the market repriced 12 points of hike probability in minutes. That's a much bigger, faster move than Wednesday's ADP-driven pause, and it argues for locking in bond coupons now if you believe the hiking cycle may already be over, rather than waiting for confirmation from Friday's jobs report.`, th:`นี่คือการเปลี่ยนท่าทีแบบผ่อนคลายจริงจากผู้ว่าการเฟดที่ดำรงตำแหน่งอยู่ ไม่ใช่แค่ตัวเลขเศรษฐกิจอ่อนแอชุดเดียว — และตลาดปรับโอกาสขึ้นดอกเบี้ยลง 12 จุดภายในไม่กี่นาที นี่เป็นการเคลื่อนไหวที่ใหญ่และเร็วกว่าการหยุดชะงักจากตัวเลข ADP วันพุธมาก สนับสนุนให้ล็อกคูปองตราสารหนี้ตอนนี้หากเชื่อว่ารอบขึ้นดอกเบี้ยอาจจบแล้ว มากกว่าจะรอการยืนยันจากรายงานการจ้างงานวันศุกร์`},
      full:{en:`US stocks surged Thursday in their best session since Aug 4, as Fed Governor Christopher Waller delivered the clearest dovish signal yet from a sitting Fed official. Waller said "if there is continued progress toward our 2% goal, then I am willing to support holding the policy rate at its current level," paraphrasing John Lennon to tell markets to "give disinflation a chance" and that the Fed "can wait one meeting." The S&P 500 rose 1.06% to close at 7,747.71, the Dow Jones Industrial Average jumped 624.16 points (+1.18%) to 53,686.11, and the Nasdaq Composite gained 1.4% to 26,584.06. CME FedWatch's implied odds of a September 16 rate hike collapsed roughly 12 percentage points in minutes, from about 63% to near a coin flip (~50–55%). Nvidia added about 1% to $227.69, extending Wednesday's gain, while Broadcom slipped as investors continued digesting Wednesday's soft Q4 revenue guide ($34.8bn, below consensus) even after its blowout AI-chip quarter. The 10-year Treasury yield fell to around 4.76%, its biggest single-day drop since Aug 25, having peaked intraday Wednesday at 4.818% — its highest since November 2023. Oil stayed bid despite the dovish pivot, as the Iran/Hormuz conflict escalated further: Iran targeted US Gulf allies Kuwait and Bahrain with drones for a second straight night, and Iranian officials alleged a missile strike hit a wedding, killing four. All eyes now turn to Friday's official August jobs report, due later today Bangkok time, ahead of the Fed's September 16 decision.`, th:`หุ้นสหรัฐฯ พุ่งแรงวันพฤหัสฯ ในเซสชันที่ดีที่สุดตั้งแต่ 4 ส.ค. หลังผู้ว่าการเฟด คริสโตเฟอร์ วอลเลอร์ ส่งสัญญาณผ่อนคลายที่ชัดเจนที่สุดจนถึงตอนนี้จากเจ้าหน้าที่เฟดที่ดำรงตำแหน่งอยู่ วอลเลอร์กล่าวว่า "หากยังมีความคืบหน้าต่อเนื่องสู่เป้าหมาย 2% ผมก็ยินดีสนับสนุนให้คงอัตราดอกเบี้ยนโยบายไว้ที่ระดับปัจจุบัน" พร้อมยกคำพูดทำนอง John Lennon บอกตลาดให้ "ให้โอกาสเงินเฟ้อชะลอตัว" และเฟด "รอได้อีกหนึ่งรอบประชุม" ดัชนี S&P 500 เพิ่มขึ้น 1.06% ปิดที่ 7,747.71 ดัชนี Dow Jones เพิ่มขึ้น 624.16 จุด (+1.18%) สู่ 53,686.11 และดัชนี Nasdaq Composite เพิ่มขึ้น 1.4% สู่ 26,584.06 โอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. ตามข้อมูล CME FedWatch ร่วงลงราว 12 จุดภายในไม่กี่นาที จากราว 63% เหลือใกล้เคียง 50-55% Nvidia เพิ่มขึ้นราว 1% สู่ $227.69 ต่อเนื่องจากวันพุธ ขณะ Broadcom ปรับลง ขณะนักลงทุนยังคงย่อยข่าวแนวโน้มรายได้ไตรมาส 4 ที่อ่อนกว่าคาด ($34.8 พันล้านดอลลาร์ ต่ำกว่าที่ตลาดคาด) แม้ผลประกอบการชิป AI ไตรมาสก่อนจะทะลุคาด ผลตอบแทนพันธบัตร 10 ปีลดลงสู่ราว 4.76% ลดลงมากที่สุดในหนึ่งวันนับตั้งแต่ 25 ส.ค. หลังพุ่งแตะระดับสูงสุดระหว่างวันที่ 4.818% เมื่อวันพุธ ซึ่งเป็นระดับสูงสุดตั้งแต่เดือนพฤศจิกายน 2023 ราคาน้ำมันยังคงได้แรงหนุนแม้เฟดจะส่งสัญญาณผ่อนคลาย เนื่องจากความขัดแย้งอิหร่าน/ฮอร์มุซยกระดับขึ้นอีก: อิหร่านโจมตีพันธมิตรอ่าวเปอร์เซียของสหรัฐฯ อย่างคูเวตและบาห์เรนด้วยโดรนเป็นคืนที่สองติดต่อกัน และเจ้าหน้าที่อิหร่านกล่าวหาว่ามีการโจมตีด้วยขีปนาวุธที่งานแต่งงาน เป็นเหตุให้มีผู้เสียชีวิต 4 ราย ทุกสายตาตอนนี้จับตารายงานการจ้างงานทางการเดือน ส.ค. ที่จะออกวันนี้ตามเวลากรุงเทพฯ ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`},
      sources:[{l:"CNBC — Waller",u:"https://www.cnbc.com/2026/09/03/fed-governor-waller-indicates-he-will-support-holding-rates-steady-at-september-meeting.html"},{l:"TheStreet",u:"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-03-2026"},{l:"Yahoo Finance — Broadcom",u:"https://finance.yahoo.com/markets/stocks/articles/broadcom-falls-6-soft-guidance-140556754.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,007", chg:0.65, series:[25839,26007],
      txt:{en:`<b>DAX snapped its three-day slide, rising 0.65% to around 26,007 Thursday,</b> tracking the global relief rally after Fed Governor Waller's dovish signal, even though the Fed's path affects European borrowing costs only indirectly.`, th:`<b>DAX ยุติการร่วงต่อเนื่องสามวัน ปรับขึ้น 0.65% สู่ราว 26,007 วันพฤหัสฯ</b> ตามแรงบวกทั่วโลกหลังสัญญาณผ่อนคลายจากผู้ว่าการเฟด วอลเลอร์ แม้ทิศทางเฟดจะส่งผลต่อต้นทุนการกู้ยืมของยุโรปทางอ้อมเท่านั้น`},
      why:{en:`European stocks joining the global rally on a US-specific Fed signal shows how tightly linked developed-market sentiment still is when the catalyst is big enough — a useful contrast to Wednesday, when Europe fell alone on its own sector story. That's a reminder that global-equity funds catch these broad risk-on days even when the trigger is a single US official's remarks.`, th:`การที่หุ้นยุโรปร่วมบวกไปกับตลาดโลกจากสัญญาณเฟดที่เป็นเรื่องเฉพาะของสหรัฐฯ แสดงว่าบรรยากาศตลาดพัฒนาแล้วยังคงเชื่อมโยงกันแน่นแฟ้นเมื่อปัจจัยกระตุ้นใหญ่พอ — ตรงข้ามกับวันพุธที่ยุโรปปรับลงเดี่ยวจากเรื่องเฉพาะกลุ่มอุตสาหกรรมของตนเอง เป็นเครื่องเตือนใจว่ากองทุนหุ้นทั่วโลกจะจับจังหวะวันบวกกว้างแบบนี้ได้ แม้ตัวจุดชนวนจะเป็นแค่คำพูดของเจ้าหน้าที่สหรัฐฯ คนเดียว`},
      full:{en:`European shares snapped a three-session losing streak Thursday, with Germany's DAX closing up roughly 0.65% at around 26,007, recovering Wednesday's 25,839 close, as global markets rallied on Fed Governor Christopher Waller's signal that he could support holding US rates steady in September. The move came even though the Fed's rate path affects European borrowing costs only indirectly, underscoring how a single dovish US signal can lift broad developed-market risk sentiment. Investors now watch Friday's US August jobs report and the European data calendar for the next signal.`, th:`หุ้นยุโรปยุติการปรับลงต่อเนื่องสามวันวันพฤหัสฯ ดัชนี DAX เยอรมนีปิดตลาดขึ้นราว 0.65% ที่ระดับราว 26,007 ฟื้นตัวจากระดับปิด 25,839 เมื่อวันพุธ ตามตลาดโลกที่ปรับขึ้นจากสัญญาณของผู้ว่าการเฟด คริสโตเฟอร์ วอลเลอร์ ว่าอาจสนับสนุนให้คงดอกเบี้ยสหรัฐฯ เดือน ก.ย. การเคลื่อนไหวนี้เกิดขึ้นแม้ทิศทางดอกเบี้ยเฟดจะส่งผลต่อต้นทุนการกู้ยืมของยุโรปทางอ้อมเท่านั้น ตอกย้ำว่าสัญญาณผ่อนคลายเพียงครั้งเดียวจากสหรัฐฯ สามารถดันบรรยากาศความเสี่ยงของตลาดพัฒนาแล้วในวงกว้างได้ นักลงทุนตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันศุกร์ และปฏิทินข้อมูลเศรษฐกิจยุโรปเป็นสัญญาณถัดไป`},
      sources:[{l:"Investing.com",u:"https://www.investing.com/news/stock-market-news/germany-stocks-higher-at-close-of-trade-dax-up-065-4888310"},{l:"CNBC — Waller",u:"https://www.cnbc.com/2026/09/03/fed-governor-waller-indicates-he-will-support-holding-rates-steady-at-september-meeting.html"},{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"64,214.48", chg:-0.50, series:[64536.79,64214.48],
      txt:{en:`<b>Nikkei 225 eased about 0.50% to 64,214.48 Thursday,</b> missing the global relief rally as the yen strengthened sharply on hawkish BOJ signals — board member Hajime Takata said the bank should be more flexible on future rate hikes — and speculation of a possible currency intervention pressured exporters.`, th:`<b>Nikkei 225 อ่อนตัวลงราว 0.50% สู่ 64,214.48 วันพฤหัสฯ</b> พลาดแรงบวกจากตลาดโลก หลังเงินเยนแข็งค่าขึ้นชัดเจนจากท่าทีเชิงเหยี่ยวของ BOJ — กรรมการ ฮาจิเมะ ทากาตะ ระบุว่าธนาคารกลางควรมีความยืดหยุ่นมากขึ้นต่อการขึ้นดอกเบี้ยในอนาคต — และการคาดเดาว่าอาจมีการแทรกแซงค่าเงินกดดันหุ้นกลุ่มส่งออก`},
      why:{en:`Japan being the one major market to miss Thursday's Fed-driven global rally, on its own currency/BOJ story, is the mirror image of Wednesday's split — a reminder that regional central-bank policy can outweigh even a strong global risk-on signal for a single market. That argues for keeping Japan-specific exposure sized modestly and diversified across the broader region.`, th:`การที่ญี่ปุ่นเป็นตลาดหลักเพียงแห่งเดียวที่พลาดแรงบวกทั่วโลกจากเฟดวันพฤหัสฯ จากเรื่องค่าเงิน/BOJ ของตัวเอง เป็นภาพสะท้อนตรงข้ามกับความแตกต่างของวันพุธ — เป็นเครื่องเตือนใจว่านโยบายธนาคารกลางในภูมิภาคอาจมีน้ำหนักมากกว่าสัญญาณเข้าซื้อความเสี่ยงทั่วโลกที่แข็งแกร่งได้สำหรับตลาดใดตลาดหนึ่ง สนับสนุนให้คงสัดส่วนการลงทุนเฉพาะญี่ปุ่นไว้ในระดับพอเหมาะและกระจายทั่วภูมิภาค`},
      full:{en:`Japanese equities lacked direction Thursday even as global markets rallied on Fed Governor Waller's dovish signal, with the Nikkei 225 easing about 0.50% to close at 64,214.48, down 111.16 points from Wednesday's own close, while the broader TOPIX rose 0.5% to 4,102.04. The yen strengthened sharply on speculation that Japanese authorities had conducted a rate check, compounded by a more hawkish tone from the Bank of Japan — board member Hajime Takata said the bank should adopt a more flexible approach to future rate hikes. A stronger yen weighs on the earnings outlook for Japan's export-heavy industries and makes domestic assets more expensive for foreign investors, offsetting the lift from cooling US rate expectations. Markets across the region now look to Friday's US August jobs report and the Fed's September 16 meeting for the next signal.`, th:`หุ้นญี่ปุ่นเคลื่อนไหวไร้ทิศทางชัดเจนวันพฤหัสฯ แม้ตลาดโลกจะปรับขึ้นจากสัญญาณผ่อนคลายของผู้ว่าการเฟด วอลเลอร์ ดัชนี Nikkei 225 อ่อนตัวลงราว 0.50% ปิดที่ 64,214.48 ลดลง 111.16 จุดจากระดับปิดของวันพุธเอง ขณะดัชนี TOPIX ที่กว้างกว่าเพิ่มขึ้น 0.5% สู่ 4,102.04 เงินเยนแข็งค่าขึ้นชัดเจนจากการคาดเดาว่าทางการญี่ปุ่นอาจตรวจสอบอัตราแลกเปลี่ยน ประกอบกับท่าทีเชิงเหยี่ยวมากขึ้นของธนาคารกลางญี่ปุ่น — กรรมการ ฮาจิเมะ ทากาตะ ระบุว่าธนาคารควรใช้แนวทางที่ยืดหยุ่นมากขึ้นต่อการขึ้นดอกเบี้ยในอนาคต เงินเยนที่แข็งค่าขึ้นกดดันแนวโน้มกำไรของภาคส่งออกญี่ปุ่นและทำให้สินทรัพย์ในประเทศแพงขึ้นสำหรับนักลงทุนต่างชาติ หักล้างแรงหนุนจากมุมมองดอกเบี้ยสหรัฐฯ ที่ผ่อนคลายลง ตลาดทั่วภูมิภาคตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันศุกร์ และการประชุมเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"News on Japan",u:"https://newsonjapan.com/article/150612.php"},{l:"FXStreet",u:"https://www.fxstreet.com/news/japanese-yen-jumps-as-boj-opens-door-to-faster-rate-hikes-202609031427"},{l:"Trading Economics",u:"https://tradingeconomics.com/japan/stock-market"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,318", chg:0.03, series:[25311,25318],
      txt:{en:`<b>Hang Seng closed essentially flat Thursday, up just 0.03% to around 25,318,</b> while mainland China's <b>Shanghai Composite also barely moved, up 0.02% to 3,942.09</b> — both markets sitting out the Fed-driven global rally, holding steady rather than participating strongly either way.`, th:`<b>Hang Seng ปิดตลาดแทบไม่เปลี่ยนแปลงวันพฤหัสฯ เพิ่มขึ้นเพียง 0.03% สู่ราว 25,318</b> ขณะ <b>Shanghai Composite จีนแผ่นดินใหญ่ก็แทบไม่ขยับเช่นกัน เพิ่มขึ้น 0.02% สู่ 3,942.09</b> — ทั้งสองตลาดไม่ได้ร่วมแรงบวกจากเฟดทั่วโลกอย่างชัดเจน แต่ทรงตัวมากกว่าจะเคลื่อนไหวแรงไปทางใดทางหนึ่ง`},
      why:{en:`Greater China sitting almost perfectly flat on a day Wall Street had its best session since August shows onshore and HK sentiment is currently anchored more by domestic factors than the US rate cycle — a useful reminder for clients that China/HK equity funds may not simply track a US-driven global rally.`, th:`การที่ตลาดจีนและฮ่องกงทรงตัวเกือบนิ่งสนิทในวันที่วอลล์สตรีทบวกแรงสุดตั้งแต่เดือน ส.ค. แสดงว่าบรรยากาศตลาดในประเทศและฮ่องกงตอนนี้ยึดโยงกับปัจจัยภายในประเทศมากกว่าวงจรดอกเบี้ยสหรัฐฯ — เป็นเครื่องเตือนใจที่มีประโยชน์สำหรับลูกค้าว่ากองทุนหุ้นจีน/ฮ่องกงอาจไม่ได้เคลื่อนไหวตามแรงบวกทั่วโลกที่นำโดยสหรัฐฯ เสมอไป`},
      full:{en:`Greater China markets barely moved Thursday, decoupled from the sharp global rally sparked by Fed Governor Waller's dovish signal. Hong Kong's Hang Seng closed up just 0.03% at around 25,318, while the Shanghai Composite edged up 0.02% to 3,942.09 — both indices finishing essentially where they opened. Neither market showed the strong participation seen on Wall Street and in Europe, suggesting onshore and Hong Kong sentiment remains more anchored by domestic growth and property-sector concerns than the US rate outlook for now. Markets across the region now look to Friday's US August jobs report and the Fed's September 16 meeting for the next signal.`, th:`ตลาดจีนและฮ่องกงแทบไม่ขยับวันพฤหัสฯ แยกทิศทางออกจากแรงบวกทั่วโลกที่จุดชนวนโดยสัญญาณผ่อนคลายของผู้ว่าการเฟด วอลเลอร์ ดัชนี Hang Seng ฮ่องกงปิดตลาดเพิ่มขึ้นเพียง 0.03% ที่ระดับราว 25,318 ขณะ Shanghai Composite ขยับขึ้น 0.02% สู่ 3,942.09 — ทั้งสองดัชนีปิดตลาดใกล้เคียงกับระดับเปิดตลาดมาก ไม่มีตลาดใดแสดงแรงบวกที่ชัดเจนเหมือนวอลล์สตรีทและยุโรป บ่งชี้ว่าบรรยากาศตลาดในประเทศและฮ่องกงยังคงยึดโยงกับการเติบโตภายในประเทศและความกังวลภาคอสังหาริมทรัพย์มากกว่ามุมมองดอกเบี้ยสหรัฐฯ ในตอนนี้ ตลาดทั่วภูมิภาคตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันศุกร์ และการประชุมเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"24/7 Wall St.",u:"https://247wallst.com/cards/hong-kong-finished-the-session-less-than-a-point-from-where-hsi-market-bell-01m1k4r0awv3n0mhqnq3pfvqv4"},{l:"Trading Economics",u:"https://tradingeconomics.com/hong-kong/stock-market"},{l:"Trading Economics",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,576.92", chg:0.12, series:[1575.07,1576.92],
      txt:{en:`<b>SET Index edged up 0.12% to 1,576.92 Thursday (+1.85pts),</b> on turnover of about THB 64.48bn, a modest gain that lagged the Fed-driven rally in developed markets as the Middle East conflict and lingering tariff risk kept local investors cautious.`, th:`<b>ดัชนี SET เพิ่มขึ้น 0.12% สู่ 1,576.92 วันพฤหัสฯ (+1.85 จุด)</b> มูลค่าการซื้อขายราว 6.448 หมื่นล้านบาท เป็นการปรับขึ้นเล็กน้อยที่ตามหลังแรงบวกจากเฟดในตลาดพัฒนาแล้ว ขณะความขัดแย้งตะวันออกกลางและความเสี่ยงภาษีที่ยังคุกรุ่นทำให้นักลงทุนในประเทศยังระมัดระวัง`},
      why:{en:`The SET rising only modestly on a day Wall Street had its best session since August shows Thai equities are still discounting local and regional risks (Middle East oil, tariffs) more than they're crediting the improved US rate outlook — a gap that could close quickly if Friday's jobs report cements the Fed's dovish pivot.`, th:`การที่ SET ปรับขึ้นเพียงเล็กน้อยในวันที่วอลล์สตรีทบวกแรงสุดตั้งแต่เดือน ส.ค. แสดงว่าหุ้นไทยยังคงให้น้ำหนักกับความเสี่ยงในประเทศและภูมิภาค (น้ำมันตะวันออกกลาง ภาษี) มากกว่าจะให้เครดิตกับมุมมองดอกเบี้ยสหรัฐฯ ที่ดีขึ้น — ช่องว่างนี้อาจปิดลงเร็วหากรายงานการจ้างงานวันศุกร์ตอกย้ำท่าทีผ่อนคลายของเฟด`},
      full:{en:`Thailand's SET Index closed Thursday at 1,576.92, up 1.85 points (+0.12%), on turnover of about THB 64.48 billion, a modest gain that lagged the sharp rally in US and European markets after Fed Governor Waller signaled he could support holding rates steady in September. Brokers continue to flag the Fed's rate path as the key swing factor for regional flows, alongside lingering Middle East oil-price risk and tariff uncertainty ahead of a planned Trump-Xi summit. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity, with the next major catalyst being the US August jobs report due later Friday ahead of the Fed's September 16 decision.`, th:`ดัชนี SET ของไทยปิดตลาดวันพฤหัสฯ ที่ 1,576.92 เพิ่มขึ้น 1.85 จุด (+0.12%) มูลค่าการซื้อขายราว 6.448 หมื่นล้านบาท เป็นการปรับขึ้นเล็กน้อยที่ตามหลังการปรับขึ้นแรงของตลาดสหรัฐฯ และยุโรป หลังผู้ว่าการเฟด วอลเลอร์ ส่งสัญญาณว่าอาจสนับสนุนให้คงดอกเบี้ยเดือน ก.ย. โบรกเกอร์ยังคงระบุว่าทิศทางดอกเบี้ยของเฟดเป็นปัจจัยแกว่งสำคัญของกระแสเงินในภูมิภาค ควบคู่กับความเสี่ยงราคาน้ำมันตะวันออกกลางที่ยังคุกรุ่นและความไม่แน่นอนด้านภาษีก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้ เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว โดยปัจจัยขับเคลื่อนสำคัญถัดไปคือรายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ ที่จะออกวันศุกร์นี้ ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`},
      sources:[{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/589997"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"CNBC — Waller",u:"https://www.cnbc.com/2026/09/03/fed-governor-waller-indicates-he-will-support-holding-rates-steady-at-september-meeting.html"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil stayed bid Thursday despite the dovish Fed pivot — Brent to ~$95.82/bbl, WTI to ~$91.45 —</b> as Iran targeted US Gulf allies Kuwait and Bahrain with drones for a second straight night. <b>Gold jumped ~2% to near $4,478/oz, approaching $4,500,</b> as cooling rate-hike bets restored the safe-haven bid that had been missing all week.`, th:`<b>น้ำมันยังคงได้แรงหนุนวันพฤหัสฯ แม้เฟดจะส่งสัญญาณผ่อนคลาย — เบรนท์แตะราว $95.82 ต่อบาร์เรล, WTI ราว $91.45</b> หลังอิหร่านโจมตีพันธมิตรอ่าวเปอร์เซียของสหรัฐฯ อย่างคูเวตและบาห์เรนด้วยโดรนเป็นคืนที่สองติดต่อกัน <b>ทองคำพุ่งขึ้นราว 2% สู่ใกล้ $4,478 ต่อออนซ์ เข้าใกล้ $4,500</b> หลังโอกาสขึ้นดอกเบี้ยที่ลดลงทำให้แรงซื้อสินทรัพย์ปลอดภัยที่หายไปทั้งสัปดาห์กลับมา`},
     why:{en:`Gold finally moving on the Iran conflict — but only once rate expectations turned dovish, not on the strikes themselves — confirms it's the Fed path, not geopolitics, that's been driving gold all along. That argues for framing gold exposure around the Fed cycle first and the conflict second, even though both point the same direction right now.`, th:`การที่ทองคำในที่สุดขยับตามความขัดแย้งอิหร่าน — แต่เกิดขึ้นเมื่อมุมมองดอกเบี้ยเปลี่ยนเป็นผ่อนคลายเท่านั้น ไม่ใช่จากการโจมตีเอง — ยืนยันว่าทิศทางเฟด ไม่ใช่ภูมิรัฐศาสตร์ คือตัวขับเคลื่อนหลักของทองคำมาตลอด สนับสนุนให้นำเสนอการลงทุนทองคำโดยยึดวงจรเฟดเป็นหลักก่อน แล้วจึงเป็นเรื่องความขัดแย้ง แม้ทั้งสองปัจจัยจะชี้ไปทางเดียวกันตอนนี้`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 10-year Treasury yield fell to ~4.76% Thursday, its biggest single-day drop since Aug 25,</b> after Fed Governor Waller signaled he could support holding rates steady in September. <b>September hike odds collapsed roughly 12 points to a coin flip (~50–55%), from ~63% Wednesday.</b> The <b>2-year yield eased to ~4.35%,</b> and the <b>30-year eased to ~5.25%.</b>`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีลดลงสู่ราว 4.76% วันพฤหัสฯ ลดลงมากที่สุดในหนึ่งวันนับตั้งแต่ 25 ส.ค.</b> หลังผู้ว่าการเฟด วอลเลอร์ ส่งสัญญาณอาจสนับสนุนให้คงดอกเบี้ยเดือน ก.ย. <b>โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ร่วงลงราว 12 จุดเหลือใกล้เคียง 50-50 (ราว 50–55%) จากราว 63% เมื่อวันพุธ</b> ผลตอบแทนพันธบัตร <b>2 ปีอ่อนตัวลงสู่ราว 4.35%</b> และ <b>30 ปีอ่อนตัวลงสู่ราว 5.25%</b>`},
     why:{en:`This is a much sharper repricing than Wednesday's ADP-driven pause — a sitting Fed governor explicitly floated a hold, and the market moved 12 points in minutes. If Friday's jobs report confirms rather than reverses this, today's still-elevated coupons could be a closing window rather than a durable level.`, th:`นี่เป็นการปรับคาดการณ์ที่รุนแรงกว่าการหยุดชะงักจากตัวเลข ADP วันพุธมาก — ผู้ว่าการเฟดที่ดำรงตำแหน่งอยู่พูดถึงการคงดอกเบี้ยอย่างชัดเจน และตลาดขยับ 12 จุดภายในไม่กี่นาที หากรายงานการจ้างงานวันศุกร์ยืนยันแทนที่จะพลิกกลับทิศทางนี้ คูปองที่ยังสูงอยู่วันนี้อาจเป็นหน้าต่างโอกาสที่กำลังปิดลง มากกว่าจะเป็นระดับที่คงอยู่ถาวร`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`The Iran conflict under the administration's watch escalated further Thursday: <b>Iran targeted US Gulf allies Kuwait and Bahrain with drones for a second straight night,</b> and US Vice President Vance said Washington won't negotiate unless Iran stops firing on commercial vessels. Tariff risk hasn't gone away — Section 338 tariffs remain in effect and a possible ~7.5% China "overcapacity" tariff still looms ahead of a planned Trump-Xi summit — but it's the Fed's dovish pivot, not trade or Iran, driving Thursday's price action.`, th:`ความขัดแย้งกับอิหร่านภายใต้การบริหารของรัฐบาลยกระดับขึ้นอีกวันพฤหัสฯ: <b>อิหร่านโจมตีพันธมิตรอ่าวเปอร์เซียของสหรัฐฯ อย่างคูเวตและบาห์เรนด้วยโดรนเป็นคืนที่สองติดต่อกัน</b> และรองประธานาธิบดีสหรัฐฯ แวนซ์ กล่าวว่าวอชิงตันจะไม่เจรจาจนกว่าอิหร่านจะหยุดยิงเรือพาณิชย์ ความเสี่ยงภาษียังไม่หายไป — มาตรการภาษีมาตรา 338 ยังคงมีผลบังคับใช้ และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้ — แต่ท่าทีผ่อนคลายของเฟด ไม่ใช่การค้าหรืออิหร่าน ที่ขับเคลื่อนราคาสินทรัพย์วันพฤหัสฯ`}, w:{en:`With the Iran conflict widening to new Gulf states, tariff risk still simmering, and the Fed outlook swinging 12 points on one governor's remarks, this remains a good week to reinforce that diversified, bond-anchored portfolios are the right hedge — even as Thursday's rally makes the risks feel more distant than they are.`, th:`เมื่อความขัดแย้งกับอิหร่านขยายวงไปยังประเทศอ่าวเปอร์เซียใหม่ ความเสี่ยงภาษียังคุกรุ่นอยู่ และมุมมองเฟดแกว่งไป 12 จุดจากคำพูดของกรรมการคนเดียว สัปดาห์นี้ยังคงเป็นจังหวะดีที่จะย้ำกับลูกค้าว่าพอร์ตที่กระจายความเสี่ยงและมีตราสารหนี้เป็นหลักคือเกราะป้องกันที่เหมาะสม แม้แรงบวกวันพฤหัสฯ จะทำให้ความเสี่ยงเหล่านี้ดูห่างไกลกว่าความเป็นจริง`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>The Iran standoff widened Thursday even as markets rallied:</b> Iran targeted Kuwait and Bahrain with drones for a second consecutive night, added 11 more ships to its Hormuz blacklist, and Iranian officials alleged a missile strike hit a wedding, killing four and wounding more than 60. Oil stayed bid on the news — Brent to ~$95.82 — even as stocks surged on the Fed's dovish pivot.`, th:`<b>ความตึงเครียดกับอิหร่านขยายวงกว้างขึ้นวันพฤหัสฯ แม้ตลาดจะปรับขึ้น:</b> อิหร่านโจมตีคูเวตและบาห์เรนด้วยโดรนเป็นคืนที่สองติดต่อกัน เพิ่มเรืออีก 11 ลำในบัญชีดำฮอร์มุซ และเจ้าหน้าที่อิหร่านกล่าวหาว่ามีการโจมตีด้วยขีปนาวุธที่งานแต่งงาน เป็นเหตุให้มีผู้เสียชีวิต 4 รายและบาดเจ็บกว่า 60 ราย ราคาน้ำมันยังคงได้แรงหนุนจากข่าวนี้ — เบรนท์แตะราว $95.82 — แม้หุ้นจะพุ่งขึ้นจากท่าทีผ่อนคลายของเฟด`}, w:{en:`Stocks rallying hard while the Iran conflict genuinely widens to new countries is a split worth flagging to clients directly: today's calm equity reaction reflects the Fed news, not an "all clear" on the Middle East. Gold's 2% jump — finally moving on this risk — is the more honest signal, and reinforces keeping both gold and bonds as ballast.`, th:`การที่หุ้นบวกแรง ขณะความขัดแย้งกับอิหร่านขยายวงไปยังประเทศใหม่จริง ๆ เป็นความแตกต่างที่ควรบอกลูกค้าโดยตรง: ปฏิกิริยาหุ้นที่สงบวันนี้สะท้อนข่าวเฟด ไม่ใช่สัญญาณ "ปลอดภัยแล้ว" สำหรับตะวันออกกลาง ทองคำที่พุ่งขึ้น 2% — ในที่สุดขยับตามความเสี่ยงนี้ — เป็นสัญญาณที่ตรงไปตรงมากว่า และตอกย้ำให้คงทั้งทองคำและตราสารหนี้เป็นตัวถ่วงสมดุล`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`<b>The 10-year Treasury yield fell to ~4.76% Thursday, its biggest single-day drop since Aug 25,</b> after Fed Governor Waller said he could support holding rates steady this month, telling markets to "give disinflation a chance." <b>September hike odds collapsed roughly 12 points to a coin flip (~50–55%),</b> from ~63% Wednesday, per CME FedWatch. The 2-year yield eased to ~4.35%, and the 30-year eased to ~5.25%.`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีลดลงสู่ราว 4.76% วันพฤหัสฯ ลดลงมากที่สุดในหนึ่งวันนับตั้งแต่ 25 ส.ค.</b> หลังผู้ว่าการเฟด วอลเลอร์ กล่าวว่าอาจสนับสนุนให้คงดอกเบี้ยเดือนนี้ โดยบอกตลาดให้ "ให้โอกาสเงินเฟ้อชะลอตัว" <b>โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ร่วงลงราว 12 จุดเหลือใกล้เคียง 50-50 (ราว 50–55%)</b> จากราว 63% เมื่อวันพุธ ตามข้อมูล CME FedWatch ผลตอบแทนพันธบัตร 2 ปีอ่อนตัวลงสู่ราว 4.35% และพันธบัตร 30 ปีอ่อนตัวลงสู่ราว 5.25%`}, w:{en:`A sitting Fed governor floating a hold is a different order of signal than one soft data print — and the market's 12-point repricing in minutes shows it was heard that way. Friday's jobs report is now a binary catalyst: a strong number reopens the hike debate, a soft one likely cements the pivot. Either way, today's still-elevated coupons look more like a closing window than a stable level.`, th:`ผู้ว่าการเฟดที่ดำรงตำแหน่งอยู่พูดถึงการคงดอกเบี้ยเป็นสัญญาณที่มีน้ำหนักต่างจากตัวเลขเศรษฐกิจอ่อนแอชุดเดียวมาก — และการที่ตลาดปรับคาดการณ์ 12 จุดภายในไม่กี่นาที แสดงว่าตลาดรับรู้แบบนั้นจริง รายงานการจ้างงานวันศุกร์ตอนนี้คือปัจจัยชี้ขาดสองทาง — ตัวเลขแข็งแกร่งจะเปิดประเด็นขึ้นดอกเบี้ยอีกครั้ง ตัวเลขอ่อนแอน่าจะตอกย้ำการเปลี่ยนท่าที ไม่ว่าทางไหน คูปองที่ยังสูงอยู่วันนี้ดูเหมือนหน้าต่างโอกาสที่กำลังปิดลง มากกว่าจะเป็นระดับที่มั่นคง`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`Fed officials are now genuinely split: Waller's "give disinflation a chance" stance Thursday contrasts with hawks like Warsh who remain focused on sticky inflation, while oil's climb toward $95.82/bbl on the widening Iran conflict keeps stacking an independent, energy-driven inflation risk. <b>Inflation and rate-path views inside the Fed itself are now visibly diverging,</b> making the September 16 decision genuinely a coin flip.`, th:`เจ้าหน้าที่เฟดตอนนี้แบ่งฝ่ายกันจริง: ท่าที "ให้โอกาสเงินเฟ้อชะลอตัว" ของวอลเลอร์วันพฤหัสฯ ตรงข้ามกับฝ่ายเหยี่ยวอย่างวอร์ชที่ยังคงโฟกัสเงินเฟ้อเหนียว ขณะน้ำมันที่ไต่ขึ้นสู่ $95.82 ต่อบาร์เรลจากความขัดแย้งอิหร่านที่ขยายวง ยังคงซ้อนทับความเสี่ยงเงินเฟ้อจากพลังงานที่เป็นอิสระต่อกัน <b>มุมมองเงินเฟ้อและทิศทางดอกเบี้ยภายในเฟดเองตอนนี้แยกทางกันชัดเจน</b> ทำให้การตัดสินใจวันที่ 16 ก.ย. เป็นเรื่องใกล้เคียง 50-50 จริง ๆ`}, w:{en:`A visibly split Fed, with energy prices still climbing independently, is exactly the environment where "we don't know which way this breaks" is the honest and useful message to clients — and where locking in known bond income now removes one variable from an otherwise genuinely uncertain call.`, th:`เฟดที่แบ่งฝ่ายกันชัดเจน ขณะราคาพลังงานยังคงไต่ขึ้นอย่างเป็นอิสระ คือสภาวะที่ข้อความ "เรายังไม่รู้ว่าจะออกทางไหน" เป็นข้อความที่ตรงไปตรงมาและมีประโยชน์กับลูกค้า และเป็นจังหวะที่การล็อกรายได้ตราสารหนี้ที่รู้แน่นอนตอนนี้ช่วยขจัดตัวแปรหนึ่งออกจากการคาดการณ์ที่ไม่แน่นอนจริง ๆ`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu",th:"พฤหัสฯ"}, imp:"h", t:{en:"Waller signals a hold; Wall St's best day since Aug 4, hike odds crash to a coin flip",th:"วอลเลอร์ส่งสัญญาณคงดอกเบี้ย วอลล์สตรีทบวกแรงสุดตั้งแต่ 4 ส.ค. โอกาสขึ้นดอกเบี้ยร่วงเหลือ 50-50"}, d:{en:"Fed Governor Waller said he could support holding rates steady in September, telling markets to \"give disinflation a chance.\" September hike odds collapsed ~12 points to roughly 50–55% from ~63%. The S&P 500 jumped 1.06% to 7,747.71, its best day since Aug 4; the 10-year yield fell to ~4.76% and gold jumped 2% toward $4,500. Oil stayed bid as Iran struck Kuwait and Bahrain with drones for a second night.",th:"ผู้ว่าการเฟด วอลเลอร์ ระบุอาจสนับสนุนคงดอกเบี้ยเดือน ก.ย. บอกตลาดให้ \"ให้โอกาสเงินเฟ้อชะลอตัว\" โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ร่วงลงราว 12 จุด เหลือราว 50–55% จากราว 63% ดัชนี S&P 500 พุ่งขึ้น 1.06% สู่ 7,747.71 บวกแรงสุดตั้งแต่ 4 ส.ค. ผลตอบแทนพันธบัตร 10 ปีลดลงสู่ราว 4.76% และทองคำพุ่งขึ้น 2% เข้าใกล้ $4,500 ราคาน้ำมันยังคงได้แรงหนุนหลังอิหร่านโจมตีคูเวตและบาห์เรนด้วยโดรนเป็นคืนที่สอง"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed",th:"พุธ"}, imp:"m", t:{en:"US strikes Iran directly; Wall St rallies as weak jobs data cools Fed bets to ~61%",th:"สหรัฐโจมตีอิหร่านโดยตรง วอลล์สตรีทกลับบวก หลังตัวเลขจ้างงานอ่อนแอลดแรงเดิมพันขึ้นดอกเบี้ยเฟดเหลือราว 61%"}, d:{en:"The US carried out \"large and powerful\" strikes on Iranian military targets near Hormuz and Iran retaliated, sending Brent above $94. Yet US stocks rallied (S&P +0.46%, led by Nvidia +3.8%) after ADP showed just 38,000 August private-payroll additions — the weakest since January — pulling September hike odds down to roughly 60–64% from 68%. A separate AI-chip selloff hit Asia hard (Nikkei −2.53%).",th:"สหรัฐฯ โจมตี \"การโจมตีที่ทรงพลัง\" ต่อเป้าหมายทางทหารของอิหร่านใกล้ฮอร์มุซ และอิหร่านตอบโต้กลับ ดันเบรนท์ทะลุ $94 แต่หุ้นสหรัฐฯ กลับบวก (S&P เพิ่มขึ้น 0.46% นำโดย Nvidia ที่พุ่ง 3.8%) หลัง ADP ชี้จ้างงานภาคเอกชนเดือน ส.ค. เพิ่มเพียง 38,000 ตำแหน่ง ต่ำสุดตั้งแต่ ม.ค. ดันโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเหลือราว 60–64% จาก 68% ขณะหุ้นชิป AI เอเชียเทขายหนักแยกต่างหาก (Nikkei ลดลง 2.53%)"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue",th:"อังคาร"}, imp:"m", t:{en:"10Y yield closes at 4.79% (5th straight rise); Wall St falls a 3rd day, hike odds hit 68%",th:"พันธบัตร 10 ปีปิดที่ 4.79% (ขึ้นต่อเนื่องวันที่ 5); วอลล์สตรีทร่วงวันที่ 3 โอกาสขึ้นดอกเบี้ยแตะ 68%"}, d:{en:"Chip stocks led a third straight session of US losses (S&P −0.71%, Nasdaq −1.03%) as Trump's continued Iran threats kept oil climbing (Brent +0.87% to $91.28) and pushed the 10-year Treasury yield to 4.79%, its highest close since Jan 2025. Gold extended its slide to $4,358.74, a two-week low.",th:"หุ้นกลุ่มชิปนำการปรับลงของสหรัฐฯ ต่อเนื่องเป็นวันที่สาม (S&P ลดลง 0.71%, Nasdaq ลดลง 1.03%) หลังทรัมป์ยังคงขู่โจมตีอิหร่านต่อเนื่อง ดันน้ำมันขึ้นต่อ (เบรนท์เพิ่มขึ้น 0.87% สู่ $91.28) และดันผลตอบแทนพันธบัตร 10 ปีสู่ 4.79% ระดับปิดสูงสุดตั้งแต่ ม.ค. 2025 ทองคำร่วงต่อลงสู่ $4,358.74 ต่ำสุดในรอบสองสัปดาห์"}},
    {day:{en:"Fri",th:"ศุกร์"}, date:{en:"Sep 4",th:"4 ก.ย."}, imp:"h", t:{en:"US August jobs report, due later today — decisive test after Waller's dovish pivot",th:"รายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ ออกวันนี้ — บททดสอบชี้ขาดหลังท่าทีผ่อนคลายของวอลเลอร์"}, d:{en:"With September hike odds now near a coin flip (~50–55%) after Waller's remarks, consensus expects payrolls around +53–58k and unemployment steady at 4.1%. A strong report could reopen the hike debate; a soft one would likely cement the dovish pivot ahead of the Fed's September 16 decision.",th:"เมื่อโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ตอนนี้ใกล้เคียง 50-50 (ราว 50–55%) หลังคำพูดของวอลเลอร์ ตลาดคาดการณ์จ้างงานเพิ่มราว 53,000–58,000 ตำแหน่ง และอัตราว่างงานทรงตัวที่ 4.1% หากตัวเลขออกมาแข็งแกร่งอาจเปิดประเด็นขึ้นดอกเบี้ยอีกครั้ง ขณะหากอ่อนแอน่าจะตอกย้ำท่าทีผ่อนคลายของเฟด ก่อนการตัดสินใจวันที่ 16 ก.ย."}},

    {code:"UUSTECH", name:{en:"United US Technology Fund",th:"United US Technology Fund"}, rk:{en:"US tech · high risk",th:"หุ้นเทคสหรัฐ · เสี่ยงสูง"}, desc:{en:"US technology & semiconductor leaders — the AI / chip growth theme, bought in baht.",th:"ผู้นำเทคโนโลยีและเซมิคอนดักเตอร์สหรัฐ — ธีมการเติบโต AI / ชิป ซื้อได้ด้วยเงินบาท"}, now:{en:"Nvidia extended its gain (+1% to $227.69) Thursday as the Fed's dovish pivot lifted risk assets broadly, but Broadcom gave back some of Wednesday's pop as investors kept digesting its soft Q4 guide — a reminder that even within AI, stock-picking risk stays real even as the macro backdrop turns friendlier. A diversified, US-anchored tech fund like UUSTECH captures the sector tailwind from lower yields without betting on any single name's guidance.",th:"Nvidia บวกต่อเนื่อง (เพิ่มขึ้น 1% สู่ $227.69) วันพฤหัสฯ ขณะท่าทีผ่อนคลายของเฟดหนุนสินทรัพย์เสี่ยงในวงกว้าง แต่ Broadcom คืนกำไรบางส่วนจากวันพุธ ขณะนักลงทุนยังคงย่อยข่าวแนวโน้มไตรมาส 4 ที่อ่อนกว่าคาด เป็นเครื่องเตือนใจว่าแม้แต่ในธีม AI ความเสี่ยงจากการเลือกหุ้นรายตัวยังคงมีอยู่จริง แม้บรรยากาศเศรษฐกิจมหภาคจะเป็นมิตรมากขึ้น กองทุนเทคที่กระจายความเสี่ยงและมีฐานในสหรัฐฯ อย่าง UUSTECH จับแรงหนุนของกลุ่มอุตสาหกรรมจากผลตอบแทนพันธบัตรที่ลดลง โดยไม่ต้องเดิมพันกับแนวโน้มของหุ้นตัวใดตัวหนึ่ง"}, hold:["US tech","Semis","AI"]},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('s-prices').textContent=t(S.sPrices); $('h-prices').textContent=t(S.hPrices); $('pricenote').textContent=t(S.pricenote);
    $('b-sell').textContent=t(S.bSell); $('s-funds').textContent=t(S.sFunds); $('h-funds').textContent=t(S.hFunds);
    $('sh-off').innerHTML=`${t(S.shOff)} <small>${t(S.shOffSub)}</small>`; $('sh-on').innerHTML=`${t(S.shOn)} <small>${t(S.shOnSub)}</small>`;
    $('s-talk').textContent=t(S.sTalk); $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`<div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div><div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div><div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน และค่าเงิน':'US Treasuries, gold, oil & FX',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p>${f.now?`<div class="fnow"><span>${L==='th'?'ทำไมตอนนี้':'Why now'}</span>${t(f.now)}</div>`:''}<div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');
    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
