<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Wall Street Rebounds as Yields Slip Below 5% and Oil Eases — Nasdaq Jumps 1.6% While the Bank of Japan's Decision Looms", th:"วอลล์สตรีทดีดตัว ผลตอบแทนพันธบัตรหลุด 5% น้ำมันย่อตัว — Nasdaq พุ่ง 1.6% ขณะรอผลการตัดสินใจของธนาคารกลางญี่ปุ่น"},
    heroDeck:{en:`US stocks rebounded sharply Thursday from Wednesday's Fed-hike selloff: the Dow Jones Industrial Average rose 316.14 points (+0.61%) to 51,778.04, the S&P 500 gained 0.59% to 7,596.36, and the Nasdaq Composite jumped 1.60% to 26,395.18 as chipmakers and "Magnificent Seven" names led a tech-driven rally. The 10-year Treasury yield slipped back below 5% to roughly 4.94%, with the 2-year near 4.73% and the 30-year near 5.34%, easing some of the pressure that hit equities a day earlier. Oil retreated on signs the Iran war's supply disruptions could ease — WTI fell 2.2% to $101.91/bbl and Brent fell 3.8% to $104.82/bbl — even as the conflict remains, per the IEA, the largest oil-supply disruption in market history; gold rebounded 1.4% to $4,301.40/oz. President Trump escalated his pressure campaign on Chair Kevin Warsh, threatening to halt trade with countries that run surpluses with the US unless the Fed cuts rates, but the FOMC's own statement pointed to tariffs, the Iran-war energy shock and AI-capex spending as the forces keeping inflation elevated. Asia and Europe, trading in their own Thursday sessions, were mixed: Germany's DAX rose 0.53% to roughly 25,538, Japan's Nikkei 225 added 0.33% to 64,136.25, Hong Kong's Hang Seng slipped 0.44% to 24,604.29, and mainland China's Shanghai Composite eased 0.41% to roughly 3,875.60. Thailand's SET Index jumped 1.32% (+20.61 pts) to 1,583.34 on turnover of about THB 62.46bn as sentiment improved now that the Fed's decision is behind it. Next up: the Bank of Japan wraps up its own two-day meeting today, with the policy statement and Governor's press conference expected this afternoon Tokyo time.`, th:`หุ้นสหรัฐฯ ดีดตัวขึ้นแรงในวันพฤหัสบดี ฟื้นตัวจากแรงเทขายรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ โดยดัชนี Dow Jones เพิ่มขึ้น 316.14 จุด (+0.61%) สู่ 51,778.04 ดัชนี S&P 500 เพิ่มขึ้น 0.59% สู่ 7,596.36 และดัชนี Nasdaq Composite พุ่งขึ้น 1.60% สู่ 26,395.18 นำโดยหุ้นกลุ่มชิปและกลุ่ม "Magnificent Seven" ที่หนุนแรงซื้อกลุ่มเทคโนโลยี ผลตอบแทนพันธบัตร 10 ปีไต่ลงหลุดระดับ 5% สู่ราว 4.94% ขณะพันธบัตร 2 ปียืนใกล้ 4.73% และพันธบัตร 30 ปียืนใกล้ 5.34% ช่วยคลายแรงกดดันที่กระทบหุ้นเมื่อวันก่อน ราคาน้ำมันย่อตัวลงจากสัญญาณว่าปัญหาด้านอุปทานจากสงครามอิหร่านอาจคลี่คลาย — WTI ลดลง 2.2% สู่ $101.91 ต่อบาร์เรล และเบรนท์ลดลง 3.8% สู่ $104.82 ต่อบาร์เรล แม้ความขัดแย้งนี้จะยังคงเป็นภาวะชะงักงันด้านอุปทานน้ำมันครั้งใหญ่ที่สุดในประวัติศาสตร์ตลาดตามการประเมินของ IEA ขณะทองคำดีดตัวขึ้น 1.4% สู่ $4,301.40 ต่อออนซ์ ประธานาธิบดีทรัมป์ทวีความรุนแรงของแคมเปญกดดันประธานเควิน วอร์ช โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลการค้ากับสหรัฐฯ หากเฟดไม่ลดดอกเบี้ย แต่แถลงการณ์ของ FOMC เองชี้ว่าภาษีศุลกากร ผลกระทบด้านพลังงานจากสงครามอิหร่าน และการลงทุนด้าน AI คือปัจจัยที่ทำให้เงินเฟ้อยังคงอยู่ในระดับสูง ตลาดเอเชียและยุโรปซึ่งเทรดในเซสชันวันพฤหัสบดีของตัวเอง เคลื่อนไหวคละกัน: ดัชนี DAX เยอรมนีเพิ่มขึ้น 0.53% สู่ราว 25,538 ดัชนี Nikkei 225 ญี่ปุ่นเพิ่มขึ้น 0.33% สู่ 64,136.25 ดัชนี Hang Seng ฮ่องกงลดลง 0.44% สู่ 24,604.29 และดัชนี Shanghai Composite จีนแผ่นดินใหญ่ลดลง 0.41% สู่ราว 3,875.60 ดัชนี SET ไทยพุ่งขึ้น 1.32% (+20.61 จุด) สู่ 1,583.34 มูลค่าการซื้อขายราว 6.246 หมื่นล้านบาท จากความเชื่อมั่นที่ดีขึ้นหลังผลการตัดสินใจของเฟดผ่านพ้นไปแล้ว ก้าวต่อไปคือธนาคารกลางญี่ปุ่นซึ่งจะสรุปผลการประชุมสองวันของตัวเองวันนี้ โดยคาดว่าจะแถลงนโยบายและมีการแถลงข่าวของผู้ว่าการในช่วงบ่ายตามเวลาโตเกียว`},

    leadtxt:{en:`<b>Wall Street bounced back hard Thursday from Wednesday's Fed-hike selloff, with the S&P 500 up 0.59% to 7,596.36, the Dow up 0.61% (+316.14 pts) to 51,778.04, and the Nasdaq surging 1.60% to 26,395.18 as chip and mega-cap tech names led the rally.</b> The 10-year Treasury yield slipped back below 5% to roughly 4.94%, with the 2-year near 4.73% and the 30-year near 5.34%. Oil eased (WTI -2.2% to $101.91, Brent -3.8% to $104.82) on signs the Iran war's supply disruptions could ease, even as the IEA still calls it the largest oil-supply shock in market history; gold rebounded 1.4% to $4,301.40 as the dollar gave back some of Wednesday's gain. President Trump escalated pressure on Chair Kevin Warsh, threatening to halt trade with surplus countries unless the Fed cuts rates — but the Fed's own statement pinned elevated inflation on tariffs, the Iran-war energy shock and AI-capex spending, not politics. Asia and Europe were mixed in their own Thursday sessions (DAX +0.53%, Nikkei +0.33%, Hang Seng -0.44%, Shanghai -0.41%), while Thailand's SET jumped 1.32% to 1,583.34 as local sentiment improved now that the Fed decision is behind it. For your clients: <b>the real test is still ahead — the Bank of Japan wraps up its own meeting today, and whether Thursday's relief rally holds depends on whether the BOJ, and Friday's Asia/Europe open, deliver a second consecutive risk-on session.</b>`, th:`<b>วอลล์สตรีทดีดตัวขึ้นแรงในวันพฤหัสบดี ฟื้นจากแรงเทขายรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ โดยดัชนี S&P 500 เพิ่มขึ้น 0.59% สู่ 7,596.36 ดัชนี Dow เพิ่มขึ้น 0.61% (+316.14 จุด) สู่ 51,778.04 และดัชนี Nasdaq พุ่งขึ้น 1.60% สู่ 26,395.18 นำโดยหุ้นกลุ่มชิปและกลุ่มเทคโนโลยีขนาดใหญ่</b> ผลตอบแทนพันธบัตร 10 ปีไต่ลงหลุดระดับ 5% สู่ราว 4.94% ขณะพันธบัตร 2 ปียืนใกล้ 4.73% และพันธบัตร 30 ปียืนใกล้ 5.34% ราคาน้ำมันย่อตัวลง (WTI -2.2% สู่ $101.91, เบรนท์ -3.8% สู่ $104.82) จากสัญญาณว่าปัญหาด้านอุปทานจากสงครามอิหร่านอาจคลี่คลาย แม้ IEA จะยังมองว่าเป็นภาวะชะงักงันด้านอุปทานน้ำมันครั้งใหญ่ที่สุดในประวัติศาสตร์ตลาด ขณะทองคำดีดตัวขึ้น 1.4% สู่ $4,301.40 เมื่อดอลลาร์คืนกำไรบางส่วนจากวันพุธ ประธานาธิบดีทรัมป์ทวีความรุนแรงของแรงกดดันต่อประธานเควิน วอร์ช โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลการค้ากับสหรัฐฯ หากเฟดไม่ลดดอกเบี้ย — แต่แถลงการณ์ของเฟดเองชี้ว่าเงินเฟ้อที่สูงมาจากภาษีศุลกากร ผลกระทบด้านพลังงานจากสงครามอิหร่าน และการลงทุนด้าน AI ไม่ใช่เรื่องการเมือง ตลาดเอเชียและยุโรปเคลื่อนไหวคละกันในเซสชันวันพฤหัสบดีของตัวเอง (DAX +0.53%, Nikkei +0.33%, Hang Seng -0.44%, Shanghai -0.41%) ขณะ SET ไทยพุ่งขึ้น 1.32% สู่ 1,583.34 จากความเชื่อมั่นในประเทศที่ดีขึ้นหลังผลการตัดสินใจของเฟดผ่านพ้นไปแล้ว สำหรับลูกค้าของคุณ: <b>บททดสอบที่แท้จริงยังมาไม่ถึง — ธนาคารกลางญี่ปุ่นจะสรุปผลการประชุมของตัวเองวันนี้ และการดีดตัวของตลาดวันพฤหัสบดีจะยืนได้หรือไม่ ขึ้นอยู่กับว่า BOJ และตลาดเอเชีย/ยุโรปที่เปิดวันศุกร์ จะส่งมอบเซสชันเปิดรับความเสี่ยงต่อเนื่องเป็นวันที่สองได้หรือไม่</b>`},

    watchnote:{en:`US stocks bounced back hard Thursday from Wednesday's Fed-hike selloff — the S&P 500 +0.59% to 7,596.36, the Dow +0.61% to 51,778.04, and the Nasdaq +1.60% to 26,395.18 — as the 10-year Treasury yield slipped back below 5% and oil eased on hopes the Iran war's supply disruptions could ease. The Bank of Japan wraps up its own two-day meeting today, Sep 17-18 — a rare back-to-back week for the world's two most-watched central banks — with the policy statement and Governor's press conference due this afternoon Tokyo time, still pending as of this morning. <b style="color:var(--muted)">The Bank of Japan's decision</b> is the key event left this week — watch whether it, and Friday's Asia/Europe open, extend Thursday's relief rally or reignite the volatility of the past two weeks.`,
      th:`หุ้นสหรัฐฯ ดีดตัวขึ้นแรงในวันพฤหัสบดี ฟื้นจากแรงเทขายรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ — S&P 500 +0.59% สู่ 7,596.36, Dow +0.61% สู่ 51,778.04, Nasdaq +1.60% สู่ 26,395.18 — ขณะผลตอบแทนพันธบัตร 10 ปีไต่ลงหลุดระดับ 5% และราคาน้ำมันย่อตัวลงจากความหวังว่าปัญหาด้านอุปทานจากสงครามอิหร่านอาจคลี่คลาย ธนาคารกลางญี่ปุ่น (BOJ) จะสรุปผลการประชุมสองวันของตัวเองวันนี้ 17-18 ก.ย. นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก โดยจะแถลงนโยบายและมีการแถลงข่าวของผู้ว่าการช่วงบ่ายตามเวลาโตเกียว ซึ่งยังไม่ประกาศผล ณ เช้านี้ <b style="color:var(--muted)">การตัดสินใจของธนาคารกลางญี่ปุ่น</b> คือเหตุการณ์สำคัญที่เหลืออยู่ของสัปดาห์นี้ — ควรจับตาว่า BOJ และตลาดเอเชีย/ยุโรปที่เปิดวันศุกร์ จะต่อยอดการดีดตัวของตลาดวันพฤหัสบดี หรือจะกลับสู่ความผันผวนของสองสัปดาห์ที่ผ่านมา`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,596.36", chg:0.59, series:[7551.81,7596.36],
      txt:{en:`<b>US stocks rebounded Thursday from Wednesday's Fed-hike selloff: the S&P 500 +0.59% to 7,596.36, the Dow +0.61% (+316.14 pts) to 51,778.04, the Nasdaq +1.60% to 26,395.18.</b> The 10-year Treasury yield slipped back below 5% to roughly 4.94% as chip and mega-cap tech names led the rally.`, th:`<b>หุ้นสหรัฐฯ ดีดตัวขึ้นในวันพฤหัสบดี ฟื้นจากแรงเทขายรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ: S&P 500 +0.59% สู่ 7,596.36, Dow +0.61% (+316.14 จุด) สู่ 51,778.04, Nasdaq +1.60% สู่ 26,395.18</b> ผลตอบแทนพันธบัตร 10 ปีไต่ลงหลุดระดับ 5% สู่ราว 4.94% นำโดยหุ้นกลุ่มชิปและกลุ่มเทคโนโลยีขนาดใหญ่`},
      why:{en:`The bounce shows Wednesday's selloff was more about Warsh's hawkish tone than a fundamental repricing of risk — once the 10-year eased back below 5%, buyers returned to the same tech names that had been sold off. Trump's escalating threat to halt trade with surplus countries unless the Fed cuts rates is a fresh wildcard for clients to watch, even as the Fed's own statement blames tariffs, the Iran war and AI capex — not politics — for elevated inflation. The Bank of Japan's decision today is the next test of whether this relief rally has legs.`, th:`การดีดตัวนี้แสดงว่าแรงเทขายวันพุธเกี่ยวข้องกับท่าทีสายเหยี่ยวของวอร์ชมากกว่าการประเมินความเสี่ยงใหม่ทั้งระบบ — เมื่อผลตอบแทนพันธบัตร 10 ปีย่อลงหลุด 5% นักลงทุนก็กลับเข้าซื้อหุ้นเทคกลุ่มเดิมที่เพิ่งถูกเทขาย การที่ทรัมป์ทวีความรุนแรงของการขู่หยุดการค้ากับประเทศที่เกินดุลหากเฟดไม่ลดดอกเบี้ย เป็นปัจจัยเสี่ยงใหม่ที่ลูกค้าควรจับตา แม้แถลงการณ์ของเฟดเองจะโทษภาษีศุลกากร สงครามอิหร่าน และการลงทุนด้าน AI ว่าเป็นสาเหตุของเงินเฟ้อสูง ไม่ใช่การเมือง การตัดสินใจของธนาคารกลางญี่ปุ่นวันนี้คือบททดสอบถัดไปว่าการดีดตัวครั้งนี้จะยืนได้หรือไม่`},
      full:{en:`US stocks rebounded sharply Thursday, clawing back most of Wednesday's Fed-hike losses. The S&P 500 rose 0.59% to close at 7,596.36, the Dow Jones Industrial Average gained 316.14 points (+0.61%) to 51,778.04, and the Nasdaq Composite jumped 1.60% to 26,395.18, led by chipmakers and "Magnificent Seven" names. The 10-year Treasury yield slipped back below 5% to roughly 4.94%, with the 2-year near 4.73% and the 30-year near 5.34%, as some of Wednesday's hawkish repricing unwound. Oil eased on signs the Iran war's supply disruptions could moderate — WTI fell 2.2% to $101.91/bbl and Brent fell 3.8% to $104.82/bbl — even as the IEA still calls the conflict the largest oil-supply disruption in market history. Gold rebounded 1.4% to $4,301.40/oz. President Trump escalated his pressure campaign on Chair Kevin Warsh, threatening to halt trade with countries running surpluses with the US unless the Fed cuts rates, calling Warsh "great" while urging him to "get smart." The Fed's own post-decision statement, however, pointed to tariffs, the Iran-war energy shock and AI-capex spending — not political pressure — as the forces keeping inflation elevated. The Bank of Japan wraps up its own two-day meeting September 17-18, with its decision due this afternoon Tokyo time.`, th:`หุ้นสหรัฐฯ ดีดตัวขึ้นแรงในวันพฤหัสบดี ทวงคืนผลขาดทุนส่วนใหญ่จากการปรับลงรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ ดัชนี S&P 500 เพิ่มขึ้น 0.59% ปิดที่ 7,596.36 ดัชนี Dow Jones เพิ่มขึ้น 316.14 จุด (+0.61%) สู่ 51,778.04 และดัชนี Nasdaq Composite พุ่งขึ้น 1.60% สู่ 26,395.18 นำโดยหุ้นกลุ่มชิปและกลุ่ม "Magnificent Seven" ผลตอบแทนพันธบัตร 10 ปีไต่ลงหลุดระดับ 5% สู่ราว 4.94% ขณะพันธบัตร 2 ปียืนใกล้ 4.73% และพันธบัตร 30 ปียืนใกล้ 5.34% เมื่อการปรับราคารับท่าทีสายเหยี่ยวบางส่วนของวันพุธคลี่คลายลง ราคาน้ำมันย่อตัวลงจากสัญญาณว่าปัญหาด้านอุปทานจากสงครามอิหร่านอาจบรรเทาลง — WTI ลดลง 2.2% สู่ $101.91 ต่อบาร์เรล และเบรนท์ลดลง 3.8% สู่ $104.82 ต่อบาร์เรล แม้ IEA จะยังมองว่าความขัดแย้งนี้เป็นภาวะชะงักงันด้านอุปทานน้ำมันครั้งใหญ่ที่สุดในประวัติศาสตร์ตลาด ทองคำดีดตัวขึ้น 1.4% สู่ $4,301.40 ต่อออนซ์ ประธานาธิบดีทรัมป์ทวีความรุนแรงของแคมเปญกดดันประธานเควิน วอร์ช โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลการค้ากับสหรัฐฯ หากเฟดไม่ลดดอกเบี้ย พร้อมเรียกวอร์ชว่า "ยอดเยี่ยม" ขณะกระตุ้นให้เขา "ฉลาดหน่อย" อย่างไรก็ตาม แถลงการณ์ของเฟดเองหลังการตัดสินใจชี้ว่าภาษีศุลกากร ผลกระทบด้านพลังงานจากสงครามอิหร่าน และการลงทุนด้าน AI — ไม่ใช่แรงกดดันทางการเมือง — คือปัจจัยที่ทำให้เงินเฟ้อยังคงอยู่ในระดับสูง ธนาคารกลางญี่ปุ่นจะสรุปผลการประชุมสองวันของตัวเองวันที่ 17-18 กันยายน โดยจะประกาศผลช่วงบ่ายตามเวลาโตเกียว`},
      sources:[{l:"CNBC — Stocks surge as oil and bond yields retreat, recovering from Fed-induced sell-off",u:"https://www.cnbc.com/2026/09/16/stock-market-today-live-updates.html"},{l:"CNBC — Oil prices today: WTI, Brent, Hormuz, Iran war",u:"https://www.cnbc.com/2026/09/17/oil-prices-today-wti-brent-hormuz-iran-war.html"},{l:"CNBC — Trump escalates pressure on Fed Chair Warsh over rates",u:"https://www.cnbc.com/2026/09/05/trump-warsh-fed-september-rate-hike.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,538.00", chg:0.53, series:[25264.88,25538.00],
      txt:{en:`<b>DAX rose 0.53% to roughly 25,538 Thursday,</b> its first full session to price in the Fed's hike and Chair Kevin Warsh's hawkish inflation comments, as easing Treasury yields and oil prices supported risk appetite.`, th:`<b>DAX เพิ่มขึ้น 0.53% สู่ราว 25,538 วันพฤหัสบดี</b> เป็นเซสชันเต็มรูปแบบครั้งแรกที่สะท้อนการขึ้นดอกเบี้ยของเฟดและถ้อยแถลงสายเหยี่ยวของประธานเควิน วอร์ช ในราคา โดยได้แรงหนุนจากผลตอบแทนพันธบัตรและราคาน้ำมันที่ย่อตัวลง`},
      why:{en:`Europe's modest Thursday gain, echoing Wall Street's own rebound, suggests the region is reading the Fed's hike as manageable now that yields have eased back below 5% — a calmer read-through than Wednesday's Wall Street selloff implied. Watch whether the DAX can extend gains once the Bank of Japan's decision lands this afternoon.`, th:`การที่ยุโรปปรับขึ้นเล็กน้อยวันพฤหัสบดี สอดคล้องกับการดีดตัวของวอลล์สตรีทเอง บ่งชี้ว่าภูมิภาคนี้มองการขึ้นดอกเบี้ยของเฟดว่าจัดการได้ เมื่อผลตอบแทนพันธบัตรย่อตัวลงหลุด 5% แล้ว ซึ่งเป็นการตีความที่ผ่อนคลายกว่าที่แรงเทขายของวอลล์สตรีทวันพุธบ่งชี้ ควรจับตาว่า DAX จะต่อยอดการปรับขึ้นได้หรือไม่ เมื่อผลการตัดสินใจของธนาคารกลางญี่ปุ่นออกมาช่วงบ่ายวันนี้`},
      full:{en:`European shares rose Thursday, with Germany's DAX closing up 0.53% at roughly 25,538 — its first full session to digest the Fed's quarter-point hike and Chair Kevin Warsh's hawkish inflation comments from Wednesday. The gain came as the 10-year Treasury yield slipped back below 5% and oil eased on signs the Iran war's supply disruptions could moderate, both of which supported broader risk appetite. Attention now turns to the Bank of Japan's own decision, due this afternoon Tokyo time, as the next catalyst for European trading.`, th:`หุ้นยุโรปปรับขึ้นวันพฤหัสบดี ดัชนี DAX เยอรมนีปิดตลาดเพิ่มขึ้น 0.53% สู่ราว 25,538 เป็นเซสชันเต็มรูปแบบครั้งแรกที่ย่อยข้อมูลการขึ้นดอกเบี้ย 0.25% ของเฟดและถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของประธานเควิน วอร์ช จากวันพุธ การปรับขึ้นนี้เกิดขึ้นขณะผลตอบแทนพันธบัตร 10 ปีไต่ลงหลุดระดับ 5% และราคาน้ำมันย่อตัวลงจากสัญญาณว่าปัญหาด้านอุปทานจากสงครามอิหร่านอาจบรรเทาลง ทั้งสองปัจจัยหนุนความเชื่อมั่นรับความเสี่ยงในวงกว้าง ตอนนี้ต้องจับตาการตัดสินใจของธนาคารกลางญี่ปุ่นเอง ซึ่งจะประกาศช่วงบ่ายตามเวลาโตเกียว เป็นปัจจัยกระตุ้นถัดไปของตลาดยุโรป`},
      sources:[{l:"CNBC — Stocks surge as oil and bond yields retreat, recovering from Fed-induced sell-off",u:"https://www.cnbc.com/2026/09/16/stock-market-today-live-updates.html"},{l:"Newsquawk — Daily European Equity Opening News, 17 September 2026",u:"https://www.newsquawk.com/headlines/newsquawk-daily-european-equity-opening-news---17th-september-2026"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"64,136.25", chg:0.33, series:[63923.00,64136.25],
      txt:{en:`<b>Nikkei 225 added 0.33% to 64,136.25 Thursday,</b> extending Wednesday's gain as Tokyo got its first full session to price in the Fed's hike, with attention now on the Bank of Japan's own decision due this afternoon.`, th:`<b>Nikkei 225 เพิ่มขึ้น 0.33% สู่ 64,136.25 วันพฤหัสบดี</b> ต่อยอดการปรับขึ้นของวันพุธ เป็นเซสชันเต็มรูปแบบครั้งแรกที่โตเกียวสะท้อนการขึ้นดอกเบี้ยของเฟดในราคา ขณะนี้ต้องจับตาผลการตัดสินใจของธนาคารกลางญี่ปุ่นเองที่จะประกาศช่วงบ่ายวันนี้`},
      why:{en:`Tokyo extending its gain rather than giving it back suggests the region is comfortable with the Fed's hike now that Treasury yields have eased below 5% — but the bigger swing factor for Japanese assets is the BOJ's own decision this afternoon, not the Fed's. A hawkish surprise from Governor Ueda could easily overwhelm Thursday's calm.`, th:`การที่โตเกียวต่อยอดการปรับขึ้นแทนที่จะคืนกำไร บ่งชี้ว่าภูมิภาคนี้สบายใจกับการขึ้นดอกเบี้ยของเฟด เมื่อผลตอบแทนพันธบัตรย่อตัวลงหลุด 5% แล้ว แต่ปัจจัยชี้ขาดที่ใหญ่กว่าสำหรับสินทรัพย์ญี่ปุ่นคือผลการตัดสินใจของ BOJ เองช่วงบ่ายวันนี้ ไม่ใช่ของเฟด หากผู้ว่าการอูเอดะส่งสัญญาณสายเหยี่ยวเกินคาด อาจกลบความสงบของวันพฤหัสบดีได้ง่าย`},
      full:{en:`Japanese equities extended their gains Thursday, with the Nikkei 225 rising 0.33% to close at 64,136.25, as Tokyo got its first full session to price in the Fed's Wednesday hike and Chair Kevin Warsh's hawkish inflation comments alongside a broader global rebound in risk appetite. Attention now turns squarely to the Bank of Japan's own two-day meeting, which wraps up September 17-18 with the policy statement and Governor's press conference due this afternoon Tokyo time — still pending as of this morning.`, th:`หุ้นญี่ปุ่นปรับขึ้นต่อเนื่องวันพฤหัสบดี ดัชนี Nikkei 225 เพิ่มขึ้น 0.33% ปิดที่ 64,136.25 เป็นเซสชันเต็มรูปแบบครั้งแรกที่โตเกียวสะท้อนการขึ้นดอกเบี้ยของเฟดวันพุธและถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของประธานเควิน วอร์ช ในราคา ควบคู่กับความเชื่อมั่นรับความเสี่ยงที่ฟื้นตัวทั่วโลก ตอนนี้ต้องจับตาการประชุมสองวันของธนาคารกลางญี่ปุ่นเอง ซึ่งจะสรุปผลวันที่ 17-18 ก.ย. โดยจะแถลงนโยบายและมีการแถลงข่าวของผู้ว่าการช่วงบ่ายตามเวลาโตเกียว ซึ่งยังไม่ประกาศผล ณ เช้านี้`},
      sources:[{l:"Trading Economics — Japan",u:"https://tradingeconomics.com/japan/stock-market"},{l:"CNBC — Stocks surge as oil and bond yields retreat, recovering from Fed-induced sell-off",u:"https://www.cnbc.com/2026/09/16/stock-market-today-live-updates.html"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,604.29", chg:-0.44, series:[24713.78,24604.29],
      txt:{en:`<b>Hang Seng slipped 0.44% to 24,604.29 Thursday, while the Shanghai Composite eased a similar 0.41% to roughly 3,875.60</b> — a rare divergence from the global relief rally, even as Wall Street and Europe rebounded.`, th:`<b>Hang Seng ลดลง 0.44% สู่ 24,604.29 วันพฤหัสบดี ขณะ Shanghai Composite ลดลงใกล้เคียงกันที่ 0.41% สู่ราว 3,875.60</b> — เป็นการสวนทางกับการดีดตัวรับความเสี่ยงทั่วโลกที่หาได้ยาก แม้วอลล์สตรีทและยุโรปจะฟื้นตัว`},
      why:{en:`China and Hong Kong underperforming while the rest of the world rallied on easing yields suggests local factors — not the Fed — are driving sentiment there, possibly profit-taking after a strong run or lingering trade-tension concerns given Trump's fresh tariff threats this week. Worth flagging to clients as a divergence to watch rather than a global risk-off signal.`, th:`การที่จีนและฮ่องกงปรับลงสวนทางกับตลาดโลกที่ดีดตัวรับผลตอบแทนพันธบัตรที่ย่อลง บ่งชี้ว่าปัจจัยภายในภูมิภาค ไม่ใช่เฟด กำลังขับเคลื่อนความเชื่อมั่นที่นั่น อาจเป็นแรงขายทำกำไรหลังปรับขึ้นแรงมาก่อน หรือความกังวลเรื่องความตึงเครียดทางการค้าที่ยังค้างอยู่ จากการขู่ภาษีศุลกากรรอบใหม่ของทรัมป์สัปดาห์นี้ ควรแจ้งลูกค้าว่านี่เป็นความแตกต่างที่ควรจับตา มากกว่าสัญญาณหลีกเลี่ยงความเสี่ยงทั่วโลก`},
      full:{en:`Hong Kong and mainland China both slipped Thursday even as Wall Street and Europe rebounded: the Hang Seng fell 0.44% to close at 24,604.29, while the Shanghai Composite eased 0.41% to roughly 3,875.60. The divergence stands out against a broader global relief rally driven by easing Treasury yields and oil prices, and comes as President Trump escalated tariff and trade-surplus threats against the Fed and its trading partners this week. Both markets remain on watch for how they react to the Bank of Japan's decision this afternoon and to any fresh developments on US-China trade.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่ปรับลงทั้งคู่วันพฤหัสบดี แม้วอลล์สตรีทและยุโรปจะฟื้นตัว: ดัชนี Hang Seng ลดลง 0.44% ปิดที่ 24,604.29 ขณะดัชนี Shanghai Composite ลดลง 0.41% สู่ราว 3,875.60 ความแตกต่างนี้โดดเด่นเมื่อเทียบกับการดีดตัวรับความเสี่ยงทั่วโลกที่ได้แรงหนุนจากผลตอบแทนพันธบัตรและราคาน้ำมันที่ย่อตัวลง และเกิดขึ้นขณะประธานาธิบดีทรัมป์ทวีความรุนแรงของการขู่ภาษีศุลกากรและประเด็นดุลการค้ากับเฟดและคู่ค้าสัปดาห์นี้ ทั้งสองตลาดยังคงต้องจับตาปฏิกิริยาต่อผลการตัดสินใจของธนาคารกลางญี่ปุ่นช่วงบ่ายวันนี้ และความคืบหน้าใด ๆ เรื่องการค้าสหรัฐฯ-จีน`},
      sources:[{l:"Trading Economics — China",u:"https://tradingeconomics.com/china/stock-market"},{l:"24/7 Wall St. — Hang Seng closes down 0.63% as selling pressure hits Hong Kong harder than Shanghai",u:"https://247wallst.com/cards/hong-kong-took-the-harder-hit-at-the-close-with-the-hang-se-hsi-market-bell-01m2q6ac8kvzd7evewvfc5a0p5"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,583.34", chg:1.32, series:[1562.73,1583.34],
      txt:{en:`<b>SET Index jumped 1.32% to 1,583.34 Thursday (+20.61pts),</b> on turnover of about THB 62.46bn, as investor sentiment improved now that the Fed's rate decision is behind the market.`, th:`<b>ดัชนี SET เพิ่มขึ้น 1.32% สู่ 1,583.34 วันพฤหัสบดี (+20.61 จุด)</b> มูลค่าการซื้อขายราว 6.246 หมื่นล้านบาท จากความเชื่อมั่นของนักลงทุนที่ดีขึ้น หลังผลการตัดสินใจอัตราดอกเบี้ยของเฟดผ่านพ้นไปแล้ว`},
      why:{en:`The SET's rebound tracks the same relief seen in the US and Europe — with the Fed hike now a known quantity and Treasury yields easing, Thai investors are back to buying after two down sessions on local energy and tourism-policy news. Watch whether gains hold as the market also has to digest the Bank of Japan's decision today.`, th:`การดีดตัวของ SET สอดคล้องกับความโล่งใจที่เห็นในสหรัฐฯ และยุโรป — เมื่อการขึ้นดอกเบี้ยของเฟดกลายเป็นเรื่องที่รับรู้แล้ว และผลตอบแทนพันธบัตรย่อตัวลง นักลงทุนไทยกลับเข้าซื้ออีกครั้งหลังปรับลงสองเซสชันจากข่าวพลังงานและนโยบายท่องเที่ยวในประเทศ ควรจับตาว่าการปรับขึ้นจะยืนได้หรือไม่ เมื่อตลาดต้องย่อยผลการตัดสินใจของธนาคารกลางญี่ปุ่นวันนี้ด้วย`},
      full:{en:`Thailand's SET Index closed Thursday at 1,583.34, up 20.61 points (+1.32%), on turnover of about THB 62.46 billion, recovering all of Wednesday's decline as investor sentiment improved with the Fed's rate decision now behind the market. The rebound tracked a broader global relief rally driven by easing Treasury yields and oil prices, rather than any specific new domestic catalyst. Attention now turns to the Bank of Japan's Sep 17-18 decision and to whether Friday's session can extend this week's gains.`, th:`ดัชนี SET ของไทยปิดตลาดวันพฤหัสบดีที่ 1,583.34 เพิ่มขึ้น 20.61 จุด (+1.32%) มูลค่าการซื้อขายราว 6.246 หมื่นล้านบาท ทวงคืนผลขาดทุนทั้งหมดของวันพุธ เมื่อความเชื่อมั่นของนักลงทุนดีขึ้นหลังผลการตัดสินใจอัตราดอกเบี้ยของเฟดผ่านพ้นไปแล้ว การดีดตัวนี้สอดคล้องกับการฟื้นตัวรับความเสี่ยงทั่วโลกที่ได้แรงหนุนจากผลตอบแทนพันธบัตรและราคาน้ำมันที่ย่อตัวลง มากกว่าปัจจัยกระตุ้นภายในประเทศใหม่โดยเฉพาะ ตอนนี้ต้องจับตาการตัดสินใจของธนาคารกลางญี่ปุ่นวันที่ 17-18 ก.ย. และว่าเซสชันวันศุกร์จะต่อยอดการปรับขึ้นของสัปดาห์นี้ได้หรือไม่`},
      sources:[{l:"Kaohoon International — SET Index Surges as Investor Sentiment Improves Over Fed's Rate Decision",u:"https://www.kaohooninternational.com/set-index/590918"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil eased Thursday on signs the Iran war's supply disruptions could ease — WTI fell 2.2% to $101.91/bbl, Brent fell 3.8% to $104.82/bbl — even as the IEA still calls it the largest oil-supply disruption in market history. Gold rebounded 1.4% to $4,301.40/oz,</b> as the dollar gave back some of Wednesday's Fed-hike gain.`, th:`<b>ราคาน้ำมันย่อตัวลงวันพฤหัสบดี จากสัญญาณว่าปัญหาด้านอุปทานจากสงครามอิหร่านอาจคลี่คลาย — WTI ลดลง 2.2% สู่ $101.91 ต่อบาร์เรล เบรนท์ลดลง 3.8% สู่ $104.82 ต่อบาร์เรล แม้ IEA จะยังมองว่าเป็นภาวะชะงักงันด้านอุปทานน้ำมันครั้งใหญ่ที่สุดในประวัติศาสตร์ตลาด ทองคำดีดตัวขึ้น 1.4% สู่ $4,301.40 ต่อออนซ์</b> เมื่อดอลลาร์คืนกำไรบางส่วนที่ได้จากการขึ้นดอกเบี้ยของเฟดวันพุธ`},
     why:{en:`Oil and gold moving in the same direction — both easing pressure off Wednesday's spike — suggests markets are treating Thursday as a genuine, if tentative, de-escalation signal rather than a one-off dip. But with the Iran war still the IEA's largest-ever oil-supply disruption, this looks more like a pause than a resolution — watch for confirmation of any actual Hormuz de-escalation before treating it as durable.`, th:`การที่น้ำมันและทองคำเคลื่อนไหวไปในทิศทางเดียวกัน — ทั้งคู่คลายแรงกดดันจากที่พุ่งขึ้นวันพุธ — บ่งชี้ว่าตลาดกำลังมองวันพฤหัสบดีเป็นสัญญาณคลี่คลายที่แท้จริง แม้จะยังไม่แน่นอนนัก มากกว่าการย่อตัวเพียงชั่วคราว แต่เมื่อสงครามอิหร่านยังคงเป็นภาวะชะงักงันด้านอุปทานน้ำมันครั้งใหญ่ที่สุดเท่าที่ IEA เคยบันทึกไว้ นี่ดูเหมือนการหยุดพักมากกว่าการคลี่คลายจริง ควรรอการยืนยันการคลี่คลายที่ช่องแคบฮอร์มุซก่อนมองว่าเป็นแนวโน้มที่ยั่งยืน`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>US stocks rebounded Thursday as the 10-year Treasury yield slipped back below 5% to roughly 4.94%,</b> with the 2-year near 4.73% and the 30-year near 5.34%, unwinding some of Wednesday's hawkish repricing after the Fed's first hike in three years. President Trump escalated pressure on Chair Kevin Warsh, threatening to halt trade with surplus countries unless the Fed cuts rates, but the Fed's own statement pointed to tariffs, the Iran-war energy shock and AI-capex spending — not politics — as the drivers of elevated inflation. The Bank of Japan wraps up its own meeting today, Sep 17-18.`, th:`<b>หุ้นสหรัฐฯ ดีดตัวขึ้นวันพฤหัสบดี ขณะผลตอบแทนพันธบัตร 10 ปีไต่ลงหลุดระดับ 5% สู่ราว 4.94%</b> ขณะพันธบัตร 2 ปียืนใกล้ 4.73% และพันธบัตร 30 ปียืนใกล้ 5.34% คลายการปรับราคารับท่าทีสายเหยี่ยวบางส่วนของวันพุธ หลังเฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ประธานาธิบดีทรัมป์ทวีความรุนแรงของแรงกดดันต่อประธานเควิน วอร์ช โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลการค้ากับสหรัฐฯ หากเฟดไม่ลดดอกเบี้ย แต่แถลงการณ์ของเฟดเองชี้ว่าภาษีศุลกากร ผลกระทบด้านพลังงานจากสงครามอิหร่าน และการลงทุนด้าน AI — ไม่ใช่การเมือง — คือปัจจัยที่ทำให้เงินเฟ้อสูง ธนาคารกลางญี่ปุ่นจะสรุปผลการประชุมของตัวเองวันนี้ 17-18 ก.ย.`},
     why:{en:`Yields easing and stocks rallying together shows Thursday was a genuine unwind of Wednesday's hawkish overreaction, not just a technical bounce. But Trump's escalating trade threats against Fed independence are a new risk factor layered on top of the Iran war and tariffs — three separate stories the Fed itself now cites as keeping inflation sticky. The Bank of Japan's decision today is the next test of whether central banks broadly can hold the line.`, th:`การที่ผลตอบแทนพันธบัตรย่อตัวลงพร้อมกับหุ้นดีดตัวขึ้น แสดงว่าวันพฤหัสบดีเป็นการคลี่คลายที่แท้จริงจากปฏิกิริยาสายเหยี่ยวเกินคาดของวันพุธ ไม่ใช่แค่การดีดตัวทางเทคนิค แต่การที่ทรัมป์ทวีความรุนแรงของการขู่การค้าต่อความเป็นอิสระของเฟด เป็นปัจจัยเสี่ยงใหม่ที่ซ้อนทับกับสงครามอิหร่านและภาษีศุลกากร — สามเรื่องราวแยกกันที่เฟดเองอ้างว่าเป็นสาเหตุที่ทำให้เงินเฟ้อยังคงติดสูง การตัดสินใจของธนาคารกลางญี่ปุ่นวันนี้คือบททดสอบถัดไปว่าธนาคารกลางทั่วโลกจะยืนหยัดได้หรือไม่`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Trump escalated his pressure campaign on Chair Kevin Warsh Thursday, threatening to halt trade with countries running surpluses with the US unless the Fed cuts rates — posting "LOWER THE RATE OR I'LL STOP TRADING WITH COUNTRIES WITH WHICH WE HAVE A DEFICIT" while calling Warsh "great" and urging him to "get smart." The Fed's own post-decision statement cited tariffs, alongside the Iran-war energy shock and AI-capex spending, as a direct driver of persistent inflation.`, th:`ทรัมป์ทวีความรุนแรงของแคมเปญกดดันประธานเควิน วอร์ช วันพฤหัสบดี โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลการค้ากับสหรัฐฯ หากเฟดไม่ลดดอกเบี้ย — โพสต์ข้อความ "ลดดอกเบี้ยซะ ไม่งั้นฉันจะหยุดค้าขายกับประเทศที่เราขาดดุล" พร้อมเรียกวอร์ชว่า "ยอดเยี่ยม" ขณะกระตุ้นให้เขา "ฉลาดหน่อย" แถลงการณ์ของเฟดเองหลังการตัดสินใจระบุว่าภาษีศุลกากร ควบคู่กับผลกระทบด้านพลังงานจากสงครามอิหร่านและการลงทุนด้าน AI เป็นปัจจัยโดยตรงที่ทำให้เงินเฟ้อยังคงอยู่ในระดับสูง`}, w:{en:`The Fed naming tariffs explicitly as an inflation driver — rather than staying silent on the politically sensitive topic — is itself notable, and undercuts Trump's argument that rates alone are the problem. Expect the trade-threat rhetoric to keep escalating without changing the committee's math, since Wednesday's 12-0 vote already showed political pressure isn't moving votes.`, th:`การที่เฟดระบุภาษีศุลกากรอย่างตรงไปตรงมาว่าเป็นปัจจัยขับเคลื่อนเงินเฟ้อ แทนที่จะนิ่งเงียบต่อประเด็นที่อ่อนไหวทางการเมือง ถือเป็นเรื่องน่าสังเกตในตัวเอง และบั่นทอนข้อโต้แย้งของทรัมป์ที่ว่าอัตราดอกเบี้ยเพียงอย่างเดียวคือปัญหา คาดว่าวาทกรรมขู่การค้าจะยังคงทวีความรุนแรงต่อไป โดยไม่เปลี่ยนการตัดสินใจของกรรมการ เนื่องจากมติเอกฉันท์ 12 เสียงเมื่อวันพุธแสดงให้เห็นแล้วว่าแรงกดดันทางการเมืองไม่มีผลต่อคะแนนเสียง`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Oil eased Thursday on signs the "2026 Iran war's" supply disruptions could moderate — WTI fell 2.2% to $101.91/bbl and Brent fell 3.8% to $104.82/bbl — even as the IEA still characterizes the conflict as the largest oil-supply disruption in the history of the global oil market, with the Strait of Hormuz still seeing restricted shipping traffic.`, th:`ราคาน้ำมันย่อตัวลงวันพฤหัสบดี จากสัญญาณว่าปัญหาด้านอุปทานจาก "สงครามอิหร่านปี 2026" อาจบรรเทาลง — WTI ลดลง 2.2% สู่ $101.91 ต่อบาร์เรล และเบรนท์ลดลง 3.8% สู่ $104.82 ต่อบาร์เรล แม้ IEA จะยังมองว่าความขัดแย้งนี้เป็นภาวะชะงักงันด้านอุปทานน้ำมันครั้งใหญ่ที่สุดในประวัติศาสตร์ตลาดน้ำมันโลก โดยการเดินเรือผ่านช่องแคบฮอร์มุซยังคงถูกจำกัดอยู่`}, w:{en:`Thursday's dip is encouraging but shouldn't be read as resolution — the underlying US-Israel war with Iran has been running since April with no confirmed ceasefire timeline, and Eurasia Group has already pushed back its own de-escalation forecast to year-end. Flag to clients that oil remains a two-sided risk: further Hormuz escalation could reverse Thursday's move just as quickly as it happened.`, th:`การย่อตัวลงวันพฤหัสบดีเป็นสัญญาณที่ดี แต่ไม่ควรตีความว่าเป็นการคลี่คลายจริง — สงครามสหรัฐฯ-อิสราเอลกับอิหร่านที่เป็นต้นเหตุดำเนินมาตั้งแต่เดือนเมษายนโดยยังไม่มีกรอบเวลาหยุดยิงที่ชัดเจน และ Eurasia Group เองก็เลื่อนคาดการณ์การคลี่คลายออกไปเป็นปลายปีแล้ว ควรแจ้งลูกค้าว่าน้ำมันยังคงเป็นความเสี่ยงสองด้าน — การทวีความรุนแรงที่ฮอร์มุซรอบใหม่อาจพลิกกลับการเคลื่อนไหวของวันพฤหัสบดีได้เร็วพอ ๆ กับที่เกิดขึ้น`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`US stocks rebounded Thursday as the 10-year Treasury yield slipped back below 5% to roughly 4.94%, with the 2-year near 4.73% and the 30-year near 5.34%, unwinding some of the hawkish repricing that followed Wednesday's Fed hike. The Bank of Japan wraps up its own two-day meeting today, Sep 17-18 — a rare back-to-back week for the two most-watched central banks — with its decision still pending as of this morning.`, th:`หุ้นสหรัฐฯ ดีดตัวขึ้นวันพฤหัสบดี ขณะผลตอบแทนพันธบัตร 10 ปีไต่ลงหลุดระดับ 5% สู่ราว 4.94% ขณะพันธบัตร 2 ปียืนใกล้ 4.73% และพันธบัตร 30 ปียืนใกล้ 5.34% คลายการปรับราคารับท่าทีสายเหยี่ยวบางส่วนที่เกิดขึ้นหลังเฟดขึ้นดอกเบี้ยวันพุธ ธนาคารกลางญี่ปุ่น (BOJ) จะสรุปผลการประชุมสองวันของตัวเองวันนี้ 17-18 ก.ย. นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก โดยผลการตัดสินใจยังไม่ประกาศ ณ เช้านี้`}, w:{en:`Yields unwinding this quickly after Wednesday's spike suggests markets see the Fed's hawkish tone as a one-off reaction, not a new regime — but that read could change fast if the BOJ surprises hawkish today. Have both scenarios ready for clients: a calm BOJ that extends Thursday's relief rally, or a hawkish surprise that reopens the yield selloff.`, th:`การที่ผลตอบแทนพันธบัตรคลี่คลายลงอย่างรวดเร็วหลังพุ่งขึ้นวันพุธ บ่งชี้ว่าตลาดมองท่าทีสายเหยี่ยวของเฟดเป็นปฏิกิริยาชั่วคราว ไม่ใช่ระบอบใหม่ — แต่การตีความนี้อาจเปลี่ยนไปอย่างรวดเร็ว หากผลการตัดสินใจของ BOJ วันนี้ออกมาสายเหยี่ยวเกินคาด ควรเตรียมสองสถานการณ์ไว้ให้ลูกค้า: BOJ ที่สงบและต่อยอดการดีดตัวของวันพฤหัสบดี หรือความประหลาดใจสายเหยี่ยวที่จะเปิดแรงเทขายพันธบัตรอีกครั้ง`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`No new CPI data has landed since last week's hotter-than-expected core reading, but the Fed's own post-decision statement did the talking Thursday: it explicitly cited the combined impact of Trump's global import tariffs, the energy shock from the US-Israeli war with Iran, and AI-boom capital spending as the forces keeping price pressures intense — an unusually direct acknowledgment of three separate inflation drivers at once.`, th:`ยังไม่มีตัวเลข CPI ใหม่นับตั้งแต่ Core CPI ที่ร้อนแรงกว่าคาดเมื่อสัปดาห์ก่อน แต่แถลงการณ์ของเฟดเองหลังการตัดสินใจได้สื่อสารแทนในวันพฤหัสบดี โดยระบุอย่างตรงไปตรงมาว่าผลกระทบรวมจากภาษีนำเข้าทั่วโลกของทรัมป์ ผลกระทบด้านพลังงานจากสงครามสหรัฐฯ-อิสราเอลกับอิหร่าน และการลงทุนจากกระแส AI คือปัจจัยที่ทำให้แรงกดดันด้านราคายังคงรุนแรง ถือเป็นการยอมรับปัจจัยเงินเฟ้อสามด้านพร้อมกันอย่างตรงไปตรงมาผิดปกติ`}, w:{en:`Naming three distinct, largely non-monetary drivers of inflation — trade policy, war, and AI capex — is the Fed effectively saying its own rate tool has limited reach here. Frame client conversations around "sticky inflation for structural reasons" rather than a simple demand story, with the Bank of Japan's decision today as the next data point on how other central banks are reading the same forces.`, th:`การระบุปัจจัยเงินเฟ้อสามด้านที่แยกจากกันและส่วนใหญ่ไม่เกี่ยวกับนโยบายการเงิน — การค้า สงคราม และการลงทุนด้าน AI — เท่ากับเฟดกำลังบอกว่าเครื่องมืออัตราดอกเบี้ยของตัวเองมีขอบเขตจำกัดในการแก้ปัญหานี้ ควรวางกรอบการสนทนากับลูกค้าโดยยึด "เงินเฟ้อติดสูงจากปัจจัยเชิงโครงสร้าง" มากกว่าเรื่องราวด้านอุปสงค์อย่างง่าย โดยผลการตัดสินใจของธนาคารกลางญี่ปุ่นวันนี้เป็นข้อมูลถัดไปว่าธนาคารกลางอื่นตีความปัจจัยเดียวกันนี้อย่างไร`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 8 Sep",th:"อังคาร 8 ก.ย."}, imp:"h", t:{en:"Wall Street reopens for the first time since the tanker war, with hike odds near 60%",th:"วอลล์สตรีทเปิดตลาดอีกครั้งเป็นครั้งแรกหลังสงครามเรือบรรทุกน้ำมัน ขณะโอกาสขึ้นดอกเบี้ยใกล้ 60%"}, d:{en:"US markets reopen Tuesday after the Labor Day break, giving the first direct pricing of both the weekend's Iran-tanker escalation and the climb in September rate-hike odds to roughly 60%. Oil (Brent near $98, WTI above $92) and the elevated 10-year yield (~4.79%) will be the key signals to watch as trading resumes.",th:"ตลาดสหรัฐฯ เปิดทำการอีกครั้งวันอังคารหลังหยุดวันแรงงาน เป็นการสะท้อนราคาโดยตรงครั้งแรกทั้งการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ขยับขึ้นสู่ราว 60% ราคาน้ำมัน (เบรนท์ใกล้ $98, WTI เหนือ $92) และผลตอบแทนพันธบัตร 10 ปีที่สูงขึ้น (~4.79%) จะเป็นสัญญาณสำคัญที่ต้องจับตาเมื่อการซื้อขายกลับมาดำเนินต่อ"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 9 Sep",th:"พุธ 9 ก.ย."}, imp:"h", t:{en:"Oil tops $101 as tanker war's worst wave yet hits Wall St a third day",th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"}, d:{en:"The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%); national gas hit $4.22/gal and diesel a record $5.94/gal. The S&P 500 fell 0.48% to 7,636.36 (a third straight down day), the DAX slid 1.74% to a one-month low of 25,554, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. September hike odds eased slightly to ~57%.",th:"สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ดัชนี S&P 500 ลดลง 0.48% สู่ 7,636.36 (ปรับลงวันที่สามติดต่อกัน) ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือนที่ 25,554 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 10 Sep",th:"พฤหัสฯ 10 ก.ย."}, imp:"h", t:{en:"Wall St falls a fourth day; hike odds jump to ~72% as yields near 5%",th:"วอลล์สตรีทร่วงวันที่สี่ โอกาสขึ้นดอกเบี้ยพุ่งสู่ราว 72% ผลตอบแทนใกล้ 5%"}, d:{en:"US stocks fell a fourth straight session — S&P 500 -0.58% to 7,591.70, Dow -0.6% to 52,064.10, Nasdaq -0.65% to 26,081.72 — as the 10-year Treasury yield pushed above 4.9% and Wednesday's in-line PPI kept inflation in focus. September hike odds jumped to roughly 72%, from ~57% a day earlier. Germany's DAX fell 0.8% to 25,401 after the ECB hiked 25bp; Hong Kong's Hang Seng dropped 1.27% while Japan's Nikkei edged up 0.20% and Thailand's SET eased 0.17% on profit-taking. Oil held near $101 and gold rose to $4,405.88.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกัน — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 0.6% สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 — ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% และ PPI วันพุธที่ออกมาตามคาดยังตอกย้ำแรงกดดันเงินเฟ้อ โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% จากราว 57% เมื่อวันก่อน ดัชนี DAX เยอรมนีลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ย 25bp ดัชนี Hang Seng ฮ่องกงลดลง 1.27% ขณะ Nikkei ญี่ปุ่นขยับขึ้น 0.20% และ SET ไทยลดลง 0.17% จากแรงขายทำกำไร น้ำมันยืนใกล้ $101 และทองคำเพิ่มขึ้นสู่ $4,405.88"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 11 Sep",th:"ศุกร์ 11 ก.ย."}, imp:"h", t:{en:"Hot core CPI pushes Sep 16 hike odds to ~90%; stocks rally, oil tumbles",th:"Core CPI ร้อนแรงดันโอกาสขึ้นดอกเบี้ย 16 ก.ย. สู่ราว 90% หุ้นดีดตัว น้ำมันร่วง"}, d:{en:"August headline CPI matched forecasts (+0.4% m/m, +3.4% y/y) but core CPI ran hot (+0.3% m/m vs +0.2% expected, +2.4% y/y), pushing Sep 16 hike odds to roughly 90% from ~72% Thursday. The S&P 500 rose 0.86% to 7,656.98, the Dow gained 509.19 pts (+0.98%) to 52,573.29, and the Nasdaq added 0.96% to 26,333.04. The 10-year yield touched 4.98% before easing to ~4.92%, and Brent tumbled 2.8% to $104.61 after Iran signaled Oman talks over the Strait of Hormuz. Earlier, before the print, Asia and Europe stayed mixed: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%.",th:"CPI ทั่วไปเดือน ส.ค. ตรงตามคาด (+0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อน) แต่ Core CPI ร้อนแรงกว่าคาด (+0.3% เทียบเดือนก่อน เทียบคาดการณ์ 0.2%, +2.4% เทียบปีก่อน) ดันโอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. สู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ดัชนี S&P 500 เพิ่มขึ้น 0.86% สู่ 7,656.98 ดัชนี Dow เพิ่มขึ้น 509.19 จุด (+0.98%) สู่ 52,573.29 และดัชนี Nasdaq เพิ่มขึ้น 0.96% สู่ 26,333.04 ผลตอบแทนพันธบัตร 10 ปีแตะ 4.98% ก่อนย่อตัวสู่ราว 4.92% และเบรนท์ร่วง 2.8% สู่ $104.61 หลังอิหร่านส่งสัญญาณเจรจาที่โอมานเรื่องช่องแคบฮอร์มุซ ก่อนหน้านั้น ก่อนตัวเลขจะประกาศ ตลาดเอเชียและยุโรปเคลื่อนไหวคละกัน: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 14 Sep",th:"จันทร์ 14 ก.ย."}, imp:"h", t:{en:"AI-slowdown selloff runs a full session; 10-year yield tops 5% intraday",th:"แรงเทขาย AI ดำเนินต่อเนื่องเต็มเซสชัน ผลตอบแทน 10 ปีทะลุ 5% ระหว่างวัน"}, d:{en:"US stocks fell a second straight session — S&P 500 -0.48% to 7,619.98, Dow -0.29% to 52,421.20, Nasdaq -0.56% to 26,186.41 — as the weekend's AI-slowdown warnings ran through a full session and the 10-year Treasury yield touched 5.01% intraday before easing to ~4.96%. DAX fell 0.66% to 25,398.75, Nikkei dropped 0.81% to 63,492.99, Hang Seng fell 0.48% to 24,687 (a 4th straight losing session), Shanghai eased 0.07% to 3,885, and Thailand's SET fell 0.84% to 1,591.07 on a DELTA-led electronics selloff. Brent settled $108.34 (+3.6%) and gold fell 1.25% to $4,284.48, its lowest since August.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สองติดต่อกัน — S&P 500 ลดลง 0.48% สู่ 7,619.98, Dow ลดลง 0.29% สู่ 52,421.20, Nasdaq ลดลง 0.56% สู่ 26,186.41 — ขณะคำเตือนชะลอ AI ช่วงสุดสัปดาห์ดำเนินต่อเนื่องเต็มเซสชัน และผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน ก่อนย่อตัวสู่ราว 4.96% ดัชนี DAX ลดลง 0.66% สู่ 25,398.75 ดัชนี Nikkei ลดลง 0.81% สู่ 63,492.99 ดัชนี Hang Seng ลดลง 0.48% สู่ 24,687 (ปรับลงติดต่อกันเป็นเซสชันที่สี่) ดัชนี Shanghai ลดลง 0.07% สู่ 3,885 และดัชนี SET ไทยลดลง 0.84% สู่ 1,591.07 จากแรงเทขายหุ้นอิเล็กทรอนิกส์ที่นำโดย DELTA เบรนท์ปิดที่ $108.34 (+3.6%) และทองคำลดลง 1.25% สู่ $4,284.48 ต่ำสุดตั้งแต่เดือนสิงหาคม"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 15 Sep",th:"อังคาร 15 ก.ย."}, imp:"h", t:{en:"Wall St falls a third day as the 10-year yield hits its highest since 2007",th:"วอลล์สตรีทร่วงวันที่สาม ผลตอบแทน 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007"}, d:{en:"US stocks fell a third straight session — S&P 500 -0.45% to 7,585.73, Dow -0.63% to 52,093.11, Nasdaq -0.78% to 25,981.57 — even as AI chip names Qualcomm and AMD bounced. The 10-year Treasury yield touched 5.04% intraday, its highest since 2007, before easing to ~5.00%, and CME FedWatch pushed hike odds to roughly 92% from 88% Monday. DAX fell 1.14% to ~25,109, Nikkei was flat at 63,484.10, Hang Seng eased 0.08% to 24,667 (a 5th straight losing session), and Shanghai fell 0.54% to 3,864.28. WTI rose to $105.49 while Brent held near $107.46, and gold fell 1.23% to a six-week low of $4,263.19.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกัน — S&P 500 ลดลง 0.45% สู่ 7,585.73, Dow ลดลง 0.63% สู่ 52,093.11, Nasdaq ลดลง 0.78% สู่ 25,981.57 — แม้หุ้นชิปกลุ่ม AI อย่าง Qualcomm และ AMD จะดีดตัวขึ้น ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวสู่ราว 5.00% และ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยขึ้นสู่ราว 92% จาก 88% เมื่อวันจันทร์ ดัชนี DAX ลดลง 1.14% สู่ราว 25,109 ดัชนี Nikkei ทรงตัวที่ 63,484.10 ดัชนี Hang Seng ลดลง 0.08% สู่ 24,667 (ปรับลงติดต่อกันเป็นเซสชันที่ห้า) และดัชนี Shanghai ลดลง 0.54% สู่ 3,864.28 WTI เพิ่มขึ้นสู่ $105.49 ขณะเบรนท์ยืนใกล้ $107.46 และทองคำลดลง 1.23% สู่ระดับต่ำสุดในรอบหกสัปดาห์ที่ $4,263.19"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 16 Sep",th:"พุธ 16 ก.ย."}, imp:"h", t:{en:"Fed hikes rates for the first time in three years; Wall Street falls, 10-year tops 5% again",th:"เฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี วอลล์สตรีทปรับลง ผลตอบแทน 10 ปีทะลุ 5% อีกครั้ง"}, d:{en:"The FOMC voted 12-0 to raise the fed funds rate a quarter point to 3.75%-4.00%, its first hike in three years. Chair Kevin Warsh said inflation \"is too high, and has been for too long,\" and the updated dot plot showed most officials expect at least one more hike this year. US stocks fell on the news — Dow -1.21% (-631.21 pts) to 51,461.90, S&P 500 -0.45% to 7,551.81, Nasdaq roughly flat at 25,978.42 — and the 10-year Treasury yield climbed back above 5% to 5.016%. Oil jumped on fresh Middle East supply fears (WTI +4.2% to $104.25, Brent +4.14% to $108.94) after Houthi attacks and a Saudi pipeline shutdown, while gold slipped 1.2% to $4,240.10. Asia and Europe, which closed hours before the announcement, only traded on anticipation: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80%. Thailand's SET fell 1.01% to 1,562.73 on domestic drivers (a diesel price cut and a delayed tourism-stimulus program), unrelated to the Fed.",th:"FOMC ลงมติเอกฉันท์ 12 เสียง ขึ้นอัตราดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ \"สูงเกินไป และสูงมานานเกินไป\" และ dot plot ฉบับปรับใหม่แสดงว่ากรรมการส่วนใหญ่คาดว่าจะมีการขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ หุ้นสหรัฐฯ ปรับลงรับข่าว — Dow -1.21% (-631.21 จุด) สู่ 51,461.90, S&P 500 -0.45% สู่ 7,551.81, Nasdaq ทรงตัวใกล้เคียงเดิมที่ 25,978.42 — และผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% ราคาน้ำมันพุ่งขึ้นจากความกังวลด้านอุปทานในตะวันออกกลางรอบใหม่ (WTI +4.2% สู่ $104.25, เบรนท์ +4.14% สู่ $108.94) หลังกลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันของซาอุดีอาระเบียถูกปิด ขณะทองคำลดลง 1.2% สู่ $4,240.10 ตลาดเอเชียและยุโรปซึ่งปิดตลาดก่อนการประกาศหลายชั่วโมง เทรดตามการคาดการณ์เท่านั้น: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80% ดัชนี SET ไทยลดลง 1.01% สู่ 1,562.73 จากปัจจัยภายในประเทศ (การลดราคาดีเซลและโครงการกระตุ้นท่องเที่ยวที่ถูกเลื่อนออกไป) ซึ่งไม่เกี่ยวกับเฟด"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 17 Sep",th:"พฤหัสฯ 17 ก.ย."}, imp:"h", t:{en:"Wall Street rebounds as the 10-year yield slips below 5% and oil eases",th:"วอลล์สตรีทดีดตัว ผลตอบแทนพันธบัตร 10 ปีหลุด 5% น้ำมันย่อตัว"}, d:{en:"US stocks bounced back from Wednesday's Fed-hike selloff — S&P 500 +0.59% to 7,596.36, Dow +0.61% (+316.14 pts) to 51,778.04, Nasdaq +1.60% to 26,395.18 — as the 10-year Treasury yield eased to ~4.94% and oil fell on signs the Iran war's supply disruptions could moderate (WTI -2.2% to $101.91, Brent -3.8% to $104.82). Gold rebounded 1.4% to $4,301.40. Trump escalated pressure on Chair Kevin Warsh, threatening to halt trade with surplus countries unless the Fed cuts rates, but the Fed's own statement blamed tariffs, the Iran war and AI capex for elevated inflation. Europe and Japan got their first full session to price in the Fed's hike — DAX +0.53% to 25,538, Nikkei +0.33% to 64,136.25 — while Hong Kong's Hang Seng slipped 0.44% to 24,604.29 and Shanghai eased 0.41% to 3,875.60. Thailand's SET jumped 1.32% to 1,583.34 on turnover of THB 62.46bn.",th:"หุ้นสหรัฐฯ ดีดตัวขึ้นจากแรงเทขายรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ — S&P 500 +0.59% สู่ 7,596.36, Dow +0.61% (+316.14 จุด) สู่ 51,778.04, Nasdaq +1.60% สู่ 26,395.18 — ขณะผลตอบแทนพันธบัตร 10 ปีย่อตัวลงสู่ราว 4.94% และราคาน้ำมันลดลงจากสัญญาณว่าปัญหาอุปทานจากสงครามอิหร่านอาจบรรเทาลง (WTI -2.2% สู่ $101.91, เบรนท์ -3.8% สู่ $104.82) ทองคำดีดตัวขึ้น 1.4% สู่ $4,301.40 ทรัมป์ทวีความรุนแรงของแรงกดดันต่อประธานเควิน วอร์ช โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลหากเฟดไม่ลดดอกเบี้ย แต่แถลงการณ์ของเฟดเองโทษภาษีศุลกากร สงครามอิหร่าน และการลงทุนด้าน AI ว่าเป็นสาเหตุของเงินเฟ้อสูง ยุโรปและญี่ปุ่นได้เซสชันเต็มรูปแบบครั้งแรกในการสะท้อนการขึ้นดอกเบี้ยของเฟดในราคา — DAX +0.53% สู่ 25,538, Nikkei +0.33% สู่ 64,136.25 — ขณะ Hang Seng ฮ่องกงลดลง 0.44% สู่ 24,604.29 และ Shanghai ลดลง 0.41% สู่ 3,875.60 ดัชนี SET ไทยพุ่งขึ้น 1.32% สู่ 1,583.34 มูลค่าการซื้อขายราว 6.246 หมื่นล้านบาท"}},
    {day:{en:"Today",th:"วันนี้"}, date:{en:"Fri 18 Sep",th:"ศุกร์ 18 ก.ย."}, imp:"h", t:{en:"Bank of Japan decision due this afternoon as markets test whether Thursday's rally holds",th:"ธนาคารกลางญี่ปุ่นแถลงผลบ่ายนี้ ตลาดทดสอบว่าการดีดตัววันพฤหัสบดีจะยืนได้หรือไม่"}, d:{en:"The Bank of Japan wraps up its two-day meeting today, with the policy statement and Governor's press conference due this afternoon Tokyo time — still pending as of this morning. Markets will be watching whether Thursday's relief rally (led by a sub-5% 10-year yield and easing oil) extends into a second session, or whether a hawkish BOJ surprise reopens the volatility of the past two weeks.",th:"ธนาคารกลางญี่ปุ่น (BOJ) จะสรุปผลการประชุมสองวันของตัวเองวันนี้ โดยจะแถลงนโยบายและมีการแถลงข่าวของผู้ว่าการช่วงบ่ายตามเวลาโตเกียว ซึ่งยังไม่ประกาศผล ณ เช้านี้ ตลาดจะจับตาว่าการดีดตัวรับความโล่งใจของวันพฤหัสบดี (นำโดยผลตอบแทนพันธบัตร 10 ปีที่หลุด 5% และราคาน้ำมันที่ย่อตัวลง) จะต่อเนื่องเป็นเซสชันที่สองหรือไม่ หรือความประหลาดใจสายเหยี่ยวจาก BOJ จะเปิดความผันผวนของสองสัปดาห์ที่ผ่านมาอีกครั้ง"}},
  ];




  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
