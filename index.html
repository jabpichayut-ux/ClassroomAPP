<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
    <div class="grid g2" id="countrygrid"></div>
    <div class="grid g2" style="margin-top:14px" id="extragrid"></div>
    <div class="rule"></div>
    <div class="sechead"><h2 id="s-themes"></h2></div>
    <div class="grid g4" id="themegrid"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Wall Street Rebounds as Canada Tariff Deal Lands — But Gold Tops $4,600 on Fiscal Fears", th:"วอลล์สตรีทฟื้นตัวหลังบรรลุข้อตกลงภาษีแคนาดา — แต่ทองคำทะลุ $4,600 จากความกังวลการคลัง"},
    heroDeck:{en:"US stocks rebounded Friday — S&P 500 +0.43% to 7,674.37, Dow +0.98% to 53,277.01, Nasdaq +0.43% to 26,180.45 — but still closed the week lower, as Canada and the US struck a tariff deal (autos cut to 15%) ahead of Friday's deadline. Treasury's bond-buyback rally 'fizzled': the 30-year stayed near 5.25%, and gold topped $4,600, its highest since mid-May, as the buyback move stoked fiscal-sustainability worries rather than easing them. Brent held near $93–94 on the still-active Iran standoff; markets are closed for the weekend, with Fed Chair Warsh's first Jackson Hole speech (28 Aug) the next big catalyst.", th:"หุ้นสหรัฐฯ ฟื้นตัววันศุกร์ — S&P 500 +0.43% สู่ 7,674.37, Dow +0.98% สู่ 53,277.01, Nasdaq +0.43% สู่ 26,180.45 — แต่รวมทั้งสัปดาห์ยังปิดลบ หลังแคนาดาและสหรัฐฯ บรรลุข้อตกลงภาษีก่อนเส้นตายวันศุกร์ (ภาษีรถยนต์ลดเหลือ 15%) ขณะการซื้อคืนพันธบัตรของคลังสหรัฐฯ 'แผ่วลง' — ผลตอบแทน 30 ปียังยืนใกล้ 5.25% และทองคำทะลุ $4,600 สูงสุดตั้งแต่กลางเดือน พ.ค. เพราะมาตรการซื้อคืนกลับจุดความกังวลเรื่องความยั่งยืนทางการคลังแทนที่จะคลายกังวล เบรนท์ยืนใกล้ $93–94 จากสถานการณ์อิหร่านที่ยังตึงเครียด ตลาดปิดช่วงสุดสัปดาห์ โดยสุนทรพจน์ Jackson Hole ครั้งแรกของประธานเฟด Warsh (28 ส.ค.) จะเป็นปัจจัยใหญ่ถัดไป"},

    leadtxt:{en:`<b>Wall Street rebounded Friday, clawing back part of Thursday's rout: the S&P 500 rose 0.43% to 7,674.37, the Dow gained 0.98% (+517.80pts) to 53,277.01, and the Nasdaq added 0.43% to 26,180.45,</b> though all three still posted a weekly loss as bond-market volatility stayed the dominant theme. <b>The lift came as Canada and the US struck a tariff deal just ahead of Friday's deadline — the disputed auto tariff cut to 15% from 25% and steel/aluminum tariffs halved to 25%,</b> though Ottawa didn't get the full carve-out for Canadian/US content it wanted, and the deal drew domestic political friction (VP Vance calling it a "climb-down" for Canada). <b>Treasury's own bond-buyback gambit "fizzled" — the 30-year yield, which had briefly dipped to 5.18% on Wednesday's buyback news, climbed back to roughly 5.25–5.27%, while the 10-year held near 4.71%,</b> with CNBC noting the intervention is now stirring fiscal-sustainability and inflation worries rather than calming them. That backdrop pushed <b>gold above $4,600/oz, its highest since 15 May, on track for a third straight weekly gain of roughly 5%</b> — a genuine inflation/debt-concern signal, not just a rate trade. Europe's DAX added 0.6% to 26,137. Asia was mixed: <b>Hang Seng +1.21% to 26,009.46, Shanghai +0.04% to 3,905.20, Nikkei −0.30% to 66,016.36.</b> Thailand's SET rose 0.24% to 1,613.78 on turnover of about THB 70.6 billion, with energy names tracking firmer oil. <b>Brent held near $93–94/bbl, on track for a second straight weekly gain of over 5%,</b> as Trump's "most crushing" new Iran sanctions and Ukrainian strikes on Russian energy infrastructure kept the risk premium elevated; Tehran vowed the "economic warfare" would fail. Markets are closed for the weekend, with Fed Chair Kevin Warsh's first Jackson Hole keynote as chair (Friday 28 August) now the next major catalyst ahead of the 16 September FOMC. For your clients: <b>the bond-buyback rally fizzling out — yields snapping back within a day — is still the strongest bond-lock-in case on the table,</b> and gold's record run is now doing double duty as both a war-risk and a fiscal-credibility hedge, worth keeping as its own conversation alongside the bond pitch. Friday's equity bounce is relief on a resolved tariff risk, not an all-clear on rates.`,
      th:`<b>วอลล์สตรีทฟื้นตัววันศุกร์ ชดเชยบางส่วนของการเทขายวันพฤหัสฯ: ดัชนี S&P 500 เพิ่มขึ้น 0.43% สู่ 7,674.37 ดัชนี Dow เพิ่มขึ้น 0.98% (+517.80 จุด) สู่ 53,277.01 และดัชนี Nasdaq เพิ่มขึ้น 0.43% สู่ 26,180.45</b> แม้ทั้งสามดัชนีจะยังปิดลบรายสัปดาห์ เนื่องจากความผันผวนตลาดพันธบัตรยังเป็นประเด็นหลัก <b>แรงหนุนมาจากการที่แคนาดาและสหรัฐฯ บรรลุข้อตกลงภาษีก่อนเส้นตายวันศุกร์เพียงเล็กน้อย — ภาษีรถยนต์ที่เป็นข้อพิพาทลดเหลือ 15% จาก 25% และภาษีเหล็ก/อะลูมิเนียมลดลงครึ่งหนึ่งเหลือ 25%</b> แม้ออตตาวาจะไม่ได้รับการยกเว้นเต็มรูปแบบสำหรับสัดส่วนวัตถุดิบแคนาดา/สหรัฐฯ ตามที่ต้องการ และข้อตกลงนี้ก่อความไม่พอใจทางการเมืองในประเทศ (รองประธานาธิบดี Vance เรียกว่าเป็นการ "ยอมถอย" ของแคนาดา) <b>ความพยายามซื้อคืนพันธบัตรของคลังสหรัฐฯ เอง "แผ่วลง" — ผลตอบแทนพันธบัตร 30 ปี ที่เคยดิ่งลงชั่วคราวสู่ 5.18% จากข่าวซื้อคืนวันพุธ ดีดกลับสู่ราว 5.25-5.27% ขณะผลตอบแทน 10 ปียืนใกล้ 4.71%</b> โดย CNBC ระบุว่ามาตรการนี้กำลังจุดความกังวลเรื่องความยั่งยืนทางการคลังและเงินเฟ้อ แทนที่จะช่วยคลายกังวล บรรยากาศนี้ผลักดันให้ <b>ทองคำทะลุ $4,600 ต่อออนซ์ สูงสุดตั้งแต่ 15 พ.ค. มีแนวโน้มปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 3 ติดต่อกันราว 5%</b> — สัญญาณความกังวลเงินเฟ้อ/หนี้สาธารณะที่แท้จริง ไม่ใช่แค่การเทรดตามอัตราดอกเบี้ย ดัชนี DAX ยุโรปเพิ่มขึ้น 0.6% สู่ 26,137 เอเชียเคลื่อนไหวผสม: <b>Hang Seng +1.21% สู่ 26,009.46, Shanghai +0.04% สู่ 3,905.20, Nikkei −0.30% สู่ 66,016.36</b> ดัชนี SET ไทยเพิ่มขึ้น 0.24% สู่ 1,613.78 มูลค่าการซื้อขายราว 7.06 หมื่นล้านบาท โดยหุ้นกลุ่มพลังงานได้แรงหนุนจากราคาน้ำมันที่แข็งแกร่งขึ้น <b>เบรนท์ยืนใกล้ $93-94 ต่อบาร์เรล มีแนวโน้มปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 2 ติดต่อกันกว่า 5%</b> ขณะมาตรการคว่ำบาตรอิหร่านรอบใหม่ที่ทรัมป์เรียกว่า "รุนแรงที่สุด" และการโจมตีโครงสร้างพื้นฐานพลังงานรัสเซียของยูเครน ยังคงหนุนส่วนชดเชยความเสี่ยงให้อยู่ในระดับสูง อิหร่านประกาศว่า "สงครามเศรษฐกิจ" จะล้มเหลว ตลาดปิดช่วงสุดสัปดาห์ โดยสุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh (ศุกร์ที่ 28 ส.ค.) จะเป็นปัจจัยใหญ่ถัดไปก่อนการประชุมเฟด 16 ก.ย. สำหรับลูกค้าของคุณ: <b>การที่ความพยายามซื้อคืนพันธบัตรแผ่วลง — ผลตอบแทนดีดกลับภายในวันเดียว — ยังคงเป็นจุดขายล็อกพันธบัตรที่หนักแน่นที่สุดที่มีอยู่</b> และการที่ทองคำทำสถิติใหม่ กำลังทำหน้าที่ทั้งเป็นตัวป้องกันความเสี่ยงสงครามและความน่าเชื่อถือทางการคลังไปพร้อมกัน ควรคงไว้เป็นบทสนทนาแยกต่างหากคู่กับจุดขายพันธบัตร การดีดตัวของหุ้นวันศุกร์คือการคลายกังวลจากความเสี่ยงภาษีที่คลี่คลายแล้ว ไม่ใช่สัญญาณหมดกังวลเรื่องดอกเบี้ย`},

      txt:{en:`<b>US stocks rebounded Friday, clawing back part of Thursday's rout (S&P +0.43% to 7,674.37, Dow +0.98% to 53,277.01, Nasdaq +0.43% to 26,180.45),</b> though all three still posted a weekly loss. The bounce came as Canada and the US struck a tariff deal just ahead of Friday's deadline — the disputed auto tariff cut to 15% from 25%, steel/aluminum halved to 25% — removing a live risk event, even as Treasury's own bond-buyback rally "fizzled," with the 30-year yield back near 5.25–5.27% and the 10-year holding near 4.71%.`, th:`<b>หุ้นสหรัฐฯ ฟื้นตัววันศุกร์ ชดเชยบางส่วนของการเทขายวันพฤหัสฯ (S&P +0.43% สู่ 7,674.37, Dow +0.98% สู่ 53,277.01, Nasdaq +0.43% สู่ 26,180.45)</b> แม้ทั้งสามดัชนีจะยังปิดลบรายสัปดาห์ แรงหนุนมาจากการที่แคนาดาและสหรัฐฯ บรรลุข้อตกลงภาษีก่อนเส้นตายวันศุกร์เพียงเล็กน้อย — ภาษีรถยนต์ที่เป็นข้อพิพาทลดเหลือ 15% จาก 25% ภาษีเหล็ก/อะลูมิเนียมลดลงครึ่งหนึ่งเหลือ 25% — ขจัดความเสี่ยงที่ยังไม่ตัดสินออกไป แม้ความพยายามซื้อคืนพันธบัตรของคลังสหรัฐฯ เองจะ "แผ่วลง" โดยผลตอบแทน 30 ปีกลับสู่ราว 5.25-5.27% และ 10 ปียืนใกล้ 4.71%`},
      why:{en:`Friday's bounce is relief on a resolved tariff risk, not an all-clear on rates — yields staying elevated after the buyback rally fizzled keeps the bond-lock-in case fully live; pair the equity relief with the fact the week still closed lower to avoid over-reading a single good session.`, th:`การดีดตัวของหุ้นวันศุกร์คือการคลายกังวลจากความเสี่ยงภาษีที่คลี่คลายแล้ว ไม่ใช่สัญญาณหมดกังวลเรื่องดอกเบี้ย — ผลตอบแทนพันธบัตรที่ยังยืนสูงหลังการซื้อคืนแผ่วลง ทำให้จุดขายล็อกพันธบัตรยังใช้ได้เต็มที่ ควรจับคู่การคลายกังวลของหุ้นกับข้อเท็จจริงว่าทั้งสัปดาห์ยังปิดลบ เพื่อไม่ให้ตีความวันดีวันเดียวเกินจริง`},
      full:{en:`US stocks rebounded Friday after Thursday's sharp sell-off. The S&P 500 rose 0.43% (+33.21pts) to 7,674.37, the Dow Jones Industrial Average gained 0.98% (+517.80pts) to 53,277.01, and the Nasdaq Composite added 0.43% to 26,180.45 — Russell 2000 small-caps also jumped after a "tumultuous week for Treasurys" per TheStreet — but all three major indices still closed the week lower as bond-market volatility stayed the dominant theme. The lift came as Canada and the US reached a tariff deal just ahead of Friday night's deadline: the top-line auto tariff on Canadian-built vehicles would fall to 15% from 25% while preserving an exemption for US content, and steel/aluminum tariffs would be halved to 25%, though Ottawa didn't secure the full tariff-free carve-out for Canadian and Mexican content it had pushed for. The deal drew domestic political friction, with US Vice President Vance dismissing PM Carney's framing of it as a "victory" and provincial leaders like Manitoba's Wab Kinew criticizing the concessions. Separately, Treasury's own bond-buyback intervention — announced Wednesday to at least double "liquidity support" purchases of 10-to-30-year debt — saw its initial relief "fizzle out" per CNBC: the 30-year yield, which had briefly dipped to about 5.18%, climbed back to roughly 5.25–5.27%, while the 10-year held near 4.71%, with CNBC noting the intervention is now stirring inflation and fiscal-sustainability concerns rather than easing them. Bitcoin also surged as broader risk appetite returned.`, th:`หุ้นสหรัฐฯ ฟื้นตัววันศุกร์ หลังการเทขายหนักวันพฤหัสฯ ดัชนี S&P 500 เพิ่มขึ้น 0.43% (+33.21 จุด) สู่ 7,674.37 ดัชนี Dow Jones เพิ่มขึ้น 0.98% (+517.80 จุด) สู่ 53,277.01 และดัชนี Nasdaq Composite เพิ่มขึ้น 0.43% สู่ 26,180.45 — ดัชนี Russell 2000 หุ้นขนาดเล็กก็ปรับขึ้นเช่นกัน หลังสัปดาห์ที่ "ผันผวนหนัก" ในตลาดพันธบัตรตามรายงานของ TheStreet — แต่ทั้งสามดัชนีหลักยังคงปิดตลาดรายสัปดาห์ในแดนลบ เนื่องจากความผันผวนของตลาดพันธบัตรยังเป็นประเด็นหลัก แรงหนุนมาจากการที่แคนาดาและสหรัฐฯ บรรลุข้อตกลงภาษีก่อนเส้นตายคืนวันศุกร์เพียงเล็กน้อย: ภาษีรถยนต์หลักสำหรับรถที่ผลิตในแคนาดาจะลดเหลือ 15% จาก 25% พร้อมคงการยกเว้นสำหรับสัดส่วนวัตถุดิบสหรัฐฯ และภาษีเหล็ก/อะลูมิเนียมจะลดลงครึ่งหนึ่งเหลือ 25% แม้ออตตาวาจะไม่ได้รับการยกเว้นภาษีเต็มรูปแบบสำหรับสัดส่วนวัตถุดิบแคนาดาและเม็กซิโกตามที่ผลักดันไว้ ข้อตกลงนี้ก่อความไม่พอใจทางการเมืองในประเทศ โดยรองประธานาธิบดีสหรัฐฯ Vance ปฏิเสธที่นายกฯ Carney เรียกข้อตกลงนี้ว่าเป็น "ชัยชนะ" และผู้นำระดับมณฑลอย่าง Wab Kinew แห่งแมนิโทบาวิจารณ์การยอมประนีประนอม ในอีกด้านหนึ่ง ความพยายามซื้อคืนพันธบัตรของคลังสหรัฐฯ เอง — ที่ประกาศวันพุธว่าจะเพิ่มวงเงินซื้อพันธบัตรอายุ 10-30 ปี "สนับสนุนสภาพคล่อง" เป็นอย่างน้อยสองเท่า — เห็นแรงผ่อนคลายเริ่มต้น "แผ่วลง" ตามรายงานของ CNBC: ผลตอบแทนพันธบัตร 30 ปี ที่เคยดิ่งลงชั่วคราวสู่ราว 5.18% ดีดกลับสู่ราว 5.25-5.27% ขณะผลตอบแทน 10 ปียืนใกล้ 4.71% โดย CNBC ระบุว่ามาตรการนี้กำลังจุดความกังวลเรื่องเงินเฟ้อและความยั่งยืนทางการคลัง แทนที่จะช่วยคลายกังวล บิตคอยน์ก็ปรับขึ้นเช่นกัน ขณะความเสี่ยงในการลงทุนกลับมาเป็นที่ต้องการ`},
      sources:[{l:"CNBC",u:"https://www.cnbc.com/2026/08/21/treasury-yields-bonds-inflation-rates.html"},{l:"Yahoo Finance",u:"https://finance.yahoo.com/markets/live/stock-market-today-friday-august-21-dow-sp-500-nasdaq-bitcoin-080533702.html"},{l:"The Globe and Mail",u:"https://www.theglobeandmail.com/world/us-politics/article-canada-us-trade-negotiations-tariffs-trump-carney/"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,137", chg:0.6, series:[25983,26137],
      txt:{en:`<b>DAX rose 0.6% to 26,137 Friday,</b> tracking the firmer Wall Street tone as the Canada-US tariff deal removed a live risk event, even as German Bund yields stayed elevated on the same fiscal-deficit pressure hitting US Treasuries.`, th:`<b>DAX เพิ่มขึ้น 0.6% สู่ 26,137 วันศุกร์</b> ตามบรรยากาศตลาดสหรัฐฯ ที่แข็งแกร่งขึ้น หลังข้อตกลงภาษีแคนาดา-สหรัฐฯ ขจัดความเสี่ยงที่ยังไม่ตัดสินออกไป แม้ผลตอบแทนพันธบัตร Bund เยอรมนีจะยังยืนสูง จากแรงกดดันขาดดุลการคลังแบบเดียวกับที่กระทบพันธบัตรสหรัฐฯ`},
      why:{en:`A firmer DAX on resolved tariff risk, alongside Bund yields still elevated on the same fiscal pressure as US Treasuries, keeps the global bond-lock-in pitch relevant for clients with European exposure too — the equity relief and the rates story are running on separate tracks.`, th:`DAX ที่แข็งแกร่งขึ้นจากความเสี่ยงภาษีที่คลี่คลาย ขณะผลตอบแทน Bund ยังยืนสูงจากแรงกดดันการคลังแบบเดียวกับพันธบัตรสหรัฐฯ ทำให้จุดขายล็อกพันธบัตรทั่วโลกยังใช้ได้กับลูกค้าที่ถือสินทรัพย์ยุโรปด้วย — การคลายกังวลของหุ้นและเรื่องราวอัตราดอกเบี้ยเดินไปคนละทาง`},
      full:{en:`European equities gained Friday. Germany's DAX rose 0.6% to close at 26,137, tracking Wall Street's rebound after Canada and the US struck a tariff deal ahead of Friday's deadline, removing a live cross-border risk event. German 10-year Bund yields remained near their elevated recent range, still reflecting the same deficit- and defense-spending-driven fiscal pressure pushing US Treasury yields, even as Treasury's own buyback-relief rally "fizzled out" the same session.`, th:`หุ้นยุโรปปรับขึ้นวันศุกร์ ดัชนี DAX เยอรมนีเพิ่มขึ้น 0.6% ปิดที่ 26,137 ตามการฟื้นตัวของวอลล์สตรีท หลังแคนาดาและสหรัฐฯ บรรลุข้อตกลงภาษีก่อนเส้นตายวันศุกร์ ขจัดความเสี่ยงข้ามพรมแดนที่ยังไม่ตัดสินออกไป ผลตอบแทนพันธบัตรรัฐบาลเยอรมนีอายุ 10 ปี (Bund) ยังคงยืนใกล้ระดับสูงล่าสุด สะท้อนแรงกดดันจากปัจจัยขาดดุลงบประมาณและงบกลาโหมแบบเดียวกับที่ผลักดันผลตอบแทนพันธบัตรสหรัฐฯ แม้การซื้อคืนพันธบัตรของคลังสหรัฐฯ เองจะ "แผ่วลง" ในวันเดียวกัน`},
      sources:[{l:"MarketScreener",u:"https://de.marketscreener.com/boerse-nachrichten/xetra-schluss-leichtes-plus-zum-wochenende-dax-wieder-ueber-26-000-punkten-ce7858dadd88ff27"},{l:"CNBC Markets",u:"https://www.cnbc.com/markets/"},{l:"Bloomberg Europe",u:"https://www.bloomberg.com/europe"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"66,016.36", chg:-0.3, series:[66216.79,66016.36],
      txt:{en:`<b>Nikkei eased 0.30% to 66,016.36 Friday,</b> a modest pullback after Thursday's sharp rebound, as the region digested a choppy week of US Treasury-yield swings. The move was far calmer than the Wed-rout/Thu-rebound whipsaw earlier in the week, with sentiment steadying into the weekend as Canada and the US resolved their tariff standoff.`, th:`<b>Nikkei ปรับลง 0.30% สู่ 66,016.36 วันศุกร์</b> การย่อตัวเล็กน้อยหลังฟื้นตัวแรงวันพฤหัสฯ ขณะภูมิภาคย่อยสัปดาห์ที่ผันผวนหนักจากการแกว่งตัวของผลตอบแทนพันธบัตรสหรัฐฯ การเคลื่อนไหวสงบกว่ามากเทียบกับการแกว่งตัวเทขายวันพุธ/ฟื้นตัววันพฤหัสฯ ก่อนหน้านี้ ขณะบรรยากาศเริ่มนิ่งขึ้นก่อนสุดสัปดาห์ หลังแคนาดาและสหรัฐฯ คลี่คลายข้อพิพาทภาษี`},
      why:{en:`A near-flat Friday after the week's sharp whipsaw suggests realized volatility is cooling into the weekend — a good moment to reinforce that short-term swings in tech/AI holdings are noise against the longer growth story, while keeping clients aware Warsh's Jackson Hole speech next Friday could reopen volatility.`, th:`วันศุกร์ที่แทบไม่เปลี่ยนแปลง หลังการแกว่งตัวแรงตลอดสัปดาห์ บ่งชี้ว่าความผันผวนจริงกำลังลดลงก่อนสุดสัปดาห์ — เป็นจังหวะดีที่จะย้ำว่าการแกว่งตัวระยะสั้นในพอร์ตเทค/AI เป็นเพียงสัญญาณรบกวนเทียบกับเรื่องราวการเติบโตระยะยาว พร้อมเตือนลูกค้าว่าสุนทรพจน์ Jackson Hole ของ Warsh ศุกร์หน้าอาจจุดความผันผวนกลับมาอีกครั้ง`},
      full:{en:`Asian equities were mixed to modestly lower Friday after the week's sharp swings. Japan's Nikkei 225 eased 0.30% to close at 66,016.36, giving back a small part of Thursday's 1.36% chip-led rebound, as investors weighed a choppy week of Treasury-yield moves and Treasury's own bond-buyback relief rally "fizzling out" the same session. The move was notably calmer than the Wednesday sidecar-triggering plunge and Thursday's sharp bounce, suggesting realized volatility eased into the weekend as Canada and the US resolved their tariff standoff ahead of Friday's deadline. Markets are now closed until Monday, with Fed Chair Warsh's first Jackson Hole keynote (28 August) the next scheduled catalyst for the region.`, th:`หุ้นเอเชียเคลื่อนไหวผสมถึงปรับลงเล็กน้อยวันศุกร์ หลังการแกว่งตัวแรงตลอดสัปดาห์ ดัชนี Nikkei 225 ญี่ปุ่นปรับลง 0.30% ปิดที่ 66,016.36 คืนกำไรบางส่วนจากการฟื้นตัว 1.36% ที่นำโดยหุ้นชิปเมื่อวันพฤหัสฯ ขณะนักลงทุนประเมินสัปดาห์ที่ผันผวนหนักจากการเคลื่อนไหวของผลตอบแทนพันธบัตร และการที่ความพยายามซื้อคืนพันธบัตรของคลังสหรัฐฯ เอง "แผ่วลง" ในวันเดียวกัน การเคลื่อนไหวนี้สงบกว่าอย่างชัดเจนเทียบกับการดิ่งลงจนต้องหยุดพักการซื้อขายวันพุธ และการดีดตัวแรงวันพฤหัสฯ บ่งชี้ว่าความผันผวนจริงลดลงก่อนสุดสัปดาห์ หลังแคนาดาและสหรัฐฯ คลี่คลายข้อพิพาทภาษีก่อนเส้นตายวันศุกร์ ตลาดปิดจนถึงวันจันทร์ โดยสุนทรพจน์ Jackson Hole ครั้งแรกของประธานเฟด Warsh (28 ส.ค.) จะเป็นปัจจัยขับเคลื่อนถัดไปที่กำหนดไว้สำหรับภูมิภาค`},
      sources:[{l:"CNBC Asia Markets",u:"https://www.cnbc.com/markets/asia-markets/"},{l:"Yahoo Finance",u:"https://finance.yahoo.com/markets/live/stock-market-today-friday-august-21-dow-sp-500-nasdaq-bitcoin-080533702.html"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"26,009.46", chg:1.21, series:[25698.49,26009.46],
      txt:{en:`<b>Hang Seng jumped 1.21% Friday to 26,009.46,</b> the region's strongest gain, while mainland China's <b>Shanghai Composite was little-changed, +0.04% to 3,905.20.</b> Hong Kong led Asia's Friday session as the resolved Canada-US tariff deal lifted risk appetite broadly, even as Greater China continues to sit on an unresolved US–China tariff overhang.`, th:`<b>Hang Seng พุ่งขึ้น 1.21% วันศุกร์ สู่ 26,009.46</b> ปรับขึ้นแรงสุดในภูมิภาค ขณะ <b>Shanghai Composite จีนแผ่นดินใหญ่แทบไม่เปลี่ยนแปลง +0.04% สู่ 3,905.20</b> ฮ่องกงนำการปรับขึ้นของเอเชียวันศุกร์ หลังข้อตกลงภาษีแคนาดา-สหรัฐฯ ที่คลี่คลายแล้วหนุนความเชื่อมั่นความเสี่ยงในวงกว้าง แม้จีนแผ่นดินใหญ่/ฮ่องกงยังอยู่บนแรงกดดันภาษีสหรัฐ-จีนที่ยังไม่คลี่คลาย`},
      why:{en:`Hong Kong outpacing a flat Shanghai on Friday, on the back of a resolved North American tariff risk rather than any China-specific news, is a reminder the rally is externally driven — keep favouring diversified Asia exposure and bonds over a concentrated China/HK bet.`, th:`ฮ่องกงที่ปรับขึ้นแรงกว่าเซี่ยงไฮ้ที่แทบไม่ขยับวันศุกร์ จากความเสี่ยงภาษีอเมริกาเหนือที่คลี่คลายแล้ว มากกว่าข่าวเฉพาะจีน เป็นเครื่องเตือนใจว่าการปรับขึ้นนี้มาจากปัจจัยภายนอก — ควรยังคงแนะนำให้กระจายลงทุนในเอเชียและตราสารหนี้ มากกว่าเดิมพันจีน/ฮ่องกงแบบเข้มข้น`},
      full:{en:`Hong Kong stocks led Asia's Friday session. The Hang Seng jumped 1.21% to close at 26,009.46, its strongest showing among major regional benchmarks, as Canada and the US struck a tariff deal ahead of Friday's deadline and broader risk appetite firmed alongside Wall Street's rebound. Mainland China's Shanghai Composite was little-changed, edging up 0.04% to 3,905.20, a far more muted move suggesting the mainland index stayed rangebound even as Hong Kong-listed names caught the risk-on bid. The gains sit on top of an unresolved US–China tariff overhang (China's rate still at 12.5%, with pharma tariffs floated toward 200% later in 2026), reinforcing the case for diversified Asia-ex-China strategies and fixed income over concentrated single-country exposure.`, th:`หุ้นฮ่องกงนำการปรับขึ้นของเอเชียวันศุกร์ ดัชนี Hang Seng พุ่งขึ้น 1.21% ปิดที่ 26,009.46 ปรับขึ้นแรงสุดในบรรดาดัชนีหลักของภูมิภาค หลังแคนาดาและสหรัฐฯ บรรลุข้อตกลงภาษีก่อนเส้นตายวันศุกร์ และความเชื่อมั่นความเสี่ยงในวงกว้างแข็งแกร่งขึ้นตามการฟื้นตัวของวอลล์สตรีท ดัชนี Shanghai Composite จีนแผ่นดินใหญ่แทบไม่เปลี่ยนแปลง ขยับขึ้นเพียง 0.04% สู่ 3,905.20 การเคลื่อนไหวที่เบากว่ามากนี้บ่งชี้ว่าดัชนีแผ่นดินใหญ่ยังเคลื่อนไหวในกรอบแคบ แม้หุ้นที่จดทะเบียนในฮ่องกงจะได้รับแรงซื้อจากบรรยากาศ risk-on การปรับขึ้นนี้ยังอยู่บนแรงกดดันภาษีสหรัฐ-จีนที่ยังไม่คลี่คลาย (อัตราภาษีจีนยังอยู่ที่ 12.5% และสหรัฐฯ ส่งสัญญาณอาจขึ้นภาษียาสูงถึง 200% ปลายปี 2026) ตอกย้ำเหตุผลให้เลือกกลยุทธ์เอเชียไม่รวมจีนแบบกระจายความเสี่ยงและตราสารหนี้มากกว่าการเดิมพันประเทศเดียว`},
      sources:[{l:"CNBC Asia Markets",u:"https://www.cnbc.com/markets/asia-markets/"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"},{l:"Yahoo Finance",u:"https://finance.yahoo.com/markets/live/stock-market-today-friday-august-21-dow-sp-500-nasdaq-bitcoin-080533702.html"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,613.78", chg:0.24, series:[1609.99,1613.78],
      txt:{en:`<b>SET Index rose 0.24% to 1,613.78 Friday (+3.79pts),</b> on turnover of about THB 70.6 billion, with energy names tracking firmer global oil prices as Brent held near $93–94/bbl on the still-active Iran standoff.`, th:`<b>ดัชนี SET เพิ่มขึ้น 0.24% สู่ 1,613.78 วันศุกร์ (+3.79 จุด)</b> มูลค่าการซื้อขายราว 7.06 หมื่นล้านบาท โดยหุ้นกลุ่มพลังงานได้แรงหนุนจากราคาน้ำมันโลกที่แข็งแกร่งขึ้น ขณะเบรนท์ยืนใกล้ $93-94 ต่อบาร์เรลจากสถานการณ์อิหร่านที่ยังตึงเครียด`},
      why:{en:`A modest SET gain led by energy on firmer oil, while the local index still trails the sharper moves in Hong Kong and the US, keeps yield-seeking clients looking toward offshore bonds and funds — your core book — as the more compelling story this week.`, th:`SET ที่ปรับขึ้นเล็กน้อยนำโดยกลุ่มพลังงานจากราคาน้ำมันที่แข็งแกร่งขึ้น ขณะดัชนีในประเทศยังตามหลังการเคลื่อนไหวที่แรงกว่าในฮ่องกงและสหรัฐฯ ยังคงผลักดันให้ลูกค้าที่มองหาผลตอบแทนหันไปหาตราสารหนี้และกองทุนต่างประเทศ — ซึ่งเป็นพอร์ตหลักของคุณ — เป็นเรื่องราวที่น่าสนใจกว่าสัปดาห์นี้`},
      full:{en:`Thailand's SET Index closed Friday at 1,613.78, up 3.79 points (+0.24%), on turnover of about THB 70.6 billion. Energy stocks led the gains as global oil prices firmed, with Brent holding near $93–94/bbl on track for a second straight weekly gain of over 5% amid the still-active Iran standoff. The move was more modest than Hong Kong's 1.21% Friday jump or Wall Street's rebound, leaving Thailand's local index a relative laggard even as global risk appetite improved on the resolved Canada-US tariff deal. With global bond yields elevated again after Treasury's own buyback-relief rally fizzled, yield-seeking Thai investors continue to look offshore for income and growth alongside domestic exposure.`, th:`ดัชนี SET ของไทยปิดตลาดวันศุกร์ที่ 1,613.78 เพิ่มขึ้น 3.79 จุด (+0.24%) มูลค่าการซื้อขายราว 7.06 หมื่นล้านบาท หุ้นกลุ่มพลังงานนำการปรับขึ้น เนื่องจากราคาน้ำมันโลกแข็งแกร่งขึ้น โดยเบรนท์ยืนใกล้ $93-94 ต่อบาร์เรล มีแนวโน้มปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 2 ติดต่อกันกว่า 5% ท่ามกลางสถานการณ์อิหร่านที่ยังตึงเครียด การเคลื่อนไหวนี้ยังเบากว่าฮ่องกงที่พุ่งขึ้น 1.21% วันศุกร์ หรือการฟื้นตัวของวอลล์สตรีท ทำให้ดัชนีในประเทศไทยยังตามหลังเทียบเคียง แม้ความเชื่อมั่นความเสี่ยงทั่วโลกจะดีขึ้นจากข้อตกลงภาษีแคนาดา-สหรัฐฯ ที่คลี่คลายแล้ว เมื่อผลตอบแทนพันธบัตรทั่วโลกยืนสูงอีกครั้งหลังการซื้อคืนพันธบัตรของคลังสหรัฐฯ แผ่วลง นักลงทุนไทยที่มองหาผลตอบแทนจึงยังหันไปลงทุนต่างประเทศควบคู่กับการลงทุนในประเทศ`},
      sources:[{l:"Kaohoon",u:"https://www.kaohoon.com/summary/856637"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"InfoQuest",u:"https://www.infoquest.co.th/2026/635747"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold topped $4,600/oz Friday, its highest since 15 May,</b> before easing to around $4,580, on track for a third straight weekly gain of roughly 5% — driven by dollar weakness and, notably, by Treasury's own bond-buyback move stirring fiscal-sustainability concerns rather than calming them, per multiple outlets. <b>Brent held near $93–94/bbl, on track for a second straight weekly gain of over 5%,</b> as Trump announced what he called the "most crushing" new Iran sanctions Thursday, Tehran vowed the "economic warfare" would fail, and Ukrainian strikes on Russian energy infrastructure added a second supply-risk vector.`, th:`<b>ทองคำทะลุ $4,600 ต่อออนซ์วันศุกร์ สูงสุดตั้งแต่ 15 พ.ค.</b> ก่อนย่อลงมาราว $4,580 มีแนวโน้มปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 3 ติดต่อกันราว 5% — แรงหนุนมาจากเงินดอลลาร์ที่อ่อนค่า และที่น่าสนใจคือมาตรการซื้อคืนพันธบัตรของคลังสหรัฐฯ เองที่จุดความกังวลเรื่องความยั่งยืนทางการคลังแทนที่จะช่วยคลายกังวล ตามรายงานจากหลายสำนักข่าว <b>เบรนท์ยืนใกล้ $93-94 ต่อบาร์เรล มีแนวโน้มปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 2 ติดต่อกันกว่า 5%</b> หลังทรัมป์ประกาศมาตรการคว่ำบาตรอิหร่านรอบใหม่ที่เขาเรียกว่า "รุนแรงที่สุด" เมื่อวันพฤหัสฯ อิหร่านประกาศว่า "สงครามเศรษฐกิจ" จะล้มเหลว และการโจมตีโครงสร้างพื้นฐานพลังงานรัสเซียของยูเครนก็เพิ่มความเสี่ยงด้านอุปทานอีกทาง`},
     why:{en:`Gold making a fresh 3-month high on a fiscal-credibility scare — not just a rate trade — is the clearest sign yet that markets are questioning debt sustainability itself; pair it with Brent's second straight weekly gain to make the case that both the war-risk and fiscal-credibility hedges are live and working right now.`, th:`การที่ทองคำทำสถิติสูงสุดในรอบ 3 เดือนจากความกังวลเรื่องความน่าเชื่อถือทางการคลัง ไม่ใช่แค่การเทรดตามอัตราดอกเบี้ย เป็นสัญญาณที่ชัดเจนที่สุดว่าตลาดกำลังตั้งคำถามกับความยั่งยืนของหนี้สาธารณะเอง ควรจับคู่กับเบรนท์ที่ปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 2 ติดต่อกัน เพื่อชี้ให้เห็นว่าทั้งตัวป้องกันความเสี่ยงสงครามและความน่าเชื่อถือทางการคลังกำลังทำงานอยู่จริงตอนนี้`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Treasury's own bond-buyback rally "fizzled out" Friday</b> per CNBC: the 30-year yield, which had briefly dipped to about 5.18% on Wednesday's buyback news, climbed back to roughly 5.25–5.27%, while <b>the 10-year held near 4.71%.</b> CNBC reported the intervention is now stirring inflation and fiscal-sustainability worries rather than easing them, with public debt having crossed $40tn for the first time. All eyes now turn to <b>Fed Chair Kevin Warsh's first Jackson Hole keynote as chair (27–29 Aug, speech Friday 28th)</b> — the last major scheduled opportunity to shape expectations before the 16 September FOMC. Warsh has said the speech will focus on "big picture" structural questions rather than near-term guidance, and has stressed Fed independence from market pricing.`, th:`<b>ความพยายามซื้อคืนพันธบัตรของคลังสหรัฐฯ เอง "แผ่วลง" วันศุกร์</b> ตามรายงานของ CNBC: ผลตอบแทนพันธบัตร 30 ปี ที่เคยดิ่งลงชั่วคราวสู่ราว 5.18% จากข่าวซื้อคืนวันพุธ ดีดกลับสู่ราว 5.25-5.27% ขณะ <b>ผลตอบแทน 10 ปียืนใกล้ 4.71%</b> CNBC รายงานว่ามาตรการนี้กำลังจุดความกังวลเรื่องเงินเฟ้อและความยั่งยืนทางการคลัง แทนที่จะช่วยคลายกังวล ขณะหนี้สาธารณะสหรัฐฯ ทะลุ 40 ล้านล้านดอลลาร์เป็นครั้งแรก ทุกสายตาตอนนี้จับจ้องไปที่ <b>สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh (27-29 ส.ค. สุนทรพจน์วันศุกร์ที่ 28)</b> — โอกาสสำคัญครั้งสุดท้ายที่กำหนดไว้ในการกำหนดทิศทางความคาดหวังก่อนการประชุมเฟด 16 ก.ย. Warsh ระบุว่าสุนทรพจน์นี้จะเน้นคำถามเชิงโครงสร้าง "ภาพใหญ่" มากกว่าแนวทางระยะสั้น และย้ำความเป็นอิสระของเฟดจากการตั้งราคาของตลาด`},
     why:{en:`A buyback rally that fizzles within two sessions, on top of debt crossing $40tn, tells clients the coupon-lock window is still narrowing in real time — Warsh's Jackson Hole debut next Friday is the next event that could move it further, making this an ideal week to act rather than wait for more clarity.`, th:`การซื้อคืนพันธบัตรที่แผ่วลงภายในสองวันทำการ บวกกับหนี้สาธารณะที่ทะลุ 40 ล้านล้านดอลลาร์ บอกลูกค้าว่าหน้าต่างโอกาสล็อกคูปองยังคงแคบลงจริงตอนนี้ — สุนทรพจน์ Jackson Hole ครั้งแรกของ Warsh ศุกร์หน้าคือเหตุการณ์ถัดไปที่อาจขยับสถานการณ์ต่อไปอีก ทำให้สัปดาห์นี้เป็นจังหวะที่เหมาะจะลงมือ มากกว่ารอความชัดเจนเพิ่มเติม`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`<b>Canada and the US struck a tariff deal just ahead of Friday night's deadline,</b> cutting the disputed auto tariff to 15% from 25% while preserving a US-content exemption, and halving steel/aluminum tariffs to 25%. Ottawa didn't secure the full carve-out it wanted for Canadian/Mexican content, and the deal drew domestic friction — US VP Vance dismissed PM Carney's "victory" framing as a "climb-down," and Manitoba's premier criticized the concessions. China's rate stays at 12.5%; Washington has floated pharma tariffs rising toward 200% later in 2026.`, th:`<b>แคนาดาและสหรัฐฯ บรรลุข้อตกลงภาษีก่อนเส้นตายคืนวันศุกร์เพียงเล็กน้อย</b> ลดภาษีรถยนต์ที่เป็นข้อพิพาทเหลือ 15% จาก 25% พร้อมคงการยกเว้นสำหรับสัดส่วนวัตถุดิบสหรัฐฯ และลดภาษีเหล็ก/อะลูมิเนียมลงครึ่งหนึ่งเหลือ 25% ออตตาวาไม่ได้รับการยกเว้นเต็มรูปแบบสำหรับสัดส่วนวัตถุดิบแคนาดา/เม็กซิโกตามที่ต้องการ และข้อตกลงนี้ก่อความไม่พอใจในประเทศ — รองประธานาธิบดีสหรัฐฯ Vance ปฏิเสธการที่นายกฯ Carney เรียกว่าเป็น "ชัยชนะ" โดยระบุว่าเป็นการ "ยอมถอย" และนายกรัฐมนตรีมณฑลแมนิโทบาวิจารณ์การประนีประนอมนี้ อัตราภาษีจีนยังคงที่ 12.5% สหรัฐยังส่งสัญญาณอาจขึ้นภาษียาสูงถึง 200% ปลายปี 2026`}, w:{en:`A resolved tariff risk removes one near-term overhang for Canada-exposed clients, but the political friction around the deal (and the still-open US-China tariff track) is a reminder that trade policy risk hasn't disappeared — keep the broader case for bonds and diversified global exposure over single-country bets front and centre.`, th:`ความเสี่ยงภาษีที่คลี่คลายแล้วช่วยขจัดความกังวลระยะสั้นสำหรับลูกค้าที่มีสัดส่วนสินทรัพย์แคนาดา แต่ความขัดแย้งทางการเมืองรอบข้อตกลงนี้ (และเส้นทางภาษีสหรัฐ-จีนที่ยังไม่จบ) เป็นเครื่องเตือนใจว่าความเสี่ยงนโยบายการค้ายังไม่หายไป ควรยังเน้นย้ำเหตุผลหลักเรื่องตราสารหนี้และกระจายลงทุนทั่วโลก มากกว่าเดิมพันประเทศเดียว`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>The Iran conflict — active since 28 February 2026 — stayed live into the weekend:</b> Trump announced what he called the "most crushing" new sanctions on Iran Thursday, and Tehran responded that the "economic warfare" will fail; two Iranian diplomats in France are set to be expelled over a separate embassy-staff dispute. Despite a June memorandum aimed at reopening the Strait of Hormuz, fighting resumed in July after Iran struck three commercial vessels. <b>Oil stayed bid: Brent near $93–94/bbl, on track for a second straight weekly gain of over 5%,</b> with Ukrainian strikes on Russian energy infrastructure adding a second supply-risk vector alongside the Iran standoff.`, th:`<b>ความขัดแย้งกับอิหร่าน — ที่ดำเนินอยู่ตั้งแต่ 28 ก.พ. 2026 — ยังคงคุกรุ่นต่อเนื่องเข้าสู่สุดสัปดาห์:</b> ทรัมป์ประกาศมาตรการคว่ำบาตรอิหร่านรอบใหม่ที่เขาเรียกว่า "รุนแรงที่สุด" เมื่อวันพฤหัสฯ อิหร่านตอบโต้ว่า "สงครามเศรษฐกิจ" จะล้มเหลว ขณะนักการทูตอิหร่าน 2 คนในฝรั่งเศสกำลังจะถูกขับออกจากกรณีพิพาทเจ้าหน้าที่สถานทูตแยกต่างหาก แม้จะมีบันทึกความเข้าใจเดือน มิ.ย. ที่มุ่งเปิดช่องแคบฮอร์มุซใหม่ แต่การสู้รบกลับมาปะทุอีกครั้งในเดือน ก.ค. หลังอิหร่านโจมตีเรือพาณิชย์ 3 ลำ <b>ราคาน้ำมันยังยืนแข็งแกร่ง: เบรนท์ใกล้ $93-94 ต่อบาร์เรล มีแนวโน้มปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 2 ติดต่อกันกว่า 5%</b> โดยการโจมตีโครงสร้างพื้นฐานพลังงานรัสเซียของยูเครนเพิ่มความเสี่ยงด้านอุปทานอีกทาง ควบคู่กับสถานการณ์อิหร่านที่ตึงเครียด`}, w:{en:`A second straight weekly gain in oil, on top of fresh "most crushing" sanctions rhetoric and a still-unresolved conflict, confirms the geopolitical risk premium is building rather than fading — keep gold's record run in the conversation as the cleaner hedge alongside oil-sensitive positioning.`, th:`ราคาน้ำมันที่ปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 2 ติดต่อกัน บวกกับถ้อยแถลงคว่ำบาตร "รุนแรงที่สุด" รอบใหม่ และความขัดแย้งที่ยังไม่คลี่คลาย ยืนยันว่าส่วนชดเชยความเสี่ยงภูมิรัฐศาสตร์กำลังก่อตัวเพิ่มขึ้น ไม่ใช่จางหาย ควรคงทองคำที่ทำสถิติใหม่ไว้ในบทสนทนาในฐานะตัวป้องกันความเสี่ยงที่ชัดเจนกว่า ควบคู่กับตำแหน่งที่อ่อนไหวต่อราคาน้ำมัน`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`<b>Treasury's bond-buyback rally "fizzled out" Friday, per CNBC:</b> the 30-year yield, which had briefly dipped to about 5.18% Wednesday, climbed back to roughly 5.25–5.27%, while the 10-year held near 4.71%. Public debt has crossed $40tn for the first time, and CNBC reports the buyback intervention is now stirring fiscal-sustainability worries rather than easing them. <b>Fed Chair Kevin Warsh's first Jackson Hole keynote as chair lands Friday 28 August</b> — the last major scheduled signal ahead of the 16 September FOMC.`, th:`<b>การซื้อคืนพันธบัตรของคลังสหรัฐฯ "แผ่วลง" วันศุกร์ ตามรายงานของ CNBC:</b> ผลตอบแทนพันธบัตร 30 ปี ที่เคยดิ่งลงชั่วคราวสู่ราว 5.18% วันพุธ ดีดกลับสู่ราว 5.25-5.27% ขณะ 10 ปียืนใกล้ 4.71% หนี้สาธารณะสหรัฐฯ ทะลุ 40 ล้านล้านดอลลาร์เป็นครั้งแรก และ CNBC รายงานว่ามาตรการซื้อคืนกำลังจุดความกังวลเรื่องความยั่งยืนทางการคลัง แทนที่จะช่วยคลายกังวล <b>สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh จะมีขึ้นวันศุกร์ที่ 28 ส.ค.</b> — สัญญาณสำคัญครั้งสุดท้ายที่กำหนดไว้ก่อนการประชุมเฟด 16 ก.ย.`}, w:{en:`A buyback rally that fizzles within two sessions, with debt now above $40tn, is the clearest signal yet that even a direct policy intervention couldn't hold this coupon level down for long. Clients who lock in now, before Warsh's Jackson Hole debut could move the picture again, capture a level that may not return for a long time.`, th:`การซื้อคืนพันธบัตรที่แผ่วลงภายในสองวันทำการ ขณะหนี้สาธารณะสูงกว่า 40 ล้านล้านดอลลาร์แล้ว คือสัญญาณที่ชัดเจนที่สุดว่าแม้แต่มาตรการแทรกแซงนโยบายโดยตรงก็ยังกดระดับคูปองนี้ไว้ไม่ได้นาน ลูกค้าที่ล็อกตอนนี้ ก่อนสุนทรพจน์ Jackson Hole ของ Warsh อาจขยับภาพอีกครั้ง จะได้ระดับที่อาจไม่กลับมาอีกในระยะยาว`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`<b>Treasury's own bond-buyback move is now being read as an inflation risk in itself:</b> CNBC reports the intervention is "stirring inflation worries" rather than easing them, as markets question whether artificially suppressing long yields while debt tops $40tn is sustainable. Gold's jump above $4,600 — a fresh 3-month high — is itself a market signal of rising inflation/debt-sustainability concern, not just a safe-haven trade.`, th:`<b>มาตรการซื้อคืนพันธบัตรของคลังสหรัฐฯ เองกำลังถูกมองว่าเป็นความเสี่ยงเงินเฟ้อในตัวมันเอง:</b> CNBC รายงานว่ามาตรการนี้ "กำลังจุดความกังวลเรื่องเงินเฟ้อ" แทนที่จะช่วยคลายกังวล ขณะตลาดตั้งคำถามว่าการกดผลตอบแทนพันธบัตรระยะยาวอย่างเทียมๆ ในขณะที่หนี้สาธารณะทะลุ 40 ล้านล้านดอลลาร์นั้นยั่งยืนหรือไม่ การที่ทองคำพุ่งทะลุ $4,600 สถิติสูงสุดใหม่ในรอบ 3 เดือน ก็เป็นสัญญาณตลาดที่บ่งชี้ความกังวลเงินเฟ้อ/ความยั่งยืนของหนี้ที่เพิ่มขึ้น ไม่ใช่แค่การเทรดสินทรัพย์ปลอดภัย`}, w:{en:`When the market reads a central-bank-adjacent liquidity move as inflationary rather than reassuring, that's a stronger signal than any single data print — support a "stay nimble, don't assume rates stay low" narrative and use gold's record run as visible proof clients can point to.`, th:`เมื่อตลาดตีความมาตรการสภาพคล่องที่เกี่ยวข้องกับธนาคารกลางว่าเป็นปัจจัยเงินเฟ้อ แทนที่จะช่วยสร้างความมั่นใจ นั่นคือสัญญาณที่หนักแน่นกว่าข้อมูลเศรษฐกิจตัวใดตัวหนึ่ง ควรสนับสนุนแนวคิด "ต้องพร้อมปรับตัว อย่าคิดว่าดอกเบี้ยจะอยู่ในระดับต่ำตลอด" และใช้สถิติใหม่ของทองคำเป็นหลักฐานที่จับต้องได้ให้ลูกค้าเห็น`}},
  ];

  const WATCH=[
    {day:{en:"Done",th:"แล้ว"}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"l", t:{en:"US CPI & PPI — July (released: cooled)",th:"CPI & PPI สหรัฐ — ก.ค. (ออกแล้ว: ชะลอ)"}, d:{en:"CPI eased to 3.4% and PPI was soft — the week's big positive surprise. Hike odds fell toward one-in-three.",th:"CPI ชะลอเหลือ 3.4% และ PPI อ่อนตัว — เซอร์ไพรส์เชิงบวกของสัปดาห์ โอกาสขึ้นดอกเบี้ยลดเหลือราว 1 ใน 3"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"US retail sales — July (released: −0.6%, missed)",th:"ยอดค้าปลีกสหรัฐ — ก.ค. (ออกแล้ว: −0.6% ต่ำกว่าคาด)"}, d:{en:"Sales fell 0.6% m/m, the steepest drop since May 2025, versus +0.1% expected. A soft-consumer signal, though futures barely reacted.",th:"ยอดขายลด 0.6% จากเดือนก่อน ลดแรงสุดตั้งแต่ พ.ค. 2025 เทียบคาดการณ์ +0.1% สัญญาณผู้บริโภคอ่อนแรง แม้ตลาดล่วงหน้าแทบไม่ขยับ"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"US threatens 'indefinite' Iran blockade — oil jumps",th:"สหรัฐขู่ปิดล้อมอิหร่าน 'ไม่มีกำหนด' — น้ำมันพุ่ง"}, d:{en:"Defense Sec. Hegseth said the naval blockade could continue indefinitely; Treasury Sec. Bessent floated tougher Iran sanctions. Brent jumped to ~$88.64 (+1.8%) before settling near $87.74.",th:"รมว.กลาโหม Hegseth ระบุอาจปิดล้อมทางเรืออิหร่านต่อไปไม่มีกำหนด ขณะ รมว.คลัง Bessent ส่งสัญญาณคว่ำบาตรอิหร่านที่รุนแรงขึ้น ราคาน้ำมัน Brent พุ่งสู่ราว $88.64 (+1.8%) ก่อนย่อลงมาปิดใกล้ $87.74"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US consumer sentiment craters — UMich 51.0 vs 54.5 expected",th:"ความเชื่อมั่นผู้บริโภคสหรัฐทรุดหนัก — UMich 51.0 เทียบคาดการณ์ 54.5"}, d:{en:"The preliminary August reading fell from July's 55.2, a sharp miss that broke Wall Street's three-day record streak. Year-ahead inflation expectations also ticked up to 4.3%, from 4.2%.",th:"ดัชนีเบื้องต้นเดือน ส.ค. ลดจาก 55.2 ของเดือน ก.ค. พลาดเป้าอย่างแรงจนทำให้สถิติปิดต่อเนื่อง 3 วันของหุ้นสหรัฐหลุด คาดการณ์เงินเฟ้อ 1 ปีข้างหน้าก็ขยับขึ้นเป็น 4.3% จาก 4.2%"}},
    {day:{en:"Sat",th:"ส."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"h", t:{en:"Hormuz standoff escalates: Trump's \"territory\" claim, Bessent's isolation threat, new sea incidents",th:"ฮอร์มุซตึงเครียดขึ้น: ทรัมป์ขู่ \"ดินแดน\" Bessent ขู่โดดเดี่ยวเศรษฐกิจ เหตุปะทะกลางทะเลใหม่"}, d:{en:"Trump vowed to declare the Strait of Hormuz US territory; Iran's judiciary chief dismissed the claim. The UAE accused Iran of attacking a vessel in the Strait, Houthi rebels struck a Yemeni Red Sea port, and Treasury Secretary Bessent said the US is preparing unprecedented \"economic isolation\" measures against Iran — keeping oil's risk premium live into Monday's open.",th:"ทรัมป์ขู่ประกาศให้ช่องแคบฮอร์มุซเป็นดินแดนสหรัฐฯ ประธานศาลอิหร่านปฏิเสธ สหรัฐอาหรับเอมิเรตส์กล่าวหาอิหร่านโจมตีเรือในช่องแคบ กบฏฮูตีโจมตีท่าเรือในเยเมนบริเวณทะเลแดง และ รมว.คลัง Bessent ระบุสหรัฐฯ กำลังเตรียมมาตรการ \"โดดเดี่ยวทางเศรษฐกิจ\" ต่ออิหร่านที่ไม่เคยมีมาก่อน ทำให้ความเสี่ยงราคาน้ำมันยังคงอยู่ก่อนตลาดเปิดวันจันทร์"}},
    {day:{en:"Sun",th:"อา."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"h", t:{en:"Israeli strikes kill 11 in Lebanon — deadliest since June ceasefire; Ukraine's largest drone attack on Moscow draws Russian missiles",th:"อิสราเอลโจมตีเลบานอน เสียชีวิต 11 ราย รุนแรงสุดตั้งแต่หยุดยิง มิ.ย. — ยูเครนถล่มโดรนมอสโกครั้งใหญ่สุด รัสเซียตอบโต้ด้วยขีปนาวุธ"}, d:{en:"Pre-dawn Israeli strikes on Ansar and Deir ez-Zahrani in south Lebanon's Nabatieh district killed at least 11 people, including three children, and wounded about 19 — the deadliest toll since the Israel-Hezbollah ceasefire took effect in June. Israel said it killed senior Hezbollah commander Abu Hassan Alaa a day earlier and blamed Hezbollah for wounding three soldiers with explosive drones; Bloomberg reported the ceasefire itself now risks unraveling. Separately, Ukraine launched its largest drone attack on Moscow since the war began, and Russia responded with missile strikes on Kyiv.",th:"การโจมตีทางอากาศของอิสราเอลช่วงเช้ามืดที่เมือง Ansar และ Deir ez-Zahrani ในเขต Nabatieh ทางใต้ของเลบานอน ทำให้มีผู้เสียชีวิตอย่างน้อย 11 ราย รวมเด็ก 3 คน บาดเจ็บราว 19 ราย ถือเป็นยอดผู้เสียชีวิตสูงสุดนับตั้งแต่ข้อตกลงหยุดยิงอิสราเอล-ฮิซบอลเลาะห์เริ่มมีผลเดือน มิ.ย. อิสราเอลระบุว่าสังหารผู้บัญชาการฮิซบอลเลาะห์ระดับสูง Abu Hassan Alaa ไปเมื่อวันก่อนหน้า และกล่าวโทษฮิซบอลเลาะห์ว่าใช้โดรนระเบิดทำให้ทหารบาดเจ็บ 3 นาย ขณะที่ Bloomberg รายงานว่าข้อตกลงหยุดยิงเองก็เสี่ยงจะแตกหัก นอกจากนี้ ยูเครนยังเปิดฉากโจมตีโดรนมอสโกครั้งใหญ่ที่สุดของสงคราม ทำให้รัสเซียตอบโต้ด้วยขีปนาวุธถล่มเคียฟ"}},
    {day:{en:"Sun",th:"อา."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"m", t:{en:"Iran-Oman edge toward a Hormuz reopening deal, contingent on the US",th:"อิหร่าน-โอมานใกล้บรรลุข้อตกลงเปิดฮอร์มุซ ขึ้นกับสหรัฐฯ"}, d:{en:"Iran's FM Araghchi said talks with Oman on a new shipping route through the Strait of Hormuz are in their \"final stages,\" but a full reopening still hinges on Washington upholding the June ceasefire MoU. Iranian officials maintain the strait stays blocked until their conditions are met — a potential de-escalation path that could cap oil's upside even as the Lebanon front flares.",th:"รมว.ต่างประเทศอิหร่าน Araghchi ระบุการเจรจากับโอมานเรื่องเส้นทางเดินเรือใหม่ผ่านช่องแคบฮอร์มุซเข้าสู่ \"ขั้นตอนสุดท้าย\" แต่การเปิดช่องแคบเต็มรูปแบบยังขึ้นอยู่กับสหรัฐฯ ปฏิบัติตามข้อตกลง MoU หยุดยิงเดือน มิ.ย. เจ้าหน้าที่อิหร่านยืนยันว่าช่องแคบยังปิดจนกว่าเงื่อนไขของตนจะได้รับการยอมรับ — เส้นทางคลี่คลายที่อาจสกัดขาขึ้นของราคาน้ำมัน แม้สถานการณ์เลบานอนจะร้อนแรงขึ้น"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US-Iran ceasefire expires with no deal in sight",th:"หยุดยิงสหรัฐ-อิหร่านหมดอายุไร้ข้อตกลง"}, d:{en:"The 60-day ceasefire lapsed Monday. Iran's FM Araghchi said Tehran has \"not made a decision to restart negotiations\"; a senior White House official called the standoff \"static.\" Markets shrugged so far — Asian equities rallied and oil eased — but the risk is live for a fast repricing on any escalation.",th:"หยุดยิงระยะ 60 วันหมดอายุลงวันจันทร์ รมว.ต่างประเทศอิหร่าน Araghchi ระบุอิหร่าน \"ยังไม่ตัดสินใจกลับมาเจรจา\" เจ้าหน้าที่อาวุโสทำเนียบขาวเรียกสถานการณ์นี้ว่า \"หยุดนิ่ง\" ตลาดยังไม่ตอบสนองรุนแรงในตอนนี้ — หุ้นเอเชียปรับขึ้นและน้ำมันอ่อนตัวลง — แต่ความเสี่ยงยังมีอยู่หากมีข่าวความรุนแรงเพิ่มเติม"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Anthropic's ~$200bn 2028 revenue forecast lifts AI stocks",th:"คาดการณ์รายได้ปี 2028 ของ Anthropic ที่ราว 2 แสนล้านดอลลาร์ หนุนหุ้น AI"}, d:{en:"Ahead of a planned IPO, Anthropic reportedly projected 2028 revenue near $190–200bn. The report lifted AI-linked chip and storage names in Monday's premarket, with Nasdaq-100 futures up about 0.5%.",th:"ก่อนแผนเข้าตลาดหุ้น (IPO) Anthropic รายงานคาดการณ์รายได้ปี 2028 ไว้ที่ราว 1.9–2 แสนล้านดอลลาร์ รายงานนี้หนุนหุ้นกลุ่มชิปและสตอเรจที่เชื่อมโยงกับ AI ในช่วงก่อนตลาดเปิดวันจันทร์ โดยดัชนีล่วงหน้า Nasdaq-100 ขึ้นราว 0.5%"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US stocks close lower as 30-year Treasury yield hits 19-year high",th:"หุ้นสหรัฐปิดลบ ขณะผลตอบแทนพันธบัตร 30 ปีทำสถิติสูงสุดในรอบ 19 ปี"}, d:{en:"The premarket AI rally faded by the close: S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32%. The 30-year Treasury yield jumped to 5.31%, its highest since June 2007, on deficit and AI-debt-issuance concerns; oil held near $88/bbl as US-Iran talks stayed stalled.",th:"การปรับขึ้นของหุ้นเทค AI ช่วงก่อนตลาดเปิดจางหายไปเมื่อถึงช่วงปิดตลาด: S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32% ผลตอบแทนพันธบัตร 30 ปีพุ่งขึ้นสู่ 5.31% สูงสุดตั้งแต่เดือน มิ.ย. 2007 จากความกังวลขาดดุลงบประมาณและหนี้ AI ราคาน้ำมันทรงตัวใกล้ $88 ต่อบาร์เรล ขณะการเจรจาสหรัฐ-อิหร่านยังหยุดชะงัก"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Trump threatens to bomb Oman as Iran ceasefire lapses — oil jumps to a 19-month high",th:"ทรัมป์ขู่ถล่มโอมาน หลังหยุดยิงอิหร่านหมดอายุ — น้ำมันพุ่งสูงสุดในรอบ 19 เดือน"}, d:{en:"The 60-day US-Iran ceasefire lapsed Monday with no deal. Trump then threatened to \"bomb the s--- out of\" US ally Oman if it \"gets in the way\" of Oman-Iran talks over Strait of Hormuz shipping. Brent crude settled up 2.7% at $90.87/bbl — its highest in roughly 19 months — and the shock has spread into Tuesday's Asia session, pulling the Nikkei and Hang Seng off Monday's records.",th:"หยุดยิงสหรัฐ-อิหร่านระยะ 60 วันหมดอายุลงวันจันทร์โดยไม่มีข้อตกลง จากนั้นทรัมป์ขู่ว่าจะ \"ถล่ม\" โอมาน พันธมิตรสหรัฐฯ หากโอมาน \"ขวางทาง\" การเจรจาโอมาน-อิหร่านเรื่องการเดินเรือผ่านช่องแคบฮอร์มุซ ราคาน้ำมันเบรนท์ปิดตลาดบวก 2.7% ที่ $90.87 ต่อบาร์เรล สูงสุดในรอบราว 19 เดือน และแรงกระแทกนี้ได้ลุกลามมาถึงตลาดเอเชียวันอังคาร ฉุด Nikkei และ Hang Seng ร่วงจากสถิติสูงสุดของวันจันทร์"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Vessel struck by projectile in Strait of Hormuz — oil tops $91",th:"เรือถูกยิงในช่องแคบฮอร์มุซ — น้ำมันทะลุ $91"}, d:{en:"UKMTO confirmed a cargo vessel was hit by an unidentified projectile early Tuesday, damaging the engine room and injuring a crew member — the first confirmed casualty since Monday's ceasefire lapse. Brent extended Monday's 2.7% jump to top $91/bbl, its highest in about 19 months.",th:"UKMTO ยืนยันเรือบรรทุกสินค้าถูกยิงด้วยกระสุนไม่ทราบชนิดช่วงเช้ามืดวันอังคาร ห้องเครื่องเสียหายและลูกเรือได้รับบาดเจ็บ — ผู้บาดเจ็บรายแรกที่ได้รับการยืนยันนับตั้งแต่หยุดยิงหมดอายุวันจันทร์ ราคาน้ำมันเบรนท์ปรับขึ้นต่อจากที่พุ่ง 2.7% วันจันทร์ ทะลุ $91 ต่อบาร์เรล สูงสุดในรอบราว 19 เดือน"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Iran, Oman reportedly agree shipping-route coordinates through Hormuz — but strikes continue",th:"อิหร่าน-โอมานตกลงพิกัดเส้นทางเดินเรือผ่านฮอร์มุซ — แต่การโจมตียังไม่หยุด"}, d:{en:"The two sides have reportedly finalized route coordinates as part of a broader arrangement to manage Hormuz traffic, but sporadic vessel strikes — including Tuesday's — have continued even as talks progress, keeping oil's risk premium live.",th:"ทั้งสองฝ่ายมีรายงานว่าตกลงพิกัดเส้นทางเดินเรือแล้ว ซึ่งเป็นส่วนหนึ่งของข้อตกลงที่กว้างขึ้นในการจัดการการเดินเรือผ่านฮอร์มุซ แต่ยังมีเหตุเรือถูกโจมตีประปรายต่อเนื่อง — รวมถึงเหตุการณ์วันอังคาร — แม้การเจรจาจะคืบหน้า ทำให้ความเสี่ยงราคาน้ำมันยังคงอยู่"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US close confirms risk-off — S&P −0.54%, Nasdaq −1.29% as 30-year yield hits fresh 19-year high",th:"หุ้นสหรัฐปิดยืนยันภาวะ risk-off — S&P −0.54%, Nasdaq −1.29% ขณะพันธบัตร 30 ปีทำสถิติสูงสุดใหม่รอบ 19 ปี"}, d:{en:"The first full session since Monday's Hormuz vessel strike confirmed the risk-off tone that had only shown up in pre-market futures: the S&P 500 fell 0.54% to 7,703.28, the Nasdaq Composite dropped 1.29% to 26,300.36 on AI-name weakness, and the Dow held nearly flat at 53,427.68. The 30-year Treasury yield pushed to 5.32%, nearing 2002 levels.",th:"การซื้อขายเต็มวันแรกหลังเหตุเรือถูกยิงที่ฮอร์มุซวันจันทร์ ยืนยันบรรยากาศ risk-off ที่ก่อนหน้านี้ปรากฏเฉพาะในดัชนีล่วงหน้า: ดัชนี S&P 500 ลดลง 0.54% สู่ 7,703.28 ดัชนี Nasdaq Composite ร่วง 1.29% สู่ 26,300.36 จากแรงขายหุ้นกลุ่ม AI ขณะดัชนี Dow แทบไม่เปลี่ยนแปลงที่ 53,427.68 ผลตอบแทนพันธบัตร 30 ปีขึ้นสู่ 5.32% เข้าใกล้ระดับปี 2002"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Home Depot beats Q2 estimates, reaffirms full-year guidance",th:"Home Depot รายงานผลไตรมาส 2 ดีกว่าคาด คงเป้าทั้งปี"}, d:{en:"Adjusted EPS of $4.92 beat the $4.73 estimate on sales of $47.9bn, up 5.7% y/y; comparable sales rose 1.7%. A solid open to retail-earnings week, with Target and Lowe's due Wednesday and Walmart Thursday.",th:"กำไรต่อหุ้นปรับปรุงที่ $4.92 ดีกว่าคาดการณ์ $4.73 จากยอดขาย $47,900 ล้านดอลลาร์ เพิ่มขึ้น 5.7% เทียบปีก่อน ยอดขายสาขาเดิมเพิ่มขึ้น 1.7% เป็นการเริ่มต้นที่ดีของสัปดาห์ผลประกอบการค้าปลีก ก่อน Target และ Lowe's วันพุธ และ Walmart วันพฤหัสฯ"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Trump pauses Canada's 50% tariff for three days after last-minute deal",th:"ทรัมป์พักภาษี 50% ของแคนาดาออกไป 3 วัน หลังบรรลุข้อตกลงนาทีสุดท้าย"}, d:{en:"Hours before the 50% tariff on ~$20bn of Canadian goods was due to take effect at 12:01am ET, Trump announced a pause until end of day Friday 21 August, saying Canada and the US, \"subject to the finalization of documents, have a DEAL.\" PM Carney called it \"substantial progress\" with \"important work still to be done\" on autos, steel, aluminum, forest products, dairy and alcohol.",th:"ไม่กี่ชั่วโมงก่อนภาษี 50% ต่อสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์จะมีผลเวลา 00:01 น. ตามเวลาสหรัฐฝั่งตะวันออก ทรัมป์ประกาศพักภาษีออกไปจนถึงสิ้นวันศุกร์ที่ 21 ส.ค. ระบุว่าแคนาดาและสหรัฐฯ \"มีข้อตกลงแล้ว โดยรอการสรุปเอกสารขั้นสุดท้าย\" นายกฯ Carney เรียกว่าเป็น \"ความคืบหน้าอย่างมาก\" แต่ \"ยังมีงานสำคัญที่ต้องทำต่อ\" ในประเด็นรถยนต์ เหล็ก อะลูมิเนียม ผลิตภัณฑ์ป่าไม้ นม และแอลกอฮอล์"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Fatal Hormuz attack on agreed \"safe\" route — Trump says strait is \"open\" despite lowest traffic since May",th:"เหตุโจมตีฮอร์มุซมีผู้เสียชีวิตบนเส้นทาง \"ปลอดภัย\" ที่ตกลงกันแล้ว — ทรัมป์ระบุช่องแคบ \"เปิด\" ทั้งที่การเดินเรือต่ำสุดตั้งแต่ พ.ค."}, d:{en:"A cargo ship was attacked overnight, killing one crew member, even while using the Oman-coordinated southern route. Kpler data show a five-day average of just 10 vessel crossings, the lowest since May, undercutting Trump's claim the strait is fully open.",th:"เรือบรรทุกสินค้าถูกโจมตีข้ามคืนจนมีลูกเรือเสียชีวิต 1 ราย ทั้งที่ใช้เส้นทางใต้ที่ประสานกับโอมานแล้ว ข้อมูล Kpler ชี้ว่าจำนวนเรือผ่านช่องแคบเฉลี่ย 5 วันเหลือเพียง 10 ลำ ต่ำสุดตั้งแต่ พ.ค. ซึ่งขัดแย้งกับคำกล่าวอ้างของทรัมป์ว่าช่องแคบเปิดเต็มรูปแบบ"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Kospi closes down 5.6% after 6.39% intraday plunge trips sidecar; Nikkei falls 2.57% as Asia tech rout deepens",th:"Kospi ปิดลบ 5.6% หลังร่วงระหว่างวัน 6.39% จนหยุดพักการซื้อขาย ขณะ Nikkei ปิดลบ 2.57% กลุ่มเทคเอเชียร่วงหนัก"}, d:{en:"Samsung Electronics fell 7.26% and SK Hynix 9.27% as Korea's chip-heavy Kospi plunged as much as 6.39% intraday, tripping a sell-side sidecar, before closing down 5.6% at 6,487.34. Japan's Nikkei 225 closed down 2.57% at 65,724.25, a second straight losing session, tracking a weak Wall Street close and Japan's 10-year JGB yield hitting its highest level since 1996.",th:"Samsung Electronics ลดลง 7.26% และ SK Hynix ร่วง 9.27% ขณะดัชนี Kospi ที่มีสัดส่วนหุ้นชิปสูงร่วงระหว่างวันถึง 6.39% จนต้องหยุดพักการซื้อขายชั่วคราวแบบ sell-side sidecar ก่อนปิดลบ 5.6% ที่ 6,487.34 ดัชนี Nikkei 225 ญี่ปุ่นปิดลบ 2.57% ที่ 65,724.25 ปรับลงเป็นวันที่สองติดต่อกัน สอดคล้องกับการปิดตลาดสหรัฐฯ ที่อ่อนแอ และผลตอบแทนพันธบัตรรัฐบาลญี่ปุ่นอายุ 10 ปีที่ทำสถิติสูงสุดนับตั้งแต่ปี 1996"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Treasury doubles long-bond buybacks — yields tumble from 19-year high, Wall Street rebounds",th:"คลังสหรัฐฯ เพิ่มวงเงินซื้อคืนพันธบัตรระยะยาวเป็น 2 เท่า — ผลตอบแทนร่วงจากจุดสูงสุดรอบ 19 ปี วอลล์สตรีทฟื้นตัว"}, d:{en:"The Treasury said it will at least double 'liquidity support' buyback operations for 10-to-30-year debt to at least $4bn per operation from 9 September through 4 November. The 30-year yield fell 9bp to 5.196% and the 10-year fell 6bp to 4.647%; US stocks turned higher in Wednesday trading on the relief.",th:"กระทรวงการคลังสหรัฐฯ ระบุจะเพิ่มวงเงินซื้อคืนพันธบัตร 'สนับสนุนสภาพคล่อง' สำหรับพันธบัตรอายุ 10-30 ปี เป็นอย่างน้อย 4,000 ล้านดอลลาร์ต่อครั้ง เริ่ม 9 ก.ย. ถึง 4 พ.ย. ผลตอบแทนพันธบัตร 30 ปีลดลง 9 basis point สู่ 5.196% และ 10 ปีลดลง 6 basis point สู่ 4.647% หุ้นสหรัฐฯ ปรับขึ้นในการซื้อขายวันพุธจากข่าวนี้"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"July FOMC minutes show hawkish 3-way dissent; gold jumps ~3%",th:"รายงานประชุมเฟด ก.ค. เผยผู้ว่าการ 3 คนโหวตสวนหนุนขึ้นดอกเบี้ย ทองคำพุ่ง ~3%"}, d:{en:"Minutes from the July 28–29 meeting, released Wednesday afternoon, showed regional presidents Hammack, Kashkari and Logan all dissented in favour of a 25bp hike — the first time since 2016 three policymakers aligned on one directional dissent. Markets still price only about a third chance of a September hike given softer data since, but the hawkish tone helped send gold up roughly 3% to near $4,470/oz.",th:"รายงานการประชุมวันที่ 28–29 ก.ค. ที่เผยแพร่ช่วงบ่ายวันพุธ แสดงให้เห็นว่าผู้ว่าการเฟดสาขาภูมิภาค Hammack, Kashkari และ Logan โหวตสวนสนับสนุนขึ้นดอกเบี้ย 25 basis point ทั้งหมด — ครั้งแรกนับตั้งแต่ปี 2016 ที่ผู้กำหนดนโยบาย 3 คนโหวตไปทางเดียวกัน ตลาดยังให้น้ำหนักเพียงราว 1 ใน 3 ว่าเฟดจะขึ้นดอกเบี้ยเดือน ก.ย. เนื่องจากข้อมูลที่อ่อนตัวลงหลังจากนั้น แต่น้ำเสียง hawkish นี้ช่วยหนุนราคาทองคำให้พุ่งขึ้นราว 3% สู่ใกล้ $4,470 ต่อออนซ์"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US close confirms rebound — S&P +0.21%, Dow +0.22%, Nasdaq +0.16%, snapping a 3-day losing streak",th:"หุ้นสหรัฐปิดยืนยันการฟื้นตัว — S&P +0.21%, Dow +0.22%, Nasdaq +0.16% ยุติสถิติปรับลงต่อเนื่อง 3 วัน"}, d:{en:"The S&P 500 rose 0.21% to 7,707.98, the Dow gained 0.22% to 53,463.05, and the Nasdaq added 0.16% to 26,331.09, as Treasury yields extended their pullback from Wednesday's buyback news — the 30-year settled at 5.195%, the 10-year near 4.65%.",th:"ดัชนี S&P 500 เพิ่มขึ้น 0.21% สู่ 7,707.98 ดัชนี Dow เพิ่มขึ้น 0.22% สู่ 53,463.05 และดัชนี Nasdaq เพิ่มขึ้น 0.16% สู่ 26,331.09 ขณะผลตอบแทนพันธบัตรยังร่วงต่อเนื่องหลังข่าวซื้อคืนพันธบัตรวันพุธ ผลตอบแทน 30 ปีปิดที่ 5.195% ผลตอบแทน 10 ปีใกล้ 4.65%"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Target beats but falls ~3.5% on profit-taking; Lowe's trims guidance; Moderna surges up to 176%",th:"Target กำไรดีกว่าคาดแต่หุ้นร่วงราว 3.5% จากการขายทำกำไร Lowe's ปรับลดเป้า Moderna พุ่งสูงสุด 176%"}, d:{en:"Target's EPS ($4.11) and comparable sales (+3.8%) beat, and guidance was raised, yet shares fell on heavy volume as investors booked profits. Lowe's beat on EPS ($4.40) but trimmed its full-year outlook on soft DIY spending. Moderna jumped as much as 176% on positive melanoma-vaccine trial data with Merck.",th:"Target รายงานกำไรต่อหุ้น ($4.11) และยอดขายสาขาเดิม (+3.8%) ดีกว่าคาด และปรับเป้าทั้งปีขึ้น แต่หุ้นยังปรับลงจากปริมาณการซื้อขายหนาแน่น เนื่องจากนักลงทุนขายทำกำไร Lowe's กำไรต่อหุ้นดีกว่าคาด ($4.40) แต่ปรับลดเป้าทั้งปีจากการใช้จ่าย DIY ที่อ่อนแอ Moderna พุ่งขึ้นสูงสุดถึง 176% จากผลบวกของวัคซีนมะเร็งผิวหนังร่วมกับ Merck"}},
    {day:{en:"Thu",th:"พฤ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"h", t:{en:"Dow suffers worst day since 29 July as bond-buyback relief fades",th:"Dow ร่วงหนักสุดตั้งแต่ 29 ก.ค. หลังแรงหนุนข่าวซื้อคืนพันธบัตรจางหาย"}, d:{en:"S&P −0.87% to 7,641.16, Dow −1.32% to 52,759.21, Nasdaq −1.00% to 26,067.17. The 10-year yield rose to 4.704% and the 30-year to ~5.27%, wiping out Wednesday's buyback-driven pullback. Walmart fell ~9% on soft US sales guidance despite beating EPS.",th:"S&P −0.87% สู่ 7,641.16, Dow −1.32% สู่ 52,759.21, Nasdaq −1.00% สู่ 26,067.17 ผลตอบแทนพันธบัตร 10 ปีขึ้นสู่ 4.704% และ 30 ปีสู่ราว 5.27% ลบล้างการปรับลงจากข่าวซื้อคืนพันธบัตรวันพุธไปหมด Walmart ร่วงราว 9% จากคำแนะนำยอดขายสหรัฐฯ ที่อ่อนแอ แม้กำไรต่อหุ้นจะดีกว่าคาด"}},
    {day:{en:"Thu",th:"พฤ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"Moderna gives back its 177% surge, falling ~20%, even as FDA approves mFLUSIVA flu shot",th:"Moderna คืนกำไรที่พุ่งขึ้น 177% ร่วงลงราว 20% แม้ อย. อนุมัติวัคซีนไข้หวัดใหญ่ mFLUSIVA"}, d:{en:"A sharp reversal a day after the melanoma-vaccine-driven pop, as investors booked profits — a reminder that single-stock biotech swings cut both ways.",th:"การกลับตัวแรงหนึ่งวันหลังพุ่งขึ้นจากข่าววัคซีนมะเร็งผิวหนัง เนื่องจากนักลงทุนขายทำกำไร เป็นเครื่องเตือนใจว่าความผันผวนหุ้นไบโอเทครายตัวเคลื่อนไหวได้ทั้งสองทาง"}},
    {day:{en:"Thu",th:"พฤ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"Asia stages sharp rebound — Nikkei +1.36%, Kospi +5.9% on chip-buyback hopes",th:"เอเชียฟื้นตัวแรง — Nikkei +1.36%, Kospi +5.9% จากความหวังซื้อหุ้นคืนกลุ่มชิป"}, d:{en:"Samsung Electronics and SK Hynix led Kospi's reversal from Wednesday's sidecar-triggering plunge. Hang Seng +0.80%, Shanghai +0.24% — more muted, suggesting Greater China lagged the regional bounce.",th:"Samsung Electronics และ SK Hynix นำการกลับตัวของ Kospi จากที่ร่วงจนต้องหยุดพักการซื้อขายวันพุธ Hang Seng +0.80% Shanghai +0.24% — เบากว่ามาก บ่งชี้ว่าจีนแผ่นดินใหญ่/ฮ่องกงตามหลังการฟื้นตัวในภูมิภาค"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Canada tariff pause deadline hits today, terms still being finalized",th:"เส้นตายพักภาษีแคนาดาถึงวันนี้ เงื่อนไขยังอยู่ระหว่างสรุป"}, d:{en:"The three-day pause on Canada's 50% tariff expires end of day today. Reports point to a cut in the auto tariff to 15% from 25%, but autos, steel, dairy and procurement remain unresolved as of Thursday.",th:"การพักภาษี 50% ของแคนาดา 3 วันหมดอายุสิ้นวันนี้ มีรายงานว่าอาจปรับลดภาษีรถยนต์เหลือ 15% จาก 25% แต่รถยนต์ เหล็ก นม และการจัดซื้อภาครัฐยังไม่คลี่คลาย ณ วันพฤหัสฯ"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Iran conflict escalates on multiple fronts — Syria airstrike, Saudi refinery hit, oil jumps to $93",th:"ความขัดแย้งอิหร่านทวีความรุนแรงหลายแนวรบ — โจมตีซีเรีย โรงกลั่นซาอุฯ ถูกโจมตี น้ำมันพุ่งสู่ $93"}, d:{en:"Israeli strikes hit an airbase in Idlib, Syria; Houthi rebels struck a Saudi refinery; the UAE detected Iranian ballistic-missile launches. Brent rose 1.5% to $93.01, WTI 2.1% to $86.16.",th:"อิสราเอลโจมตีฐานทัพอากาศในเมือง Idlib ซีเรีย กบฏฮูตีโจมตีโรงกลั่นน้ำมันซาอุดีอาระเบีย สหรัฐอาหรับเอมิเรตส์ตรวจพบขีปนาวุธจากอิหร่าน เบรนท์ขึ้น 1.5% สู่ $93.01 WTI ขึ้น 2.1% สู่ $86.16"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Asia futures point lower, tracking Thursday's US risk-off close",th:"ฟิวเจอร์สเอเชียชี้ลง ตามการปิดตลาดสหรัฐฯ ที่ risk-off วันพฤหัสฯ"}, d:{en:"Nikkei futures ~65,510–65,560, Kospi futures −1.07%, Kosdaq −2.44%, ASX 200 −0.21% — Thursday's sharp Asia rebound looks fragile heading into Friday's open.",th:"ฟิวเจอร์ส Nikkei ~65,510-65,560 ฟิวเจอร์ส Kospi −1.07% Kosdaq −2.44% ASX 200 −0.21% — การฟื้นตัวแรงของเอเชียวันพฤหัสฯ ดูเปราะบางก่อนตลาดเปิดวันศุกร์"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"h", t:{en:"Canada and US strike tariff deal ahead of deadline — autos cut to 15%",th:"แคนาดาและสหรัฐฯ บรรลุข้อตกลงภาษีก่อนเส้นตาย — ภาษีรถยนต์ลดเหลือ 15%"}, d:{en:"The disputed auto tariff falls to 15% from 25%, with a US-content exemption preserved, and steel/aluminum tariffs are halved to 25%. Ottawa didn't get a full carve-out for Canadian/Mexican content; VP Vance called Carney's framing a \"climb-down,\" and provincial leaders criticized the concessions.",th:"ภาษีรถยนต์ที่เป็นข้อพิพาทลดเหลือ 15% จาก 25% พร้อมคงการยกเว้นสัดส่วนวัตถุดิบสหรัฐฯ และภาษีเหล็ก/อะลูมิเนียมลดลงครึ่งหนึ่งเหลือ 25% ออตตาวาไม่ได้รับการยกเว้นเต็มรูปแบบสำหรับสัดส่วนวัตถุดิบแคนาดา/เม็กซิโก รองประธานาธิบดี Vance เรียกท่าทีของ Carney ว่าเป็นการ \"ยอมถอย\" และผู้นำระดับมณฑลวิจารณ์การประนีประนอมนี้"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"h", t:{en:"US close confirms rebound but posts a weekly loss — S&P +0.43%, Dow +0.98%, Nasdaq +0.43%",th:"หุ้นสหรัฐปิดยืนยันการฟื้นตัว แต่รวมทั้งสัปดาห์ยังปิดลบ — S&P +0.43%, Dow +0.98%, Nasdaq +0.43%"}, d:{en:"The S&P 500 rose to 7,674.37, the Dow gained 517.80pts to 53,277.01, and the Nasdaq added 0.43% to 26,180.45, but bond-market volatility left all three indices lower on the week.",th:"ดัชนี S&P 500 เพิ่มขึ้นสู่ 7,674.37 ดัชนี Dow เพิ่มขึ้น 517.80 จุด สู่ 53,277.01 และดัชนี Nasdaq เพิ่มขึ้น 0.43% สู่ 26,180.45 แต่ความผันผวนตลาดพันธบัตรทำให้ทั้งสามดัชนียังปิดลบรายสัปดาห์"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"h", t:{en:"Bond-buyback rally 'fizzles out'; gold tops $4,600, highest since mid-May",th:"การซื้อคืนพันธบัตร 'แผ่วลง'; ทองคำทะลุ $4,600 สูงสุดตั้งแต่กลาง พ.ค."}, d:{en:"The 30-year yield, which had dipped to ~5.18% on Wednesday's buyback news, climbed back to ~5.25–5.27%. Gold topped $4,600/oz, on track for a third straight weekly gain of roughly 5%, as CNBC reported the buyback move is stirring fiscal-sustainability concerns rather than easing them.",th:"ผลตอบแทนพันธบัตร 30 ปี ที่เคยดิ่งลงสู่ราว 5.18% จากข่าวซื้อคืนวันพุธ ดีดกลับสู่ราว 5.25-5.27% ทองคำทะลุ $4,600 ต่อออนซ์ มีแนวโน้มปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 3 ติดต่อกันราว 5% ขณะ CNBC รายงานว่ามาตรการซื้อคืนกำลังจุดความกังวลเรื่องความยั่งยืนทางการคลัง แทนที่จะช่วยคลายกังวล"}},
    {day:{en:"Thu",th:"พฤ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"Trump announces 'most crushing' new Iran sanctions; Tehran vows resistance",th:"ทรัมป์ประกาศมาตรการคว่ำบาตรอิหร่านรอบใหม่ 'รุนแรงที่สุด' อิหร่านประกาศต้านทาน"}, d:{en:"Trump unveiled fresh sanctions he called the most crushing yet; Iran said the \"economic warfare\" would fail. Oil stayed bid into the weekend, with Brent on track for a second straight weekly gain of over 5%.",th:"ทรัมป์เปิดเผยมาตรการคว่ำบาตรรอบใหม่ที่เขาเรียกว่ารุนแรงที่สุดเท่าที่เคยมี อิหร่านระบุว่า \"สงครามเศรษฐกิจ\" จะล้มเหลว ราคาน้ำมันยังยืนแข็งแกร่งเข้าสู่สุดสัปดาห์ โดยเบรนท์มีแนวโน้มปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 2 ติดต่อกันกว่า 5%"}},
    {day:{en:"Fri 28 Aug",th:"ศ. 28 ส.ค."}, date:{en:"ahead",th:"ข้างหน้า"}, imp:"h", t:{en:"Fed Chair Warsh's first Jackson Hole keynote as chair",th:"สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Warsh"}, d:{en:"The Jackson Hole symposium runs 27–29 August; Warsh's debut speech as Fed chair lands Friday morning. He says it will focus on 'big picture' structural questions rather than near-term guidance — but it's the last major scheduled signal before the 16 September FOMC.",th:"งานสัมมนา Jackson Hole จัดขึ้น 27-29 ส.ค. โดยสุนทรพจน์เปิดตัวของ Warsh ในฐานะประธานเฟดจะมีขึ้นเช้าวันศุกร์ เขาระบุว่าจะเน้นคำถามเชิงโครงสร้าง 'ภาพใหญ่' มากกว่าแนวทางระยะสั้น แต่นี่คือสัญญาณสำคัญครั้งสุดท้ายที่กำหนดไว้ก่อนการประชุมเฟด 16 ก.ย."}},
    {day:{en:"Sep",th:"ก.ย."}, date:{en:"ahead",th:"ข้างหน้า"}, imp:"h", t:{en:"Fed policy meeting (16 Sep)",th:"การประชุมนโยบายเฟด (16 ก.ย.)"}, d:{en:"The decision all this data feeds into. Warsh's Jackson Hole speech on 28 August is the last major scheduled catalyst before the meeting — the biggest driver for bond yields into September.",th:"การตัดสินใจที่ข้อมูลทั้งหมดส่งผลถึง สุนทรพจน์ Jackson Hole ของ Warsh วันที่ 28 ส.ค. คือปัจจัยขับเคลื่อนสำคัญครั้งสุดท้ายที่กำหนดไว้ก่อนการประชุม — ปัจจัยใหญ่สุดต่อผลตอบแทนพันธบัตรก่อนถึงเดือน ก.ย."}},
