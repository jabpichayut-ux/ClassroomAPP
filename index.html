<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Nasdaq Falls 2.5% Into a Correction as Nvidia's Board Rules Out Huang's Return — S&P 500 Drops 1.9%, Nikkei Slides 2.4% on a GDP Contraction, Oil Sinks 3.6%", th:"Nasdaq ร่วง 2.5% เข้าสู่ภาวะปรับฐาน หลังบอร์ด Nvidia ปิดทางการกลับมาของ Huang — S&P 500 ลดลง 1.9% Nikkei ร่วง 2.4% จาก GDP หดตัว น้ำมันดิ่ง 3.6%"},
    heroDeck:{en:`Monday was Wall Street's worst day in weeks. Nvidia fell 4.1% after its board signalled it is not considering bringing back Jensen Huang, and reports of tighter US rules on remote access to AI chips hit the whole sector (AMD down more than 5%). The Nasdaq Composite fell 2.49% to 24,509.76 — about 10.9% below its 6 Oct high, which puts it in correction territory — the S&P 500 lost 1.92% to 7,416.59 and the Dow 1.41% to 51,608.17. Only 145 S&P 500 stocks rose. Bonds gave a little relief: the 10-year eased about 2bp to roughly 5.13%, the 2-year to about 4.83% and the 30-year to ~5.47%, as Brent dropped 3.6% to $92.44 on recovering Middle East exports. Gold fell 0.7% to about $3,851, its lowest since October 2025, as the dollar firmed. In Asia, the Nikkei fell 2.42% to 59,662.02 after Japan's economy unexpectedly shrank in Q3, Shanghai lost 0.87% and Taiwan tumbled 4.7%, while the Hang Seng rose 0.52%. The SET slipped 0.36% to 1,499.53, falling less than its neighbours. All eyes are now on Nvidia's results on Tuesday (US time) and Anthropic's IPO later this week.`, th:`วันจันทร์เป็นวันที่แย่ที่สุดของวอลล์สตรีทในรอบหลายสัปดาห์ หุ้น Nvidia ลดลง 4.1% หลังบอร์ดส่งสัญญาณว่าไม่ได้พิจารณาให้ Jensen Huang กลับมา และมีรายงานว่าสหรัฐฯ คุมเข้มการเข้าถึงชิป AI จากระยะไกล ทำให้หุ้นชิปทั้งกลุ่มลดลง (AMD ลดลงกว่า 5%) Nasdaq ลดลง 2.49% สู่ 24,509.76 — ต่ำกว่าจุดสูงสุดวันที่ 6 ต.ค. ราว 10.9% ถือว่าเข้าสู่ภาวะปรับฐาน — S&P 500 ลดลง 1.92% สู่ 7,416.59 และ Dow ลดลง 1.41% สู่ 51,608.17 หุ้นใน S&P 500 ขึ้นเพียง 145 ตัว ตลาดบอนด์ช่วยได้บ้าง: บอนด์ 10 ปีลดลงราว 0.02% สู่ประมาณ 5.13% บอนด์ 2 ปีสู่ราว 4.83% และบอนด์ 30 ปีราว 5.47% เพราะ Brent ลดลง 3.6% สู่ $92.44 จากการส่งออกน้ำมันในตะวันออกกลางที่ฟื้นตัว ทองคำลดลง 0.7% สู่ราว $3,851 ต่ำสุดตั้งแต่ ต.ค. 2025 เพราะดอลลาร์แข็งค่า ในเอเชีย Nikkei ลดลง 2.42% สู่ 59,662.02 หลังเศรษฐกิจญี่ปุ่นหดตัวในไตรมาส 3 อย่างไม่คาดคิด เซี่ยงไฮ้ลดลง 0.87% และไต้หวันร่วง 4.7% ขณะที่ Hang Seng ขึ้น 0.52% SET ลดลง 0.36% สู่ 1,499.53 น้อยกว่าเพื่อนบ้าน ตอนนี้ทุกสายตาจับจ้องงบ Nvidia คืนวันอังคาร (เวลาสหรัฐฯ) และการเข้าตลาดของ Anthropic ปลายสัปดาห์นี้`},

    leadtxt:{en:`<b>The AI selloff turned into a broad risk-off day, and the Nasdaq is now in a correction.</b> <b>Nvidia fell 4.1%</b> after its board signalled Huang will not return, and reports of tighter US rules on remote access to AI chips hit the rest of the sector — so the <b>Nasdaq lost 2.49%</b>, the <b>S&P 500 1.92%</b> and the <b>Dow 1.41%</b>, with only 145 S&P stocks higher. The good news is in bonds and oil: <b>Brent fell 3.6% to $92.44</b>, which eased inflation worries and let the <b>10-year slip to about 5.13%</b>. <b>Gold fell to about $3,851, its lowest since October 2025</b>, as a firmer dollar and Fed-hike bets weighed. Asia was hit through the chip chain — <b>Taiwan −4.7%, Nikkei −2.4%</b> (also on a surprise Q3 GDP contraction) — but the <b>SET held up better, down just 0.36% to 1,499.53</b>, and the Hang Seng rose. <b>For clients: do not chase the dip before Nvidia reports on 17 Nov (US time). Keep new bond money in short-duration funds yielding near 4.8–4.9%, keep AI and tech exposure diversified rather than concentrated, and keep gold as a small hedge — it is not acting as a safe haven while US yields are above 5%.</b>`, th:`<b>การเทขายหุ้น AI ลามเป็นการหนีความเสี่ยงทั้งตลาด และ Nasdaq เข้าสู่ภาวะปรับฐานแล้ว</b> <b>หุ้น Nvidia ลดลง 4.1%</b> หลังบอร์ดส่งสัญญาณว่า Huang จะไม่กลับมา และมีรายงานว่าสหรัฐฯ คุมเข้มการเข้าถึงชิป AI จากระยะไกล กระทบทั้งกลุ่ม — ทำให้ <b>Nasdaq ลดลง 2.49%</b> <b>S&P 500 ลดลง 1.92%</b> และ <b>Dow ลดลง 1.41%</b> โดยหุ้นใน S&P ขึ้นเพียง 145 ตัว ข่าวดีอยู่ที่บอนด์และน้ำมัน: <b>Brent ลดลง 3.6% สู่ $92.44</b> ช่วยลดความกังวลเรื่องเงินเฟ้อ และทำให้<b>บอนด์ 10 ปีลดลงสู่ราว 5.13%</b> <b>ทองคำลดลงสู่ราว $3,851 ต่ำสุดตั้งแต่ ต.ค. 2025</b> เพราะดอลลาร์แข็งค่าและการเดิมพันว่าเฟดจะขึ้นดอกเบี้ย เอเชียโดนผ่านห่วงโซ่ชิป — <b>ไต้หวัน −4.7% Nikkei −2.4%</b> (ซ้ำด้วย GDP ไตรมาส 3 หดตัวเกินคาด) — แต่ <b>SET ยืนได้ดีกว่า ลดลงเพียง 0.36% สู่ 1,499.53</b> และ Hang Seng ขึ้น <b>สำหรับลูกค้า: อย่าเพิ่งไล่ซื้อก่อนงบ Nvidia วันที่ 17 พ.ย. (เวลาสหรัฐฯ) วางเงินลงทุนใหม่ในกองทุนตราสารหนี้อายุสั้นที่ให้ราว 4.8–4.9% กระจายการลงทุนหุ้น AI และเทค ไม่กระจุกตัว และถือทองคำเป็นสัดส่วนเล็กเพื่อป้องกันความเสี่ยง — ทองคำไม่ได้ทำหน้าที่เป็นที่หลบภัยขณะที่ผลตอบแทนบอนด์สหรัฐฯ ยังเกิน 5%</b>`},

    watchnote:{en:`Monday was a sharp risk-off day: Nvidia fell 4.1% after its board ruled out Huang's return and chip stocks slumped on tighter US rules for remote access to AI chips, so the Nasdaq lost 2.49% (into correction) and the S&P 500 1.92%. Brent dropped 3.6% to $92.44, helping the 10-year ease to about 5.13%, while gold fell to about $3,851, its lowest since October 2025. The three things that matter most this week: Nvidia's Q3 results on 17 Nov (US time), Anthropic's IPO as a test of AI appetite, and whether lower oil keeps yields from pushing back above 5.15%.`,
      th:`วันจันทร์ตลาดหนีความเสี่ยงอย่างหนัก: หุ้น Nvidia ลดลง 4.1% หลังบอร์ดปิดทางการกลับมาของ Huang และหุ้นชิปร่วงจากการที่สหรัฐฯ คุมเข้มการเข้าถึงชิป AI จากระยะไกล ทำให้ Nasdaq ลดลง 2.49% (เข้าสู่ภาวะปรับฐาน) และ S&P 500 ลดลง 1.92% Brent ลดลง 3.6% สู่ $92.44 ช่วยให้บอนด์ 10 ปีลดลงสู่ราว 5.13% ขณะที่ทองคำลดลงสู่ราว $3,851 ต่ำสุดตั้งแต่ ต.ค. 2025 3 เรื่องสำคัญที่สุดสัปดาห์นี้: งบไตรมาส 3 ของ Nvidia วันที่ 17 พ.ย. (เวลาสหรัฐฯ), การเข้าตลาดของ Anthropic ซึ่งเป็นบททดสอบความต้องการหุ้น AI และน้ำมันที่ลดลงจะช่วยไม่ให้ผลตอบแทนบอนด์กลับขึ้นเกิน 5.15% หรือไม่`},

      txt:{en:`<b>US stocks fell sharply Monday: the S&P 500 lost 1.92% (−145.08 pts) to 7,416.59, the Nasdaq Composite 2.49% to 24,509.76 and the Dow 1.41% (−739.38 pts) to 51,608.17.</b> Nvidia fell 4.1% and AMD more than 5%; the Nasdaq is now about 10.9% below its 6 Oct high, in correction territory.`, th:`<b>หุ้นสหรัฐฯ ร่วงหนักวันจันทร์: S&P 500 ลดลง 1.92% (−145.08 จุด) สู่ 7,416.59 Nasdaq ลดลง 2.49% สู่ 24,509.76 และ Dow ลดลง 1.41% (−739.38 จุด) สู่ 51,608.17</b> หุ้น Nvidia ลดลง 4.1% และ AMD ลดลงกว่า 5% ตอนนี้ Nasdaq ต่ำกว่าจุดสูงสุดวันที่ 6 ต.ค. ราว 10.9% เข้าสู่ภาวะปรับฐาน`},
      why:{en:`Unlike Friday, this was not a rotation — the Dow fell too and only 145 S&P 500 stocks rose, so money was leaving risk broadly. Two blows hit AI at once: Nvidia's board effectively closed the door on Huang, and tighter US rules on remote access to AI chips threaten part of the sector's China-linked demand. Nvidia's results on 17 Nov (US time) now decide whether this is a buying point or the start of a deeper reset.`, th:`ต่างจากวันศุกร์ ครั้งนี้ไม่ใช่การหมุนกลุ่ม — Dow ก็ลดลง และหุ้นใน S&P 500 ขึ้นเพียง 145 ตัว แปลว่าเงินออกจากสินทรัพย์เสี่ยงทั้งตลาด ธีม AI โดนสองเรื่องพร้อมกัน: บอร์ด Nvidia ปิดทางการกลับมาของ Huang และกฎใหม่ของสหรัฐฯ ที่คุมการเข้าถึงชิป AI จากระยะไกล คุกคามความต้องการบางส่วนที่เกี่ยวกับจีน งบ Nvidia วันที่ 17 พ.ย. (เวลาสหรัฐฯ) จะชี้ว่านี่คือจังหวะซื้อ หรือจุดเริ่มต้นของการปรับฐานที่ลึกขึ้น`},
      full:{en:`US stocks fell sharply on Monday, November 16. The S&P 500 dropped 145.08 points (−1.92%) to 7,416.59, the Nasdaq Composite 626.51 points (−2.49%) to 24,509.76 and the Dow Jones Industrial Average 739.38 points (−1.41%) to 51,608.17. Nvidia closed 4.12% lower and led another broad AI selloff after its board signalled it is not considering bringing back Jensen Huang, while reports that Washington is tightening rules on remote access to AI chips hit chipmakers, with AMD down more than 5%. The Nasdaq ended about 10.9% below its 6 October high, in correction territory. Breadth was poor: 145 S&P 500 members rose and 355 fell. Investors are positioning ahead of Nvidia's Q3 results on Tuesday and Anthropic's stock market debut later in the week.`, th:`หุ้นสหรัฐฯ ร่วงหนักวันจันทร์ที่ 16 พ.ย. S&P 500 ลดลง 145.08 จุด (−1.92%) สู่ 7,416.59 Nasdaq ลดลง 626.51 จุด (−2.49%) สู่ 24,509.76 และ Dow ลดลง 739.38 จุด (−1.41%) สู่ 51,608.17 หุ้น Nvidia ปิดลดลง 4.12% นำการเทขายหุ้น AI ทั้งกลุ่ม หลังบอร์ดส่งสัญญาณว่าไม่ได้พิจารณาให้ Jensen Huang กลับมา ขณะที่รายงานว่าสหรัฐฯ คุมเข้มการเข้าถึงชิป AI จากระยะไกลกดดันหุ้นชิป โดย AMD ลดลงกว่า 5% Nasdaq ปิดต่ำกว่าจุดสูงสุดวันที่ 6 ต.ค. ราว 10.9% เข้าสู่ภาวะปรับฐาน หุ้นขึ้นน้อย: สมาชิก S&P 500 ขึ้น 145 ตัว ลดลง 355 ตัว นักลงทุนปรับพอร์ตก่อนงบไตรมาส 3 ของ Nvidia วันอังคาร และการเข้าตลาดของ Anthropic ปลายสัปดาห์`},
      sources:[{l:"Yahoo Finance — Stock Market Today, Nov. 16: Tech selloff deepens as AI leadership crisis rattles Nasdaq",u:"https://finance.yahoo.com/markets/stocks/articles/stock-market-today-nov-16-222502139.html"},{l:"BNN Bloomberg — Nvidia leads another sell-off as stocks tumble",u:"https://www.bnnbloomberg.ca/markets/nasdaq/2026/11/16/stocks-decline-on-tech-sell-off-as-concerns-over-the-nvidia-fallout-persist/"},{l:"Reuters (via Lufkin Daily News) — Stocks end lower ahead of Nvidia earnings and Anthropic IPO; oil drops",u:"https://lufkindailynews.com/news_reuters/business/stocks-end-lower-ahead-of-nvidia-earnings-and-anthropic-ipo-oil-drops/article_f0fd148f-9631-585f-88b5-6d95f7a56e3f.html"},{l:"Eurasia Business News — Nasdaq slides 2.5% as Nvidia turmoil and chip restrictions hit tech",u:"https://eurasiabusinessnews.com/2026/11/17/stock-market-today-nasdaq-slides-2-5-as-nvidia-turmoil-and-chip-restrictions-hit-tech/"}]},

      txt:{en:`<b>Germany's DAX fell about 0.57% to roughly 26,600 Monday</b> and the Stoxx 600 lost 0.28%, in cautious trade ahead of Nvidia's results.`, th:`<b>ดัชนี DAX เยอรมนีลดลงราว 0.57% สู่ประมาณ 26,600 วันจันทร์</b> และ Stoxx 600 ลดลง 0.28% ในการซื้อขายที่ระมัดระวังก่อนงบ Nvidia`},
      why:{en:`Europe fell far less than the US because it holds few AI and chip stocks — the same reason it outperformed last week. That cushion helps, but Europe still trades in the slipstream of Wall Street, so a bad Nvidia report would likely pull the DAX further below last week's record.`, th:`ยุโรปลดลงน้อยกว่าสหรัฐฯ มาก เพราะมีหุ้น AI และชิปน้อย — เหตุผลเดียวกับที่ยุโรปทำได้ดีกว่าเมื่อสัปดาห์ก่อน ข้อนี้ช่วยรองรับได้ แต่ยุโรปยังเคลื่อนตามวอลล์สตรีท หากงบ Nvidia ออกมาแย่ DAX น่าจะถูกดึงให้ห่างจากระดับสูงสุดเมื่อสัปดาห์ก่อนมากขึ้น`},
      full:{en:`Germany's DAX settled about 0.57% lower on Monday, November 16, at roughly 26,600 (sources differ: RTTNews reports −0.57%, 24/7 Wall St −0.60%, a finanzen.ch ticker 26,599; Newsquawk lists −0.06%). The pan-European Stoxx 600 ended down 0.28%. Trading was cautious as investors looked ahead to Nvidia's earnings on Tuesday. The figure shown is approximate until an official Xetra close is confirmed.`, th:`ดัชนี DAX เยอรมนีปิดวันจันทร์ที่ 16 พ.ย. ลดลงราว 0.57% ที่ประมาณ 26,600 (แต่ละแหล่งต่างกัน: RTTNews −0.57%, 24/7 Wall St −0.60%, finanzen.ch 26,599 ส่วน Newsquawk −0.06%) ดัชนี Stoxx 600 ของยุโรปปิดลดลง 0.28% การซื้อขายเป็นไปอย่างระมัดระวังขณะที่นักลงทุนรองบ Nvidia วันอังคาร ตัวเลขที่แสดงเป็นค่าประมาณจนกว่าจะยืนยันราคาปิดทางการของ Xetra`},
      sources:[{l:"RTTNews (via Yahoo Finance) — European stocks close weak after cautious session",u:"https://finance.yahoo.com/markets/world-indices/articles/european-stocks-close-weak-cautious-190339591.html"},{l:"24/7 Wall St — Europe split at the close with the DAX dropping 0.60%",u:"https://247wallst.com/cards/europe-split-at-the-close-with-the-dax-dropping-0-60-while-ftse-market-bell-01m7jka6chphvhxytb8h7m33g7"},{l:"Trading Economics — Germany stock market",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"59,662.02", chg:-2.42, series:[61142.35,59662.02],
      txt:{en:`<b>Tokyo's Nikkei 225 fell 2.42% to 59,662.02 Monday,</b> back below 60,000, as Japan's economy unexpectedly shrank in Q3 and AI-linked shares sold off. Taiwan tumbled 4.7% and South Korea about 3%.`, th:`<b>ดัชนี Nikkei 225 ญี่ปุ่นลดลง 2.42% สู่ 59,662.02 วันจันทร์</b> หลุด 60,000 อีกครั้ง เพราะเศรษฐกิจญี่ปุ่นหดตัวในไตรมาส 3 อย่างไม่คาดคิด และหุ้นที่เกี่ยวกับ AI ถูกขาย ไต้หวันร่วง 4.7% และเกาหลีใต้ราว 3%`},
      why:{en:`Japan, Taiwan and Korea are the AI supply chain, so they take the hit first when Nvidia wobbles — TSMC fell 4%. Japan also has its own problem now: a surprise GDP contraction makes it harder for the Bank of Japan to keep raising rates. Until Nvidia reports, chip-heavy Asian markets are the most exposed part of the region.`, th:`ญี่ปุ่น ไต้หวัน และเกาหลี คือห่วงโซ่อุปทาน AI จึงโดนก่อนเมื่อ Nvidia สั่นคลอน — TSMC ลดลง 4% ญี่ปุ่นยังมีปัญหาของตัวเอง: GDP หดตัวเกินคาด ทำให้ธนาคารกลางญี่ปุ่นขึ้นดอกเบี้ยต่อได้ยากขึ้น จนกว่า Nvidia จะประกาศงบ ตลาดเอเชียที่มีหุ้นชิปมากคือส่วนที่เสี่ยงที่สุดในภูมิภาค`},
      full:{en:`The Nikkei 225 closed at 59,662.02 on Monday, November 16, down 2.42% from Friday's 61,142.35, according to Nikkei Indexes and Yahoo Finance (other providers show slightly different figures, from about 59,740 to 60,066). Official data showed Japan's economy unexpectedly contracted in the third quarter on an annualised basis, adding to pressure from the AI selloff. Elsewhere, Taiwan fell 4.7% and South Korea about 3%, with TSMC, Nvidia's main chipmaker, down 4%.`, th:`Nikkei 225 ปิดที่ 59,662.02 วันจันทร์ที่ 16 พ.ย. ลดลง 2.42% จาก 61,142.35 ของวันศุกร์ ตามข้อมูล Nikkei Indexes และ Yahoo Finance (บางแหล่งแสดงตัวเลขต่างกันเล็กน้อย ราว 59,740 ถึง 60,066) ข้อมูลทางการแสดงว่าเศรษฐกิจญี่ปุ่นหดตัวในไตรมาส 3 (คิดเป็นรายปี) อย่างไม่คาดคิด ซ้ำเติมแรงกดดันจากการเทขายหุ้น AI ส่วนไต้หวันลดลง 4.7% และเกาหลีใต้ราว 3% โดย TSMC ผู้ผลิตชิปหลักของ Nvidia ลดลง 4%`},
      sources:[{l:"Nikkei Indexes — Nikkei 225 historical data",u:"https://indexes.nikkei.co.jp/en/nkave/archives/data"},{l:"Investing.com — Japan stocks lower at close of trade; Nikkei 225 down 2.25%",u:"https://www.investing.com/news/stock-market-news/japan-stocks-lower-at-close-of-trade-nikkei-225-down-225-5028475"},{l:"AP (via WSLS) — Stocks decline in Asia as concerns over the Nvidia fallout persist",u:"https://www.wsls.com/business/2026/11/16/stocks-decline-in-asia-as-investor-concerns-over-nvidia-fallout-extend-into-another-week/"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"23,759.37", chg:0.52, series:[23637.60,23759.37],
      txt:{en:`<b>Hong Kong's Hang Seng rose 0.52% to 23,759.37 Monday, bucking the regional selloff, while the Shanghai Composite fell 0.87% to 3,602.57.</b>`, th:`<b>ดัชนี Hang Seng ฮ่องกงขึ้น 0.52% สู่ 23,759.37 วันจันทร์ สวนทางการเทขายในภูมิภาค ขณะที่ Shanghai Composite ลดลง 0.87% สู่ 3,602.57</b>`},
      why:{en:`Hong Kong bounced after three straight losing days because it had already sold off on the Nvidia news and holds few direct AI chipmakers. Tighter US rules on remote chip access could even push China to lean harder on home-grown chips. Mainland shares are weaker on soft economic data and are sitting just above 3,600.`, th:`ฮ่องกงเด้งขึ้นหลังลดลง 3 วันติด เพราะถูกขายไปแล้วจากข่าว Nvidia และมีหุ้นผู้ผลิตชิป AI โดยตรงน้อย กฎของสหรัฐฯ ที่คุมการเข้าถึงชิปจากระยะไกลอาจผลักให้จีนหันมาใช้ชิปของตัวเองมากขึ้น ตลาดจีนแผ่นดินใหญ่อ่อนตัวจากข้อมูลเศรษฐกิจที่อ่อนแอ และยืนอยู่เหนือ 3,600 เล็กน้อย`},
      full:{en:`Hong Kong's Hang Seng Index closed at 23,759.37 on Monday, November 16, up about 122 points (+0.52%) from Friday's 23,637.60, according to the AP (Reuters reported a rise of about 0.8%). It bucked a broad regional decline tied to Nvidia's leadership turmoil. In mainland China, the Shanghai Composite fell 0.87% to 3,602.57 on weak economic data.`, th:`ดัชนี Hang Seng ฮ่องกงปิดที่ 23,759.37 วันจันทร์ที่ 16 พ.ย. เพิ่มขึ้นราว 122 จุด (+0.52%) จาก 23,637.60 ของวันศุกร์ ตามรายงานของ AP (Reuters รายงานว่าขึ้นราว 0.8%) สวนทางการลดลงในภูมิภาคที่เกี่ยวกับความวุ่นวายในทีมผู้บริหาร Nvidia ส่วนจีนแผ่นดินใหญ่ Shanghai Composite ลดลง 0.87% สู่ 3,602.57 จากข้อมูลเศรษฐกิจที่อ่อนแอ`},
      sources:[{l:"AP (via WSLS) — Stocks decline in Asia as concerns over the Nvidia fallout persist",u:"https://www.wsls.com/business/2026/11/16/stocks-decline-in-asia-as-investor-concerns-over-nvidia-fallout-extend-into-another-week/"},{l:"Reuters (via Lufkin Daily News) — Asian shares fall before Nvidia earnings, Anthropic IPO test tech rally",u:"https://lufkindailynews.com/news_reuters/business/asian-shares-fall-before-nvidia-earnings-anthropic-ipo-test-tech-rally/article_f0fd148f-9631-585f-88b5-6d95f7a56e3f.html"},{l:"Armenpress — Asian stocks, 16-11-26",u:"https://armenpress.am/en/article/1265773"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,499.53", chg:-0.36, series:[1504.88,1499.53],
      txt:{en:`<b>SET Index fell 0.36% (−5.35 pts) to 1,499.53 Monday</b> on turnover of about THB 65.27bn, slipping back just below 1,500 but falling less than regional peers.`, th:`<b>ดัชนี SET ลดลง 0.36% (−5.35 จุด) สู่ 1,499.53 วันจันทร์</b> มูลค่าซื้อขายราว 65,270 ล้านบาท หลุด 1,500 เล็กน้อย แต่ลดลงน้อยกว่าตลาดในภูมิภาค`},
      why:{en:`Thailand's small exposure to chips again protected it: Taiwan fell 4.7% and Korea 3%, while the SET lost only 0.36%. The drag came from Thailand's own Q3 GDP release, which came in below expectations, keeping the economy's slow growth in focus. Holding the 1,480–1,500 area matters; a bad Nvidia night could test it.`, th:`การที่ตลาดไทยมีหุ้นชิปน้อยช่วยปกป้องอีกครั้ง: ไต้หวันลดลง 4.7% และเกาหลี 3% ขณะที่ SET ลดลงเพียง 0.36% แรงกดดันมาจาก GDP ไตรมาส 3 ของไทยเองที่ออกมาต่ำกว่าคาด ทำให้ความกังวลเรื่องเศรษฐกิจโตช้ายังอยู่ การยืนในโซน 1,480–1,500 ให้ได้เป็นเรื่องสำคัญ หากงบ Nvidia ออกมาแย่ อาจลงมาทดสอบโซนนี้`},
      full:{en:`Thailand's SET Index fell 5.35 points (−0.36%) to close at 1,499.53 on Monday, November 16, with trading value of about THB 65.27 billion, according to Kaohoon International's market roundup. The market tracked regional declines driven by the tech selloff and Thailand's Q3 2026 GDP release, which came in below expectations, but fell less than peers — especially Taiwan and South Korea, which saw heavy selling in semiconductor stocks. The index had been at 1,498.96 (−0.39%) at the morning break.`, th:`ดัชนี SET ลดลง 5.35 จุด (−0.36%) ปิดที่ 1,499.53 วันจันทร์ที่ 16 พ.ย. มูลค่าซื้อขายราว 65,270 ล้านบาท ตามรายงานสรุปตลาดของ Kaohoon International ตลาดเคลื่อนไหวตามการลดลงในภูมิภาคจากการเทขายหุ้นเทค และ GDP ไตรมาส 3 ปี 2026 ของไทยที่ออกมาต่ำกว่าคาด แต่ลดลงน้อยกว่าตลาดเพื่อนบ้าน — โดยเฉพาะไต้หวันและเกาหลีใต้ที่หุ้นเซมิคอนดักเตอร์ถูกขายหนัก ช่วงพักเที่ยงดัชนีอยู่ที่ 1,498.96 (−0.39%)`},
      sources:[{l:"Kaohoon International — Market Roundup 16 November 2026",u:"https://www.kaohooninternational.com/markets/594836"},{l:"Kaohoon International — SET Index tracks regional declines amid tech sell-offs and 3Q26 GDP release",u:"https://www.kaohooninternational.com/markets/594790"},{l:"Investing.com — Thailand SET historical data",u:"https://www.investing.com/indices/thailand-set-historical-data"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil fell sharply Monday: Brent settled at $92.44/bbl (−$3.40, −3.6%) and WTI at $85.72,</b> as recovering Middle East exports revived expectations of excess supply. Spot gold fell 0.74% to about $3,851/oz, its lowest since October 2025, as the dollar index firmed toward 103.5.`, th:`<b>น้ำมันร่วงแรงวันจันทร์: Brent ปิดที่ $92.44 ต่อบาร์เรล (−$3.40, −3.6%) และ WTI ที่ $85.72</b> เพราะการส่งออกน้ำมันจากตะวันออกกลางที่ฟื้นตัวทำให้ความคาดหวังเรื่องอุปทานส่วนเกินกลับมา ทองคำตลาดโลกลดลง 0.74% สู่ราว $3,851 ต่อออนซ์ ต่ำสุดตั้งแต่ ต.ค. 2025 เพราะดัชนีดอลลาร์แข็งค่าสู่ราว 103.5`},
     why:{en:`Cheaper oil is the one helpful development: it eases inflation fears and is good news for oil importers such as Thailand and Japan. Gold keeps falling even on a risk-off day because high US yields, a firmer dollar and Fed-hike bets outweigh safe-haven demand. Keep gold as a small hedge only; don't buy the dip aggressively while yields stay above 5%.`, th:`น้ำมันที่ถูกลงเป็นเรื่องดีเรื่องเดียว: ช่วยลดความกังวลเรื่องเงินเฟ้อ และเป็นข่าวดีสำหรับประเทศนำเข้าน้ำมันอย่างไทยและญี่ปุ่น ทองคำยังลดลงแม้ในวันที่ตลาดหนีความเสี่ยง เพราะผลตอบแทนบอนด์สหรัฐฯ ที่สูง ดอลลาร์แข็ง และการเดิมพันว่าเฟดจะขึ้นดอกเบี้ย มีน้ำหนักมากกว่าความต้องการที่หลบภัย ถือทองคำเป็นสัดส่วนเล็กเพื่อป้องกันความเสี่ยงเท่านั้น อย่าเร่งช้อนซื้อขณะที่ผลตอบแทนยังเกิน 5%`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 10-year Treasury yield eased about 2bp to roughly 5.13% Monday, the 2-year to about 4.83% and the 30-year to ~5.47%.</b> Lower oil eased inflation worries, but yields remain well above their early-November low near 4.80%.`, th:`<b>ผลตอบแทนบอนด์สหรัฐฯ 10 ปีลดลงราว 0.02% สู่ประมาณ 5.13% วันจันทร์ บอนด์ 2 ปีสู่ราว 4.83% และบอนด์ 30 ปีราว 5.47%</b> น้ำมันที่ลดลงช่วยลดความกังวลเรื่องเงินเฟ้อ แต่ผลตอบแทนยังสูงกว่าจุดต่ำสุดต้นเดือน พ.ย. ที่ราว 4.80% มาก`},
     why:{en:`Bonds barely rallied on a 2% stock drop, which tells you inflation and December Fed-hike bets still dominate — Treasuries are not yet acting as a reliable shock absorber. That favours short-dated bonds (near 4.8–4.9%) over long-duration ones for new money, and argues against leaning on long bonds to hedge an equity selloff.`, th:`บอนด์แทบไม่ขึ้นแม้หุ้นลดลง 2% แสดงว่าเงินเฟ้อและการเดิมพันว่าเฟดจะขึ้นดอกเบี้ยเดือน ธ.ค. ยังเป็นปัจจัยหลัก — พันธบัตรสหรัฐฯ ยังไม่ใช่ตัวรองรับแรงกระแทกที่เชื่อถือได้ จึงควรเลือกตราสารหนี้อายุสั้น (ราว 4.8–4.9%) มากกว่าอายุยาวสำหรับเงินลงทุนใหม่ และไม่ควรพึ่งบอนด์อายุยาวเพื่อป้องกันความเสี่ยงหุ้นตก`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`No new tariff move on Monday, but trade policy hit markets through technology: reports that the administration is tightening rules on remote access to AI chips added to pressure on Nvidia and AMD. Democrats, who won both chambers in the Nov 3 midterms, still plan a bill to undo the Section 301 tariffs, while producer prices up 6.5% from a year earlier show tariffs and energy are still feeding through.`, th:`วันจันทร์ไม่มีความเคลื่อนไหวใหม่เรื่องภาษีนำเข้า แต่นโยบายการค้ากระทบตลาดผ่านเทคโนโลยี: รายงานว่ารัฐบาลคุมเข้มการเข้าถึงชิป AI จากระยะไกล เพิ่มแรงกดดันต่อ Nvidia และ AMD พรรคเดโมแครตที่ชนะทั้งสองสภาในการเลือกตั้งกลางเทอมวันที่ 3 พ.ย. ยังวางแผนเสนอกฎหมายยกเลิกภาษีตามมาตรา 301 ขณะที่ราคาผู้ผลิตที่สูงขึ้น 6.5% จากปีก่อนแสดงว่าภาษีและพลังงานยังส่งผ่านอยู่`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`The US–Iran standoff remains unresolved, but recovering Middle East oil exports pushed Brent down 3.6% to $92.44, easing fears of a spike toward $100. The US–China tech contest is back in focus: tighter remote-access chip rules and the security questions around Nvidia's leadership change hit Taiwan (−4.7%) and Korea (−3%) hardest.`, th:`ความขัดแย้งสหรัฐฯ–อิหร่านยังไม่คลี่คลาย แต่การส่งออกน้ำมันจากตะวันออกกลางที่ฟื้นตัวดัน Brent ลดลง 3.6% สู่ $92.44 ลดความกังวลว่าราคาจะพุ่งเข้าใกล้ $100 การแข่งขันด้านเทคโนโลยีสหรัฐฯ–จีนกลับมาเป็นประเด็น: กฎคุมการเข้าถึงชิปจากระยะไกลและคำถามด้านความมั่นคงรอบการเปลี่ยนผู้บริหาร Nvidia กระทบไต้หวัน (−4.7%) และเกาหลี (−3%) หนักที่สุด`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The 10-year eased to about 5.13% and the 30-year to ~5.47% Monday, helped by lower oil, but stayed far above the early-November low near 4.80%. A December Fed hike remains the base case after hot CPI and 6.5% annual PPI, and the firmer dollar (~103.5) reflects that. Short-dated bonds near 4.8–4.9% offer income with limited price risk; long-duration bonds and expensive growth stocks remain exposed.`, th:`บอนด์ 10 ปีลดลงสู่ราว 5.13% และบอนด์ 30 ปีราว 5.47% วันจันทร์ จากน้ำมันที่ลดลง แต่ยังสูงกว่าจุดต่ำสุดต้นเดือน พ.ย. ที่ราว 4.80% มาก การที่เฟดจะขึ้นดอกเบี้ยเดือน ธ.ค. ยังเป็นกรณีหลัก หลัง CPI ร้อนแรงและ PPI ขึ้น 6.5% ต่อปี และดอลลาร์ที่แข็งค่า (ราว 103.5) สะท้อนเรื่องนี้ ตราสารหนี้อายุสั้นที่ให้ราว 4.8–4.9% ให้รายได้โดยมีความเสี่ยงด้านราคาจำกัด ส่วนบอนด์อายุยาวและหุ้นเติบโตที่แพงยังมีความเสี่ยง`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`No new US inflation data Monday. October PPI (+0.3% m/m, +6.5% y/y) and CPI (+0.4% headline, +0.3% core) still point to strong price pressure, but Brent's drop to $92.44 is the first meaningful relief for headline inflation in weeks. If oil keeps falling, it could soften the case for a big December hike.`, th:`วันจันทร์ไม่มีข้อมูลเงินเฟ้อสหรัฐฯ ใหม่ PPI เดือน ต.ค. (+0.3% จากเดือนก่อน +6.5% จากปีก่อน) และ CPI (ทั่วไป +0.4% พื้นฐาน +0.3%) ยังชี้ว่าแรงกดดันด้านราคาสูง แต่การที่ Brent ลดลงสู่ $92.44 เป็นการผ่อนคลายเงินเฟ้อทั่วไปที่มีนัยสำคัญครั้งแรกในรอบหลายสัปดาห์ หากน้ำมันลดลงต่อ อาจลดเหตุผลที่เฟดจะขึ้นดอกเบี้ยแรงเดือน ธ.ค.`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
