<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Hawkish Fed Minutes Hit the Dow (−561) as Nvidia Fades 2.9% — Nasdaq Edges Up; Anthropic Prices Record $81bn IPO at $83 Ahead of Thursday Debut", th:"บันทึกการประชุมเฟดส่งสัญญาณแข็งกร้าว กด Dow −561 จุด หุ้น Nvidia ย่อ 2.9% — Nasdaq ขึ้นเล็กน้อย Anthropic กำหนดราคา IPO $83 ระดมทุนสถิติโลก $81 พันล้าน ก่อนเข้าตลาดวันพฤหัสฯ"},
    heroDeck:{en:`Nvidia's strong results were not enough to turn the market on Wednesday. The shares gave back their after-hours gain and closed 2.9% lower, and the Fed minutes from the 27–28 Oct meeting sounded tough: almost all officials think further rate hikes will likely be needed, a few argued for a half-point move if inflation data disappoint, and the minutes flagged AI-related borrowing as a financial-stability risk. Governor Waller said the Fed should reverse last year's three cuts and may need to do more. Futures now price about a 95% chance of a quarter-point hike in December, and the dollar hit a 19-month high. The Dow fell 561.25 points (−1.11%) to 50,198.17 and the S&P 500 0.23% to 7,323.64, but the Nasdaq rose 0.42% to 24,429.89, ending a four-day losing run. Long bonds actually rallied: the 10-year fell about 4 bp to ~5.06% and the 30-year to ~5.41%, while the 2-year edged up near 4.8%. Gold dropped about 2% to roughly $3,770 and WTI 3.2% to $83.26, its lowest close since late August, on a big US inventory build. Europe fell for a third day (Stoxx 600 −1.03%, DAX −1.19% to 25,736.24) as miners slumped 4.7%. Asia was mixed: the Nikkei rose 0.28% and Korea's Kospi about 2% on Nvidia, but the Hang Seng lost 0.91% and the SET slipped 0.18% to 1,472.01. After the bell, Anthropic priced its IPO at $83 — above the $70–78 range — raising about $81bn, the largest IPO ever; it starts trading on Nasdaq as ANT on Thursday 19 Nov.`, th:`งบที่แข็งแกร่งของ Nvidia ไม่พอจะพลิกตลาดในวันพุธ หุ้นคืนกำไรช่วงหลังตลาดปิดทั้งหมดและปิดลดลง 2.9% ส่วนบันทึกการประชุมเฟดวันที่ 27–28 ต.ค. ออกมาแข็งกร้าว: กรรมการเกือบทั้งหมดมองว่าน่าจะต้องขึ้นดอกเบี้ยอีก บางคนเสนอขึ้นครั้งละ 0.50% หากตัวเลขเงินเฟ้อออกมาแย่ และบันทึกยังระบุว่าการกู้ยืมเพื่อ AI เป็นความเสี่ยงต่อเสถียรภาพการเงิน ผู้ว่าการเฟด Waller บอกว่าเฟดควรถอนการลดดอกเบี้ย 3 ครั้งของปีก่อน และอาจต้องทำมากกว่านั้น ตลาดฟิวเจอร์สให้โอกาสราว 95% ที่เฟดจะขึ้นดอกเบี้ย 0.25% ในเดือนธันวาคม และดอลลาร์แข็งค่าสุดในรอบ 19 เดือน Dow ลดลง 561.25 จุด (−1.11%) สู่ 50,198.17 S&P 500 ลดลง 0.23% สู่ 7,323.64 แต่ Nasdaq เพิ่มขึ้น 0.42% สู่ 24,429.89 หยุดการลดลง 4 วันติด บอนด์ระยะยาวกลับขึ้นราคา: ผลตอบแทนบอนด์ 10 ปีลดลงราว 0.04% สู่ราว 5.06% และ 30 ปีสู่ราว 5.41% ส่วนบอนด์ 2 ปีขยับขึ้นเล็กน้อยใกล้ 4.8% ทองคำลดลงราว 2% สู่ประมาณ $3,770 และน้ำมัน WTI ลดลง 3.2% สู่ $83.26 ต่ำสุดตั้งแต่ปลายเดือนสิงหาคม จากสต็อกน้ำมันสหรัฐฯ ที่เพิ่มขึ้นมาก ยุโรปลดลงวันที่ 3 ติด (Stoxx 600 −1.03% DAX −1.19% สู่ 25,736.24) โดยหุ้นเหมืองร่วง 4.7% เอเชียผสม: Nikkei ขึ้น 0.28% และ Kospi เกาหลีขึ้นราว 2% ตาม Nvidia แต่ Hang Seng ลดลง 0.91% และ SET ลดลง 0.18% สู่ 1,472.01 หลังตลาดปิด Anthropic กำหนดราคา IPO ที่ $83 — สูงกว่าช่วง $70–78 — ระดมทุนราว $81 พันล้าน มากที่สุดในประวัติศาสตร์ และจะเริ่มซื้อขายใน Nasdaq ชื่อย่อ ANT วันพฤหัสฯ ที่ 19 พ.ย.`},

    dbNext:{en:"Next", th:"ถัดไป"}, dbNextVal:{en:"Watch Anthropic's Nasdaq debut (ANT) on Thu 19 Nov as the cleanest read on AI appetite, whether the Nasdaq can build on Wednesday's small gain while Nvidia fades, any Fed speakers pushing the December hike toward 50 bp, and the final text of the US chip-export rule covering Thailand.", th:"จับตา Anthropic เข้าตลาด Nasdaq (ANT) วันพฤหัสฯ ที่ 19 พ.ย. ซึ่งเป็นตัววัดความต้องการหุ้น AI ที่ชัดที่สุด ดูว่า Nasdaq จะต่อยอดการขึ้นเล็กน้อยของวันพุธได้หรือไม่ ขณะที่ Nvidia อ่อนตัว ดูว่ากรรมการเฟดคนใดผลักให้การขึ้นดอกเบี้ยเดือนธันวาคมเป็น 0.50% และรายละเอียดฉบับสุดท้ายของกฎคุมส่งออกชิปสหรัฐฯ ที่ครอบคลุมไทย"},

    leadtxt:{en:`<b>The market now has two stories pulling in opposite directions: the Fed is set to keep hiking, and AI demand is still huge.</b> On Wednesday the <b>Fed minutes showed almost all officials expect more hikes</b>, with a few open to a <b>half-point move</b>; markets price a <b>~95% chance of a December hike</b> and the <b>dollar hit a 19-month high</b>. That knocked the <b>Dow down 561 points (−1.11%)</b> and the <b>S&P 500 0.23%</b>, while the <b>Nasdaq rose 0.42%</b> even as <b>Nvidia faded 2.9%</b> after its beat. <b>Gold fell about 2% to ~$3,770</b> and <b>WTI 3.2% to $83.26</b>. <b>Anthropic priced its IPO at $83 (record ~$81bn)</b> and debuts Thursday. In Thailand the <b>SET slipped 0.18% to 1,472.01</b> as the baht weakened toward 34. <b>For you:</b> short-dated bond income stays the anchor, keep tech exposure to quality names and size gold small until yields clearly peak.`, th:`<b>ตอนนี้ตลาดมีสองเรื่องที่ดึงไปคนละทาง: เฟดพร้อมขึ้นดอกเบี้ยต่อ แต่ความต้องการ AI ยังสูงมาก</b> วันพุธ <b>บันทึกการประชุมเฟดชี้ว่ากรรมการเกือบทั้งหมดคาดว่าจะขึ้นดอกเบี้ยอีก</b> บางคนเปิดทาง <b>ขึ้นครั้งละ 0.50%</b> ตลาดให้ <b>โอกาสราว 95% ที่จะขึ้นดอกเบี้ยเดือนธันวาคม</b> และ <b>ดอลลาร์แข็งค่าสุดในรอบ 19 เดือน</b> ทำให้ <b>Dow ลดลง 561 จุด (−1.11%)</b> และ <b>S&P 500 ลดลง 0.23%</b> ขณะที่ <b>Nasdaq ขึ้น 0.42%</b> แม้ <b>Nvidia ย่อลง 2.9%</b> หลังงบดี <b>ทองคำลดลงราว 2% สู่ประมาณ $3,770</b> และ <b>WTI ลดลง 3.2% สู่ $83.26</b> <b>Anthropic กำหนดราคา IPO ที่ $83 (สถิติราว $81 พันล้าน)</b> และเข้าตลาดวันพฤหัสฯ ในไทย <b>SET ลดลง 0.18% สู่ 1,472.01</b> ขณะที่บาทอ่อนค่าใกล้ 34 บาท <b>สำหรับคุณ:</b> รายได้จากบอนด์ระยะสั้นยังเป็นหลัก ถือหุ้นเทคเฉพาะบริษัทคุณภาพ และถือทองคำสัดส่วนเล็กจนกว่าผลตอบแทนบอนด์จะผ่านจุดสูงสุดชัดเจน`},

    watchnote:{en:`Wednesday was mixed: hawkish Fed minutes pushed the Dow down 561 points and the S&P 500 0.23%, but the Nasdaq rose 0.42% even as Nvidia faded 2.9%. Gold fell ~2%, WTI 3.2%, and Europe dropped for a third day. The three things that matter most now: Anthropic's record IPO debut on Thursday, how hard Fed speakers lean toward a December hike, and the US chip-export rule that reaches Thailand.`,
      th:`วันพุธตลาดผสม: บันทึกการประชุมเฟดที่แข็งกร้าวกด Dow ลดลง 561 จุด และ S&P 500 ลดลง 0.23% แต่ Nasdaq ขึ้น 0.42% แม้ Nvidia ย่อลง 2.9% ทองคำลดลงราว 2% WTI ลดลง 3.2% และยุโรปลดลงวันที่ 3 ติด สามเรื่องที่สำคัญที่สุดตอนนี้: Anthropic เข้าตลาดด้วย IPO สถิติโลกวันพฤหัสฯ กรรมการเฟดจะเอนไปทางขึ้นดอกเบี้ยเดือนธันวาคมแรงแค่ไหน และกฎคุมส่งออกชิปสหรัฐฯ ที่ครอบคลุมไทย`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป ญี่ปุ่น ฮ่องกง และไทย วันพุธที่ 18 พ.ย. เงื่อนไข IPO ของ Anthropic เป็นไปตามที่มีรายงานหลังตลาดสหรัฐฯ ปิด ผลตอบแทนบอนด์สหรัฐฯ ราคา Brent และทองคำเป็นค่าประมาณ (แต่ละแหล่งต่างกันเล็กน้อย) และยังไม่มีราคาปิดเซี่ยงไฮ้วันที่ 18 พ.ย. ที่ยืนยันได้ ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>US stocks were mixed Wednesday: the S&P 500 slipped 0.23% to 7,323.64 and the Dow fell 1.11% (−561.25 pts) to 50,198.17, but the Nasdaq rose 0.42% to 24,429.89, ending a four-day slide.</b> Nvidia lost 2.9% despite its beat, and hawkish Fed minutes weighed on the rest of the market.`, th:`<b>หุ้นสหรัฐฯ ผสมในวันพุธ: S&P 500 ลดลง 0.23% สู่ 7,323.64 และ Dow ลดลง 1.11% (−561.25 จุด) สู่ 50,198.17 แต่ Nasdaq ขึ้น 0.42% สู่ 24,429.89 หยุดการลดลง 4 วันติด</b> Nvidia ลดลง 2.9% แม้งบดีเกินคาด และบันทึกการประชุมเฟดที่แข็งกร้าวกดดันหุ้นส่วนที่เหลือ`},
      why:{en:`"Sell the news" on Nvidia shows how much good news was already priced in, but the Nasdaq's small gain says the AI selloff is at least pausing. The bigger force now is the Fed: minutes showing almost all officials expect more hikes, plus Waller's call to reverse last year's cuts, hit rate-sensitive old-economy stocks hardest (hence the Dow). Thursday's Anthropic debut is the next test of whether investors still pay up for AI growth.`, th:`การ "ขายเมื่อข่าวออก" ของ Nvidia แสดงว่าข่าวดีถูกสะท้อนในราคาไปมากแล้ว แต่ Nasdaq ที่ขึ้นเล็กน้อยบอกว่าการเทขายหุ้น AI อย่างน้อยก็หยุดพัก แรงที่ใหญ่กว่าตอนนี้คือเฟด: บันทึกการประชุมที่ชี้ว่ากรรมการเกือบทั้งหมดคาดว่าจะขึ้นดอกเบี้ยอีก บวกกับ Waller ที่เสนอให้ถอนการลดดอกเบี้ยของปีก่อน กระทบหุ้นเศรษฐกิจดั้งเดิมที่อ่อนไหวต่อดอกเบี้ยมากที่สุด (จึงเห็น Dow ลดลงแรง) การเข้าตลาดของ Anthropic วันพฤหัสฯ คือบททดสอบถัดไปว่านักลงทุนยังพร้อมจ่ายแพงเพื่อการเติบโตของ AI หรือไม่`},
      full:{en:`US stocks ended mixed on Wednesday, November 18. The Dow Jones Industrial Average fell 561.25 points (−1.11%) to 50,198.17 and the S&P 500 lost 16.89 points (−0.23%) to 7,323.64, while the Nasdaq Composite gained 101.50 points (+0.42%) to 24,429.89, according to Reuters. Nvidia, which beat estimates and guided fourth-quarter revenue to about $130bn late Tuesday, reversed its after-hours gain and closed 2.9% lower. Minutes of the Fed's 27–28 October meeting showed almost all participants judged further rate increases would likely be appropriate, a few argued for a 50-basis-point hike if inflation data were unfavourable, and officials flagged AI-related debt as a financial-stability risk. Governor Christopher Waller said the Fed needs to reverse last year's three quarter-point cuts and may need to do more. Futures priced roughly a 95% chance of a quarter-point December hike, and the dollar rose to a 19-month high. After the close, Anthropic priced its IPO at $83 a share, above its $70–78 range, selling about 980 million shares to raise roughly $81bn — the largest IPO on record — at a valuation of about $1.5 trillion; it begins trading on Nasdaq under ANT on November 19.`, th:`หุ้นสหรัฐฯ ปิดผสมในวันพุธที่ 18 พ.ย. Dow Jones ลดลง 561.25 จุด (−1.11%) สู่ 50,198.17 และ S&P 500 ลดลง 16.89 จุด (−0.23%) สู่ 7,323.64 ขณะที่ Nasdaq เพิ่มขึ้น 101.50 จุด (+0.42%) สู่ 24,429.89 ตามรายงานของรอยเตอร์ Nvidia ซึ่งประกาศงบดีเกินคาดและคาดรายได้ไตรมาส 4 ราว $130 พันล้านเมื่อคืนวันอังคาร กลับคืนกำไรหลังตลาดปิดและปิดลดลง 2.9% บันทึกการประชุมเฟดวันที่ 27–28 ต.ค. แสดงว่ากรรมการเกือบทั้งหมดมองว่าน่าจะต้องขึ้นดอกเบี้ยอีก บางคนเสนอขึ้น 0.50% หากตัวเลขเงินเฟ้อไม่ดี และระบุว่าหนี้ที่เกี่ยวกับ AI เป็นความเสี่ยงต่อเสถียรภาพการเงิน ผู้ว่าการเฟด Christopher Waller บอกว่าเฟดต้องถอนการลดดอกเบี้ย 0.25% สามครั้งของปีก่อน และอาจต้องทำมากกว่านั้น ตลาดฟิวเจอร์สให้โอกาสราว 95% ที่จะขึ้นดอกเบี้ย 0.25% ในเดือนธันวาคม และดอลลาร์แข็งค่าสุดในรอบ 19 เดือน หลังตลาดปิด Anthropic กำหนดราคา IPO ที่ $83 ต่อหุ้น สูงกว่าช่วง $70–78 ขายราว 980 ล้านหุ้น ระดมทุนราว $81 พันล้าน — IPO ใหญ่ที่สุดเป็นประวัติการณ์ — มูลค่าบริษัทราว $1.5 ล้านล้าน และจะเริ่มซื้อขายใน Nasdaq ชื่อย่อ ANT วันที่ 19 พ.ย.`},
      sources:[{l:"Reuters via Rallies — Wall Street ends mixed after Nvidia earnings, Fed minutes",u:"https://rallies.ai/news/wall-street-ends-mixed-after-nvidia-earnings-fed-minutes-530df1173b35bac2"},{l:"Benzinga — Fed minutes: almost all officials see more rate hikes",u:"https://www.benzinga.com/markets/economic-data/26/11/63409950/fed-minutes-almost-all-officials-more-hikes-ai-debt"},{l:"CNBC — Anthropic IPO raises over $81 billion in largest offering on record",u:"https://www.cnbc.com/2026/11/18/anthropic-ipo-ai-offering-price.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,736.24", chg:-1.19, series:[26045.37,25736.24],
      txt:{en:`<b>Germany's DAX fell 1.19% to 25,736.24 Wednesday</b> and the Stoxx 600 lost 1.03% to 644.05 — its third straight loss and lowest close since 6 Nov — as miners dropped 4.7%.`, th:`<b>ดัชนี DAX เยอรมนีลดลง 1.19% สู่ 25,736.24 วันพุธ</b> และ Stoxx 600 ลดลง 1.03% สู่ 644.05 — ลดลงวันที่ 3 ติด ต่ำสุดตั้งแต่ 6 พ.ย. — โดยหุ้นเหมืองร่วง 4.7%`},
      why:{en:`Europe got little lift from Nvidia because it owns few AI winners, and its heavy weight in miners and banks makes it sensitive to a strong dollar and falling metal prices. With the Fed leaning toward more hikes and the dollar at a 19-month high, the region's relative cushion is gone for now; the DAX is roughly 3–4% off its record.`, th:`ยุโรปได้ประโยชน์จาก Nvidia น้อย เพราะมีหุ้นผู้ชนะด้าน AI ไม่มาก และมีน้ำหนักหุ้นเหมืองและธนาคารสูง ทำให้อ่อนไหวต่อดอลลาร์ที่แข็งค่าและราคาโลหะที่ลดลง เมื่อเฟดเอนไปทางขึ้นดอกเบี้ยเพิ่มและดอลลาร์แข็งสุดในรอบ 19 เดือน แรงพยุงของภูมิภาคนี้จึงหายไปในตอนนี้ DAX ต่ำกว่าระดับสูงสุดราว 3–4%`},
      full:{en:`Germany's DAX closed 1.19% lower at 25,736.24 on Wednesday, November 18, according to Reuters-based reports. The pan-European Stoxx 600 fell 1.03% to 644.05, its third consecutive decline and lowest close since November 6. London's FTSE 100 lost 1.3% to 10,551.17 and France's CAC 40 0.85% to 8,146.83. Mining stocks fell 4.7%, their steepest one-day drop since May 15, as metals slid, and investors were cautious ahead of Anthropic's IPO pricing and the Fed minutes.`, th:`ดัชนี DAX เยอรมนีปิดลดลง 1.19% สู่ 25,736.24 วันพุธที่ 18 พ.ย. ตามรายงานที่อ้างอิงรอยเตอร์ Stoxx 600 ลดลง 1.03% สู่ 644.05 ลดลงวันที่ 3 ติดและต่ำสุดตั้งแต่ 6 พ.ย. FTSE 100 ของลอนดอนลดลง 1.3% สู่ 10,551.17 และ CAC 40 ของฝรั่งเศสลดลง 0.85% สู่ 8,146.83 หุ้นเหมืองลดลง 4.7% แรงที่สุดในวันเดียวตั้งแต่ 15 พ.ค. ตามราคาโลหะที่ลดลง และนักลงทุนระมัดระวังก่อนการกำหนดราคา IPO ของ Anthropic และบันทึกการประชุมเฟด`},
      sources:[{l:"MLQ — European stocks fall 1% for a third straight day as miners drop 4.7%",u:"https://mlq.ai/news/european-stocks-fall-1-for-a-third-straight-day-as-miners-drop-47-and-the-ftse-100-loses-13/"},{l:"Yahoo Finance (Reuters) — European stocks hit two-week low on weak miners, caution ahead of Anthropic IPO",u:"https://finance.yahoo.com/markets/stocks/articles/european-shares-muted-tech-offsets-082501845.html"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"59,024.28", chg:0.28, series:[58860.43,59024.28],
      txt:{en:`<b>Tokyo's Nikkei 225 rose 0.28% to 59,024.28 Wednesday</b> on Nvidia's results, while Korea's Kospi jumped 1.99% to 5,067.44, back above 5,000, though early gains faded across the region.`, th:`<b>ดัชนี Nikkei 225 ญี่ปุ่นขึ้น 0.28% สู่ 59,024.28 วันพุธ</b> จากงบ Nvidia ขณะที่ Kospi เกาหลีขึ้น 1.99% สู่ 5,067.44 กลับมาเหนือ 5,000 แม้กำไรช่วงเช้าในภูมิภาคจะลดลง`},
      why:{en:`Asia got the Nvidia bounce the US did not keep: chip suppliers in Korea and Japan rallied at the open, but gains shrank through the day. Since Nvidia then fell 2.9% in New York, Thursday may give some of this back — unless Anthropic's debut revives AI appetite. Japan still carries the weight of its Q3 GDP contraction.`, th:`เอเชียได้แรงดีดจาก Nvidia ที่สหรัฐฯ รักษาไว้ไม่ได้: หุ้นซัพพลายเออร์ชิปในเกาหลีและญี่ปุ่นขึ้นแรงช่วงเปิด แต่กำไรลดลงระหว่างวัน เมื่อ Nvidia ลดลง 2.9% ที่นิวยอร์ก วันพฤหัสฯ อาจคืนกำไรบางส่วน — เว้นแต่การเข้าตลาดของ Anthropic จะปลุกความสนใจหุ้น AI กลับมา ญี่ปุ่นยังมีแรงกดดันจาก GDP ไตรมาส 3 ที่หดตัว`},
      full:{en:`The Nikkei 225 closed at 59,024.28 on Wednesday, November 18, up 0.28% from Tuesday's 58,860.43. South Korea's Kospi rose 1.99% to 5,067.44 after jumping about 3% intraday, recovering above 5,000 a day after falling below it for the first time in about nine months. Nvidia's fourth-quarter revenue forecast of about $130bn, above the roughly $125bn expected, lifted chip suppliers early, but several reports noted the rally faded through the session.`, th:`Nikkei 225 ปิดที่ 59,024.28 วันพุธที่ 18 พ.ย. เพิ่มขึ้น 0.28% จาก 58,860.43 ของวันอังคาร Kospi เกาหลีขึ้น 1.99% สู่ 5,067.44 หลังขึ้นราว 3% ระหว่างวัน กลับมาเหนือ 5,000 หนึ่งวันหลังจากหลุดระดับนี้ครั้งแรกในรอบราว 9 เดือน คาดการณ์รายได้ไตรมาส 4 ของ Nvidia ราว $130 พันล้าน สูงกว่าที่คาดราว $125 พันล้าน หนุนหุ้นซัพพลายเออร์ชิปช่วงเช้า แต่หลายรายงานระบุว่าแรงขึ้นลดลงระหว่างวัน`},
      sources:[{l:"Pomegra — Asian markets rally as Kospi leads on Nvidia outlook",u:"https://pomegra.io/news/asian-markets-rally-as-kospi-leads-on-nvidia-outlook"},{l:"Handelsblatt — Starke Nvidia-Zahlen stützen asiatische Börsen",u:"https://handelsblatt.com/finanzen/maerkte/marktberichte/nikkei-kospi-co.-starke-nvidia-zahlen-stuetzen-asiatische-boersen/100270767.html"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"23,294.75", chg:-0.91, series:[23509.17,23294.75],
      txt:{en:`<b>Hong Kong's Hang Seng fell 0.91% to 23,294.75 Wednesday,</b> a second straight loss, missing out on the Nvidia bounce; mainland shares stayed near their lows of the year.`, th:`<b>ดัชนี Hang Seng ฮ่องกงลดลง 0.91% สู่ 23,294.75 วันพุธ</b> ลดลงวันที่ 2 ติด ไม่ได้รับแรงดีดจาก Nvidia ส่วนหุ้นจีนแผ่นดินใหญ่ยังอยู่ใกล้ระดับต่ำสุดของปี`},
      why:{en:`Nvidia's results do little for China: its guidance assumes zero China data-centre sales, and the new US chip rules aim to stop Chinese firms renting AI chips abroad. A stronger dollar and a hawkish Fed add pressure on Hong Kong, whose rates track the US. Trade-talk headlines remain the main swing factor.`, th:`งบ Nvidia แทบไม่ช่วยจีน: คาดการณ์ของบริษัทไม่รวมยอดขายศูนย์ข้อมูลในจีน และกฎคุมชิปใหม่ของสหรัฐฯ มุ่งหยุดไม่ให้บริษัทจีนเช่าใช้ชิป AI ในต่างประเทศ ดอลลาร์ที่แข็งค่าและเฟดที่แข็งกร้าวเพิ่มแรงกดดันต่อฮ่องกง ซึ่งดอกเบี้ยเคลื่อนตามสหรัฐฯ ข่าวการเจรจาการค้ายังเป็นปัจจัยหลัก`},
      full:{en:`Hong Kong's Hang Seng Index fell 0.91% on Wednesday, November 18, to close at 23,294.75, according to Bastille Post and Yahoo Finance data, after Tuesday's roughly 1% drop. A confirmed Shanghai Composite close for November 18 was not available at the time of writing; on Tuesday it ended at 3,584.58, down 0.5%.`, th:`ดัชนี Hang Seng ฮ่องกงลดลง 0.91% วันพุธที่ 18 พ.ย. ปิดที่ 23,294.75 ตามข้อมูลของ Bastille Post และ Yahoo Finance หลังจากลดลงราว 1% วันอังคาร ยังไม่มีราคาปิด Shanghai Composite วันที่ 18 พ.ย. ที่ยืนยันได้ ณ เวลาที่เขียน วันอังคารดัชนีปิดที่ 3,584.58 ลดลง 0.5%`},
      sources:[{l:"Bastille Post — Hong Kong stocks close lower Wednesday",u:"https://www.bastillepost.com/global/article/6373188-hong-kong-stocks-close-lower-wednesday-11"},{l:"ad-hoc-news — Shanghai Composite falls 0.5% to 3,584.58 on Tuesday close",u:"https://www.ad-hoc-news.de/boerse/news/marktberichte/shanghai-composite-falls-0-5-prozent-to-3-584-58-on-tuesday-close/70528336"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,472.01", chg:-0.18, series:[1474.68,1472.01],
      txt:{en:`<b>SET Index slipped 0.18% (−2.67 pts) to 1,472.01 Wednesday</b> on turnover of THB 62.11bn, after rising as high as 1,483 in the morning on Nvidia; hospitals, banks and tourism stocks dragged in the afternoon.`, th:`<b>ดัชนี SET ลดลง 0.18% (−2.67 จุด) สู่ 1,472.01 วันพุธ</b> มูลค่าซื้อขาย 62,110.77 ล้านบาท หลังขึ้นไปสูงสุด 1,483 จุดช่วงเช้าตามงบ Nvidia หุ้นโรงพยาบาล ธนาคาร และท่องเที่ยวกดดันช่วงบ่าย`},
      why:{en:`Thailand caught a morning lift in electronics stocks on Nvidia, but it did not last: the baht weakened toward 34 per dollar as the Fed turned more hawkish, and local funds sold defensives. The index is now sitting just below the 1,480 support it broke on Tuesday's chip-rule news, so it still needs either better clarity on the US chip rules or a softer dollar to recover.`, th:`ไทยได้แรงหนุนช่วงเช้าในหุ้นอิเล็กทรอนิกส์จาก Nvidia แต่ไม่นาน: บาทอ่อนค่าใกล้ 34 บาทต่อดอลลาร์ เมื่อเฟดแข็งกร้าวขึ้น และกองทุนในประเทศขายหุ้นกลุ่มตั้งรับ ดัชนีอยู่ต่ำกว่าแนวรับ 1,480 ที่หลุดไปเมื่อวันอังคารจากข่าวกฎคุมชิป จึงยังต้องการความชัดเจนเรื่องกฎคุมชิปของสหรัฐฯ หรือดอลลาร์ที่อ่อนลงเพื่อฟื้นตัว`},
      full:{en:`Thailand's SET Index fell 2.67 points (−0.18%) to close at 1,472.01 on Wednesday, November 18, with trading value of THB 62.11 billion; the intraday high was 1,483.01 and the low 1,465.37, according to Hoonsmart. The index rebounded about 7 points in the morning as electronics stocks rallied on Nvidia's stronger-than-expected results, but selling in hospital, bank and tourism stocks and a weaker baht near 34 per dollar pushed it into the red by the close, according to Kaohoon and Thai Tabloid. Funds and foreign investors were net sellers, Kaohoon reported.`, th:`ดัชนี SET ลดลง 2.67 จุด (−0.18%) ปิดที่ 1,472.01 วันพุธที่ 18 พ.ย. มูลค่าซื้อขาย 62,110.77 ล้านบาท สูงสุดระหว่างวัน 1,483.01 และต่ำสุด 1,465.37 ตามข้อมูลของ Hoonsmart ช่วงเช้าดัชนีรีบาวด์ราว 7 จุด เพราะหุ้นอิเล็กทรอนิกส์ขึ้นตามงบ Nvidia ที่ดีเกินคาด แต่แรงขายหุ้นโรงพยาบาล ธนาคาร และท่องเที่ยว รวมกับบาทที่อ่อนค่าใกล้ 34 บาทต่อดอลลาร์ ทำให้ปิดติดลบ ตามรายงานของข่าวหุ้นและ Thai Tabloid ข่าวหุ้นรายงานว่ากองทุนและนักลงทุนต่างชาติขายสุทธิ`},
      sources:[{l:"Hoonsmart — SET closes down 2.67 pts; electronics and PTT bought",u:"https://hoonsmart.com/archives/449223"},{l:"Kaohoon — SET closes 3 pts lower on selling in hospitals, banks and tourism",u:"https://www.kaohoon.com/summary/882455"},{l:"Thai Tabloid — SET trading summary, 18 November 2026",u:"https://thaitabloid.com/archives/331673"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold fell about 2% Wednesday to roughly $3,770/oz, briefly dipping below $3,750,</b> as hawkish Fed minutes and a 19-month-high dollar hit metals. <b>WTI dropped 3.2% to $83.26, its lowest close since late August,</b> on a large US inventory build; Brent eased to about $91.7.`, th:`<b>ทองคำลดลงราว 2% วันพุธ สู่ประมาณ $3,770 ต่อออนซ์ และหลุด $3,750 ชั่วคราว</b> เพราะบันทึกการประชุมเฟดที่แข็งกร้าวและดอลลาร์ที่แข็งสุดในรอบ 19 เดือน <b>WTI ลดลง 3.2% สู่ $83.26 ต่ำสุดตั้งแต่ปลายเดือนสิงหาคม</b> จากสต็อกน้ำมันสหรัฐฯ ที่เพิ่มขึ้นมาก Brent อ่อนตัวสู่ราว $91.7`},
     why:{en:`Cheaper oil is good news for Thailand's import bill and for inflation, which is what the Fed is fighting. Gold is acting like a rate trade, not a safe haven: each hawkish Fed signal pushes it lower. Keep it a small hedge; wait for clear signs that US yields and the dollar have peaked before adding.`, th:`น้ำมันที่ถูกลงเป็นข่าวดีต่อค่านำเข้าของไทยและต่อเงินเฟ้อ ซึ่งเป็นสิ่งที่เฟดกำลังต่อสู้ ทองคำเคลื่อนไหวตามดอกเบี้ยมากกว่าเป็นที่หลบภัย: ทุกสัญญาณแข็งกร้าวจากเฟดกดราคาลง ถือเป็นการป้องกันความเสี่ยงสัดส่วนเล็ก และรอสัญญาณชัดว่าผลตอบแทนบอนด์สหรัฐฯ และดอลลาร์ผ่านจุดสูงสุดก่อนเพิ่ม`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 10-year Treasury yield fell about 4 bp to ~5.06% Wednesday and the 30-year to ~5.41%, while the 2-year edged up near 4.8%.</b> The Fed minutes showed almost all officials expect further hikes; Governor Waller said last year's three cuts should be reversed, and futures price ~95% odds of a December hike.`, th:`<b>ผลตอบแทนบอนด์สหรัฐฯ 10 ปีลดลงราว 0.04% สู่ราว 5.06% วันพุธ และ 30 ปีสู่ราว 5.41% ขณะที่ 2 ปีขยับขึ้นใกล้ 4.8%</b> บันทึกการประชุมเฟดชี้ว่ากรรมการเกือบทั้งหมดคาดว่าจะขึ้นดอกเบี้ยอีก ผู้ว่าการ Waller บอกว่าควรถอนการลดดอกเบี้ย 3 ครั้งของปีก่อน และตลาดฟิวเจอร์สให้โอกาสราว 95% ที่จะขึ้นดอกเบี้ยเดือนธันวาคม`},
     why:{en:`The curve flattened: short yields hold up because hikes are coming, while long yields fell because markets think a tougher Fed will cool inflation later. That keeps short-dated bonds (~4.8%) the best balance of income and price risk, and makes long bonds a little more useful as a hedge again. A half-point December hike would be the main surprise risk.`, th:`เส้นอัตราผลตอบแทนแบนลง: ผลตอบแทนระยะสั้นทรงตัวสูงเพราะการขึ้นดอกเบี้ยกำลังมา ส่วนระยะยาวลดลงเพราะตลาดคิดว่าเฟดที่เข้มขึ้นจะช่วยลดเงินเฟ้อในอนาคต บอนด์ระยะสั้น (ราว 4.8%) จึงยังสมดุลที่สุดระหว่างรายได้และความเสี่ยงด้านราคา และบอนด์ระยะยาวกลับมามีประโยชน์ในการป้องกันความเสี่ยงมากขึ้นเล็กน้อย ความเสี่ยงหลักที่อาจทำให้ตลาดตกใจคือการขึ้นดอกเบี้ย 0.50% ในเดือนธันวาคม`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
