<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">

          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Rebound Fades: Nvidia −6%, Micron −11% and Anthropic Breaks Below Its $83 IPO Price as Nasdaq Drops 1.5%", th:"แรงดีดกลับแผ่ว: Nvidia −6% Micron −11% และ Anthropic หลุดราคา IPO $83 ขณะที่ Nasdaq ลดลง 1.5%"},
    heroDeck:{en:`Tuesday gave back part of Monday's huge rally as investors sold chip stocks and rotated into value names. The S&P 500 slipped 36.08 points (−0.50%) to 7,201.09, about 7.9% below its October record; the Nasdaq Composite fell 356.02 points (−1.48%) to 23,733.54; but the Dow rose about 0.85% to 50,018.70, back above 50,000. Nvidia fell about 5.9% a day after its 31% jump, Micron dropped about 11% and CoreWeave about 12%. Anthropic (ANT) fell 6.5% to $81.91, closing below its $83 IPO price only four trading days after its debut. NY Fed President Williams warned that inflation is still too high, and futures price a ~95% chance of a quarter-point Fed hike on 9 December. Treasuries were little changed: 2-year ~4.67%, 10-year ~4.91%, 30-year ~5.29%. Gold fell about 2.3% to ~$3,550 near its 12-month low, while oil rebounded on mine and tanker attacks around the Strait of Hormuz: WTI +2.35% to $82.05, Brent +2.3% to $91.40. Asia caught Monday's rally first: Japan reopened with the Nikkei +3.91% to 58,644.63 on chip-equipment names, while the Hang Seng fell 0.73% to 22,219.65 after the US blacklisted an Alibaba unit, and Shanghai rose 0.27% to 3,548.37. The DAX fell 1.26% to 25,017.81, and the SET slipped 2.84 points (−0.20%) to 1,451.65 as foreigners sold about THB 5.3bn.`, th:`วันอังคารหุ้นคืนกำไรบางส่วนจากการพุ่งแรงวันจันทร์ นักลงทุนขายหุ้นชิปและย้ายไปหุ้นพื้นฐาน (Value) S&P 500 ลดลง 36.08 จุด (−0.50%) สู่ 7,201.09 ต่ำกว่าสถิติเดือนตุลาคมราว 7.9% Nasdaq ลดลง 356.02 จุด (−1.48%) สู่ 23,733.54 แต่ Dow ขึ้นราว 0.85% สู่ 50,018.70 กลับเหนือ 50,000 Nvidia ลดลงราว 5.9% หลังพุ่ง 31% วันก่อน Micron ลดลงราว 11% และ CoreWeave ราว 12% Anthropic (ANT) ลดลง 6.5% สู่ $81.91 ปิดต่ำกว่าราคา IPO $83 หลังเข้าตลาดได้เพียง 4 วัน ประธานเฟดนิวยอร์ก Williams เตือนว่าเงินเฟ้อยังสูงเกินไป ตลาดให้โอกาสราว 95% ที่เฟดจะขึ้นดอกเบี้ย 0.25% วันที่ 9 ธ.ค. บอนด์สหรัฐฯ แทบไม่เปลี่ยน: 2 ปีราว 4.67% 10 ปีราว 4.91% 30 ปีราว 5.29% ทองคำลดลงราว 2.3% สู่ราว $3,550 ใกล้จุดต่ำสุดในรอบ 12 เดือน ส่วนน้ำมันดีดกลับเพราะเรือบรรทุกน้ำมันโดนทุ่นระเบิดและถูกโจมตีแถวช่องแคบฮอร์มุซ: WTI +2.35% สู่ $82.05 Brent +2.3% สู่ $91.40 เอเชียรับข่าวดีวันจันทร์ก่อน: ญี่ปุ่นกลับมาเปิด Nikkei +3.91% สู่ 58,644.63 นำโดยหุ้นอุปกรณ์ผลิตชิป แต่ Hang Seng ลดลง 0.73% สู่ 22,219.65 หลังสหรัฐฯ ขึ้นบัญชีดำบริษัทในเครือ Alibaba และเซี่ยงไฮ้ขึ้น 0.27% สู่ 3,548.37 DAX ลดลง 1.26% สู่ 25,017.81 และ SET ลดลง 2.84 จุด (−0.20%) สู่ 1,451.65 โดยต่างชาติขายสุทธิราว 5,270 ล้านบาท`},

    dbNext:{en:"Next", th:"ถัดไป"}, dbNextVal:{en:"Today (Wed 25 Nov, 8:30 ET): October PCE inflation and the Q3 GDP revision — a firm core PCE would cement a 9 December Fed hike. Also watch the new Trump tariffs on China, the EU and others, Hormuz shipping attacks, and whether chip stocks stabilise before Thursday's Thanksgiving close.", th:"วันนี้ (พุธ 25 พ.ย. 8:30 ET): เงินเฟ้อ PCE เดือนตุลาคม และ GDP ไตรมาส 3 ฉบับปรับปรุง — หาก core PCE สูงจะยืนยันการขึ้นดอกเบี้ยของเฟดวันที่ 9 ธ.ค. จับตาภาษีใหม่ของทรัมป์ต่อจีน ยุโรป และประเทศอื่น การโจมตีเรือในช่องแคบฮอร์มุซ และหุ้นชิปจะทรงตัวได้หรือไม่ก่อนตลาดปิดวัน Thanksgiving วันพฤหัสฯ"},

    leadtxt:{en:`<b>Monday's rally faded on Tuesday as chip stocks were sold and Anthropic fell below its IPO price.</b> The <b>S&P 500 slipped 0.50% to 7,201.09</b> and the <b>Nasdaq fell 1.48% to 23,733.54</b>, but the <b>Dow rose ~0.85% to 50,018.70</b> as money rotated into value stocks. <b>Nvidia fell ~5.9%, Micron ~11%</b>, and <b>Anthropic dropped 6.5% to $81.91, under its $83 IPO price</b>. The S&P 500 is still about 7.9% below its peak — the correction isn't over. <b>Yields were flat (2-year ~4.67%, 10-year ~4.91%)</b> and markets price a <b>~95% chance of a 9 December Fed hike</b> after the NY Fed's Williams warned on inflation. <b>Gold fell back to ~$3,550</b>, while <b>oil rose (WTI $82.05, +2.35%)</b> on Hormuz tanker attacks. Asia caught up with Monday's rally (<b>Nikkei +3.91%</b>), but <b>Hong Kong fell 0.73%</b> after the US blacklisted an Alibaba unit, the <b>DAX fell 1.26%</b>, and the <b>SET slipped 0.20% to 1,451.65</b> as foreigners sold ~THB 5.3bn. <b>For you:</b> this is a choppy, rate-driven market — keep quality bond income as the core, add to tech only slowly and only on dips, and hold gold as a small hedge rather than adding to it while the Fed is hiking.`, th:`<b>แรงดีดกลับวันจันทร์แผ่วลงในวันอังคาร หุ้นชิปถูกขาย และ Anthropic หลุดราคา IPO</b> <b>S&P 500 ลดลง 0.50% สู่ 7,201.09</b> และ <b>Nasdaq ลดลง 1.48% สู่ 23,733.54</b> แต่ <b>Dow ขึ้นราว 0.85% สู่ 50,018.70</b> เพราะเงินไหลไปหุ้นพื้นฐาน (Value) <b>Nvidia ลดลงราว 5.9% Micron ราว 11%</b> และ <b>Anthropic ลดลง 6.5% สู่ $81.91 ต่ำกว่าราคา IPO $83</b> S&P 500 ยังต่ำกว่าจุดสูงสุดราว 7.9% — การปรับฐานยังไม่จบ <b>ผลตอบแทนบอนด์ทรงตัว (2 ปีราว 4.67% 10 ปีราว 4.91%)</b> และตลาดให้ <b>โอกาสราว 95% ที่เฟดจะขึ้นดอกเบี้ยวันที่ 9 ธ.ค.</b> หลัง Williams จากเฟดนิวยอร์กเตือนเรื่องเงินเฟ้อ <b>ทองคำลดลงกลับสู่ราว $3,550</b> ส่วน <b>น้ำมันขึ้น (WTI $82.05, +2.35%)</b> จากการโจมตีเรือบรรทุกน้ำมันแถวฮอร์มุซ เอเชียขึ้นตามวันจันทร์ (<b>Nikkei +3.91%</b>) แต่ <b>ฮ่องกงลดลง 0.73%</b> หลังสหรัฐฯ ขึ้นบัญชีดำบริษัทในเครือ Alibaba <b>DAX ลดลง 1.26%</b> และ <b>SET ลดลง 0.20% สู่ 1,451.65</b> โดยต่างชาติขายสุทธิราว 5,270 ล้านบาท <b>สำหรับคุณ:</b> ตลาดตอนนี้แกว่งแรงและขึ้นกับดอกเบี้ย — ให้รายได้จากบอนด์คุณภาพเป็นแกนหลัก ทยอยเพิ่มหุ้นเทคช้า ๆ เฉพาะตอนราคาย่อ และถือทองคำสัดส่วนเล็กเป็นตัวป้องกันความเสี่ยง ยังไม่ต้องเพิ่มในช่วงที่เฟดขึ้นดอกเบี้ย`},

    watchnote:{en:`Tuesday showed how fragile Monday's rebound was: Nasdaq −1.48%, Nvidia −5.9%, Micron −11%, and Anthropic closed below its IPO price, while the Dow edged back above 50,000. The S&P 500 is still about 7.9% below its October peak. The three things that matter most in this holiday-shortened week: today's PCE inflation and GDP data, whether the Fed hikes on 9 December, and new Trump tariffs plus Hormuz shipping attacks that could push oil and inflation back up.`,
      th:`วันอังคารแสดงให้เห็นว่าการดีดกลับวันจันทร์ยังเปราะบาง: Nasdaq −1.48% Nvidia −5.9% Micron −11% และ Anthropic ปิดต่ำกว่าราคา IPO ขณะที่ Dow กลับเหนือ 50,000 S&P 500 ยังต่ำกว่าจุดสูงสุดเดือนตุลาคมราว 7.9% สามเรื่องที่สำคัญที่สุดในสัปดาห์ที่มีวันหยุดนี้: ตัวเลขเงินเฟ้อ PCE และ GDP วันนี้ เฟดจะขึ้นดอกเบี้ยวันที่ 9 ธ.ค. หรือไม่ และภาษีใหม่ของทรัมป์กับการโจมตีเรือในฮอร์มุซที่อาจดันราคาน้ำมันและเงินเฟ้อกลับขึ้น`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป เอเชีย และไทย วันอังคารที่ 24 พ.ย. ผลตอบแทนบอนด์สหรัฐฯ ทองคำ Dow และราคาปิด Nikkei เป็นค่าประมาณ (แต่ละแหล่งต่างกันเล็กน้อยตามเวลา) ราคาปิดเซี่ยงไฮ้และ DAX มาจากรายงานสรุปตลาด และข่าวบริษัทเป็นไปตามที่สื่อรายงาน ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,201.09", chg:-0.50, series:[7237.17,7201.09],
      txt:{en:`<b>US stocks gave back part of Monday's rally on Tuesday: the S&P 500 slipped 0.50% to 7,201.09 and the Nasdaq fell 1.48% to 23,733.54, while the Dow rose about 0.85% to 50,018.70.</b> Nvidia fell ~5.9%, Micron ~11%, and Anthropic dropped 6.5% to $81.91, below its $83 IPO price.`, th:`<b>หุ้นสหรัฐฯ คืนกำไรบางส่วนจากวันจันทร์ในวันอังคาร: S&P 500 ลดลง 0.50% สู่ 7,201.09 และ Nasdaq ลดลง 1.48% สู่ 23,733.54 ส่วน Dow ขึ้นราว 0.85% สู่ 50,018.70</b> Nvidia ลดลงราว 5.9% Micron ราว 11% และ Anthropic ลดลง 6.5% สู่ $81.91 ต่ำกว่าราคา IPO $83`},
      why:{en:`A sharp one-day rebound followed by selling the next day is typical of a correction, not a new uptrend. Money moved out of chip and AI names into value stocks, which is why the Dow rose while the Nasdaq fell. Anthropic closing below its IPO price is a warning that investors won't pay any price for AI growth while the Fed is hiking: NY Fed President Williams said inflation is still too high, keeping a 9 December hike ~95% priced.`, th:`การดีดกลับแรงวันเดียวแล้วถูกขายวันถัดมาเป็นลักษณะปกติของช่วงปรับฐาน ยังไม่ใช่ขาขึ้นใหม่ เงินไหลออกจากหุ้นชิปและ AI ไปหุ้นพื้นฐาน (Value) Dow จึงขึ้นขณะที่ Nasdaq ลดลง การที่ Anthropic ปิดต่ำกว่าราคา IPO เป็นสัญญาณเตือนว่านักลงทุนไม่ยอมจ่ายแพงเพื่อการเติบโตของ AI ในช่วงที่เฟดขึ้นดอกเบี้ย: Williams ประธานเฟดนิวยอร์กระบุว่าเงินเฟ้อยังสูงเกินไป ตลาดจึงยังให้โอกาสราว 95% ที่จะขึ้นดอกเบี้ยวันที่ 9 ธ.ค.`},
      full:{en:`US stocks were mixed on Tuesday, November 24. The S&P 500 fell 36.08 points (−0.50%) to 7,201.09, about 7.9% below its October 6 record of 7,818.93; the Nasdaq Composite fell 356.02 points (−1.48%) to 23,733.54; and the Dow Jones Industrial Average rose about 0.85% to 50,018.70, according to Yahoo Finance, Bloomberg/BNN and the Motley Fool. Chip stocks led the decline: Nvidia closed down about 5.9% after Monday's ~31% surge on Jensen Huang's reinstatement, Micron fell about 11% and CoreWeave about 12%. Anthropic (ANT) fell 6.5% to close at $81.91, below its $83 IPO price in its fourth trading day, according to CNBC, Axios and TechCrunch. The 10-year Treasury yield was little changed near 4.91%. NY Fed President John Williams said inflation remains too high and policy will need to adjust.`, th:`หุ้นสหรัฐฯ ปิดผสมวันอังคารที่ 24 พ.ย. S&P 500 ลดลง 36.08 จุด (−0.50%) สู่ 7,201.09 ต่ำกว่าสถิติ 7,818.93 เมื่อ 6 ต.ค. ราว 7.9% Nasdaq ลดลง 356.02 จุด (−1.48%) สู่ 23,733.54 และ Dow Jones ขึ้นราว 0.85% สู่ 50,018.70 ตามรายงานของ Yahoo Finance, Bloomberg/BNN และ Motley Fool หุ้นชิปนำการลดลง: Nvidia ปิดลดลงราว 5.9% หลังพุ่งราว 31% วันจันทร์จากการที่ Jensen Huang กลับมาเป็น CEO Micron ลดลงราว 11% และ CoreWeave ราว 12% Anthropic (ANT) ลดลง 6.5% ปิดที่ $81.91 ต่ำกว่าราคา IPO $83 ในวันซื้อขายที่ 4 ตามรายงานของ CNBC, Axios และ TechCrunch ผลตอบแทนบอนด์ 10 ปีแทบไม่เปลี่ยนที่ราว 4.91% ประธานเฟดนิวยอร์ก John Williams ระบุว่าเงินเฟ้อยังสูงเกินไปและนโยบายต้องปรับ`},
      sources:[{l:"Motley Fool — Stock Market Today, Nov. 24: Tech sell-off drags Nasdaq as Dow gains on value rotation",u:"https://www.fool.com/coverage/stock-market-today/2026/11/24/stock-market-today-nov-24-tech-sell-off-drags-nasdaq-as-dow-gains-on-value-rotation/"},{l:"Yahoo Finance — Stock market today: Dow rises, S&P 500 and Nasdaq decline as chip sector tumbles",u:"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-november-24-dow-sp-500-nasdaq-chip-stocks-nvidia-140629923.html"},{l:"BNN Bloomberg — Drops for Nvidia, Anthropic and other AI stocks drag the US market back down",u:"https://www.bnnbloomberg.ca/investing/market-outlook/2026/11/24/tech-stocks-wane-a-day-after-a-huang-rally-as-anthropic-tumbles-below-its-initial-offering-price/"},{l:"CNBC — Anthropic stock sinks below $83 IPO price",u:"https://www.cnbc.com/2026/11/24/anthropic-stock-ipo-price.html"},{l:"Axios — Anthropic shares fall again, closing under IPO price",u:"https://www.axios.com/2026/11/24/anthropic-stock-ipo-banks"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,017.81", chg:-1.26, series:[25337.27,25017.81],
      txt:{en:`<b>Germany's DAX fell 1.26% to 25,017.81 Tuesday,</b> giving back more than half of Monday's gain as tech weakness spread and the US readied new tariffs on EU goods.`, th:`<b>ดัชนี DAX เยอรมนีลดลง 1.26% สู่ 25,017.81 วันอังคาร</b> คืนกำไรกว่าครึ่งของวันจันทร์ เพราะหุ้นเทคอ่อนตัวและสหรัฐฯ เตรียมขึ้นภาษีสินค้ายุโรป`},
      why:{en:`Europe is now caught by two forces: the AI/chip wobble and reports that Washington will soon raise tariffs on the EU, China and 14 other economies after a Section 301 probe into excess industrial capacity. Oil rising again on Hormuz attacks also hurts Europe as an energy importer. The DAX is holding just above 25,000, about 7% below its 12 November record.`, th:`ยุโรปโดนสองแรงพร้อมกัน: ความผันผวนของหุ้น AI/ชิป และรายงานว่าสหรัฐฯ จะขึ้นภาษีสินค้ายุโรป จีน และอีก 14 ประเทศเร็ว ๆ นี้ หลังการสอบสวนตามมาตรา 301 เรื่องกำลังการผลิตล้นเกิน น้ำมันที่กลับขึ้นจากการโจมตีในฮอร์มุซก็กระทบยุโรปที่นำเข้าพลังงาน DAX ยังยืนเหนือ 25,000 ได้เล็กน้อย ต่ำกว่าสถิติเมื่อ 12 พ.ย. ราว 7%`},
      full:{en:`Germany's DAX closed down about 1.26% at 25,017.81 on Tuesday, November 24, leading European markets lower on tech weakness, according to market recaps (one source cites −1.14%, so treat the exact close as provisional). Elsewhere the CAC 40 fell about 0.1% and the FTSE 100 about 0.3%. AP and Bloomberg reported that the US is preparing targeted tariff increases on China, the EU and 14 other economies, which Bloomberg said would not exceed levels set in existing trade deals.`, th:`ดัชนี DAX เยอรมนีปิดลดลงราว 1.26% ที่ 25,017.81 วันอังคารที่ 24 พ.ย. นำตลาดยุโรปลดลงจากหุ้นเทคที่อ่อนตัว ตามรายงานสรุปตลาด (อีกแหล่งระบุ −1.14% จึงถือว่าราคาปิดยังเป็นตัวเลขเบื้องต้น) CAC 40 ลดลงราว 0.1% และ FTSE 100 ราว 0.3% AP และ Bloomberg รายงานว่าสหรัฐฯ เตรียมขึ้นภาษีแบบเจาะจงต่อจีน ยุโรป และอีก 14 ประเทศ โดย Bloomberg ระบุว่าจะไม่เกินระดับที่ตกลงไว้ในข้อตกลงการค้าเดิม`},
      sources:[{l:"CappNotes — Closing Look, Tuesday, November 24, 2026",u:"https://cappnotes.substack.com/p/closing-look-tuesday-november-24"},{l:"Bloomberg — Trump plans targeted tariffs that won't exceed US trade deal levels",u:"https://www.bloomberg.com/news/articles/2026-11-24/new-trump-tariffs-won-t-top-trade-deal-levels-will-be-targeted"},{l:"WTOP (AP) — US ready to slap tariffs on China, EU and others over subsidized production",u:"https://wtop.com/national/2026/11/trump-administration-preparing-new-tariffs-on-china-eu-others-to-replace-duties-supreme-court-blocked-ap-sources-say/"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"58,644.63", chg:3.91, series:[56436.65,58644.63],
      txt:{en:`<b>Japan reopened Tuesday and the Nikkei 225 jumped 3.91% to 58,644.63,</b> catching up with Monday's Nvidia-led rally; Tokyo Electron rose 10.5% and Advantest 14.1%. Seoul and Taipei also rallied strongly.`, th:`<b>ญี่ปุ่นกลับมาเปิดวันอังคาร Nikkei 225 พุ่ง 3.91% สู่ 58,644.63</b> ตามการขึ้นของ Nvidia วันจันทร์ Tokyo Electron ขึ้น 10.5% และ Advantest ขึ้น 14.1% ตลาดเกาหลีและไต้หวันก็ขึ้นแรงเช่นกัน`},
      why:{en:`Asia traded on Monday's US rally before Wall Street's chip sell-off on Tuesday, so it could give some of these gains back today. Japan's chip-equipment makers are the most sensitive to Nvidia's swings in both directions — good for upside, but a source of volatility while the AI trade is unsettled.`, th:`เอเชียซื้อขายตามการขึ้นของสหรัฐฯ วันจันทร์ ก่อนที่หุ้นชิปในวอลล์สตรีทจะถูกขายวันอังคาร จึงอาจคืนกำไรบางส่วนวันนี้ หุ้นอุปกรณ์ผลิตชิปของญี่ปุ่นอ่อนไหวต่อ Nvidia มากที่สุดทั้งขาขึ้นและขาลง — ดีตอนตลาดขึ้น แต่ผันผวนสูงในช่วงที่ธีม AI ยังไม่นิ่ง`},
      full:{en:`Tokyo reopened on Tuesday, November 24, after Monday's holiday, and the Nikkei 225 rose about 3.91% to 58,644.63 (AP cited 58,654.40; Trading Economics 58,778), led by chip-equipment makers: Tokyo Electron climbed 10.5% and Advantest surged 14.1%. Markets in Seoul and Taipei also posted large gains as Asia priced in Nvidia's reinstatement of Jensen Huang, according to AP and Armenpress.`, th:`ตลาดโตเกียวกลับมาเปิดวันอังคารที่ 24 พ.ย. หลังวันหยุดวันจันทร์ Nikkei 225 ขึ้นราว 3.91% สู่ 58,644.63 (AP ระบุ 58,654.40 Trading Economics ระบุ 58,778) นำโดยหุ้นอุปกรณ์ผลิตชิป: Tokyo Electron ขึ้น 10.5% และ Advantest ขึ้น 14.1% ตลาดเกาหลีและไต้หวันก็ขึ้นแรง เพราะเอเชียสะท้อนข่าวที่ Nvidia ให้ Jensen Huang กลับมาเป็น CEO ตามรายงานของ AP และ Armenpress`},
      sources:[{l:"WSLS (AP) — Asian stocks rally after Wall Street rebound as Jensen Huang returns as Nvidia's CEO",u:"https://www.wsls.com/business/2026/11/24/asian-stocks-rally-after-wall-street-rebound-as-jensen-huang-returns-as-nvidias-ceo/"},{l:"Armenpress — Asian stocks, 24-11-26",u:"https://armenpress.am/en/article/1266527"},{l:"Trading Economics — Japan stock market (Nikkei 225)",u:"https://tradingeconomics.com/japan/stock-market"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"22,219.65", chg:-0.73, series:[22383.74,22219.65],
      txt:{en:`<b>Hong Kong's Hang Seng fell 0.73% to 22,219.65 Tuesday,</b> a sixth straight loss, after the US blacklisted an Alibaba unit; the Shanghai Composite rose 0.27% to 3,548.37.`, th:`<b>ดัชนี Hang Seng ฮ่องกงลดลง 0.73% สู่ 22,219.65 วันอังคาร</b> ลดลงวันที่ 6 ติด หลังสหรัฐฯ ขึ้นบัญชีดำบริษัทในเครือ Alibaba ส่วน Shanghai Composite ขึ้น 0.27% สู่ 3,548.37`},
      why:{en:`Hong Kong missed the Asian chip rally because the US–China tech fight hit home: Commerce added Alibaba's Singapore unit Apex and six Megaspeed affiliates to its Entity List over chip-diversion risk, and Washington is also readying new tariffs on China. Alibaba called the listing erroneous. Until US policy settles, Chinese tech will likely lag the rest of Asia.`, th:`ฮ่องกงพลาดการขึ้นของหุ้นชิปเอเชีย เพราะความขัดแย้งด้านเทคโนโลยีสหรัฐฯ–จีนกระทบโดยตรง: กระทรวงพาณิชย์สหรัฐฯ ขึ้นบัญชีดำ Apex บริษัทในเครือ Alibaba ที่สิงคโปร์ และบริษัทเครือ Megaspeed อีก 6 แห่ง ด้วยเหตุผลเรื่องเสี่ยงส่งต่อชิป และยังเตรียมขึ้นภาษีสินค้าจีน Alibaba ระบุว่าการขึ้นบัญชีไม่ถูกต้อง จนกว่านโยบายสหรัฐฯ จะชัดเจน หุ้นเทคจีนมีแนวโน้มตามหลังเอเชียส่วนอื่น`},
      full:{en:`Hong Kong's Hang Seng Index closed at 22,219.65 on Tuesday, November 24, down about 164 points (−0.73%), after opening higher, its sixth consecutive decline. The US Commerce Department added Apex Enterprise Solutions, a Singapore unit of Alibaba, and six Megaspeed affiliates to its Entity List, citing chip-diversion concerns; Alibaba said the listing was erroneous. The Shanghai Composite rose about 0.27% to 3,548.37 (AP cited 3,563.58, possibly an earlier reading).`, th:`ดัชนี Hang Seng ฮ่องกงปิดที่ 22,219.65 วันอังคารที่ 24 พ.ย. ลดลงราว 164 จุด (−0.73%) หลังเปิดบวก ลดลงวันที่ 6 ติด กระทรวงพาณิชย์สหรัฐฯ ขึ้นบัญชี Entity List ต่อ Apex Enterprise Solutions บริษัทในเครือ Alibaba ที่สิงคโปร์ และบริษัทเครือ Megaspeed อีก 6 แห่ง ด้วยความกังวลเรื่องการส่งต่อชิป Alibaba ระบุว่าการขึ้นบัญชีไม่ถูกต้อง Shanghai Composite ขึ้นราว 0.27% สู่ 3,548.37 (AP ระบุ 3,563.58 ซึ่งอาจเป็นค่าระหว่างวัน)`},
      sources:[{l:"BBN Times — Hang Seng falls 0.73% to 22,219.65 after US blacklists Alibaba unit",u:"https://www.bbntimes.com/companies/hong-kong-stock-exchange-today-hang-seng-falls-0-73-to-22-219-65-after-us-blacklists-alibaba-unit"},{l:"Taipei Times — US blacklists Alibaba subsidiary and Megaspeed",u:"https://www.taipeitimes.com/News/biz/archives/2026/11/25/2003868323"},{l:"Armstrong Economics — Market Talk, November 24, 2026",u:"https://www.armstrongeconomics.com/market-talk/market-talk-november-24-2026/"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,451.65", chg:-0.20, series:[1454.49,1451.65],
      txt:{en:`<b>SET Index slipped 2.84 pts (−0.20%) to 1,451.65 Tuesday</b> on turnover of about THB 71.2bn; it rose early on the Nvidia news but faded in the afternoon, and foreigners sold about THB 5.3bn.`, th:`<b>ดัชนี SET ลดลง 2.84 จุด (−0.20%) สู่ 1,451.65 วันอังคาร</b> มูลค่าซื้อขายราว 71,160 ล้านบาท ช่วงเช้าขึ้นตามข่าว Nvidia แต่ช่วงบ่ายอ่อนตัว และต่างชาติขายสุทธิราว 5,270 ล้านบาท`},
      why:{en:`Thailand gave up an early electronics-led gain as uncertainty over US AI-chip rules (including the pending licence rule for ASEAN data centres) weighed, and lower oil earlier in the day pressured PTTEP. Heavy foreign selling returned after Monday's brief buying. The index is still holding its 1,445–1,455 support zone; brokers see resistance at 1,460–1,466.`, th:`ไทยเสียกำไรช่วงเช้าที่นำโดยหุ้นอิเล็กทรอนิกส์ เพราะความไม่แน่นอนเรื่องกฎชิป AI ของสหรัฐฯ (รวมถึงกฎใบอนุญาตสำหรับศูนย์ข้อมูลในอาเซียนที่ยังรออยู่) และราคาน้ำมันที่ต่ำลงช่วงกลางวันกดดัน PTTEP ต่างชาติกลับมาขายหนักหลังซื้อเพียงวันเดียววันจันทร์ ดัชนียังยืนแนวรับ 1,445–1,455 ได้ โบรกเกอร์มองแนวต้านที่ 1,460–1,466`},
      full:{en:`Thailand's SET Index fell 2.84 points (−0.20%) to close at 1,451.65 on Tuesday, November 24, with trading value of about THB 71.16 billion, according to Kaohoon International. The index surged early on news of Jensen Huang's return as Nvidia's CEO but faced selling in the afternoon on uncertainty over US AI regulations, while lower oil prices pressured PTTEP. Foreign investors were net sellers of about THB 5,270 million. For the next session, Kaohoon expects buying may return to electronics shares, with resistance at 1,460–1,466 points.`, th:`ดัชนี SET ลดลง 2.84 จุด (−0.20%) ปิดที่ 1,451.65 วันอังคารที่ 24 พ.ย. มูลค่าซื้อขายราว 71,160 ล้านบาท ตามรายงานของข่าวหุ้น (Kaohoon International) ดัชนีพุ่งช่วงเช้าจากข่าว Jensen Huang กลับมาเป็น CEO ของ Nvidia แต่ถูกขายช่วงบ่ายจากความไม่แน่นอนเรื่องกฎ AI ของสหรัฐฯ และราคาน้ำมันที่ต่ำลงกดดัน PTTEP นักลงทุนต่างชาติขายสุทธิราว 5,270 ล้านบาท สำหรับวันถัดไป ข่าวหุ้นคาดว่าแรงซื้ออาจกลับมาที่หุ้นอิเล็กทรอนิกส์ แนวต้าน 1,460–1,466 จุด`},
      sources:[{l:"Kaohoon International — Market Roundup 24 November 2026",u:"https://www.kaohooninternational.com/markets/595402"},{l:"Kaohoon International — Total trading value by investor type, 24 November 2026",u:"https://www.kaohooninternational.com/markets/595412"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold fell about 2.3% Tuesday to roughly $3,550/oz,</b> back near its 12-month low, as Fed hike bets firmed. <b>Oil rebounded: WTI settled at $82.05 (+2.35%) and Brent at $91.40 (+2.3%)</b> after several tankers hit mines and were attacked around the Strait of Hormuz, where traffic is down about 40%.`, th:`<b>ทองคำลดลงราว 2.3% วันอังคาร สู่ราว $3,550 ต่อออนซ์</b> กลับไปใกล้จุดต่ำสุดในรอบ 12 เดือน เพราะตลาดมั่นใจขึ้นว่าเฟดจะขึ้นดอกเบี้ย <b>น้ำมันดีดกลับ: WTI ปิดที่ $82.05 (+2.35%) และ Brent ที่ $91.40 (+2.3%)</b> หลังเรือบรรทุกน้ำมันหลายลำโดนทุ่นระเบิดและถูกโจมตีแถวช่องแคบฮอร์มุซ ซึ่งการเดินเรือลดลงราว 40%`},
     why:{en:`Gold is being squeezed by rising real rates: when the Fed is about to hike, a metal that pays no interest struggles — keep it as a small hedge, not a growing bet. Oil is caught between expected surplus supply and real Hormuz disruption; another spike would hurt Thailand's import bill and keep inflation sticky.`, th:`ทองคำถูกกดดันจากดอกเบี้ยแท้จริงที่สูงขึ้น: เมื่อเฟดกำลังจะขึ้นดอกเบี้ย สินทรัพย์ที่ไม่ให้ดอกเบี้ยอย่างทองคำจะไปได้ยาก — ถือสัดส่วนเล็กเพื่อป้องกันความเสี่ยง ไม่ใช่เพิ่มเดิมพัน น้ำมันถูกดึงสองทางระหว่างอุปทานที่คาดว่าจะล้นตลาด กับการหยุดชะงักจริงในฮอร์มุซ หากพุ่งอีกครั้งจะกระทบค่านำเข้าของไทยและทำให้เงินเฟ้อลดลงช้า`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Treasuries were little changed Tuesday: the 2-year yield ~4.67%, the 10-year ~4.91% and the 30-year ~5.29%.</b> NY Fed President Williams said inflation is still too high and policy will need to adjust; futures price a ~95% chance of a quarter-point hike on 9 December (CME FedWatch).`, th:`<b>บอนด์สหรัฐฯ แทบไม่เปลี่ยนวันอังคาร: ผลตอบแทน 2 ปีราว 4.67% 10 ปีราว 4.91% และ 30 ปีราว 5.29%</b> Williams ประธานเฟดนิวยอร์กระบุว่าเงินเฟ้อยังสูงเกินไปและนโยบายต้องปรับ ตลาดให้โอกาสราว 95% ที่เฟดจะขึ้นดอกเบี้ย 0.25% วันที่ 9 ธ.ค. (CME FedWatch)`},
     why:{en:`Bonds held steady while stocks swung, which is exactly the cushioning role they play in a portfolio. A December hike is almost fully priced, so the bigger risk is a hot PCE today that hints at more hikes in 2027. Yields near 4.7% (2-year) and 4.9% (10-year) still lock in attractive income.`, th:`บอนด์ทรงตัวขณะที่หุ้นแกว่ง ซึ่งคือบทบาทช่วยรองรับแรงกระแทกในพอร์ต การขึ้นดอกเบี้ยเดือนธันวาคมสะท้อนในราคาเกือบหมดแล้ว ความเสี่ยงที่ใหญ่กว่าคือ PCE วันนี้ที่สูงเกินคาดจนส่งสัญญาณขึ้นดอกเบี้ยเพิ่มในปี 2027 ผลตอบแทนราว 4.7% (2 ปี) และ 4.9% (10 ปี) ยังให้รายได้ที่น่าสนใจ`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
