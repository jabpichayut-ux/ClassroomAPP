<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Black Friday Rally Caps a Big Week: S&P 500 +1.60%, Nasdaq +2.31%, Dow Best Week Since 2022 — Shanghai +3.73%, SET +1.83%", th:"แรงซื้อวัน Black Friday ปิดสัปดาห์แรง: S&P 500 +1.60% Nasdaq +2.31% Dow ดีที่สุดในรอบสัปดาห์ตั้งแต่ปี 2022 — เซี่ยงไฮ้ +3.73% SET +1.83%"},
    heroDeck:{en:`Wall Street reopened after Thanksgiving with a strong half-day rally on Friday, 27 November. The S&P 500 rose 1.60% to 7,297.49, the Nasdaq Composite 2.31% to 24,129.50 and the Dow 591.99 points (+1.18%) to 50,774.94, capping its best week since October 2022. Chips led (the semiconductor index +4.69%); Anthropic jumped ~11% back above its $83 IPO price, but Nvidia lagged at +0.8% ($150.49) on its Southeast Asia server halt. November is still a losing month (S&P 500 −3.7%, Nasdaq −5.1%). Treasury yields rose: the 2-year ~4.70%, 10-year ~4.91–4.93% and 30-year ~5.32%, as markets look to the 4 Dec jobs report and a 9 Dec Fed hike. Asia rallied hard: the Nikkei +2.11% to 58,711.11, the Hang Seng ~+2.1% to 22,694.77 (Hang Seng Tech +6.45%), and Shanghai +3.73% to 3,606.49 after Beijing signalled more market support. Germany's DAX added 0.90% to 25,441.24. Thailand's SET bounced 25.85 points (+1.83%) to 1,440.29 as foreign selling dried up. Gold rose ~2% to ~$3,640–3,660; Brent fell 1.2% to $95.44 and WTI 0.7% to $83.08 ahead of Sunday's OPEC+ meeting.`, th:`วอลล์สตรีทกลับมาเปิดหลัง Thanksgiving พร้อมแรงซื้อครึ่งวันที่แข็งแกร่งในวันศุกร์ที่ 27 พ.ย. S&P 500 ขึ้น 1.60% สู่ 7,297.49 Nasdaq ขึ้น 2.31% สู่ 24,129.50 และ Dow ขึ้น 591.99 จุด (+1.18%) สู่ 50,774.94 ปิดสัปดาห์ที่ดีที่สุดตั้งแต่ตุลาคม 2022 หุ้นชิปนำ (ดัชนีเซมิคอนดักเตอร์ +4.69%) Anthropic พุ่งราว 11% กลับเหนือราคา IPO $83 แต่ Nvidia ขึ้นเพียง 0.8% ($150.49) จากข่าวหยุดส่งเซิร์ฟเวอร์ไปอาเซียน เดือนพฤศจิกายนยังเป็นเดือนขาดทุน (S&P 500 −3.7% Nasdaq −5.1%) ผลตอบแทนบอนด์สหรัฐฯ ขึ้น: 2 ปีราว 4.70% 10 ปีราว 4.91–4.93% และ 30 ปีราว 5.32% ตลาดรอตัวเลขจ้างงาน 4 ธ.ค. และการขึ้นดอกเบี้ยของเฟด 9 ธ.ค. เอเชียพุ่งแรง: Nikkei +2.11% สู่ 58,711.11 Hang Seng ราว +2.1% สู่ 22,694.77 (Hang Seng Tech +6.45%) และเซี่ยงไฮ้ +3.73% สู่ 3,606.49 หลังปักกิ่งส่งสัญญาณพยุงตลาดเพิ่ม DAX เยอรมนีขึ้น 0.90% สู่ 25,441.24 SET ไทยดีดกลับ 25.85 จุด (+1.83%) สู่ 1,440.29 เพราะแรงขายต่างชาติเบาลงมาก ทองคำขึ้นราว 2% สู่ราว $3,640–3,660 Brent ลดลง 1.2% สู่ $95.44 และ WTI ลดลง 0.7% สู่ $83.08 ก่อนการประชุม OPEC+ วันอาทิตย์`},

    dbNext:{en:"Next", th:"ถัดไป"}, dbNextVal:{en:"OPEC+ meets Sun 29 Nov (expected to hold Q1 2027 output). Then the US November jobs report on Fri 4 Dec, the Fed decision on 9 Dec (a hike is near-fully priced) and November CPI on 10 Dec. In Thailand, watch whether foreign selling keeps easing and whether Nvidia resumes ASEAN server shipments.", th:"OPEC+ ประชุมวันอาทิตย์ที่ 29 พ.ย. (คาดคงการผลิตไตรมาส 1 ปี 2027) จากนั้นตัวเลขจ้างงานสหรัฐฯ เดือนพฤศจิกายนวันศุกร์ที่ 4 ธ.ค. การตัดสินใจของเฟดวันที่ 9 ธ.ค. (ตลาดสะท้อนการขึ้นดอกเบี้ยเกือบเต็ม) และ CPI เดือนพฤศจิกายนวันที่ 10 ธ.ค. ในไทย จับตาว่าแรงขายต่างชาติจะเบาลงต่อหรือไม่ และ Nvidia จะกลับมาส่งเซิร์ฟเวอร์ไปอาเซียนหรือไม่"},

    leadtxt:{en:`<b>The week ended with a broad, global relief rally.</b> In Friday's half-day US session the <b>S&P 500 rose +1.60% to 7,297.49</b>, the <b>Nasdaq +2.31% to 24,129.50</b> and the <b>Dow +1.18% to 50,774.94</b> — the Dow's <b>best week since October 2022</b>. <b>Chips led (+4.69%)</b> and <b>Anthropic reclaimed its $83 IPO price (+~11%)</b>, while <b>Nvidia lagged (+0.8%)</b> on its ASEAN server halt. Asia joined in: <b>Nikkei +2.11% to 58,711.11</b>, <b>Hang Seng ~+2.1% to 22,694.77</b>, <b>Shanghai +3.73% to 3,606.49</b> on Beijing support signals; the <b>DAX +0.90% to 25,441.24</b>; and the <b>SET +1.83% to 1,440.29</b> as foreign selling nearly stopped. But <b>yields rose (10-year ~4.91–4.93%, 2-year ~4.70%)</b> and a <b>9 December Fed hike is still near-fully priced</b>; November remains a down month. <b>Gold ~$3,640–3,660 (+~2%)</b>, <b>Brent $95.44</b>. <b>For you:</b> enjoy the bounce but don't chase it — keep quality bond income as the core (higher yields mean better entry income), add to tech in small steps, and treat Thai equities as a trading bounce until the jobs data and the Fed are out of the way.`, th:`<b>สัปดาห์นี้ปิดด้วยแรงซื้อฟื้นตัวทั่วโลก</b> ในการซื้อขายครึ่งวันของสหรัฐฯ วันศุกร์ <b>S&P 500 ขึ้น +1.60% สู่ 7,297.49</b> <b>Nasdaq +2.31% สู่ 24,129.50</b> และ <b>Dow +1.18% สู่ 50,774.94</b> — Dow ทำ <b>สัปดาห์ที่ดีที่สุดตั้งแต่ตุลาคม 2022</b> <b>หุ้นชิปนำ (+4.69%)</b> และ <b>Anthropic กลับเหนือราคา IPO $83 (+ราว 11%)</b> ขณะที่ <b>Nvidia ขึ้นน้อย (+0.8%)</b> จากข่าวหยุดส่งเซิร์ฟเวอร์ไปอาเซียน เอเชียขึ้นตาม: <b>Nikkei +2.11% สู่ 58,711.11</b> <b>Hang Seng ราว +2.1% สู่ 22,694.77</b> <b>เซี่ยงไฮ้ +3.73% สู่ 3,606.49</b> จากสัญญาณพยุงตลาดของปักกิ่ง <b>DAX +0.90% สู่ 25,441.24</b> และ <b>SET +1.83% สู่ 1,440.29</b> เพราะแรงขายต่างชาติแทบหยุด แต่ <b>ผลตอบแทนบอนด์ขึ้น (10 ปีราว 4.91–4.93% 2 ปีราว 4.70%)</b> และ <b>ตลาดยังสะท้อนการขึ้นดอกเบี้ยของเฟดวันที่ 9 ธ.ค. เกือบเต็ม</b> เดือนพฤศจิกายนยังเป็นเดือนขาลง <b>ทองคำราว $3,640–3,660 (+ราว 2%)</b> <b>Brent $95.44</b> <b>สำหรับคุณ:</b> ยินดีกับการดีดกลับแต่อย่าไล่ราคา — ให้รายได้จากบอนด์คุณภาพเป็นแกนหลัก (ผลตอบแทนที่สูงขึ้นคือจุดเข้าที่ได้รายได้ดีขึ้น) ทยอยเพิ่มหุ้นเทคทีละน้อย และมองหุ้นไทยเป็นการดีดกลับระยะสั้นจนกว่าตัวเลขจ้างงานและเฟดจะผ่านไป`},

    watchnote:{en:`A strong finish to a wild week: US stocks rallied in Friday's half-day session, the Dow logged its best week since 2022, and Asia, Europe and Thailand all rose. Yet the S&P 500 is still down about 3.7% for November and yields moved higher. The three things that matter most next: OPEC+ on 29 November for oil, the November jobs report on 4 December, and the 9 December Fed decision, where a hike is near-fully priced.`,
      th:`สัปดาห์ที่ผันผวนปิดอย่างแข็งแกร่ง: หุ้นสหรัฐฯ ขึ้นแรงในการซื้อขายครึ่งวันวันศุกร์ Dow ทำสัปดาห์ที่ดีที่สุดตั้งแต่ปี 2022 และเอเชีย ยุโรป และไทยขึ้นทั้งหมด แต่ S&P 500 ยังลดลงราว 3.7% ในเดือนพฤศจิกายน และผลตอบแทนบอนด์ขยับขึ้น สามเรื่องที่สำคัญที่สุดถัดไป: OPEC+ วันที่ 29 พ.ย. ต่อราคาน้ำมัน ตัวเลขจ้างงานเดือนพฤศจิกายนวันที่ 4 ธ.ค. และการตัดสินใจของเฟดวันที่ 9 ธ.ค. ที่ตลาดสะท้อนการขึ้นดอกเบี้ยเกือบเต็ม`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ วันศุกร์ที่ 27 พ.ย. (หุ้นสหรัฐฯ ปิดเร็วเวลา 13.00 น. และบอนด์ 14.00 น. เวลาสหรัฐฯ) ผลตอบแทนบอนด์สหรัฐฯ ทองคำ และน้ำมันเป็นค่าประมาณ (แต่ละแหล่งต่างกันตามเวลาและสัญญา) และข่าวบริษัทเป็นไปตามที่สื่อรายงาน ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>In Friday's half-day session the S&P 500 rose 1.60% to 7,297.49, the Nasdaq 2.31% to 24,129.50 and the Dow 591.99 points (+1.18%) to 50,774.94</b> — the Dow's best week since October 2022.`, th:`<b>ในการซื้อขายครึ่งวันวันศุกร์ S&P 500 ขึ้น 1.60% สู่ 7,297.49 Nasdaq ขึ้น 2.31% สู่ 24,129.50 และ Dow ขึ้น 591.99 จุด (+1.18%) สู่ 50,774.94</b> — Dow ทำสัปดาห์ที่ดีที่สุดตั้งแต่ตุลาคม 2022`},
      why:{en:`Wall Street caught up with Thursday's global rebound and the tariff relief, and buyers returned to beaten-down AI and chip stocks (64 of 65 AI names rose). Nvidia lagged because of its Southeast Asia server halt, so the rally was about breadth, not one leader. It came on thin holiday volume, November is still down 3.7%, and yields rose — so the next real test is the 4 December jobs report and the 9 December Fed decision.`, th:`วอลล์สตรีทไล่ตามการดีดกลับทั่วโลกเมื่อวันพฤหัสฯ และความกังวลเรื่องภาษีที่ผ่อนลง แรงซื้อกลับเข้าหุ้น AI และชิปที่ลงมาแรง (หุ้น AI 64 จาก 65 ตัวปิดบวก) Nvidia ขึ้นน้อยจากข่าวหยุดส่งเซิร์ฟเวอร์ไปอาเซียน การขึ้นครั้งนี้จึงกระจายตัว ไม่ได้พึ่งผู้นำตัวเดียว แต่เกิดในวันที่ปริมาณซื้อขายบางเบา เดือนพฤศจิกายนยังลดลง 3.7% และผลตอบแทนบอนด์ขึ้น — บททดสอบจริงถัดไปคือตัวเลขจ้างงานวันที่ 4 ธ.ค. และการตัดสินใจของเฟดวันที่ 9 ธ.ค.`},
      full:{en:`US stocks closed higher on Friday, November 27, in a session shortened for Black Friday (stocks closed at 1 p.m. ET, bonds at 2 p.m.). The S&P 500 rose 1.60% to 7,297.49, the Nasdaq Composite rose about 2.31% to 24,129.50 and the Dow Jones Industrial Average gained 591.99 points (+1.18%) to 50,774.94, its strongest week since October 2022, with the Dow and S&P 500 both up more than 5% for the week. The semiconductor index rose 4.69% and SanDisk about 16%; Amazon rose about 4%, Meta and Broadcom more than 3%, and Anthropic jumped nearly 11% to reclaim its $83 IPO price. Nvidia rose only about 0.8% to $150.49, weighed by a Financial Times report that it has stopped shipping AI servers to Southeast Asia. For November, the S&P 500 is still down 3.7%, the Nasdaq 5.1% and the Dow 1.9%. The November jobs report is due December 4, the Fed decision December 9 and November CPI December 10.`, th:`หุ้นสหรัฐฯ ปิดบวกวันศุกร์ที่ 27 พ.ย. ในการซื้อขายที่ย่นเวลาสำหรับ Black Friday (หุ้นปิด 13.00 น. บอนด์ปิด 14.00 น. เวลาสหรัฐฯ) S&P 500 ขึ้น 1.60% สู่ 7,297.49 Nasdaq ขึ้นราว 2.31% สู่ 24,129.50 และ Dow Jones ขึ้น 591.99 จุด (+1.18%) สู่ 50,774.94 ทำสัปดาห์ที่ดีที่สุดตั้งแต่ตุลาคม 2022 โดย Dow และ S&P 500 ขึ้นกว่า 5% ในสัปดาห์นี้ ดัชนีเซมิคอนดักเตอร์ขึ้น 4.69% และ SanDisk ราว 16% Amazon ขึ้นราว 4% Meta และ Broadcom ขึ้นกว่า 3% และ Anthropic พุ่งเกือบ 11% กลับเหนือราคา IPO $83 Nvidia ขึ้นเพียงราว 0.8% สู่ $150.49 ถูกกดดันจากรายงานของ Financial Times ว่าหยุดส่งเซิร์ฟเวอร์ AI ไปเอเชียตะวันออกเฉียงใต้ ในเดือนพฤศจิกายน S&P 500 ยังลดลง 3.7% Nasdaq 5.1% และ Dow 1.9% ตัวเลขจ้างงานเดือนพฤศจิกายนออกวันที่ 4 ธ.ค. เฟดตัดสินใจวันที่ 9 ธ.ค. และ CPI เดือนพฤศจิกายนวันที่ 10 ธ.ค.`},
      sources:[{l:"Motley Fool — Stock Market Today, Nov. 27: Anthropic jumps 11%, reclaiming its $83 IPO price as Wall Street rallies",u:"https://fool.com/coverage/stock-market-today/2026/11/27/stock-market-today-nov-27-anthropic-jumps-11-reclaiming-its-usd83-ipo-price-as-wall-street-rallies"},{l:"Yahoo Finance — Dow, S&P 500, Nasdaq end holiday week with gains as AI stocks rebound",u:"https://finance.yahoo.com/markets/live/stock-market-today-firday-november-27-dow-sp-500-nasdaq-black-friday-holiday-091152065.html"},{l:"Just the News — Dow rose by nearly 600 points Friday, having its best week since 2022",u:"https://justthenews.com/nation/economy/dow-rose-nearly-600-points-having-its-best-week-2022"},{l:"Rolling Out — Dow surges as Nvidia and AI stocks lead the comeback",u:"https://rollingout.com/2026/11/27/dow-surges-as-nvidia-and-ai-stocks/"},{l:"Yahoo Finance — Chip stocks lead a Black Friday rally, but Nvidia misses out",u:"https://finance.yahoo.com/markets/article/chip-stocks-lead-a-black-friday-rally-but-nvidia-misses-out-alphacheck-145727185.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,441.24", chg:0.90, series:[25215.52,25441.24],
      txt:{en:`<b>Germany's DAX added 225.72 points (+0.90%) to 25,441.24 Friday,</b> extending Thursday's rebound for a weekly gain of about 2.6%, led by tech, autos and defence.`, th:`<b>DAX เยอรมนีขึ้น 225.72 จุด (+0.90%) สู่ 25,441.24 วันศุกร์</b> ต่อจากการดีดกลับวันพฤหัสฯ ทั้งสัปดาห์ขึ้นราว 2.6% นำโดยหุ้นเทค รถยนต์ และกลาโหม`},
      why:{en:`Europe kept building on the tariff relief (USTR's cap at existing deal rates protects EU carmakers) and on stronger US tech futures. Rheinmetall led (+3.3%) even after trimming its targets, while Commerzbank lagged. The DAX is still roughly 5–6% below its mid-November record, so this is a recovery, not yet a new uptrend.`, th:`ยุโรปยังได้แรงหนุนจากความกังวลเรื่องภาษีที่ผ่อนลง (การจำกัดไว้ที่อัตราในข้อตกลงเดิมช่วยผู้ผลิตรถยุโรป) และ futures หุ้นเทคสหรัฐฯ ที่แข็งแรง Rheinmetall นำ (+3.3%) แม้ลดเป้าหมาย ขณะที่ Commerzbank อ่อนตัว DAX ยังต่ำกว่าสถิติกลางเดือนพฤศจิกายนราว 5–6% จึงเป็นการฟื้นตัว ยังไม่ใช่ขาขึ้นรอบใหม่`},
      full:{en:`Germany's DAX closed Xetra trading on Friday, November 27, at 25,441.24, up 225.72 points (+0.90%) from Thursday's 25,215.52, according to ad-hoc-news and aktiencheck.de. The index gained about 2.6% for the week. Technology, auto and defence stocks drove the gains; Rheinmetall was the top DAX performer (+3.32%) and Commerzbank the weakest (−1.89%).`, th:`DAX เยอรมนีปิดการซื้อขาย Xetra วันศุกร์ที่ 27 พ.ย. ที่ 25,441.24 ขึ้น 225.72 จุด (+0.90%) จาก 25,215.52 เมื่อวันพฤหัสฯ ตามรายงานของ ad-hoc-news และ aktiencheck.de ทั้งสัปดาห์ขึ้นราว 2.6% หุ้นเทค รถยนต์ และกลาโหมนำการขึ้น Rheinmetall ขึ้นมากสุดใน DAX (+3.32%) และ Commerzbank อ่อนสุด (−1.89%)`},
      sources:[{l:"ad-hoc-news — DAX closes 0.90% higher as tech rebound extends",u:"https://www.ad-hoc-news.de/boerse/news/marktberichte/dax-closes-0-90-prozent-higher-as-tech-rebound-extends/70562869"},{l:"aktiencheck.de — DAX-Analyse: Rheinmetall kappt die Ziele und führt die Rally an",u:"https://aktiencheck.de/artikel/dax-analyse-rheinmetall-kappt-ziele-und-fuehrt-rally-an-commerzbank-faellt"},{l:"MarketScreener — Aktien Frankfurt: Erholung hält an",u:"https://de.marketscreener.com/boerse-nachrichten/aktien-frankfurt-erholung-haelt-an-nasdaq-100-stark-erwartet-ce7851d9dc8af522"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"58,711.11", chg:2.11, series:[57499.16,58711.11],
      txt:{en:`<b>The Nikkei 225 jumped 1,211.95 points (+2.11%) to 58,711.11 Friday,</b> led by Advantest, Tokyo Electron and SoftBank; the Topix rose 1.73% and Korea's Kospi surged 4.34% to 4,915.68.`, th:`<b>Nikkei 225 พุ่ง 1,211.95 จุด (+2.11%) สู่ 58,711.11 วันศุกร์</b> นำโดย Advantest Tokyo Electron และ SoftBank Topix ขึ้น 1.73% และ Kospi เกาหลีพุ่ง 4.34% สู่ 4,915.68`},
      why:{en:`Asia's chip-heavy markets were hit hardest in the AI sell-off, so they bounced hardest once the panic eased. Japan has an extra twist: hotter Tokyo inflation is raising bets on a Bank of Japan hike, which could firm the yen. Korea's 4%+ jump shows how swingy the AI trade still is in both directions.`, th:`ตลาดเอเชียที่มีหุ้นชิปมากโดนแรงขายหุ้น AI หนักที่สุด จึงดีดกลับแรงที่สุดเมื่อความตื่นตระหนกคลายลง ญี่ปุ่นมีปัจจัยเพิ่ม: เงินเฟ้อโตเกียวที่สูงขึ้นทำให้ตลาดคาดว่า BOJ จะขึ้นดอกเบี้ย ซึ่งอาจทำให้เงินเยนแข็งขึ้น การพุ่งกว่า 4% ของเกาหลีแสดงว่าธีม AI ยังผันผวนแรงทั้งสองทาง`},
      full:{en:`Japan's Nikkei 225 closed at 58,711.11 on Friday, November 27, up 2.11% (1,211.95 points) from Thursday's 57,499.16, according to Investing.com and ad-hoc-news. Investors returned to AI and semiconductor shares; Advantest was the biggest positive contributor, followed by Tokyo Electron and SoftBank Group. 160 Nikkei constituents rose and 64 fell. The Topix rose 1.73% to 3,815.20. Rising Tokyo inflation reinforced expectations of a possible Bank of Japan rate hike. South Korea's Kospi gained 4.34% to 4,915.68 and the Kosdaq 8.13%.`, th:`Nikkei 225 ญี่ปุ่นปิดที่ 58,711.11 วันศุกร์ที่ 27 พ.ย. ขึ้น 2.11% (1,211.95 จุด) จาก 57,499.16 เมื่อวันพฤหัสฯ ตามรายงานของ Investing.com และ ad-hoc-news นักลงทุนกลับเข้าหุ้น AI และเซมิคอนดักเตอร์ Advantest หนุนดัชนีมากที่สุด ตามด้วย Tokyo Electron และ SoftBank Group หุ้นขึ้น 160 ตัว ลง 64 ตัว Topix ขึ้น 1.73% สู่ 3,815.20 เงินเฟ้อโตเกียวที่สูงขึ้นหนุนความคาดหวังว่า BOJ อาจขึ้นดอกเบี้ย Kospi เกาหลีใต้ขึ้น 4.34% สู่ 4,915.68 และ Kosdaq ขึ้น 8.13%`},
      sources:[{l:"Investing.com — Japan stocks higher at close of trade; Nikkei 225 up 2.11%",u:"https://www.investing.com/news/stock-market-news/japan-stocks-higher-at-close-of-trade-nikkei-225-up-211-5053031"},{l:"ad-hoc-news — Nikkei 225 closes 2.11% higher at 58,711.11 on AI rebound",u:"https://www.ad-hoc-news.de/boerse/news/marktberichte/nikkei-225-closes-2-11-prozent-higher-at-58-711-11-on-ai-rebound/70562186"},{l:"Al Jazeera — Asian stock markets rise after earlier tech rout",u:"https://aljazeera.com/economy/2026/11/27/asian-stock-markets-rise-after-earlier-tech-rout"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"22,694.77", chg:2.11, series:[22226.88,22694.77],
      txt:{en:`<b>Hong Kong's Hang Seng rose about 468 points (~+2.1%) to 22,694.77 Friday, with the Hang Seng Tech index +6.45%,</b> while the Shanghai Composite jumped 3.73% to 3,606.49, back above 3,600.`, th:`<b>Hang Seng ฮ่องกงขึ้นราว 468 จุด (ราว +2.1%) สู่ 22,694.77 วันศุกร์ โดย Hang Seng Tech +6.45%</b> ส่วน Shanghai Composite พุ่ง 3.73% สู่ 3,606.49 กลับเหนือ 3,600`},
      why:{en:`Beijing stepped in: after a State Council meeting, Central Huijin was reported to be strengthening its role as a market stabilisation fund, alongside curbs on share sales by major holders. Chinese chipmakers led (SMIC +16.4%, Hua Hong +20.7%) on the self-sufficiency theme. Policy support helps, but the proposed 20% US overcapacity tariff is still unresolved.`, th:`ปักกิ่งเข้าพยุง: หลังการประชุมคณะรัฐมนตรี มีรายงานว่า Central Huijin จะเพิ่มบทบาทเป็นกองทุนรักษาเสถียรภาพตลาด พร้อมมาตรการจำกัดการขายหุ้นของผู้ถือหุ้นใหญ่ หุ้นชิปจีนนำ (SMIC +16.4% Hua Hong +20.7%) จากธีมพึ่งพาตนเอง นโยบายช่วยได้ แต่ภาษีกำลังการผลิตล้นเกิน 20% ที่สหรัฐฯ เสนอยังไม่คลี่คลาย`},
      full:{en:`Hong Kong's Hang Seng Index closed up about 467 points (~2.1%) at 22,694.77 on Friday, November 27, back above 22,500, while the Hang Seng Tech Index jumped 6.45% to 3,637, according to The Standard and Longbridge. Chipmakers SMIC and Hua Hong Semiconductor surged 16.4% and 20.7%. The Shanghai Composite closed up 3.73% at 3,606.49, reclaiming 3,600, after a State Council meeting and reports that Central Huijin is strengthening its stabilisation-fund role and encouraging long-term capital, alongside curbs on share reductions.`, th:`ดัชนี Hang Seng ฮ่องกงปิดขึ้นราว 467 จุด (ราว 2.1%) ที่ 22,694.77 วันศุกร์ที่ 27 พ.ย. กลับเหนือ 22,500 ส่วน Hang Seng Tech พุ่ง 6.45% สู่ 3,637 ตามรายงานของ The Standard และ Longbridge หุ้นชิป SMIC และ Hua Hong พุ่ง 16.4% และ 20.7% Shanghai Composite ปิดขึ้น 3.73% ที่ 3,606.49 กลับเหนือ 3,600 หลังการประชุมคณะรัฐมนตรีและรายงานว่า Central Huijin จะเพิ่มบทบาทกองทุนรักษาเสถียรภาพและส่งเสริมเงินทุนระยะยาว พร้อมมาตรการจำกัดการลดสัดส่วนถือหุ้น`},
      sources:[{l:"The Standard — Hang Seng Index jumps over 450 points, SMIC up 16pc",u:"https://www.thestandard.com.hk/finance/article/349844/Hang-Seng-Index-jumps-over-450-points-SMIC-up-16pc"},{l:"OKX Insight — A shares closed: Shanghai Composite 3,606.49 (+3.73%)",u:"https://www.okx.com/en-us/orbit/insight/93900702970720"},{l:"Al Jazeera — Asian stock markets rise after earlier tech rout",u:"https://aljazeera.com/economy/2026/11/27/asian-stock-markets-rise-after-earlier-tech-rout"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,440.29", chg:1.83, series:[1414.44,1440.29],
      txt:{en:`<b>SET Index rose 25.85 points (+1.83%) to 1,440.29 Friday</b> on turnover of about THB 52.4bn, as foreign selling shrank to just ~THB 39m.`, th:`<b>ดัชนี SET ขึ้น 25.85 จุด (+1.83%) สู่ 1,440.29 วันศุกร์</b> มูลค่าซื้อขายราว 52,370 ล้านบาท แรงขายต่างชาติลดเหลือเพียงราว 39 ล้านบาท`},
      why:{en:`Thailand finally joined the global recovery: the AI and tech panic eased and the heavy foreign selling of recent days almost stopped. Foreigners are still net sellers of ~THB 14.5bn for November, and the Nvidia ASEAN server halt and the proposed US tariff (up to 18%) remain unresolved. Analysts point to December's usually positive seasonality; 1,410 is still the support to watch.`, th:`ไทยได้ร่วมการฟื้นตัวของตลาดโลกในที่สุด: ความตื่นตระหนกเรื่อง AI และเทคคลายลง และแรงขายหนักของต่างชาติช่วงก่อนหน้าแทบหยุด แต่ต่างชาติยังขายสุทธิราว 14,500 ล้านบาทในเดือนพฤศจิกายน และข่าว Nvidia หยุดส่งเซิร์ฟเวอร์ไปอาเซียนกับภาษีที่สหรัฐฯ เสนอ (สูงสุด 18%) ยังไม่คลี่คลาย นักวิเคราะห์ชี้ว่าเดือนธันวาคมมักเป็นบวกตามสถิติ แนวรับที่ต้องจับตายังเป็น 1,410`},
      full:{en:`Thailand's SET Index closed at 1,440.29 on Friday, November 27, up 25.85 points (+1.83%), with trading value of about THB 52.37 billion, according to Kaohoon International. The analyst tied the gain to the global recovery, noting the Nasdaq's surge, and said tech-sector uncertainty has eased since Jensen Huang was reinstated as Nvidia CEO; the market is expected to keep its upward momentum next week in line with December's historical trend. Foreign investors were net sellers of only about THB 38.71 million on the day, bringing month-to-date net selling to about THB 14.54 billion; year-to-date they remain net buyers of about THB 3.97 billion.`, th:`ดัชนี SET ปิดที่ 1,440.29 วันศุกร์ที่ 27 พ.ย. ขึ้น 25.85 จุด (+1.83%) มูลค่าซื้อขายราว 52,370 ล้านบาท ตามรายงานของข่าวหุ้น (Kaohoon International) นักวิเคราะห์ระบุว่าการขึ้นมาจากการฟื้นตัวของตลาดโลกและการพุ่งของ Nasdaq ความไม่แน่นอนในกลุ่มเทคคลายลงหลัง Jensen Huang กลับมาเป็น CEO ของ Nvidia และคาดว่าตลาดจะรักษาแรงขึ้นในสัปดาห์หน้าตามสถิติเดือนธันวาคม ต่างชาติขายสุทธิเพียงราว 38.71 ล้านบาทในวันนี้ ยอดขายสุทธิตั้งแต่ต้นเดือนราว 14,540 ล้านบาท ส่วนตั้งแต่ต้นปียังซื้อสุทธิราว 3,970 ล้านบาท`},
      sources:[{l:"Kaohoon International — Market Roundup 27 November 2026",u:"https://www.kaohooninternational.com/markets/595651"},{l:"Kaohoon International — Total trading value of stocks and bonds on 27 November 2026 by investor types",u:"https://www.kaohooninternational.com/markets/595649"},{l:"Kaohoon International — Thai Stock Market Outlook on 27 November 2026",u:"https://www.kaohooninternational.com/markets/595605"}]},
  ];

     txt:{en:`<b>Gold rose about 2% Friday to ~$3,640–3,660/oz,</b> up ~3% for the week after bouncing from a one-year low near $3,427 on Wednesday. <b>Oil eased: Brent settled −1.2% at $95.44 and WTI −0.7% at $83.08</b>; Brent still gained ~3% on the week, its first weekly gain in November.`, th:`<b>ทองคำขึ้นราว 2% วันศุกร์ สู่ราว $3,640–3,660 ต่อออนซ์</b> ทั้งสัปดาห์ขึ้นราว 3% หลังดีดจากจุดต่ำสุดรอบหนึ่งปีราว $3,427 เมื่อวันพุธ <b>น้ำมันอ่อนตัว: Brent ปิด −1.2% ที่ $95.44 และ WTI −0.7% ที่ $83.08</b> แต่ Brent ยังขึ้นราว 3% ในสัปดาห์นี้ เป็นสัปดาห์บวกแรกของเดือนพฤศจิกายน`},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
