<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"AI Slowdown Warnings and a Saudi Pipeline Shutdown Send US Futures, Asian Tech Sliding Into a Double Fed-BOJ Week", th:"คำเตือนชะลอการพัฒนา AI และท่อน้ำมันซาอุฯ ที่ปิดตัว ฉุดฟิวเจอร์สสหรัฐฯ และหุ้นเทคเอเชียร่วง ก่อนสัปดาห์ประชุมเฟดและ BOJ พร้อมกัน"},
    heroDeck:{en:`US equity futures and Asian tech shares slid to start the week after Anthropic CEO Dario Amodei urged AI firms Saturday to slow the rollout of their most advanced models on safety grounds, while OpenAI's Sam Altman said in an interview published the same day that the ChatGPT maker won't go public this year, calling an IPO now "ill-advised." S&P 500 futures fell about 0.5% toward 7,618 and Nasdaq 100 futures dropped roughly 1.1%, while Japan's Nikkei 225 slid about 1.7% to a six-week low below 63,000 in early Monday trade, led by chip and AI-supply-chain names — SoftBank Group -12%, Kioxia Holdings -8.6%, Taiyo Yuden -8.3%, Advantest -4.5%, Tokyo Electron -2.6%. Adding to the pressure, Saudi Arabia's shutdown of its East-West pipeline — the kingdom's main workaround for the already-disrupted Strait of Hormuz, carrying close to 4% of global oil supply — pushed Brent back up to around $107.5/bbl (+2.8%) and WTI to about $102/bbl (+2.3%), reversing Friday's post-CPI dip. Gold held roughly flat near $4,348/oz, caught between oil-driven inflation risk and fresh safe-haven demand, as markets head into a rare back-to-back central-bank week: the Fed decides Wednesday, September 16 (a hike still ~90% priced), and the Bank of Japan follows September 17-18.`, th:`ฟิวเจอร์สหุ้นสหรัฐฯ และหุ้นเทคโนโลยีเอเชียร่วงลงรับต้นสัปดาห์ หลังดาริโอ อโมเดอี ซีอีโอ Anthropic เรียกร้องให้บริษัท AI ชะลอการเปิดตัวโมเดลขั้นสูงสุดของตนด้วยเหตุผลด้านความปลอดภัยเมื่อวันเสาร์ ขณะแซม อัลต์แมน ซีอีโอ OpenAI ให้สัมภาษณ์ที่เผยแพร่วันเดียวกันว่า ChatGPT จะยังไม่เข้าตลาดหุ้นปีนี้ โดยระบุว่าการทำ IPO ในตอนนี้ "ไม่ฉลาดนัก" ฟิวเจอร์ส S&P 500 ลดลงราว 0.5% สู่แถว 7,618 และฟิวเจอร์ส Nasdaq 100 ลดลงราว 1.1% ขณะดัชนี Nikkei 225 ญี่ปุ่นร่วงลงราว 1.7% สู่จุดต่ำสุดในรอบหกสัปดาห์ต่ำกว่า 63,000 ในการซื้อขายช่วงเช้าวันจันทร์ นำโดยหุ้นกลุ่มชิปและซัพพลายเชน AI — SoftBank Group ลดลง 12%, Kioxia Holdings ลดลง 8.6%, Taiyo Yuden ลดลง 8.3%, Advantest ลดลง 4.5%, Tokyo Electron ลดลง 2.6% เพิ่มแรงกดดันจากการที่ซาอุดีอาระเบียปิดท่อขนส่งน้ำมัน East-West — เส้นทางสำรองหลักของราชอาณาจักรเพื่อเลี่ยงช่องแคบฮอร์มุซที่หยุดชะงักอยู่แล้ว ซึ่งขนส่งน้ำมันเกือบ 4% ของอุปทานโลก — ดันราคาน้ำมันเบรนท์กลับขึ้นสู่ราว $107.5 ต่อบาร์เรล (+2.8%) และ WTI สู่ราว $102 ต่อบาร์เรล (+2.3%) พลิกกลับจากที่ร่วงลงหลัง CPI เมื่อวันศุกร์ ทองคำทรงตัวใกล้ระดับ $4,348 ต่อออนซ์ ท่ามกลางแรงดึงระหว่างความเสี่ยงเงินเฟ้อจากน้ำมันกับความต้องการสินทรัพย์ปลอดภัยที่กลับมา ขณะตลาดกำลังเข้าสู่สัปดาห์การประชุมธนาคารกลางใหญ่สองแห่งติดกันซึ่งพบได้ยาก: เฟดตัดสินใจวันพุธที่ 16 กันยายน (โอกาสขึ้นดอกเบี้ยยังอยู่ที่ราว 90%) ตามด้วยธนาคารกลางญี่ปุ่นวันที่ 17-18 กันยายน`},

    leadtxt:{en:`<b>US equity futures and Asian tech shares are sliding to start the week, after Anthropic's CEO called Saturday for AI firms to slow their model rollouts on safety grounds and OpenAI's Sam Altman ruled out an IPO this year — a fresh crack in the AI-capex story that has powered much of this year's rally.</b> S&P 500 futures are down about 0.5% near 7,618 and Nasdaq 100 futures off roughly 1.1%, while Japan's Nikkei fell about 1.7% to a six-week low below 63,000, with chip and AI-supply-chain names hit hardest (SoftBank -12%, Kioxia -8.6%, Advantest -4.5%). At the same time, Saudi Arabia's shutdown of its East-West pipeline — its main workaround for the blocked Strait of Hormuz — pushed Brent back up to around $107.5 (+2.8%) and WTI to about $102 (+2.3%), reversing Friday's post-CPI pullback, while gold sits roughly flat near $4,348. For your clients: this is the first real test of whether the AI trade can correct without dragging the broader market down with it — and it lands in the same week as both the Fed's Sep 16 decision (a hike still ~90% priced) and the Bank of Japan's Sep 17-18 meeting, so <b>expect volatility to stay elevated into Wednesday</b> rather than treat this as a one-day wobble.`, th:`<b>ฟิวเจอร์สหุ้นสหรัฐฯ และหุ้นเทคโนโลยีเอเชียร่วงลงรับต้นสัปดาห์ หลังซีอีโอของ Anthropic เรียกร้องให้บริษัท AI ชะลอการเปิดตัวโมเดลด้วยเหตุผลด้านความปลอดภัยเมื่อวันเสาร์ และแซม อัลต์แมนแห่ง OpenAI ปฏิเสธการทำ IPO ปีนี้ — รอยร้าวใหม่ในเรื่องราวการลงทุน AI ที่ขับเคลื่อนตลาดขาขึ้นปีนี้มาตลอด</b> ฟิวเจอร์ส S&P 500 ลดลงราว 0.5% ใกล้ระดับ 7,618 และฟิวเจอร์ส Nasdaq 100 ลดลงราว 1.1% ขณะ Nikkei ญี่ปุ่นลดลงราว 1.7% สู่จุดต่ำสุดในรอบหกสัปดาห์ต่ำกว่า 63,000 โดยหุ้นกลุ่มชิปและซัพพลายเชน AI ถูกกระทบหนักสุด (SoftBank ลดลง 12%, Kioxia ลดลง 8.6%, Advantest ลดลง 4.5%) ขณะเดียวกัน การที่ซาอุดีอาระเบียปิดท่อขนส่งน้ำมัน East-West — เส้นทางสำรองหลักเพื่อเลี่ยงช่องแคบฮอร์มุซที่ปิดกั้นอยู่ — ดันเบรนท์กลับขึ้นสู่ราว $107.5 (+2.8%) และ WTI สู่ราว $102 (+2.3%) พลิกกลับจากที่ร่วงลงหลัง CPI วันศุกร์ ขณะทองคำแทบไม่เปลี่ยนแปลงใกล้ $4,348 สำหรับลูกค้าของคุณ: นี่คือบททดสอบแรกที่แท้จริงว่าการเทรด AI จะปรับฐานได้โดยไม่ฉุดตลาดในวงกว้างลงไปด้วยหรือไม่ — และเกิดขึ้นในสัปดาห์เดียวกับทั้งการตัดสินใจของเฟดวันที่ 16 ก.ย. (โอกาสขึ้นดอกเบี้ยยังอยู่ที่ราว 90%) และการประชุม BOJ วันที่ 17-18 ก.ย. จึง <b>ควรเตรียมรับความผันผวนที่จะยังสูงต่อเนื่องไปจนถึงวันพุธ</b> มากกว่าจะมองว่าเป็นแค่การสั่นไหววันเดียว`},

    watchnote:{en:`Fed hike odds for the September 16 meeting stood at roughly 90% heading into the weekend, and Saturday's fresh oil-supply shock — Saudi Arabia's East-West pipeline shutdown — only reinforces the inflation case for a move. A day later, on Sep 17-18, the Bank of Japan holds its own meeting: a rare back-to-back week for the world's two most-watched central banks. Layered on top, Saturday's AI-slowdown warnings from Anthropic and OpenAI sent Nasdaq 100 futures down over 1% and hit Asian chip stocks hard in early Monday trade. <b style="color:var(--muted)">The Sep 16 FOMC decision</b> is still the key date on the calendar, but watch AI-driven tech weakness and oil's renewed climb as the two swing factors into then.`,
      th:`โอกาสขึ้นดอกเบี้ยสำหรับการประชุมวันที่ 16 ก.ย. อยู่ที่ราว 90% ก่อนเข้าสู่วันหยุดสุดสัปดาห์ และช็อกอุปทานน้ำมันรอบใหม่วันเสาร์ — การปิดท่อขนส่งน้ำมัน East-West ของซาอุดีอาระเบีย — ยิ่งตอกย้ำเหตุผลด้านเงินเฟ้อที่สนับสนุนการขึ้นดอกเบี้ย อีกหนึ่งวันถัดมา วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก ซ้อนทับด้วยคำเตือนชะลอ AI จาก Anthropic และ OpenAI เมื่อวันเสาร์ ที่ฉุดฟิวเจอร์ส Nasdaq 100 ลงกว่า 1% และกระทบหุ้นชิปเอเชียอย่างหนักในการซื้อขายช่วงเช้าวันจันทร์ <b style="color:var(--muted)">การตัดสินใจของเฟดวันที่ 16 ก.ย.</b> ยังคงเป็นวันสำคัญบนปฏิทิน แต่ควรจับตาความอ่อนแอของหุ้นเทคจาก AI และน้ำมันที่กลับมาไต่ขึ้น ในฐานะสองปัจจัยชี้ขาดก่อนถึงวันนั้น`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดวันศุกร์ที่ 11 ก.ย. ตามเวลาสหรัฐฯ ส่วนบทวิเคราะห์เรื่องแรงเทขายจากคำเตือนชะลอ AI การปิดท่อน้ำมันของซาอุดีอาระเบีย และความเคลื่อนไหวก่อนตลาดเปิด/ช่วงเช้าเอเชียวันจันทร์ที่ 14 ก.ย. อ้างอิงจากระดับฟิวเจอร์ส การเคลื่อนไหวของดัชนี และราคาหุ้นรายตัวที่มีการรายงาน ไม่ใช่ราคาปิดที่ยืนยันแล้ว ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>US stocks rebounded Friday, snapping a four-day losing streak — the S&P 500 +0.86% to 7,656.98, the Dow +0.98% (+509.19 pts) to 52,573.29, the Nasdaq +0.96% to 26,333.04 —</b> even as hotter-than-expected core CPI pushed September Fed hike odds to roughly 90%, while the 10-year Treasury yield eased back from a near-5% high to close around 4.92% and oil tumbled from its highs.`, th:`<b>หุ้นสหรัฐฯ ดีดตัวขึ้นวันศุกร์ ยุติการปรับลงสี่วันติดต่อกัน — S&P 500 เพิ่มขึ้น 0.86% สู่ 7,656.98, Dow เพิ่มขึ้น 0.98% (+509.19 จุด) สู่ 52,573.29, Nasdaq เพิ่มขึ้น 0.96% สู่ 26,333.04 —</b> แม้ Core CPI ที่ร้อนแรงกว่าคาดจะดันโอกาสขึ้นดอกเบี้ยเฟดเดือน ก.ย. สู่ราว 90% ขณะผลตอบแทนพันธบัตร 10 ปีย่อตัวลงจากจุดสูงสุดใกล้ 5% มาปิดที่ราว 4.92% และน้ำมันร่วงลงจากจุดสูงสุด`},
      why:{en:`A ~1% rally on a day when hike odds jumped to 90% is the market telling you it had already priced in most of the bad news — but that calm didn't survive the weekend: Saturday's AI-slowdown warnings and a fresh oil-supply shock from the Saudi pipeline shutdown pushed S&P 500 futures down roughly 0.5% and Nasdaq 100 futures over 1% in early Monday trade, ahead of a week with both the Fed and Bank of Japan deciding rates.`, th:`การดีดตัวขึ้นราว 1% ในวันที่โอกาสขึ้นดอกเบี้ยพุ่งสู่ 90% คือสัญญาณว่าตลาดได้สะท้อนข่าวร้ายส่วนใหญ่ไปแล้ว — แต่ความสงบนั้นอยู่ไม่ถึงวันจันทร์: คำเตือนชะลอ AI เมื่อวันเสาร์ และช็อกอุปทานน้ำมันรอบใหม่จากการปิดท่อของซาอุดีอาระเบีย ฉุดฟิวเจอร์ส S&P 500 ลงราว 0.5% และฟิวเจอร์ส Nasdaq 100 ลงกว่า 1% ในการซื้อขายช่วงเช้าวันจันทร์ ก่อนสัปดาห์ที่ทั้งเฟดและ BOJ จะตัดสินใจเรื่องดอกเบี้ย`},
      full:{en:`US stocks closed higher Friday, snapping a four-day losing streak, as investors weighed a hotter-than-expected core CPI reading against a sharp reversal in oil prices and Treasury yields. The S&P 500 rose 0.86% to close at 7,656.98, the Dow Jones Industrial Average gained 509.19 points (+0.98%) to 52,573.29, and the Nasdaq Composite added 0.96% to 26,333.04. August headline CPI rose 0.4% month-over-month and 3.4% year-over-year, in line with forecasts, but core CPI rose 0.3% m/m — a tenth above expectations — reinforcing bets on a Fed hike. Odds of a September 16 quarter-point hike, per CME FedWatch, jumped to roughly 90% from ~72% Thursday. The 10-year Treasury yield touched a fresh cycle high near 4.98% before easing to close around 4.92%, while Brent crude tumbled 2.8% to $104.61/bbl and WTI fell 2.4% to $100.05 — still up roughly 9% on the week — after Iranian state media said Tehran would meet Gulf states in Oman to discuss the Strait of Hormuz. That calm proved short-lived: over the weekend, Anthropic's Dario Amodei called for AI firms to slow their model rollouts and OpenAI's Sam Altman ruled out an IPO this year, while Saudi Arabia's East-West pipeline shutdown reignited an oil-supply shock. S&P 500 futures fell about 0.5% toward 7,618 and Nasdaq 100 futures dropped roughly 1.1% in early Monday trade, ahead of the Fed's Sep 16 decision and the Bank of Japan's Sep 17-18 meeting.`, th:`หุ้นสหรัฐฯ ปิดตลาดสูงขึ้นวันศุกร์ ยุติการปรับลงสี่วันติดต่อกัน ขณะนักลงทุนชั่งน้ำหนักระหว่างตัวเลข Core CPI ที่ร้อนแรงกว่าคาด กับการพลิกกลับอย่างชัดเจนของราคาน้ำมันและผลตอบแทนพันธบัตร ดัชนี S&P 500 เพิ่มขึ้น 0.86% ปิดที่ 7,656.98 ดัชนี Dow Jones เพิ่มขึ้น 509.19 จุด (+0.98%) สู่ 52,573.29 และดัชนี Nasdaq Composite เพิ่มขึ้น 0.96% สู่ 26,333.04 CPI ทั่วไปเดือน ส.ค. เพิ่มขึ้น 0.4% เทียบเดือนก่อน และ 3.4% เทียบปีก่อน ตรงตามคาดการณ์ แต่ Core CPI เพิ่มขึ้น 0.3% เทียบเดือนก่อน สูงกว่าคาดการณ์หนึ่งหลักทศนิยม ตอกย้ำการคาดการณ์ขึ้นดอกเบี้ยของเฟด โอกาสขึ้นดอกเบี้ย 0.25% วันที่ 16 ก.ย. ตามข้อมูล CME FedWatch พุ่งขึ้นสู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ผลตอบแทนพันธบัตร 10 ปีแตะจุดสูงสุดใหม่ของรอบนี้ใกล้ 4.98% ก่อนย่อตัวปิดที่ราว 4.92% ขณะน้ำมันดิบเบรนท์ร่วงลง 2.8% สู่ $104.61 ต่อบาร์เรล และ WTI ลดลง 2.4% สู่ $100.05 — ยังคงเพิ่มขึ้นราว 9% ในรอบสัปดาห์ — หลังสื่อทางการอิหร่านระบุว่าเตหะรานจะพบปะกลุ่มประเทศอ่าวที่โอมานเพื่อหารือเรื่องช่องแคบฮอร์มุซ ความสงบนั้นอยู่ได้ไม่นาน: ช่วงสุดสัปดาห์ ดาริโอ อโมเดอีแห่ง Anthropic เรียกร้องให้บริษัท AI ชะลอการเปิดตัวโมเดล และแซม อัลต์แมนแห่ง OpenAI ปฏิเสธการทำ IPO ปีนี้ ขณะการปิดท่อขนส่งน้ำมัน East-West ของซาอุดีอาระเบียจุดชนวนช็อกอุปทานน้ำมันรอบใหม่ ฟิวเจอร์ส S&P 500 ลดลงราว 0.5% สู่แถว 7,618 และฟิวเจอร์ส Nasdaq 100 ลดลงราว 1.1% ในการซื้อขายช่วงเช้าวันจันทร์ ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย. และการประชุม BOJ วันที่ 17-18 ก.ย.`},
      sources:[{l:"Yahoo Finance — Sept 11 close",u:"https://ca.finance.yahoo.com/news/stock-market-today-friday-september-11-dow-sp-500-nasdaq-cpi-inflation-082201751.html"},{l:"CNBC — August CPI report",u:"https://www.cnbc.com/2026/09/11/cpi-inflation-report-august-2026.html"},{l:"CNBC — oil prices fall Friday",u:"https://www.cnbc.com/2026/09/11/oil-price-today-iran-brent-wti-trump.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,568.56", chg:0.66, series:[25401,25568.56],
      txt:{en:`<b>DAX rose 0.66% to 25,568.56 Friday,</b> tracking a broader pre-CPI rebound in European risk sentiment even as the ECB's Thursday rate hike and inflation warning kept a cap on gains.`, th:`<b>DAX เพิ่มขึ้น 0.66% สู่ 25,568.56 วันศุกร์</b> สอดคล้องกับบรรยากาศเสี่ยงที่ฟื้นตัวในยุโรปก่อน CPI แม้การขึ้นดอกเบี้ยของ ECB เมื่อวันพฤหัสบดีและคำเตือนเรื่องเงินเฟ้อจะยังจำกัดการปรับขึ้น`},
      why:{en:`Europe's modest bounce, well ahead of the US CPI print, tells you the ECB's Thursday hike and inflation warning didn't trigger a fresh sell-off — investors are treating it as already priced in. Watch whether that holds once European markets get a full session to react to today's US inflation data and rate-hike repricing.`, th:`การดีดตัวขึ้นเล็กน้อยของยุโรป ก่อนตัวเลข CPI สหรัฐฯ จะประกาศ แสดงว่าการขึ้นดอกเบี้ยของ ECB และคำเตือนเงินเฟ้อเมื่อวันพฤหัสบดีไม่ได้กระตุ้นการเทขายรอบใหม่ — นักลงทุนมองว่าสะท้อนในราคาไปแล้ว ต้องจับตาว่าจะยืนได้หรือไม่ เมื่อตลาดยุโรปมีเวลาเต็มเซสชันตอบสนองต่อข้อมูลเงินเฟ้อสหรัฐฯ และการปรับราคาโอกาสขึ้นดอกเบี้ยวันนี้`},
      full:{en:`European shares edged higher Friday, with Germany's DAX closing up 0.66% at 25,568.56, as risk sentiment stabilized ahead of the US CPI release. The move came a day after the ECB raised its key rate by 25 basis points and warned of persistent upside inflation risk linked to the Middle East conflict, which had pushed the index to a one-month low. Trading was relatively cautious, with investors positioning for the potential market impact of the US inflation data due later in the day.`, th:`หุ้นยุโรปขยับขึ้นวันศุกร์ ดัชนี DAX เยอรมนีปิดตลาดขึ้น 0.66% ที่ 25,568.56 ขณะบรรยากาศเสี่ยงเริ่มทรงตัวก่อนตัวเลข CPI สหรัฐฯ จะประกาศ การเคลื่อนไหวนี้เกิดขึ้นหนึ่งวันหลัง ECB ขึ้นดอกเบี้ยนโยบาย 25bp และเตือนความเสี่ยงเงินเฟ้อด้านสูงที่เชื่อมโยงกับความขัดแย้งตะวันออกกลาง ซึ่งเคยกดดัชนีลงสู่จุดต่ำสุดในรอบเดือน การซื้อขายค่อนข้างระมัดระวัง ขณะนักลงทุนจัดพอร์ตรับผลกระทบที่อาจเกิดจากข้อมูลเงินเฟ้อสหรัฐฯ ที่จะประกาศในวันเดียวกัน`},
      sources:[{l:"Trading Economics — Germany",u:"https://tradingeconomics.com/germany/stock-market"},{l:"Investrade — Sept 11 preview",u:"https://investrade.com/morning-preview-september-11-2026/"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"64,011.34", chg:-1.93, series:[65270.95,64011.34],
      txt:{en:`<b>Nikkei 225 fell 1.93% to 64,011.34 Friday (TOPIX also lower),</b> as regional markets stayed cautious ahead of the US CPI report, with escalating Middle East tensions and still-elevated oil keeping pressure on risk assets.`, th:`<b>Nikkei 225 ลดลง 1.93% สู่ 64,011.34 วันศุกร์ (TOPIX ปรับลงเช่นกัน)</b> ขณะตลาดภูมิภาคยังคงระมัดระวังก่อนตัวเลข CPI สหรัฐฯ โดยความตึงเครียดตะวันออกกลางที่ทวีความรุนแรงและน้ำมันที่ยังสูงยังกดดันสินทรัพย์เสี่ยง`},
      why:{en:`Japan giving back Thursday's gain and then some — a nearly 2% drop — shows the AI/tech cushion that held earlier in the week finally gave way to yield and oil pressure. That vulnerability showed up again Monday: with chipmakers among Tokyo's most AI-capex-sensitive names, Saturday's Anthropic/OpenAI slowdown warnings hit the Nikkei hard in early trade (SoftBank -12%, Kioxia -8.6%, Advantest -4.5%), pushing it to a fresh six-week low near 63,000 even before the fresh oil spike is fully priced in.`, th:`การที่ญี่ปุ่นคืนกำไรของวันพฤหัสบดีและปรับลงเพิ่มเกือบ 2% แสดงว่าปัจจัยหนุนจากกลุ่ม AI/เทคโนโลยีที่เคยพยุงตลาดต้นสัปดาห์เริ่มแพ้แรงกดดันจากผลตอบแทนพันธบัตรและน้ำมัน ความเปราะบางนี้ปรากฏขึ้นอีกครั้งวันจันทร์: เนื่องจากหุ้นกลุ่มชิปเป็นหุ้นที่อ่อนไหวต่อการลงทุน AI มากที่สุดของโตเกียว คำเตือนชะลอ AI จาก Anthropic/OpenAI เมื่อวันเสาร์จึงกระทบ Nikkei อย่างหนักในช่วงเช้า (SoftBank ลดลง 12%, Kioxia ลดลง 8.6%, Advantest ลดลง 4.5%) ดันดัชนีลงสู่จุดต่ำสุดใหม่ในรอบหกสัปดาห์ใกล้ 63,000 ก่อนที่ราคาน้ำมันที่พุ่งขึ้นรอบใหม่จะถูกสะท้อนในราคาเต็มที่ด้วยซ้ำ`},
      full:{en:`Japanese equities fell Friday, with the Nikkei 225 down 1.93% to close at 64,011.34, as escalating US-Iran tensions and elevated oil prices weighed on sentiment ahead of the closely watched US CPI report. The decline erased the prior session's gain and marked one of the sharper regional moves of the week, alongside similar declines in Hong Kong and Shanghai. The weakness carried into Monday: after Anthropic's Dario Amodei and OpenAI's Sam Altman both signaled a pullback in AI's breakneck pace over the weekend, the Nikkei slid roughly 1.7% in early trade to a six-week low below 63,000, led by chip and AI-supply-chain names — SoftBank Group -12%, Kioxia Holdings -8.6%, Taiyo Yuden -8.3%, Advantest -4.5%, Tokyo Electron -2.6% — while MSCI's broader Asia Pacific gauge slipped about 0.5%.`, th:`หุ้นญี่ปุ่นปรับลงวันศุกร์ ดัชนี Nikkei 225 ลดลง 1.93% ปิดที่ 64,011.34 ขณะความตึงเครียดสหรัฐฯ-อิหร่านที่ทวีความรุนแรงและราคาน้ำมันที่สูงกดดันบรรยากาศการลงทุนก่อนตัวเลข CPI สหรัฐฯ ที่ตลาดจับตาอย่างใกล้ชิด การปรับลงนี้ลบล้างกำไรของเซสชันก่อนหน้า และเป็นหนึ่งในการเคลื่อนไหวที่รุนแรงที่สุดของภูมิภาคในสัปดาห์นี้ เช่นเดียวกับการปรับลงของฮ่องกงและเซี่ยงไฮ้ ความอ่อนแอนี้ต่อเนื่องมาถึงวันจันทร์: หลังดาริโอ อโมเดอีแห่ง Anthropic และแซม อัลต์แมนแห่ง OpenAI ต่างส่งสัญญาณชะลอความเร็วของ AI ในช่วงสุดสัปดาห์ ดัชนี Nikkei ร่วงลงราว 1.7% ในช่วงเช้า สู่จุดต่ำสุดในรอบหกสัปดาห์ต่ำกว่า 63,000 นำโดยหุ้นกลุ่มชิปและซัพพลายเชน AI — SoftBank Group ลดลง 12%, Kioxia Holdings ลดลง 8.6%, Taiyo Yuden ลดลง 8.3%, Advantest ลดลง 4.5%, Tokyo Electron ลดลง 2.6% — ขณะดัชนี MSCI Asia Pacific ในภาพรวมลดลงราว 0.5%`},
      sources:[{l:"India TV — Sept 11 Asia markets",u:"https://www.indiatvnews.com/business/markets/11-september-2026-stock-market-updates-sensex-slumps-593-points-nifty-below-23-300-amid-weak-global-cues-2026-09-11-1053924"},{l:"Trading Economics — Japan",u:"https://tradingeconomics.com/japan/stock-market"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,805.63", chg:-0.60, series:[24954.47,24805.63],
      txt:{en:`<b>Hang Seng fell 0.60% to 24,805.63 Friday, while the Shanghai Composite dropped 1.18% to 3,888.11</b> — mainland China's sharper move — as regional markets braced for the US CPI report against a backdrop of elevated oil and Middle East risk.`, th:`<b>Hang Seng ลดลง 0.60% สู่ 24,805.63 วันศุกร์ ขณะ Shanghai Composite ลดลง 1.18% สู่ 3,888.11</b> — การปรับลงที่รุนแรงกว่าของจีนแผ่นดินใหญ่ — ขณะตลาดภูมิภาคเตรียมรับตัวเลข CPI สหรัฐฯ ท่ามกลางน้ำมันที่สูงและความเสี่ยงตะวันออกกลาง`},
      why:{en:`Shanghai underperforming Hong Kong by more than 2x this time — a reversal from earlier in the week — suggests mainland-specific concerns (property, growth data) are compounding the regional yield story, not just following it. Worth flagging to clients who see "China" as one trade.`, th:`การที่เซี่ยงไฮ้ปรับลงมากกว่าฮ่องกงกว่าสองเท่าในรอบนี้ — สวนทางกับต้นสัปดาห์ — บ่งชี้ว่าปัจจัยเฉพาะของจีนแผ่นดินใหญ่ (อสังหาริมทรัพย์ ข้อมูลการเติบโต) กำลังซ้อนทับกับเรื่องราวผลตอบแทนพันธบัตรระดับภูมิภาค ไม่ใช่แค่ตามไปเฉยๆ ควรแจ้งเตือนลูกค้าที่มองว่า "จีน" เป็นการเทรดเดียว`},
      full:{en:`Hong Kong and mainland China both fell Friday, ahead of the US CPI report: the Hang Seng dropped 0.60% to close at 24,805.63, while the Shanghai Composite fell a sharper 1.18% to 3,888.11. The declines came as regional investors weighed persistent Middle East tensions, still-elevated oil prices, and the approaching Fed decision, with mainland-specific growth and property concerns adding to the pressure on Shanghai.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่ปรับลงทั้งคู่วันศุกร์ ก่อนตัวเลข CPI สหรัฐฯ: ดัชนี Hang Seng ลดลง 0.60% ปิดที่ 24,805.63 ขณะดัชนี Shanghai Composite ลดลงแรงกว่าที่ 1.18% สู่ 3,888.11 การปรับลงนี้เกิดขึ้นขณะนักลงทุนภูมิภาคชั่งน้ำหนักความตึงเครียดตะวันออกกลางที่ยืดเยื้อ ราคาน้ำมันที่ยังสูง และการตัดสินใจของเฟดที่ใกล้เข้ามา โดยความกังวลด้านการเติบโตและอสังหาริมทรัพย์ของจีนแผ่นดินใหญ่เพิ่มแรงกดดันต่อเซี่ยงไฮ้`},
      sources:[{l:"24/7 Wall St — Hang Seng & Shanghai",u:"https://247wallst.com/cards/hong-kong-closed-down-0-66-but-the-mainland-took-the-harde-hsi-market-bell-01m27r2qm4njppz371xddkxsq7"},{l:"Trading Economics",u:"https://tradingeconomics.com/hong-kong/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,604.52", chg:-0.65, series:[1615.07,1604.52],
      txt:{en:`<b>SET Index fell 0.65% to 1,604.52 Friday (-10.55pts),</b> on turnover of about THB 71.21bn, tracking the region lower ahead of the US CPI report as oil stayed elevated and global bond yields hovered near cycle highs.`, th:`<b>ดัชนี SET ลดลง 0.65% สู่ 1,604.52 วันศุกร์ (-10.55 จุด)</b> มูลค่าการซื้อขายราว 7.121 หมื่นล้านบาท เคลื่อนไหวตามภูมิภาคก่อน CPI สหรัฐฯ ขณะน้ำมันยังยืนสูงและผลตอบแทนพันธบัตรโลกใกล้จุดสูงสุดของรอบนี้`},
      why:{en:`A broader, region-wide pullback rather than a big-cap-led one (as Thursday's was) suggests Thai investors de-risked more broadly into the CPI unknown. With the print now in and hike odds near 90%, watch for the SET to stabilize early next week if the global reversal in oil and yields holds.`, th:`การปรับลงที่กระจายทั่วตลาดมากกว่าที่นำโดยหุ้นขนาดใหญ่ (ต่างจากวันพฤหัสบดี) แสดงว่านักลงทุนไทยลดความเสี่ยงในวงกว้างมากขึ้นก่อนตัวเลข CPI ที่ยังไม่แน่นอน เมื่อตัวเลขออกมาแล้วและโอกาสขึ้นดอกเบี้ยใกล้ 90% ควรจับตาว่า SET จะทรงตัวได้หรือไม่ในต้นสัปดาห์หน้า หากการพลิกกลับของน้ำมันและผลตอบแทนพันธบัตรทั่วโลกยังคงอยู่`},
      full:{en:`Thailand's SET Index closed Friday at 1,604.52, down 10.55 points (-0.65%), on turnover of about THB 71.21 billion. The market tracked the broader regional decline ahead of the US CPI release, with investors cautious amid still-elevated oil prices and global bond yields near multi-year highs. Attention now turns to how the SET reacts early next week to Friday's hotter-than-expected core CPI and the resulting jump in Fed hike odds, alongside Friday's sharp reversal in oil prices.`, th:`ดัชนี SET ของไทยปิดตลาดวันศุกร์ที่ 1,604.52 ลดลง 10.55 จุด (-0.65%) มูลค่าการซื้อขายราว 7.121 หมื่นล้านบาท ตลาดเคลื่อนไหวตามการปรับลงของภูมิภาคก่อนตัวเลข CPI สหรัฐฯ ขณะนักลงทุนยังระมัดระวังท่ามกลางราคาน้ำมันที่ยังสูงและผลตอบแทนพันธบัตรโลกใกล้จุดสูงสุดในรอบหลายปี ตอนนี้ต้องจับตาว่า SET จะตอบสนองอย่างไรในต้นสัปดาห์หน้าต่อ Core CPI ที่ร้อนแรงกว่าคาดของวันศุกร์ และโอกาสขึ้นดอกเบี้ยเฟดที่พุ่งขึ้นตามมา รวมถึงการพลิกกลับอย่างชัดเจนของราคาน้ำมันในวันศุกร์`},
      sources:[{l:"Kaohoon International — Market Roundup 11 Sep",u:"https://www.kaohooninternational.com/markets/590587"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil's Friday reversal didn't last: Saudi Arabia's shutdown of its East-West pipeline — its main workaround for the blocked Strait of Hormuz, carrying close to 4% of global supply — pushed Brent back up to around $107.5/bbl (+2.8%) and WTI to about $102/bbl (+2.3%) in early Monday trade, while gold held roughly flat near $4,348/oz,</b> caught between oil-driven inflation risk (bad for gold) and fresh AI-selloff safe-haven demand (good for gold).`, th:`<b>การพลิกกลับของน้ำมันวันศุกร์อยู่ได้ไม่นาน: การที่ซาอุดีอาระเบียปิดท่อขนส่งน้ำมัน East-West — เส้นทางสำรองหลักเพื่อเลี่ยงช่องแคบฮอร์มุซที่ปิดกั้นอยู่ ซึ่งขนส่งน้ำมันเกือบ 4% ของอุปทานโลก — ดันเบรนท์กลับขึ้นสู่ราว $107.5 ต่อบาร์เรล (+2.8%) และ WTI สู่ราว $102 ต่อบาร์เรล (+2.3%) ในการซื้อขายช่วงเช้าวันจันทร์ ขณะทองคำทรงตัวใกล้ $4,348 ต่อออนซ์</b> ท่ามกลางแรงดึงระหว่างความเสี่ยงเงินเฟ้อจากน้ำมัน (ลบต่อทองคำ) กับความต้องการสินทรัพย์ปลอดภัยจากแรงเทขาย AI รอบใหม่ (บวกต่อทองคำ)`},
     why:{en:`Oil re-accelerating on a genuine supply disruption (not just headline risk) while gold stays pinned near flat tells you the market currently reads this as an inflation story more than a pure fear trade — that's a less favorable setup for the Fed than Friday's reversal suggested, right into a week where both the Fed and BOJ decide rates.`, th:`การที่น้ำมันกลับมาไต่ขึ้นจากการหยุดชะงักของอุปทานจริง (ไม่ใช่แค่ความเสี่ยงจากพาดหัวข่าว) ขณะทองคำยังทรงตัวใกล้เดิม บ่งชี้ว่าตลาดตอนนี้มองเรื่องนี้เป็นเรื่องเงินเฟ้อมากกว่าการเทรดเพราะความกลัวล้วนๆ — ซึ่งเป็นสถานการณ์ที่ไม่เอื้อต่อเฟดเท่าที่การพลิกกลับวันศุกร์เคยบ่งชี้ไว้ ในจังหวะที่ทั้งเฟดและ BOJ กำลังจะตัดสินใจเรื่องดอกเบี้ยในสัปดาห์เดียวกัน`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Fed hike odds for September 16 stood at roughly 90% heading into the weekend, and Monday's fresh oil-supply shock from the Saudi pipeline shutdown reinforces the inflation case for a move.</b> The 10-year Treasury yield closed Friday near 4.92% after touching 4.98%, and a day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting — a rare back-to-back week for the world's two most-watched central banks, now complicated by the AI-slowdown selloff hitting growth-sensitive tech.`, th:`<b>โอกาสขึ้นดอกเบี้ยเฟดวันที่ 16 ก.ย. อยู่ที่ราว 90% ก่อนเข้าสู่วันหยุดสุดสัปดาห์ และช็อกอุปทานน้ำมันรอบใหม่วันจันทร์จากการปิดท่อของซาอุดีอาระเบียยิ่งตอกย้ำเหตุผลด้านเงินเฟ้อที่สนับสนุนการขึ้นดอกเบี้ย</b> ผลตอบแทนพันธบัตร 10 ปีปิดใกล้ 4.92% วันศุกร์ หลังแตะ 4.98% และหนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก และตอนนี้ยิ่งซับซ้อนขึ้นจากแรงเทขายหุ้นเทคที่อ่อนไหวต่อการเติบโตจากคำเตือนชะลอ AI`},
     why:{en:`With hike odds near 90% and now a fresh inflation-side push from oil, the Fed has little room to sound dovish Wednesday — but the AI-slowdown selloff is the first real growth-side counterweight markets have had in weeks. Prepare clients for a genuinely two-sided Fed week: a hawkish hold or hike-and-pause are both live, and BOJ's Sep 17-18 decision adds a second source of rate volatility right behind it.`, th:`เมื่อโอกาสขึ้นดอกเบี้ยใกล้ 90% และมีแรงผลักด้านเงินเฟ้อรอบใหม่จากน้ำมัน เฟดแทบไม่มีพื้นที่จะส่งสัญญาณผ่อนคลายในวันพุธ — แต่แรงเทขายจากคำเตือนชะลอ AI คือปัจจัยด้านการเติบโตที่ถ่วงดุลอย่างแท้จริงครั้งแรกในรอบหลายสัปดาห์ ควรเตรียมลูกค้าให้พร้อมรับสัปดาห์เฟดที่มีความเป็นไปได้สองทางอย่างแท้จริง: ทั้งการคงดอกเบี้ยแบบสายเหยี่ยวหรือขึ้นแล้วหยุดพักล้วนเป็นไปได้ และการตัดสินใจของ BOJ วันที่ 17-18 ก.ย. ยังเพิ่มความผันผวนด้านดอกเบี้ยอีกแหล่งตามมาติดๆ`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`With Fed hike odds now near 90% after Friday's hot core CPI, the political pressure campaign continues: Trump, the Vice President and Treasury Secretary have kept urging the Fed to hold or cut, renewing the threat to "stop trading with every country the US runs a deficit against" if the Fed doesn't move. Section 338 tariffs remain in effect and the ~7.5% China "overcapacity" tariff still looms ahead of a planned Trump-Xi summit.`, th:`เมื่อโอกาสขึ้นดอกเบี้ยเฟดใกล้ 90% แล้วหลัง Core CPI ร้อนแรงวันศุกร์ แคมเปญกดดันทางการเมืองยังดำเนินต่อ: ทรัมป์ รองประธานาธิบดี และรัฐมนตรีคลัง ยังคงเรียกร้องให้เฟดคงหรือลดดอกเบี้ย โดยย้ำคำขู่ว่าจะ "หยุดค้าขายกับทุกประเทศที่สหรัฐฯ ขาดดุลการค้าด้วย" หากเฟดไม่ดำเนินการ มาตรการภาษีมาตรา 338 ยังคงมีผลบังคับใช้ และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้`}, w:{en:`Hike odds jumping to 90% despite the White House's public pressure — and now with markets nearly certain of a move — is the clearest sign yet that political pressure is losing its grip on pricing. Remind clients that next week's meeting is now about the dot plot and tone, not whether the Fed hikes.`, th:`โอกาสขึ้นดอกเบี้ยที่พุ่งสู่ 90% แม้ทำเนียบขาวกดดันต่อสาธารณะ — และตอนนี้ตลาดเกือบมั่นใจแล้วว่าจะมีการขึ้นดอกเบี้ย — คือสัญญาณชัดเจนที่สุดว่าแรงกดดันทางการเมืองเริ่มมีผลต่อการตั้งราคาน้อยลง ควรย้ำกับลูกค้าว่าการประชุมสัปดาห์หน้าตอนนี้อยู่ที่ dot plot และน้ำเสียงของเฟด ไม่ใช่ว่าจะขึ้นดอกเบี้ยหรือไม่`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Friday's Iran-Oman diplomacy signal proved short-lived: Saudi Arabia confirmed over the weekend that it has shut down its East-West pipeline after a drone attack, cutting off the kingdom's main workaround for the already-blocked Strait of Hormuz and threatening close to 4% of global oil supply. Brent and WTI both jumped again in early Monday trade — Brent to around $107.5 (+2.8%), WTI to about $102 (+2.3%) — reversing all of Friday's decline.`, th:`สัญญาณการทูตอิหร่าน-โอมานเมื่อวันศุกร์อยู่ได้ไม่นาน: ซาอุดีอาระเบียยืนยันช่วงสุดสัปดาห์ว่าได้ปิดท่อขนส่งน้ำมัน East-West หลังถูกโดรนโจมตี ตัดเส้นทางสำรองหลักของราชอาณาจักรในการเลี่ยงช่องแคบฮอร์มุซที่ปิดกั้นอยู่แล้ว และคุกคามอุปทานน้ำมันโลกเกือบ 4% ราคาน้ำมันเบรนท์และ WTI ต่างพุ่งขึ้นอีกครั้งในการซื้อขายช่วงเช้าวันจันทร์ — เบรนท์สู่ราว $107.5 (+2.8%) WTI สู่ราว $102 (+2.3%) — ลบล้างการปรับลงทั้งหมดของวันศุกร์`}, w:{en:`The pipeline shutdown shows the Gulf-diplomacy thesis from Friday was premature — this is now a genuine supply disruption, not just a headline risk that talks can quickly defuse. Combined with Saturday's AI-slowdown warnings hitting tech, clients should brace for a geopolitics-plus-AI risk-off combination heading into Fed week, not a single, easily-resolved shock.`, th:`การปิดท่อน้ำมันแสดงว่าแนวคิดการทูตกลุ่มประเทศอ่าวจากวันศุกร์ยังเร็วเกินไป — นี่คือการหยุดชะงักของอุปทานจริง ไม่ใช่แค่ความเสี่ยงจากพาดหัวข่าวที่การเจรจาจะคลี่คลายได้เร็ว ผนวกกับคำเตือนชะลอ AI เมื่อวันเสาร์ที่กระทบหุ้นเทค ลูกค้าควรเตรียมรับแรงกดดันเสี่ยงที่มาจากทั้งภูมิรัฐศาสตร์และ AI พร้อมกันก่อนเข้าสู่สัปดาห์เฟด ไม่ใช่แค่ช็อกเดียวที่คลี่คลายได้ง่าย`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`Fed hike odds for September 16 stood at roughly 90% heading into the weekend, and Monday's oil-supply shock from the Saudi pipeline shutdown reinforces the case for a move rather than weakening it. A day later, on Sep 17-18, the Bank of Japan holds its own meeting — a rare back-to-back week for the two most-watched central banks — now set against a backdrop of AI-slowdown-driven weakness in growth-sensitive tech.`, th:`โอกาสขึ้นดอกเบี้ยเฟดวันที่ 16 ก.ย. อยู่ที่ราว 90% ก่อนเข้าสู่วันหยุดสุดสัปดาห์ และช็อกอุปทานน้ำมันวันจันทร์จากการปิดท่อของซาอุดีอาระเบียยิ่งตอกย้ำเหตุผลที่สนับสนุนการขึ้นดอกเบี้ย มากกว่าจะลดทอนลง อีกหนึ่งวันถัดมา วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก โดยครั้งนี้มีความอ่อนแอของหุ้นเทคที่อ่อนไหวต่อการเติบโตจากคำเตือนชะลอ AI เป็นฉากหลัง`}, w:{en:`With odds near 90% and a fresh inflation-side push from oil, the hike itself is close to fully priced — the real swing factor is whether the Fed's tone (and BOJ's a day later) leans hawkish enough to compound the AI-driven growth scare, or whether Wednesday's dot plot offers some balance. Have both a "hawkish hold" and "hike-and-pause" scenario ready for clients, and flag BOJ as a second live risk.`, th:`เมื่อโอกาสใกล้ 90% และมีแรงผลักด้านเงินเฟ้อรอบใหม่จากน้ำมัน การขึ้นดอกเบี้ยเองเกือบถูกสะท้อนในราคาตลาดไปแล้ว — ปัจจัยชี้ขาดจริงคือน้ำเสียงของเฟด (และ BOJ ในวันถัดมา) จะสายเหยี่ยวมากพอจนซ้ำเติมความกังวลด้านการเติบโตจาก AI หรือไม่ หรือ dot plot วันพุธจะช่วยสร้างสมดุลได้บ้าง ควรเตรียมสถานการณ์ทั้ง "คงดอกเบี้ยแบบสายเหยี่ยว" และ "ขึ้นแล้วหยุดพัก" ให้ลูกค้า และแจ้งเตือนว่า BOJ คือความเสี่ยงที่สองที่ต้องจับตา`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`August CPI landed in line on the headline (+0.4% m/m, +3.4% y/y) but hotter on core (+0.3% m/m vs +0.2% expected, +2.4% y/y), reinforcing that underlying price pressure remains sticky. The reading pushed Fed hike odds for Sep 16 to roughly 90%, from ~72% Thursday, with EY-Parthenon among forecasters now projecting a quarter-point move to 3.75%-4.00%.`, th:`CPI เดือน ส.ค. ออกมาตรงตามคาดในตัวเลขทั่วไป (+0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อน) แต่ร้อนแรงกว่าคาดในส่วน Core (+0.3% เทียบเดือนก่อน เทียบคาดการณ์ 0.2%, +2.4% เทียบปีก่อน) ตอกย้ำว่าแรงกดดันราคาพื้นฐานยังคงเหนียวแน่น ตัวเลขนี้ดันโอกาสขึ้นดอกเบี้ยเฟดวันที่ 16 ก.ย. สู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ขณะ EY-Parthenon หนึ่งในนักพยากรณ์คาดการณ์ว่าเฟดจะขึ้นดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00%`}, w:{en:`Stocks rallying on a hotter core print is a sign markets had already braced for worse — but a sticky core reading this close to a hike decision leaves little room for the Fed to sound dovish next week. Frame client conversations around "hike now, hawkish pause" as the base case.`, th:`การที่หุ้นดีดตัวขึ้นแม้ Core CPI จะร้อนแรงกว่าคาด แสดงว่าตลาดได้เตรียมรับสถานการณ์ที่แย่กว่านี้ไว้แล้ว — แต่ตัวเลข Core ที่เหนียวแน่นใกล้วันตัดสินใจขนาดนี้ เหลือพื้นที่น้อยมากที่เฟดจะส่งสัญญาณผ่อนคลายในสัปดาห์หน้า ควรวางกรอบการสนทนากับลูกค้าโดยยึด "ขึ้นดอกเบี้ยตอนนี้ แล้วหยุดพักแบบสายเหยี่ยว" เป็นกรณีฐาน`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 11 Sep",th:"ศุกร์ 11 ก.ย."}, imp:"h", t:{en:"Hot core CPI pushes Sep 16 hike odds to ~90%; stocks rally, oil tumbles",th:"Core CPI ร้อนแรงดันโอกาสขึ้นดอกเบี้ย 16 ก.ย. สู่ราว 90% หุ้นดีดตัว น้ำมันร่วง"}, d:{en:"August headline CPI matched forecasts (+0.4% m/m, +3.4% y/y) but core CPI ran hot (+0.3% m/m vs +0.2% expected, +2.4% y/y), pushing Sep 16 hike odds to roughly 90% from ~72% Thursday. The S&P 500 rose 0.86% to 7,656.98, the Dow gained 509.19 pts (+0.98%) to 52,573.29, and the Nasdaq added 0.96% to 26,333.04. The 10-year yield touched 4.98% before easing to ~4.92%, and Brent tumbled 2.8% to $104.61 after Iran signaled Oman talks over the Strait of Hormuz. Earlier, before the print, Asia and Europe stayed mixed: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%.",th:"CPI ทั่วไปเดือน ส.ค. ตรงตามคาด (+0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อน) แต่ Core CPI ร้อนแรงกว่าคาด (+0.3% เทียบเดือนก่อน เทียบคาดการณ์ 0.2%, +2.4% เทียบปีก่อน) ดันโอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. สู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ดัชนี S&P 500 เพิ่มขึ้น 0.86% สู่ 7,656.98 ดัชนี Dow เพิ่มขึ้น 509.19 จุด (+0.98%) สู่ 52,573.29 และดัชนี Nasdaq เพิ่มขึ้น 0.96% สู่ 26,333.04 ผลตอบแทนพันธบัตร 10 ปีแตะ 4.98% ก่อนย่อตัวสู่ราว 4.92% และเบรนท์ร่วง 2.8% สู่ $104.61 หลังอิหร่านส่งสัญญาณเจรจาที่โอมานเรื่องช่องแคบฮอร์มุซ ก่อนหน้านั้น ก่อนตัวเลขจะประกาศ ตลาดเอเชียและยุโรปเคลื่อนไหวคละกัน: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%"}},

    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
