<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FAF8F4; --surface:#FFFFFF; --surface-2:#F4F1EA;
    --ink:#16191F; --muted:#5C6572; --faint:#8A929E;
    --line:#E7E4DC; --line-strong:#D8D3C7;
    --accent:#0E3A5C; --accent-soft:#e8eef3;
    --gold:#9C7420; --gold-line:#E6D3A6; --gold-bg:#FBF4E2;
    --up:#14804A; --up-bg:#E6F3EC; --down:#C0392B; --down-bg:#FBEBE9;
    --shadow:0 1px 2px rgba(20,25,31,.05), 0 8px 24px rgba(20,25,31,.05);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
      --paper:#0E1116; --surface:#161A20; --surface-2:#1C222A;
      --ink:#ECEEF1; --muted:#9AA2AD; --faint:#6D7681;
      --line:#242A32; --line-strong:#333B45;
      --accent:#5AA6DC; --accent-soft:#16242f;
      --gold:#D6A94E; --gold-line:#4a3d1f; --gold-bg:#20190c;
      --up:#34C77B; --up-bg:#0f2a1d; --down:#E5695B; --down-bg:#2b1512;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);}}
  :root[data-theme="dark"]{
      --paper:#0E1116; --surface:#161A20; --surface-2:#1C222A;
      --ink:#ECEEF1; --muted:#9AA2AD; --faint:#6D7681;
      --line:#242A32; --line-strong:#333B45;
      --accent:#5AA6DC; --accent-soft:#16242f;
      --gold:#D6A94E; --gold-line:#4a3d1f; --gold-bg:#20190c;
      --up:#34C77B; --up-bg:#0f2a1d; --down:#E5695B; --down-bg:#2b1512;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:600}
  a{color:var(--accent)}

  .topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:11px 0}
  .brand{display:flex; align-items:baseline; gap:9px; font-family:var(--serif); font-size:19px; font-weight:600}
  .brand .dot{width:8px; height:8px; border-radius:50%; background:var(--gold); align-self:center}
  .spacer{flex:1}
  .stamp{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid var(--line-strong); background:var(--surface); color:var(--muted); border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{color:var(--ink)}
  .tbtn.lang{color:var(--accent); font-weight:600; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* hero */
  .hero{position:relative; margin-top:22px; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:linear-gradient(120deg,var(--accent-soft),var(--surface))}
  .hero svg{display:block; width:100%; height:120px}
  .masthead{padding:26px 0 8px}
  .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600}
  .masthead h1{font-family:var(--serif); font-size:clamp(28px,5vw,44px); line-height:1.06; margin:10px 0 6px; letter-spacing:-.01em}
  .masthead .sub{color:var(--muted); font-size:15px; max-width:64ch}
  .datebar{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
  .datebar b{color:var(--ink); font-weight:600}

  section{margin:36px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap}
  .sechead h2{font-family:var(--serif); font-size:23px}
  .sechead .hint{font-size:12.5px; color:var(--faint); margin-left:auto}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:700}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.6}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:600; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:5px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:999px; padding:3px 10px; text-decoration:none; font-weight:600}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:700}

  .themecard{border-left:3px solid var(--accent)}
  .themecard.warn{border-left-color:var(--down)}
  .themecard.rate{border-left-color:var(--gold)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .imp.h{color:var(--down); background:var(--down-bg)} .imp.m{color:var(--gold); background:var(--gold-bg)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .idx{display:flex; flex-direction:column; gap:5px; padding:14px 15px}
  .idx .nm{font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:8px}
  .idx .nm .rg{color:var(--faint); font-size:11px}
  .idx .val{font-size:20px; font-weight:600}
  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; padding:2px 8px; border-radius:999px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:12px 18px; background:var(--surface-2); border-bottom:1px solid var(--line); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:600}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}

  .spotlight{background:var(--gold-bg); border:1.5px solid var(--gold-line); border-radius:16px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--gold); color:#fff; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:6px}
  :root[data-theme="dark"] .badge, :root:not([data-theme="light"]) .badge{color:#1a1406}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--gold-line); border-radius:12px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:700; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--gold); font-weight:700; border:1px solid var(--gold-line); border-radius:6px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px 9px; color:var(--muted)}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--gold)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:1px solid var(--line); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:999px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="dot"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <div class="hero" aria-hidden="true">
    <svg viewBox="0 0 1080 120" preserveAspectRatio="none">
      <g opacity="0.5">
        <rect x="70" y="70" width="10" height="50" fill="var(--accent)" opacity=".25"/>
        <rect x="120" y="55" width="10" height="65" fill="var(--accent)" opacity=".3"/>
        <rect x="170" y="78" width="10" height="42" fill="var(--accent)" opacity=".25"/>
        <rect x="900" y="60" width="10" height="60" fill="var(--gold)" opacity=".3"/>
        <rect x="950" y="46" width="10" height="74" fill="var(--gold)" opacity=".35"/>
        <rect x="1000" y="66" width="10" height="54" fill="var(--gold)" opacity=".3"/>
      </g>
      <path d="M0 86 L120 74 L240 82 L360 60 L480 68 L600 44 L720 54 L840 34 L960 46 L1080 26"
            fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1080" cy="26" r="4" fill="var(--gold)"/>
    </svg>
  </div>

  <header class="masthead">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="datebar">
      <span id="db-ed"></span>
      <span id="db-cov"></span>
      <span id="db-next"></span>
    </div>
  </header>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
    <div class="grid g2" id="countrygrid"></div>
    <div class="grid g2" style="margin-top:14px" id="extragrid"></div>
    <div class="rule"></div>
    <div class="sechead"><h2 id="s-themes"></h2></div>
    <div class="grid g4" id="themegrid"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint">UOB Asset Management</span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule" style="background:var(--gold-line)"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <section id="markets">
    <div class="sechead"><h2 id="s-markets"></h2><span class="hint" id="h-markets"></span></div>
    <div class="grid g4" id="idxgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  // ================= STATIC STRINGS =================
  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    eyebrow:{en:"Private market brief · Prepared for a relationship manager", th:"สรุปตลาดส่วนตัว · จัดทำเพื่อผู้จัดการความสัมพันธ์ลูกค้า"},
    h1:{en:"What moved the markets — and what to tell your clients", th:"อะไรทำให้ตลาดขยับ — และคุณควรบอกอะไรกับลูกค้า"},
    sub:{en:"Yesterday's global market action, translated out of the jargon. Focus on what changes the case for bonds, funds and insurance. Refreshed automatically every hour during market hours.", th:"สรุปความเคลื่อนไหวตลาดโลกเมื่อวาน แบบเข้าใจง่ายไม่มีศัพท์ยาก เน้นสิ่งที่มีผลต่อการขายตราสารหนี้ กองทุน และประกัน อัปเดตอัตโนมัติทุกชั่วโมงในช่วงตลาดเปิด"},
    dbEd:{en:"Edition", th:"ฉบับวันที่"}, dbCov:{en:"Covering the session of", th:"สรุปการซื้อขายวันที่"},
    dbCovVal:{en:"Tue 11 Aug 2026", th:"อังคาร 11 ส.ค. 2026"},
    dbNext:{en:"Next update", th:"อัปเดตถัดไป"}, dbNextVal:{en:"top of the hour", th:"ต้นชั่วโมงถัดไป"},
    sBrief:{en:"The one-minute read", th:"สรุปตลาดใน 1 นาที"},
    hBrief:{en:"Bold = what matters · tap a country for the full CNBC / Bloomberg summary", th:"ตัวหนา = จุดสำคัญ · แตะที่ประเทศเพื่อดูสรุปเต็มจาก CNBC / Bloomberg"},
    leadtag:{en:"Bottom line", th:"สรุปสั้น"},
    leadtxt:{en:`<b>Global stocks slipped as a tech sell-off met rising oil and Middle-East nerves.</b> Wall Street fell for a second day, with the S&P 500 down 0.3% and chipmakers leading losses. Investors are waiting on <b>this week's US inflation report (July CPI)</b>, which decides whether the Fed hikes or holds in September. For your clients, this is a <b>"stay defensive, get paid to wait"</b> backdrop — good conditions to talk up quality bonds and income.`,
      th:`<b>หุ้นทั่วโลกย่อตัว จากแรงขายหุ้นกลุ่มเทค บวกกับราคาน้ำมันที่สูงขึ้นและความตึงเครียดในตะวันออกกลาง</b> ตลาดสหรัฐลบเป็นวันที่สองติดต่อกัน ดัชนี S&P 500 ลง 0.3% โดยหุ้นกลุ่มชิปนำตลาดลง นักลงทุนกำลังรอ <b>ตัวเลขเงินเฟ้อสหรัฐสัปดาห์นี้ (CPI เดือน ก.ค.)</b> ซึ่งจะชี้ว่าเฟดจะขึ้นดอกเบี้ยหรือคงไว้ในเดือนกันยายน สำหรับลูกค้าของคุณ นี่คือจังหวะ <b>"ตั้งรับ และรับผลตอบแทนระหว่างรอ"</b> — เหมาะกับการนำเสนอตราสารหนี้คุณภาพและสินทรัพย์สร้างรายได้`},

  // ================= HELPERS =================
  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  // ================= RENDER =================
  function render(){
    document.documentElement.lang = L;
    // static
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl);
    $('lang').textContent = L==='en'?'ไทย':'EN';
    $('eyebrow').textContent=t(S.eyebrow); $('h1').textContent=t(S.h1); $('sub').textContent=t(S.sub);
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`;
    $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief);
    $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-themes').textContent=t(S.sThemes);
    $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('s-prices').textContent=t(S.sPrices); $('h-prices').textContent=t(S.hPrices); $('pricenote').textContent=t(S.pricenote);
    $('b-sell').textContent=t(S.bSell); $('s-funds').textContent=t(S.sFunds);
    $('sh-off').innerHTML=`${t(S.shOff)} <small>${t(S.shOffSub)}</small>`; $('sh-on').innerHTML=`${t(S.shOn)} <small>${t(S.shOnSub)}</small>`;
    $('s-talk').textContent=t(S.sTalk); $('s-markets').textContent=t(S.sMarkets); $('h-markets').textContent=t(S.hMarkets);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    // countries
    $('countrygrid').innerHTML=COUNTRIES.map((c,i)=>`
      <div class="card ccard">
        <div class="chdr"><div class="ci"><h3 style="margin:0"><span class="flag">${c.flag}</span> ${t(c.name)}</h3><span class="ix">${c.ix}</span></div>
          <div style="text-align:right"><div class="val">${c.val}</div>${chgPill(c.chg)}</div></div>
        <div class="chartbox" data-series='${JSON.stringify(c.series)}' data-chg="${c.chg}"></div>
        <div class="chartcap">${t(S.recent)}</div>
        <p>${t(c.txt)}</p>
        <div class="why"><span>${t(S.foryou)}</span> ${t(c.why)}</div>
        <button class="expand" data-i="${i}">${t(S.readfull)} <span class="cv">▾</span></button>
        <div class="full" hidden><p style="margin:0">${t(c.full)}</p>
          <div class="srcline"><span class="srclabel">${t(S.sources)}</span>${c.sources.map(s=>`<a class="srcpill" href="${s.u}" target="_blank" rel="noopener">${s.l} ↗</a>`).join('')}</div></div>
      </div>`).join('');

    $('extragrid').innerHTML=EXTRA.map(e=>`
      <div class="card"><h3><span class="flag">${e.flag}</span> ${t(e.h)}</h3><p>${t(e.txt)}</p>
        <div class="why"><span>${t(S.foryou)}</span> ${t(e.why)}</div></div>`).join('');

    $('themegrid').innerHTML=THEMES.map(x=>`
      <div class="card themecard ${x.cls}"><h3>${t(x.h)}</h3><p>${t(x.p)}</p>
        <div class="why"><span>${t(S.impact)}</span> ${t(x.w)}</div></div>`).join('');

    $('watchlist').innerHTML=WATCH.map(w=>`
      <div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div>
        <div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div>
        <span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');

    $('idxgrid').innerHTML=INDICES.map(i=>`
      <div class="card idx"><div class="nm"><span>${i.nm}</span><span class="rg">${t(i.rg)}</span></div>
        <div class="val num">${i.val}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">${chgPill(i.chg)} ${spark(i.series,i.chg)}</div></div>`).join('');

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`
      <div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div>
        <div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div>
        <div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof||'11 Aug'}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน':'US Treasuries, gold & oil',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p><div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');

    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    // wire charts + expanders
    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{
      const full=btn.nextElementSibling, cv=btn.querySelector('.cv');
      const open=full.hasAttribute('hidden'); if(open){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';}
    });
  }

  function renderCharts(){ document.querySelectorAll('.chartbox').forEach(drawChart); }

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches;
    r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});

  render();
</script>
