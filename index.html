<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Iran-US Tanker War Escalates Over the Long Weekend; Oil Jumps as Wall Street Stays Shut for Labor Day", th:"สงครามเรือบรรทุกน้ำมันสหรัฐฯ-อิหร่านทวีความรุนแรงช่วงสุดสัปดาห์ยาว ราคาน้ำมันพุ่ง ขณะวอลล์สตรีทปิดทำการวันแรงงาน"},
    heroDeck:{en:"The US “permanently disabled” two Iranian oil tankers and destroyed a third off Kharg Island and near Jask late Friday, retaliating after Iran's Revolutionary Guard fired ballistic missiles at a US aircraft carrier and destroyer. Iran struck back over the weekend, hitting three tankers on an “unauthorized route” through the Strait of Hormuz plus three US-linked vessels, and declared a new restricted zone beyond the strait. Washington also revoked the license permitting limited Iranian oil sales, and President Trump warned of “far heavier” retaliation if the attacks continue. Brent crude extended its climb to around $95.7/bbl and WTI to near $90, both up roughly 10% since the tanker war reignited last week, while gold eased slightly to about $4,444/oz. US markets are closed for Labor Day, so Monday's Asia session — Nikkei, Hang Seng, Shanghai and the SET — is the first live test of this escalation, layered on top of Friday's blowout jobs report and the reignited September rate-hike debate.", th:"สหรัฐฯ “ทำให้ใช้การไม่ได้ถาวร” เรือบรรทุกน้ำมันอิหร่าน 2 ลำ และทำลายอีก 1 ลำ นอกชายฝั่งเกาะคาร์กและใกล้เมืองจาสก์ เมื่อค่ำวันศุกร์ เพื่อตอบโต้หลังกองกำลังพิทักษ์การปฏิวัติอิหร่านยิงขีปนาวุธใส่เรือบรรทุกเครื่องบินและเรือพิฆาตของสหรัฐฯ อิหร่านตอบโต้กลับช่วงสุดสัปดาห์ ด้วยการโจมตีเรือบรรทุกน้ำมัน 3 ลำบน “เส้นทางที่ไม่ได้รับอนุญาต” ผ่านช่องแคบฮอร์มุซ พร้อมเรืออีก 3 ลำที่เชื่อมโยงกับสหรัฐฯ และประกาศเขตจำกัดใหม่นอกช่องแคบ ขณะเดียวกันวอชิงตันเพิกถอนใบอนุญาตที่เคยอนุญาตให้อิหร่านขายน้ำมันได้บางส่วน และประธานาธิบดีทรัมป์เตือนว่าจะตอบโต้ “หนักกว่าเดิมมาก” หากการโจมตียังดำเนินต่อไป ราคาน้ำมันเบรนท์ปรับขึ้นต่อเนื่องสู่ราว $95.7 ต่อบาร์เรล และ WTI ใกล้ $90 ทั้งคู่เพิ่มขึ้นราว 10% นับตั้งแต่สงครามเรือบรรทุกน้ำมันปะทุขึ้นอีกครั้งสัปดาห์ที่แล้ว ขณะทองคำอ่อนตัวลงเล็กน้อยสู่ราว $4,444 ต่อออนซ์ ตลาดสหรัฐฯ ปิดทำการวันแรงงาน ทำให้การซื้อขายตลาดเอเชียวันจันทร์ — Nikkei, Hang Seng, เซี่ยงไฮ้ และ SET — เป็นบททดสอบจริงครั้งแรกของการทวีความรุนแรงนี้ ซ้อนทับบนรายงานการจ้างงานที่ดีเกินคาดวันศุกร์และประเด็นขึ้นดอกเบี้ยเดือน ก.ย. ที่กลับมาอีกครั้ง"},

    leadtxt:{en:`<b>Friday's jobs-report whiplash is now old news — a fresh US-Iran tanker war over the long weekend is the story.</b> The US disabled two Iranian oil tankers and destroyed a third after Iran fired ballistic missiles at a US carrier and destroyer; Iran retaliated by hitting three tankers on an unauthorized Hormuz route plus three US-linked vessels, and declared a new restricted zone beyond the strait. Washington revoked the license for limited Iranian oil sales, and Trump warned of far heavier retaliation ahead. Brent crude has climbed toward $95.7 and WTI near $90 — both up roughly 10% since fighting resumed — while gold eased slightly to around $4,444 as the dollar and yields stayed firm. US markets are shut for Labor Day, so <b>Monday's Asia open is the first live pricing of this escalation</b>, layered on top of last week's hawkish jobs surprise. For your clients: <b>this is a second, independent shock stacking on top of the rate-path uncertainty</b> — exactly the scenario where <b>oil-linked inflation risk and safe-haven demand argue for keeping both bonds and a gold sleeve in the portfolio</b>, not just one or the other.`, th:`<b>ความผันผวนจากรายงานการจ้างงานวันศุกร์กลายเป็นข่าวเก่าไปแล้ว — สงครามเรือบรรทุกน้ำมันสหรัฐฯ-อิหร่านครั้งใหม่ช่วงสุดสัปดาห์ยาวคือเรื่องหลักตอนนี้</b> สหรัฐฯ ทำให้เรือบรรทุกน้ำมันอิหร่าน 2 ลำใช้การไม่ได้ และทำลายอีก 1 ลำ หลังอิหร่านยิงขีปนาวุธใส่เรือบรรทุกเครื่องบินและเรือพิฆาตสหรัฐฯ อิหร่านตอบโต้กลับด้วยการโจมตีเรือบรรทุกน้ำมัน 3 ลำบนเส้นทางที่ไม่ได้รับอนุญาตผ่านฮอร์มุซ พร้อมเรือที่เชื่อมโยงกับสหรัฐฯ อีก 3 ลำ และประกาศเขตจำกัดใหม่นอกช่องแคบ วอชิงตันเพิกถอนใบอนุญาตขายน้ำมันบางส่วนของอิหร่าน และทรัมป์เตือนว่าจะตอบโต้หนักกว่าเดิมมาก ราคาน้ำมันเบรนท์ปรับขึ้นสู่ราว $95.7 และ WTI ใกล้ $90 — ทั้งคู่เพิ่มขึ้นราว 10% นับตั้งแต่การสู้รบกลับมาปะทุ — ขณะทองคำอ่อนตัวลงเล็กน้อยสู่ราว $4,444 เมื่อค่าเงินดอลลาร์และผลตอบแทนพันธบัตรยังคงแข็งแกร่ง ตลาดสหรัฐฯ ปิดทำการวันแรงงาน ทำให้ <b>การเปิดตลาดเอเชียวันจันทร์คือการสะท้อนราคาจริงครั้งแรกของการทวีความรุนแรงนี้</b> ซ้อนทับบนตัวเลขจ้างงานเชิงเหยี่ยวของสัปดาห์ที่แล้ว สำหรับลูกค้าของคุณ: <b>นี่คือแรงกระแทกที่สองซึ่งเป็นอิสระจากกัน ซ้อนทับบนความไม่แน่นอนของทิศทางดอกเบี้ย</b> — สถานการณ์ที่ <b>ความเสี่ยงเงินเฟ้อจากน้ำมันและแรงซื้อสินทรัพย์ปลอดภัยสนับสนุนให้คงทั้งตราสารหนี้และสัดส่วนทองคำไว้ในพอร์ต</b> ไม่ใช่อย่างใดอย่างหนึ่งเท่านั้น`},

    watchnote:{en:`The August jobs report blew past expectations Friday — payrolls +162,000 vs +53,000 forecast — reversing Thursday's dovish pivot and pushing September hike odds back above 50%. With <b style="color:var(--muted)">markets closed over the weekend</b>, Monday's Asia open is the first live test of this reversal, ahead of the Fed's Sep 16 decision.`,
      th:`รายงานการจ้างงานเดือน ส.ค. ออกมาดีกว่าคาดอย่างชัดเจนวันศุกร์ — ตัวเลขจ้างงานเพิ่มขึ้น 162,000 ตำแหน่ง เทียบกับที่คาด 53,000 ตำแหน่ง — พลิกกลับท่าทีผ่อนคลายของวันพฤหัสฯ และดันโอกาสขึ้นดอกเบี้ยเดือน ก.ย. กลับมาเหนือ 50% เมื่อ <b style="color:var(--muted)">ตลาดปิดตลอดสุดสัปดาห์</b> การเปิดตลาดเอเชียวันจันทร์จะเป็นบททดสอบจริงครั้งแรกของการพลิกกลับนี้ ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ราคาที่แสดงเป็นข้อมูลล่าสุดที่มี (ดัชนีหุ้นและผลตอบแทนพันธบัตร ณ ราคาปิดวันศุกร์ที่ 4 ก.ย. เนื่องจากตลาดสหรัฐฯ ปิดวันจันทร์ที่ 7 ก.ย. วันแรงงาน; น้ำมันและทองคำ ณ เช้าวันจันทร์ที่ 7 ก.ย. เวลาเอเชีย; หุ้นรายตัว 10 ส.ค.–4 ก.ย. 2026) อาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) ชื่อกองทุนมีไว้เพื่อรับรู้ข้อมูลเท่านั้น — โปรดตรวจสอบหนังสือชี้ชวน NAV และระดับความเสี่ยงจากเอกสารทางการก่อนคุยกับลูกค้าทุกครั้ง และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>US stocks slipped Friday — the S&P 500 -0.38% to 7,718.60, the Dow -0.51% (-271.86 pts) to 53,414.25, the Nasdaq -0.29% to 26,506.99 —</b> after the August jobs report blew past expectations, reviving September rate-hike bets just a day after Fed Governor Waller's dovish signal.`, th:`<b>หุ้นสหรัฐฯ ปรับลงวันศุกร์ — S&P 500 ลดลง 0.38% สู่ 7,718.60, Dow ลดลง 0.51% (-271.86 จุด) สู่ 53,414.25, Nasdaq อ่อนตัวลง 0.29% สู่ 26,506.99 —</b> หลังรายงานการจ้างงานเดือน ส.ค. ออกมาดีกว่าคาดอย่างชัดเจน ปลุกกระแสเดิมพันขึ้นดอกเบี้ยเดือน ก.ย. กลับมา เพียงหนึ่งวันหลังผู้ว่าการเฟด วอลเลอร์ ส่งสัญญาณผ่อนคลาย`},
      why:{en:`Thursday's dovish pivot lasted less than 24 hours — a single data point (162k vs 53k expected) put the hike debate right back in play, and the 2-year yield's jump to a 2025 high shows the market took it seriously. That volatility is the argument for clients: don't chase last week's narrative, anchor the portfolio instead.`, th:`ท่าทีผ่อนคลายของวันพฤหัสฯ อยู่ได้ไม่ถึง 24 ชั่วโมง — ตัวเลขเดียว (162,000 เทียบกับที่คาด 53,000) ดึงประเด็นขึ้นดอกเบี้ยกลับมาอยู่บนโต๊ะทันที และการที่ผลตอบแทนพันธบัตร 2 ปีพุ่งแตะระดับสูงสุดในรอบปี 2025 แสดงว่าตลาดรับรู้เรื่องนี้อย่างจริงจัง ความผันผวนนี้คือเหตุผลสำหรับลูกค้า: อย่าไล่ตามกระแสข่าวสัปดาห์ที่แล้ว ให้ยึดพอร์ตให้มั่นคงแทน`},
      full:{en:`US stocks closed lower Friday after the Labor Department's August jobs report decisively beat expectations, unwinding much of Thursday's Fed-driven rally. Nonfarm payrolls rose 162,000 — nearly three times the 53,000 economists expected and the strongest monthly gain since March — while the unemployment rate held steady at 4.1% and average hourly earnings rose 3.1% year-on-year. The S&P 500 fell 0.38% to close at 7,718.60, the Dow Jones Industrial Average dropped 271.86 points (-0.51%) to 53,414.25, and the Nasdaq Composite eased 0.29% to 26,506.99. The reaction reversed Thursday's dovish repricing: CME-tracked odds of a September 16 rate hike climbed back above 50%, to roughly the mid-50s from a coin flip a day earlier, and the 2-year Treasury yield briefly touched 4.4246%, its highest since January 2025. Retail was the session's biggest mover: Lululemon plunged 17% after cutting its full-year revenue and profit guidance for a second time, citing a 9% drop in comparable sales. Nvidia added modestly to around $231 and Broadcom eased slightly as chip stocks digested the week's earnings news. With US markets closed over the weekend, traders now look to whether Monday's Asia open — and the Fed's September 16 decision — confirm this hawkish reversal or fade it.`, th:`หุ้นสหรัฐฯ ปิดตลาดปรับลงวันศุกร์ หลังรายงานการจ้างงานเดือน ส.ค. ของกระทรวงแรงงานออกมาดีกว่าคาดอย่างชัดเจน ล้างแรงบวกส่วนใหญ่จากการปรับขึ้นที่นำโดยข่าวเฟดเมื่อวันพฤหัสฯ ตัวเลขจ้างงานนอกภาคเกษตรเพิ่มขึ้น 162,000 ตำแหน่ง เกือบสามเท่าของที่นักเศรษฐศาสตร์คาดไว้ที่ 53,000 ตำแหน่ง และเป็นการเพิ่มขึ้นรายเดือนที่แข็งแกร่งที่สุดตั้งแต่เดือนมีนาคม ขณะอัตราว่างงานทรงตัวที่ 4.1% และค่าจ้างเฉลี่ยต่อชั่วโมงเพิ่มขึ้น 3.1% เทียบปีต่อปี ดัชนี S&P 500 ลดลง 0.38% ปิดที่ 7,718.60 ดัชนี Dow Jones ลดลง 271.86 จุด (-0.51%) สู่ 53,414.25 และดัชนี Nasdaq Composite อ่อนตัวลง 0.29% สู่ 26,506.99 ปฏิกิริยาดังกล่าวพลิกกลับการปรับคาดการณ์แบบผ่อนคลายของวันพฤหัสฯ: โอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. ตามข้อมูล CME ดีดกลับขึ้นเหนือ 50% สู่ระดับกลาง 50% กว่า จากใกล้เคียง 50-50 เมื่อวันก่อน และผลตอบแทนพันธบัตร 2 ปีแตะระดับ 4.4246% ในระหว่างวัน สูงสุดตั้งแต่เดือนมกราคม 2025 หุ้นกลุ่มค้าปลีกเป็นตัวเคลื่อนไหวใหญ่สุดของเซสชันนี้: Lululemon ดิ่งลง 17% หลังปรับลดเป้าประมาณการรายได้และกำไรทั้งปีเป็นครั้งที่สอง โดยระบุยอดขายสาขาเดิมลดลง 9% Nvidia เพิ่มขึ้นเล็กน้อยสู่ราว $231 ขณะ Broadcom อ่อนตัวลงเล็กน้อย ขณะหุ้นกลุ่มชิปยังคงย่อยข่าวผลประกอบการของสัปดาห์นี้ เมื่อตลาดสหรัฐฯ ปิดตลอดสุดสัปดาห์ นักลงทุนตอนนี้จับตาว่าการเปิดตลาดเอเชียวันจันทร์ — และการตัดสินใจของเฟดวันที่ 16 ก.ย. — จะยืนยันการพลิกกลับเชิงเหยี่ยวนี้หรือจางหายไป`},
      sources:[{l:"CNBC — Jobs report",u:"https://www.cnbc.com/2026/09/04/jobs-report-august-2026.html"},{l:"TheStreet",u:"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-04-2026"},{l:"The Motley Fool — Lululemon",u:"https://www.fool.com/coverage/stock-market-today/2026/09/04/stock-market-today-sept-4-lululemon-plummets-17-after-slashing-guidance/"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,057", chg:0.21, series:[26007,26057],
      txt:{en:`<b>DAX edged up 0.21% to around 26,057 Friday,</b> extending Thursday's rebound even as the region weighed a stronger-than-expected US jobs report that reignited Fed rate-hike bets late in the session.`, th:`<b>DAX ปรับขึ้น 0.21% สู่ราว 26,057 วันศุกร์</b> ต่อยอดการฟื้นตัวจากวันพฤหัสฯ แม้ตลาดจะรับรู้รายงานการจ้างงานสหรัฐฯ ที่ดีเกินคาด ซึ่งปลุกกระแสเดิมพันขึ้นดอกเบี้ยเฟดกลับมาในช่วงท้ายเซสชัน`},
      why:{en:`Europe holding onto gains even as the US jobs data flips the rate narrative hawkish shows the region's own momentum (post three-day slide) still has some room to run — but the muted size of the move (0.21% vs Thursday's 0.65%) shows the report was still felt. Worth flagging that European equity exposure isn't a clean hedge against a hawkish US surprise.`, th:`การที่ยุโรปยังคงรักษาแรงบวกไว้ได้ แม้ตัวเลขจ้างงานสหรัฐฯ จะพลิกทิศทางการมองดอกเบี้ยเป็นเชิงเหยี่ยว แสดงว่าโมเมนตัมของภูมิภาคเอง (หลังปรับลงต่อเนื่องสามวัน) ยังพอมีช่องให้ไปต่อ — แต่ขนาดการเคลื่อนไหวที่เบาลง (0.21% เทียบกับ 0.65% ของวันพฤหัสฯ) แสดงว่าตลาดยังคงรับรู้ตัวเลขนี้อยู่ ควรย้ำกับลูกค้าว่าการลงทุนในหุ้นยุโรปไม่ใช่ตัวป้องกันความเสี่ยงที่สมบูรณ์จากตัวเลขสหรัฐฯ ที่เหนือคาดเชิงเหยี่ยว`},
      full:{en:`European shares eked out a second straight gain Friday, with Germany's DAX closing up about 0.21% at roughly 26,057, building on Thursday's rebound from a three-session slide. The move came even as the US Labor Department's August jobs report — released mid-session in Frankfurt — decisively beat expectations (+162,000 vs +53,000 forecast) and revived September Fed rate-hike bets, capping gains into the close. European investors continue to feel the US rate path only indirectly, but the report's scale was large enough to be felt across developed-market risk sentiment. Attention now turns to Monday's Asia open and the Fed's September 16 decision for the next signal.`, th:`หุ้นยุโรปปรับขึ้นต่อเนื่องเป็นวันที่สองวันศุกร์ ดัชนี DAX เยอรมนีปิดตลาดขึ้นราว 0.21% ที่ระดับราว 26,057 ต่อยอดการฟื้นตัวจากวันพฤหัสฯ หลังปรับลงต่อเนื่องสามวัน การเคลื่อนไหวนี้เกิดขึ้นแม้รายงานการจ้างงานเดือน ส.ค. ของกระทรวงแรงงานสหรัฐฯ ที่ออกมาระหว่างช่วงการซื้อขายที่แฟรงก์เฟิร์ต จะดีกว่าคาดอย่างชัดเจน (+162,000 เทียบกับที่คาด +53,000) และปลุกกระแสเดิมพันขึ้นดอกเบี้ยเฟดเดือน ก.ย. กลับมา ซึ่งจำกัดแรงบวกในช่วงท้ายตลาด นักลงทุนยุโรปยังคงได้รับผลกระทบจากทิศทางดอกเบี้ยสหรัฐฯ ทางอ้อมเท่านั้น แต่ขนาดของตัวเลขนี้ใหญ่พอที่จะส่งผลต่อบรรยากาศความเสี่ยงของตลาดพัฒนาแล้วในวงกว้าง ความสนใจตอนนี้หันไปที่การเปิดตลาดเอเชียวันจันทร์ และการตัดสินใจของเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"Investrade — Market Review",u:"https://investrade.com/market-review-september-04-2026/"},{l:"CNBC — Jobs report",u:"https://www.cnbc.com/2026/09/04/jobs-report-august-2026.html"},{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"65,020.94", chg:1.3, series:[64214.48,65020.94],
      txt:{en:`<b>Nikkei 225 jumped 1.3% to 65,020.94 Friday,</b> snapping a four-day losing streak as regional markets caught up with Thursday's Fed-driven Wall Street rally — a session that closed in Tokyo hours before the US jobs report reignited rate-hike bets.`, th:`<b>Nikkei 225 พุ่งขึ้น 1.3% สู่ 65,020.94 วันศุกร์</b> ยุติการปรับลงต่อเนื่องสี่วัน ขณะตลาดภูมิภาคไล่ตามแรงบวกของวอลล์สตรีทที่นำโดยข่าวเฟดเมื่อวันพฤหัสฯ — เซสชันที่ปิดตลาดที่โตเกียวไปก่อนหลายชั่วโมงที่รายงานการจ้างงานสหรัฐฯ จะจุดกระแสเดิมพันขึ้นดอกเบี้ยกลับมา`},
      why:{en:`Japan's rebound is really still trading on Thursday's dovish Waller signal, since Tokyo's session closed well before Friday's blowout US jobs data landed — a timing quirk that means Monday's Asia open, not today's levels, is the real test of whether this rally holds.`, th:`การฟื้นตัวของญี่ปุ่นแท้จริงแล้วยังคงเทรดตามสัญญาณผ่อนคลายของวอลเลอร์เมื่อวันพฤหัสฯ เนื่องจากตลาดโตเกียวปิดตลาดไปก่อนที่ตัวเลขจ้างงานสหรัฐฯ ที่แข็งแกร่งเกินคาดของวันศุกร์จะออกมา — ความคลาดเคลื่อนด้านจังหวะเวลานี้หมายความว่าการเปิดตลาดเอเชียวันจันทร์ ไม่ใช่ระดับวันนี้ คือบททดสอบจริงว่าแรงบวกนี้จะยืนได้หรือไม่`},
      full:{en:`Japanese equities snapped a four-session losing streak Friday, with the Nikkei 225 jumping 1.3% to close at 65,020.94, as regional markets caught up with Thursday's tech-led Wall Street rally sparked by Fed Governor Waller's dovish signal. Because Tokyo's session closes hours before the US trading day begins, Friday's gain reflects Thursday's US rally and BOJ-related yen dynamics — not the blowout US jobs report released later that day, which reignited September rate-hike bets and knocked US stocks lower. That mismatch means Monday's Asia open, reacting for the first time to the stronger jobs data, is the more important signal to watch, alongside the Fed's September 16 decision.`, th:`หุ้นญี่ปุ่นยุติการปรับลงต่อเนื่องสี่วันวันศุกร์ ดัชนี Nikkei 225 พุ่งขึ้น 1.3% ปิดที่ 65,020.94 ขณะตลาดในภูมิภาคไล่ตามแรงบวกของวอลล์สตรีทที่นำโดยหุ้นเทคเมื่อวันพฤหัสฯ ซึ่งจุดชนวนจากสัญญาณผ่อนคลายของผู้ว่าการเฟด วอลเลอร์ เนื่องจากตลาดโตเกียวปิดตลาดก่อนที่ตลาดซื้อขายสหรัฐฯ จะเปิดหลายชั่วโมง แรงบวกวันศุกร์จึงสะท้อนแรงบวกของสหรัฐฯ เมื่อวันพฤหัสฯ และพลวัตที่เกี่ยวกับ BOJ/เงินเยน ไม่ใช่รายงานการจ้างงานสหรัฐฯ ที่แข็งแกร่งเกินคาดซึ่งออกมาในวันเดียวกันภายหลัง อันเป็นตัวจุดกระแสเดิมพันขึ้นดอกเบี้ยเดือน ก.ย. กลับมาและฉุดหุ้นสหรัฐฯ ลง ความคลาดเคลื่อนของจังหวะเวลานี้หมายความว่าการเปิดตลาดเอเชียวันจันทร์ ที่จะตอบสนองต่อตัวเลขจ้างงานที่แข็งแกร่งขึ้นเป็นครั้งแรก คือสัญญาณที่สำคัญกว่าที่ต้องจับตา ควบคู่กับการตัดสินใจของเฟดวันที่ 16 ก.ย.`},
      sources:[{l:"WTOP / AP wire",u:"https://wtop.com/world/2026/09/asian-benchmarks-mostly-rise-after-tech-stocks-lead-rally-on-wall-street"},{l:"CNBC — Jobs report",u:"https://www.cnbc.com/2026/09/04/jobs-report-august-2026.html"},{l:"Trading Economics",u:"https://tradingeconomics.com/japan/stock-market"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,658.73", chg:1.8, series:[25318,25658.73],
      txt:{en:`<b>Hang Seng jumped 1.8% to 25,658.73 Friday, while the Shanghai Composite slipped 0.5% to 3,921.40</b> — Hong Kong tech leaders like Tencent and Alibaba catching up with Thursday's Wall Street rally, in a session that closed before the blowout US jobs report reignited rate-hike bets.`, th:`<b>Hang Seng พุ่งขึ้น 1.8% สู่ 25,658.73 วันศุกร์ ขณะ Shanghai Composite ลดลง 0.5% สู่ 3,921.40</b> — หุ้นเทคฮ่องกงอย่าง Tencent และ Alibaba ไล่ตามแรงบวกของวอลล์สตรีทเมื่อวันพฤหัสฯ ในเซสชันที่ปิดตลาดไปก่อนที่รายงานการจ้างงานสหรัฐฯ จะจุดกระแสเดิมพันขึ้นดอกเบี้ยกลับมา`},
      why:{en:`Hong Kong finally joining the global rally — while mainland China still lagged — shows offshore Chinese tech remains the more US-sentiment-sensitive of the two markets. But like Japan, this move predates Friday's US jobs surprise, so it says little about how HK/China will react once that data is actually digested at Monday's open.`, th:`การที่ฮ่องกงในที่สุดร่วมแรงบวกทั่วโลก ขณะจีนแผ่นดินใหญ่ยังตามหลัง แสดงว่าหุ้นเทคจีนนอกประเทศยังคงอ่อนไหวต่อบรรยากาศตลาดสหรัฐฯ มากกว่า แต่เช่นเดียวกับญี่ปุ่น การเคลื่อนไหวนี้เกิดขึ้นก่อนตัวเลขจ้างงานสหรัฐฯ ที่เหนือคาดของวันศุกร์ จึงบอกอะไรได้น้อยเกี่ยวกับปฏิกิริยาจริงของฮ่องกง/จีนเมื่อตลาดเปิดวันจันทร์`},
      full:{en:`Hong Kong and mainland China diverged again Friday: the Hang Seng jumped 1.8% to close at 25,658.73, led by technology names — Tencent, Alibaba and peers extended gains as mainland investors kept rotating into HK-listed AI and tech shares — while the Shanghai Composite slipped 0.5% to 3,921.40. As with Tokyo, Hong Kong's session closed well before the US jobs report reignited September rate-hike bets, so Friday's HK gain reflects Thursday's Wall Street rally rather than the hawkish surprise that followed. Markets across the region now look to Monday's Asia open — the first live reaction to the stronger US jobs data — and the Fed's September 16 decision for the next signal.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่แยกทิศทางกันอีกครั้งวันศุกร์: ดัชนี Hang Seng พุ่งขึ้น 1.8% ปิดที่ 25,658.73 นำโดยหุ้นกลุ่มเทคโนโลยี — Tencent, Alibaba และหุ้นกลุ่มเดียวกันปรับขึ้นต่อเนื่อง ขณะนักลงทุนจีนแผ่นดินใหญ่ยังคงโยกเงินเข้าหุ้นเทคและ AI ที่จดทะเบียนในฮ่องกง — ขณะ Shanghai Composite ลดลง 0.5% สู่ 3,921.40 เช่นเดียวกับโตเกียว ตลาดฮ่องกงปิดตลาดไปก่อนที่รายงานการจ้างงานสหรัฐฯ จะจุดกระแสเดิมพันขึ้นดอกเบี้ยเดือน ก.ย. กลับมา แรงบวกของฮ่องกงวันศุกร์จึงสะท้อนแรงบวกของวอลล์สตรีทเมื่อวันพฤหัสฯ มากกว่าตัวเลขเชิงเหยี่ยวที่ตามมา ตลาดทั่วภูมิภาคตอนนี้จับตาการเปิดตลาดเอเชียวันจันทร์ — ปฏิกิริยาจริงครั้งแรกต่อตัวเลขจ้างงานสหรัฐฯ ที่แข็งแกร่งขึ้น — และการตัดสินใจของเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"GuruFocus",u:"https://www.gurufocus.com/news/9037573/hong-kong-stocks-surge-with-alibaba-09988-and-tencent-00700-rising"},{l:"WTOP / AP wire",u:"https://wtop.com/world/2026/09/asian-benchmarks-mostly-rise-after-tech-stocks-lead-rally-on-wall-street"},{l:"Trading Economics",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,595.58", chg:1.18, series:[1576.92,1595.58],
      txt:{en:`<b>SET Index jumped 1.18% to 1,595.58 Friday (+18.66pts),</b> on turnover of about THB 63.42bn, its strongest session in over a week as large-cap buying returned — a move that, like the rest of Asia, closed before the blowout US jobs report reignited Fed hike bets.`, th:`<b>ดัชนี SET เพิ่มขึ้น 1.18% สู่ 1,595.58 วันศุกร์ (+18.66 จุด)</b> มูลค่าการซื้อขายราว 6.342 หมื่นล้านบาท เป็นเซสชันที่แข็งแกร่งที่สุดในรอบกว่าหนึ่งสัปดาห์ จากแรงซื้อหุ้นขนาดใหญ่ที่กลับมา — เคลื่อนไหวที่เช่นเดียวกับตลาดเอเชียอื่น ปิดตลาดไปก่อนที่รายงานการจ้างงานสหรัฐฯ จะจุดกระแสเดิมพันขึ้นดอกเบี้ยเฟดกลับมา`},
      why:{en:`Thai equities finally posting a real gain, not just an incremental one, shows local risk appetite catching up after lagging Thursday's global rally — but since SET's session also predates Friday's US jobs surprise, the real test is whether that large-cap buying survives Monday's open once the hawkish reversal is priced in.`, th:`การที่หุ้นไทยในที่สุดปรับขึ้นอย่างมีนัยสำคัญ ไม่ใช่แค่ขยับเล็กน้อย แสดงว่าความเชื่อมั่นการลงทุนในประเทศไล่ตามทันหลังตามหลังแรงบวกทั่วโลกเมื่อวันพฤหัสฯ แต่เนื่องจากเซสชันของ SET ก็เกิดขึ้นก่อนตัวเลขจ้างงานสหรัฐฯ ที่เหนือคาดของวันศุกร์เช่นกัน บททดสอบจริงคือแรงซื้อหุ้นขนาดใหญ่นี้จะอยู่รอดจากการเปิดตลาดวันจันทร์ เมื่อตัวเลขเชิงเหยี่ยวถูกสะท้อนในราคาแล้วหรือไม่`},
      full:{en:`Thailand's SET Index closed Friday at 1,595.58, up 18.66 points (+1.18%), on turnover of about THB 63.42 billion — its best single-session gain in over a week, driven by renewed large-cap buying as concerns eased over the US rate path following Thursday's dovish Fed signal. Like the rest of the region, Bangkok's session closed well before the US jobs report reignited September hike bets and sent Wall Street lower, so Monday's open — reacting for the first time to the stronger US data — will be the real test of whether this buying holds. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity.`, th:`ดัชนี SET ของไทยปิดตลาดวันศุกร์ที่ 1,595.58 เพิ่มขึ้น 18.66 จุด (+1.18%) มูลค่าการซื้อขายราว 6.342 หมื่นล้านบาท เป็นการปรับขึ้นในหนึ่งเซสชันที่ดีที่สุดในรอบกว่าหนึ่งสัปดาห์ ขับเคลื่อนจากแรงซื้อหุ้นขนาดใหญ่ที่กลับมา หลังความกังวลเรื่องทิศทางดอกเบี้ยสหรัฐฯ คลายลงตามสัญญาณผ่อนคลายของเฟดเมื่อวันพฤหัสฯ เช่นเดียวกับตลาดอื่นในภูมิภาค ตลาดกรุงเทพฯ ปิดตลาดไปก่อนที่รายงานการจ้างงานสหรัฐฯ จะจุดกระแสเดิมพันขึ้นดอกเบี้ยเดือน ก.ย. กลับมาและฉุดวอลล์สตรีทลง ดังนั้นการเปิดตลาดวันจันทร์ — ที่จะตอบสนองต่อตัวเลขสหรัฐฯ ที่แข็งแกร่งขึ้นเป็นครั้งแรก — จะเป็นบททดสอบจริงว่าแรงซื้อนี้จะคงอยู่หรือไม่ เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว`},
      sources:[{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/590075"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"CNBC — Jobs report",u:"https://www.cnbc.com/2026/09/04/jobs-report-august-2026.html"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil extended its climb into the weekend on the Iran-US tanker war — Brent rose to around $95.7/bbl and WTI to near $90, both up roughly 10% since fighting resumed last week — while gold eased slightly to about $4,444/oz</b> as the dollar and Treasury yields held firm after Friday's jobs report.`, th:`<b>ราคาน้ำมันปรับขึ้นต่อเนื่องเข้าสู่สุดสัปดาห์ จากสงครามเรือบรรทุกน้ำมันสหรัฐฯ-อิหร่าน — เบรนท์ปรับขึ้นสู่ราว $95.7 ต่อบาร์เรล และ WTI ใกล้ $90 ทั้งคู่เพิ่มขึ้นราว 10% นับตั้งแต่การสู้รบกลับมาปะทุสัปดาห์ที่แล้ว ขณะทองคำอ่อนตัวลงเล็กน้อยสู่ราว $4,444 ต่อออนซ์</b> เมื่อค่าเงินดอลลาร์และผลตอบแทนพันธบัตรยังคงแข็งแกร่งหลังรายงานการจ้างงานวันศุกร์`},
     why:{en:`Oil, not gold, is doing the reacting to this weekend's escalation — a reminder that a real supply-chain shock (tanker strikes, a new Iranian restricted zone beyond Hormuz) shows up first in energy prices, and only feeds into safe-haven demand with a lag. The inflation angle here is now more tangible than it was a week ago, worth flagging to clients directly.`, th:`น้ำมัน ไม่ใช่ทองคำ คือสินทรัพย์ที่ตอบสนองต่อการทวีความรุนแรงช่วงสุดสัปดาห์นี้ — เป็นเครื่องเตือนใจว่าแรงกระแทกต่อห่วงโซ่อุปทานจริง (การโจมตีเรือบรรทุกน้ำมัน เขตจำกัดใหม่ของอิหร่านนอกฮอร์มุซ) จะสะท้อนในราคาพลังงานก่อน แล้วจึงค่อยส่งผลต่อแรงซื้อสินทรัพย์ปลอดภัยตามมาทีหลัง มุมมองเงินเฟ้อในเรื่องนี้ตอนนี้จับต้องได้มากกว่าเมื่อสัปดาห์ก่อน ควรย้ำกับลูกค้าโดยตรง`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Treasury yields jumped Friday after the blowout jobs report — the 10-year rose to ~4.79%, the 2-year briefly touched 4.4246% (its highest since January 2025),</b> and September hike odds snapped back above 50%, to roughly the mid-50s, from a coin flip a day earlier. The Fed's official quiet period began Saturday and runs to September 17, so no fresh commentary is expected before the decision — and with US markets closed for Labor Day, Monday brings no new Treasury pricing either.`, th:`<b>ผลตอบแทนพันธบัตรพุ่งขึ้นวันศุกร์ หลังรายงานการจ้างงานที่ดีเกินคาด — พันธบัตร 10 ปีปรับขึ้นสู่ราว 4.79%, พันธบัตร 2 ปีแตะ 4.4246% ระหว่างวัน (สูงสุดตั้งแต่เดือนมกราคม 2025)</b> และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ดีดกลับขึ้นเหนือ 50% สู่ระดับกลาง 50% กว่า จากใกล้เคียง 50-50 เมื่อวันก่อน ช่วงงดให้ความเห็นอย่างเป็นทางการของเฟดเริ่มตั้งแต่วันเสาร์และดำเนินไปจนถึงวันที่ 17 ก.ย. จึงไม่มีความเห็นใหม่จากเฟดก่อนการตัดสินใจ และเมื่อตลาดสหรัฐฯ ปิดทำการวันแรงงาน วันจันทร์จึงไม่มีราคาพันธบัตรใหม่เช่นกัน`},
     why:{en:`This is the cleanest reversal-of-a-reversal all week: Wednesday's ADP miss cooled hike bets, Thursday's Waller remarks nearly killed them, and Friday's jobs beat brought them straight back — and now a second, independent shock (the Iran tanker war) is layering on top before the Fed even reconvenes. That whiplash argues for treating any single week's rate narrative with real skepticism when advising on duration.`, th:`นี่คือการพลิกกลับของการพลิกกลับที่ชัดเจนที่สุดในสัปดาห์นี้: ตัวเลข ADP ที่อ่อนแอวันพุธทำให้เดิมพันขึ้นดอกเบี้ยเย็นลง คำพูดของวอลเลอร์วันพฤหัสฯ เกือบทำให้หายไปเลย และตัวเลขจ้างงานที่ดีเกินคาดวันศุกร์ดึงกลับมาทันที และตอนนี้แรงกระแทกที่สองซึ่งเป็นอิสระจากกัน (สงครามเรือบรรทุกน้ำมันอิหร่าน) กำลังซ้อนทับเข้ามาก่อนที่เฟดจะประชุมอีกครั้งด้วยซ้ำ ความผันผวนสลับทิศแบบนี้สนับสนุนให้มองเรื่องราวดอกเบี้ยของสัปดาห์ใดสัปดาห์หนึ่งด้วยความระมัดระวังจริง ๆ เมื่อให้คำแนะนำเรื่องอายุตราสารหนี้`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Trade headlines took a back seat to the Iran-tanker war this weekend, but the tariff threat sharpened too: reacting to Friday's strong jobs report, Trump publicly told the Fed to cut rates or he would "stop trading with every country the US runs a deficit against" — the first time he's tied a tariff threat directly to a Fed decision. Section 338 tariffs remain in effect and the ~7.5% China "overcapacity" tariff still looms ahead of a planned Trump-Xi summit. On Iran, Trump separately warned of "far heavier" US retaliation if attacks on shipping continue.`, th:`ข่าวการค้าถูกบดบังด้วยสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ แต่การขู่เก็บภาษีก็เข้มขึ้นเช่นกัน: ตอบสนองต่อรายงานการจ้างงานที่แข็งแกร่งวันศุกร์ ทรัมป์เรียกร้องต่อสาธารณะให้เฟดลดดอกเบี้ย มิฉะนั้นจะ "หยุดค้าขายกับทุกประเทศที่สหรัฐฯ ขาดดุลการค้าด้วย" — เป็นครั้งแรกที่เขาผูกการขู่เก็บภาษีเข้ากับการตัดสินใจของเฟดโดยตรง มาตรการภาษีมาตรา 338 ยังคงมีผลบังคับใช้ และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้ ด้านอิหร่าน ทรัมป์เตือนแยกต่างหากว่าสหรัฐฯ จะตอบโต้ "หนักกว่าเดิมมาก" หากการโจมตีเรือขนส่งยังดำเนินต่อไป`}, w:{en:`A president now tying tariff threats directly to the Fed's rate decision, on the same weekend the US and Iran traded tanker strikes, is two live wildcards stacking on top of an already-unresolved rate debate — reinforce with clients that this is not the week to concentrate risk in any single asset or narrative.`, th:`ประธานาธิบดีที่ผูกการขู่เก็บภาษีเข้ากับการตัดสินใจดอกเบี้ยของเฟดโดยตรง ในช่วงสุดสัปดาห์เดียวกับที่สหรัฐฯ และอิหร่านปะทะกันด้วยการโจมตีเรือบรรทุกน้ำมัน คือปัจจัยเสี่ยงที่ยังไม่แน่นอนสองเรื่องซ้อนทับกันบนความไม่แน่นอนของทิศทางดอกเบี้ยที่มีอยู่แล้ว ควรย้ำกับลูกค้าว่าสัปดาห์นี้ไม่ใช่เวลาที่จะกระจุกความเสี่ยงไว้ในสินทรัพย์หรือกระแสข่าวใดข่าวหนึ่ง`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`The Iran standoff escalated sharply over the long weekend: the US "permanently disabled" two Iranian oil tankers off Kharg Island and near Jask and destroyed a third, after Iran's Revolutionary Guard fired ballistic missiles at a US aircraft carrier and destroyer. Iran retaliated, hitting three tankers on an "unauthorized route" through the Strait of Hormuz plus three US-linked vessels, and declared a new restricted zone beyond the strait. Washington also revoked the license permitting limited Iranian oil sales. Brent crude has risen toward $95.7/bbl and WTI to near $90, both up roughly 10% since the tanker war reignited last week.`, th:`ความตึงเครียดกับอิหร่านทวีความรุนแรงขึ้นอย่างชัดเจนช่วงสุดสัปดาห์ยาว: สหรัฐฯ "ทำให้ใช้การไม่ได้ถาวร" เรือบรรทุกน้ำมันอิหร่าน 2 ลำ นอกชายฝั่งเกาะคาร์กและใกล้เมืองจาสก์ และทำลายอีก 1 ลำ หลังกองกำลังพิทักษ์การปฏิวัติอิหร่านยิงขีปนาวุธใส่เรือบรรทุกเครื่องบินและเรือพิฆาตสหรัฐฯ อิหร่านตอบโต้กลับด้วยการโจมตีเรือบรรทุกน้ำมัน 3 ลำบนเส้นทางที่ไม่ได้รับอนุญาตผ่านช่องแคบฮอร์มุซ พร้อมเรือที่เชื่อมโยงกับสหรัฐฯ อีก 3 ลำ และประกาศเขตจำกัดใหม่นอกช่องแคบ วอชิงตันยังเพิกถอนใบอนุญาตที่เคยให้อิหร่านขายน้ำมันได้บางส่วนด้วย ราคาน้ำมันเบรนท์ปรับขึ้นสู่ราว $95.7 ต่อบาร์เรล และ WTI ใกล้ $90 ทั้งคู่เพิ่มขึ้นราว 10% นับตั้งแต่สงครามเรือบรรทุกน้ำมันปะทุอีกครั้งสัปดาห์ที่แล้ว`}, w:{en:`This is no longer a background risk clients can ignore — a genuine tanker war with tit-for-tat strikes on vessels is repricing oil in real time, and Monday's Asia open is the first session trading through it. Oil-linked inflation risk just got a lot more concrete, which strengthens the case for gold and diversified bonds as portfolio ballast, not just a hedge against a hypothetical.`, th:`นี่ไม่ใช่ความเสี่ยงเบื้องหลังที่ลูกค้าจะเพิกเฉยได้อีกต่อไป — สงครามเรือบรรทุกน้ำมันที่แลกหมัดกันจริงกำลังปรับราคาน้ำมันแบบเรียลไทม์ และการเปิดตลาดเอเชียวันจันทร์คือเซสชันแรกที่ต้องเทรดผ่านเหตุการณ์นี้ ความเสี่ยงเงินเฟ้อจากน้ำมันตอนนี้จับต้องได้มากขึ้นมาก ซึ่งหนุนเหตุผลของการถือทองคำและตราสารหนี้แบบกระจายความเสี่ยงเป็นตัวถ่วงสมดุลพอร์ต ไม่ใช่แค่การป้องกันความเสี่ยงเชิงสมมติฐานอีกต่อไป`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The August jobs report reversed the week's rate story in a single session: payrolls +162,000 vs +53,000 expected, unemployment steady at 4.1%. The 10-year Treasury yield rose to ~4.79%, the 2-year briefly hit 4.4246% — its highest since January 2025 — and September hike odds climbed back above 50%, from a coin flip Thursday. The Fed's official quiet period began Saturday and runs through September 17, so no fresh commentary is expected before the decision, even as the Iran tanker war adds a new variable to the calculus.`, th:`รายงานการจ้างงานเดือน ส.ค. พลิกกลับเรื่องราวดอกเบี้ยของสัปดาห์ภายในเซสชันเดียว: ตัวเลขจ้างงานเพิ่มขึ้น 162,000 ตำแหน่ง เทียบกับที่คาด 53,000 ตำแหน่ง อัตราว่างงานทรงตัวที่ 4.1% ผลตอบแทนพันธบัตร 10 ปีปรับขึ้นสู่ราว 4.79% พันธบัตร 2 ปีแตะ 4.4246% ระหว่างวัน สูงสุดตั้งแต่เดือนมกราคม 2025 และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ดีดกลับขึ้นเหนือ 50% จากใกล้เคียง 50-50 เมื่อวันพฤหัสฯ ช่วงงดให้ความเห็นอย่างเป็นทางการของเฟดเริ่มตั้งแต่วันเสาร์และดำเนินไปจนถึงวันที่ 17 ก.ย. จึงไม่มีความเห็นใหม่จากเฟดก่อนการตัดสินใจ แม้สงครามเรือบรรทุกน้ำมันอิหร่านจะเพิ่มตัวแปรใหม่เข้ามาในสมการก็ตาม`}, w:{en:`Wednesday's ADP miss, Thursday's dovish Waller pivot, and Friday's blowout payrolls print are three different signals in three days — proof the Fed's September 16 decision is genuinely data-dependent and unresolved. With a second, independent shock (Iran) now also in play before the Fed even reconvenes, locking in today's still-elevated coupons removes that uncertainty from the client's own portfolio, whichever way the Fed ultimately goes.`, th:`ตัวเลข ADP ที่อ่อนแอวันพุธ ท่าทีผ่อนคลายของวอลเลอร์วันพฤหัสฯ และตัวเลขจ้างงานที่ดีเกินคาดวันศุกร์ คือสามสัญญาณที่ต่างกันภายในสามวัน เป็นหลักฐานว่าการตัดสินใจวันที่ 16 ก.ย. ของเฟดยังคงขึ้นอยู่กับข้อมูลจริง ๆ และยังไม่มีข้อสรุป เมื่อแรงกระแทกที่สองซึ่งเป็นอิสระจากกัน (อิหร่าน) เข้ามาอีกก่อนที่เฟดจะประชุมด้วยซ้ำ การล็อกคูปองที่ยังสูงอยู่วันนี้ช่วยขจัดความไม่แน่นอนนี้ออกจากพอร์ตของลูกค้า ไม่ว่าเฟดจะตัดสินใจไปทางไหนในที่สุด`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`Oil's fresh leg higher — Brent near $95.7, WTI near $90, both up roughly 10% since the tanker war reignited — adds a second, concrete inflation risk on top of Friday's still-elevated 3.1% year-on-year wage growth. Fed officials remain split, and hawks like Warsh now have two separate arguments (wages and energy) rather than one.`, th:`ราคาน้ำมันที่ปรับขึ้นอีกขั้น — เบรนท์ใกล้ $95.7, WTI ใกล้ $90 ทั้งคู่เพิ่มขึ้นราว 10% นับตั้งแต่สงครามเรือบรรทุกน้ำมันปะทุอีกครั้ง — เพิ่มความเสี่ยงเงินเฟ้อที่จับต้องได้อีกด้าน ซ้อนทับบนค่าจ้างที่เพิ่มขึ้น 3.1% เทียบปีต่อปี ซึ่งยังคงอยู่ในระดับสูงจากรายงานวันศุกร์ เจ้าหน้าที่เฟดยังคงแบ่งฝ่ายกัน และฝ่ายเหยี่ยวอย่างวอร์ชตอนนี้มีข้อโต้แย้งสองด้าน (ค่าจ้างและพลังงาน) แทนที่จะเป็นด้านเดียว`}, w:{en:`A strong jobs number with still-firm wage growth, now stacked on top of a real, escalating oil-price shock rather than a hypothetical one, is the scenario where "sticky inflation" stops being a minority Fed view — worth flagging to clients that any rally in bonds may prove premature if this combination persists into the September meeting.`, th:`ตัวเลขจ้างงานที่แข็งแกร่งพร้อมค่าจ้างที่ยังโตแรง ซ้อนทับกับแรงกระแทกราคาน้ำมันที่ทวีความรุนแรงจริง ไม่ใช่แค่ความเสี่ยงเชิงสมมติฐานอีกต่อไป คือสถานการณ์ที่มุมมอง "เงินเฟ้อเหนียว" จะไม่ใช่แค่มุมมองส่วนน้อยของเฟดอีกต่อไป ควรย้ำกับลูกค้าว่าแรงบวกของตราสารหนี้ใด ๆ อาจเร็วเกินไป หากปัจจัยเหล่านี้ยังคงอยู่ต่อเนื่องจนถึงการประชุมเดือน ก.ย.`}},

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri",th:"ศุกร์"}, imp:"h", t:{en:"Blowout jobs report reignites hike bets; Wall St dips, Lululemon craters 17%",th:"รายงานจ้างงานที่ดีเกินคาดจุดกระแสเดิมพันขึ้นดอกเบี้ยกลับมา วอลล์สตรีทปรับลง Lululemon ดิ่งลง 17%"}, d:{en:"August payrolls jumped 162,000 — nearly three times the 53,000 expected — while unemployment held at 4.1%. September hike odds climbed back above 50%, to roughly the mid-50s, from a coin flip Thursday. The S&P 500 slipped 0.38% to 7,718.60, the 2-year Treasury yield touched 4.4246% (highest since January 2025), and the 10-year rose to ~4.79%. Lululemon plunged 17% on a second guidance cut.",th:"ตัวเลขจ้างงานเดือน ส.ค. เพิ่มขึ้น 162,000 ตำแหน่ง เกือบสามเท่าของที่คาดไว้ที่ 53,000 ตำแหน่ง ขณะอัตราว่างงานทรงตัวที่ 4.1% โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ดีดกลับขึ้นเหนือ 50% สู่ระดับกลาง 50% กว่า จากใกล้เคียง 50-50 เมื่อวันพฤหัสฯ ดัชนี S&P 500 ปรับลง 0.38% สู่ 7,718.60 ผลตอบแทนพันธบัตร 2 ปีแตะ 4.4246% (สูงสุดตั้งแต่เดือนมกราคม 2025) และพันธบัตร 10 ปีปรับขึ้นสู่ราว 4.79% Lululemon ดิ่งลง 17% หลังปรับลดเป้าเป็นครั้งที่สอง"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu",th:"พฤหัสฯ"}, imp:"h", t:{en:"Waller signals a hold; Wall St's best day since Aug 4, hike odds crash to a coin flip",th:"วอลเลอร์ส่งสัญญาณคงดอกเบี้ย วอลล์สตรีทบวกแรงสุดตั้งแต่ 4 ส.ค. โอกาสขึ้นดอกเบี้ยร่วงเหลือ 50-50"}, d:{en:"Fed Governor Waller said he could support holding rates steady in September, telling markets to \"give disinflation a chance.\" September hike odds collapsed ~12 points to roughly 50–55% from ~63%. The S&P 500 jumped 1.06% to 7,747.71, its best day since Aug 4; the 10-year yield fell to ~4.76% and gold jumped 2% toward $4,500. Oil stayed bid as Iran struck Kuwait and Bahrain with drones for a second night.",th:"ผู้ว่าการเฟด วอลเลอร์ ระบุอาจสนับสนุนคงดอกเบี้ยเดือน ก.ย. บอกตลาดให้ \"ให้โอกาสเงินเฟ้อชะลอตัว\" โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ร่วงลงราว 12 จุด เหลือราว 50–55% จากราว 63% ดัชนี S&P 500 พุ่งขึ้น 1.06% สู่ 7,747.71 บวกแรงสุดตั้งแต่ 4 ส.ค. ผลตอบแทนพันธบัตร 10 ปีลดลงสู่ราว 4.76% และทองคำพุ่งขึ้น 2% เข้าใกล้ $4,500 ราคาน้ำมันยังคงได้แรงหนุนหลังอิหร่านโจมตีคูเวตและบาห์เรนด้วยโดรนเป็นคืนที่สอง"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed",th:"พุธ"}, imp:"m", t:{en:"US strikes Iran directly; Wall St rallies as weak jobs data cools Fed bets to ~61%",th:"สหรัฐโจมตีอิหร่านโดยตรง วอลล์สตรีทกลับบวก หลังตัวเลขจ้างงานอ่อนแอลดแรงเดิมพันขึ้นดอกเบี้ยเฟดเหลือราว 61%"}, d:{en:"The US carried out \"large and powerful\" strikes on Iranian military targets near Hormuz and Iran retaliated, sending Brent above $94. Yet US stocks rallied (S&P +0.46%, led by Nvidia +3.8%) after ADP showed just 38,000 August private-payroll additions — the weakest since January — pulling September hike odds down to roughly 60–64% from 68%. A separate AI-chip selloff hit Asia hard (Nikkei −2.53%).",th:"สหรัฐฯ โจมตี \"การโจมตีที่ทรงพลัง\" ต่อเป้าหมายทางทหารของอิหร่านใกล้ฮอร์มุซ และอิหร่านตอบโต้กลับ ดันเบรนท์ทะลุ $94 แต่หุ้นสหรัฐฯ กลับบวก (S&P เพิ่มขึ้น 0.46% นำโดย Nvidia ที่พุ่ง 3.8%) หลัง ADP ชี้จ้างงานภาคเอกชนเดือน ส.ค. เพิ่มเพียง 38,000 ตำแหน่ง ต่ำสุดตั้งแต่ ม.ค. ดันโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเหลือราว 60–64% จาก 68% ขณะหุ้นชิป AI เอเชียเทขายหนักแยกต่างหาก (Nikkei ลดลง 2.53%)"}},
    {day:{en:"Today",th:"วันนี้"}, date:{en:"Mon 7 Sep",th:"จันทร์ 7 ก.ย."}, imp:"h", t:{en:"Iran-US tanker war escalates over the long weekend; oil jumps as Wall St stays shut for Labor Day",th:"สงครามเรือบรรทุกน้ำมันสหรัฐฯ-อิหร่านทวีความรุนแรงช่วงสุดสัปดาห์ยาว ราคาน้ำมันพุ่ง ขณะวอลล์สตรีทปิดทำการวันแรงงาน"}, d:{en:"The US disabled two Iranian oil tankers and destroyed a third after Iran fired ballistic missiles at a US carrier and destroyer; Iran retaliated by hitting three tankers on an unauthorized Hormuz route plus three US-linked vessels and declared a new restricted zone beyond the strait. Brent climbed toward $95.7/bbl and WTI to near $90, both up roughly 10% since fighting resumed. US markets are closed for Labor Day, so Asia — Nikkei, Hang Seng, Shanghai and the SET — is the first to trade through both this escalation and last week's hawkish jobs surprise.",th:"สหรัฐฯ ทำให้เรือบรรทุกน้ำมันอิหร่าน 2 ลำใช้การไม่ได้ และทำลายอีก 1 ลำ หลังอิหร่านยิงขีปนาวุธใส่เรือบรรทุกเครื่องบินและเรือพิฆาตสหรัฐฯ อิหร่านตอบโต้กลับด้วยการโจมตีเรือบรรทุกน้ำมัน 3 ลำบนเส้นทางที่ไม่ได้รับอนุญาตผ่านฮอร์มุซ พร้อมเรือที่เชื่อมโยงกับสหรัฐฯ อีก 3 ลำ และประกาศเขตจำกัดใหม่นอกช่องแคบ ราคาน้ำมันเบรนท์ปรับขึ้นสู่ราว $95.7 ต่อบาร์เรล และ WTI ใกล้ $90 ทั้งคู่เพิ่มขึ้นราว 10% นับตั้งแต่การสู้รบกลับมาปะทุ ตลาดสหรัฐฯ ปิดทำการวันแรงงาน ทำให้เอเชีย — Nikkei, Hang Seng, เซี่ยงไฮ้ และ SET — เป็นตลาดแรกที่ต้องเทรดผ่านทั้งการทวีความรุนแรงนี้และตัวเลขจ้างงานเชิงเหยี่ยวของสัปดาห์ที่แล้ว"}},

    {code:"UUSTECH", name:{en:"United US Technology Fund",th:"United US Technology Fund"}, rk:{en:"US tech · high risk",th:"หุ้นเทคสหรัฐ · เสี่ยงสูง"}, desc:{en:"US technology & semiconductor leaders — the AI / chip growth theme, bought in baht.",th:"ผู้นำเทคโนโลยีและเซมิคอนดักเตอร์สหรัฐ — ธีมการเติบโต AI / ชิป ซื้อได้ด้วยเงินบาท"}, now:{en:"Nvidia held onto most of the week's gains (edging to ~$231) even as Friday's jobs report reignited rate-hike bets. With US markets shut for Labor Day, tech hasn't yet had to trade through the weekend's Iran-tanker escalation — worth flagging to clients that a diversified, US-anchored fund like UUSTECH is the way to keep AI-driven exposure without betting on any single name's reaction once Tuesday's reopen catches up with both the rate and oil stories.",th:"Nvidia รักษาแรงบวกส่วนใหญ่ของสัปดาห์ไว้ได้ (ขยับขึ้นสู่ราว $231) แม้รายงานการจ้างงานวันศุกร์จะจุดกระแสเดิมพันขึ้นดอกเบี้ยกลับมา เมื่อตลาดสหรัฐฯ ปิดทำการวันแรงงาน หุ้นเทคยังไม่ต้องเทรดผ่านการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ ควรย้ำกับลูกค้าว่ากองทุนเทคที่กระจายความเสี่ยงและมีฐานในสหรัฐฯ อย่าง UUSTECH คือวิธีคงการลงทุนในธีม AI โดยไม่ต้องเดิมพันกับปฏิกิริยาของหุ้นตัวใดตัวหนึ่ง เมื่อตลาดสหรัฐฯ เปิดอีกครั้งวันอังคารและต้องรับทั้งประเด็นดอกเบี้ยและน้ำมันพร้อมกัน"}, hold:["US tech","Semis","AI"]},
    {code:"UGQG", name:{en:"United Global Quality Growth",th:"United Global Quality Growth"}, rk:{en:"Global equity",th:"หุ้นทั่วโลก"}, desc:{en:"High-quality global growth companies. A steadier core-equity sleeve than a pure-tech play.",th:"บริษัทเติบโตคุณภาพสูงทั่วโลก แกนหุ้นที่นิ่งกว่ากองเทคล้วน"}, now:{en:"This weekend underlined why regional diversification matters more than ever: US markets are shut for Labor Day, Asia is trading live through a fresh Iran-tanker escalation on top of Friday's hawkish jobs surprise, and Europe opens later still digesting both. A quality-growth core spread across regions and sectors avoids betting on any single market's timing or news cycle.",th:"สุดสัปดาห์นี้ตอกย้ำว่าทำไมการกระจายความเสี่ยงตามภูมิภาคจึงสำคัญกว่าที่เคย: ตลาดสหรัฐฯ ปิดทำการวันแรงงาน เอเชียกำลังเทรดผ่านการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านครั้งใหม่ ซ้อนทับบนตัวเลขจ้างงานเชิงเหยี่ยววันศุกร์ ขณะยุโรปยังไม่เปิดตลาดและต้องย่อยข่าวทั้งสองเรื่อง แกนหุ้นเติบโตคุณภาพที่กระจายทั้งภูมิภาคและกลุ่มอุตสาหกรรม ช่วยหลีกเลี่ยงการเดิมพันกับจังหวะเวลาหรือกระแสข่าวของตลาดใดตลาดหนึ่ง"}, hold:["Global quality","Growth"]},
    {code:"UOBSG", name:{en:"UOB Smart Gold",th:"UOB Smart Gold"}, rk:{en:"Gold · alternative",th:"ทองคำ · ทางเลือก"}, desc:{en:"Tracks the gold price — a diversifier and safe-haven talking point.",th:"อิงราคาทองคำ — เป็นตัวกระจายความเสี่ยงและจุดคุยเรื่องสินทรัพย์ปลอดภัย"}, now:{en:"Gold eased slightly over the weekend (~$4,443.53, -0.61%) even as the Iran-US tanker war escalated sharply and oil jumped roughly 10% — a reminder that gold's safe-haven bid can lag a fast-moving geopolitical shock while the dollar and yields stay firm. That's not a reason to skip it: with a real oil-driven inflation risk now stacked on top of an unresolved Fed decision, UOB Smart Gold remains the portfolio's clearest hedge against either risk turning worse.",th:"ทองคำอ่อนตัวลงเล็กน้อยช่วงสุดสัปดาห์ (ราว $4,443.53 ลดลง 0.61%) แม้สงครามเรือบรรทุกน้ำมันสหรัฐฯ-อิหร่านจะทวีความรุนแรงขึ้นอย่างชัดเจนและราคาน้ำมันพุ่งขึ้นราว 10% เป็นเครื่องเตือนใจว่าแรงซื้อสินทรัพย์ปลอดภัยของทองคำอาจตามหลังแรงกระแทกภูมิรัฐศาสตร์ที่เคลื่อนไหวเร็ว ขณะค่าเงินดอลลาร์และผลตอบแทนพันธบัตรยังคงแข็งแกร่ง แต่นั่นไม่ใช่เหตุผลให้ข้ามกองทุนนี้ไป — เมื่อความเสี่ยงเงินเฟ้อจากน้ำมันที่จับต้องได้จริงมาซ้อนทับบนการตัดสินใจของเฟดที่ยังไม่คลี่คลาย UOB Smart Gold ยังคงเป็นตัวป้องกันความเสี่ยงที่ชัดเจนที่สุดของพอร์ต หากความเสี่ยงเรื่องใดเรื่องหนึ่งเลวร้ายลง"}, hold:["Gold","Safe-haven","Diversifier"]},

    {h:{en:"Selling tech / gold funds",th:"การขายกองทุนเทค / ทองคำ"}, li:{en:["Nvidia held onto most of the week's gains (~$231) even as Friday's jobs surprise reignited rate-hike bets. With US markets shut for Labor Day, tech hasn't yet traded through the weekend's tanker-war escalation. Frame UUSTECH as <b>diversified</b>, US-anchored AI exposure that isn't tied to any single company's next earnings print — or to one week's headlines.","Gold eased slightly over the weekend (~$4,444, -0.61%) even as the Iran tanker war escalated sharply and oil jumped ~10% — a sign the safe-haven bid can lag a fast geopolitical shock. Frame that as the entry point: with a real oil-driven inflation risk now stacked on Fed uncertainty, gold belongs in the portfolio as ballast for either risk turning worse, not just a trade on rate cuts.","Pair growth funds with bonds so the client isn't all-in on volatility."], th:["Nvidia รักษาแรงบวกส่วนใหญ่ของสัปดาห์ไว้ได้ (ราว $231) แม้ตัวเลขจ้างงานที่เหนือคาดวันศุกร์จะจุดกระแสเดิมพันขึ้นดอกเบี้ยกลับมา เมื่อตลาดสหรัฐฯ ปิดทำการวันแรงงาน หุ้นเทคยังไม่ต้องเทรดผ่านการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันช่วงสุดสัปดาห์ นำเสนอ UUSTECH เป็นการลงทุนธีม AI แบบ <b>กระจายความเสี่ยง</b> ที่มีฐานในสหรัฐฯ ไม่ผูกติดกับผลประกอบการของบริษัทใดบริษัทหนึ่ง หรือข่าวของสัปดาห์ใดสัปดาห์หนึ่ง","ทองคำอ่อนตัวลงเล็กน้อยช่วงสุดสัปดาห์ (ราว $4,444 ลดลง 0.61%) แม้สงครามเรือบรรทุกน้ำมันอิหร่านจะทวีความรุนแรงขึ้นอย่างชัดเจนและราคาน้ำมันพุ่งขึ้นราว 10% เป็นสัญญาณว่าแรงซื้อสินทรัพย์ปลอดภัยอาจตามหลังแรงกระแทกภูมิรัฐศาสตร์ที่เคลื่อนไหวเร็ว นำเสนอสิ่งนี้เป็นจังหวะเข้าซื้อ — เมื่อความเสี่ยงเงินเฟ้อจากน้ำมันที่จับต้องได้จริงมาซ้อนทับบนความไม่แน่นอนของเฟด ทองคำควรอยู่ในพอร์ตเป็นตัวถ่วงสมดุลสำหรับความเสี่ยงทั้งสองเรื่อง ไม่ใช่แค่การเก็งกำไรจากการลดดอกเบี้ย","จับคู่กองทุนเติบโตกับตราสารหนี้ เพื่อไม่ให้ลูกค้าทุ่มไปกับความผันผวนทั้งหมด"]}},
    {h:{en:"Selling insurance (Prudential)",th:"การขายประกัน (Prudential)"}, li:{en:["Choppy markets = the perfect moment for <b>guaranteed / protected</b> outcomes.","Use volatility to introduce capital protection and legacy planning.","Position insurance as the \"sleep-at-night\" layer beneath the investments."], th:["ตลาดผันผวน = จังหวะเหมาะสำหรับผลตอบแทนแบบ <b>การันตี / คุ้มครอง</b>","ใช้ความผันผวนเปิดเรื่องการคุ้มครองเงินต้นและการวางแผนส่งต่อมรดก","วางประกันเป็นชั้น \"นอนหลับสบาย\" ที่รองรับการลงทุน"]}},
  ];

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('s-prices').textContent=t(S.sPrices); $('h-prices').textContent=t(S.hPrices); $('pricenote').textContent=t(S.pricenote);
    $('b-sell').textContent=t(S.bSell); $('s-funds').textContent=t(S.sFunds); $('h-funds').textContent=t(S.hFunds);
    $('sh-off').innerHTML=`${t(S.shOff)} <small>${t(S.shOffSub)}</small>`; $('sh-on').innerHTML=`${t(S.shOn)} <small>${t(S.shOnSub)}</small>`;
    $('s-talk').textContent=t(S.sTalk); $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`<div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div><div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div><div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน และค่าเงิน':'US Treasuries, gold, oil & FX',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p>${f.now?`<div class="fnow"><span>${L==='th'?'ทำไมตอนนี้':'Why now'}</span>${t(f.now)}</div>`:''}<div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');
    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
