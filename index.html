<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"AI Rebound Lifts Wall Street and the DAX to Records-Area Gains a Day After Hot CPI — S&P 500 +1.3%, Nasdaq +1.6% as Hormuz Mine Blasts Nudge Oil Back Above $92", th:"หุ้นกลุ่ม AI ฟื้น ดันวอลล์สตรีทและ DAX บวกแรงหนึ่งวันหลัง CPI ร้อนแรง — S&P 500 +1.3%, Nasdaq +1.6% ขณะเหตุระเบิดทุ่นระเบิดในฮอร์มุซดันน้ำมันกลับเหนือ $92"},
    heroDeck:{en:`Stocks shrugged off Tuesday's hot CPI on Wednesday. With the US bond market shut for Veterans Day (yields unchanged at 4.73% 2-year, 4.98% 10-year), equities rallied on renewed AI enthusiasm led by a CoreWeave jump: the S&P 500 rose 1.31% to 7,619.38, the Nasdaq 1.6% to 25,466.19 and the Dow 0.49% to 52,486.49. Germany's DAX closed at a record 26,662.77 (+1.20%) on Siemens Energy, and the Nikkei hit 61,248.59 (+1.31%). Oil bounced: Iran's Revolutionary Guards said two tankers hit naval mines in the Strait of Hormuz, lifting Brent back to about $92.5 from Tuesday's $91.49. Gold steadied near $4,040 after Tuesday's 2.6% drop. A December Fed hike is still near-certain (CME ~89% for 25bp, with a 50bp move debated).`, th:`วันพุธหุ้นไม่สนใจ CPI ที่ร้อนแรงเมื่อวันอังคาร ตลาดบอนด์สหรัฐฯ ปิดเนื่องในวันทหารผ่านศึก (ผลตอบแทนคงที่ บอนด์ 2 ปี 4.73% และ 10 ปี 4.98%) หุ้นบวกแรงจากความคึกคักรอบใหม่ของธีม AI นำโดยหุ้น CoreWeave ที่พุ่ง: S&P 500 ขึ้น 1.31% สู่ 7,619.38, Nasdaq ขึ้น 1.6% สู่ 25,466.19 และ Dow ขึ้น 0.49% สู่ 52,486.49 ดัชนี DAX เยอรมนีปิดที่ระดับสูงสุดเป็นประวัติการณ์ 26,662.77 (+1.20%) จากหุ้น Siemens Energy และ Nikkei ขึ้นสู่ 61,248.59 (+1.31%) น้ำมันเด้งกลับ: กองกำลังพิทักษ์การปฏิวัติอิหร่านบอกว่าเรือบรรทุกน้ำมัน 2 ลำชนทุ่นระเบิดในช่องแคบฮอร์มุซ ดัน Brent กลับไปราว $92.5 จาก $91.49 ของวันอังคาร ทองคำทรงตัวราว $4,040 หลังร่วง 2.6% วันอังคาร การที่เฟดจะขึ้นดอกเบี้ยในเดือนธันวาคมยังแทบแน่นอน (CME ให้โอกาสขึ้น 0.25% ราว 89% และยังมีการถกเรื่อง 0.50%)`},

    dbNext:{en:"Next update", th:"อัปเดตถัดไป"}, dbNextVal:{en:"Watch how Treasuries reprice the hot CPI when the bond market reopens Thursday (10-year vs 5%), Thursday's 30-year auction and PPI, whether Asia and the SET follow Wall Street's AI rebound, and whether the Hormuz mine incidents derail Iran peace hopes.", th:"จับตาว่าบอนด์สหรัฐฯ จะตอบรับ CPI ที่ร้อนแรงอย่างไรเมื่อตลาดบอนด์เปิดวันพฤหัสฯ (บอนด์ 10 ปีเทียบกับ 5%), การประมูลบอนด์ 30 ปีและตัวเลข PPI, ตลาดเอเชียและ SET จะบวกตามหุ้น AI สหรัฐฯ หรือไม่ และเหตุทุ่นระเบิดในฮอร์มุซจะทำให้ความหวังสันติภาพกับอิหร่านสะดุดหรือไม่"},

    leadtxt:{en:`<b>Risk appetite bounced back fast.</b> One day after a hot CPI, an <b>AI-led rebound</b> lifted the S&P 500 1.31% to 7,619.38 and the Nasdaq 1.6%, more than reversing Tuesday's losses; the <b>DAX closed at a record</b> and the Nikkei rose 1.31%. But the <b>rate risk has not gone away</b>: the bond market was closed for Veterans Day, so yields (10-year 4.98%, 2-year 4.73%) have not yet traded on the CPI follow-through, and a December Fed hike remains near-certain with 50bp still debated. <b>Oil is back in play</b> — tanker mine strikes in Hormuz pushed Brent back to ~$92.5. Tariffs stay under Section 301 despite the Democratic Congress. <b>For clients: enjoy the rebound but don't chase it — keep short-duration bonds as the anchor and add to quality/tech only on dips; Thursday's bond reopening is the real test.</b>`, th:`<b>ความกล้าเสี่ยงกลับมาเร็ว</b> หนึ่งวันหลัง CPI ร้อนแรง <b>หุ้นกลุ่ม AI ฟื้นตัว</b> ดัน S&P 500 ขึ้น 1.31% สู่ 7,619.38 และ Nasdaq ขึ้น 1.6% มากกว่าที่ลดลงไปวันอังคาร <b>DAX ปิดที่ระดับสูงสุดเป็นประวัติการณ์</b> และ Nikkei ขึ้น 1.31% แต่<b>ความเสี่ยงด้านดอกเบี้ยยังไม่หายไป</b>: ตลาดบอนด์ปิดเนื่องในวันทหารผ่านศึก ผลตอบแทน (บอนด์ 10 ปี 4.98%, 2 ปี 4.73%) จึงยังไม่ได้ซื้อขายต่อจาก CPI และเฟดยังแทบแน่นอนว่าจะขึ้นดอกเบี้ยในเดือนธันวาคม โดยยังถกกันเรื่อง 0.50% <b>น้ำมันกลับมาเป็นประเด็น</b> — เรือบรรทุกน้ำมันชนทุ่นระเบิดในฮอร์มุซ ดัน Brent กลับไปราว $92.5 ภาษีนำเข้ายังอยู่ภายใต้มาตรา 301 แม้รัฐสภาจะเป็นของเดโมแครต <b>สำหรับลูกค้า: รับประโยชน์จากการฟื้นตัว แต่อย่าไล่ซื้อ — ใช้ตราสารหนี้อายุสั้นเป็นแกนหลัก และทยอยเพิ่มหุ้นคุณภาพ/เทคเมื่อราคาย่อ วันพฤหัสฯ ที่ตลาดบอนด์เปิดคือบททดสอบจริง</b>`},

    watchnote:{en:`Stocks rebounded strongly on AI enthusiasm (S&P 500 +1.31%, Nasdaq +1.6%, DAX record), but Treasuries were closed for Veterans Day and have not yet traded on the hot October CPI. A December Fed hike is near-certain (CME ~89% for 25bp) and Waller has floated 50bp. Oil firmed to ~$92.5 after tanker mine strikes in Hormuz. The three things that matter most: how yields react when bonds reopen Thursday (alongside the 30-year auction and PPI), the size of the December hike, and whether the Hormuz incidents derail an Iran deal.`,
      th:`หุ้นฟื้นตัวแรงจากธีม AI (S&P 500 +1.31%, Nasdaq +1.6%, DAX ทำสถิติใหม่) แต่ตลาดบอนด์สหรัฐฯ ปิดเนื่องในวันทหารผ่านศึกและยังไม่ได้ซื้อขายตอบรับ CPI เดือน ต.ค. ที่ร้อนแรง การที่เฟดจะขึ้นดอกเบี้ยในเดือนธันวาคมแทบแน่นอน (CME ให้โอกาสขึ้น 0.25% ราว 89%) และ Waller เปิดทางให้ 0.50% น้ำมันขยับขึ้นสู่ราว $92.5 หลังเรือบรรทุกน้ำมันชนทุ่นระเบิดในฮอร์มุซ 3 เรื่องสำคัญที่สุด: ผลตอบแทนบอนด์จะตอบสนองอย่างไรเมื่อตลาดเปิดวันพฤหัสฯ (พร้อมการประมูลบอนด์ 30 ปีและ PPI), เฟดจะขึ้นดอกเบี้ยมากแค่ไหนในเดือนธันวาคม และเหตุในฮอร์มุซจะทำให้ข้อตกลงกับอิหร่านสะดุดหรือไม่`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,619.38", chg:1.31, series:[7520.93,7619.38],
      txt:{en:`<b>US stocks rebounded Wednesday on renewed AI enthusiasm: the S&P 500 rose 1.31% to 7,619.38, the Nasdaq Composite gained 1.6% to 25,466.19, and the Dow added 0.49% (+254.60 pts) to 52,486.49.</b> CoreWeave's jump calmed AI-debt worries; small caps (Russell 2000) rose 0.88%.`, th:`<b>หุ้นสหรัฐฯ ฟื้นตัววันพุธจากความคึกคักรอบใหม่ของธีม AI: S&P 500 ขึ้น 1.31% สู่ 7,619.38, Nasdaq ขึ้น 1.6% สู่ 25,466.19 และ Dow ขึ้น 0.49% (+254.60 จุด) สู่ 52,486.49</b> หุ้น CoreWeave ที่พุ่งช่วยคลายความกังวลเรื่องหนี้ของบริษัท AI ส่วนหุ้นขนาดเล็ก (Russell 2000) ขึ้น 0.88%`},
      why:{en:`The rally more than erased Tuesday's CPI losses, showing investors still buy AI dips. But it came on a day the bond market was shut for Veterans Day, so stocks have not yet faced a live reaction from Treasuries. If yields push above 5% when bonds reopen Thursday, high-valuation tech is again the most exposed.`, th:`การขึ้นครั้งนี้มากกว่าที่ลดลงจาก CPI วันอังคาร แสดงว่านักลงทุนยังซื้อหุ้น AI เมื่อราคาย่อ แต่เกิดในวันที่ตลาดบอนด์ปิดเนื่องในวันทหารผ่านศึก หุ้นจึงยังไม่ได้เจอปฏิกิริยาจริงจากบอนด์ ถ้าผลตอบแทนพุ่งเกิน 5% เมื่อตลาดบอนด์เปิดวันพฤหัสฯ หุ้นเทคที่ราคาแพงจะเสี่ยงที่สุดอีกครั้ง`},
      full:{en:`US stocks closed higher Wednesday, November 11, in a full regular session while the bond market was closed for Veterans Day. The S&P 500 rose 1.31% to 7,619.38, the Nasdaq Composite gained 1.6% to 25,466.19, and the Dow Jones Industrial Average added 254.60 points (+0.49%) to 52,486.49. The Russell 2000 rose 0.88%. The gains were tied to renewed enthusiasm for AI infrastructure, with a sharp rise in CoreWeave cited as a driver after it eased concerns about its debt. The rebound followed Tuesday's decline on hotter-than-expected October CPI (headline +0.4%, core +0.3%). Treasury yields did not trade; the last closes were 4.73% on the 2-year, 4.98% on the 10-year and 5.35% on the 30-year. CME FedWatch showed about an 89% chance of a 25bp December hike.`, th:`หุ้นสหรัฐฯ ปิดบวกวันพุธที่ 11 พ.ย. โดยตลาดหุ้นเปิดเต็มวันตามปกติ ขณะที่ตลาดบอนด์ปิดเนื่องในวันทหารผ่านศึก S&P 500 ขึ้น 1.31% สู่ 7,619.38, Nasdaq ขึ้น 1.6% สู่ 25,466.19 และ Dow ขึ้น 254.60 จุด (+0.49%) สู่ 52,486.49 Russell 2000 ขึ้น 0.88% การขึ้นมาจากความคึกคักรอบใหม่ของหุ้นโครงสร้างพื้นฐาน AI โดยหุ้น CoreWeave ที่พุ่งแรงช่วยคลายความกังวลเรื่องหนี้ การฟื้นตัวเกิดหลังวันอังคารที่ตลาดลดลงจาก CPI เดือน ต.ค. ที่สูงกว่าคาด (ทั่วไป +0.4%, พื้นฐาน +0.3%) ผลตอบแทนบอนด์ไม่มีการซื้อขาย ราคาปิดล่าสุดคือบอนด์ 2 ปี 4.73%, 10 ปี 4.98% และ 30 ปี 5.35% CME FedWatch ให้โอกาสราว 89% ที่เฟดจะขึ้นดอกเบี้ย 0.25% ในเดือนธันวาคม`},
      sources:[{l:"CNBC — Stock market news for Nov. 11, 2026",u:"https://www.cnbc.com/2026/11/10/stock-market-today-live-updates.html"},{l:"Coinpaper — Is the stock market open on Veterans Day?",u:"https://coinpaper.com/38657/is-the-stock-market-open-on-veterans-day-what-investors-need-to-know"},{l:"Investing.com — Fed rate hike odds in December at 88% after hot CPI",u:"https://investing.com/news/economy-news/fed-rate-hike-odds-in-december-at-88-after-hot-cpi-cme-fedwatch-5017585"}]},

      txt:{en:`<b>Germany's DAX jumped 1.20% (+315.32 pts) to a record close of 26,662.77 Wednesday,</b> led by Siemens Energy after record results. The STOXX 600 also closed at a record (663.05, +0.72%).`, th:`<b>ดัชนี DAX เยอรมนีพุ่ง 1.20% (+315.32 จุด) ปิดที่ระดับสูงสุดเป็นประวัติการณ์ 26,662.77 วันพุธ</b> นำโดยหุ้น Siemens Energy หลังรายงานผลประกอบการสูงสุดเป็นประวัติการณ์ ดัชนี STOXX 600 ก็ปิดที่ระดับสูงสุดเช่นกัน (663.05, +0.72%)`},
      why:{en:`Europe is the cleanest beneficiary of the AI-power theme right now: Siemens Energy sells the turbines and grid gear data centres need. A record close despite the hot US CPI shows the trend is strong, though rising oil and US yield risk capped gains late in the day.`, th:`ยุโรปได้ประโยชน์ชัดเจนที่สุดจากธีมพลังงานสำหรับ AI ตอนนี้: Siemens Energy ขายกังหันและอุปกรณ์โครงข่ายไฟฟ้าที่ดาต้าเซ็นเตอร์ต้องใช้ การปิดที่ระดับสูงสุดแม้ CPI สหรัฐฯ จะร้อนแรง แสดงว่าแนวโน้มยังแข็งแรง แต่ราคาน้ำมันที่ขึ้นและความเสี่ยงจากบอนด์สหรัฐฯ จำกัดการขึ้นช่วงท้ายวัน`},
      full:{en:`Germany's DAX closed at 26,662.77 on Wednesday, November 11, up 315.32 points (+1.20%) from Tuesday's 26,347.45, topping its previous closing high of 26,569.99 from August 28 (the intraday record of 26,692.90 from November 5 still stands). Siemens Energy was the standout, rising about 6.9% after record 2026 results. Across Europe, the STOXX 600 rose 0.72% to a record 663.05, the EURO STOXX 50 gained 1.04%, the FTSE 100 rose 0.78% to 10,835.47 and the CAC 40 added 0.66%. Higher US inflation expectations and rising oil capped gains.`, th:`ดัชนี DAX เยอรมนีปิดที่ 26,662.77 วันพุธที่ 11 พ.ย. เพิ่มขึ้น 315.32 จุด (+1.20%) จาก 26,347.45 ของวันอังคาร สูงกว่าระดับปิดสูงสุดเดิม 26,569.99 เมื่อ 28 ส.ค. (สถิติระหว่างวัน 26,692.90 เมื่อ 5 พ.ย. ยังไม่ถูกทำลาย) Siemens Energy โดดเด่นที่สุด ขึ้นราว 6.9% หลังรายงานผลประกอบการปี 2026 สูงสุดเป็นประวัติการณ์ ทั่วยุโรป STOXX 600 ขึ้น 0.72% สู่ระดับสูงสุด 663.05, EURO STOXX 50 ขึ้น 1.04%, FTSE 100 ขึ้น 0.78% สู่ 10,835.47 และ CAC 40 ขึ้น 0.66% ความคาดหวังเงินเฟ้อสหรัฐฯ ที่สูงขึ้นและราคาน้ำมันที่ขึ้นจำกัดการบวก`},
      sources:[{l:"ad-hoc-news — DAX closes 1.20% higher at 26,662.77 points",u:"https://www.ad-hoc-news.de/boerse/news/marktberichte/dax-closes-1-20-prozent-higher-at-26-662-77-points/70494371"},{l:"Panthere Group — European markets finish broadly higher on Wednesday",u:"https://www.pantheregroup.com/2026/11/11/european-markets-finish-broadly-higher-on-wednesday/"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"61,248.59", chg:1.31, series:[60459.58,61248.59],
      txt:{en:`<b>Tokyo's Nikkei 225 rose 1.31% (+789.01 pts) to 61,248.59 Wednesday,</b> a third straight gain led by chip stocks, while SoftBank lagged after a quarterly loss.`, th:`<b>ดัชนี Nikkei 225 ญี่ปุ่นขึ้น 1.31% (+789.01 จุด) สู่ 61,248.59 วันพุธ</b> บวกเป็นวันที่ 3 ติดกัน นำโดยหุ้นชิป ขณะที่ SoftBank ยังอ่อนตัวหลังรายงานขาดทุนรายไตรมาส`},
      why:{en:`Japan shrugged off the hot US CPI and kept climbing on the chip theme, and Wall Street's AI rebound overnight supports that. The Nikkei is now well above 60,000, so it is stretched; a jump in US yields or oil (Japan imports almost all its oil) are the main risks.`, th:`ญี่ปุ่นไม่สนใจ CPI สหรัฐฯ ที่ร้อนแรงและขึ้นต่อจากธีมชิป และการฟื้นตัวของหุ้น AI สหรัฐฯ เมื่อคืนก็ช่วยหนุน Nikkei ตอนนี้อยู่เหนือ 60,000 ไปมาก จึงค่อนข้างตึงตัว ความเสี่ยงหลักคือผลตอบแทนบอนด์สหรัฐฯ หรือราคาน้ำมันที่พุ่งขึ้น (ญี่ปุ่นนำเข้าน้ำมันเกือบทั้งหมด)`},
      full:{en:`The Nikkei 225 closed at 61,248.59 on Wednesday, November 11, up 789.01 points (+1.31%) from Tuesday's 60,459.58, its third consecutive daily gain. Semiconductor shares led the advance as chip stocks rebounded, while SoftBank remained under pressure after its quarterly loss.`, th:`Nikkei 225 ปิดที่ 61,248.59 วันพุธที่ 11 พ.ย. เพิ่มขึ้น 789.01 จุด (+1.31%) จาก 60,459.58 ของวันอังคาร บวกเป็นวันที่ 3 ติดกัน หุ้นเซมิคอนดักเตอร์นำการขึ้นจากการฟื้นตัวของหุ้นชิป ขณะที่ SoftBank ยังถูกกดดันหลังรายงานขาดทุนรายไตรมาส`},
      sources:[{l:"ad-hoc-news — Nikkei 225 rises 1.31 percent to 61,248.59 as chip stocks rebound",u:"https://www.ad-hoc-news.de/boerse/news/marktberichte/nikkei-225-rises-1-31-percent-to-61-248-59-as-chip-stocks-rebound/70494391"},{l:"BBN Times — Nikkei 225 rises to 61,248.59 for a third straight gain",u:"https://www.bbntimes.com/financial/nikkei-225-rises-to-61-248-59-for-a-third-straight-gain-as-chip-stocks-rally"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,315.92", chg:-0.98, series:[24557.04,24315.92],
      txt:{en:`<b>Hong Kong's Hang Seng fell 0.98% to 24,315.92 Wednesday as tech weakened (Hang Seng Tech −1.41%), while the Shanghai Composite rose 0.46% to 3,680.64.</b>`, th:`<b>ดัชนี Hang Seng ฮ่องกงลดลง 0.98% สู่ 24,315.92 วันพุธ จากหุ้นเทคที่อ่อนตัว (Hang Seng Tech −1.41%) ขณะที่ Shanghai Composite ขึ้น 0.46% สู่ 3,680.64</b>`},
      why:{en:`Hong Kong was the one major market that reacted to the hot US CPI: its dollar is pegged to the US dollar, so higher US rates tighten local financial conditions, and HK tech is the most rate-sensitive part. Mainland China held up on its own tech and robotics buying, a sign the two markets are moving on different drivers.`, th:`ฮ่องกงเป็นตลาดใหญ่ตลาดเดียวที่ตอบสนองต่อ CPI สหรัฐฯ ที่ร้อนแรง เพราะเงินดอลลาร์ฮ่องกงผูกค่ากับดอลลาร์สหรัฐฯ ดอกเบี้ยสหรัฐฯ ที่สูงขึ้นจึงทำให้สภาพคล่องในฮ่องกงตึงขึ้น และหุ้นเทคฮ่องกงไวต่อดอกเบี้ยที่สุด ส่วนจีนแผ่นดินใหญ่ยังทรงตัวได้จากแรงซื้อหุ้นเทคและหุ่นยนต์ในประเทศ แสดงว่าสองตลาดเคลื่อนไหวด้วยปัจจัยต่างกัน`},
      full:{en:`Hong Kong's Hang Seng Index closed at 24,315.92 on Wednesday, down 0.98% from Tuesday's 24,557.04, as technology shares weakened and the Hang Seng Tech Index fell 1.41%. In mainland China, the Shanghai Composite rose 16.92 points (+0.46%) to 3,680.64, led by technology stocks, with turnover rising to about 1.68 trillion yuan.`, th:`ดัชนี Hang Seng ฮ่องกงปิดที่ 24,315.92 วันพุธ ลดลง 0.98% จาก 24,557.04 ของวันอังคาร จากหุ้นเทคที่อ่อนตัว โดยดัชนี Hang Seng Tech ลดลง 1.41% ส่วนจีนแผ่นดินใหญ่ Shanghai Composite ขึ้น 16.92 จุด (+0.46%) สู่ 3,680.64 นำโดยหุ้นเทค มูลค่าซื้อขายเพิ่มขึ้นสู่ราว 1.68 ล้านล้านหยวน`},
      sources:[{l:"ad-hoc-news — Hang Seng closes at 24,315.92, down 0.98 percent",u:"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-at-24-315-92-down-0-98-percent/70494407"},{l:"ad-hoc-news — Shanghai Composite closes 0.46% higher at 3,680.64",u:"https://www.ad-hoc-news.de/boerse/news/marktberichte/shanghai-composite-closes-0-46-prozent-higher-at-3-680-64-points/70494397"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,502.11", chg:0.39, series:[1496.31,1502.11],
      txt:{en:`<b>SET Index edged up 0.39% (+5.80 pts) to 1,502.11 Wednesday</b> on turnover of about THB 56.79bn, closing back above 1,500 as energy and petrochemicals offset heavy selling in yield-play stocks.`, th:`<b>ดัชนี SET ขยับขึ้น 0.39% (+5.80 จุด) สู่ 1,502.11 วันพุธ</b> มูลค่าซื้อขายราว 56,790 ล้านบาท ปิดกลับเหนือ 1,500 จุด โดยหุ้นพลังงานและปิโตรเคมีช่วยชดเชยแรงขายหนักในหุ้นปันผลสูง`},
      why:{en:`Holding above 1,500 after the hot US CPI is a decent sign, but the mix matters: yield-play stocks (utilities, REIT-like names) were sold because higher US rates make their dividends less attractive, while energy gained on the oil bounce. Lower turnover than Tuesday suggests caution rather than fresh buying.`, th:`การยืนเหนือ 1,500 ได้หลัง CPI สหรัฐฯ ร้อนแรงถือเป็นสัญญาณที่ดีพอสมควร แต่ต้องดูองค์ประกอบ: หุ้นปันผลสูง (สาธารณูปโภค และหุ้นคล้ายกองรีท) ถูกขาย เพราะดอกเบี้ยสหรัฐฯ ที่สูงขึ้นทำให้เงินปันผลน่าสนใจน้อยลง ขณะที่หุ้นพลังงานขึ้นตามน้ำมัน มูลค่าซื้อขายที่ต่ำกว่าวันอังคารบ่งบอกถึงความระมัดระวังมากกว่าแรงซื้อใหม่`},
      full:{en:`Thailand's SET Index rose 5.80 points (+0.39%) to close at 1,502.11 on Wednesday, with turnover of about THB 56.79 billion. Kaohoon International's analyst said the market steadied despite heavy selling in yield-play stocks and sell-on-fact trading after 3Q26 earnings, with energy and petrochemicals providing support. For 12 November the analyst expects a range of 1,494–1,506, with the MSCI index review and a SET/TFEX trading-guideline revision on 16 November as catalysts to watch.`, th:`ดัชนี SET เพิ่มขึ้น 5.80 จุด (+0.39%) ปิดที่ 1,502.11 วันพุธ มูลค่าซื้อขายราว 56,790 ล้านบาท นักวิเคราะห์ของ Kaohoon International ระบุว่าตลาดทรงตัวได้แม้มีแรงขายหนักในหุ้นปันผลสูงและแรงขายหลังประกาศงบไตรมาส 3/2569 โดยหุ้นพลังงานและปิโตรเคมีช่วยหนุน สำหรับวันที่ 12 พ.ย. นักวิเคราะห์คาดกรอบ 1,494–1,506 จุด ปัจจัยที่ต้องจับตาคือการปรับดัชนี MSCI และการปรับเกณฑ์การซื้อขายของ SET/TFEX วันที่ 16 พ.ย.`},
      sources:[{l:"Kaohoon International — Market Roundup 11 November 2026",u:"https://www.kaohooninternational.com/markets/594468"},{l:"Kaohoon International — Top 20 Gainers and Losers of SET 100 on 11 November 2026",u:"https://www.kaohooninternational.com/markets/594490"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil bounced Wednesday: Brent rose about 1% to roughly $92.5/bbl (from Tuesday's $91.49) after Iran's Revolutionary Guards said two tankers caught fire after hitting naval mines in the Strait of Hormuz; WTI was about $86–87.</b> Gold steadied near $4,040/oz after a 2.6% CPI-driven drop on Tuesday.`, th:`<b>น้ำมันเด้งกลับวันพุธ: Brent ขึ้นราว 1% สู่ราว $92.5 ต่อบาร์เรล (จาก $91.49 วันอังคาร) หลังกองกำลังพิทักษ์การปฏิวัติอิหร่านบอกว่าเรือบรรทุกน้ำมัน 2 ลำเกิดไฟไหม้หลังชนทุ่นระเบิดในช่องแคบฮอร์มุซ WTI อยู่ราว $86–87</b> ทองคำทรงตัวราว $4,040 ต่อออนซ์ หลังร่วง 2.6% วันอังคารจาก CPI`},
     why:{en:`The mine incidents are a reminder that even with a peace deal, shipping through Hormuz won't normalise quickly — clearance, insurance and owner caution all take time (LSEG). That keeps a floor under oil. Gold is still squeezed by high real yields, but the renewed Hormuz risk and sticky inflation give it support around $4,000.`, th:`เหตุทุ่นระเบิดเตือนว่าแม้จะมีข้อตกลงสันติภาพ การขนส่งผ่านฮอร์มุซจะไม่กลับเป็นปกติเร็ว — การเก็บกู้ทุ่นระเบิด ค่าประกันภัย และความระมัดระวังของเจ้าของเรือต้องใช้เวลา (LSEG) ราคาน้ำมันจึงมีพื้นรองรับ ทองคำยังถูกกดจากผลตอบแทนที่แท้จริงที่สูง แต่ความเสี่ยงในฮอร์มุซที่กลับมาและเงินเฟ้อที่ยังสูงช่วยพยุงราคาไว้ราว $4,000`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>US bond market closed Wednesday for Veterans Day; last closes (Tue): 2-year 4.73%, 10-year 4.98% (briefly above 5%), 30-year 5.35%.</b> CME FedWatch shows ~89% odds of a 25bp December hike (from ~72% a week ago); Waller has said 50bp should be considered. Thursday brings a 30-year auction and PPI.`, th:`<b>ตลาดบอนด์สหรัฐฯ ปิดวันพุธเนื่องในวันทหารผ่านศึก ราคาปิดล่าสุด (วันอังคาร): บอนด์ 2 ปี 4.73%, 10 ปี 4.98% (แตะเกิน 5% ระหว่างวัน), 30 ปี 5.35%</b> CME FedWatch ให้โอกาสราว 89% ที่เฟดจะขึ้น 0.25% ในเดือนธันวาคม (จากราว 72% เมื่อสัปดาห์ก่อน) และ Waller บอกว่าควรพิจารณาขึ้น 0.50% วันพฤหัสฯ มีการประมูลบอนด์ 30 ปีและตัวเลข PPI`},
     why:{en:`Stocks rallied while bonds were shut, so the rate story is paused, not over. Thursday's reopening, a 30-year auction and PPI will show whether the 10-year breaks above 5%. For clients, short-dated bonds still offer high yields with less price risk; long-duration bonds remain exposed if a 50bp hike becomes the base case.`, th:`หุ้นบวกแรงขณะที่ตลาดบอนด์ปิด ประเด็นดอกเบี้ยจึงแค่หยุดพัก ยังไม่จบ วันพฤหัสฯ ที่ตลาดบอนด์เปิด การประมูลบอนด์ 30 ปี และ PPI จะบอกว่าบอนด์ 10 ปีจะทะลุ 5% หรือไม่ สำหรับลูกค้า ตราสารหนี้อายุสั้นยังให้ผลตอบแทนสูงโดยมีความเสี่ยงด้านราคาน้อยกว่า ส่วนบอนด์อายุยาวยังเสี่ยงหากการขึ้น 0.50% กลายเป็นกรณีหลัก`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Democrats won both the House and Senate in the Nov 3 midterms and plan a bill to undo Trump's tariffs, but the White House says it will press ahead: the tariffs now sit under Section 301 of trade law (after the Supreme Court struck down the emergency tariffs), so they don't depend on Congress. A Reuters/Ipsos poll found 62% of Americans back ending them. Expect tariffs to keep adding to goods prices.`, th:`พรรคเดโมแครตชนะทั้งสภาผู้แทนฯ และวุฒิสภาในการเลือกตั้งกลางเทอมวันที่ 3 พ.ย. และวางแผนเสนอกฎหมายยกเลิกภาษีนำเข้าของทรัมป์ แต่ทำเนียบขาวยืนยันจะเดินหน้าต่อ เพราะภาษีถูกย้ายไปใช้มาตรา 301 ของกฎหมายการค้า (หลังศาลสูงสุดล้มภาษีฉุกเฉิน) จึงไม่ต้องพึ่งรัฐสภา ผลสำรวจ Reuters/Ipsos พบว่าคนอเมริกัน 62% อยากให้ยกเลิก คาดว่าภาษีจะยังดันราคาสินค้าขึ้นต่อไป`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Iran peace hopes took a knock: Iran's Revolutionary Guards said two tankers caught fire after hitting naval mines on an "unauthorized route" in the Strait of Hormuz, while the US military says the strait has been cleared of mines. Brent bounced back to ~$92.5. Trump still says the war could end "fairly soon", but analysts warn that even a signed deal won't restore normal shipping quickly.`, th:`ความหวังสันติภาพกับอิหร่านสะดุด: กองกำลังพิทักษ์การปฏิวัติอิหร่านบอกว่าเรือบรรทุกน้ำมัน 2 ลำเกิดไฟไหม้หลังชนทุ่นระเบิดบน "เส้นทางที่ไม่ได้รับอนุญาต" ในช่องแคบฮอร์มุซ ขณะที่กองทัพสหรัฐฯ บอกว่าเก็บกู้ทุ่นระเบิดหมดแล้ว Brent เด้งกลับไปราว $92.5 ทรัมป์ยังบอกว่าสงครามอาจจบ "ในเร็วๆ นี้" แต่นักวิเคราะห์เตือนว่าแม้จะลงนามข้อตกลง การขนส่งก็จะไม่กลับเป็นปกติเร็ว`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`A December Fed hike is near-certain (CME ~89% for 25bp); Waller has opened the door to 50bp and Logan sees two more hikes. Treasuries were closed for Veterans Day, so the 10-year is still at 4.98% and the 2-year at 4.73% — Thursday's reopening, 30-year auction and PPI are the next test. High yields suit new bond money; long-duration bonds and expensive growth stocks stay exposed.`, th:`การที่เฟดจะขึ้นดอกเบี้ยในเดือนธันวาคมแทบแน่นอน (CME ให้โอกาสขึ้น 0.25% ราว 89%) Waller เปิดทางให้ 0.50% และ Logan มองว่าจะขึ้นอีก 2 ครั้ง ตลาดบอนด์ปิดวันทหารผ่านศึก บอนด์ 10 ปีจึงยังอยู่ที่ 4.98% และ 2 ปีที่ 4.73% — วันพฤหัสฯ ที่ตลาดเปิด การประมูลบอนด์ 30 ปี และ PPI คือบททดสอบถัดไป ผลตอบแทนที่สูงเหมาะกับเงินลงทุนใหม่ในตราสารหนี้ แต่บอนด์อายุยาวและหุ้นเติบโตที่แพงยังมีความเสี่ยง`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`October headline CPI rose 0.4% and core 0.3% (a third straight month), both above forecasts. The BLS did not publish a 12-month rate this time; one economist's estimate puts headline near 4.0% and core near 2.8% (an estimate, not official). Cheaper oil should help headline over coming months, but tariffs and sticky services keep core firm.`, th:`CPI เดือนตุลาคมขึ้น 0.4% และเงินเฟ้อพื้นฐานขึ้น 0.3% (เป็นเดือนที่ 3 ติดกัน) สูงกว่าคาดทั้งคู่ ครั้งนี้สำนักงานสถิติแรงงานไม่ได้ประกาศอัตราเทียบปี นักเศรษฐศาสตร์รายหนึ่งประมาณว่าเงินเฟ้อทั่วไปราว 4.0% และพื้นฐานราว 2.8% (เป็นค่าประมาณ ไม่ใช่ตัวเลขทางการ) น้ำมันที่ถูกลงน่าจะช่วยเงินเฟ้อทั่วไปในช่วงหลายเดือนข้างหน้า แต่ภาษีนำเข้าและราคาค่าบริการทำให้เงินเฟ้อพื้นฐานยังสูง`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
