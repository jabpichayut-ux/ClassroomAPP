<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Nasdaq Plunges 5.3% to Erase 2026 Gains as S&P 500 and Dow Enter Correction — Nvidia Sinks 14%, Anthropic Falls 8.5% on Day Two", th:"Nasdaq ดิ่ง 5.3% ลบกำไรทั้งปี 2026 S&P 500 และ Dow เข้าภาวะปรับฐาน — Nvidia ร่วง 14% Anthropic ลดลง 8.5% ในวันที่ 2"},
    heroDeck:{en:`Friday turned the AI selloff into a rout. The Nasdaq Composite fell 1,261.47 points (−5.28%) to 22,617.73, wiping out its gain for 2026; the S&P 500 lost 265.44 points (−3.70%) to 6,910.39, its seventh straight loss — the longest losing run since February 2020 — and entered a correction, down about 10% from its record and 8.6% for the week; and the Dow fell 949.73 points (−1.93%) to 48,147.33, also in correction. Nvidia dropped about 14%, its worst day in nearly two years and down about 23% for the week, on reports of an SEC probe into possible accounting issues and a California attorney-general subpoena. Anthropic (ANT) fell 8.5% on its second day to $88.91, still above its $83 IPO price. This time bonds did work as a hedge: the 10-year Treasury yield fell back below 5% (~4.91–4.94%) and the 2-year dropped about 12–13 bp to ~4.61–4.65%. Gold fell about 2.4% to ~$3,538, Bitcoin broke below $60,000, while oil rose on Middle East tensions (WTI $83.98, Brent $92.57) but still fell for a third week. Asia was hit before Wall Street opened: the Nikkei −5.06% to 56,436.65, Kospi −5.2%, Taiwan −6.2% (its worst week since 1991), Hang Seng −1.89% and Shanghai −1.22%. The DAX fell 2.60% to 24,802.78, and the SET dropped 19.36 points (−1.31%) to 1,453.28 as foreigners sold about THB 2.4bn.`, th:`วันศุกร์แรงขายหุ้น AI กลายเป็นการเทขายรุนแรง Nasdaq ลดลง 1,261.47 จุด (−5.28%) สู่ 22,617.73 ลบกำไรทั้งหมดของปี 2026 S&P 500 ลดลง 265.44 จุด (−3.70%) สู่ 6,910.39 ลดลงวันที่ 7 ติด ยาวที่สุดตั้งแต่กุมภาพันธ์ 2020 และเข้าภาวะปรับฐาน ต่ำกว่าจุดสูงสุดราว 10% และลดลง 8.6% ในสัปดาห์นี้ ส่วน Dow ลดลง 949.73 จุด (−1.93%) สู่ 48,147.33 เข้าภาวะปรับฐานเช่นกัน Nvidia ร่วงราว 14% แย่ที่สุดในรอบเกือบ 2 ปี และลดลงราว 23% ในสัปดาห์นี้ จากรายงานว่า ก.ล.ต. สหรัฐฯ (SEC) สอบสวนประเด็นบัญชีที่อาจมีปัญหา และอัยการสูงสุดแคลิฟอร์เนียออกหมายเรียก Anthropic (ANT) ลดลง 8.5% ในวันที่ 2 สู่ $88.91 ยังสูงกว่าราคา IPO $83 ครั้งนี้บอนด์ช่วยป้องกันความเสี่ยงได้: ผลตอบแทนบอนด์สหรัฐฯ 10 ปีกลับลงต่ำกว่า 5% (ราว 4.91–4.94%) และ 2 ปีลดลงราว 0.12–0.13% สู่ราว 4.61–4.65% ทองคำลดลงราว 2.4% สู่ราว $3,538 Bitcoin หลุด $60,000 ส่วนน้ำมันขึ้นจากความตึงเครียดในตะวันออกกลาง (WTI $83.98 Brent $92.57) แต่ยังลดลงเป็นสัปดาห์ที่ 3 เอเชียโดนก่อนวอลล์สตรีทเปิด: Nikkei −5.06% สู่ 56,436.65 Kospi −5.2% ไต้หวัน −6.2% (สัปดาห์ที่แย่ที่สุดตั้งแต่ปี 1991) Hang Seng −1.89% และเซี่ยงไฮ้ −1.22% DAX ลดลง 2.60% สู่ 24,802.78 และ SET ลดลง 19.36 จุด (−1.31%) สู่ 1,453.28 โดยต่างชาติขายสุทธิราว 2,400 ล้านบาท`},

    dbNext:{en:"Next", th:"ถัดไป"}, dbNextVal:{en:"Watch whether the S&P 500 can stop a seven-day losing run on Monday, more detail on the reported SEC probe into Nvidia, whether Anthropic (ANT) holds its $83 IPO price, US data before the Thanksgiving holiday (markets shut Thu 26 Nov), and whether falling yields pull back December Fed-hike bets.", th:"จับตาว่า S&P 500 จะหยุดการลดลง 7 วันติดได้ในวันจันทร์หรือไม่ รายละเอียดเพิ่มเติมเรื่องการสอบสวน Nvidia ของ SEC ที่มีรายงาน Anthropic (ANT) จะยืนเหนือราคา IPO $83 ได้หรือไม่ ตัวเลขเศรษฐกิจสหรัฐฯ ก่อนวันหยุด Thanksgiving (ตลาดปิดวันพฤหัสฯ ที่ 26 พ.ย.) และผลตอบแทนบอนด์ที่ลดลงจะลดการคาดการณ์ว่าเฟดจะขึ้นดอกเบี้ยเดือนธันวาคมหรือไม่"},

    leadtxt:{en:`<b>The AI selloff became a rout on Friday: the Nasdaq fell 5.28% and erased its 2026 gain, and the S&P 500 and Dow both entered a correction.</b> The <b>S&P 500 lost 3.70% to 6,910.39</b> for a <b>seventh straight loss</b> (−8.6% on the week), the <b>Dow fell 949.73 points (−1.93%) to 48,147</b>, and the <b>Nasdaq dropped to 22,617.73</b>. <b>Nvidia sank about 14%</b> on reports of an SEC accounting probe, and <b>Anthropic fell 8.5% to $88.91</b>, just above its $83 IPO price. The big change: <b>bonds finally rallied — the 10-year fell back below 5% (~4.92%) and the 2-year ~4.63%</b>. <b>Gold fell ~2.4% to ~$3,538</b>, <b>oil rose (WTI $83.98)</b>. Asia was hit hard (<b>Nikkei −5.06%</b>, Taiwan −6.2%), and the <b>SET fell 1.31% to 1,453.28</b> with foreigners selling ~THB 2.4bn. <b>For you:</b> quality bond income is now both earning and protecting, stay patient on tech until the forced selling ends, and keep gold small while it still falls with stocks.`, th:`<b>แรงขายหุ้น AI กลายเป็นการเทขายรุนแรงวันศุกร์: Nasdaq ลดลง 5.28% ลบกำไรทั้งปี 2026 และ S&P 500 กับ Dow เข้าภาวะปรับฐานทั้งคู่</b> <b>S&P 500 ลดลง 3.70% สู่ 6,910.39</b> เป็น <b>วันที่ 7 ติด</b> (−8.6% ในสัปดาห์) <b>Dow ลดลง 949.73 จุด (−1.93%) สู่ 48,147</b> และ <b>Nasdaq ลดลงสู่ 22,617.73</b> <b>Nvidia ร่วงราว 14%</b> จากรายงานว่า SEC สอบสวนประเด็นบัญชี และ <b>Anthropic ลดลง 8.5% สู่ $88.91</b> ยังสูงกว่าราคา IPO $83 เล็กน้อย สิ่งที่เปลี่ยนไป: <b>บอนด์ขึ้นราคาในที่สุด — 10 ปีกลับลงต่ำกว่า 5% (ราว 4.92%) และ 2 ปีราว 4.63%</b> <b>ทองคำลดลงราว 2.4% สู่ราว $3,538</b> <b>น้ำมันขึ้น (WTI $83.98)</b> เอเชียโดนหนัก (<b>Nikkei −5.06%</b> ไต้หวัน −6.2%) และ <b>SET ลดลง 1.31% สู่ 1,453.28</b> โดยต่างชาติขายราว 2,400 ล้านบาท <b>สำหรับคุณ:</b> รายได้จากบอนด์คุณภาพตอนนี้ทั้งให้ผลตอบแทนและช่วยป้องกันพอร์ต รอให้แรงขายแบบบังคับขายหุ้นเทคจบก่อน และถือทองคำสัดส่วนเล็กขณะที่ยังลดลงพร้อมหุ้น`},

    watchnote:{en:`Friday capped the worst week of the slide: the Nasdaq fell 5.28% and erased its 2026 gain, the S&P 500 (−3.70%, seventh straight loss) and Dow (−1.93%) entered a correction, and Nvidia sank about 14%. Bonds rallied, pushing the 10-year back below 5%. The three things that matter most now: whether stocks find a floor in a holiday-shortened week, what comes out of the reported Nvidia probe, and whether falling yields soften the Fed's December hike.`,
      th:`วันศุกร์ปิดสัปดาห์ที่แย่ที่สุดของรอบนี้: Nasdaq ลดลง 5.28% ลบกำไรทั้งปี 2026 S&P 500 (−3.70% ลดลงวันที่ 7 ติด) และ Dow (−1.93%) เข้าภาวะปรับฐาน และ Nvidia ร่วงราว 14% บอนด์ขึ้นราคา ดันผลตอบแทน 10 ปีกลับลงต่ำกว่า 5% สามเรื่องที่สำคัญที่สุดตอนนี้: หุ้นจะหาจุดต่ำสุดได้หรือไม่ในสัปดาห์ที่มีวันหยุด ผลของการสอบสวน Nvidia ที่มีรายงาน และผลตอบแทนบอนด์ที่ลดลงจะทำให้เฟดผ่อนการขึ้นดอกเบี้ยเดือนธันวาคมหรือไม่`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"6,910.39", chg:-3.70, series:[7175.83,6910.39],
      txt:{en:`<b>US stocks plunged Friday: the Nasdaq fell 5.28% to 22,617.73, erasing its 2026 gain; the S&P 500 lost 3.70% to 6,910.39 (a seventh straight loss) and the Dow 1.93% (−949.73 pts) to 48,147.33 — both now in correction.</b> Nvidia sank about 14%; Anthropic fell 8.5% to $88.91.`, th:`<b>หุ้นสหรัฐฯ ร่วงแรงวันศุกร์: Nasdaq ลดลง 5.28% สู่ 22,617.73 ลบกำไรทั้งปี 2026 S&P 500 ลดลง 3.70% สู่ 6,910.39 (ลดลงวันที่ 7 ติด) และ Dow ลดลง 1.93% (−949.73 จุด) สู่ 48,147.33 — ทั้งคู่เข้าภาวะปรับฐานแล้ว</b> Nvidia ร่วงราว 14% Anthropic ลดลง 8.5% สู่ $88.91`},
      why:{en:`This is no longer just a Fed story. The AI trade that carried the market all year is being unwound: Nvidia's reported SEC probe hit confidence in the sector's leader, and the Anthropic IPO, rather than reviving demand, is trading back toward its offer price. The S&P 500's 8.6% weekly drop and seven-day losing run (longest since February 2020) point to forced selling. The one positive: Treasuries rallied, so markets are starting to price growth risk, which could make the Fed less aggressive.`, th:`เรื่องนี้ไม่ใช่แค่เรื่องเฟดอีกต่อไป การลงทุนธีม AI ที่พาตลาดขึ้นมาทั้งปีกำลังถูกถอนออก: รายงานว่า SEC สอบสวน Nvidia ทำให้ความเชื่อมั่นในผู้นำกลุ่มสั่นคลอน และ IPO ของ Anthropic แทนที่จะช่วยฟื้นความต้องการ กลับลดลงใกล้ราคาเสนอขาย การที่ S&P 500 ลดลง 8.6% ในสัปดาห์และลดลง 7 วันติด (ยาวที่สุดตั้งแต่กุมภาพันธ์ 2020) ชี้ว่ามีการบังคับขาย ข้อดีอย่างเดียว: บอนด์สหรัฐฯ ขึ้นราคา แสดงว่าตลาดเริ่มกังวลเรื่องการเติบโต ซึ่งอาจทำให้เฟดผ่อนความแข็งกร้าวลง`},
      full:{en:`US stocks sold off sharply on Friday, November 20. The S&P 500 fell 265.44 points (−3.70%) to 6,910.39, entering correction territory with its seventh straight daily decline — the longest losing streak since February 2020 — and an 8.6% weekly loss. The Dow Jones Industrial Average fell 949.73 points (−1.93%) to 48,147.33, also about 10% below its record, and the Nasdaq Composite dropped 1,261.47 points (−5.28%) to 22,617.73, turning negative for 2026, according to AP, CNBC and investingLive. Nvidia closed down about 14%, its worst day in almost two years and about 23% lower for the week, amid reports of an SEC probe into possible accounting issues and a California attorney-general subpoena. Anthropic (ANT) fell 8.5% to $88.91 on its second trading day, versus its $83 IPO price. The 10-year Treasury yield fell back below 5% as the front end led a rally, and Bitcoin broke below $60,000.`, th:`หุ้นสหรัฐฯ ถูกเทขายแรงวันศุกร์ที่ 20 พ.ย. S&P 500 ลดลง 265.44 จุด (−3.70%) สู่ 6,910.39 เข้าภาวะปรับฐาน ลดลงวันที่ 7 ติด ยาวที่สุดตั้งแต่กุมภาพันธ์ 2020 และลดลง 8.6% ในสัปดาห์ Dow Jones ลดลง 949.73 จุด (−1.93%) สู่ 48,147.33 ต่ำกว่าจุดสูงสุดราว 10% เช่นกัน และ Nasdaq ลดลง 1,261.47 จุด (−5.28%) สู่ 22,617.73 ติดลบสำหรับปี 2026 ตามรายงานของ AP, CNBC และ investingLive Nvidia ปิดลดลงราว 14% แย่ที่สุดในรอบเกือบ 2 ปี และลดลงราว 23% ในสัปดาห์ ท่ามกลางรายงานว่า SEC สอบสวนประเด็นบัญชีที่อาจมีปัญหา และอัยการสูงสุดแคลิฟอร์เนียออกหมายเรียก Anthropic (ANT) ลดลง 8.5% สู่ $88.91 ในวันซื้อขายที่ 2 เทียบราคา IPO $83 ผลตอบแทนบอนด์สหรัฐฯ 10 ปีกลับลงต่ำกว่า 5% โดยบอนด์ระยะสั้นนำการขึ้นราคา และ Bitcoin หลุด $60,000`},
      sources:[{l:"CNBC — S&P 500 and Dow close in correction; Nasdaq erases 2026 gain as AI rout picks up steam",u:"https://www.cnbc.com/2026/11/19/stock-market-today-live-updates.html"},{l:"Yakima Herald (AP) — How major US stock indexes fared Friday 11/20/2026",u:"https://www.yakimaherald.com/news/nation_and_world/business/how-major-us-stock-indexes-fared-friday-11-20-2026/article_963ce6d2-85a3-5fd6-981d-e60b72a58fbb.html"},{l:"Axios — Nvidia shares plunge as Anthropic can't stop the AI selloff",u:"https://www.axios.com/2026/11/20/anthropic-ipo-nvidia-ai-tech-selloff"},{l:"investingLive — Americas FX news wrap 20 Nov: Stocks get hammered as Nasdaq plunges 5.28%",u:"https://investinglive.com/news/investinglive-americas-fx-news-wrap-20-nov-stocks-get-hammered-as-nasdaq-plunges-5-28/"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"24,802.78", chg:-2.60, series:[25463.81,24802.78],
      txt:{en:`<b>Germany's DAX fell 2.60% (−661.03 pts) to 24,802.78 Friday,</b> a fifth straight loss and its first close below 25,000 in this slide, as the global tech selloff spread to Europe.`, th:`<b>ดัชนี DAX เยอรมนีลดลง 2.60% (−661.03 จุด) สู่ 24,802.78 วันศุกร์</b> ลดลงวันที่ 5 ติด และปิดต่ำกว่า 25,000 ครั้งแรกในรอบการลดลงนี้ เพราะแรงเทขายหุ้นเทคทั่วโลกลามมาถึงยุโรป`},
      why:{en:`Europe has less AI exposure than the US, but it is not escaping: the DAX is now about 8% below its 12 November record above 27,000. Lower US yields and a softer Fed path would help European shares more than US tech, so Europe may stabilise first once the selling eases.`, th:`ยุโรปมีหุ้น AI น้อยกว่าสหรัฐฯ แต่ก็หนีไม่พ้น: DAX ต่ำกว่าระดับสูงสุดเหนือ 27,000 เมื่อ 12 พ.ย. ราว 8% ผลตอบแทนบอนด์สหรัฐฯ ที่ลดลงและเฟดที่ผ่อนลงจะช่วยหุ้นยุโรปมากกว่าหุ้นเทคสหรัฐฯ ยุโรปจึงอาจทรงตัวได้ก่อนเมื่อแรงขายเบาลง`},
      full:{en:`Germany's DAX closed 661.03 points (−2.60%) lower at 24,802.78 on Friday, November 20, according to Armstrong Economics' market recap, a fifth consecutive decline. Intraday reports earlier in the session showed the index down about 1.35% near 25,119 before the losses deepened as US futures slid. The index set a record above 27,000 on November 12.`, th:`ดัชนี DAX เยอรมนีปิดลดลง 661.03 จุด (−2.60%) ที่ 24,802.78 วันศุกร์ที่ 20 พ.ย. ตามรายงานสรุปตลาดของ Armstrong Economics ลดลงวันที่ 5 ติด รายงานระหว่างวันก่อนหน้านั้นแสดงว่าดัชนีลดลงราว 1.35% ใกล้ 25,119 ก่อนที่จะลดลงมากขึ้นเมื่อฟิวเจอร์สสหรัฐฯ ร่วง ดัชนีทำสถิติสูงสุดเหนือ 27,000 เมื่อ 12 พ.ย.`},
      sources:[{l:"Armstrong Economics — Market Talk, November 20, 2026",u:"https://www.armstrongeconomics.com/market-talk/market-talk-november-20-2026/"},{l:"Trading Economics — Germany stock market (DAX)",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"56,436.65", chg:-5.06, series:[59444.21,56436.65],
      txt:{en:`<b>Tokyo's Nikkei 225 plunged 5.06% (−3,007.56 pts) to 56,436.65 Friday,</b> a seven-month low, as Asia caught up with Thursday's Wall Street reversal; Korea's Kospi fell 5.2% and Taiwan 6.2%.`, th:`<b>ดัชนี Nikkei 225 ญี่ปุ่นร่วง 5.06% (−3,007.56 จุด) สู่ 56,436.65 วันศุกร์</b> ต่ำสุดในรอบ 7 เดือน เพราะเอเชียตามการกลับตัวลงของวอลล์สตรีทเมื่อวันพฤหัสฯ Kospi เกาหลีลดลง 5.2% และไต้หวันลดลง 6.2%`},
      why:{en:`Japan, Korea and Taiwan are the markets most tied to AI chips, so they take the biggest hits when the trade unwinds — Taiwan just had its worst week since 1991. With Nvidia down another 14% after Asia closed, Monday is likely to open under more pressure. A weak yen (around 158.5 per dollar) offers exporters little help when the whole chip supply chain is being sold.`, th:`ญี่ปุ่น เกาหลี และไต้หวันเป็นตลาดที่ผูกกับชิป AI มากที่สุด จึงโดนหนักที่สุดเมื่อมีการถอนเงินจากธีมนี้ — ไต้หวันเพิ่งมีสัปดาห์ที่แย่ที่สุดตั้งแต่ปี 1991 เมื่อ Nvidia ร่วงอีก 14% หลังเอเชียปิดตลาด วันจันทร์จึงน่าจะเปิดภายใต้แรงกดดันเพิ่ม เงินเยนที่อ่อน (ราว 158.5 เยนต่อดอลลาร์) ช่วยผู้ส่งออกได้น้อยเมื่อทั้งห่วงโซ่อุปทานชิปถูกขาย`},
      full:{en:`The Nikkei 225 closed at 56,436.65 on Friday, November 20, down 3,007.56 points (−5.06%) from Thursday's 59,444.21, a seven-month low and about 23% below its 52-week high, according to 24/7 Wall St. and Armstrong Economics. South Korea's Kospi fell 5.2% and Taiwan's market dropped 6.2%, capping its worst week since 1991, in an AI-chip selloff.`, th:`Nikkei 225 ปิดที่ 56,436.65 วันศุกร์ที่ 20 พ.ย. ลดลง 3,007.56 จุด (−5.06%) จาก 59,444.21 ของวันพฤหัสฯ ต่ำสุดในรอบ 7 เดือน และต่ำกว่าจุดสูงสุดในรอบ 52 สัปดาห์ราว 23% ตามรายงานของ 24/7 Wall St. และ Armstrong Economics Kospi เกาหลีใต้ลดลง 5.2% และตลาดไต้หวันลดลง 6.2% ปิดสัปดาห์ที่แย่ที่สุดตั้งแต่ปี 1991 จากการเทขายหุ้นชิป AI`},
      sources:[{l:"24/7 Wall St. — Taiwan falls 6.2% to cap its worst week since 1991; Kospi −5.2%, Nikkei −5.1%",u:"https://247wallst.com/investing/2026/11/20/taiwan-stock-market-falls-6-2-to-cap-its-worst-week-since-1991-as-kospi-closes-down-5-2-and-nikkei-225-drops-5-1-in-ai-chip-selloff/"},{l:"Armenpress — Asian stocks down, 20/11/26",u:"https://armenpress.am/en/article/1266251"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"22,410.80", chg:-1.89, series:[22841.62,22410.80],
      txt:{en:`<b>Hong Kong's Hang Seng fell 1.89% (−430.82 pts) to 22,410.80 Friday,</b> a fourth straight loss; the Shanghai Composite dropped 1.22% to 3,533.79 as China held its lending rates.`, th:`<b>ดัชนี Hang Seng ฮ่องกงลดลง 1.89% (−430.82 จุด) สู่ 22,410.80 วันศุกร์</b> ลดลงวันที่ 4 ติด ส่วน Shanghai Composite ลดลง 1.22% สู่ 3,533.79 ขณะที่จีนคงอัตราดอกเบี้ยเงินกู้`},
      why:{en:`China and Hong Kong fell less than Japan, Korea and Taiwan because they own fewer of the US-linked AI chip names — a small relative advantage in this selloff. But with no new stimulus (rates held) and global risk appetite collapsing, there is no reason yet to expect a rebound.`, th:`จีนและฮ่องกงลดลงน้อยกว่าญี่ปุ่น เกาหลี และไต้หวัน เพราะมีหุ้นชิป AI ที่ผูกกับสหรัฐฯ น้อยกว่า — เป็นข้อได้เปรียบเล็กน้อยในรอบการเทขายนี้ แต่เมื่อไม่มีมาตรการกระตุ้นใหม่ (คงดอกเบี้ย) และความกล้ารับความเสี่ยงทั่วโลกหายไป ยังไม่มีเหตุผลให้คาดว่าจะฟื้นตัว`},
      full:{en:`Hong Kong's Hang Seng Index fell 430.82 points (−1.89%) on Friday, November 20, to close at 22,410.80, its fourth consecutive decline, according to market recaps. The Shanghai Composite closed 1.22% lower at 3,533.79 from Thursday's 3,577.62, as China kept its loan prime rates unchanged.`, th:`ดัชนี Hang Seng ฮ่องกงลดลง 430.82 จุด (−1.89%) วันศุกร์ที่ 20 พ.ย. ปิดที่ 22,410.80 ลดลงวันที่ 4 ติด ตามรายงานสรุปตลาด Shanghai Composite ปิดลดลง 1.22% ที่ 3,533.79 จาก 3,577.62 ของวันพฤหัสฯ ขณะที่จีนคงอัตราดอกเบี้ยเงินกู้ลูกค้าชั้นดี (LPR)`},
      sources:[{l:"BBN Times — SSE Composite drops to 3,533.79 as the AI trade cools and China holds rates",u:"https://www.bbntimes.com/global-economy/sse-composite-drops-to-3-533-79-as-the-ai-trade-cools-and-china-holds-rates"},{l:"Business Recorder — China, HK stocks sink as Wall St selloff dents sentiment",u:"https://www.brecorder.com/news/40450059/china-hk-stocks-sink-as-wall-st-selloff-dents-sentiment"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,453.28", chg:-1.31, series:[1472.64,1453.28],
      txt:{en:`<b>SET Index fell 19.36 pts (−1.31%) to 1,453.28 Friday</b> on turnover of about THB 61.7bn, trading in a 1,443–1,453 range; DELTA led the decline and foreigners sold about THB 2.4bn.`, th:`<b>ดัชนี SET ลดลง 19.36 จุด (−1.31%) สู่ 1,453.28 วันศุกร์</b> มูลค่าซื้อขายราว 61,668 ล้านบาท แกว่งในกรอบ 1,443–1,453 DELTA นำตลาดลง และต่างชาติขายสุทธิราว 2,400 ล้านบาท`},
      why:{en:`Thailand followed the global chip selloff through DELTA, its biggest electronics name, and foreigners kept selling. The index closed right at the 1,455 support area that held on Thursday; brokers see 1,400 as the next support and 1,480 as resistance. With Nvidia down another 14% after Thailand closed, Monday may open weak, though lower US yields could ease pressure on the baht and foreign flows if they last.`, th:`ไทยได้รับผลจากการเทขายหุ้นชิปทั่วโลกผ่าน DELTA หุ้นอิเล็กทรอนิกส์ใหญ่ที่สุด และต่างชาติยังขายต่อเนื่อง ดัชนีปิดตรงบริเวณแนวรับ 1,455 ที่ยืนได้เมื่อวันพฤหัสฯ โบรกเกอร์มองแนวรับถัดไปที่ 1,400 และแนวต้านที่ 1,480 เมื่อ Nvidia ร่วงอีก 14% หลังตลาดไทยปิด วันจันทร์อาจเปิดอ่อนตัว แต่ผลตอบแทนบอนด์สหรัฐฯ ที่ลดลงอาจช่วยลดแรงกดดันต่อเงินบาทและกระแสเงินต่างชาติ หากต่อเนื่อง`},
      full:{en:`Thailand's SET Index fell 19.36 points (−1.31%) to close at 1,453.28 on Friday, November 20, with trading value of about THB 61.67 billion and an intraday range of roughly 1,443–1,453, according to Bangkok Biz News, The Bangkok Insight and Thai Tabloid. Analysts said money flowed out of almost all asset classes on worries that AI and data-centre investment is slowing and on news around Nvidia, with DELTA weighing heavily on the index. Foreign investors were net sellers of about THB 2.4 billion. Brokers expect a limited rebound next week, with support at 1,400 and resistance at 1,480, and will watch US GDP data and the dollar.`, th:`ดัชนี SET ลดลง 19.36 จุด (−1.31%) ปิดที่ 1,453.28 วันศุกร์ที่ 20 พ.ย. มูลค่าซื้อขายราว 61,667 ล้านบาท กรอบระหว่างวันราว 1,443–1,453 ตามรายงานของกรุงเทพธุรกิจ The Bangkok Insight และ Thai Tabloid นักวิเคราะห์ระบุว่าเงินไหลออกจากสินทรัพย์เกือบทุกประเภท จากความกังวลว่าการลงทุนด้าน AI และศูนย์ข้อมูลชะลอตัว และข่าวเกี่ยวกับ Nvidia โดย DELTA กดดันดัชนีหนัก นักลงทุนต่างชาติขายสุทธิราว 2,366 ล้านบาท โบรกเกอร์คาดว่าสัปดาห์หน้าอาจฟื้นได้จำกัด แนวรับ 1,400 แนวต้าน 1,480 และจับตาตัวเลข GDP สหรัฐฯ และทิศทางดอลลาร์`},
      sources:[{l:"Bangkok Biz News — SET closes down 19.36 pts as DELTA weighs; watch US GDP next week",u:"https://www.bangkokbiznews.com/finance/stock/1261701"},{l:"The Bangkok Insight — Thai stocks 20 Nov close down 19.36 pts as foreigners sell",u:"https://www.thebangkokinsight.com/news/stock-finance/stock/1722691/"},{l:"Thai Tabloid — SET trading summary, 20 November 2026",u:"https://thaitabloid.com/archives/332285"},{l:"Kaohoon — Foreigners and prop desks sell THB 2.9bn, SET closes down 19 pts",u:"https://www.kaohoon.com/summary/883180"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold fell about 2.4% Friday to roughly $3,538/oz, heading for its worst week in about eight months,</b> as investors sold winners to raise cash; silver and Bitcoin (below $60,000) also fell. <b>Oil rose: WTI settled at $83.98 (+77¢) and Brent at $92.57 (+59¢)</b> on renewed Middle East tension, but both fell for a third straight week (WTI −5.2%, Brent −3.4%).`, th:`<b>ทองคำลดลงราว 2.4% วันศุกร์ สู่ราว $3,538 ต่อออนซ์ มุ่งสู่สัปดาห์ที่แย่ที่สุดในรอบราว 8 เดือน</b> เพราะนักลงทุนขายสินทรัพย์ที่มีกำไรเพื่อหาเงินสด เงินและ Bitcoin (หลุด $60,000) ก็ลดลงเช่นกัน <b>น้ำมันขึ้น: WTI ปิดที่ $83.98 (+77 เซนต์) และ Brent ที่ $92.57 (+59 เซนต์)</b> จากความตึงเครียดในตะวันออกกลางรอบใหม่ แต่ทั้งคู่ลดลงเป็นสัปดาห์ที่ 3 ติด (WTI −5.2% Brent −3.4%)`},
     why:{en:`Gold falling on a day when bond yields dropped shows this is a dash for cash — investors selling what they can to cover losses elsewhere. That usually passes, and lower yields are good for gold once the selling ends, so a small position is still reasonable; just don't expect it to protect you while the forced selling lasts. Oil remains tied to the US–Iran and Hormuz headlines; at $84 it is still manageable for Thailand's import bill.`, th:`การที่ทองคำลดลงในวันที่ผลตอบแทนบอนด์ลดลง แสดงว่านี่คือการรีบหาเงินสด — นักลงทุนขายสิ่งที่ขายได้เพื่อชดเชยการขาดทุนที่อื่น ภาวะนี้มักผ่านไป และผลตอบแทนบอนด์ที่ต่ำลงเป็นผลดีต่อทองคำเมื่อแรงขายจบ การถือสัดส่วนเล็กจึงยังสมเหตุสมผล แต่อย่าคาดว่าจะช่วยป้องกันพอร์ตขณะที่ยังมีการบังคับขาย น้ำมันยังผูกกับข่าวสหรัฐฯ–อิหร่านและช่องแคบฮอร์มุซ ที่ $84 ยังพอรับได้สำหรับค่านำเข้าของไทย`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Treasuries rallied Friday: the 10-year yield fell back below 5% to ~4.91–4.94% and the 2-year dropped about 12–13 bp to ~4.61–4.65%,</b> steepening the curve. Markets still lean toward a December Fed hike, but the drop in 2-year yields suggests traders trimmed those bets.`, th:`<b>บอนด์สหรัฐฯ ขึ้นราคาวันศุกร์: ผลตอบแทน 10 ปีกลับลงต่ำกว่า 5% สู่ราว 4.91–4.94% และ 2 ปีลดลงราว 0.12–0.13% สู่ราว 4.61–4.65%</b> ทำให้เส้นผลตอบแทนชันขึ้น ตลาดยังเอนไปทางเฟดขึ้นดอกเบี้ยเดือนธันวาคม แต่การที่ผลตอบแทน 2 ปีลดลงแสดงว่าเทรดเดอร์ลดการคาดการณ์นั้นลง`},
     why:{en:`This is the first day in the selloff when bonds did their job as a hedge — the front end led, which means markets are starting to price a Fed that may have to stop sooner if stocks keep falling. Quality bond income now offers both yield and protection. A 50 bp December hike looks less likely after Friday; the bigger question is whether the Fed hikes at all if the correction deepens.`, th:`นี่เป็นวันแรกของรอบการเทขายที่บอนด์ทำหน้าที่ป้องกันความเสี่ยงได้ — บอนด์ระยะสั้นนำการขึ้นราคา แสดงว่าตลาดเริ่มคาดว่าเฟดอาจต้องหยุดขึ้นดอกเบี้ยเร็วขึ้นหากหุ้นยังลดลง รายได้จากบอนด์คุณภาพตอนนี้ให้ทั้งผลตอบแทนและการป้องกัน การขึ้น 0.50% ในเดือนธันวาคมดูมีโอกาสน้อยลงหลังวันศุกร์ คำถามที่ใหญ่กว่าคือเฟดจะขึ้นดอกเบี้ยหรือไม่หากการปรับฐานลึกขึ้น`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Trade policy is still reaching Asia through chips: the reported US licence rules for advanced Nvidia chips going to data centres in Thailand, Malaysia, Singapore and others still await final text, and Friday's selloff hit the region's chip chain hardest (Taiwan −6.2%, Kospi −5.2%). Foreigners sold another ~THB 2.4bn of Thai shares. Democrats, who won both chambers on Nov 3, still plan a bill to roll back Section 301 tariffs.`, th:`นโยบายการค้ายังกระทบเอเชียผ่านชิป: กฎใบอนุญาตส่งออกชิป Nvidia ขั้นสูงไปยังศูนย์ข้อมูลในไทย มาเลเซีย สิงคโปร์ และประเทศอื่นที่มีรายงาน ยังรอรายละเอียดฉบับสุดท้าย และการเทขายวันศุกร์กระทบห่วงโซ่ชิปในภูมิภาคหนักที่สุด (ไต้หวัน −6.2% Kospi −5.2%) ต่างชาติขายหุ้นไทยอีกราว 2,400 ล้านบาท พรรคเดโมแครตที่ชนะทั้งสองสภาเมื่อ 3 พ.ย. ยังวางแผนเสนอกฎหมายลดภาษีตามมาตรา 301`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
