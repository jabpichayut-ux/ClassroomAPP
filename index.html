<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>

          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>

              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>

      <div class="covermeta" id="hero-meta"></div>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>

    <div class="sechead"><h2 id="s-themes"></h2></div>
    <div class="grid g4" id="themegrid"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

    heroNote:{en:"Illustrated cover · full photos at the linked sources", th:"ภาพหน้าปกจำลอง · ภาพข่าวจริงที่ลิงก์แหล่งข่าว"},

    leadtag:{en:"Bottom line", th:"สรุปสั้น"},
    leadtxt:{en:`<b>Fed Chair Kevin Warsh's hawkish Jackson Hole debut — warning inflation's "underlying trends" haven't meaningfully improved and that the Fed "has more work to do" — pushed September rate-hike odds to roughly 56% from about 35% before he spoke, deliberately withholding the forward guidance markets wanted.</b> Stocks dipped only modestly Friday (S&P 500 −0.25%, Nasdaq −0.52%) and still closed out a positive week, but gold sank over 3% to near $4,454/oz and the dollar strengthened as the 2-year Treasury yield jumped to about 4.30%. For your clients: this is the clearest confirmation yet that <b>locking in today's still-elevated bond coupons</b> is the right move — a near coin-flip chance of a hike, not a cut, is now what the market is pricing — while gold's sharp pullback is a natural entry point for clients who want the hedge without chasing last week's highs, and Thursday's Nvidia beat still supports staying invested in the AI growth theme (UUSTECH).`, th:`<b>สุนทรพจน์ Jackson Hole ครั้งแรกของประธานเฟด Kevin Warsh ที่ส่งสัญญาณเหยี่ยว — เตือนว่า "แนวโน้มพื้นฐาน" ของเงินเฟ้อยังไม่ดีขึ้นอย่างมีนัยสำคัญ และเฟด "ยังมีงานต้องทำอีกมาก" — ดันโอกาสเฟดขึ้นดอกเบี้ยเดือน ก.ย. ขึ้นสู่ราว 56% จากราว 35% ก่อนการแถลง โดยจงใจไม่ให้แนวทางล่วงหน้าที่ตลาดต้องการ</b> หุ้นย่อตัวเพียงเล็กน้อยวันศุกร์ (S&P 500 ลดลง 0.25%, Nasdaq ลดลง 0.52%) และยังปิดสัปดาห์เป็นบวก แต่ทองคำร่วงกว่า 3% สู่ใกล้ $4,454 ต่อออนซ์ และดอลลาร์แข็งค่าขึ้น ขณะผลตอบแทนพันธบัตร 2 ปีพุ่งขึ้นสู่ราว 4.30% สำหรับลูกค้าของคุณ: นี่คือการยืนยันที่ชัดเจนที่สุดว่า <b>การล็อกคูปองพันธบัตรที่ยังสูงอยู่วันนี้</b> คือทางเลือกที่ถูกต้อง — โอกาสขึ้นดอกเบี้ยแบบครึ่งต่อครึ่ง ไม่ใช่ลด คือสิ่งที่ตลาดกำลังคาดการณ์ตอนนี้ — ขณะทองคำที่ร่วงลงแรงเป็นจังหวะเข้าซื้อที่เป็นธรรมชาติสำหรับลูกค้าที่ต้องการเฮดจ์โดยไม่ต้องไล่ราคาที่จุดสูงสัปดาห์ก่อน และผลประกอบการ Nvidia ที่ทะลุคาดเมื่อวันพฤหัสฯ ยังคงสนับสนุนการลงทุนในธีมการเติบโต AI (UUSTECH)`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,711.76", chg:-0.25, series:[7730.99,7711.76],
      txt:{en:`<b>US stocks eased Friday — the S&P 500 −0.25% to 7,711.76, the Nasdaq −0.52% to 26,402.42, the Dow −0.02% to 53,559.99 —</b> after Fed Chair Kevin Warsh's first Jackson Hole keynote warned inflation's "underlying trends" haven't meaningfully improved, pushing September rate-hike odds to roughly 56%; all three indexes still closed out a positive week.`, th:`<b>หุ้นสหรัฐฯ ย่อตัววันศุกร์ — S&P 500 ลดลง 0.25% สู่ 7,711.76, Nasdaq ลดลง 0.52% สู่ 26,402.42, Dow ลดลง 0.02% สู่ 53,559.99 —</b> หลังสุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh เตือนว่า "แนวโน้มพื้นฐาน" ของเงินเฟ้อยังไม่ดีขึ้นอย่างมีนัยสำคัญ ดันโอกาสเฟดขึ้นดอกเบี้ยเดือน ก.ย. ขึ้นสู่ราว 56% โดยทั้งสามดัชนียังปิดสัปดาห์เป็นบวก`},
      why:{en:`A modest, orderly pullback on a genuinely hawkish Fed speech — not a disorderly selloff — shows markets had partly priced this in; the bigger message for clients is the size of the swing in rate-hike odds (roughly 35% to 56% in one session), which argues for treating today's elevated bond yields as a closing window rather than a permanent feature.`, th:`การย่อตัวอย่างมีระเบียบเพียงเล็กน้อยจากสุนทรพจน์เฟดที่ส่งสัญญาณเหยี่ยวจริง ๆ — ไม่ใช่การเทขายอย่างไร้ระเบียบ — แสดงว่าตลาดได้สะท้อนความเป็นไปได้นี้ไว้บางส่วนแล้ว ข้อความสำคัญกว่าสำหรับลูกค้าคือขนาดของการเปลี่ยนแปลงโอกาสขึ้นดอกเบี้ย (จากราว 35% เป็น 56% ในวันเดียว) ซึ่งสนับสนุนให้มองผลตอบแทนพันธบัตรที่สูงอยู่วันนี้เป็นหน้าต่างโอกาสที่กำลังจะปิด ไม่ใช่สิ่งที่จะคงอยู่ถาวร`},
      full:{en:`US stocks eased Friday as Fed Chair Kevin Warsh delivered his first Jackson Hole keynote as chair. The S&P 500 fell 0.25% to close at 7,711.76, the Nasdaq Composite slid 0.52% to 26,402.42 (dragged by chip names including Nvidia and Intel), and the Dow Jones Industrial Average shed just 9.45 points (-0.02%) to 53,559.99 — all three still finished the week higher. Warsh said the Fed "will have work to do" if policymakers aren't confident underlying inflation is returning to its 2% target, adding that recent PCE and CPI readings "do not tell me that underlying trends have meaningfully improved." He deliberately avoided explicit forward guidance, saying the Fed should not "indulge a regime in which market participants are looking primarily to the Fed for their next trade." Fed funds futures reacted immediately: odds of a September rate hike jumped to roughly 56% from about 35% before the speech, per CME FedWatch. The 2-year Treasury yield, most sensitive to near-term policy, jumped to near 4.30%; the 10-year rose modestly to about 4.68%; the dollar index gained about 0.36%; and gold slid more than 3% to near $4,454/oz.`, th:`หุ้นสหรัฐฯ ย่อตัววันศุกร์ ขณะประธานเฟด Kevin Warsh กล่าวสุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธาน ดัชนี S&P 500 ลดลง 0.25% ปิดที่ 7,711.76 ดัชนี Nasdaq Composite ลดลง 0.52% สู่ 26,402.42 (ถูกฉุดโดยหุ้นกลุ่มชิปรวมถึง Nvidia และ Intel) และดัชนี Dow Jones ลดลงเพียง 9.45 จุด (-0.02%) สู่ 53,559.99 — ทั้งสามดัชนียังปิดสัปดาห์เป็นบวก Warsh กล่าวว่าเฟด "จะยังมีงานต้องทำอีกมาก" หากผู้กำหนดนโยบายไม่มั่นใจว่าเงินเฟ้อพื้นฐานกำลังกลับสู่เป้าหมาย 2% พร้อมระบุว่าตัวเลข PCE และ CPI ล่าสุด "ไม่ได้บอกผมว่าแนวโน้มพื้นฐานดีขึ้นอย่างมีนัยสำคัญ" เขาจงใจหลีกเลี่ยงการให้แนวทางล่วงหน้าที่ชัดเจน โดยกล่าวว่าเฟดไม่ควร "ปล่อยให้เกิดระบบที่นักลงทุนมองมาที่เฟดเป็นหลักเพื่อหาสัญญาณการเทรดครั้งต่อไป" ตลาดสัญญาซื้อขายล่วงหน้าอัตราดอกเบี้ยตอบสนองทันที: โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 56% จากราว 35% ก่อนการแถลง ตามข้อมูลของ CME FedWatch ผลตอบแทนพันธบัตร 2 ปีซึ่งอ่อนไหวต่อนโยบายระยะสั้นที่สุด พุ่งขึ้นสู่ใกล้ 4.30% ส่วน 10 ปีเพิ่มขึ้นเล็กน้อยสู่ราว 4.68% ดัชนีดอลลาร์เพิ่มขึ้นราว 0.36% และทองคำร่วงกว่า 3% สู่ใกล้ $4,454 ต่อออนซ์`},
      sources:[{l:"CNBC",u:"https://www.cnbc.com/2026/08/28/kevin-warsh-jackson-hole-federal-reserve-inflation.html"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/28/-september-fed-decision-now-a-coin-flip-as-rate-hike-odds-increase.html"},{l:"Washington Post",u:"https://www.washingtonpost.com/business/2026/08/28/fed-chair-warsh-speaks-jackson-hole-conference/"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,570", chg:0.77, series:[26365,26570],
      txt:{en:`<b>DAX rose 205 points (+0.77%) to 26,570 Friday,</b> extending its gain even as Wall Street dipped on Fed Chair Warsh's hawkish Jackson Hole remarks, with a firmer dollar against the euro helping export-heavy German shares.`, th:`<b>DAX เพิ่มขึ้น 205 จุด (+0.77%) สู่ 26,570 วันศุกร์</b> ปรับขึ้นต่อเนื่องแม้วอลล์สตรีทจะย่อตัวจากสุนทรพจน์เฟดที่ส่งสัญญาณเหยี่ยวของวอร์ช โดยดอลลาร์ที่แข็งค่าขึ้นเทียบยูโรช่วยหนุนหุ้นเยอรมนีกลุ่มส่งออก`},
      why:{en:`Europe decoupling from a hawkish-driven US dip — helped by dollar strength against the euro — is a reminder that European exposure still behaves more like a ballast than a pure rates play, useful for clients who want diversification while US bond yields stay in flux.`, th:`การที่ยุโรปแยกทิศทางจากการย่อตัวของสหรัฐฯ ที่มาจากสัญญาณเหยี่ยว — โดยได้แรงหนุนจากดอลลาร์ที่แข็งค่าเทียบยูโร — เป็นเครื่องเตือนใจว่าการลงทุนในยุโรปยังทำหน้าที่เป็นตัวถ่วงสมดุลมากกว่าการเดิมพันเรื่องดอกเบี้ยล้วน ๆ เหมาะสำหรับลูกค้าที่ต้องการกระจายความเสี่ยงขณะผลตอบแทนพันธบัตรสหรัฐฯ ยังผันผวน`},
      full:{en:`European shares extended gains Friday even as Wall Street pulled back after Fed Chair Kevin Warsh's hawkish first Jackson Hole keynote. Germany's DAX added 205 points (+0.77%) to close at 26,570, helped by a stronger dollar against the euro (down 0.35% to $1.161) that supported export-heavy German industrials, while the broader region shrugged off the US rate-hike repricing. Investors now turn to next Friday's US August jobs report (Sep 4) as the next data point on the Fed's path.`, th:`หุ้นยุโรปปรับขึ้นต่อเนื่องวันศุกร์ แม้วอลล์สตรีทจะย่อตัวหลังสุนทรพจน์ Jackson Hole ครั้งแรกที่ส่งสัญญาณเหยี่ยวของประธานเฟด Kevin Warsh ดัชนี DAX เยอรมนีเพิ่มขึ้น 205 จุด (+0.77%) ปิดที่ 26,570 ได้แรงหนุนจากดอลลาร์ที่แข็งค่าขึ้นเทียบยูโร (ยูโรลดลง 0.35% สู่ $1.161) ซึ่งช่วยหนุนหุ้นกลุ่มอุตสาหกรรมส่งออกของเยอรมนี ขณะภูมิภาคโดยรวมไม่ได้รับผลกระทบมากนักจากการปรับคาดการณ์ขึ้นดอกเบี้ยของสหรัฐฯ นักลงทุนตอนนี้หันไปจับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันศุกร์หน้า (4 ก.ย.) เป็นข้อมูลชิ้นถัดไปที่จะบ่งชี้ทิศทางเฟด`},

    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"66,405.56", chg:0.41, series:[66132,66406],
      txt:{en:`<b>Nikkei 225 rose 0.41% to 66,405.56 Friday,</b> holding firm ahead of and through Fed Chair Warsh's hawkish Jackson Hole remarks, even as US chip stocks including Nvidia and Intel slipped on the read-through.`, th:`<b>Nikkei 225 เพิ่มขึ้น 0.41% สู่ 66,405.56 วันศุกร์</b> ยืนแข็งแกร่งทั้งก่อนและหลังสุนทรพจน์ Jackson Hole ที่ส่งสัญญาณเหยี่ยวของประธานเฟดวอร์ช แม้หุ้นชิปสหรัฐฯ รวมถึง Nvidia และ Intel จะปรับลงจากผลกระทบดังกล่าว`},
      why:{en:`Japanese equities holding their own gain even as a hawkish Fed speech knocked US chip names lower shows the region isn't simply trading as a US-rates proxy right now — useful context for clients who worry a hawkish Fed automatically means broad Asia weakness.`, th:`การที่หุ้นญี่ปุ่นยังคงปรับขึ้นได้ แม้สุนทรพจน์เฟดที่ส่งสัญญาณเหยี่ยวจะฉุดหุ้นชิปสหรัฐฯ ลง แสดงว่าภูมิภาคนี้ไม่ได้เคลื่อนไหวตามอัตราดอกเบี้ยสหรัฐฯ เพียงอย่างเดียวในตอนนี้ — เป็นบริบทที่มีประโยชน์สำหรับลูกค้าที่กังวลว่าเฟดที่ส่งสัญญาณเหยี่ยวจะทำให้เอเชียอ่อนแอไปทั้งภูมิภาค`},
      full:{en:`Asian equities were mostly firm Friday as Fed Chair Kevin Warsh delivered his first Jackson Hole keynote. Japan's Nikkei 225 rose 0.41% to close at 66,405.56, closing out a positive week even as Warsh's comments — that inflation's "underlying trends" haven't meaningfully improved — pushed September rate-hike odds to roughly 56% and weighed on US-listed chip names including Nvidia (-0.7%) and Intel. Elsewhere in the region, moves were mixed as investors reassessed the rate path into the Fed's September 16 meeting, with the next major US data point being the August jobs report on September 4.`, th:`หุ้นเอเชียส่วนใหญ่ยืนแข็งแกร่งวันศุกร์ ขณะประธานเฟด Kevin Warsh กล่าวสุนทรพจน์ Jackson Hole ครั้งแรก ดัชนี Nikkei 225 ญี่ปุ่นเพิ่มขึ้น 0.41% ปิดที่ 66,405.56 ปิดสัปดาห์เป็นบวก แม้คำกล่าวของวอร์ช — ที่ระบุว่า "แนวโน้มพื้นฐาน" ของเงินเฟ้อยังไม่ดีขึ้นอย่างมีนัยสำคัญ — จะดันโอกาสขึ้นดอกเบี้ยเดือน ก.ย. สู่ราว 56% และกดดันหุ้นชิปที่จดทะเบียนในสหรัฐฯ รวมถึง Nvidia (-0.7%) และ Intel ส่วนอื่นในภูมิภาคเคลื่อนไหวผสม ขณะนักลงทุนประเมินทิศทางดอกเบี้ยใหม่ก่อนการประชุมเฟดวันที่ 16 ก.ย. โดยข้อมูลสำคัญถัดไปของสหรัฐฯ คือรายงานการจ้างงานเดือน ส.ค. วันที่ 4 ก.ย.`},
      sources:[{l:"TS2 Tech",u:"https://ts2.tech/en/stock-market-today-08-28-2026-asia/"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/28/kevin-warsh-jackson-hole-federal-reserve-inflation.html"},{l:"ArmenPress",u:"https://armenpress.am/en/article/1259148"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,584.79", chg:0.07, series:[25566,25585],
      txt:{en:`<b>Hang Seng edged up 0.07% to 25,584.79 Friday,</b> essentially flat through Fed Chair Warsh's hawkish Jackson Hole remarks, while mainland China's <b>Shanghai Composite dipped 0.11% to 3,952.18</b> as investors paused after Thursday's AI-hardware rally.`, th:`<b>Hang Seng เพิ่มขึ้นเล็กน้อย 0.07% สู่ 25,584.79 วันศุกร์</b> แทบไม่เปลี่ยนแปลงตลอดช่วงสุนทรพจน์ Jackson Hole ที่ส่งสัญญาณเหยี่ยวของประธานเฟดวอร์ช ขณะ <b>Shanghai Composite จีนแผ่นดินใหญ่ลดลง 0.11% สู่ 3,952.18</b> หลังนักลงทุนหยุดพักหลังแรงซื้อหุ้นฮาร์ดแวร์ AI เมื่อวันพฤหัสบดี`},
      why:{en:`Greater China trading essentially flat through a hawkish US Fed speech — rather than selling off in sympathy — reinforces that onshore China/HK positioning is currently driven more by domestic AI-hardware and policy flows than by the US rate path, a useful distinction when clients ask whether a hawkish Fed hurts their China exposure.`, th:`การที่จีนและฮ่องกงเคลื่อนไหวแทบไม่เปลี่ยนแปลงตลอดสุนทรพจน์เฟดสหรัฐฯ ที่ส่งสัญญาณเหยี่ยว — แทนที่จะเทขายตาม — ตอกย้ำว่าการลงทุนในจีน/ฮ่องกงตอนนี้ขับเคลื่อนจากกระแสหุ้นฮาร์ดแวร์ AI ในประเทศและนโยบายมากกว่าทิศทางดอกเบี้ยสหรัฐฯ เป็นข้อแตกต่างที่มีประโยชน์เมื่อลูกค้าถามว่าเฟดที่ส่งสัญญาณเหยี่ยวจะกระทบการลงทุนในจีนหรือไม่`},
      full:{en:`Greater China markets were little changed Friday even as Fed Chair Kevin Warsh's hawkish Jackson Hole keynote pushed September rate-hike odds to roughly 56% and weighed on US and some regional chip names. Hong Kong's Hang Seng edged up 0.07% to 25,584.79, while the Shanghai Composite slipped 0.11% to 3,952.18 as onshore investors took a breather after Thursday's Nvidia-led AI-hardware rally, in which the 5G Communication index had jumped about 4.3%. Markets across the region now look to the US August jobs report on September 4 and the Fed's September 16 meeting for the next signal.`, th:`ตลาดจีนและฮ่องกงแทบไม่เปลี่ยนแปลงวันศุกร์ แม้สุนทรพจน์ Jackson Hole ที่ส่งสัญญาณเหยี่ยวของประธานเฟด Kevin Warsh จะดันโอกาสขึ้นดอกเบี้ยเดือน ก.ย. สู่ราว 56% และกดดันหุ้นชิปสหรัฐฯ และบางส่วนในภูมิภาค ดัชนี Hang Seng ฮ่องกงเพิ่มขึ้นเล็กน้อย 0.07% สู่ 25,584.79 ขณะ Shanghai Composite ลดลง 0.11% สู่ 3,952.18 หลังนักลงทุนในประเทศหยุดพักจากแรงซื้อหุ้นฮาร์ดแวร์ AI ที่นำโดย Nvidia เมื่อวันพฤหัสบดี ซึ่งดัชนีกลุ่ม 5G เคยพุ่งขึ้นราว 4.3% ตลาดทั่วภูมิภาคตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. และการประชุมเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"24/7 Wall St.",u:"https://247wallst.com/cards/hong-kong-erased-an-opening-dip-to-finish-0-30-higher-whil-hsi-market-bell-01m13pfc98j3cyytgqnag3gadv"},{l:"Trading Economics",u:"https://tradingeconomics.com/china/stock-market"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/28/-september-fed-decision-now-a-coin-flip-as-rate-hike-odds-increase.html"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,588.22", chg:-0.78, series:[1600.70,1588.22],
      txt:{en:`<b>SET Index fell 0.78% to 1,588.22 Friday (−12.48pts),</b> on turnover of about THB 66.47bn, as global risk sentiment cooled following Fed Chair Warsh's hawkish Jackson Hole remarks and September rate-hike odds jumped to roughly 56%.`, th:`<b>ดัชนี SET ลดลง 0.78% สู่ 1,588.22 วันศุกร์ (−12.48 จุด)</b> มูลค่าการซื้อขายราว 6.647 หมื่นล้านบาท หลังบรรยากาศความเสี่ยงทั่วโลกซาลง จากสุนทรพจน์ Jackson Hole ที่ส่งสัญญาณเหยี่ยวของประธานเฟดวอร์ช และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 56%`},
      why:{en:`A second straight session lower, now with a clear external trigger (a genuinely hawkish Fed), is a good reminder for clients that near-term SET moves are tracking global rate repricing rather than local fundamentals — UBS's 1,680 target for 2026 still argues the broader trend remains higher once this event risk clears.`, th:`การที่ SET ลดลงต่อเนื่องเป็นวันที่สอง คราวนี้มีปัจจัยกระตุ้นจากภายนอกที่ชัดเจน (เฟดที่ส่งสัญญาณเหยี่ยวจริง ๆ) เป็นเครื่องเตือนใจที่ดีสำหรับลูกค้าว่าการเคลื่อนไหวของ SET ระยะสั้นตอนนี้อิงตามการปรับคาดการณ์ดอกเบี้ยโลกมากกว่าปัจจัยพื้นฐานในประเทศ เป้าหมายปี 2026 ที่ 1,680 ของ UBS ยังคงสนับสนุนแนวโน้มขาขึ้นในภาพรวมเมื่อความเสี่ยงจากเหตุการณ์นี้คลี่คลาย`},
      full:{en:`Thailand's SET Index closed Friday at 1,588.22, down 12.48 points (−0.78%), on turnover of about THB 66.47 billion — a second straight lower session. Brokers including Kasikorn Securities had flagged a cautious, wait-and-see tone heading into Fed Chair Kevin Warsh's Jackson Hole keynote; once Warsh warned that inflation's "underlying trends" haven't meaningfully improved and September rate-hike odds jumped to roughly 56%, regional risk sentiment cooled and the SET extended its pullback from the recent 1,600 level. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity, with the next major catalyst being the US August jobs report on September 4 ahead of the Fed's September 16 decision.`, th:`ดัชนี SET ของไทยปิดตลาดวันศุกร์ที่ 1,588.22 ลดลง 12.48 จุด (−0.78%) มูลค่าการซื้อขายราว 6.647 หมื่นล้านบาท เป็นการปรับลงต่อเนื่องเป็นวันที่สอง โบรกเกอร์รวมถึงบล.กสิกรไทยส่งสัญญาณระมัดระวังแบบรอดูท่าทีก่อนสุนทรพจน์ Jackson Hole ของประธานเฟด Kevin Warsh เมื่อวอร์ชเตือนว่า "แนวโน้มพื้นฐาน" ของเงินเฟ้อยังไม่ดีขึ้นอย่างมีนัยสำคัญ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 56% บรรยากาศความเสี่ยงในภูมิภาคก็ซาลง และ SET ปรับลงต่อจากระดับ 1,600 ล่าสุด เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว โดยปัจจัยขับเคลื่อนสำคัญถัดไปคือรายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`},
      sources:[{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/589686"},{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/589626"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold sank over 3% Friday to near $4,454/oz,</b> its sharpest drop in weeks, as Fed Chair Warsh's hawkish Jackson Hole remarks strengthened the dollar and rate-hike bets. <b>Brent steadied near $88.22/bbl (WTI ~$82.82),</b> pausing its four-session slide as traders weighed the same hawkish repricing.`, th:`<b>ทองคำร่วงกว่า 3% วันศุกร์ สู่ใกล้ $4,454 ต่อออนซ์</b> ร่วงแรงที่สุดในรอบหลายสัปดาห์ หลังคำกล่าวของประธานเฟดวอร์ชที่ส่งสัญญาณเหยี่ยวหนุนดอลลาร์และแรงเดิมพันขึ้นดอกเบี้ย <b>เบรนท์ทรงตัวใกล้ $88.22 ต่อบาร์เรล (WTI ราว $82.82)</b> หยุดการร่วงต่อเนื่องสี่วัน ขณะนักลงทุนประเมินการปรับคาดการณ์ที่ส่งสัญญาณเหยี่ยวเช่นกัน`},
     why:{en:`Gold's 3%+ drop on a single hawkish speech — its worst one-day move in weeks — is the clearest sign yet that positioning had leaned dovish; frame the pullback as a genuine entry point rather than a reason to avoid the hedge, since the fiscal and trade-war risks behind gold's recent highs haven't gone away.`, th:`การที่ทองคำร่วงกว่า 3% จากสุนทรพจน์เพียงครั้งเดียว — การเคลื่อนไหวรายวันที่แย่ที่สุดในรอบหลายสัปดาห์ — เป็นสัญญาณที่ชัดเจนที่สุดว่าการถือสถานะก่อนหน้านี้เอนไปทาง dovish นำเสนอการย่อตัวนี้เป็นจังหวะเข้าซื้อที่แท้จริง มากกว่าเหตุผลที่จะเลี่ยงการเฮดจ์ เพราะความเสี่ยงด้านการคลังและสงครามการค้าที่ดันทองคำขึ้นทำสถิติเมื่อไม่นานนี้ยังไม่หายไป`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Fed Chair Kevin Warsh's first Jackson Hole keynote as chair turned hawkish Friday</b> — he said inflation's "underlying trends" haven't meaningfully improved and the Fed "has more work to do," while deliberately avoiding explicit forward guidance. Fed funds futures reacted instantly: <b>odds of a September rate hike jumped to roughly 56% from about 35% before the speech.</b> The <b>2-year yield jumped to near 4.30%,</b> the <b>10-year rose to about 4.68%,</b> and the <b>30-year edged up to near 5.17%.</b>`, th:`<b>สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh ส่งสัญญาณเหยี่ยววันศุกร์</b> — เขากล่าวว่า "แนวโน้มพื้นฐาน" ของเงินเฟ้อยังไม่ดีขึ้นอย่างมีนัยสำคัญ และเฟด "ยังมีงานต้องทำอีกมาก" ขณะจงใจหลีกเลี่ยงการให้แนวทางล่วงหน้าที่ชัดเจน ตลาดสัญญาซื้อขายล่วงหน้าอัตราดอกเบี้ยตอบสนองทันที: <b>โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 56% จากราว 35% ก่อนการแถลง</b> ผลตอบแทนพันธบัตร <b>2 ปีพุ่งขึ้นสู่ใกล้ 4.30%</b> <b>10 ปีเพิ่มขึ้นสู่ราว 4.68%</b> และ <b>30 ปีขยับขึ้นสู่ใกล้ 5.17%</b>`},
     why:{en:`This is no longer a "real but minority" chance of a hike — it's now essentially a coin flip, the single biggest repricing of the week. That argues for treating today's still-elevated coupons as a genuinely closing window and locking in client income now, ahead of the next major catalyst: the August jobs report on September 4, before the Fed's September 16 decision.`, th:`นี่ไม่ใช่แค่โอกาส "มีจริงแต่เป็นส่วนน้อย" อีกต่อไป — ตอนนี้กลายเป็นครึ่งต่อครึ่งแล้ว การปรับคาดการณ์ครั้งใหญ่ที่สุดของสัปดาห์นี้ สนับสนุนให้มองคูปองที่ยังสูงอยู่วันนี้เป็นหน้าต่างโอกาสที่กำลังจะปิดจริง ๆ และล็อกรายได้ให้ลูกค้าตอนนี้ ก่อนปัจจัยขับเคลื่อนสำคัญถัดไป: รายงานการจ้างงานเดือน ส.ค. วันที่ 4 ก.ย. ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`}},

    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Tariff risk hasn't gone away — Section 338 tariffs on Canadian imports took effect Aug 22, and a possible new ~7.5% China "overcapacity" tariff remains live ahead of a planned Trump-Xi summit — but neither was Friday's story. <b>A hawkish Fed speech, not trade policy, drove the day's moves,</b> a reminder that clients' portfolios face two live, largely independent risks right now: tariffs and rates.`, th:`ความเสี่ยงภาษียังไม่หายไป — มาตรการภาษีมาตรา 338 ต่อสินค้านำเข้าจากแคนาดามีผลบังคับใช้ตั้งแต่ 22 ส.ค. และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้ — แต่ไม่ใช่ประเด็นหลักของวันศุกร์ <b>สุนทรพจน์เฟดที่ส่งสัญญาณเหยี่ยว ไม่ใช่นโยบายการค้า คือปัจจัยที่ขับเคลื่อนการเคลื่อนไหววันนี้</b> เป็นเครื่องเตือนใจว่าพอร์ตของลูกค้ากำลังเผชิญความเสี่ยงที่ยังคุกรุ่นอยู่สองด้านซึ่งค่อนข้างเป็นอิสระต่อกัน คือภาษีและดอกเบี้ย`}, w:{en:`With tariff risk still simmering in the background and the Fed now separately turning hawkish, this is a good week to reinforce that diversified, bond-anchored portfolios remain the right hedge against either headline resurfacing — clients shouldn't assume one risk cancels out the other.`, th:`เมื่อความเสี่ยงภาษียังคุกรุ่นอยู่เบื้องหลัง และเฟดก็เพิ่งหันมาส่งสัญญาณเหยี่ยวแยกต่างหาก สัปดาห์นี้เป็นจังหวะดีที่จะย้ำกับลูกค้าว่าพอร์ตที่กระจายความเสี่ยงและมีตราสารหนี้เป็นหลักยังคงเป็นเกราะป้องกันที่เหมาะสมหากข่าวใดข่าวหนึ่งกลับมา ลูกค้าไม่ควรคิดว่าความเสี่ยงหนึ่งจะหักล้างอีกความเสี่ยงหนึ่ง`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>Oil's four-session slide paused Friday, with Brent ticking up to $88.22/bbl (WTI ~$82.82),</b> even as Washington's sweeping Iran-sanctions campaign ("Operation Economic Outcast") remains in force. With the hawkish Fed dominating the headlines, geopolitical risk faded into the background but hasn't cleared.`, th:`<b>การร่วงต่อเนื่องสี่วันของน้ำมันหยุดชะงักวันศุกร์ โดยเบรนท์ขยับขึ้นสู่ $88.22 ต่อบาร์เรล (WTI ราว $82.82)</b> แม้มาตรการคว่ำบาตรอิหร่านระลอกใหญ่ของสหรัฐฯ ("Operation Economic Outcast") จะยังมีผลบังคับใช้อยู่ เมื่อเฟดที่ส่งสัญญาณเหยี่ยวครองพาดหัวข่าว ความเสี่ยงภูมิรัฐศาสตร์จึงเลือนหายไปเป็นฉากหลัง แต่ยังไม่ได้คลี่คลาย`}, w:{en:`Oil steadying rather than continuing to fall is a reminder not to over-read one week's decline as a durable inflation tailwind — with an active US sanctions campaign still targeting Iran's trading partners, this is not yet a green light to stop hedging geopolitical risk.`, th:`การที่น้ำมันทรงตัวแทนที่จะร่วงต่อ เป็นเครื่องเตือนใจไม่ให้ตีความการลดลงในหนึ่งสัปดาห์เกินจริงว่าเป็นแรงหนุนเงินเฟ้อที่ยั่งยืน — เมื่อมาตรการคว่ำบาตรของสหรัฐฯ ยังเล่นงานคู่ค้าของอิหร่านอยู่ นี่ยังไม่ใช่สัญญาณให้หยุดป้องกันความเสี่ยงภูมิรัฐศาสตร์`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`<b>Fed Chair Kevin Warsh's first Jackson Hole keynote as chair turned hawkish Friday,</b> warning inflation's "underlying trends" haven't meaningfully improved. He deliberately avoided explicit forward guidance, but markets moved anyway: <b>September rate-hike odds jumped to roughly 56% from about 35% before he spoke,</b> the 2-year yield jumped to near 4.30%, and the 10-year rose to about 4.68%.`, th:`<b>สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh ส่งสัญญาณเหยี่ยววันศุกร์</b> เตือนว่า "แนวโน้มพื้นฐาน" ของเงินเฟ้อยังไม่ดีขึ้นอย่างมีนัยสำคัญ เขาจงใจหลีกเลี่ยงการให้แนวทางล่วงหน้าที่ชัดเจน แต่ตลาดก็ขยับตาม: <b>โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 56% จากราว 35% ก่อนการแถลง</b> ผลตอบแทนพันธบัตร 2 ปีพุ่งขึ้นสู่ใกล้ 4.30% และ 10 ปีเพิ่มขึ้นสู่ราว 4.68%`}, w:{en:`A jump from "real but minority" to a near coin-flip on a hike is the single biggest repricing of the week — it argues for locking in today's still-elevated coupons now, ahead of the next major catalyst: the August jobs report on September 4, before the Fed's September 16 decision.`, th:`การเปลี่ยนจาก "มีจริงแต่เป็นส่วนน้อย" เป็นครึ่งต่อครึ่งสำหรับการขึ้นดอกเบี้ย คือการปรับคาดการณ์ครั้งใหญ่ที่สุดของสัปดาห์นี้ — สนับสนุนให้ล็อกคูปองที่ยังสูงอยู่วันนี้ ก่อนปัจจัยขับเคลื่อนสำคัญถัดไป: รายงานการจ้างงานเดือน ส.ค. วันที่ 4 ก.ย. ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`Fed Chair Warsh's Jackson Hole remarks reinforced July's sticky PCE report: he said recent PCE and CPI readings <b>"do not tell me that underlying trends have meaningfully improved,"</b> and that the Fed "will have work to do" if that doesn't change — a notably more hawkish read than markets had expected from a Fed chair avoiding explicit guidance.`, th:`คำกล่าวของประธานเฟดวอร์ชที่ Jackson Hole ตอกย้ำรายงาน PCE เดือน ก.ค. ที่ยังเหนียว เขากล่าวว่าตัวเลข PCE และ CPI ล่าสุด <b>"ไม่ได้บอกผมว่าแนวโน้มพื้นฐานดีขึ้นอย่างมีนัยสำคัญ"</b> และเฟด "จะยังมีงานต้องทำอีกมาก" หากสถานการณ์ไม่เปลี่ยนแปลง ซึ่งเหยี่ยวกว่าที่ตลาดคาดไว้อย่างชัดเจนจากประธานเฟดที่หลีกเลี่ยงการให้แนวทางล่วงหน้า`}, w:{en:`A Fed chair openly flagging more hikes may be needed, even while withholding formal guidance, is the clearest "don't get complacent on rates" talking point of the year so far — pair any growth-fund conversation with a reminder that the bond case hasn't weakened, it's gotten measurably stronger.`, th:`การที่ประธานเฟดเปิดเผยตรง ๆ ว่าอาจต้องขึ้นดอกเบี้ยเพิ่ม แม้จะไม่ให้แนวทางล่วงหน้าอย่างเป็นทางการ เป็นประเด็นที่ชัดเจนที่สุดให้ "อย่าประมาทเรื่องดอกเบี้ย" ของปีนี้ — เมื่อคุยเรื่องกองทุนเติบโตกับลูกค้า ควรย้ำด้วยว่าเหตุผลด้านตราสารหนี้ไม่ได้อ่อนลง แต่แข็งแกร่งขึ้นอย่างชัดเจน`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-themes').textContent=t(S.sThemes); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('s-prices').textContent=t(S.sPrices); $('h-prices').textContent=t(S.hPrices); $('pricenote').textContent=t(S.pricenote);
    $('b-sell').textContent=t(S.bSell); $('s-funds').textContent=t(S.sFunds); $('h-funds').textContent=t(S.hFunds);
    $('sh-off').innerHTML=`${t(S.shOff)} <small>${t(S.shOffSub)}</small>`; $('sh-on').innerHTML=`${t(S.shOn)} <small>${t(S.shOnSub)}</small>`;
    $('s-talk').textContent=t(S.sTalk); $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('countrygrid').innerHTML=COUNTRIES.map((c,i)=>`
      <div class="card ccard">
        <div class="chdr"><div class="ci"><h3 style="margin:0"><span class="flag">${c.flag}</span> ${t(c.name)}</h3><span class="ix">${c.ix}</span></div>
          <div style="text-align:right"><div class="val">${c.val}</div>${chgPill(c.chg)}</div></div>
        <div class="chartbox" data-series='${JSON.stringify(c.series)}' data-chg="${c.chg}"></div>
        <div class="chartcap">${t(S.recent)}</div>
        <p>${t(c.txt)}</p>
        <div class="why"><span>${t(S.foryou)}</span> ${t(c.why)}</div>
        <button class="expand">${t(S.readfull)} <span class="cv">▾</span></button>
        <div class="full" hidden><p style="margin:0">${t(c.full)}</p>
          <div class="srcline"><span class="srclabel">${t(S.sources)}</span>${c.sources.map(s=>`<a class="srcpill" href="${s.u}" target="_blank" rel="noopener">${s.l} ↗</a>`).join('')}</div></div>
      </div>`).join('');
    $('extragrid').innerHTML=EXTRA.map(e=>`<div class="card"><h3><span class="flag">${e.flag}</span> ${t(e.h)}</h3><p>${t(e.txt)}</p><div class="why"><span>${t(S.foryou)}</span> ${t(e.why)}</div></div>`).join('');
    $('themegrid').innerHTML=THEMES.map(x=>`<div class="card themecard"><h3>${t(x.h)}</h3><p>${t(x.p)}</p><div class="why"><span>${t(S.impact)}</span> ${t(x.w)}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`<div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div><div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div><div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน และค่าเงิน':'US Treasuries, gold, oil & FX',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p>${f.now?`<div class="fnow"><span>${L==='th'?'ทำไมตอนนี้':'Why now'}</span>${t(f.now)}</div>`:''}<div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');
    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
