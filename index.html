<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
    <div class="grid g2" id="countrygrid"></div>
    <div class="grid g2" style="margin-top:14px" id="extragrid"></div>
    <div class="rule"></div>
    <div class="sechead"><h2 id="s-themes"></h2></div>
    <div class="grid g4" id="themegrid"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Dow's Worst Day Since July as Bond-Buyback Relief Fades", th:"ดัชนี Dow ร่วงหนักสุดตั้งแต่ปลาย ก.ค. หลังแรงหนุนจากข่าวซื้อคืนพันธบัตรจางหาย"},
    heroDeck:{en:"US stocks slid Thursday — the Dow −1.32% to 52,759, its worst day since 29 July — as Treasury yields resumed climbing (10Y 4.70%, 30Y ~5.27%, near its highest since 2007) and Walmart fell 9% on soft sales. Asia staged a sharp rebound (Nikkei +1.4%, Kospi +5.9%) but Friday futures point lower again as an active Iran conflict pushed Brent to $93 and gold held near $4,516.", th:"หุ้นสหรัฐร่วงวันพฤหัสฯ — ดัชนี Dow ลดลง 1.32% สู่ 52,759 แย่สุดตั้งแต่ 29 ก.ค. — ขณะผลตอบแทนพันธบัตรกลับมาไต่ขึ้นต่อ (10 ปี 4.70%, 30 ปี ~5.27% ใกล้จุดสูงสุดตั้งแต่ปี 2007) และ Walmart ร่วง 9% จากยอดขายอ่อนแอ เอเชียฟื้นตัวแรง (Nikkei +1.4%, Kospi +5.9%) แต่ฟิวเจอร์สวันศุกร์ชี้ลงอีกครั้ง ขณะสถานการณ์อิหร่านที่ยังคุกรุ่นดันเบรนท์สู่ $93 และทองคำยืนใกล้ $4,516"},
    heroNote:{en:"Illustrated cover · full photos at the linked sources", th:"ภาพหน้าปกจำลอง · ภาพข่าวจริงที่ลิงก์แหล่งข่าว"},
    dbEd:{en:"Edition", th:"ฉบับวันที่"}, dbCov:{en:"Covering", th:"ครอบคลุมการซื้อขาย"}, dbCovVal:{en:"Thu 20 Aug US close → Fri 21 Aug pre-Asia", th:"ปิดสหรัฐ 20 ส.ค. → ก่อนเอเชียเปิด 21 ส.ค."},
    updatedLbl:{en:"Last updated", th:"อัปเดตล่าสุด"}, updatedAt:{en:"21 Aug 2026, 08:50 ICT", th:"21 ส.ค. 2026, 08:50 น."},
    dbNext:{en:"Next update", th:"อัปเดตถัดไป"}, dbNextVal:{en:"top of the hour", th:"ต้นชั่วโมงถัดไป"},
    sBrief:{en:"The one-minute read", th:"สรุปตลาดใน 1 นาที"},
    hBrief:{en:"Bold = what matters · tap a country for the full CNBC / Bloomberg summary", th:"ตัวหนา = จุดสำคัญ · แตะที่ประเทศเพื่อดูสรุปเต็มจาก CNBC / Bloomberg"},
    leadtag:{en:"Bottom line", th:"สรุปสั้น"},
    leadtxt:{en:`<b>Wall Street sold off hard Thursday, the Dow's worst day since 29 July: the S&P 500 fell 0.87% to 7,641.16, the Dow dropped 1.32% (−703.84pts) to 52,759.21, and the Nasdaq lost 1.00% to 26,067.17,</b> week-to-date now S&P −1.9%, Nasdaq −2.5%, on track to snap a three-week win streak. <b>Treasury's own buyback intervention only bought about one session of relief — the 10-year yield rose to 4.704% and the 30-year climbed back near 5.27%, close to its highest since 2007,</b> as the CBO raised its FY deficit estimate to $2.1tn (+$200bn) and July's FOMC minutes showed a broader hawkish bloc, not just three dissenters, debating a hike. Walmart fell ~9% despite beating on EPS, flagging slowing US sales growth as consumers "trade off" on high gas prices; Moderna reversed hard, falling ~20% a day after its 177% vaccine-driven surge, even as the FDA approved its mFLUSIVA flu shot. Europe's DAX slipped 0.41% to 25,983 on elevated German Bund yields. Asia staged a sharp rebound — <b>Nikkei +1.36% to 66,216.79, Kospi +5.9% to 6,852.58</b> on chip-buyback hopes, Hang Seng +0.80%, Shanghai +0.24% — but <b>Friday's pre-Asia futures point lower again</b> (Kospi −1.07%, Kosdaq −2.44%), tracking Thursday's US risk-off close. Thailand's SET closed essentially flat at 1,609.99. Oil jumped on an escalating, active Iran conflict — Israeli strikes on a Syria airbase, a Houthi attack on a Saudi refinery, and UAE-detected Iranian missile launches — with <b>Brent up 1.5% to $93.01/bbl, WTI up 2.1% to $86.16;</b> gold held broadly steady near $4,516/oz, a notable decoupling from rising yields that points to a genuine fiscal/geopolitical risk premium. Trump's Canada tariff pause expires today, Friday 21 August, with an auto-tariff cut to 15% reportedly still being finalized. For your clients: <b>Thursday's reversal — yields resuming their climb after barely a day of relief — is the strongest, most urgent bond-lock-in case yet,</b> not a signal to wait; frame the Wall Street sell-off and Moderna's 20% round-trip as a reminder that both rates risk and single-stock swings argue for a diversified, income-anchored portfolio. <b>Keep the geopolitical hedge conversation live</b> — gold's resilience even as yields rose shows it's doing real work as a fiscal/war-risk hedge, separate from the bond trade.`,
      th:`<b>วอลล์สตรีทเทขายหนักวันพฤหัสฯ ดัชนี Dow ร่วงแรงสุดตั้งแต่ 29 ก.ค.: ดัชนี S&P 500 ลดลง 0.87% สู่ 7,641.16 ดัชนี Dow ลดลง 1.32% (−703.84 จุด) สู่ 52,759.21 และดัชนี Nasdaq ลดลง 1.00% สู่ 26,067.17</b> รวมทั้งสัปดาห์ S&P ลบ 1.9% Nasdaq ลบ 2.5% มีแนวโน้มยุติสถิติปิดบวกต่อเนื่อง 3 สัปดาห์ <b>การเข้าแทรกแซงซื้อคืนพันธบัตรของคลังสหรัฐฯ ช่วยผ่อนคลายได้เพียงวันเดียว — ผลตอบแทนพันธบัตร 10 ปีขึ้นสู่ 4.704% และ 30 ปีดีดกลับใกล้ 5.27% เข้าใกล้จุดสูงสุดตั้งแต่ปี 2007</b> ขณะ CBO ปรับเพิ่มประมาณการขาดดุลงบประมาณปีงบประมาณเป็น 2.1 ล้านล้านดอลลาร์ (+2 แสนล้าน) และรายงานประชุมเฟดเดือน ก.ค. แสดงให้เห็นกลุ่มที่มีแนวคิด hawkish ที่กว้างขึ้น ไม่ใช่แค่ผู้โหวตสวน 3 คน กำลังถกเถียงเรื่องขึ้นดอกเบี้ย Walmart ร่วงราว 9% แม้กำไรต่อหุ้นดีกว่าคาด เนื่องจากส่งสัญญาณยอดขายสหรัฐฯ ชะลอตัวจากผู้บริโภคที่ "ลดการใช้จ่าย" เพราะราคาน้ำมันสูง ส่วน Moderna กลับตัวแรง ร่วงลงราว 20% หนึ่งวันหลังพุ่งขึ้น 177% จากข่าววัคซีน แม้ อย. สหรัฐฯ จะอนุมัติวัคซีนไข้หวัดใหญ่ mFLUSIVA ใหม่ของบริษัทก็ตาม ดัชนี DAX ยุโรปลดลง 0.41% สู่ 25,983 จากผลตอบแทนพันธบัตรเยอรมนีที่สูงขึ้น เอเชียฟื้นตัวแรง — <b>Nikkei +1.36% สู่ 66,216.79, Kospi +5.9% สู่ 6,852.58</b> จากความหวังซื้อหุ้นคืนกลุ่มชิป Hang Seng +0.80% Shanghai +0.24% — แต่ <b>ฟิวเจอร์สก่อนเอเชียเปิดวันศุกร์ชี้ลงอีกครั้ง</b> (Kospi −1.07%, Kosdaq −2.44%) ตามการปิดตลาดสหรัฐฯ ที่ risk-off วันพฤหัสฯ ดัชนี SET ไทยปิดแทบไม่เปลี่ยนแปลงที่ 1,609.99 ราคาน้ำมันพุ่งขึ้นจากสถานการณ์อิหร่านที่ทวีความรุนแรง — อิสราเอลโจมตีฐานทัพอากาศในซีเรีย กบฏฮูตีโจมตีโรงกลั่นซาอุดีอาระเบีย และสหรัฐอาหรับเอมิเรตส์ตรวจพบขีปนาวุธจากอิหร่าน — โดย <b>เบรนท์ขึ้น 1.5% สู่ $93.01 ต่อบาร์เรล WTI ขึ้น 2.1% สู่ $86.16</b> ขณะทองคำทรงตัวใกล้ $4,516 ต่อออนซ์ การแยกทิศทางจากผลตอบแทนพันธบัตรที่สูงขึ้นนี้สะท้อนแรงหนุนจากความเสี่ยงการคลัง/ภูมิรัฐศาสตร์ที่แท้จริง การพักภาษีแคนาดาของทรัมป์หมดอายุวันนี้ ศุกร์ที่ 21 ส.ค. โดยมีรายงานว่าการปรับลดภาษีรถยนต์เหลือ 15% ยังอยู่ระหว่างสรุปขั้นสุดท้าย สำหรับลูกค้าของคุณ: <b>การกลับตัวของผลตอบแทนพันธบัตรวันพฤหัสฯ ที่ไต่ขึ้นอีกครั้งหลังผ่อนคลายได้แค่วันเดียว คือจุดขายตราสารหนี้ที่หนักแน่นและเร่งด่วนที่สุดเท่าที่เคยมี</b> ไม่ใช่สัญญาณให้รอ ควรใช้การเทขายหุ้นสหรัฐฯ และการกลับตัวของ Moderna 20% เป็นเครื่องเตือนใจว่าทั้งความเสี่ยงดอกเบี้ยและความผันผวนหุ้นรายตัวสนับสนุนพอร์ตที่กระจายและเน้นรายได้เป็นหลัก <b>ควรคุยเรื่องป้องกันความเสี่ยงภูมิรัฐศาสตร์ต่อไป</b> — การที่ทองคำยืนแข็งแกร่งแม้ผลตอบแทนพันธบัตรจะสูงขึ้น แสดงว่ากำลังทำหน้าที่เป็นตัวป้องกันความเสี่ยงการคลัง/สงครามอย่างแท้จริง แยกจากการเทรดพันธบัตร`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,641.16", chg:-0.87, series:[7707.98,7641.16],
      txt:{en:`<b>US stocks sold off hard Thursday, the Dow's worst day since 29 July (S&P −0.87% to 7,641.16, Dow −1.32% to 52,759.21, Nasdaq −1.00% to 26,067.17),</b> as Treasury yields resumed climbing despite Wednesday's buyback boost — the 10-year rose to 4.704%, the 30-year to ~5.27%, near its highest since 2007. Walmart fell ~9% despite beating on EPS, flagging slowing US sales growth as consumers "trade off" on high gas prices. Moderna reversed hard, falling ~20% a day after its 177% vaccine-driven surge, even as the FDA approved its mFLUSIVA flu shot. Week-to-date the S&P is down 1.9%.`, th:`<b>หุ้นสหรัฐฯ เทขายหนักวันพฤหัสฯ ดัชนี Dow ร่วงแรงสุดตั้งแต่ 29 ก.ค. (S&P −0.87% สู่ 7,641.16, Dow −1.32% สู่ 52,759.21, Nasdaq −1.00% สู่ 26,067.17)</b> ขณะผลตอบแทนพันธบัตรกลับมาไต่ขึ้นต่อ แม้จะได้แรงหนุนจากข่าวซื้อคืนพันธบัตรวันพุธ โดยผลตอบแทน 10 ปีขึ้นสู่ 4.704% และ 30 ปีขึ้นสู่ราว 5.27% ใกล้จุดสูงสุดตั้งแต่ปี 2007 Walmart ร่วงราว 9% แม้กำไรต่อหุ้นดีกว่าคาด เนื่องจากส่งสัญญาณยอดขายสหรัฐฯ ชะลอตัวจากผู้บริโภคที่ "ลดการใช้จ่าย" เพราะราคาน้ำมันสูง Moderna กลับตัวแรง ร่วงลงราว 20% หนึ่งวันหลังพุ่งขึ้น 177% จากข่าววัคซีน แม้ อย. สหรัฐฯ จะอนุมัติวัคซีนไข้หวัดใหญ่ mFLUSIVA ใหม่ก็ตาม รวมทั้งสัปดาห์ S&P ลบ 1.9%`},
      why:{en:`Thursday's reversal — worse than the three-day losing streak Wednesday had just snapped — shows how fleeting the buyback relief was; pair the renewed sell-off with Walmart's cautious consumer signal to make the bonds-as-ballast case, and use Moderna's 20% round-trip as a reminder that single-stock biotech risk cuts both ways.`, th:`การกลับตัวของตลาดวันพฤหัสฯ ที่แย่กว่าสถิติปรับลงต่อเนื่อง 3 วันที่เพิ่งยุติไปเมื่อวันพุธ แสดงว่าแรงหนุนจากข่าวซื้อคืนพันธบัตรอยู่ได้ไม่นาน — ควรจับคู่การเทขายรอบใหม่นี้กับสัญญาณผู้บริโภคระมัดระวังของ Walmart เพื่อเปิดประเด็นพันธบัตรเป็นตัวถ่วงสมดุลพอร์ต และใช้การกลับตัว 20% ของ Moderna เป็นเครื่องเตือนใจว่าความเสี่ยงหุ้นไบโอเทครายตัวเคลื่อนไหวได้ทั้งสองทาง`},
      full:{en:`US stocks fell sharply Thursday in the Dow's worst session since 29 July. The S&P 500 dropped 0.87% (−66.82pts) to 7,641.16, the Dow Jones Industrial Average lost 1.32% (−703.84pts) to 52,759.21, and the Nasdaq Composite fell 1.00% to 26,067.17 — week-to-date the S&P is down 1.9%, the Nasdaq 2.5%, on track to snap a three-week win streak. Treasury yields resumed climbing despite Wednesday's emergency buyback announcement: the 10-year rose about 5bp to 4.704%, "wiping out the decline" from the buyback relief per CNBC, while the 30-year climbed back to roughly 5.26–5.27%, near its highest level since 2007 — Bloomberg called the Treasury's move "at best a circuit breaker for the global bond slump." Behind the renewed pressure: the CBO raised its FY deficit estimate to about $2.1tn (up $200bn from February), and Wednesday's July FOMC minutes showed a broader hawkish bloc — not just three regional-president dissenters — actively debating a hike, with several participants saying tighter policy "would likely be necessary" if inflation doesn't cool, citing tariff pass-through, Middle-East-driven energy costs and AI-buildout demand. Walmart shares fell about 9% even after beating EPS estimates, as the company flagged slowing US sales growth with consumers "trading off" amid high gas prices — the sharpest single-stock move of the day. Moderna shares reversed hard, falling roughly 20% a day after surging as much as 177% on positive melanoma-vaccine trial data with Merck, even as the FDA separately approved the company's new mFLUSIVA flu shot.`, th:`หุ้นสหรัฐฯ ร่วงลงแรงวันพฤหัสฯ ปรับลงหนักสุดตั้งแต่ 29 ก.ค. ดัชนี S&P 500 ลดลง 0.87% (−66.82 จุด) สู่ 7,641.16 ดัชนี Dow Jones ลดลง 1.32% (−703.84 จุด) สู่ 52,759.21 และดัชนี Nasdaq Composite ลดลง 1.00% สู่ 26,067.17 — รวมทั้งสัปดาห์ S&P ลบ 1.9% Nasdaq ลบ 2.5% มีแนวโน้มยุติสถิติปิดบวกต่อเนื่อง 3 สัปดาห์ ผลตอบแทนพันธบัตรกลับมาไต่ขึ้นต่อ แม้จะมีข่าวซื้อคืนพันธบัตรฉุกเฉินของคลังวันพุธ โดยผลตอบแทน 10 ปีขึ้นราว 5 basis point สู่ 4.704% ซึ่ง CNBC ระบุว่า "ลบล้างการปรับลง" จากข่าวซื้อคืนไปหมดแล้ว ขณะผลตอบแทน 30 ปีดีดกลับสู่ราว 5.26-5.27% ใกล้จุดสูงสุดตั้งแต่ปี 2007 — Bloomberg เรียกมาตรการของคลังว่า "อย่างดีก็แค่ตัวช่วยชะลอการร่วงของตลาดพันธบัตรโลกชั่วคราว" เบื้องหลังแรงกดดันที่กลับมา: CBO ปรับเพิ่มประมาณการขาดดุลงบประมาณปีงบประมาณเป็นราว 2.1 ล้านล้านดอลลาร์ (เพิ่มขึ้น 2 แสนล้านจากเดือน ก.พ.) และรายงานประชุมเฟดเดือน ก.ค. ที่เผยแพร่วันพุธแสดงให้เห็นกลุ่มแนวคิด hawkish ที่กว้างขึ้น ไม่ใช่แค่ผู้ว่าการภูมิภาคที่โหวตสวน 3 คน กำลังถกเถียงเรื่องขึ้นดอกเบี้ยอย่างจริงจัง โดยหลายคนระบุว่านโยบายที่เข้มงวดขึ้น "น่าจะจำเป็น" หากเงินเฟ้อไม่ชะลอตัว โดยอ้างถึงผลกระทบจากภาษีนำเข้า ต้นทุนพลังงานจากตะวันออกกลาง และดีมานด์การลงทุน AI หุ้น Walmart ร่วงราว 9% แม้กำไรต่อหุ้นจะดีกว่าคาด เนื่องจากบริษัทส่งสัญญาณยอดขายสหรัฐฯ ชะลอตัว จากผู้บริโภคที่ "ลดการใช้จ่าย" ท่ามกลางราคาน้ำมันที่สูง ถือเป็นการเคลื่อนไหวหุ้นรายตัวที่รุนแรงที่สุดของวัน หุ้น Moderna กลับตัวแรง ร่วงลงราว 20% หนึ่งวันหลังพุ่งขึ้นสูงสุดถึง 177% จากผลบวกของการทดลองวัคซีนมะเร็งผิวหนังร่วมกับ Merck แม้ อย. สหรัฐฯ จะอนุมัติวัคซีนไข้หวัดใหญ่ mFLUSIVA ใหม่ของบริษัทแยกต่างหากก็ตาม`},
      sources:[{l:"CNBC",u:"https://www.cnbc.com/2026/08/20/stock-market-today-live-updates.html"},{l:"Yahoo Finance",u:"https://finance.yahoo.com/markets/live/stock-market-today-thursday-august-20-dow-sp-500-nasdaq-081139322.html"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,983", chg:-0.41, series:[26091,25983],
      txt:{en:`<b>DAX fell 0.41% (−108pts) to 25,983 Thursday,</b> as inflation caution and geopolitical uncertainty weighed, with German Bund yields near a 15-year high on rising defense-spending expectations — the same global bond-market pressure hitting Wall Street.`, th:`<b>DAX ลดลง 0.41% (−108 จุด) สู่ 25,983 วันพฤหัสฯ</b> จากความระมัดระวังเรื่องเงินเฟ้อและความไม่แน่นอนภูมิรัฐศาสตร์ ขณะผลตอบแทนพันธบัตรเยอรมนี (Bund) ใกล้จุดสูงสุดในรอบ 15 ปี จากการคาดการณ์งบใช้จ่ายด้านกลาโหมที่เพิ่มขึ้น — แรงกดดันตลาดพันธบัตรโลกเดียวกับที่กระทบวอลล์สตรีท`},
      why:{en:`Bund yields near a 15-year high alongside US Treasury yields resuming their climb reinforces that the bond-lock-in pitch isn't a US-only story — it's a global rates repricing worth raising with clients holding European exposure too.`, th:`ผลตอบแทนพันธบัตร Bund เยอรมนีที่ใกล้จุดสูงสุดรอบ 15 ปี พร้อมกับผลตอบแทนพันธบัตรสหรัฐฯ ที่กลับมาไต่ขึ้นต่อ ตอกย้ำว่าจุดขายเรื่องล็อกคูปองพันธบัตรไม่ใช่เรื่องเฉพาะสหรัฐฯ แต่เป็นการปรับฐานอัตราดอกเบี้ยทั่วโลก ที่ควรคุยกับลูกค้าที่ถือสินทรัพย์ยุโรปด้วย`},
      full:{en:`European equities slipped Thursday. Germany's DAX fell 0.41% (−108pts) to 25,983, weighed by inflation caution and ongoing geopolitical uncertainty, including the still-unresolved Iran conflict feeding into oil prices. German 10-year Bund yields traded near a roughly 15-year high, as markets price in higher expected defense spending across the bloc — echoing the same fiscal/deficit-driven bond-market pressure that pushed US Treasury yields back up the same session.`, th:`หุ้นยุโรปปรับลงวันพฤหัสฯ ดัชนี DAX เยอรมนีลดลง 0.41% (−108 จุด) สู่ 25,983 กดดันจากความระมัดระวังเรื่องเงินเฟ้อและความไม่แน่นอนภูมิรัฐศาสตร์ที่ยังดำเนินอยู่ รวมถึงสถานการณ์อิหร่านที่ยังไม่คลี่คลายซึ่งส่งผลต่อราคาน้ำมัน ผลตอบแทนพันธบัตรรัฐบาลเยอรมนีอายุ 10 ปี (Bund) ซื้อขายใกล้จุดสูงสุดในรอบราว 15 ปี ขณะตลาดตั้งราคารับการคาดการณ์งบใช้จ่ายด้านกลาโหมที่สูงขึ้นทั่วภูมิภาค สะท้อนแรงกดดันจากปัจจัยการคลัง/ขาดดุลงบประมาณแบบเดียวกับที่ผลักดันผลตอบแทนพันธบัตรสหรัฐฯ ให้กลับมาไต่ขึ้นในวันเดียวกัน`},
      sources:[{l:"MarketScreener",u:"https://www.marketscreener.com/news/frankfurt-stocks-close-dax-climbs-above-26-500-points-for-the-first-time-ce7859dbda81f126"},{l:"CNBC Markets",u:"https://www.cnbc.com/markets/"},{l:"Bloomberg Europe",u:"https://www.bloomberg.com/europe"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"66,216.79", chg:1.36, series:[65724.25,66216.79],
      txt:{en:`<b>Nikkei rebounded 1.36% to 66,216.79 Thursday</b> as chip stocks recovered from Wednesday's rout, while <b>South Korea's Kospi surged 5.9% to 6,852.58</b> — a sharp reversal led by Samsung Electronics and SK Hynix on shareholder-return/buyback hopes. But the relief looks short-lived: <b>Friday's pre-Asia futures point lower again</b> (Nikkei futures ~65,510–65,560, Kospi futures −1.07%, Kosdaq −2.44%), tracking Thursday's weak US close.`, th:`<b>Nikkei ฟื้นตัว 1.36% สู่ 66,216.79 วันพฤหัสฯ</b> ขณะหุ้นชิปฟื้นตัวจากการเทขายวันพุธ ด้าน <b>Kospi เกาหลีใต้พุ่งขึ้น 5.9% สู่ 6,852.58</b> กลับตัวแรงนำโดย Samsung Electronics และ SK Hynix จากความหวังเรื่องผลตอบแทนผู้ถือหุ้น/ซื้อหุ้นคืน แต่การฟื้นตัวดูเหมือนจะอยู่ได้ไม่นาน — <b>ฟิวเจอร์สก่อนเอเชียเปิดวันศุกร์ชี้ลงอีกครั้ง</b> (ฟิวเจอร์ส Nikkei ~65,510–65,560, ฟิวเจอร์ส Kospi −1.07%, Kosdaq −2.44%) ตามการปิดตลาดสหรัฐฯ ที่อ่อนแอวันพฤหัสฯ`},
      why:{en:`A Wed-rout → Thu-rebound → Fri-futures-reversal whipsaw in three sessions is itself the story — realized volatility has spiked sharply. Frame this as short-term noise for long-term AI/tech holdings, and use the swing to pivot cautious clients toward bonds and diversified exposure.`, th:`การแกว่งตัวจากเทขายวันพุธ → ฟื้นตัวแรงวันพฤหัสฯ → ฟิวเจอร์สกลับลงวันศุกร์ ภายใน 3 วันทำการ คือประเด็นสำคัญในตัวเอง — ความผันผวนจริงพุ่งขึ้นชัดเจน ควรอธิบายว่านี่คือความผันผวนระยะสั้นสำหรับพอร์ตเทค/AI ระยะยาว และใช้จังหวะนี้ชักชวนลูกค้าที่ระมัดระวังให้หันไปพันธบัตรและการกระจายลงทุน`},
      full:{en:`Asian equities staged a sharp Thursday rebound after Wednesday's rout. Japan's Nikkei 225 rose 1.36% to close at 66,216.79 as chip and AI-supply-chain names recovered lost ground. South Korea's Kospi jumped 5.9% to 6,852.58, a sharp reversal from Wednesday's sidecar-triggering plunge, led by Samsung Electronics and SK Hynix on renewed shareholder-return and buyback hopes. The rebound, however, looks fragile: Friday pre-Asia futures point to renewed weakness across the region — Nikkei futures around 65,510–65,560 (implying a roughly 0.9% pullback from Thursday's close), Kospi futures down 1.07%, Kosdaq futures down 2.44%, and ASX 200 futures down 0.21% — as the region digests Thursday's risk-off US close (Dow's worst day since 29 July) and Treasury yields resuming their climb.`, th:`หุ้นเอเชียฟื้นตัวแรงวันพฤหัสฯ หลังการเทขายวันพุธ ดัชนี Nikkei 225 ญี่ปุ่นเพิ่มขึ้น 1.36% ปิดที่ 66,216.79 ขณะหุ้นกลุ่มชิปและห่วงโซ่อุปทาน AI ฟื้นตัวจากที่ปรับลงก่อนหน้า ดัชนี Kospi เกาหลีใต้พุ่งขึ้น 5.9% สู่ 6,852.58 กลับตัวแรงจากที่ร่วงจนต้องหยุดพักการซื้อขายเมื่อวันพุธ นำโดย Samsung Electronics และ SK Hynix จากความหวังเรื่องผลตอบแทนผู้ถือหุ้นและซื้อหุ้นคืนที่กลับมา อย่างไรก็ตาม การฟื้นตัวนี้ดูเปราะบาง ฟิวเจอร์สก่อนเอเชียเปิดวันศุกร์ชี้ความอ่อนแอกลับมาทั่วภูมิภาค — ฟิวเจอร์ส Nikkei ราว 65,510-65,560 (สื่อถึงการปรับลงราว 0.9% จากปิดวันพฤหัสฯ) ฟิวเจอร์ส Kospi ลบ 1.07% ฟิวเจอร์ส Kosdaq ลบ 2.44% และฟิวเจอร์ส ASX 200 ลบ 0.21% ขณะภูมิภาคย่อยข่าวการปิดตลาดสหรัฐฯ ที่ risk-off วันพฤหัสฯ (Dow ร่วงหนักสุดตั้งแต่ 29 ก.ค.) และผลตอบแทนพันธบัตรที่กลับมาไต่ขึ้นต่อ`},
      sources:[{l:"BBNTimes",u:"https://www.bbntimes.com/global-economy/nikkei-225-tokyo-benchmark-rebounds-1-36-to-66-217-as-chip-stocks-recover-from-selloff"},{l:"Korea Times",u:"https://www.koreatimes.co.kr/economy/20260820/kospi-surges-59-as-chipmakers-rally-on-shareholder-returns"},{l:"CNBC Asia Markets",u:"https://www.cnbc.com/markets/asia-markets/"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,698.49", chg:0.80, series:[25369,25698.49],
      txt:{en:`<b>Hang Seng rose 0.80% Thursday to 25,698.49,</b> while mainland China's <b>Shanghai Composite edged up 0.24% to ~3,903.7,</b> both stabilizing as the region's chip stocks recovered alongside Japan and South Korea. Friday pre-Asia futures point to a roughly flat Hang Seng open near 25,696.`, th:`<b>Hang Seng เพิ่มขึ้น 0.80% วันพฤหัสฯ สู่ 25,698.49</b> ขณะดัชนี <b>Shanghai Composite จีนแผ่นดินใหญ่ขยับขึ้น 0.24% สู่ราว 3,903.7</b> ทั้งคู่ทรงตัวได้ เนื่องจากหุ้นชิปในภูมิภาคฟื้นตัวพร้อมกับญี่ปุ่นและเกาหลีใต้ ฟิวเจอร์สก่อนเอเชียเปิดวันศุกร์ชี้ Hang Seng จะเปิดแทบไม่เปลี่ยนแปลงใกล้ 25,696`},
      why:{en:`A same-day stabilization in both Hong Kong and Shanghai, alongside a much sharper rebound in Korea/Japan, shows Greater China is lagging the regional bounce rather than leading either direction — a useful prompt to favour diversified Asia exposure and bonds over concentrated single-country bets.`, th:`การทรงตัวในวันเดียวกันของทั้งฮ่องกงและเซี่ยงไฮ้ ขณะเกาหลี/ญี่ปุ่นฟื้นตัวแรงกว่ามาก แสดงว่าจีนแผ่นดินใหญ่/ฮ่องกงตามหลังการฟื้นตัวในภูมิภาค ไม่ได้นำทั้งสองทิศทาง — เป็นจังหวะดีที่จะแนะนำให้กระจายลงทุนในเอเชียและตราสารหนี้ มากกว่าเดิมพันประเทศเดียว`},
      full:{en:`Chinese and Hong Kong equities stabilized Thursday as the region's chip-sector selloff eased. The Hang Seng rose 0.80% to 25,698.49, and mainland China's Shanghai Composite edged up 0.24% to around 3,903.7, both far more muted than the sharp 5.9% Kospi and 1.36% Nikkei rebounds the same session — suggesting Greater China lagged rather than led the regional recovery. Friday's pre-Asia futures point to a roughly flat Hang Seng open near 25,696, one of the steadier reads across the region compared with sharper reversals signalled in Korean futures. The move sits on top of an unresolved US–China tariff overhang, reinforcing the case for diversified Asia-ex-China strategies and fixed income over concentrated single-country exposure.`, th:`หุ้นจีนและฮ่องกงทรงตัวได้วันพฤหัสฯ ขณะแรงเทขายหุ้นชิปในภูมิภาคผ่อนคลายลง ดัชนี Hang Seng เพิ่มขึ้น 0.80% สู่ 25,698.49 และดัชนี Shanghai Composite จีนแผ่นดินใหญ่ขยับขึ้น 0.24% สู่ราว 3,903.7 ทั้งคู่เบากว่าการฟื้นตัวแรงของ Kospi ที่ 5.9% และ Nikkei ที่ 1.36% ในวันเดียวกันมาก บ่งชี้ว่าจีนแผ่นดินใหญ่/ฮ่องกงตามหลัง ไม่ได้นำการฟื้นตัวในภูมิภาค ฟิวเจอร์สก่อนเอเชียเปิดวันศุกร์ชี้ Hang Seng จะเปิดแทบไม่เปลี่ยนแปลงใกล้ 25,696 ซึ่งนิ่งกว่าฟิวเจอร์สเกาหลีที่ชี้กลับตัวแรงกว่า การเคลื่อนไหวนี้ยังอยู่บนแรงกดดันภาษีสหรัฐ–จีนที่ยังไม่คลี่คลาย ตอกย้ำเหตุผลให้เลือกกลยุทธ์เอเชียไม่รวมจีนแบบกระจายความเสี่ยงและตราสารหนี้มากกว่าการเดิมพันประเทศเดียว`},
      sources:[{l:"Bastille Post",u:"https://www.bastillepost.com/global/article/6094515-hong-kong-stocks-close-higher-thursday-9"},{l:"BBNTimes",u:"https://www.bbntimes.com/global-economy/sse-composite-falls-to-around-3-908-as-shanghai-lags-asia-s-broader-rally"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,609.99", chg:0.01, series:[1609.76,1609.99],
      txt:{en:`<b>SET Index closed essentially flat at 1,609.99 Thursday (+0.23pts, +0.01%),</b> on turnover of about THB 82.4 billion, as investors stayed cautious tracking global yield and geopolitical crosscurrents rather than taking a clear direction.`, th:`<b>ดัชนี SET ปิดแทบไม่เปลี่ยนแปลงที่ 1,609.99 วันพฤหัสฯ (+0.23 จุด, +0.01%)</b> มูลค่าการซื้อขายราว 8.24 หมื่นล้านบาท ขณะนักลงทุนยังระมัดระวัง ติดตามกระแสผลตอบแทนพันธบัตรและภูมิรัฐศาสตร์โลก มากกว่าจะเลือกทิศทางที่ชัดเจน`},
      why:{en:`A flat, indecisive SET even as US and regional markets whipsawed sharply keeps yield-seeking clients looking toward offshore bonds and funds — your core book — for a clearer story than the local index is currently offering.`, th:`SET ที่แทบไม่ขยับ แม้ตลาดสหรัฐฯ และภูมิภาคจะแกว่งตัวแรง ยังคงผลักดันให้ลูกค้าที่มองหาผลตอบแทนหันไปหาตราสารหนี้และกองทุนต่างประเทศ — ซึ่งเป็นพอร์ตหลักของคุณ — ที่ให้ทิศทางชัดเจนกว่าดัชนีในประเทศตอนนี้`},
      full:{en:`Thailand's SET Index closed Thursday at 1,609.99, up just 0.23 points (+0.01%), on turnover of about THB 82.4 billion. The near-flat session came as global markets whipsawed — Wall Street's sharpest sell-off since late July, a sharp Asia-ex-Thailand rebound, and renewed pressure on US Treasury yields — leaving local investors without a clear directional cue. With global bond yields elevated again and volatility rising across regional equities, yield-seeking Thai investors continue to look offshore for income and growth alongside domestic exposure.`, th:`ดัชนี SET ของไทยปิดตลาดวันพฤหัสฯ ที่ 1,609.99 เพิ่มขึ้นเพียง 0.23 จุด (+0.01%) มูลค่าการซื้อขายราว 8.24 หมื่นล้านบาท การซื้อขายที่แทบไม่เปลี่ยนแปลงนี้เกิดขึ้นท่ามกลางตลาดโลกที่แกว่งตัวแรง — วอลล์สตรีทเทขายหนักสุดตั้งแต่ปลาย ก.ค. เอเชีย (นอกไทย) ฟื้นตัวแรง และผลตอบแทนพันธบัตรสหรัฐฯ กลับมากดดันอีกครั้ง — ทำให้นักลงทุนในประเทศไม่มีทิศทางที่ชัดเจน เมื่อผลตอบแทนพันธบัตรทั่วโลกยืนสูงอีกครั้งและความผันผวนในหุ้นภูมิภาคเพิ่มขึ้น นักลงทุนไทยที่มองหาผลตอบแทนจึงยังหันไปลงทุนต่างประเทศควบคู่กับการลงทุนในประเทศ`},
      sources:[{l:"Kaohoon Intl",u:"https://www.kaohooninternational.com/markets/589123"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold held broadly steady near $4,516/oz Thursday</b> (intraday range $4,475–4,536), still close to its early-June highs — a notable decoupling, since gold normally softens as yields rise, pointing to a genuine fiscal/geopolitical risk premium rather than a pure rate trade. <b>Brent jumped 1.5% to $93.01/bbl and WTI rose 2.1% to $86.16,</b> both extending a week of gains (Brent +4% this week), as the Iran conflict escalated sharply: Israeli strikes on an airbase in Idlib, Syria drew a US "deeply concerned" statement, Hezbollah and Israel traded fire in Lebanon, Houthi rebels struck a Saudi refinery, and the UAE detected ballistic missiles launched from Iran. This is now an active, multi-front conflict rather than a contained standoff — worth naming plainly with clients.`, th:`<b>ทองคำทรงตัวใกล้ $4,516 ต่อออนซ์วันพฤหัสฯ</b> (ช่วงระหว่างวัน $4,475–4,536) ยังใกล้จุดสูงสุดนับตั้งแต่ต้นเดือนมิถุนายน — การแยกทิศทางที่น่าสนใจ เพราะปกติทองคำจะอ่อนตัวเมื่อผลตอบแทนพันธบัตรสูงขึ้น สะท้อนแรงหนุนจากความเสี่ยงการคลัง/ภูมิรัฐศาสตร์ที่แท้จริง มากกว่าการเทรดตามอัตราดอกเบี้ยล้วนๆ <b>เบรนท์พุ่งขึ้น 1.5% สู่ $93.01 ต่อบาร์เรล และ WTI ขึ้น 2.1% สู่ $86.16</b> ทั้งคู่ปรับขึ้นต่อเนื่องทั้งสัปดาห์ (เบรนท์ +4% สัปดาห์นี้) ขณะสถานการณ์อิหร่านทวีความรุนแรงขึ้นชัดเจน: อิสราเอลโจมตีฐานทัพอากาศในเมือง Idlib ซีเรีย จนสหรัฐฯ ออกแถลงการณ์ "กังวลอย่างยิ่ง" ฮิซบอลเลาะห์และอิสราเอลปะทะกันในเลบานอน กบฏฮูตีโจมตีโรงกลั่นน้ำมันซาอุดีอาระเบีย และสหรัฐอาหรับเอมิเรตส์ตรวจพบขีปนาวุธที่ยิงจากอิหร่าน นี่คือความขัดแย้งที่ยังดำเนินอยู่หลายแนวรบ ไม่ใช่แค่สถานการณ์ตึงเครียดที่จำกัดวงแล้ว — ควรบอกลูกค้าตรงๆ`},
     why:{en:`Gold's resilience even as US and German bond yields both push higher is the clearest sign yet that a genuine war-risk/fiscal premium is at work — a strong, current argument for keeping the geopolitical hedge in a client's portfolio as its own conversation, separate from the rates-driven bond pitch.`, th:`การที่ทองคำยืนแข็งแกร่งได้ แม้ผลตอบแทนพันธบัตรทั้งสหรัฐฯ และเยอรมนีจะสูงขึ้นทั้งคู่ เป็นสัญญาณที่ชัดเจนที่สุดว่าแรงหนุนจากความเสี่ยงสงคราม/การคลังที่แท้จริงกำลังทำงานอยู่ — เป็นเหตุผลที่หนักแน่นและทันเวลาให้คงการป้องกันความเสี่ยงภูมิรัฐศาสตร์ไว้ในพอร์ตลูกค้า เป็นบทสนทนาแยกต่างหากจากจุดขายพันธบัตรที่มาจากอัตราดอกเบี้ย`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Treasury's own buyback intervention only worked for about one session:</b> Bloomberg called it "at best a circuit breaker for the global bond slump." <b>The 10-year Treasury yield rose about 5bp Thursday to 4.704%,</b> "wiping out the decline" from Wednesday's relief per CNBC, while <b>the 30-year climbed back to roughly 5.26–5.27%,</b> near its highest level since 2007. Behind the renewed pressure: the CBO raised its FY deficit estimate to about $2.1tn (+$200bn from February), and Wednesday's July FOMC minutes revealed a broader hawkish bloc — not just three dissenters — actively debating a hike, with several participants saying tighter policy "would likely be necessary" if inflation doesn't cool, citing tariff pass-through, Middle-East-driven energy costs and AI-buildout demand. CME FedWatch still puts September-hold odds near 68%.`, th:`<b>การเข้าแทรกแซงซื้อคืนพันธบัตรของคลังสหรัฐฯ ช่วยผ่อนคลายได้เพียงวันเดียว:</b> Bloomberg เรียกมาตรการนี้ว่า "อย่างดีก็แค่ตัวช่วยชะลอการร่วงของตลาดพันธบัตรโลกชั่วคราว" <b>ผลตอบแทนพันธบัตร 10 ปีขึ้นราว 5 basis point วันพฤหัสฯ สู่ 4.704%</b> ซึ่ง CNBC ระบุว่า "ลบล้าง" การปรับลงจากข่าวผ่อนคลายวันพุธไปหมดแล้ว ขณะ <b>ผลตอบแทน 30 ปีดีดกลับสู่ราว 5.26-5.27%</b> ใกล้จุดสูงสุดตั้งแต่ปี 2007 เบื้องหลังแรงกดดันที่กลับมา: CBO ปรับเพิ่มประมาณการขาดดุลงบประมาณปีงบประมาณเป็นราว 2.1 ล้านล้านดอลลาร์ (+2 แสนล้านจากเดือน ก.พ.) และรายงานประชุมเฟดเดือน ก.ค. ที่เผยแพร่วันพุธ เผยให้เห็นกลุ่มแนวคิด hawkish ที่กว้างขึ้น ไม่ใช่แค่ผู้โหวตสวน 3 คน กำลังถกเถียงเรื่องขึ้นดอกเบี้ยอย่างจริงจัง โดยหลายคนระบุว่านโยบายที่เข้มงวดขึ้น "น่าจะจำเป็น" หากเงินเฟ้อไม่ชะลอตัว โดยอ้างถึงผลกระทบจากภาษีนำเข้า ต้นทุนพลังงานจากตะวันออกกลาง และดีมานด์การลงทุน AI CME FedWatch ยังให้น้ำหนักโอกาสคงดอกเบี้ยเดือน ก.ย. ใกล้ 68%`},
     why:{en:`Yields resuming their climb after barely one session of relief — with a widening deficit and a broader hawkish Fed bloc behind it — is the strongest, most urgent bond-lock-in signal yet: frame Thursday's reversal as proof the window is narrowing in real time, not a reason to wait for a better entry point.`, th:`ผลตอบแทนพันธบัตรที่กลับมาไต่ขึ้นต่อ หลังผ่อนคลายได้เพียงวันเดียว โดยมีขาดดุลงบประมาณที่กว้างขึ้นและกลุ่มเฟดที่มีแนวคิด hawkish กว้างขึ้นอยู่เบื้องหลัง คือสัญญาณล็อกคูปองพันธบัตรที่หนักแน่นและเร่งด่วนที่สุดเท่าที่เคยมี — ควรอธิบายว่าการกลับตัวของผลตอบแทนวันพฤหัสฯ พิสูจน์ว่าหน้าต่างโอกาสกำลังแคบลงจริง ไม่ใช่เหตุผลให้รอจังหวะที่ดีกว่า`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`<b>Trump's three-day pause on Canada's 50% tariff expires today, Friday 21 August,</b> with final terms — reportedly including a cut in the disputed auto tariff to 15% from 25% — still being negotiated as of Thursday. PM Carney has called the progress so far "substantial" but flagged autos, steel, aluminum, forest products, dairy, alcohol and procurement as unresolved. This is a live, undecided catalyst for today's session, not a settled headline. China sits at 12.5%; Washington has floated pharma tariffs rising toward 200% later in 2026.`, th:`<b>การพักภาษี 3 วันของทรัมป์ต่อแคนาดา 50% หมดอายุวันนี้ ศุกร์ที่ 21 ส.ค.</b> โดยเงื่อนไขสุดท้าย — ซึ่งมีรายงานว่ารวมถึงการปรับลดภาษีรถยนต์ที่เป็นข้อพิพาทเหลือ 15% จาก 25% — ยังอยู่ระหว่างการเจรจา ณ วันพฤหัสฯ นายกฯ Carney เรียกความคืบหน้าจนถึงตอนนี้ว่า "มีนัยสำคัญ" แต่ยังระบุว่ารถยนต์ เหล็ก อะลูมิเนียม ผลิตภัณฑ์ป่าไม้ นม แอลกอฮอล์ และการจัดซื้อภาครัฐยังไม่คลี่คลาย นี่คือปัจจัยเสี่ยงที่ยังไม่ตัดสินสำหรับการซื้อขายวันนี้ ไม่ใช่ข่าวที่จบแล้ว จีนอยู่ที่ 12.5% สหรัฐยังส่งสัญญาณอาจขึ้นภาษียาสูงถึง 200% ปลายปี 2026`}, w:{en:`A same-day tariff deadline with terms still unsettled is a real, live risk event — flag it to clients as a reason for near-term volatility on Canadian and cross-border-exposed names today, while keeping the broader case for bonds and diversified global exposure over single-country bets front and centre.`, th:`เส้นตายภาษีวันนี้ที่เงื่อนไขยังไม่ยุติ เป็นความเสี่ยงจริงที่ยังไม่ตัดสิน — ควรบอกลูกค้าว่านี่คือเหตุผลให้เกิดความผันผวนระยะสั้นต่อหุ้นแคนาดาและหุ้นที่มีสัดส่วนการค้าข้ามพรมแดนสูงวันนี้ ขณะยังต้องเน้นย้ำเหตุผลหลักเรื่องตราสารหนี้และกระจายลงทุนทั่วโลก มากกว่าเดิมพันประเทศเดียว`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>The Iran conflict — active since 28 February 2026 — escalated sharply this week on multiple fronts:</b> Israeli strikes hit an airbase in Idlib, Syria, drawing a US "deeply concerned" statement; Hezbollah and Israel traded fire in Lebanon; Houthi rebels struck a Saudi refinery; and the UAE detected ballistic missiles launched from Iran. <b>Oil jumped in response: Brent rose 1.5% to $93.01/bbl, WTI 2.1% to $86.16,</b> up roughly 4% this week. This is a genuinely active, multi-front conflict, not a contained "standoff" — worth naming plainly. Markets have so far absorbed it without panic (Thursday's Asia rebound, gold merely steady), but the risk premium is clearly building into oil.`, th:`<b>ความขัดแย้งกับอิหร่าน — ที่ดำเนินอยู่ตั้งแต่ 28 ก.พ. 2026 — ทวีความรุนแรงขึ้นชัดเจนสัปดาห์นี้ในหลายแนวรบ:</b> อิสราเอลโจมตีฐานทัพอากาศในเมือง Idlib ซีเรีย จนสหรัฐฯ ออกแถลงการณ์ "กังวลอย่างยิ่ง" ฮิซบอลเลาะห์และอิสราเอลปะทะกันในเลบานอน กบฏฮูตีโจมตีโรงกลั่นน้ำมันซาอุดีอาระเบีย และสหรัฐอาหรับเอมิเรตส์ตรวจพบขีปนาวุธที่ยิงจากอิหร่าน <b>ราคาน้ำมันตอบสนองทันที: เบรนท์ขึ้น 1.5% สู่ $93.01 ต่อบาร์เรล WTI ขึ้น 2.1% สู่ $86.16</b> ปรับขึ้นราว 4% ในสัปดาห์นี้ นี่คือความขัดแย้งที่ยังดำเนินอยู่จริงหลายแนวรบ ไม่ใช่แค่ "สถานการณ์ตึงเครียด" ที่จำกัดวง — ควรบอกลูกค้าตรงๆ ตลาดยังรับมือได้โดยไม่ตื่นตระหนกจนถึงตอนนี้ (เอเชียฟื้นตัววันพฤหัสฯ ทองคำแค่ทรงตัว) แต่ส่วนชดเชยความเสี่ยงในราคาน้ำมันกำลังก่อตัวชัดเจน`}, w:{en:`Naming this as an active multi-front conflict, not a "standoff," resets client expectations correctly — the oil bid is a rational response to real escalation. Keep gold in the conversation as the cleaner hedge, since it's holding steady even as yields rise, which is itself informative about how seriously markets are pricing this risk.`, th:`การเรียกสถานการณ์นี้ว่าความขัดแย้งที่ยังดำเนินอยู่หลายแนวรบ ไม่ใช่แค่ "ภาวะตึงเครียด" ช่วยปรับความคาดหวังของลูกค้าให้ถูกต้อง — ราคาน้ำมันที่ขึ้นเป็นการตอบสนองที่สมเหตุสมผลต่อสถานการณ์ที่ทวีความรุนแรงจริง ควรคงทองคำไว้ในบทสนทนาในฐานะตัวป้องกันความเสี่ยงที่ชัดเจนกว่า เพราะยืนทรงตัวได้แม้ผลตอบแทนพันธบัตรจะสูงขึ้น ซึ่งบ่งบอกได้เองว่าตลาดกำลังตั้งราคารับความเสี่ยงนี้อย่างจริงจังแค่ไหน`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`<b>Treasury's buyback intervention only worked for about one session:</b> the 10-year yield rose to 4.704% Thursday, "wiping out" Wednesday's relief, while the 30-year climbed back to roughly 5.26–5.27%, near its highest since 2007. Behind the reversal: the CBO raised its FY deficit estimate to about $2.1tn (+$200bn), and Wednesday's July FOMC minutes showed a broader hawkish bloc actively debating a hike, citing tariff pass-through, energy costs and AI-buildout demand as inflation risks. CME FedWatch puts September-hold odds near 68%.`, th:`<b>การเข้าแทรกแซงซื้อคืนพันธบัตรของคลังสหรัฐฯ ช่วยผ่อนคลายได้เพียงวันเดียว:</b> ผลตอบแทนพันธบัตร 10 ปีขึ้นสู่ 4.704% วันพฤหัสฯ "ลบล้าง" การผ่อนคลายจากวันพุธไปหมด ขณะผลตอบแทน 30 ปีดีดกลับสู่ราว 5.26-5.27% ใกล้จุดสูงสุดตั้งแต่ปี 2007 เบื้องหลังการกลับตัวนี้: CBO ปรับเพิ่มประมาณการขาดดุลงบประมาณปีงบประมาณเป็นราว 2.1 ล้านล้านดอลลาร์ (+2 แสนล้าน) และรายงานประชุมเฟดเดือน ก.ค. ที่เผยแพร่วันพุธ แสดงให้เห็นกลุ่มแนวคิด hawkish ที่กว้างขึ้นกำลังถกเถียงเรื่องขึ้นดอกเบี้ยอย่างจริงจัง โดยอ้างถึงผลกระทบภาษีนำเข้า ต้นทุนพลังงาน และดีมานด์การลงทุน AI ว่าเป็นความเสี่ยงเงินเฟ้อ CME FedWatch ให้น้ำหนักโอกาสคงดอกเบี้ยเดือน ก.ย. ใกล้ 68%`}, w:{en:`Yields resuming their climb after barely a day of relief, with a widening deficit and a broader hawkish Fed bloc behind it, is the clearest signal yet that policymakers themselves see this coupon level as fragile and possibly temporary. Clients who lock in now, before the picture shifts again, capture a level that may not return for a long time.`, th:`ผลตอบแทนพันธบัตรที่กลับมาไต่ขึ้นต่อ หลังผ่อนคลายได้เพียงวันเดียว โดยมีขาดดุลงบประมาณที่กว้างขึ้นและกลุ่มเฟดที่มีแนวคิด hawkish กว้างขึ้นอยู่เบื้องหลัง คือสัญญาณที่ชัดเจนที่สุดว่าแม้แต่ผู้กำหนดนโยบายเองก็มองว่าระดับคูปองนี้เปราะบางและอาจเป็นเพียงชั่วคราว ลูกค้าที่ล็อกตอนนี้ ก่อนภาพจะเปลี่ยนอีกครั้ง จะได้ระดับที่อาจไม่กลับมาอีกในระยะยาว`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`<b>The Fed's own July minutes flagged fresh upside inflation risks</b> — tariff pass-through, Middle-East-driven energy costs from the escalating Iran conflict, and AI-buildout demand — while the CBO's upward deficit revision (~$2.1tn) adds a fiscal dimension. That combination pushed CME's September-hold odds down to about 68%, keeping a live two-way risk on rates into the meeting.`, th:`<b>รายงานการประชุมเฟดเดือน ก.ค. ระบุความเสี่ยงเงินเฟ้อขาขึ้นใหม่</b> — ผลกระทบภาษีนำเข้า ต้นทุนพลังงานจากตะวันออกกลางที่มาจากความขัดแย้งอิหร่านที่ทวีความรุนแรง และดีมานด์การลงทุน AI — ขณะการปรับเพิ่มประมาณการขาดดุลงบประมาณของ CBO (~2.1 ล้านล้านดอลลาร์) เพิ่มมิติด้านการคลัง การผสมกันนี้ทำให้ CME ลดโอกาสคงดอกเบี้ยเดือน ก.ย. เหลือราว 68% ทำให้ความเสี่ยงดอกเบี้ยยังเป็นสองทางจนถึงวันประชุม`}, w:{en:`Fresh, concrete inflation risks (tariffs, energy, AI capex) — not just backward-looking data — support a "stay nimble, don't assume a hold" narrative: a constructive backdrop for locking bond income now rather than waiting for more clarity that may not arrive before September.`, th:`ความเสี่ยงเงินเฟ้อใหม่ที่จับต้องได้ (ภาษี พลังงาน การลงทุน AI) ไม่ใช่แค่ข้อมูลย้อนหลัง สนับสนุนแนวคิด "ต้องพร้อมปรับตัว อย่าคิดว่าเฟดจะคงดอกเบี้ยแน่นอน" — บรรยากาศที่ดีสำหรับการล็อกรายได้พันธบัตรตอนนี้ มากกว่ารอความชัดเจนที่อาจไม่มาก่อนเดือน ก.ย.`}},
  ];

  const WATCH=[
    {day:{en:"Done",th:"แล้ว"}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"l", t:{en:"US CPI & PPI — July (released: cooled)",th:"CPI & PPI สหรัฐ — ก.ค. (ออกแล้ว: ชะลอ)"}, d:{en:"CPI eased to 3.4% and PPI was soft — the week's big positive surprise. Hike odds fell toward one-in-three.",th:"CPI ชะลอเหลือ 3.4% และ PPI อ่อนตัว — เซอร์ไพรส์เชิงบวกของสัปดาห์ โอกาสขึ้นดอกเบี้ยลดเหลือราว 1 ใน 3"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"US retail sales — July (released: −0.6%, missed)",th:"ยอดค้าปลีกสหรัฐ — ก.ค. (ออกแล้ว: −0.6% ต่ำกว่าคาด)"}, d:{en:"Sales fell 0.6% m/m, the steepest drop since May 2025, versus +0.1% expected. A soft-consumer signal, though futures barely reacted.",th:"ยอดขายลด 0.6% จากเดือนก่อน ลดแรงสุดตั้งแต่ พ.ค. 2025 เทียบคาดการณ์ +0.1% สัญญาณผู้บริโภคอ่อนแรง แม้ตลาดล่วงหน้าแทบไม่ขยับ"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"US threatens 'indefinite' Iran blockade — oil jumps",th:"สหรัฐขู่ปิดล้อมอิหร่าน 'ไม่มีกำหนด' — น้ำมันพุ่ง"}, d:{en:"Defense Sec. Hegseth said the naval blockade could continue indefinitely; Treasury Sec. Bessent floated tougher Iran sanctions. Brent jumped to ~$88.64 (+1.8%) before settling near $87.74.",th:"รมว.กลาโหม Hegseth ระบุอาจปิดล้อมทางเรืออิหร่านต่อไปไม่มีกำหนด ขณะ รมว.คลัง Bessent ส่งสัญญาณคว่ำบาตรอิหร่านที่รุนแรงขึ้น ราคาน้ำมัน Brent พุ่งสู่ราว $88.64 (+1.8%) ก่อนย่อลงมาปิดใกล้ $87.74"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US consumer sentiment craters — UMich 51.0 vs 54.5 expected",th:"ความเชื่อมั่นผู้บริโภคสหรัฐทรุดหนัก — UMich 51.0 เทียบคาดการณ์ 54.5"}, d:{en:"The preliminary August reading fell from July's 55.2, a sharp miss that broke Wall Street's three-day record streak. Year-ahead inflation expectations also ticked up to 4.3%, from 4.2%.",th:"ดัชนีเบื้องต้นเดือน ส.ค. ลดจาก 55.2 ของเดือน ก.ค. พลาดเป้าอย่างแรงจนทำให้สถิติปิดต่อเนื่อง 3 วันของหุ้นสหรัฐหลุด คาดการณ์เงินเฟ้อ 1 ปีข้างหน้าก็ขยับขึ้นเป็น 4.3% จาก 4.2%"}},
    {day:{en:"Sat",th:"ส."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"h", t:{en:"Hormuz standoff escalates: Trump's \"territory\" claim, Bessent's isolation threat, new sea incidents",th:"ฮอร์มุซตึงเครียดขึ้น: ทรัมป์ขู่ \"ดินแดน\" Bessent ขู่โดดเดี่ยวเศรษฐกิจ เหตุปะทะกลางทะเลใหม่"}, d:{en:"Trump vowed to declare the Strait of Hormuz US territory; Iran's judiciary chief dismissed the claim. The UAE accused Iran of attacking a vessel in the Strait, Houthi rebels struck a Yemeni Red Sea port, and Treasury Secretary Bessent said the US is preparing unprecedented \"economic isolation\" measures against Iran — keeping oil's risk premium live into Monday's open.",th:"ทรัมป์ขู่ประกาศให้ช่องแคบฮอร์มุซเป็นดินแดนสหรัฐฯ ประธานศาลอิหร่านปฏิเสธ สหรัฐอาหรับเอมิเรตส์กล่าวหาอิหร่านโจมตีเรือในช่องแคบ กบฏฮูตีโจมตีท่าเรือในเยเมนบริเวณทะเลแดง และ รมว.คลัง Bessent ระบุสหรัฐฯ กำลังเตรียมมาตรการ \"โดดเดี่ยวทางเศรษฐกิจ\" ต่ออิหร่านที่ไม่เคยมีมาก่อน ทำให้ความเสี่ยงราคาน้ำมันยังคงอยู่ก่อนตลาดเปิดวันจันทร์"}},
    {day:{en:"Sun",th:"อา."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"h", t:{en:"Israeli strikes kill 11 in Lebanon — deadliest since June ceasefire; Ukraine's largest drone attack on Moscow draws Russian missiles",th:"อิสราเอลโจมตีเลบานอน เสียชีวิต 11 ราย รุนแรงสุดตั้งแต่หยุดยิง มิ.ย. — ยูเครนถล่มโดรนมอสโกครั้งใหญ่สุด รัสเซียตอบโต้ด้วยขีปนาวุธ"}, d:{en:"Pre-dawn Israeli strikes on Ansar and Deir ez-Zahrani in south Lebanon's Nabatieh district killed at least 11 people, including three children, and wounded about 19 — the deadliest toll since the Israel-Hezbollah ceasefire took effect in June. Israel said it killed senior Hezbollah commander Abu Hassan Alaa a day earlier and blamed Hezbollah for wounding three soldiers with explosive drones; Bloomberg reported the ceasefire itself now risks unraveling. Separately, Ukraine launched its largest drone attack on Moscow since the war began, and Russia responded with missile strikes on Kyiv.",th:"การโจมตีทางอากาศของอิสราเอลช่วงเช้ามืดที่เมือง Ansar และ Deir ez-Zahrani ในเขต Nabatieh ทางใต้ของเลบานอน ทำให้มีผู้เสียชีวิตอย่างน้อย 11 ราย รวมเด็ก 3 คน บาดเจ็บราว 19 ราย ถือเป็นยอดผู้เสียชีวิตสูงสุดนับตั้งแต่ข้อตกลงหยุดยิงอิสราเอล-ฮิซบอลเลาะห์เริ่มมีผลเดือน มิ.ย. อิสราเอลระบุว่าสังหารผู้บัญชาการฮิซบอลเลาะห์ระดับสูง Abu Hassan Alaa ไปเมื่อวันก่อนหน้า และกล่าวโทษฮิซบอลเลาะห์ว่าใช้โดรนระเบิดทำให้ทหารบาดเจ็บ 3 นาย ขณะที่ Bloomberg รายงานว่าข้อตกลงหยุดยิงเองก็เสี่ยงจะแตกหัก นอกจากนี้ ยูเครนยังเปิดฉากโจมตีโดรนมอสโกครั้งใหญ่ที่สุดของสงคราม ทำให้รัสเซียตอบโต้ด้วยขีปนาวุธถล่มเคียฟ"}},
    {day:{en:"Sun",th:"อา."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"m", t:{en:"Iran-Oman edge toward a Hormuz reopening deal, contingent on the US",th:"อิหร่าน-โอมานใกล้บรรลุข้อตกลงเปิดฮอร์มุซ ขึ้นกับสหรัฐฯ"}, d:{en:"Iran's FM Araghchi said talks with Oman on a new shipping route through the Strait of Hormuz are in their \"final stages,\" but a full reopening still hinges on Washington upholding the June ceasefire MoU. Iranian officials maintain the strait stays blocked until their conditions are met — a potential de-escalation path that could cap oil's upside even as the Lebanon front flares.",th:"รมว.ต่างประเทศอิหร่าน Araghchi ระบุการเจรจากับโอมานเรื่องเส้นทางเดินเรือใหม่ผ่านช่องแคบฮอร์มุซเข้าสู่ \"ขั้นตอนสุดท้าย\" แต่การเปิดช่องแคบเต็มรูปแบบยังขึ้นอยู่กับสหรัฐฯ ปฏิบัติตามข้อตกลง MoU หยุดยิงเดือน มิ.ย. เจ้าหน้าที่อิหร่านยืนยันว่าช่องแคบยังปิดจนกว่าเงื่อนไขของตนจะได้รับการยอมรับ — เส้นทางคลี่คลายที่อาจสกัดขาขึ้นของราคาน้ำมัน แม้สถานการณ์เลบานอนจะร้อนแรงขึ้น"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US-Iran ceasefire expires with no deal in sight",th:"หยุดยิงสหรัฐ-อิหร่านหมดอายุไร้ข้อตกลง"}, d:{en:"The 60-day ceasefire lapsed Monday. Iran's FM Araghchi said Tehran has \"not made a decision to restart negotiations\"; a senior White House official called the standoff \"static.\" Markets shrugged so far — Asian equities rallied and oil eased — but the risk is live for a fast repricing on any escalation.",th:"หยุดยิงระยะ 60 วันหมดอายุลงวันจันทร์ รมว.ต่างประเทศอิหร่าน Araghchi ระบุอิหร่าน \"ยังไม่ตัดสินใจกลับมาเจรจา\" เจ้าหน้าที่อาวุโสทำเนียบขาวเรียกสถานการณ์นี้ว่า \"หยุดนิ่ง\" ตลาดยังไม่ตอบสนองรุนแรงในตอนนี้ — หุ้นเอเชียปรับขึ้นและน้ำมันอ่อนตัวลง — แต่ความเสี่ยงยังมีอยู่หากมีข่าวความรุนแรงเพิ่มเติม"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Anthropic's ~$200bn 2028 revenue forecast lifts AI stocks",th:"คาดการณ์รายได้ปี 2028 ของ Anthropic ที่ราว 2 แสนล้านดอลลาร์ หนุนหุ้น AI"}, d:{en:"Ahead of a planned IPO, Anthropic reportedly projected 2028 revenue near $190–200bn. The report lifted AI-linked chip and storage names in Monday's premarket, with Nasdaq-100 futures up about 0.5%.",th:"ก่อนแผนเข้าตลาดหุ้น (IPO) Anthropic รายงานคาดการณ์รายได้ปี 2028 ไว้ที่ราว 1.9–2 แสนล้านดอลลาร์ รายงานนี้หนุนหุ้นกลุ่มชิปและสตอเรจที่เชื่อมโยงกับ AI ในช่วงก่อนตลาดเปิดวันจันทร์ โดยดัชนีล่วงหน้า Nasdaq-100 ขึ้นราว 0.5%"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US stocks close lower as 30-year Treasury yield hits 19-year high",th:"หุ้นสหรัฐปิดลบ ขณะผลตอบแทนพันธบัตร 30 ปีทำสถิติสูงสุดในรอบ 19 ปี"}, d:{en:"The premarket AI rally faded by the close: S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32%. The 30-year Treasury yield jumped to 5.31%, its highest since June 2007, on deficit and AI-debt-issuance concerns; oil held near $88/bbl as US-Iran talks stayed stalled.",th:"การปรับขึ้นของหุ้นเทค AI ช่วงก่อนตลาดเปิดจางหายไปเมื่อถึงช่วงปิดตลาด: S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32% ผลตอบแทนพันธบัตร 30 ปีพุ่งขึ้นสู่ 5.31% สูงสุดตั้งแต่เดือน มิ.ย. 2007 จากความกังวลขาดดุลงบประมาณและหนี้ AI ราคาน้ำมันทรงตัวใกล้ $88 ต่อบาร์เรล ขณะการเจรจาสหรัฐ-อิหร่านยังหยุดชะงัก"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Trump threatens to bomb Oman as Iran ceasefire lapses — oil jumps to a 19-month high",th:"ทรัมป์ขู่ถล่มโอมาน หลังหยุดยิงอิหร่านหมดอายุ — น้ำมันพุ่งสูงสุดในรอบ 19 เดือน"}, d:{en:"The 60-day US-Iran ceasefire lapsed Monday with no deal. Trump then threatened to \"bomb the s--- out of\" US ally Oman if it \"gets in the way\" of Oman-Iran talks over Strait of Hormuz shipping. Brent crude settled up 2.7% at $90.87/bbl — its highest in roughly 19 months — and the shock has spread into Tuesday's Asia session, pulling the Nikkei and Hang Seng off Monday's records.",th:"หยุดยิงสหรัฐ-อิหร่านระยะ 60 วันหมดอายุลงวันจันทร์โดยไม่มีข้อตกลง จากนั้นทรัมป์ขู่ว่าจะ \"ถล่ม\" โอมาน พันธมิตรสหรัฐฯ หากโอมาน \"ขวางทาง\" การเจรจาโอมาน-อิหร่านเรื่องการเดินเรือผ่านช่องแคบฮอร์มุซ ราคาน้ำมันเบรนท์ปิดตลาดบวก 2.7% ที่ $90.87 ต่อบาร์เรล สูงสุดในรอบราว 19 เดือน และแรงกระแทกนี้ได้ลุกลามมาถึงตลาดเอเชียวันอังคาร ฉุด Nikkei และ Hang Seng ร่วงจากสถิติสูงสุดของวันจันทร์"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Vessel struck by projectile in Strait of Hormuz — oil tops $91",th:"เรือถูกยิงในช่องแคบฮอร์มุซ — น้ำมันทะลุ $91"}, d:{en:"UKMTO confirmed a cargo vessel was hit by an unidentified projectile early Tuesday, damaging the engine room and injuring a crew member — the first confirmed casualty since Monday's ceasefire lapse. Brent extended Monday's 2.7% jump to top $91/bbl, its highest in about 19 months.",th:"UKMTO ยืนยันเรือบรรทุกสินค้าถูกยิงด้วยกระสุนไม่ทราบชนิดช่วงเช้ามืดวันอังคาร ห้องเครื่องเสียหายและลูกเรือได้รับบาดเจ็บ — ผู้บาดเจ็บรายแรกที่ได้รับการยืนยันนับตั้งแต่หยุดยิงหมดอายุวันจันทร์ ราคาน้ำมันเบรนท์ปรับขึ้นต่อจากที่พุ่ง 2.7% วันจันทร์ ทะลุ $91 ต่อบาร์เรล สูงสุดในรอบราว 19 เดือน"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Iran, Oman reportedly agree shipping-route coordinates through Hormuz — but strikes continue",th:"อิหร่าน-โอมานตกลงพิกัดเส้นทางเดินเรือผ่านฮอร์มุซ — แต่การโจมตียังไม่หยุด"}, d:{en:"The two sides have reportedly finalized route coordinates as part of a broader arrangement to manage Hormuz traffic, but sporadic vessel strikes — including Tuesday's — have continued even as talks progress, keeping oil's risk premium live.",th:"ทั้งสองฝ่ายมีรายงานว่าตกลงพิกัดเส้นทางเดินเรือแล้ว ซึ่งเป็นส่วนหนึ่งของข้อตกลงที่กว้างขึ้นในการจัดการการเดินเรือผ่านฮอร์มุซ แต่ยังมีเหตุเรือถูกโจมตีประปรายต่อเนื่อง — รวมถึงเหตุการณ์วันอังคาร — แม้การเจรจาจะคืบหน้า ทำให้ความเสี่ยงราคาน้ำมันยังคงอยู่"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US close confirms risk-off — S&P −0.54%, Nasdaq −1.29% as 30-year yield hits fresh 19-year high",th:"หุ้นสหรัฐปิดยืนยันภาวะ risk-off — S&P −0.54%, Nasdaq −1.29% ขณะพันธบัตร 30 ปีทำสถิติสูงสุดใหม่รอบ 19 ปี"}, d:{en:"The first full session since Monday's Hormuz vessel strike confirmed the risk-off tone that had only shown up in pre-market futures: the S&P 500 fell 0.54% to 7,703.28, the Nasdaq Composite dropped 1.29% to 26,300.36 on AI-name weakness, and the Dow held nearly flat at 53,427.68. The 30-year Treasury yield pushed to 5.32%, nearing 2002 levels.",th:"การซื้อขายเต็มวันแรกหลังเหตุเรือถูกยิงที่ฮอร์มุซวันจันทร์ ยืนยันบรรยากาศ risk-off ที่ก่อนหน้านี้ปรากฏเฉพาะในดัชนีล่วงหน้า: ดัชนี S&P 500 ลดลง 0.54% สู่ 7,703.28 ดัชนี Nasdaq Composite ร่วง 1.29% สู่ 26,300.36 จากแรงขายหุ้นกลุ่ม AI ขณะดัชนี Dow แทบไม่เปลี่ยนแปลงที่ 53,427.68 ผลตอบแทนพันธบัตร 30 ปีขึ้นสู่ 5.32% เข้าใกล้ระดับปี 2002"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Home Depot beats Q2 estimates, reaffirms full-year guidance",th:"Home Depot รายงานผลไตรมาส 2 ดีกว่าคาด คงเป้าทั้งปี"}, d:{en:"Adjusted EPS of $4.92 beat the $4.73 estimate on sales of $47.9bn, up 5.7% y/y; comparable sales rose 1.7%. A solid open to retail-earnings week, with Target and Lowe's due Wednesday and Walmart Thursday.",th:"กำไรต่อหุ้นปรับปรุงที่ $4.92 ดีกว่าคาดการณ์ $4.73 จากยอดขาย $47,900 ล้านดอลลาร์ เพิ่มขึ้น 5.7% เทียบปีก่อน ยอดขายสาขาเดิมเพิ่มขึ้น 1.7% เป็นการเริ่มต้นที่ดีของสัปดาห์ผลประกอบการค้าปลีก ก่อน Target และ Lowe's วันพุธ และ Walmart วันพฤหัสฯ"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Trump pauses Canada's 50% tariff for three days after last-minute deal",th:"ทรัมป์พักภาษี 50% ของแคนาดาออกไป 3 วัน หลังบรรลุข้อตกลงนาทีสุดท้าย"}, d:{en:"Hours before the 50% tariff on ~$20bn of Canadian goods was due to take effect at 12:01am ET, Trump announced a pause until end of day Friday 21 August, saying Canada and the US, \"subject to the finalization of documents, have a DEAL.\" PM Carney called it \"substantial progress\" with \"important work still to be done\" on autos, steel, aluminum, forest products, dairy and alcohol.",th:"ไม่กี่ชั่วโมงก่อนภาษี 50% ต่อสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์จะมีผลเวลา 00:01 น. ตามเวลาสหรัฐฝั่งตะวันออก ทรัมป์ประกาศพักภาษีออกไปจนถึงสิ้นวันศุกร์ที่ 21 ส.ค. ระบุว่าแคนาดาและสหรัฐฯ \"มีข้อตกลงแล้ว โดยรอการสรุปเอกสารขั้นสุดท้าย\" นายกฯ Carney เรียกว่าเป็น \"ความคืบหน้าอย่างมาก\" แต่ \"ยังมีงานสำคัญที่ต้องทำต่อ\" ในประเด็นรถยนต์ เหล็ก อะลูมิเนียม ผลิตภัณฑ์ป่าไม้ นม และแอลกอฮอล์"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Fatal Hormuz attack on agreed \"safe\" route — Trump says strait is \"open\" despite lowest traffic since May",th:"เหตุโจมตีฮอร์มุซมีผู้เสียชีวิตบนเส้นทาง \"ปลอดภัย\" ที่ตกลงกันแล้ว — ทรัมป์ระบุช่องแคบ \"เปิด\" ทั้งที่การเดินเรือต่ำสุดตั้งแต่ พ.ค."}, d:{en:"A cargo ship was attacked overnight, killing one crew member, even while using the Oman-coordinated southern route. Kpler data show a five-day average of just 10 vessel crossings, the lowest since May, undercutting Trump's claim the strait is fully open.",th:"เรือบรรทุกสินค้าถูกโจมตีข้ามคืนจนมีลูกเรือเสียชีวิต 1 ราย ทั้งที่ใช้เส้นทางใต้ที่ประสานกับโอมานแล้ว ข้อมูล Kpler ชี้ว่าจำนวนเรือผ่านช่องแคบเฉลี่ย 5 วันเหลือเพียง 10 ลำ ต่ำสุดตั้งแต่ พ.ค. ซึ่งขัดแย้งกับคำกล่าวอ้างของทรัมป์ว่าช่องแคบเปิดเต็มรูปแบบ"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Kospi closes down 5.6% after 6.39% intraday plunge trips sidecar; Nikkei falls 2.57% as Asia tech rout deepens",th:"Kospi ปิดลบ 5.6% หลังร่วงระหว่างวัน 6.39% จนหยุดพักการซื้อขาย ขณะ Nikkei ปิดลบ 2.57% กลุ่มเทคเอเชียร่วงหนัก"}, d:{en:"Samsung Electronics fell 7.26% and SK Hynix 9.27% as Korea's chip-heavy Kospi plunged as much as 6.39% intraday, tripping a sell-side sidecar, before closing down 5.6% at 6,487.34. Japan's Nikkei 225 closed down 2.57% at 65,724.25, a second straight losing session, tracking a weak Wall Street close and Japan's 10-year JGB yield hitting its highest level since 1996.",th:"Samsung Electronics ลดลง 7.26% และ SK Hynix ร่วง 9.27% ขณะดัชนี Kospi ที่มีสัดส่วนหุ้นชิปสูงร่วงระหว่างวันถึง 6.39% จนต้องหยุดพักการซื้อขายชั่วคราวแบบ sell-side sidecar ก่อนปิดลบ 5.6% ที่ 6,487.34 ดัชนี Nikkei 225 ญี่ปุ่นปิดลบ 2.57% ที่ 65,724.25 ปรับลงเป็นวันที่สองติดต่อกัน สอดคล้องกับการปิดตลาดสหรัฐฯ ที่อ่อนแอ และผลตอบแทนพันธบัตรรัฐบาลญี่ปุ่นอายุ 10 ปีที่ทำสถิติสูงสุดนับตั้งแต่ปี 1996"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Treasury doubles long-bond buybacks — yields tumble from 19-year high, Wall Street rebounds",th:"คลังสหรัฐฯ เพิ่มวงเงินซื้อคืนพันธบัตรระยะยาวเป็น 2 เท่า — ผลตอบแทนร่วงจากจุดสูงสุดรอบ 19 ปี วอลล์สตรีทฟื้นตัว"}, d:{en:"The Treasury said it will at least double 'liquidity support' buyback operations for 10-to-30-year debt to at least $4bn per operation from 9 September through 4 November. The 30-year yield fell 9bp to 5.196% and the 10-year fell 6bp to 4.647%; US stocks turned higher in Wednesday trading on the relief.",th:"กระทรวงการคลังสหรัฐฯ ระบุจะเพิ่มวงเงินซื้อคืนพันธบัตร 'สนับสนุนสภาพคล่อง' สำหรับพันธบัตรอายุ 10-30 ปี เป็นอย่างน้อย 4,000 ล้านดอลลาร์ต่อครั้ง เริ่ม 9 ก.ย. ถึง 4 พ.ย. ผลตอบแทนพันธบัตร 30 ปีลดลง 9 basis point สู่ 5.196% และ 10 ปีลดลง 6 basis point สู่ 4.647% หุ้นสหรัฐฯ ปรับขึ้นในการซื้อขายวันพุธจากข่าวนี้"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"July FOMC minutes show hawkish 3-way dissent; gold jumps ~3%",th:"รายงานประชุมเฟด ก.ค. เผยผู้ว่าการ 3 คนโหวตสวนหนุนขึ้นดอกเบี้ย ทองคำพุ่ง ~3%"}, d:{en:"Minutes from the July 28–29 meeting, released Wednesday afternoon, showed regional presidents Hammack, Kashkari and Logan all dissented in favour of a 25bp hike — the first time since 2016 three policymakers aligned on one directional dissent. Markets still price only about a third chance of a September hike given softer data since, but the hawkish tone helped send gold up roughly 3% to near $4,470/oz.",th:"รายงานการประชุมวันที่ 28–29 ก.ค. ที่เผยแพร่ช่วงบ่ายวันพุธ แสดงให้เห็นว่าผู้ว่าการเฟดสาขาภูมิภาค Hammack, Kashkari และ Logan โหวตสวนสนับสนุนขึ้นดอกเบี้ย 25 basis point ทั้งหมด — ครั้งแรกนับตั้งแต่ปี 2016 ที่ผู้กำหนดนโยบาย 3 คนโหวตไปทางเดียวกัน ตลาดยังให้น้ำหนักเพียงราว 1 ใน 3 ว่าเฟดจะขึ้นดอกเบี้ยเดือน ก.ย. เนื่องจากข้อมูลที่อ่อนตัวลงหลังจากนั้น แต่น้ำเสียง hawkish นี้ช่วยหนุนราคาทองคำให้พุ่งขึ้นราว 3% สู่ใกล้ $4,470 ต่อออนซ์"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US close confirms rebound — S&P +0.21%, Dow +0.22%, Nasdaq +0.16%, snapping a 3-day losing streak",th:"หุ้นสหรัฐปิดยืนยันการฟื้นตัว — S&P +0.21%, Dow +0.22%, Nasdaq +0.16% ยุติสถิติปรับลงต่อเนื่อง 3 วัน"}, d:{en:"The S&P 500 rose 0.21% to 7,707.98, the Dow gained 0.22% to 53,463.05, and the Nasdaq added 0.16% to 26,331.09, as Treasury yields extended their pullback from Wednesday's buyback news — the 30-year settled at 5.195%, the 10-year near 4.65%.",th:"ดัชนี S&P 500 เพิ่มขึ้น 0.21% สู่ 7,707.98 ดัชนี Dow เพิ่มขึ้น 0.22% สู่ 53,463.05 และดัชนี Nasdaq เพิ่มขึ้น 0.16% สู่ 26,331.09 ขณะผลตอบแทนพันธบัตรยังร่วงต่อเนื่องหลังข่าวซื้อคืนพันธบัตรวันพุธ ผลตอบแทน 30 ปีปิดที่ 5.195% ผลตอบแทน 10 ปีใกล้ 4.65%"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Target beats but falls ~3.5% on profit-taking; Lowe's trims guidance; Moderna surges up to 176%",th:"Target กำไรดีกว่าคาดแต่หุ้นร่วงราว 3.5% จากการขายทำกำไร Lowe's ปรับลดเป้า Moderna พุ่งสูงสุด 176%"}, d:{en:"Target's EPS ($4.11) and comparable sales (+3.8%) beat, and guidance was raised, yet shares fell on heavy volume as investors booked profits. Lowe's beat on EPS ($4.40) but trimmed its full-year outlook on soft DIY spending. Moderna jumped as much as 176% on positive melanoma-vaccine trial data with Merck.",th:"Target รายงานกำไรต่อหุ้น ($4.11) และยอดขายสาขาเดิม (+3.8%) ดีกว่าคาด และปรับเป้าทั้งปีขึ้น แต่หุ้นยังปรับลงจากปริมาณการซื้อขายหนาแน่น เนื่องจากนักลงทุนขายทำกำไร Lowe's กำไรต่อหุ้นดีกว่าคาด ($4.40) แต่ปรับลดเป้าทั้งปีจากการใช้จ่าย DIY ที่อ่อนแอ Moderna พุ่งขึ้นสูงสุดถึง 176% จากผลบวกของวัคซีนมะเร็งผิวหนังร่วมกับ Merck"}},
    {day:{en:"Thu",th:"พฤ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"h", t:{en:"Dow suffers worst day since 29 July as bond-buyback relief fades",th:"Dow ร่วงหนักสุดตั้งแต่ 29 ก.ค. หลังแรงหนุนข่าวซื้อคืนพันธบัตรจางหาย"}, d:{en:"S&P −0.87% to 7,641.16, Dow −1.32% to 52,759.21, Nasdaq −1.00% to 26,067.17. The 10-year yield rose to 4.704% and the 30-year to ~5.27%, wiping out Wednesday's buyback-driven pullback. Walmart fell ~9% on soft US sales guidance despite beating EPS.",th:"S&P −0.87% สู่ 7,641.16, Dow −1.32% สู่ 52,759.21, Nasdaq −1.00% สู่ 26,067.17 ผลตอบแทนพันธบัตร 10 ปีขึ้นสู่ 4.704% และ 30 ปีสู่ราว 5.27% ลบล้างการปรับลงจากข่าวซื้อคืนพันธบัตรวันพุธไปหมด Walmart ร่วงราว 9% จากคำแนะนำยอดขายสหรัฐฯ ที่อ่อนแอ แม้กำไรต่อหุ้นจะดีกว่าคาด"}},
    {day:{en:"Thu",th:"พฤ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"Moderna gives back its 177% surge, falling ~20%, even as FDA approves mFLUSIVA flu shot",th:"Moderna คืนกำไรที่พุ่งขึ้น 177% ร่วงลงราว 20% แม้ อย. อนุมัติวัคซีนไข้หวัดใหญ่ mFLUSIVA"}, d:{en:"A sharp reversal a day after the melanoma-vaccine-driven pop, as investors booked profits — a reminder that single-stock biotech swings cut both ways.",th:"การกลับตัวแรงหนึ่งวันหลังพุ่งขึ้นจากข่าววัคซีนมะเร็งผิวหนัง เนื่องจากนักลงทุนขายทำกำไร เป็นเครื่องเตือนใจว่าความผันผวนหุ้นไบโอเทครายตัวเคลื่อนไหวได้ทั้งสองทาง"}},
    {day:{en:"Thu",th:"พฤ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"Asia stages sharp rebound — Nikkei +1.36%, Kospi +5.9% on chip-buyback hopes",th:"เอเชียฟื้นตัวแรง — Nikkei +1.36%, Kospi +5.9% จากความหวังซื้อหุ้นคืนกลุ่มชิป"}, d:{en:"Samsung Electronics and SK Hynix led Kospi's reversal from Wednesday's sidecar-triggering plunge. Hang Seng +0.80%, Shanghai +0.24% — more muted, suggesting Greater China lagged the regional bounce.",th:"Samsung Electronics และ SK Hynix นำการกลับตัวของ Kospi จากที่ร่วงจนต้องหยุดพักการซื้อขายวันพุธ Hang Seng +0.80% Shanghai +0.24% — เบากว่ามาก บ่งชี้ว่าจีนแผ่นดินใหญ่/ฮ่องกงตามหลังการฟื้นตัวในภูมิภาค"}},

    {code:"UUSTECH", name:{en:"United US Technology Fund",th:"United US Technology Fund"}, rk:{en:"US tech · high risk",th:"หุ้นเทคสหรัฐ · เสี่ยงสูง"}, desc:{en:"US technology & semiconductor leaders — the AI / chip growth theme, bought in baht.",th:"ผู้นำเทคโนโลยีและเซมิคอนดักเตอร์สหรัฐ — ธีมการเติบโต AI / ชิป ซื้อได้ด้วยเงินบาท"}, now:{en:"The Nasdaq fell 1.00% Thursday as Treasury yields resumed climbing, even as Asia's chip stocks staged a sharp rebound (Nikkei +1.36%, Kospi +5.9% on buyback hopes) that's already fading in Friday's futures. This week's pullback is a rates-driven de-rating, not a fundamentals shock — Nvidia's next earnings print lands 26 August, still the real catalyst. Frame the sell-off as a valuation reset within an intact AI growth story, while flagging that volatility may stay elevated into next week.",th:"ดัชนี Nasdaq ลดลง 1.00% วันพฤหัสฯ ขณะผลตอบแทนพันธบัตรกลับมาไต่ขึ้นต่อ แม้หุ้นชิปเอเชียจะฟื้นตัวแรง (Nikkei +1.36%, Kospi +5.9% จากความหวังซื้อหุ้นคืน) ซึ่งเริ่มจางหายไปแล้วในฟิวเจอร์สวันศุกร์ การปรับลงสัปดาห์นี้เป็นการปรับฐานจากปัจจัยดอกเบี้ย ไม่ใช่ปัจจัยพื้นฐานสั่นคลอน — ผลประกอบการ Nvidia รอบถัดไปจะออกวันที่ 26 ส.ค. ซึ่งยังเป็นปัจจัยขับเคลื่อนที่แท้จริง ควรนำเสนอการเทขายนี้เป็นการปรับฐานมูลค่าภายในธีมการเติบโต AI ที่ยังแข็งแรง พร้อมเตือนว่าความผันผวนอาจสูงต่อเนื่องถึงสัปดาห์หน้า"}, hold:["US tech","Semis","AI"]},

    {code:"UOBSG", name:{en:"UOB Smart Gold",th:"UOB Smart Gold"}, rk:{en:"Gold · alternative",th:"ทองคำ · ทางเลือก"}, desc:{en:"Tracks the gold price — a diversifier and safe-haven talking point.",th:"อิงราคาทองคำ — เป็นตัวกระจายความเสี่ยงและจุดคุยเรื่องสินทรัพย์ปลอดภัย"}, now:{en:"Gold held broadly steady near $4,516/oz Thursday, still close to its early-June highs, even as US and German bond yields both pushed back up and Wall Street posted its worst session since 29 July. That decoupling — gold normally softens when yields rise — is the key talking point: an escalating, multi-front Iran conflict and a widening US fiscal deficit are keeping the safe-haven bid alive on their own merits, reinforcing gold's role as a genuine diversifier rather than just a rate-inverse trade.",th:"ทองคำทรงตัวใกล้ $4,516 ต่อออนซ์วันพฤหัสฯ ยังใกล้จุดสูงสุดนับตั้งแต่ต้นเดือนมิถุนายน แม้ผลตอบแทนพันธบัตรทั้งสหรัฐฯ และเยอรมนีจะปรับขึ้นทั้งคู่ และวอลล์สตรีทปิดตลาดแย่สุดตั้งแต่ 29 ก.ค. การแยกทิศทางนี้ — ปกติทองคำจะอ่อนตัวเมื่อผลตอบแทนพันธบัตรสูงขึ้น — คือประเด็นสำคัญที่ควรคุย: ความขัดแย้งอิหร่านที่ทวีความรุนแรงหลายแนวรบ และขาดดุลงบประมาณสหรัฐฯ ที่กว้างขึ้น กำลังหนุนแรงซื้อสินทรัพย์ปลอดภัยด้วยเหตุผลของตัวเอง ตอกย้ำบทบาทของทองคำในฐานะตัวกระจายความเสี่ยงที่แท้จริง ไม่ใช่แค่การเทรดสวนทางอัตราดอกเบี้ย"}, hold:["Gold","Safe-haven","Diversifier"]},
