<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
    <div class="grid g2" id="countrygrid"></div>
    <div class="grid g2" style="margin-top:14px" id="extragrid"></div>
    <div class="rule"></div>
    <div class="sechead"><h2 id="s-themes"></h2></div>
    <div class="grid g4" id="themegrid"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Kospi Plunges Toward 6%, Nikkei Falls Again as Fatal Hormuz Attack Deepens Risk-Off — Trump Pauses Canada Tariffs in Last-Minute Deal", th:"Kospi ทรุดใกล้ 6% Nikkei ปิดลบซ้ำ ขณะฮอร์มุซมีผู้เสียชีวิตซ้ำเติมภาวะ Risk-Off — ทรัมป์พักภาษีแคนาดาหลังบรรลุข้อตกลงนาทีสุดท้าย"},
    heroDeck:{en:"Wednesday's Asia session turned violent again: South Korea's Kospi plunged as much as 6.39% intraday, tripping a sell-side sidecar, before paring losses to close down 5.6% at 6,487.34, as chip giants Samsung Electronics (−7.26%) and SK Hynix (−9.27%) led a tech-wide slide that tracked Tuesday's weak Wall Street close (S&P −0.54%, Nasdaq −1.29% to 26,300.36) and echoed the memory chip/AI-capex jitters that hit Micron and Western Digital overnight. Japan's Nikkei 225 fell a second straight session, closing down 2.57% at 65,724.25, as the country's own 10-year government bond yield hit its highest level since 1996, joining the US 30-year Treasury yield's fresh 19-year high near 5.32%. Mainland China's Shanghai Composite shed about 1.5% to near 3,927.70 in Wednesday trade. The Strait of Hormuz crisis also darkened overnight: a cargo ship was attacked and one crew member killed even while sailing an agreed \"southern route\" coordinated with Oman — Trump insists the strait is \"open and operating,\" but Kpler data show crossings at a five-day average of just 10 vessels, the lowest since May. Brent crude holds above $91/bbl and WTI is near $85.38. Gold, which had been climbing, reversed hard — down almost 2% to trade near $4,340/oz — as surging bond yields worldwide now outweigh the safe-haven bid from the live Hormuz risk. In the one bright spot, Trump paused his scheduled 50% tariff on roughly $20bn of Canadian goods for three days — until end of day Friday — hours before it was due to take effect at 12:01am ET Wednesday, announcing a \"deal, subject to finalization of documents,\" with Ottawa after a last-minute call with PM Carney. Retail earnings continue with Target and Lowe's due today and Walmart Thursday.", th:"ตลาดเอเชียวันพุธเปิดฉากรุนแรงอีกครั้ง: ดัชนี Kospi เกาหลีใต้ร่วงลงถึง 6.39% ระหว่างวัน จนต้องหยุดพักการซื้อขายชั่วคราวแบบ sell-side sidecar ก่อนจะลดช่วงลบมาปิดที่ลบ 5.6% ที่ 6,487.34 โดยหุ้นชิปยักษ์ใหญ่ Samsung Electronics (−7.26%) และ SK Hynix (−9.27%) นำการปรับลงของกลุ่มเทคทั้งกระดาน สอดคล้องกับการปิดตลาดสหรัฐฯ ที่อ่อนแอวันอังคาร (S&P −0.54%, Nasdaq −1.29% สู่ 26,300.36) และสะท้อนความกังวลเรื่องชิปหน่วยความจำ/การลงทุน AI ที่ฉุด Micron และ Western Digital ข้ามคืน ดัชนี Nikkei 225 ญี่ปุ่นปรับลงเป็นวันที่สองติดต่อกัน ปิดลบ 2.57% ที่ 65,724.25 โดยผลตอบแทนพันธบัตรรัฐบาลญี่ปุ่นอายุ 10 ปีเองก็ทำสถิติสูงสุดนับตั้งแต่ปี 1996 คู่ขนานกับผลตอบแทนพันธบัตรสหรัฐ 30 ปีที่ทำสถิติสูงสุดใหม่ในรอบ 19 ปีใกล้ 5.32% ดัชนี Shanghai Composite จีนแผ่นดินใหญ่ร่วงราว 1.5% สู่ใกล้ 3,927.70 ในการซื้อขายวันพุธ สถานการณ์ช่องแคบฮอร์มุซยังเลวร้ายลงข้ามคืน เมื่อเรือบรรทุกสินค้าถูกโจมตีจนมีลูกเรือเสียชีวิต 1 ราย ทั้งที่แล่นตามเส้นทาง \"ใต้\" ที่ตกลงกับโอมานแล้ว ทรัมป์ยืนยันว่าช่องแคบยัง \"เปิดและดำเนินการปกติ\" แต่ข้อมูลจาก Kpler ชี้ว่าจำนวนเรือผ่านช่องแคบเฉลี่ย 5 วันเหลือเพียง 10 ลำ ต่ำสุดตั้งแต่เดือน พ.ค. ราคาน้ำมันเบรนท์ยังยืนเหนือ $91 ต่อบาร์เรล และ WTI ใกล้ $85.38 ส่วนทองคำที่เคยไต่ขึ้นกลับพลิกร่วงเกือบ 2% สู่ใกล้ $4,340 ต่อออนซ์ เนื่องจากผลตอบแทนพันธบัตรทั่วโลกที่พุ่งขึ้นตอนนี้มีน้ำหนักมากกว่าแรงหนุนสินทรัพย์ปลอดภัยจากความเสี่ยงฮอร์มุซที่ยังคุกรุ่น ในข่าวดีเพียงจุดเดียว ทรัมป์ประกาศพักการเก็บภาษี 50% ที่กำหนดไว้กับสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์ออกไป 3 วัน — จนถึงสิ้นวันศุกร์ — เพียงไม่กี่ชั่วโมงก่อนจะมีผลจริงเวลา 00:01 น. ตามเวลาสหรัฐฝั่งตะวันออกวันพุธ โดยประกาศว่ามี \"ข้อตกลง ที่รอการสรุปเอกสารขั้นสุดท้าย\" กับแคนาดา หลังโทรศัพท์คุยกับนายกฯ Carney ในนาทีสุดท้าย สัปดาห์ผลประกอบการค้าปลีกยังดำเนินต่อ โดย Target และ Lowe's รายงานวันนี้ ส่วน Walmart วันพฤหัสฯ"},

    leadtxt:{en:`<b>Asia's Wednesday session turned volatile again: South Korea's Kospi plunged as much as 6.39% intraday and tripped a sell-side sidecar, before paring losses to close down 5.6% at 6,487.34, with chip giants Samsung Electronics (−7.26%) and SK Hynix (−9.27%) leading a tech-wide rout</b> that tracked Tuesday's weak Wall Street close (S&P −0.54% to 7,703.28, Nasdaq −1.29% to 26,300.36) and echoed AI-capex jitters from Micron and Western Digital overnight. <b>Japan's Nikkei 225 fell a second straight session, closing down 2.57% at 65,724.25</b>, as Japan's 10-year government bond yield hit its highest level since 1996, joining the <b>US 30-year Treasury yield's fresh 19-year high near 5.32%</b> as the dominant driver of the selloff — bonds, not AI fundamentals, are still the story. The Hormuz crisis darkened further: a cargo ship was attacked and one crew member killed even on an agreed "southern route" with Oman; Trump calls the strait "open and operating," but Kpler data show crossings at a five-day average of just 10 vessels, the lowest since May. Brent holds above $91/bbl, WTI near $85.38. <b>Gold reversed hard, down almost 2% to near $4,340/oz</b>, as surging global yields now outweigh the safe-haven bid. In the one bright spot, <b>Trump paused his scheduled 50% tariff on roughly $20bn of Canadian goods for three days — until end of day Friday — hours before it was due to take effect,</b> announcing a "deal, subject to finalization of documents" with PM Carney, who called it "substantial progress" with "important work still to be done." For your clients: multi-decade-high yields in both the US and Japan make this the most urgent, time-limited window yet to <b>lock in long-duration coupons</b>, while a fatal, confirmed Hormuz attack — even as gold itself dips on yield pressure — keeps <b>hedging the geopolitical tail risk</b> a live, separate conversation from the bond trade; the Canada tariff reprieve is a welcome, three-day risk-on data point, not a reason to change either thesis.`,
      th:`<b>ตลาดเอเชียวันพุธเปิดฉากรุนแรงอีกครั้ง: ดัชนี Kospi เกาหลีใต้ร่วงลงถึง 6.39% ระหว่างวัน จนต้องหยุดพักการซื้อขายชั่วคราวแบบ sell-side sidecar ก่อนจะลดช่วงลบมาปิดที่ลบ 5.6% ที่ 6,487.34 โดยหุ้นชิปยักษ์ใหญ่ Samsung Electronics (−7.26%) และ SK Hynix (−9.27%) นำการปรับลงของกลุ่มเทคทั้งกระดาน</b> สอดคล้องกับการปิดตลาดสหรัฐฯ ที่อ่อนแอวันอังคาร (S&P −0.54% สู่ 7,703.28, Nasdaq −1.29% สู่ 26,300.36) และสะท้อนความกังวลเรื่องการลงทุน AI ที่ฉุด Micron และ Western Digital ข้ามคืน <b>ดัชนี Nikkei 225 ญี่ปุ่นปรับลงเป็นวันที่สองติดต่อกัน ปิดลบ 2.57% ที่ 65,724.25</b> ขณะผลตอบแทนพันธบัตรรัฐบาลญี่ปุ่นอายุ 10 ปีทำสถิติสูงสุดนับตั้งแต่ปี 1996 คู่ขนานกับ <b>ผลตอบแทนพันธบัตรสหรัฐ 30 ปีที่ทำสถิติสูงสุดใหม่ในรอบ 19 ปีใกล้ 5.32%</b> ซึ่งยังเป็นปัจจัยหลักของการปรับลงครั้งนี้ — ตราสารหนี้ ไม่ใช่พื้นฐาน AI ยังคงเป็นประเด็นหลัก สถานการณ์ฮอร์มุซยังเลวร้ายลงอีก เมื่อเรือบรรทุกสินค้าถูกโจมตีจนมีลูกเรือเสียชีวิต 1 ราย ทั้งที่แล่นตามเส้นทาง "ใต้" ที่ตกลงกับโอมานแล้ว ทรัมป์ระบุว่าช่องแคบยัง "เปิดและดำเนินการปกติ" แต่ข้อมูล Kpler ชี้ว่าจำนวนเรือผ่านช่องแคบเฉลี่ย 5 วันเหลือเพียง 10 ลำ ต่ำสุดตั้งแต่ พ.ค. เบรนท์ยืนเหนือ $91 ต่อบาร์เรล WTI ใกล้ $85.38 <b>ทองคำพลิกร่วงเกือบ 2% สู่ใกล้ $4,340 ต่อออนซ์</b> เนื่องจากผลตอบแทนพันธบัตรทั่วโลกที่พุ่งขึ้นตอนนี้มีน้ำหนักมากกว่าแรงหนุนสินทรัพย์ปลอดภัย ในข่าวดีเพียงจุดเดียว <b>ทรัมป์ประกาศพักการเก็บภาษี 50% ที่กำหนดไว้กับสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์ออกไป 3 วัน — จนถึงสิ้นวันศุกร์ — เพียงไม่กี่ชั่วโมงก่อนจะมีผลจริง</b> โดยประกาศว่ามี "ข้อตกลง ที่รอการสรุปเอกสารขั้นสุดท้าย" กับนายกฯ Carney ซึ่งระบุว่าเป็น "ความคืบหน้าอย่างมาก" แต่ "ยังมีงานสำคัญที่ต้องทำต่อ" สำหรับลูกค้าของคุณ: ผลตอบแทนพันธบัตรที่สูงสุดในรอบหลายทศวรรษทั้งในสหรัฐฯ และญี่ปุ่น ทำให้นี่คือจังหวะที่เร่งด่วนและมีเวลาจำกัดที่สุดในการ <b>ล็อกคูปองพันธบัตรระยะยาว</b> ขณะเหตุโจมตีฮอร์มุซจริงที่มีผู้เสียชีวิต — แม้ทองคำเองจะร่วงจากแรงกดดันผลตอบแทนพันธบัตร — ยังทำให้การคุยเรื่อง <b>ป้องกันความเสี่ยงภูมิรัฐศาสตร์</b> เป็นประเด็นแยกที่ต้องพูดคุยต่อเนื่องจากเรื่องพันธบัตร ส่วนการพักภาษีแคนาดาเป็นเพียงข่าวบวกระยะสั้น 3 วัน ไม่ใช่เหตุผลให้เปลี่ยนมุมมองทั้งสองเรื่องข้างต้น`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,703.28", chg:-0.54, series:[7745.06,7703.28],
      txt:{en:`<b>Wall Street closed lower Tuesday in its first full session since the Hormuz vessel strike (S&P −0.54%, Dow −0.06%, Nasdaq −1.29%),</b> as the 30-year Treasury yield pushed to a fresh 19-year high near 5.32%. Home Depot beat Q2 estimates and reaffirmed guidance; Target and Lowe's report Wednesday, Walmart Thursday.`, th:`<b>วอลล์สตรีทปิดตลาดในแดนลบวันอังคาร ซึ่งเป็นวันซื้อขายเต็มวันแรกนับตั้งแต่เหตุเรือถูกยิงที่ฮอร์มุซ (S&P −0.54%, Dow −0.06%, Nasdaq −1.29%)</b> ขณะผลตอบแทนพันธบัตร 30 ปีขึ้นสู่สถิติสูงสุดใหม่ในรอบ 19 ปีที่ใกล้ 5.32% Home Depot รายงานผลไตรมาส 2 ดีกว่าคาดและคงเป้าทั้งปี ขณะ Target และ Lowe's จะรายงานวันพุธ Walmart วันพฤหัสฯ`},
      why:{en:`A confirmed US close — not just futures — on a 30-year yield at a fresh 19-year high is the clearest, most time-limited window yet to lock in long bond coupons for income-seeking clients.`, th:`การปิดตลาดสหรัฐฯ จริง ไม่ใช่แค่ดัชนีล่วงหน้า บนผลตอบแทนพันธบัตร 30 ปีที่สูงสุดใหม่ในรอบ 19 ปี เป็นจังหวะที่ชัดเจนและมีเวลาจำกัดที่สุดในการล็อกคูปองพันธบัตรระยะยาวสำหรับลูกค้าที่มองหารายได้`},
      full:{en:`Wall Street closed lower Tuesday in its first full trading session since a vessel was struck by an unidentified projectile in the Strait of Hormuz. The S&P 500 fell 0.54% (−41.78pts) to 7,703.28, the Dow Jones Industrial Average slipped a modest 0.06% (−32.10pts) to 53,427.68, and the Nasdaq Composite led the decline, dropping 1.29% (−344.55pts) to 26,300.36 as AI-linked chip and software names sold off. The session confirmed the risk-off tone that had shown up only in pre-market futures a day earlier. The 30-year Treasury yield pushed to a fresh 19-year high near 5.32% — nearing levels last seen in 2002 — as mounting concern over the US budget deficit, heavy Treasury issuance and AI-related debt supply kept long-end yields elevated; the 10-year yield held near 4.73%. Brent crude topped $91/bbl intraday before settling near $90.97, its highest close in about 19 months, while WTI traded near $85, as Iran and Oman reportedly agreed on shipping-route coordinates through the Strait even as sporadic vessel strikes continued. Home Depot reported second-quarter results that beat Wall Street estimates on both the top and bottom lines — sales of $47.9bn and adjusted EPS of $4.92 versus $4.73 expected — and reaffirmed its full-year guidance, a solid start to a retail-earnings week that continues with Target and Lowe's Wednesday and Walmart Thursday.`, th:`วอลล์สตรีทปิดตลาดในแดนลบวันอังคาร ซึ่งเป็นวันซื้อขายเต็มวันแรกนับตั้งแต่เรือลำหนึ่งถูกยิงด้วยกระสุนไม่ทราบชนิดในช่องแคบฮอร์มุซ ดัชนี S&P 500 ลดลง 0.54% (−41.78 จุด) สู่ 7,703.28 ดัชนี Dow Jones ลดลงเพียงเล็กน้อย 0.06% (−32.10 จุด) สู่ 53,427.68 และดัชนี Nasdaq Composite นำการปรับลงด้วยการร่วง 1.29% (−344.55 จุด) สู่ 26,300.36 จากแรงขายหุ้นกลุ่มชิปและซอฟต์แวร์ที่เชื่อมโยงกับ AI การซื้อขายรอบนี้ยืนยันบรรยากาศ risk-off ที่ก่อนหน้านี้ปรากฏเฉพาะในดัชนีล่วงหน้าช่วงก่อนตลาดเปิดเมื่อวันก่อน ผลตอบแทนพันธบัตร 30 ปีขึ้นสู่สถิติสูงสุดใหม่ในรอบ 19 ปีที่ใกล้ 5.32% เข้าใกล้ระดับที่เห็นครั้งล่าสุดในปี 2002 จากความกังวลเรื่องขาดดุลงบประมาณสหรัฐฯ การออกพันธบัตรจำนวนมาก และหนี้ที่เกี่ยวข้องกับ AI ที่ยังกดดันผลตอบแทนระยะยาวให้อยู่ในระดับสูง ขณะผลตอบแทนพันธบัตร 10 ปียืนใกล้ 4.73% ราคาน้ำมันเบรนท์ทะลุ $91 ต่อบาร์เรลระหว่างวัน ก่อนปิดตลาดใกล้ $90.97 สูงสุดในรอบราว 19 เดือน ขณะ WTI ซื้อขายใกล้ $85 มีรายงานว่าอิหร่านและโอมานตกลงพิกัดเส้นทางเดินเรือผ่านช่องแคบแล้ว แม้จะยังมีเหตุเรือถูกโจมตีประปรายต่อเนื่อง Home Depot รายงานผลประกอบการไตรมาส 2 ดีกว่าคาดการณ์ของวอลล์สตรีททั้งยอดขายและกำไร — ยอดขาย $47,900 ล้านดอลลาร์ และกำไรต่อหุ้นปรับปรุงที่ $4.92 เทียบคาดการณ์ $4.73 — และคงเป้าทั้งปี เป็นการเริ่มต้นที่ดีของสัปดาห์ผลประกอบการค้าปลีก ที่จะตามมาด้วย Target และ Lowe's วันพุธ และ Walmart วันพฤหัสฯ`},
      sources:[{l:"CNBC",u:"https://www.cnbc.com/2026/08/18/30-year-treasury-yield-three-things-that-could-drive-it-even-higher.html"},{l:"Investing.com",u:"https://www.investing.com/news/earnings/home-depot-beats-estimates-reaffirms-fiscal-2026-guidance-4864717"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,238", chg:-0.38, series:[26443,26238],
      txt:{en:`<b>DAX fell about 0.4% to near 26,238 Tuesday,</b> its lowest level since 6 August, as rising oil prices and higher bond yields from the Hormuz escalation weighed alongside fresh tech-sector weakness (Infineon −2.5%, Siemens −1.1%).`, th:`<b>DAX ลดลงราว 0.4% สู่ใกล้ 26,238 วันอังคาร</b> ระดับต่ำสุดนับตั้งแต่ 6 ส.ค. เนื่องจากราคาน้ำมันที่สูงขึ้นและผลตอบแทนพันธบัตรที่เพิ่มขึ้นจากสถานการณ์ฮอร์มุซที่ตึงเครียดขึ้น กดดันตลาด พร้อมแรงขายหุ้นกลุ่มเทคใหม่ (Infineon −2.5%, Siemens −1.1%)`},
      why:{en:`"Europe banks" is a favoured global theme — relevant for diversified equity-fund conversations, even as today's dip reflects the same oil/yield story hitting other markets.`, th:`"ธนาคารยุโรป" ยังเป็นธีมโลกที่ได้รับความนิยม — ใช้คุยเรื่องกองทุนหุ้นแบบกระจายการลงทุนได้ แม้การปรับลงวันนี้จะมาจากประเด็นน้ำมัน/ผลตอบแทนพันธบัตรเดียวกับตลาดอื่น`},
      full:{en:`European equities pulled back Tuesday as the Hormuz escalation and higher bond yields weighed on risk appetite. Germany's DAX fell about 0.4% to near 26,238, its lowest level since 6 August, with declines led by Infineon (−2.54%), Siemens Energy (−2.51%) and Siemens (−1.13%), while Deutsche Post, BASF and Deutsche Telekom held up better. The move mirrors the same drivers hitting Wall Street: rising oil prices on the Strait of Hormuz standoff and Treasury yields at multi-decade highs. European banks and value sectors remain a favoured theme among global strategists even after the pullback, with Europe Inc. still reporting its best earnings growth in four years.`, th:`หุ้นยุโรปปรับลงวันอังคาร เนื่องจากสถานการณ์ฮอร์มุซที่ตึงเครียดขึ้นและผลตอบแทนพันธบัตรที่สูงขึ้นกดดันความเสี่ยงในตลาด ดัชนี DAX เยอรมนีลดลงราว 0.4% สู่ใกล้ 26,238 ต่ำสุดนับตั้งแต่ 6 ส.ค. นำโดยการปรับลงของ Infineon (−2.54%) Siemens Energy (−2.51%) และ Siemens (−1.13%) ขณะ Deutsche Post, BASF และ Deutsche Telekom ยืนได้ดีกว่า การเคลื่อนไหวนี้สะท้อนปัจจัยเดียวกับที่กดดันวอลล์สตรีท: ราคาน้ำมันที่สูงขึ้นจากสถานการณ์ฮอร์มุซ และผลตอบแทนพันธบัตรที่สูงสุดในรอบหลายทศวรรษ หุ้นกลุ่มธนาคารยุโรปและหุ้นคุณค่ายังเป็นธีมที่นักกลยุทธ์ทั่วโลกชื่นชอบแม้จะปรับลง ขณะผลประกอบการบริษัทยุโรปยังแข็งแกร่งสุดในรอบ 4 ปี`},
      sources:[{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"},{l:"CNBC Markets",u:"https://www.cnbc.com/markets/"},{l:"Bloomberg Europe",u:"https://www.bloomberg.com/europe"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"65,724.25", chg:-2.57, series:[67460.73,65724.25],
      txt:{en:`<b>Nikkei closed down 2.57% at 65,724.25 Wednesday,</b> a second straight losing session after Tuesday's 2.54% drop, as <b>South Korea's Kospi plunged as much as 6.39% intraday and tripped a sell-side sidecar</b> before closing down 5.6% at 6,487.34, with Samsung Electronics (−7.26%) and SK Hynix (−9.27%) leading a tech-wide rout tied to the weak Wall Street close and Japan's own 10-year bond yield hitting its highest level since 1996.`, th:`<b>Nikkei ปิดลดลง 2.57% ที่ 65,724.25 วันพุธ</b> ปรับลงเป็นวันที่สองติดต่อกันหลังลดลง 2.54% วันอังคาร ขณะ <b>Kospi เกาหลีใต้ร่วงลงถึง 6.39% ระหว่างวัน จนต้องหยุดพักการซื้อขายชั่วคราวแบบ sell-side sidecar</b> ก่อนปิดลบ 5.6% ที่ 6,487.34 โดย Samsung Electronics (−7.26%) และ SK Hynix (−9.27%) นำการปรับลงของกลุ่มเทคทั้งกระดาน เชื่อมโยงกับการปิดตลาดสหรัฐฯ ที่อ่อนแอ และผลตอบแทนพันธบัตรญี่ปุ่นอายุ 10 ปีที่ทำสถิติสูงสุดนับตั้งแต่ปี 1996`},
      why:{en:`A sharp, sidecar-triggering plunge in Korean chip stocks — the second straight session of Asia tech weakness — is a strong prompt to reframe this as noise for long-term AI/tech holdings, while flagging bonds (multi-decade yields in both the US and Japan) as the more durable story for cautious clients.`, th:`การร่วงลงรุนแรงจนต้องหยุดพักการซื้อขายของหุ้นชิปเกาหลี — วันที่สองติดต่อกันที่หุ้นเทคเอเชียอ่อนแอ — เป็นจังหวะดีที่จะอธิบายว่านี่คือความผันผวนระยะสั้นสำหรับพอร์ตเทค/AI ระยะยาว ขณะชี้ให้เห็นว่าตราสารหนี้ (ผลตอบแทนสูงสุดในรอบหลายทศวรรษทั้งสหรัฐฯ และญี่ปุ่น) เป็นเรื่องราวที่ยั่งยืนกว่าสำหรับลูกค้าที่ระมัดระวัง`},
      full:{en:`Asian shares extended their decline into a second session Wednesday. Japan's Nikkei 225 fell 2.57% to close at 65,724.25, following Tuesday's 2.54% drop to 67,460.73 that had snapped a five-session winning streak; AI-supply-chain names led the losses, with Kioxia down about 10%, Furukawa Electric down 9.8%, Fujikura down 8.4% and SoftBank down 8%. South Korea's Kospi plunged as much as 6.39% intraday, triggering the Korea Exchange's sell-side sidecar mechanism (activated when Kospi 200 futures fall 5% or more for a minute), before paring losses to close down 5.6% at 6,487.34 — extending Tuesday's 1.55% drop to 6,869.83, which had snapped a five-day winning streak. Samsung Electronics fell 7.26% to ₩249,000 and SK Hynix dropped 9.27% to ₩1,508,000, dragged down by a weak overnight Wall Street close and fading risk appetite for AI-linked chip and memory names — mirroring declines in Micron and Western Digital. Japan's own 10-year government bond yield climbed to its highest level since 1996 amid speculation of a September Bank of Japan rate hike, adding a domestic-rates dimension to the region's malaise on top of the US 30-year Treasury yield's fresh 19-year high. Analysts point to a combination of Middle East instability, surging global bond yields, and renewed doubts about the pace of AI-related capital spending as the drivers, rather than any single company-specific news.`, th:`หุ้นเอเชียปรับลงต่อเป็นวันที่สองในวันพุธ ดัชนี Nikkei 225 ญี่ปุ่นลดลง 2.57% ปิดที่ 65,724.25 หลังลดลง 2.54% สู่ 67,460.73 วันอังคาร ซึ่งทำให้สถิติปรับขึ้นต่อเนื่อง 5 วันสิ้นสุดลง หุ้นกลุ่มห่วงโซ่อุปทาน AI นำการปรับลง โดย Kioxia ลดลงราว 10% Furukawa Electric ลดลง 9.8% Fujikura ลดลง 8.4% และ SoftBank ลดลง 8% ดัชนี Kospi เกาหลีใต้ร่วงลงถึง 6.39% ระหว่างวัน จนกระตุ้นกลไก sell-side sidecar ของตลาดหลักทรัพย์เกาหลี (เริ่มทำงานเมื่อฟิวเจอร์ส Kospi 200 ร่วงตั้งแต่ 5% ขึ้นไปนาน 1 นาที) ก่อนลดช่วงลบมาปิดที่ลบ 5.6% ที่ 6,487.34 ต่อจากที่ลดลง 1.55% สู่ 6,869.83 วันอังคาร ซึ่งทำให้สถิติปรับขึ้นต่อเนื่อง 5 วันสิ้นสุดลงเช่นกัน Samsung Electronics ลดลง 7.26% สู่ 249,000 วอน และ SK Hynix ร่วง 9.27% สู่ 1,508,000 วอน ฉุดโดยการปิดตลาดสหรัฐฯ ที่อ่อนแอข้ามคืน และความเชื่อมั่นที่ลดลงต่อหุ้นชิป/หน่วยความจำที่เชื่อมโยงกับ AI — สอดคล้องกับการปรับลงของ Micron และ Western Digital ผลตอบแทนพันธบัตรรัฐบาลญี่ปุ่นอายุ 10 ปีเองก็ขึ้นสู่สถิติสูงสุดนับตั้งแต่ปี 1996 ท่ามกลางการคาดการณ์ว่าธนาคารกลางญี่ปุ่นอาจขึ้นดอกเบี้ยเดือน ก.ย. เพิ่มมิติความเสี่ยงด้านดอกเบี้ยในประเทศ นอกเหนือจากผลตอบแทนพันธบัตรสหรัฐ 30 ปีที่ทำสถิติสูงสุดใหม่ในรอบ 19 ปี นักวิเคราะห์ชี้ว่าเป็นผลจากความไม่แน่นอนในตะวันออกกลาง ผลตอบแทนพันธบัตรทั่วโลกที่พุ่งขึ้น และความสงสัยเรื่องจังหวะการลงทุน AI มากกว่าข่าวเฉพาะบริษัทใดบริษัทหนึ่ง`},
      sources:[{l:"CNBC Asia Markets",u:"https://www.cnbc.com/markets/asia-markets/"},{l:"Korea JoongAng Daily",u:"https://www.koreajoongangdaily.com/business/krx-activates-sellside-sidecar-for-kospi-on-sharp-fall/12831455"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,471.15", chg:0.07, series:[25453,25471.15],
      txt:{en:`<b>Hang Seng recovered from a midday slide to close up 0.07% at 25,471.15 Tuesday,</b> even as oil's jump on the Hormuz vessel strike weighed earlier in the session; mainland China's Shanghai Composite gained 0.19% to a one-month high of 3,990.30, while the Shenzhen Component fell 0.56%. The tech-led selloff hit mainland shares harder on Wednesday, with the <b>Shanghai Composite shedding about 1.5% to near 3,927.70</b> as the regional chip rout spread; Hong Kong traded choppily through the session with no confirmed close yet as we go to press.`, th:`<b>Hang Seng ฟื้นตัวจากที่ร่วงลงช่วงเที่ยงมาปิดบวก 0.07% ที่ 25,471.15 วันอังคาร</b> แม้ราคาน้ำมันที่พุ่งขึ้นจากเหตุเรือถูกยิงที่ฮอร์มุซจะกดดันตลาดในช่วงเช้า ขณะดัชนี Shanghai Composite จีนแผ่นดินใหญ่ปรับขึ้น 0.19% สู่จุดสูงสุดในรอบกว่าหนึ่งเดือนที่ 3,990.30 ส่วนดัชนี Shenzhen Component ลดลง 0.56% การเทขายกลุ่มเทคกระทบหุ้นจีนแผ่นดินใหญ่หนักขึ้นในวันพุธ โดย <b>Shanghai Composite ร่วงราว 1.5% สู่ใกล้ 3,927.70</b> ตามแรงเทขายหุ้นชิปที่ลุกลามในภูมิภาค ขณะฮ่องกงซื้อขายผันผวนตลอดวันโดยยังไม่มีราคาปิดที่ยืนยันได้ ณ เวลาที่จัดทำรายงานนี้`},
      why:{en:`A same-day recovery in Hong Kong and a one-month high in Shanghai — even as oil and Hormuz headlines stayed live — reinforces the case for diversified Asia exposure and bonds over concentrated single-country or single-headline bets.`, th:`การฟื้นตัวในวันเดียวกันของฮ่องกงและจุดสูงสุดรอบเดือนของเซี่ยงไฮ้ แม้ข่าวน้ำมัน/ฮอร์มุซจะยังร้อนแรง ยิ่งตอกย้ำเหตุผลให้เลือกการกระจายลงทุนในเอเชียและตราสารหนี้ มากกว่าเดิมพันประเทศเดียวหรือข่าวเดียว`},
      full:{en:`Chinese and Hong Kong equities staged a same-day recovery Tuesday. The Hang Seng slid as much as 0.65% at midday, hit by oil's jump after Monday's Strait of Hormuz vessel strike, before buyers stepped in to push it to a 0.07% gain by the close, ending at 25,471.15. Mainland China's Shanghai Composite added 0.19% to close at 3,990.30, its highest level in more than a month, while the Shenzhen Component fell 0.56% to 14,622.50 and the ChiNext growth board lost 0.92%. Premier Li Qiang called for more measures to meet this year's economic targets after weak July data, keeping stimulus hopes alive even as Beijing has so far favoured targeted over large-scale support. The recovery sits on top of an unresolved US–China tariff overhang (effective US tariff on Chinese goods around 12.5%), reinforcing the case for many investors to favour diversified Asia-ex-China strategies and fixed income over concentrated single-country exposure. That calm didn't last: Wednesday's regional chip-and-bond-yield selloff pulled the Shanghai Composite down about 1.5% to near 3,927.70, while Hong Kong's Hang Seng traded choppily through the session with no confirmed close available as of this update.`, th:`หุ้นจีนและฮ่องกงฟื้นตัวในวันเดียวกันวันอังคาร ดัชนี Hang Seng เคยร่วงลงถึง 0.65% ช่วงเที่ยง จากราคาน้ำมันที่พุ่งขึ้นหลังเหตุเรือถูกยิงในช่องแคบฮอร์มุซวันจันทร์ ก่อนแรงซื้อจะเข้ามาดันดัชนีให้ปิดบวก 0.07% ที่ 25,471.15 ดัชนี Shanghai Composite จีนแผ่นดินใหญ่ปรับขึ้น 0.19% ปิดที่ 3,990.30 สูงสุดในรอบกว่าหนึ่งเดือน ขณะดัชนี Shenzhen Component ลดลง 0.56% สู่ 14,622.50 และดัชนี ChiNext กลุ่มหุ้นเติบโตลดลง 0.92% นายกรัฐมนตรีหลี่ เฉียง เรียกร้องให้มีมาตรการเพิ่มเติมเพื่อให้บรรลุเป้าหมายเศรษฐกิจปีนี้ หลังข้อมูลเดือน ก.ค. อ่อนแอ ทำให้ความหวังมาตรการกระตุ้นเศรษฐกิจยังมีอยู่ แม้ปักกิ่งจะยังเลือกมาตรการเฉพาะจุดมากกว่าการกระตุ้นขนาดใหญ่ การฟื้นตัวนี้ยังอยู่บนแรงกดดันภาษีสหรัฐ–จีนที่ยังไม่คลี่คลาย (ภาษีสหรัฐที่เก็บจากสินค้าจีนอยู่ที่ราว 12.5%) ซึ่งตอกย้ำให้นักลงทุนจำนวนมากหันไปหากลยุทธ์เอเชียไม่รวมจีนแบบกระจายความเสี่ยงและตราสารหนี้มากกว่าการเดิมพันประเทศเดียว บรรยากาศสงบนั้นอยู่ได้ไม่นาน: การเทขายกลุ่มชิปและผลตอบแทนพันธบัตรในภูมิภาควันพุธฉุด Shanghai Composite ลงราว 1.5% สู่ใกล้ 3,927.70 ขณะ Hang Seng ฮ่องกงซื้อขายผันผวนตลอดวันโดยยังไม่มีราคาปิดที่ยืนยันได้ ณ เวลาที่จัดทำรายงานนี้`},
      sources:[{l:"Xinhua",u:"https://english.news.cn/20260818/703a83902cb74dfbb148af6ed8679b8a/c.html"},{l:"Business Standard",u:"https://www.business-standard.com/markets/capital-market-news/china-stocks-turn-choppy-as-investors-await-stimulus-126081800927_1.html"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,621.62", chg:-0.27, series:[1626.02,1621.62],
      txt:{en:`<b>SET Index closed down 0.27% at 1,621.62 Tuesday,</b> giving back Monday's gain as it traded in a 1,617–1,631 range, tracking the region's cautious tone on rising oil and bond yields.`, th:`<b>ดัชนี SET ปิดลดลง 0.27% ที่ 1,621.62 วันอังคาร</b> คืนกำไรที่ทำได้วันจันทร์ โดยเคลื่อนไหวในกรอบ 1,617–1,631 สอดคล้องกับบรรยากาศระมัดระวังในภูมิภาคจากราคาน้ำมันและผลตอบแทนพันธบัตรที่สูงขึ้น`},
      why:{en:`A choppy SET pushes yield-seeking clients toward offshore bonds and funds — your core book.`, th:`SET ที่ผันผวนผลักลูกค้าที่มองหาผลตอบแทนไปหาตราสารหนี้และกองทุนต่างประเทศ — ซึ่งเป็นพอร์ตหลักของคุณ`},
      full:{en:`Thailand's SET Index closed Tuesday at 1,621.62, down 0.27%, giving back Monday's 1.05% gain. The index opened at 1,626.26, ranged between a high of 1,630.87 and a low of 1,617.37, on turnover of about THB 83.3 billion, as the region's tone turned more cautious with oil prices at a roughly 19-month high and the 30-year US Treasury yield at a fresh 19-year high. With global bond yields elevated, yield-seeking Thai investors continue to look offshore for income and growth alongside domestic exposure.`, th:`ดัชนี SET ของไทยปิดตลาดวันอังคารที่ 1,621.62 ลดลง 0.27% คืนกำไร 1.05% ที่ทำได้วันจันทร์ ดัชนีเปิดที่ 1,626.26 เคลื่อนไหวในกรอบสูงสุด 1,630.87 และต่ำสุด 1,617.37 มูลค่าการซื้อขายราว 8.33 หมื่นล้านบาท ขณะบรรยากาศในภูมิภาคระมัดระวังมากขึ้น จากราคาน้ำมันที่สูงสุดในรอบราว 19 เดือน และผลตอบแทนพันธบัตรสหรัฐ 30 ปีที่สูงสุดใหม่ในรอบ 19 ปี เมื่อผลตอบแทนพันธบัตรทั่วโลกยืนสูง นักลงทุนไทยที่มองหาผลตอบแทนจึงยังหันไปลงทุนต่างประเทศควบคู่กับการลงทุนในประเทศ`},
      sources:[{l:"Kaohoon Intl",u:"https://www.kaohooninternational.com/markets/588752"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Brent crude holds above $91/bbl Wednesday, WTI near $85.38,</b> after a cargo ship was attacked and one crew member killed overnight even while sailing an agreed "southern route" through the Strait of Hormuz — Trump calls the strait "open and operating," but Kpler data show crossings at a five-day average of just 10 vessels, the lowest since May. <b>Gold reversed hard, down almost 2% to trade near $4,340/oz,</b> snapping its recent advance, as surging global bond yields now outweigh the safe-haven bid from the live Hormuz risk — a reminder that geopolitical hedging and the bond trade are two separate conversations right now, not one.`, th:`<b>ราคาน้ำมันเบรนท์ยืนเหนือ $91 ต่อบาร์เรลวันพุธ WTI ใกล้ $85.38</b> หลังเรือบรรทุกสินค้าถูกโจมตีข้ามคืนจนมีลูกเรือเสียชีวิต 1 ราย ทั้งที่แล่นตามเส้นทาง "ใต้" ที่ตกลงกับโอมานแล้ว ทรัมป์ระบุว่าช่องแคบยัง "เปิดและดำเนินการปกติ" แต่ข้อมูล Kpler ชี้ว่าจำนวนเรือผ่านช่องแคบเฉลี่ย 5 วันเหลือเพียง 10 ลำ ต่ำสุดตั้งแต่ พ.ค. <b>ทองคำพลิกร่วงเกือบ 2% สู่ใกล้ $4,340 ต่อออนซ์</b> ยุติการปรับขึ้นล่าสุด เนื่องจากผลตอบแทนพันธบัตรทั่วโลกที่พุ่งขึ้นตอนนี้มีน้ำหนักมากกว่าแรงหนุนสินทรัพย์ปลอดภัยจากความเสี่ยงฮอร์มุซที่ยังคุกรุ่น — เตือนว่าการป้องกันความเสี่ยงภูมิรัฐศาสตร์และการเทรดพันธบัตรตอนนี้เป็นคนละเรื่องกัน ไม่ใช่เรื่องเดียวกัน`},
     why:{en:`A fatal Hormuz attack on an agreed "safe" route, even as gold itself dips on yield pressure, shows the geopolitical hedge case now needs to be made on its own merits — not simply inferred from gold's price action.`, th:`เหตุโจมตีที่มีผู้เสียชีวิตบนเส้นทางที่ตกลงว่า "ปลอดภัย" แล้ว แม้ทองคำเองจะร่วงจากแรงกดดันผลตอบแทนพันธบัตร แสดงว่าการเสนอป้องกันความเสี่ยงภูมิรัฐศาสตร์ตอนนี้ต้องอธิบายด้วยเหตุผลของมันเอง ไม่ใช่อนุมานจากราคาทองคำเพียงอย่างเดียว`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 30-year Treasury yield pushed to a fresh 19-year high near 5.32% Tuesday</b> — nearing levels last seen in 2002 — and now <b>Japan's own 10-year government bond yield has joined it at a roughly three-decade high,</b> as mounting concern over budget deficits, heavy issuance and AI-related debt supply keeps long-end yields elevated worldwide. The <b>US 10-year yield held near 4.73%</b>, while markets still price roughly a 30% chance of a Fed rate hike in September (hold odds near 69%). This global, not just US, rise in long yields is now the dominant driver of Wednesday's Asia equity selloff.`, th:`<b>ผลตอบแทนพันธบัตร 30 ปีขึ้นสู่สถิติสูงสุดใหม่ในรอบ 19 ปีที่ใกล้ 5.32% วันอังคาร</b> เข้าใกล้ระดับที่เห็นครั้งล่าสุดในปี 2002 และตอนนี้ <b>ผลตอบแทนพันธบัตรรัฐบาลญี่ปุ่นอายุ 10 ปีเองก็ทำสถิติสูงสุดในรอบเกือบ 3 ทศวรรษเช่นกัน</b> จากความกังวลเรื่องขาดดุลงบประมาณ การออกพันธบัตรจำนวนมาก และหนี้ที่เกี่ยวข้องกับ AI ที่ยังกดดันผลตอบแทนระยะยาวทั่วโลก <b>ผลตอบแทน 10 ปีสหรัฐฯ ยืนใกล้ 4.73%</b> ขณะตลาดยังให้น้ำหนักราว 30% ว่าเฟดจะขึ้นดอกเบี้ยเดือน ก.ย. (โอกาสคงดอกเบี้ยใกล้ 69%) การขึ้นของผลตอบแทนพันธบัตรระยะยาวทั่วโลก ไม่ใช่แค่สหรัฐฯ ตอนนี้กลายเป็นปัจจัยหลักที่ฉุดหุ้นเอเชียร่วงวันพุธ`},
     why:{en:`Fresh multi-decade highs on long bonds in both the US and Japan simultaneously — not an isolated US story — is the single biggest talking point this update: new money can lock exceptionally attractive long-duration coupons right now, in a global, not just domestic, repricing.`, th:`ผลตอบแทนพันธบัตรระยะยาวที่ทำสถิติสูงสุดในรอบหลายทศวรรษพร้อมกันทั้งสหรัฐฯ และญี่ปุ่น — ไม่ใช่แค่เรื่องของสหรัฐฯ ประเทศเดียว — คือประเด็นที่สำคัญที่สุดของรอบนี้ เงินลงทุนใหม่สามารถล็อกคูปองพันธบัตรระยะยาวที่น่าสนใจเป็นพิเศษได้ตอนนี้ ในภาวะที่ผลตอบแทนพันธบัตรกำลังปรับตัวใหม่ทั่วโลก ไม่ใช่แค่ในประเทศ`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`<b>Trump paused his scheduled 50% tariff on ~$20bn of Canadian goods (from hockey sticks to tongue depressors) for three days — until end of day Friday 21 August — hours before it was due to take effect at 12:01am ET Wednesday 19 August.</b> After a last-minute call, Trump announced on Truth Social that Canada and the US, "subject to the finalization of documents, have a DEAL," while PM Carney was more measured, calling it "substantial progress" with "important work still to be done" on autos, steel, aluminum, forest products, dairy, alcohol and procurement. The tariff was authorized under the rarely-used Section 338 of the Tariff Act of 1930. China sits at 12.5%; Washington has floated pharma tariffs rising toward 200% later in 2026.`, th:`<b>ทรัมป์ประกาศพักการเก็บภาษี 50% ที่กำหนดไว้กับสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์ (ตั้งแต่ไม้ฮอกกี้ถึงไม้กดลิ้นทางการแพทย์) ออกไป 3 วัน — จนถึงสิ้นวันศุกร์ที่ 21 ส.ค. — เพียงไม่กี่ชั่วโมงก่อนจะมีผลจริงเวลา 00:01 น. ตามเวลาสหรัฐฝั่งตะวันออกวันพุธที่ 19 ส.ค.</b> หลังโทรศัพท์คุยกันในนาทีสุดท้าย ทรัมป์โพสต์ผ่าน Truth Social ว่าแคนาดาและสหรัฐฯ "มีข้อตกลงแล้ว โดยรอการสรุปเอกสารขั้นสุดท้าย" ขณะนายกฯ Carney ใช้ถ้อยคำระมัดระวังกว่า โดยเรียกว่าเป็น "ความคืบหน้าอย่างมาก" แต่ "ยังมีงานสำคัญที่ต้องทำต่อ" ในประเด็นรถยนต์ เหล็ก อะลูมิเนียม ผลิตภัณฑ์ป่าไม้ นม แอลกอฮอล์ และการจัดซื้อภาครัฐ ภาษีนี้อ้างอำนาจตามมาตรา 338 ของกฎหมายภาษีปี 1930 ที่แทบไม่เคยถูกใช้มาก่อน จีนอยู่ที่ 12.5% สหรัฐยังส่งสัญญาณอาจขึ้นภาษียาสูงถึง 200% ปลายปี 2026`}, w:{en:`A three-day, deal-contingent pause is real relief but not resolution — flag it to clients as a welcome de-escalation on Canadian and cross-border-exposed names, while keeping the broader case for bonds and diversified global exposure over single-country bets, since the underlying dispute (autos, steel, dairy, procurement) is still unresolved and the tariff could return as soon as Friday.`, th:`การพักภาษี 3 วันที่ขึ้นกับการบรรลุข้อตกลงเป็นการผ่อนคลายจริง แต่ยังไม่ใช่การแก้ปัญหาที่จบสิ้น — ควรบอกลูกค้าว่านี่คือข่าวดีที่ลดความตึงเครียดต่อหุ้นแคนาดาและหุ้นที่มีสัดส่วนการค้าข้ามพรมแดนสูง แต่ยังต้องคงเหตุผลหลักเรื่องตราสารหนี้และกระจายลงทุนทั่วโลกไว้ มากกว่าเดิมพันประเทศเดียว เพราะข้อพิพาทหลัก (รถยนต์ เหล็ก นม การจัดซื้อภาครัฐ) ยังไม่คลี่คลาย และภาษีอาจกลับมาเร็วสุดในวันศุกร์`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>The Hormuz standoff has turned fatal:</b> a cargo ship was attacked overnight and one crew member killed even while sailing an agreed "southern route" coordinated with Oman — the first confirmed fatality since the ceasefire lapsed. Trump insists the strait is "open and operating," but Kpler shipping data show crossings at a five-day average of just 10 vessels, the lowest since May, meaning markets aren't buying the claim. <b>Oil stays elevated: Brent holds above $91/bbl, WTI near $85.38,</b> and the risk-off has now spread into a violent Wednesday Asia session (Kospi −5.6% at the close, after plunging as much as 6.39% intraday and tripping a sell-side sidecar; Nikkei −2.57% for a second straight session) on top of Tuesday's confirmed weak US close (S&P −0.54%, Nasdaq −1.29%). Japan's 10-year government bond yield joined the US 30-year at a multi-decade high. Washington is preparing fresh Iran measures, while US envoy Jared Kushner continues working with Egypt, Turkey and Qatar on Gaza's ceasefire.`, th:`<b>สถานการณ์ฮอร์มุซทวีความรุนแรงถึงขั้นมีผู้เสียชีวิต:</b> เรือบรรทุกสินค้าถูกโจมตีข้ามคืนจนมีลูกเรือเสียชีวิต 1 ราย ทั้งที่แล่นตามเส้นทาง "ใต้" ที่ตกลงกับโอมานแล้ว — ผู้เสียชีวิตรายแรกที่ได้รับการยืนยันนับตั้งแต่หยุดยิงหมดอายุ ทรัมป์ยืนยันว่าช่องแคบยัง "เปิดและดำเนินการปกติ" แต่ข้อมูลการเดินเรือจาก Kpler ชี้ว่าจำนวนเรือผ่านช่องแคบเฉลี่ย 5 วันเหลือเพียง 10 ลำ ต่ำสุดตั้งแต่ พ.ค. สะท้อนว่าตลาดไม่เชื่อคำกล่าวอ้างนี้ <b>ราคาน้ำมันยังยืนสูง: เบรนท์ยืนเหนือ $91 ต่อบาร์เรล WTI ใกล้ $85.38</b> และภาวะ risk-off ได้ลุกลามเข้าสู่ตลาดเอเชียวันพุธอย่างรุนแรง (Kospi ปิดลบ 5.6% หลังร่วงระหว่างวันถึง 6.39% จนต้องหยุดพักการซื้อขายชั่วคราว, Nikkei ปิดลบ 2.57% เป็นวันที่สองติดต่อกัน) ซ้ำเติมการปิดตลาดสหรัฐฯ ที่อ่อนแอวันอังคาร (S&P −0.54%, Nasdaq −1.29%) ผลตอบแทนพันธบัตรรัฐบาลญี่ปุ่นอายุ 10 ปีก็ทำสถิติสูงสุดในรอบหลายทศวรรษเช่นเดียวกับพันธบัตรสหรัฐ 30 ปี สหรัฐฯ กำลังเตรียมมาตรการต่ออิหร่านเพิ่มเติม ขณะทูตพิเศษสหรัฐฯ Jared Kushner ยังคงทำงานร่วมกับอียิปต์ ตุรกี และกาตาร์ เรื่องหยุดยิงกาซา`}, w:{en:`A fatal attack on an agreed "safe" shipping route, even as Trump publicly downplays it, is a reminder that the Hormuz risk hasn't resolved with diplomacy — keep both gold and long bonds in the conversation with clients, since this update shows they can move in opposite directions on the same headline.`, th:`เหตุโจมตีจนมีผู้เสียชีวิตบนเส้นทางเดินเรือที่ตกลงว่า "ปลอดภัย" แล้ว แม้ทรัมป์จะพยายามลดความสำคัญ เป็นเครื่องเตือนใจว่าความเสี่ยงฮอร์มุซยังไม่คลี่คลายด้วยการทูต — ควรคุยทั้งเรื่องทองคำและพันธบัตรระยะยาวกับลูกค้า เพราะรอบนี้แสดงให้เห็นว่าทั้งสองอาจเคลื่อนไหวสวนทางกันได้จากข่าวเดียวกัน`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`<b>The 30-year Treasury yield pushed to a fresh 19-year high near 5.32% Tuesday</b> — nearing levels last seen in 2002 — and <b>Japan's 10-year government bond yield has now joined it at a roughly three-decade high,</b> as mounting worry over budget deficits, heavy issuance and AI-related debt supply keeps long yields elevated worldwide. The US 10-year yield held near 4.73%. Fed rate-hike odds for September held near 30% (hold odds ~69%), and the Fed's policy rate stays at 3.50–3.75%. This global bond-yield surge, not any single headline, is now the primary driver behind Wednesday's sharp Asia equity selloff.`, th:`<b>ผลตอบแทนพันธบัตร 30 ปีขึ้นสู่สถิติสูงสุดใหม่ในรอบ 19 ปีที่ใกล้ 5.32% วันอังคาร</b> เข้าใกล้ระดับที่เห็นครั้งล่าสุดในปี 2002 และ <b>ผลตอบแทนพันธบัตรรัฐบาลญี่ปุ่นอายุ 10 ปีเองก็ทำสถิติสูงสุดในรอบเกือบ 3 ทศวรรษเช่นกัน</b> จากความกังวลเรื่องขาดดุลงบประมาณ การออกพันธบัตรจำนวนมาก และหนี้ที่เกี่ยวข้องกับ AI ที่ยังกดดันผลตอบแทนระยะยาวทั่วโลก ผลตอบแทน 10 ปีสหรัฐฯ ยืนใกล้ 4.73% โอกาสเฟดขึ้นดอกเบี้ยเดือน ก.ย. ยังอยู่ใกล้ 30% (โอกาสคงดอกเบี้ยราว 69%) และเฟดยังคงอัตราดอกเบี้ยไว้ที่ 3.50–3.75% การพุ่งขึ้นของผลตอบแทนพันธบัตรทั่วโลกครั้งนี้ ไม่ใช่ข่าวใดข่าวหนึ่ง คือปัจจัยหลักที่อยู่เบื้องหลังการร่วงลงรุนแรงของหุ้นเอเชียวันพุธ`}, w:{en:`This is now the clearest, most urgent bond pitch in weeks — a simultaneous multi-decade high in the US and Japan, not an isolated US story. Clients who lock in now capture a coupon level that may not return for a long time.`, th:`นี่คือจุดขายตราสารหนี้ที่ชัดเจนและเร่งด่วนที่สุดในรอบหลายสัปดาห์ — ผลตอบแทนสูงสุดในรอบหลายทศวรรษพร้อมกันทั้งสหรัฐฯ และญี่ปุ่น ไม่ใช่แค่เรื่องของสหรัฐฯ ประเทศเดียว ลูกค้าที่ล็อกตอนนี้จะได้คูปองระดับที่อาจไม่กลับมาอีกในระยะยาว`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`<b>July CPI came in exactly at consensus (3.4% y/y, core 2.5%),</b> a relief after recent growth-scare data and the main reason Fed hike odds for September have fallen sharply this week.`, th:`<b>CPI เดือน ก.ค. ออกมาตรงคาดการณ์พอดี (3.4% เทียบปีก่อน แกน 2.5%)</b> เป็นข่าวดีหลังข้อมูลก่อนหน้าสร้างความกังวลด้านการเติบโต และเป็นเหตุผลหลักที่โอกาสเฟดขึ้นดอกเบี้ยเดือน ก.ย. ลดลงมากในสัปดาห์นี้`}, w:{en:`In-line inflation supports the "hold, not hike" narrative — a constructive backdrop for both bonds and quality equities.`, th:`เงินเฟ้อที่ออกมาตรงคาดการณ์หนุนแนวคิด "คงดอกเบี้ย ไม่ขึ้น" — บรรยากาศที่ดีต่อทั้งตราสารหนี้และหุ้นคุณภาพ`}},
  ];

  const WATCH=[
    {day:{en:"Done",th:"แล้ว"}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"l", t:{en:"US CPI & PPI — July (released: cooled)",th:"CPI & PPI สหรัฐ — ก.ค. (ออกแล้ว: ชะลอ)"}, d:{en:"CPI eased to 3.4% and PPI was soft — the week's big positive surprise. Hike odds fell toward one-in-three.",th:"CPI ชะลอเหลือ 3.4% และ PPI อ่อนตัว — เซอร์ไพรส์เชิงบวกของสัปดาห์ โอกาสขึ้นดอกเบี้ยลดเหลือราว 1 ใน 3"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"US retail sales — July (released: −0.6%, missed)",th:"ยอดค้าปลีกสหรัฐ — ก.ค. (ออกแล้ว: −0.6% ต่ำกว่าคาด)"}, d:{en:"Sales fell 0.6% m/m, the steepest drop since May 2025, versus +0.1% expected. A soft-consumer signal, though futures barely reacted.",th:"ยอดขายลด 0.6% จากเดือนก่อน ลดแรงสุดตั้งแต่ พ.ค. 2025 เทียบคาดการณ์ +0.1% สัญญาณผู้บริโภคอ่อนแรง แม้ตลาดล่วงหน้าแทบไม่ขยับ"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"US threatens 'indefinite' Iran blockade — oil jumps",th:"สหรัฐขู่ปิดล้อมอิหร่าน 'ไม่มีกำหนด' — น้ำมันพุ่ง"}, d:{en:"Defense Sec. Hegseth said the naval blockade could continue indefinitely; Treasury Sec. Bessent floated tougher Iran sanctions. Brent jumped to ~$88.64 (+1.8%) before settling near $87.74.",th:"รมว.กลาโหม Hegseth ระบุอาจปิดล้อมทางเรืออิหร่านต่อไปไม่มีกำหนด ขณะ รมว.คลัง Bessent ส่งสัญญาณคว่ำบาตรอิหร่านที่รุนแรงขึ้น ราคาน้ำมัน Brent พุ่งสู่ราว $88.64 (+1.8%) ก่อนย่อลงมาปิดใกล้ $87.74"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US consumer sentiment craters — UMich 51.0 vs 54.5 expected",th:"ความเชื่อมั่นผู้บริโภคสหรัฐทรุดหนัก — UMich 51.0 เทียบคาดการณ์ 54.5"}, d:{en:"The preliminary August reading fell from July's 55.2, a sharp miss that broke Wall Street's three-day record streak. Year-ahead inflation expectations also ticked up to 4.3%, from 4.2%.",th:"ดัชนีเบื้องต้นเดือน ส.ค. ลดจาก 55.2 ของเดือน ก.ค. พลาดเป้าอย่างแรงจนทำให้สถิติปิดต่อเนื่อง 3 วันของหุ้นสหรัฐหลุด คาดการณ์เงินเฟ้อ 1 ปีข้างหน้าก็ขยับขึ้นเป็น 4.3% จาก 4.2%"}},
    {day:{en:"Sat",th:"ส."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"h", t:{en:"Hormuz standoff escalates: Trump's \"territory\" claim, Bessent's isolation threat, new sea incidents",th:"ฮอร์มุซตึงเครียดขึ้น: ทรัมป์ขู่ \"ดินแดน\" Bessent ขู่โดดเดี่ยวเศรษฐกิจ เหตุปะทะกลางทะเลใหม่"}, d:{en:"Trump vowed to declare the Strait of Hormuz US territory; Iran's judiciary chief dismissed the claim. The UAE accused Iran of attacking a vessel in the Strait, Houthi rebels struck a Yemeni Red Sea port, and Treasury Secretary Bessent said the US is preparing unprecedented \"economic isolation\" measures against Iran — keeping oil's risk premium live into Monday's open.",th:"ทรัมป์ขู่ประกาศให้ช่องแคบฮอร์มุซเป็นดินแดนสหรัฐฯ ประธานศาลอิหร่านปฏิเสธ สหรัฐอาหรับเอมิเรตส์กล่าวหาอิหร่านโจมตีเรือในช่องแคบ กบฏฮูตีโจมตีท่าเรือในเยเมนบริเวณทะเลแดง และ รมว.คลัง Bessent ระบุสหรัฐฯ กำลังเตรียมมาตรการ \"โดดเดี่ยวทางเศรษฐกิจ\" ต่ออิหร่านที่ไม่เคยมีมาก่อน ทำให้ความเสี่ยงราคาน้ำมันยังคงอยู่ก่อนตลาดเปิดวันจันทร์"}},
    {day:{en:"Sun",th:"อา."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"h", t:{en:"Israeli strikes kill 11 in Lebanon — deadliest since June ceasefire; Ukraine's largest drone attack on Moscow draws Russian missiles",th:"อิสราเอลโจมตีเลบานอน เสียชีวิต 11 ราย รุนแรงสุดตั้งแต่หยุดยิง มิ.ย. — ยูเครนถล่มโดรนมอสโกครั้งใหญ่สุด รัสเซียตอบโต้ด้วยขีปนาวุธ"}, d:{en:"Pre-dawn Israeli strikes on Ansar and Deir ez-Zahrani in south Lebanon's Nabatieh district killed at least 11 people, including three children, and wounded about 19 — the deadliest toll since the Israel-Hezbollah ceasefire took effect in June. Israel said it killed senior Hezbollah commander Abu Hassan Alaa a day earlier and blamed Hezbollah for wounding three soldiers with explosive drones; Bloomberg reported the ceasefire itself now risks unraveling. Separately, Ukraine launched its largest drone attack on Moscow since the war began, and Russia responded with missile strikes on Kyiv.",th:"การโจมตีทางอากาศของอิสราเอลช่วงเช้ามืดที่เมือง Ansar และ Deir ez-Zahrani ในเขต Nabatieh ทางใต้ของเลบานอน ทำให้มีผู้เสียชีวิตอย่างน้อย 11 ราย รวมเด็ก 3 คน บาดเจ็บราว 19 ราย ถือเป็นยอดผู้เสียชีวิตสูงสุดนับตั้งแต่ข้อตกลงหยุดยิงอิสราเอล-ฮิซบอลเลาะห์เริ่มมีผลเดือน มิ.ย. อิสราเอลระบุว่าสังหารผู้บัญชาการฮิซบอลเลาะห์ระดับสูง Abu Hassan Alaa ไปเมื่อวันก่อนหน้า และกล่าวโทษฮิซบอลเลาะห์ว่าใช้โดรนระเบิดทำให้ทหารบาดเจ็บ 3 นาย ขณะที่ Bloomberg รายงานว่าข้อตกลงหยุดยิงเองก็เสี่ยงจะแตกหัก นอกจากนี้ ยูเครนยังเปิดฉากโจมตีโดรนมอสโกครั้งใหญ่ที่สุดของสงคราม ทำให้รัสเซียตอบโต้ด้วยขีปนาวุธถล่มเคียฟ"}},
    {day:{en:"Sun",th:"อา."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"m", t:{en:"Iran-Oman edge toward a Hormuz reopening deal, contingent on the US",th:"อิหร่าน-โอมานใกล้บรรลุข้อตกลงเปิดฮอร์มุซ ขึ้นกับสหรัฐฯ"}, d:{en:"Iran's FM Araghchi said talks with Oman on a new shipping route through the Strait of Hormuz are in their \"final stages,\" but a full reopening still hinges on Washington upholding the June ceasefire MoU. Iranian officials maintain the strait stays blocked until their conditions are met — a potential de-escalation path that could cap oil's upside even as the Lebanon front flares.",th:"รมว.ต่างประเทศอิหร่าน Araghchi ระบุการเจรจากับโอมานเรื่องเส้นทางเดินเรือใหม่ผ่านช่องแคบฮอร์มุซเข้าสู่ \"ขั้นตอนสุดท้าย\" แต่การเปิดช่องแคบเต็มรูปแบบยังขึ้นอยู่กับสหรัฐฯ ปฏิบัติตามข้อตกลง MoU หยุดยิงเดือน มิ.ย. เจ้าหน้าที่อิหร่านยืนยันว่าช่องแคบยังปิดจนกว่าเงื่อนไขของตนจะได้รับการยอมรับ — เส้นทางคลี่คลายที่อาจสกัดขาขึ้นของราคาน้ำมัน แม้สถานการณ์เลบานอนจะร้อนแรงขึ้น"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US-Iran ceasefire expires with no deal in sight",th:"หยุดยิงสหรัฐ-อิหร่านหมดอายุไร้ข้อตกลง"}, d:{en:"The 60-day ceasefire lapsed Monday. Iran's FM Araghchi said Tehran has \"not made a decision to restart negotiations\"; a senior White House official called the standoff \"static.\" Markets shrugged so far — Asian equities rallied and oil eased — but the risk is live for a fast repricing on any escalation.",th:"หยุดยิงระยะ 60 วันหมดอายุลงวันจันทร์ รมว.ต่างประเทศอิหร่าน Araghchi ระบุอิหร่าน \"ยังไม่ตัดสินใจกลับมาเจรจา\" เจ้าหน้าที่อาวุโสทำเนียบขาวเรียกสถานการณ์นี้ว่า \"หยุดนิ่ง\" ตลาดยังไม่ตอบสนองรุนแรงในตอนนี้ — หุ้นเอเชียปรับขึ้นและน้ำมันอ่อนตัวลง — แต่ความเสี่ยงยังมีอยู่หากมีข่าวความรุนแรงเพิ่มเติม"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Anthropic's ~$200bn 2028 revenue forecast lifts AI stocks",th:"คาดการณ์รายได้ปี 2028 ของ Anthropic ที่ราว 2 แสนล้านดอลลาร์ หนุนหุ้น AI"}, d:{en:"Ahead of a planned IPO, Anthropic reportedly projected 2028 revenue near $190–200bn. The report lifted AI-linked chip and storage names in Monday's premarket, with Nasdaq-100 futures up about 0.5%.",th:"ก่อนแผนเข้าตลาดหุ้น (IPO) Anthropic รายงานคาดการณ์รายได้ปี 2028 ไว้ที่ราว 1.9–2 แสนล้านดอลลาร์ รายงานนี้หนุนหุ้นกลุ่มชิปและสตอเรจที่เชื่อมโยงกับ AI ในช่วงก่อนตลาดเปิดวันจันทร์ โดยดัชนีล่วงหน้า Nasdaq-100 ขึ้นราว 0.5%"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US stocks close lower as 30-year Treasury yield hits 19-year high",th:"หุ้นสหรัฐปิดลบ ขณะผลตอบแทนพันธบัตร 30 ปีทำสถิติสูงสุดในรอบ 19 ปี"}, d:{en:"The premarket AI rally faded by the close: S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32%. The 30-year Treasury yield jumped to 5.31%, its highest since June 2007, on deficit and AI-debt-issuance concerns; oil held near $88/bbl as US-Iran talks stayed stalled.",th:"การปรับขึ้นของหุ้นเทค AI ช่วงก่อนตลาดเปิดจางหายไปเมื่อถึงช่วงปิดตลาด: S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32% ผลตอบแทนพันธบัตร 30 ปีพุ่งขึ้นสู่ 5.31% สูงสุดตั้งแต่เดือน มิ.ย. 2007 จากความกังวลขาดดุลงบประมาณและหนี้ AI ราคาน้ำมันทรงตัวใกล้ $88 ต่อบาร์เรล ขณะการเจรจาสหรัฐ-อิหร่านยังหยุดชะงัก"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Trump threatens to bomb Oman as Iran ceasefire lapses — oil jumps to a 19-month high",th:"ทรัมป์ขู่ถล่มโอมาน หลังหยุดยิงอิหร่านหมดอายุ — น้ำมันพุ่งสูงสุดในรอบ 19 เดือน"}, d:{en:"The 60-day US-Iran ceasefire lapsed Monday with no deal. Trump then threatened to \"bomb the s--- out of\" US ally Oman if it \"gets in the way\" of Oman-Iran talks over Strait of Hormuz shipping. Brent crude settled up 2.7% at $90.87/bbl — its highest in roughly 19 months — and the shock has spread into Tuesday's Asia session, pulling the Nikkei and Hang Seng off Monday's records.",th:"หยุดยิงสหรัฐ-อิหร่านระยะ 60 วันหมดอายุลงวันจันทร์โดยไม่มีข้อตกลง จากนั้นทรัมป์ขู่ว่าจะ \"ถล่ม\" โอมาน พันธมิตรสหรัฐฯ หากโอมาน \"ขวางทาง\" การเจรจาโอมาน-อิหร่านเรื่องการเดินเรือผ่านช่องแคบฮอร์มุซ ราคาน้ำมันเบรนท์ปิดตลาดบวก 2.7% ที่ $90.87 ต่อบาร์เรล สูงสุดในรอบราว 19 เดือน และแรงกระแทกนี้ได้ลุกลามมาถึงตลาดเอเชียวันอังคาร ฉุด Nikkei และ Hang Seng ร่วงจากสถิติสูงสุดของวันจันทร์"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Vessel struck by projectile in Strait of Hormuz — oil tops $91",th:"เรือถูกยิงในช่องแคบฮอร์มุซ — น้ำมันทะลุ $91"}, d:{en:"UKMTO confirmed a cargo vessel was hit by an unidentified projectile early Tuesday, damaging the engine room and injuring a crew member — the first confirmed casualty since Monday's ceasefire lapse. Brent extended Monday's 2.7% jump to top $91/bbl, its highest in about 19 months.",th:"UKMTO ยืนยันเรือบรรทุกสินค้าถูกยิงด้วยกระสุนไม่ทราบชนิดช่วงเช้ามืดวันอังคาร ห้องเครื่องเสียหายและลูกเรือได้รับบาดเจ็บ — ผู้บาดเจ็บรายแรกที่ได้รับการยืนยันนับตั้งแต่หยุดยิงหมดอายุวันจันทร์ ราคาน้ำมันเบรนท์ปรับขึ้นต่อจากที่พุ่ง 2.7% วันจันทร์ ทะลุ $91 ต่อบาร์เรล สูงสุดในรอบราว 19 เดือน"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Iran, Oman reportedly agree shipping-route coordinates through Hormuz — but strikes continue",th:"อิหร่าน-โอมานตกลงพิกัดเส้นทางเดินเรือผ่านฮอร์มุซ — แต่การโจมตียังไม่หยุด"}, d:{en:"The two sides have reportedly finalized route coordinates as part of a broader arrangement to manage Hormuz traffic, but sporadic vessel strikes — including Tuesday's — have continued even as talks progress, keeping oil's risk premium live.",th:"ทั้งสองฝ่ายมีรายงานว่าตกลงพิกัดเส้นทางเดินเรือแล้ว ซึ่งเป็นส่วนหนึ่งของข้อตกลงที่กว้างขึ้นในการจัดการการเดินเรือผ่านฮอร์มุซ แต่ยังมีเหตุเรือถูกโจมตีประปรายต่อเนื่อง — รวมถึงเหตุการณ์วันอังคาร — แม้การเจรจาจะคืบหน้า ทำให้ความเสี่ยงราคาน้ำมันยังคงอยู่"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US close confirms risk-off — S&P −0.54%, Nasdaq −1.29% as 30-year yield hits fresh 19-year high",th:"หุ้นสหรัฐปิดยืนยันภาวะ risk-off — S&P −0.54%, Nasdaq −1.29% ขณะพันธบัตร 30 ปีทำสถิติสูงสุดใหม่รอบ 19 ปี"}, d:{en:"The first full session since Monday's Hormuz vessel strike confirmed the risk-off tone that had only shown up in pre-market futures: the S&P 500 fell 0.54% to 7,703.28, the Nasdaq Composite dropped 1.29% to 26,300.36 on AI-name weakness, and the Dow held nearly flat at 53,427.68. The 30-year Treasury yield pushed to 5.32%, nearing 2002 levels.",th:"การซื้อขายเต็มวันแรกหลังเหตุเรือถูกยิงที่ฮอร์มุซวันจันทร์ ยืนยันบรรยากาศ risk-off ที่ก่อนหน้านี้ปรากฏเฉพาะในดัชนีล่วงหน้า: ดัชนี S&P 500 ลดลง 0.54% สู่ 7,703.28 ดัชนี Nasdaq Composite ร่วง 1.29% สู่ 26,300.36 จากแรงขายหุ้นกลุ่ม AI ขณะดัชนี Dow แทบไม่เปลี่ยนแปลงที่ 53,427.68 ผลตอบแทนพันธบัตร 30 ปีขึ้นสู่ 5.32% เข้าใกล้ระดับปี 2002"}},
    {day:{en:"Tue",th:"อ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Home Depot beats Q2 estimates, reaffirms full-year guidance",th:"Home Depot รายงานผลไตรมาส 2 ดีกว่าคาด คงเป้าทั้งปี"}, d:{en:"Adjusted EPS of $4.92 beat the $4.73 estimate on sales of $47.9bn, up 5.7% y/y; comparable sales rose 1.7%. A solid open to retail-earnings week, with Target and Lowe's due Wednesday and Walmart Thursday.",th:"กำไรต่อหุ้นปรับปรุงที่ $4.92 ดีกว่าคาดการณ์ $4.73 จากยอดขาย $47,900 ล้านดอลลาร์ เพิ่มขึ้น 5.7% เทียบปีก่อน ยอดขายสาขาเดิมเพิ่มขึ้น 1.7% เป็นการเริ่มต้นที่ดีของสัปดาห์ผลประกอบการค้าปลีก ก่อน Target และ Lowe's วันพุธ และ Walmart วันพฤหัสฯ"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Trump pauses Canada's 50% tariff for three days after last-minute deal",th:"ทรัมป์พักภาษี 50% ของแคนาดาออกไป 3 วัน หลังบรรลุข้อตกลงนาทีสุดท้าย"}, d:{en:"Hours before the 50% tariff on ~$20bn of Canadian goods was due to take effect at 12:01am ET, Trump announced a pause until end of day Friday 21 August, saying Canada and the US, \"subject to the finalization of documents, have a DEAL.\" PM Carney called it \"substantial progress\" with \"important work still to be done\" on autos, steel, aluminum, forest products, dairy and alcohol.",th:"ไม่กี่ชั่วโมงก่อนภาษี 50% ต่อสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์จะมีผลเวลา 00:01 น. ตามเวลาสหรัฐฝั่งตะวันออก ทรัมป์ประกาศพักภาษีออกไปจนถึงสิ้นวันศุกร์ที่ 21 ส.ค. ระบุว่าแคนาดาและสหรัฐฯ \"มีข้อตกลงแล้ว โดยรอการสรุปเอกสารขั้นสุดท้าย\" นายกฯ Carney เรียกว่าเป็น \"ความคืบหน้าอย่างมาก\" แต่ \"ยังมีงานสำคัญที่ต้องทำต่อ\" ในประเด็นรถยนต์ เหล็ก อะลูมิเนียม ผลิตภัณฑ์ป่าไม้ นม และแอลกอฮอล์"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Fatal Hormuz attack on agreed \"safe\" route — Trump says strait is \"open\" despite lowest traffic since May",th:"เหตุโจมตีฮอร์มุซมีผู้เสียชีวิตบนเส้นทาง \"ปลอดภัย\" ที่ตกลงกันแล้ว — ทรัมป์ระบุช่องแคบ \"เปิด\" ทั้งที่การเดินเรือต่ำสุดตั้งแต่ พ.ค."}, d:{en:"A cargo ship was attacked overnight, killing one crew member, even while using the Oman-coordinated southern route. Kpler data show a five-day average of just 10 vessel crossings, the lowest since May, undercutting Trump's claim the strait is fully open.",th:"เรือบรรทุกสินค้าถูกโจมตีข้ามคืนจนมีลูกเรือเสียชีวิต 1 ราย ทั้งที่ใช้เส้นทางใต้ที่ประสานกับโอมานแล้ว ข้อมูล Kpler ชี้ว่าจำนวนเรือผ่านช่องแคบเฉลี่ย 5 วันเหลือเพียง 10 ลำ ต่ำสุดตั้งแต่ พ.ค. ซึ่งขัดแย้งกับคำกล่าวอ้างของทรัมป์ว่าช่องแคบเปิดเต็มรูปแบบ"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Kospi closes down 5.6% after 6.39% intraday plunge trips sidecar; Nikkei falls 2.57% as Asia tech rout deepens",th:"Kospi ปิดลบ 5.6% หลังร่วงระหว่างวัน 6.39% จนหยุดพักการซื้อขาย ขณะ Nikkei ปิดลบ 2.57% กลุ่มเทคเอเชียร่วงหนัก"}, d:{en:"Samsung Electronics fell 7.26% and SK Hynix 9.27% as Korea's chip-heavy Kospi plunged as much as 6.39% intraday, tripping a sell-side sidecar, before closing down 5.6% at 6,487.34. Japan's Nikkei 225 closed down 2.57% at 65,724.25, a second straight losing session, tracking a weak Wall Street close and Japan's 10-year JGB yield hitting its highest level since 1996.",th:"Samsung Electronics ลดลง 7.26% และ SK Hynix ร่วง 9.27% ขณะดัชนี Kospi ที่มีสัดส่วนหุ้นชิปสูงร่วงระหว่างวันถึง 6.39% จนต้องหยุดพักการซื้อขายชั่วคราวแบบ sell-side sidecar ก่อนปิดลบ 5.6% ที่ 6,487.34 ดัชนี Nikkei 225 ญี่ปุ่นปิดลบ 2.57% ที่ 65,724.25 ปรับลงเป็นวันที่สองติดต่อกัน สอดคล้องกับการปิดตลาดสหรัฐฯ ที่อ่อนแอ และผลตอบแทนพันธบัตรรัฐบาลญี่ปุ่นอายุ 10 ปีที่ทำสถิติสูงสุดนับตั้งแต่ปี 1996"}},

    {code:"UUSTECH", name:{en:"United US Technology Fund",th:"United US Technology Fund"}, rk:{en:"US tech · high risk",th:"หุ้นเทคสหรัฐ · เสี่ยงสูง"}, desc:{en:"US technology & semiconductor leaders — the AI / chip growth theme, bought in baht.",th:"ผู้นำเทคโนโลยีและเซมิคอนดักเตอร์สหรัฐ — ธีมการเติบโต AI / ชิป ซื้อได้ด้วยเงินบาท"}, now:{en:"Asia's chip stocks fell hard again Wednesday \u2014 Korea's Kospi plunged as much as 6.39% intraday and tripped a sidecar before closing down 5.6%, with Samsung ( \u22127.26%) and SK Hynix ( \u22129.27%) leading declines, while Japan's Nikkei closed down 2.57% for a second straight session \u2014 tracking Tuesday's weak Nasdaq close ( \u22121.29%) and echoing AI-capex jitters from Micron and Western Digital, not a change in the underlying AI story. Home Depot's earnings beat, Nvidia's up-to-$105bn OpenAI data-center financing, and Trump's pause on Canada tariffs all show the broader growth backdrop and risk appetite are intact; frame this deeper pullback as a more attractive entry point, while flagging that volatility may stay elevated a few more sessions.",th:"หุ้นชิปเอเชียร่วงหนักอีกครั้งวันพุธ — Kospi เกาหลีใต้ร่วงระหว่างวันถึง 6.39% จนต้องหยุดพักการซื้อขาย ก่อนปิดลบ 5.6% โดย Samsung (−7.26%) และ SK Hynix (−9.27%) นำการปรับลง ขณะ Nikkei ญี่ปุ่นปิดลบ 2.57% เป็นวันที่สองติดต่อกัน สอดคล้องกับการปิดตลาด Nasdaq ที่อ่อนแอวันอังคาร (−1.29%) และสะท้อนความกังวลเรื่องการลงทุน AI ที่ฉุด Micron และ Western Digital ไม่ใช่การเปลี่ยนแปลงของเรื่องราว AI ผลประกอบการที่ดีกว่าคาดของ Home Depot ข้อตกลงของ Nvidia ที่จะให้เงินทุนสูงสุด $105,000 ล้านดอลลาร์แก่ศูนย์ข้อมูล OpenAI และการที่ทรัมป์พักภาษีแคนาดา ล้วนแสดงว่าแนวโน้มการเติบโตและความเชื่อมั่นความเสี่ยงโดยรวมยังแข็งแรง ควรนำเสนอการย่อตัวที่ลึกขึ้นครั้งนี้เป็นจังหวะเข้าซื้อที่น่าสนใจยิ่งขึ้น พร้อมเตือนว่าความผันผวนอาจสูงต่อเนื่องอีกสองสามวัน"}, hold:["US tech","Semis","AI"]},
