<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Wall Street Closes Out a Volatile Week Higher as Tech Optimism Offsets Multi-Decade-High Yields — Oil Slides on US-Iran Truce Hopes While China Shuts for Mid-Autumn Festival", th:"วอลล์สตรีทปิดสัปดาห์ผันผวนด้วยแดนบวก จากความหวังหุ้นเทคหักล้างผลตอบแทนพันธบัตรที่สูงสุดในรอบหลายทศวรรษ — น้ำมันร่วงรับความหวังสงบศึกสหรัฐฯ-อิหร่าน ขณะจีนปิดตลาดฉลองเทศกาลไหว้พระจันทร์"},
    heroDeck:{en:`Wall Street closed out a volatile week on a strong note Friday, with fresh optimism around tech stocks lifting the major averages even as long-dated Treasury yields stayed near multi-decade highs: the Dow Jones Industrial Average jumped 478.64 points (+0.93%) to 51,828.62, the S&P 500 gained 0.51% to 7,743.41, and the Nasdaq Composite added 0.48% to 27,068.72. The bond market took a breather after two brutal sessions — the 10-year Treasury yield was little changed at 5.163% to end the week, while the 30-year briefly topped 5.5% again before settling at 5.488%, just shy of Thursday's 22-year high, and the 2-year held near 4.90%. Oil fell as reports that Washington and Tehran are edging toward a truce over the Strait of Hormuz offset lingering concerns about Saudi supply, even after Iran's Supreme National Security Council gave the US a four-to-five-day ultimatum to accept its ceasefire terms: Brent dropped 1.90% to $104.37/bbl and WTI fell 2.33% to $92.55/bbl, while gold edged up 0.78% to $4,284.20/oz even as it capped a losing week overall. With the September 29 pharmaceutical-tariff deadline now just four days away, markets got no fresh signal from Washington on an extension. In Asia, Tokyo's Nikkei 225 surged 1.30% to a record 66,364.20 on continued chip and tech buying, while Hong Kong's Hang Seng fell about 1.3% to 24,510.09; mainland Chinese markets were shut for the Mid-Autumn Festival holiday and will stay closed through the weekend, reopening Monday. Germany's DAX added roughly 0.56% to close near 25,409 as European shares tracked Wall Street's calmer tone. Thailand's SET Index edged up 0.32% (+5.05 pts) to 1,607.63 on turnover of THB 57.36bn, supported by buying in DELTA during capped-weight index rebalancing, even as elevated bond yields and oil prices capped the upside.`, th:`วอลล์สตรีทปิดสัปดาห์ที่ผันผวนด้วยแดนบวกวันศุกร์ จากความหวังหุ้นกลุ่มเทคที่ฟื้นตัวขึ้น ช่วยหนุนดัชนีหลักแม้ผลตอบแทนพันธบัตรระยะยาวจะยังคงยืนใกล้จุดสูงสุดในรอบหลายทศวรรษ โดยดัชนี Dow Jones พุ่งขึ้น 478.64 จุด (+0.93%) สู่ 51,828.62 ดัชนี S&P 500 เพิ่มขึ้น 0.51% สู่ 7,743.41 และดัชนี Nasdaq Composite เพิ่มขึ้น 0.48% สู่ 27,068.72 ตลาดพันธบัตรได้พักหายใจหลังทรุดหนักติดต่อกันสองเซสชัน — ผลตอบแทนพันธบัตรอายุ 10 ปีแทบไม่เปลี่ยนแปลง ปิดสัปดาห์ที่ 5.163% ขณะพันธบัตรอายุ 30 ปีแตะเหนือ 5.5% อีกครั้งระหว่างวัน ก่อนปิดที่ 5.488% ยังต่ำกว่าจุดสูงสุดในรอบ 22 ปีเมื่อวันพฤหัสบดีเพียงเล็กน้อย และพันธบัตรอายุ 2 ปียืนใกล้ 4.90% ราคาน้ำมันปรับลง หลังมีรายงานว่าวอชิงตันและเตหะรานกำลังเข้าใกล้ข้อตกลงสงบศึกเรื่องช่องแคบฮอร์มุซ หักล้างความกังวลเรื่องอุปทานจากซาอุดีอาระเบียที่ยังคงอยู่ แม้สภาความมั่นคงแห่งชาติสูงสุดของอิหร่านจะยื่นคำขาดสี่ถึงห้าวันให้สหรัฐฯ ยอมรับเงื่อนไขสงบศึกของตน — เบรนท์ลดลง 1.90% สู่ $104.37 ต่อบาร์เรล และ WTI ลดลง 2.33% สู่ $92.55 ต่อบาร์เรล ขณะทองคำขยับขึ้น 0.78% สู่ $4,284.20 ต่อออนซ์ แม้จะปิดสัปดาห์ในแดนลบโดยรวม เมื่อกำหนดเส้นตายภาษียาที่มีสิทธิบัตรวันที่ 29 กันยายนเหลืออีกเพียงสี่วัน ตลาดยังไม่ได้รับสัญญาณใหม่จากวอชิงตันเรื่องการต่ออายุ ในฝั่งเอเชีย ดัชนี Nikkei 225 โตเกียวพุ่งขึ้น 1.30% สู่ระดับสูงสุดเป็นประวัติการณ์ที่ 66,364.20 จากแรงซื้อหุ้นกลุ่มชิปและเทคต่อเนื่อง ขณะ Hang Seng ฮ่องกงลดลงราว 1.3% สู่ 24,510.09 ส่วนตลาดจีนแผ่นดินใหญ่ปิดทำการเนื่องในเทศกาลไหว้พระจันทร์ และจะปิดต่อเนื่องตลอดสุดสัปดาห์ก่อนเปิดทำการอีกครั้งวันจันทร์ ดัชนี DAX เยอรมนีเพิ่มขึ้นราว 0.56% ปิดใกล้ 25,409 ตามบรรยากาศที่สงบลงของวอลล์สตรีท ดัชนี SET ไทยขยับขึ้น 0.32% (+5.05 จุด) สู่ 1,607.63 มูลค่าการซื้อขายราว 5.736 หมื่นล้านบาท ได้แรงหนุนจากแรงซื้อหุ้น DELTA ระหว่างการปรับสัดส่วนดัชนีแบบจำกัดน้ำหนัก แม้ผลตอบแทนพันธบัตรและราคาน้ำมันที่สูงจะจำกัดการปรับขึ้น`},

    dbNext:{en:"Next update", th:"อัปเดตถัดไป"}, dbNextVal:{en:"Markets are closed for the weekend. Next up is Monday's Asia and Europe session, with Shanghai and Shenzhen reopening after their Mid-Autumn Festival holiday — watch whether Iran's four-to-five-day Hormuz ultimatum (due around Sep 28-29) produces a signed deal or a breakdown, and whether the Sep 29 pharma-tariff deadline brings a last-minute signal from Washington", th:"ตลาดปิดทำการช่วงสุดสัปดาห์ ก้าวต่อไปคือเซสชันเอเชียและยุโรปวันจันทร์ โดยตลาดเซี่ยงไฮ้และเซินเจิ้นจะเปิดทำการอีกครั้งหลังวันหยุดเทศกาลไหว้พระจันทร์ — ควรจับตาว่าคำขาดสี่ถึงห้าวันของอิหร่านเรื่องฮอร์มุซ (ครบกำหนดราววันที่ 28-29 ก.ย.) จะนำไปสู่ข้อตกลงที่ลงนามจริงหรือความล้มเหลว และกำหนดเส้นตายภาษียาวันที่ 29 ก.ย. จะมีสัญญาณนาทีสุดท้ายจากวอชิงตันหรือไม่"},

    leadtxt:{en:`<b>Wall Street closed out a volatile week higher Friday: the Dow jumped 0.93% (+478.64 pts) to 51,828.62, the S&P 500 gained 0.51% to 7,743.41 and the Nasdaq added 0.48% to 27,068.72, as fresh tech optimism offset a bond market that stayed near multi-decade highs.</b> The 10-year Treasury yield was little changed at 5.163% to end the week, while the 30-year eased to 5.488% after briefly topping 5.5% again, and the 2-year held near 4.90%. Oil fell (Brent -1.90% to $104.37, WTI -2.33% to $92.55) on reports Washington and Tehran are edging toward a Hormuz truce, even as Iran gave the US a four-to-five-day ultimatum to accept its terms; gold ticked up 0.78% to $4,284.20. Tokyo's Nikkei surged 1.30% to a record 66,364.20, Hong Kong's Hang Seng fell about 1.3% to 24,510.09, mainland China was shut for the Mid-Autumn Festival, Germany's DAX rose roughly 0.56% to near 25,409, and Thailand's SET edged up 0.32% to 1,607.63 on DELTA-led rebalancing flows. For your clients: <b>this week's real story is that a curve-wide rates rout (19-year high on the 10-year, then a 22-year high on the 30-year) has so far failed to derail equities, which are choosing to trade the "tech optimism plus eventual de-escalation" narrative over the "higher for longer" one — a divergence worth watching closely if the Sep 29 tariff deadline or the Hormuz talks break the wrong way.</b>`, th:`<b>วอลล์สตรีทปิดสัปดาห์ที่ผันผวนด้วยแดนบวกวันศุกร์ — ดัชนี Dow พุ่งขึ้น 0.93% (+478.64 จุด) สู่ 51,828.62 ดัชนี S&P 500 เพิ่มขึ้น 0.51% สู่ 7,743.41 และดัชนี Nasdaq เพิ่มขึ้น 0.48% สู่ 27,068.72 จากความหวังหุ้นกลุ่มเทคที่ฟื้นตัว หักล้างตลาดพันธบัตรที่ยังคงยืนใกล้จุดสูงสุดในรอบหลายทศวรรษ</b> ผลตอบแทนพันธบัตรอายุ 10 ปีแทบไม่เปลี่ยนแปลง ปิดสัปดาห์ที่ 5.163% ขณะพันธบัตรอายุ 30 ปีย่อตัวสู่ 5.488% หลังแตะเหนือ 5.5% อีกครั้งระหว่างวัน และพันธบัตรอายุ 2 ปียืนใกล้ 4.90% ราคาน้ำมันลดลง (เบรนท์ -1.90% สู่ $104.37, WTI -2.33% สู่ $92.55) จากรายงานว่าวอชิงตันและเตหะรานกำลังเข้าใกล้ข้อตกลงสงบศึกฮอร์มุซ แม้อิหร่านจะยื่นคำขาดสี่ถึงห้าวันให้สหรัฐฯ ยอมรับเงื่อนไข ขณะทองคำขยับขึ้น 0.78% สู่ $4,284.20 ดัชนี Nikkei โตเกียวพุ่งขึ้น 1.30% สู่ระดับสูงสุดเป็นประวัติการณ์ที่ 66,364.20 ดัชนี Hang Seng ฮ่องกงลดลงราว 1.3% สู่ 24,510.09 ตลาดจีนแผ่นดินใหญ่ปิดทำการเนื่องในเทศกาลไหว้พระจันทร์ ดัชนี DAX เยอรมนีเพิ่มขึ้นราว 0.56% สู่ใกล้ 25,409 และดัชนี SET ไทยขยับขึ้น 0.32% สู่ 1,607.63 จากแรงซื้อหุ้น DELTA ระหว่างการปรับสัดส่วนดัชนี สำหรับลูกค้าของคุณ: <b>เรื่องราวที่แท้จริงของสัปดาห์นี้คือ ตลาดพันธบัตรที่ทรุดตัวทั่วทั้งเส้นอัตราผลตอบแทน (จากจุดสูงสุดในรอบ 19 ปีของพันธบัตร 10 ปี สู่จุดสูงสุดในรอบ 22 ปีของพันธบัตร 30 ปี) ยังไม่สามารถฉุดหุ้นลงได้ ขณะตลาดเลือกเทรดตามเรื่องราว "ความหวังหุ้นเทคบวกการคลี่คลายความตึงเครียดในที่สุด" มากกว่าเรื่องราว "ดอกเบี้ยสูงนานขึ้น" — ความแตกต่างนี้ควรจับตาอย่างใกล้ชิด หากกำหนดเส้นตายภาษีวันที่ 29 ก.ย. หรือการเจรจาฮอร์มุซพลิกไปในทิศทางที่ไม่ดี</b>`},

    watchnote:{en:`US stocks closed out a volatile week higher Friday — the Dow jumped 0.93%, the S&P 500 gained 0.51% and the Nasdaq added 0.48% — as tech optimism offset a bond market still near multi-decade highs; the 10-year yield ended the week little changed at 5.163% while the 30-year eased to 5.488%. Oil fell on reports of progress toward a US-Iran Hormuz truce, gold ticked higher, and Tokyo's Nikkei hit a fresh record while mainland China shut for the Mid-Autumn Festival. Germany's DAX firmed and Thailand's SET edged up on DELTA-led rebalancing flows. <b style="color:var(--muted)">Markets are closed for the weekend</b> — next up is Monday's Asia and Europe open, with Shanghai and Shenzhen reopening after the holiday; watch whether Iran's four-to-five-day Hormuz ultimatum (due around Sep 28-29) produces a deal or a breakdown, and whether the Sep 29 pharma-tariff deadline brings a last-minute signal from Washington.`,
      th:`หุ้นสหรัฐฯ ปิดสัปดาห์ที่ผันผวนด้วยแดนบวกวันศุกร์ — ดัชนี Dow พุ่งขึ้น 0.93% ดัชนี S&P 500 เพิ่มขึ้น 0.51% และดัชนี Nasdaq เพิ่มขึ้น 0.48% — จากความหวังหุ้นกลุ่มเทค หักล้างตลาดพันธบัตรที่ยังคงยืนใกล้จุดสูงสุดในรอบหลายทศวรรษ ผลตอบแทนพันธบัตรอายุ 10 ปีปิดสัปดาห์แทบไม่เปลี่ยนแปลงที่ 5.163% ขณะพันธบัตรอายุ 30 ปีย่อตัวสู่ 5.488% ราคาน้ำมันลดลงจากรายงานความคืบหน้าสู่ข้อตกลงสงบศึกฮอร์มุซระหว่างสหรัฐฯ และอิหร่าน ทองคำขยับขึ้นเล็กน้อย และดัชนี Nikkei โตเกียวทำสถิติสูงสุดใหม่ ขณะจีนแผ่นดินใหญ่ปิดทำการเนื่องในเทศกาลไหว้พระจันทร์ ดัชนี DAX เยอรมนีแข็งค่าขึ้น และดัชนี SET ไทยขยับขึ้นจากแรงซื้อหุ้น DELTA ระหว่างการปรับสัดส่วนดัชนี <b style="color:var(--muted)">ตลาดปิดทำการช่วงสุดสัปดาห์</b> — ก้าวต่อไปคือการเปิดตลาดเอเชียและยุโรปวันจันทร์ โดยตลาดเซี่ยงไฮ้และเซินเจิ้นจะเปิดทำการอีกครั้งหลังวันหยุด ควรจับตาว่าคำขาดสี่ถึงห้าวันของอิหร่านเรื่องฮอร์มุซ (ครบกำหนดราววันที่ 28-29 ก.ย.) จะนำไปสู่ข้อตกลงหรือความล้มเหลว และกำหนดเส้นตายภาษียาวันที่ 29 ก.ย. จะมีสัญญาณนาทีสุดท้ายจากวอชิงตันหรือไม่`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป ญี่ปุ่น ฮ่องกง และไทย วันศุกร์ที่ 25 ก.ย. (ตลาดจีนแผ่นดินใหญ่/เซี่ยงไฮ้และเซินเจิ้นปิดทำการตลอดสุดสัปดาห์เนื่องในเทศกาลไหว้พระจันทร์ และจะเปิดทำการอีกครั้งวันจันทร์) ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,743.41", chg:0.51, series:[7704.13,7743.41],
      txt:{en:`<b>US stocks closed out a volatile week higher Friday: the S&P 500 gained 0.51% to 7,743.41, the Nasdaq Composite added 0.48% to 27,068.72, and the Dow jumped 0.93% (+478.64 pts) to 51,828.62.</b> Fresh tech optimism drove the gains even as the 10-year Treasury yield ended the week little changed at 5.163% and the 30-year held near its 2004 high.`, th:`<b>หุ้นสหรัฐฯ ปิดสัปดาห์ที่ผันผวนด้วยแดนบวกวันศุกร์: ดัชนี S&P 500 เพิ่มขึ้น 0.51% สู่ 7,743.41 ดัชนี Nasdaq Composite เพิ่มขึ้น 0.48% สู่ 27,068.72 และดัชนี Dow พุ่งขึ้น 0.93% (+478.64 จุด) สู่ 51,828.62</b> ความหวังหุ้นกลุ่มเทคที่ฟื้นตัวขึ้นหนุนการปรับขึ้น แม้ผลตอบแทนพันธบัตรอายุ 10 ปีจะปิดสัปดาห์แทบไม่เปลี่ยนแปลงที่ 5.163% และพันธบัตรอายุ 30 ปียังคงยืนใกล้จุดสูงสุดตั้งแต่ปี 2004`},
      why:{en:`Friday's broad-based rally shows equities are choosing to trade the "tech optimism plus eventual de-escalation" narrative rather than the "higher for longer" rates story, even though the bond market has not actually reversed — the 10-year merely stopped rising rather than falling. That distinction matters: a genuine rates relief rally would need yields to fall meaningfully, not just plateau, so this looks more like a pause in the rout than its resolution.`, th:`การดีดตัวขึ้นในวงกว้างวันศุกร์แสดงว่าตลาดหุ้นเลือกเทรดตามเรื่องราว "ความหวังหุ้นเทคบวกการคลี่คลายความตึงเครียดในที่สุด" มากกว่าเรื่องราว "ดอกเบี้ยสูงนานขึ้น" แม้ตลาดพันธบัตรจะยังไม่ได้กลับทิศทางจริง — พันธบัตรอายุ 10 ปีเพียงแค่หยุดปรับขึ้น ไม่ใช่ปรับลง ความแตกต่างนี้สำคัญ เพราะการดีดตัวจากการคลายตัวของดอกเบี้ยที่แท้จริงต้องการให้ผลตอบแทนลดลงอย่างมีนัยสำคัญ ไม่ใช่แค่ทรงตัว จึงดูเหมือนเป็นการหยุดพักของตลาดพันธบัตรที่ทรุดตัว มากกว่าจะเป็นการคลี่คลายจริง`},
      full:{en:`US stocks closed out a volatile week on a high note Friday, extending Thursday's stabilization into a broad-based rally. The S&P 500 gained 0.51% to 7,743.41, the Nasdaq Composite added 0.48% to 27,068.72, and the Dow Jones Industrial Average jumped 478.64 points (+0.93%) to 51,828.62, as fresh optimism around tech stocks lifted sentiment across the market. The bond market took a breather after two brutal sessions: the 10-year Treasury yield was little changed at 5.163% to end the week, while the 30-year briefly topped 5.5% again before settling at 5.488%, just shy of Thursday's 22-year high. The calmer tone came even as Iran's Supreme National Security Council gave Washington a four-to-five-day ultimatum to accept its terms for reopening the Strait of Hormuz, underscoring that the geopolitical risk has not actually resolved — markets are simply choosing, for now, to look past it.`, th:`หุ้นสหรัฐฯ ปิดสัปดาห์ที่ผันผวนด้วยระดับสูงวันศุกร์ ต่อยอดจากการทรงตัวเมื่อวันพฤหัสบดีสู่การดีดตัวขึ้นในวงกว้าง ดัชนี S&P 500 เพิ่มขึ้น 0.51% สู่ 7,743.41 ดัชนี Nasdaq Composite เพิ่มขึ้น 0.48% สู่ 27,068.72 และดัชนี Dow Jones พุ่งขึ้น 478.64 จุด (+0.93%) สู่ 51,828.62 จากความหวังหุ้นกลุ่มเทคที่ฟื้นตัวขึ้นหนุนบรรยากาศทั่วตลาด ตลาดพันธบัตรได้พักหายใจหลังทรุดหนักติดต่อกันสองเซสชัน — ผลตอบแทนพันธบัตรอายุ 10 ปีแทบไม่เปลี่ยนแปลง ปิดสัปดาห์ที่ 5.163% ขณะพันธบัตรอายุ 30 ปีแตะเหนือ 5.5% อีกครั้งระหว่างวัน ก่อนปิดที่ 5.488% ยังต่ำกว่าจุดสูงสุดในรอบ 22 ปีเมื่อวันพฤหัสบดีเพียงเล็กน้อย บรรยากาศที่สงบลงนี้เกิดขึ้นแม้สภาความมั่นคงแห่งชาติสูงสุดของอิหร่านจะยื่นคำขาดสี่ถึงห้าวันให้วอชิงตันยอมรับเงื่อนไขการเปิดช่องแคบฮอร์มุซอีกครั้ง ตอกย้ำว่าความเสี่ยงทางภูมิรัฐศาสตร์ยังไม่คลี่คลายจริง ตลาดเพียงเลือกที่จะมองข้ามไปก่อนในตอนนี้`},
      sources:[{l:"Yahoo Finance — Dow, S&P 500, Nasdaq notch weekly wins as market shrugs off bond sell-off, oil prices ease",u:"https://finance.yahoo.com/markets/live/stock-market-today-friday-september-25-dow-sp-500-nasdaq-081738529.html"},{l:"CNBC — 10-year Treasury yield is little changed to end a volatile week",u:"https://www.cnbc.com/2026/09/25/treasury-yields-bonds-debt.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,409.00", chg:0.56, series:[25266.00,25409.00],
      txt:{en:`<b>Germany's DAX rose roughly 0.56% (+142 pts) to close near 25,409 Friday,</b> recovering part of Thursday's loss as European shares tracked Wall Street's calmer tone and the softer tone in oil eased cost pressure on autos.`, th:`<b>ดัชนี DAX เยอรมนีเพิ่มขึ้นราว 0.56% (+142 จุด) ปิดใกล้ 25,409 วันศุกร์</b> ฟื้นตัวบางส่วนจากการปรับลงเมื่อวันพฤหัสบดี ตามบรรยากาศที่สงบลงของวอลล์สตรีท และราคาน้ำมันที่อ่อนตัวลงช่วยลดแรงกดดันต้นทุนต่อกลุ่มยานยนต์`},
      why:{en:`The DAX's bounce, coming as oil eased and Wall Street rallied on tech optimism, suggests European sentiment is still largely a read-through from the US rather than an independent story — insurers and autos that led Thursday's decline got some relief as the same pressures (yields, oil) reversed slightly. Worth watching whether this holds once Shanghai and Shenzhen reopen Monday and add fresh Asian demand signals to the mix.`, th:`การดีดตัวขึ้นของ DAX ขณะน้ำมันอ่อนตัวลงและวอลล์สตรีทดีดตัวจากความหวังหุ้นเทค บ่งชี้ว่าบรรยากาศตลาดยุโรปยังคงเป็นการสะท้อนตามสหรัฐฯ เป็นหลัก มากกว่าเรื่องราวที่เป็นอิสระ — หุ้นกลุ่มประกันภัยและยานยนต์ที่นำการปรับลงเมื่อวันพฤหัสบดีได้รับแรงหนุนบางส่วน เมื่อปัจจัยกดดันเดียวกัน (ผลตอบแทนพันธบัตร น้ำมัน) ผ่อนคลายลงเล็กน้อย ควรจับตาว่าจะดำเนินต่อหรือไม่ เมื่อตลาดเซี่ยงไฮ้และเซินเจิ้นเปิดทำการอีกครั้งวันจันทร์และเพิ่มสัญญาณอุปสงค์จากเอเชีย`},
      full:{en:`European shares firmed Friday, with Germany's DAX adding roughly 0.56% (+142 points) to close near 25,409, up from Thursday's 25,266.00. The gain came as European government bond yields tracked the pause in the US Treasury-market rout and oil prices eased on reports of progress toward a US-Iran truce over the Strait of Hormuz, taking some pressure off autos and insurers, the sectors that had led Thursday's decline. The advance mirrored a broader rally on Wall Street, where fresh tech optimism lifted the S&P 500, Nasdaq and Dow to weekly gains despite long-dated Treasury yields staying near multi-decade highs.`, th:`หุ้นยุโรปแข็งค่าขึ้นวันศุกร์ โดยดัชนี DAX เยอรมนีเพิ่มขึ้นราว 0.56% (+142 จุด) ปิดใกล้ 25,409 เพิ่มขึ้นจาก 25,266.00 เมื่อวันพฤหัสบดี การปรับขึ้นเกิดขึ้นขณะผลตอบแทนพันธบัตรรัฐบาลยุโรปตามการหยุดพักของตลาดพันธบัตรสหรัฐฯ ที่ทรุดตัว และราคาน้ำมันอ่อนตัวลงจากรายงานความคืบหน้าสู่ข้อตกลงสงบศึกสหรัฐฯ-อิหร่านเรื่องช่องแคบฮอร์มุซ ช่วยลดแรงกดดันต่อกลุ่มยานยนต์และประกันภัย ซึ่งเป็นกลุ่มที่นำการปรับลงเมื่อวันพฤหัสบดี การปรับขึ้นครั้งนี้สอดคล้องกับการดีดตัวขึ้นในวงกว้างของวอลล์สตรีท ซึ่งความหวังหุ้นกลุ่มเทคที่ฟื้นตัวขึ้นหนุนดัชนี S&P 500, Nasdaq และ Dow ให้ปิดสัปดาห์ในแดนบวก แม้ผลตอบแทนพันธบัตรระยะยาวจะยังคงยืนใกล้จุดสูงสุดในรอบหลายทศวรรษ`},
      sources:[{l:"24/7 Wall St. — FTSE 100 closes up 0.24% while the DAX triples its gain",u:"https://247wallst.com/cards/germany-did-the-heavy-lifting-again-the-dax-added-0-75-to-ftse-market-bell-01m3ck5sw78kjd3s0emygcgx8j"},{l:"Trading Economics — Germany",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"66,364.20", chg:1.30, series:[65513.94,66364.20],
      txt:{en:`<b>Tokyo's Nikkei 225 surged 1.30% to a record close of 66,364.20 Friday,</b> extending its post-Silver-Week rebound as chip and tech names kept rallying into the weekend.`, th:`<b>ดัชนี Nikkei 225 โตเกียวพุ่งขึ้น 1.30% ปิดสูงสุดเป็นประวัติการณ์ที่ 66,364.20 วันศุกร์</b> ต่อยอดการฟื้นตัวหลังวันหยุด Silver Week โดยหุ้นกลุ่มชิปและเทคโนโลยียังคงปรับขึ้นต่อเนื่องก่อนเข้าสู่วันหยุดสุดสัปดาห์`},
      why:{en:`Back-to-back record-approaching gains for the Nikkei, even as Hong Kong slipped and mainland China shut for the holiday, show Japanese tech and chip names are currently the strongest single-country story in Asia — a useful signal for clients rotating regional equity exposure. The scale of the move (on top of Thursday's reopening pop) also raises the question of how much is genuine catch-up demand versus one-off flows now that the market has closed the Silver Week gap.`, th:`การที่ Nikkei ปรับขึ้นต่อเนื่องใกล้ระดับสูงสุดเป็นประวัติการณ์ ขณะฮ่องกงปรับลงและจีนแผ่นดินใหญ่ปิดทำการวันหยุด แสดงว่าหุ้นกลุ่มเทคและชิปของญี่ปุ่นเป็นเรื่องราวรายประเทศที่แข็งแกร่งที่สุดในเอเชียขณะนี้ — สัญญาณที่มีประโยชน์สำหรับลูกค้าที่ปรับสัดส่วนหุ้นภูมิภาค ขนาดของการปรับขึ้นครั้งนี้ (ต่อจากการดีดตัวเมื่อเปิดทำการอีกครั้งวันพฤหัสบดี) ยังตั้งคำถามว่าเป็นแรงซื้อไล่ตามที่แท้จริงเพียงใด เทียบกับกระแสเงินทุนชั่วคราว เมื่อตลาดปิดช่องว่างจาก Silver Week ไปแล้ว`},
      full:{en:`Japanese stocks extended their rebound Friday, with the Nikkei 225 jumping 1.30% (+850.21 pts) to a fresh record close of 66,364.20, up from Thursday's post-reopening 65,513.94. Chip and technology names continued to lead the advance for a second straight session, as investor sentiment in Tokyo stayed decoupled from the mixed mood elsewhere in Asia, where Hong Kong's Hang Seng retreated and mainland Chinese exchanges closed for the Mid-Autumn Festival holiday. The gains also came alongside a broader risk-on tone on Wall Street, where fresh tech optimism lifted US indices to weekly gains.`, th:`หุ้นญี่ปุ่นขยายการฟื้นตัวต่อเนื่องวันศุกร์ โดยดัชนี Nikkei 225 พุ่งขึ้น 1.30% (+850.21 จุด) ปิดสูงสุดเป็นประวัติการณ์ครั้งใหม่ที่ 66,364.20 เพิ่มขึ้นจาก 65,513.94 เมื่อวันพฤหัสบดีหลังเปิดทำการอีกครั้ง หุ้นกลุ่มชิปและเทคโนโลยียังคงนำการปรับขึ้นต่อเนื่องเป็นเซสชันที่สอง ขณะบรรยากาศการลงทุนในโตเกียวยังคงแยกออกจากบรรยากาศคละกันในส่วนอื่นของเอเชีย ซึ่ง Hang Seng ฮ่องกงปรับลง และตลาดหลักทรัพย์จีนแผ่นดินใหญ่ปิดทำการเนื่องในเทศกาลไหว้พระจันทร์ การปรับขึ้นครั้งนี้ยังสอดคล้องกับบรรยากาศเปิดรับความเสี่ยงในวงกว้างของวอลล์สตรีท ซึ่งความหวังหุ้นกลุ่มเทคที่ฟื้นตัวขึ้นหนุนดัชนีสหรัฐฯ ให้ปิดสัปดาห์ในแดนบวก`},
      sources:[{l:"Yahoo Finance — Stock Market News for Sep 25, 2026",u:"https://sg.finance.yahoo.com/news/stock-market-news-sep-25-122000223.html"},{l:"Armenpress — Asian Stocks down",u:"https://armenpress.am/en/article/1261344"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,510.09", chg:-1.27, series:[24824.87,24510.09],
      txt:{en:`<b>Hong Kong's Hang Seng fell about 1.3% (-314.78 pts) to 24,510.09 Friday, while mainland Chinese exchanges stayed shut for the Mid-Autumn Festival holiday,</b> as Hong Kong traded alone against a backdrop of still-elevated global bond yields.`, th:`<b>Hang Seng ฮ่องกงลดลงราว 1.3% (-314.78 จุด) สู่ 24,510.09 วันศุกร์ ขณะตลาดหลักทรัพย์จีนแผ่นดินใหญ่ยังคงปิดทำการเนื่องในเทศกาลไหว้พระจันทร์</b> ทำให้ฮ่องกงเทรดตามลำพัง ท่ามกลางผลตอบแทนพันธบัตรโลกที่ยังคงยืนสูง`},
      why:{en:`With Shanghai and Shenzhen closed for the long Mid-Autumn Festival weekend, Hong Kong's pullback stands out against the rally in Tokyo and Wall Street's tech-led gains, suggesting local factors (or profit-taking after recent strength) rather than a broad Asia risk-off move. Worth watching whether mainland demand, absent this week, returns supportive when trading resumes Monday.`, th:`เมื่อตลาดเซี่ยงไฮ้และเซินเจิ้นปิดทำการยาวเนื่องในเทศกาลไหว้พระจันทร์ การปรับลงของฮ่องกงจึงโดดเด่นสวนทางกับการดีดตัวของโตเกียวและการปรับขึ้นของวอลล์สตรีทที่นำโดยหุ้นเทค บ่งชี้ว่าน่าจะเป็นปัจจัยเฉพาะพื้นที่ (หรือการขายทำกำไรหลังปรับขึ้นมาก่อนหน้า) มากกว่าการปิดรับความเสี่ยงทั่วเอเชีย ควรจับตาว่าแรงซื้อจากจีนแผ่นดินใหญ่ที่หายไปสัปดาห์นี้จะกลับมาช่วยหนุนตลาดเมื่อเปิดทำการอีกครั้งวันจันทร์หรือไม่`},
      full:{en:`Hong Kong's Hang Seng fell about 1.3% Friday, dropping 314.78 points to close at 24,510.09, down from Thursday's 24,824.87. The decline came with mainland Chinese markets — the Shanghai and Shenzhen exchanges — closed for the Mid-Autumn Festival holiday, which runs through the weekend with trading set to resume Monday. Hong Kong's retreat contrasted with a record-approaching rally in Tokyo and a broad tech-led advance on Wall Street, leaving the pullback looking more like a local or profit-taking move than a read-through from the rest of the region.`, th:`ดัชนี Hang Seng ฮ่องกงลดลงราว 1.3% วันศุกร์ ลดลง 314.78 จุด ปิดที่ 24,510.09 ลดลงจาก 24,824.87 เมื่อวันพฤหัสบดี การปรับลงเกิดขึ้นขณะตลาดหลักทรัพย์จีนแผ่นดินใหญ่ — ตลาดเซี่ยงไฮ้และเซินเจิ้น — ปิดทำการเนื่องในเทศกาลไหว้พระจันทร์ ซึ่งจะปิดต่อเนื่องตลอดสุดสัปดาห์ก่อนกลับมาเปิดทำการอีกครั้งวันจันทร์ การปรับลงของฮ่องกงสวนทางกับการดีดตัวใกล้ระดับสูงสุดเป็นประวัติการณ์ของโตเกียว และการปรับขึ้นในวงกว้างที่นำโดยหุ้นเทคของวอลล์สตรีท ทำให้การปรับลงครั้งนี้ดูเหมือนเป็นปัจจัยเฉพาะพื้นที่หรือการขายทำกำไร มากกว่าการสะท้อนตามภูมิภาคอื่น`},
      sources:[{l:"24/7 Wall St. — Hang Seng Closes Down 1.2% While Shanghai Barely Moves",u:"https://247wallst.com/cards/hong-kong-took-the-entire-hit-in-asia-today-shedding-1-17-hsi-market-bell-01m3bsenevqn9h82y3tqe2m67h"},{l:"InvestingLive — Heads up: China markets shut Friday for Mid-Autumn Festival",u:"https://investinglive.com/news/heads-up-china-markets-shut-friday-for-mid-autumn-festival-with-week-long-golden-week-break-ahead/"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,607.63", chg:0.32, series:[1602.58,1607.63],
      txt:{en:`<b>SET Index rose 0.32% to 1,607.63 Friday (+5.05 pts),</b> on turnover of about THB 57.36bn, recovering Thursday's loss as buying in DELTA during capped-weight index rebalancing offset lingering pressure from elevated bond yields and oil prices.`, th:`<b>ดัชนี SET เพิ่มขึ้น 0.32% สู่ 1,607.63 วันศุกร์ (+5.05 จุด)</b> มูลค่าการซื้อขายราว 5.736 หมื่นล้านบาท ฟื้นตัวจากการปรับลงเมื่อวันพฤหัสบดี โดยแรงซื้อหุ้น DELTA ระหว่างการปรับสัดส่วนดัชนีแบบจำกัดน้ำหนัก ช่วยหักล้างแรงกดดันที่ยังคงอยู่จากผลตอบแทนพันธบัตรและราคาน้ำมันที่สูง`},
      why:{en:`SET's rebound on the back of a single rebalancing-driven flow (DELTA) rather than a broad-based rally is worth flagging to clients as a technical, mechanical gain rather than a genuine improvement in sentiment — the same elevated yields and oil prices that pressured the market Thursday are still in place. Worth watching whether the index can hold these gains once that rebalancing flow fades.`, th:`การที่ SET ฟื้นตัวจากแรงซื้อเฉพาะจุดจากการปรับสัดส่วนดัชนี (DELTA) มากกว่าการดีดตัวขึ้นในวงกว้าง ควรแจ้งลูกค้าว่าเป็นการปรับขึ้นเชิงเทคนิคมากกว่าการฟื้นตัวของบรรยากาศการลงทุนที่แท้จริง — ผลตอบแทนพันธบัตรและราคาน้ำมันที่สูงซึ่งกดดันตลาดเมื่อวันพฤหัสบดียังคงอยู่เช่นเดิม ควรจับตาว่าดัชนีจะรักษาระดับนี้ได้หรือไม่เมื่อแรงซื้อจากการปรับสัดส่วนคลี่คลายลง`},
      full:{en:`Thailand's SET Index rose 0.32% (+5.05 points) to close at 1,607.63 Friday on turnover of about THB 57.36 billion, recovering part of Thursday's decline. The gain was supported by buying interest in DELTA during capped-weight index rebalancing, though overall upside remained limited by external pressure from elevated bond yields and oil prices. The move came as global sentiment improved on fresh US tech optimism, even as Thailand's own market drivers stayed largely technical and stock-specific rather than macro-led.`, th:`ดัชนี SET ของไทยเพิ่มขึ้น 0.32% (+5.05 จุด) ปิดที่ 1,607.63 วันศุกร์ มูลค่าการซื้อขายราว 5.736 หมื่นล้านบาท ฟื้นตัวบางส่วนจากการปรับลงเมื่อวันพฤหัสบดี การปรับขึ้นได้แรงหนุนจากแรงซื้อหุ้น DELTA ระหว่างการปรับสัดส่วนดัชนีแบบจำกัดน้ำหนัก แม้การปรับขึ้นโดยรวมจะยังจำกัดจากแรงกดดันภายนอกอย่างผลตอบแทนพันธบัตรและราคาน้ำมันที่สูง ความเคลื่อนไหวนี้เกิดขึ้นขณะบรรยากาศตลาดโลกดีขึ้นจากความหวังหุ้นเทคของสหรัฐฯ แม้ปัจจัยขับเคลื่อนตลาดไทยเองจะยังคงเป็นเชิงเทคนิคและเฉพาะหุ้นมากกว่าปัจจัยมหภาค`},
      sources:[{l:"Kaohoon International — Market Roundup 25 September 2026",u:"https://www.kaohooninternational.com/markets/591551"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil fell Friday — Brent -1.90% to $104.37/bbl, WTI -2.33% to $92.55/bbl — while gold edged up 0.78% to $4,284.20/oz,</b> as reports that Washington and Tehran are edging toward a truce over the Strait of Hormuz offset lingering concerns about Saudi supply, even after Iran gave the US a four-to-five-day ultimatum to accept its ceasefire terms.`, th:`<b>ราคาน้ำมันลดลงวันศุกร์ — เบรนท์ -1.90% สู่ $104.37 ต่อบาร์เรล, WTI -2.33% สู่ $92.55 ต่อบาร์เรล — ขณะทองคำขยับขึ้น 0.78% สู่ $4,284.20 ต่อออนซ์</b> หลังรายงานว่าวอชิงตันและเตหะรานกำลังเข้าใกล้ข้อตกลงสงบศึกเรื่องช่องแคบฮอร์มุซ หักล้างความกังวลเรื่องอุปทานจากซาอุดีอาระเบียที่ยังคงอยู่ แม้อิหร่านจะยื่นคำขาดสี่ถึงห้าวันให้สหรัฐฯ ยอมรับเงื่อนไขสงบศึก`},
     why:{en:`Oil reversing lower on the same truce headline that has been supporting stocks is worth explaining to clients: the market is now pricing a Hormuz resolution as more likely than not, even as Iran's own four-to-five-day ultimatum shows the two sides remain far apart on terms — a confirmed deal or a public breakdown around the September 28-29 deadline could move crude sharply in either direction. Gold's modest bounce, even as it caps a losing week, suggests the metal is stabilizing rather than reversing its recent slide.`, th:`การที่น้ำมันกลับมาปรับลงจากข่าวความคืบหน้าสู่ข้อตกลงสงบศึกเดียวกับที่หนุนหุ้น เป็นเรื่องที่ควรอธิบายให้ลูกค้าเข้าใจ — ตลาดกำลังตั้งราคาว่าการคลี่คลายเรื่องฮอร์มุซมีแนวโน้มเกิดขึ้นมากกว่าจะไม่เกิด แม้คำขาดสี่ถึงห้าวันของอิหร่านเองจะแสดงว่าทั้งสองฝ่ายยังคงมีระยะห่างมากในเรื่องเงื่อนไข ข้อตกลงที่ยืนยันแล้วหรือความล้มเหลวที่เปิดเผยต่อสาธารณะรอบกำหนดเส้นตายวันที่ 28-29 กันยายน อาจทำให้น้ำมันเคลื่อนไหวรุนแรงไปทางใดทางหนึ่ง การที่ทองคำดีดตัวขึ้นเล็กน้อย แม้จะปิดสัปดาห์ในแดนลบ บ่งชี้ว่าโลหะชนิดนี้กำลังทรงตัวมากกว่าจะกลับทิศทางจากการอ่อนตัวลงล่าสุด`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The bond market took a breather Friday: the 10-year Treasury yield was little changed at 5.163% to end a volatile week, while the 30-year eased to 5.488% after briefly topping 5.5% again, and the 2-year held near 4.90%.</b> Both yields had touched fresh multi-decade highs earlier in the week.`, th:`<b>ตลาดพันธบัตรได้พักหายใจวันศุกร์: ผลตอบแทนพันธบัตรอายุ 10 ปีแทบไม่เปลี่ยนแปลง ปิดสัปดาห์ที่ผันผวนที่ 5.163% ขณะพันธบัตรอายุ 30 ปีย่อตัวสู่ 5.488% หลังแตะเหนือ 5.5% อีกครั้งระหว่างวัน และพันธบัตรอายุ 2 ปียืนใกล้ 4.90%</b> ทั้งสองรุ่นเคยแตะจุดสูงสุดในรอบหลายทศวรรษครั้งใหม่ก่อนหน้านี้ในสัปดาห์`},
     why:{en:`A yield curve that stopped rising rather than falling tells clients this is a pause, not a reversal — the underlying "higher for longer" repricing from earlier in the week hasn't actually unwound. Equities rallying anyway on tech optimism means duration and rate-sensitive portfolios still face the same structural pressure once the current calm fades; the real test comes if next week's Hormuz deadline or fresh data reignites the move.`, th:`เส้นอัตราผลตอบแทนที่หยุดปรับขึ้น แต่ไม่ได้ปรับลง บอกลูกค้าว่านี่คือการหยุดพัก ไม่ใช่การกลับทิศทาง — การปรับราคา "ดอกเบี้ยสูงนานขึ้น" ที่เกิดขึ้นก่อนหน้านี้ในสัปดาห์ยังไม่ได้คลี่คลายจริง การที่หุ้นยังคงดีดตัวขึ้นจากความหวังหุ้นเทค หมายความว่าพอร์ตที่มี duration ยาวและอ่อนไหวต่อดอกเบี้ยยังคงเผชิญแรงกดดันเชิงโครงสร้างเดิม เมื่อบรรยากาศสงบในปัจจุบันจางหายไป บททดสอบที่แท้จริงจะมาถึงหากกำหนดเส้นตายฮอร์มุซสัปดาห์หน้าหรือข้อมูลใหม่จุดชนวนการเคลื่อนไหวอีกครั้ง`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`With the September 29 pharmaceutical-tariff deadline now just four days away, Washington gave markets no fresh signal Friday on an extension or carve-out, leaving Thursday's cordial but largely inconclusive Trump-Xi meeting as the last major data point on US-China trade direction.`, th:`เมื่อกำหนดเส้นตายภาษียาที่มีสิทธิบัตรวันที่ 29 กันยายนเหลืออีกเพียง 4 วัน วอชิงตันยังไม่มีสัญญาณใหม่วันศุกร์เรื่องการต่ออายุหรือข้อยกเว้น ทำให้การพบกันของทรัมป์-สีเมื่อวันพฤหัสบดีที่เป็นมิตรแต่ไม่มีข้อสรุปชัดเจน ยังคงเป็นข้อมูลสำคัญล่าสุดเกี่ยวกับทิศทางการค้าสหรัฐฯ-จีน`}, w:{en:`The lack of any weekend signal ahead of Tuesday's deadline raises the odds of a last-minute announcement — watch the first two trading days of next week closely. The unresolved Taiwan and broader-trade questions from Thursday's summit, plus the Busan truce's November expiry, remain open risks markets have not yet had to price.`, th:`การไม่มีสัญญาณใด ๆ ในช่วงสุดสัปดาห์ก่อนกำหนดเส้นตายวันอังคาร เพิ่มโอกาสที่จะมีการประกาศในนาทีสุดท้าย — ควรจับตาสองวันซื้อขายแรกของสัปดาห์หน้าอย่างใกล้ชิด ประเด็นไต้หวันและการค้าในวงกว้างที่ยังไม่คลี่คลายจากการประชุมสุดยอดวันพฤหัสบดี รวมถึงการหมดอายุของข้อตกลงสงบศึกปูซานในเดือนพฤศจิกายน ยังคงเป็นความเสี่ยงที่ตลาดยังไม่ได้ตั้งราคารับ`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Oil fell Friday (Brent -1.90% to $104.37, WTI -2.33% to $92.55) as reports that Washington and Tehran are edging toward a truce over the Strait of Hormuz offset Saudi supply concerns — even after Iran's Supreme National Security Council gave the US a four-to-five-day ultimatum to accept its terms for a regionwide ceasefire and a phased reopening of the strait.`, th:`ราคาน้ำมันลดลงวันศุกร์ (เบรนท์ -1.90% สู่ $104.37, WTI -2.33% สู่ $92.55) หลังมีรายงานว่าวอชิงตันและเตหะรานกำลังเข้าใกล้ข้อตกลงสงบศึกเรื่องช่องแคบฮอร์มุซ หักล้างความกังวลเรื่องอุปทานจากซาอุดีอาระเบีย แม้สภาความมั่นคงแห่งชาติสูงสุดของอิหร่านจะยื่นคำขาดสี่ถึงห้าวันให้สหรัฐฯ ยอมรับเงื่อนไขการสงบศึกทั่วภูมิภาคและการเปิดช่องแคบอีกครั้งแบบเป็นขั้นตอน`}, w:{en:`Both sides are still demanding the other move first — Iran wants the strait to stay closed until its conditions are accepted, while Trump wants proof of "sufficient goodwill" before lifting the blockade — so the four-to-five-day window pointing to around September 28-29 is now the key date to watch. A signed deal would likely hit oil harder than stocks (removing the supply-risk premium), while a public breakdown could send crude sharply higher again.`, th:`ทั้งสองฝ่ายยังคงเรียกร้องให้อีกฝ่ายเคลื่อนไหวก่อน — อิหร่านต้องการให้ช่องแคบปิดต่อไปจนกว่าเงื่อนไขของตนจะได้รับการยอมรับ ขณะทรัมป์ต้องการเห็นหลักฐาน "ความปรารถนาดีที่เพียงพอ" ก่อนจะยกเลิกการปิดล้อม — ทำให้กรอบเวลาสี่ถึงห้าวันที่ชี้ไปยังราววันที่ 28-29 กันยายน เป็นวันสำคัญที่ต้องจับตา ข้อตกลงที่ลงนามน่าจะส่งผลต่อน้ำมันมากกว่าหุ้น (เพราะลบพรีเมียมความเสี่ยงด้านอุปทานออกไป) ขณะความล้มเหลวที่เปิดเผยต่อสาธารณะอาจทำให้น้ำมันพุ่งขึ้นแรงอีกครั้ง`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The bond market took a breather Friday after two brutal sessions: the 10-year Treasury yield was little changed at 5.163% to end the week, the 30-year eased to 5.488% after briefly topping 5.5% again, and the 2-year held near 4.90%.`, th:`ตลาดพันธบัตรได้พักหายใจวันศุกร์ หลังทรุดหนักติดต่อกันสองเซสชัน ผลตอบแทนพันธบัตรอายุ 10 ปีแทบไม่เปลี่ยนแปลง ปิดสัปดาห์ที่ 5.163% ขณะพันธบัตรอายุ 30 ปีย่อตัวสู่ 5.488% หลังแตะเหนือ 5.5% อีกครั้งระหว่างวัน และพันธบัตรอายุ 2 ปียืนใกล้ 4.90%`}, w:{en:`A pause is not a reversal: yields stopped climbing rather than falling, so the underlying repricing from earlier in the week remains intact. Equities rallying anyway on tech optimism means the disconnect between "risk assets ignoring rates" and "rates staying elevated" is now the key thing to monitor heading into next week's Hormuz deadline and any fresh economic data.`, th:`การหยุดพัก ไม่ใช่การกลับทิศทาง — ผลตอบแทนพันธบัตรหยุดปรับขึ้น ไม่ใช่ปรับลง ทำให้การปรับราคาพื้นฐานจากช่วงต้นสัปดาห์ยังคงอยู่ การที่หุ้นยังคงดีดตัวขึ้นจากความหวังหุ้นเทค หมายความว่าความไม่สอดคล้องกันระหว่าง "สินทรัพย์เสี่ยงที่มองข้ามดอกเบี้ย" กับ "ดอกเบี้ยที่ยังคงสูง" เป็นสิ่งสำคัญที่ต้องติดตามก่อนเข้าสู่กำหนดเส้นตายฮอร์มุซสัปดาห์หน้าและข้อมูลเศรษฐกิจใหม่ที่จะออกมา`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`USAGOLD's Friday market report noted silver leading physical metals higher while gold held near $4,280, even as elevated yields capped a losing week for precious metals overall — a reminder that the same "higher for longer" rate backdrop driving this week's Treasury moves is also the key headwind for gold.`, th:`รายงานตลาดวันศุกร์ของ USAGOLD ระบุว่าเงินนำโลหะมีค่ากลุ่มปรับขึ้น ขณะทองคำยืนใกล้ $4,280 แม้ผลตอบแทนพันธบัตรที่สูงจะกดดันให้โลหะมีค่าโดยรวมปิดสัปดาห์ในแดนลบ — เป็นเครื่องเตือนใจว่าบรรยากาศดอกเบี้ย "สูงนานขึ้น" เดียวกันที่ขับเคลื่อนความเคลื่อนไหวของพันธบัตรสัปดาห์นี้ ก็เป็นแรงกดดันหลักต่อทองคำเช่นกัน`}, w:{en:`Gold stabilizing near $4,280 rather than extending its slide, even with yields still elevated, suggests the metal may be finding a floor — but a genuine gold rally likely needs yields to actually fall, not just plateau. Clients should watch next week's Hormuz outcome and any US data for the next catalyst in either direction.`, th:`การที่ทองคำทรงตัวใกล้ $4,280 แทนที่จะอ่อนตัวลงต่อเนื่อง แม้ผลตอบแทนพันธบัตรจะยังคงสูง บ่งชี้ว่าโลหะชนิดนี้อาจกำลังหาจุดต่ำสุด — แต่การดีดตัวขึ้นของทองคำที่แท้จริงน่าจะต้องการให้ผลตอบแทนพันธบัตรปรับลงจริง ไม่ใช่แค่ทรงตัว ลูกค้าควรจับตาผลการเจรจาฮอร์มุซสัปดาห์หน้าและข้อมูลเศรษฐกิจสหรัฐฯ สำหรับปัจจัยกระตุ้นถัดไปในทั้งสองทิศทาง`}},

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 8 Sep",th:"อังคาร 8 ก.ย."}, imp:"h", t:{en:"Wall Street reopens for the first time since the tanker war, with hike odds near 60%",th:"วอลล์สตรีทเปิดตลาดอีกครั้งเป็นครั้งแรกหลังสงครามเรือบรรทุกน้ำมัน ขณะโอกาสขึ้นดอกเบี้ยใกล้ 60%"}, d:{en:"US markets reopen Tuesday after the Labor Day break, giving the first direct pricing of both the weekend's Iran-tanker escalation and the climb in September rate-hike odds to roughly 60%. Oil (Brent near $98, WTI above $92) and the elevated 10-year yield (~4.79%) will be the key signals to watch as trading resumes.",th:"ตลาดสหรัฐฯ เปิดทำการอีกครั้งวันอังคารหลังหยุดวันแรงงาน เป็นการสะท้อนราคาโดยตรงครั้งแรกทั้งการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ขยับขึ้นสู่ราว 60% ราคาน้ำมัน (เบรนท์ใกล้ $98, WTI เหนือ $92) และผลตอบแทนพันธบัตร 10 ปีที่สูงขึ้น (~4.79%) จะเป็นสัญญาณสำคัญที่ต้องจับตาเมื่อการซื้อขายกลับมาดำเนินต่อ"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 9 Sep",th:"พุธ 9 ก.ย."}, imp:"h", t:{en:"Oil tops $101 as tanker war's worst wave yet hits Wall St a third day",th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"}, d:{en:"The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%); national gas hit $4.22/gal and diesel a record $5.94/gal. The S&P 500 fell 0.48% to 7,636.36 (a third straight down day), the DAX slid 1.74% to a one-month low of 25,554, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. September hike odds eased slightly to ~57%.",th:"สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ดัชนี S&P 500 ลดลง 0.48% สู่ 7,636.36 (ปรับลงวันที่สามติดต่อกัน) ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือนที่ 25,554 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 10 Sep",th:"พฤหัสฯ 10 ก.ย."}, imp:"h", t:{en:"Wall St falls a fourth day; hike odds jump to ~72% as yields near 5%",th:"วอลล์สตรีทร่วงวันที่สี่ โอกาสขึ้นดอกเบี้ยพุ่งสู่ราว 72% ผลตอบแทนใกล้ 5%"}, d:{en:"US stocks fell a fourth straight session — S&P 500 -0.58% to 7,591.70, Dow -0.6% to 52,064.10, Nasdaq -0.65% to 26,081.72 — as the 10-year Treasury yield pushed above 4.9% and Wednesday's in-line PPI kept inflation in focus. September hike odds jumped to roughly 72%, from ~57% a day earlier. Germany's DAX fell 0.8% to 25,401 after the ECB hiked 25bp; Hong Kong's Hang Seng dropped 1.27% while Japan's Nikkei edged up 0.20% and Thailand's SET eased 0.17% on profit-taking. Oil held near $101 and gold rose to $4,405.88.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกัน — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 0.6% สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 — ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% และ PPI วันพุธที่ออกมาตามคาดยังตอกย้ำแรงกดดันเงินเฟ้อ โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% จากราว 57% เมื่อวันก่อน ดัชนี DAX เยอรมนีลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ย 25bp ดัชนี Hang Seng ฮ่องกงลดลง 1.27% ขณะ Nikkei ญี่ปุ่นขยับขึ้น 0.20% และ SET ไทยลดลง 0.17% จากแรงขายทำกำไร น้ำมันยืนใกล้ $101 และทองคำเพิ่มขึ้นสู่ $4,405.88"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 11 Sep",th:"ศุกร์ 11 ก.ย."}, imp:"h", t:{en:"Hot core CPI pushes Sep 16 hike odds to ~90%; stocks rally, oil tumbles",th:"Core CPI ร้อนแรงดันโอกาสขึ้นดอกเบี้ย 16 ก.ย. สู่ราว 90% หุ้นดีดตัว น้ำมันร่วง"}, d:{en:"August headline CPI matched forecasts (+0.4% m/m, +3.4% y/y) but core CPI ran hot (+0.3% m/m vs +0.2% expected, +2.4% y/y), pushing Sep 16 hike odds to roughly 90% from ~72% Thursday. The S&P 500 rose 0.86% to 7,656.98, the Dow gained 509.19 pts (+0.98%) to 52,573.29, and the Nasdaq added 0.96% to 26,333.04. The 10-year yield touched 4.98% before easing to ~4.92%, and Brent tumbled 2.8% to $104.61 after Iran signaled Oman talks over the Strait of Hormuz. Earlier, before the print, Asia and Europe stayed mixed: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%.",th:"CPI ทั่วไปเดือน ส.ค. ตรงตามคาด (+0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อน) แต่ Core CPI ร้อนแรงกว่าคาด (+0.3% เทียบเดือนก่อน เทียบคาดการณ์ 0.2%, +2.4% เทียบปีก่อน) ดันโอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. สู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ดัชนี S&P 500 เพิ่มขึ้น 0.86% สู่ 7,656.98 ดัชนี Dow เพิ่มขึ้น 509.19 จุด (+0.98%) สู่ 52,573.29 และดัชนี Nasdaq เพิ่มขึ้น 0.96% สู่ 26,333.04 ผลตอบแทนพันธบัตร 10 ปีแตะ 4.98% ก่อนย่อตัวสู่ราว 4.92% และเบรนท์ร่วง 2.8% สู่ $104.61 หลังอิหร่านส่งสัญญาณเจรจาที่โอมานเรื่องช่องแคบฮอร์มุซ ก่อนหน้านั้น ก่อนตัวเลขจะประกาศ ตลาดเอเชียและยุโรปเคลื่อนไหวคละกัน: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 14 Sep",th:"จันทร์ 14 ก.ย."}, imp:"h", t:{en:"AI-slowdown selloff runs a full session; 10-year yield tops 5% intraday",th:"แรงเทขาย AI ดำเนินต่อเนื่องเต็มเซสชัน ผลตอบแทน 10 ปีทะลุ 5% ระหว่างวัน"}, d:{en:"US stocks fell a second straight session — S&P 500 -0.48% to 7,619.98, Dow -0.29% to 52,421.20, Nasdaq -0.56% to 26,186.41 — as the weekend's AI-slowdown warnings ran through a full session and the 10-year Treasury yield touched 5.01% intraday before easing to ~4.96%. DAX fell 0.66% to 25,398.75, Nikkei dropped 0.81% to 63,492.99, Hang Seng fell 0.48% to 24,687 (a 4th straight losing session), Shanghai eased 0.07% to 3,885, and Thailand's SET fell 0.84% to 1,591.07 on a DELTA-led electronics selloff. Brent settled $108.34 (+3.6%) and gold fell 1.25% to $4,284.48, its lowest since August.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สองติดต่อกัน — S&P 500 ลดลง 0.48% สู่ 7,619.98, Dow ลดลง 0.29% สู่ 52,421.20, Nasdaq ลดลง 0.56% สู่ 26,186.41 — ขณะคำเตือนชะลอ AI ช่วงสุดสัปดาห์ดำเนินต่อเนื่องเต็มเซสชัน และผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน ก่อนย่อตัวสู่ราว 4.96% ดัชนี DAX ลดลง 0.66% สู่ 25,398.75 ดัชนี Nikkei ลดลง 0.81% สู่ 63,492.99 ดัชนี Hang Seng ลดลง 0.48% สู่ 24,687 (ปรับลงติดต่อกันเป็นเซสชันที่สี่) ดัชนี Shanghai ลดลง 0.07% สู่ 3,885 และดัชนี SET ไทยลดลง 0.84% สู่ 1,591.07 จากแรงเทขายหุ้นอิเล็กทรอนิกส์ที่นำโดย DELTA เบรนท์ปิดที่ $108.34 (+3.6%) และทองคำลดลง 1.25% สู่ $4,284.48 ต่ำสุดตั้งแต่เดือนสิงหาคม"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 15 Sep",th:"อังคาร 15 ก.ย."}, imp:"h", t:{en:"Wall St falls a third day as the 10-year yield hits its highest since 2007",th:"วอลล์สตรีทร่วงวันที่สาม ผลตอบแทน 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007"}, d:{en:"US stocks fell a third straight session — S&P 500 -0.45% to 7,585.73, Dow -0.63% to 52,093.11, Nasdaq -0.78% to 25,981.57 — even as AI chip names Qualcomm and AMD bounced. The 10-year Treasury yield touched 5.04% intraday, its highest since 2007, before easing to ~5.00%, and CME FedWatch pushed hike odds to roughly 92% from 88% Monday. DAX fell 1.14% to ~25,109, Nikkei was flat at 63,484.10, Hang Seng eased 0.08% to 24,667 (a 5th straight losing session), and Shanghai fell 0.54% to 3,864.28. WTI rose to $105.49 while Brent held near $107.46, and gold fell 1.23% to a six-week low of $4,263.19.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกัน — S&P 500 ลดลง 0.45% สู่ 7,585.73, Dow ลดลง 0.63% สู่ 52,093.11, Nasdaq ลดลง 0.78% สู่ 25,981.57 — แม้หุ้นชิปกลุ่ม AI อย่าง Qualcomm และ AMD จะดีดตัวขึ้น ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวสู่ราว 5.00% และ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยขึ้นสู่ราว 92% จาก 88% เมื่อวันจันทร์ ดัชนี DAX ลดลง 1.14% สู่ราว 25,109 ดัชนี Nikkei ทรงตัวที่ 63,484.10 ดัชนี Hang Seng ลดลง 0.08% สู่ 24,667 (ปรับลงติดต่อกันเป็นเซสชันที่ห้า) และดัชนี Shanghai ลดลง 0.54% สู่ 3,864.28 WTI เพิ่มขึ้นสู่ $105.49 ขณะเบรนท์ยืนใกล้ $107.46 และทองคำลดลง 1.23% สู่ระดับต่ำสุดในรอบหกสัปดาห์ที่ $4,263.19"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 16 Sep",th:"พุธ 16 ก.ย."}, imp:"h", t:{en:"Fed hikes rates for the first time in three years; Wall Street falls, 10-year tops 5% again",th:"เฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี วอลล์สตรีทปรับลง ผลตอบแทน 10 ปีทะลุ 5% อีกครั้ง"}, d:{en:"The FOMC voted 12-0 to raise the fed funds rate a quarter point to 3.75%-4.00%, its first hike in three years. Chair Kevin Warsh said inflation \"is too high, and has been for too long,\" and the updated dot plot showed most officials expect at least one more hike this year. US stocks fell on the news — Dow -1.21% (-631.21 pts) to 51,461.90, S&P 500 -0.45% to 7,551.81, Nasdaq roughly flat at 25,978.42 — and the 10-year Treasury yield climbed back above 5% to 5.016%. Oil jumped on fresh Middle East supply fears (WTI +4.2% to $104.25, Brent +4.14% to $108.94) after Houthi attacks and a Saudi pipeline shutdown, while gold slipped 1.2% to $4,240.10. Asia and Europe, which closed hours before the announcement, only traded on anticipation: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80%. Thailand's SET fell 1.01% to 1,562.73 on domestic drivers (a diesel price cut and a delayed tourism-stimulus program), unrelated to the Fed.",th:"FOMC ลงมติเอกฉันท์ 12 เสียง ขึ้นอัตราดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ \"สูงเกินไป และสูงมานานเกินไป\" และ dot plot ฉบับปรับใหม่แสดงว่ากรรมการส่วนใหญ่คาดว่าจะมีการขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ หุ้นสหรัฐฯ ปรับลงรับข่าว — Dow -1.21% (-631.21 จุด) สู่ 51,461.90, S&P 500 -0.45% สู่ 7,551.81, Nasdaq ทรงตัวใกล้เคียงเดิมที่ 25,978.42 — และผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% ราคาน้ำมันพุ่งขึ้นจากความกังวลด้านอุปทานในตะวันออกกลางรอบใหม่ (WTI +4.2% สู่ $104.25, เบรนท์ +4.14% สู่ $108.94) หลังกลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันของซาอุดีอาระเบียถูกปิด ขณะทองคำลดลง 1.2% สู่ $4,240.10 ตลาดเอเชียและยุโรปซึ่งปิดตลาดก่อนการประกาศหลายชั่วโมง เทรดตามการคาดการณ์เท่านั้น: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80% ดัชนี SET ไทยลดลง 1.01% สู่ 1,562.73 จากปัจจัยภายในประเทศ (การลดราคาดีเซลและโครงการกระตุ้นท่องเที่ยวที่ถูกเลื่อนออกไป) ซึ่งไม่เกี่ยวกับเฟด"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 17 Sep",th:"พฤหัสฯ 17 ก.ย."}, imp:"h", t:{en:"Wall Street rebounds as the 10-year yield slips below 5% and oil eases",th:"วอลล์สตรีทดีดตัว ผลตอบแทนพันธบัตร 10 ปีหลุด 5% น้ำมันย่อตัว"}, d:{en:"US stocks bounced back from Wednesday's Fed-hike selloff — S&P 500 +0.59% to 7,596.36, Dow +0.61% (+316.14 pts) to 51,778.04, Nasdaq +1.60% to 26,395.18 — as the 10-year Treasury yield eased to ~4.94% and oil fell on signs the Iran war's supply disruptions could moderate (WTI -2.2% to $101.91, Brent -3.8% to $104.82). Gold rebounded 1.4% to $4,301.40. Trump escalated pressure on Chair Kevin Warsh, threatening to halt trade with surplus countries unless the Fed cuts rates, but the Fed's own statement blamed tariffs, the Iran war and AI capex for elevated inflation. Europe and Japan got their first full session to price in the Fed's hike — DAX +0.53% to 25,538, Nikkei +0.33% to 64,136.25 — while Hong Kong's Hang Seng slipped 0.44% to 24,604.29 and Shanghai eased 0.41% to 3,875.60. Thailand's SET jumped 1.32% to 1,583.34 on turnover of THB 62.46bn.",th:"หุ้นสหรัฐฯ ดีดตัวขึ้นจากแรงเทขายรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ — S&P 500 +0.59% สู่ 7,596.36, Dow +0.61% (+316.14 จุด) สู่ 51,778.04, Nasdaq +1.60% สู่ 26,395.18 — ขณะผลตอบแทนพันธบัตร 10 ปีย่อตัวลงสู่ราว 4.94% และราคาน้ำมันลดลงจากสัญญาณว่าปัญหาอุปทานจากสงครามอิหร่านอาจบรรเทาลง (WTI -2.2% สู่ $101.91, เบรนท์ -3.8% สู่ $104.82) ทองคำดีดตัวขึ้น 1.4% สู่ $4,301.40 ทรัมป์ทวีความรุนแรงของแรงกดดันต่อประธานเควิน วอร์ช โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลหากเฟดไม่ลดดอกเบี้ย แต่แถลงการณ์ของเฟดเองโทษภาษีศุลกากร สงครามอิหร่าน และการลงทุนด้าน AI ว่าเป็นสาเหตุของเงินเฟ้อสูง ยุโรปและญี่ปุ่นได้เซสชันเต็มรูปแบบครั้งแรกในการสะท้อนการขึ้นดอกเบี้ยของเฟดในราคา — DAX +0.53% สู่ 25,538, Nikkei +0.33% สู่ 64,136.25 — ขณะ Hang Seng ฮ่องกงลดลง 0.44% สู่ 24,604.29 และ Shanghai ลดลง 0.41% สู่ 3,875.60 ดัชนี SET ไทยพุ่งขึ้น 1.32% สู่ 1,583.34 มูลค่าการซื้อขายราว 6.246 หมื่นล้านบาท"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 18 Sep",th:"ศุกร์ 18 ก.ย."}, imp:"h", t:{en:"Bank of Japan hikes to 1.25%; Asia rallies, DAX tumbles, Wall Street ends a third losing week little changed",th:"BOJ ขึ้นดอกเบี้ยสู่ 1.25% เอเชียดีดตัว DAX ร่วง วอลล์สตรีทปิดสัปดาห์ที่ปรับลงเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเล็กน้อย"}, d:{en:"The BOJ raised its policy rate a quarter point to 1.25% — highest since 1995 — in a widely expected move that still carried two dovish dissents. Japan's Nikkei jumped 1.38% to 65,018.95, Hong Kong's Hang Seng added 0.60% to 24,750.78 and Shanghai rose 0.94% to 3,911.87, while Germany's DAX tumbled 1.65% to 25,308.88 on an auto-led selloff (Volkswagen -5.97%). US stocks closed a third straight losing week little changed — Dow -0.18% to 51,682.64, S&P 500 +0.17% to 7,650.50, Nasdaq +0.39% to 26,522.55 — as the 10-year Treasury yield backed up toward 5% again (~5.01%). Oil held steady (WTI ~$100.90, Brent ~$104.33) and gold extended its rally to $4,368.60. Thailand's SET was flat at 1,584.15 (+0.05%). Markets are closed for the weekend; next up is Monday's Asia and Europe open.",th:"BOJ ขึ้นอัตราดอกเบี้ยนโยบาย 0.25% สู่ 1.25% — สูงสุดนับตั้งแต่ปี 1995 — เป็นการตัดสินใจที่ตลาดคาดการณ์ไว้แล้ว แต่ยังมีกรรมการ 2 เสียงคัดค้านเชิงผ่อนคลาย ดัชนี Nikkei ญี่ปุ่นพุ่งขึ้น 1.38% สู่ 65,018.95 ดัชนี Hang Seng ฮ่องกงเพิ่มขึ้น 0.60% สู่ 24,750.78 และ Shanghai เพิ่มขึ้น 0.94% สู่ 3,911.87 ขณะดัชนี DAX เยอรมนีร่วง 1.65% สู่ 25,308.88 จากแรงเทขายกลุ่มยานยนต์ (Volkswagen -5.97%) หุ้นสหรัฐฯ ปิดสัปดาห์ที่ปรับลงติดต่อกันเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเพียงเล็กน้อย — Dow -0.18% สู่ 51,682.64, S&P 500 +0.17% สู่ 7,650.50, Nasdaq +0.39% สู่ 26,522.55 — ขณะผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นใกล้ 5% อีกครั้ง (ราว 5.01%) ราคาน้ำมันทรงตัว (WTI ราว $100.90, เบรนท์ราว $104.33) และทองคำขยายการปรับขึ้นต่อเนื่องสู่ $4,368.60 ดัชนี SET ไทยทรงตัวที่ 1,584.15 (+0.05%) ตลาดปิดทำการช่วงสุดสัปดาห์ ก้าวต่อไปคือการเปิดตลาดเอเชียและยุโรปวันจันทร์"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 21 Sep",th:"จันทร์ 21 ก.ย."}, imp:"h", t:{en:"Nasdaq surges 2.26% to a record close as chip stocks rally, oil tumbles and Thailand's SET jumps on a Fitch upgrade",th:"Nasdaq พุ่งขึ้น 2.26% ปิดสูงสุดเป็นประวัติการณ์ หุ้นกลุ่มชิปพุ่งขึ้น น้ำมันร่วง และ SET ไทยพุ่งขึ้นรับข่าว Fitch"}, d:{en:"US stocks posted their best session in weeks — S&P 500 +1.49% to 7,764.70, Nasdaq +2.26% to a record 27,122.09, Dow +0.71% to 52,048.83 — led by chipmakers Intel (+~12%) and AMD (+~10%, briefly a $1 trillion company), as WTI oil tumbled 4.5% to $95.78 and the 10-year Treasury yield eased to 4.951%. Germany's DAX rallied 1.07% to 25,575 and Tokyo stayed closed for a holiday, while Shanghai rose 0.97% to 3,949.91 and Hong Kong's Hang Seng added 1.18% to 25,042.71 on tech and health-tech buying. Thailand's SET jumped 0.88% to 1,598.03 after Fitch Ratings upgraded the country's credit outlook to Stable from Negative. Futures now price the Fed's Oct 28 meeting close to a coin-flip on another hike.",th:"หุ้นสหรัฐฯ มีเซสชันที่ดีที่สุดในรอบหลายสัปดาห์ — S&P 500 +1.49% สู่ 7,764.70, Nasdaq +2.26% สู่ระดับสูงสุดเป็นประวัติการณ์ที่ 27,122.09, Dow +0.71% สู่ 52,048.83 — นำโดยหุ้นกลุ่มชิป Intel (+ราว 12%) และ AMD (+ราว 10% แตะมูลค่า 1 ล้านล้านดอลลาร์ชั่วคราว) ขณะน้ำมัน WTI ร่วง 4.5% สู่ $95.78 และผลตอบแทนพันธบัตร 10 ปีย่อตัวสู่ 4.951% ดัชนี DAX เยอรมนีพุ่งขึ้น 1.07% สู่ 25,575 และตลาดโตเกียวปิดทำการวันหยุด ขณะ Shanghai เพิ่มขึ้น 0.97% สู่ 3,949.91 และ Hang Seng ฮ่องกงเพิ่มขึ้น 1.18% สู่ 25,042.71 จากแรงซื้อหุ้นกลุ่มเทคและเฮลท์เทค ดัชนี SET ไทยพุ่งขึ้น 0.88% สู่ 1,598.03 หลัง Fitch Ratings ปรับมุมมองเครดิตของประเทศเป็นคงที่จากลบ ตลาดล่วงหน้าเริ่มให้ราคาการประชุมเฟดวันที่ 28 ต.ค. ใกล้เคียง 50-50 สำหรับการขึ้นดอกเบี้ยอีกครั้ง"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 22 Sep",th:"อังคาร 22 ก.ย."}, imp:"h", t:{en:"Nasdaq's second straight record on Meta's Muse AI agent; Dow slips, oil breaks below $100 as Trump issues UN ultimatum to Iran",th:"Nasdaq ปิดสูงสุดเป็นประวัติการณ์ติดต่อกันครั้งที่สอง จาก Muse ของ Meta — Dow อ่อนตัว น้ำมันหลุด $100 ขณะทรัมป์ยื่นคำขาดต่ออิหร่านที่ยูเอ็น"}, d:{en:"US stocks were mixed — Nasdaq +0.50% to a record 27,244.28 on a strong reception for Meta's new Muse AI agent, S&P 500 flat at 7,761 (-0.04%), Dow -0.36% (-185.14 pts) to 51,863.69 on Cisco (-4.50%), JPMorgan (-3.35%) and American Express (-2.62%) weakness. Oil extended its slide to a fifth session — Brent -1% to $99.25, its first close below $100 in two weeks — even as Trump told the UN he faces a \"big decision\" on Iran and doesn't expect a deal before the midterms. The 10-year Treasury yield held at 4.959% as CME FedWatch pushed October 28 hike odds to ~60%, and gold eased on a firmer dollar. Germany's DAX was flat at 25,578.85, Tokyo stayed shut for a rare five-day Silver Week holiday (Nikkei still 65,018.95), Shanghai edged up 0.06% to 3,952.13 and Hong Kong's Hang Seng added 0.18% to 25,087.75 ahead of Thursday's Trump-Xi summit. Thailand's SET rose 0.40% to 1,604.44 on turnover of THB 67.05bn.",th:"หุ้นสหรัฐฯ เคลื่อนไหวคละกัน — Nasdaq +0.50% ปิดสูงสุดเป็นประวัติการณ์ที่ 27,244.28 จากการตอบรับที่ดีต่อ Muse ตัวช่วย AI ตัวใหม่ของ Meta, S&P 500 ทรงตัวที่ 7,761 (-0.04%), Dow -0.36% (-185.14 จุด) สู่ 51,863.69 จากความอ่อนแอของ Cisco (-4.50%), JPMorgan (-3.35%) และ American Express (-2.62%) ราคาน้ำมันร่วงต่อเนื่องเป็นเซสชันที่ห้า — เบรนท์ -1% สู่ $99.25 ต่ำกว่าระดับ $100 เป็นครั้งแรกในรอบสองสัปดาห์ — แม้ทรัมป์จะกล่าวต่อยูเอ็นว่าเขาต้อง \"ตัดสินใจครั้งใหญ่\" เรื่องอิหร่าน และไม่คาดว่าจะมีข้อตกลงก่อนการเลือกตั้งกลางเทอม ผลตอบแทนพันธบัตร 10 ปียืนที่ 4.959% ขณะ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมสู่ราว 60% และทองคำอ่อนตัวลงจากดอลลาร์ที่แข็งค่าขึ้น ดัชนี DAX เยอรมนีทรงตัวที่ 25,578.85 ตลาดโตเกียวยังปิดทำการเนื่องในวันหยุด Silver Week ห้าวันที่หาได้ยาก (Nikkei ยังอยู่ที่ 65,018.95) ดัชนี Shanghai ขยับขึ้น 0.06% สู่ 3,952.13 และ Hang Seng ฮ่องกงเพิ่มขึ้น 0.18% สู่ 25,087.75 ก่อนการประชุมสุดยอดทรัมป์-สีวันพฤหัสบดี ดัชนี SET ไทยเพิ่มขึ้น 0.40% สู่ 1,604.44 มูลค่าการซื้อขายราว 6.705 หมื่นล้านบาท"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 23 Sep",th:"พุธ 23 ก.ย."}, imp:"h", t:{en:"10-year Treasury yield rockets to a 19-year high as Fed's Barr turns hawkish; Wall Street tumbles, oil snaps back above $100",th:"ผลตอบแทนพันธบัตร 10 ปีพุ่งแตะจุดสูงสุดในรอบ 19 ปี หลังผู้ว่าการเฟดบาร์ส่งสัญญาณสายเหยี่ยว วอลล์สตรีทร่วงแรง น้ำมันดีดกลับเหนือ $100"}, d:{en:"US stocks sold off sharply — S&P 500 -0.75% to 7,706.03, Nasdaq -1.13% to 26,936.04, Dow -0.68% (-352.10 pts) to 51,511.59, with small-caps hit hardest — as a weak $70bn five-year note auction and hawkish remarks from Fed Governor Michael Barr drove the 10-year Treasury yield up more than 17bp to 5.135%, its highest since July 2007; the 5-year yield hit 5% for the first time since 2007. CME FedWatch pushed October 28 hike odds to roughly 73%, from ~60% Tuesday, after S&P Global's flash composite PMI jumped to 58.4, a 5-year high. Oil snapped a five-session slide (Brent +3.86% to $103.08, WTI +1.81% to $92.16) while gold fell 1.23% to $4,304.11 on a firmer dollar. Germany's DAX fell 0.66% to 25,410.63, Tokyo stayed shut for the last day of Silver Week (Nikkei still 65,018.95, reopening today), Shanghai eased 0.39% to 3,936.52 and Hong Kong's Hang Seng dropped 1.01% to 24,834.12 ahead of today's Trump-Xi summit. Thailand's SET bucked the trend, rising 0.39% to 1,610.70 on turnover of THB 64.41bn.",th:"หุ้นสหรัฐฯ เทขายอย่างหนัก — S&P 500 ลดลง 0.75% สู่ 7,706.03, Nasdaq ลดลง 1.13% สู่ 26,936.04, Dow ลดลง 0.68% (-352.10 จุด) สู่ 51,511.59 โดยหุ้นขนาดเล็กร่วงหนักที่สุด — หลังการประมูลพันธบัตรอายุ 5 ปีมูลค่า 7 หมื่นล้านดอลลาร์ที่อ่อนแอ และถ้อยแถลงสายเหยี่ยวของผู้ว่าการเฟด ไมเคิล บาร์ ดันผลตอบแทนพันธบัตร 10 ปีขึ้นกว่า 17bp สู่ 5.135% สูงสุดนับตั้งแต่เดือนกรกฎาคม 2007 ขณะผลตอบแทนพันธบัตรอายุ 5 ปีแตะ 5% เป็นครั้งแรกนับตั้งแต่ปี 2007 CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมสู่ราว 73% จากราว 60% เมื่อวันอังคาร หลังดัชนี PMI รวมเบื้องต้นของ S&P Global พุ่งขึ้นสู่ 58.4 สูงสุดในรอบ 5 ปี ราคาน้ำมันยุติการร่วงต่อเนื่องห้าเซสชัน (เบรนท์ +3.86% สู่ $103.08, WTI +1.81% สู่ $92.16) ขณะทองคำลดลง 1.23% สู่ $4,304.11 จากดอลลาร์ที่แข็งค่าขึ้น ดัชนี DAX เยอรมนีลดลง 0.66% สู่ 25,410.63 ตลาดโตเกียวยังปิดทำการวันสุดท้ายของ Silver Week (Nikkei ยังอยู่ที่ 65,018.95 เปิดทำการอีกครั้งวันนี้) ดัชนี Shanghai ลดลง 0.39% สู่ 3,936.52 และ Hang Seng ฮ่องกงลดลง 1.01% สู่ 24,834.12 ก่อนการประชุมสุดยอดทรัมป์-สีวันนี้ ดัชนี SET ไทยสวนทางกระแส เพิ่มขึ้น 0.39% สู่ 1,610.70 มูลค่าการซื้อขายราว 6.441 หมื่นล้านบาท"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 24 Sep",th:"พฤหัสฯ 24 ก.ย."}, imp:"h", t:{en:"Bond rout deepens to a 2004 high on the 30-year; Wall Street steadies on Hormuz-deal hopes as Trump and Xi meet without a breakthrough",th:"ตลาดพันธบัตรทรุดหนักขึ้น ผลตอบแทน 30 ปีแตะจุดสูงสุดตั้งแต่ปี 2004 วอลล์สตรีททรงตัวรับข่าวความหวังข้อตกลงฮอร์มุซ ขณะทรัมป์-สีพบกันโดยไม่มีความคืบหน้าสำคัญ"}, d:{en:"The 30-year Treasury yield jumped to 5.501%, its highest since June 2004, while the 10-year held near 5.12% and the 2-year rose to 4.941%, after a strong flash PMI reading. US stocks nonetheless steadied — Dow -0.31% to 51,349.98, S&P 500 -0.02% to 7,704.13, Nasdaq +0.01% to 26,939.37 — on reports of a possible phased US-Iran deal to reopen the Strait of Hormuz. Oil extended its rally (Brent +3.21% to $106.39, WTI +2.82% to $94.76) while gold fell 1.24% to $4,250.85. President Trump and President Xi met for about three hours at the White House with a cordial tone but no major breakthroughs on trade, Taiwan or Iran. Germany's DAX fell 0.57% to 25,266, Tokyo's Nikkei reopened after Silver Week and jumped 0.76% to 65,513.94, Shanghai fell 1.23% to about 3,888 while Hong Kong's Hang Seng was nearly flat at 24,824.87, and Thailand's SET fell 0.50% to 1,602.58 on reports the US may ban diesel exports.",th:"ผลตอบแทนพันธบัตรอายุ 30 ปีพุ่งขึ้นสู่ 5.501% สูงสุดนับตั้งแต่เดือนมิถุนายน 2004 ขณะผลตอบแทนพันธบัตรอายุ 10 ปียืนใกล้ 5.12% และอายุ 2 ปีไต่ขึ้นสู่ 4.941% หลังตัวเลข PMI เบื้องต้นที่แข็งแกร่ง หุ้นสหรัฐฯ กลับทรงตัว — Dow ลดลง 0.31% สู่ 51,349.98, S&P 500 ลดลง 0.02% สู่ 7,704.13, Nasdaq เพิ่มขึ้น 0.01% สู่ 26,939.37 — จากรายงานความเป็นไปได้ของข้อตกลงสหรัฐฯ-อิหร่านแบบเป็นขั้นตอนเพื่อเปิดช่องแคบฮอร์มุซอีกครั้ง ราคาน้ำมันปรับขึ้นต่อเนื่อง (เบรนท์ +3.21% สู่ $106.39, WTI +2.82% สู่ $94.76) ขณะทองคำลดลง 1.24% สู่ $4,250.85 ประธานาธิบดีทรัมป์และประธานาธิบดีสีจิ้นผิงพบกันที่ทำเนียบขาวราวสามชั่วโมงด้วยบรรยากาศที่เป็นมิตร แต่ไม่มีความคืบหน้าสำคัญด้านการค้า ไต้หวัน หรืออิหร่าน ดัชนี DAX เยอรมนีลดลง 0.57% สู่ 25,266 ดัชนี Nikkei โตเกียวเปิดทำการอีกครั้งหลัง Silver Week และพุ่งขึ้น 0.76% สู่ 65,513.94 ดัชนี Shanghai ลดลง 1.23% สู่ราว 3,888 ขณะ Hang Seng ฮ่องกงแทบทรงตัวที่ 24,824.87 และดัชนี SET ไทยลดลง 0.50% สู่ 1,602.58 จากรายงานว่าสหรัฐฯ อาจห้ามส่งออกน้ำมันดีเซล"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 25 Sep",th:"ศุกร์ 25 ก.ย."}, imp:"h", t:{en:"Wall Street ends a volatile week higher on tech optimism as yields ease off multi-decade highs and oil slides on US-Iran truce hopes",th:"วอลล์สตรีทปิดสัปดาห์ผันผวนด้วยแดนบวก จากความหวังหุ้นเทค ขณะผลตอบแทนพันธบัตรย่อตัวจากจุดสูงสุดในรอบหลายทศวรรษ และน้ำมันร่วงรับความหวังสงบศึกสหรัฐฯ-อิหร่าน"}, d:{en:"US stocks closed out a volatile week higher — Dow +0.93% (+478.64 pts) to 51,828.62, S&P 500 +0.51% to 7,743.41, Nasdaq +0.48% to 27,068.72 — as fresh tech optimism offset a bond market still near multi-decade highs. The 10-year Treasury yield ended the week little changed at 5.163%, the 30-year eased to 5.488% after briefly topping 5.5% again, and the 2-year held near 4.90%. Oil fell (Brent -1.90% to $104.37, WTI -2.33% to $92.55) on reports Washington and Tehran are edging toward a Hormuz truce, even after Iran's Supreme National Security Council gave the US a four-to-five-day ultimatum on its ceasefire terms; gold ticked up 0.78% to $4,284.20. Tokyo's Nikkei jumped 1.30% to a record 66,364.20, Hong Kong's Hang Seng fell about 1.3% to 24,510.09 while mainland China shut for the Mid-Autumn Festival (reopening Monday), Germany's DAX rose roughly 0.56% to near 25,409, and Thailand's SET edged up 0.32% to 1,607.63 on DELTA-led rebalancing flows.",th:"หุ้นสหรัฐฯ ปิดสัปดาห์ที่ผันผวนด้วยแดนบวก — Dow +0.93% (+478.64 จุด) สู่ 51,828.62, S&P 500 +0.51% สู่ 7,743.41, Nasdaq +0.48% สู่ 27,068.72 — จากความหวังหุ้นกลุ่มเทค หักล้างตลาดพันธบัตรที่ยังคงยืนใกล้จุดสูงสุดในรอบหลายทศวรรษ ผลตอบแทนพันธบัตรอายุ 10 ปีปิดสัปดาห์แทบไม่เปลี่ยนแปลงที่ 5.163% ขณะพันธบัตรอายุ 30 ปีย่อตัวสู่ 5.488% หลังแตะเหนือ 5.5% อีกครั้งระหว่างวัน และพันธบัตรอายุ 2 ปียืนใกล้ 4.90% ราคาน้ำมันลดลง (เบรนท์ -1.90% สู่ $104.37, WTI -2.33% สู่ $92.55) จากรายงานว่าวอชิงตันและเตหะรานกำลังเข้าใกล้ข้อตกลงสงบศึกฮอร์มุซ แม้สภาความมั่นคงแห่งชาติสูงสุดของอิหร่านจะยื่นคำขาดสี่ถึงห้าวันเรื่องเงื่อนไขสงบศึก ขณะทองคำขยับขึ้น 0.78% สู่ $4,284.20 ดัชนี Nikkei โตเกียวพุ่งขึ้น 1.30% สู่ระดับสูงสุดเป็นประวัติการณ์ที่ 66,364.20 ดัชนี Hang Seng ฮ่องกงลดลงราว 1.3% สู่ 24,510.09 ขณะจีนแผ่นดินใหญ่ปิดทำการเนื่องในเทศกาลไหว้พระจันทร์ (เปิดทำการอีกครั้งวันจันทร์) ดัชนี DAX เยอรมนีเพิ่มขึ้นราว 0.56% สู่ใกล้ 25,409 และดัชนี SET ไทยขยับขึ้น 0.32% สู่ 1,607.63 จากแรงซื้อหุ้น DELTA ระหว่างการปรับสัดส่วนดัชนี"}},
