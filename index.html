<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Wall Street's AI-Led Slide Runs a Second Day as the 10-Year Yield Tops 5% and Oil Jumps on the Saudi Pipeline Outage, With the Fed's Two-Day Meeting Now Under Way", th:"หุ้นสหรัฐฯ ร่วงต่อวันที่สองจากแรงเทขายกลุ่ม AI ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 5% และน้ำมันพุ่งจากท่อน้ำมันซาอุฯ ที่ปิดตัว ในวันที่การประชุมเฟดสองวันเริ่มต้นขึ้นแล้ว"},
    heroDeck:{en:`US stocks fell for a second straight session Monday as the AI-slowdown selloff and a fresh spike in Treasury yields weighed on risk appetite: the S&P 500 slid 0.48% to 7,619.98, the Dow lost 152.09 points (-0.29%) to 52,421.20, and the Nasdaq Composite dropped 0.56% to 26,186.41. The 10-year Treasury yield touched 5.01% intraday — a fresh multi-year high — before easing to close near 4.96%, while the 2-year hit 4.66%, its highest since mid-2024, as CME FedWatch put the odds of a quarter-point hike at Wednesday's decision at roughly 88%. Brent crude settled up 3.6% at $108.34/bbl and WTI at $102.42 after Saudi Arabia's East-West pipeline shutdown renewed supply fears, though both pulled back from an earlier four-month high near $105 WTI after President Trump said Russia and Ukraine had agreed to pause strikes on each other's energy infrastructure. Gold fell 1.25% to $4,284.48/oz, its lowest since August, as high yields and a firm dollar outweighed safe-haven demand. Overseas, Germany's DAX fell 0.66% to 25,398.75, Japan's Nikkei 225 dropped 0.81% to 63,492.99, Hong Kong's Hang Seng slipped 0.48% to 24,687 for a fourth straight losing session, mainland China's Shanghai Composite eased 0.07% to 3,885, and Thailand's SET Index fell 0.84% to 1,591.07 on turnover of THB 61.89bn as electronics bellwether DELTA led a broader tech-linked selloff. The Fed's two-day FOMC meeting begins today, Tuesday September 15, with the decision due Wednesday and the Bank of Japan following September 17-18.`, th:`หุ้นสหรัฐฯ ปรับลงเป็นวันที่สองติดต่อกันในวันจันทร์ จากแรงเทขายหุ้นกลุ่ม AI และผลตอบแทนพันธบัตรที่พุ่งขึ้นอีกครั้งซึ่งกดดันความเสี่ยงของตลาด — ดัชนี S&P 500 ลดลง 0.48% สู่ 7,619.98 ดัชนี Dow ลดลง 152.09 จุด (-0.29%) สู่ 52,421.20 และดัชนี Nasdaq Composite ลดลง 0.56% สู่ 26,186.41 ผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน ซึ่งเป็นจุดสูงสุดใหม่ในรอบหลายปี ก่อนย่อตัวปิดใกล้ 4.96% ขณะพันธบัตร 2 ปีแตะ 4.66% สูงสุดตั้งแต่กลางปี 2024 ขณะ CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ย 0.25% ในการตัดสินใจวันพุธไว้ที่ราว 88% น้ำมันดิบเบรนท์ปิดเพิ่มขึ้น 3.6% สู่ $108.34 ต่อบาร์เรล และ WTI ที่ $102.42 หลังการปิดท่อขนส่งน้ำมัน East-West ของซาอุดีอาระเบียจุดชนวนความกังวลด้านอุปทานรอบใหม่ แม้ทั้งสองราคาจะย่อตัวลงจากจุดสูงสุดในรอบสี่เดือนที่ WTI เคยแตะใกล้ $105 หลังประธานาธิบดีทรัมป์ระบุว่ารัสเซียและยูเครนตกลงยุติการโจมตีโครงสร้างพื้นฐานด้านพลังงานของกันและกัน ทองคำลดลง 1.25% สู่ $4,284.48 ต่อออนซ์ ต่ำสุดตั้งแต่เดือนสิงหาคม เมื่อผลตอบแทนพันธบัตรที่สูงและดอลลาร์ที่แข็งค่ามีน้ำหนักมากกว่าความต้องการสินทรัพย์ปลอดภัย ในต่างประเทศ ดัชนี DAX เยอรมนีลดลง 0.66% สู่ 25,398.75 ดัชนี Nikkei 225 ญี่ปุ่นลดลง 0.81% สู่ 63,492.99 ดัชนี Hang Seng ฮ่องกงลดลง 0.48% สู่ 24,687 ปรับลงเป็นวันที่สี่ติดต่อกัน ดัชนี Shanghai Composite จีนแผ่นดินใหญ่ลดลง 0.07% สู่ 3,885 และดัชนี SET ไทยลดลง 0.84% สู่ 1,591.07 มูลค่าการซื้อขายราว 6.189 หมื่นล้านบาท จากหุ้นอิเล็กทรอนิกส์นำตลาดอย่าง DELTA ที่นำแรงเทขายกลุ่มเทคโนโลยีในวงกว้าง การประชุมเฟดสองวันเริ่มต้นวันนี้ อังคารที่ 15 กันยายน ผลการตัดสินใจจะประกาศวันพุธ ตามด้วยธนาคารกลางญี่ปุ่นวันที่ 17-18 กันยายน`},

    leadtxt:{en:`<b>The AI-slowdown selloff carried through a full session Monday, and it now has company: the 10-year Treasury yield's brief touch above 5% is the more consequential story for your clients' portfolios.</b> The S&P 500 fell 0.48% to 7,619.98, the Nasdaq 0.56% to 26,186.41, and the Nikkei 0.81% to 63,492.99 — a second straight down day for US and Asian equities — while the 10-year yield hit 5.01% intraday before easing to ~4.96% and the 2-year touched 4.66%, its highest since mid-2024. Oil stayed elevated on Saudi Arabia's East-West pipeline shutdown (Brent $108.34, +3.6%) but gave back some of its spike after Trump said Russia and Ukraine had agreed to pause strikes on energy infrastructure — a reminder that this rally has a real de-escalation risk attached to it. Gold's 1.25% drop to $4,284.48, its lowest since August, shows high yields are currently winning the tug-of-war against safe-haven demand. Thailand's SET fell 0.84% to 1,591.07 on DELTA-led electronics weakness, mirroring the region. For your clients: <b>the Fed's two-day meeting starts today, and with a hike ~88% priced, Wednesday's dot plot and Powell's tone — not the decision itself — will set the tone for the rest of the month.</b>`, th:`<b>แรงเทขายจากคำเตือนชะลอ AI ดำเนินต่อเนื่องเต็มเซสชันวันจันทร์ และตอนนี้มีปัจจัยเสริม: การที่ผลตอบแทนพันธบัตร 10 ปีแตะเหนือ 5% ในช่วงสั้นๆ คือเรื่องที่สำคัญกว่าต่อพอร์ตของลูกค้าคุณ</b> ดัชนี S&P 500 ลดลง 0.48% สู่ 7,619.98 ดัชนี Nasdaq ลดลง 0.56% สู่ 26,186.41 และดัชนี Nikkei ลดลง 0.81% สู่ 63,492.99 — ปรับลงเป็นวันที่สองติดต่อกันทั้งหุ้นสหรัฐฯ และเอเชีย — ขณะผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน ก่อนย่อตัวสู่ราว 4.96% และพันธบัตร 2 ปีแตะ 4.66% สูงสุดตั้งแต่กลางปี 2024 น้ำมันยังคงยืนสูงจากการปิดท่อขนส่งน้ำมัน East-West ของซาอุดีอาระเบีย (เบรนท์ $108.34 +3.6%) แต่คืนกำไรบางส่วนหลังทรัมป์ระบุว่ารัสเซียและยูเครนตกลงยุติการโจมตีโครงสร้างพื้นฐานด้านพลังงาน ซึ่งเป็นเครื่องเตือนใจว่าการปรับขึ้นครั้งนี้มีความเสี่ยงจากการคลี่คลายสถานการณ์จริงแฝงอยู่ ทองคำที่ลดลง 1.25% สู่ $4,284.48 ต่ำสุดตั้งแต่เดือนสิงหาคม แสดงว่าผลตอบแทนพันธบัตรที่สูงกำลังชนะแรงดึงกับความต้องการสินทรัพย์ปลอดภัยในขณะนี้ ดัชนี SET ไทยลดลง 0.84% สู่ 1,591.07 จากความอ่อนแอของหุ้นอิเล็กทรอนิกส์ที่นำโดย DELTA สอดคล้องกับภูมิภาค สำหรับลูกค้าของคุณ: <b>การประชุมเฟดสองวันเริ่มต้นวันนี้ และด้วยโอกาสขึ้นดอกเบี้ยที่สะท้อนในราคาแล้วราว 88% dot plot และน้ำเสียงของพาวเวลล์วันพุธ — ไม่ใช่การตัดสินใจขึ้นดอกเบี้ยเอง — จะเป็นตัวกำหนดทิศทางตลาดตลอดช่วงที่เหลือของเดือน</b>`},

    watchnote:{en:`The Fed's two-day FOMC meeting begins today, Tuesday, with CME FedWatch pricing roughly 88% odds of a quarter-point hike Wednesday — little changed from Friday, even after Monday's 10-year yield spike to 5.01% and renewed oil-supply pressure from the Saudi pipeline shutdown. A day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting: a rare back-to-back week for the world's two most-watched central banks. Layered on top, Monday's AI-slowdown selloff ran a full session, dragging the S&P 500, Nasdaq and Nikkei all lower together for a second straight day. <b style="color:var(--muted)">Wednesday's FOMC decision and dot plot</b> is still the key date on the calendar, but watch whether AI-driven tech weakness and yields near cycle highs both persist into then.`,
      th:`การประชุม FOMC สองวันของเฟดเริ่มต้นวันนี้ อังคาร โดย CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ย 0.25% วันพุธไว้ที่ราว 88% เปลี่ยนแปลงเพียงเล็กน้อยจากวันศุกร์ แม้ผลตอบแทนพันธบัตร 10 ปีจะพุ่งแตะ 5.01% วันจันทร์ และแรงกดดันอุปทานน้ำมันรอบใหม่จากการปิดท่อของซาอุดีอาระเบีย หนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก ซ้อนทับด้วยแรงเทขายจากคำเตือนชะลอ AI วันจันทร์ที่ดำเนินเต็มเซสชัน ฉุดทั้ง S&P 500, Nasdaq และ Nikkei ลงพร้อมกันเป็นวันที่สองติดต่อกัน <b style="color:var(--muted)">การตัดสินใจของ FOMC และ dot plot วันพุธ</b> ยังคงเป็นวันสำคัญบนปฏิทิน แต่ควรจับตาว่าความอ่อนแอของหุ้นเทคจาก AI และผลตอบแทนพันธบัตรที่ใกล้จุดสูงสุดของรอบจะยังคงอยู่ต่อไปจนถึงวันนั้นหรือไม่`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป และเอเชีย วันจันทร์ที่ 14 ก.ย. ส่วนบทวิเคราะห์เรื่องการซื้อขายช่วงเช้าเอเชียวันอังคารที่ 15 ก.ย. อ้างอิงจากการเคลื่อนไหวของดัชนีและราคาหุ้นรายตัวที่มีการรายงาน ไม่ใช่ราคาปิดที่ยืนยันแล้ว ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>US stocks fell for a second straight session Monday — the S&P 500 -0.48% to 7,619.98, the Dow -0.29% (-152.09 pts) to 52,421.20, the Nasdaq -0.56% to 26,186.41 —</b> as the AI-slowdown selloff ran through a full session and the 10-year Treasury yield spiked to 5.01% intraday, a fresh multi-year high, before easing to close near 4.96%.`, th:`<b>หุ้นสหรัฐฯ ปรับลงเป็นวันที่สองติดต่อกันวันจันทร์ — S&P 500 ลดลง 0.48% สู่ 7,619.98, Dow ลดลง 0.29% (-152.09 จุด) สู่ 52,421.20, Nasdaq ลดลง 0.56% สู่ 26,186.41 —</b> ขณะแรงเทขายจากคำเตือนชะลอ AI ดำเนินต่อเนื่องเต็มเซสชัน และผลตอบแทนพันธบัตร 10 ปีพุ่งแตะ 5.01% ระหว่างวัน จุดสูงสุดใหม่ในรอบหลายปี ก่อนย่อตัวปิดใกล้ 4.96%`},
      why:{en:`A second straight down day, this time led by yields rather than oil, tells you the AI-slowdown story has staying power — it's no longer a one-day headline reaction. With the Fed's two-day meeting starting today and a hike ~88% priced, the key question for clients is whether Wednesday's dot plot validates this yield move or pushes back against it.`, th:`การปรับลงติดต่อกันเป็นวันที่สอง ซึ่งครั้งนี้นำโดยผลตอบแทนพันธบัตรมากกว่าน้ำมัน แสดงว่าเรื่องราวการชะลอ AI มีความคงทน ไม่ใช่แค่ปฏิกิริยาต่อพาดหัวข่าววันเดียวอีกต่อไป เมื่อการประชุมเฟดสองวันเริ่มต้นวันนี้และโอกาสขึ้นดอกเบี้ยสะท้อนในราคาแล้วราว 88% คำถามสำคัญสำหรับลูกค้าคือ dot plot วันพุธจะยืนยันการเคลื่อนไหวของผลตอบแทนพันธบัตรนี้ หรือจะคัดค้านมัน`},
      full:{en:`US stocks closed lower Monday for a second consecutive session, as investor risk appetite weakened under the combined weight of the weekend's AI-slowdown warnings, elevated crude oil, and a sharp rise in Treasury yields ahead of this week's Fed decision. The S&P 500 fell 0.48% to close at 7,619.98, the Dow Jones Industrial Average lost 152.09 points (-0.29%) to 52,421.20, and the Nasdaq Composite declined 0.56% to 26,186.41. Global AI-linked semiconductor shares extended their slide after Anthropic's Dario Amodei called for a slowdown in AI capability development, a call other tech figures backed over the weekend. The 10-year Treasury yield hit 5.01% intraday — its highest since 2023 — before easing to close around 4.96%, while the 2-year yield rose to 4.66%, its highest since mid-2024. CME FedWatch put the odds of a quarter-point hike at Wednesday's decision at roughly 88%, little changed from Friday. Brent crude settled up 3.6% at $108.34/bbl and WTI at $102.42 after Saudi Arabia's East-West pipeline — its main workaround for the blocked Strait of Hormuz — remained shut following a drone attack, though both pulled back from an earlier four-month high near $105 WTI after President Trump said Russia and Ukraine had agreed to pause strikes on each other's energy infrastructure. Gold fell 1.25% to $4,284.48/oz, its lowest since August, as high yields and a firm dollar outweighed safe-haven demand. The Fed's two-day FOMC meeting begins Tuesday, with the decision due Wednesday and the Bank of Japan following September 17-18.`, th:`หุ้นสหรัฐฯ ปิดตลาดต่ำลงวันจันทร์ เป็นการปรับลงติดต่อกันเป็นวันที่สอง ขณะความต้องการสินทรัพย์เสี่ยงของนักลงทุนอ่อนแอลงภายใต้แรงกดดันรวมจากคำเตือนชะลอ AI ช่วงสุดสัปดาห์ ราคาน้ำมันดิบที่สูง และผลตอบแทนพันธบัตรที่พุ่งขึ้นแรงก่อนการตัดสินใจของเฟดสัปดาห์นี้ ดัชนี S&P 500 ลดลง 0.48% ปิดที่ 7,619.98 ดัชนี Dow Jones ลดลง 152.09 จุด (-0.29%) สู่ 52,421.20 และดัชนี Nasdaq Composite ลดลง 0.56% สู่ 26,186.41 หุ้นกลุ่มเซมิคอนดักเตอร์ที่เชื่อมโยงกับ AI ทั่วโลกปรับลงต่อเนื่อง หลังดาริโอ อโมเดอีแห่ง Anthropic เรียกร้องให้ชะลอการพัฒนาความสามารถของ AI ซึ่งบุคคลในวงการเทคโนโลยีรายอื่นให้การสนับสนุนช่วงสุดสัปดาห์ ผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน สูงสุดตั้งแต่ปี 2023 ก่อนย่อตัวปิดที่ราว 4.96% ขณะผลตอบแทนพันธบัตร 2 ปีเพิ่มขึ้นสู่ 4.66% สูงสุดตั้งแต่กลางปี 2024 CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ย 0.25% ในการตัดสินใจวันพุธไว้ที่ราว 88% เปลี่ยนแปลงเพียงเล็กน้อยจากวันศุกร์ น้ำมันดิบเบรนท์ปิดเพิ่มขึ้น 3.6% สู่ $108.34 ต่อบาร์เรล และ WTI ที่ $102.42 หลังท่อขนส่งน้ำมัน East-West ของซาอุดีอาระเบีย — เส้นทางสำรองหลักเพื่อเลี่ยงช่องแคบฮอร์มุซที่ปิดกั้นอยู่ — ยังคงปิดตัวหลังถูกโดรนโจมตี แม้ทั้งสองราคาจะย่อตัวลงจากจุดสูงสุดในรอบสี่เดือนที่ WTI เคยแตะใกล้ $105 หลังประธานาธิบดีทรัมป์ระบุว่ารัสเซียและยูเครนตกลงยุติการโจมตีโครงสร้างพื้นฐานด้านพลังงานของกันและกัน ทองคำลดลง 1.25% สู่ $4,284.48 ต่อออนซ์ ต่ำสุดตั้งแต่เดือนสิงหาคม เมื่อผลตอบแทนพันธบัตรที่สูงและดอลลาร์ที่แข็งค่ามีน้ำหนักมากกว่าความต้องการสินทรัพย์ปลอดภัย การประชุม FOMC สองวันของเฟดเริ่มต้นวันอังคาร ผลการตัดสินใจจะประกาศวันพุธ ตามด้วยธนาคารกลางญี่ปุ่นวันที่ 17-18 กันยายน`},
      sources:[{l:"TheStreet — Sept 14 close, 10Y yield",u:"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-14-2026"},{l:"CNBC — 10-year yield nears 5%",u:"https://www.cnbc.com/2026/09/14/10-year-us-treasury-is-closing-in-on-5percent.html"},{l:"Yahoo Finance — Sept 14 close, oil",u:"https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-14-133832281.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,398.75", chg:-0.66, series:[25568.56,25398.75],
      txt:{en:`<b>DAX fell 0.66% (-169.81 pts) to 25,398.75 Monday,</b> giving back Friday's bounce as the AI-slowdown selloff and a fresh jump in oil and Treasury yields spread to European risk sentiment.`, th:`<b>DAX ลดลง 0.66% (-169.81 จุด) สู่ 25,398.75 วันจันทร์</b> คืนกำไรของวันศุกร์ทั้งหมด ขณะแรงเทขายจากคำเตือนชะลอ AI และน้ำมัน/ผลตอบแทนพันธบัตรที่พุ่งขึ้นรอบใหม่ลามมาถึงบรรยากาศเสี่ยงของยุโรป`},
      why:{en:`Europe erasing its entire Friday bounce in a single session shows the region has no independent cushion against a US-led, yield-driven selloff — it's trading as a high-beta follower right now, not a diversifier. Flag that to clients using European equities purely for diversification this week.`, th:`การที่ยุโรปคืนกำไรทั้งหมดของวันศุกร์ในเซสชันเดียว แสดงว่าภูมิภาคนี้ไม่มีปัจจัยกันชนที่เป็นอิสระจากแรงเทขายที่นำโดยสหรัฐฯ และขับเคลื่อนด้วยผลตอบแทนพันธบัตร — ขณะนี้เทรดในฐานะผู้ตามที่มีความผันผวนสูง ไม่ใช่ตัวกระจายความเสี่ยง ควรแจ้งเตือนลูกค้าที่ใช้หุ้นยุโรปเพื่อกระจายความเสี่ยงล้วนๆ ในสัปดาห์นี้`},
      full:{en:`European shares fell Monday, with Germany's DAX closing down 0.66% (-169.81 points) at 25,398.75, as risk sentiment soured alongside US and Asian equities. The decline came as the weekend's AI-slowdown warnings from Anthropic and OpenAI rippled into a full trading session, compounded by a fresh jump in oil prices after Saudi Arabia's East-West pipeline shutdown and a spike in global bond yields, with the 10-year US Treasury touching 5.01% intraday. The move erased all of Friday's 0.66% gain, which had come a day after the ECB's 25-basis-point hike and inflation warning.`, th:`หุ้นยุโรปปรับลงวันจันทร์ ดัชนี DAX เยอรมนีปิดตลาดลดลง 0.66% (-169.81 จุด) ที่ 25,398.75 ขณะบรรยากาศเสี่ยงแย่ลงสอดคล้องกับหุ้นสหรัฐฯ และเอเชีย การปรับลงนี้เกิดขึ้นขณะคำเตือนชะลอ AI จาก Anthropic และ OpenAI ช่วงสุดสัปดาห์ลามเข้าสู่เซสชันการซื้อขายเต็มวัน ซ้ำเติมด้วยราคาน้ำมันที่พุ่งขึ้นรอบใหม่หลังการปิดท่อขนส่งน้ำมัน East-West ของซาอุดีอาระเบีย และผลตอบแทนพันธบัตรทั่วโลกที่พุ่งขึ้น โดยพันธบัตรสหรัฐฯ 10 ปีแตะ 5.01% ระหว่างวัน การเคลื่อนไหวนี้ลบล้างกำไร 0.66% ของวันศุกร์ทั้งหมด ซึ่งเกิดขึ้นหนึ่งวันหลัง ECB ขึ้นดอกเบี้ย 25bp และเตือนเรื่องเงินเฟ้อ`},
      sources:[{l:"Investing.com — Germany 30",u:"https://www.investing.com/indices/germany-30"},{l:"Trading Economics — Germany",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"63,492.99", chg:-0.81, series:[64011.34,63492.99],
      txt:{en:`<b>Nikkei 225 fell 0.81% (-518.35 pts) to 63,492.99 Monday,</b> a fresh multi-week low, as the weekend's AI-slowdown warnings ran through a full session and hit chip and AI-supply-chain names hardest.`, th:`<b>Nikkei 225 ลดลง 0.81% (-518.35 จุด) สู่ 63,492.99 วันจันทร์</b> จุดต่ำสุดใหม่ในรอบหลายสัปดาห์ ขณะคำเตือนชะลอ AI ช่วงสุดสัปดาห์ดำเนินต่อเนื่องเต็มเซสชัน และกระทบหุ้นกลุ่มชิปและซัพพลายเชน AI หนักที่สุด`},
      why:{en:`A confirmed close below 63,500 — rather than just an early-trade dip — shows the AI-slowdown selloff had real staying power through the full session, not just a knee-jerk open. With chipmakers among Tokyo's most AI-capex-sensitive names, watch whether Tuesday's trade stabilizes or extends the decline as the region also digests the fresh US yield spike.`, th:`การที่ปิดตลาดต่ำกว่า 63,500 อย่างยืนยันแล้ว — ไม่ใช่แค่การร่วงในช่วงเช้าเท่านั้น — แสดงว่าแรงเทขายจากคำเตือนชะลอ AI มีความคงทนจริงตลอดเซสชัน ไม่ใช่แค่ปฏิกิริยาฉับพลันช่วงเปิดตลาด เนื่องจากหุ้นกลุ่มชิปเป็นหุ้นที่อ่อนไหวต่อการลงทุน AI มากที่สุดของโตเกียว ควรจับตาว่าการซื้อขายวันอังคารจะทรงตัวหรือปรับลงต่อ ขณะภูมิภาคยังต้องรับมือกับผลตอบแทนพันธบัตรสหรัฐฯ ที่พุ่งขึ้นรอบใหม่ด้วย`},
      full:{en:`Japanese equities fell Monday, with the Nikkei 225 down 0.81% (-518.35 points) to close at 63,492.99, its lowest level in several weeks. The decline came as the weekend's AI-slowdown warnings from Anthropic's Dario Amodei and OpenAI's Sam Altman ran through a full trading session, hitting chip and AI-supply-chain names hardest, while elevated oil prices and a fresh spike in US Treasury yields — the 10-year touched 5.01% intraday — added to the pressure on risk assets. The move confirmed early Monday's roughly 1.7% pre-open decline as a genuine full-session selloff rather than a one-off futures reaction.`, th:`หุ้นญี่ปุ่นปรับลงวันจันทร์ ดัชนี Nikkei 225 ลดลง 0.81% (-518.35 จุด) ปิดที่ 63,492.99 ต่ำสุดในรอบหลายสัปดาห์ การปรับลงนี้เกิดขึ้นขณะคำเตือนชะลอ AI ช่วงสุดสัปดาห์จากดาริโอ อโมเดอีแห่ง Anthropic และแซม อัลต์แมนแห่ง OpenAI ดำเนินต่อเนื่องเต็มเซสชันการซื้อขาย กระทบหุ้นกลุ่มชิปและซัพพลายเชน AI หนักที่สุด ขณะราคาน้ำมันที่สูงและผลตอบแทนพันธบัตรสหรัฐฯ ที่พุ่งขึ้นรอบใหม่ — 10 ปีแตะ 5.01% ระหว่างวัน — เพิ่มแรงกดดันต่อสินทรัพย์เสี่ยง การเคลื่อนไหวนี้ยืนยันว่าการปรับลงราว 1.7% ก่อนตลาดเปิดเมื่อเช้าวันจันทร์เป็นแรงเทขายเต็มเซสชันจริง ไม่ใช่แค่ปฏิกิริยาของฟิวเจอร์สเพียงชั่วครู่`},
      sources:[{l:"News On Japan — Nikkei falls on AI slowdown fears",u:"https://newsonjapan.com/article/150749.php"},{l:"Trading Economics — Japan",u:"https://tradingeconomics.com/japan/stock-market"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,687.00", chg:-0.48, series:[24805.63,24687.00],
      txt:{en:`<b>Hang Seng fell 0.48% (-118 pts) to 24,687 Monday, its fourth straight losing session, while the Shanghai Composite eased just 0.07% to 3,885</b> — a much smaller move than Hong Kong's, as mainland-specific weakness that had dragged Shanghai lower gave way to Hong Kong's AI/tech-heavy index bearing the brunt of the global chip selloff.`, th:`<b>Hang Seng ลดลง 0.48% (-118 จุด) สู่ 24,687 วันจันทร์ ปรับลงเป็นเซสชันที่สี่ติดต่อกัน ขณะ Shanghai Composite ลดลงเพียง 0.07% สู่ 3,885</b> — การปรับลงที่เบากว่าฮ่องกงมาก โดยความอ่อนแอเฉพาะของจีนแผ่นดินใหญ่ที่เคยฉุดเซี่ยงไฮ้คลี่คลายลง ขณะดัชนีฮ่องกงที่มีสัดส่วนหุ้นเทค/AI สูงต้องรับแรงเทขายชิปทั่วโลกเต็มๆ`},
      why:{en:`Hong Kong now underperforming Shanghai — a reversal from last week — confirms the current selloff is being driven by AI/tech exposure (which the Hang Seng carries more of) rather than mainland growth concerns. A fourth straight losing session for Hong Kong is also worth flagging: this is no longer a one-day wobble.`, th:`การที่ฮ่องกงปรับลงมากกว่าเซี่ยงไฮ้ในรอบนี้ — สวนทางกับสัปดาห์ก่อน — ยืนยันว่าแรงเทขายรอบนี้ขับเคลื่อนโดยความเสี่ยงหุ้นกลุ่ม AI/เทค (ซึ่ง Hang Seng มีสัดส่วนมากกว่า) มากกว่าความกังวลด้านการเติบโตของจีนแผ่นดินใหญ่ การที่ฮ่องกงปรับลงติดต่อกันเป็นเซสชันที่สี่ก็ควรแจ้งเตือนเช่นกัน — นี่ไม่ใช่แค่การสั่นไหววันเดียวอีกต่อไป`},
      full:{en:`Hong Kong and mainland China diverged Monday: the Hang Seng fell 0.48% (-118 points) to close at 24,687, its fourth consecutive losing session, as rising crude prices and renewed global rate concerns weighed on sentiment, with the decline led by technology and AI-linked names. The Shanghai Composite, by contrast, eased just 0.07% to 3,885, a far milder move that suggests mainland-specific pressures have largely stabilized even as the AI-slowdown story continues to weigh on Hong Kong's tech-heavy index.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่เคลื่อนไหวสวนทางกันวันจันทร์: ดัชนี Hang Seng ลดลง 0.48% (-118 จุด) ปิดที่ 24,687 ปรับลงติดต่อกันเป็นเซสชันที่สี่ ขณะราคาน้ำมันดิบที่สูงขึ้นและความกังวลเรื่องอัตราดอกเบี้ยโลกรอบใหม่กดดันบรรยากาศการลงทุน โดยการปรับลงนำโดยหุ้นกลุ่มเทคโนโลยีและ AI ในทางตรงข้าม ดัชนี Shanghai Composite ลดลงเพียง 0.07% สู่ 3,885 ซึ่งเป็นการเคลื่อนไหวที่เบากว่ามาก บ่งชี้ว่าแรงกดดันเฉพาะของจีนแผ่นดินใหญ่ทรงตัวแล้วเป็นส่วนใหญ่ แม้เรื่องราวชะลอ AI จะยังกดดันดัชนีฮ่องกงที่มีสัดส่วนหุ้นเทคสูงต่อไป`},
      sources:[{l:"Sunday Guardian — Hang Seng Sept 14",u:"https://sundayguardianlive.com/business/hang-seng-index-today-september-14-hong-kong-stocks-under-pressure-as-ai-shares-slide-and-oil-prices-rise-check-why-markets-are-falling-and-which-stocks-gained-284353/"},{l:"Trading Economics — China",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,591.07", chg:-0.84, series:[1604.52,1591.07],
      txt:{en:`<b>SET Index fell 0.84% to 1,591.07 Monday (-13.45pts),</b> on turnover of about THB 61.89bn, as selling pressure in electronics bellwether DELTA and its peers tracked a global tech-linked selloff, alongside concerns over the Fed's rate direction and elevated bond yields.`, th:`<b>ดัชนี SET ลดลง 0.84% สู่ 1,591.07 วันจันทร์ (-13.45 จุด)</b> มูลค่าการซื้อขายราว 6.189 หมื่นล้านบาท จากแรงเทขายหุ้น DELTA และหุ้นกลุ่มอิเล็กทรอนิกส์ที่เคลื่อนไหวตามแรงเทขายหุ้นเทคทั่วโลก ควบคู่กับความกังวลเรื่องทิศทางดอกเบี้ยเฟดและผลตอบแทนพันธบัตรที่สูง`},
      why:{en:`A DELTA-led, electronics-specific decline — Thailand's version of the global AI-supply-chain selloff hitting Japan and Korea — shows the Thai market isn't insulated from the tech story even though it's a small piece of the SET. Watch whether the sell-off broadens beyond electronics if global yields stay elevated into Wednesday's Fed decision.`, th:`การปรับลงที่นำโดย DELTA และหุ้นกลุ่มอิเล็กทรอนิกส์โดยเฉพาะ — ซึ่งเป็นเวอร์ชันไทยของแรงเทขายซัพพลายเชน AI ทั่วโลกที่กระทบญี่ปุ่นและเกาหลี — แสดงว่าตลาดไทยไม่ได้แยกขาดจากเรื่องราวหุ้นเทค แม้จะเป็นสัดส่วนเล็กในดัชนี SET ควรจับตาว่าแรงเทขายจะขยายวงกว้างเกินกลุ่มอิเล็กทรอนิกส์หรือไม่ หากผลตอบแทนพันธบัตรโลกยังคงสูงต่อเนื่องจนถึงการตัดสินใจของเฟดวันพุธ`},
      full:{en:`Thailand's SET Index closed Monday at 1,591.07, down 13.45 points (-0.84%), on turnover of about THB 61.89 billion, as selling pressure in electronics bellwether DELTA and related names tracked a broader global downtrend in technology shares tied to the AI-slowdown story. Concerns over the direction of Wednesday's Fed decision and still-elevated global bond yields — the 10-year US Treasury touched 5.01% intraday — added to the cautious tone. Attention now turns to whether the electronics-led weakness broadens or stabilizes as the region digests both the Fed's two-day meeting starting Tuesday and the Bank of Japan's Sep 17-18 decision.`, th:`ดัชนี SET ของไทยปิดตลาดวันจันทร์ที่ 1,591.07 ลดลง 13.45 จุด (-0.84%) มูลค่าการซื้อขายราว 6.189 หมื่นล้านบาท จากแรงเทขายหุ้น DELTA ซึ่งเป็นหุ้นอิเล็กทรอนิกส์นำตลาด และหุ้นที่เกี่ยวข้อง ซึ่งเคลื่อนไหวตามแนวโน้มขาลงของหุ้นเทคโนโลยีทั่วโลกที่เชื่อมโยงกับเรื่องราวชะลอ AI ความกังวลเรื่องทิศทางการตัดสินใจของเฟดวันพุธและผลตอบแทนพันธบัตรโลกที่ยังสูง — พันธบัตรสหรัฐฯ 10 ปีแตะ 5.01% ระหว่างวัน — เพิ่มบรรยากาศระมัดระวัง ตอนนี้ต้องจับตาว่าความอ่อนแอที่นำโดยกลุ่มอิเล็กทรอนิกส์จะขยายวงหรือทรงตัว ขณะภูมิภาคย่อยข้อมูลทั้งการประชุมเฟดสองวันที่เริ่มวันอังคาร และการตัดสินใจของ BOJ วันที่ 17-18 ก.ย.`},
      sources:[{l:"Kaohoon International — Market Roundup 14 Sep",u:"https://www.kaohooninternational.com/markets/590667"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil stayed elevated Monday on Saudi Arabia's East-West pipeline shutdown — Brent settled up 3.6% at $108.34/bbl, WTI at $102.42 — but both pulled back from an earlier four-month high near $105 WTI after Trump said Russia and Ukraine had agreed to pause strikes on energy infrastructure. Gold fell 1.25% to $4,284.48/oz,</b> its lowest since August, as high yields and a firm dollar outweighed AI-selloff safe-haven demand.`, th:`<b>น้ำมันยังคงยืนสูงวันจันทร์จากการปิดท่อขนส่งน้ำมัน East-West ของซาอุดีอาระเบีย — เบรนท์ปิดเพิ่มขึ้น 3.6% สู่ $108.34 ต่อบาร์เรล, WTI ที่ $102.42 — แต่ทั้งสองย่อตัวลงจากจุดสูงสุดในรอบสี่เดือนที่ WTI เคยแตะใกล้ $105 หลังทรัมป์ระบุว่ารัสเซียและยูเครนตกลงยุติการโจมตีโครงสร้างพื้นฐานด้านพลังงาน ทองคำลดลง 1.25% สู่ $4,284.48 ต่อออนซ์</b> ต่ำสุดตั้งแต่เดือนสิงหาคม เมื่อผลตอบแทนพันธบัตรที่สูงและดอลลาร์ที่แข็งค่ามีน้ำหนักมากกว่าความต้องการสินทรัพย์ปลอดภัยจากแรงเทขาย AI`},
     why:{en:`Gold falling even as equities sell off for a second day is the clearest signal yet that this remains a rates-driven market, not a fear-driven one — real yields near multi-year highs are simply too attractive an alternative. The Russia-Ukraine energy-infrastructure truce is also worth flagging: it's the first concrete de-escalation lever on oil's supply-shock premium, and a real risk to any client positioned for oil to keep climbing.`, th:`การที่ทองคำปรับลงแม้หุ้นจะเทขายต่อเนื่องเป็นวันที่สอง คือสัญญาณที่ชัดเจนที่สุดว่าตลาดยังคงถูกขับเคลื่อนโดยอัตราดอกเบี้ยมากกว่าความกลัว — ผลตอบแทนพันธบัตรที่แท้จริงใกล้จุดสูงสุดในรอบหลายปีเป็นทางเลือกที่น่าดึงดูดเกินไปสำหรับนักลงทุน การสงบศึกโจมตีโครงสร้างพื้นฐานด้านพลังงานระหว่างรัสเซีย-ยูเครนก็ควรแจ้งเตือนเช่นกัน — นี่คือกลไกคลี่คลายสถานการณ์ที่เป็นรูปธรรมครั้งแรกต่อพรีเมียมช็อกอุปทานน้ำมัน และเป็นความเสี่ยงจริงต่อลูกค้าที่วางสถานะรับว่าน้ำมันจะไต่ขึ้นต่อ`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The Fed's two-day FOMC meeting begins today, with CME FedWatch pricing roughly 88% odds of a quarter-point hike Wednesday — little changed from Friday.</b> The 10-year Treasury yield touched 5.01% intraday Monday, a fresh multi-year high, before easing to close near 4.96%, while the 2-year hit 4.66%, its highest since mid-2024. A day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting — a rare back-to-back week for the world's two most-watched central banks, now set against a full-session AI-slowdown selloff hitting growth-sensitive tech.`, th:`<b>การประชุม FOMC สองวันของเฟดเริ่มต้นวันนี้ โดย CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ย 0.25% วันพุธไว้ที่ราว 88% เปลี่ยนแปลงเพียงเล็กน้อยจากวันศุกร์</b> ผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวันจันทร์ จุดสูงสุดใหม่ในรอบหลายปี ก่อนย่อตัวปิดใกล้ 4.96% ขณะพันธบัตร 2 ปีแตะ 4.66% สูงสุดตั้งแต่กลางปี 2024 หนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก ซึ่งตอนนี้เกิดขึ้นท่ามกลางแรงเทขายจากคำเตือนชะลอ AI เต็มเซสชันที่กระทบหุ้นเทคที่อ่อนไหวต่อการเติบโต`},
     why:{en:`With hike odds steady near 88% even after a fresh yield spike, the market is telling you the hike itself is essentially locked in — the real event risk Wednesday is the dot plot and Powell's tone on the path beyond September. The 2-year at a mid-2024 high says the market sees more tightening ahead, not less; have both a "hawkish hold" and "hike-and-pause" scenario ready, with BOJ a second live risk right behind it.`, th:`เมื่อโอกาสขึ้นดอกเบี้ยยืนใกล้ 88% แม้ผลตอบแทนพันธบัตรจะพุ่งขึ้นรอบใหม่ ตลาดกำลังบอกว่าการขึ้นดอกเบี้ยเองแทบจะถูกกำหนดไว้แล้ว — ความเสี่ยงที่แท้จริงของวันพุธคือ dot plot และน้ำเสียงของพาวเวลล์เรื่องทิศทางหลังเดือนกันยายน การที่พันธบัตร 2 ปีขึ้นสู่จุดสูงสุดตั้งแต่กลางปี 2024 บ่งชี้ว่าตลาดมองว่ายังมีการคุมเข้มอีกในอนาคต ไม่ใช่น้อยลง ควรเตรียมสถานการณ์ทั้ง "คงดอกเบี้ยแบบสายเหยี่ยว" และ "ขึ้นแล้วหยุดพัก" ให้พร้อม โดยมี BOJ เป็นความเสี่ยงที่สองตามมาติดๆ`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Trump's pressure campaign on the Fed continues even as hike odds hold near 88%, with the Vice President and Treasury Secretary still urging a hold or cut. But Monday brought a different kind of Trump intervention: the President said Russia and Ukraine had agreed to pause strikes on each other's energy infrastructure, helping pull oil back from an earlier four-month high near $105 WTI. Section 338 tariffs remain in effect and the ~7.5% China "overcapacity" tariff still looms ahead of a planned Trump-Xi summit.`, th:`แคมเปญกดดันเฟดของทรัมป์ยังดำเนินต่อ แม้โอกาสขึ้นดอกเบี้ยจะยืนใกล้ 88% โดยรองประธานาธิบดีและรัฐมนตรีคลังยังคงเรียกร้องให้คงหรือลดดอกเบี้ย แต่วันจันทร์มีการแทรกแซงของทรัมป์ในรูปแบบอื่น: ประธานาธิบดีระบุว่ารัสเซียและยูเครนตกลงยุติการโจมตีโครงสร้างพื้นฐานด้านพลังงานของกันและกัน ช่วยดึงราคาน้ำมันกลับลงจากจุดสูงสุดในรอบสี่เดือนที่ WTI เคยแตะใกล้ $105 มาตรการภาษีมาตรา 338 ยังคงมีผลบังคับใช้ และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้`}, w:{en:`A Trump-brokered energy truce capping oil's supply-shock premium is a genuinely new variable — it means the Saudi pipeline story is no longer the only lever on crude, and clients hedged purely for oil to keep climbing should reassess. On rates, hike odds holding steady near 88% despite continued White House pressure confirms political jawboning still isn't moving pricing.`, th:`การสงบศึกด้านพลังงานที่ทรัมป์มีส่วนผลักดัน ซึ่งช่วยกดพรีเมียมช็อกอุปทานน้ำมัน คือตัวแปรใหม่ที่แท้จริง — หมายความว่าเรื่องราวท่อน้ำมันซาอุฯ ไม่ใช่ปัจจัยเดียวที่กำหนดราคาน้ำมันดิบอีกต่อไป ลูกค้าที่ป้องกันความเสี่ยงโดยเชื่อว่าน้ำมันจะไต่ขึ้นต่อควรประเมินใหม่ ด้านดอกเบี้ย การที่โอกาสขึ้นดอกเบี้ยยืนใกล้ 88% แม้ทำเนียบขาวจะกดดันต่อเนื่อง ยืนยันว่าแรงกดดันทางการเมืองยังไม่มีผลต่อการตั้งราคาตลาด`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Two competing geopolitical threads moved oil in opposite directions Monday. Saudi Arabia's East-West pipeline — its main workaround for the blocked Strait of Hormuz, carrying close to 4% of global oil supply — remained shut after a drone attack, keeping Brent and WTI both elevated (Brent $108.34, +3.6%). But President Trump said Russia and Ukraine had agreed to pause strikes on each other's energy infrastructure, pulling both benchmarks back from an earlier four-month high near $105 WTI.`, th:`สองประเด็นภูมิรัฐศาสตร์ที่ขัดแย้งกันดันราคาน้ำมันไปคนละทิศทางวันจันทร์ ท่อขนส่งน้ำมัน East-West ของซาอุดีอาระเบีย — เส้นทางสำรองหลักเพื่อเลี่ยงช่องแคบฮอร์มุซที่ปิดกั้นอยู่ ซึ่งขนส่งน้ำมันเกือบ 4% ของอุปทานโลก — ยังคงปิดตัวหลังถูกโดรนโจมตี ทำให้เบรนท์และ WTI ยืนสูงต่อเนื่อง (เบรนท์ $108.34 +3.6%) แต่ประธานาธิบดีทรัมป์ระบุว่ารัสเซียและยูเครนตกลงยุติการโจมตีโครงสร้างพื้นฐานด้านพลังงานของกันและกัน ดึงราคาทั้งสองเกณฑ์มาตรฐานกลับลงจากจุดสูงสุดในรอบสี่เดือนที่ WTI เคยแตะใกล้ $105`}, w:{en:`Two offsetting geopolitical shocks in one session — a Saudi supply disruption and a Russia-Ukraine de-escalation — is a reminder to clients that oil's risk premium right now is genuinely two-sided, not a one-way bet on further Middle East escalation. Watch whether the energy truce holds; a breakdown would remove the one factor currently capping Brent's advance.`, th:`ช็อกภูมิรัฐศาสตร์สองเรื่องที่หักล้างกันในเซสชันเดียว — การหยุดชะงักของอุปทานจากซาอุฯ และการคลี่คลายสถานการณ์รัสเซีย-ยูเครน — เป็นเครื่องเตือนใจลูกค้าว่าพรีเมียมความเสี่ยงของน้ำมันตอนนี้เป็นสองทิศทางจริง ไม่ใช่การเดิมพันทางเดียวว่าความตึงเครียดตะวันออกกลางจะทวีความรุนแรงต่อไป ควรจับตาว่าการสงบศึกด้านพลังงานจะยืนได้หรือไม่ หากล่มลงจะดึงปัจจัยเดียวที่กำลังกดการปรับขึ้นของเบรนท์ออกไป`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The Fed's two-day FOMC meeting begins today, with CME FedWatch pricing roughly 88% odds of a quarter-point hike Wednesday — barely moved from Friday even after Monday's 10-year yield spike to 5.01% intraday and the 2-year's rise to 4.66%, a mid-2024 high. A day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting — a rare back-to-back week for the two most-watched central banks — now set against a full-session AI-slowdown selloff in growth-sensitive tech.`, th:`การประชุม FOMC สองวันของเฟดเริ่มต้นวันนี้ โดย CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ย 0.25% วันพุธไว้ที่ราว 88% แทบไม่เปลี่ยนแปลงจากวันศุกร์ แม้ผลตอบแทนพันธบัตร 10 ปีจะพุ่งแตะ 5.01% ระหว่างวันจันทร์ และพันธบัตร 2 ปีขึ้นสู่ 4.66% สูงสุดตั้งแต่กลางปี 2024 หนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก ซึ่งตอนนี้เกิดขึ้นท่ามกลางแรงเทขายจากคำเตือนชะลอ AI เต็มเซสชันในหุ้นเทคที่อ่อนไหวต่อการเติบโต`}, w:{en:`Odds barely budging despite a fresh cycle-high yield print tells you the hike is close to fully priced — the real swing factor is whether the Fed's tone (and BOJ's a day later) leans hawkish enough to compound the AI-driven growth scare, or whether Wednesday's dot plot offers some balance. Have both a "hawkish hold" and "hike-and-pause" scenario ready for clients, and flag BOJ as a second live risk.`, th:`การที่โอกาสแทบไม่ขยับแม้ผลตอบแทนพันธบัตรจะแตะจุดสูงสุดใหม่ของรอบ บ่งชี้ว่าการขึ้นดอกเบี้ยเกือบถูกสะท้อนในราคาตลาดไปแล้ว — ปัจจัยชี้ขาดจริงคือน้ำเสียงของเฟด (และ BOJ ในวันถัดมา) จะสายเหยี่ยวมากพอจนซ้ำเติมความกังวลด้านการเติบโตจาก AI หรือไม่ หรือ dot plot วันพุธจะช่วยสร้างสมดุลได้บ้าง ควรเตรียมสถานการณ์ทั้ง "คงดอกเบี้ยแบบสายเหยี่ยว" และ "ขึ้นแล้วหยุดพัก" ให้ลูกค้า และแจ้งเตือนว่า BOJ คือความเสี่ยงที่สองที่ต้องจับตา`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`No new CPI data has landed since Friday's hotter-than-expected core reading, but the market's inflation read is now coming from bond yields rather than data: the 10-year touched 5.01% intraday Monday and the 2-year hit 4.66%, both fresh multi-year highs, while oil stayed elevated on the Saudi pipeline shutdown even after paring gains on the Russia-Ukraine energy truce.`, th:`ยังไม่มีตัวเลข CPI ใหม่นับตั้งแต่ Core CPI ที่ร้อนแรงกว่าคาดวันศุกร์ แต่การอ่านสัญญาณเงินเฟ้อของตลาดตอนนี้มาจากผลตอบแทนพันธบัตรมากกว่าตัวข้อมูล: พันธบัตร 10 ปีแตะ 5.01% ระหว่างวันจันทร์ และพันธบัตร 2 ปีแตะ 4.66% ทั้งคู่เป็นจุดสูงสุดใหม่ในรอบหลายปี ขณะน้ำมันยังคงยืนสูงจากการปิดท่อของซาอุดีอาระเบีย แม้จะคืนกำไรบางส่วนหลังการสงบศึกด้านพลังงานรัสเซีย-ยูเครน`}, w:{en:`Yields doing the inflation-repricing work in the absence of new data is unusual, and it leaves the Fed's Wednesday dot plot as the next real catalyst rather than a scheduled data release. Frame client conversations around "hike now, hawkish pause" as the base case, with the FOMC's updated inflation projections as the number to watch.`, th:`การที่ผลตอบแทนพันธบัตรทำหน้าที่ปรับราคาเงินเฟ้อแทนในช่วงที่ไม่มีข้อมูลใหม่ถือเป็นเรื่องผิดปกติ และทำให้ dot plot ของเฟดวันพุธเป็นตัวกระตุ้นถัดไปที่แท้จริง มากกว่าการประกาศข้อมูลตามกำหนดการ ควรวางกรอบการสนทนากับลูกค้าโดยยึด "ขึ้นดอกเบี้ยตอนนี้ แล้วหยุดพักแบบสายเหยี่ยว" เป็นกรณีฐาน โดยจับตาตัวเลขประมาณการเงินเฟ้อที่ปรับใหม่ของ FOMC เป็นพิเศษ`}},
  ];

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
