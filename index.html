<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
    <div class="grid g2" id="countrygrid"></div>
    <div class="grid g2" style="margin-top:14px" id="extragrid"></div>
    <div class="rule"></div>
    <div class="sechead"><h2 id="s-themes"></h2></div>
    <div class="grid g4" id="themegrid"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Wall Street Slips as 30-Year Treasury Yield Hits a 19-Year High, Asia Holds Its Record Run", th:"วอลล์สตรีทปรับลง ผลตอบแทนพันธบัตร 30 ปีทำสถิติสูงสุดในรอบ 19 ปี ขณะเอเชียยังรักษาสถิติใหม่"},
    heroDeck:{en:"Wall Street closed lower Monday as long-term Treasury yields surged: the S&P 500 fell 0.52% to 7,745.06, the Dow dropped 0.51% (−273pts) to 53,459.78, and the Nasdaq Composite lost 0.32% to 26,644.91. The real story was bonds: the 30-year Treasury yield jumped past 5.31%, its highest since June 2007, as FOMC minutes and mounting concern over the US budget deficit and AI-related debt issuance pushed the long end higher — Barclays strategists say it's more about deficits and term premium than inflation. The 10-year yield rose to about 4.72% and the 2-year to 4.18%. Oil held steady near $88/bbl, off last week's spike, as US-Iran talks stayed stalled and Hormuz shipping slowed without fresh escalation, while gold ticked up to about $4,436/oz on a softer dollar and Friday's weak retail-sales report. Asia had already closed broadly higher earlier in the day: Japan's Nikkei 225 rose 0.74% to a fresh record near 69,220, Hong Kong's Hang Seng jumped 1.6% to about 25,518, and China's mainland benchmarks added roughly 1.4%. Thailand's SET Index gained about 1.05% to near 1,626. Europe held near record highs, with the DAX little changed around 26,440. Trump's threatened 50% tariff on ~$20bn of Canadian goods remains due Wednesday 19 August — talks are reportedly progressing but no deal is signed yet. Home Depot reports earnings Tuesday, kicking off a big retail-earnings week that will test US consumer health after Friday's weak sentiment reading.", th:"วอลล์สตรีทปิดตลาดวันจันทร์ในแดนลบ ขณะผลตอบแทนพันธบัตรระยะยาวพุ่งขึ้น: ดัชนี S&P 500 ลดลง 0.52% สู่ 7,745.06 ดัชนี Dow ลดลง 0.51% (−273 จุด) สู่ 53,459.78 และ Nasdaq Composite ลดลง 0.32% สู่ 26,644.91 เรื่องจริงของวันนี้อยู่ที่ตลาดพันธบัตร: ผลตอบแทนพันธบัตรสหรัฐ 30 ปีพุ่งทะลุ 5.31% สูงสุดตั้งแต่เดือน มิ.ย. 2007 (รอบ 19 ปี) หลังรายงานการประชุมเฟด (FOMC minutes) และความกังวลเรื่องขาดดุลงบประมาณสหรัฐฯ และการออกหนี้ที่เกี่ยวข้องกับ AI ที่เพิ่มขึ้น ผลักดันผลตอบแทนพันธบัตรระยะยาวให้สูงขึ้น — นักกลยุทธ์ของ Barclays ระบุว่าเป็นเรื่องขาดดุลงบประมาณและ term premium มากกว่าเงินเฟ้อ ผลตอบแทนพันธบัตร 10 ปีขยับขึ้นสู่ราว 4.72% และ 2 ปีสู่ราว 4.18% ราคาน้ำมันทรงตัวใกล้ $88 ต่อบาร์เรล ลดลงจากจุดพุ่งสัปดาห์ก่อน ขณะการเจรจาสหรัฐ-อิหร่านยังคงหยุดชะงัก และการขนส่งผ่านช่องแคบฮอร์มุซชะลอตัวโดยไม่มีสถานการณ์ตึงเครียดใหม่ ขณะทองคำขยับขึ้นสู่ราว $4,436 ต่อออนซ์ จากดอลลาร์ที่อ่อนค่าและยอดค้าปลีกที่อ่อนแอวันศุกร์ ก่อนหน้านี้ตลาดเอเชียปิดบวกเป็นวงกว้าง: Nikkei 225 ญี่ปุ่นขึ้น 0.74% ทำสถิติใหม่ใกล้ 69,220 ฮ่องกง Hang Seng พุ่ง 1.6% สู่ราว 25,518 และดัชนีจีนแผ่นดินใหญ่บวกราว 1.4% ดัชนี SET ไทยขึ้นราว 1.05% สู่ใกล้ 1,626 ยุโรปยังทรงตัวใกล้จุดสูงสุด โดย DAX แทบไม่เปลี่ยนแปลงที่ราว 26,440 ภาษี 50% ของทรัมป์ต่อสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์ยังคงมีผลวันพุธที่ 19 ส.ค. — มีรายงานว่าการเจรจาคืบหน้า แต่ยังไม่มีข้อตกลงที่ลงนาม Home Depot จะรายงานผลประกอบการวันอังคาร เปิดฉากสัปดาห์ผลประกอบการค้าปลีกสำคัญที่จะเป็นบทพิสูจน์สุขภาพผู้บริโภคสหรัฐฯ หลังข้อมูลความเชื่อมั่นที่อ่อนแอเมื่อวันศุกร์"},

    leadtxt:{en:`<b>Wall Street closed lower Monday as the 30-year Treasury yield surged past 5.31% — its highest since June 2007 — stealing the session's attention from equities.</b> The S&P 500 fell 0.52% to 7,745.06, the Dow dropped 0.51% (−273pts) to 53,459.78, and the Nasdaq Composite lost 0.32% to 26,644.91, as investors braced for a heavy retail-earnings week. <b>The 30-year Treasury yield jumped to about 5.31%</b>, a 19-year high, after FOMC minutes and mounting concern over the US budget deficit and AI-related debt issuance pushed long-end yields higher — Barclays strategists say it's more about deficits and term premium than inflation. The 10-year yield rose to about 4.72% and the 2-year to 4.18%. <b>Oil held steady near $88/bbl</b>, off last week's spike, as US-Iran talks stayed stalled without fresh escalation, while <b>gold ticked up to about $4,436/oz</b> on a softer dollar and Friday's weak retail-sales data. Asia had already closed broadly higher earlier in the day: Japan's <b>Nikkei 225 rose 0.74% to a fresh record near 69,220</b>, Hong Kong's Hang Seng jumped <b>1.6% to about 25,518</b>, and China's mainland benchmarks added roughly 1.4%. Thailand's <b>SET Index gained about 1.05% to near 1,626</b>. Europe held near record highs, with the DAX little changed around 26,440. Elsewhere, Trump's threatened 50% tariff on ~$20bn of Canadian goods remains due Wednesday 19 August — talks are reportedly progressing but no deal is signed yet. For your clients: the long end of the US yield curve just hit a level not seen in almost two decades — a strong, timely reason to <b>lock in long bond coupons now</b> before any pullback, while using gold's uptick to keep <b>gold as ballast</b> ahead of Tuesday's Home Depot earnings and Wednesday's tariff deadline.`,
      th:`<b>วอลล์สตรีทปิดตลาดวันจันทร์ในแดนลบ ขณะผลตอบแทนพันธบัตรสหรัฐ 30 ปีพุ่งทะลุ 5.31% สูงสุดตั้งแต่เดือน มิ.ย. 2007 กลายเป็นประเด็นหลักของวัน แซงหน้าตลาดหุ้น</b> ดัชนี S&P 500 ลดลง 0.52% สู่ 7,745.06 ดัชนี Dow ลดลง 0.51% (−273 จุด) สู่ 53,459.78 และ Nasdaq Composite ลดลง 0.32% สู่ 26,644.91 ขณะนักลงทุนเตรียมรับสัปดาห์ผลประกอบการค้าปลีกที่สำคัญ <b>ผลตอบแทนพันธบัตร 30 ปีพุ่งขึ้นสู่ราว 5.31%</b> สูงสุดในรอบ 19 ปี หลังรายงานการประชุมเฟด (FOMC minutes) และความกังวลเรื่องขาดดุลงบประมาณสหรัฐฯ และการออกหนี้ที่เกี่ยวข้องกับ AI ผลักดันผลตอบแทนพันธบัตรระยะยาวให้สูงขึ้น — นักกลยุทธ์ Barclays ระบุว่าเป็นเรื่องขาดดุลงบประมาณและ term premium มากกว่าเงินเฟ้อ ผลตอบแทน 10 ปีขยับขึ้นสู่ราว 4.72% และ 2 ปีสู่ราว 4.18% <b>ราคาน้ำมันทรงตัวใกล้ $88 ต่อบาร์เรล</b> ลดลงจากจุดพุ่งสัปดาห์ก่อน ขณะการเจรจาสหรัฐ-อิหร่านยังคงหยุดชะงักโดยไม่มีสถานการณ์ตึงเครียดใหม่ ขณะ <b>ทองคำขยับขึ้นสู่ราว $4,436 ต่อออนซ์</b> จากดอลลาร์ที่อ่อนค่าและยอดค้าปลีกที่อ่อนแอวันศุกร์ ก่อนหน้านี้ตลาดเอเชียปิดบวกเป็นวงกว้าง: <b>Nikkei 225 ญี่ปุ่นขึ้น 0.74% ทำสถิติใหม่ใกล้ 69,220</b> ฮ่องกง <b>Hang Seng พุ่ง 1.6% สู่ราว 25,518</b> และดัชนีจีนแผ่นดินใหญ่บวกราว 1.4% <b>ดัชนี SET ไทยขึ้นราว 1.05% สู่ใกล้ 1,626</b> ยุโรปยังทรงตัวใกล้จุดสูงสุด โดย DAX แทบไม่เปลี่ยนแปลงที่ราว 26,440 นอกจากนี้ ภาษี 50% ของทรัมป์ต่อสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์ยังคงมีผลวันพุธที่ 19 ส.ค. — มีรายงานว่าการเจรจาคืบหน้า แต่ยังไม่มีข้อตกลงที่ลงนาม สำหรับลูกค้าของคุณ: ปลายเส้นอัตราผลตอบแทนพันธบัตรสหรัฐฯ เพิ่งทำระดับที่ไม่เคยเห็นมาเกือบสองทศวรรษ เป็นเหตุผลที่ดีและทันเหตุการณ์ให้ <b>ล็อกคูปองพันธบัตรระยะยาวตอนนี้</b> ก่อนที่จะมีการย่อตัว และใช้จังหวะที่ทองคำขยับขึ้นเพื่อคง <b>ทองคำเป็นตัวถ่วงพอร์ต</b> ก่อนผลประกอบการ Home Depot วันอังคาร และเส้นตายภาษีวันพุธ`},

      txt:{en:`<b>Wall Street closed lower Monday (S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32%),</b> as the real story shifted to bonds: the 30-year Treasury yield surged past 5.31%, its highest since June 2007, on deficit and AI-debt-issuance concerns. A heavy retail-earnings week looms: Home Depot (Tue), Target and Lowe's (Wed), Walmart (Thu).`, th:`<b>วอลล์สตรีทปิดตลาดวันจันทร์ในแดนลบ (S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32%)</b> ขณะประเด็นหลักย้ายไปที่ตลาดพันธบัตร: ผลตอบแทนพันธบัตร 30 ปีพุ่งทะลุ 5.31% สูงสุดตั้งแต่เดือน มิ.ย. 2007 จากความกังวลขาดดุลงบประมาณและการออกหนี้ที่เกี่ยวข้องกับ AI สัปดาห์นี้มีผลประกอบการค้าปลีกสำคัญ: Home Depot (อังคาร) Target และ Lowe's (พุธ) Walmart (พฤหัสฯ)`},
      why:{en:`Long-end yields at a nearly 20-year high, even as short-term hike odds fade, is a rare and time-limited window to lock in long bond coupons for income-seeking clients — a stronger pitch than a typical up/down equity session.`, th:`ผลตอบแทนพันธบัตรระยะยาวขึ้นสู่ระดับสูงสุดในรอบเกือบ 20 ปี แม้โอกาสขึ้นดอกเบี้ยระยะสั้นจะลดลง เป็นจังหวะที่หาได้ยากและมีเวลาจำกัดให้ล็อกคูปองพันธบัตรระยะยาวสำหรับลูกค้าที่มองหารายได้ — จุดขายที่แข็งกว่าเซสชันหุ้นขึ้นลงทั่วไป`},
      full:{en:`Wall Street closed lower Monday, giving back Monday morning's AI-driven premarket optimism (Nasdaq-100 futures had been up about 0.5% on Anthropic's reported ~$190–200bn 2028 revenue forecast ahead of a planned IPO). By the close, the S&P 500 fell 0.52% (−40.70pts) to 7,745.06, the Dow dropped 0.51% (−272.63pts) to 53,459.78, and the Nasdaq Composite lost 0.32% (−84.25pts) to 26,644.91. The session's real driver was the bond market: the 30-year Treasury yield surged more than 4 basis points to 5.311%, its highest level since June 2007 — a 19-year high — after FOMC minutes from the July meeting and mounting concern over the US budget deficit, high Treasury issuance and AI-related debt supply pushed long-end yields higher. Barclays strategists said the move is less about inflation and more about the deficit, issuance and rising term premiums. The 10-year Treasury yield rose to about 4.724% and the 2-year to about 4.182%. Oil held roughly steady near $88/bbl — off last week's spike — as US-Iran talks stayed stalled and Hormuz shipping slowed without fresh escalation. University of Michigan data released Friday showed consumer sentiment at 51.0 and year-ahead inflation expectations above 4% for a fifth straight month. Investors are bracing for a heavy retail-earnings week: Home Depot (Tue), Target and Lowe's (Wed), and Walmart (Thu) — a key read on whether the US consumer is holding up.`, th:`วอลล์สตรีทปิดตลาดวันจันทร์ในแดนลบ คืนความหวังจากดัชนีล่วงหน้าช่วงเช้าที่ได้แรงหนุนหุ้นเทค AI (ดัชนีล่วงหน้า Nasdaq-100 เคยขึ้นราว 0.5% จากรายงานคาดการณ์รายได้ปี 2028 ของ Anthropic ที่ราว 1.9–2 แสนล้านดอลลาร์ ก่อนแผน IPO) เมื่อถึงช่วงปิดตลาด ดัชนี S&P 500 ลดลง 0.52% (−40.70 จุด) สู่ 7,745.06 ดัชนี Dow ลดลง 0.51% (−272.63 จุด) สู่ 53,459.78 และ Nasdaq Composite ลดลง 0.32% (−84.25 จุด) สู่ 26,644.91 ปัจจัยขับเคลื่อนแท้จริงของเซสชันนี้คือตลาดพันธบัตร: ผลตอบแทนพันธบัตร 30 ปีพุ่งขึ้นกว่า 4 basis points สู่ 5.311% สูงสุดตั้งแต่เดือน มิ.ย. 2007 — สูงสุดในรอบ 19 ปี — หลังรายงานการประชุมเฟด (FOMC minutes) เดือน ก.ค. และความกังวลเรื่องขาดดุลงบประมาณสหรัฐฯ การออกพันธบัตรจำนวนมาก และหนี้ที่เกี่ยวข้องกับ AI ผลักดันผลตอบแทนพันธบัตรระยะยาวให้สูงขึ้น นักกลยุทธ์ Barclays ระบุว่าการเคลื่อนไหวนี้เป็นเรื่องขาดดุลงบประมาณ การออกหนี้ และ term premium ที่สูงขึ้น มากกว่าเรื่องเงินเฟ้อ ผลตอบแทนพันธบัตร 10 ปีขยับขึ้นสู่ราว 4.724% และ 2 ปีสู่ราว 4.182% ราคาน้ำมันทรงตัวใกล้ $88 ต่อบาร์เรล ลดลงจากจุดพุ่งสัปดาห์ก่อน ขณะการเจรจาสหรัฐ-อิหร่านยังคงหยุดชะงัก และการขนส่งผ่านช่องแคบฮอร์มุซชะลอตัวโดยไม่มีสถานการณ์ตึงเครียดใหม่ ข้อมูลของ University of Michigan ที่เผยแพร่วันศุกร์แสดงความเชื่อมั่นผู้บริโภคอยู่ที่ 51.0 และคาดการณ์เงินเฟ้อ 1 ปีข้างหน้าอยู่เหนือ 4% เป็นเดือนที่ 5 ติดต่อกัน นักลงทุนกำลังเตรียมรับสัปดาห์ผลประกอบการค้าปลีกสำคัญ: Home Depot (อังคาร) Target และ Lowe's (พุธ) และ Walmart (พฤหัสฯ) — ตัวชี้วัดสำคัญว่าผู้บริโภคสหรัฐฯ ยังแข็งแกร่งหรือไม่`},
      sources:[{l:"CNBC",u:"https://www.cnbc.com/2026/08/17/treasury-yields-federal-reserve-fomc-minutes.html"},{l:"Yahoo Finance",u:"https://finance.yahoo.com/markets/live/stock-market-today-monday-august-17-dow-sp-500-nasdaq-094421171.html"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,443", chg:0.50, series:[26311,26443],
      txt:{en:`<b>DAX holding flat near its record around 26,440 Monday,</b> as broader Europe ticks higher (STOXX 600 +0.2%) on fading Fed-hike bets and a softer dollar lifting gold. Europe Inc.'s best earnings growth in four years keeps the region's record run intact.`, th:`<b>DAX ทรงตัวใกล้จุดสูงสุดที่ราว 26,440 วันจันทร์</b> ขณะยุโรปในภาพรวมปรับขึ้นเล็กน้อย (STOXX 600 +0.2%) จากโอกาสเฟดขึ้นดอกเบี้ยที่ลดลงและดอลลาร์ที่อ่อนค่าหนุนทองคำ ผลประกอบการบริษัทยุโรปที่แข็งแกร่งสุดในรอบ 4 ปี ยังหนุนให้ตลาดทำสถิติใหม่ต่อเนื่อง`},
      why:{en:`"Europe banks" is a favoured global theme — relevant for diversified equity-fund conversations.`, th:`"ธนาคารยุโรป" เป็นธีมโลกที่ได้รับความนิยม — ใช้คุยเรื่องกองทุนหุ้นแบบกระจายการลงทุนได้`},
      full:{en:`European equities held near record levels Monday. Germany's DAX was reported broadly flat, hovering close to Friday's fresh high near 26,443, while the wider STOXX 600 added about 0.2% as fading Fed rate-hike bets (September odds down to ~30%) and a softer US dollar helped lift gold. European banks and value sectors remain a favoured theme among global strategists, with Europe Inc. reporting its best earnings growth in four years (~17%) and the strongest economic momentum since March 2023.`, th:`หุ้นยุโรปยังทรงตัวใกล้จุดสูงสุดในวันจันทร์ ดัชนี DAX เยอรมนีถูกรายงานว่าแทบไม่เปลี่ยนแปลง ทรงตัวใกล้จุดสูงสุดใหม่ที่ราว 26,443 จากวันศุกร์ ขณะ STOXX 600 ในภาพรวมบวกราว 0.2% จากโอกาสเฟดขึ้นดอกเบี้ยที่ลดลง (เดือน ก.ย. เหลือราว 30%) และดอลลาร์ที่อ่อนค่าช่วยหนุนทองคำ หุ้นกลุ่มธนาคารยุโรปและหุ้นคุณค่ายังเป็นธีมที่นักกลยุทธ์ทั่วโลกชื่นชอบ ขณะผลประกอบการบริษัทยุโรปแข็งแกร่งสุดในรอบ 4 ปี (ราว 17%) และแรงส่งเศรษฐกิจแข็งแกร่งสุดตั้งแต่เดือน มี.ค. 2023`},
      sources:[{l:"CNBC Markets",u:"https://www.cnbc.com/markets/"},{l:"Reuters via KFGO",u:"https://kfgo.com/2026/08/17/european-shares-tick-higher-as-easing-fed-hike-bets-lift-gold/"},{l:"Bloomberg Europe",u:"https://www.bloomberg.com/europe"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"69,220", chg:0.74, series:[68714,69220],
      txt:{en:`<b>Nikkei closed +0.74% at a fresh record near 69,220,</b> extending its tech and AI-infrastructure rally (Kioxia, SoftBank) even as the BOJ is seen eyeing a September rate hike.`, th:`<b>Nikkei ปิด +0.74% ทำสถิติใหม่ใกล้ 69,220</b> หุ้นเทคและโครงสร้างพื้นฐาน AI ยังปรับขึ้นต่อเนื่อง (Kioxia, SoftBank) แม้ตลาดจะจับตา BOJ ที่อาจขึ้นดอกเบี้ยเดือน ก.ย.`},
      why:{en:`Asian semiconductor demand is a live story — it feeds the UUSTECH tech-fund pitch below.`, th:`ดีมานด์เซมิคอนดักเตอร์เอเชียเป็นเรื่องที่กำลังมา — เชื่อมโยงกับการนำเสนอกองทุนเทค UUSTECH ด้านล่าง`},
      full:{en:`Japan again led Asia Monday, with the Nikkei 225 closing about 0.74% higher at a fresh record near 69,220 on continued technology and AI-infrastructure strength, led by Kioxia and SoftBank Group, and further lifted by Anthropic's reported ~$190–200bn 2028 revenue forecast feeding the broader AI-spending narrative. The gain came even as markets weigh a possible Bank of Japan rate hike in September. Asian chip and storage names remain central to the AI growth narrative behind global tech funds.`, th:`ญี่ปุ่นยังโดดเด่นในเอเชียวันจันทร์ ดัชนี Nikkei 225 ปิดบวกราว 0.74% ทำสถิติใหม่ใกล้ 69,220 หนุนจากหุ้นเทคโนโลยีและโครงสร้างพื้นฐาน AI ต่อเนื่อง นำโดย Kioxia และ SoftBank Group และได้แรงหนุนเพิ่มจากรายงานคาดการณ์รายได้ปี 2028 ของ Anthropic ที่ราว 1.9–2 แสนล้านดอลลาร์ ซึ่งตอกย้ำเรื่องราวการใช้จ่ายด้าน AI ในวงกว้าง การปรับขึ้นเกิดขึ้นแม้ตลาดจะจับตาความเป็นไปได้ที่ BOJ จะขึ้นดอกเบี้ยเดือน ก.ย. หุ้นชิปและสตอเรจเอเชียยังเป็นหัวใจของเรื่องราวการเติบโต AI ที่อยู่เบื้องหลังกองทุนเทคทั่วโลก`},
      sources:[{l:"CNBC Asia",u:"https://www.cnbc.com/asia-markets/"},{l:"TradingKey",u:"https://www.tradingkey.com/analysis/stocks/more/262111107-japan-stocks-nikkei-softbank-kioxia-tradingkey"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,518", chg:1.60, series:[25117,25518],
      txt:{en:`<b>Hang Seng closed +1.6% at about 25,518, its tech-led rally intact;</b> mainland benchmarks added roughly 1.4% too, as investors leaned into the AI theme alongside falling Fed rate-hike odds.`, th:`<b>Hang Seng ปิด +1.6% ที่ราว 25,518 โมเมนตัมหุ้นเทคยังแข็งแกร่ง;</b> ดัชนีจีนแผ่นดินใหญ่บวกราว 1.4% เช่นกัน นักลงทุนยังให้น้ำหนักธีม AI ควบคู่กับโอกาสเฟดขึ้นดอกเบี้ยที่ลดลง`},
      why:{en:`A tech-led bounce still sits on top of a tariff overhang — clients may prefer diversified / Asia-ex-China exposure and bonds over single-country bets.`, th:`การดีดตัวที่นำโดยหุ้นเทคยังอยู่บนแรงกดดันภาษีเดิม — ลูกค้าอาจเลือกการกระจายลงทุน / เอเชียไม่รวมจีน และตราสารหนี้ มากกว่าเดิมพันประเทศเดียว`},
      full:{en:`Chinese and Hong Kong equities closed higher Monday, extending their tech-led rally. The Hang Seng rose about 1.6% to close near 25,518, while mainland Chinese benchmarks added roughly 1.4%, helped by the same AI-optimism wave lifting Wall Street futures and Asian tech names more broadly, plus falling Fed rate-hike odds (September odds down to ~30%) easing pressure on risk assets. The rally sits on top of an unresolved US–China tariff overhang (effective US tariff on Chinese goods around 12.5%), which continues to push many investors toward diversified Asia-ex-China strategies and fixed income rather than concentrated single-country exposure.`, th:`หุ้นจีนและฮ่องกงปิดตลาดวันจันทร์แข็งแกร่งขึ้น ต่อเนื่องจากการปรับขึ้นที่นำโดยหุ้นเทค ดัชนี Hang Seng ขึ้นราว 1.6% ปิดใกล้ 25,518 ขณะดัชนีจีนแผ่นดินใหญ่บวกราว 1.4% ได้แรงหนุนจากกระแสความคึกคักของหุ้น AI เดียวกันที่หนุนดัชนีล่วงหน้าสหรัฐฯ และหุ้นเทคเอเชียในวงกว้าง บวกกับโอกาสเฟดขึ้นดอกเบี้ยที่ลดลง (เดือน ก.ย. เหลือราว 30%) ที่ช่วยลดแรงกดดันต่อสินทรัพย์เสี่ยง การปรับขึ้นนี้ยังอยู่บนแรงกดดันภาษีสหรัฐ–จีนที่ยังไม่คลี่คลาย (ภาษีสหรัฐที่เก็บจากสินค้าจีนอยู่ที่ราว 12.5%) ซึ่งยังผลักให้นักลงทุนหันไปหากลยุทธ์เอเชียไม่รวมจีนแบบกระจายความเสี่ยงและตราสารหนี้`},
      sources:[{l:"24/7 Wall St",u:"https://247wallst.com/cards/hong-kong-finished-1-6-higher-buyers-stepping-in-even-as-b-hsi-market-bell-01m07byfbwc7v3tnrdk9ex9qs3"},{l:"Trading Economics",u:"https://tradingeconomics.com/china/stock-market"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,626.02", chg:1.05, series:[1609.06,1626.02],
      txt:{en:`<b>SET Index up 1.05% to about 1,626 by midday Monday,</b> extending into the afternoon (intraday range 1,613–1,632) after Friday's late-session profit-taking, as regional risk appetite improves on fading Fed-hike odds.`, th:`<b>ดัชนี SET ขึ้น 1.05% สู่ราว 1,626 ณ ช่วงเที่ยงวันจันทร์</b> และปรับขึ้นต่อในช่วงบ่าย (กรอบระหว่างวัน 1,613–1,632) หลังแรงขายทำกำไรช่วงบ่ายวันศุกร์ ขณะความเสี่ยงในภูมิภาคดีขึ้นจากโอกาสเฟดขึ้นดอกเบี้ยที่ลดลง`},
      why:{en:`A choppy SET pushes yield-seeking clients toward offshore bonds and funds — your core book.`, th:`SET ที่ผันผวนผลักลูกค้าที่มองหาผลตอบแทนไปหาตราสารหนี้และกองทุนต่างประเทศ — ซึ่งเป็นพอร์ตหลักของคุณ`},
      full:{en:`Thailand's SET Index gained about 1.05% to close its morning session near 1,626.02, a firmer start to the week after Friday's late-session profit-taking (close 1,609.06). The index kept climbing into the afternoon, trading in a 1,613–1,632 range on turnover of THB 60.7 billion by mid-afternoon, tracking the broader regional risk-on tone as Fed rate-hike odds for September fell to about 30% and Asian tech names extended their AI-driven rally. With momentum improving, yield-seeking Thai investors continue to look offshore for income and growth alongside domestic exposure.`, th:`ดัชนี SET ของไทยปรับขึ้นราว 1.05% ปิดช่วงเช้าใกล้ 1,626.02 เป็นการเริ่มต้นสัปดาห์ที่แข็งแกร่งขึ้นหลังแรงขายทำกำไรช่วงบ่ายวันศุกร์ (ปิดที่ 1,609.06) ดัชนียังปรับขึ้นต่อในช่วงบ่าย เคลื่อนไหวในกรอบ 1,613–1,632 มูลค่าการซื้อขาย 6.07 หมื่นล้านบาท ณ ช่วงบ่าย สอดคล้องกับบรรยากาศ risk-on ในภูมิภาคที่กว้างขึ้น ขณะโอกาสเฟดขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเหลือราว 30% และหุ้นเทคเอเชียยังปรับขึ้นต่อเนื่องตามธีม AI เมื่อโมเมนตัมดีขึ้น นักลงทุนไทยที่มองหาผลตอบแทนจึงยังหันไปลงทุนต่างประเทศควบคู่กับการลงทุนในประเทศ`},
      sources:[{l:"Kaohoon Intl",u:"https://www.kaohooninternational.com/markets/588752"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
  ];

     txt:{en:`<b>Oil held roughly steady near $88/bbl Monday</b> — off last week's spike — as US-Iran talks stayed stalled and Hormuz shipping slowed without fresh escalation. <b>Gold ticked up to about $4,436/oz</b>, supported by a softer US dollar and Friday's weak retail-sales report, with the geopolitical backdrop still simmering rather than resolved.`, th:`<b>ราคาน้ำมันทรงตัวใกล้ $88 ต่อบาร์เรลวันจันทร์</b> — ลดลงจากจุดพุ่งสัปดาห์ก่อน — ขณะการเจรจาสหรัฐ-อิหร่านยังคงหยุดชะงัก และการขนส่งผ่านช่องแคบฮอร์มุซชะลอตัวโดยไม่มีสถานการณ์ตึงเครียดใหม่ <b>ทองคำขยับขึ้นสู่ราว $4,436/ออนซ์</b> ได้แรงหนุนจากดอลลาร์ที่อ่อนค่าและยอดค้าปลีกที่อ่อนแอวันศุกร์ ขณะภูมิรัฐศาสตร์โดยรวมยังคุกรุ่น ไม่ได้คลี่คลายลง`},

    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 30-year Treasury yield surged past 5.31% Monday, its highest since June 2007</b> — a 19-year high — after FOMC minutes from the July meeting (which saw three dissents favouring a hike) and mounting concern over the US budget deficit, heavy Treasury issuance and AI-related debt supply pushed long-end yields higher. Barclays strategists say it's more about deficits and term premium than inflation. The <b>10-year yield rose to ~4.72%</b> and the <b>2-year to ~4.18%</b>, while markets still price only about a 30% chance of a Fed rate hike in September.`, th:`<b>ผลตอบแทนพันธบัตรสหรัฐ 30 ปีพุ่งทะลุ 5.31% วันจันทร์ สูงสุดตั้งแต่เดือน มิ.ย. 2007</b> — สูงสุดในรอบ 19 ปี — หลังรายงานการประชุมเฟด (FOMC minutes) เดือน ก.ค. (ที่มีกรรมการ 3 ท่านเห็นต่างสนับสนุนให้ขึ้นดอกเบี้ย) และความกังวลเรื่องขาดดุลงบประมาณสหรัฐฯ การออกพันธบัตรจำนวนมาก และหนี้ที่เกี่ยวข้องกับ AI ผลักดันผลตอบแทนพันธบัตรระยะยาวให้สูงขึ้น นักกลยุทธ์ Barclays ระบุว่าเป็นเรื่องขาดดุลงบประมาณและ term premium มากกว่าเงินเฟ้อ <b>ผลตอบแทน 10 ปีขยับขึ้นสู่ราว 4.72%</b> และ <b>2 ปีสู่ราว 4.18%</b> ขณะตลาดยังให้น้ำหนักเพียงราว 30% ว่าเฟดจะขึ้นดอกเบี้ยเดือน ก.ย.`},
     why:{en:`A 19-year high on the long bond is the single biggest talking point this update — new money can lock exceptionally attractive long-duration coupons right now, a window that likely won't stay open once the deficit narrative eases.`, th:`ผลตอบแทนพันธบัตรระยะยาวที่สูงสุดในรอบ 19 ปี คือประเด็นที่สำคัญที่สุดของรอบนี้ — เงินลงทุนใหม่สามารถล็อกคูปองพันธบัตรระยะยาวที่น่าสนใจเป็นพิเศษได้ตอนนี้ ซึ่งจังหวะนี้อาจไม่อยู่นานเมื่อประเด็นขาดดุลงบประมาณคลี่คลายลง`}},

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`<b>Trump's 50% tariff on ~$20bn of Canadian goods (electronics, alcohol, dairy) is due to take effect Wednesday 19 August.</b> Canadian and US officials say talks are progressing — a possible deal would trade lower US tariffs on Canadian autos, steel, aluminum and forest products for Canadian concessions on dairy, alcohol and procurement — but Ottawa says it isn't satisfied with Washington's latest offer, and no agreement is done yet. China sits at 12.5%; Washington has floated pharma tariffs rising toward 200% later in 2026.`, th:`<b>ภาษี 50% ของทรัมป์ต่อสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์ (อิเล็กทรอนิกส์ แอลกอฮอล์ นม) จะเริ่มมีผลวันพุธที่ 19 ส.ค.</b> เจ้าหน้าที่แคนาดาและสหรัฐฯ ระบุการเจรจาคืบหน้า — ข้อตกลงที่เป็นไปได้คือสหรัฐฯ ลดภาษีรถยนต์ เหล็ก อะลูมิเนียม และผลิตภัณฑ์ป่าไม้ของแคนาดา แลกกับที่แคนาดายอมผ่อนปรนเรื่องนม แอลกอฮอล์ และการจัดซื้อภาครัฐ — แต่แคนาดายังไม่พอใจข้อเสนอล่าสุดของสหรัฐฯ จึงยังไม่มีข้อตกลง จีนอยู่ที่ 12.5% สหรัฐยังส่งสัญญาณอาจขึ้นภาษียาสูงถึง 200% ปลายปี 2026`}, w:{en:`A last-minute deal is possible but not guaranteed — tariff headlines into Wednesday are a fresh source of equity volatility, reinforcing the case for bonds as ballast.`, th:`ข้อตกลงนาทีสุดท้ายเป็นไปได้แต่ยังไม่แน่นอน — ข่าวภาษีก่อนถึงวันพุธเป็นแหล่งความผันผวนใหม่ของหุ้น ตอกย้ำให้ถือตราสารหนี้เป็นตัวถ่วงพอร์ต`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>US-Iran tension stayed elevated but didn't escalate further Monday</b> after the ceasefire lapsed with no deal — Iran's FM Araghchi said Tehran has "not made a decision to restart negotiations." Oil pulled back from last week's spike, holding near $88/bbl as Hormuz shipping talks stalled without fresh incidents. The bigger market mover ended up being bonds, not oil: <b>the 30-year Treasury yield jumped to 5.31%, a 19-year high</b>, and US stocks gave back their premarket AI-driven gains to close lower. Washington is preparing fresh Iran measures, while US envoy Jared Kushner works with Egypt, Turkey and Qatar to revive the second phase of Gaza's ceasefire ahead of a planned Israel trip.`, th:`<b>ความตึงเครียดสหรัฐ-อิหร่านยังอยู่ในระดับสูงแต่ไม่ได้ทวีความรุนแรงเพิ่มขึ้นในวันจันทร์</b> หลังหยุดยิงหมดอายุลงโดยไม่มีข้อตกลง — รมว.ต่างประเทศอิหร่าน Araghchi ระบุอิหร่าน "ยังไม่ตัดสินใจกลับมาเจรจา" ราคาน้ำมันย่อตัวลงจากจุดพุ่งสัปดาห์ก่อน ทรงตัวใกล้ $88 ต่อบาร์เรล ขณะการเจรจาขนส่งผ่านฮอร์มุซยังหยุดชะงักโดยไม่มีเหตุการณ์ใหม่ ปัจจัยที่ส่งผลต่อตลาดมากกว่ากลับเป็นตลาดพันธบัตร ไม่ใช่น้ำมัน: <b>ผลตอบแทนพันธบัตร 30 ปีพุ่งขึ้นสู่ 5.31% สูงสุดในรอบ 19 ปี</b> และหุ้นสหรัฐฯ คืนกำไรช่วงก่อนตลาดเปิดที่ได้แรงหนุนหุ้นเทค AI จนปิดตลาดในแดนลบ สหรัฐฯ กำลังเตรียมมาตรการต่ออิหร่านเพิ่มเติม ขณะทูตพิเศษสหรัฐฯ Jared Kushner กำลังทำงานร่วมกับอียิปต์ ตุรกี และกาตาร์ เพื่อฟื้นข้อตกลงหยุดยิงกาซาระยะที่สอง ก่อนแผนเดินทางเยือนอิสราเอล`}, w:{en:`The headline risk shifted from oil to bonds today — a reminder that geopolitical tension can show up in yields just as easily as in crude. Use the long-bond move as the more urgent, current talking point with clients over the oil story.`, th:`ความเสี่ยงข่าวเปลี่ยนจากน้ำมันไปเป็นพันธบัตรในวันนี้ — เตือนว่าความตึงเครียดภูมิรัฐศาสตร์อาจสะท้อนออกมาในผลตอบแทนพันธบัตรได้พอ ๆ กับราคาน้ำมัน ใช้การเคลื่อนไหวของพันธบัตรระยะยาวเป็นประเด็นคุยกับลูกค้าที่เร่งด่วนและทันเหตุการณ์กว่าเรื่องน้ำมัน`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`<b>The 30-year Treasury yield surged past 5.31% Monday — its highest since June 2007, a 19-year high</b> — after minutes from the Fed's July meeting (three dissents favoured a hike) and mounting worry over the US budget deficit, heavy Treasury issuance and AI-related debt supply pushed long yields higher. Barclays strategists say the move is more about deficits and term premium than inflation. Fed rate-hike odds for September held near 30%, and the Fed's policy rate stays at 3.50–3.75%.`, th:`<b>ผลตอบแทนพันธบัตรสหรัฐ 30 ปีพุ่งทะลุ 5.31% วันจันทร์ — สูงสุดตั้งแต่เดือน มิ.ย. 2007 สูงสุดในรอบ 19 ปี</b> — หลังรายงานการประชุมเฟด (FOMC minutes) เดือน ก.ค. (มีกรรมการ 3 ท่านเห็นต่างสนับสนุนให้ขึ้นดอกเบี้ย) และความกังวลเรื่องขาดดุลงบประมาณสหรัฐฯ การออกพันธบัตรจำนวนมาก และหนี้ที่เกี่ยวข้องกับ AI ผลักดันผลตอบแทนพันธบัตรระยะยาวให้สูงขึ้น นักกลยุทธ์ Barclays ระบุว่าเป็นเรื่องขาดดุลงบประมาณและ term premium มากกว่าเงินเฟ้อ โอกาสเฟดขึ้นดอกเบี้ยเดือน ก.ย. ยังอยู่ใกล้ 30% และเฟดยังคงอัตราดอกเบี้ยไว้ที่ 3.50–3.75%`}, w:{en:`This is the clearest, most urgent bond pitch in weeks: long yields at a near-20-year high, even as short-term hike risk stays low. Clients who lock in now capture a coupon level that may not return for a long time.`, th:`นี่คือจุดขายตราสารหนี้ที่ชัดเจนและเร่งด่วนที่สุดในรอบหลายสัปดาห์: ผลตอบแทนพันธบัตรระยะยาวสูงสุดในรอบเกือบ 20 ปี แม้ความเสี่ยงขึ้นดอกเบี้ยระยะสั้นจะยังต่ำ ลูกค้าที่ล็อกตอนนี้จะได้คูปองระดับที่อาจไม่กลับมาอีกในระยะยาว`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`<b>July CPI came in exactly at consensus (3.4% y/y, core 2.5%),</b> a relief after recent growth-scare data and the main reason Fed hike odds for September have fallen sharply this week.`, th:`<b>CPI เดือน ก.ค. ออกมาตรงคาดการณ์พอดี (3.4% เทียบปีก่อน แกน 2.5%)</b> เป็นข่าวดีหลังข้อมูลก่อนหน้าสร้างความกังวลด้านการเติบโต และเป็นเหตุผลหลักที่โอกาสเฟดขึ้นดอกเบี้ยเดือน ก.ย. ลดลงมากในสัปดาห์นี้`}, w:{en:`In-line inflation supports the "hold, not hike" narrative — a constructive backdrop for both bonds and quality equities.`, th:`เงินเฟ้อที่ออกมาตรงคาดการณ์หนุนแนวคิด "คงดอกเบี้ย ไม่ขึ้น" — บรรยากาศที่ดีต่อทั้งตราสารหนี้และหุ้นคุณภาพ`}},
  ];

    {day:{en:"Fri",th:"ศ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US consumer sentiment craters — UMich 51.0 vs 54.5 expected",th:"ความเชื่อมั่นผู้บริโภคสหรัฐทรุดหนัก — UMich 51.0 เทียบคาดการณ์ 54.5"}, d:{en:"The preliminary August reading fell from July's 55.2, a sharp miss that broke Wall Street's three-day record streak. Year-ahead inflation expectations also ticked up to 4.3%, from 4.2%.",th:"ดัชนีเบื้องต้นเดือน ส.ค. ลดจาก 55.2 ของเดือน ก.ค. พลาดเป้าอย่างแรงจนทำให้สถิติปิดต่อเนื่อง 3 วันของหุ้นสหรัฐหลุด คาดการณ์เงินเฟ้อ 1 ปีข้างหน้าก็ขยับขึ้นเป็น 4.3% จาก 4.2%"}},
    {day:{en:"Sat",th:"ส."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"h", t:{en:"Hormuz standoff escalates: Trump's \"territory\" claim, Bessent's isolation threat, new sea incidents",th:"ฮอร์มุซตึงเครียดขึ้น: ทรัมป์ขู่ \"ดินแดน\" Bessent ขู่โดดเดี่ยวเศรษฐกิจ เหตุปะทะกลางทะเลใหม่"}, d:{en:"Trump vowed to declare the Strait of Hormuz US territory; Iran's judiciary chief dismissed the claim. The UAE accused Iran of attacking a vessel in the Strait, Houthi rebels struck a Yemeni Red Sea port, and Treasury Secretary Bessent said the US is preparing unprecedented \"economic isolation\" measures against Iran — keeping oil's risk premium live into Monday's open.",th:"ทรัมป์ขู่ประกาศให้ช่องแคบฮอร์มุซเป็นดินแดนสหรัฐฯ ประธานศาลอิหร่านปฏิเสธ สหรัฐอาหรับเอมิเรตส์กล่าวหาอิหร่านโจมตีเรือในช่องแคบ กบฏฮูตีโจมตีท่าเรือในเยเมนบริเวณทะเลแดง และ รมว.คลัง Bessent ระบุสหรัฐฯ กำลังเตรียมมาตรการ \"โดดเดี่ยวทางเศรษฐกิจ\" ต่ออิหร่านที่ไม่เคยมีมาก่อน ทำให้ความเสี่ยงราคาน้ำมันยังคงอยู่ก่อนตลาดเปิดวันจันทร์"}},
    {day:{en:"Sun",th:"อา."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"h", t:{en:"Israeli strikes kill 11 in Lebanon — deadliest since June ceasefire; Ukraine's largest drone attack on Moscow draws Russian missiles",th:"อิสราเอลโจมตีเลบานอน เสียชีวิต 11 ราย รุนแรงสุดตั้งแต่หยุดยิง มิ.ย. — ยูเครนถล่มโดรนมอสโกครั้งใหญ่สุด รัสเซียตอบโต้ด้วยขีปนาวุธ"}, d:{en:"Pre-dawn Israeli strikes on Ansar and Deir ez-Zahrani in south Lebanon's Nabatieh district killed at least 11 people, including three children, and wounded about 19 — the deadliest toll since the Israel-Hezbollah ceasefire took effect in June. Israel said it killed senior Hezbollah commander Abu Hassan Alaa a day earlier and blamed Hezbollah for wounding three soldiers with explosive drones; Bloomberg reported the ceasefire itself now risks unraveling. Separately, Ukraine launched its largest drone attack on Moscow since the war began, and Russia responded with missile strikes on Kyiv.",th:"การโจมตีทางอากาศของอิสราเอลช่วงเช้ามืดที่เมือง Ansar และ Deir ez-Zahrani ในเขต Nabatieh ทางใต้ของเลบานอน ทำให้มีผู้เสียชีวิตอย่างน้อย 11 ราย รวมเด็ก 3 คน บาดเจ็บราว 19 ราย ถือเป็นยอดผู้เสียชีวิตสูงสุดนับตั้งแต่ข้อตกลงหยุดยิงอิสราเอล-ฮิซบอลเลาะห์เริ่มมีผลเดือน มิ.ย. อิสราเอลระบุว่าสังหารผู้บัญชาการฮิซบอลเลาะห์ระดับสูง Abu Hassan Alaa ไปเมื่อวันก่อนหน้า และกล่าวโทษฮิซบอลเลาะห์ว่าใช้โดรนระเบิดทำให้ทหารบาดเจ็บ 3 นาย ขณะที่ Bloomberg รายงานว่าข้อตกลงหยุดยิงเองก็เสี่ยงจะแตกหัก นอกจากนี้ ยูเครนยังเปิดฉากโจมตีโดรนมอสโกครั้งใหญ่ที่สุดของสงคราม ทำให้รัสเซียตอบโต้ด้วยขีปนาวุธถล่มเคียฟ"}},
    {day:{en:"Sun",th:"อา."}, date:{en:"weekend",th:"สุดสัปดาห์"}, imp:"m", t:{en:"Iran-Oman edge toward a Hormuz reopening deal, contingent on the US",th:"อิหร่าน-โอมานใกล้บรรลุข้อตกลงเปิดฮอร์มุซ ขึ้นกับสหรัฐฯ"}, d:{en:"Iran's FM Araghchi said talks with Oman on a new shipping route through the Strait of Hormuz are in their \"final stages,\" but a full reopening still hinges on Washington upholding the June ceasefire MoU. Iranian officials maintain the strait stays blocked until their conditions are met — a potential de-escalation path that could cap oil's upside even as the Lebanon front flares.",th:"รมว.ต่างประเทศอิหร่าน Araghchi ระบุการเจรจากับโอมานเรื่องเส้นทางเดินเรือใหม่ผ่านช่องแคบฮอร์มุซเข้าสู่ \"ขั้นตอนสุดท้าย\" แต่การเปิดช่องแคบเต็มรูปแบบยังขึ้นอยู่กับสหรัฐฯ ปฏิบัติตามข้อตกลง MoU หยุดยิงเดือน มิ.ย. เจ้าหน้าที่อิหร่านยืนยันว่าช่องแคบยังปิดจนกว่าเงื่อนไขของตนจะได้รับการยอมรับ — เส้นทางคลี่คลายที่อาจสกัดขาขึ้นของราคาน้ำมัน แม้สถานการณ์เลบานอนจะร้อนแรงขึ้น"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US-Iran ceasefire expires with no deal in sight",th:"หยุดยิงสหรัฐ-อิหร่านหมดอายุไร้ข้อตกลง"}, d:{en:"The 60-day ceasefire lapsed Monday. Iran's FM Araghchi said Tehran has \"not made a decision to restart negotiations\"; a senior White House official called the standoff \"static.\" Markets shrugged so far — Asian equities rallied and oil eased — but the risk is live for a fast repricing on any escalation.",th:"หยุดยิงระยะ 60 วันหมดอายุลงวันจันทร์ รมว.ต่างประเทศอิหร่าน Araghchi ระบุอิหร่าน \"ยังไม่ตัดสินใจกลับมาเจรจา\" เจ้าหน้าที่อาวุโสทำเนียบขาวเรียกสถานการณ์นี้ว่า \"หยุดนิ่ง\" ตลาดยังไม่ตอบสนองรุนแรงในตอนนี้ — หุ้นเอเชียปรับขึ้นและน้ำมันอ่อนตัวลง — แต่ความเสี่ยงยังมีอยู่หากมีข่าวความรุนแรงเพิ่มเติม"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Anthropic's ~$200bn 2028 revenue forecast lifts AI stocks",th:"คาดการณ์รายได้ปี 2028 ของ Anthropic ที่ราว 2 แสนล้านดอลลาร์ หนุนหุ้น AI"}, d:{en:"Ahead of a planned IPO, Anthropic reportedly projected 2028 revenue near $190–200bn. The report lifted AI-linked chip and storage names in Monday's premarket, with Nasdaq-100 futures up about 0.5%.",th:"ก่อนแผนเข้าตลาดหุ้น (IPO) Anthropic รายงานคาดการณ์รายได้ปี 2028 ไว้ที่ราว 1.9–2 แสนล้านดอลลาร์ รายงานนี้หนุนหุ้นกลุ่มชิปและสตอเรจที่เชื่อมโยงกับ AI ในช่วงก่อนตลาดเปิดวันจันทร์ โดยดัชนีล่วงหน้า Nasdaq-100 ขึ้นราว 0.5%"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US stocks close lower as 30-year Treasury yield hits 19-year high",th:"หุ้นสหรัฐปิดลบ ขณะผลตอบแทนพันธบัตร 30 ปีทำสถิติสูงสุดในรอบ 19 ปี"}, d:{en:"The premarket AI rally faded by the close: S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32%. The 30-year Treasury yield jumped to 5.31%, its highest since June 2007, on deficit and AI-debt-issuance concerns; oil held near $88/bbl as US-Iran talks stayed stalled.",th:"การปรับขึ้นของหุ้นเทค AI ช่วงก่อนตลาดเปิดจางหายไปเมื่อถึงช่วงปิดตลาด: S&P −0.52%, Dow −0.51%, Nasdaq Composite −0.32% ผลตอบแทนพันธบัตร 30 ปีพุ่งขึ้นสู่ 5.31% สูงสุดตั้งแต่เดือน มิ.ย. 2007 จากความกังวลขาดดุลงบประมาณและหนี้ AI ราคาน้ำมันทรงตัวใกล้ $88 ต่อบาร์เรล ขณะการเจรจาสหรัฐ-อิหร่านยังหยุดชะงัก"}},
    {day:{en:"Wed",th:"พ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"m", t:{en:"Canada-US race to strike tariff deal before 50% deadline",th:"แคนาดา-สหรัฐฯ เร่งเจรจาข้อตกลงก่อนเส้นตายภาษี 50%"}, d:{en:"Trump's threatened 50% tariff on ~$20bn of Canadian goods takes effect 19 August. Talks are reportedly progressing on Canada dropping retaliatory auto tariffs and easing dairy/alcohol restrictions — no signed deal yet.",th:"ภาษี 50% ของทรัมป์ต่อสินค้าแคนาดามูลค่าราว 2 หมื่นล้านดอลลาร์ จะเริ่มมีผล 19 ส.ค. มีรายงานว่าการเจรจาคืบหน้าเรื่องแคนาดายกเลิกภาษีรถยนต์ตอบโต้ และผ่อนปรนข้อจำกัดนม/แอลกอฮอล์ — ยังไม่มีข้อตกลงที่ลงนาม"}},
    {day:{en:"Tue-Thu",th:"อ.-พฤ."}, date:{en:"this wk",th:"สัปดาห์นี้"}, imp:"h", t:{en:"Big-box retail earnings: Home Depot, Target, Lowe's, Walmart",th:"ผลประกอบการค้าปลีกรายใหญ่: Home Depot, Target, Lowe's, Walmart"}, d:{en:"Home Depot reports Tuesday, Target and Lowe's Wednesday, and Walmart Thursday — a key read on US consumer health after Friday's weak sentiment data.",th:"Home Depot รายงานผลวันอังคาร Target และ Lowe's วันพุธ และ Walmart วันพฤหัสฯ — ตัวชี้วัดสำคัญของสุขภาพผู้บริโภคสหรัฐฯ หลังข้อมูลความเชื่อมั่นที่อ่อนแอวันศุกร์"}},
    {day:{en:"Sep",th:"ก.ย."}, date:{en:"ahead",th:"ข้างหน้า"}, imp:"h", t:{en:"Fed policy meeting",th:"การประชุมนโยบายเฟด"}, d:{en:"The decision all this data feeds into. Hike odds have fallen to ~30% (from 47% a month ago) after in-line July CPI — the biggest driver for bond yields into September.",th:"การตัดสินใจที่ข้อมูลทั้งหมดส่งผลถึง โอกาสขึ้นดอกเบี้ยลดลงเหลือราว 30% (จาก 47% เมื่อเดือนก่อน) หลัง CPI ก.ค. ออกมาตรงคาดการณ์ — ปัจจัยใหญ่สุดต่อผลตอบแทนพันธบัตรก่อนถึงเดือน ก.ย."}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-themes').textContent=t(S.sThemes); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('s-prices').textContent=t(S.sPrices); $('h-prices').textContent=t(S.hPrices); $('pricenote').textContent=t(S.pricenote);
    $('b-sell').textContent=t(S.bSell); $('s-funds').textContent=t(S.sFunds); $('h-funds').textContent=t(S.hFunds);
    $('sh-off').innerHTML=`${t(S.shOff)} <small>${t(S.shOffSub)}</small>`; $('sh-on').innerHTML=`${t(S.shOn)} <small>${t(S.shOnSub)}</small>`;
    $('s-talk').textContent=t(S.sTalk); $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('countrygrid').innerHTML=COUNTRIES.map((c,i)=>`
      <div class="card ccard">
        <div class="chdr"><div class="ci"><h3 style="margin:0"><span class="flag">${c.flag}</span> ${t(c.name)}</h3><span class="ix">${c.ix}</span></div>
          <div style="text-align:right"><div class="val">${c.val}</div>${chgPill(c.chg)}</div></div>
        <div class="chartbox" data-series='${JSON.stringify(c.series)}' data-chg="${c.chg}"></div>
        <div class="chartcap">${t(S.recent)}</div>
        <p>${t(c.txt)}</p>
        <div class="why"><span>${t(S.foryou)}</span> ${t(c.why)}</div>
        <button class="expand">${t(S.readfull)} <span class="cv">▾</span></button>
        <div class="full" hidden><p style="margin:0">${t(c.full)}</p>
          <div class="srcline"><span class="srclabel">${t(S.sources)}</span>${c.sources.map(s=>`<a class="srcpill" href="${s.u}" target="_blank" rel="noopener">${s.l} ↗</a>`).join('')}</div></div>
      </div>`).join('');
    $('extragrid').innerHTML=EXTRA.map(e=>`<div class="card"><h3><span class="flag">${e.flag}</span> ${t(e.h)}</h3><p>${t(e.txt)}</p><div class="why"><span>${t(S.foryou)}</span> ${t(e.why)}</div></div>`).join('');
    $('themegrid').innerHTML=THEMES.map(x=>`<div class="card themecard"><h3>${t(x.h)}</h3><p>${t(x.p)}</p><div class="why"><span>${t(S.impact)}</span> ${t(x.w)}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`<div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div><div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div><div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน':'US Treasuries, gold & oil',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p>${f.now?`<div class="fnow"><span>${L==='th'?'ทำไมตอนนี้':'Why now'}</span>${t(f.now)}</div>`:''}<div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');
    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
