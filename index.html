<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Nvidia Slide Deepens as the 10-Year Holds Near 5.15% — Nasdaq Falls 0.9%, Hang Seng Drops 1.5%, but the SET Climbs Back Above 1,500 on Foreign Buying", th:"หุ้น Nvidia ร่วงต่อ ขณะที่บอนด์ 10 ปียืนราว 5.15% — Nasdaq ลดลง 0.9% Hang Seng ลดลง 1.5% แต่ SET กลับขึ้นเหนือ 1,500 จากแรงซื้อต่างชาติ"},
    heroDeck:{en:`Friday ended a volatile week on a split note. Nvidia kept falling the day after Jensen Huang's resignation and chip stocks gave back their gains — AMD dropped about 8.8% — so the Nasdaq fell 0.91% to 25,136.27 and the S&P 500 0.40% to 7,561.67, while the Dow edged up 0.10% to 52,347.55. October producer prices rose 0.3% on the month, a touch below the 0.4% forecast, but were up 6.5% from a year earlier, the biggest annual rise since 2022. Yields stayed high: the 10-year rose about 5bp to roughly 5.15%, the 30-year to ~5.48%, while the 2-year was flat near 4.87%. Brent was flat at $95.84 and gold slipped 0.2% to about $3,876, near Thursday's 13-month low. In Asia the Hang Seng fell 1.55% on Nvidia worries, but the SET rose 0.39% to 1,504.88 as foreigners bought about THB 4.4bn of Thai stocks. Despite the week's drama, the S&P 500 still gained about 2.5% for the week.`, th:`วันศุกร์ปิดสัปดาห์ที่ผันผวนแบบแยกทาง หุ้น Nvidia ยังร่วงต่อหลัง Jensen Huang ลาออก และหุ้นชิปคืนกำไร — AMD ลดลงราว 8.8% — ทำให้ Nasdaq ลดลง 0.91% สู่ 25,136.27 และ S&P 500 ลดลง 0.40% สู่ 7,561.67 ขณะที่ Dow ขึ้นเล็กน้อย 0.10% สู่ 52,347.55 ดัชนีราคาผู้ผลิต (PPI) เดือน ต.ค. ขึ้น 0.3% จากเดือนก่อน ต่ำกว่าคาด 0.4% เล็กน้อย แต่สูงขึ้น 6.5% จากปีก่อน มากที่สุดตั้งแต่ปี 2022 ผลตอบแทนบอนด์ยังสูง: บอนด์ 10 ปีขึ้นราว 0.05% สู่ประมาณ 5.15% บอนด์ 30 ปีสู่ราว 5.48% ส่วนบอนด์ 2 ปีทรงตัวราว 4.87% Brent ทรงตัวที่ $95.84 และทองคำลดลง 0.2% สู่ราว $3,876 ใกล้ระดับต่ำสุดในรอบ 13 เดือนเมื่อวันพฤหัสฯ ในเอเชีย Hang Seng ลดลง 1.55% จากความกังวลเรื่อง Nvidia แต่ SET ขึ้น 0.39% สู่ 1,504.88 โดยต่างชาติซื้อหุ้นไทยสุทธิราว 4,400 ล้านบาท แม้จะมีเรื่องวุ่นวายทั้งสัปดาห์ S&P 500 ยังบวกราว 2.5% ทั้งสัปดาห์`},

    dbNext:{en:"Watch Nvidia's Q3 results on Tue 17 Nov under interim CEO Colette Kress, whether the 10-year pushes further above 5.15% as December hike bets build, the MSCI review and SET/TFEX rule changes on Mon 16 Nov, and whether the Iran standoff lifts Brent toward $100.", th:"จับตางบไตรมาส 3 ของ Nvidia วันอังคารที่ 17 พ.ย. ภายใต้ซีอีโอรักษาการ Colette Kress บอนด์ 10 ปีจะขึ้นเกิน 5.15% ต่อหรือไม่ ขณะที่โอกาสเฟดขึ้นดอกเบี้ยเดือน ธ.ค. สูงขึ้น การปรับดัชนี MSCI และเกณฑ์ซื้อขาย SET/TFEX วันจันทร์ที่ 16 พ.ย. และความขัดแย้งกับอิหร่านจะดัน Brent เข้าใกล้ $100 หรือไม่"},

    leadtxt:{en:`<b>Rates stay high and the AI trade is still shaky, but money is rotating rather than fleeing.</b> Friday's producer prices were slightly softer than forecast on the month (+0.3%) but still <b>up 6.5% from a year ago</b>, so the <b>10-year held near 5.15%</b> and a December Fed hike remains the base case. <b>Nvidia extended its slide</b> after Huang's exit and chip stocks gave back gains (AMD about −8.8%), pulling the Nasdaq down 0.91%, while the Dow edged up 0.10% — a sign of rotation out of tech into the rest of the market. <b>Oil was flat at $95.84 Brent</b> and <b>gold held near a 13-month low (~$3,876)</b>. Asia was split: the Hang Seng fell 1.55%, but the <b>SET rose 0.39% to 1,504.88 on THB 4.4bn of foreign buying</b>, led by banks. <b>For clients: stay defensive into Nvidia's 17 Nov results — keep new bond money in short-duration funds yielding near 4.9%, avoid adding concentrated AI or long-duration bond exposure, and treat gold as a small hedge rather than a buy-the-dip trade while yields are above 5%.</b>`, th:`<b>ดอกเบี้ยยังสูงและธีม AI ยังไม่นิ่ง แต่เงินกำลังหมุนเปลี่ยนกลุ่ม ไม่ได้ไหลออกจากตลาด</b> ดัชนีราคาผู้ผลิต (PPI) วันศุกร์ขึ้นน้อยกว่าคาดเล็กน้อยเมื่อเทียบรายเดือน (+0.3%) แต่ยัง<b>สูงขึ้น 6.5% จากปีก่อน</b> ทำให้<b>บอนด์ 10 ปียืนราว 5.15%</b> และการที่เฟดจะขึ้นดอกเบี้ยเดือนธันวาคมยังเป็นกรณีหลัก <b>หุ้น Nvidia ร่วงต่อ</b> หลัง Huang ลาออก และหุ้นชิปคืนกำไร (AMD ราว −8.8%) ดึง Nasdaq ลดลง 0.91% ขณะที่ Dow ขึ้นเล็กน้อย 0.10% — สัญญาณว่าเงินหมุนออกจากหุ้นเทคไปหากลุ่มอื่น <b>น้ำมันทรงตัวที่ Brent $95.84</b> และ<b>ทองคำยังอยู่ใกล้ระดับต่ำสุดในรอบ 13 เดือน (ราว $3,876)</b> เอเชียแยกทาง: Hang Seng ลดลง 1.55% แต่ <b>SET ขึ้น 0.39% สู่ 1,504.88 จากแรงซื้อต่างชาติราว 4,400 ล้านบาท</b> นำโดยหุ้นธนาคาร <b>สำหรับลูกค้า: ตั้งรับไว้ก่อนงบ Nvidia วันที่ 17 พ.ย. — วางเงินลงทุนใหม่ในกองทุนตราสารหนี้อายุสั้นที่ให้ผลตอบแทนราว 4.9% อย่าเพิ่มหุ้น AI แบบกระจุกตัวหรือบอนด์อายุยาว และถือทองคำเป็นสัดส่วนเล็กเพื่อป้องกันความเสี่ยง ไม่ใช่ช้อนซื้อ ขณะที่ผลตอบแทนบอนด์ยังเกิน 5%</b>`},

    watchnote:{en:`Friday closed a volatile week: Nvidia extended its slide after Jensen Huang's resignation and AMD fell about 8.8%, so the Nasdaq lost 0.91% and the S&P 500 0.40%, while the Dow edged up. October PPI rose 0.3% on the month (below the 0.4% forecast) but 6.5% from a year earlier, keeping the 10-year near 5.15%. Brent was flat at $95.84 and gold near a 13-month low around $3,876. The three things that matter most next week: Nvidia's Q3 results on 17 Nov under interim CEO Colette Kress, whether the 10-year breaks higher as December hike bets build, and whether the Iran standoff pushes oil toward $100.`,
      th:`วันศุกร์ปิดสัปดาห์ที่ผันผวน: หุ้น Nvidia ร่วงต่อหลัง Jensen Huang ลาออก และ AMD ลดลงราว 8.8% ทำให้ Nasdaq ลดลง 0.91% และ S&P 500 ลดลง 0.40% ขณะที่ Dow ขึ้นเล็กน้อย PPI เดือน ต.ค. ขึ้น 0.3% จากเดือนก่อน (ต่ำกว่าคาด 0.4%) แต่ขึ้น 6.5% จากปีก่อน ทำให้บอนด์ 10 ปียืนราว 5.15% Brent ทรงตัวที่ $95.84 และทองคำอยู่ใกล้ระดับต่ำสุดในรอบ 13 เดือนราว $3,876 3 เรื่องสำคัญที่สุดสัปดาห์หน้า: งบไตรมาส 3 ของ Nvidia วันที่ 17 พ.ย. ภายใต้ซีอีโอรักษาการ Colette Kress, บอนด์ 10 ปีจะขึ้นต่อหรือไม่ ขณะที่โอกาสเฟดขึ้นดอกเบี้ยเดือน ธ.ค. สูงขึ้น และความขัดแย้งกับอิหร่านจะดันน้ำมันเข้าใกล้ $100 หรือไม่`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,561.67", chg:-0.40, series:[7592.40,7561.67],
      txt:{en:`<b>US stocks closed mixed Friday as Nvidia's slide deepened: the S&P 500 fell 0.40% to 7,561.67 and the Nasdaq Composite 0.91% to 25,136.27, while the Dow rose 0.10% (+50.46 pts) to 52,347.55.</b> Chip stocks gave back gains, with AMD down about 8.8%. The S&P 500 still rose about 2.5% for the week.`, th:`<b>หุ้นสหรัฐฯ ปิดแบบผสมวันศุกร์ ขณะที่หุ้น Nvidia ร่วงหนักขึ้น: S&P 500 ลดลง 0.40% สู่ 7,561.67 และ Nasdaq ลดลง 0.91% สู่ 25,136.27 ส่วน Dow ขึ้น 0.10% (+50.46 จุด) สู่ 52,347.55</b> หุ้นชิปคืนกำไร โดย AMD ลดลงราว 8.8% ทั้งสัปดาห์ S&P 500 ยังบวกราว 2.5%`},
      why:{en:`The split between a falling Nasdaq and a rising Dow shows money rotating out of AI and chips into cheaper, steadier sectors rather than leaving stocks altogether. The AI trade now hinges on Nvidia's 17 Nov results under an interim CEO, and with the 10-year near 5.15%, expensive growth stocks have little room for disappointment.`, th:`การที่ Nasdaq ลดลงแต่ Dow ขึ้น แสดงว่าเงินหมุนออกจากหุ้น AI และชิปไปหากลุ่มที่ราคาถูกและมั่นคงกว่า ไม่ได้ออกจากตลาดหุ้นทั้งหมด ธีม AI ตอนนี้ขึ้นอยู่กับงบของ Nvidia วันที่ 17 พ.ย. ภายใต้ซีอีโอรักษาการ และเมื่อบอนด์ 10 ปีอยู่ราว 5.15% หุ้นเติบโตที่ราคาแพงแทบไม่มีพื้นที่ให้ผิดหวัง`},
      full:{en:`US stocks closed mixed on Friday, November 13. The S&P 500 fell about 0.40% to 7,561.67 and the Nasdaq Composite about 0.91% to 25,136.27, while the Dow Jones Industrial Average gained 50.46 points (+0.10%) to 52,347.55. Tech led the losses as Nvidia extended its decline a day after Jensen Huang's resignation and chipmakers that had rallied as Nvidia rivals reversed, with AMD falling about 8.8%. October producer prices rose 0.3% month on month, slightly below the 0.4% forecast, but were up 6.5% from a year earlier, the biggest annual increase since late 2022, keeping Treasury yields elevated and December Fed-hike expectations in place. For the week, the S&P 500 gained about 2.5%, the Nasdaq about 2.3% and the Dow about 2.1%.`, th:`หุ้นสหรัฐฯ ปิดแบบผสมวันศุกร์ที่ 13 พ.ย. S&P 500 ลดลงราว 0.40% สู่ 7,561.67 และ Nasdaq ลดลงราว 0.91% สู่ 25,136.27 ขณะที่ Dow ขึ้น 50.46 จุด (+0.10%) สู่ 52,347.55 หุ้นเทคนำการลดลง เพราะหุ้น Nvidia ร่วงต่อหนึ่งวันหลัง Jensen Huang ลาออก และหุ้นชิปที่เคยขึ้นในฐานะคู่แข่งของ Nvidia กลับตัวลง โดย AMD ลดลงราว 8.8% ดัชนีราคาผู้ผลิตเดือน ต.ค. ขึ้น 0.3% จากเดือนก่อน ต่ำกว่าคาด 0.4% เล็กน้อย แต่สูงขึ้น 6.5% จากปีก่อน มากที่สุดตั้งแต่ปลายปี 2022 ทำให้ผลตอบแทนบอนด์ยังสูงและความคาดหวังที่เฟดจะขึ้นดอกเบี้ยเดือนธันวาคมยังอยู่ ทั้งสัปดาห์ S&P 500 บวกราว 2.5% Nasdaq ราว 2.3% และ Dow ราว 2.1%`},
      sources:[{l:"Washington Post (AP) — How major US stock indexes fared Friday 11/13/2026",u:"https://www.washingtonpost.com/business/2026/11/13/wall-street-stocks-dow-nasdaq/f15a10e2-dfa7-11f1-912c-4fbb80d73f7f_story.html"},{l:"CNBC — Stock market news for Nov. 13, 2026",u:"https://www.cnbc.com/2026/11/12/stock-market-today-live-updates.html"},{l:"TheStreet — Nasdaq, S&P 500 end lower as Nvidia drama continues to roil tech",u:"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026"},{l:"Xinhua — U.S. stocks close mixed",u:"https://english.news.cn/northamerica/20261114/48afa9adbc4a440d9a21dabc97d755cf/c.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,754.71", chg:-0.23, series:[26816.06,26754.71],
      txt:{en:`<b>Germany's DAX slipped about 0.2% to roughly 26,755 Friday,</b> pausing just below Thursday's record close, but still ended the week with a gain of around 3.5%.`, th:`<b>ดัชนี DAX เยอรมนีลดลงราว 0.2% สู่ประมาณ 26,755 วันศุกร์</b> พักตัวต่ำกว่าระดับปิดสูงสุดเมื่อวันพฤหัสฯ เล็กน้อย แต่ทั้งสัปดาห์ยังบวกราว 3.5%`},
      why:{en:`A small dip after back-to-back records is normal profit-taking. Europe's mix of insurers, industrials and defensives has made it the relative winner while US tech wobbles, but a 10-year US yield near 5.15% and $96 oil are global headwinds that limit how far the rally can run.`, th:`การลดลงเล็กน้อยหลังทำสถิติสูงสุด 2 วันติดเป็นการขายทำกำไรตามปกติ ส่วนผสมของหุ้นประกันภัย อุตสาหกรรม และหุ้นตั้งรับ ทำให้ยุโรปเป็นผู้ชนะเชิงเปรียบเทียบขณะที่หุ้นเทคสหรัฐฯ สั่นคลอน แต่ผลตอบแทนบอนด์สหรัฐฯ 10 ปีราว 5.15% และน้ำมัน $96 เป็นแรงกดดันทั่วโลกที่จำกัดการขึ้นต่อ`},
      full:{en:`Germany's DAX finished Friday, November 13 at about 26,755 (sources range from roughly 26,743 to 26,755), down about 0.2% from Thursday's record close of 26,816.06. The index had briefly traded above 27,000 for the first time on Thursday. Trading was cautious after Wall Street's Nvidia-driven tech weakness, with eurozone GDP growth easing and employment stabilising in the latest data. The DAX was on track for a weekly gain of about 3.5%.`, th:`ดัชนี DAX เยอรมนีปิดวันศุกร์ที่ 13 พ.ย. ที่ราว 26,755 (แต่ละแหล่งอยู่ระหว่างราว 26,743 ถึง 26,755) ลดลงราว 0.2% จากระดับปิดสูงสุด 26,816.06 เมื่อวันพฤหัสฯ ดัชนีเคยซื้อขายเหนือ 27,000 เป็นครั้งแรกระหว่างวันพฤหัสฯ การซื้อขายเป็นไปอย่างระมัดระวังหลังหุ้นเทคสหรัฐฯ อ่อนตัวจากข่าว Nvidia ขณะที่ข้อมูลล่าสุดแสดงว่า GDP ยูโรโซนชะลอลงและการจ้างงานทรงตัว ทั้งสัปดาห์ DAX บวกราว 3.5%`},
      sources:[{l:"MarketScreener — German blue-chip DAX little changed; eurozone GDP growth eases",u:"https://www.marketscreener.com/news/german-blue-chip-dax-index-little-changed-eurozone-gdp-growth-eases-employment-stabilizes-ce785ed9d08df725"},{l:"Investing.com — DAX historical data",u:"https://www.investing.com/indices/germany-30-historical-data"},{l:"Trading Economics — Germany stock market",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"61,142.35", chg:0.53, series:[60819.36,61142.35],
      txt:{en:`<b>Tokyo's Nikkei 225 rose 0.53% to 61,142.35 Friday,</b> recovering part of Thursday's drop despite weaker futures early in the day.`, th:`<b>ดัชนี Nikkei 225 ญี่ปุ่นขึ้น 0.53% สู่ 61,142.35 วันศุกร์</b> ฟื้นคืนบางส่วนจากที่ลดลงเมื่อวันพฤหัสฯ แม้สัญญาซื้อขายล่วงหน้าจะอ่อนตัวช่วงเช้า`},
      why:{en:`Japan held up better than Hong Kong because buyers stepped back into exporters and non-AI names after Thursday's chip selloff. But the Nikkei remains heavily tied to the AI supply chain, so Nvidia's results next week are a direct risk, and $96 oil is a cost for an oil-importing economy.`, th:`ญี่ปุ่นยืนได้ดีกว่าฮ่องกง เพราะมีแรงซื้อกลับเข้าหุ้นส่งออกและหุ้นที่ไม่เกี่ยวกับ AI หลังหุ้นชิปถูกขายเมื่อวันพฤหัสฯ แต่ Nikkei ยังผูกกับห่วงโซ่อุปทาน AI มาก งบ Nvidia สัปดาห์หน้าจึงเป็นความเสี่ยงโดยตรง และน้ำมัน $96 เป็นต้นทุนของประเทศที่นำเข้าน้ำมัน`},
      full:{en:`The Nikkei 225 closed at 61,142.35 on Friday, November 13, up about 323 points (+0.53%) from Thursday's 60,819.36, according to Yahoo Finance and FRED data (some providers show slightly different figures). The gain came despite softer futures early in the session and recouped most of Thursday's Nvidia-related decline.`, th:`Nikkei 225 ปิดที่ 61,142.35 วันศุกร์ที่ 13 พ.ย. เพิ่มขึ้นราว 323 จุด (+0.53%) จาก 60,819.36 ของวันพฤหัสฯ ตามข้อมูล Yahoo Finance และ FRED (บางแหล่งแสดงตัวเลขต่างกันเล็กน้อย) การขึ้นเกิดขึ้นแม้สัญญาซื้อขายล่วงหน้าจะอ่อนตัวช่วงเช้า และชดเชยการลดลงจากข่าว Nvidia เมื่อวันพฤหัสฯ ได้เกือบทั้งหมด`},
      sources:[{l:"Yahoo Finance — Nikkei 225 (^N225)",u:"https://finance.yahoo.com/quote/%5EN225/"},{l:"FRED — Nikkei Stock Average",u:"https://fred.stlouisfed.org/series/nikkei225"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"23,637.60", chg:-1.55, series:[24008.55,23637.60],
      txt:{en:`<b>Hong Kong's Hang Seng fell 1.55% to 23,637.60 Friday, breaking below 24,000, while the Shanghai Composite fell 0.59% to 3,634.35.</b>`, th:`<b>ดัชนี Hang Seng ฮ่องกงลดลง 1.55% สู่ 23,637.60 วันศุกร์ หลุดระดับ 24,000 ขณะที่ Shanghai Composite ลดลง 0.59% สู่ 3,634.35</b>`},
      why:{en:`Hong Kong has now fallen three days running and lost the 24,000 level. Worries that Nvidia's leadership turmoil — and its US–China security angle — could hit Chinese tech supply chains added to the pressure from high US yields, which tighten Hong Kong's dollar-pegged financial conditions. Mainland China is drifting lower as policy support fails to lift sentiment.`, th:`ฮ่องกงลดลง 3 วันติดและหลุดระดับ 24,000 ความกังวลว่าความวุ่นวายในทีมผู้บริหาร Nvidia — และมิติด้านความมั่นคงสหรัฐฯ–จีน — อาจกระทบห่วงโซ่อุปทานเทคจีน ซ้ำเติมแรงกดดันจากผลตอบแทนบอนด์สหรัฐฯ ที่สูง ซึ่งทำให้สภาพคล่องในฮ่องกงที่ผูกค่าเงินกับดอลลาร์ตึงขึ้น จีนแผ่นดินใหญ่ค่อย ๆ ลดลง เพราะมาตรการสนับสนุนยังไม่สามารถดันความเชื่อมั่นได้`},
      full:{en:`Hong Kong's Hang Seng Index closed at 23,637.60 on Friday, November 13, down about 371 points (−1.55%) from Thursday's 24,008.55, as concerns over Nvidia's leadership turmoil weighed on China's technology sector. In mainland China, the Shanghai Composite fell 0.59% to 3,634.35.`, th:`ดัชนี Hang Seng ฮ่องกงปิดที่ 23,637.60 วันศุกร์ที่ 13 พ.ย. ลดลงราว 371 จุด (−1.55%) จาก 24,008.55 ของวันพฤหัสฯ เนื่องจากความกังวลเรื่องความวุ่นวายในทีมผู้บริหาร Nvidia กดดันหุ้นเทคจีน ส่วนจีนแผ่นดินใหญ่ Shanghai Composite ลดลง 0.59% สู่ 3,634.35`},
      sources:[{l:"Yahoo Finance — Hang Seng Index (^HSI)",u:"https://finance.yahoo.com/quote/%5EHSI/"},{l:"Trading Economics — Hong Kong stock market",u:"https://tradingeconomics.com/hong-kong/stock-market"},{l:"Armenpress — Asian stocks, 13-11-26",u:"https://armenpress.am/en/article/1265619"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,504.88", chg:0.39, series:[1499.06,1504.88],
      txt:{en:`<b>SET Index rose 0.39% (+5.82 pts) to 1,504.88 Friday</b> on turnover of about THB 62.43bn, outperforming the region as banks led and foreign investors bought a net THB 4.36bn.`, th:`<b>ดัชนี SET ขึ้น 0.39% (+5.82 จุด) สู่ 1,504.88 วันศุกร์</b> มูลค่าซื้อขายราว 62,430 ล้านบาท ดีกว่าตลาดในภูมิภาค โดยหุ้นธนาคารนำ และนักลงทุนต่างชาติซื้อสุทธิ 4,360 ล้านบาท`},
      why:{en:`Thailand's low exposure to AI and chips is working in its favour: while Hong Kong fell 1.6%, the SET won back 1,500 with foreign money coming in. Banks benefit from higher-for-longer rates. Monday's MSCI review and SET/TFEX rule changes are the next test of whether foreign buying continues.`, th:`การที่ตลาดไทยมีหุ้น AI และชิปน้อยกลายเป็นข้อได้เปรียบ: ขณะที่ฮ่องกงลดลง 1.6% SET กลับขึ้นเหนือ 1,500 ได้พร้อมเงินต่างชาติไหลเข้า หุ้นธนาคารได้ประโยชน์จากดอกเบี้ยที่สูงนาน การปรับดัชนี MSCI และเกณฑ์ซื้อขาย SET/TFEX วันจันทร์ คือบททดสอบว่าแรงซื้อต่างชาติจะต่อเนื่องหรือไม่`},
      full:{en:`Thailand's SET Index rose 5.82 points (+0.39%) to close at 1,504.88 on Friday, November 13, with trading value of about THB 62.43 billion, according to Kaohoon International's market roundup. Analysts attributed the Thai market's outperformance against regional peers mainly to support from banking stocks, and foreign investors were net buyers of about THB 4.36 billion. Krungthai XSpring had flagged support at 1,480 and resistance at 1,510. Catalysts ahead include the MSCI index review and the SET/TFEX trading-guideline revision on 16 November.`, th:`ดัชนี SET ขึ้น 5.82 จุด (+0.39%) ปิดที่ 1,504.88 วันศุกร์ที่ 13 พ.ย. มูลค่าซื้อขายราว 62,430 ล้านบาท ตามรายงานสรุปตลาดของ Kaohoon International นักวิเคราะห์ระบุว่าตลาดไทยดีกว่าตลาดในภูมิภาคเพราะแรงหนุนจากหุ้นธนาคารเป็นหลัก และนักลงทุนต่างชาติซื้อสุทธิราว 4,360 ล้านบาท บล.กรุงไทย เอ็กซ์สปริง ให้แนวรับ 1,480 และแนวต้าน 1,510 ปัจจัยที่ต้องจับตาคือการปรับดัชนี MSCI และการปรับเกณฑ์การซื้อขายของ SET/TFEX วันที่ 16 พ.ย.`},
      sources:[{l:"Kaohoon International — Market Roundup 13 November 2026",u:"https://www.kaohooninternational.com/markets/594732"},{l:"Kaohoon International — Trading value by investor type, 13 November 2026",u:"https://www.kaohooninternational.com/markets/594730"},{l:"Kaohoon International — Thai Stock Market Outlook on 13 November 2026",u:"https://www.kaohooninternational.com/markets/594634"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil was flat Friday: Brent settled at $95.84/bbl (+$0.02) and WTI at $88.56 (−0.2%),</b> both posting a second straight weekly decline. Gold futures slipped about 0.2% to roughly $3,876/oz, staying near Thursday's 13-month low.`, th:`<b>น้ำมันทรงตัววันศุกร์: Brent ปิดที่ $95.84 ต่อบาร์เรล (+$0.02) และ WTI ที่ $88.56 (−0.2%)</b> ทั้งคู่ลดลงเป็นสัปดาห์ที่ 2 ติดกัน ทองคำล่วงหน้าลดลงราว 0.2% สู่ประมาณ $3,876 ต่อออนซ์ ยังอยู่ใกล้ระดับต่ำสุดในรอบ 13 เดือนเมื่อวันพฤหัสฯ`},
     why:{en:`Oil is holding near $96 because the Iran standoff has no deal in sight, while expectations of tighter Fed policy and a supply surplus forecast cap the upside. Gold is behaving like a rate-sensitive asset: with real yields this high it is not acting as a haven, so it should be held as a small hedge rather than bought aggressively on the dip.`, th:`น้ำมันยืนราว $96 เพราะความขัดแย้งกับอิหร่านยังไม่มีข้อตกลง ขณะที่ความคาดหวังว่าเฟดจะคุมเข้มขึ้นและคาดการณ์อุปทานส่วนเกินจำกัดการขึ้น ทองคำเคลื่อนไหวเหมือนสินทรัพย์ที่ไวต่อดอกเบี้ย: เมื่อผลตอบแทนที่แท้จริงสูงขนาดนี้ ทองคำไม่ได้ทำหน้าที่เป็นที่หลบภัย จึงควรถือเป็นสัดส่วนเล็กเพื่อป้องกันความเสี่ยง มากกว่าเร่งช้อนซื้อ`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 10-year Treasury yield rose about 5bp to roughly 5.15% Friday and the 30-year to ~5.48%, while the 2-year was flat near 4.87%.</b> October PPI rose 0.3% m/m (forecast 0.4%) and 6.5% y/y; core PPI rose 0.3% m/m and 5.0% y/y.`, th:`<b>ผลตอบแทนบอนด์สหรัฐฯ 10 ปีขึ้นราว 0.05% สู่ประมาณ 5.15% วันศุกร์ และบอนด์ 30 ปีสู่ราว 5.48% ขณะที่บอนด์ 2 ปีทรงตัวราว 4.87%</b> PPI เดือน ต.ค. ขึ้น 0.3% จากเดือนก่อน (คาด 0.4%) และ 6.5% จากปีก่อน PPI พื้นฐานขึ้น 0.3% จากเดือนก่อน และ 5.0% จากปีก่อน`},
     why:{en:`The slightly soft monthly PPI trimmed the most hawkish bets, but 6.5% annual producer inflation keeps a December hike as the base case. Long yields rising faster than short ones means investors want more pay to lend for longer — bad news for long-duration bonds. Short-dated bonds near 4.9% remain the better place for new fixed-income money.`, th:`PPI รายเดือนที่ต่ำกว่าคาดเล็กน้อยช่วยลดการเดิมพันว่าเฟดจะขึ้นดอกเบี้ยแรงมาก แต่เงินเฟ้อผู้ผลิต 6.5% ต่อปีทำให้การขึ้นดอกเบี้ยเดือนธันวาคมยังเป็นกรณีหลัก ผลตอบแทนบอนด์ระยะยาวที่ขึ้นเร็วกว่าระยะสั้น แสดงว่านักลงทุนต้องการผลตอบแทนมากขึ้นเพื่อให้กู้ยาว — เป็นข่าวไม่ดีสำหรับบอนด์อายุยาว ตราสารหนี้อายุสั้นที่ให้ราว 4.9% ยังเหมาะกับเงินลงทุนใหม่มากกว่า`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`No new tariff move this week. Democrats, who won both chambers in the Nov 3 midterms, plan a bill to undo Trump's tariffs, but the White House says it will press ahead because the tariffs now rest on Section 301 of trade law rather than emergency powers. Producer prices up 6.5% from a year earlier show tariffs and energy are still feeding through the supply chain, and Trump's hard line on Iran keeps foreign policy a source of volatility.`, th:`สัปดาห์นี้ไม่มีความเคลื่อนไหวใหม่เรื่องภาษีนำเข้า พรรคเดโมแครตที่ชนะทั้งสองสภาในการเลือกตั้งกลางเทอมวันที่ 3 พ.ย. วางแผนเสนอกฎหมายยกเลิกภาษีของทรัมป์ แต่ทำเนียบขาวยืนยันจะเดินหน้าต่อ เพราะภาษีตอนนี้อิงมาตรา 301 ของกฎหมายการค้า ไม่ใช่อำนาจฉุกเฉิน ราคาผู้ผลิตที่สูงขึ้น 6.5% จากปีก่อนแสดงว่าภาษีและพลังงานยังส่งผ่านในห่วงโซ่อุปทาน และท่าทีแข็งกร้าวของทรัมป์ต่ออิหร่านทำให้นโยบายต่างประเทศยังเป็นต้นเหตุความผันผวน`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`The US–Iran standoff is unresolved after Trump said Thursday the US no longer needs a deal ("We've got their Strait"); Brent held at $95.84 Friday. Nvidia's CEO exit — linked in reports to an affair with a suspected Chinese spy — is now weighing on Chinese tech, with the Hang Seng down 1.55% and below 24,000.`, th:`ความขัดแย้งสหรัฐฯ–อิหร่านยังไม่คลี่คลาย หลังทรัมป์บอกเมื่อวันพฤหัสฯ ว่าสหรัฐฯ ไม่จำเป็นต้องมีข้อตกลงแล้ว ("เราคุมช่องแคบของพวกเขาไว้แล้ว") Brent ยืนที่ $95.84 วันศุกร์ การลาออกของซีอีโอ Nvidia — ซึ่งมีรายงานว่าเกี่ยวกับความสัมพันธ์กับผู้ต้องสงสัยเป็นสายลับจีน — ตอนนี้กดดันหุ้นเทคจีน โดย Hang Seng ลดลง 1.55% และหลุด 24,000`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The 10-year held near 5.15% Friday and the 30-year rose to about 5.48% — the 10-year jumped roughly 29bp over the week, its biggest weekly rise since 2024. A December Fed hike remains the base case after hot CPI and 6.5% annual PPI. Short-dated bonds near 4.9% offer income with limited price risk; long-duration bonds and expensive growth stocks remain exposed.`, th:`บอนด์ 10 ปียืนราว 5.15% วันศุกร์ และบอนด์ 30 ปีขึ้นสู่ราว 5.48% — ทั้งสัปดาห์บอนด์ 10 ปีขึ้นราว 0.29% มากที่สุดในรอบสัปดาห์ตั้งแต่ปี 2024 การที่เฟดจะขึ้นดอกเบี้ยเดือนธันวาคมยังเป็นกรณีหลัก หลัง CPI ร้อนแรงและ PPI ขึ้น 6.5% ต่อปี ตราสารหนี้อายุสั้นที่ให้ราว 4.9% ให้รายได้โดยมีความเสี่ยงด้านราคาจำกัด ส่วนบอนด์อายุยาวและหุ้นเติบโตที่แพงยังมีความเสี่ยง`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
