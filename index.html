<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Wall Street Falls a Fourth Day as Yields Near 4.9% and Hike Odds Jump Ahead of CPI", th:"วอลล์สตรีทร่วงวันที่สี่ ผลตอบแทนใกล้ 4.9% โอกาสขึ้นดอกเบี้ยพุ่ง ก่อนตัวเลข CPI"},
    heroDeck:{en:"US stocks fell for a fourth straight session Thursday — S&P 500 −0.58% to 7,591.70, Dow −316.56 pts (−0.6%) to 52,064.10, Nasdaq −0.65% to 26,081.72 — as Brent crude held near $101, its highest level in about four months, and the 10-year Treasury yield pushed above 4.9%, approaching the psychologically important 5% level for the first time since late 2023. Germany's DAX fell 0.8% to 25,401 after the ECB raised rates 25bp and flagged Middle-East-linked inflation risk; Hong Kong's Hang Seng dropped 1.27% while Japan's Nikkei edged up 0.20% and Thailand's SET eased 0.17% on profit-taking. Fed-funds futures now imply roughly a 72% chance of a September 16 hike, up sharply from ~57% Wednesday, putting enormous weight on today's (Friday's) August CPI report.", th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกันวันพฤหัสบดี — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 316.56 จุด (-0.6%) สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 — ขณะน้ำมันดิบเบรนท์ยืนใกล้ $101 สูงสุดในรอบราวสี่เดือน และผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% เข้าใกล้ระดับ 5% ที่มีนัยสำคัญทางจิตวิทยาเป็นครั้งแรกนับตั้งแต่ปลายปี 2023 ดัชนี DAX เยอรมนีลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ย 25bp และเตือนความเสี่ยงเงินเฟ้อจากตะวันออกกลาง ดัชนี Hang Seng ฮ่องกงลดลง 1.27% ขณะ Nikkei ญี่ปุ่นขยับขึ้น 0.20% และ SET ไทยลดลง 0.17% จากแรงขายทำกำไร ตลาดสัญญาล่วงหน้าอัตราดอกเบี้ยเฟดตอนนี้สะท้อนโอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. ราว 72% เพิ่มขึ้นมากจากราว 57% วันพุธ ทำให้ตัวเลข CPI เดือน ส.ค. วันนี้ (ศุกร์) มีความสำคัญอย่างยิ่ง"},

    leadtxt:{en:`<b>Wall Street just posted its fourth straight losing session, and the story hasn't changed: oil near a four-month high and Treasury yields flirting with 5%.</b> The S&P 500 slipped to 7,591.70, the DAX fell 0.8% to 25,401 after the ECB hiked and warned on inflation, and the 10-year Treasury yield pushed above 4.9% — its highest since late 2023. September hike odds jumped to roughly 72%, from ~57% just a day earlier, as traders brace for today's August CPI print, the last data point before the Fed's Sep 16 decision. For your clients: with yields this close to 5% and one make-or-break inflation report still ahead, this remains a <b>strong window to lock in bond income</b> — and a reason to stay defensive through the CPI release.`, th:`<b>วอลล์สตรีทปรับลงเป็นวันที่สี่ติดต่อกัน และเรื่องราวยังไม่เปลี่ยน: น้ำมันใกล้จุดสูงสุดในรอบสี่เดือน และผลตอบแทนพันธบัตรเข้าใกล้ระดับ 5%</b> ดัชนี S&P 500 ลดลงสู่ 7,591.70 ดัชนี DAX ลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ยและเตือนความเสี่ยงเงินเฟ้อ และผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% สูงสุดตั้งแต่ปลายปี 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% จากราว 57% เพียงวันก่อน ขณะนักลงทุนรอตัวเลข CPI เดือน ส.ค. วันนี้ ข้อมูลสำคัญสุดท้ายก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย. สำหรับลูกค้าของคุณ: เมื่อผลตอบแทนใกล้ระดับ 5% ขนาดนี้ และยังมีรายงานเงินเฟ้อชี้ขาดอีกหนึ่งฉบับข้างหน้า นี่ยังคงเป็น <b>จังหวะดีในการล็อกรายได้จากพันธบัตร</b> — และเหตุผลให้ตั้งรับต่อไปจนกว่าจะเห็นตัวเลข CPI`},

    watchnote:{en:`September hike odds jumped to roughly 72% Thursday, from ~57% just a day earlier, as the 10-year Treasury yield pushed above 4.9% — approaching 5% for the first time since late 2023 — even as markets braced for the week's decisive release. <b style="color:var(--muted)">Today's August CPI print</b> is the last major data point before the Fed's Sep 16 decision, and now carries outsized weight given how sharply rate expectations have already moved.`,
      th:`โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% วันพฤหัสบดี จากราว 57% เพียงวันก่อน ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% เข้าใกล้ระดับ 5% เป็นครั้งแรกนับตั้งแต่ปลายปี 2023 ขณะตลาดเตรียมรับข้อมูลชี้ขาดของสัปดาห์ <b style="color:var(--muted)">ตัวเลข CPI เดือน ส.ค. วันนี้</b> คือข้อมูลสำคัญสุดท้ายก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย. และมีความสำคัญอย่างยิ่งเมื่อพิจารณาว่าคาดการณ์อัตราดอกเบี้ยขยับไปมากแล้ว`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,591.70", chg:-0.58, series:[7636.36,7591.70],
      txt:{en:`<b>US stocks fell a fourth straight session Thursday — the S&P 500 -0.58% to 7,591.70, the Dow -0.6% (-316.56 pts) to 52,064.10, the Nasdaq -0.65% to 26,081.72 —</b> as Brent crude held near its highest level in about four months and the 10-year Treasury yield pushed above 4.9%, approaching 5% for the first time since late 2023.`, th:`<b>หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกันวันพฤหัสบดี — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 0.6% (-316.56 จุด) สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 —</b> ขณะน้ำมันดิบเบรนท์ยืนใกล้จุดสูงสุดในรอบราวสี่เดือน และผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% เข้าใกล้ระดับ 5% เป็นครั้งแรกนับตั้งแต่ปลายปี 2023`},
      why:{en:`Four straight down days plus a jump in hike odds from ~57% to ~72% in a single session is the market re-pricing fast, not drifting. Yields near 5% and oil near a four-month high are now pulling in the same direction — toward tighter financial conditions — which removes the "offsetting forces" argument clients may have been leaning on. Today's CPI is the print that either confirms this repricing or reverses it.`, th:`การปรับลงสี่วันติดต่อกัน บวกกับโอกาสขึ้นดอกเบี้ยที่พุ่งจากราว 57% สู่ราว 72% ในเซสชันเดียว คือตลาดที่กำลังปรับราคาเร็ว ไม่ใช่แค่ไหลตัวช้า ๆ ผลตอบแทนที่ใกล้ 5% และน้ำมันที่ใกล้จุดสูงสุดในรอบสี่เดือนตอนนี้ดึงไปในทิศทางเดียวกัน — สู่ภาวะการเงินที่ตึงตัวขึ้น — ซึ่งลบข้อโต้แย้งเรื่อง "แรงหักล้างกัน" ที่ลูกค้าอาจยึดถืออยู่ CPI วันนี้คือตัวเลขที่จะยืนยันหรือพลิกกลับการปรับราคานี้`},
      full:{en:`US stocks closed lower Thursday for a fourth straight session as rising Treasury yields and elevated oil prices continued to rattle investors ahead of Friday's CPI report. The S&P 500 fell 0.58% to close at 7,591.70, the Dow Jones Industrial Average dropped 316.56 points (-0.6%) to 52,064.10, and the Nasdaq Composite eased 0.65% to 26,081.72. Oil held near its highest level in roughly four months, and the 10-year Treasury yield climbed above 4.9% — its highest since late 2023 and closing in on the 5% level — after Wednesday's PPI report and continued Iran-tanker-war risk kept inflation expectations elevated. CME-tracked odds of a September 16 rate hike jumped to roughly 72%, from ~57% a day earlier, as traders now await Friday's August CPI print — the last major data point before the Fed's decision.`, th:`หุ้นสหรัฐฯ ปิดตลาดปรับลงวันพฤหัสบดีเป็นวันที่สี่ติดต่อกัน ขณะผลตอบแทนพันธบัตรและราคาน้ำมันที่สูงขึ้นยังคงสร้างความกังวลให้นักลงทุนก่อนตัวเลข CPI วันศุกร์ ดัชนี S&P 500 ลดลง 0.58% ปิดที่ 7,591.70 ดัชนี Dow Jones ลดลง 316.56 จุด (-0.6%) สู่ 52,064.10 และดัชนี Nasdaq Composite อ่อนตัวลง 0.65% สู่ 26,081.72 น้ำมันยืนใกล้จุดสูงสุดในรอบราวสี่เดือน และผลตอบแทนพันธบัตร 10 ปีขึ้นทะลุ 4.9% สูงสุดตั้งแต่ปลายปี 2023 และเข้าใกล้ระดับ 5% หลังตัวเลข PPI วันพุธและความเสี่ยงสงครามเรือบรรทุกน้ำมันอิหร่านที่ต่อเนื่องยังคงหนุนคาดการณ์เงินเฟ้อให้สูง โอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. ตามข้อมูล CME พุ่งขึ้นสู่ราว 72% จากราว 57% เมื่อวันก่อน ขณะนักลงทุนรอตัวเลข CPI เดือน ส.ค. วันศุกร์ ข้อมูลสำคัญสุดท้ายก่อนการตัดสินใจของเฟด`},
      sources:[{l:"TheStreet — Sept 10 close",u:"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-10-2026"},{l:"Yahoo Finance — Sept 10 live",u:"https://finance.yahoo.com/markets/live/stock-market-today-thursday-september-10-dow-sp-500-nasdaq-oil-gains-100-083717303.html"},{l:"CNBC — Friday's CPI preview",u:"https://www.cnbc.com/2026/09/10/fridays-cpi-inflation-report-is-even-more-important-than-usual-heres-what-to-expect.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,401", chg:-0.8, series:[25554,25401],
      txt:{en:`<b>DAX fell 0.8% to 25,401 Thursday,</b> after the ECB raised rates 25bp as expected and warned of persistent upside inflation risk tied to the Middle East conflict; Siemens Energy, Zalando and Vonovia led the losses.`, th:`<b>DAX ลดลง 0.8% สู่ 25,401 วันพฤหัสบดี</b> หลัง ECB ขึ้นดอกเบี้ย 25bp ตามคาด และเตือนความเสี่ยงเงินเฟ้อด้านสูงที่เชื่อมโยงกับความขัดแย้งตะวันออกกลาง Siemens Energy, Zalando และ Vonovia นำการปรับลง`},
      why:{en:`A rate hike paired with an explicit inflation warning from the ECB — not just oil headlines — is the more durable signal here: Europe's own central bank now sees the tanker war as a genuine inflation risk, not a passing shock. That reinforces the case for European rate-sensitive sectors staying under pressure into year-end.`, th:`การขึ้นดอกเบี้ยพร้อมคำเตือนเรื่องเงินเฟ้ออย่างชัดเจนจาก ECB — ไม่ใช่แค่พาดหัวข่าวน้ำมัน — คือสัญญาณที่คงทนกว่า: ธนาคารกลางยุโรปเองมองว่าสงครามเรือบรรทุกน้ำมันเป็นความเสี่ยงเงินเฟ้อจริง ไม่ใช่แรงกระแทกชั่วคราว สนับสนุนมุมมองว่ากลุ่มหุ้นยุโรปที่อ่อนไหวต่อดอกเบี้ยจะยังถูกกดดันต่อไปจนถึงปลายปี`},
      full:{en:`European shares fell Thursday, with Germany's DAX closing down 0.8% at 25,401, as the European Central Bank raised its key rate by 25 basis points and warned of persistent upside inflation risk linked to the Middle East conflict and elevated energy prices. Siemens Energy (-2.98%), Zalando (-2.75%) and Vonovia (-2.73%) led the losses. The decline follows Wednesday's one-month-low close and keeps European equities aligned with the broader sell-off on Wall Street, with Brent crude still holding near a four-month high and European natural gas prices at multi-year highs.`, th:`หุ้นยุโรปปรับลงวันพฤหัสบดี ดัชนี DAX เยอรมนีปิดตลาดลง 0.8% ที่ 25,401 หลังธนาคารกลางยุโรป (ECB) ขึ้นดอกเบี้ยนโยบาย 25bp และเตือนความเสี่ยงเงินเฟ้อด้านสูงที่ต่อเนื่อง เชื่อมโยงกับความขัดแย้งตะวันออกกลางและราคาพลังงานที่สูงขึ้น Siemens Energy (-2.98%), Zalando (-2.75%) และ Vonovia (-2.73%) นำการปรับลง การปรับลงนี้ต่อเนื่องจากจุดต่ำสุดในรอบเดือนเมื่อวันพุธ และทำให้หุ้นยุโรปเคลื่อนไหวสอดคล้องกับการเทขายในวอลล์สตรีท ขณะน้ำมันดิบเบรนท์ยังยืนใกล้จุดสูงสุดในรอบสี่เดือน และราคาแก๊สธรรมชาติยุโรปแตะสูงสุดในรอบหลายปี`},
      sources:[{l:"AdvFN — European stocks",u:"https://uk.advfn.com/market-news/article/22534/european-stocks-fall-as-oil-prices-and-german-political-uncertainty-weigh-dax-cac-ftse100"},{l:"Babypips — Sept 10 recap",u:"https://www.babypips.com/news/financial-forex-market-recap-2026-09-10"},{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"65,270.95", chg:0.20, series:[65142.78,65270.95],
      txt:{en:`<b>Nikkei 225 edged up 0.20% to 65,270.95 Thursday (TOPIX +0.20%),</b> holding up better than most of the region even as oil stayed near a four-month high and US yields pushed toward 5% ahead of Friday's CPI.`, th:`<b>Nikkei 225 ขยับขึ้น 0.20% สู่ 65,270.95 วันพฤหัสบดี (TOPIX +0.20%)</b> ยืนได้ดีกว่าตลาดส่วนใหญ่ในภูมิภาค แม้น้ำมันยังยืนใกล้จุดสูงสุดในรอบสี่เดือน และผลตอบแทนพันธบัตรสหรัฐฯ เข้าใกล้ 5% ก่อน CPI วันศุกร์`},
      why:{en:`Japan's small gain while Hong Kong dropped over 1% is a genuine split, not noise — the AI/tech trade is still cushioning Tokyo even as yield-sensitive markets elsewhere sell off. That divergence could reverse quickly if today's CPI surprises hot and drags US yields decisively through 5%.`, th:`การที่ญี่ปุ่นขึ้นเล็กน้อย ขณะฮ่องกงลดลงกว่า 1% คือการแยกทิศทางที่แท้จริง ไม่ใช่สัญญาณรบกวน — กระแส AI/เทคโนโลยียังช่วยพยุงโตเกียว แม้ตลาดที่อ่อนไหวต่อผลตอบแทนพันธบัตรที่อื่นเทขาย ความแตกต่างนี้อาจพลิกกลับเร็วหาก CPI วันนี้ออกมาร้อนแรงเกินคาด และดึงผลตอบแทนพันธบัตรสหรัฐฯ ทะลุ 5% อย่างชัดเจน`},
      full:{en:`Japanese equities edged higher Thursday, with the Nikkei 225 up 0.20% to close at 65,270.95 and the TOPIX up 0.20% to 4,054.58, as AI- and semiconductor-linked names continued to offset pressure from elevated oil prices and rising US Treasury yields. The move stood in contrast to declines elsewhere in the region, with markets now focused on Friday's US CPI report and its implications for the Fed's September 16 decision.`, th:`หุ้นญี่ปุ่นขยับขึ้นวันพฤหัสบดี ดัชนี Nikkei 225 เพิ่มขึ้น 0.20% ปิดที่ 65,270.95 และ TOPIX เพิ่มขึ้น 0.20% สู่ 4,054.58 ขณะหุ้นกลุ่ม AI และเซมิคอนดักเตอร์ยังช่วยชดเชยแรงกดดันจากราคาน้ำมันที่สูงและผลตอบแทนพันธบัตรสหรัฐฯ ที่เพิ่มขึ้น การเคลื่อนไหวนี้ตรงข้ามกับการปรับลงในภูมิภาคอื่น ขณะตลาดตอนนี้จับตาตัวเลข CPI สหรัฐฯ วันศุกร์ และผลต่อการตัดสินใจของเฟดวันที่ 16 ก.ย.`},
      sources:[{l:"Armenpress — Asian Stocks 10-09-26",u:"https://armenpress.am/en/article/1260148"},{l:"Trading Economics",u:"https://tradingeconomics.com/japan/stock-market"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,954.47", chg:-1.27, series:[25274.96,24954.47],
      txt:{en:`<b>Hang Seng dropped 1.27% to 24,954.47 Thursday, while the Shanghai Composite eased 0.43% to 3,934.40</b> — Hong Kong's sharpest one-day drop of the week, as rate-sensitive names sold off on US yields nearing 5%.`, th:`<b>Hang Seng ลดลง 1.27% สู่ 24,954.47 วันพฤหัสบดี ขณะ Shanghai Composite ลดลง 0.43% สู่ 3,934.40</b> — การปรับลงแรงที่สุดในสัปดาห์ของฮ่องกง เมื่อหุ้นที่อ่อนไหวต่อดอกเบี้ยเทขายตามผลตอบแทนพันธบัตรสหรัฐฯ ที่ใกล้ 5%`},
      why:{en:`This is the clearest sign yet that the region has stopped underpricing the risk we flagged Wednesday — a 1.27% single-day drop is a real repricing, not noise. With Friday's CPI still ahead, don't assume Hong Kong has fully adjusted; a hot print could extend this move.`, th:`นี่คือสัญญาณชัดเจนที่สุดว่าภูมิภาคเลิกประเมินความเสี่ยงต่ำเกินไปตามที่เคยเตือนไว้วันพุธ — การลดลง 1.27% ในวันเดียวคือการปรับราคาจริง ไม่ใช่สัญญาณรบกวน เมื่อ CPI วันศุกร์ยังมาไม่ถึง อย่าคิดว่าฮ่องกงปรับตัวเต็มที่แล้ว ตัวเลขที่ร้อนแรงอาจทำให้การปรับลงนี้ยืดออกไปอีก`},
      full:{en:`Hong Kong and mainland China both fell Thursday: the Hang Seng dropped 1.27% to close at 24,954.47 as US Treasury yields near 5% and Fed hike odds near 72% weighed on rate-sensitive financials and property names, while the Shanghai Composite eased 0.43% to 3,934.40. The declines mark a clear escalation from Wednesday's contained moves, as regional markets catch up to the scale of the oil and rates shock ahead of Friday's US CPI print.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่ปรับลงทั้งคู่วันพฤหัสบดี: ดัชนี Hang Seng ลดลง 1.27% ปิดที่ 24,954.47 ขณะผลตอบแทนพันธบัตรสหรัฐฯ ที่ใกล้ 5% และโอกาสขึ้นดอกเบี้ยเฟดที่ใกล้ 72% กดดันหุ้นกลุ่มการเงินและอสังหาริมทรัพย์ที่อ่อนไหวต่อดอกเบี้ย ส่วนดัชนี Shanghai Composite ลดลง 0.43% สู่ 3,934.40 การปรับลงนี้ทวีความรุนแรงชัดเจนจากการเคลื่อนไหวที่จำกัดวันพุธ ขณะตลาดภูมิภาคตามให้ทันขนาดของแรงกระแทกจากน้ำมันและดอกเบี้ยก่อนตัวเลข CPI สหรัฐฯ วันศุกร์`},
      sources:[{l:"Armenpress — Asian Stocks 10-09-26",u:"https://armenpress.am/en/article/1260148"},{l:"Trading Economics",u:"https://tradingeconomics.com/hong-kong/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,615.07", chg:-0.17, series:[1617.89,1615.07],
      txt:{en:`<b>SET Index eased 0.17% to 1,615.07 Thursday (-2.82pts),</b> on turnover of about THB 69.91bn, as profit-taking in TOP, DELTA and GULF combined with $100+ oil and elevated US yields ahead of Friday's CPI.`, th:`<b>ดัชนี SET ลดลง 0.17% สู่ 1,615.07 วันพฤหัสบดี (-2.82 จุด)</b> มูลค่าการซื้อขายราว 6.991 หมื่นล้านบาท จากแรงขายทำกำไรในหุ้น TOP, DELTA และ GULF ผสมกับน้ำมันเหนือ $100 และผลตอบแทนพันธบัตรสหรัฐฯ ที่สูงขึ้นก่อน CPI วันศุกร์`},
      why:{en:`A shallow, big-cap-led pullback rather than a broad sell-off suggests Thai investors are positioning ahead of the CPI catalyst rather than panicking. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity, but expect the SET to trade sideways-down until the CPI print clarifies the rate path.`, th:`การปรับลงเล็กน้อยที่นำโดยหุ้นขนาดใหญ่ ไม่ใช่การเทขายกว้าง แสดงว่านักลงทุนไทยกำลังจัดพอร์ตก่อนตัวเร่ง CPI มากกว่าตื่นตระหนก เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว แต่คาดว่า SET จะแกว่งตัวลงจนกว่าตัวเลข CPI จะชี้ทิศทางดอกเบี้ยที่ชัดเจนขึ้น`},
      full:{en:`Thailand's SET Index closed Thursday at 1,615.07, down 2.82 points (-0.17%), on turnover of about THB 69.91 billion. The market moved sideways-down within a limited range, weighed by profit-taking in big-cap names including TOP, DELTA and GULF, alongside external headwinds from prolonged US-Iran tensions, Brent crude holding above $100, and elevated US bond yields. Investors were closely tracking Thursday's US PPI release and Friday's CPI report to gauge the Fed's rate path. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity.`, th:`ดัชนี SET ของไทยปิดตลาดวันพฤหัสบดีที่ 1,615.07 ลดลง 2.82 จุด (-0.17%) มูลค่าการซื้อขายราว 6.991 หมื่นล้านบาท ตลาดเคลื่อนไหวแกว่งตัวลงในกรอบจำกัด กดดันจากแรงขายทำกำไรในหุ้นขนาดใหญ่ เช่น TOP, DELTA และ GULF ประกอบกับปัจจัยกดดันจากภายนอก ได้แก่ ความตึงเครียดสหรัฐฯ-อิหร่านที่ยืดเยื้อ น้ำมันดิบเบรนท์ที่ยืนเหนือ $100 และผลตอบแทนพันธบัตรสหรัฐฯ ที่สูงขึ้น นักลงทุนจับตาตัวเลข PPI สหรัฐฯ วันพฤหัสบดี และ CPI วันศุกร์อย่างใกล้ชิดเพื่อประเมินทิศทางดอกเบี้ยของเฟด เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว`},
      sources:[{l:"Kaohoon International — Market Roundup",u:"https://www.kaohooninternational.com/markets/590460"},{l:"Kaohoon International — profit-taking",u:"https://www.kaohooninternational.com/markets/590436"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil held near its highest level in about four months — Brent around $101/bbl — as the Iran-tanker war and a naval blockade of Iranian ports kept supply risk elevated, while gold edged up to $4,405.88/oz (+0.18%)</b> as investors sought safety ahead of Friday's CPI.`, th:`<b>น้ำมันยังยืนใกล้จุดสูงสุดในรอบราวสี่เดือน — เบรนท์ราว $101 ต่อบาร์เรล — ขณะสงครามเรือบรรทุกน้ำมันอิหร่านและการปิดล้อมทางทะเลต่อท่าเรืออิหร่านยังหนุนความเสี่ยงด้านอุปทาน ส่วนทองคำขยับขึ้นสู่ $4,405.88 ต่อออนซ์ (+0.18%)</b> เมื่อนักลงทุนหาที่หลบภัยก่อน CPI วันศุกร์`},
     why:{en:`Gold finally moving up alongside oil — instead of sitting flat as it did earlier in the week — signals the market is starting to treat this as a genuine risk-off event, not just an energy-supply story. If that shift continues into Friday's CPI, it strengthens the case for gold as a hedge, not just bonds.`, th:`การที่ทองคำเริ่มขยับขึ้นควบคู่กับน้ำมัน แทนที่จะทรงตัวเหมือนช่วงต้นสัปดาห์ เป็นสัญญาณว่าตลาดเริ่มมองนี่เป็นภาวะหลีกเลี่ยงความเสี่ยงจริง ไม่ใช่แค่เรื่องราวด้านอุปทานพลังงาน หากการเปลี่ยนแปลงนี้ดำเนินต่อไปจนถึง CPI วันศุกร์ จะสนับสนุนให้ใช้ทองคำเป็นเครื่องป้องกันความเสี่ยงเพิ่มเติม ไม่ใช่แค่พันธบัตรเพียงอย่างเดียว`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>September hike odds jumped to roughly 72% Thursday, from ~57% a day earlier, as the 10-year Treasury yield pushed above 4.9% — its highest since late 2023 and closing in on 5%.</b> Fed Governor Waller said his rate decision will be "heavily influenced" by Friday's CPI, adding it may not take much to tip him toward supporting a hike.`, th:`<b>โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% วันพฤหัสบดี จากราว 57% เมื่อวันก่อน ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% สูงสุดตั้งแต่ปลายปี 2023 และเข้าใกล้ระดับ 5%</b> คริสโตเฟอร์ วอลเลอร์ กรรมการเฟด ระบุว่าการตัดสินใจของเขาจะ "ได้รับอิทธิพลอย่างมาก" จากตัวเลข CPI วันศุกร์ และอาจไม่ต้องใช้ตัวเลขมากเพื่อโน้มเอียงไปทางสนับสนุนการขึ้นดอกเบี้ย`},
     why:{en:`Hike odds jumping 15 points in a single session, right before the CPI print, means Friday's number carries outsized power to move markets either way — a soft print could unwind much of this move, while a hot one could push yields decisively through 5%. This is the moment to have a clear plan for both outcomes with clients, not just the base case.`, th:`โอกาสขึ้นดอกเบี้ยที่พุ่งขึ้น 15 จุดในเซสชันเดียว ก่อน CPI พอดี หมายความว่าตัวเลขวันศุกร์มีพลังขับเคลื่อนตลาดได้มากทั้งสองทาง — ตัวเลขที่นิ่มอาจล้างการปรับราคานี้ไปมาก ขณะตัวเลขที่ร้อนแรงอาจดันผลตอบแทนทะลุ 5% อย่างชัดเจน นี่คือช่วงเวลาที่ควรมีแผนรองรับทั้งสองสถานการณ์ให้ลูกค้า ไม่ใช่แค่กรณีฐาน`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`With the Fed's September 16 meeting now days away and hike odds having jumped to ~72%, the political pressure campaign continues: Trump, the Vice President and Treasury Secretary have kept urging the Fed to hold or cut, renewing the threat to "stop trading with every country the US runs a deficit against" if the Fed doesn't move. Section 338 tariffs remain in effect and the ~7.5% China "overcapacity" tariff still looms ahead of a planned Trump-Xi summit.`, th:`เมื่อการประชุมเฟดวันที่ 16 ก.ย. เหลือเพียงไม่กี่วัน และโอกาสขึ้นดอกเบี้ยพุ่งขึ้นสู่ราว 72% แคมเปญกดดันทางการเมืองยังดำเนินต่อ: ทรัมป์ รองประธานาธิบดี และรัฐมนตรีคลัง ยังคงเรียกร้องให้เฟดคงหรือลดดอกเบี้ย โดยย้ำคำขู่ว่าจะ "หยุดค้าขายกับทุกประเทศที่สหรัฐฯ ขาดดุลการค้าด้วย" หากเฟดไม่ดำเนินการ มาตรการภาษีมาตรา 338 ยังคงมีผลบังคับใช้ และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้`}, w:{en:`Hike odds jumping to 72% despite the White House's public pressure shows markets are now discounting the political noise and pricing the data directly — reinforce with clients that today's CPI, not the pressure campaign, will settle this.`, th:`โอกาสขึ้นดอกเบี้ยที่พุ่งสู่ 72% แม้ทำเนียบขาวกดดันต่อสาธารณะ แสดงว่าตลาดกำลังลดความสำคัญของเสียงกดดันทางการเมือง และสะท้อนราคาตามข้อมูลจริงมากขึ้น ควรย้ำกับลูกค้าว่า CPI วันนี้ ไม่ใช่แคมเปญกดดัน จะเป็นตัวชี้ขาด`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`The Iran-US tanker war remains the backdrop for this week's moves: after the US destroyed five Iranian crude tankers Tuesday, Iran retaliated Wednesday by firing ballistic missiles at the Al-Azraq base in Jordan and striking ten ships near the Strait of Hormuz. Jordan's military said it intercepted 18 of 20 missiles, with no casualties reported. Brent crude has since held near $101/bbl, its highest in about four months, keeping energy-driven inflation risk elevated into Friday's CPI.`, th:`สงครามเรือบรรทุกน้ำมันสหรัฐฯ-อิหร่านยังเป็นปัจจัยหลักของการเคลื่อนไหวสัปดาห์นี้: หลังสหรัฐฯ ทำลายเรือบรรทุกน้ำมันดิบอิหร่าน 5 ลำวันอังคาร อิหร่านตอบโต้กลับวันพุธด้วยการยิงขีปนาวุธพิสัยไกลไปยังฐานทัพอัลอัซรัคในจอร์แดน และโจมตีเรือ 10 ลำใกล้ช่องแคบฮอร์มุซ กองทัพจอร์แดนระบุว่าสามารถสกัดกั้นขีปนาวุธได้ 18 จาก 20 ลูก ไม่มีผู้บาดเจ็บ น้ำมันดิบเบรนท์นับจากนั้นยืนใกล้ $101 ต่อบาร์เรล สูงสุดในรอบราวสี่เดือน ยังคงหนุนความเสี่ยงเงินเฟ้อจากพลังงานให้สูงก่อนถึง CPI วันศุกร์`}, w:{en:`A direct missile strike on a US base — even one successfully intercepted — is a materially higher-risk escalation than tanker attacks alone, yet equity markets have reacted in a fairly measured way so far. Don't assume that calm holds if today's CPI adds inflation fuel on top of an already-live military risk.`, th:`การโจมตีฐานทัพสหรัฐฯ ด้วยขีปนาวุธโดยตรง แม้จะถูกสกัดกั้นได้สำเร็จ ถือเป็นการทวีความรุนแรงที่มีความเสี่ยงสูงกว่าการโจมตีเรือบรรทุกน้ำมันเพียงอย่างเดียวอย่างมีนัยสำคัญ กระนั้น ตลาดหุ้นตอบสนองค่อนข้างพอประมาณจนถึงตอนนี้ อย่าคิดว่าความสงบนี้จะคงอยู่ หาก CPI วันนี้เติมเชื้อเพลิงเงินเฟ้อซ้อนทับความเสี่ยงทางการทหารที่ยังดำเนินอยู่`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`September hike odds jumped to roughly 72% Thursday, from ~57% a day earlier, as the 10-year Treasury yield pushed above 4.9% — its highest since late 2023 and closing in on the psychologically important 5% level — after Wednesday's in-line PPI report kept inflation pressure in focus. Germany's ECB, meanwhile, raised its own rate 25bp and flagged persistent upside inflation risk from the Middle East conflict.`, th:`โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% วันพฤหัสบดี จากราว 57% เมื่อวันก่อน ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% สูงสุดตั้งแต่ปลายปี 2023 และเข้าใกล้ระดับ 5% ที่มีนัยสำคัญทางจิตวิทยา หลังตัวเลข PPI วันพุธที่ออกมาตามคาดยังคงตอกย้ำแรงกดดันเงินเฟ้อ ขณะ ECB ของเยอรมนีก็ขึ้นดอกเบี้ยของตนเอง 25bp และเตือนความเสี่ยงเงินเฟ้อด้านสูงที่ต่อเนื่องจากความขัดแย้งตะวันออกกลาง`}, w:{en:`A 15-point jump in hike odds in a single session, right before the CPI print, means today's number carries outsized power to move rates either way. This is the moment to have a clear plan with clients for both a hot and a soft surprise, not just the base case of locking in yields near cycle highs.`, th:`โอกาสขึ้นดอกเบี้ยที่พุ่งขึ้น 15 จุดในเซสชันเดียว ก่อน CPI พอดี หมายความว่าตัวเลขวันนี้มีพลังขับเคลื่อนดอกเบี้ยได้มากทั้งสองทาง นี่คือช่วงเวลาที่ควรมีแผนรองรับทั้งกรณีตัวเลขร้อนแรงและกรณีตัวเลขนิ่มให้ลูกค้า ไม่ใช่แค่กรณีฐานของการล็อกผลตอบแทนที่ใกล้จุดสูงสุดของรอบนี้`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`Today's August CPI report is the week's decisive release: oil near a four-month high, Wednesday's PPI print, and a jump in Fed hike odds to ~72% have all raised the stakes ahead of the data. Economists expect headline CPI up 0.4% month-over-month and 3.4% year-over-year, with core CPI up 0.4% m/m and 2.4% y/y — Fed Governor Waller has said the release will "heavily influence" his rate vote.`, th:`รายงาน CPI เดือน ส.ค. วันนี้คือข้อมูลชี้ขาดของสัปดาห์: น้ำมันที่ใกล้จุดสูงสุดในรอบสี่เดือน ตัวเลข PPI วันพุธ และโอกาสขึ้นดอกเบี้ยเฟดที่พุ่งสู่ราว 72% ต่างเพิ่มความสำคัญของข้อมูลนี้ นักเศรษฐศาสตร์คาดการณ์ CPI ทั่วไปเพิ่มขึ้น 0.4% เทียบเดือนก่อน และ 3.4% เทียบปีก่อน ขณะ Core CPI เพิ่มขึ้น 0.4% เทียบเดือนก่อน และ 2.4% เทียบปีก่อน คริสโตเฟอร์ วอลเลอร์ กรรมการเฟด ระบุว่าตัวเลขนี้จะ "มีอิทธิพลอย่างมาก" ต่อการลงคะแนนของเขา`}, w:{en:`With hike odds already at ~72% before the data even lands, the market has priced in a hawkish outcome — meaning a cooler-than-expected print could trigger a sharp relief rally in both stocks and bonds, while an in-line or hot number could push yields decisively through 5%. Frame both scenarios for clients now, not after the release.`, th:`เมื่อโอกาสขึ้นดอกเบี้ยอยู่ที่ราว 72% แล้วก่อนข้อมูลจะออก แสดงว่าตลาดสะท้อนราคาผลลัพธ์ที่ตึงตัวไปมากแล้ว หมายความว่าตัวเลขที่เย็นกว่าคาดอาจกระตุ้นแรงซื้อคืนที่แข็งแรงทั้งหุ้นและพันธบัตร ขณะตัวเลขที่ตามคาดหรือร้อนแรงอาจดันผลตอบแทนทะลุ 5% อย่างชัดเจน ควรอธิบายทั้งสองสถานการณ์ให้ลูกค้าตอนนี้ ก่อนที่ตัวเลขจะออก`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 8 Sep",th:"อังคาร 8 ก.ย."}, imp:"h", t:{en:"Wall Street reopens for the first time since the tanker war, with hike odds near 60%",th:"วอลล์สตรีทเปิดตลาดอีกครั้งเป็นครั้งแรกหลังสงครามเรือบรรทุกน้ำมัน ขณะโอกาสขึ้นดอกเบี้ยใกล้ 60%"}, d:{en:"US markets reopen Tuesday after the Labor Day break, giving the first direct pricing of both the weekend's Iran-tanker escalation and the climb in September rate-hike odds to roughly 60%. Oil (Brent near $98, WTI above $92) and the elevated 10-year yield (~4.79%) will be the key signals to watch as trading resumes.",th:"ตลาดสหรัฐฯ เปิดทำการอีกครั้งวันอังคารหลังหยุดวันแรงงาน เป็นการสะท้อนราคาโดยตรงครั้งแรกทั้งการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ขยับขึ้นสู่ราว 60% ราคาน้ำมัน (เบรนท์ใกล้ $98, WTI เหนือ $92) และผลตอบแทนพันธบัตร 10 ปีที่สูงขึ้น (~4.79%) จะเป็นสัญญาณสำคัญที่ต้องจับตาเมื่อการซื้อขายกลับมาดำเนินต่อ"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 9 Sep",th:"พุธ 9 ก.ย."}, imp:"h", t:{en:"Oil tops $101 as tanker war's worst wave yet hits Wall St a third day",th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"}, d:{en:"The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%); national gas hit $4.22/gal and diesel a record $5.94/gal. The S&P 500 fell 0.48% to 7,636.36 (a third straight down day), the DAX slid 1.74% to a one-month low of 25,554, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. September hike odds eased slightly to ~57%.",th:"สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ดัชนี S&P 500 ลดลง 0.48% สู่ 7,636.36 (ปรับลงวันที่สามติดต่อกัน) ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือนที่ 25,554 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 10 Sep",th:"พฤหัสฯ 10 ก.ย."}, imp:"h", t:{en:"Wall St falls a fourth day; hike odds jump to ~72% as yields near 5%",th:"วอลล์สตรีทร่วงวันที่สี่ โอกาสขึ้นดอกเบี้ยพุ่งสู่ราว 72% ผลตอบแทนใกล้ 5%"}, d:{en:"US stocks fell a fourth straight session — S&P 500 -0.58% to 7,591.70, Dow -0.6% to 52,064.10, Nasdaq -0.65% to 26,081.72 — as the 10-year Treasury yield pushed above 4.9% and Wednesday's in-line PPI kept inflation in focus. September hike odds jumped to roughly 72%, from ~57% a day earlier. Germany's DAX fell 0.8% to 25,401 after the ECB hiked 25bp; Hong Kong's Hang Seng dropped 1.27% while Japan's Nikkei edged up 0.20% and Thailand's SET eased 0.17% on profit-taking. Oil held near $101 and gold rose to $4,405.88.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกัน — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 0.6% สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 — ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% และ PPI วันพุธที่ออกมาตามคาดยังตอกย้ำแรงกดดันเงินเฟ้อ โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% จากราว 57% เมื่อวันก่อน ดัชนี DAX เยอรมนีลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ย 25bp ดัชนี Hang Seng ฮ่องกงลดลง 1.27% ขณะ Nikkei ญี่ปุ่นขยับขึ้น 0.20% และ SET ไทยลดลง 0.17% จากแรงขายทำกำไร น้ำมันยืนใกล้ $101 และทองคำเพิ่มขึ้นสู่ $4,405.88"}},
    {day:{en:"Today",th:"วันนี้"}, date:{en:"Fri 11 Sep",th:"ศุกร์ 11 ก.ย."}, imp:"h", t:{en:"August CPI lands at 8:30am ET — the decisive print before the Fed's Sep 16 decision",th:"CPI เดือน ส.ค. ออกเวลา 8:30 น. ตามเวลาสหรัฐฯ ตัวชี้ขาดก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย."}, d:{en:"With September hike odds already at ~72% and the 10-year yield near 5%, today's August CPI report (expected +0.4% m/m headline, +3.4% y/y; core +0.4% m/m, +2.4% y/y) carries outsized power to move both stocks and bonds. A hot print could push yields decisively through 5%; a cool one could unwind much of this week's repricing.",th:"เมื่อโอกาสขึ้นดอกเบี้ยเดือน ก.ย. อยู่ที่ราว 72% แล้ว และผลตอบแทนพันธบัตร 10 ปีใกล้ 5% รายงาน CPI เดือน ส.ค. วันนี้ (คาด +0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อนสำหรับตัวเลขทั่วไป; Core +0.4% เทียบเดือนก่อน, +2.4% เทียบปีก่อน) มีพลังขับเคลื่อนทั้งหุ้นและพันธบัตรได้มาก ตัวเลขที่ร้อนแรงอาจดันผลตอบแทนทะลุ 5% อย่างชัดเจน ขณะตัวเลขที่เย็นกว่าคาดอาจล้างการปรับราคาของสัปดาห์นี้ไปมาก"}},
  ];




  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
