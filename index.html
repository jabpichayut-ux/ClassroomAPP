<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Treasury Yields Rocket to a 19-Year High as Fed's Barr Turns Hawkish — Wall Street and Small-Caps Tumble While Oil Snaps Back Above $100, Ahead of Today's Trump-Xi Summit", th:"ผลตอบแทนพันธบัตรพุ่งแตะจุดสูงสุดในรอบ 19 ปี หลังผู้ว่าการเฟด บาร์ ส่งสัญญาณสายเหยี่ยว — วอลล์สตรีทและหุ้นขนาดเล็กร่วงแรง ขณะราคาน้ำมันดีดกลับเหนือ $100 ก่อนการประชุมสุดยอดทรัมป์-สีวันนี้"},
    heroDeck:{en:`Wall Street sold off sharply Wednesday as a bond-market rout deepened: the 10-year Treasury yield rocketed more than 17 basis points to 5.135% — its highest since July 2007 — after a weak $70 billion five-year note auction and hawkish remarks from Fed Governor Michael Barr, who said "further policy adjustments are likely to be needed" to bring inflation to target; the 5-year yield touched 5% for the first time since 2007 and the 2-year climbed to roughly 4.90%. The S&P 500 fell 0.75% to 7,706.03, the Nasdaq Composite dropped 1.13% to 26,936.04 (erasing its record-close gains from earlier in the week) and the Dow Jones Industrial Average lost 352.10 points (-0.68%) to 51,511.59, with the small-cap Russell 2000 hit even harder; utilities (-1.7%), consumer discretionary (-1.5%) and communication services (-1.4%) led sector losses. CME FedWatch pushed the odds of an October 28 rate hike up to roughly 73%, from about 60% Tuesday, after S&P Global's flash composite PMI jumped to 58.4 — its highest level in more than five years — reinforcing the case for more tightening. Oil reversed course after five straight declines: Brent surged 3.86% to settle at $103.08/bbl and WTI rose 1.81% to $92.16/bbl, while gold slid 1.23% to $4,304.11/oz, weighed down by the firmer dollar and hawkish Fed tone even as oil rallied. Germany's DAX fell 0.66% to 25,410.63; Tokyo remained shut for the final day of Japan's five-day Silver Week holiday, leaving the Nikkei at 65,018.95 ahead of today's reopening; China's Shanghai Composite eased 0.39% to 3,936.52 and Hong Kong's Hang Seng dropped 1.01% to 24,834.12. Thailand's SET bucked the regional trend, rising 0.39% (+6.26 pts) to 1,610.70 on turnover of THB 64.41bn. All eyes now turn to today's Trump-Xi summit in Washington, where trade, technology and Taiwan are expected to dominate the agenda as the two leaders look to extend their Busan trade truce, due to expire in November, before the September 29 pharmaceutical-tariff deadline.`, th:`วอลล์สตรีทเทขายอย่างหนักวันพุธ ขณะตลาดพันธบัตรทรุดตัวลงลึกขึ้น ผลตอบแทนพันธบัตร 10 ปีพุ่งขึ้นกว่า 17 basis points สู่ 5.135% — สูงสุดนับตั้งแต่เดือนกรกฎาคม 2007 — หลังการประมูลพันธบัตรอายุ 5 ปีมูลค่า 7 หมื่นล้านดอลลาร์ได้รับการตอบรับที่อ่อนแอ และถ้อยแถลงสายเหยี่ยวของผู้ว่าการเฟด ไมเคิล บาร์ ที่ระบุว่า "มีแนวโน้มที่จะต้องปรับนโยบายเพิ่มเติม" เพื่อดึงเงินเฟ้อให้เข้าเป้าหมาย ขณะผลตอบแทนพันธบัตรอายุ 5 ปีแตะ 5% เป็นครั้งแรกนับตั้งแต่ปี 2007 และอายุ 2 ปีไต่ขึ้นสู่ราว 4.90% ดัชนี S&P 500 ลดลง 0.75% สู่ 7,706.03 ดัชนี Nasdaq Composite ลดลง 1.13% สู่ 26,936.04 (ลบล้างกำไรจากการปิดสูงสุดเป็นประวัติการณ์ก่อนหน้านี้ในสัปดาห์) และดัชนี Dow Jones ลดลง 352.10 จุด (-0.68%) สู่ 51,511.59 ขณะดัชนีหุ้นขนาดเล็ก Russell 2000 ร่วงลงรุนแรงกว่า กลุ่มสาธารณูปโภค (-1.7%) กลุ่มสินค้าฟุ่มเฟือย (-1.5%) และกลุ่มสื่อสาร (-1.4%) นำการปรับลงรายกลุ่ม CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมขึ้นสู่ราว 73% จากราว 60% เมื่อวันอังคาร หลังดัชนี PMI รวมเบื้องต้นของ S&P Global พุ่งขึ้นสู่ 58.4 สูงสุดในรอบกว่า 5 ปี ตอกย้ำเหตุผลสนับสนุนการคุมเข้มดอกเบี้ยเพิ่มเติม ราคาน้ำมันกลับทิศหลังร่วงต่อเนื่องห้าเซสชัน — เบรนท์พุ่งขึ้น 3.86% ปิดที่ $103.08 ต่อบาร์เรล และ WTI เพิ่มขึ้น 1.81% สู่ $92.16 ต่อบาร์เรล ขณะทองคำลดลง 1.23% สู่ $4,304.11 ต่อออนซ์ กดดันจากดอลลาร์ที่แข็งค่าขึ้นและท่าทีสายเหยี่ยวของเฟด แม้ราคาน้ำมันจะปรับขึ้นก็ตาม ดัชนี DAX เยอรมนีลดลง 0.66% สู่ 25,410.63 ตลาดโตเกียวยังปิดทำการวันสุดท้ายของวันหยุด Silver Week ห้าวันของญี่ปุ่น ทำให้ดัชนี Nikkei คงอยู่ที่ 65,018.95 ก่อนเปิดทำการอีกครั้งวันนี้ ดัชนี Shanghai Composite ของจีนลดลง 0.39% สู่ 3,936.52 และ Hang Seng ฮ่องกงลดลง 1.01% สู่ 24,834.12 ดัชนี SET ไทยสวนทางภูมิภาค โดยเพิ่มขึ้น 0.39% (+6.26 จุด) สู่ 1,610.70 มูลค่าการซื้อขายราว 6.441 หมื่นล้านบาท ทุกสายตาจับตาการประชุมสุดยอดทรัมป์-สีที่กรุงวอชิงตันวันนี้ ซึ่งคาดว่าประเด็นการค้า เทคโนโลยี และไต้หวันจะครองวาระการประชุม ขณะผู้นำทั้งสองพยายามต่ออายุข้อตกลงสงบศึกทางการค้าปูซานที่จะหมดอายุในเดือนพฤศจิกายน ก่อนกำหนดเส้นตายภาษียาที่มีสิทธิบัตรวันที่ 29 กันยายน`},

    leadtxt:{en:`<b>Wall Street sold off sharply Wednesday as a bond-market rout deepened: the S&P 500 fell 0.75% to 7,706.03, the Nasdaq dropped 1.13% to 26,936.04 and the Dow lost 352.10 points (-0.68%) to 51,511.59, with small-caps hit hardest.</b> The 10-year Treasury yield rocketed more than 17bp to 5.135% — its highest since July 2007 — after a weak $70bn five-year note auction and hawkish comments from Fed Governor Michael Barr; the 5-year yield hit 5% for the first time since 2007, and CME FedWatch pushed October 28 hike odds to roughly 73%, from ~60% Tuesday, reinforced by a five-year-high flash PMI reading of 58.4. Oil snapped a five-session slide (Brent +3.86% to $103.08, WTI +1.81% to $92.16) while gold fell 1.23% to $4,304.11 on a firmer dollar. Germany's DAX fell 0.66% to 25,410.63, Tokyo stayed shut for the last day of Silver Week (Nikkei still 65,018.95, reopening today), and China/Hong Kong fell ahead of today's Trump-Xi summit (Shanghai -0.39%, Hang Seng -1.01%). Thailand's SET bucked the trend, rising 0.39% to 1,610.70 on tech buying. For your clients: <b>this was a genuine "rates repricing" session, not a growth scare — a weak Treasury auction, a hawkish Fed governor and a strong PMI print all point the same direction (more tightening, for longer), and it's worth distinguishing that from an equity-specific risk event; today's Trump-Xi summit and Tokyo's reopening are the next catalysts to watch.</b>`, th:`<b>วอลล์สตรีทเทขายอย่างหนักวันพุธ ขณะตลาดพันธบัตรทรุดตัวลึกขึ้น ดัชนี S&P 500 ลดลง 0.75% สู่ 7,706.03 ดัชนี Nasdaq ลดลง 1.13% สู่ 26,936.04 และดัชนี Dow ลดลง 352.10 จุด (-0.68%) สู่ 51,511.59 โดยหุ้นขนาดเล็กร่วงหนักที่สุด</b> ผลตอบแทนพันธบัตร 10 ปีพุ่งขึ้นกว่า 17bp สู่ 5.135% — สูงสุดนับตั้งแต่เดือนกรกฎาคม 2007 — หลังการประมูลพันธบัตรอายุ 5 ปีมูลค่า 7 หมื่นล้านดอลลาร์ที่อ่อนแอ และถ้อยแถลงสายเหยี่ยวของผู้ว่าการเฟด ไมเคิล บาร์ ผลตอบแทนพันธบัตรอายุ 5 ปีแตะ 5% เป็นครั้งแรกนับตั้งแต่ปี 2007 ขณะ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมสู่ราว 73% จากราว 60% เมื่อวันอังคาร ตอกย้ำโดยตัวเลข PMI เบื้องต้นที่สูงสุดในรอบ 5 ปีที่ 58.4 ราคาน้ำมันยุติการร่วงต่อเนื่องห้าเซสชัน (เบรนท์ +3.86% สู่ $103.08, WTI +1.81% สู่ $92.16) ขณะทองคำลดลง 1.23% สู่ $4,304.11 จากดอลลาร์ที่แข็งค่าขึ้น ดัชนี DAX เยอรมนีลดลง 0.66% สู่ 25,410.63 ตลาดโตเกียวยังปิดทำการวันสุดท้ายของ Silver Week (Nikkei ยังอยู่ที่ 65,018.95 เปิดทำการอีกครั้งวันนี้) และจีน/ฮ่องกงปรับลงก่อนการประชุมสุดยอดทรัมป์-สีวันนี้ (Shanghai -0.39%, Hang Seng -1.01%) ดัชนี SET ไทยสวนทางกระแส เพิ่มขึ้น 0.39% สู่ 1,610.70 จากแรงซื้อหุ้นกลุ่มเทค สำหรับลูกค้าของคุณ: <b>นี่คือเซสชันแบบ "การปรับราคาดอกเบี้ย" อย่างแท้จริง ไม่ใช่ความกังวลด้านการเติบโต — การประมูลพันธบัตรที่อ่อนแอ ผู้ว่าการเฟดที่ส่งสัญญาณสายเหยี่ยว และตัวเลข PMI ที่แข็งแกร่ง ล้วนชี้ไปทิศทางเดียวกัน (คุมเข้มมากขึ้น นานขึ้น) ควรแยกแยะเรื่องนี้จากเหตุการณ์ความเสี่ยงเฉพาะตลาดหุ้น การประชุมสุดยอดทรัมป์-สีวันนี้และการเปิดตลาดโตเกียวคือปัจจัยกระตุ้นถัดไปที่ต้องจับตา</b>`},

    watchnote:{en:`US stocks were mixed Tuesday — the Nasdaq notched a second straight record close (+0.50%) as Meta's new Muse AI agent lifted AI-infrastructure names, while the Dow fell 0.36% on bank and Cisco weakness and oil extended its slide to a fifth session (Brent below $100). Trump told the UN he faces a "big decision" on Iran and doesn't expect a deal before the midterms, but markets stayed calm, focused instead on Hormuz-reopening chatter and Thursday's Trump-Xi summit. Germany's DAX was flat, Tokyo stayed shut for Silver Week, and China/Hong Kong/Thailand were all little changed to modestly higher. <b style="color:var(--muted)">Wednesday's session</b> is the next test — watch whether the AI trade keeps leading, whether oil's slide below $100 holds, and how markets position into Thursday's Trump-Xi summit and Nikkei's Silver Week reopening.`,
      th:`หุ้นสหรัฐฯ เคลื่อนไหวคละกันวันอังคาร — ดัชนี Nasdaq ปิดสูงสุดเป็นประวัติการณ์ติดต่อกันเป็นครั้งที่สอง (+0.50%) จาก Muse ตัวช่วย AI ตัวใหม่ของ Meta ที่หนุนหุ้นกลุ่มโครงสร้างพื้นฐาน AI ขณะดัชนี Dow ลดลง 0.36% จากแรงกดดันกลุ่มธนาคารและ Cisco และราคาน้ำมันร่วงต่อเนื่องเป็นเซสชันที่ห้า (เบรนท์หลุด $100) ทรัมป์กล่าวต่อยูเอ็นว่าเขาต้อง "ตัดสินใจครั้งใหญ่" เรื่องอิหร่าน และไม่คาดว่าจะมีข้อตกลงก่อนการเลือกตั้งกลางเทอม แต่ตลาดยังคงสงบ โดยให้น้ำหนักกับสัญญาณการเปิดช่องแคบฮอร์มุซและการประชุมสุดยอดทรัมป์-สีวันพฤหัสบดีแทน ดัชนี DAX เยอรมนีทรงตัว ตลาดโตเกียวยังปิดทำการวันหยุด Silver Week ขณะจีน ฮ่องกง และไทยแทบไม่เปลี่ยนแปลงถึงปรับขึ้นเล็กน้อย <b style="color:var(--muted)">เซสชันวันพุธ</b> คือบททดสอบถัดไป — ควรจับตาว่ากระแสหุ้น AI จะยังคงนำตลาดต่อหรือไม่ การหลุดระดับ $100 ของน้ำมันจะคงอยู่หรือไม่ และตลาดจะวางสถานะอย่างไรก่อนการประชุมสุดยอดทรัมป์-สีและการเปิดทำการอีกครั้งของ Nikkei หลังวันหยุด Silver Week วันพฤหัสบดี`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป จีน/ฮ่องกง และไทย วันพุธที่ 23 ก.ย. (ตลาดโตเกียวเปิดทำการอีกครั้งวันนี้ พฤหัสบดีที่ 24 ก.ย. หลังวันหยุด Silver Week) ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,706.03", chg:-0.75, series:[7761,7706.03],
      txt:{en:`<b>US stocks sold off Wednesday as Treasury yields spiked: the S&P 500 -0.75% to 7,706.03, the Nasdaq -1.13% to 26,936.04, and the Dow -0.68% (-352.10 pts) to 51,511.59.</b> A weak 5-year note auction and hawkish Fed comments drove the 10-year yield to a 19-year high, hitting rate-sensitive small-caps hardest.`, th:`<b>หุ้นสหรัฐฯ เทขายวันพุธ ขณะผลตอบแทนพันธบัตรพุ่งขึ้น: S&P 500 ลดลง 0.75% สู่ 7,706.03, Nasdaq ลดลง 1.13% สู่ 26,936.04 และ Dow ลดลง 0.68% (-352.10 จุด) สู่ 51,511.59</b> การประมูลพันธบัตรอายุ 5 ปีที่อ่อนแอและถ้อยแถลงสายเหยี่ยวของเฟดดันผลตอบแทนพันธบัตร 10 ปีสู่จุดสูงสุดในรอบ 19 ปี กระทบหุ้นขนาดเล็กที่อ่อนไหวต่อดอกเบี้ยหนักที่สุด`},
      why:{en:`This is a textbook "yields up, growth down" repricing: Fed Governor Barr's line that "further policy adjustments are likely to be needed" pushed October hike odds to 73%, and a soft 5-year auction showed investors demanding more compensation to hold duration — both directly raise the discount rate applied to future earnings, which is why Nasdaq gave back its record-close gains and small-caps (Russell 2000) sold off even harder than large-caps. Strong PMI data (58.4, a 5-year high) cuts both ways for clients: it confirms the economy is not rolling over, but it also removes any near-term argument for the Fed to pause.`, th:`นี่คือการปรับราคาแบบตำราเรียน "ผลตอบแทนพันธบัตรขึ้น หุ้นเติบโตลง" — คำพูดของผู้ว่าการเฟด บาร์ ที่ว่า "มีแนวโน้มที่จะต้องปรับนโยบายเพิ่มเติม" ดันโอกาสขึ้นดอกเบี้ยเดือนตุลาคมสู่ 73% และการประมูลพันธบัตรอายุ 5 ปีที่อ่อนแอ แสดงว่านักลงทุนต้องการผลตอบแทนชดเชยมากขึ้นเพื่อถือพันธบัตรระยะยาว ทั้งสองปัจจัยนี้ดันอัตราคิดลดที่ใช้กับกำไรในอนาคตโดยตรง ซึ่งเป็นเหตุผลที่ Nasdaq คืนกำไรจากการปิดสูงสุดเป็นประวัติการณ์ และหุ้นขนาดเล็ก (Russell 2000) ร่วงแรงกว่าหุ้นขนาดใหญ่ ข้อมูล PMI ที่แข็งแกร่ง (58.4 สูงสุดในรอบ 5 ปี) มีสองด้านสำหรับลูกค้า — ยืนยันว่าเศรษฐกิจยังไม่ชะลอตัว แต่ก็ตัดข้อโต้แย้งที่ว่าเฟดจะหยุดขึ้นดอกเบี้ยในระยะสั้นออกไปด้วย`},
      full:{en:`US stocks fell across the board Wednesday as a deepening Treasury sell-off dominated trading. The S&P 500 dropped 0.75% to 7,706.03, the Nasdaq Composite fell 1.13% to 26,936.04 — erasing this week's record-close gains — and the Dow Jones Industrial Average lost 352.10 points (-0.68%) to 51,511.59. The small-cap Russell 2000 fell even more sharply than the major indexes. Utilities (-1.7%) led sector losses, followed by consumer discretionary (-1.5%) and communication services (-1.4%); Securitize Corp (+13.03%), IonQ (+5.89%) and AAON (+5.49%) were among the few gainers. The selloff was driven by a weak $70 billion five-year Treasury note auction and hawkish remarks from Fed Governor Michael Barr, who said "further policy adjustments are likely to be needed" to bring inflation to target — pushing the 10-year Treasury yield up more than 17 basis points to 5.135%, its highest since July 2007, and the 5-year yield to 5% for the first time since 2007. S&P Global's flash composite PMI jumped to 58.4, its highest level in more than five years, adding to the case for more Fed tightening; CME FedWatch now prices the odds of an October 28 rate hike at roughly 73%, up from about 60% Tuesday.`, th:`หุ้นสหรัฐฯ ปรับลงทั่วกระดานวันพุธ ขณะตลาดพันธบัตรที่ทรุดตัวลึกขึ้นครองการซื้อขาย ดัชนี S&P 500 ลดลง 0.75% สู่ 7,706.03 ดัชนี Nasdaq Composite ลดลง 1.13% สู่ 26,936.04 ลบล้างกำไรจากการปิดสูงสุดเป็นประวัติการณ์ของสัปดาห์นี้ และดัชนี Dow Jones ลดลง 352.10 จุด (-0.68%) สู่ 51,511.59 ดัชนีหุ้นขนาดเล็ก Russell 2000 ร่วงลงรุนแรงกว่าดัชนีหลักทั้งสาม กลุ่มสาธารณูปโภค (-1.7%) นำการปรับลงรายกลุ่ม ตามด้วยกลุ่มสินค้าฟุ่มเฟือย (-1.5%) และกลุ่มสื่อสาร (-1.4%) ขณะ Securitize Corp (+13.03%), IonQ (+5.89%) และ AAON (+5.49%) เป็นหนึ่งในหุ้นบวกไม่กี่ตัว แรงเทขายเกิดจากการประมูลพันธบัตรอายุ 5 ปีมูลค่า 7 หมื่นล้านดอลลาร์ที่ได้รับการตอบรับอ่อนแอ และถ้อยแถลงสายเหยี่ยวของผู้ว่าการเฟด ไมเคิล บาร์ ที่ระบุว่า "มีแนวโน้มที่จะต้องปรับนโยบายเพิ่มเติม" เพื่อดึงเงินเฟ้อเข้าเป้าหมาย ดันผลตอบแทนพันธบัตร 10 ปีขึ้นกว่า 17 basis points สู่ 5.135% สูงสุดนับตั้งแต่เดือนกรกฎาคม 2007 และผลตอบแทนพันธบัตรอายุ 5 ปีแตะ 5% เป็นครั้งแรกนับตั้งแต่ปี 2007 ดัชนี PMI รวมเบื้องต้นของ S&P Global พุ่งขึ้นสู่ 58.4 สูงสุดในรอบกว่า 5 ปี เพิ่มน้ำหนักสนับสนุนการคุมเข้มดอกเบี้ยเพิ่มเติมของเฟด ขณะ CME FedWatch ให้ราคาโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมที่ราว 73% เพิ่มขึ้นจากราว 60% เมื่อวันอังคาร`},
      sources:[{l:"Yahoo Finance — Stock market today: Dow, S&P 500, Nasdaq tumble as 10-year Treasury yield surges to 2007 high",u:"https://finance.yahoo.com/markets/live/stock-market-today-wednesday-september-23-dow-sp-500-nasdaq-080556640.html"},{l:"CNBC — Market sees next Fed hike in October, following Barr comments and hot inflation reading",u:"https://www.cnbc.com/2026/09/23/market-sees-next-fed-hike-in-october-following-barr-comments-hot-inflation.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,410.63", chg:-0.66, series:[25578.85,25410.63],
      txt:{en:`<b>Germany's DAX fell 0.66% to 25,410.63 Wednesday,</b> tracking Wall Street's Treasury-yield-driven selloff as European bond yields also backed up on the same hawkish global rates repricing.`, th:`<b>ดัชนี DAX เยอรมนีลดลง 0.66% สู่ 25,410.63 วันพุธ</b> ตามแรงเทขายในวอลล์สตรีทที่ขับเคลื่อนจากผลตอบแทนพันธบัตรที่พุ่งขึ้น ขณะผลตอบแทนพันธบัตรยุโรปก็ไต่ขึ้นตามการปรับมุมมองดอกเบี้ยทั่วโลกที่เป็นสายเหยี่ยวเช่นกัน`},
      why:{en:`A DAX decline roughly in line with the S&P 500's move shows this was a genuinely global rates story, not a US-only event — European yields are repricing alongside Treasuries as investors reassess how long major central banks will need to stay restrictive. With the DAX still holding above 25,000, Wednesday's move looks like an orderly repricing rather than a disorderly selloff; watch whether the ECB faces similar pressure to extend its own hiking cycle.`, th:`การที่ DAX ปรับลงในระดับใกล้เคียงกับ S&P 500 แสดงว่านี่คือเรื่องราวด้านอัตราดอกเบี้ยระดับโลกอย่างแท้จริง ไม่ใช่แค่เหตุการณ์เฉพาะสหรัฐฯ — ผลตอบแทนพันธบัตรยุโรปปรับขึ้นตามพันธบัตรสหรัฐฯ ขณะนักลงทุนประเมินใหม่ว่าธนาคารกลางหลักจะต้องคงนโยบายเข้มงวดไปอีกนานเพียงใด การที่ DAX ยังคงยืนเหนือ 25,000 แสดงว่าการเคลื่อนไหววันพุธเป็นการปรับราคาอย่างเป็นระเบียบ ไม่ใช่การเทขายที่ไร้ทิศทาง ควรจับตาว่า ECB จะเผชิญแรงกดดันให้ขยายวัฏจักรการขึ้นดอกเบี้ยของตัวเองด้วยหรือไม่`},
      full:{en:`European shares fell Wednesday as the same Treasury-yield spike that hit Wall Street rippled through global bond markets. Germany's DAX dropped 0.66% to close at 25,410.63, down from Tuesday's 25,578.85, as European government bond yields backed up alongside US Treasuries following hawkish comments from Fed Governor Michael Barr and a weak US five-year note auction. The move left the DAX with a second straight losing session but still comfortably above the 25,000 level, suggesting investors are repricing the pace of future rate cuts rather than pricing in a broader growth scare.`, th:`หุ้นยุโรปปรับลงวันพุธ ขณะการพุ่งขึ้นของผลตอบแทนพันธบัตรที่กระทบวอลล์สตรีทส่งผลกระเพื่อมไปยังตลาดพันธบัตรทั่วโลก ดัชนี DAX เยอรมนีลดลง 0.66% ปิดที่ 25,410.63 ลดลงจาก 25,578.85 เมื่อวันอังคาร ขณะผลตอบแทนพันธบัตรรัฐบาลยุโรปไต่ขึ้นตามพันธบัตรสหรัฐฯ หลังถ้อยแถลงสายเหยี่ยวของผู้ว่าการเฟด ไมเคิล บาร์ และการประมูลพันธบัตรอายุ 5 ปีของสหรัฐฯ ที่อ่อนแอ การเคลื่อนไหวนี้ทำให้ DAX ปรับลงติดต่อกันเป็นเซสชันที่สอง แต่ยังคงยืนเหนือระดับ 25,000 อย่างสบาย บ่งชี้ว่านักลงทุนกำลังปรับมุมมองจังหวะการลดดอกเบี้ยในอนาคต มากกว่าการตั้งราคารับความกังวลด้านการเติบโตในวงกว้าง`},
      sources:[{l:"Trading Economics — Germany",u:"https://tradingeconomics.com/germany/stock-market"},{l:"NBC News — Treasury yields surge to near 20-year high as oil jumps back above $103 per barrel",u:"https://www.nbcnews.com/business/energy/treasury-yields-oil-stocks-rcna599398"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"65,018.95", chg:1.38, series:[65018.95],
      txt:{en:`<b>Tokyo stayed closed Wednesday for the final day of Japan's five-day Silver Week holiday, leaving the Nikkei 225 at Friday Sep 18's close of 65,018.95 for a fourth straight session.</b> Regular trading resumes today, Thursday, the market's first chance to price in this week's global Treasury-yield spike and risk-off swing.`, th:`<b>ตลาดโตเกียวยังปิดทำการวันพุธ เป็นวันสุดท้ายของวันหยุด Silver Week ห้าวันของญี่ปุ่น ทำให้ดัชนี Nikkei 225 คงอยู่ที่ราคาปิดวันศุกร์ที่ 18 ก.ย. ที่ 65,018.95 เป็นเซสชันที่สี่ติดต่อกัน</b> การซื้อขายปกติจะกลับมาดำเนินการวันนี้ (พฤหัสบดี) เป็นโอกาสแรกที่ตลาดจะสะท้อนราคาผลตอบแทนพันธบัตรทั่วโลกที่พุ่งขึ้นและกระแสปิดรับความเสี่ยงในสัปดาห์นี้`},
      why:{en:`Tokyo has now missed pricing an entire week of global market action — the Fitch-driven Monday rally, Tuesday's Meta-Muse record close, and Wednesday's sharp Treasury-yield-driven selloff — all in one go. That makes today's reopening unusually consequential: expect outsized volatility as the Nikkei catches up, particularly in export-sensitive and semiconductor names that track both US chip sentiment and the yen, which itself is sensitive to the widening US-Japan rate gap now that Treasury yields have jumped further.`, th:`ตลาดโตเกียวพลาดการสะท้อนราคาความเคลื่อนไหวของตลาดโลกไปทั้งสัปดาห์ — ทั้งการดีดตัวรับข่าว Fitch วันจันทร์ การปิดสูงสุดเป็นประวัติการณ์จาก Muse ของ Meta วันอังคาร และแรงเทขายจากผลตอบแทนพันธบัตรที่พุ่งขึ้นวันพุธ — ทั้งหมดในคราวเดียว ทำให้การเปิดตลาดวันนี้มีนัยสำคัญเป็นพิเศษ คาดว่าจะมีความผันผวนสูงกว่าปกติขณะ Nikkei ไล่ตามราคา โดยเฉพาะหุ้นกลุ่มส่งออกและเซมิคอนดักเตอร์ที่อ่อนไหวทั้งต่อบรรยากาศหุ้นชิปสหรัฐฯ และค่าเงินเยน ซึ่งอ่อนไหวต่อส่วนต่างดอกเบี้ยสหรัฐฯ-ญี่ปุ่นที่กว้างขึ้นหลังผลตอบแทนพันธบัตรสหรัฐฯ พุ่งขึ้นเพิ่มเติม`},
      full:{en:`Japanese markets remained closed Wednesday for the final day of the country's rare five-day Silver Week holiday, so the Nikkei 225 carried over Friday September 18's close of 65,018.95 for a fourth consecutive non-trading session. While Tokyo was dark, global markets moved sharply: Wall Street logged a chip-led record close Monday, the Nasdaq set a fresh record Tuesday on Meta's Muse AI agent, and Wednesday brought a broad selloff as the 10-year Treasury yield jumped to a 19-year high of 5.135% on hawkish Fed commentary. Regular trading resumes in Tokyo today, Thursday September 24, giving the Nikkei its first opportunity in a week to price in all of that — plus today's Trump-Xi summit in Washington, a key swing factor for Japan's trade- and China-exposed exporters.`, th:`ตลาดญี่ปุ่นยังปิดทำการวันพุธ เป็นวันสุดท้ายของวันหยุด Silver Week ห้าวันที่หาได้ยากของประเทศ ทำให้ดัชนี Nikkei 225 ยังคงราคาปิดวันศุกร์ที่ 18 กันยายนที่ 65,018.95 เป็นเซสชันที่ไม่มีการซื้อขายติดต่อกันเป็นวันที่สี่ ขณะตลาดโตเกียวปิดทำการ ตลาดโลกเคลื่อนไหวอย่างมีนัยสำคัญ — วอลล์สตรีทปิดสูงสุดเป็นประวัติการณ์จากหุ้นกลุ่มชิปวันจันทร์ ดัชนี Nasdaq ทำสถิติใหม่วันอังคารจาก Muse ตัวช่วย AI ของ Meta และวันพุธเกิดแรงเทขายในวงกว้าง เมื่อผลตอบแทนพันธบัตร 10 ปีพุ่งขึ้นสู่จุดสูงสุดในรอบ 19 ปีที่ 5.135% จากถ้อยแถลงสายเหยี่ยวของเฟด การซื้อขายปกติในโตเกียวจะกลับมาดำเนินการวันนี้ พฤหัสบดีที่ 24 กันยายน เป็นโอกาสแรกในรอบสัปดาห์ที่ Nikkei จะสะท้อนราคาความเคลื่อนไหวทั้งหมดนี้ รวมถึงการประชุมสุดยอดทรัมป์-สีที่วอชิงตันวันนี้ ซึ่งเป็นปัจจัยแกว่งตัวสำคัญสำหรับผู้ส่งออกญี่ปุ่นที่มีความเชื่อมโยงกับการค้าและจีน`},
      sources:[{l:"News On Japan — Tokyo Market Closed as Yen Intervention Watch Dominates Silver Week",u:"https://newsonjapan.com/article/150825.php"},{l:"BBN Times — Nikkei 225 Holds at 65,018.95 as Tokyo Stays Shut for Silver Week: What Awaits Thursday's Reopening",u:"https://www.bbntimes.com/companies/nikkei-225-holds-at-65-018-95-as-tokyo-stays-shut-for-silver-week-what-awaits-thursday-s-reopening"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,834.12", chg:-1.01, series:[25087.75,24834.12],
      txt:{en:`<b>Hong Kong's Hang Seng fell 1.01% to 24,834.12 Wednesday, while the Shanghai Composite eased 0.39% to 3,936.52,</b> as mainland and HK-listed shares tracked Wall Street's overnight Treasury-yield-driven selloff and awaited today's Trump-Xi summit outcome.`, th:`<b>Hang Seng ฮ่องกงลดลง 1.01% สู่ 24,834.12 วันพุธ ขณะ Shanghai Composite ลดลง 0.39% สู่ 3,936.52</b> เมื่อหุ้นจีนแผ่นดินใหญ่และฮ่องกงตามแรงเทขายข้ามคืนของวอลล์สตรีทจากผลตอบแทนพันธบัตรที่พุ่งขึ้น และรอผลการประชุมสุดยอดทรัมป์-สีในวันนี้`},
      why:{en:`Hong Kong underperforming Shanghai by a wide margin (-1.01% vs -0.39%) points to the Hang Seng's heavier weighting in global-rate-sensitive tech and property names, which take the brunt of a Treasury-yield spike, while Shanghai's more domestically-oriented, policy-supported market absorbed the shock better. With the Trump-Xi summit underway in Washington today, expect both markets to trade cautiously into the outcome — a rare-earths or tariff-extension headline could quickly reverse Wednesday's losses.`, th:`การที่ฮ่องกงปรับลงมากกว่าเซี่ยงไฮ้อย่างมีนัยสำคัญ (-1.01% เทียบ -0.39%) สะท้อนว่า Hang Seng มีสัดส่วนหุ้นกลุ่มเทคและอสังหาริมทรัพย์ที่อ่อนไหวต่อดอกเบี้ยโลกมากกว่า ซึ่งรับแรงกระแทกจากการพุ่งขึ้นของผลตอบแทนพันธบัตรโดยตรง ขณะตลาดเซี่ยงไฮ้ที่เน้นปัจจัยภายในประเทศและได้แรงหนุนเชิงนโยบายมากกว่า สามารถรับมือกับแรงกระแทกนี้ได้ดีกว่า เมื่อการประชุมสุดยอดทรัมป์-สีกำลังดำเนินอยู่ที่วอชิงตันวันนี้ คาดว่าทั้งสองตลาดจะซื้อขายอย่างระมัดระวังจนกว่าจะทราบผล — ข่าวเรื่องแร่หายากหรือการต่ออายุข้อตกลงภาษีศุลกากรอาจพลิกกลับการปรับลงของวันพุธได้อย่างรวดเร็ว`},
      full:{en:`Hong Kong and mainland Chinese shares fell Wednesday as the global Treasury-yield spike that hit Wall Street rippled into Asia. The Hang Seng dropped 1.01% to close at 24,834.12, underperforming the Shanghai Composite, which eased a more modest 0.39% to 3,936.52. The declines mark a reversal from Tuesday's gains and came as investors turned cautious ahead of today's Trump-Xi summit in Washington, where trade, technology and Taiwan are expected to dominate the agenda; both sides are under pressure to extend their Busan trade truce, due to expire in November, and to signal progress on rare-earth export controls before the outcome is known.`, th:`หุ้นฮ่องกงและจีนแผ่นดินใหญ่ปรับลงวันพุธ ขณะการพุ่งขึ้นของผลตอบแทนพันธบัตรทั่วโลกที่กระทบวอลล์สตรีทส่งผลกระเพื่อมมาถึงเอเชีย ดัชนี Hang Seng ลดลง 1.01% ปิดที่ 24,834.12 ปรับลงมากกว่าดัชนี Shanghai Composite ที่ลดลงเพียง 0.39% สู่ 3,936.52 การปรับลงครั้งนี้เป็นการกลับตัวจากการปรับขึ้นเมื่อวันอังคาร และเกิดขึ้นขณะนักลงทุนระมัดระวังมากขึ้นก่อนการประชุมสุดยอดทรัมป์-สีที่วอชิงตันวันนี้ ซึ่งคาดว่าประเด็นการค้า เทคโนโลยี และไต้หวันจะครองวาระการประชุม ขณะทั้งสองฝ่ายเผชิญแรงกดดันให้ต่ออายุข้อตกลงสงบศึกทางการค้าปูซานที่จะหมดอายุในเดือนพฤศจิกายน และส่งสัญญาณความคืบหน้าเรื่องมาตรการควบคุมการส่งออกแร่หายาก ก่อนที่จะทราบผลการประชุม`},
      sources:[{l:"CNBC — 10-year Treasury yield rockets, driven by Treasury yields, oil, inflation, Fed",u:"https://www.cnbc.com/2026/09/23/treasury-yields-oil-inflation-fed.html"},{l:"CSIS — Trump-Xi 2026 Summits",u:"https://www.csis.org/programs/trump-xi-2026-summits"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,610.70", chg:0.39, series:[1604.44,1610.70],
      txt:{en:`<b>SET Index rose 0.39% to 1,610.70 Wednesday (+6.26 pts),</b> on turnover of about THB 64.41bn, led by technology shares (DELTA) even as global markets sold off on surging Treasury yields.`, th:`<b>ดัชนี SET เพิ่มขึ้น 0.39% สู่ 1,610.70 วันพุธ (+6.26 จุด)</b> มูลค่าการซื้อขายราว 6.441 หมื่นล้านบาท นำโดยหุ้นกลุ่มเทคโนโลยี (DELTA) แม้ตลาดโลกจะเทขายจากผลตอบแทนพันธบัตรที่พุ่งขึ้น`},
      why:{en:`Thailand bucking a sharply negative global session is the standout story of the day: while surging US yields hit growth and rate-sensitive assets worldwide, tech bellwether DELTA and other electronics names drew buying, alongside tourism and power-plant stocks that benefit from Wednesday's still-moderate oil prices relative to recent weeks. This resilience is encouraging for domestic-facing portfolios, but it's worth flagging to clients that Thailand's relative calm could still be tested if the global yield spike persists into Thursday and pressures foreign flows into emerging markets.`, th:`การที่ไทยสวนทางกับตลาดโลกที่ปรับลงอย่างชัดเจนถือเป็นเรื่องราวเด่นของวัน — ขณะผลตอบแทนพันธบัตรสหรัฐฯ ที่พุ่งขึ้นกระทบสินทรัพย์กลุ่มเติบโตและกลุ่มที่อ่อนไหวต่อดอกเบี้ยทั่วโลก หุ้นเทคหลัก DELTA และหุ้นกลุ่มอิเล็กทรอนิกส์อื่น ๆ ได้รับแรงซื้อ พร้อมกับหุ้นกลุ่มท่องเที่ยวและโรงไฟฟ้าที่ยังได้ประโยชน์จากราคาน้ำมันที่ยังค่อนข้างปานกลางเทียบกับหลายสัปดาห์ก่อน ความแข็งแกร่งนี้เป็นสัญญาณบวกสำหรับพอร์ตที่เน้นปัจจัยในประเทศ แต่ควรแจ้งลูกค้าว่าความสงบสัมพัทธ์ของไทยอาจถูกทดสอบ หากผลตอบแทนพันธบัตรโลกที่พุ่งขึ้นยังคงอยู่ต่อในวันพฤหัสบดี และกดดันเงินทุนไหลเข้าตลาดเกิดใหม่`},
      full:{en:`Thailand's SET Index bucked a sharply negative global session Wednesday, rising 0.39% (+6.26 points) to close at 1,610.70 on turnover of about THB 64.41 billion. Gains were led by technology-linked shares, with bellwether DELTA Electronics drawing buying interest, alongside tourism and power-plant stocks that benefited from oil prices that, while up sharply on the day, remain moderate relative to recent weeks. The advance came even as US and European markets sold off heavily after the 10-year Treasury yield spiked to a 19-year high on hawkish Fed commentary, underscoring that Wednesday's SET rally was driven by domestic and sector-specific factors rather than a read-through from the global tape.`, th:`ดัชนี SET ของไทยสวนทางตลาดโลกที่ปรับลงอย่างชัดเจนวันพุธ โดยเพิ่มขึ้น 0.39% (+6.26 จุด) ปิดที่ 1,610.70 มูลค่าการซื้อขายราว 6.441 หมื่นล้านบาท แรงหนุนหลักมาจากหุ้นกลุ่มเทคโนโลยี โดยหุ้นเด่น DELTA Electronics ได้รับแรงซื้อ พร้อมกับหุ้นกลุ่มท่องเที่ยวและโรงไฟฟ้าที่ได้ประโยชน์จากราคาน้ำมันที่แม้จะปรับขึ้นแรงในวันนี้ แต่ยังอยู่ในระดับปานกลางเทียบกับหลายสัปดาห์ก่อน การปรับขึ้นนี้เกิดขึ้นแม้ตลาดสหรัฐฯ และยุโรปจะเทขายอย่างหนัก หลังผลตอบแทนพันธบัตร 10 ปีพุ่งขึ้นสู่จุดสูงสุดในรอบ 19 ปีจากถ้อยแถลงสายเหยี่ยวของเฟด ตอกย้ำว่าการปรับขึ้นของ SET วันพุธขับเคลื่อนจากปัจจัยภายในประเทศและรายกลุ่มอุตสาหกรรม มากกว่าการสะท้อนตามตลาดโลก`},
      sources:[{l:"Kaohoon International — Market Roundup 23 September 2026",u:"https://www.kaohooninternational.com/markets/591350"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil snapped a five-session losing streak Wednesday — Brent +3.86% to $103.08/bbl, WTI +1.81% to $92.16/bbl — while gold fell 1.23% to $4,304.11/oz,</b> as a firmer dollar and hawkish Fed tone outweighed the crude rally's usual inflation-hedge boost for bullion.`, th:`<b>ราคาน้ำมันยุติการร่วงต่อเนื่องห้าเซสชันวันพุธ — เบรนท์เพิ่มขึ้น 3.86% สู่ $103.08 ต่อบาร์เรล WTI เพิ่มขึ้น 1.81% สู่ $92.16 ต่อบาร์เรล — ขณะทองคำลดลง 1.23% สู่ $4,304.11 ต่อออนซ์</b> เมื่อดอลลาร์ที่แข็งค่าขึ้นและท่าทีสายเหยี่ยวของเฟดมีน้ำหนักมากกว่าแรงหนุนปกติของน้ำมันที่พุ่งขึ้นต่อทองคำในฐานะเครื่องมือป้องกันเงินเฟ้อ`},
     why:{en:`Oil rallying nearly 4% while gold falls is an unusual combination worth flagging: it shows Wednesday's moves were dominated by the dollar and rates (both hurt gold, and a stronger dollar makes commodity purchases relatively pricier for many investors) rather than a single unified "inflation scare" narrative. Watch whether oil's bounce has legs into today's Trump-Xi summit — any signal of eased Iran-related tensions or a durable China-demand story could extend the move, while a soft summit outcome could see it fade just as quickly as Tuesday's slide below $100.`, th:`การที่น้ำมันพุ่งขึ้นเกือบ 4% ขณะทองคำปรับลง เป็นความสัมพันธ์ที่ไม่ปกติและควรแจ้งลูกค้า — แสดงว่าการเคลื่อนไหววันพุธถูกครอบงำโดยดอลลาร์และอัตราดอกเบี้ย (ทั้งสองปัจจัยกดดันทองคำ และดอลลาร์ที่แข็งค่าทำให้การซื้อสินค้าโภคภัณฑ์มีต้นทุนสูงขึ้นสำหรับนักลงทุนหลายราย) มากกว่าเรื่องราว "ความกังวลเงินเฟ้อ" แบบเดียวกันทั้งหมด ควรจับตาว่าการดีดตัวของน้ำมันจะต่อเนื่องหรือไม่เมื่อเข้าสู่การประชุมสุดยอดทรัมป์-สีวันนี้ — สัญญาณใด ๆ ที่บ่งชี้ความตึงเครียดเรื่องอิหร่านคลี่คลายลง หรือเรื่องราวความต้องการจากจีนที่ยั่งยืน อาจทำให้การเคลื่อนไหวนี้ต่อเนื่อง ขณะผลการประชุมที่อ่อนแออาจทำให้มันจางหายไปเร็วพอ ๆ กับที่ราคาน้ำมันหลุด $100 เมื่อวันอังคาร`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 10-year Treasury yield rocketed more than 17bp to 5.135% Wednesday — its highest since July 2007 — after a weak five-year note auction and hawkish comments from Fed Governor Michael Barr,</b> and CME FedWatch now prices October 28 hike odds at roughly 73%, up from about 60% Tuesday.`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีพุ่งขึ้นกว่า 17bp สู่ 5.135% วันพุธ — สูงสุดนับตั้งแต่เดือนกรกฎาคม 2007 — หลังการประมูลพันธบัตรอายุ 5 ปีที่อ่อนแอ และถ้อยแถลงสายเหยี่ยวของผู้ว่าการเฟด ไมเคิล บาร์</b> ขณะ CME FedWatch ให้ราคาโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมที่ราว 73% เพิ่มขึ้นจากราว 60% เมื่อวันอังคาร`},
     why:{en:`This is the sharpest single-day rate move in months — the 5-year yield hitting 5% for the first time since 2007 alongside a weak auction tells you institutional demand for duration is genuinely softening, not just a headline-driven blip. Combined with Barr's comments and a five-year-high PMI print, the market is now pricing in meaningfully more Fed tightening than it was just 24 hours ago; for fixed-income-heavy portfolios, this is a real duration-risk event, not noise to be waited out.`, th:`นี่คือการเคลื่อนไหวของอัตราดอกเบี้ยที่รุนแรงที่สุดในรอบหลายเดือน — การที่ผลตอบแทนพันธบัตรอายุ 5 ปีแตะ 5% เป็นครั้งแรกนับตั้งแต่ปี 2007 พร้อมกับการประมูลที่อ่อนแอ บ่งชี้ว่าความต้องการพันธบัตรระยะยาวจากสถาบันกำลังอ่อนตัวลงอย่างแท้จริง ไม่ใช่แค่ความผันผวนชั่วคราวจากข่าว เมื่อรวมกับถ้อยแถลงของบาร์และตัวเลข PMI ที่สูงสุดในรอบ 5 ปี ตลาดกำลังตั้งราคารับการคุมเข้มดอกเบี้ยของเฟดที่มากขึ้นอย่างมีนัยสำคัญเทียบกับเมื่อ 24 ชั่วโมงก่อน สำหรับพอร์ตที่มีสัดส่วนตราสารหนี้สูง นี่คือความเสี่ยงด้าน duration ที่แท้จริง ไม่ใช่ความผันผวนที่รอให้ผ่านไปได้`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`No new tariff escalation was announced Wednesday, but the September 29 deadline — including the 100% default duty on patented pharmaceuticals — is now just six days away. All eyes are on today's Trump-Xi summit in Washington, where trade, technology and Taiwan are expected to dominate; both sides face pressure to extend their Busan trade truce (expiring in November) and signal progress on rare-earth export controls.`, th:`ยังไม่มีการประกาศทวีความรุนแรงด้านภาษีศุลกากรใหม่วันพุธ แต่กำหนดเส้นตายวันที่ 29 กันยายน — รวมถึงอัตราภาษีเริ่มต้น 100% สำหรับยาที่มีสิทธิบัตร — เหลืออีกเพียง 6 วัน ทุกสายตาจับตาการประชุมสุดยอดทรัมป์-สีที่วอชิงตันวันนี้ ซึ่งคาดว่าประเด็นการค้า เทคโนโลยี และไต้หวันจะครองวาระการประชุม ขณะทั้งสองฝ่ายเผชิญแรงกดดันให้ต่ออายุข้อตกลงสงบศึกทางการค้าปูซาน (หมดอายุเดือนพฤศจิกายน) และส่งสัญญาณความคืบหน้าเรื่องมาตรการควบคุมการส่งออกแร่หายาก`}, w:{en:`The summit's outcome is the single biggest swing factor for markets over the next 24-48 hours — a truce extension or rare-earths deal would be a clear risk-on catalyst, while a disappointing or contentious meeting could compound Wednesday's already-fragile, rate-driven risk-off tone. With the pharma-tariff deadline now inside a week, expect healthcare-exposed portfolios to be increasingly sensitive to any summit-related trade signals.`, th:`ผลการประชุมสุดยอดครั้งนี้เป็นปัจจัยแกว่งตัวที่ใหญ่ที่สุดสำหรับตลาดในช่วง 24-48 ชั่วโมงข้างหน้า — การต่ออายุข้อตกลงสงบศึกหรือข้อตกลงเรื่องแร่หายากจะเป็นปัจจัยบวกที่ชัดเจน ขณะการประชุมที่น่าผิดหวังหรือมีความขัดแย้งอาจซ้ำเติมบรรยากาศปิดรับความเสี่ยงที่เปราะบางอยู่แล้วจากปัจจัยดอกเบี้ยของวันพุธ เมื่อกำหนดเส้นตายภาษียาเหลือเวลาไม่ถึงหนึ่งสัปดาห์ คาดว่าพอร์ตที่มีความเสี่ยงด้านสุขภาพจะอ่อนไหวต่อสัญญาณการค้าจากการประชุมสุดยอดมากขึ้น`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Oil snapped its five-session slide Wednesday, with Brent surging 3.86% to $103.08/bbl, as traders weighed today's Trump-Xi summit alongside lingering uncertainty over Trump's UN comments about a "big decision" on Iran and previously flagged diplomatic signals around reopening the Strait of Hormuz.`, th:`ราคาน้ำมันยุติการร่วงต่อเนื่องห้าเซสชันวันพุธ โดยเบรนท์พุ่งขึ้น 3.86% สู่ $103.08 ต่อบาร์เรล ขณะนักลงทุนชั่งน้ำหนักการประชุมสุดยอดทรัมป์-สีวันนี้ ควบคู่กับความไม่แน่นอนที่ยังคงอยู่จากถ้อยแถลงของทรัมป์ที่ยูเอ็นเรื่อง "การตัดสินใจครั้งใหญ่" เกี่ยวกับอิหร่าน และสัญญาณทางการทูตก่อนหน้านี้เรื่องการเปิดช่องแคบฮอร์มุซอีกครั้ง`}, w:{en:`A nearly 4% single-day oil rally after five straight declines suggests the market had gotten too complacent about supply risk — worth watching whether this is a durable repricing of Iran-related risk or a one-day technical bounce. Today's Trump-Xi summit adds a second, distinct geopolitical variable: any signal on Taiwan or a harder line on trade could move markets independently of the Iran/Hormuz story.`, th:`การที่น้ำมันพุ่งขึ้นเกือบ 4% ภายในวันเดียว หลังร่วงต่อเนื่องห้าเซสชัน บ่งชี้ว่าตลาดอาจประมาทเกินไปกับความเสี่ยงด้านอุปทาน ควรจับตาว่านี่เป็นการปรับราคารับความเสี่ยงเรื่องอิหร่านที่ยั่งยืน หรือเป็นเพียงการดีดตัวทางเทคนิคระยะสั้น การประชุมสุดยอดทรัมป์-สีวันนี้เพิ่มตัวแปรทางภูมิรัฐศาสตร์อีกตัวหนึ่งที่แยกต่างหาก — สัญญาณใด ๆ เกี่ยวกับไต้หวันหรือท่าทีที่แข็งกร้าวขึ้นด้านการค้า อาจขับเคลื่อนตลาดโดยไม่ขึ้นกับเรื่องราวอิหร่าน/ฮอร์มุซ`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The US 10-year Treasury yield rocketed more than 17bp to 5.135% Wednesday — its highest since July 2007 — after a weak five-year note auction and hawkish remarks from Fed Governor Michael Barr; the 5-year yield touched 5% for the first time since 2007, and CME FedWatch now prices October 28 hike odds at roughly 73%, up from about 60% Tuesday.`, th:`ผลตอบแทนพันธบัตร 10 ปีของสหรัฐฯ พุ่งขึ้นกว่า 17bp สู่ 5.135% วันพุธ — สูงสุดนับตั้งแต่เดือนกรกฎาคม 2007 — หลังการประมูลพันธบัตรอายุ 5 ปีที่อ่อนแอ และถ้อยแถลงสายเหยี่ยวของผู้ว่าการเฟด ไมเคิล บาร์ ผลตอบแทนพันธบัตรอายุ 5 ปีแตะ 5% เป็นครั้งแรกนับตั้งแต่ปี 2007 ขณะ CME FedWatch ให้ราคาโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมที่ราว 73% เพิ่มขึ้นจากราว 60% เมื่อวันอังคาร`}, w:{en:`This is the clearest confirmation yet that the Fed's September hike was the start of a sustained tightening cycle, not a one-off — a weak auction plus hawkish commentary plus a five-year-high PMI print is about as unambiguous a hawkish combination as markets get. With yields now at multi-decade highs across the curve, expect renewed pressure on rate-sensitive equities (small-caps, growth/tech, utilities) and a higher bar for risk assets generally until there's a clear catalyst — likely a soft CPI print or dovish Fed pivot — to reverse it.`, th:`นี่คือการยืนยันที่ชัดเจนที่สุดว่าการขึ้นดอกเบี้ยของเฟดในเดือนกันยายนคือจุดเริ่มต้นของวัฏจักรการคุมเข้มที่ต่อเนื่อง ไม่ใช่เหตุการณ์ครั้งเดียว — การประมูลที่อ่อนแอ บวกถ้อยแถลงสายเหยี่ยว บวกตัวเลข PMI สูงสุดในรอบ 5 ปี ถือเป็นชุดสัญญาณสายเหยี่ยวที่ชัดเจนที่สุดเท่าที่ตลาดจะได้รับ เมื่อผลตอบแทนพันธบัตรอยู่ในระดับสูงสุดในรอบหลายทศวรรษทั่วทั้งเส้นอัตราผลตอบแทน คาดว่าจะมีแรงกดดันต่อเนื่องต่อหุ้นที่อ่อนไหวต่อดอกเบี้ย (หุ้นขนาดเล็ก หุ้นเติบโต/เทค สาธารณูปโภค) และเกณฑ์ที่สูงขึ้นสำหรับสินทรัพย์เสี่ยงโดยรวม จนกว่าจะมีปัจจัยกระตุ้นที่ชัดเจน — น่าจะเป็นตัวเลข CPI ที่อ่อนตัวลงหรือท่าทีผ่อนคลายของเฟด — เพื่อพลิกกลับแนวโน้มนี้`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`S&P Global's flash composite PMI jumped to 58.4 Wednesday, its highest level in more than five years, with both manufacturing and services hitting multi-year highs — reinforcing the case for more Fed tightening even as oil's rebound to above $100 adds a fresh input to watch.`, th:`ดัชนี PMI รวมเบื้องต้นของ S&P Global พุ่งขึ้นสู่ 58.4 วันพุธ สูงสุดในรอบกว่า 5 ปี โดยทั้งภาคการผลิตและภาคบริการแตะจุดสูงสุดในรอบหลายปี ตอกย้ำเหตุผลสนับสนุนการคุมเข้มดอกเบี้ยเพิ่มเติมของเฟด แม้ราคาน้ำมันที่ดีดกลับเหนือ $100 จะเป็นปัจจัยใหม่ที่ต้องจับตา`}, w:{en:`Strong activity data plus a sharp oil rebound in the same session is a combination clients should hear about directly: it strengthens, not weakens, the case for "higher for longer" rates, since both point to firmer near-term price pressure. Keep framing conversations around structurally sticky inflation — tariffs (Sep 29 deadline), energy geopolitics and now resurgent oil — rather than treating Wednesday's yield spike as a one-off technical move.`, th:`ข้อมูลกิจกรรมทางเศรษฐกิจที่แข็งแกร่ง บวกกับการดีดตัวแรงของน้ำมันในเซสชันเดียวกัน เป็นความสัมพันธ์ที่ควรแจ้งลูกค้าโดยตรง — มันเสริมความแข็งแกร่ง ไม่ใช่ลดทอน แนวคิด "ดอกเบี้ยสูงนานขึ้น" เนื่องจากทั้งสองปัจจัยบ่งชี้แรงกดดันด้านราคาระยะสั้นที่แข็งแกร่งขึ้น ควรวางกรอบการสนทนากับลูกค้าโดยยึด "เงินเฟ้อติดสูงจากปัจจัยเชิงโครงสร้าง" — ภาษีศุลกากร (กำหนดเส้นตาย 29 ก.ย.) ภูมิรัฐศาสตร์ด้านพลังงาน และตอนนี้คือราคาน้ำมันที่กลับมาพุ่งขึ้น — มากกว่ามองว่าการพุ่งขึ้นของผลตอบแทนพันธบัตรวันพุธเป็นเพียงการเคลื่อนไหวทางเทคนิคครั้งเดียว`}},
