<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Nasdaq Notches a Second Straight Record Close as Meta's Muse AI Agent Fuels the AI Trade — Dow Slips on Bank and Cisco Weakness While Oil Breaks Below $100 Amid Trump's UN Iran Ultimatum", th:"Nasdaq ปิดสูงสุดเป็นประวัติการณ์ติดต่อกันเป็นวันที่สอง จากกระแส AI ที่ได้แรงหนุนจาก Muse ตัวช่วย AI ของ Meta — ขณะ Dow อ่อนตัวจากแรงกดดันกลุ่มธนาคารและ Cisco ส่วนราคาน้ำมันหลุดระดับ $100 ท่ามกลางคำขู่ของทรัมป์ต่ออิหร่านที่ยูเอ็น"},
    heroDeck:{en:`Wall Street was mixed but constructive Tuesday: the Nasdaq Composite added 0.50% to a fresh record close of 27,244.28 — its second straight record — as Meta's newly unveiled Muse AI agent drew a strong reception and lifted AI-infrastructure names, while the S&P 500 finished essentially flat at 7,761 (-0.04%) and the Dow Jones Industrial Average shed 185.14 points (-0.36%) to 51,863.69, dragged by Cisco Systems (-4.50%), JPMorgan (-3.35%) and American Express (-2.62%); Amgen (+4.33%), Home Depot (+2.74%) and Honeywell International (+2.58%) led the gainers. Oil extended its slide to a fifth straight session — Brent fell 1% to settle at $99.25/bbl, its first close below $100 in two weeks, with WTI easing to around $94.60/bbl — even as President Trump told the UN General Assembly he faces a "big decision" on Iran (a deal or "annihilate the Islamic Republic") and does not expect an agreement before the midterm elections; markets instead focused on separate diplomatic signals around reopening the Strait of Hormuz and Thursday's approaching Trump-Xi summit. The 10-year Treasury yield was little changed at 4.959% (2-year 4.743%, 30-year 5.296%) as traders awaited fresh jobs data and Fed commentary, while CME FedWatch pushed the odds of an October 28 rate hike up to roughly 60%, and gold eased for a second straight session on a firmer dollar and hawkish Fed remarks. Germany's DAX ended essentially flat (+0.01% to 25,578.85) as gains in tech, travel and retail names (Zalando, Infineon) offset weakness in insurers and banks (Allianz, Deutsche Bank); Tokyo remained shut for Japan's rare five-day Silver Week holiday, leaving the Nikkei at Friday's 65,018.95 ahead of Thursday's reopening. China and Hong Kong were little changed as investors awaited the Trump-Xi summit and fresh US-China trade talks — the Shanghai Composite edged up 0.06% to 3,952.13 and the Hang Seng added 0.18% to 25,087.75 — while Thailand's SET extended Monday's Fitch-driven rally, rising 0.40% (+6.41 pts) to 1,604.44 on turnover of THB 67.05bn, helped by tech and electronics buying tracking the region's falling oil prices and yields.`, th:`วอลล์สตรีทเคลื่อนไหวคละกันแต่ยังคงเชิงบวกวันอังคาร ดัชนี Nasdaq Composite เพิ่มขึ้น 0.50% ปิดสูงสุดเป็นประวัติการณ์ครั้งใหม่ที่ 27,244.28 — สูงสุดเป็นประวัติการณ์ติดต่อกันเป็นครั้งที่สอง — หลัง Muse ตัวช่วย AI ตัวใหม่ของ Meta ได้รับการตอบรับที่ดีและหนุนหุ้นกลุ่มโครงสร้างพื้นฐาน AI ขณะดัชนี S&P 500 ปิดแทบทรงตัวที่ 7,761 (-0.04%) และดัชนี Dow Jones ลดลง 185.14 จุด (-0.36%) สู่ 51,863.69 ฉุดโดย Cisco Systems (-4.50%), JPMorgan (-3.35%) และ American Express (-2.62%) ขณะ Amgen (+4.33%), Home Depot (+2.74%) และ Honeywell International (+2.58%) นำกลุ่มหุ้นบวก ราคาน้ำมันร่วงต่อเนื่องเป็นเซสชันที่ห้า — เบรนท์ลดลง 1% ปิดที่ $99.25 ต่อบาร์เรล ต่ำกว่าระดับ $100 เป็นครั้งแรกในรอบสองสัปดาห์ ขณะ WTI ย่อตัวสู่ราว $94.60 ต่อบาร์เรล — แม้ประธานาธิบดีทรัมป์จะกล่าวต่อที่ประชุมสมัชชาใหญ่สหประชาชาติว่าเขาต้อง "ตัดสินใจครั้งใหญ่" เรื่องอิหร่าน (ทำข้อตกลงหรือ "ทำลายล้างสาธารณรัฐอิสลาม") และไม่คาดว่าจะมีข้อตกลงก่อนการเลือกตั้งกลางเทอม แต่ตลาดกลับให้น้ำหนักกับสัญญาณทางการทูตแยกต่างหากเรื่องการเปิดช่องแคบฮอร์มุซอีกครั้ง และการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่กำลังจะมาถึงวันพฤหัสบดี ผลตอบแทนพันธบัตร 10 ปีแทบไม่เปลี่ยนแปลงที่ 4.959% (2 ปีที่ 4.743%, 30 ปีที่ 5.296%) ขณะนักลงทุนรอข้อมูลการจ้างงานและถ้อยแถลงของเฟด ขณะ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมขึ้นสู่ราว 60% และทองคำอ่อนตัวลงเป็นเซสชันที่สองติดต่อกัน จากดอลลาร์ที่แข็งค่าขึ้นและถ้อยแถลงเชิงเหยี่ยวของเฟด ดัชนี DAX เยอรมนีปิดแทบทรงตัว (+0.01% สู่ 25,578.85) จากแรงซื้อหุ้นกลุ่มเทค ท่องเที่ยว และค้าปลีก (Zalando, Infineon) ที่ชดเชยความอ่อนแอของกลุ่มประกันภัยและธนาคาร (Allianz, Deutsche Bank) ตลาดโตเกียวยังปิดทำการเนื่องในวันหยุด Silver Week ห้าวันที่หาได้ยากของญี่ปุ่น ทำให้ดัชนี Nikkei คงอยู่ที่ราคาปิดวันศุกร์ที่ 65,018.95 ก่อนเปิดทำการอีกครั้งวันพฤหัสบดี จีนและฮ่องกงแทบไม่เปลี่ยนแปลง ขณะนักลงทุนรอการประชุมสุดยอดทรัมป์-สี และการเจรจาการค้าสหรัฐฯ-จีนรอบใหม่ — ดัชนี Shanghai Composite ขยับขึ้น 0.06% สู่ 3,952.13 และดัชนี Hang Seng เพิ่มขึ้น 0.18% สู่ 25,087.75 — ขณะดัชนี SET ไทยต่อยอดการดีดตัวจากข่าว Fitch เมื่อวันจันทร์ เพิ่มขึ้น 0.40% (+6.41 จุด) สู่ 1,604.44 มูลค่าการซื้อขายราว 6.705 หมื่นล้านบาท หนุนโดยแรงซื้อหุ้นกลุ่มเทคโนโลยีและอิเล็กทรอนิกส์ตามราคาน้ำมันและผลตอบแทนพันธบัตรที่ลดลงในภูมิภาค`},

    leadtxt:{en:`<b>Wall Street was mixed Tuesday but the AI trade kept running: the Nasdaq notched a second straight record close (+0.50% to 27,244.28) on a strong reception for Meta's new Muse AI agent, while the S&P 500 was flat (7,761, -0.04%) and the Dow fell 0.36% (-185 pts) to 51,863.69 as bank stocks and Cisco (-4.5%) weighed.</b> Oil extended its slide to a fifth straight session — Brent broke below $100 to settle at $99.25 (-1%), with WTI easing to ~$94.60 — even after Trump told the UN he faces a "big decision" on Iran and doesn't expect a deal before the midterms; markets shrugged that off to focus on separate Hormuz-reopening chatter and Thursday's Trump-Xi summit. The 10-year Treasury yield was little changed at 4.959% as CME FedWatch nudged October 28 hike odds up to roughly 60%, and gold eased for a second day on a firmer dollar and hawkish Fed remarks. Germany's DAX was flat (+0.01% to 25,578.85), Tokyo stayed shut for Japan's five-day Silver Week, and China/Hong Kong were little changed (Shanghai +0.06%, Hang Seng +0.18%) ahead of the Trump-Xi summit. Thailand's SET extended Monday's Fitch-driven rally, +0.40% to 1,604.44 on tech and electronics buying. For your clients: <b>this was a "sector rotation, not risk-off" session — AI-infrastructure names kept leading on genuine product news (Meta's Muse), while banks pulled back on rate uncertainty; the bigger swing factor now is Thursday's Trump-Xi summit and whether Hormuz diplomacy actually produces a deal, not Tuesday's UN rhetoric.</b>`, th:`<b>วอลล์สตรีทเคลื่อนไหวคละกันวันอังคาร แต่กระแสหุ้น AI ยังคงเดินหน้าต่อ ดัชนี Nasdaq ปิดสูงสุดเป็นประวัติการณ์ติดต่อกันเป็นครั้งที่สอง (+0.50% สู่ 27,244.28) จากการตอบรับที่ดีต่อ Muse ตัวช่วย AI ตัวใหม่ของ Meta ขณะดัชนี S&P 500 ทรงตัว (7,761, -0.04%) และดัชนี Dow ลดลง 0.36% (-185 จุด) สู่ 51,863.69 จากแรงกดดันของหุ้นกลุ่มธนาคารและ Cisco (-4.5%)</b> ราคาน้ำมันร่วงต่อเนื่องเป็นเซสชันที่ห้า — เบรนท์หลุดระดับ $100 ปิดที่ $99.25 (-1%) ขณะ WTI ย่อตัวสู่ราว $94.60 — แม้ทรัมป์จะกล่าวต่อยูเอ็นว่าเขาต้อง "ตัดสินใจครั้งใหญ่" เรื่องอิหร่าน และไม่คาดว่าจะมีข้อตกลงก่อนการเลือกตั้งกลางเทอม แต่ตลาดไม่ได้ให้น้ำหนักมากนัก โดยหันไปสนใจสัญญาณการเปิดช่องแคบฮอร์มุซและการประชุมสุดยอดทรัมป์-สีที่จะมาถึงวันพฤหัสบดีแทน ผลตอบแทนพันธบัตร 10 ปีแทบไม่เปลี่ยนแปลงที่ 4.959% ขณะ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมขึ้นสู่ราว 60% และทองคำอ่อนตัวลงเป็นวันที่สอง จากดอลลาร์ที่แข็งค่าขึ้นและถ้อยแถลงเชิงเหยี่ยวของเฟด ดัชนี DAX เยอรมนีทรงตัว (+0.01% สู่ 25,578.85) ตลาดโตเกียวยังปิดทำการเนื่องในวันหยุด Silver Week ห้าวันของญี่ปุ่น และจีน/ฮ่องกงแทบไม่เปลี่ยนแปลง (Shanghai +0.06%, Hang Seng +0.18%) ก่อนการประชุมสุดยอดทรัมป์-สี ดัชนี SET ไทยต่อยอดการดีดตัวจากข่าว Fitch เมื่อวันจันทร์ +0.40% สู่ 1,604.44 จากแรงซื้อหุ้นกลุ่มเทคและอิเล็กทรอนิกส์ สำหรับลูกค้าของคุณ: <b>นี่คือเซสชันแบบ "หมุนเวียนกลุ่มอุตสาหกรรม ไม่ใช่การปิดรับความเสี่ยง" — หุ้นกลุ่มโครงสร้างพื้นฐาน AI ยังคงนำตลาดจากข่าวผลิตภัณฑ์ที่แท้จริง (Muse ของ Meta) ขณะหุ้นกลุ่มธนาคารอ่อนตัวจากความไม่แน่นอนด้านดอกเบี้ย ปัจจัยแกว่งตัวสำคัญตอนนี้คือการประชุมสุดยอดทรัมป์-สีวันพฤหัสบดี และการทูตเรื่องฮอร์มุซจะนำไปสู่ข้อตกลงจริงหรือไม่ ไม่ใช่ถ้อยแถลงของทรัมป์ที่ยูเอ็นเมื่อวันอังคาร</b>`},

    watchnote:{en:`US stocks were mixed Tuesday — the Nasdaq notched a second straight record close (+0.50%) as Meta's new Muse AI agent lifted AI-infrastructure names, while the Dow fell 0.36% on bank and Cisco weakness and oil extended its slide to a fifth session (Brent below $100). Trump told the UN he faces a "big decision" on Iran and doesn't expect a deal before the midterms, but markets stayed calm, focused instead on Hormuz-reopening chatter and Thursday's Trump-Xi summit. Germany's DAX was flat, Tokyo stayed shut for Silver Week, and China/Hong Kong/Thailand were all little changed to modestly higher. <b style="color:var(--muted)">Wednesday's session</b> is the next test — watch whether the AI trade keeps leading, whether oil's slide below $100 holds, and how markets position into Thursday's Trump-Xi summit and Nikkei's Silver Week reopening.`,
      th:`หุ้นสหรัฐฯ เคลื่อนไหวคละกันวันอังคาร — ดัชนี Nasdaq ปิดสูงสุดเป็นประวัติการณ์ติดต่อกันเป็นครั้งที่สอง (+0.50%) จาก Muse ตัวช่วย AI ตัวใหม่ของ Meta ที่หนุนหุ้นกลุ่มโครงสร้างพื้นฐาน AI ขณะดัชนี Dow ลดลง 0.36% จากแรงกดดันกลุ่มธนาคารและ Cisco และราคาน้ำมันร่วงต่อเนื่องเป็นเซสชันที่ห้า (เบรนท์หลุด $100) ทรัมป์กล่าวต่อยูเอ็นว่าเขาต้อง "ตัดสินใจครั้งใหญ่" เรื่องอิหร่าน และไม่คาดว่าจะมีข้อตกลงก่อนการเลือกตั้งกลางเทอม แต่ตลาดยังคงสงบ โดยให้น้ำหนักกับสัญญาณการเปิดช่องแคบฮอร์มุซและการประชุมสุดยอดทรัมป์-สีวันพฤหัสบดีแทน ดัชนี DAX เยอรมนีทรงตัว ตลาดโตเกียวยังปิดทำการวันหยุด Silver Week ขณะจีน ฮ่องกง และไทยแทบไม่เปลี่ยนแปลงถึงปรับขึ้นเล็กน้อย <b style="color:var(--muted)">เซสชันวันพุธ</b> คือบททดสอบถัดไป — ควรจับตาว่ากระแสหุ้น AI จะยังคงนำตลาดต่อหรือไม่ การหลุดระดับ $100 ของน้ำมันจะคงอยู่หรือไม่ และตลาดจะวางสถานะอย่างไรก่อนการประชุมสุดยอดทรัมป์-สีและการเปิดทำการอีกครั้งของ Nikkei หลังวันหยุด Silver Week วันพฤหัสบดี`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป จีน/ฮ่องกง และไทย วันอังคารที่ 22 ก.ย. (ตลาดโตเกียวยังปิดทำการเนื่องในวันหยุด Silver Week) ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,764.70", chg:1.49, series:[7650.50,7764.70],
      txt:{en:`<b>US stocks rallied Monday as chip names surged: the S&P 500 +1.49% to 7,764.70, the Nasdaq +2.26% to a record close of 27,122.09, and the Dow +0.71% (+366.19 pts) to 52,048.83.</b> Intel jumped ~12% and AMD ~10% (briefly a $1 trillion company) as falling oil prices and Treasury yields cleared the way for risk-taking.`, th:`<b>หุ้นสหรัฐฯ ดีดตัวขึ้นวันจันทร์ เมื่อหุ้นกลุ่มชิปพุ่งขึ้น: S&P 500 +1.49% สู่ 7,764.70, Nasdaq +2.26% ปิดสูงสุดเป็นประวัติการณ์ที่ 27,122.09 และ Dow +0.71% (+366.19 จุด) สู่ 52,048.83</b> Intel พุ่งขึ้นราว 12% และ AMD ราว 10% (แตะมูลค่า 1 ล้านล้านดอลลาร์ชั่วคราว) เมื่อราคาน้ำมันและผลตอบแทนพันธบัตรที่ลดลงเปิดทางให้นักลงทุนกล้าเสี่ยงมากขึ้น`},
      why:{en:`This was a clean "falling rates, falling oil, buy growth" session: the 10-year yield's pullback to 4.951% lowers the discount rate on future AI-capex earnings, which is why chip and AI-adjacent names (Intel, AMD, Nvidia, Corning, Meta) led by a wide margin. AMD's brief $1 trillion market cap is a headline milestone worth flagging, but the concentration of gains in a handful of chip names is also a concentration risk worth noting to clients.`, th:`นี่คือเซสชันแบบ "ผลตอบแทนพันธบัตรลด น้ำมันลด ซื้อหุ้นเติบโต" อย่างชัดเจน — การย่อตัวของผลตอบแทนพันธบัตร 10 ปีสู่ 4.951% ลดอัตราคิดลดของกำไรในอนาคตจากการลงทุนด้าน AI ซึ่งเป็นเหตุผลที่หุ้นกลุ่มชิปและ AI (Intel, AMD, Nvidia, Corning, Meta) นำตลาดอย่างชัดเจน การที่ AMD แตะมูลค่า 1 ล้านล้านดอลลาร์ชั่วคราวเป็นจุดสำคัญที่ควรแจ้ง แต่การกระจุกตัวของแรงซื้อในหุ้นกลุ่มชิปเพียงไม่กี่ตัวก็เป็นความเสี่ยงด้านการกระจุกตัวที่ควรแจ้งลูกค้าเช่นกัน`},
      full:{en:`US stocks posted their best session in weeks Monday as key technology names advanced while oil prices and Treasury yields slipped. The S&P 500 climbed 1.49% to 7,764.70, the Nasdaq Composite gained 2.26% for a record close of 27,122.09 — its first since June — and the Dow Jones Industrial Average added 366.19 points (+0.71%) to 52,048.83. Chipmakers Intel and Advanced Micro Devices surged roughly 12% and 10% respectively, with AMD briefly touching a $1 trillion market cap; Nvidia gained 2%, fiber-optic maker Corning advanced almost 6%, and Meta Platforms surged more than 11%. West Texas Intermediate crude fell 4.5% to $95.78/bbl and Brent settled more than 3% lower at $100.34/bbl, while the 10-year Treasury yield slid more than 4 basis points to 4.951%. Gold was little changed near $4,377/oz. The Sep 29 tariff deadline (including a 100% duty on patented pharmaceuticals) is unchanged, and futures markets now price the Fed's October 28 meeting as close to a coin-flip between holding rates and a further quarter-point hike.`, th:`หุ้นสหรัฐฯ ปิดตลาดวันจันทร์ด้วยเซสชันที่ดีที่สุดในรอบหลายสัปดาห์ เมื่อหุ้นกลุ่มเทคโนโลยีหลักปรับขึ้น ขณะราคาน้ำมันและผลตอบแทนพันธบัตรลดลง ดัชนี S&P 500 เพิ่มขึ้น 1.49% สู่ 7,764.70 ดัชนี Nasdaq Composite เพิ่มขึ้น 2.26% ปิดสูงสุดเป็นประวัติการณ์ที่ 27,122.09 — สูงสุดครั้งแรกนับตั้งแต่เดือนมิถุนายน — และดัชนี Dow Jones เพิ่มขึ้น 366.19 จุด (+0.71%) สู่ 52,048.83 หุ้นกลุ่มผู้ผลิตชิป Intel และ Advanced Micro Devices พุ่งขึ้นราว 12% และ 10% ตามลำดับ โดย AMD แตะมูลค่าตลาด 1 ล้านล้านดอลลาร์ชั่วคราว ขณะ Nvidia เพิ่มขึ้น 2% ผู้ผลิตไฟเบอร์ออปติก Corning เพิ่มขึ้นเกือบ 6% และ Meta Platforms พุ่งขึ้นกว่า 11% ราคาน้ำมันดิบ WTI ลดลง 4.5% สู่ $95.78 ต่อบาร์เรล และเบรนท์ปิดลดลงกว่า 3% สู่ $100.34 ต่อบาร์เรล ขณะผลตอบแทนพันธบัตร 10 ปีลดลงกว่า 4 basis points สู่ 4.951% ทองคำแทบไม่เปลี่ยนแปลงใกล้ $4,377 ต่อออนซ์ กำหนดเส้นตายภาษีศุลกากรวันที่ 29 ก.ย. (รวมอัตราภาษี 100% สำหรับยาที่มีสิทธิบัตร) ยังไม่เปลี่ยนแปลง และตลาดล่วงหน้าเริ่มให้ราคาการประชุมเฟดวันที่ 28 ตุลาคม ใกล้เคียง 50-50 ระหว่างการคงดอกเบี้ยและการขึ้นดอกเบี้ยอีก 0.25%`},
      sources:[{l:"Yahoo Finance — Stock market today: Nasdaq surges 2% to record high",u:"https://finance.yahoo.com/markets/live/stock-market-today-monday-september-21-dow-sp-500-nasdaq-080214605.html"},{l:"CNBC — Stock market news for Sept. 21, 2026",u:"https://www.cnbc.com/2026/09/20/stock-market-today-live-updates.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,304.06", chg:-0.02, series:[25308.88,25304.06],
      txt:{en:`<b>Germany's DAX was essentially flat Monday, easing 0.02% to 25,304.06,</b> a quiet session as the region digested Friday's BOJ-driven auto selloff while Wall Street's chip-led rally ran on the other side of the Atlantic.`, th:`<b>ดัชนี DAX เยอรมนีทรงตัวใกล้เคียงเดิมวันจันทร์ ลดลงเพียง 0.02% สู่ 25,304.06</b> เป็นเซสชันที่ค่อนข้างเงียบ ขณะภูมิภาคยังคงย่อยข่าวแรงเทขายกลุ่มยานยนต์จาก BOJ เมื่อวันศุกร์ ในขณะที่วอลล์สตรีทปรับขึ้นแรงจากหุ้นกลุ่มชิปอีกฝั่งของมหาสมุทรแอตแลนติก`},
      why:{en:`A flat DAX after Friday's 1.65% auto-led tumble suggests the selloff was a one-day repricing of yen strength and financing costs rather than the start of a deeper rout — European investors did not follow Wall Street's chip-driven risk-on move, since the DAX has limited direct AI-chip exposure compared to the Nasdaq. Watch whether German autos stabilize or extend Friday's losses as the week progresses.`, th:`การที่ DAX ทรงตัวหลังร่วงแรง 1.65% จากกลุ่มยานยนต์เมื่อวันศุกร์ บ่งชี้ว่าแรงเทขายเป็นการปรับราคารับเยนที่แข็งค่าและต้นทุนทางการเงินเพียงวันเดียว ไม่ใช่จุดเริ่มต้นของการร่วงลึกกว่านั้น — นักลงทุนยุโรปไม่ได้ตามกระแสเปิดรับความเสี่ยงจากหุ้นกลุ่มชิปของวอลล์สตรีท เนื่องจาก DAX มีสัดส่วนหุ้นกลุ่ม AI/ชิปโดยตรงน้อยกว่า Nasdaq ควรจับตาว่ากลุ่มยานยนต์เยอรมันจะทรงตัวหรือปรับลงต่อในสัปดาห์นี้`},
      full:{en:`European shares were little changed Monday after Friday's sharp, auto-led selloff. Germany's DAX eased just 0.02% to close at 25,304.06, holding near Friday's one-month low as investors weighed whether the yen-strength and financing-cost concerns that hit Volkswagen, Porsche and Mercedes-Benz would persist. The muted session stood in contrast to a sharp risk-on rally in US chip and AI-adjacent names on the same day, underscoring that Europe's index has far less direct exposure to the AI-capex theme driving Wall Street.`, th:`หุ้นยุโรปแทบไม่เปลี่ยนแปลงวันจันทร์ หลังแรงเทขายรุนแรงกลุ่มยานยนต์เมื่อวันศุกร์ ดัชนี DAX เยอรมนีลดลงเพียง 0.02% ปิดที่ 25,304.06 ยืนใกล้จุดต่ำสุดในรอบเดือนของวันศุกร์ ขณะนักลงทุนชั่งน้ำหนักว่าความกังวลเรื่องเยนแข็งค่าและต้นทุนทางการเงินที่กระทบ Volkswagen, Porsche และ Mercedes-Benz จะคงอยู่ต่อหรือไม่ เซสชันที่ค่อนข้างเงียบนี้ตรงข้ามกับการปรับขึ้นแรงของหุ้นกลุ่มชิปและ AI ของสหรัฐฯ ในวันเดียวกัน สะท้อนว่าดัชนียุโรปมีสัดส่วนหุ้นที่เกี่ยวข้องกับธีมการลงทุน AI น้อยกว่าวอลล์สตรีทมาก`},
      sources:[{l:"Bloomberg — US stock futures up ahead of talks, dollar steady, markets wrap",u:"https://www.bloomberg.com/news/articles/2026-09-20/us-stock-futures-up-ahead-of-talks-dollar-steady-markets-wrap"},{l:"Trading Economics — Germany",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"65,018.95", chg:1.38, series:[65018.95],
      txt:{en:`<b>Tokyo's markets stayed closed Monday for the Respect for the Aged Day holiday, leaving the Nikkei 225 unchanged at Friday's close of 65,018.95 (+1.38%).</b> Elsewhere in the region, Wall Street's chip-led rally set an upbeat tone for Tuesday's reopening.`, th:`<b>ตลาดโตเกียวปิดทำการวันจันทร์เนื่องในวันหยุดเคารพผู้สูงอายุ ทำให้ดัชนี Nikkei 225 ไม่เปลี่ยนแปลงจากราคาปิดวันศุกร์ที่ 65,018.95 (+1.38%)</b> ส่วนอื่นของภูมิภาค การปรับขึ้นแรงของหุ้นกลุ่มชิปในวอลล์สตรีทสร้างบรรยากาศเชิงบวกก่อนตลาดโตเกียวเปิดทำการอีกครั้งวันอังคาร`},
      why:{en:`With Tokyo shut, the Nikkei can't yet confirm whether Friday's BOJ-relief rally has legs, or how Japanese exporters are digesting the yen's move. Tuesday's reopening is the real test — and it now also has to price in Wall Street's Monday surge in AI/chip names, which should be a tailwind for Tokyo's own semiconductor-linked stocks (Advantest, Tokyo Electron) when trading resumes.`, th:`เมื่อตลาดโตเกียวปิดทำการ ดัชนี Nikkei จึงยังไม่สามารถยืนยันได้ว่าการดีดตัวรับความโล่งใจจาก BOJ เมื่อวันศุกร์จะต่อเนื่องหรือไม่ หรือผู้ส่งออกญี่ปุ่นกำลังย่อยการเคลื่อนไหวของเยนอย่างไร การเปิดตลาดวันอังคารคือบททดสอบที่แท้จริง — และตอนนี้ต้องสะท้อนราคาการพุ่งขึ้นของหุ้นกลุ่ม AI/ชิปในวอลล์สตรีทเมื่อวันจันทร์ด้วย ซึ่งน่าจะเป็นแรงหนุนต่อหุ้นกลุ่มเซมิคอนดักเตอร์ของโตเกียวเอง (Advantest, Tokyo Electron) เมื่อการซื้อขายกลับมาดำเนินต่อ`},
      full:{en:`Japanese markets were closed Monday for the Respect for the Aged Day public holiday, so the Nikkei 225 carried over Friday's close of 65,018.95 (+1.38%), when it had rallied on relief that the Bank of Japan's rate hike to 1.25% wasn't accompanied by a more hawkish signal. With Tokyo dark, the region's action shifted to China and Hong Kong, which extended Friday's gains, while Wall Street posted its best session in weeks on a chip-stock surge. Tokyo reopens Tuesday, its first chance to price in both the weekend's calm and Monday's AI-led rally in the US, which should be watched closely for spillover into Japan's own semiconductor and AI-adjacent names.`, th:`ตลาดญี่ปุ่นปิดทำการวันจันทร์เนื่องในวันหยุดราชการวันเคารพผู้สูงอายุ ทำให้ดัชนี Nikkei 225 ยังคงราคาปิดวันศุกร์ที่ 65,018.95 (+1.38%) ซึ่งดีดตัวขึ้นจากความโล่งใจที่การขึ้นดอกเบี้ยของ BOJ สู่ 1.25% ไม่ได้มาพร้อมสัญญาณสายเหยี่ยวที่รุนแรงกว่านี้ เมื่อตลาดโตเกียวปิดทำการ ความเคลื่อนไหวในภูมิภาคจึงย้ายไปที่จีนและฮ่องกง ซึ่งต่อยอดการปรับขึ้นจากวันศุกร์ ขณะวอลล์สตรีทมีเซสชันที่ดีที่สุดในรอบหลายสัปดาห์จากแรงซื้อหุ้นกลุ่มชิป ตลาดโตเกียวจะเปิดทำการอีกครั้งวันอังคาร เป็นโอกาสแรกที่จะสะท้อนราคาทั้งความสงบช่วงสุดสัปดาห์และการปรับขึ้นที่นำโดยหุ้นกลุ่ม AI ของสหรัฐฯ เมื่อวันจันทร์ ซึ่งควรจับตาผลกระทบต่อหุ้นกลุ่มเซมิคอนดักเตอร์และ AI ของญี่ปุ่นเองอย่างใกล้ชิด`},
      sources:[{l:"News On Japan — Tokyo Market Closed as Yen Intervention Watch Dominates Silver Week",u:"https://newsonjapan.com/article/150825.php"},{l:"Japan Times — Bank of Japan raises rates and offers mixed signals about next move higher",u:"https://www.japantimes.co.jp/business/2026/09/18/economy/boj-meeting-september/"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,872", chg:0.50, series:[24750.78,24872],
      txt:{en:`<b>Hang Seng rose about 0.50% to near 24,872 Monday, while the Shanghai Composite added 0.97% to 3,949.91,</b> extending Friday's Asia rally on tech and health-tech buying even with Tokyo closed for a holiday.`, th:`<b>Hang Seng เพิ่มขึ้นราว 0.50% สู่ใกล้ 24,872 วันจันทร์ ขณะ Shanghai Composite เพิ่มขึ้น 0.97% สู่ 3,949.91</b> ต่อยอดการดีดตัวของเอเชียจากวันศุกร์ จากแรงซื้อหุ้นกลุ่มเทคและเฮลท์เทค แม้ตลาดโตเกียวจะปิดทำการวันหยุด`},
      why:{en:`China and Hong Kong extending gains without Tokyo's participation shows the region's own tech and biotech rally has independent legs, not just a BOJ-relief echo — Shanghai's move was led by innovative-drug and property names hitting limit-up, a domestically driven story distinct from Wall Street's chip rally. Worth watching whether mainland tech strength converges with the AI-capex theme once Tokyo reopens Tuesday.`, th:`การที่จีนและฮ่องกงยังปรับขึ้นต่อได้แม้ไม่มีตลาดโตเกียวร่วมด้วย แสดงว่าการดีดตัวของหุ้นกลุ่มเทคและไบโอเทคในภูมิภาคมีแรงขับเคลื่อนของตัวเอง ไม่ใช่แค่การสะท้อนความโล่งใจจาก BOJ — การปรับขึ้นของ Shanghai นำโดยหุ้นกลุ่มยานวัตกรรมยาและอสังหาริมทรัพย์ที่ขึ้นชนเพดาน ซึ่งเป็นเรื่องราวที่ขับเคลื่อนจากภายในประเทศ แยกจากการปรับขึ้นของหุ้นกลุ่มชิปในวอลล์สตรีท ควรจับตาว่าความแข็งแกร่งของหุ้นเทคจีนแผ่นดินใหญ่จะบรรจบกับธีมการลงทุน AI หรือไม่ เมื่อตลาดโตเกียวเปิดทำการอีกครั้งวันอังคาร`},
      full:{en:`Hong Kong and mainland China both advanced Monday even with Tokyo closed for a holiday. The Hang Seng rose about 0.50% to near 24,872 on gains in technology and health-tech shares, while the Shanghai Composite added 0.97% to close at 3,949.91, led by innovative-drug and real-estate names that triggered a wave of limit-up moves. The gains extended Friday's broader Asia rally and came on the same day Wall Street posted its best session in weeks on a chip-stock surge, though mainland strength was driven mainly by domestic sector rotation rather than a direct read-through from the US rally.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่ปรับขึ้นทั้งคู่วันจันทร์ แม้ตลาดโตเกียวจะปิดทำการวันหยุด ดัชนี Hang Seng เพิ่มขึ้นราว 0.50% สู่ใกล้ 24,872 จากแรงซื้อหุ้นกลุ่มเทคโนโลยีและเฮลท์เทค ขณะดัชนี Shanghai Composite เพิ่มขึ้น 0.97% ปิดที่ 3,949.91 นำโดยหุ้นกลุ่มยานวัตกรรมยาและอสังหาริมทรัพย์ที่กระตุ้นให้เกิดคลื่นการขึ้นชนเพดานราคา การปรับขึ้นนี้ต่อยอดการดีดตัวของเอเชียในวงกว้างจากวันศุกร์ และเกิดขึ้นในวันเดียวกับที่วอลล์สตรีทมีเซสชันที่ดีที่สุดในรอบหลายสัปดาห์จากแรงซื้อหุ้นกลุ่มชิป แม้ความแข็งแกร่งของตลาดจีนแผ่นดินใหญ่จะขับเคลื่อนโดยการหมุนเวียนกลุ่มอุตสาหกรรมภายในประเทศเป็นหลัก มากกว่าการสะท้อนโดยตรงจากการปรับขึ้นของสหรัฐฯ`},
      sources:[{l:"Sunday Guardian Live — Hang Seng Index Rises 0.5% As Tech and Health-Tech Stocks Gain",u:"https://sundayguardianlive.com/business/hong-kong-stock-market-today-september-21-hang-seng-index-rises-05-as-tech-and-health-tech-stocks-gain-check-top-movers-and-key-triggers-289311/"},{l:"Business Recorder — China stocks end higher as tech boost offsets weak data",u:"https://www.brecorder.com/news/amp/40437315"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,598.03", chg:0.88, series:[1584.15,1598.03],
      txt:{en:`<b>SET Index jumped 0.88% to 1,598.03 Monday (+13.88 pts),</b> on turnover of about THB 68.45bn, after Fitch Ratings upgraded Thailand's credit outlook to Stable from Negative, lifting banks and drawing fresh foreign inflows.`, th:`<b>ดัชนี SET พุ่งขึ้น 0.88% สู่ 1,598.03 วันจันทร์ (+13.88 จุด)</b> มูลค่าการซื้อขายราว 6.845 หมื่นล้านบาท หลัง Fitch Ratings ปรับมุมมองอันดับความน่าเชื่อถือของไทยเป็นคงที่จากลบ หนุนกลุ่มธนาคารและดึงดูดเงินทุนต่างชาติไหลเข้าใหม่`},
      why:{en:`This is a genuine country-specific catalyst, distinct from the global tape: a sovereign-outlook upgrade directly lowers perceived credit risk for Thai banks and improves the case for foreign bond and equity inflows. The added lift from electronics stocks tracking the regional chip rally shows Thai investors are also riding Monday's global risk-on wave — a rare case of a domestic and a global tailwind aligning on the same day.`, th:`นี่คือปัจจัยกระตุ้นเฉพาะประเทศที่แท้จริง แยกจากภาพรวมตลาดโลก — การปรับมุมมองอันดับความน่าเชื่อถือของประเทศช่วยลดความเสี่ยงด้านเครดิตที่รับรู้สำหรับธนาคารไทยโดยตรง และเพิ่มโอกาสเงินทุนไหลเข้าทั้งตราสารหนี้และหุ้นจากต่างชาติ แรงหนุนเพิ่มเติมจากหุ้นกลุ่มอิเล็กทรอนิกส์ที่ตามการปรับขึ้นของหุ้นกลุ่มชิปในภูมิภาค แสดงว่านักลงทุนไทยก็ขี่กระแสเปิดรับความเสี่ยงทั่วโลกวันจันทร์ด้วยเช่นกัน — เป็นกรณีที่หายากที่ปัจจัยหนุนภายในประเทศและระดับโลกมาบรรจบกันในวันเดียว`},
      full:{en:`Thailand's SET Index closed Monday at 1,598.03, up 13.88 points (+0.88%), on turnover of about THB 68.45 billion, after Fitch Ratings upgraded the country's sovereign credit outlook to Stable from Negative. The move bolstered sentiment toward the banking sector and helped draw foreign fund inflows, while additional buying interest in the electronics sector tracked the broader Asian tech and chip rally that also lifted Hong Kong and Shanghai on the same day. The gains mark a clean break from Friday's near-flat close and give the SET its best session in several trading days.`, th:`ดัชนี SET ของไทยปิดตลาดวันจันทร์ที่ 1,598.03 เพิ่มขึ้น 13.88 จุด (+0.88%) มูลค่าการซื้อขายราว 6.845 หมื่นล้านบาท หลัง Fitch Ratings ปรับมุมมองอันดับความน่าเชื่อถือของประเทศเป็นคงที่จากลบ การเคลื่อนไหวนี้หนุนความเชื่อมั่นต่อกลุ่มธนาคาร และช่วยดึงดูดเงินทุนไหลเข้าจากต่างชาติ ขณะแรงซื้อเพิ่มเติมในกลุ่มอิเล็กทรอนิกส์ตามการปรับขึ้นของหุ้นกลุ่มเทคและชิปในเอเชียที่กว้างขึ้น ซึ่งหนุนตลาดฮ่องกงและเซี่ยงไฮ้ในวันเดียวกันด้วย การปรับขึ้นครั้งนี้ถือเป็นการหลุดออกจากการปิดตลาดที่แทบทรงตัวเมื่อวันศุกร์อย่างชัดเจน และเป็นเซสชันที่ดีที่สุดของ SET ในรอบหลายวันทำการ`},
      sources:[{l:"Kaohoon International — Market Roundup 21 September 2026",u:"https://www.kaohooninternational.com/markets/591159"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil tumbled Monday — WTI -4.5% to $95.78/bbl, Brent -3%+ to $100.34/bbl — while gold was little changed near $4,377/oz,</b> as the drop in energy prices and Treasury yields together fueled Wall Street's chip-stock rally.`, th:`<b>ราคาน้ำมันร่วงแรงวันจันทร์ — WTI ลดลง 4.5% สู่ $95.78 ต่อบาร์เรล เบรนท์ลดลงกว่า 3% สู่ $100.34 ต่อบาร์เรล — ขณะทองคำแทบไม่เปลี่ยนแปลงใกล้ $4,377 ต่อออนซ์</b> เมื่อราคาพลังงานและผลตอบแทนพันธบัตรที่ลดลงร่วมกันหนุนการปรับขึ้นของหุ้นกลุ่มชิปในวอลล์สตรีท`},
     why:{en:`A 4.5% one-day drop in WTI is a sizeable move and the clearest sign yet that the Iran-war supply-disruption premium built up over recent weeks is unwinding — that's a genuine disinflationary input, not just noise. Gold holding steady rather than falling alongside oil shows bullion is still being held as a structural hedge against tariff and policy uncertainty, even as the immediate inflation scare fades; don't read Monday's calm as a change in that thesis.`, th:`การที่ WTI ร่วงลง 4.5% ภายในวันเดียวเป็นการเคลื่อนไหวที่มีนัยสำคัญ และเป็นสัญญาณที่ชัดเจนที่สุดว่าพรีเมียมความเสี่ยงด้านอุปทานจากสงครามอิหร่านที่สะสมมาหลายสัปดาห์กำลังคลี่คลายลง — นี่เป็นปัจจัยลดเงินเฟ้อที่แท้จริง ไม่ใช่แค่ความผันผวนชั่วคราว การที่ทองคำทรงตัวแทนที่จะลดลงตามน้ำมัน แสดงว่านักลงทุนยังคงถือทองคำเป็นเครื่องมือป้องกันความเสี่ยงเชิงโครงสร้างจากภาษีศุลกากรและความไม่แน่นอนเชิงนโยบาย แม้ความกังวลเงินเฟ้อเฉพาะหน้าจะลดลง อย่ามองว่าความสงบของวันจันทร์เป็นการเปลี่ยนแปลงของแนวคิดนี้`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 10-year Treasury yield eased more than 4bp to 4.951% Monday as oil prices fell,</b> and futures markets now price the Fed's October 28 meeting close to a coin-flip — roughly 55% odds of another quarter-point hike versus 45% for a hold — a shift away from earlier expectations of a year-end cut.`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีย่อตัวลงกว่า 4bp สู่ 4.951% วันจันทร์ เมื่อราคาน้ำมันลดลง</b> และตลาดล่วงหน้าเริ่มให้ราคาการประชุมเฟดวันที่ 28 ตุลาคมใกล้เคียง 50-50 — โอกาสขึ้นดอกเบี้ยอีก 0.25% ราว 55% เทียบกับคงดอกเบี้ย 45% — เปลี่ยนจากที่เคยคาดการณ์ว่าจะลดดอกเบี้ยช่วงปลายปี`},
     why:{en:`Markets pricing near-even odds of an October hike, just weeks after the Fed's first hike in three years, shows the tightening cycle that began in September isn't a one-off — Chair Warsh's line that inflation "is too high, and has been for too long" is being taken at face value. A softer 10-year yield on a day when hike odds actually rose is notable: it suggests Monday's yield move was driven more by falling oil (lower near-term inflation) than by any dovish repricing of the Fed path.`, th:`การที่ตลาดให้ราคาโอกาสขึ้นดอกเบี้ยเดือนตุลาคมใกล้เคียง 50-50 เพียงไม่กี่สัปดาห์หลังเฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี แสดงว่าวัฏจักรการคุมเข้มที่เริ่มในเดือนกันยายนไม่ใช่เหตุการณ์ครั้งเดียว — คำพูดของประธานวอร์ชที่ว่าเงินเฟ้อ "สูงเกินไป และสูงมานานเกินไป" กำลังถูกตลาดรับฟังอย่างจริงจัง การที่ผลตอบแทนพันธบัตร 10 ปีอ่อนตัวลงในวันที่โอกาสขึ้นดอกเบี้ยกลับเพิ่มขึ้นเป็นเรื่องน่าสังเกต — บ่งชี้ว่าการเคลื่อนไหวของผลตอบแทนพันธบัตรวันจันทร์มาจากราคาน้ำมันที่ลดลง (เงินเฟ้อระยะสั้นที่ลดลง) มากกว่าการปรับมุมมองเชิงผ่อนคลายต่อทิศทางเฟด`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`No fresh tariff escalation was reported Monday, but last week's moves stand: Trump's ban on Canadian goods from US government procurement and his threat of fresh EU tariffs remain in place, and Washington's broader tariff schedule — including a 100% default duty on patented pharmaceuticals — still takes full effect September 29 for most trading partners. Monday's rally was driven by falling oil and yields, not by any tariff-related news.`, th:`ยังไม่มีรายงานการทวีความรุนแรงด้านภาษีศุลกากรใหม่วันจันทร์ แต่มาตรการสัปดาห์ก่อนยังคงอยู่: การห้ามสินค้าแคนาดาเข้าร่วมการจัดซื้อของรัฐบาลสหรัฐฯ และการขู่ภาษีศุลกากรใหม่ต่อสหภาพยุโรปของทรัมป์ยังไม่เปลี่ยนแปลง ขณะตารางภาษีศุลกากรที่กว้างขึ้นของสหรัฐฯ — รวมถึงอัตราภาษีเริ่มต้น 100% สำหรับยาที่มีสิทธิบัตร — ยังคงมีผลบังคับใช้เต็มรูปแบบวันที่ 29 กันยายนกับคู่ค้าส่วนใหญ่ การปรับขึ้นของตลาดวันจันทร์ขับเคลื่อนจากราคาน้ำมันและผลตอบแทนพันธบัตรที่ลดลง ไม่ใช่จากข่าวภาษีศุลกากรใด ๆ`}, w:{en:`With Sep 29 now just over a week away, expect tariff headlines to resurface as the deadline approaches — the pharmaceutical duty in particular is a concrete date-specific risk for healthcare-exposed portfolios. The absence of new tariff news Monday let markets trade purely on rates and oil, but that calm is likely temporary given the looming deadline.`, th:`เมื่อวันที่ 29 ก.ย. เหลืออีกเพียงกว่าหนึ่งสัปดาห์ คาดว่าข่าวภาษีศุลกากรจะกลับมาเป็นประเด็นอีกครั้งเมื่อใกล้ถึงกำหนดเส้นตาย โดยเฉพาะภาษียาที่มีสิทธิบัตรเป็นความเสี่ยงเฉพาะวันที่ชัดเจนสำหรับพอร์ตที่มีความเสี่ยงด้านสุขภาพ การที่ไม่มีข่าวภาษีศุลกากรใหม่วันจันทร์ทำให้ตลาดซื้อขายตามอัตราดอกเบี้ยและน้ำมันล้วน ๆ แต่ความสงบนี้น่าจะเป็นเพียงชั่วคราวเมื่อกำหนดเส้นตายใกล้เข้ามา`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Oil fell sharply Monday — WTI -4.5% to $95.78/bbl, Brent -3%+ to $100.34/bbl — as traders grew more hopeful that diplomatic efforts could ease the Iran war's shipping disruptions, a marked shift after four straight sessions of oil declines to start the week's build-up.`, th:`ราคาน้ำมันร่วงแรงวันจันทร์ — WTI ลดลง 4.5% สู่ $95.78 ต่อบาร์เรล เบรนท์ลดลงกว่า 3% สู่ $100.34 ต่อบาร์เรล — เมื่อนักลงทุนมีความหวังมากขึ้นว่าความพยายามทางการทูตอาจช่วยคลี่คลายปัญหาด้านการเดินเรือจากสงครามอิหร่าน เป็นการเปลี่ยนแปลงที่ชัดเจนหลังราคาน้ำมันลดลงต่อเนื่องสี่เซสชัน`}, w:{en:`A 4.5% single-day drop in WTI on diplomatic hope, rather than a confirmed resolution, is a fragile rally — any setback in talks could reverse the move quickly and reignite the tanker-war inflation scare that has driven markets for weeks. Treat Monday's calm as tentative, not a durable de-escalation, until a concrete diplomatic outcome is confirmed.`, th:`การที่ WTI ร่วงลง 4.5% ภายในวันเดียวจากความหวังทางการทูต มากกว่าการคลี่คลายที่ยืนยันแล้ว ทำให้การปรับขึ้นนี้ค่อนข้างเปราะบาง — ความล้มเหลวใด ๆ ในการเจรจาอาจทำให้การเคลื่อนไหวนี้กลับตัวอย่างรวดเร็ว และจุดชนวนความกังวลเงินเฟ้อจากสงครามเรือบรรทุกน้ำมันที่ขับเคลื่อนตลาดมาหลายสัปดาห์อีกครั้ง ควรมองความสงบของวันจันทร์เป็นเพียงชั่วคราว ไม่ใช่การคลี่คลายที่ยั่งยืน จนกว่าจะมีผลลัพธ์ทางการทูตที่ชัดเจน`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The US 10-year Treasury yield eased more than 4bp to 4.951% Monday as oil prices fell, even as futures markets now price the Fed's October 28 meeting close to a coin-flip (~55% odds of another quarter-point hike vs. 45% for a hold) — a shift from earlier expectations of a year-end rate cut.`, th:`ผลตอบแทนพันธบัตร 10 ปีของสหรัฐฯ ย่อตัวลงกว่า 4bp สู่ 4.951% วันจันทร์ เมื่อราคาน้ำมันลดลง แม้ตลาดล่วงหน้าจะเริ่มให้ราคาการประชุมเฟดวันที่ 28 ตุลาคมใกล้เคียง 50-50 (โอกาสขึ้นดอกเบี้ยอีก 0.25% ราว 55% เทียบกับคงดอกเบี้ย 45%) — เปลี่ยนจากที่เคยคาดการณ์ว่าจะลดดอกเบี้ยช่วงปลายปี`}, w:{en:`A softer 10-year yield on a day when hike odds actually rose is a useful tell: Monday's bond-market move was about falling near-term inflation expectations (cheaper oil), not a dovish repricing of the Fed. With the Fed already hiking in September and October odds near 50-50, the "higher for longer" narrative from recent weeks is intact even as individual days like Monday bring tactical relief.`, th:`การที่ผลตอบแทนพันธบัตร 10 ปีอ่อนตัวลงในวันที่โอกาสขึ้นดอกเบี้ยกลับเพิ่มขึ้น เป็นสัญญาณที่มีประโยชน์ — การเคลื่อนไหวของตลาดพันธบัตรวันจันทร์มาจากความคาดหวังเงินเฟ้อระยะสั้นที่ลดลง (น้ำมันที่ถูกลง) ไม่ใช่การปรับมุมมองเชิงผ่อนคลายต่อเฟด เมื่อเฟดขึ้นดอกเบี้ยไปแล้วในเดือนกันยายน และโอกาสเดือนตุลาคมอยู่ที่ราว 50-50 เรื่องราว "ดอกเบี้ยสูงนานขึ้น" จากหลายสัปดาห์ก่อนยังคงอยู่ แม้แต่ละวันอย่างวันจันทร์จะมีการผ่อนคลายเชิงกลยุทธ์`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`No new US CPI print has landed since last week, but Monday's cross-currents told their own story: a 4.5% drop in oil eased near-term inflation fears enough to send Treasury yields lower and clear the way for a chip-stock rally, even as futures markets now price the Fed's October meeting close to even odds of another hike.`, th:`ยังไม่มีตัวเลข CPI ของสหรัฐฯ ใหม่นับตั้งแต่สัปดาห์ก่อน แต่ความเคลื่อนไหวที่สวนทางกันของวันจันทร์บอกเรื่องราวในตัวเอง: ราคาน้ำมันที่ลดลง 4.5% ช่วยคลายความกังวลเงินเฟ้อระยะสั้นมากพอที่จะดันผลตอบแทนพันธบัตรลง และเปิดทางให้หุ้นกลุ่มชิปปรับขึ้น แม้ตลาดล่วงหน้าจะเริ่มให้ราคาการประชุมเฟดเดือนตุลาคมใกล้เคียง 50-50 สำหรับการขึ้นดอกเบี้ยอีกครั้ง`}, w:{en:`Falling oil doing the heavy lifting for Monday's rally is a reminder that this inflation relief is energy-driven and could reverse quickly if the Iran-war diplomacy that triggered it falters. Keep framing client conversations around structurally sticky inflation — tariffs (Sep 29 deadline), energy geopolitics and AI capex — rather than reading one good day as confirmation inflation is beaten.`, th:`การที่ราคาน้ำมันที่ลดลงเป็นแรงหนุนหลักของการปรับขึ้นวันจันทร์ เป็นเครื่องเตือนใจว่าการคลายความกังวลเงินเฟ้อนี้ขับเคลื่อนจากพลังงาน และอาจกลับตัวอย่างรวดเร็วหากการทูตเรื่องอิหร่านที่เป็นต้นเหตุล้มเหลว ควรวางกรอบการสนทนากับลูกค้าโดยยึด "เงินเฟ้อติดสูงจากปัจจัยเชิงโครงสร้าง" — ภาษีศุลกากร (กำหนดเส้นตาย 29 ก.ย.) ภูมิรัฐศาสตร์ด้านพลังงาน และการลงทุนด้าน AI — มากกว่ามองว่าวันดี ๆ วันเดียวเป็นการยืนยันว่าเงินเฟ้อถูกควบคุมได้แล้ว`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 8 Sep",th:"อังคาร 8 ก.ย."}, imp:"h", t:{en:"Wall Street reopens for the first time since the tanker war, with hike odds near 60%",th:"วอลล์สตรีทเปิดตลาดอีกครั้งเป็นครั้งแรกหลังสงครามเรือบรรทุกน้ำมัน ขณะโอกาสขึ้นดอกเบี้ยใกล้ 60%"}, d:{en:"US markets reopen Tuesday after the Labor Day break, giving the first direct pricing of both the weekend's Iran-tanker escalation and the climb in September rate-hike odds to roughly 60%. Oil (Brent near $98, WTI above $92) and the elevated 10-year yield (~4.79%) will be the key signals to watch as trading resumes.",th:"ตลาดสหรัฐฯ เปิดทำการอีกครั้งวันอังคารหลังหยุดวันแรงงาน เป็นการสะท้อนราคาโดยตรงครั้งแรกทั้งการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ขยับขึ้นสู่ราว 60% ราคาน้ำมัน (เบรนท์ใกล้ $98, WTI เหนือ $92) และผลตอบแทนพันธบัตร 10 ปีที่สูงขึ้น (~4.79%) จะเป็นสัญญาณสำคัญที่ต้องจับตาเมื่อการซื้อขายกลับมาดำเนินต่อ"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 9 Sep",th:"พุธ 9 ก.ย."}, imp:"h", t:{en:"Oil tops $101 as tanker war's worst wave yet hits Wall St a third day",th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"}, d:{en:"The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%); national gas hit $4.22/gal and diesel a record $5.94/gal. The S&P 500 fell 0.48% to 7,636.36 (a third straight down day), the DAX slid 1.74% to a one-month low of 25,554, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. September hike odds eased slightly to ~57%.",th:"สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ดัชนี S&P 500 ลดลง 0.48% สู่ 7,636.36 (ปรับลงวันที่สามติดต่อกัน) ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือนที่ 25,554 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 10 Sep",th:"พฤหัสฯ 10 ก.ย."}, imp:"h", t:{en:"Wall St falls a fourth day; hike odds jump to ~72% as yields near 5%",th:"วอลล์สตรีทร่วงวันที่สี่ โอกาสขึ้นดอกเบี้ยพุ่งสู่ราว 72% ผลตอบแทนใกล้ 5%"}, d:{en:"US stocks fell a fourth straight session — S&P 500 -0.58% to 7,591.70, Dow -0.6% to 52,064.10, Nasdaq -0.65% to 26,081.72 — as the 10-year Treasury yield pushed above 4.9% and Wednesday's in-line PPI kept inflation in focus. September hike odds jumped to roughly 72%, from ~57% a day earlier. Germany's DAX fell 0.8% to 25,401 after the ECB hiked 25bp; Hong Kong's Hang Seng dropped 1.27% while Japan's Nikkei edged up 0.20% and Thailand's SET eased 0.17% on profit-taking. Oil held near $101 and gold rose to $4,405.88.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกัน — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 0.6% สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 — ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% และ PPI วันพุธที่ออกมาตามคาดยังตอกย้ำแรงกดดันเงินเฟ้อ โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% จากราว 57% เมื่อวันก่อน ดัชนี DAX เยอรมนีลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ย 25bp ดัชนี Hang Seng ฮ่องกงลดลง 1.27% ขณะ Nikkei ญี่ปุ่นขยับขึ้น 0.20% และ SET ไทยลดลง 0.17% จากแรงขายทำกำไร น้ำมันยืนใกล้ $101 และทองคำเพิ่มขึ้นสู่ $4,405.88"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 11 Sep",th:"ศุกร์ 11 ก.ย."}, imp:"h", t:{en:"Hot core CPI pushes Sep 16 hike odds to ~90%; stocks rally, oil tumbles",th:"Core CPI ร้อนแรงดันโอกาสขึ้นดอกเบี้ย 16 ก.ย. สู่ราว 90% หุ้นดีดตัว น้ำมันร่วง"}, d:{en:"August headline CPI matched forecasts (+0.4% m/m, +3.4% y/y) but core CPI ran hot (+0.3% m/m vs +0.2% expected, +2.4% y/y), pushing Sep 16 hike odds to roughly 90% from ~72% Thursday. The S&P 500 rose 0.86% to 7,656.98, the Dow gained 509.19 pts (+0.98%) to 52,573.29, and the Nasdaq added 0.96% to 26,333.04. The 10-year yield touched 4.98% before easing to ~4.92%, and Brent tumbled 2.8% to $104.61 after Iran signaled Oman talks over the Strait of Hormuz. Earlier, before the print, Asia and Europe stayed mixed: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%.",th:"CPI ทั่วไปเดือน ส.ค. ตรงตามคาด (+0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อน) แต่ Core CPI ร้อนแรงกว่าคาด (+0.3% เทียบเดือนก่อน เทียบคาดการณ์ 0.2%, +2.4% เทียบปีก่อน) ดันโอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. สู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ดัชนี S&P 500 เพิ่มขึ้น 0.86% สู่ 7,656.98 ดัชนี Dow เพิ่มขึ้น 509.19 จุด (+0.98%) สู่ 52,573.29 และดัชนี Nasdaq เพิ่มขึ้น 0.96% สู่ 26,333.04 ผลตอบแทนพันธบัตร 10 ปีแตะ 4.98% ก่อนย่อตัวสู่ราว 4.92% และเบรนท์ร่วง 2.8% สู่ $104.61 หลังอิหร่านส่งสัญญาณเจรจาที่โอมานเรื่องช่องแคบฮอร์มุซ ก่อนหน้านั้น ก่อนตัวเลขจะประกาศ ตลาดเอเชียและยุโรปเคลื่อนไหวคละกัน: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 14 Sep",th:"จันทร์ 14 ก.ย."}, imp:"h", t:{en:"AI-slowdown selloff runs a full session; 10-year yield tops 5% intraday",th:"แรงเทขาย AI ดำเนินต่อเนื่องเต็มเซสชัน ผลตอบแทน 10 ปีทะลุ 5% ระหว่างวัน"}, d:{en:"US stocks fell a second straight session — S&P 500 -0.48% to 7,619.98, Dow -0.29% to 52,421.20, Nasdaq -0.56% to 26,186.41 — as the weekend's AI-slowdown warnings ran through a full session and the 10-year Treasury yield touched 5.01% intraday before easing to ~4.96%. DAX fell 0.66% to 25,398.75, Nikkei dropped 0.81% to 63,492.99, Hang Seng fell 0.48% to 24,687 (a 4th straight losing session), Shanghai eased 0.07% to 3,885, and Thailand's SET fell 0.84% to 1,591.07 on a DELTA-led electronics selloff. Brent settled $108.34 (+3.6%) and gold fell 1.25% to $4,284.48, its lowest since August.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สองติดต่อกัน — S&P 500 ลดลง 0.48% สู่ 7,619.98, Dow ลดลง 0.29% สู่ 52,421.20, Nasdaq ลดลง 0.56% สู่ 26,186.41 — ขณะคำเตือนชะลอ AI ช่วงสุดสัปดาห์ดำเนินต่อเนื่องเต็มเซสชัน และผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน ก่อนย่อตัวสู่ราว 4.96% ดัชนี DAX ลดลง 0.66% สู่ 25,398.75 ดัชนี Nikkei ลดลง 0.81% สู่ 63,492.99 ดัชนี Hang Seng ลดลง 0.48% สู่ 24,687 (ปรับลงติดต่อกันเป็นเซสชันที่สี่) ดัชนี Shanghai ลดลง 0.07% สู่ 3,885 และดัชนี SET ไทยลดลง 0.84% สู่ 1,591.07 จากแรงเทขายหุ้นอิเล็กทรอนิกส์ที่นำโดย DELTA เบรนท์ปิดที่ $108.34 (+3.6%) และทองคำลดลง 1.25% สู่ $4,284.48 ต่ำสุดตั้งแต่เดือนสิงหาคม"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 15 Sep",th:"อังคาร 15 ก.ย."}, imp:"h", t:{en:"Wall St falls a third day as the 10-year yield hits its highest since 2007",th:"วอลล์สตรีทร่วงวันที่สาม ผลตอบแทน 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007"}, d:{en:"US stocks fell a third straight session — S&P 500 -0.45% to 7,585.73, Dow -0.63% to 52,093.11, Nasdaq -0.78% to 25,981.57 — even as AI chip names Qualcomm and AMD bounced. The 10-year Treasury yield touched 5.04% intraday, its highest since 2007, before easing to ~5.00%, and CME FedWatch pushed hike odds to roughly 92% from 88% Monday. DAX fell 1.14% to ~25,109, Nikkei was flat at 63,484.10, Hang Seng eased 0.08% to 24,667 (a 5th straight losing session), and Shanghai fell 0.54% to 3,864.28. WTI rose to $105.49 while Brent held near $107.46, and gold fell 1.23% to a six-week low of $4,263.19.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกัน — S&P 500 ลดลง 0.45% สู่ 7,585.73, Dow ลดลง 0.63% สู่ 52,093.11, Nasdaq ลดลง 0.78% สู่ 25,981.57 — แม้หุ้นชิปกลุ่ม AI อย่าง Qualcomm และ AMD จะดีดตัวขึ้น ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวสู่ราว 5.00% และ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยขึ้นสู่ราว 92% จาก 88% เมื่อวันจันทร์ ดัชนี DAX ลดลง 1.14% สู่ราว 25,109 ดัชนี Nikkei ทรงตัวที่ 63,484.10 ดัชนี Hang Seng ลดลง 0.08% สู่ 24,667 (ปรับลงติดต่อกันเป็นเซสชันที่ห้า) และดัชนี Shanghai ลดลง 0.54% สู่ 3,864.28 WTI เพิ่มขึ้นสู่ $105.49 ขณะเบรนท์ยืนใกล้ $107.46 และทองคำลดลง 1.23% สู่ระดับต่ำสุดในรอบหกสัปดาห์ที่ $4,263.19"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 16 Sep",th:"พุธ 16 ก.ย."}, imp:"h", t:{en:"Fed hikes rates for the first time in three years; Wall Street falls, 10-year tops 5% again",th:"เฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี วอลล์สตรีทปรับลง ผลตอบแทน 10 ปีทะลุ 5% อีกครั้ง"}, d:{en:"The FOMC voted 12-0 to raise the fed funds rate a quarter point to 3.75%-4.00%, its first hike in three years. Chair Kevin Warsh said inflation \"is too high, and has been for too long,\" and the updated dot plot showed most officials expect at least one more hike this year. US stocks fell on the news — Dow -1.21% (-631.21 pts) to 51,461.90, S&P 500 -0.45% to 7,551.81, Nasdaq roughly flat at 25,978.42 — and the 10-year Treasury yield climbed back above 5% to 5.016%. Oil jumped on fresh Middle East supply fears (WTI +4.2% to $104.25, Brent +4.14% to $108.94) after Houthi attacks and a Saudi pipeline shutdown, while gold slipped 1.2% to $4,240.10. Asia and Europe, which closed hours before the announcement, only traded on anticipation: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80%. Thailand's SET fell 1.01% to 1,562.73 on domestic drivers (a diesel price cut and a delayed tourism-stimulus program), unrelated to the Fed.",th:"FOMC ลงมติเอกฉันท์ 12 เสียง ขึ้นอัตราดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ \"สูงเกินไป และสูงมานานเกินไป\" และ dot plot ฉบับปรับใหม่แสดงว่ากรรมการส่วนใหญ่คาดว่าจะมีการขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ หุ้นสหรัฐฯ ปรับลงรับข่าว — Dow -1.21% (-631.21 จุด) สู่ 51,461.90, S&P 500 -0.45% สู่ 7,551.81, Nasdaq ทรงตัวใกล้เคียงเดิมที่ 25,978.42 — และผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% ราคาน้ำมันพุ่งขึ้นจากความกังวลด้านอุปทานในตะวันออกกลางรอบใหม่ (WTI +4.2% สู่ $104.25, เบรนท์ +4.14% สู่ $108.94) หลังกลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันของซาอุดีอาระเบียถูกปิด ขณะทองคำลดลง 1.2% สู่ $4,240.10 ตลาดเอเชียและยุโรปซึ่งปิดตลาดก่อนการประกาศหลายชั่วโมง เทรดตามการคาดการณ์เท่านั้น: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80% ดัชนี SET ไทยลดลง 1.01% สู่ 1,562.73 จากปัจจัยภายในประเทศ (การลดราคาดีเซลและโครงการกระตุ้นท่องเที่ยวที่ถูกเลื่อนออกไป) ซึ่งไม่เกี่ยวกับเฟด"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 17 Sep",th:"พฤหัสฯ 17 ก.ย."}, imp:"h", t:{en:"Wall Street rebounds as the 10-year yield slips below 5% and oil eases",th:"วอลล์สตรีทดีดตัว ผลตอบแทนพันธบัตร 10 ปีหลุด 5% น้ำมันย่อตัว"}, d:{en:"US stocks bounced back from Wednesday's Fed-hike selloff — S&P 500 +0.59% to 7,596.36, Dow +0.61% (+316.14 pts) to 51,778.04, Nasdaq +1.60% to 26,395.18 — as the 10-year Treasury yield eased to ~4.94% and oil fell on signs the Iran war's supply disruptions could moderate (WTI -2.2% to $101.91, Brent -3.8% to $104.82). Gold rebounded 1.4% to $4,301.40. Trump escalated pressure on Chair Kevin Warsh, threatening to halt trade with surplus countries unless the Fed cuts rates, but the Fed's own statement blamed tariffs, the Iran war and AI capex for elevated inflation. Europe and Japan got their first full session to price in the Fed's hike — DAX +0.53% to 25,538, Nikkei +0.33% to 64,136.25 — while Hong Kong's Hang Seng slipped 0.44% to 24,604.29 and Shanghai eased 0.41% to 3,875.60. Thailand's SET jumped 1.32% to 1,583.34 on turnover of THB 62.46bn.",th:"หุ้นสหรัฐฯ ดีดตัวขึ้นจากแรงเทขายรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ — S&P 500 +0.59% สู่ 7,596.36, Dow +0.61% (+316.14 จุด) สู่ 51,778.04, Nasdaq +1.60% สู่ 26,395.18 — ขณะผลตอบแทนพันธบัตร 10 ปีย่อตัวลงสู่ราว 4.94% และราคาน้ำมันลดลงจากสัญญาณว่าปัญหาอุปทานจากสงครามอิหร่านอาจบรรเทาลง (WTI -2.2% สู่ $101.91, เบรนท์ -3.8% สู่ $104.82) ทองคำดีดตัวขึ้น 1.4% สู่ $4,301.40 ทรัมป์ทวีความรุนแรงของแรงกดดันต่อประธานเควิน วอร์ช โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลหากเฟดไม่ลดดอกเบี้ย แต่แถลงการณ์ของเฟดเองโทษภาษีศุลกากร สงครามอิหร่าน และการลงทุนด้าน AI ว่าเป็นสาเหตุของเงินเฟ้อสูง ยุโรปและญี่ปุ่นได้เซสชันเต็มรูปแบบครั้งแรกในการสะท้อนการขึ้นดอกเบี้ยของเฟดในราคา — DAX +0.53% สู่ 25,538, Nikkei +0.33% สู่ 64,136.25 — ขณะ Hang Seng ฮ่องกงลดลง 0.44% สู่ 24,604.29 และ Shanghai ลดลง 0.41% สู่ 3,875.60 ดัชนี SET ไทยพุ่งขึ้น 1.32% สู่ 1,583.34 มูลค่าการซื้อขายราว 6.246 หมื่นล้านบาท"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 18 Sep",th:"ศุกร์ 18 ก.ย."}, imp:"h", t:{en:"Bank of Japan hikes to 1.25%; Asia rallies, DAX tumbles, Wall Street ends a third losing week little changed",th:"BOJ ขึ้นดอกเบี้ยสู่ 1.25% เอเชียดีดตัว DAX ร่วง วอลล์สตรีทปิดสัปดาห์ที่ปรับลงเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเล็กน้อย"}, d:{en:"The BOJ raised its policy rate a quarter point to 1.25% — highest since 1995 — in a widely expected move that still carried two dovish dissents. Japan's Nikkei jumped 1.38% to 65,018.95, Hong Kong's Hang Seng added 0.60% to 24,750.78 and Shanghai rose 0.94% to 3,911.87, while Germany's DAX tumbled 1.65% to 25,308.88 on an auto-led selloff (Volkswagen -5.97%). US stocks closed a third straight losing week little changed — Dow -0.18% to 51,682.64, S&P 500 +0.17% to 7,650.50, Nasdaq +0.39% to 26,522.55 — as the 10-year Treasury yield backed up toward 5% again (~5.01%). Oil held steady (WTI ~$100.90, Brent ~$104.33) and gold extended its rally to $4,368.60. Thailand's SET was flat at 1,584.15 (+0.05%). Markets are closed for the weekend; next up is Monday's Asia and Europe open.",th:"BOJ ขึ้นอัตราดอกเบี้ยนโยบาย 0.25% สู่ 1.25% — สูงสุดนับตั้งแต่ปี 1995 — เป็นการตัดสินใจที่ตลาดคาดการณ์ไว้แล้ว แต่ยังมีกรรมการ 2 เสียงคัดค้านเชิงผ่อนคลาย ดัชนี Nikkei ญี่ปุ่นพุ่งขึ้น 1.38% สู่ 65,018.95 ดัชนี Hang Seng ฮ่องกงเพิ่มขึ้น 0.60% สู่ 24,750.78 และ Shanghai เพิ่มขึ้น 0.94% สู่ 3,911.87 ขณะดัชนี DAX เยอรมนีร่วง 1.65% สู่ 25,308.88 จากแรงเทขายกลุ่มยานยนต์ (Volkswagen -5.97%) หุ้นสหรัฐฯ ปิดสัปดาห์ที่ปรับลงติดต่อกันเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเพียงเล็กน้อย — Dow -0.18% สู่ 51,682.64, S&P 500 +0.17% สู่ 7,650.50, Nasdaq +0.39% สู่ 26,522.55 — ขณะผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นใกล้ 5% อีกครั้ง (ราว 5.01%) ราคาน้ำมันทรงตัว (WTI ราว $100.90, เบรนท์ราว $104.33) และทองคำขยายการปรับขึ้นต่อเนื่องสู่ $4,368.60 ดัชนี SET ไทยทรงตัวที่ 1,584.15 (+0.05%) ตลาดปิดทำการช่วงสุดสัปดาห์ ก้าวต่อไปคือการเปิดตลาดเอเชียและยุโรปวันจันทร์"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 21 Sep",th:"จันทร์ 21 ก.ย."}, imp:"h", t:{en:"Nasdaq surges 2.26% to a record close as chip stocks rally, oil tumbles and Thailand's SET jumps on a Fitch upgrade",th:"Nasdaq พุ่งขึ้น 2.26% ปิดสูงสุดเป็นประวัติการณ์ หุ้นกลุ่มชิปพุ่งขึ้น น้ำมันร่วง และ SET ไทยพุ่งขึ้นรับข่าว Fitch"}, d:{en:"US stocks posted their best session in weeks — S&P 500 +1.49% to 7,764.70, Nasdaq +2.26% to a record 27,122.09, Dow +0.71% to 52,048.83 — led by chipmakers Intel (+~12%) and AMD (+~10%, briefly a $1 trillion company), as WTI oil tumbled 4.5% to $95.78 and the 10-year Treasury yield eased to 4.951%. Germany's DAX rallied 1.07% to 25,575 and Tokyo stayed closed for a holiday, while Shanghai rose 0.97% to 3,949.91 and Hong Kong's Hang Seng added 1.18% to 25,042.71 on tech and health-tech buying. Thailand's SET jumped 0.88% to 1,598.03 after Fitch Ratings upgraded the country's credit outlook to Stable from Negative. Futures now price the Fed's Oct 28 meeting close to a coin-flip on another hike.",th:"หุ้นสหรัฐฯ มีเซสชันที่ดีที่สุดในรอบหลายสัปดาห์ — S&P 500 +1.49% สู่ 7,764.70, Nasdaq +2.26% สู่ระดับสูงสุดเป็นประวัติการณ์ที่ 27,122.09, Dow +0.71% สู่ 52,048.83 — นำโดยหุ้นกลุ่มชิป Intel (+ราว 12%) และ AMD (+ราว 10% แตะมูลค่า 1 ล้านล้านดอลลาร์ชั่วคราว) ขณะน้ำมัน WTI ร่วง 4.5% สู่ $95.78 และผลตอบแทนพันธบัตร 10 ปีย่อตัวสู่ 4.951% ดัชนี DAX เยอรมนีพุ่งขึ้น 1.07% สู่ 25,575 และตลาดโตเกียวปิดทำการวันหยุด ขณะ Shanghai เพิ่มขึ้น 0.97% สู่ 3,949.91 และ Hang Seng ฮ่องกงเพิ่มขึ้น 1.18% สู่ 25,042.71 จากแรงซื้อหุ้นกลุ่มเทคและเฮลท์เทค ดัชนี SET ไทยพุ่งขึ้น 0.88% สู่ 1,598.03 หลัง Fitch Ratings ปรับมุมมองเครดิตของประเทศเป็นคงที่จากลบ ตลาดล่วงหน้าเริ่มให้ราคาการประชุมเฟดวันที่ 28 ต.ค. ใกล้เคียง 50-50 สำหรับการขึ้นดอกเบี้ยอีกครั้ง"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 22 Sep",th:"อังคาร 22 ก.ย."}, imp:"h", t:{en:"Nasdaq's second straight record on Meta's Muse AI agent; Dow slips, oil breaks below $100 as Trump issues UN ultimatum to Iran",th:"Nasdaq ปิดสูงสุดเป็นประวัติการณ์ติดต่อกันครั้งที่สอง จาก Muse ของ Meta — Dow อ่อนตัว น้ำมันหลุด $100 ขณะทรัมป์ยื่นคำขาดต่ออิหร่านที่ยูเอ็น"}, d:{en:"US stocks were mixed — Nasdaq +0.50% to a record 27,244.28 on a strong reception for Meta's new Muse AI agent, S&P 500 flat at 7,761 (-0.04%), Dow -0.36% (-185.14 pts) to 51,863.69 on Cisco (-4.50%), JPMorgan (-3.35%) and American Express (-2.62%) weakness. Oil extended its slide to a fifth session — Brent -1% to $99.25, its first close below $100 in two weeks — even as Trump told the UN he faces a \"big decision\" on Iran and doesn't expect a deal before the midterms. The 10-year Treasury yield held at 4.959% as CME FedWatch pushed October 28 hike odds to ~60%, and gold eased on a firmer dollar. Germany's DAX was flat at 25,578.85, Tokyo stayed shut for a rare five-day Silver Week holiday (Nikkei still 65,018.95), Shanghai edged up 0.06% to 3,952.13 and Hong Kong's Hang Seng added 0.18% to 25,087.75 ahead of Thursday's Trump-Xi summit. Thailand's SET rose 0.40% to 1,604.44 on turnover of THB 67.05bn.",th:"หุ้นสหรัฐฯ เคลื่อนไหวคละกัน — Nasdaq +0.50% ปิดสูงสุดเป็นประวัติการณ์ที่ 27,244.28 จากการตอบรับที่ดีต่อ Muse ตัวช่วย AI ตัวใหม่ของ Meta, S&P 500 ทรงตัวที่ 7,761 (-0.04%), Dow -0.36% (-185.14 จุด) สู่ 51,863.69 จากความอ่อนแอของ Cisco (-4.50%), JPMorgan (-3.35%) และ American Express (-2.62%) ราคาน้ำมันร่วงต่อเนื่องเป็นเซสชันที่ห้า — เบรนท์ -1% สู่ $99.25 ต่ำกว่าระดับ $100 เป็นครั้งแรกในรอบสองสัปดาห์ — แม้ทรัมป์จะกล่าวต่อยูเอ็นว่าเขาต้อง \"ตัดสินใจครั้งใหญ่\" เรื่องอิหร่าน และไม่คาดว่าจะมีข้อตกลงก่อนการเลือกตั้งกลางเทอม ผลตอบแทนพันธบัตร 10 ปียืนที่ 4.959% ขณะ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมสู่ราว 60% และทองคำอ่อนตัวลงจากดอลลาร์ที่แข็งค่าขึ้น ดัชนี DAX เยอรมนีทรงตัวที่ 25,578.85 ตลาดโตเกียวยังปิดทำการเนื่องในวันหยุด Silver Week ห้าวันที่หาได้ยาก (Nikkei ยังอยู่ที่ 65,018.95) ดัชนี Shanghai ขยับขึ้น 0.06% สู่ 3,952.13 และ Hang Seng ฮ่องกงเพิ่มขึ้น 0.18% สู่ 25,087.75 ก่อนการประชุมสุดยอดทรัมป์-สีวันพฤหัสบดี ดัชนี SET ไทยเพิ่มขึ้น 0.40% สู่ 1,604.44 มูลค่าการซื้อขายราว 6.705 หมื่นล้านบาท"}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
