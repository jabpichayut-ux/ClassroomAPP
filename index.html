<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">

          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Dow Plunges 1,101 Points Below 50,000 as S&P 500 Falls a Sixth Day — Anthropic Jumps 17% in Record Debut but AI Stocks Sink", th:"Dow ดิ่ง 1,101 จุด หลุด 50,000 S&P 500 ลดลงวันที่ 6 ติด — Anthropic ขึ้น 17% ในวันเปิดตลาดสถิติโลก แต่หุ้น AI ร่วงทั้งกลุ่ม"},
    heroDeck:{en:`Thursday turned into the worst day of the selloff so far. Stocks opened higher — the Nasdaq was up as much as 2% and Nvidia up 4.7% — but the gains collapsed by lunchtime as worries about a Fed that keeps hiking, rich AI valuations and money being pulled out of other tech names to buy Anthropic took over. The Dow fell 1,101.11 points (−2.19%) to 49,097.06, its first close below 50,000 since June; the S&P 500 lost 2.02% to 7,175.83, a sixth straight loss and its longest losing run since 2024; and the Nasdaq dropped 2.25% to 23,879.20. Nvidia flipped to a 2.7% loss. Anthropic (ANT) opened at $111.50 against its $83 IPO price and closed at $97.17, up 17.1%, valuing it at roughly $1.3–1.8 trillion depending on the share count used. Data added to the gloom: the Philadelphia Fed factory index slumped to 6.3 from 20.9, while jobless claims stayed low at 203,000 — not enough weakness to stop the Fed. Treasury yields edged up (10-year ~5.08%, 2-year ~4.82%), gold stayed near $3,700, its lowest since September 2025, and oil was flat (WTI $83.21, Brent $91.98) as Hormuz tanker attacks offset surplus fears. Europe fell for a fourth day (DAX −1.06% to 25,463.81), the Hang Seng dropped 1.95% and Shanghai 0.28%, but the Nikkei rose 0.71%. The SET recovered from a 14-point morning drop to close almost flat, up 0.63 points at 1,472.64.`, th:`วันพฤหัสฯ กลายเป็นวันที่หนักที่สุดของรอบการเทขายนี้ หุ้นเปิดบวก — Nasdaq เคยขึ้นถึง 2% และ Nvidia ขึ้น 4.7% — แต่กำไรหายหมดภายในช่วงเที่ยง เพราะความกังวลว่าเฟดจะขึ้นดอกเบี้ยต่อ มูลค่าหุ้น AI ที่แพง และเงินที่ถูกดึงออกจากหุ้นเทคอื่นเพื่อไปซื้อ Anthropic Dow ลดลง 1,101.11 จุด (−2.19%) สู่ 49,097.06 ปิดต่ำกว่า 50,000 ครั้งแรกตั้งแต่เดือนมิถุนายน S&P 500 ลดลง 2.02% สู่ 7,175.83 ลดลงวันที่ 6 ติด ยาวที่สุดตั้งแต่ปี 2024 และ Nasdaq ลดลง 2.25% สู่ 23,879.20 Nvidia พลิกเป็นลดลง 2.7% Anthropic (ANT) เปิดที่ $111.50 เทียบราคา IPO $83 และปิดที่ $97.17 เพิ่มขึ้น 17.1% มูลค่าบริษัทราว $1.3–1.8 ล้านล้าน ขึ้นกับวิธีนับจำนวนหุ้น ตัวเลขเศรษฐกิจเพิ่มความกังวล: ดัชนีภาคการผลิตของเฟดฟิลาเดลเฟียลดลงแรงสู่ 6.3 จาก 20.9 ขณะที่ผู้ขอรับสวัสดิการว่างงานยังต่ำที่ 203,000 ราย — ยังไม่อ่อนพอจะหยุดเฟด ผลตอบแทนบอนด์สหรัฐฯ ขยับขึ้นเล็กน้อย (10 ปีราว 5.08% 2 ปีราว 4.82%) ทองคำทรงตัวใกล้ $3,700 ต่ำสุดตั้งแต่กันยายน 2025 และน้ำมันทรงตัว (WTI $83.21 Brent $91.98) เพราะการโจมตีเรือบรรทุกน้ำมันในช่องแคบฮอร์มุซหักล้างความกังวลเรื่องอุปทานล้น ยุโรปลดลงวันที่ 4 ติด (DAX −1.06% สู่ 25,463.81) Hang Seng ลดลง 1.95% และเซี่ยงไฮ้ลดลง 0.28% แต่ Nikkei ขึ้น 0.71% SET ฟื้นจากที่ลดลง 14 จุดช่วงเช้า มาปิดเกือบทรงตัว เพิ่มขึ้น 0.63 จุด ที่ 1,472.64`},

    dbNext:{en:"Next", th:"ถัดไป"}, dbNextVal:{en:"Watch whether the S&P 500 can stop a six-day losing run on Friday, how Anthropic (ANT) trades on day two after fading from $111.50 to $97.17, any Fed speakers pushing the December hike toward 50 bp, and the final text of the US chip-export rule covering Thailand.", th:"จับตาว่า S&P 500 จะหยุดการลดลง 6 วันติดได้ในวันศุกร์หรือไม่ Anthropic (ANT) จะซื้อขายอย่างไรในวันที่ 2 หลังย่อจาก $111.50 มาที่ $97.17 กรรมการเฟดคนใดผลักให้การขึ้นดอกเบี้ยเดือนธันวาคมเป็น 0.50% และรายละเอียดฉบับสุดท้ายของกฎคุมส่งออกชิปสหรัฐฯ ที่ครอบคลุมไทย"},

    leadtxt:{en:`<b>The selloff got sharper: a Fed that keeps hiking plus doubts about AI prices pushed US stocks down about 2% on Thursday.</b> The <b>Dow fell 1,101 points (−2.19%) to 49,097</b>, its first close below 50,000 since June, the <b>S&P 500 lost 2.02%</b> for a <b>sixth straight loss</b>, and the <b>Nasdaq dropped 2.25%</b>. <b>Nvidia reversed a 4.7% gain into a 2.7% loss.</b> <b>Anthropic rose 17% on its first day to $97.17</b> but faded from a $111.50 open, and money moving into it came partly out of other AI names. <b>Yields edged up (10-year ~5.08%)</b>, <b>gold stayed near $3,700</b>, a 14-month low, and <b>oil was flat (WTI $83.21)</b>. In Thailand the <b>SET held at 1,472.64 (+0.04%)</b> after a 14-point morning drop, with foreigners selling about THB 2.5bn. <b>For you:</b> short-dated bond income stays the anchor, stay patient on tech until the selling calms, and keep gold small while the dollar and yields stay high.`, th:`<b>แรงขายหนักขึ้น: เฟดที่ยังขึ้นดอกเบี้ยต่อ บวกกับความสงสัยเรื่องราคาหุ้น AI กดหุ้นสหรัฐฯ ลงราว 2% ในวันพฤหัสฯ</b> <b>Dow ลดลง 1,101 จุด (−2.19%) สู่ 49,097</b> ปิดต่ำกว่า 50,000 ครั้งแรกตั้งแต่เดือนมิถุนายน <b>S&P 500 ลดลง 2.02%</b> เป็น <b>วันที่ 6 ติด</b> และ <b>Nasdaq ลดลง 2.25%</b> <b>Nvidia พลิกจากบวก 4.7% เป็นลบ 2.7%</b> <b>Anthropic ขึ้น 17% ในวันแรกสู่ $97.17</b> แต่ย่อจากราคาเปิด $111.50 และเงินที่ไหลเข้าส่วนหนึ่งมาจากการขายหุ้น AI ตัวอื่น <b>ผลตอบแทนบอนด์ขยับขึ้น (10 ปีราว 5.08%)</b> <b>ทองคำทรงตัวใกล้ $3,700</b> ต่ำสุดในรอบ 14 เดือน และ <b>น้ำมันทรงตัว (WTI $83.21)</b> ในไทย <b>SET ยืนที่ 1,472.64 (+0.04%)</b> หลังลดลง 14 จุดช่วงเช้า โดยต่างชาติขายสุทธิราว 2,500 ล้านบาท <b>สำหรับคุณ:</b> รายได้จากบอนด์ระยะสั้นยังเป็นหลัก รอให้แรงขายหุ้นเทคสงบก่อน และถือทองคำสัดส่วนเล็กขณะที่ดอลลาร์และผลตอบแทนบอนด์ยังสูง`},

    watchnote:{en:`Thursday was the worst day of the slide: the Dow fell 1,101 points below 50,000, the S&P 500 dropped 2.02% for a sixth straight loss and the Nasdaq 2.25%, as early gains in Nvidia and the Nasdaq vanished. Anthropic closed its debut up 17% at $97.17. The three things that matter most now: whether US stocks can find a floor, how hard Fed speakers lean toward a December hike, and the US chip-export rule that reaches Thailand.`,
      th:`วันพฤหัสฯ เป็นวันที่หนักที่สุดของรอบนี้: Dow ลดลง 1,101 จุด หลุด 50,000 S&P 500 ลดลง 2.02% เป็นวันที่ 6 ติด และ Nasdaq ลดลง 2.25% หลังกำไรช่วงเช้าของ Nvidia และ Nasdaq หายไป Anthropic ปิดวันแรกเพิ่มขึ้น 17% ที่ $97.17 สามเรื่องที่สำคัญที่สุดตอนนี้: หุ้นสหรัฐฯ จะหาจุดต่ำสุดได้หรือไม่ กรรมการเฟดจะเอนไปทางขึ้นดอกเบี้ยเดือนธันวาคมแรงแค่ไหน และกฎคุมส่งออกชิปสหรัฐฯ ที่ครอบคลุมไทย`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป เอเชีย และไทย วันพฤหัสฯ ที่ 19 พ.ย. ราคาของ Anthropic เป็นราคาเปิดและปิดวันแรกใน Nasdaq ผลตอบแทนบอนด์สหรัฐฯ และทองคำเป็นค่าประมาณ (ยังไม่มีราคาปิดที่ยืนยันได้ แต่ละแหล่งต่างกันเล็กน้อย) และราคาปิด DAX ต่างกันเล็กน้อยตามแหล่งข้อมูล ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>US stocks fell about 2% Thursday: the S&P 500 lost 2.02% to 7,175.83 (a sixth straight loss), the Dow 2.19% (−1,101.11 pts) to 49,097.06 and the Nasdaq 2.25% to 23,879.20.</b> Early gains — Nasdaq +2%, Nvidia +4.7% — reversed by midday; Anthropic closed its debut up 17%.`, th:`<b>หุ้นสหรัฐฯ ลดลงราว 2% วันพฤหัสฯ: S&P 500 ลดลง 2.02% สู่ 7,175.83 (ลดลงวันที่ 6 ติด) Dow ลดลง 2.19% (−1,101.11 จุด) สู่ 49,097.06 และ Nasdaq ลดลง 2.25% สู่ 23,879.20</b> กำไรช่วงเช้า — Nasdaq +2% Nvidia +4.7% — กลับตัวลงภายในช่วงเที่ยง Anthropic ปิดวันแรกเพิ่มขึ้น 17%`},
      why:{en:`A reversal this sharp after a strong open is a sign that investors are using rallies to sell. Three things are combining: a Fed that markets now expect to hike in December, AI valuations being questioned even after Nvidia's beat, and the Anthropic IPO pulling cash out of other tech holdings. Weak factory data (Philly Fed 6.3) did not help, because with jobless claims still low it does not stop the Fed. The Dow is now a step from a 10% correction, which the Nasdaq is already in.`, th:`การกลับตัวแรงขนาดนี้หลังเปิดบวกแสดงว่านักลงทุนใช้จังหวะที่หุ้นขึ้นเพื่อขาย มีสามเรื่องรวมกัน: ตลาดคาดว่าเฟดจะขึ้นดอกเบี้ยในเดือนธันวาคม มูลค่าหุ้น AI ถูกตั้งคำถามแม้ Nvidia งบดี และ IPO ของ Anthropic ดึงเงินออกจากหุ้นเทคอื่น ตัวเลขภาคการผลิตที่อ่อนแอ (Philly Fed 6.3) ไม่ช่วย เพราะผู้ขอรับสวัสดิการว่างงานยังต่ำ จึงไม่หยุดเฟด ตอนนี้ Dow ใกล้เข้าภาวะปรับฐาน 10% ซึ่ง Nasdaq เข้าไปแล้ว`},
      full:{en:`US stocks fell sharply on Thursday, November 19. The Dow Jones Industrial Average lost 1,101.11 points (−2.19%) to 49,097.06, ending below 50,000 for the first time since June; the S&P 500 fell 147.80 points (−2.02%) to 7,175.83, its sixth consecutive decline and longest losing streak since 2024; and the Nasdaq Composite dropped 550.69 points (−2.25%) to 23,879.20 after rising as much as 2% early, according to CNBC and Motley Fool. Nvidia erased an early 4.7% gain and closed about 2.7% lower. Anthropic began trading on Nasdaq under the ticker ANT, opening at $111.50 versus its $83 IPO price and closing at $97.17, up 17.1%, after raising about $81.3bn in the largest IPO on record. The Philadelphia Fed manufacturing index fell to 6.3 in November from 20.9, while initial jobless claims were 203,000. Futures continue to price about a 95% chance of a quarter-point Fed hike in December.`, th:`หุ้นสหรัฐฯ ลดลงแรงวันพฤหัสฯ ที่ 19 พ.ย. Dow Jones ลดลง 1,101.11 จุด (−2.19%) สู่ 49,097.06 ปิดต่ำกว่า 50,000 ครั้งแรกตั้งแต่เดือนมิถุนายน S&P 500 ลดลง 147.80 จุด (−2.02%) สู่ 7,175.83 ลดลงวันที่ 6 ติด ยาวที่สุดตั้งแต่ปี 2024 และ Nasdaq ลดลง 550.69 จุด (−2.25%) สู่ 23,879.20 หลังเคยขึ้นถึง 2% ช่วงเช้า ตามรายงานของ CNBC และ Motley Fool Nvidia ลบกำไร 4.7% ช่วงเช้าและปิดลดลงราว 2.7% Anthropic เริ่มซื้อขายใน Nasdaq ชื่อย่อ ANT เปิดที่ $111.50 เทียบราคา IPO $83 และปิดที่ $97.17 เพิ่มขึ้น 17.1% หลังระดมทุนราว $81.3 พันล้าน ซึ่งเป็น IPO ใหญ่ที่สุดเป็นประวัติการณ์ ดัชนีภาคการผลิตของเฟดฟิลาเดลเฟียลดลงสู่ 6.3 ในเดือนพฤศจิกายน จาก 20.9 ขณะที่ผู้ขอรับสวัสดิการว่างงานครั้งแรกอยู่ที่ 203,000 ราย ตลาดฟิวเจอร์สยังให้โอกาสราว 95% ที่เฟดจะขึ้นดอกเบี้ย 0.25% ในเดือนธันวาคม`},
      sources:[{l:"CNBC — Stock market news for Nov. 19, 2026",u:"https://www.cnbc.com/2026/11/18/stock-market-today-live-updates.html"},{l:"Motley Fool — Dow plunges 1,100 points as the S&P 500 suffers its 6th straight day of losses",u:"https://www.fool.com/coverage/stock-market-today/2026/11/19/stock-market-today-nov-19-dow-plunges-1-100-points-as-the-s-and-p-500-suffers-its-6th-straight-day-of-losses/"},{l:"Benzinga — Anthropic stock opens at $111.50 in record-breaking Nasdaq debut",u:"https://www.benzinga.com/markets/tech/26/11/63442044/anthropic-stock-opens-at-111-50-in-record-breaking-nasdaq-debut"},{l:"CNBC — Anthropic IPO live updates: ANT stock price and Nasdaq debut",u:"https://www.cnbc.com/2026/11/19/anthropic-ipo-ant-live-updates.html"}]},

      txt:{en:`<b>Germany's DAX fell 1.06% to 25,463.81 Thursday,</b> a fourth straight loss, after opening 0.8% higher; SAP (−3.3%), Fresenius Medical Care (−4.6%) and Rheinmetall (−2.6%) led the decline. London's FTSE 100 lost 0.93%.`, th:`<b>ดัชนี DAX เยอรมนีลดลง 1.06% สู่ 25,463.81 วันพฤหัสฯ</b> ลดลงวันที่ 4 ติด หลังเปิดบวก 0.8% นำลงโดย SAP (−3.3%) Fresenius Medical Care (−4.6%) และ Rheinmetall (−2.6%) FTSE 100 ของลอนดอนลดลง 0.93%`},
      why:{en:`Europe followed the same pattern as Wall Street: an early bounce sold off. SAP's drop shows the AI-valuation worry reaching European software, and a dollar near a 19-month high and a hawkish Fed keep pressure on the region. The DAX is now about 4–5% below its record, so it is behaving less like a safe alternative to the US than earlier in the year.`, th:`ยุโรปเคลื่อนไหวแบบเดียวกับวอลล์สตรีท: รีบาวด์ช่วงเช้าแล้วถูกขาย การลดลงของ SAP แสดงว่าความกังวลเรื่องมูลค่าหุ้น AI ลามมาถึงหุ้นซอฟต์แวร์ยุโรป และดอลลาร์ที่แข็งใกล้สุดในรอบ 19 เดือนกับเฟดที่แข็งกร้าวยังกดดันภูมิภาคนี้ DAX ต่ำกว่าระดับสูงสุดราว 4–5% จึงไม่ได้เป็นทางเลือกที่ปลอดภัยกว่าสหรัฐฯ เหมือนช่วงต้นปี`},
      full:{en:`Germany's DAX closed 1.06% (−272.43 points) lower at 25,463.81 on Thursday, November 19, according to Trading Economics and Investing.com historical data (one Investing.com close report showed −0.92%). The index had opened about 0.8% higher. Fresenius Medical Care (−4.56%), SAP (−3.32%) and Rheinmetall (−2.60%) were among the biggest decliners. Elsewhere, the FTSE 100 fell 0.93% to 10,452.68, Spain's IBEX 35 0.97% and Italy's FTSE MIB 0.46%.`, th:`ดัชนี DAX เยอรมนีปิดลดลง 1.06% (−272.43 จุด) สู่ 25,463.81 วันพฤหัสฯ ที่ 19 พ.ย. ตามข้อมูลของ Trading Economics และข้อมูลย้อนหลังของ Investing.com (รายงานปิดตลาดอีกฉบับของ Investing.com ระบุ −0.92%) ดัชนีเปิดบวกราว 0.8% หุ้นที่ลดลงมากได้แก่ Fresenius Medical Care (−4.56%) SAP (−3.32%) และ Rheinmetall (−2.60%) ตลาดอื่น FTSE 100 ลดลง 0.93% สู่ 10,452.68 IBEX 35 ของสเปนลดลง 0.97% และ FTSE MIB ของอิตาลีลดลง 0.46%`},
      sources:[{l:"Trading Economics — Germany stock market (DAX)",u:"https://tradingeconomics.com/germany/stock-market"},{l:"investingLive — Americas FX news wrap 19 Nov: inflation worries sink stocks",u:"https://investinglive.com/news/investinglive-americas-fx-news-wrap-19-nov-inflation-worries-sink-stocks/"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"59,444.21", chg:0.71, series:[59024.28,59444.21],
      txt:{en:`<b>Tokyo's Nikkei 225 rose 0.71% (+419.93 pts) to 59,444.21 Thursday,</b> a second day of gains, before Wall Street's late-day slump.`, th:`<b>ดัชนี Nikkei 225 ญี่ปุ่นขึ้น 0.71% (+419.93 จุด) สู่ 59,444.21 วันพฤหัสฯ</b> ขึ้นวันที่ 2 ติด ก่อนที่วอลล์สตรีทจะร่วงช่วงท้ายวัน`},
      why:{en:`Japan closed before the US reversal, so Friday is likely to give back some of this gain as chip stocks track Nvidia's 2.7% drop. A weak yen helps exporters, but Japan's Q3 GDP contraction and the Fed's hiking bias limit how far the rally can run.`, th:`ญี่ปุ่นปิดตลาดก่อนที่สหรัฐฯ จะกลับตัวลง วันศุกร์จึงอาจคืนกำไรบางส่วน เพราะหุ้นชิปจะเคลื่อนตาม Nvidia ที่ลดลง 2.7% เงินเยนที่อ่อนช่วยผู้ส่งออก แต่ GDP ไตรมาส 3 ที่หดตัวและเฟดที่เอนไปทางขึ้นดอกเบี้ยจำกัดแรงขึ้น`},
      full:{en:`The Nikkei 225 closed at 59,444.21 on Thursday, November 19, up 419.93 points (+0.71%) from Wednesday's 59,024.28, according to market recaps. Asian trading ended before the US session, in which the Nasdaq reversed from a 2% gain to a 2.25% loss.`, th:`Nikkei 225 ปิดที่ 59,444.21 วันพฤหัสฯ ที่ 19 พ.ย. เพิ่มขึ้น 419.93 จุด (+0.71%) จาก 59,024.28 ของวันพุธ ตามรายงานสรุปตลาด ตลาดเอเชียปิดก่อนการซื้อขายในสหรัฐฯ ซึ่ง Nasdaq กลับตัวจากบวก 2% เป็นลบ 2.25%`},
      sources:[{l:"Saxo — Asia market quick take, 19 November 2026",u:"https://www.home.saxo/en-sg/content/articles/macro/asia-market-quick-take--19-november-2026-19112026"},{l:"Armenpress — Asian stocks down, 19/11/26",u:"https://armenpress.am/en/article/1266148"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"22,841.62", chg:-1.95, series:[23294.75,22841.62],
      txt:{en:`<b>Hong Kong's Hang Seng fell 1.95% (−453.13 pts) to 22,841.62 Thursday,</b> a third straight loss; the Shanghai Composite slipped 0.28% to 3,577.62.`, th:`<b>ดัชนี Hang Seng ฮ่องกงลดลง 1.95% (−453.13 จุด) สู่ 22,841.62 วันพฤหัสฯ</b> ลดลงวันที่ 3 ติด ส่วน Shanghai Composite ลดลง 0.28% สู่ 3,577.62`},
      why:{en:`Hong Kong is being squeezed from two sides: its interest rates follow the Fed, which is set to hike, and its big tech names gain nothing from Nvidia's China-free guidance or from US chip rules aimed at Chinese firms. Mainland shares are holding up better thanks to local buying, but remain near their lows of the year.`, th:`ฮ่องกงถูกกดดันสองทาง: ดอกเบี้ยเคลื่อนตามเฟดที่กำลังจะขึ้นดอกเบี้ย และหุ้นเทคใหญ่ไม่ได้ประโยชน์จากคาดการณ์ของ Nvidia ที่ไม่รวมจีน หรือกฎคุมชิปของสหรัฐฯ ที่มุ่งเป้าบริษัทจีน หุ้นจีนแผ่นดินใหญ่ทรงตัวได้ดีกว่าจากแรงซื้อในประเทศ แต่ยังอยู่ใกล้ระดับต่ำสุดของปี`},
      full:{en:`Hong Kong's Hang Seng Index fell 453.13 points (−1.95%) on Thursday, November 19, to close at 22,841.62, its third consecutive decline, according to market data. The Shanghai Composite closed 0.28% lower at 3,577.62.`, th:`ดัชนี Hang Seng ฮ่องกงลดลง 453.13 จุด (−1.95%) วันพฤหัสฯ ที่ 19 พ.ย. ปิดที่ 22,841.62 ลดลงวันที่ 3 ติด ตามข้อมูลตลาด Shanghai Composite ปิดลดลง 0.28% ที่ 3,577.62`},
      sources:[{l:"Trading Economics — Hong Kong stock market (HK50)",u:"https://tradingeconomics.com/hong-kong/stock-market"},{l:"Trading Economics — China Shanghai Composite",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,472.64", chg:0.04, series:[1472.01,1472.64],
      txt:{en:`<b>SET Index edged up 0.63 pts (+0.04%) to 1,472.64 Thursday</b> on turnover of THB 64.92bn, recovering from a 14-point morning drop (low 1,454.17); power, industrial-estate and electronics stocks helped, while BH fell 12 baht.`, th:`<b>ดัชนี SET เพิ่มขึ้น 0.63 จุด (+0.04%) สู่ 1,472.64 วันพฤหัสฯ</b> มูลค่าซื้อขาย 64,920.17 ล้านบาท ฟื้นจากที่ลดลง 14 จุดช่วงเช้า (ต่ำสุด 1,454.17) หุ้นโรงไฟฟ้า นิคมอุตสาหกรรม และอิเล็กทรอนิกส์ช่วยหนุน ขณะที่ BH ลดลง 12 บาท`},
      why:{en:`Retail investors bought the dip (about THB 3bn net), offsetting foreign selling of about THB 2.5bn, so the index held its ground. But Thailand closed before Wall Street's 2% drop, so Friday will likely open under pressure. The 1,455 area that held on Thursday is now the support to watch; a softer dollar or clarity on US chip rules is still needed for a real recovery.`, th:`นักลงทุนรายย่อยซื้อตอนหุ้นลง (ซื้อสุทธิราว 3,000 ล้านบาท) หักล้างแรงขายต่างชาติราว 2,500 ล้านบาท ดัชนีจึงทรงตัวได้ แต่ไทยปิดตลาดก่อนวอลล์สตรีทลดลง 2% วันศุกร์จึงน่าจะเปิดภายใต้แรงกดดัน บริเวณ 1,455 ที่ยืนได้เมื่อวันพฤหัสฯ คือแนวรับที่ต้องดู และยังต้องการดอลลาร์ที่อ่อนลงหรือความชัดเจนเรื่องกฎคุมชิปของสหรัฐฯ เพื่อฟื้นตัวจริง`},
      full:{en:`Thailand's SET Index rose 0.63 points (+0.04%) to close at 1,472.64 on Thursday, November 19, with trading value of THB 64.92 billion; the intraday range was 1,454.17–1,473.25, according to Thai Tabloid and Hoonsmart. The index fell about 14 points in the morning on worries about faster Fed hikes, then recovered in the afternoon as retail investors bought about THB 3 billion, Kaohoon reported. Power and industrial-estate stocks supported the market and electronics were bought back, while Bumrungrad Hospital (BH) fell 12 baht. Foreign investors were net sellers of about THB 2.5 billion (SET+mai), according to InfoQuest.`, th:`ดัชนี SET เพิ่มขึ้น 0.63 จุด (+0.04%) ปิดที่ 1,472.64 วันพฤหัสฯ ที่ 19 พ.ย. มูลค่าซื้อขาย 64,920.17 ล้านบาท กรอบระหว่างวัน 1,454.17–1,473.25 ตามข้อมูลของ Thai Tabloid และ Hoonsmart ช่วงเช้าดัชนีลดลงราว 14 จุดจากความกังวลว่าเฟดจะเร่งขึ้นดอกเบี้ย แล้วฟื้นช่วงบ่ายเมื่อนักลงทุนรายย่อยซื้อราว 3,000 ล้านบาท ตามรายงานของข่าวหุ้น หุ้นโรงไฟฟ้าและนิคมอุตสาหกรรมหนุนตลาด และมีแรงซื้อกลับหุ้นอิเล็กทรอนิกส์ ขณะที่ BH ลดลง 12 บาท ต่างชาติขายสุทธิราว 2,499.55 ล้านบาท (SET+mai) ตามรายงานของอินโฟเควสท์`},
      sources:[{l:"Hoonsmart — SET rebounds to close +0.63 pts; electronics bought, BH sold",u:"https://hoonsmart.com/archives/449445"},{l:"Kaohoon — Retail buys THB 3bn, SET closes up 0.63 pts",u:"https://www.kaohoon.com/summary/882800"},{l:"Thai Tabloid — SET trading summary, 19 November 2026",u:"https://thaitabloid.com/archives/332039"},{l:"InfoQuest — Foreign investors net sell THB 2,499.55m",u:"https://www.infoquest.co.th/2026/682769"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold stayed near $3,700/oz Thursday, around its lowest since September 2025,</b> as a strong dollar and Fed-hike bets outweighed weak US factory data. <b>Oil was flat: WTI settled at $83.21 (−5¢), its lowest since 26 Aug, and Brent at $91.98 (+3¢),</b> as tanker attacks near Hormuz offset fears of a global supply surplus.`, th:`<b>ทองคำทรงตัวใกล้ $3,700 ต่อออนซ์ วันพฤหัสฯ ราวระดับต่ำสุดตั้งแต่กันยายน 2025</b> เพราะดอลลาร์ที่แข็งและการคาดว่าเฟดจะขึ้นดอกเบี้ยมีน้ำหนักมากกว่าตัวเลขภาคการผลิตสหรัฐฯ ที่อ่อนแอ <b>น้ำมันทรงตัว: WTI ปิดที่ $83.21 (−5 เซนต์) ต่ำสุดตั้งแต่ 26 ส.ค. และ Brent ที่ $91.98 (+3 เซนต์)</b> เพราะการโจมตีเรือบรรทุกน้ำมันใกล้ช่องแคบฮอร์มุซหักล้างความกังวลเรื่องอุปทานล้นตลาด`},
     why:{en:`Gold is not acting as a safe haven in this selloff — it is trading with real interest rates, and each hawkish Fed signal pushes it lower. That can change quickly once the Fed signals a peak, so a small position still makes sense, but adding now means fighting the dollar. Oil near $83 is helpful for Thailand's import bill and for inflation, though Hormuz remains a live upside risk.`, th:`ทองคำไม่ได้ทำหน้าที่เป็นที่หลบภัยในรอบการเทขายนี้ — เคลื่อนไหวตามดอกเบี้ยที่แท้จริง และทุกสัญญาณแข็งกร้าวจากเฟดกดราคาลง สถานการณ์อาจเปลี่ยนเร็วเมื่อเฟดส่งสัญญาณว่าถึงจุดสูงสุด การถือสัดส่วนเล็กยังสมเหตุสมผล แต่การเพิ่มตอนนี้คือการสู้กับดอลลาร์ น้ำมันใกล้ $83 ช่วยค่านำเข้าของไทยและเงินเฟ้อ แม้ช่องแคบฮอร์มุซยังเป็นความเสี่ยงที่อาจดันราคาขึ้น`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Treasury yields edged up Thursday: the 10-year rose about 2 bp to ~5.08% and the 2-year to ~4.82%.</b> Futures still price ~95% odds of a 25 bp Fed hike in December; jobless claims stayed low at 203,000 even as the Philly Fed factory index slumped to 6.3.`, th:`<b>ผลตอบแทนบอนด์สหรัฐฯ ขยับขึ้นเล็กน้อยวันพฤหัสฯ: 10 ปีเพิ่มขึ้นราว 0.02% สู่ราว 5.08% และ 2 ปีสู่ราว 4.82%</b> ตลาดฟิวเจอร์สยังให้โอกาสราว 95% ที่เฟดจะขึ้นดอกเบี้ย 0.25% ในเดือนธันวาคม ผู้ขอรับสวัสดิการว่างงานยังต่ำที่ 203,000 ราย แม้ดัชนีภาคการผลิต Philly Fed ลดลงแรงสู่ 6.3`},
     why:{en:`Bonds did not rally even on a 2% stock drop — a sign that markets see the Fed, not growth, as the main risk. Short-dated bonds near 4.8% still offer the best balance of income and limited price risk. Long bonds will only work as a hedge once the Fed signals it is close to done; a 50 bp December hike remains the main surprise risk.`, th:`บอนด์ไม่ขึ้นราคาแม้หุ้นลดลง 2% — สัญญาณว่าตลาดมองว่าเฟด ไม่ใช่การเติบโต คือความเสี่ยงหลัก บอนด์ระยะสั้นที่ราว 4.8% ยังให้สมดุลที่ดีที่สุดระหว่างรายได้และความเสี่ยงด้านราคาที่จำกัด บอนด์ระยะยาวจะช่วยป้องกันความเสี่ยงได้ก็ต่อเมื่อเฟดส่งสัญญาณว่าใกล้จบรอบขึ้นดอกเบี้ย ความเสี่ยงหลักที่อาจทำให้ตลาดตกใจยังคือการขึ้น 0.50% ในเดือนธันวาคม`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Trade policy is reaching Asia through technology: reported US licence rules for advanced Nvidia chips going to data centres in Thailand, Malaysia, Singapore, Indonesia and others are still awaiting final text, and foreigners kept selling Thai shares (about THB 2.5bn Thursday). Nvidia's guidance assumes zero China data-centre sales. Democrats, who won both chambers on Nov 3, still plan a bill to roll back Section 301 tariffs.`, th:`นโยบายการค้ากระทบเอเชียผ่านเทคโนโลยี: กฎใบอนุญาตส่งออกชิป Nvidia ขั้นสูงไปยังศูนย์ข้อมูลในไทย มาเลเซีย สิงคโปร์ อินโดนีเซีย และประเทศอื่นที่มีรายงาน ยังรอรายละเอียดฉบับสุดท้าย และต่างชาติยังขายหุ้นไทยต่อเนื่อง (ราว 2,500 ล้านบาทวันพฤหัสฯ) คาดการณ์ของ Nvidia ไม่รวมยอดขายศูนย์ข้อมูลในจีน พรรคเดโมแครตที่ชนะทั้งสองสภาเมื่อ 3 พ.ย. ยังวางแผนเสนอกฎหมายลดภาษีตามมาตรา 301`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Renewed tanker attacks near the Strait of Hormuz put a floor under oil on Thursday, even as US inventories rose and agencies forecast a global surplus — the US–Iran standoff remains the main energy risk. The US–China tech contest keeps weighing on Hong Kong (−1.95%) and is spilling into Southeast Asia through the chip rules.`, th:`การโจมตีเรือบรรทุกน้ำมันใกล้ช่องแคบฮอร์มุซรอบใหม่พยุงราคาน้ำมันวันพฤหัสฯ แม้สต็อกน้ำมันสหรัฐฯ เพิ่มขึ้นและหน่วยงานต่าง ๆ คาดว่าอุปทานโลกจะล้น — ความตึงเครียดสหรัฐฯ–อิหร่านยังเป็นความเสี่ยงด้านพลังงานหลัก การแข่งขันด้านเทคโนโลยีระหว่างสหรัฐฯ กับจีนยังกดดันฮ่องกง (−1.95%) และลามมาถึงเอเชียตะวันออกเฉียงใต้ผ่านกฎคุมชิป`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The Fed's hiking bias is now the market's main driver: futures price ~95% odds of a 25 bp hike at the 8–9 Dec meeting, and a few officials are open to 50 bp. Thursday's weak Philly Fed (6.3) was not enough to change that with jobless claims at 203,000. The 10-year edged up to ~5.08% and the 2-year to ~4.82% — short-dated bonds remain the sweet spot.`, th:`การที่เฟดเอนไปทางขึ้นดอกเบี้ยตอนนี้คือแรงขับหลักของตลาด: ตลาดฟิวเจอร์สให้โอกาสราว 95% ที่จะขึ้น 0.25% ในการประชุม 8–9 ธ.ค. และกรรมการบางคนเปิดทางขึ้น 0.50% ตัวเลข Philly Fed ที่อ่อนแอ (6.3) วันพฤหัสฯ ไม่พอเปลี่ยนภาพนี้ เมื่อผู้ขอรับสวัสดิการว่างงานยังอยู่ที่ 203,000 ราย บอนด์ 10 ปีขยับขึ้นสู่ราว 5.08% และ 2 ปีสู่ราว 4.82% — บอนด์ระยะสั้นยังเป็นจุดที่น่าสนใจที่สุด`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
