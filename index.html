<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Bond Rout Deepens as 30-Year Treasury Yield Hits a 22-Year High — Wall Street Steadies on Hormuz Deal Hopes While Trump and Xi Meet Without a Breakthrough", th:"ตลาดพันธบัตรทรุดหนักขึ้น ผลตอบแทนพันธบัตร 30 ปีพุ่งแตะจุดสูงสุดในรอบ 22 ปี — วอลล์สตรีททรงตัวรับความหวังข้อตกลงช่องแคบฮอร์มุซ ขณะทรัมป์และสีพบกันโดยไม่มีความคืบหน้าสำคัญ"},
    heroDeck:{en:`Wall Street steadied Thursday even as the bond-market rout that rocked markets a day earlier deepened further: the 30-year Treasury yield jumped to 5.501%, its highest level since June 2004, while the 10-year held near 5.12% after topping 5.15% intraday and the 2-year climbed to 4.941%, as a stronger-than-expected US flash PMI showed private-sector activity expanding at its fastest pace in more than five years. Equities nonetheless bought the dip on reports that US and Iranian negotiators, meeting on the sidelines of the UN General Assembly, are exploring a phased deal to reopen the Strait of Hormuz and lift Washington's blockade of Iranian ports: the Dow Jones Industrial Average fell for a third straight session, down 161.61 points (-0.31%) to 51,349.98 after sinking as low as 51,124.02 intraday, while the S&P 500 slipped a marginal 0.02% to 7,704.13 and the Nasdaq Composite eked out a 0.01% gain to 26,939.37. Oil stayed bid on lingering uncertainty over whether the Hormuz talks will actually close — Brent rose 3.21% to $106.39/bbl and WTI gained 2.82% to $94.76/bbl — while gold fell 1.24% to $4,250.85/oz, pressured by the firmer dollar and surging yields even as inflation concerns mount. In Washington, President Trump and China's President Xi wrapped a roughly three-hour White House meeting with a cordial tone but no major breakthroughs on trade, technology, Taiwan or Iran, with both leaders seeking to keep ties stable ahead of the September 29 pharmaceutical-tariff deadline, now five days away. Germany's DAX fell 0.57% to 25,266 as Allianz and carmakers led losses; Tokyo's Nikkei 225 reopened after its Silver Week holiday and jumped 0.76% to 65,513.94, led by chip and tech names; China's Shanghai Composite dropped 1.23% to about 3,888, while Hong Kong's Hang Seng was essentially flat, shedding just 9.25 points to 24,824.87. Thailand's SET fell 0.50% (-8.12 pts) to 1,602.58 on turnover of THB 68.53bn, as investors turned risk-off on the global yield surge and reports that the US is considering a ban on diesel exports, a move that could add fresh inflationary pressure.`, th:`วอลล์สตรีททรงตัววันพฤหัสบดี แม้ตลาดพันธบัตรที่ทรุดตัวลงเมื่อวันก่อนจะทรุดหนักขึ้นไปอีก โดยผลตอบแทนพันธบัตรอายุ 30 ปีพุ่งขึ้นสู่ 5.501% สูงสุดนับตั้งแต่เดือนมิถุนายน 2004 ขณะผลตอบแทนพันธบัตรอายุ 10 ปียืนใกล้ 5.12% หลังแตะ 5.15% ระหว่างวัน และอายุ 2 ปีไต่ขึ้นสู่ 4.941% หลังดัชนี PMI เบื้องต้นของสหรัฐฯ ที่แข็งแกร่งกว่าคาดแสดงว่ากิจกรรมภาคเอกชนขยายตัวเร็วที่สุดในรอบกว่า 5 ปี ถึงกระนั้น หุ้นก็ยังมีแรงซื้อเมื่อราคาอ่อนตัวลง หลังมีรายงานว่าผู้เจรจาสหรัฐฯ และอิหร่าน ซึ่งพบกันข้างเวทีการประชุมสมัชชาใหญ่แห่งสหประชาชาติ กำลังพิจารณาข้อตกลงแบบเป็นขั้นตอนเพื่อเปิดช่องแคบฮอร์มุซอีกครั้ง และให้วอชิงตันผ่อนคลายการปิดล้อมท่าเรือของอิหร่าน ดัชนี Dow Jones ปรับลงติดต่อกันเป็นเซสชันที่สาม ลดลง 161.61 จุด (-0.31%) สู่ 51,349.98 หลังร่วงลงไปแตะจุดต่ำสุดระหว่างวันที่ 51,124.02 ขณะดัชนี S&P 500 ลดลงเล็กน้อย 0.02% สู่ 7,704.13 และดัชนี Nasdaq Composite เพิ่มขึ้น 0.01% สู่ 26,939.37 ราคาน้ำมันยังคงมีแรงซื้อจากความไม่แน่นอนว่าการเจรจาฮอร์มุซจะสำเร็จหรือไม่ — เบรนท์เพิ่มขึ้น 3.21% สู่ $106.39 ต่อบาร์เรล และ WTI เพิ่มขึ้น 2.82% สู่ $94.76 ต่อบาร์เรล — ขณะทองคำลดลง 1.24% สู่ $4,250.85 ต่อออนซ์ กดดันจากดอลลาร์ที่แข็งค่าและผลตอบแทนพันธบัตรที่พุ่งขึ้น แม้ความกังวลเงินเฟ้อจะเพิ่มขึ้นก็ตาม ที่กรุงวอชิงตัน ประธานาธิบดีทรัมป์และประธานาธิบดีสีจิ้นผิงของจีนพบกันที่ทำเนียบขาวราวสามชั่วโมงด้วยบรรยากาศที่เป็นมิตร แต่ไม่มีความคืบหน้าสำคัญด้านการค้า เทคโนโลยี ไต้หวัน หรืออิหร่าน โดยผู้นำทั้งสองต่างพยายามรักษาความสัมพันธ์ให้มั่นคง ก่อนกำหนดเส้นตายภาษียาที่มีสิทธิบัตรวันที่ 29 กันยายน ซึ่งเหลืออีกเพียง 5 วัน ดัชนี DAX เยอรมนีลดลง 0.57% สู่ 25,266 จากแรงเทขายกลุ่มประกันภัยและยานยนต์ ดัชนี Nikkei 225 ของโตเกียวเปิดทำการอีกครั้งหลังวันหยุด Silver Week และพุ่งขึ้น 0.76% สู่ 65,513.94 นำโดยหุ้นกลุ่มชิปและเทค ดัชนี Shanghai Composite ของจีนลดลง 1.23% สู่ราว 3,888 ขณะ Hang Seng ฮ่องกงแทบไม่เปลี่ยนแปลง ลดลงเพียง 9.25 จุด สู่ 24,824.87 ดัชนี SET ไทยลดลง 0.50% (-8.12 จุด) สู่ 1,602.58 มูลค่าการซื้อขายราว 6.853 หมื่นล้านบาท ขณะนักลงทุนหันมาปิดรับความเสี่ยงจากผลตอบแทนพันธบัตรโลกที่พุ่งขึ้น และรายงานว่าสหรัฐฯ กำลังพิจารณาห้ามส่งออกน้ำมันดีเซล ซึ่งอาจเพิ่มแรงกดดันเงินเฟ้อ`},

    dbNext:{en:"Next update", th:"อัปเดตถัดไป"}, dbNextVal:{en:"Next up is today's (Friday 25 Sep) Asia and Europe session, with US markets reopening later — watch whether the US-Iran Hormuz talks progress toward a signed deal, follow-through from the Trump-Xi meeting, and whether the 30-year Treasury yield's 2004 high extends further with the Sep 29 pharma-tariff deadline five days out", th:"ก้าวต่อไปคือเซสชันเอเชียและยุโรปวันนี้ (ศุกร์ที่ 25 ก.ย.) ก่อนตลาดสหรัฐฯ จะเปิดทำการอีกครั้งภายหลัง — ควรจับตาว่าการเจรจาฮอร์มุซระหว่างสหรัฐฯ และอิหร่านจะคืบหน้าสู่ข้อตกลงที่ลงนามจริงหรือไม่ ผลต่อเนื่องจากการพบกันของทรัมป์-สี และผลตอบแทนพันธบัตร 30 ปีที่แตะจุดสูงสุดตั้งแต่ปี 2004 จะพุ่งขึ้นต่อหรือไม่ ขณะกำหนดเส้นตายภาษียาวันที่ 29 ก.ย. เหลืออีก 5 วัน"},

    leadtxt:{en:`<b>Wall Street steadied Thursday even as the bond-market rout deepened further: the S&P 500 slipped 0.02% to 7,704.13, the Nasdaq edged up 0.01% to 26,939.37 and the Dow fell 0.31% (-161.61 pts) to 51,349.98 for a third straight losing session, well off its intraday low.</b> The 30-year Treasury yield hit 5.501% — its highest since June 2004 — while the 10-year held near 5.12% and the 2-year climbed to 4.941%, after a strong flash PMI reading; stocks nonetheless bought the dip on reports of a possible phased US-Iran deal to reopen the Strait of Hormuz. Oil extended its rally (Brent +3.21% to $106.39, WTI +2.82% to $94.76) while gold fell 1.24% to $4,250.85 on a firmer dollar. In Washington, Presidents Trump and Xi met for roughly three hours with a cordial tone but no major breakthroughs on trade, Taiwan or Iran. Germany's DAX fell 0.57% to 25,266, Tokyo's Nikkei jumped 0.76% to 65,513.94 on its reopening after Silver Week, Shanghai fell 1.23% while Hong Kong's Hang Seng was nearly flat, and Thailand's SET fell 0.50% to 1,602.58 on reports the US may ban diesel exports. For your clients: <b>this is now a two-session, curve-wide rates rout (19-year high on the 10-year, then a 2004 high on the 30-year) running alongside a real but unconfirmed geopolitical de-escalation story — worth distinguishing "rates repricing" risk, which looks structural, from the Hormuz headline risk, which could swing sharply either way depending on whether a deal is actually signed.</b>`, th:`<b>วอลล์สตรีททรงตัววันพฤหัสบดี แม้ตลาดพันธบัตรจะทรุดหนักขึ้นไปอีก โดยดัชนี S&P 500 ลดลงเล็กน้อย 0.02% สู่ 7,704.13 ดัชนี Nasdaq เพิ่มขึ้น 0.01% สู่ 26,939.37 และดัชนี Dow ลดลง 0.31% (-161.61 จุด) สู่ 51,349.98 ปรับลงติดต่อกันเป็นเซสชันที่สาม แต่ห่างจากจุดต่ำสุดระหว่างวันมาก</b> ผลตอบแทนพันธบัตรอายุ 30 ปีแตะ 5.501% — สูงสุดนับตั้งแต่เดือนมิถุนายน 2004 — ขณะผลตอบแทนพันธบัตรอายุ 10 ปียืนใกล้ 5.12% และอายุ 2 ปีไต่ขึ้นสู่ 4.941% หลังตัวเลข PMI เบื้องต้นที่แข็งแกร่ง ถึงกระนั้นหุ้นก็ยังมีแรงซื้อเมื่อราคาอ่อนตัวลง จากรายงานว่าอาจมีข้อตกลงแบบเป็นขั้นตอนระหว่างสหรัฐฯ และอิหร่านเพื่อเปิดช่องแคบฮอร์มุซอีกครั้ง ราคาน้ำมันปรับขึ้นต่อเนื่อง (เบรนท์ +3.21% สู่ $106.39, WTI +2.82% สู่ $94.76) ขณะทองคำลดลง 1.24% สู่ $4,250.85 จากดอลลาร์ที่แข็งค่าขึ้น ที่กรุงวอชิงตัน ประธานาธิบดีทรัมป์และสีจิ้นผิงพบกันราวสามชั่วโมงด้วยบรรยากาศที่เป็นมิตร แต่ไม่มีความคืบหน้าสำคัญด้านการค้า ไต้หวัน หรืออิหร่าน ดัชนี DAX เยอรมนีลดลง 0.57% สู่ 25,266 ดัชนี Nikkei โตเกียวพุ่งขึ้น 0.76% สู่ 65,513.94 จากการเปิดทำการอีกครั้งหลัง Silver Week ดัชนี Shanghai ลดลง 1.23% ขณะ Hang Seng ฮ่องกงแทบไม่เปลี่ยนแปลง และดัชนี SET ไทยลดลง 0.50% สู่ 1,602.58 จากรายงานว่าสหรัฐฯ อาจห้ามส่งออกน้ำมันดีเซล สำหรับลูกค้าของคุณ: <b>นี่คือเหตุการณ์ตลาดพันธบัตรทรุดตัวทั่วทั้งเส้นอัตราผลตอบแทนต่อเนื่องสองเซสชัน (จากจุดสูงสุดในรอบ 19 ปีของพันธบัตร 10 ปี สู่จุดสูงสุดตั้งแต่ปี 2004 ของพันธบัตร 30 ปี) ที่ดำเนินไปพร้อมกับเรื่องราวการคลี่คลายความตึงเครียดทางภูมิรัฐศาสตร์ที่ยังไม่ยืนยัน — ควรแยกแยะความเสี่ยงจาก "การปรับราคาดอกเบี้ย" ซึ่งดูเป็นเชิงโครงสร้าง ออกจากความเสี่ยงข่าวฮอร์มุซ ซึ่งอาจแกว่งตัวรุนแรงไปทางใดทางหนึ่งขึ้นอยู่กับว่าจะมีการลงนามข้อตกลงจริงหรือไม่</b>`},

    watchnote:{en:`US stocks steadied Thursday — the S&P 500 slipped 0.02%, the Nasdaq edged up 0.01% and the Dow fell 0.31% — even as the 30-year Treasury yield hit its highest since 2004, as reports of a possible phased US-Iran deal to reopen the Strait of Hormuz let investors buy the dip. Oil extended its rally, gold slipped further, and Presidents Trump and Xi met for three hours in Washington without a major breakthrough. Germany's DAX fell, Tokyo's Nikkei jumped on reopening after Silver Week, Shanghai fell while Hong Kong held nearly flat, and Thailand's SET fell on diesel-export-ban reports. <b style="color:var(--muted)">Today's session</b> is the next test — watch whether the Hormuz talks progress toward a signed deal, follow-through from the Trump-Xi meeting, and whether long-dated Treasury yields extend their multi-decade highs.`,
      th:`หุ้นสหรัฐฯ ทรงตัววันพฤหัสบดี — S&P 500 ลดลง 0.02%, Nasdaq เพิ่มขึ้น 0.01% และ Dow ลดลง 0.31% — แม้ผลตอบแทนพันธบัตรอายุ 30 ปีจะแตะจุดสูงสุดนับตั้งแต่ปี 2004 หลังรายงานว่าอาจมีข้อตกลงแบบเป็นขั้นตอนระหว่างสหรัฐฯ และอิหร่านเพื่อเปิดช่องแคบฮอร์มุซอีกครั้ง ทำให้นักลงทุนยังคงซื้อเมื่อราคาอ่อนตัว ราคาน้ำมันปรับขึ้นต่อเนื่อง ทองคำอ่อนตัวลงอีก และประธานาธิบดีทรัมป์กับสีจิ้นผิงพบกันสามชั่วโมงที่วอชิงตันโดยไม่มีความคืบหน้าสำคัญ ดัชนี DAX เยอรมนีลดลง ดัชนี Nikkei โตเกียวพุ่งขึ้นจากการเปิดทำการอีกครั้งหลัง Silver Week ดัชนี Shanghai ลดลงขณะฮ่องกงแทบทรงตัว และดัชนี SET ไทยลดลงจากรายงานห้ามส่งออกดีเซล <b style="color:var(--muted)">เซสชันวันนี้</b> คือบททดสอบถัดไป — ควรจับตาว่าการเจรจาฮอร์มุซจะคืบหน้าสู่ข้อตกลงที่ลงนามจริงหรือไม่ ผลต่อเนื่องจากการพบกันของทรัมป์-สี และผลตอบแทนพันธบัตรระยะยาวจะพุ่งขึ้นต่อจากจุดสูงสุดในรอบหลายทศวรรษหรือไม่`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป จีน/ฮ่องกง และไทย วันพุธที่ 23 ก.ย. (ตลาดโตเกียวเปิดทำการอีกครั้งวันนี้ พฤหัสบดีที่ 24 ก.ย. หลังวันหยุด Silver Week) ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,704.13", chg:-0.02, series:[7706.03,7704.13],
      txt:{en:`<b>US stocks steadied Thursday even as the bond-market rout deepened: the S&P 500 slipped 0.02% to 7,704.13, the Nasdaq Composite edged up 0.01% to 26,939.37, and the Dow fell 0.31% (-161.61 pts) to 51,349.98.</b> Reports of a possible phased US-Iran deal to reopen the Strait of Hormuz let investors buy the dip even as the 30-year Treasury yield hit its highest since 2004.`, th:`<b>หุ้นสหรัฐฯ ทรงตัววันพฤหัสบดี แม้ตลาดพันธบัตรจะทรุดหนักขึ้น: ดัชนี S&P 500 ลดลง 0.02% สู่ 7,704.13 ดัชนี Nasdaq Composite เพิ่มขึ้น 0.01% สู่ 26,939.37 และดัชนี Dow ลดลง 0.31% (-161.61 จุด) สู่ 51,349.98</b> รายงานความเป็นไปได้ของข้อตกลงสหรัฐฯ-อิหร่านแบบเป็นขั้นตอนเพื่อเปิดช่องแคบฮอร์มุซอีกครั้ง ทำให้นักลงทุนยังคงซื้อเมื่อราคาอ่อนตัว แม้ผลตอบแทนพันธบัตรอายุ 30 ปีจะแตะจุดสูงสุดนับตั้งแต่ปี 2004`},
      why:{en:`Thursday's near-flat close masks a genuine tug-of-war: a stronger-than-expected flash PMI and a fresh multi-decade high in long-dated yields (30-year at 5.501%, a 2004 high) argue for continued caution, yet the market chose to focus on tentative diplomatic progress toward reopening Hormuz — a reminder that geopolitical de-escalation headlines can offset even a deepening rates story, at least for a session. The Dow's round-trip from an intraday low of 51,124.02 back to almost flat shows dip-buyers remain active on rate-driven weakness.`, th:`การปิดตลาดที่แทบไม่เปลี่ยนแปลงวันพฤหัสบดีซ่อนการชักเย่อที่แท้จริงไว้ — ตัวเลข PMI เบื้องต้นที่แข็งแกร่งกว่าคาด และผลตอบแทนพันธบัตรระยะยาวที่แตะจุดสูงสุดในรอบหลายทศวรรษครั้งใหม่ (พันธบัตรอายุ 30 ปีที่ 5.501% สูงสุดตั้งแต่ปี 2004) บ่งชี้ว่าควรระมัดระวังต่อไป แต่ตลาดกลับเลือกให้น้ำหนักกับความคืบหน้าทางการทูตที่ยังไม่แน่นอนเรื่องการเปิดฮอร์มุซอีกครั้ง — เป็นเครื่องเตือนใจว่าข่าวการคลี่คลายความตึงเครียดทางภูมิรัฐศาสตร์สามารถหักล้างเรื่องราวดอกเบี้ยที่ทรุดหนักขึ้นได้ อย่างน้อยก็ในหนึ่งเซสชัน การที่ดัชนี Dow ดีดกลับจากจุดต่ำสุดระหว่างวันที่ 51,124.02 มาเกือบเสมอตัว แสดงว่านักลงทุนที่ซื้อเมื่อราคาอ่อนตัวยังคงเคลื่อนไหวอยู่แม้จะมีแรงกดดันจากดอกเบี้ย`},
      full:{en:`US stocks steadied Thursday after Wednesday's sharp selloff, even as the Treasury-market rout that drove it intensified further. The S&P 500 dipped 0.02% to 7,704.13, the Nasdaq Composite added 0.01% to 26,939.37, and the Dow Jones Industrial Average fell for a third straight session, down 161.61 points (-0.31%) to 51,349.98, after opening at 51,415.75, sinking to an intraday low of 51,124.02, and recovering to a high of 51,485.97 in the early afternoon. The rebound off the lows came after Bloomberg reported that US and Iranian negotiators, meeting on the sidelines of the UN General Assembly and mediated by Oman and Qatar, are exploring a phased deal under which Tehran would reopen the Strait of Hormuz in exchange for Washington easing its blockade of Iranian ports. That optimism offset a further leg up in Treasury yields: the 30-year hit 5.501%, its highest since June 2004, after S&P Global's flash PMI showed private-sector activity expanding at its fastest pace in more than five years, with both services and manufacturing improving alongside stronger inflationary pressures.`, th:`หุ้นสหรัฐฯ ทรงตัววันพฤหัสบดีหลังการเทขายอย่างหนักเมื่อวันพุธ แม้ตลาดพันธบัตรที่เป็นต้นเหตุจะทรุดหนักขึ้นไปอีก ดัชนี S&P 500 ลดลง 0.02% สู่ 7,704.13 ดัชนี Nasdaq Composite เพิ่มขึ้น 0.01% สู่ 26,939.37 และดัชนี Dow Jones ปรับลงติดต่อกันเป็นเซสชันที่สาม ลดลง 161.61 จุด (-0.31%) สู่ 51,349.98 หลังเปิดตลาดที่ 51,415.75 ร่วงลงไปแตะจุดต่ำสุดระหว่างวันที่ 51,124.02 และฟื้นตัวขึ้นแตะจุดสูงสุดที่ 51,485.97 ในช่วงบ่าย การดีดกลับจากจุดต่ำสุดเกิดขึ้นหลัง Bloomberg รายงานว่าผู้เจรจาสหรัฐฯ และอิหร่าน ซึ่งพบกันข้างเวทีการประชุมสมัชชาใหญ่แห่งสหประชาชาติโดยมีโอมานและกาตาร์เป็นตัวกลาง กำลังพิจารณาข้อตกลงแบบเป็นขั้นตอนที่ให้เตหะรานเปิดช่องแคบฮอร์มุซอีกครั้ง แลกกับการที่วอชิงตันผ่อนคลายการปิดล้อมท่าเรือของอิหร่าน ความหวังดังกล่าวหักล้างการพุ่งขึ้นอีกขั้นของผลตอบแทนพันธบัตร — พันธบัตรอายุ 30 ปีแตะ 5.501% สูงสุดนับตั้งแต่เดือนมิถุนายน 2004 หลังดัชนี PMI เบื้องต้นของ S&P Global แสดงว่ากิจกรรมภาคเอกชนขยายตัวเร็วที่สุดในรอบกว่า 5 ปี โดยทั้งภาคบริการและภาคการผลิตดีขึ้นพร้อมแรงกดดันเงินเฟ้อที่แข็งแกร่งขึ้น`},
      sources:[{l:"ABC News — How major US stock indexes fared Thursday",u:"https://abcnews.com/Business/wireStory/major-us-stock-indexes-fared-thursday-9242026-136734081"},{l:"Bloomberg — US, Iran said to be exploring phased deal to open Hormuz",u:"https://www.bloomberg.com/news/articles/2026-09-24/us-iran-said-to-be-exploring-phased-deal-to-open-hormuz"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,266.00", chg:-0.57, series:[25410.63,25266.00],
      txt:{en:`<b>Germany's DAX fell 0.57% to 25,266 Thursday,</b> as Allianz and carmakers led losses while European yields tracked the fresh leg up in US Treasuries and oil held near two-week highs.`, th:`<b>ดัชนี DAX เยอรมนีลดลง 0.57% สู่ 25,266 วันพฤหัสบดี</b> จากแรงเทขายกลุ่มประกันภัยอย่าง Allianz และกลุ่มยานยนต์ ขณะผลตอบแทนพันธบัตรยุโรปไต่ขึ้นตามการพุ่งขึ้นอีกขั้นของพันธบัตรสหรัฐฯ และราคาน้ำมันยืนใกล้จุดสูงสุดในรอบสองสัปดาห์`},
      why:{en:`A second straight DAX decline, this time led by insurers and autos rather than the broad market, suggests European investors are increasingly pricing rate-sensitive and energy-cost-exposed sectors separately from the index as a whole. With Wall Street stabilizing on Hormuz-deal optimism, the DAX's weakness looks more idiosyncratic (autos, insurers) than a pure read-through from the global rates story — worth flagging to clients with sector-specific European exposure.`, th:`การที่ DAX ปรับลงติดต่อกันเป็นวันที่สอง คราวนี้นำโดยกลุ่มประกันภัยและยานยนต์มากกว่าตลาดในวงกว้าง บ่งชี้ว่านักลงทุนยุโรปเริ่มแยกการตั้งราคาหุ้นกลุ่มที่อ่อนไหวต่อดอกเบี้ยและต้นทุนพลังงานออกจากดัชนีโดยรวมมากขึ้น เมื่อวอลล์สตรีททรงตัวจากความหวังข้อตกลงฮอร์มุซ ความอ่อนแอของ DAX จึงดูเหมือนเป็นปัจจัยเฉพาะกลุ่ม (ยานยนต์ ประกันภัย) มากกว่าการสะท้อนตามเรื่องราวดอกเบี้ยโลก ควรแจ้งลูกค้าที่มีสัดส่วนหุ้นยุโรปในกลุ่มดังกล่าว`},
      full:{en:`European shares pulled back further Thursday, with Germany's DAX falling 0.57% to close at 25,266, down from Wednesday's 25,410.63. Allianz and carmakers led the losses as European government bond yields continued to track the renewed leg up in US Treasuries, while elevated oil prices added a further cost headwind for autos. The decline came even as Wall Street stabilized on reports of progress toward a phased US-Iran deal over the Strait of Hormuz, underscoring that Thursday's European weakness was driven more by sector-specific and cost pressures than a fresh macro shock.`, th:`หุ้นยุโรปปรับลงต่อเนื่องวันพฤหัสบดี โดยดัชนี DAX เยอรมนีลดลง 0.57% ปิดที่ 25,266 ลดลงจาก 25,410.63 เมื่อวันพุธ หุ้นกลุ่มประกันภัยอย่าง Allianz และกลุ่มยานยนต์นำการปรับลง ขณะผลตอบแทนพันธบัตรรัฐบาลยุโรปยังคงไต่ขึ้นตามการพุ่งขึ้นอีกขั้นของพันธบัตรสหรัฐฯ ขณะราคาน้ำมันที่สูงขึ้นเพิ่มแรงกดดันด้านต้นทุนต่อกลุ่มยานยนต์ การปรับลงเกิดขึ้นแม้วอลล์สตรีทจะทรงตัวจากรายงานความคืบหน้าของข้อตกลงสหรัฐฯ-อิหร่านเรื่องช่องแคบฮอร์มุซ ตอกย้ำว่าความอ่อนแอของยุโรปวันพฤหัสบดีขับเคลื่อนจากปัจจัยเฉพาะกลุ่มและแรงกดดันด้านต้นทุน มากกว่าปัจจัยเศรษฐกิจมหภาคใหม่`},
      sources:[{l:"Trading Economics — Germany",u:"https://tradingeconomics.com/germany/stock-market"},{l:"Ad-Hoc News — Fuchs Petrolub stock heads into the open after DAX falls 0.6 percent",u:"https://www.ad-hoc-news.de/boerse/news/vorboerse/fuchs-petrolub-stock-heads-into-the-open-after-dax-falls-0-6-percent/70180136"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"65,513.94", chg:0.76, series:[65018.95,65513.94],
      txt:{en:`<b>Tokyo's Nikkei 225 reopened after Japan's Silver Week holiday and jumped 0.76% to 65,513.94 Thursday,</b> catching up on a week of missed global moves as chip and tech names led the advance.`, th:`<b>ตลาดโตเกียวเปิดทำการอีกครั้งหลังวันหยุด Silver Week ของญี่ปุ่น และดัชนี Nikkei 225 พุ่งขึ้น 0.76% สู่ 65,513.94 วันพฤหัสบดี</b> ไล่ตามความเคลื่อนไหวของตลาดโลกที่พลาดไปทั้งสัปดาห์ โดยหุ้นกลุ่มชิปและเทคโนโลยีนำการปรับขึ้น`},
      why:{en:`The Nikkei's gain on reopening — rather than a selloff catching down to the week's global rates-driven risk-off tone — suggests Japanese investors chose to focus on domestic tech and semiconductor strength (echoing SoftBank and Kioxia gains) over the Treasury-yield shock hitting other markets. This relative resilience is worth watching against the yen, which remains sensitive to the widening US-Japan rate gap now that US long yields have pushed to multi-decade highs.`, th:`การที่ Nikkei ปรับขึ้นเมื่อเปิดทำการอีกครั้ง แทนที่จะเทขายไล่ตามบรรยากาศปิดรับความเสี่ยงจากดอกเบี้ยของตลาดโลกตลอดสัปดาห์ บ่งชี้ว่านักลงทุนญี่ปุ่นเลือกให้น้ำหนักกับความแข็งแกร่งของหุ้นเทคและเซมิคอนดักเตอร์ในประเทศ (สอดคล้องกับการปรับขึ้นของ SoftBank และ Kioxia) มากกว่าแรงกระแทกจากผลตอบแทนพันธบัตรที่กระทบตลาดอื่น ควรจับตาความแข็งแกร่งเชิงเปรียบเทียบนี้เทียบกับค่าเงินเยน ซึ่งยังอ่อนไหวต่อส่วนต่างดอกเบี้ยสหรัฐฯ-ญี่ปุ่นที่กว้างขึ้น หลังผลตอบแทนพันธบัตรระยะยาวของสหรัฐฯ พุ่งขึ้นสู่จุดสูงสุดในรอบหลายทศวรรษ`},
      full:{en:`Japanese markets reopened Thursday after the country's five-day Silver Week holiday, and the Nikkei 225 jumped 0.76% to close at 65,513.94, up from its carried-over 65,018.95 close. SoftBank and Kioxia led gains as chip and technology names caught up on a week of missed global action, even as South Korean markets remained closed and global sentiment stayed cautious on the deepening Treasury-market rout and Thursday's Trump-Xi summit in Washington.`, th:`ตลาดญี่ปุ่นเปิดทำการอีกครั้งวันพฤหัสบดี หลังวันหยุด Silver Week ห้าวันของประเทศ และดัชนี Nikkei 225 พุ่งขึ้น 0.76% ปิดที่ 65,513.94 เพิ่มขึ้นจากราคาปิดที่คงไว้ที่ 65,018.95 หุ้น SoftBank และ Kioxia นำการปรับขึ้น ขณะหุ้นกลุ่มชิปและเทคโนโลยีไล่ตามความเคลื่อนไหวของตลาดโลกที่พลาดไปทั้งสัปดาห์ แม้ตลาดเกาหลีใต้จะยังปิดทำการ และบรรยากาศตลาดโลกยังคงระมัดระวังจากตลาดพันธบัตรที่ทรุดหนักขึ้น และการประชุมสุดยอดทรัมป์-สีที่วอชิงตันวันพฤหัสบดี`},
      sources:[{l:"TradingKey — Nikkei 225 Closes Up 0.76%, SoftBank and Kioxia Edge Up",u:"https://www.tradingkey.com/analysis/stocks/more/262184314-japan-south-korea-stocks-kospi-nikkei-softbank-kioxia-tradingkey"},{l:"Vantage Markets — Nikkei 225 Tops 66,000 After Three-Day Tokyo Break",u:"https://www.vantagemarkets.com/market-news/nikkei-225-ai-stocks-yields-september-24-2026/"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,824.87", chg:-0.04, series:[24834.12,24824.87],
      txt:{en:`<b>Hong Kong's Hang Seng was essentially flat Thursday, shedding just 9.25 points to 24,824.87, while the Shanghai Composite fell 1.23% to about 3,888,</b> as mainland shares reacted more sharply than Hong Kong to the day's Trump-Xi summit and global bond-market rout.`, th:`<b>Hang Seng ฮ่องกงแทบไม่เปลี่ยนแปลงวันพฤหัสบดี ลดลงเพียง 9.25 จุด สู่ 24,824.87 ขณะ Shanghai Composite ลดลง 1.23% สู่ราว 3,888</b> เมื่อหุ้นจีนแผ่นดินใหญ่ตอบสนองรุนแรงกว่าฮ่องกงต่อการประชุมสุดยอดทรัมป์-สีวันนี้ และตลาดพันธบัตรโลกที่ทรุดตัว`},
      why:{en:`The wide gap between Hong Kong's near-flat close and Shanghai's 1.23% drop — the widest split between the two markets recently — suggests mainland investors are more directly exposed to headline risk around the Trump-Xi summit's lack of concrete breakthroughs on trade and Taiwan, while internationally-oriented Hong Kong shares found some support from the same Hormuz-deal optimism that steadied Wall Street.`, th:`ช่องว่างที่กว้างระหว่างการปิดตลาดที่แทบไม่เปลี่ยนแปลงของฮ่องกงกับการร่วงลง 1.23% ของเซี่ยงไฮ้ — ความแตกต่างที่กว้างที่สุดระหว่างสองตลาดในช่วงหลัง — บ่งชี้ว่านักลงทุนจีนแผ่นดินใหญ่มีความอ่อนไหวต่อความเสี่ยงจากข่าวโดยตรงมากกว่า จากการที่การประชุมสุดยอดทรัมป์-สีไม่มีความคืบหน้าที่เป็นรูปธรรมด้านการค้าและไต้หวัน ขณะหุ้นฮ่องกงที่เชื่อมโยงกับตลาดโลกมากกว่าได้รับแรงหนุนบางส่วนจากความหวังข้อตกลงฮอร์มุซเดียวกับที่ทำให้วอลล์สตรีททรงตัว`},
      full:{en:`Hong Kong and mainland Chinese shares diverged sharply Thursday. The Hang Seng held its ground, shedding just 9.25 points to close at 24,824.87, while the Shanghai Composite fell a sharper 1.23% to roughly 3,888 — the widest split between the two markets in recent sessions. The moves came as President Trump and President Xi wrapped a roughly three-hour White House meeting with a cordial tone but no major breakthroughs on trade, technology, Taiwan or Iran, even as Xi voiced support for the US and Iran returning to an interim agreement on the Strait of Hormuz.`, th:`หุ้นฮ่องกงและจีนแผ่นดินใหญ่เคลื่อนไหวแตกต่างกันอย่างชัดเจนวันพฤหัสบดี ดัชนี Hang Seng ยืนได้ดี ลดลงเพียง 9.25 จุด ปิดที่ 24,824.87 ขณะดัชนี Shanghai Composite ลดลงมากกว่าที่ 1.23% สู่ราว 3,888 — ความแตกต่างที่กว้างที่สุดระหว่างสองตลาดในช่วงเซสชันหลัง ๆ ความเคลื่อนไหวนี้เกิดขึ้นขณะประธานาธิบดีทรัมป์และประธานาธิบดีสีจิ้นผิงพบกันที่ทำเนียบขาวราวสามชั่วโมงด้วยบรรยากาศที่เป็นมิตร แต่ไม่มีความคืบหน้าสำคัญด้านการค้า เทคโนโลยี ไต้หวัน หรืออิหร่าน แม้สีจิ้นผิงจะแสดงการสนับสนุนให้สหรัฐฯ และอิหร่านกลับสู่ข้อตกลงชั่วคราวเรื่องช่องแคบฮอร์มุซ`},
      sources:[{l:"24/7 Wall St. — Hang Seng closes down 0.3% as Shanghai drops 1.23% in the same session",u:"https://247wallst.com/cards/hong-kong-held-most-of-its-ground-into-the-close-while-shang-hsi-market-bell-01m3972jjqy5gtsegh4jshxz3q"},{l:"Al Jazeera — Trump-Xi summit: Four key takeaways",u:"https://www.aljazeera.com/news/2026/9/24/trump-xi-summit-four-key-takeaways-from-the-washington-dc-meeting"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,602.58", chg:-0.50, series:[1610.70,1602.58],
      txt:{en:`<b>SET Index fell 0.50% to 1,602.58 Thursday (-8.12 pts),</b> on turnover of about THB 68.53bn, as heavy large-cap selling turned the market risk-off on surging oil prices, rising bond yields and reports the US is weighing a ban on diesel exports.`, th:`<b>ดัชนี SET ลดลง 0.50% สู่ 1,602.58 วันพฤหัสบดี (-8.12 จุด)</b> มูลค่าการซื้อขายราว 6.853 หมื่นล้านบาท จากแรงเทขายหุ้นขนาดใหญ่ที่ทำให้ตลาดหันมาปิดรับความเสี่ยง จากราคาน้ำมันและผลตอบแทนพันธบัตรที่พุ่งขึ้น และรายงานว่าสหรัฐฯ กำลังพิจารณาห้ามส่งออกน้ำมันดีเซล`},
      why:{en:`Thailand giving back Wednesday's gain, and by a wider margin, shows the market's earlier resilience wasn't immune to a second day of global pressure — this time compounded by a domestic-flavored worry (a possible US diesel-export ban) that would be directly inflationary for local fuel costs. Worth flagging to clients that SET's outperformance is proving session-by-session rather than structural, and remains sensitive to both global rates and idiosyncratic energy-policy headlines.`, th:`การที่ไทยคืนกำไรจากวันพุธ และในระดับที่มากกว่า แสดงว่าความแข็งแกร่งก่อนหน้านี้ของตลาดไม่ได้รอดพ้นจากแรงกดดันตลาดโลกในวันที่สอง — คราวนี้ยิ่งซ้ำเติมด้วยความกังวลในประเทศ (ความเป็นไปได้ของการห้ามส่งออกดีเซลของสหรัฐฯ) ซึ่งจะส่งผลเงินเฟ้อโดยตรงต่อต้นทุนเชื้อเพลิงในประเทศ ควรแจ้งลูกค้าว่าการที่ SET ทำได้ดีกว่าตลาดอื่นเป็นเรื่องที่เกิดขึ้นเป็นรายเซสชัน ไม่ใช่เชิงโครงสร้าง และยังคงอ่อนไหวทั้งต่อดอกเบี้ยโลกและข่าวนโยบายพลังงานเฉพาะกรณี`},
      full:{en:`Thailand's SET Index fell 0.50% (-8.12 points) to close at 1,602.58 Thursday on turnover of about THB 68.53 billion, trending downward through the session on heavy selling in large-cap stocks as investors shifted into risk-off mode. Sentiment was dampened by a sharp rise in oil prices and bond yields, as well as reports that the United States is considering a ban on diesel exports — a move that could accelerate inflation both in the US and among diesel-importing countries. The pullback erased most of Wednesday's tech-led gain, though the index remains up on the week overall.`, th:`ดัชนี SET ของไทยลดลง 0.50% (-8.12 จุด) ปิดที่ 1,602.58 วันพฤหัสบดี มูลค่าการซื้อขายราว 6.853 หมื่นล้านบาท ตลาดเคลื่อนไหวลงตลอดเซสชันจากแรงเทขายหนักในหุ้นขนาดใหญ่ ขณะนักลงทุนเปลี่ยนมาอยู่ในโหมดปิดรับความเสี่ยง บรรยากาศตลาดถูกกดดันจากราคาน้ำมันและผลตอบแทนพันธบัตรที่พุ่งขึ้นแรง รวมถึงรายงานว่าสหรัฐฯ กำลังพิจารณาห้ามส่งออกน้ำมันดีเซล ซึ่งอาจเร่งเงินเฟ้อทั้งในสหรัฐฯ เองและในกลุ่มประเทศที่นำเข้าดีเซล การปรับลงครั้งนี้ลบล้างกำไรที่นำโดยหุ้นกลุ่มเทคเมื่อวันพุธไปเกือบทั้งหมด แต่ดัชนียังคงบวกเมื่อเทียบกับต้นสัปดาห์`},
      sources:[{l:"Kaohoon International — Market Roundup 24 September 2026",u:"https://www.kaohooninternational.com/markets/591468"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil extended its rebound Thursday — Brent +3.21% to $106.39/bbl, WTI +2.82% to $94.76/bbl — while gold fell 1.24% to $4,250.85/oz,</b> as lingering uncertainty over a reported phased US-Iran deal to reopen the Strait of Hormuz kept crude bid even as the same headline helped calm equities.`, th:`<b>ราคาน้ำมันปรับขึ้นต่อเนื่องวันพฤหัสบดี — เบรนท์ +3.21% สู่ $106.39 ต่อบาร์เรล, WTI +2.82% สู่ $94.76 ต่อบาร์เรล — ขณะทองคำลดลง 1.24% สู่ $4,250.85 ต่อออนซ์</b> เมื่อความไม่แน่นอนที่ยังคงอยู่เกี่ยวกับรายงานข้อตกลงสหรัฐฯ-อิหร่านแบบเป็นขั้นตอนเพื่อเปิดช่องแคบฮอร์มุซ ทำให้น้ำมันยังมีแรงซื้อ แม้ข่าวเดียวกันจะช่วยให้ตลาดหุ้นสงบลง`},
     why:{en:`Oil rallying for a second straight day on the very story (a possible Hormuz deal) that steadied stocks is a useful reminder for clients: markets are pricing the deal as more likely to happen eventually than to close immediately, so crude stays bid on residual supply-risk premium while equities look through to a calmer end-state. Gold's continued slide despite the same uncertainty shows the metal is still taking its cue mainly from the dollar and yields, not geopolitical risk.`, th:`การที่น้ำมันปรับขึ้นติดต่อกันเป็นวันที่สองจากเรื่องราวเดียวกัน (ความเป็นไปได้ของข้อตกลงฮอร์มุซ) ที่ทำให้หุ้นทรงตัว เป็นข้อเตือนใจที่มีประโยชน์สำหรับลูกค้า — ตลาดกำลังตั้งราคาว่าข้อตกลงมีแนวโน้มจะเกิดขึ้นในที่สุดมากกว่าจะสำเร็จในทันที ทำให้น้ำมันยังมีพรีเมียมความเสี่ยงด้านอุปทานเหลืออยู่ ขณะหุ้นมองข้ามไปยังผลลัพธ์ที่สงบกว่า การที่ทองคำยังคงอ่อนตัวลงแม้จะมีความไม่แน่นอนเดียวกัน แสดงว่าโลหะมีค่าชนิดนี้ยังคงรับสัญญาณหลักจากดอลลาร์และผลตอบแทนพันธบัตร ไม่ใช่ความเสี่ยงทางภูมิรัฐศาสตร์`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The bond-market rout deepened Thursday: the 30-year Treasury yield jumped to 5.501%, its highest since June 2004, while the 10-year held near 5.12% after topping 5.15% intraday and the 2-year climbed to 4.941%,</b> after S&P Global's flash PMI showed private-sector activity expanding at its fastest pace in more than five years.`, th:`<b>ตลาดพันธบัตรทรุดหนักขึ้นวันพฤหัสบดี: ผลตอบแทนพันธบัตรอายุ 30 ปีพุ่งขึ้นสู่ 5.501% สูงสุดนับตั้งแต่เดือนมิถุนายน 2004 ขณะผลตอบแทนพันธบัตรอายุ 10 ปียืนใกล้ 5.12% หลังแตะ 5.15% ระหว่างวัน และอายุ 2 ปีไต่ขึ้นสู่ 4.941%</b> หลังดัชนี PMI เบื้องต้นของ S&P Global แสดงว่ากิจกรรมภาคเอกชนขยายตัวเร็วที่สุดในรอบกว่า 5 ปี`},
     why:{en:`A 22-year high on the 30-year, arriving a day after the 10-year hit a 19-year high, tells clients this is now a broad-based, curve-wide repricing rather than a one-day headline reaction — strong PMI data is doing exactly what Wednesday's weak auction and hawkish Fed comments started. For long-duration and rate-sensitive portfolios, the message is the same as Wednesday's, only louder: this looks like a multi-session regime shift in the cost of long-term borrowing, not noise.`, th:`การที่พันธบัตรอายุ 30 ปีแตะจุดสูงสุดในรอบ 22 ปี หนึ่งวันหลังพันธบัตรอายุ 10 ปีแตะจุดสูงสุดในรอบ 19 ปี บอกลูกค้าว่านี่คือการปรับราคาทั่วทั้งเส้นอัตราผลตอบแทนในวงกว้างแล้ว ไม่ใช่ปฏิกิริยาต่อข่าวเพียงวันเดียว — ตัวเลข PMI ที่แข็งแกร่งกำลังทำหน้าที่ต่อยอดจากการประมูลที่อ่อนแอและถ้อยแถลงสายเหยี่ยวของเฟดเมื่อวันพุธได้อย่างแม่นยำ สำหรับพอร์ตที่มี duration ยาวและอ่อนไหวต่อดอกเบี้ย ข้อความยังคงเหมือนวันพุธ เพียงแต่ชัดเจนขึ้น — นี่ดูเหมือนการเปลี่ยนแปลงเชิงโครงสร้างของต้นทุนการกู้ยืมระยะยาวที่ต่อเนื่องหลายเซสชัน ไม่ใช่ความผันผวนชั่วคราว`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`President Trump and China's President Xi wrapped a roughly three-hour White House meeting Thursday with a cordial tone but few concrete results: trade, investment, AI, Taiwan and Iran were all on the agenda, but both leaders mainly sought to keep US-China ties stable rather than resolve any single issue. The September 29 pharmaceutical-tariff deadline is now just five days away.`, th:`ประธานาธิบดีทรัมป์และประธานาธิบดีสีจิ้นผิงของจีนพบกันที่ทำเนียบขาวราวสามชั่วโมงวันพฤหัสบดีด้วยบรรยากาศที่เป็นมิตร แต่ได้ผลลัพธ์ที่เป็นรูปธรรมน้อย — การค้า การลงทุน AI ไต้หวัน และอิหร่าน ล้วนอยู่ในวาระการประชุม แต่ผู้นำทั้งสองส่วนใหญ่มุ่งรักษาความสัมพันธ์สหรัฐฯ-จีนให้มั่นคงมากกว่าจะแก้ไขประเด็นใดประเด็นหนึ่งให้เสร็จสิ้น กำหนดเส้นตายภาษียาที่มีสิทธิบัตรวันที่ 29 กันยายนเหลืออีกเพียง 5 วัน`}, w:{en:`With the summit producing atmosphere over substance, the pharma-tariff deadline becomes the next hard catalyst — watch for any last-minute signal on an extension or a carve-out in the days ahead. The lack of a breakthrough on Taiwan or broader trade also leaves the Busan truce's November expiry as an open risk that markets have not yet had to price.`, th:`เมื่อการประชุมสุดยอดให้เพียงบรรยากาศมากกว่าเนื้อหา กำหนดเส้นตายภาษียาจึงกลายเป็นปัจจัยกระตุ้นถัดไปที่ต้องจับตาอย่างจริงจัง — ควรติดตามสัญญาณนาทีสุดท้ายเรื่องการต่ออายุหรือข้อยกเว้นในช่วงหลายวันข้างหน้า การไม่มีความคืบหน้าเรื่องไต้หวันหรือการค้าในวงกว้าง ยังทำให้การหมดอายุของข้อตกลงสงบศึกปูซานในเดือนพฤศจิกายนเป็นความเสี่ยงที่ตลาดยังไม่ได้ตั้งราคารับ`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Oil extended its rebound Thursday (Brent +3.21% to $106.39, WTI +2.82% to $94.76) as reports emerged that US and Iranian negotiators, mediated by Oman and Qatar on the sidelines of the UN General Assembly, are exploring a phased deal for Iran to reopen the Strait of Hormuz in exchange for Washington easing its blockade of Iranian ports.`, th:`ราคาน้ำมันปรับขึ้นต่อเนื่องวันพฤหัสบดี (เบรนท์ +3.21% สู่ $106.39, WTI +2.82% สู่ $94.76) หลังมีรายงานว่าผู้เจรจาสหรัฐฯ และอิหร่าน ซึ่งมีโอมานและกาตาร์เป็นตัวกลาง พบกันข้างเวทีการประชุมสมัชชาใหญ่แห่งสหประชาชาติ กำลังพิจารณาข้อตกลงแบบเป็นขั้นตอนให้อิหร่านเปิดช่องแคบฮอร์มุซอีกครั้ง แลกกับการที่วอชิงตันผ่อนคลายการปิดล้อมท่าเรือของอิหร่าน`}, w:{en:`A reported path toward a Hormuz deal was enough to steady US equities even as oil stayed bid on the deal not yet being signed — a split reaction worth explaining to clients. A confirmed agreement would likely be a bigger relief for oil (removing the supply-risk premium) than for stocks (which have already priced in de-escalation hope), while a collapse in talks could send crude sharply higher again.`, th:`รายงานความคืบหน้าสู่ข้อตกลงฮอร์มุซเพียงพอที่จะทำให้หุ้นสหรัฐฯ ทรงตัว แม้น้ำมันจะยังมีแรงซื้อจากการที่ข้อตกลงยังไม่ได้ลงนาม — ปฏิกิริยาที่แตกต่างกันนี้ควรอธิบายให้ลูกค้าเข้าใจ ข้อตกลงที่ยืนยันแล้วน่าจะเป็นข่าวดีต่อน้ำมันมากกว่าหุ้น (เพราะลบพรีเมียมความเสี่ยงด้านอุปทานออกไป) ขณะหุ้นได้ตั้งราคารับความหวังการคลี่คลายไปแล้วบางส่วน ส่วนการเจรจาที่ล้มเหลวอาจทำให้น้ำมันพุ่งขึ้นแรงอีกครั้ง`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The bond-market rout that began Wednesday deepened further Thursday: the 30-year Treasury yield hit 5.501%, its highest since June 2004, the 10-year held near 5.12% after touching 5.15% intraday, and the 2-year rose to 4.941%, as a stronger-than-expected flash PMI reinforced the case for further Fed tightening.`, th:`ตลาดพันธบัตรที่เริ่มทรุดตัวตั้งแต่วันพุธทรุดหนักขึ้นไปอีกวันพฤหัสบดี ผลตอบแทนพันธบัตรอายุ 30 ปีแตะ 5.501% สูงสุดนับตั้งแต่เดือนมิถุนายน 2004 ขณะผลตอบแทนพันธบัตรอายุ 10 ปียืนใกล้ 5.12% หลังแตะ 5.15% ระหว่างวัน และอายุ 2 ปีไต่ขึ้นสู่ 4.941% หลังตัวเลข PMI เบื้องต้นที่แข็งแกร่งกว่าคาดตอกย้ำเหตุผลสนับสนุนการคุมเข้มดอกเบี้ยเพิ่มเติมของเฟด`}, w:{en:`Two consecutive sessions of multi-decade-high yields, on the back of both a weak auction/hawkish Fed commentary (Wednesday) and strong activity data (Thursday), leave little room to dismiss this as noise. Expect continued pressure on rate-sensitive assets until there's a clear disinflationary catalyst; in the meantime, duration risk remains the dominant story across both equity and fixed-income portfolios.`, th:`ผลตอบแทนพันธบัตรที่แตะจุดสูงสุดในรอบหลายทศวรรษสองเซสชันติดต่อกัน จากทั้งการประมูลที่อ่อนแอและถ้อยแถลงสายเหยี่ยวของเฟด (วันพุธ) และข้อมูลกิจกรรมทางเศรษฐกิจที่แข็งแกร่ง (วันพฤหัสบดี) แทบไม่เหลือพื้นที่ให้มองว่านี่เป็นความผันผวนชั่วคราว คาดว่าจะมีแรงกดดันต่อเนื่องต่อสินทรัพย์ที่อ่อนไหวต่อดอกเบี้ย จนกว่าจะมีปัจจัยกระตุ้นด้านเงินเฟ้อที่ชัดเจน ระหว่างนี้ ความเสี่ยงด้าน duration ยังคงเป็นประเด็นหลักทั้งในพอร์ตหุ้นและตราสารหนี้`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`S&P Global's flash PMI showed US private-sector activity expanding at its fastest pace in more than five years in September, with both services and manufacturing improving alongside stronger inflationary pressures — a print that pushed the 30-year Treasury yield to its highest since 2004.`, th:`ดัชนี PMI เบื้องต้นของ S&P Global แสดงว่ากิจกรรมภาคเอกชนของสหรัฐฯ ขยายตัวเร็วที่สุดในรอบกว่า 5 ปีในเดือนกันยายน โดยทั้งภาคบริการและภาคการผลิตดีขึ้นพร้อมแรงกดดันเงินเฟ้อที่แข็งแกร่งขึ้น — ตัวเลขที่ดันผลตอบแทนพันธบัตรอายุ 30 ปีขึ้นสู่จุดสูงสุดนับตั้งแต่ปี 2004`}, w:{en:`Strong growth data feeding straight into a fresh multi-decade high in long yields is the clearest sign yet that "higher for longer" is becoming consensus, not just a Fed talking point. Combine that with reports the US may restrict diesel exports (a direct, near-term inflationary lever) and clients should hear that the inflation story now has both a demand-side (strong PMI) and a supply-side (energy-policy) driver working in the same direction.`, th:`ข้อมูลการเติบโตที่แข็งแกร่งซึ่งส่งผลโดยตรงต่อผลตอบแทนพันธบัตรระยะยาวที่แตะจุดสูงสุดในรอบหลายทศวรรษครั้งใหม่ เป็นสัญญาณที่ชัดเจนที่สุดว่าแนวคิด "ดอกเบี้ยสูงนานขึ้น" กำลังกลายเป็นฉันทามติ ไม่ใช่เพียงคำพูดของเฟด เมื่อรวมกับรายงานว่าสหรัฐฯ อาจจำกัดการส่งออกดีเซล (ปัจจัยที่ส่งผลเงินเฟ้อโดยตรงและในระยะสั้น) ลูกค้าควรรับทราบว่าเรื่องราวเงินเฟ้อตอนนี้มีทั้งแรงขับด้านอุปสงค์ (PMI แข็งแกร่ง) และด้านอุปทาน (นโยบายพลังงาน) ที่ไปในทิศทางเดียวกัน`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 8 Sep",th:"อังคาร 8 ก.ย."}, imp:"h", t:{en:"Wall Street reopens for the first time since the tanker war, with hike odds near 60%",th:"วอลล์สตรีทเปิดตลาดอีกครั้งเป็นครั้งแรกหลังสงครามเรือบรรทุกน้ำมัน ขณะโอกาสขึ้นดอกเบี้ยใกล้ 60%"}, d:{en:"US markets reopen Tuesday after the Labor Day break, giving the first direct pricing of both the weekend's Iran-tanker escalation and the climb in September rate-hike odds to roughly 60%. Oil (Brent near $98, WTI above $92) and the elevated 10-year yield (~4.79%) will be the key signals to watch as trading resumes.",th:"ตลาดสหรัฐฯ เปิดทำการอีกครั้งวันอังคารหลังหยุดวันแรงงาน เป็นการสะท้อนราคาโดยตรงครั้งแรกทั้งการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ขยับขึ้นสู่ราว 60% ราคาน้ำมัน (เบรนท์ใกล้ $98, WTI เหนือ $92) และผลตอบแทนพันธบัตร 10 ปีที่สูงขึ้น (~4.79%) จะเป็นสัญญาณสำคัญที่ต้องจับตาเมื่อการซื้อขายกลับมาดำเนินต่อ"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 9 Sep",th:"พุธ 9 ก.ย."}, imp:"h", t:{en:"Oil tops $101 as tanker war's worst wave yet hits Wall St a third day",th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"}, d:{en:"The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%); national gas hit $4.22/gal and diesel a record $5.94/gal. The S&P 500 fell 0.48% to 7,636.36 (a third straight down day), the DAX slid 1.74% to a one-month low of 25,554, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. September hike odds eased slightly to ~57%.",th:"สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ดัชนี S&P 500 ลดลง 0.48% สู่ 7,636.36 (ปรับลงวันที่สามติดต่อกัน) ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือนที่ 25,554 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 10 Sep",th:"พฤหัสฯ 10 ก.ย."}, imp:"h", t:{en:"Wall St falls a fourth day; hike odds jump to ~72% as yields near 5%",th:"วอลล์สตรีทร่วงวันที่สี่ โอกาสขึ้นดอกเบี้ยพุ่งสู่ราว 72% ผลตอบแทนใกล้ 5%"}, d:{en:"US stocks fell a fourth straight session — S&P 500 -0.58% to 7,591.70, Dow -0.6% to 52,064.10, Nasdaq -0.65% to 26,081.72 — as the 10-year Treasury yield pushed above 4.9% and Wednesday's in-line PPI kept inflation in focus. September hike odds jumped to roughly 72%, from ~57% a day earlier. Germany's DAX fell 0.8% to 25,401 after the ECB hiked 25bp; Hong Kong's Hang Seng dropped 1.27% while Japan's Nikkei edged up 0.20% and Thailand's SET eased 0.17% on profit-taking. Oil held near $101 and gold rose to $4,405.88.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกัน — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 0.6% สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 — ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% และ PPI วันพุธที่ออกมาตามคาดยังตอกย้ำแรงกดดันเงินเฟ้อ โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% จากราว 57% เมื่อวันก่อน ดัชนี DAX เยอรมนีลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ย 25bp ดัชนี Hang Seng ฮ่องกงลดลง 1.27% ขณะ Nikkei ญี่ปุ่นขยับขึ้น 0.20% และ SET ไทยลดลง 0.17% จากแรงขายทำกำไร น้ำมันยืนใกล้ $101 และทองคำเพิ่มขึ้นสู่ $4,405.88"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 11 Sep",th:"ศุกร์ 11 ก.ย."}, imp:"h", t:{en:"Hot core CPI pushes Sep 16 hike odds to ~90%; stocks rally, oil tumbles",th:"Core CPI ร้อนแรงดันโอกาสขึ้นดอกเบี้ย 16 ก.ย. สู่ราว 90% หุ้นดีดตัว น้ำมันร่วง"}, d:{en:"August headline CPI matched forecasts (+0.4% m/m, +3.4% y/y) but core CPI ran hot (+0.3% m/m vs +0.2% expected, +2.4% y/y), pushing Sep 16 hike odds to roughly 90% from ~72% Thursday. The S&P 500 rose 0.86% to 7,656.98, the Dow gained 509.19 pts (+0.98%) to 52,573.29, and the Nasdaq added 0.96% to 26,333.04. The 10-year yield touched 4.98% before easing to ~4.92%, and Brent tumbled 2.8% to $104.61 after Iran signaled Oman talks over the Strait of Hormuz. Earlier, before the print, Asia and Europe stayed mixed: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%.",th:"CPI ทั่วไปเดือน ส.ค. ตรงตามคาด (+0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อน) แต่ Core CPI ร้อนแรงกว่าคาด (+0.3% เทียบเดือนก่อน เทียบคาดการณ์ 0.2%, +2.4% เทียบปีก่อน) ดันโอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. สู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ดัชนี S&P 500 เพิ่มขึ้น 0.86% สู่ 7,656.98 ดัชนี Dow เพิ่มขึ้น 509.19 จุด (+0.98%) สู่ 52,573.29 และดัชนี Nasdaq เพิ่มขึ้น 0.96% สู่ 26,333.04 ผลตอบแทนพันธบัตร 10 ปีแตะ 4.98% ก่อนย่อตัวสู่ราว 4.92% และเบรนท์ร่วง 2.8% สู่ $104.61 หลังอิหร่านส่งสัญญาณเจรจาที่โอมานเรื่องช่องแคบฮอร์มุซ ก่อนหน้านั้น ก่อนตัวเลขจะประกาศ ตลาดเอเชียและยุโรปเคลื่อนไหวคละกัน: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 14 Sep",th:"จันทร์ 14 ก.ย."}, imp:"h", t:{en:"AI-slowdown selloff runs a full session; 10-year yield tops 5% intraday",th:"แรงเทขาย AI ดำเนินต่อเนื่องเต็มเซสชัน ผลตอบแทน 10 ปีทะลุ 5% ระหว่างวัน"}, d:{en:"US stocks fell a second straight session — S&P 500 -0.48% to 7,619.98, Dow -0.29% to 52,421.20, Nasdaq -0.56% to 26,186.41 — as the weekend's AI-slowdown warnings ran through a full session and the 10-year Treasury yield touched 5.01% intraday before easing to ~4.96%. DAX fell 0.66% to 25,398.75, Nikkei dropped 0.81% to 63,492.99, Hang Seng fell 0.48% to 24,687 (a 4th straight losing session), Shanghai eased 0.07% to 3,885, and Thailand's SET fell 0.84% to 1,591.07 on a DELTA-led electronics selloff. Brent settled $108.34 (+3.6%) and gold fell 1.25% to $4,284.48, its lowest since August.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สองติดต่อกัน — S&P 500 ลดลง 0.48% สู่ 7,619.98, Dow ลดลง 0.29% สู่ 52,421.20, Nasdaq ลดลง 0.56% สู่ 26,186.41 — ขณะคำเตือนชะลอ AI ช่วงสุดสัปดาห์ดำเนินต่อเนื่องเต็มเซสชัน และผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน ก่อนย่อตัวสู่ราว 4.96% ดัชนี DAX ลดลง 0.66% สู่ 25,398.75 ดัชนี Nikkei ลดลง 0.81% สู่ 63,492.99 ดัชนี Hang Seng ลดลง 0.48% สู่ 24,687 (ปรับลงติดต่อกันเป็นเซสชันที่สี่) ดัชนี Shanghai ลดลง 0.07% สู่ 3,885 และดัชนี SET ไทยลดลง 0.84% สู่ 1,591.07 จากแรงเทขายหุ้นอิเล็กทรอนิกส์ที่นำโดย DELTA เบรนท์ปิดที่ $108.34 (+3.6%) และทองคำลดลง 1.25% สู่ $4,284.48 ต่ำสุดตั้งแต่เดือนสิงหาคม"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 15 Sep",th:"อังคาร 15 ก.ย."}, imp:"h", t:{en:"Wall St falls a third day as the 10-year yield hits its highest since 2007",th:"วอลล์สตรีทร่วงวันที่สาม ผลตอบแทน 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007"}, d:{en:"US stocks fell a third straight session — S&P 500 -0.45% to 7,585.73, Dow -0.63% to 52,093.11, Nasdaq -0.78% to 25,981.57 — even as AI chip names Qualcomm and AMD bounced. The 10-year Treasury yield touched 5.04% intraday, its highest since 2007, before easing to ~5.00%, and CME FedWatch pushed hike odds to roughly 92% from 88% Monday. DAX fell 1.14% to ~25,109, Nikkei was flat at 63,484.10, Hang Seng eased 0.08% to 24,667 (a 5th straight losing session), and Shanghai fell 0.54% to 3,864.28. WTI rose to $105.49 while Brent held near $107.46, and gold fell 1.23% to a six-week low of $4,263.19.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกัน — S&P 500 ลดลง 0.45% สู่ 7,585.73, Dow ลดลง 0.63% สู่ 52,093.11, Nasdaq ลดลง 0.78% สู่ 25,981.57 — แม้หุ้นชิปกลุ่ม AI อย่าง Qualcomm และ AMD จะดีดตัวขึ้น ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวสู่ราว 5.00% และ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยขึ้นสู่ราว 92% จาก 88% เมื่อวันจันทร์ ดัชนี DAX ลดลง 1.14% สู่ราว 25,109 ดัชนี Nikkei ทรงตัวที่ 63,484.10 ดัชนี Hang Seng ลดลง 0.08% สู่ 24,667 (ปรับลงติดต่อกันเป็นเซสชันที่ห้า) และดัชนี Shanghai ลดลง 0.54% สู่ 3,864.28 WTI เพิ่มขึ้นสู่ $105.49 ขณะเบรนท์ยืนใกล้ $107.46 และทองคำลดลง 1.23% สู่ระดับต่ำสุดในรอบหกสัปดาห์ที่ $4,263.19"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 16 Sep",th:"พุธ 16 ก.ย."}, imp:"h", t:{en:"Fed hikes rates for the first time in three years; Wall Street falls, 10-year tops 5% again",th:"เฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี วอลล์สตรีทปรับลง ผลตอบแทน 10 ปีทะลุ 5% อีกครั้ง"}, d:{en:"The FOMC voted 12-0 to raise the fed funds rate a quarter point to 3.75%-4.00%, its first hike in three years. Chair Kevin Warsh said inflation \"is too high, and has been for too long,\" and the updated dot plot showed most officials expect at least one more hike this year. US stocks fell on the news — Dow -1.21% (-631.21 pts) to 51,461.90, S&P 500 -0.45% to 7,551.81, Nasdaq roughly flat at 25,978.42 — and the 10-year Treasury yield climbed back above 5% to 5.016%. Oil jumped on fresh Middle East supply fears (WTI +4.2% to $104.25, Brent +4.14% to $108.94) after Houthi attacks and a Saudi pipeline shutdown, while gold slipped 1.2% to $4,240.10. Asia and Europe, which closed hours before the announcement, only traded on anticipation: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80%. Thailand's SET fell 1.01% to 1,562.73 on domestic drivers (a diesel price cut and a delayed tourism-stimulus program), unrelated to the Fed.",th:"FOMC ลงมติเอกฉันท์ 12 เสียง ขึ้นอัตราดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ \"สูงเกินไป และสูงมานานเกินไป\" และ dot plot ฉบับปรับใหม่แสดงว่ากรรมการส่วนใหญ่คาดว่าจะมีการขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ หุ้นสหรัฐฯ ปรับลงรับข่าว — Dow -1.21% (-631.21 จุด) สู่ 51,461.90, S&P 500 -0.45% สู่ 7,551.81, Nasdaq ทรงตัวใกล้เคียงเดิมที่ 25,978.42 — และผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% ราคาน้ำมันพุ่งขึ้นจากความกังวลด้านอุปทานในตะวันออกกลางรอบใหม่ (WTI +4.2% สู่ $104.25, เบรนท์ +4.14% สู่ $108.94) หลังกลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันของซาอุดีอาระเบียถูกปิด ขณะทองคำลดลง 1.2% สู่ $4,240.10 ตลาดเอเชียและยุโรปซึ่งปิดตลาดก่อนการประกาศหลายชั่วโมง เทรดตามการคาดการณ์เท่านั้น: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80% ดัชนี SET ไทยลดลง 1.01% สู่ 1,562.73 จากปัจจัยภายในประเทศ (การลดราคาดีเซลและโครงการกระตุ้นท่องเที่ยวที่ถูกเลื่อนออกไป) ซึ่งไม่เกี่ยวกับเฟด"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 17 Sep",th:"พฤหัสฯ 17 ก.ย."}, imp:"h", t:{en:"Wall Street rebounds as the 10-year yield slips below 5% and oil eases",th:"วอลล์สตรีทดีดตัว ผลตอบแทนพันธบัตร 10 ปีหลุด 5% น้ำมันย่อตัว"}, d:{en:"US stocks bounced back from Wednesday's Fed-hike selloff — S&P 500 +0.59% to 7,596.36, Dow +0.61% (+316.14 pts) to 51,778.04, Nasdaq +1.60% to 26,395.18 — as the 10-year Treasury yield eased to ~4.94% and oil fell on signs the Iran war's supply disruptions could moderate (WTI -2.2% to $101.91, Brent -3.8% to $104.82). Gold rebounded 1.4% to $4,301.40. Trump escalated pressure on Chair Kevin Warsh, threatening to halt trade with surplus countries unless the Fed cuts rates, but the Fed's own statement blamed tariffs, the Iran war and AI capex for elevated inflation. Europe and Japan got their first full session to price in the Fed's hike — DAX +0.53% to 25,538, Nikkei +0.33% to 64,136.25 — while Hong Kong's Hang Seng slipped 0.44% to 24,604.29 and Shanghai eased 0.41% to 3,875.60. Thailand's SET jumped 1.32% to 1,583.34 on turnover of THB 62.46bn.",th:"หุ้นสหรัฐฯ ดีดตัวขึ้นจากแรงเทขายรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ — S&P 500 +0.59% สู่ 7,596.36, Dow +0.61% (+316.14 จุด) สู่ 51,778.04, Nasdaq +1.60% สู่ 26,395.18 — ขณะผลตอบแทนพันธบัตร 10 ปีย่อตัวลงสู่ราว 4.94% และราคาน้ำมันลดลงจากสัญญาณว่าปัญหาอุปทานจากสงครามอิหร่านอาจบรรเทาลง (WTI -2.2% สู่ $101.91, เบรนท์ -3.8% สู่ $104.82) ทองคำดีดตัวขึ้น 1.4% สู่ $4,301.40 ทรัมป์ทวีความรุนแรงของแรงกดดันต่อประธานเควิน วอร์ช โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลหากเฟดไม่ลดดอกเบี้ย แต่แถลงการณ์ของเฟดเองโทษภาษีศุลกากร สงครามอิหร่าน และการลงทุนด้าน AI ว่าเป็นสาเหตุของเงินเฟ้อสูง ยุโรปและญี่ปุ่นได้เซสชันเต็มรูปแบบครั้งแรกในการสะท้อนการขึ้นดอกเบี้ยของเฟดในราคา — DAX +0.53% สู่ 25,538, Nikkei +0.33% สู่ 64,136.25 — ขณะ Hang Seng ฮ่องกงลดลง 0.44% สู่ 24,604.29 และ Shanghai ลดลง 0.41% สู่ 3,875.60 ดัชนี SET ไทยพุ่งขึ้น 1.32% สู่ 1,583.34 มูลค่าการซื้อขายราว 6.246 หมื่นล้านบาท"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 18 Sep",th:"ศุกร์ 18 ก.ย."}, imp:"h", t:{en:"Bank of Japan hikes to 1.25%; Asia rallies, DAX tumbles, Wall Street ends a third losing week little changed",th:"BOJ ขึ้นดอกเบี้ยสู่ 1.25% เอเชียดีดตัว DAX ร่วง วอลล์สตรีทปิดสัปดาห์ที่ปรับลงเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเล็กน้อย"}, d:{en:"The BOJ raised its policy rate a quarter point to 1.25% — highest since 1995 — in a widely expected move that still carried two dovish dissents. Japan's Nikkei jumped 1.38% to 65,018.95, Hong Kong's Hang Seng added 0.60% to 24,750.78 and Shanghai rose 0.94% to 3,911.87, while Germany's DAX tumbled 1.65% to 25,308.88 on an auto-led selloff (Volkswagen -5.97%). US stocks closed a third straight losing week little changed — Dow -0.18% to 51,682.64, S&P 500 +0.17% to 7,650.50, Nasdaq +0.39% to 26,522.55 — as the 10-year Treasury yield backed up toward 5% again (~5.01%). Oil held steady (WTI ~$100.90, Brent ~$104.33) and gold extended its rally to $4,368.60. Thailand's SET was flat at 1,584.15 (+0.05%). Markets are closed for the weekend; next up is Monday's Asia and Europe open.",th:"BOJ ขึ้นอัตราดอกเบี้ยนโยบาย 0.25% สู่ 1.25% — สูงสุดนับตั้งแต่ปี 1995 — เป็นการตัดสินใจที่ตลาดคาดการณ์ไว้แล้ว แต่ยังมีกรรมการ 2 เสียงคัดค้านเชิงผ่อนคลาย ดัชนี Nikkei ญี่ปุ่นพุ่งขึ้น 1.38% สู่ 65,018.95 ดัชนี Hang Seng ฮ่องกงเพิ่มขึ้น 0.60% สู่ 24,750.78 และ Shanghai เพิ่มขึ้น 0.94% สู่ 3,911.87 ขณะดัชนี DAX เยอรมนีร่วง 1.65% สู่ 25,308.88 จากแรงเทขายกลุ่มยานยนต์ (Volkswagen -5.97%) หุ้นสหรัฐฯ ปิดสัปดาห์ที่ปรับลงติดต่อกันเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเพียงเล็กน้อย — Dow -0.18% สู่ 51,682.64, S&P 500 +0.17% สู่ 7,650.50, Nasdaq +0.39% สู่ 26,522.55 — ขณะผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นใกล้ 5% อีกครั้ง (ราว 5.01%) ราคาน้ำมันทรงตัว (WTI ราว $100.90, เบรนท์ราว $104.33) และทองคำขยายการปรับขึ้นต่อเนื่องสู่ $4,368.60 ดัชนี SET ไทยทรงตัวที่ 1,584.15 (+0.05%) ตลาดปิดทำการช่วงสุดสัปดาห์ ก้าวต่อไปคือการเปิดตลาดเอเชียและยุโรปวันจันทร์"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 21 Sep",th:"จันทร์ 21 ก.ย."}, imp:"h", t:{en:"Nasdaq surges 2.26% to a record close as chip stocks rally, oil tumbles and Thailand's SET jumps on a Fitch upgrade",th:"Nasdaq พุ่งขึ้น 2.26% ปิดสูงสุดเป็นประวัติการณ์ หุ้นกลุ่มชิปพุ่งขึ้น น้ำมันร่วง และ SET ไทยพุ่งขึ้นรับข่าว Fitch"}, d:{en:"US stocks posted their best session in weeks — S&P 500 +1.49% to 7,764.70, Nasdaq +2.26% to a record 27,122.09, Dow +0.71% to 52,048.83 — led by chipmakers Intel (+~12%) and AMD (+~10%, briefly a $1 trillion company), as WTI oil tumbled 4.5% to $95.78 and the 10-year Treasury yield eased to 4.951%. Germany's DAX rallied 1.07% to 25,575 and Tokyo stayed closed for a holiday, while Shanghai rose 0.97% to 3,949.91 and Hong Kong's Hang Seng added 1.18% to 25,042.71 on tech and health-tech buying. Thailand's SET jumped 0.88% to 1,598.03 after Fitch Ratings upgraded the country's credit outlook to Stable from Negative. Futures now price the Fed's Oct 28 meeting close to a coin-flip on another hike.",th:"หุ้นสหรัฐฯ มีเซสชันที่ดีที่สุดในรอบหลายสัปดาห์ — S&P 500 +1.49% สู่ 7,764.70, Nasdaq +2.26% สู่ระดับสูงสุดเป็นประวัติการณ์ที่ 27,122.09, Dow +0.71% สู่ 52,048.83 — นำโดยหุ้นกลุ่มชิป Intel (+ราว 12%) และ AMD (+ราว 10% แตะมูลค่า 1 ล้านล้านดอลลาร์ชั่วคราว) ขณะน้ำมัน WTI ร่วง 4.5% สู่ $95.78 และผลตอบแทนพันธบัตร 10 ปีย่อตัวสู่ 4.951% ดัชนี DAX เยอรมนีพุ่งขึ้น 1.07% สู่ 25,575 และตลาดโตเกียวปิดทำการวันหยุด ขณะ Shanghai เพิ่มขึ้น 0.97% สู่ 3,949.91 และ Hang Seng ฮ่องกงเพิ่มขึ้น 1.18% สู่ 25,042.71 จากแรงซื้อหุ้นกลุ่มเทคและเฮลท์เทค ดัชนี SET ไทยพุ่งขึ้น 0.88% สู่ 1,598.03 หลัง Fitch Ratings ปรับมุมมองเครดิตของประเทศเป็นคงที่จากลบ ตลาดล่วงหน้าเริ่มให้ราคาการประชุมเฟดวันที่ 28 ต.ค. ใกล้เคียง 50-50 สำหรับการขึ้นดอกเบี้ยอีกครั้ง"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 22 Sep",th:"อังคาร 22 ก.ย."}, imp:"h", t:{en:"Nasdaq's second straight record on Meta's Muse AI agent; Dow slips, oil breaks below $100 as Trump issues UN ultimatum to Iran",th:"Nasdaq ปิดสูงสุดเป็นประวัติการณ์ติดต่อกันครั้งที่สอง จาก Muse ของ Meta — Dow อ่อนตัว น้ำมันหลุด $100 ขณะทรัมป์ยื่นคำขาดต่ออิหร่านที่ยูเอ็น"}, d:{en:"US stocks were mixed — Nasdaq +0.50% to a record 27,244.28 on a strong reception for Meta's new Muse AI agent, S&P 500 flat at 7,761 (-0.04%), Dow -0.36% (-185.14 pts) to 51,863.69 on Cisco (-4.50%), JPMorgan (-3.35%) and American Express (-2.62%) weakness. Oil extended its slide to a fifth session — Brent -1% to $99.25, its first close below $100 in two weeks — even as Trump told the UN he faces a \"big decision\" on Iran and doesn't expect a deal before the midterms. The 10-year Treasury yield held at 4.959% as CME FedWatch pushed October 28 hike odds to ~60%, and gold eased on a firmer dollar. Germany's DAX was flat at 25,578.85, Tokyo stayed shut for a rare five-day Silver Week holiday (Nikkei still 65,018.95), Shanghai edged up 0.06% to 3,952.13 and Hong Kong's Hang Seng added 0.18% to 25,087.75 ahead of Thursday's Trump-Xi summit. Thailand's SET rose 0.40% to 1,604.44 on turnover of THB 67.05bn.",th:"หุ้นสหรัฐฯ เคลื่อนไหวคละกัน — Nasdaq +0.50% ปิดสูงสุดเป็นประวัติการณ์ที่ 27,244.28 จากการตอบรับที่ดีต่อ Muse ตัวช่วย AI ตัวใหม่ของ Meta, S&P 500 ทรงตัวที่ 7,761 (-0.04%), Dow -0.36% (-185.14 จุด) สู่ 51,863.69 จากความอ่อนแอของ Cisco (-4.50%), JPMorgan (-3.35%) และ American Express (-2.62%) ราคาน้ำมันร่วงต่อเนื่องเป็นเซสชันที่ห้า — เบรนท์ -1% สู่ $99.25 ต่ำกว่าระดับ $100 เป็นครั้งแรกในรอบสองสัปดาห์ — แม้ทรัมป์จะกล่าวต่อยูเอ็นว่าเขาต้อง \"ตัดสินใจครั้งใหญ่\" เรื่องอิหร่าน และไม่คาดว่าจะมีข้อตกลงก่อนการเลือกตั้งกลางเทอม ผลตอบแทนพันธบัตร 10 ปียืนที่ 4.959% ขณะ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมสู่ราว 60% และทองคำอ่อนตัวลงจากดอลลาร์ที่แข็งค่าขึ้น ดัชนี DAX เยอรมนีทรงตัวที่ 25,578.85 ตลาดโตเกียวยังปิดทำการเนื่องในวันหยุด Silver Week ห้าวันที่หาได้ยาก (Nikkei ยังอยู่ที่ 65,018.95) ดัชนี Shanghai ขยับขึ้น 0.06% สู่ 3,952.13 และ Hang Seng ฮ่องกงเพิ่มขึ้น 0.18% สู่ 25,087.75 ก่อนการประชุมสุดยอดทรัมป์-สีวันพฤหัสบดี ดัชนี SET ไทยเพิ่มขึ้น 0.40% สู่ 1,604.44 มูลค่าการซื้อขายราว 6.705 หมื่นล้านบาท"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 23 Sep",th:"พุธ 23 ก.ย."}, imp:"h", t:{en:"10-year Treasury yield rockets to a 19-year high as Fed's Barr turns hawkish; Wall Street tumbles, oil snaps back above $100",th:"ผลตอบแทนพันธบัตร 10 ปีพุ่งแตะจุดสูงสุดในรอบ 19 ปี หลังผู้ว่าการเฟดบาร์ส่งสัญญาณสายเหยี่ยว วอลล์สตรีทร่วงแรง น้ำมันดีดกลับเหนือ $100"}, d:{en:"US stocks sold off sharply — S&P 500 -0.75% to 7,706.03, Nasdaq -1.13% to 26,936.04, Dow -0.68% (-352.10 pts) to 51,511.59, with small-caps hit hardest — as a weak $70bn five-year note auction and hawkish remarks from Fed Governor Michael Barr drove the 10-year Treasury yield up more than 17bp to 5.135%, its highest since July 2007; the 5-year yield hit 5% for the first time since 2007. CME FedWatch pushed October 28 hike odds to roughly 73%, from ~60% Tuesday, after S&P Global's flash composite PMI jumped to 58.4, a 5-year high. Oil snapped a five-session slide (Brent +3.86% to $103.08, WTI +1.81% to $92.16) while gold fell 1.23% to $4,304.11 on a firmer dollar. Germany's DAX fell 0.66% to 25,410.63, Tokyo stayed shut for the last day of Silver Week (Nikkei still 65,018.95, reopening today), Shanghai eased 0.39% to 3,936.52 and Hong Kong's Hang Seng dropped 1.01% to 24,834.12 ahead of today's Trump-Xi summit. Thailand's SET bucked the trend, rising 0.39% to 1,610.70 on turnover of THB 64.41bn.",th:"หุ้นสหรัฐฯ เทขายอย่างหนัก — S&P 500 ลดลง 0.75% สู่ 7,706.03, Nasdaq ลดลง 1.13% สู่ 26,936.04, Dow ลดลง 0.68% (-352.10 จุด) สู่ 51,511.59 โดยหุ้นขนาดเล็กร่วงหนักที่สุด — หลังการประมูลพันธบัตรอายุ 5 ปีมูลค่า 7 หมื่นล้านดอลลาร์ที่อ่อนแอ และถ้อยแถลงสายเหยี่ยวของผู้ว่าการเฟด ไมเคิล บาร์ ดันผลตอบแทนพันธบัตร 10 ปีขึ้นกว่า 17bp สู่ 5.135% สูงสุดนับตั้งแต่เดือนกรกฎาคม 2007 ขณะผลตอบแทนพันธบัตรอายุ 5 ปีแตะ 5% เป็นครั้งแรกนับตั้งแต่ปี 2007 CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยวันที่ 28 ตุลาคมสู่ราว 73% จากราว 60% เมื่อวันอังคาร หลังดัชนี PMI รวมเบื้องต้นของ S&P Global พุ่งขึ้นสู่ 58.4 สูงสุดในรอบ 5 ปี ราคาน้ำมันยุติการร่วงต่อเนื่องห้าเซสชัน (เบรนท์ +3.86% สู่ $103.08, WTI +1.81% สู่ $92.16) ขณะทองคำลดลง 1.23% สู่ $4,304.11 จากดอลลาร์ที่แข็งค่าขึ้น ดัชนี DAX เยอรมนีลดลง 0.66% สู่ 25,410.63 ตลาดโตเกียวยังปิดทำการวันสุดท้ายของ Silver Week (Nikkei ยังอยู่ที่ 65,018.95 เปิดทำการอีกครั้งวันนี้) ดัชนี Shanghai ลดลง 0.39% สู่ 3,936.52 และ Hang Seng ฮ่องกงลดลง 1.01% สู่ 24,834.12 ก่อนการประชุมสุดยอดทรัมป์-สีวันนี้ ดัชนี SET ไทยสวนทางกระแส เพิ่มขึ้น 0.39% สู่ 1,610.70 มูลค่าการซื้อขายราว 6.441 หมื่นล้านบาท"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 24 Sep",th:"พฤหัสฯ 24 ก.ย."}, imp:"h", t:{en:"Bond rout deepens to a 2004 high on the 30-year; Wall Street steadies on Hormuz-deal hopes as Trump and Xi meet without a breakthrough",th:"ตลาดพันธบัตรทรุดหนักขึ้น ผลตอบแทน 30 ปีแตะจุดสูงสุดตั้งแต่ปี 2004 วอลล์สตรีททรงตัวรับข่าวความหวังข้อตกลงฮอร์มุซ ขณะทรัมป์-สีพบกันโดยไม่มีความคืบหน้าสำคัญ"}, d:{en:"The 30-year Treasury yield jumped to 5.501%, its highest since June 2004, while the 10-year held near 5.12% and the 2-year rose to 4.941%, after a strong flash PMI reading. US stocks nonetheless steadied — Dow -0.31% to 51,349.98, S&P 500 -0.02% to 7,704.13, Nasdaq +0.01% to 26,939.37 — on reports of a possible phased US-Iran deal to reopen the Strait of Hormuz. Oil extended its rally (Brent +3.21% to $106.39, WTI +2.82% to $94.76) while gold fell 1.24% to $4,250.85. President Trump and President Xi met for about three hours at the White House with a cordial tone but no major breakthroughs on trade, Taiwan or Iran. Germany's DAX fell 0.57% to 25,266, Tokyo's Nikkei reopened after Silver Week and jumped 0.76% to 65,513.94, Shanghai fell 1.23% to about 3,888 while Hong Kong's Hang Seng was nearly flat at 24,824.87, and Thailand's SET fell 0.50% to 1,602.58 on reports the US may ban diesel exports.",th:"ผลตอบแทนพันธบัตรอายุ 30 ปีพุ่งขึ้นสู่ 5.501% สูงสุดนับตั้งแต่เดือนมิถุนายน 2004 ขณะผลตอบแทนพันธบัตรอายุ 10 ปียืนใกล้ 5.12% และอายุ 2 ปีไต่ขึ้นสู่ 4.941% หลังตัวเลข PMI เบื้องต้นที่แข็งแกร่ง หุ้นสหรัฐฯ กลับทรงตัว — Dow ลดลง 0.31% สู่ 51,349.98, S&P 500 ลดลง 0.02% สู่ 7,704.13, Nasdaq เพิ่มขึ้น 0.01% สู่ 26,939.37 — จากรายงานความเป็นไปได้ของข้อตกลงสหรัฐฯ-อิหร่านแบบเป็นขั้นตอนเพื่อเปิดช่องแคบฮอร์มุซอีกครั้ง ราคาน้ำมันปรับขึ้นต่อเนื่อง (เบรนท์ +3.21% สู่ $106.39, WTI +2.82% สู่ $94.76) ขณะทองคำลดลง 1.24% สู่ $4,250.85 ประธานาธิบดีทรัมป์และประธานาธิบดีสีจิ้นผิงพบกันที่ทำเนียบขาวราวสามชั่วโมงด้วยบรรยากาศที่เป็นมิตร แต่ไม่มีความคืบหน้าสำคัญด้านการค้า ไต้หวัน หรืออิหร่าน ดัชนี DAX เยอรมนีล
