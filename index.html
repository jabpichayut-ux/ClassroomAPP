<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Stocks Slide as Oil Surges and a September Fed Hike Becomes the Base Case", th:"หุ้นร่วง น้ำมันพุ่ง และการขึ้นดอกเบี้ยเดือน ก.ย. กลายเป็นกรณีหลัก"},
    heroDeck:{en:"US stocks fell Tuesday — S&P 500 −0.7% to 7,631, Nasdaq −1.0% — as US–Iran clashes in the Strait of Hormuz sent oil up ~3% (WTI ~$88). A global bond sell-off lifted yields, and markets now price a 57.5% chance the Fed hikes 25bp in September.", th:"หุ้นสหรัฐร่วงวันอังคาร — S&P 500 −0.7% สู่ 7,631, Nasdaq −1.0% — จากการปะทะสหรัฐ–อิหร่านในช่องแคบฮอร์มุซ ดันน้ำมันขึ้นราว 3% (WTI ~$88) การเทขายพันธบัตรทั่วโลกดันผลตอบแทนขึ้น และตลาดให้น้ำหนัก 57.5% ว่าเฟดจะขึ้นดอกเบี้ย 25bp ในเดือนกันยายน"},
    heroNote:{en:"Illustrated cover · full photos at the linked sources", th:"ภาพหน้าปกจำลอง · ภาพข่าวจริงที่ลิงก์แหล่งข่าว"},
    dbEd:{en:"Edition", th:"ฉบับวันที่"}, dbCov:{en:"Covering", th:"ครอบคลุมการซื้อขาย"}, dbCovVal:{en:"Tue 1 Sep US close → Wed 2 Sep", th:"ปิดสหรัฐ 1 ก.ย. → 2 ก.ย."},
    updatedLbl:{en:"Last updated", th:"อัปเดตล่าสุด"}, updatedAt:{en:"2 Sep 2026, 08:55 ICT", th:"2 ก.ย. 2026, 08:55 น."},

    leadtxt:{en:`<b>Risk-off: a September Fed hike is now the market’s base case (57.5% odds), and geopolitics is adding fuel.</b> The S&P 500 fell 0.7% to 7,631 as US–Iran fighting flared in the Strait of Hormuz, pushing oil up ~3% and triggering a global bond sell-off that lifted yields. For your clients: rising yields make this an <b>excellent window to lock in bond income</b>, and choppy, hawkish conditions favor a defensive, diversified stance over high-beta tech.`, th:`<b>ปิดรับความเสี่ยง: การขึ้นดอกเบี้ยเดือน ก.ย. กลายเป็นกรณีหลักของตลาด (โอกาส 57.5%) และภูมิรัฐศาสตร์ยิ่งเติมเชื้อ</b> ดัชนี S&P 500 ร่วง 0.7% สู่ 7,631 จากการสู้รบสหรัฐ–อิหร่านในช่องแคบฮอร์มุซ ดันน้ำมันขึ้นราว 3% และจุดการเทขายพันธบัตรทั่วโลกที่ดันผลตอบแทนขึ้น สำหรับลูกค้าของคุณ: ผลตอบแทนที่สูงขึ้นทำให้นี่เป็น <b>จังหวะที่ดีเยี่ยมในการล็อกรายได้จากพันธบัตร</b> และภาวะผันผวนสายเหยี่ยวเอื้อต่อการตั้งรับและกระจายความเสี่ยง มากกว่าหุ้นเทคผันผวนสูง`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,631.47", chg:-0.71, series:[7686.14,7631.47],
      txt:{en:`<b>US stocks fell a third straight session Tuesday — the S&P 500 −0.71% to 7,631.47, the Dow −0.79% (−419 pts) to 52,766.88, the Nasdaq −1.03% to 26,099.77 —</b> as chip stocks led the selling and the 10-year Treasury yield climbed to 4.79%, its fifth straight daily rise and the highest close since January 2025.`, th:`<b>หุ้นสหรัฐฯ ปรับลงต่อเนื่องเป็นวันที่สามวันอังคาร — S&P 500 ลดลง 0.71% สู่ 7,631.47, Dow ลดลง 0.79% (−419 จุด) สู่ 52,766.88, Nasdaq ลดลง 1.03% สู่ 26,099.77 —</b> นำโดยหุ้นกลุ่มชิปที่ถูกเทขายหนัก ขณะผลตอบแทนพันธบัตร 10 ปีขยับขึ้นสู่ 4.79% ขึ้นต่อเนื่องเป็นวันที่ห้าติดต่อกัน ระดับปิดสูงสุดตั้งแต่เดือน ม.ค. 2025`},
      why:{en:`This is now the third straight session where the oil/rates shock, not earnings or growth data, is driving US price action — and a fifth consecutive daily rise in the 10-year (now at 4.79%, hike odds at 68%) argues clients should stop thinking of this as a one-off headline and start treating today's coupons as a genuinely limited-time offer.`, th:`นี่เป็นวันที่สามติดต่อกันแล้วที่แรงกระแทกจากน้ำมัน/ดอกเบี้ย ไม่ใช่ผลประกอบการหรือข้อมูลการเติบโต เป็นตัวขับเคลื่อนราคาหุ้นสหรัฐฯ — และการที่พันธบัตร 10 ปีปรับขึ้นต่อเนื่องเป็นวันที่ห้าติดต่อกัน (ตอนนี้ 4.79% โอกาสขึ้นดอกเบี้ยที่ 68%) สนับสนุนให้ลูกค้าเลิกมองว่านี่เป็นแค่พาดหัวข่าวครั้งเดียว และเริ่มมองคูปองวันนี้เป็นข้อเสนอที่มีเวลาจำกัดจริง ๆ`},
      full:{en:`US stocks fell for a third straight session Tuesday as chip stocks led the market lower and Treasury yields kept climbing. The S&P 500 dropped 0.71% to close at 7,631.47, the Dow Jones Industrial Average lost 419 points (-0.79%) to 52,766.88, and the Nasdaq Composite slid 1.03% to 26,099.77 — roughly triple the S&P's percentage decline, as Nvidia and other chip names bore the brunt of the selling. Oil benchmarks extended their advance (Brent +0.87% to $91.28) on continued Trump-Iran tension, and that energy-driven inflation risk pushed the 10-year Treasury yield to 4.79%, its fifth consecutive daily rise and the highest close since January 2025. CME FedWatch now shows a 68% chance of a September rate hike, up from 66% Monday. The 2-year yield rose to 4.40%, the 30-year climbed to 5.28%, and gold extended its slide to $4,358.74 (-1.86%), a two-week low, even as Mideast risk stayed elevated.`, th:`หุ้นสหรัฐฯ ปรับลงต่อเนื่องเป็นวันที่สามวันอังคาร นำโดยหุ้นกลุ่มชิปที่ฉุดตลาดลง ขณะผลตอบแทนพันธบัตรยังคงปรับขึ้นต่อเนื่อง ดัชนี S&P 500 ลดลง 0.71% ปิดที่ 7,631.47 ดัชนี Dow Jones ลดลง 419 จุด (-0.79%) สู่ 52,766.88 และดัชนี Nasdaq Composite ลดลง 1.03% สู่ 26,099.77 — ลดลงมากกว่า S&P ราวสามเท่าในสัดส่วนเปอร์เซ็นต์ เนื่องจาก Nvidia และหุ้นกลุ่มชิปอื่น ๆ รับแรงเทขายหนักที่สุด ราคาน้ำมันปรับขึ้นต่อ (เบรนท์เพิ่มขึ้น 0.87% สู่ $91.28) จากความตึงเครียดทรัมป์-อิหร่านที่ยังคุกรุ่นอยู่ และความเสี่ยงเงินเฟ้อจากพลังงานนี้ดันผลตอบแทนพันธบัตร 10 ปีสู่ 4.79% ขึ้นต่อเนื่องเป็นวันที่ห้าติดต่อกัน ระดับปิดสูงสุดตั้งแต่เดือน ม.ค. 2025 CME FedWatch ตอนนี้ชี้โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ 68% เพิ่มขึ้นจาก 66% วันจันทร์ ผลตอบแทนพันธบัตร 2 ปีขยับขึ้นสู่ 4.40% พันธบัตร 30 ปีปรับขึ้นสู่ 5.28% และทองคำร่วงต่อลงสู่ $4,358.74 (ลดลง 1.86%) ต่ำสุดในรอบสองสัปดาห์ แม้ความเสี่ยงตะวันออกกลางจะยังสูงอยู่`},
      sources:[{l:"CNBC",u:"https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"},{l:"24/7 Wall St.",u:"https://247wallst.com/cards/the-nasdaq-s-1-02-slide-was-triple-the-s-p-500-s-loss-so-t-gspc-market-bell-01m1f95kv8c17b0rdk9z8mq85y"},{l:"Trading Economics",u:"https://tradingeconomics.com/united-states/government-bond-yield"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,020", chg:-1.45, series:[26404,26020],
      txt:{en:`<b>DAX fell further to 26,020 Tuesday (about −1.45%),</b> its second straight lower close, as Trump's continued Iran threats and the fresh leg up in global bond yields hit European equities alongside Wall Street.`, th:`<b>DAX ลดลงต่อสู่ 26,020 วันอังคาร (ราว −1.45%)</b> ปิดตลาดลบเป็นวันที่สองติดต่อกัน หลังทรัมป์ยังคงขู่โจมตีอิหร่านต่อเนื่อง และผลตอบแทนพันธบัตรทั่วโลกที่ปรับขึ้นอีกระลอก กระทบหุ้นยุโรปเช่นเดียวกับวอลล์สตรีท`},
      why:{en:`Europe falling for a second straight session alongside the US, not just one, reinforces that this latest escalation is being read as a genuine global risk event, not a US-only story; that broadens the case for the bond-lock conversation beyond just US-dollar clients.`, th:`การที่ยุโรปปรับลงตามสหรัฐฯ ต่อเนื่องเป็นวันที่สอง ไม่ใช่แค่วันเดียว ตอกย้ำว่าความตึงเครียดระลอกล่าสุดนี้ถูกมองว่าเป็นความเสี่ยงระดับโลกจริง ๆ ไม่ใช่แค่เรื่องของสหรัฐฯ ซึ่งขยายเหตุผลของบทสนทนาเรื่องล็อกตราสารหนี้ให้กว้างกว่าลูกค้าที่ถือดอลลาร์เท่านั้น`},
      full:{en:`European shares fell for a second straight session Tuesday, with Germany's DAX closing around 26,020, down roughly 1.45% from Monday's 26,404 close, as President Trump's continued threats against Iran kept oil and global bond yields climbing, denting risk appetite across the region alongside a weaker Wall Street. The softer tone remained closely linked to the same energy and rates dynamics hitting US markets, with investors now watching the US August jobs report (Sep 4) for the next signal on the Fed's path.`, th:`หุ้นยุโรปปรับลงต่อเนื่องเป็นวันที่สองวันอังคาร ดัชนี DAX เยอรมนีปิดตลาดที่ราว 26,020 ลดลงประมาณ 1.45% จากระดับปิด 26,404 เมื่อวันจันทร์ หลังทรัมป์ยังคงขู่โจมตีอิหร่านต่อเนื่อง ดันราคาน้ำมันและผลตอบแทนพันธบัตรทั่วโลกให้สูงขึ้นต่อ กดดันความเสี่ยงในการลงทุนทั่วภูมิภาคเช่นเดียวกับวอลล์สตรีทที่อ่อนแอลง บรรยากาศที่นุ่มลงนี้ยังคงเชื่อมโยงกับปัจจัยพลังงานและดอกเบี้ยเดียวกันที่กระทบตลาดสหรัฐฯ ขณะนักลงทุนตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ (4 ก.ย.) เป็นสัญญาณถัดไปสำหรับทิศทางเฟด`},
      sources:[{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"},{l:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-09-01/stock-market-today-dow-s-p-live-updates"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"66,185.83", chg:-0.19, series:[66311.93,66185.83],
      txt:{en:`<b>Nikkei 225 slipped a further 0.19% to 66,185.83 Tuesday,</b> a second modest pullback as investors weighed continued Trump-Iran tension and higher US yields, though the decline stayed far smaller than Wall Street's.`, th:`<b>Nikkei 225 ลดลงต่ออีก 0.19% สู่ 66,185.83 วันอังคาร</b> ย่อตัวเล็กน้อยเป็นวันที่สอง ขณะนักลงทุนประเมินความตึงเครียดทรัมป์-อิหร่านที่ยังต่อเนื่องและผลตอบแทนพันธบัตรสหรัฐฯ ที่สูงขึ้น แม้การปรับลงจะยังน้อยกว่าวอลล์สตรีทมาก`},
      why:{en:`Japan giving back only a fraction of what US stocks lost, for a second straight session, is another sign this Iran/oil/rates shock is hitting rate-sensitive US names hardest rather than broad global equities — useful context for clients who assume a US selloff automatically means Asia sells off in equal measure.`, th:`การที่ญี่ปุ่นคืนกำไรเพียงเศษเสี้ยวของที่หุ้นสหรัฐฯ เสียไป ต่อเนื่องเป็นวันที่สอง เป็นอีกสัญญาณว่าแรงกระแทกจากอิหร่าน/น้ำมัน/ดอกเบี้ยครั้งนี้กระทบหุ้นสหรัฐฯ กลุ่มอ่อนไหวต่อดอกเบี้ยหนักที่สุด มากกว่าหุ้นโลกในวงกว้าง — เป็นบริบทที่มีประโยชน์สำหรับลูกค้าที่คิดว่าหุ้นสหรัฐฯ ร่วง เอเชียต้องร่วงตามในสัดส่วนเท่ากัน`},
      full:{en:`Asian equities were softer again Tuesday, following Wall Street's tech-led decline as chip stocks bore the brunt of the selling amid continued Trump-Iran tension. Japan's Nikkei 225 fell about 126 points (-0.19%) to close at 66,185.83, a far smaller decline than the Nasdaq's 1.03% drop, as investors weighed the oil-driven inflation risk against still-solid corporate earnings. The move came even as US-listed chip names stayed under pressure from the same rate repricing that has pushed September Fed hike odds to 68%. Markets across the region now look to the US August jobs report on September 4 and the Fed's September 16 meeting for the next signal.`, th:`หุ้นเอเชียอ่อนตัวลงอีกครั้งวันอังคาร ตามการปรับลงของวอลล์สตรีทที่นำโดยหุ้นเทค โดยหุ้นกลุ่มชิปรับแรงเทขายหนักที่สุด ท่ามกลางความตึงเครียดทรัมป์-อิหร่านที่ยังต่อเนื่อง ดัชนี Nikkei 225 ญี่ปุ่นลดลงราว 126 จุด (-0.19%) ปิดที่ 66,185.83 ลดลงน้อยกว่า Nasdaq ที่ร่วง 1.03% มาก ขณะนักลงทุนชั่งน้ำหนักความเสี่ยงเงินเฟ้อจากน้ำมันเทียบกับผลประกอบการบริษัทที่ยังแข็งแกร่ง การเคลื่อนไหวนี้เกิดขึ้นแม้หุ้นชิปที่จดทะเบียนในสหรัฐฯ จะยังถูกกดดันจากการปรับคาดการณ์ดอกเบี้ยเดียวกันที่ดันโอกาสขึ้นดอกเบี้ยเดือน ก.ย. สู่ 68% ตลาดทั่วภูมิภาคตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. และการประชุมเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"Investing.com",u:"https://www.investing.com/news/stock-market-news/japan-stocks-lower-at-close-of-trade-nikkei-225-down-019-4883546"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"},{l:"Trading Economics",u:"https://tradingeconomics.com/japan/stock-market"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,324", chg:-0.95, series:[25566.99,25324],
      txt:{en:`<b>Hang Seng fell 0.95% to 25,324 Tuesday,</b> its sharpest drop this week as property-sector weakness compounded the Iran/oil/rates pressure, while mainland China's <b>Shanghai Composite eased 0.16% to 3,979.9,</b> giving back a slice of Monday's rally.`, th:`<b>Hang Seng ลดลง 0.95% สู่ 25,324 วันอังคาร</b> ปรับลงแรงที่สุดในสัปดาห์นี้ หลังความอ่อนแอของภาคอสังหาริมทรัพย์ซ้อนทับแรงกดดันจากอิหร่าน/น้ำมัน/ดอกเบี้ย ขณะ <b>Shanghai Composite จีนแผ่นดินใหญ่ลดลง 0.16% สู่ 3,979.9</b> คืนกำไรบางส่วนจากวันจันทร์`},
      why:{en:`Hong Kong now falling in step with — and even sharper than — Wall Street's decline, after two prior sessions of relative insulation, is a signal that regional risk appetite is genuinely turning; that broadens the case for defensive positioning beyond just US-dollar clients.`, th:`การที่ฮ่องกงเริ่มปรับลงสอดคล้องกับ — และแรงกว่า — การปรับลงของวอลล์สตรีท หลังจากที่แยกตัวได้ค่อนข้างดีในสองวันก่อนหน้า เป็นสัญญาณว่าความเสี่ยงในภูมิภาคกำลังเปลี่ยนทิศทางจริง ๆ ซึ่งขยายเหตุผลของการจัดพอร์ตเชิงตั้งรับให้กว้างกว่าลูกค้าที่ถือดอลลาร์เท่านั้น`},
      full:{en:`Greater China markets softened Tuesday as President Trump's continued Iran threats and rising US Treasury yields pressured Wall Street and Europe. Hong Kong's Hang Seng fell 0.95% to 25,324, its steepest one-day drop this week, with property developers and tech names among the laggards, while the Shanghai Composite eased 0.16% to 3,979.9, giving back a slice of Monday's 0.86% rally as onshore investors turned more cautious. Markets across the region now look to the US August jobs report on September 4 and the Fed's September 16 meeting for the next signal.`, th:`ตลาดจีนและฮ่องกงอ่อนตัวลงวันอังคาร หลังทรัมป์ยังคงขู่โจมตีอิหร่านต่อเนื่อง และผลตอบแทนพันธบัตรสหรัฐฯ ที่สูงขึ้นกดดันวอลล์สตรีทและยุโรป ดัชนี Hang Seng ฮ่องกงลดลง 0.95% สู่ 25,324 ปรับลงแรงที่สุดในสัปดาห์นี้ โดยหุ้นกลุ่มพัฒนาอสังหาริมทรัพย์และเทคโนโลยีเป็นกลุ่มที่ปรับลงมากที่สุด ขณะ Shanghai Composite ลดลง 0.16% สู่ 3,979.9 คืนกำไรบางส่วนจากที่พุ่งขึ้น 0.86% เมื่อวันจันทร์ หลังนักลงทุนในประเทศระมัดระวังมากขึ้น ตลาดทั่วภูมิภาคตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. และการประชุมเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"Trading Economics",u:"https://tradingeconomics.com/hong-kong/stock-market"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"},{l:"Trading Economics",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,588.68", chg:-0.41, series:[1595.16,1588.68],
      txt:{en:`<b>SET Index slipped 0.41% to 1,588.68 Tuesday (−6.48pts),</b> on turnover of about THB 72.56bn, breaking Monday's rebound as the global Iran/oil/rates story reasserted itself.`, th:`<b>ดัชนี SET ลดลง 0.41% สู่ 1,588.68 วันอังคาร (−6.48 จุด)</b> มูลค่าการซื้อขายราว 7.256 หมื่นล้านบาท หยุดการฟื้นตัวของวันจันทร์ หลังปัจจัยอิหร่าน/น้ำมัน/ดอกเบี้ยระดับโลกกลับมากดดันอีกครั้ง`},
      why:{en:`The SET giving back Monday's bounce, in a much smaller move than Wall Street's, is a reminder that Thai equities aren't simply a leveraged play on global risk sentiment right now — useful for clients who assume every US-driven selloff automatically hits their local holdings equally.`, th:`การที่ SET คืนกำไรของวันจันทร์กลับไป ด้วยการปรับลงที่น้อยกว่าวอลล์สตรีทมาก เป็นเครื่องเตือนใจว่าหุ้นไทยตอนนี้ไม่ได้เคลื่อนไหวตามความเสี่ยงโลกแบบทวีคูณเสมอไป — มีประโยชน์สำหรับลูกค้าที่คิดว่าการเทขายที่นำโดยสหรัฐฯ ทุกครั้งต้องกระทบพอร์ตในประเทศเท่า ๆ กัน`},
      full:{en:`Thailand's SET Index closed Tuesday at 1,588.68, down 6.48 points (-0.41%), on turnover of about THB 72.56 billion, breaking Monday's rebound as President Trump's continued Iran threats and rising US Treasury yields kept weighing on Wall Street and Europe. The pullback was far shallower than the declines in the US and Hong Kong, though brokers continue to flag the Fed's rate path as the key swing factor for regional flows. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity, with the next major catalyst being the US August jobs report on September 4 ahead of the Fed's September 16 decision.`, th:`ดัชนี SET ของไทยปิดตลาดวันอังคารที่ 1,588.68 ลดลง 6.48 จุด (-0.41%) มูลค่าการซื้อขายราว 7.256 หมื่นล้านบาท หยุดการฟื้นตัวของวันจันทร์ หลังทรัมป์ยังคงขู่โจมตีอิหร่านต่อเนื่อง และผลตอบแทนพันธบัตรสหรัฐฯ ที่สูงขึ้นยังคงกดดันวอลล์สตรีทและยุโรป การปรับลงนี้เบากว่าการปรับลงของสหรัฐฯ และฮ่องกงมาก แม้โบรกเกอร์จะยังคงระบุว่าทิศทางดอกเบี้ยของเฟดเป็นปัจจัยแกว่งสำคัญของกระแสเงินในภูมิภาค เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว โดยปัจจัยขับเคลื่อนสำคัญถัดไปคือรายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`},
      sources:[{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/589883"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil extended its climb Tuesday — Brent +0.87% to $91.28/bbl —</b> as President Trump's continued Iran threats kept energy-inflation risk live in markets. <b>Gold extended its slide to $4,358.74 (−1.86%), a two-week low,</b> as a stronger dollar and rate-hike bets kept outweighing the safe-haven bid even with Mideast risk still elevated.`, th:`<b>น้ำมันขยับขึ้นต่อวันอังคาร — เบรนท์เพิ่มขึ้น 0.87% สู่ $91.28 ต่อบาร์เรล</b> ขณะทรัมป์ยังคงขู่โจมตีอิหร่านต่อเนื่อง ทำให้ความเสี่ยงเงินเฟ้อด้านพลังงานยังคงมีน้ำหนักในตลาด <b>ทองคำร่วงต่อลงสู่ $4,358.74 (ลดลง 1.86%) ต่ำสุดในรอบสองสัปดาห์</b> เนื่องจากดอลลาร์ที่แข็งค่าและแรงเดิมพันขึ้นดอกเบี้ยยังคงมีน้ำหนักมากกว่าแรงซื้อสินทรัพย์ปลอดภัย แม้ความเสี่ยงตะวันออกกลางจะยังสูงอยู่`},
     why:{en:`Three straight sessions of oil grinding higher on a live presidential threat, not a single acknowledged action, is a step up in escalation risk — and gold still falling despite it tells clients the market currently weighs the rate story above the geopolitical one, which is exactly the kind of gap that can close fast and violently if either side blinks.`, th:`น้ำมันปรับขึ้นต่อเนื่องสามวันติดต่อกันจากการขู่โจมตีของประธานาธิบดีที่ยังคงดำเนินอยู่ ไม่ใช่แค่ปฏิบัติการเดียวที่ยืนยันแล้ว เป็นการยกระดับความเสี่ยงขึ้นไปอีกขั้น และการที่ทองคำยังคงร่วงแม้จะมีเหตุการณ์นี้ บอกลูกค้าว่าตลาดตอนนี้ให้น้ำหนักเรื่องดอกเบี้ยมากกว่าภูมิรัฐศาสตร์ ซึ่งเป็นช่องว่างที่อาจปิดลงอย่างรวดเร็วและรุนแรงได้ หากฝ่ายใดฝ่ายหนึ่งอ่อนข้อหรือยกระดับต่อ`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 10-year Treasury yield closed at 4.79% Tuesday, its fifth consecutive daily rise and the highest since January 2025,</b> as oil-driven inflation risk kept compounding. <b>CME FedWatch now shows a 68% chance of a September hike, up from 66% Monday and ~35% before Jackson Hole.</b> The <b>2-year yield rose to 4.40%,</b> and the <b>30-year climbed to 5.28%.</b>`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีปิดที่ 4.79% วันอังคาร ขึ้นต่อเนื่องเป็นวันที่ห้าติดต่อกัน สูงสุดตั้งแต่เดือน ม.ค. 2025</b> หลังความเสี่ยงเงินเฟ้อจากน้ำมันยังคงซ้อนทับต่อเนื่อง <b>CME FedWatch ตอนนี้ชี้โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ 68% เพิ่มขึ้นจาก 66% วันจันทร์ และราว 35% ก่อน Jackson Hole</b> ผลตอบแทนพันธบัตร <b>2 ปีขยับขึ้นสู่ 4.40%</b> และ <b>30 ปีปรับขึ้นสู่ 5.28%</b>`},
     why:{en:`A near-certain hike is no longer a forecast, it's what the market is now pricing — and five straight days of a rising 10-year mean the "closing window" on today's coupons keeps narrowing by the day. This is the moment to move client bond conversations from "consider" to "act."`, th:`การขึ้นดอกเบี้ยที่เกือบจะแน่นอนแล้วไม่ใช่แค่การคาดการณ์อีกต่อไป แต่เป็นสิ่งที่ตลาดกำลังสะท้อนอยู่จริง — และการที่พันธบัตร 10 ปีปรับขึ้นต่อเนื่องห้าวันติดต่อกัน หมายความว่า "หน้าต่างโอกาสที่กำลังจะปิด" ของคูปองวันนี้แคบลงทุกวัน นี่คือจังหวะที่ควรเปลี่ยนบทสนทนาเรื่องตราสารหนี้กับลูกค้าจาก "พิจารณา" เป็น "ลงมือทำ"`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Tariff risk hasn't gone away — Section 338 tariffs on Canadian imports took effect Aug 22, and a possible new ~7.5% China "overcapacity" tariff remains live ahead of a planned Trump-Xi summit — but the president's focus this week remains Iran, not trade: <b>his continued strike threats, not tariff news, are still driving oil and rates.</b> A reminder that clients' portfolios face several live, largely independent risks right now: tariffs, rates and geopolitics.`, th:`ความเสี่ยงภาษียังไม่หายไป — มาตรการภาษีมาตรา 338 ต่อสินค้านำเข้าจากแคนาดามีผลบังคับใช้ตั้งแต่ 22 ส.ค. และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้ — แต่ประเด็นหลักของทรัมป์สัปดาห์นี้ยังคงเป็นอิหร่าน ไม่ใช่การค้า <b>การขู่โจมตีที่ยังต่อเนื่องของเขา ไม่ใช่ข่าวภาษี ยังคงเป็นปัจจัยที่ขับเคลื่อนน้ำมันและดอกเบี้ย</b> เป็นเครื่องเตือนใจว่าพอร์ตของลูกค้ากำลังเผชิญความเสี่ยงที่ยังคุกรุ่นอยู่หลายด้านซึ่งค่อนข้างเป็นอิสระต่อกัน คือภาษี ดอกเบี้ย และภูมิรัฐศาสตร์`}, w:{en:`With tariff risk still simmering in the background, the Fed now hawkish, and Iran escalating for a third straight session, this is a good week to reinforce that diversified, bond-anchored portfolios remain the right hedge against any of these headlines resurfacing — clients shouldn't assume one risk cancels out the others.`, th:`เมื่อความเสี่ยงภาษียังคุกรุ่นอยู่เบื้องหลัง เฟดก็หันมาส่งสัญญาณเหยี่ยว และอิหร่านก็ยกระดับความตึงเครียดต่อเนื่องเป็นวันที่สาม สัปดาห์นี้เป็นจังหวะดีที่จะย้ำกับลูกค้าว่าพอร์ตที่กระจายความเสี่ยงและมีตราสารหนี้เป็นหลักยังคงเป็นเกราะป้องกันที่เหมาะสมหากข่าวใดข่าวหนึ่งกลับมา ลูกค้าไม่ควรคิดว่าความเสี่ยงหนึ่งจะหักล้างความเสี่ยงอื่น ๆ`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>The Iran standoff extended to a third straight session Tuesday:</b> with President Trump's strike threats still live, oil benchmarks kept climbing — Brent closed at $91.28 (+0.87%), its third consecutive daily gain — even as markets found no fresh sign of de-escalation.`, th:`<b>ความตึงเครียดกับอิหร่านยืดเยื้อต่อเนื่องเป็นวันที่สามวันอังคาร:</b> เมื่อการขู่โจมตีของทรัมป์ยังคงมีผลอยู่ ราคาน้ำมันยังคงปรับขึ้นต่อ — เบรนท์ปิดที่ $91.28 (เพิ่มขึ้น 0.87%) ปรับขึ้นต่อเนื่องเป็นวันที่สามติดต่อกัน — แม้ตลาดจะยังไม่เห็นสัญญาณคลี่คลายใหม่`}, w:{en:`Three straight sessions without de-escalation, not just one open threat, raises the odds that this becomes a sustained oil/inflation overhang rather than a headline that fades. That's the clearest argument yet for keeping both gold and bond ballast in client portfolios rather than treating the Iran standoff as already priced in.`, th:`สามวันติดต่อกันโดยไม่มีสัญญาณคลี่คลาย ไม่ใช่แค่การขู่โจมตีครั้งเดียว เพิ่มโอกาสที่เรื่องนี้จะกลายเป็นแรงกดดันน้ำมัน/เงินเฟ้อที่ยืดเยื้อ มากกว่าจะเป็นแค่พาดหัวข่าวที่จางหายไป นี่คือเหตุผลที่ชัดเจนที่สุดจนถึงตอนนี้ให้คงทั้งทองคำและตราสารหนี้เป็นตัวถ่วงสมดุลในพอร์ตลูกค้า แทนที่จะมองว่าความตึงเครียดกับอิหร่านราคาสะท้อนไปหมดแล้ว`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`<b>The 10-year Treasury yield closed at 4.79% Tuesday, its fifth consecutive daily rise and the highest since January 2025.</b> <b>September rate-hike odds rose again to 68%,</b> from 66% Monday and ~35% before Jackson Hole, per CME FedWatch. The 2-year yield rose to 4.40%, and the 30-year climbed to 5.28%.`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีปิดที่ 4.79% วันอังคาร ขึ้นต่อเนื่องเป็นวันที่ห้าติดต่อกัน สูงสุดตั้งแต่เดือน ม.ค. 2025</b> <b>โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ปรับขึ้นอีกครั้งสู่ 68%</b> จาก 66% วันจันทร์ และราว 35% ก่อน Jackson Hole ตามข้อมูล CME FedWatch ผลตอบแทนพันธบัตร 2 ปีขยับขึ้นสู่ 4.40% และพันธบัตร 30 ปีปรับขึ้นสู่ 5.28%`}, w:{en:`A near coin-flip has become a near-certainty over five straight trading days — the fastest sustained repricing of the year — and it argues for locking in today's still-rising coupons now, ahead of the next major catalyst: the August jobs report on September 4, before the Fed's September 16 decision.`, th:`จากครึ่งต่อครึ่งกลายเป็นเกือบแน่นอนตลอดห้าวันทำการติดต่อกัน — การปรับคาดการณ์ต่อเนื่องที่เร็วที่สุดของปีนี้ — สนับสนุนให้ล็อกคูปองที่ยังปรับขึ้นต่อเนื่องวันนี้ ก่อนปัจจัยขับเคลื่อนสำคัญถัดไป: รายงานการจ้างงานเดือน ส.ค. วันที่ 4 ก.ย. ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`Oil's third straight daily gain — Brent now at $91.28, up from $88.58 last Thursday — keeps stacking a fresh, independent inflation risk on top of Fed Chair Warsh's warning that recent PCE and CPI readings <b>"do not tell me that underlying trends have meaningfully improved."</b> Two separate inflation drivers, energy and "underlying" price pressure, are still pointing the same direction at once.`, th:`น้ำมันที่ปรับขึ้นต่อเนื่องเป็นวันที่สาม — เบรนท์ตอนนี้อยู่ที่ $91.28 เพิ่มขึ้นจาก $88.58 เมื่อวันพฤหัสฯ ที่ผ่านมา — ยังคงซ้อนทับความเสี่ยงเงินเฟ้อใหม่ที่เป็นอิสระต่อกัน บนคำเตือนของประธานเฟดวอร์ชที่ว่าตัวเลข PCE และ CPI ล่าสุด <b>"ไม่ได้บอกผมว่าแนวโน้มพื้นฐานดีขึ้นอย่างมีนัยสำคัญ"</b> ตอนนี้ปัจจัยเงินเฟ้อสองด้านที่แยกจากกัน คือพลังงานและแรงกดดันราคา "พื้นฐาน" ยังคงชี้ไปทิศทางเดียวกันพร้อมกัน`}, w:{en:`When an energy shock keeps building for a third straight day on top of an already-hawkish Fed chair, that's the clearest "don't get complacent on rates" talking point so far this year — pair any growth-fund conversation with a reminder that the bond case hasn't weakened, it's gotten measurably stronger.`, th:`เมื่อแรงกระแทกจากพลังงานยังคงสะสมต่อเนื่องเป็นวันที่สาม ซ้อนทับบนท่าทีเหยี่ยวของประธานเฟดที่มีอยู่แล้ว นี่คือประเด็นที่ชัดเจนที่สุดให้ "อย่าประมาทเรื่องดอกเบี้ย" ของปีนี้จนถึงตอนนี้ — เมื่อคุยเรื่องกองทุนเติบโตกับลูกค้า ควรย้ำด้วยว่าเหตุผลด้านตราสารหนี้ไม่ได้อ่อนลง แต่แข็งแกร่งขึ้นอย่างชัดเจน`}},
  ];

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`<div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div><div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div><div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน และค่าเงิน':'US Treasuries, gold, oil & FX',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p>${f.now?`<div class="fnow"><span>${L==='th'?'ทำไมตอนนี้':'Why now'}</span>${t(f.now)}</div>`:''}<div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');
    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
