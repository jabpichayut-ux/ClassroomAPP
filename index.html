<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Bank of Japan Hikes to 1.25%, Highest Since 1995, as Asia Rallies and Germany's DAX Tumbles 1.65% — Wall Street Ends a Choppy Week Little Changed", th:"BOJ ขึ้นดอกเบี้ยสู่ 1.25% สูงสุดนับตั้งแต่ปี 1995 เอเชียดีดตัว ขณะ DAX เยอรมนีร่วง 1.65% — วอลล์สตรีทปิดสัปดาห์ผันผวนด้วยการเปลี่ยนแปลงเล็กน้อย"},
    heroDeck:{en:`The Bank of Japan raised its policy rate a quarter point to 1.25% on Friday — its highest level since 1995 — in a widely expected move (all 52 economists surveyed by Bloomberg had called it) that nonetheless produced two dovish dissents alongside a mildly hawkish statement, leaving investors guessing about the pace of further hikes. Japan's Nikkei 225 rallied 1.38% to 65,018.95 on relief the decision wasn't more hawkish, Hong Kong's Hang Seng added 0.60% to 24,750.78 and mainland China's Shanghai Composite rose 0.94% to 3,911.87. Europe read it very differently: Germany's DAX tumbled 1.65% to 25,308.88, its lowest since late July, led by autos (Volkswagen -5.97%, Porsche -5.19%, Mercedes-Benz -4.76%) as a firmer yen and rising global yields squeezed exporters. Wall Street closed a choppy week little changed — the Dow slipped 95.40 points (-0.18%) to 51,682.64, down more than 1.5% on the week and a third straight weekly loss, while the S&P 500 edged up 0.17% to 7,650.50 and the Nasdaq Composite added 0.39% to 26,522.55. The 10-year Treasury yield backed up toward 5% again (last near 5.01%, +6bp) after Thursday's dip, with the 2-year near 4.74%; oil held steady (WTI near $100.90/bbl, Brent near $104.33/bbl) while gold extended its rally to $4,368.60/oz (+0.6%), touching a weekly high above $4,400 intraday as the Fed's hike and softer oil tempered inflation fears. Thailand's SET Index was essentially flat, up 0.05% (+0.81 pts) to 1,584.15 on turnover of about THB 71.44bn. On trade, Trump kept up the pressure this week — barring Canadian goods from US government purchases and floating fresh EU tariffs — while Washington's broader tariff schedule, including a 100% default duty on patented pharmaceuticals, takes full effect Sep 29.`, th:`ธนาคารกลางญี่ปุ่น (BOJ) ขึ้นอัตราดอกเบี้ยนโยบาย 0.25% สู่ระดับ 1.25% ในวันศุกร์ — สูงสุดนับตั้งแต่ปี 1995 — เป็นการตัดสินใจที่ตลาดคาดการณ์ไว้แล้ว (นักเศรษฐศาสตร์ทั้ง 52 คนที่ Bloomberg สำรวจต่างคาดการณ์ตรงกัน) แต่ก็ยังมีกรรมการ 2 เสียงคัดค้านในเชิงผ่อนคลาย ควบคู่กับแถลงการณ์ที่ออกแนวสายเหยี่ยวเล็กน้อย ทำให้นักลงทุนยังไม่แน่ใจเรื่องจังหวะการขึ้นดอกเบี้ยครั้งต่อไป ดัชนี Nikkei 225 ของญี่ปุ่นดีดตัวขึ้น 1.38% สู่ 65,018.95 จากความโล่งใจที่ผลการตัดสินใจไม่สายเหยี่ยวมากไปกว่านี้ ดัชนี Hang Seng ฮ่องกงเพิ่มขึ้น 0.60% สู่ 24,750.78 และดัชนี Shanghai Composite จีนแผ่นดินใหญ่เพิ่มขึ้น 0.94% สู่ 3,911.87 ขณะที่ยุโรปตีความต่างออกไปอย่างสิ้นเชิง: ดัชนี DAX เยอรมนีร่วง 1.65% สู่ 25,308.88 ต่ำสุดนับตั้งแต่ปลายเดือนกรกฎาคม นำโดยหุ้นกลุ่มยานยนต์ (Volkswagen -5.97%, Porsche -5.19%, Mercedes-Benz -4.76%) เมื่อเยนที่แข็งค่าขึ้นและผลตอบแทนพันธบัตรทั่วโลกที่สูงขึ้นบีบกลุ่มผู้ส่งออก วอลล์สตรีทปิดสัปดาห์ที่ผันผวนด้วยการเปลี่ยนแปลงเพียงเล็กน้อย — ดัชนี Dow ลดลง 95.40 จุด (-0.18%) สู่ 51,682.64 ลดลงมากกว่า 1.5% ในรอบสัปดาห์ นับเป็นสัปดาห์ที่ปรับลงติดต่อกันเป็นสัปดาห์ที่สาม ขณะดัชนี S&P 500 ขยับขึ้น 0.17% สู่ 7,650.50 และดัชนี Nasdaq Composite เพิ่มขึ้น 0.39% สู่ 26,522.55 ผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นใกล้ 5% อีกครั้ง (ล่าสุดใกล้ 5.01% เพิ่มขึ้น 6bp) หลังย่อตัวลงเมื่อวันพฤหัสบดี ขณะพันธบัตร 2 ปียืนใกล้ 4.74% ราคาน้ำมันทรงตัว (WTI ใกล้ $100.90 ต่อบาร์เรล เบรนท์ใกล้ $104.33 ต่อบาร์เรล) ขณะทองคำขยายการปรับขึ้นต่อเนื่องสู่ $4,368.60 ต่อออนซ์ (+0.6%) แตะระดับสูงสุดในรอบสัปดาห์เหนือ $4,400 ระหว่างวัน เมื่อการขึ้นดอกเบี้ยของเฟดและราคาน้ำมันที่อ่อนตัวลงช่วยคลายความกังวลด้านเงินเฟ้อ ดัชนี SET ไทยแทบไม่เปลี่ยนแปลง เพิ่มขึ้น 0.05% (+0.81 จุด) สู่ 1,584.15 มูลค่าการซื้อขายราว 7.144 หมื่นล้านบาท ด้านการค้า ทรัมป์ยังคงกดดันต่อเนื่องสัปดาห์นี้ — สั่งห้ามสินค้าแคนาดาเข้าร่วมการจัดซื้อของรัฐบาลสหรัฐฯ และส่งสัญญาณภาษีศุลกากรใหม่ต่อสหภาพยุโรป — ขณะตารางภาษีศุลกากรที่กว้างขึ้นของสหรัฐฯ รวมถึงอัตราภาษีเริ่มต้น 100% สำหรับยาที่มีสิทธิบัตร จะมีผลบังคับใช้เต็มรูปแบบวันที่ 29 ก.ย.`},

    leadtxt:{en:`<b>The Bank of Japan hiked to 1.25% Friday — its highest since 1995 — and Asia cheered while Europe recoiled: Japan's Nikkei jumped 1.38% to 65,018.95, Hong Kong's Hang Seng added 0.60% and Shanghai rose 0.94%, but Germany's DAX tumbled 1.65% to 25,308.88 as autos led the selloff.</b> Wall Street closed a choppy, third-straight losing week little changed — the Dow eased 0.18% to 51,682.64, the S&P 500 edged up 0.17% to 7,650.50, and the Nasdaq added 0.39% to 26,522.55 — as the 10-year Treasury yield backed up toward 5% again (~5.01%) after Thursday's dip. Oil held steady (WTI ~$100.90, Brent ~$104.33) while gold extended its rally to $4,368.60/oz, touching a weekly high above $4,400 intraday. Thailand's SET was flat at 1,584.15. On trade, Trump barred Canadian goods from US government purchases and floated fresh EU tariffs, while Washington's broader tariff schedule — including a 100% default duty on patented pharmaceuticals — takes full effect Sep 29. For your clients: <b>the BOJ's mixed signal (a hike, but two dovish dissents) is the story to watch into next week — it argues for a slower, more uneven path of further hikes than Friday's headline number alone suggests, and Europe's auto-led selloff shows a stronger yen and firmer global yields are already being felt outside Japan.</b>`, th:`<b>ธนาคารกลางญี่ปุ่นขึ้นดอกเบี้ยสู่ 1.25% วันศุกร์ — สูงสุดนับตั้งแต่ปี 1995 — เอเชียตอบรับเชิงบวกขณะยุโรปสะดุ้ง: ดัชนี Nikkei ญี่ปุ่นพุ่งขึ้น 1.38% สู่ 65,018.95 ดัชนี Hang Seng ฮ่องกงเพิ่มขึ้น 0.60% และ Shanghai เพิ่มขึ้น 0.94% แต่ดัชนี DAX เยอรมนีร่วง 1.65% สู่ 25,308.88 จากแรงเทขายที่นำโดยกลุ่มยานยนต์</b> วอลล์สตรีทปิดสัปดาห์ที่ผันผวนและปรับลงติดต่อกันเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเพียงเล็กน้อย — ดัชนี Dow ลดลง 0.18% สู่ 51,682.64 ดัชนี S&P 500 ขยับขึ้น 0.17% สู่ 7,650.50 และดัชนี Nasdaq เพิ่มขึ้น 0.39% สู่ 26,522.55 — ขณะผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นใกล้ 5% อีกครั้ง (ราว 5.01%) หลังย่อตัวลงเมื่อวันพฤหัสบดี ราคาน้ำมันทรงตัว (WTI ราว $100.90, เบรนท์ราว $104.33) ขณะทองคำขยายการปรับขึ้นต่อเนื่องสู่ $4,368.60 ต่อออนซ์ แตะระดับสูงสุดในรอบสัปดาห์เหนือ $4,400 ระหว่างวัน ดัชนี SET ไทยแทบไม่เปลี่ยนแปลงที่ 1,584.15 ด้านการค้า ทรัมป์สั่งห้ามสินค้าแคนาดาเข้าร่วมการจัดซื้อของรัฐบาลสหรัฐฯ และส่งสัญญาณภาษีศุลกากรใหม่ต่อสหภาพยุโรป ขณะตารางภาษีศุลกากรที่กว้างขึ้นของสหรัฐฯ — รวมถึงอัตราภาษีเริ่มต้น 100% สำหรับยาที่มีสิทธิบัตร — จะมีผลบังคับใช้เต็มรูปแบบวันที่ 29 ก.ย. สำหรับลูกค้าของคุณ: <b>สัญญาณผสมของ BOJ (ขึ้นดอกเบี้ยแต่มี 2 เสียงคัดค้านเชิงผ่อนคลาย) คือเรื่องที่ต้องจับตาต่อในสัปดาห์หน้า — มันบ่งชี้เส้นทางการขึ้นดอกเบี้ยครั้งต่อไปที่ช้าลงและไม่สม่ำเสมอมากกว่าที่ตัวเลขหลักวันศุกร์บ่งชี้เพียงอย่างเดียว และแรงเทขายกลุ่มยานยนต์ในยุโรปแสดงให้เห็นว่าเยนที่แข็งค่าขึ้นและผลตอบแทนพันธบัตรทั่วโลกที่สูงขึ้นเริ่มส่งผลกระทบนอกประเทศญี่ปุ่นแล้ว</b>`},

    watchnote:{en:`The Bank of Japan raised its policy rate to 1.25% Friday — its highest since 1995 — a widely expected move that still carried two dovish dissents and a mildly hawkish statement, leaving the pace of further hikes uncertain (the BOJ's summary of opinions from the meeting is due Oct 1). Asia rallied on the news (Nikkei +1.38%, Hang Seng +0.60%, Shanghai +0.94%) while Germany's DAX tumbled 1.65% on an auto-led selloff, and Wall Street closed a third straight losing week little changed as the 10-year Treasury yield backed up toward 5% again. Markets are closed for the weekend. <b style="color:var(--muted)">Monday's Asia and Europe open</b> is the next test — watch whether the region extends Friday's BOJ relief or follows Europe's more cautious read, alongside any weekend headlines on tariffs.`,
      th:`ธนาคารกลางญี่ปุ่นขึ้นอัตราดอกเบี้ยนโยบายสู่ 1.25% วันศุกร์ — สูงสุดนับตั้งแต่ปี 1995 — เป็นการตัดสินใจที่ตลาดคาดการณ์ไว้แล้ว แต่ยังมีกรรมการ 2 เสียงคัดค้านเชิงผ่อนคลาย และแถลงการณ์ที่ออกแนวสายเหยี่ยวเล็กน้อย ทำให้จังหวะการขึ้นดอกเบี้ยครั้งต่อไปยังไม่แน่นอน (เอกสารสรุปความเห็นจากการประชุมของ BOJ จะเผยแพร่วันที่ 1 ต.ค.) ตลาดเอเชียดีดตัวรับข่าว (Nikkei +1.38%, Hang Seng +0.60%, Shanghai +0.94%) ขณะดัชนี DAX เยอรมนีร่วง 1.65% จากแรงเทขายกลุ่มยานยนต์ และวอลล์สตรีทปิดสัปดาห์ที่ปรับลงติดต่อกันเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเพียงเล็กน้อย ขณะผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นใกล้ 5% อีกครั้ง ตลาดปิดทำการช่วงสุดสัปดาห์ <b style="color:var(--muted)">การเปิดตลาดเอเชียและยุโรปวันจันทร์</b> คือบททดสอบถัดไป — ควรจับตาว่าภูมิภาคจะต่อยอดความโล่งใจจาก BOJ ของวันศุกร์ หรือจะตีความอย่างระมัดระวังตามแนวทางของยุโรป รวมถึงข่าวสารใด ๆ ในช่วงสุดสัปดาห์เกี่ยวกับภาษีศุลกากร`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป เอเชีย และไทย วันศุกร์ที่ 18 ก.ย. หลังผลการตัดสินใจอัตราดอกเบี้ยของธนาคารกลางญี่ปุ่น ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>US stocks closed a choppy, third-straight losing week little changed Friday: the S&P 500 +0.17% to 7,650.50, the Nasdaq +0.39% to 26,522.55, while the Dow slipped 0.18% (-95.40 pts) to 51,682.64.</b> The 10-year Treasury yield backed up toward 5% again (~5.01%) as the Bank of Japan's rate hike rippled through global bond markets.`, th:`<b>หุ้นสหรัฐฯ ปิดสัปดาห์ที่ผันผวนและปรับลงติดต่อกันเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเพียงเล็กน้อยวันศุกร์: S&P 500 +0.17% สู่ 7,650.50, Nasdaq +0.39% สู่ 26,522.55 ขณะ Dow ลดลง 0.18% (-95.40 จุด) สู่ 51,682.64</b> ผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นใกล้ 5% อีกครั้ง (ราว 5.01%) เมื่อการขึ้นดอกเบี้ยของธนาคารกลางญี่ปุ่นส่งผลกระเพื่อมต่อตลาดพันธบัตรทั่วโลก`},
      why:{en:`A flat-to-mixed Friday after a volatile week suggests investors are in wait-and-see mode: the Dow's third straight weekly loss shows underlying caution even as the S&P and Nasdaq eked out gains. The real swing factor was the Bank of Japan's hike and its mixed dissent — it pushed global yields back up, which is why the 10-year snapped back above 5% just a day after dipping below it. Watch Monday's open for whether that yield pressure sticks.`, th:`วันศุกร์ที่ทรงตัวถึงคละกันหลังสัปดาห์ที่ผันผวน บ่งชี้ว่านักลงทุนอยู่ในโหมดรอดูสถานการณ์ — การที่ Dow ปรับลงติดต่อกันเป็นสัปดาห์ที่สาม แสดงความระมัดระวังที่ยังคงอยู่ แม้ S&P และ Nasdaq จะปรับขึ้นได้เล็กน้อย ปัจจัยชี้ขาดที่แท้จริงคือการขึ้นดอกเบี้ยของ BOJ และเสียงคัดค้านที่ผสมกัน ซึ่งดันผลตอบแทนพันธบัตรทั่วโลกให้สูงขึ้น จึงเป็นเหตุผลที่พันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% เพียงวันเดียวหลังจากที่หลุดระดับนี้ไป ควรจับตาการเปิดตลาดวันจันทร์ว่าแรงกดดันด้านผลตอบแทนนี้จะคงอยู่หรือไม่`},
      full:{en:`US stocks closed a volatile, third-straight losing week on a mostly quiet note Friday. The S&P 500 edged up 0.17% to 7,650.50 and the Nasdaq Composite added 0.39% to 26,522.55, while the Dow Jones Industrial Average slipped 95.40 points (-0.18%) to 51,682.64, down more than 1.5% on the week. The 10-year Treasury yield backed up toward 5% again — last near 5.01%, up roughly 6bp on the day — after dipping below that level Thursday, with the 2-year near 4.74%, as the Bank of Japan's own rate hike to 1.25% rippled through global bond markets. Oil held steady (WTI near $100.90/bbl, Brent near $104.33/bbl) while gold extended its rally to $4,368.60/oz, touching a weekly high above $4,400 intraday. On trade, President Trump barred Canadian goods from US government purchases and floated fresh EU tariffs this week, while Washington's broader tariff schedule — including a 100% default duty on patented pharmaceuticals — takes full effect September 29.`, th:`หุ้นสหรัฐฯ ปิดสัปดาห์ที่ผันผวนและปรับลงติดต่อกันเป็นสัปดาห์ที่สามด้วยบรรยากาศที่ค่อนข้างเงียบในวันศุกร์ ดัชนี S&P 500 ขยับขึ้น 0.17% สู่ 7,650.50 และดัชนี Nasdaq Composite เพิ่มขึ้น 0.39% สู่ 26,522.55 ขณะดัชนี Dow Jones ลดลง 95.40 จุด (-0.18%) สู่ 51,682.64 ลดลงมากกว่า 1.5% ในรอบสัปดาห์ ผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นใกล้ 5% อีกครั้ง — ล่าสุดใกล้ 5.01% เพิ่มขึ้นราว 6bp ในวันนั้น — หลังย่อตัวหลุดระดับดังกล่าวเมื่อวันพฤหัสบดี ขณะพันธบัตร 2 ปียืนใกล้ 4.74% เมื่อการขึ้นดอกเบี้ยของธนาคารกลางญี่ปุ่นสู่ 1.25% ส่งผลกระเพื่อมต่อตลาดพันธบัตรทั่วโลก ราคาน้ำมันทรงตัว (WTI ใกล้ $100.90 ต่อบาร์เรล เบรนท์ใกล้ $104.33 ต่อบาร์เรล) ขณะทองคำขยายการปรับขึ้นต่อเนื่องสู่ $4,368.60 ต่อออนซ์ แตะระดับสูงสุดในรอบสัปดาห์เหนือ $4,400 ระหว่างวัน ด้านการค้า ประธานาธิบดีทรัมป์สั่งห้ามสินค้าแคนาดาเข้าร่วมการจัดซื้อของรัฐบาลสหรัฐฯ และส่งสัญญาณภาษีศุลกากรใหม่ต่อสหภาพยุโรปสัปดาห์นี้ ขณะตารางภาษีศุลกากรที่กว้างขึ้นของสหรัฐฯ — รวมถึงอัตราภาษีเริ่มต้น 100% สำหรับยาที่มีสิทธิบัตร — จะมีผลบังคับใช้เต็มรูปแบบวันที่ 29 กันยายน`},
      sources:[{l:"CNBC — Stock market news for Sept. 18, 2026",u:"https://www.cnbc.com/2026/09/17/stock-market-today-live-updates.html"},{l:"Japan Times — Bank of Japan raises rates and offers mixed signals about next move higher",u:"https://www.japantimes.co.jp/business/2026/09/18/economy/boj-meeting-september/"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,308.88", chg:-1.65, series:[25538.00,25308.88],
      txt:{en:`<b>Germany's DAX tumbled 1.65% to 25,308.88 Friday, its lowest since late July,</b> led by autos — Volkswagen -5.97%, Porsche -5.19%, Mercedes-Benz -4.76% — as a firmer yen and rising global yields following the Bank of Japan's rate hike squeezed exporters.`, th:`<b>ดัชนี DAX เยอรมนีร่วง 1.65% สู่ 25,308.88 วันศุกร์ ต่ำสุดนับตั้งแต่ปลายเดือนกรกฎาคม</b> นำโดยกลุ่มยานยนต์ — Volkswagen -5.97%, Porsche -5.19%, Mercedes-Benz -4.76% — เมื่อเยนที่แข็งค่าขึ้นและผลตอบแทนพันธบัตรทั่วโลกที่สูงขึ้นหลังธนาคารกลางญี่ปุ่นขึ้นดอกเบี้ย บีบกลุ่มผู้ส่งออก`},
      why:{en:`Europe's selloff was the sharpest reaction anywhere to the BOJ's decision — a stronger yen makes Japanese cars more competitive against German rivals, and the global bond-yield backup that followed the hike raised financing-cost worries for capital-intensive automakers. This is a cleaner read on the BOJ's spillover than Asia's own relief rally, and worth flagging to clients with European auto exposure.`, th:`แรงเทขายในยุโรปเป็นปฏิกิริยาที่รุนแรงที่สุดต่อผลการตัดสินใจของ BOJ ในบรรดาทุกตลาด — เยนที่แข็งค่าขึ้นทำให้รถยนต์ญี่ปุ่นแข่งขันได้ดีขึ้นเมื่อเทียบกับคู่แข่งเยอรมัน และการไต่กลับขึ้นของผลตอบแทนพันธบัตรทั่วโลกหลังการขึ้นดอกเบี้ย เพิ่มความกังวลด้านต้นทุนทางการเงินให้กลุ่มผู้ผลิตรถยนต์ที่ใช้เงินทุนสูง นี่เป็นสัญญาณที่ชัดเจนกว่าเรื่องผลกระทบจาก BOJ เมื่อเทียบกับการดีดตัวรับความโล่งใจของเอเชียเอง ควรแจ้งลูกค้าที่มีการลงทุนในกลุ่มยานยนต์ยุโรป`},
      full:{en:`European shares fell sharply Friday, with Germany's DAX closing down 1.65% at 25,308.88, its lowest level since late July. The decline was led by the auto sector — Volkswagen fell 5.97%, Porsche Automobil 5.19% and Mercedes-Benz 4.76% — as a firmer Japanese yen following the Bank of Japan's rate hike to 1.25% threatened to erode German carmakers' competitiveness, while rising global bond yields in the hike's wake raised financing-cost concerns. The move stood in sharp contrast to Asia's own relief rally on the same BOJ decision, underscoring how differently regions are reading the spillover from Japan's tightening cycle.`, th:`หุ้นยุโรปปรับลงแรงวันศุกร์ ดัชนี DAX เยอรมนีปิดตลาดลดลง 1.65% สู่ 25,308.88 ต่ำสุดนับตั้งแต่ปลายเดือนกรกฎาคม การปรับลงนี้นำโดยกลุ่มยานยนต์ — Volkswagen ลดลง 5.97%, Porsche Automobil ลดลง 5.19% และ Mercedes-Benz ลดลง 4.76% — เมื่อเงินเยนของญี่ปุ่นที่แข็งค่าขึ้นหลังธนาคารกลางญี่ปุ่นขึ้นดอกเบี้ยสู่ 1.25% คุกคามความสามารถในการแข่งขันของผู้ผลิตรถยนต์เยอรมัน ขณะผลตอบแทนพันธบัตรทั่วโลกที่สูงขึ้นหลังการขึ้นดอกเบี้ยเพิ่มความกังวลด้านต้นทุนทางการเงิน การเคลื่อนไหวนี้ตรงข้ามอย่างชัดเจนกับการดีดตัวรับความโล่งใจของเอเชียต่อผลการตัดสินใจของ BOJ เดียวกัน สะท้อนว่าแต่ละภูมิภาคตีความผลกระทบจากวัฏจักรการคุมเข้มของญี่ปุ่นแตกต่างกันมาก`},
      sources:[{l:"ChainCatcher — European major stock indices all fell, with DAX down 1.65%",u:"https://www.chaincatcher.com/en/article/2290825"},{l:"Trading Economics — Germany",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"65,018.95", chg:1.38, series:[64136.25,65018.95],
      txt:{en:`<b>Japan's Nikkei 225 jumped 1.38% to 65,018.95 Friday</b> as investors cheered relief that the Bank of Japan's widely expected rate hike to 1.25% wasn't accompanied by a more hawkish signal, even with two dissenting votes.`, th:`<b>ดัชนี Nikkei 225 ของญี่ปุ่นพุ่งขึ้น 1.38% สู่ 65,018.95 วันศุกร์</b> จากความโล่งใจของนักลงทุนที่การขึ้นดอกเบี้ยของธนาคารกลางญี่ปุ่นสู่ 1.25% ซึ่งเป็นไปตามคาด ไม่ได้มาพร้อมสัญญาณสายเหยี่ยวที่รุนแรงกว่านี้ แม้จะมีกรรมการ 2 เสียงคัดค้านก็ตาม`},
      why:{en:`Tokyo's rally shows markets treated the two dovish dissents as the headline, not the rate hike itself — a "hike but with caveats" outcome that traders read as dovish relative to worst-case fears. The next data point is the BOJ's summary of opinions due October 1, which should reveal how close the board really was to holding. A firmer yen from here is the key risk to watch for Japanese exporters.`, th:`การดีดตัวของโตเกียวแสดงว่าตลาดให้ความสำคัญกับเสียงคัดค้านเชิงผ่อนคลาย 2 เสียงมากกว่าการขึ้นดอกเบี้ยเอง — ผลลัพธ์แบบ "ขึ้นดอกเบี้ยแต่มีเงื่อนไข" ที่นักลงทุนตีความว่าผ่อนคลายกว่าที่กลัวไว้ในกรณีเลวร้ายที่สุด ข้อมูลถัดไปคือเอกสารสรุปความเห็นของ BOJ ที่จะเผยแพร่วันที่ 1 ตุลาคม ซึ่งจะเผยว่าคณะกรรมการใกล้จะตัดสินใจคงดอกเบี้ยไว้แค่ไหน ความเสี่ยงสำคัญที่ต้องจับตาต่อจากนี้คือเยนที่แข็งค่าขึ้นซึ่งจะกระทบกลุ่มผู้ส่งออกญี่ปุ่น`},
      full:{en:`Japanese equities rallied sharply Friday, with the Nikkei 225 jumping 1.38% to close at 65,018.95, after the Bank of Japan raised its policy rate a quarter point to 1.25% — its highest level since 1995 — in a decision that was almost universally expected (all 52 economists surveyed by Bloomberg had forecast the hike). The move nonetheless carried two dovish dissents from board members who wanted to hold, balanced against a mildly hawkish policy statement, leaving investors to focus on the uncertainty over the pace of future hikes rather than the increase itself. The BOJ's summary of opinions from the September 17-18 meeting is due for release October 1 and should offer more detail on the dissenters' reasoning.`, th:`หุ้นญี่ปุ่นดีดตัวขึ้นแรงวันศุกร์ ดัชนี Nikkei 225 พุ่งขึ้น 1.38% ปิดที่ 65,018.95 หลังธนาคารกลางญี่ปุ่นขึ้นอัตราดอกเบี้ยนโยบาย 0.25% สู่ระดับ 1.25% — สูงสุดนับตั้งแต่ปี 1995 — เป็นการตัดสินใจที่ตลาดคาดการณ์ไว้เกือบทั้งหมด (นักเศรษฐศาสตร์ทั้ง 52 คนที่ Bloomberg สำรวจต่างคาดการณ์การขึ้นดอกเบี้ยครั้งนี้) แต่การตัดสินใจนี้ก็ยังมีกรรมการ 2 เสียงคัดค้านที่ต้องการคงอัตราดอกเบี้ยไว้ ควบคู่กับแถลงการณ์นโยบายที่ออกแนวสายเหยี่ยวเล็กน้อย ทำให้นักลงทุนหันไปให้ความสำคัญกับความไม่แน่นอนของจังหวะการขึ้นดอกเบี้ยในอนาคตมากกว่าการขึ้นดอกเบี้ยครั้งนี้เอง เอกสารสรุปความเห็นจากการประชุมวันที่ 17-18 กันยายนของ BOJ จะเผยแพร่วันที่ 1 ตุลาคม และคาดว่าจะให้รายละเอียดเพิ่มเติมเกี่ยวกับเหตุผลของกรรมการที่คัดค้าน`},
      sources:[{l:"Japan Times — Bank of Japan raises rates and offers mixed signals about next move higher",u:"https://www.japantimes.co.jp/business/2026/09/18/economy/boj-meeting-september/"},{l:"Karmactive — Bank of Japan rate hits 1.25%, highest since 1995, as yen falls after September hike",u:"https://www.karmactive.com/bank-of-japan-rate-1-25-percent-september-2026/"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,750.78", chg:0.60, series:[24604.29,24750.78],
      txt:{en:`<b>Hang Seng rose 0.60% to 24,750.78 Friday, while the Shanghai Composite added 0.94% to 3,911.87,</b> joining a broader Asia rally after the Bank of Japan's rate decision came in largely as expected.`, th:`<b>Hang Seng เพิ่มขึ้น 0.60% สู่ 24,750.78 วันศุกร์ ขณะ Shanghai Composite เพิ่มขึ้น 0.94% สู่ 3,911.87</b> ร่วมการดีดตัวของเอเชียในวงกว้าง หลังผลการตัดสินใจของธนาคารกลางญี่ปุ่นออกมาใกล้เคียงกับที่คาดการณ์ไว้เป็นส่วนใหญ่`},
      why:{en:`China and Hong Kong joining the region's relief rally, rather than diverging as they did earlier this week, suggests local sentiment has caught up with the broader risk-on tone now that the BOJ overhang is resolved. Trump's fresh Canada procurement ban and EU tariff threats this week are still a lingering risk worth flagging, even if they haven't yet dented Friday's gains.`, th:`การที่จีนและฮ่องกงร่วมการดีดตัวรับความโล่งใจของภูมิภาค แทนที่จะสวนทางเหมือนช่วงต้นสัปดาห์ บ่งชี้ว่าความเชื่อมั่นในประเทศตามทันบรรยากาศเปิดรับความเสี่ยงในวงกว้างแล้ว เมื่อความไม่แน่นอนจาก BOJ คลี่คลายลง การที่ทรัมป์สั่งห้ามสินค้าแคนาดาเข้าร่วมการจัดซื้อภาครัฐและขู่ภาษีศุลกากรใหม่ต่อสหภาพยุโรปสัปดาห์นี้ ยังคงเป็นความเสี่ยงที่ควรแจ้งลูกค้า แม้จะยังไม่ฉุดการปรับขึ้นของวันศุกร์`},
      full:{en:`Hong Kong and mainland China both advanced Friday as part of a broader Asian rally: the Hang Seng rose 0.60% to close at 24,750.78, while the Shanghai Composite added 0.94% to 3,911.87. Both markets tracked Japan's own relief rally after the Bank of Japan's rate hike to 1.25% came in largely as expected, with investors focusing on the two dovish dissents rather than any hawkish surprise. The gains come even as President Trump widened his trade fight this week, barring Canadian goods from US government purchases and floating fresh EU tariffs — a risk both markets remain on watch for heading into next week.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่ปรับขึ้นทั้งคู่วันศุกร์ ร่วมการดีดตัวของเอเชียในวงกว้าง: ดัชนี Hang Seng เพิ่มขึ้น 0.60% ปิดที่ 24,750.78 ขณะดัชนี Shanghai Composite เพิ่มขึ้น 0.94% สู่ 3,911.87 ทั้งสองตลาดเคลื่อนไหวตามการดีดตัวรับความโล่งใจของญี่ปุ่นเอง หลังธนาคารกลางญี่ปุ่นขึ้นดอกเบี้ยสู่ 1.25% ซึ่งใกล้เคียงกับที่คาดการณ์ไว้เป็นส่วนใหญ่ โดยนักลงทุนให้ความสำคัญกับเสียงคัดค้านเชิงผ่อนคลาย 2 เสียงมากกว่าความประหลาดใจเชิงสายเหยี่ยวใด ๆ การปรับขึ้นนี้เกิดขึ้นแม้ประธานาธิบดีทรัมป์จะขยายสงครามการค้าสัปดาห์นี้ ด้วยการสั่งห้ามสินค้าแคนาดาเข้าร่วมการจัดซื้อของรัฐบาลสหรัฐฯ และส่งสัญญาณภาษีศุลกากรใหม่ต่อสหภาพยุโรป ซึ่งเป็นความเสี่ยงที่ทั้งสองตลาดยังต้องจับตาเข้าสู่สัปดาห์หน้า`},
      sources:[{l:"24/7 Wall St. — Hang Seng closes up 0.6% as mainland China leads Asia higher",u:"https://247wallst.com/cards/mainland-money-did-the-heavy-lifting-the-sse-composite-s-1-hsi-market-bell-01m2srpxkba4zc8acwdgpqtpbh"},{l:"Trading Economics — China",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,584.15", chg:0.05, series:[1583.34,1584.15],
      txt:{en:`<b>SET Index edged up 0.05% to 1,584.15 Friday (+0.81 pts),</b> on turnover of about THB 71.44bn, a quiet session as investors stayed on the sidelines ahead of the weekend and the Bank of Japan's rate decision.`, th:`<b>ดัชนี SET ขยับขึ้น 0.05% สู่ 1,584.15 วันศุกร์ (+0.81 จุด)</b> มูลค่าการซื้อขายราว 7.144 หมื่นล้านบาท เป็นเซสชันที่ค่อนข้างเงียบ เมื่อนักลงทุนรอดูสถานการณ์ก่อนวันหยุดสุดสัปดาห์และผลการตัดสินใจอัตราดอกเบี้ยของธนาคารกลางญี่ปุ่น`},
      why:{en:`A near-flat Friday after Thursday's 1.32% jump suggests Thai investors had already priced in most of the post-Fed relief, leaving the SET to mark time rather than extend gains. With no major domestic catalyst this week, the market's next real test is how it reacts Monday to the BOJ outcome and any weekend trade-policy headlines.`, th:`วันศุกร์ที่แทบทรงตัวหลังจากพุ่งขึ้น 1.32% เมื่อวันพฤหัสบดี บ่งชี้ว่านักลงทุนไทยได้สะท้อนความโล่งใจหลังผลเฟดไว้ในราคาไปมากแล้ว ทำให้ SET เพียงแค่ทรงตัวแทนที่จะต่อยอดการปรับขึ้น เมื่อไม่มีปัจจัยกระตุ้นภายในประเทศที่สำคัญสัปดาห์นี้ บททดสอบถัดไปของตลาดคือปฏิกิริยาต่อผลการตัดสินใจของ BOJ ในวันจันทร์ และข่าวนโยบายการค้าใด ๆ ที่อาจเกิดขึ้นช่วงสุดสัปดาห์`},
      full:{en:`Thailand's SET Index closed Friday at 1,584.15, up just 0.81 points (+0.05%), on turnover of about THB 71.44 billion, a quiet session that gave back little of Thursday's 1.32% rebound but also failed to extend it. Investors appeared to stay on the sidelines ahead of the weekend and the Bank of Japan's rate decision, with no fresh domestic catalyst driving the market. Attention now turns to Monday's open and how the SET reacts to the BOJ's hike to 1.25% and the global bond-market moves that followed it.`, th:`ดัชนี SET ของไทยปิดตลาดวันศุกร์ที่ 1,584.15 เพิ่มขึ้นเพียง 0.81 จุด (+0.05%) มูลค่าการซื้อขายราว 7.144 หมื่นล้านบาท เป็นเซสชันที่ค่อนข้างเงียบ ไม่ได้คืนกำไรจากการดีดตัว 1.32% เมื่อวันพฤหัสบดีมากนัก แต่ก็ไม่ได้ต่อยอดเช่นกัน นักลงทุนดูเหมือนจะรอดูสถานการณ์ก่อนวันหยุดสุดสัปดาห์และผลการตัดสินใจอัตราดอกเบี้ยของธนาคารกลางญี่ปุ่น โดยไม่มีปัจจัยกระตุ้นภายในประเทศใหม่ขับเคลื่อนตลาด ตอนนี้ต้องจับตาการเปิดตลาดวันจันทร์และปฏิกิริยาของ SET ต่อการขึ้นดอกเบี้ยของ BOJ สู่ 1.25% และความเคลื่อนไหวของตลาดพันธบัตรทั่วโลกที่ตามมา`},
      sources:[{l:"Kaohoon International — Market Roundup 18 September 2026",u:"https://www.kaohooninternational.com/markets/591052"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil held roughly steady Friday — WTI near $100.90/bbl, Brent near $104.33/bbl — while gold extended its rally to $4,368.60/oz (+0.6%),</b> touching a weekly high above $4,400 intraday as the Fed's hike and softer oil helped ease inflation concerns.`, th:`<b>ราคาน้ำมันทรงตัวเป็นส่วนใหญ่วันศุกร์ — WTI ใกล้ $100.90 ต่อบาร์เรล เบรนท์ใกล้ $104.33 ต่อบาร์เรล — ขณะทองคำขยายการปรับขึ้นต่อเนื่องสู่ $4,368.60 ต่อออนซ์ (+0.6%)</b> แตะระดับสูงสุดในรอบสัปดาห์เหนือ $4,400 ระหว่างวัน เมื่อการขึ้นดอกเบี้ยของเฟดและราคาน้ำมันที่อ่อนตัวลงช่วยคลายความกังวลด้านเงินเฟ้อ`},
     why:{en:`A quiet oil market after weeks of tanker-attack headlines suggests the market is treating the Iran war's shipping disruptions as contained for now, even without a confirmed resolution. Gold pushing to a fresh weekly high even as the Fed and BOJ both tighten policy shows bullion is being bought as insurance against tariff- and geopolitics-driven price shocks, not just as a rates trade — worth flagging as a structural, not tactical, position for clients.`, th:`ตลาดน้ำมันที่ค่อนข้างเงียบหลังจากหลายสัปดาห์ของข่าวโจมตีเรือบรรทุกน้ำมัน บ่งชี้ว่าตลาดกำลังมองปัญหาด้านอุปทานจากสงครามอิหร่านว่าถูกควบคุมได้ในตอนนี้ แม้จะยังไม่มีการคลี่คลายที่ยืนยันแล้วก็ตาม การที่ทองคำแตะระดับสูงสุดในรอบสัปดาห์ใหม่ แม้ทั้งเฟดและ BOJ จะคุมเข้มนโยบายพร้อมกัน แสดงว่านักลงทุนซื้อทองคำเป็นประกันความเสี่ยงจากแรงกระแทกด้านราคาที่มาจากภาษีศุลกากรและภูมิรัฐศาสตร์ ไม่ใช่แค่การเทรดตามอัตราดอกเบี้ย ควรแจ้งลูกค้าว่านี่เป็นสถานะเชิงโครงสร้าง ไม่ใช่เชิงกลยุทธ์ระยะสั้น`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The Bank of Japan raised its policy rate to 1.25% Friday — highest since 1995 — while the US 10-year Treasury yield backed up toward 5% again (~5.01%, +6bp) after Thursday's dip,</b> with the 2-year near 4.74%. The BOJ's two dovish dissents leave the pace of further hikes uncertain; its summary of opinions from the meeting is due October 1.`, th:`<b>ธนาคารกลางญี่ปุ่นขึ้นอัตราดอกเบี้ยนโยบายสู่ 1.25% วันศุกร์ — สูงสุดนับตั้งแต่ปี 1995 — ขณะผลตอบแทนพันธบัตร 10 ปีของสหรัฐฯ ไต่กลับขึ้นใกล้ 5% อีกครั้ง (ราว 5.01% เพิ่มขึ้น 6bp) หลังย่อตัวลงเมื่อวันพฤหัสบดี</b> ขณะพันธบัตร 2 ปียืนใกล้ 4.74% เสียงคัดค้านเชิงผ่อนคลาย 2 เสียงของ BOJ ทำให้จังหวะการขึ้นดอกเบี้ยครั้งต่อไปยังไม่แน่นอน เอกสารสรุปความเห็นจากการประชุมจะเผยแพร่วันที่ 1 ตุลาคม`},
     why:{en:`Two of the world's most-watched central banks — the Fed and the BOJ — have now both hiked within the same two weeks, and global yields backing up again shows markets are repricing for a "higher for longer" world on both sides of the Pacific. The Fed's own statement already cites tariffs, the Iran-war energy shock and AI capex as inflation drivers; the BOJ's mixed dissent adds a second layer of uncertainty about how fast that tightening continues. Watch Monday's bond-market open for confirmation.`, th:`ธนาคารกลางสำคัญที่สุดของโลกสองแห่ง — เฟดและ BOJ — ต่างขึ้นดอกเบี้ยภายในสองสัปดาห์เดียวกันแล้ว และการที่ผลตอบแทนพันธบัตรทั่วโลกไต่กลับขึ้นอีกครั้ง แสดงว่าตลาดกำลังปรับราคารับโลกที่ดอกเบี้ย "สูงนานขึ้น" ทั้งสองฝั่งแปซิฟิก แถลงการณ์ของเฟดเองระบุแล้วว่าภาษีศุลกากร ผลกระทบด้านพลังงานจากสงครามอิหร่าน และการลงทุนด้าน AI คือปัจจัยขับเคลื่อนเงินเฟ้อ ขณะเสียงคัดค้านที่ผสมกันของ BOJ เพิ่มความไม่แน่นอนอีกชั้นว่าการคุมเข้มนี้จะดำเนินต่อไปเร็วแค่ไหน ควรจับตาการเปิดตลาดพันธบัตรวันจันทร์เพื่อยืนยันแนวโน้มนี้`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Trump widened his trade fight this week: he banned Canadian goods from US government purchases and floated fresh EU tariffs if a Canada trade invitation were deemed a "hostile act." Washington's broader tariff schedule — including a 100% default duty on patented pharmaceuticals — takes full effect September 29 for most trading partners, while Commerce Secretary Howard Lutnick said the administration is weighing a fresh round of semiconductor tariffs. Vietnam's president traveled to Washington and Ottawa this week as the tariff pressure loomed.`, th:`ทรัมป์ขยายสงครามการค้าสัปดาห์นี้ โดยสั่งห้ามสินค้าแคนาดาเข้าร่วมการจัดซื้อของรัฐบาลสหรัฐฯ และส่งสัญญาณภาษีศุลกากรใหม่ต่อสหภาพยุโรป หากมองว่าการเชิญแคนาดาเป็นการกระทำที่ "ไม่เป็นมิตร" ตารางภาษีศุลกากรที่กว้างขึ้นของสหรัฐฯ — รวมถึงอัตราภาษีเริ่มต้น 100% สำหรับยาที่มีสิทธิบัตร — จะมีผลบังคับใช้เต็มรูปแบบวันที่ 29 กันยายนกับคู่ค้าส่วนใหญ่ ขณะรัฐมนตรีพาณิชย์ฮาวเวิร์ด ลุตนิค ระบุว่ารัฐบาลกำลังพิจารณาภาษีศุลกากรเซมิคอนดักเตอร์รอบใหม่ ประธานาธิบดีเวียดนามเดินทางเยือนวอชิงตันและออตตาวาสัปดาห์นี้ ท่ามกลางแรงกดดันด้านภาษีศุลกากรที่ใกล้เข้ามา`}, w:{en:`The Canada procurement ban and EU tariff threat show Trump is widening the trade fight beyond the countries already targeted — worth flagging to clients with Canadian or European supply-chain exposure. The Sep 29 tariff deadline and looming chip tariffs are the next concrete dates to watch; expect more targeted diplomacy, like Vietnam's visit, from countries trying to get ahead of new levies.`, th:`การห้ามจัดซื้อจากแคนาดาและการขู่ภาษีศุลกากรต่อสหภาพยุโรป แสดงว่าทรัมป์กำลังขยายสงครามการค้าออกไปนอกเหนือประเทศที่ถูกเล็งเป้าไว้แล้ว ควรแจ้งลูกค้าที่มีความเสี่ยงด้านห่วงโซ่อุปทานในแคนาดาหรือยุโรป กำหนดเส้นตายภาษีศุลกากรวันที่ 29 ก.ย. และภาษีชิปที่ใกล้เข้ามาเป็นวันที่ต้องจับตาถัดไป คาดว่าจะเห็นการทูตเชิงรุกมากขึ้นจากประเทศที่พยายามตั้งรับก่อนภาษีศุลกากรใหม่ เช่นการเยือนของเวียดนาม`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Oil held roughly steady Friday (WTI near $100.90/bbl, Brent near $104.33/bbl) with no fresh escalation reported on the Iran war's shipping disruptions — a contrast to the sharp swings of the prior two weeks. Separately, Trump's trade fight widened this week, with Canada now barred from US government procurement and the EU threatened with fresh tariffs.`, th:`ราคาน้ำมันทรงตัวเป็นส่วนใหญ่วันศุกร์ (WTI ใกล้ $100.90 ต่อบาร์เรล เบรนท์ใกล้ $104.33 ต่อบาร์เรล) โดยไม่มีรายงานการทวีความรุนแรงใหม่ในปัญหาด้านการเดินเรือจากสงครามอิหร่าน ซึ่งต่างจากความผันผวนรุนแรงของสองสัปดาห์ก่อนหน้า แยกกันไป สงครามการค้าของทรัมป์ขยายตัวสัปดาห์นี้ โดยแคนาดาถูกห้ามเข้าร่วมการจัดซื้อของรัฐบาลสหรัฐฯ และสหภาพยุโรปถูกขู่ด้วยภาษีศุลกากรใหม่`}, w:{en:`A quiet oil market is itself a signal — after weeks of tanker-attack headlines, Friday's stability suggests the market is treating the Strait of Hormuz situation as contained for now, even without a confirmed resolution. Don't read this as durable, though: the underlying conflict hasn't been resolved, and the trade-war front (Canada, the EU) is a fresh, separate source of volatility risk into next week.`, th:`ตลาดน้ำมันที่เงียบสงบเป็นสัญญาณในตัวเอง — หลังหลายสัปดาห์ของข่าวโจมตีเรือบรรทุกน้ำมัน ความนิ่งของวันศุกร์บ่งชี้ว่าตลาดกำลังมองสถานการณ์ที่ช่องแคบฮอร์มุซว่าถูกควบคุมได้ในตอนนี้ แม้จะยังไม่มีการคลี่คลายที่ยืนยันแล้วก็ตาม อย่างไรก็ตาม ไม่ควรมองว่านี่เป็นแนวโน้มที่ยั่งยืน — ความขัดแย้งที่เป็นต้นเหตุยังไม่คลี่คลาย และแนวรบสงครามการค้า (แคนาดา สหภาพยุโรป) เป็นแหล่งความเสี่ยงด้านความผันผวนใหม่ที่แยกต่างหากเข้าสู่สัปดาห์หน้า`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The Bank of Japan raised its policy rate to 1.25% Friday, its highest since 1995, in a decision that was widely expected but carried two dovish dissents. The move pushed the US 10-year Treasury yield back up toward 5% (~5.01%, +6bp) after Thursday's dip, with the 2-year near 4.74%, as global bond markets repriced for a world where both the Fed and the BOJ are now in hiking mode.`, th:`ธนาคารกลางญี่ปุ่นขึ้นอัตราดอกเบี้ยนโยบายสู่ 1.25% วันศุกร์ สูงสุดนับตั้งแต่ปี 1995 เป็นการตัดสินใจที่ตลาดคาดการณ์ไว้แล้ว แต่มีกรรมการ 2 เสียงคัดค้านเชิงผ่อนคลาย การเคลื่อนไหวนี้ดันผลตอบแทนพันธบัตร 10 ปีของสหรัฐฯ ไต่กลับขึ้นใกล้ 5% อีกครั้ง (ราว 5.01% เพิ่มขึ้น 6bp) หลังย่อตัวลงเมื่อวันพฤหัสบดี ขณะพันธบัตร 2 ปียืนใกล้ 4.74% เมื่อตลาดพันธบัตรทั่วโลกปรับราคารับโลกที่ทั้งเฟดและ BOJ อยู่ในโหมดขึ้นดอกเบี้ยแล้ว`}, w:{en:`Two of the world's most-watched central banks hiking in the same week — with the Fed's own statement blaming tariffs, the Iran-war energy shock and AI capex for inflation, and the BOJ's mixed dissent signaling caution about the pace ahead — argues for higher-for-longer global rates without a clean, single narrative. Watch the BOJ's October 1 summary of opinions and Monday's bond-market open for the next read.`, th:`การที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งขึ้นดอกเบี้ยในสัปดาห์เดียวกัน — โดยแถลงการณ์ของเฟดเองโทษภาษีศุลกากร ผลกระทบด้านพลังงานจากสงครามอิหร่าน และการลงทุนด้าน AI ว่าเป็นสาเหตุเงินเฟ้อ ขณะเสียงคัดค้านที่ผสมกันของ BOJ ส่งสัญญาณความระมัดระวังเรื่องจังหวะการขึ้นดอกเบี้ยครั้งต่อไป — บ่งชี้ทิศทางดอกเบี้ยโลกที่ "สูงนานขึ้น" โดยไม่มีเรื่องราวเดียวที่ชัดเจน ควรจับตาเอกสารสรุปความเห็นของ BOJ วันที่ 1 ตุลาคม และการเปิดตลาดพันธบัตรวันจันทร์เพื่อข้อมูลถัดไป`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`No new US CPI print has landed since last week, but Friday's cross-currents told their own story: gold extended its rally to $4,368.60/oz as the Fed's hike and softer oil helped ease inflation concerns, even as the BOJ's rate hike and the US 10-year yield's snap-back toward 5% show rate pressure is still building globally.`, th:`ยังไม่มีตัวเลข CPI ของสหรัฐฯ ใหม่นับตั้งแต่สัปดาห์ก่อน แต่ความเคลื่อนไหวที่สวนทางกันของวันศุกร์บอกเรื่องราวในตัวเอง: ทองคำขยายการปรับขึ้นต่อเนื่องสู่ $4,368.60 ต่อออนซ์ เมื่อการขึ้นดอกเบี้ยของเฟดและราคาน้ำมันที่อ่อนตัวลงช่วยคลายความกังวลด้านเงินเฟ้อ แม้การขึ้นดอกเบี้ยของ BOJ และผลตอบแทนพันธบัตร 10 ปีของสหรัฐฯ ที่ไต่กลับขึ้นใกล้ 5% จะแสดงว่าแรงกดดันด้านดอกเบี้ยยังคงก่อตัวขึ้นทั่วโลก`}, w:{en:`Gold rising even as central banks hike is a sign markets see current policy as insurance against tariff- and war-driven price shocks, not confirmation that inflation is beaten. Keep framing client conversations around structurally sticky inflation — tariffs, energy and AI capex — rather than a simple rates-will-fix-it story.`, th:`การที่ทองคำปรับขึ้นแม้ธนาคารกลางจะขึ้นดอกเบี้ย เป็นสัญญาณว่าตลาดมองนโยบายปัจจุบันเป็นประกันความเสี่ยงจากแรงกระแทกด้านราคาที่มาจากภาษีศุลกากรและสงคราม ไม่ใช่การยืนยันว่าเงินเฟ้อถูกควบคุมได้แล้ว ควรวางกรอบการสนทนากับลูกค้าโดยยึด "เงินเฟ้อติดสูงจากปัจจัยเชิงโครงสร้าง" — ภาษีศุลกากร พลังงาน และการลงทุนด้าน AI — มากกว่าเรื่องราวง่าย ๆ ที่ว่าดอกเบี้ยจะแก้ปัญหาได้`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 8 Sep",th:"อังคาร 8 ก.ย."}, imp:"h", t:{en:"Wall Street reopens for the first time since the tanker war, with hike odds near 60%",th:"วอลล์สตรีทเปิดตลาดอีกครั้งเป็นครั้งแรกหลังสงครามเรือบรรทุกน้ำมัน ขณะโอกาสขึ้นดอกเบี้ยใกล้ 60%"}, d:{en:"US markets reopen Tuesday after the Labor Day break, giving the first direct pricing of both the weekend's Iran-tanker escalation and the climb in September rate-hike odds to roughly 60%. Oil (Brent near $98, WTI above $92) and the elevated 10-year yield (~4.79%) will be the key signals to watch as trading resumes.",th:"ตลาดสหรัฐฯ เปิดทำการอีกครั้งวันอังคารหลังหยุดวันแรงงาน เป็นการสะท้อนราคาโดยตรงครั้งแรกทั้งการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ขยับขึ้นสู่ราว 60% ราคาน้ำมัน (เบรนท์ใกล้ $98, WTI เหนือ $92) และผลตอบแทนพันธบัตร 10 ปีที่สูงขึ้น (~4.79%) จะเป็นสัญญาณสำคัญที่ต้องจับตาเมื่อการซื้อขายกลับมาดำเนินต่อ"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 9 Sep",th:"พุธ 9 ก.ย."}, imp:"h", t:{en:"Oil tops $101 as tanker war's worst wave yet hits Wall St a third day",th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"}, d:{en:"The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%); national gas hit $4.22/gal and diesel a record $5.94/gal. The S&P 500 fell 0.48% to 7,636.36 (a third straight down day), the DAX slid 1.74% to a one-month low of 25,554, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. September hike odds eased slightly to ~57%.",th:"สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ดัชนี S&P 500 ลดลง 0.48% สู่ 7,636.36 (ปรับลงวันที่สามติดต่อกัน) ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือนที่ 25,554 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 10 Sep",th:"พฤหัสฯ 10 ก.ย."}, imp:"h", t:{en:"Wall St falls a fourth day; hike odds jump to ~72% as yields near 5%",th:"วอลล์สตรีทร่วงวันที่สี่ โอกาสขึ้นดอกเบี้ยพุ่งสู่ราว 72% ผลตอบแทนใกล้ 5%"}, d:{en:"US stocks fell a fourth straight session — S&P 500 -0.58% to 7,591.70, Dow -0.6% to 52,064.10, Nasdaq -0.65% to 26,081.72 — as the 10-year Treasury yield pushed above 4.9% and Wednesday's in-line PPI kept inflation in focus. September hike odds jumped to roughly 72%, from ~57% a day earlier. Germany's DAX fell 0.8% to 25,401 after the ECB hiked 25bp; Hong Kong's Hang Seng dropped 1.27% while Japan's Nikkei edged up 0.20% and Thailand's SET eased 0.17% on profit-taking. Oil held near $101 and gold rose to $4,405.88.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกัน — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 0.6% สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 — ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% และ PPI วันพุธที่ออกมาตามคาดยังตอกย้ำแรงกดดันเงินเฟ้อ โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% จากราว 57% เมื่อวันก่อน ดัชนี DAX เยอรมนีลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ย 25bp ดัชนี Hang Seng ฮ่องกงลดลง 1.27% ขณะ Nikkei ญี่ปุ่นขยับขึ้น 0.20% และ SET ไทยลดลง 0.17% จากแรงขายทำกำไร น้ำมันยืนใกล้ $101 และทองคำเพิ่มขึ้นสู่ $4,405.88"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 11 Sep",th:"ศุกร์ 11 ก.ย."}, imp:"h", t:{en:"Hot core CPI pushes Sep 16 hike odds to ~90%; stocks rally, oil tumbles",th:"Core CPI ร้อนแรงดันโอกาสขึ้นดอกเบี้ย 16 ก.ย. สู่ราว 90% หุ้นดีดตัว น้ำมันร่วง"}, d:{en:"August headline CPI matched forecasts (+0.4% m/m, +3.4% y/y) but core CPI ran hot (+0.3% m/m vs +0.2% expected, +2.4% y/y), pushing Sep 16 hike odds to roughly 90% from ~72% Thursday. The S&P 500 rose 0.86% to 7,656.98, the Dow gained 509.19 pts (+0.98%) to 52,573.29, and the Nasdaq added 0.96% to 26,333.04. The 10-year yield touched 4.98% before easing to ~4.92%, and Brent tumbled 2.8% to $104.61 after Iran signaled Oman talks over the Strait of Hormuz. Earlier, before the print, Asia and Europe stayed mixed: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%.",th:"CPI ทั่วไปเดือน ส.ค. ตรงตามคาด (+0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อน) แต่ Core CPI ร้อนแรงกว่าคาด (+0.3% เทียบเดือนก่อน เทียบคาดการณ์ 0.2%, +2.4% เทียบปีก่อน) ดันโอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. สู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ดัชนี S&P 500 เพิ่มขึ้น 0.86% สู่ 7,656.98 ดัชนี Dow เพิ่มขึ้น 509.19 จุด (+0.98%) สู่ 52,573.29 และดัชนี Nasdaq เพิ่มขึ้น 0.96% สู่ 26,333.04 ผลตอบแทนพันธบัตร 10 ปีแตะ 4.98% ก่อนย่อตัวสู่ราว 4.92% และเบรนท์ร่วง 2.8% สู่ $104.61 หลังอิหร่านส่งสัญญาณเจรจาที่โอมานเรื่องช่องแคบฮอร์มุซ ก่อนหน้านั้น ก่อนตัวเลขจะประกาศ ตลาดเอเชียและยุโรปเคลื่อนไหวคละกัน: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 14 Sep",th:"จันทร์ 14 ก.ย."}, imp:"h", t:{en:"AI-slowdown selloff runs a full session; 10-year yield tops 5% intraday",th:"แรงเทขาย AI ดำเนินต่อเนื่องเต็มเซสชัน ผลตอบแทน 10 ปีทะลุ 5% ระหว่างวัน"}, d:{en:"US stocks fell a second straight session — S&P 500 -0.48% to 7,619.98, Dow -0.29% to 52,421.20, Nasdaq -0.56% to 26,186.41 — as the weekend's AI-slowdown warnings ran through a full session and the 10-year Treasury yield touched 5.01% intraday before easing to ~4.96%. DAX fell 0.66% to 25,398.75, Nikkei dropped 0.81% to 63,492.99, Hang Seng fell 0.48% to 24,687 (a 4th straight losing session), Shanghai eased 0.07% to 3,885, and Thailand's SET fell 0.84% to 1,591.07 on a DELTA-led electronics selloff. Brent settled $108.34 (+3.6%) and gold fell 1.25% to $4,284.48, its lowest since August.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สองติดต่อกัน — S&P 500 ลดลง 0.48% สู่ 7,619.98, Dow ลดลง 0.29% สู่ 52,421.20, Nasdaq ลดลง 0.56% สู่ 26,186.41 — ขณะคำเตือนชะลอ AI ช่วงสุดสัปดาห์ดำเนินต่อเนื่องเต็มเซสชัน และผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน ก่อนย่อตัวสู่ราว 4.96% ดัชนี DAX ลดลง 0.66% สู่ 25,398.75 ดัชนี Nikkei ลดลง 0.81% สู่ 63,492.99 ดัชนี Hang Seng ลดลง 0.48% สู่ 24,687 (ปรับลงติดต่อกันเป็นเซสชันที่สี่) ดัชนี Shanghai ลดลง 0.07% สู่ 3,885 และดัชนี SET ไทยลดลง 0.84% สู่ 1,591.07 จากแรงเทขายหุ้นอิเล็กทรอนิกส์ที่นำโดย DELTA เบรนท์ปิดที่ $108.34 (+3.6%) และทองคำลดลง 1.25% สู่ $4,284.48 ต่ำสุดตั้งแต่เดือนสิงหาคม"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 15 Sep",th:"อังคาร 15 ก.ย."}, imp:"h", t:{en:"Wall St falls a third day as the 10-year yield hits its highest since 2007",th:"วอลล์สตรีทร่วงวันที่สาม ผลตอบแทน 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007"}, d:{en:"US stocks fell a third straight session — S&P 500 -0.45% to 7,585.73, Dow -0.63% to 52,093.11, Nasdaq -0.78% to 25,981.57 — even as AI chip names Qualcomm and AMD bounced. The 10-year Treasury yield touched 5.04% intraday, its highest since 2007, before easing to ~5.00%, and CME FedWatch pushed hike odds to roughly 92% from 88% Monday. DAX fell 1.14% to ~25,109, Nikkei was flat at 63,484.10, Hang Seng eased 0.08% to 24,667 (a 5th straight losing session), and Shanghai fell 0.54% to 3,864.28. WTI rose to $105.49 while Brent held near $107.46, and gold fell 1.23% to a six-week low of $4,263.19.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกัน — S&P 500 ลดลง 0.45% สู่ 7,585.73, Dow ลดลง 0.63% สู่ 52,093.11, Nasdaq ลดลง 0.78% สู่ 25,981.57 — แม้หุ้นชิปกลุ่ม AI อย่าง Qualcomm และ AMD จะดีดตัวขึ้น ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวสู่ราว 5.00% และ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยขึ้นสู่ราว 92% จาก 88% เมื่อวันจันทร์ ดัชนี DAX ลดลง 1.14% สู่ราว 25,109 ดัชนี Nikkei ทรงตัวที่ 63,484.10 ดัชนี Hang Seng ลดลง 0.08% สู่ 24,667 (ปรับลงติดต่อกันเป็นเซสชันที่ห้า) และดัชนี Shanghai ลดลง 0.54% สู่ 3,864.28 WTI เพิ่มขึ้นสู่ $105.49 ขณะเบรนท์ยืนใกล้ $107.46 และทองคำลดลง 1.23% สู่ระดับต่ำสุดในรอบหกสัปดาห์ที่ $4,263.19"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 16 Sep",th:"พุธ 16 ก.ย."}, imp:"h", t:{en:"Fed hikes rates for the first time in three years; Wall Street falls, 10-year tops 5% again",th:"เฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี วอลล์สตรีทปรับลง ผลตอบแทน 10 ปีทะลุ 5% อีกครั้ง"}, d:{en:"The FOMC voted 12-0 to raise the fed funds rate a quarter point to 3.75%-4.00%, its first hike in three years. Chair Kevin Warsh said inflation \"is too high, and has been for too long,\" and the updated dot plot showed most officials expect at least one more hike this year. US stocks fell on the news — Dow -1.21% (-631.21 pts) to 51,461.90, S&P 500 -0.45% to 7,551.81, Nasdaq roughly flat at 25,978.42 — and the 10-year Treasury yield climbed back above 5% to 5.016%. Oil jumped on fresh Middle East supply fears (WTI +4.2% to $104.25, Brent +4.14% to $108.94) after Houthi attacks and a Saudi pipeline shutdown, while gold slipped 1.2% to $4,240.10. Asia and Europe, which closed hours before the announcement, only traded on anticipation: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80%. Thailand's SET fell 1.01% to 1,562.73 on domestic drivers (a diesel price cut and a delayed tourism-stimulus program), unrelated to the Fed.",th:"FOMC ลงมติเอกฉันท์ 12 เสียง ขึ้นอัตราดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ \"สูงเกินไป และสูงมานานเกินไป\" และ dot plot ฉบับปรับใหม่แสดงว่ากรรมการส่วนใหญ่คาดว่าจะมีการขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ หุ้นสหรัฐฯ ปรับลงรับข่าว — Dow -1.21% (-631.21 จุด) สู่ 51,461.90, S&P 500 -0.45% สู่ 7,551.81, Nasdaq ทรงตัวใกล้เคียงเดิมที่ 25,978.42 — และผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% ราคาน้ำมันพุ่งขึ้นจากความกังวลด้านอุปทานในตะวันออกกลางรอบใหม่ (WTI +4.2% สู่ $104.25, เบรนท์ +4.14% สู่ $108.94) หลังกลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันของซาอุดีอาระเบียถูกปิด ขณะทองคำลดลง 1.2% สู่ $4,240.10 ตลาดเอเชียและยุโรปซึ่งปิดตลาดก่อนการประกาศหลายชั่วโมง เทรดตามการคาดการณ์เท่านั้น: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80% ดัชนี SET ไทยลดลง 1.01% สู่ 1,562.73 จากปัจจัยภายในประเทศ (การลดราคาดีเซลและโครงการกระตุ้นท่องเที่ยวที่ถูกเลื่อนออกไป) ซึ่งไม่เกี่ยวกับเฟด"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 17 Sep",th:"พฤหัสฯ 17 ก.ย."}, imp:"h", t:{en:"Wall Street rebounds as the 10-year yield slips below 5% and oil eases",th:"วอลล์สตรีทดีดตัว ผลตอบแทนพันธบัตร 10 ปีหลุด 5% น้ำมันย่อตัว"}, d:{en:"US stocks bounced back from Wednesday's Fed-hike selloff — S&P 500 +0.59% to 7,596.36, Dow +0.61% (+316.14 pts) to 51,778.04, Nasdaq +1.60% to 26,395.18 — as the 10-year Treasury yield eased to ~4.94% and oil fell on signs the Iran war's supply disruptions could moderate (WTI -2.2% to $101.91, Brent -3.8% to $104.82). Gold rebounded 1.4% to $4,301.40. Trump escalated pressure on Chair Kevin Warsh, threatening to halt trade with surplus countries unless the Fed cuts rates, but the Fed's own statement blamed tariffs, the Iran war and AI capex for elevated inflation. Europe and Japan got their first full session to price in the Fed's hike — DAX +0.53% to 25,538, Nikkei +0.33% to 64,136.25 — while Hong Kong's Hang Seng slipped 0.44% to 24,604.29 and Shanghai eased 0.41% to 3,875.60. Thailand's SET jumped 1.32% to 1,583.34 on turnover of THB 62.46bn.",th:"หุ้นสหรัฐฯ ดีดตัวขึ้นจากแรงเทขายรับข่าวเฟดขึ้นดอกเบี้ยเมื่อวันพุธ — S&P 500 +0.59% สู่ 7,596.36, Dow +0.61% (+316.14 จุด) สู่ 51,778.04, Nasdaq +1.60% สู่ 26,395.18 — ขณะผลตอบแทนพันธบัตร 10 ปีย่อตัวลงสู่ราว 4.94% และราคาน้ำมันลดลงจากสัญญาณว่าปัญหาอุปทานจากสงครามอิหร่านอาจบรรเทาลง (WTI -2.2% สู่ $101.91, เบรนท์ -3.8% สู่ $104.82) ทองคำดีดตัวขึ้น 1.4% สู่ $4,301.40 ทรัมป์ทวีความรุนแรงของแรงกดดันต่อประธานเควิน วอร์ช โดยขู่จะหยุดการค้ากับประเทศที่เกินดุลหากเฟดไม่ลดดอกเบี้ย แต่แถลงการณ์ของเฟดเองโทษภาษีศุลกากร สงครามอิหร่าน และการลงทุนด้าน AI ว่าเป็นสาเหตุของเงินเฟ้อสูง ยุโรปและญี่ปุ่นได้เซสชันเต็มรูปแบบครั้งแรกในการสะท้อนการขึ้นดอกเบี้ยของเฟดในราคา — DAX +0.53% สู่ 25,538, Nikkei +0.33% สู่ 64,136.25 — ขณะ Hang Seng ฮ่องกงลดลง 0.44% สู่ 24,604.29 และ Shanghai ลดลง 0.41% สู่ 3,875.60 ดัชนี SET ไทยพุ่งขึ้น 1.32% สู่ 1,583.34 มูลค่าการซื้อขายราว 6.246 หมื่นล้านบาท"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 18 Sep",th:"ศุกร์ 18 ก.ย."}, imp:"h", t:{en:"Bank of Japan hikes to 1.25%; Asia rallies, DAX tumbles, Wall Street ends a third losing week little changed",th:"BOJ ขึ้นดอกเบี้ยสู่ 1.25% เอเชียดีดตัว DAX ร่วง วอลล์สตรีทปิดสัปดาห์ที่ปรับลงเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเล็กน้อย"}, d:{en:"The BOJ raised its policy rate a quarter point to 1.25% — highest since 1995 — in a widely expected move that still carried two dovish dissents. Japan's Nikkei jumped 1.38% to 65,018.95, Hong Kong's Hang Seng added 0.60% to 24,750.78 and Shanghai rose 0.94% to 3,911.87, while Germany's DAX tumbled 1.65% to 25,308.88 on an auto-led selloff (Volkswagen -5.97%). US stocks closed a third straight losing week little changed — Dow -0.18% to 51,682.64, S&P 500 +0.17% to 7,650.50, Nasdaq +0.39% to 26,522.55 — as the 10-year Treasury yield backed up toward 5% again (~5.01%). Oil held steady (WTI ~$100.90, Brent ~$104.33) and gold extended its rally to $4,368.60. Thailand's SET was flat at 1,584.15 (+0.05%). Markets are closed for the weekend; next up is Monday's Asia and Europe open.",th:"BOJ ขึ้นอัตราดอกเบี้ยนโยบาย 0.25% สู่ 1.25% — สูงสุดนับตั้งแต่ปี 1995 — เป็นการตัดสินใจที่ตลาดคาดการณ์ไว้แล้ว แต่ยังมีกรรมการ 2 เสียงคัดค้านเชิงผ่อนคลาย ดัชนี Nikkei ญี่ปุ่นพุ่งขึ้น 1.38% สู่ 65,018.95 ดัชนี Hang Seng ฮ่องกงเพิ่มขึ้น 0.60% สู่ 24,750.78 และ Shanghai เพิ่มขึ้น 0.94% สู่ 3,911.87 ขณะดัชนี DAX เยอรมนีร่วง 1.65% สู่ 25,308.88 จากแรงเทขายกลุ่มยานยนต์ (Volkswagen -5.97%) หุ้นสหรัฐฯ ปิดสัปดาห์ที่ปรับลงติดต่อกันเป็นสัปดาห์ที่สามด้วยการเปลี่ยนแปลงเพียงเล็กน้อย — Dow -0.18% สู่ 51,682.64, S&P 500 +0.17% สู่ 7,650.50, Nasdaq +0.39% สู่ 26,522.55 — ขณะผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นใกล้ 5% อีกครั้ง (ราว 5.01%) ราคาน้ำมันทรงตัว (WTI ราว $100.90, เบรนท์ราว $104.33) และทองคำขยายการปรับขึ้นต่อเนื่องสู่ $4,368.60 ดัชนี SET ไทยทรงตัวที่ 1,584.15 (+0.05%) ตลาดปิดทำการช่วงสุดสัปดาห์ ก้าวต่อไปคือการเปิดตลาดเอเชียและยุโรปวันจันทร์"}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
