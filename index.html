<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Wall Street Falls a Third Day as the 10-Year Yield Hits Its Highest Since 2007, With the Fed's Decision Due Overnight in Bangkok", th:"หุ้นสหรัฐฯ ร่วงต่อวันที่สาม ขณะผลตอบแทนพันธบัตร 10 ปีขึ้นแตะจุดสูงสุดนับตั้งแต่ปี 2007 ก่อนผลการตัดสินใจของเฟดจะประกาศในคืนนี้ตามเวลากรุงเทพฯ"},
    heroDeck:{en:`US stocks fell for a third straight session Tuesday as Treasury yields surged to their highest since 2007 ahead of the Fed's decision: the S&P 500 slid 0.45% to 7,585.73, the Dow lost 328.09 points (-0.63%) to 52,093.11, and the Nasdaq Composite dropped 0.78% to 25,981.57, with losses tempered by a bounce in AI chip names including Qualcomm (+4%) and AMD (+2%). The 10-year Treasury yield touched 5.04% intraday — its highest level since 2007 — before easing to close near 5.00%, as CME FedWatch pushed the odds of a Wednesday quarter-point hike to roughly 92%, up from 88% Monday. Oil stayed elevated on continued Middle East supply disruptions: WTI rose 3% to $105.49/bbl while Brent held near $107.46, little changed from Monday. Gold fell 1.23% to a six-week low of $4,263.19/oz as high yields and a firm dollar continued to outweigh safe-haven demand. Overseas, Germany's DAX fell 1.14% to roughly 25,109, Japan's Nikkei 225 was little changed at 63,484.10 (-0.01%), Hong Kong's Hang Seng eased 0.08% to 24,667 for a fifth straight losing session, mainland China's Shanghai Composite fell 0.54% to 3,864.28, and Thailand's SET Index held at Tuesday's close of 1,591.07 (-0.84%) ahead of today's Bangkok open. The Fed's decision lands this afternoon in Washington — overnight Bangkok time — with the Bank of Japan following September 17-18.`, th:`หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกันในวันอังคาร ขณะผลตอบแทนพันธบัตรพุ่งขึ้นแตะจุดสูงสุดนับตั้งแต่ปี 2007 ก่อนผลการตัดสินใจของเฟด — ดัชนี S&P 500 ลดลง 0.45% สู่ 7,585.73 ดัชนี Dow ลดลง 328.09 จุด (-0.63%) สู่ 52,093.11 และดัชนี Nasdaq Composite ลดลง 0.78% สู่ 25,981.57 โดยแรงเทขายถูกลดทอนบางส่วนจากหุ้นชิปกลุ่ม AI ที่ดีดตัว เช่น Qualcomm (+4%) และ AMD (+2%) ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวปิดใกล้ 5.00% ขณะ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ย 0.25% ในการตัดสินใจวันพุธขึ้นสู่ราว 92% จาก 88% เมื่อวันจันทร์ น้ำมันยังคงยืนสูงจากการหยุดชะงักด้านอุปทานในตะวันออกกลางที่ยังดำเนินต่อเนื่อง โดย WTI เพิ่มขึ้น 3% สู่ $105.49 ต่อบาร์เรล ขณะเบรนท์ยืนใกล้ $107.46 แทบไม่เปลี่ยนแปลงจากวันจันทร์ ทองคำลดลง 1.23% สู่ระดับต่ำสุดในรอบหกสัปดาห์ที่ $4,263.19 ต่อออนซ์ เมื่อผลตอบแทนพันธบัตรที่สูงและดอลลาร์ที่แข็งค่ายังคงมีน้ำหนักมากกว่าความต้องการสินทรัพย์ปลอดภัย ในต่างประเทศ ดัชนี DAX เยอรมนีลดลง 1.14% สู่ราว 25,109 ดัชนี Nikkei 225 ญี่ปุ่นแทบไม่เปลี่ยนแปลงที่ 63,484.10 (-0.01%) ดัชนี Hang Seng ฮ่องกงลดลง 0.08% สู่ 24,667 ปรับลงเป็นเซสชันที่ห้าติดต่อกัน ดัชนี Shanghai Composite จีนแผ่นดินใหญ่ลดลง 0.54% สู่ 3,864.28 และดัชนี SET ไทยยังคงยืนที่ราคาปิดวันอังคารที่ 1,591.07 (-0.84%) ก่อนตลาดกรุงเทพฯ จะเปิดทำการวันนี้ ผลการตัดสินใจของเฟดจะประกาศช่วงบ่ายตามเวลาวอชิงตัน ซึ่งตรงกับกลางคืนตามเวลากรุงเทพฯ ตามด้วยธนาคารกลางญี่ปุ่นวันที่ 17-18 กันยายน`},

    leadtxt:{en:`<b>The 10-year Treasury yield's push to its highest level since 2007 — not the still-pending Fed decision itself — is the more consequential story for your clients' portfolios this morning.</b> The S&P 500 fell 0.45% to 7,585.73, the Nasdaq 0.78% to 25,981.57, and the Dow 0.63% to 52,093.11 — a third straight down day — even as AI chipmakers Qualcomm and AMD rallied. The 10-year yield touched 5.04% intraday before easing to close near 5.00%, and CME FedWatch now prices a Wednesday hike at roughly 92%, up from 88% Monday. Oil stayed elevated on continued Middle East supply disruptions (WTI $105.49, +3%; Brent little changed near $107.46), and gold's 1.23% drop to a six-week low of $4,263.19 shows high yields are still winning the tug-of-war against safe-haven demand. Asia was mixed — Japan's Nikkei was flat and Hong Kong's Hang Seng barely budged, but Shanghai fell 0.54% — while Thailand's SET is still sitting at Tuesday's 1,591.07 close ahead of today's Bangkok open. For your clients: <b>with a hike now close to fully priced, tonight's dot plot and Powell's tone — not the rate move itself — will set the market's direction into next week.</b>`, th:`<b>การที่ผลตอบแทนพันธบัตร 10 ปีขึ้นแตะจุดสูงสุดนับตั้งแต่ปี 2007 — ไม่ใช่ผลการตัดสินใจของเฟดที่ยังไม่ประกาศ — คือเรื่องที่สำคัญกว่าต่อพอร์ตของลูกค้าคุณเช้านี้</b> ดัชนี S&P 500 ลดลง 0.45% สู่ 7,585.73 ดัชนี Nasdaq ลดลง 0.78% สู่ 25,981.57 และดัชนี Dow ลดลง 0.63% สู่ 52,093.11 — ปรับลงเป็นวันที่สามติดต่อกัน — แม้หุ้นชิปกลุ่ม AI อย่าง Qualcomm และ AMD จะดีดตัวขึ้น ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวัน ก่อนย่อตัวปิดใกล้ 5.00% ขณะ CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ยวันพุธไว้ที่ราว 92% เพิ่มขึ้นจาก 88% เมื่อวันจันทร์ น้ำมันยังคงยืนสูงจากการหยุดชะงักด้านอุปทานในตะวันออกกลางที่ยังดำเนินต่อเนื่อง (WTI $105.49 +3%; เบรนท์แทบไม่เปลี่ยนแปลงใกล้ $107.46) และทองคำที่ลดลง 1.23% สู่ระดับต่ำสุดในรอบหกสัปดาห์ที่ $4,263.19 แสดงว่าผลตอบแทนพันธบัตรที่สูงยังคงชนะแรงดึงกับความต้องการสินทรัพย์ปลอดภัย ตลาดเอเชียเคลื่อนไหวคละกัน — Nikkei ญี่ปุ่นทรงตัว และ Hang Seng ฮ่องกงแทบไม่ขยับ แต่ Shanghai ลดลง 0.54% — ขณะ SET ไทยยังคงยืนที่ราคาปิดวันอังคารที่ 1,591.07 ก่อนตลาดกรุงเทพฯ จะเปิดทำการวันนี้ สำหรับลูกค้าของคุณ: <b>เมื่อโอกาสขึ้นดอกเบี้ยเกือบถูกสะท้อนในราคาตลาดแล้ว dot plot และน้ำเสียงของพาวเวลล์คืนนี้ — ไม่ใช่การขึ้นดอกเบี้ยเอง — จะเป็นตัวกำหนดทิศทางตลาดในสัปดาห์หน้า</b>`},

    watchnote:{en:`The Fed's rate decision lands today, with CME FedWatch pricing roughly 92% odds of a quarter-point hike — up from 88% Monday, after Tuesday's 10-year yield spike to its highest since 2007 (5.04% intraday) reinforced the case. A day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting: a rare back-to-back week for the world's two most-watched central banks. US equities have now fallen three straight sessions into the decision, even as AI chip names staged a partial bounce Tuesday. <b style="color:var(--muted)">Tonight's FOMC decision and dot plot</b> is the key event of the week — watch whether Powell's tone validates the yield move or pushes back against it.`,
      th:`ผลการตัดสินใจอัตราดอกเบี้ยของเฟดจะประกาศวันนี้ โดย CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ย 0.25% ไว้ที่ราว 92% เพิ่มขึ้นจาก 88% เมื่อวันจันทร์ หลังผลตอบแทนพันธบัตร 10 ปีพุ่งแตะจุดสูงสุดนับตั้งแต่ปี 2007 (5.04% ระหว่างวัน) เมื่อวันอังคาร ยิ่งตอกย้ำเหตุผล หนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก หุ้นสหรัฐฯ ปรับลงต่อเนื่องสามวันก่อนถึงวันตัดสินใจ แม้หุ้นชิปกลุ่ม AI จะดีดตัวกลับบางส่วนวันอังคาร <b style="color:var(--muted)">การตัดสินใจของ FOMC และ dot plot คืนนี้</b> คือเหตุการณ์สำคัญที่สุดของสัปดาห์ — ควรจับตาว่าน้ำเสียงของพาวเวลล์จะยืนยันการเคลื่อนไหวของผลตอบแทนพันธบัตรนี้ หรือจะคัดค้านมัน`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป และเอเชีย วันอังคารที่ 15 ก.ย. ดัชนี SET ของไทยสะท้อนราคาปิดวันอังคาร เนื่องจากตลาดกรุงเทพฯ ยังไม่เปิดทำการ ณ เวลาที่เผยแพร่ และผลการตัดสินใจของเฟดวันพุธยังไม่ประกาศ ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>US stocks fell for a third straight session Tuesday — the S&P 500 -0.45% to 7,585.73, the Dow -0.63% (-328.09 pts) to 52,093.11, the Nasdaq -0.78% to 25,981.57 —</b> as the 10-year Treasury yield spiked to 5.04% intraday, its highest since 2007, before easing to close near 5.00%, even as AI chip names Qualcomm and AMD bounced.`, th:`<b>หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกันวันอังคาร — S&P 500 ลดลง 0.45% สู่ 7,585.73, Dow ลดลง 0.63% (-328.09 จุด) สู่ 52,093.11, Nasdaq ลดลง 0.78% สู่ 25,981.57 —</b> ขณะผลตอบแทนพันธบัตร 10 ปีพุ่งแตะ 5.04% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวปิดใกล้ 5.00% แม้หุ้นชิปกลุ่ม AI อย่าง Qualcomm และ AMD จะดีดตัวขึ้น`},
      why:{en:`A third straight down day with the 10-year at its highest since 2007 tells you this is now a rates story more than an AI-headline story. With the Fed's decision due today and a hike ~92% priced, the key question for clients is whether tonight's dot plot validates this yield move or pushes back against it.`, th:`การปรับลงติดต่อกันเป็นวันที่สาม ขณะพันธบัตร 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007 แสดงว่าตอนนี้เป็นเรื่องราวของอัตราดอกเบี้ยมากกว่าพาดหัวข่าว AI คำถามสำคัญสำหรับลูกค้าเมื่อผลการตัดสินใจของเฟดจะประกาศวันนี้และโอกาสขึ้นดอกเบี้ยสะท้อนในราคาแล้วราว 92% คือ dot plot คืนนี้จะยืนยันการเคลื่อนไหวของผลตอบแทนพันธบัตรนี้ หรือจะคัดค้านมัน`},
      full:{en:`US stocks closed lower Tuesday for a third consecutive session, as investor risk appetite weakened under a sharp rise in Treasury yields ahead of Wednesday's Fed decision. The S&P 500 fell 0.45% to close at 7,585.73, the Dow Jones Industrial Average lost 328.09 points (-0.63%) to 52,093.11, and the Nasdaq Composite declined 0.78% to 25,981.57. Losses were tempered by a bounce in AI-linked chip names — Qualcomm rose more than 4% and AMD gained 2% — a day after those stocks were under pressure. The 10-year Treasury yield hit 5.041% intraday, its highest level since 2007, before easing to close near 5.00%. CME FedWatch put the odds of a quarter-point hike at Wednesday's decision at roughly 92%, up from 88% Monday. WTI crude rose about 3% to $105.49/bbl while Brent held near $107.46, little changed, as Middle East supply disruptions persisted and oil stayed above $108/bbl on some benchmarks. Gold fell 1.23% to $4,263.19/oz, a six-week low, as high yields and a firm dollar continued to outweigh safe-haven demand. The Fed's decision is due Wednesday afternoon in Washington — overnight Bangkok time — with the Bank of Japan following September 17-18.`, th:`หุ้นสหรัฐฯ ปิดตลาดต่ำลงวันอังคาร เป็นการปรับลงติดต่อกันเป็นวันที่สาม ขณะความต้องการสินทรัพย์เสี่ยงของนักลงทุนอ่อนแอลงจากผลตอบแทนพันธบัตรที่พุ่งขึ้นแรงก่อนการตัดสินใจของเฟดวันพุธ ดัชนี S&P 500 ลดลง 0.45% ปิดที่ 7,585.73 ดัชนี Dow Jones ลดลง 328.09 จุด (-0.63%) สู่ 52,093.11 และดัชนี Nasdaq Composite ลดลง 0.78% สู่ 25,981.57 แรงเทขายถูกลดทอนบางส่วนจากหุ้นชิปกลุ่ม AI ที่ดีดตัว — Qualcomm เพิ่มขึ้นกว่า 4% และ AMD เพิ่มขึ้น 2% หนึ่งวันหลังหุ้นกลุ่มนี้ถูกกดดัน ผลตอบแทนพันธบัตร 10 ปีแตะ 5.041% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวปิดใกล้ 5.00% CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ย 0.25% ในการตัดสินใจวันพุธไว้ที่ราว 92% เพิ่มขึ้นจาก 88% เมื่อวันจันทร์ น้ำมันดิบ WTI เพิ่มขึ้นราว 3% สู่ $105.49 ต่อบาร์เรล ขณะเบรนท์ยืนใกล้ $107.46 แทบไม่เปลี่ยนแปลง จากการหยุดชะงักด้านอุปทานในตะวันออกกลางที่ยังดำเนินต่อเนื่อง ทองคำลดลง 1.23% สู่ $4,263.19 ต่อออนซ์ ต่ำสุดในรอบหกสัปดาห์ เมื่อผลตอบแทนพันธบัตรที่สูงและดอลลาร์ที่แข็งค่ายังคงมีน้ำหนักมากกว่าความต้องการสินทรัพย์ปลอดภัย ผลการตัดสินใจของเฟดจะประกาศช่วงบ่ายวันพุธตามเวลาวอชิงตัน ซึ่งตรงกับกลางคืนตามเวลากรุงเทพฯ ตามด้วยธนาคารกลางญี่ปุ่นวันที่ 17-18 กันยายน`},
      sources:[{l:"CNBC/Yahoo — Sept 15 close, 10Y yield tops 2007 high",u:"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-september-15-dow-sp-500-nasdaq-081307838.html"},{l:"Bloomberg — US 10-Year Treasury Yields Rise to Highest Since 2007",u:"https://www.bloomberg.com/news/articles/2026-09-15/us-10-year-treasury-yields-rise-to-highest-level-since-2007"},{l:"USAGOLD — Daily Precious Metals Market Report, Sept 15",u:"https://www.usagold.com/daily-precious-metals-market-report-september-15-2026/"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,109.20", chg:-1.14, series:[25398.75,25109.20],
      txt:{en:`<b>DAX fell 1.14% to roughly 25,109 Tuesday,</b> its steepest drop in weeks, as software, industrial and construction names led declines alongside a fresh rise in oil and Treasury yields.`, th:`<b>DAX ลดลง 1.14% สู่ราว 25,109 วันอังคาร</b> ปรับลงแรงสุดในรอบหลายสัปดาห์ นำโดยหุ้นกลุ่มซอฟต์แวร์ อุตสาหกรรม และก่อสร้าง ขณะราคาน้ำมันและผลตอบแทนพันธบัตรพุ่งขึ้นรอบใหม่`},
      why:{en:`A steeper drop than Wall Street's for the second straight session confirms Europe is still trading as a high-beta follower of the US-led, yield-driven selloff, not a diversifier. Flag that to clients using European equities purely for diversification this week, with tonight's Fed decision the next catalyst.`, th:`การที่ยุโรปปรับลงแรงกว่าวอลล์สตรีทเป็นเซสชันที่สองติดต่อกัน ยืนยันว่าภูมิภาคนี้ยังคงเทรดในฐานะผู้ตามที่มีความผันผวนสูงต่อแรงเทขายที่นำโดยสหรัฐฯ และขับเคลื่อนด้วยผลตอบแทนพันธบัตร ไม่ใช่ตัวกระจายความเสี่ยง ควรแจ้งเตือนลูกค้าที่ใช้หุ้นยุโรปเพื่อกระจายความเสี่ยงล้วนๆ ในสัปดาห์นี้ โดยผลการตัดสินใจของเฟดคืนนี้คือปัจจัยกระตุ้นถัดไป`},
      full:{en:`European shares fell Tuesday, with Germany's DAX closing down 1.14% at roughly 25,109, as risk sentiment soured further alongside US equities heading into the Fed decision. Losses were led by software, industrial and construction names, compounded by a fresh rise in oil prices amid continued Middle East supply disruptions and a spike in global bond yields, with the 10-year US Treasury touching its highest since 2007. The broader Euro Stoxx 50 and Stoxx 600 also declined, with banks among the biggest drags as higher yields pressured the sector.`, th:`หุ้นยุโรปปรับลงวันอังคาร ดัชนี DAX เยอรมนีปิดตลาดลดลง 1.14% สู่ราว 25,109 ขณะบรรยากาศเสี่ยงแย่ลงต่อเนื่องสอดคล้องกับหุ้นสหรัฐฯ ก่อนถึงวันตัดสินใจของเฟด แรงเทขายนำโดยหุ้นกลุ่มซอฟต์แวร์ อุตสาหกรรม และก่อสร้าง ซ้ำเติมด้วยราคาน้ำมันที่พุ่งขึ้นรอบใหม่จากการหยุดชะงักด้านอุปทานในตะวันออกกลางที่ยังดำเนินต่อเนื่อง และผลตอบแทนพันธบัตรทั่วโลกที่พุ่งขึ้น โดยพันธบัตรสหรัฐฯ 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007 ดัชนี Euro Stoxx 50 และ Stoxx 600 ในวงกว้างก็ปรับลงเช่นกัน โดยหุ้นกลุ่มธนาคารเป็นตัวฉุดหลักจากผลตอบแทนพันธบัตรที่สูงขึ้นกดดันกลุ่มนี้`},
      sources:[{l:"Investing.com — Germany stocks lower at close",u:"https://www.investing.com/indices/germany-30"},{l:"Yahoo Finance — Europe shares slip as banks drag",u:"https://finance.yahoo.com/economy/policy/articles/europe-shares-slip-banks-drag-072039280.html"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"63,484.10", chg:-0.01, series:[63492.99,63484.10],
      txt:{en:`<b>Nikkei 225 was little changed Tuesday, down just 0.01% to 63,484.10,</b> as a partial bounce in chip and AI-supply-chain names offset continued pressure from elevated oil prices and Treasury yields.`, th:`<b>Nikkei 225 แทบไม่เปลี่ยนแปลงวันอังคาร ลดลงเพียง 0.01% สู่ 63,484.10</b> ขณะหุ้นกลุ่มชิปและซัพพลายเชน AI ที่ดีดตัวกลับบางส่วนช่วยชดเชยแรงกดดันจากราคาน้ำมันและผลตอบแทนพันธบัตรที่ยังคงสูงต่อเนื่อง`},
      why:{en:`Tokyo essentially flatlining after Monday's 0.81% drop suggests the AI-slowdown selloff is losing momentum locally even as US yields keep climbing — a divergence worth flagging, since it means the region isn't automatically taking its cue from Wall Street's third straight down day.`, th:`การที่โตเกียวแทบทรงตัวหลังปรับลง 0.81% เมื่อวันจันทร์ บ่งชี้ว่าแรงเทขายจากคำเตือนชะลอ AI ในภูมิภาคเริ่มอ่อนแรงลง แม้ผลตอบแทนพันธบัตรสหรัฐฯ จะยังไต่ขึ้นต่อ — เป็นความแตกต่างที่ควรแจ้งเตือน เนื่องจากแสดงว่าภูมิภาคนี้ไม่ได้เคลื่อนไหวตามวอลล์สตรีทที่ปรับลงเป็นวันที่สามติดต่อกันโดยอัตโนมัติ`},
      full:{en:`Japanese equities were little changed Tuesday, with the Nikkei 225 down just 0.01% (roughly -8.9 points) to close at 63,484.10. The muted move came as a partial bounce in chip and AI-supply-chain names — tracking a similar recovery in US names like Qualcomm and AMD — offset continued pressure from elevated oil prices and a fresh spike in US Treasury yields, with the 10-year touching its highest since 2007 intraday. Attention now turns to Wednesday's Fed decision and the Bank of Japan's own meeting September 17-18.`, th:`หุ้นญี่ปุ่นแทบไม่เปลี่ยนแปลงวันอังคาร ดัชนี Nikkei 225 ลดลงเพียง 0.01% (ราว -8.9 จุด) ปิดที่ 63,484.10 การเคลื่อนไหวที่นิ่งนี้เกิดขึ้นขณะหุ้นกลุ่มชิปและซัพพลายเชน AI ดีดตัวกลับบางส่วน — สอดคล้องกับการฟื้นตัวของหุ้นสหรัฐฯ อย่าง Qualcomm และ AMD — ช่วยชดเชยแรงกดดันจากราคาน้ำมันที่สูงและผลตอบแทนพันธบัตรสหรัฐฯ ที่พุ่งขึ้นรอบใหม่ โดยพันธบัตร 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007 ระหว่างวัน ตอนนี้ต้องจับตาผลการตัดสินใจของเฟดวันพุธ และการประชุมของธนาคารกลางญี่ปุ่นเองวันที่ 17-18 ก.ย.`},
      sources:[{l:"Trading Economics — Japan",u:"https://tradingeconomics.com/japan/stock-market"},{l:"Bloomberg — Asian Stocks Markets Wrap",u:"https://www.bloomberg.com/news/articles/2026-09-14/asian-stocks-to-fall-on-ai-key-us-yield-tops-5-markets-wrap"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,667.24", chg:-0.08, series:[24687.00,24667.24],
      txt:{en:`<b>Hang Seng eased 0.08% to 24,667 Tuesday, a fifth straight losing session, while the Shanghai Composite fell a sharper 0.54% to 3,864.28</b> — a reversal from Monday, as mainland-specific selling picked up even as Hong Kong's tech-heavy index found some stability.`, th:`<b>Hang Seng ลดลง 0.08% สู่ 24,667 วันอังคาร ปรับลงเป็นเซสชันที่ห้าติดต่อกัน ขณะ Shanghai Composite ลดลงแรงกว่าที่ 0.54% สู่ 3,864.28</b> — สวนทางกับวันจันทร์ โดยแรงเทขายเฉพาะของจีนแผ่นดินใหญ่เพิ่มขึ้น ขณะดัชนีฮ่องกงที่มีสัดส่วนหุ้นเทคสูงเริ่มทรงตัวได้บ้าง`},
      why:{en:`A fifth straight losing session for Hong Kong, even a mild one, is worth flagging on its own — but the bigger shift is Shanghai now underperforming Hang Seng, a reversal from Monday that suggests mainland-specific pressure (rather than the AI/tech story) is back in the driver's seat for China.`, th:`การที่ฮ่องกงปรับลงติดต่อกันเป็นเซสชันที่ห้า แม้จะเป็นการปรับลงเล็กน้อย ก็ควรแจ้งเตือนในตัวเอง แต่การเปลี่ยนแปลงที่สำคัญกว่าคือเซี่ยงไฮ้ปรับลงมากกว่าฮ่องกงในรอบนี้ สวนทางกับวันจันทร์ ซึ่งบ่งชี้ว่าแรงกดดันเฉพาะของจีนแผ่นดินใหญ่ (มากกว่าเรื่องราวหุ้นกลุ่ม AI/เทค) กลับมาเป็นปัจจัยหลักของจีนอีกครั้ง`},
      full:{en:`Hong Kong and mainland China diverged again Tuesday, but in the opposite direction from Monday: the Hang Seng eased just 0.08% to close at 24,667.24, its fifth consecutive losing session but a far milder decline than earlier in the week, as a bounce in AI/tech names offered some support. The Shanghai Composite, by contrast, fell a sharper 0.54% to 3,864.28, suggesting mainland-specific selling pressure picked up even as Hong Kong's tech-heavy index stabilized. Both markets remain on watch for Wednesday's Fed decision and its knock-on effect on regional rate expectations.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่เคลื่อนไหวสวนทางกันอีกครั้งวันอังคาร แต่คราวนี้สลับทิศทางจากวันจันทร์: ดัชนี Hang Seng ลดลงเพียง 0.08% ปิดที่ 24,667.24 ปรับลงติดต่อกันเป็นเซสชันที่ห้า แต่เบากว่าช่วงต้นสัปดาห์มาก ขณะหุ้นกลุ่ม AI/เทคที่ดีดตัวช่วยพยุงตลาดไว้บ้าง ในทางตรงข้าม ดัชนี Shanghai Composite ลดลงแรงกว่าที่ 0.54% สู่ 3,864.28 บ่งชี้ว่าแรงเทขายเฉพาะของจีนแผ่นดินใหญ่เพิ่มขึ้น แม้ดัชนีฮ่องกงที่มีสัดส่วนหุ้นเทคสูงจะเริ่มทรงตัว ทั้งสองตลาดยังคงจับตาผลการตัดสินใจของเฟดวันพุธและผลกระทบต่อความคาดหวังดอกเบี้ยในภูมิภาค`},
      sources:[{l:"Trading Economics — China",u:"https://tradingeconomics.com/china/stock-market"},{l:"24/7 Wall St. — Hang Seng market bell",u:"https://247wallst.com/cards/a-flat-hong-kong-open-turned-into-a-0-9-loss-by-the-bell-t-hsi-market-bell-01m2j1gb83ka6jf2d6a1ad7k3s"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,591.07", chg:-0.84, series:[1604.52,1591.07],
      txt:{en:`<b>SET Index fell 0.84% to 1,591.07 Monday (-13.45pts),</b> on turnover of about THB 61.89bn, as selling pressure in electronics bellwether DELTA and its peers tracked a global tech-linked selloff, alongside concerns over the Fed's rate direction and elevated bond yields.`, th:`<b>ดัชนี SET ลดลง 0.84% สู่ 1,591.07 วันจันทร์ (-13.45 จุด)</b> มูลค่าการซื้อขายราว 6.189 หมื่นล้านบาท จากแรงเทขายหุ้น DELTA และหุ้นกลุ่มอิเล็กทรอนิกส์ที่เคลื่อนไหวตามแรงเทขายหุ้นเทคทั่วโลก ควบคู่กับความกังวลเรื่องทิศทางดอกเบี้ยเฟดและผลตอบแทนพันธบัตรที่สูง`},
      why:{en:`A DELTA-led, electronics-specific decline — Thailand's version of the global AI-supply-chain selloff hitting Japan and Korea — shows the Thai market isn't insulated from the tech story even though it's a small piece of the SET. Watch whether the sell-off broadens beyond electronics if global yields stay elevated into Wednesday's Fed decision.`, th:`การปรับลงที่นำโดย DELTA และหุ้นกลุ่มอิเล็กทรอนิกส์โดยเฉพาะ — ซึ่งเป็นเวอร์ชันไทยของแรงเทขายซัพพลายเชน AI ทั่วโลกที่กระทบญี่ปุ่นและเกาหลี — แสดงว่าตลาดไทยไม่ได้แยกขาดจากเรื่องราวหุ้นเทค แม้จะเป็นสัดส่วนเล็กในดัชนี SET ควรจับตาว่าแรงเทขายจะขยายวงกว้างเกินกลุ่มอิเล็กทรอนิกส์หรือไม่ หากผลตอบแทนพันธบัตรโลกยังคงสูงต่อเนื่องจนถึงการตัดสินใจของเฟดวันพุธ`},
      full:{en:`Thailand's SET Index closed Monday at 1,591.07, down 13.45 points (-0.84%), on turnover of about THB 61.89 billion, as selling pressure in electronics bellwether DELTA and related names tracked a broader global downtrend in technology shares tied to the AI-slowdown story. Concerns over the direction of Wednesday's Fed decision and still-elevated global bond yields — the 10-year US Treasury touched 5.01% intraday — added to the cautious tone. Attention now turns to whether the electronics-led weakness broadens or stabilizes as the region digests both the Fed's two-day meeting starting Tuesday and the Bank of Japan's Sep 17-18 decision.`, th:`ดัชนี SET ของไทยปิดตลาดวันจันทร์ที่ 1,591.07 ลดลง 13.45 จุด (-0.84%) มูลค่าการซื้อขายราว 6.189 หมื่นล้านบาท จากแรงเทขายหุ้น DELTA ซึ่งเป็นหุ้นอิเล็กทรอนิกส์นำตลาด และหุ้นที่เกี่ยวข้อง ซึ่งเคลื่อนไหวตามแนวโน้มขาลงของหุ้นเทคโนโลยีทั่วโลกที่เชื่อมโยงกับเรื่องราวชะลอ AI ความกังวลเรื่องทิศทางการตัดสินใจของเฟดวันพุธและผลตอบแทนพันธบัตรโลกที่ยังสูง — พันธบัตรสหรัฐฯ 10 ปีแตะ 5.01% ระหว่างวัน — เพิ่มบรรยากาศระมัดระวัง ตอนนี้ต้องจับตาว่าความอ่อนแอที่นำโดยกลุ่มอิเล็กทรอนิกส์จะขยายวงหรือทรงตัว ขณะภูมิภาคย่อยข้อมูลทั้งการประชุมเฟดสองวันที่เริ่มวันอังคาร และการตัดสินใจของ BOJ วันที่ 17-18 ก.ย.`},
      sources:[{l:"Kaohoon International — Market Roundup 14 Sep",u:"https://www.kaohooninternational.com/markets/590667"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil stayed elevated Tuesday on continued Middle East supply disruptions — WTI rose 3% to $105.49/bbl, Brent held near $107.46, little changed from Monday's $108.34. Gold fell 1.23% to $4,263.19/oz,</b> a six-week low, as high yields and a firm dollar continued to outweigh safe-haven demand ahead of the Fed decision.`, th:`<b>น้ำมันยังคงยืนสูงวันอังคารจากการหยุดชะงักด้านอุปทานในตะวันออกกลางที่ยังดำเนินต่อเนื่อง — WTI เพิ่มขึ้น 3% สู่ $105.49 ต่อบาร์เรล เบรนท์ยืนใกล้ $107.46 แทบไม่เปลี่ยนแปลงจาก $108.34 วันจันทร์ ทองคำลดลง 1.23% สู่ $4,263.19 ต่อออนซ์</b> ต่ำสุดในรอบหกสัปดาห์ เมื่อผลตอบแทนพันธบัตรที่สูงและดอลลาร์ที่แข็งค่ายังคงมีน้ำหนักมากกว่าความต้องการสินทรัพย์ปลอดภัยก่อนผลการตัดสินใจของเฟด`},
     why:{en:`Gold sliding to a fresh six-week low even as equities sell off for a third day is the clearest signal yet that this remains a rates-driven market, not a fear-driven one — real yields at their highest since 2007 are simply too attractive an alternative. WTI diverging higher while Brent holds steady is also worth flagging: it points to US-specific supply tightness layered on top of the broader Middle East risk premium.`, th:`การที่ทองคำร่วงสู่จุดต่ำสุดใหม่ในรอบหกสัปดาห์ แม้หุ้นจะเทขายต่อเนื่องเป็นวันที่สาม คือสัญญาณที่ชัดเจนที่สุดว่าตลาดยังคงถูกขับเคลื่อนโดยอัตราดอกเบี้ยมากกว่าความกลัว — ผลตอบแทนพันธบัตรที่แท้จริงซึ่งสูงสุดนับตั้งแต่ปี 2007 เป็นทางเลือกที่น่าดึงดูดเกินไปสำหรับนักลงทุน การที่ WTI ปรับขึ้นสวนทางเบรนท์ที่ทรงตัวก็ควรแจ้งเตือนเช่นกัน — บ่งชี้ถึงภาวะอุปทานตึงตัวเฉพาะของสหรัฐฯ ซ้อนทับกับพรีเมียมความเสี่ยงตะวันออกกลางในวงกว้าง`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The Fed's rate decision lands today, with CME FedWatch pricing roughly 92% odds of a quarter-point hike — up from 88% Monday.</b> The 10-year Treasury yield touched 5.04% intraday Tuesday, its highest since 2007, before easing to close near 5.00%, with the 30-year near 5.25%. A day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting — a rare back-to-back week for the world's two most-watched central banks, now set against a third straight down day for US equities.`, th:`<b>ผลการตัดสินใจอัตราดอกเบี้ยของเฟดจะประกาศวันนี้ โดย CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ย 0.25% ไว้ที่ราว 92% เพิ่มขึ้นจาก 88% เมื่อวันจันทร์</b> ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวันอังคาร สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวปิดใกล้ 5.00% ขณะพันธบัตร 30 ปียืนใกล้ 5.25% หนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก ซึ่งตอนนี้เกิดขึ้นท่ามกลางหุ้นสหรัฐฯ ที่ปรับลงเป็นวันที่สามติดต่อกัน`},
     why:{en:`With hike odds now near 92% and the 10-year at its highest since 2007, the market is telling you the hike itself is essentially locked in — the real event risk tonight is the dot plot and Powell's tone on the path beyond September. Have both a "hawkish hold" and "hike-and-pause" scenario ready for clients, with BOJ a second live risk right behind it.`, th:`เมื่อโอกาสขึ้นดอกเบี้ยขยับสู่ราว 92% และพันธบัตร 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007 ตลาดกำลังบอกว่าการขึ้นดอกเบี้ยเองแทบจะถูกกำหนดไว้แล้ว — ความเสี่ยงที่แท้จริงของคืนนี้คือ dot plot และน้ำเสียงของพาวเวลล์เรื่องทิศทางหลังเดือนกันยายน ควรเตรียมสถานการณ์ทั้ง "คงดอกเบี้ยแบบสายเหยี่ยว" และ "ขึ้นแล้วหยุดพัก" ให้ลูกค้าพร้อม โดยมี BOJ เป็นความเสี่ยงที่สองตามมาติดๆ`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Trump's pressure campaign on the Fed continues even as hike odds climb to roughly 92%, with the Vice President and Treasury Secretary still urging a hold or cut. Oil stayed elevated Tuesday on continued Middle East supply disruptions rather than any fresh Trump-brokered de-escalation. Section 338 tariffs remain in effect and the ~7.5% China "overcapacity" tariff still looms ahead of a planned Trump-Xi summit.`, th:`แคมเปญกดดันเฟดของทรัมป์ยังดำเนินต่อ แม้โอกาสขึ้นดอกเบี้ยจะขยับขึ้นสู่ราว 92% โดยรองประธานาธิบดีและรัฐมนตรีคลังยังคงเรียกร้องให้คงหรือลดดอกเบี้ย น้ำมันยังคงยืนสูงวันอังคารจากการหยุดชะงักด้านอุปทานในตะวันออกกลางที่ยังดำเนินต่อเนื่อง ไม่มีการคลี่คลายสถานการณ์ใหม่ที่ทรัมป์มีส่วนผลักดัน มาตรการภาษีมาตรา 338 ยังคงมีผลบังคับใช้ และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้`}, w:{en:`Hike odds climbing to 92% despite continued White House pressure confirms political jawboning still isn't moving pricing — with a hike essentially locked in, tonight's dot plot and Powell's tone are what will actually move markets, not the vote itself.`, th:`การที่โอกาสขึ้นดอกเบี้ยขยับขึ้นสู่ 92% แม้ทำเนียบขาวจะกดดันต่อเนื่อง ยืนยันว่าแรงกดดันทางการเมืองยังไม่มีผลต่อการตั้งราคาตลาด เมื่อการขึ้นดอกเบี้ยแทบถูกกำหนดไว้แล้ว dot plot และน้ำเสียงของพาวเวลล์คืนนี้ต่างหากที่จะขยับตลาดจริง ไม่ใช่การลงมติเอง`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Middle East supply disruptions kept oil elevated for a second straight session Tuesday — WTI rose 3% to $105.49/bbl while Brent held near $107.46, little changed from Monday's $108.34 — with no sign yet of the kind of de-escalation that briefly pulled crude off its highs earlier in the week.`, th:`การหยุดชะงักด้านอุปทานในตะวันออกกลางทำให้น้ำมันยืนสูงต่อเนื่องเป็นเซสชันที่สองวันอังคาร — WTI เพิ่มขึ้น 3% สู่ $105.49 ต่อบาร์เรล ขณะเบรนท์ยืนใกล้ $107.46 แทบไม่เปลี่ยนแปลงจาก $108.34 วันจันทร์ — ยังไม่มีสัญญาณการคลี่คลายสถานการณ์แบบที่เคยดึงราคาน้ำมันลงจากจุดสูงสุดช่วงต้นสัปดาห์`}, w:{en:`WTI pushing higher while Brent merely holds steady is worth flagging to clients: it suggests the marginal pressure right now is on US-specific supply and logistics, not just the broader Middle East risk premium. Watch whether that gap widens or closes as the region digests tonight's Fed decision.`, th:`การที่ WTI ปรับขึ้นขณะเบรนท์เพียงทรงตัว ควรแจ้งเตือนลูกค้า — บ่งชี้ว่าแรงกดดันส่วนเพิ่มตอนนี้อยู่ที่อุปทานและโลจิสติกส์เฉพาะของสหรัฐฯ มากกว่าพรีเมียมความเสี่ยงตะวันออกกลางในวงกว้าง ควรจับตาว่าส่วนต่างนี้จะขยายหรือแคบลง ขณะภูมิภาครับมือผลการตัดสินใจของเฟดคืนนี้`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The Fed's rate decision lands today, with CME FedWatch pricing roughly 92% odds of a quarter-point hike — up from 88% Monday, after Tuesday's 10-year yield spike to 5.04% intraday, its highest since 2007. A day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting — a rare back-to-back week for the two most-watched central banks — now set against a third straight down day for US equities.`, th:`ผลการตัดสินใจอัตราดอกเบี้ยของเฟดจะประกาศวันนี้ โดย CME FedWatch ประเมินโอกาสขึ้นดอกเบี้ย 0.25% ไว้ที่ราว 92% เพิ่มขึ้นจาก 88% เมื่อวันจันทร์ หลังผลตอบแทนพันธบัตร 10 ปีพุ่งแตะ 5.04% ระหว่างวันอังคาร สูงสุดนับตั้งแต่ปี 2007 หนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก ซึ่งตอนนี้เกิดขึ้นท่ามกลางหุ้นสหรัฐฯ ที่ปรับลงเป็นวันที่สามติดต่อกัน`}, w:{en:`Odds climbing to 92% on a fresh cycle-high yield print tells you the hike is close to fully priced — the real swing factor is whether the Fed's tone (and BOJ's a day later) leans hawkish enough to compound market unease, or whether tonight's dot plot offers some balance. Have both a "hawkish hold" and "hike-and-pause" scenario ready for clients, and flag BOJ as a second live risk.`, th:`การที่โอกาสขยับขึ้นสู่ 92% พร้อมผลตอบแทนพันธบัตรแตะจุดสูงสุดใหม่ของรอบ บ่งชี้ว่าการขึ้นดอกเบี้ยเกือบถูกสะท้อนในราคาตลาดไปแล้ว — ปัจจัยชี้ขาดจริงคือน้ำเสียงของเฟด (และ BOJ ในวันถัดมา) จะสายเหยี่ยวมากพอจนซ้ำเติมความกังวลของตลาดหรือไม่ หรือ dot plot คืนนี้จะช่วยสร้างสมดุลได้บ้าง ควรเตรียมสถานการณ์ทั้ง "คงดอกเบี้ยแบบสายเหยี่ยว" และ "ขึ้นแล้วหยุดพัก" ให้ลูกค้า และแจ้งเตือนว่า BOJ คือความเสี่ยงที่สองที่ต้องจับตา`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`No new CPI data has landed since last Friday's hotter-than-expected core reading, but the market's inflation read is still coming from bond yields rather than data: the 10-year touched 5.04% intraday Tuesday — its highest since 2007 — while oil stayed elevated on continued Middle East supply disruptions.`, th:`ยังไม่มีตัวเลข CPI ใหม่นับตั้งแต่ Core CPI ที่ร้อนแรงกว่าคาดวันศุกร์ที่แล้ว แต่การอ่านสัญญาณเงินเฟ้อของตลาดยังคงมาจากผลตอบแทนพันธบัตรมากกว่าตัวข้อมูล: พันธบัตร 10 ปีแตะ 5.04% ระหว่างวันอังคาร สูงสุดนับตั้งแต่ปี 2007 ขณะน้ำมันยังคงยืนสูงจากการหยุดชะงักด้านอุปทานในตะวันออกกลางที่ยังดำเนินต่อเนื่อง`}, w:{en:`Yields doing the inflation-repricing work in the absence of new data is unusual, and it leaves tonight's Fed dot plot as the next real catalyst rather than a scheduled data release. Frame client conversations around "hike now, hawkish pause" as the base case, with the FOMC's updated inflation projections as the number to watch.`, th:`การที่ผลตอบแทนพันธบัตรทำหน้าที่ปรับราคาเงินเฟ้อแทนในช่วงที่ไม่มีข้อมูลใหม่ถือเป็นเรื่องผิดปกติ และทำให้ dot plot ของเฟดคืนนี้เป็นตัวกระตุ้นถัดไปที่แท้จริง มากกว่าการประกาศข้อมูลตามกำหนดการ ควรวางกรอบการสนทนากับลูกค้าโดยยึด "ขึ้นดอกเบี้ยตอนนี้ แล้วหยุดพักแบบสายเหยี่ยว" เป็นกรณีฐาน โดยจับตาตัวเลขประมาณการเงินเฟ้อที่ปรับใหม่ของ FOMC เป็นพิเศษ`}},

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 8 Sep",th:"อังคาร 8 ก.ย."}, imp:"h", t:{en:"Wall Street reopens for the first time since the tanker war, with hike odds near 60%",th:"วอลล์สตรีทเปิดตลาดอีกครั้งเป็นครั้งแรกหลังสงครามเรือบรรทุกน้ำมัน ขณะโอกาสขึ้นดอกเบี้ยใกล้ 60%"}, d:{en:"US markets reopen Tuesday after the Labor Day break, giving the first direct pricing of both the weekend's Iran-tanker escalation and the climb in September rate-hike odds to roughly 60%. Oil (Brent near $98, WTI above $92) and the elevated 10-year yield (~4.79%) will be the key signals to watch as trading resumes.",th:"ตลาดสหรัฐฯ เปิดทำการอีกครั้งวันอังคารหลังหยุดวันแรงงาน เป็นการสะท้อนราคาโดยตรงครั้งแรกทั้งการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ขยับขึ้นสู่ราว 60% ราคาน้ำมัน (เบรนท์ใกล้ $98, WTI เหนือ $92) และผลตอบแทนพันธบัตร 10 ปีที่สูงขึ้น (~4.79%) จะเป็นสัญญาณสำคัญที่ต้องจับตาเมื่อการซื้อขายกลับมาดำเนินต่อ"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 9 Sep",th:"พุธ 9 ก.ย."}, imp:"h", t:{en:"Oil tops $101 as tanker war's worst wave yet hits Wall St a third day",th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"}, d:{en:"The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%); national gas hit $4.22/gal and diesel a record $5.94/gal. The S&P 500 fell 0.48% to 7,636.36 (a third straight down day), the DAX slid 1.74% to a one-month low of 25,554, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. September hike odds eased slightly to ~57%.",th:"สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ดัชนี S&P 500 ลดลง 0.48% สู่ 7,636.36 (ปรับลงวันที่สามติดต่อกัน) ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือนที่ 25,554 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 10 Sep",th:"พฤหัสฯ 10 ก.ย."}, imp:"h", t:{en:"Wall St falls a fourth day; hike odds jump to ~72% as yields near 5%",th:"วอลล์สตรีทร่วงวันที่สี่ โอกาสขึ้นดอกเบี้ยพุ่งสู่ราว 72% ผลตอบแทนใกล้ 5%"}, d:{en:"US stocks fell a fourth straight session — S&P 500 -0.58% to 7,591.70, Dow -0.6% to 52,064.10, Nasdaq -0.65% to 26,081.72 — as the 10-year Treasury yield pushed above 4.9% and Wednesday's in-line PPI kept inflation in focus. September hike odds jumped to roughly 72%, from ~57% a day earlier. Germany's DAX fell 0.8% to 25,401 after the ECB hiked 25bp; Hong Kong's Hang Seng dropped 1.27% while Japan's Nikkei edged up 0.20% and Thailand's SET eased 0.17% on profit-taking. Oil held near $101 and gold rose to $4,405.88.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกัน — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 0.6% สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 — ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% และ PPI วันพุธที่ออกมาตามคาดยังตอกย้ำแรงกดดันเงินเฟ้อ โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% จากราว 57% เมื่อวันก่อน ดัชนี DAX เยอรมนีลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ย 25bp ดัชนี Hang Seng ฮ่องกงลดลง 1.27% ขณะ Nikkei ญี่ปุ่นขยับขึ้น 0.20% และ SET ไทยลดลง 0.17% จากแรงขายทำกำไร น้ำมันยืนใกล้ $101 และทองคำเพิ่มขึ้นสู่ $4,405.88"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 11 Sep",th:"ศุกร์ 11 ก.ย."}, imp:"h", t:{en:"Hot core CPI pushes Sep 16 hike odds to ~90%; stocks rally, oil tumbles",th:"Core CPI ร้อนแรงดันโอกาสขึ้นดอกเบี้ย 16 ก.ย. สู่ราว 90% หุ้นดีดตัว น้ำมันร่วง"}, d:{en:"August headline CPI matched forecasts (+0.4% m/m, +3.4% y/y) but core CPI ran hot (+0.3% m/m vs +0.2% expected, +2.4% y/y), pushing Sep 16 hike odds to roughly 90% from ~72% Thursday. The S&P 500 rose 0.86% to 7,656.98, the Dow gained 509.19 pts (+0.98%) to 52,573.29, and the Nasdaq added 0.96% to 26,333.04. The 10-year yield touched 4.98% before easing to ~4.92%, and Brent tumbled 2.8% to $104.61 after Iran signaled Oman talks over the Strait of Hormuz. Earlier, before the print, Asia and Europe stayed mixed: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%.",th:"CPI ทั่วไปเดือน ส.ค. ตรงตามคาด (+0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อน) แต่ Core CPI ร้อนแรงกว่าคาด (+0.3% เทียบเดือนก่อน เทียบคาดการณ์ 0.2%, +2.4% เทียบปีก่อน) ดันโอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. สู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ดัชนี S&P 500 เพิ่มขึ้น 0.86% สู่ 7,656.98 ดัชนี Dow เพิ่มขึ้น 509.19 จุด (+0.98%) สู่ 52,573.29 และดัชนี Nasdaq เพิ่มขึ้น 0.96% สู่ 26,333.04 ผลตอบแทนพันธบัตร 10 ปีแตะ 4.98% ก่อนย่อตัวสู่ราว 4.92% และเบรนท์ร่วง 2.8% สู่ $104.61 หลังอิหร่านส่งสัญญาณเจรจาที่โอมานเรื่องช่องแคบฮอร์มุซ ก่อนหน้านั้น ก่อนตัวเลขจะประกาศ ตลาดเอเชียและยุโรปเคลื่อนไหวคละกัน: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 14 Sep",th:"จันทร์ 14 ก.ย."}, imp:"h", t:{en:"AI-slowdown selloff runs a full session; 10-year yield tops 5% intraday",th:"แรงเทขาย AI ดำเนินต่อเนื่องเต็มเซสชัน ผลตอบแทน 10 ปีทะลุ 5% ระหว่างวัน"}, d:{en:"US stocks fell a second straight session — S&P 500 -0.48% to 7,619.98, Dow -0.29% to 52,421.20, Nasdaq -0.56% to 26,186.41 — as the weekend's AI-slowdown warnings ran through a full session and the 10-year Treasury yield touched 5.01% intraday before easing to ~4.96%. DAX fell 0.66% to 25,398.75, Nikkei dropped 0.81% to 63,492.99, Hang Seng fell 0.48% to 24,687 (a 4th straight losing session), Shanghai eased 0.07% to 3,885, and Thailand's SET fell 0.84% to 1,591.07 on a DELTA-led electronics selloff. Brent settled $108.34 (+3.6%) and gold fell 1.25% to $4,284.48, its lowest since August.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สองติดต่อกัน — S&P 500 ลดลง 0.48% สู่ 7,619.98, Dow ลดลง 0.29% สู่ 52,421.20, Nasdaq ลดลง 0.56% สู่ 26,186.41 — ขณะคำเตือนชะลอ AI ช่วงสุดสัปดาห์ดำเนินต่อเนื่องเต็มเซสชัน และผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน ก่อนย่อตัวสู่ราว 4.96% ดัชนี DAX ลดลง 0.66% สู่ 25,398.75 ดัชนี Nikkei ลดลง 0.81% สู่ 63,492.99 ดัชนี Hang Seng ลดลง 0.48% สู่ 24,687 (ปรับลงติดต่อกันเป็นเซสชันที่สี่) ดัชนี Shanghai ลดลง 0.07% สู่ 3,885 และดัชนี SET ไทยลดลง 0.84% สู่ 1,591.07 จากแรงเทขายหุ้นอิเล็กทรอนิกส์ที่นำโดย DELTA เบรนท์ปิดที่ $108.34 (+3.6%) และทองคำลดลง 1.25% สู่ $4,284.48 ต่ำสุดตั้งแต่เดือนสิงหาคม"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 15 Sep",th:"อังคาร 15 ก.ย."}, imp:"h", t:{en:"Wall St falls a third day as the 10-year yield hits its highest since 2007",th:"วอลล์สตรีทร่วงวันที่สาม ผลตอบแทน 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007"}, d:{en:"US stocks fell a third straight session — S&P 500 -0.45% to 7,585.73, Dow -0.63% to 52,093.11, Nasdaq -0.78% to 25,981.57 — even as AI chip names Qualcomm and AMD bounced. The 10-year Treasury yield touched 5.04% intraday, its highest since 2007, before easing to ~5.00%, and CME FedWatch pushed hike odds to roughly 92% from 88% Monday. DAX fell 1.14% to ~25,109, Nikkei was flat at 63,484.10, Hang Seng eased 0.08% to 24,667 (a 5th straight losing session), and Shanghai fell 0.54% to 3,864.28. WTI rose to $105.49 while Brent held near $107.46, and gold fell 1.23% to a six-week low of $4,263.19.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกัน — S&P 500 ลดลง 0.45% สู่ 7,585.73, Dow ลดลง 0.63% สู่ 52,093.11, Nasdaq ลดลง 0.78% สู่ 25,981.57 — แม้หุ้นชิปกลุ่ม AI อย่าง Qualcomm และ AMD จะดีดตัวขึ้น ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวสู่ราว 5.00% และ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยขึ้นสู่ราว 92% จาก 88% เมื่อวันจันทร์ ดัชนี DAX ลดลง 1.14% สู่ราว 25,109 ดัชนี Nikkei ทรงตัวที่ 63,484.10 ดัชนี Hang Seng ลดลง 0.08% สู่ 24,667 (ปรับลงติดต่อกันเป็นเซสชันที่ห้า) และดัชนี Shanghai ลดลง 0.54% สู่ 3,864.28 WTI เพิ่มขึ้นสู่ $105.49 ขณะเบรนท์ยืนใกล้ $107.46 และทองคำลดลง 1.23% สู่ระดับต่ำสุดในรอบหกสัปดาห์ที่ $4,263.19"}},
    {day:{en:"Today",th:"วันนี้"}, date:{en:"Wed 16 Sep",th:"พุธ 16 ก.ย."}, imp:"h", t:{en:"FOMC decision — a hike is ~92% priced, now set against a 10-year yield near 5%; BOJ follows a day later",th:"การตัดสินใจของเฟด — โอกาสขึ้นดอกเบี้ยราว 92% ท่ามกลางผลตอบแทน 10 ปีใกล้ 5%; BOJ ตามมาวันถัดไป"}, d:{en:"With hike odds near 92% and Tuesday's yield spike to 5.04% intraday reinforcing the case, today's decision — also a Summary of Economic Projections meeting — is mostly about the Fed's dot plot and Powell's tone, now set against three straight down days for US equities. A quarter-point move to 3.75%-4.00% remains the base case; a hawkish hold or hike-and-pause are the key alternatives. The decision lands this afternoon in Washington, overnight in Bangkok. The Bank of Japan follows with its own decision Sep 17-18 — a rare back-to-back week for the two central banks.",th:"เมื่อโอกาสขึ้นดอกเบี้ยใกล้ 92% และผลตอบแทนพันธบัตรที่พุ่งแตะ 5.04% ระหว่างวันอังคารยิ่งตอกย้ำเหตุผล การตัดสินใจวันนี้ — ซึ่งมีการเปิดเผยประมาณการเศรษฐกิจด้วย — ตอนนี้ขึ้นอยู่กับ dot plot และน้ำเสียงของพาวเวลล์เป็นหลัก ท่ามกลางหุ้นสหรัฐฯ ที่ปรับลงต่อเนื่องสามวัน การขึ้นดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% ยังคงเป็นกรณีฐาน ขณะการคงดอกเบี้ยแบบสายเหยี่ยวหรือขึ้นแล้วหยุดพักคือทางเลือกสำคัญ ผลการตัดสินใจจะประกาศช่วงบ่ายตามเวลาวอชิงตัน ซึ่งตรงกับกลางคืนตามเวลากรุงเทพฯ ธนาคารกลางญี่ปุ่นจะตัดสินใจตามมาวันที่ 17-18 ก.ย. นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก"}},
    {day:{en:"Next",th:"ถัดไป"}, date:{en:"Thu-Fri 17-18 Sep",th:"พฤหัสฯ-ศุกร์ 17-18 ก.ย."}, imp:"h", t:{en:"Markets digest the Fed's decision as the Bank of Japan meets",th:"ตลาดย่อยข้อมูลผลการตัดสินใจของเฟด ขณะธนาคารกลางญี่ปุ่นประชุม"}, d:{en:"Asia and global markets react to Wednesday's FOMC outcome and Powell's press conference overnight, while the Bank of Japan holds its own two-day meeting Sep 17-18 — a rare back-to-back week for the world's two most-watched central banks.",th:"ตลาดเอเชียและตลาดโลกตอบสนองต่อผลการประชุม FOMC และการแถลงข่าวของพาวเวลล์ในคืนวันพุธ ขณะธนาคารกลางญี่ปุ่นจัดการประชุมสองวันของตัวเองวันที่ 17-18 ก.ย. นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก"}},
  ];




  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
