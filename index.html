<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">

          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>

          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>

  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},

    heroTitle:{en:"Oil Tops $101 as Tanker War's Worst Wave Yet Hits Wall Street a Third Day", th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"},
    heroDeck:{en:"US stocks fell for a third straight session Wednesday — S&P 500 −0.48% to 7,636.36, Dow −0.77% to 52,380.66, Nasdaq −0.64% to 26,253.34 — as Brent crude settled above $101 and the 10-year Treasury yield hit 4.857%, its highest since November 2023. The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near the Strait of Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. September hike odds eased slightly to ~57% even as oil surged; Friday's CPI report is now the decisive print before the Fed's Sep 16 decision.", th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกันวันพุธ — S&P 500 ลดลง 0.48% สู่ 7,636.36, Dow ลดลง 0.77% สู่ 52,380.66, Nasdaq ลดลง 0.64% สู่ 26,253.34 — ขณะน้ำมันดิบเบรนท์ปิดเหนือ $101 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ช่องแคบฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57% แม้น้ำมันจะพุ่งขึ้น ตัวเลข CPI วันศุกร์คือตัวชี้ขาดก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย."},
    heroNote:{en:"Illustrated cover · full photos at the linked sources", th:"ภาพหน้าปกจำลอง · ภาพข่าวจริงที่ลิงก์แหล่งข่าว"},

    leadtxt:{en:`<b>The Iran-tanker war just escalated sharply, and oil is doing the talking: Brent above $101 after the biggest wave of attacks on shipping since the six-month conflict began.</b> The S&P 500 fell for a third straight session to 7,636.36, the DAX slid 1.74% to a one-month low, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. Oddly, September hike odds eased slightly to ~57% even as oil surged; Friday's CPI print will likely settle the debate. For your clients: with yields at multi-year highs and one more volatile session before the CPI catalyst, this remains a <b>strong window to lock in bond income</b> — and a reason to stay defensive into Friday.`, th:`<b>สงครามเรือบรรทุกน้ำมันอิหร่านทวีความรุนแรงขึ้นอย่างรวดเร็ว และตอนนี้น้ำมันคือตัวบอกเรื่องราว: เบรนท์ทะลุ $101 หลังคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่ความขัดแย้งเริ่มต้นเมื่อหกเดือนก่อน</b> ดัชนี S&P 500 ปรับลงเป็นวันที่สามติดต่อกันสู่ 7,636.36 ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือน และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 ที่น่าสนใจคือ โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57% แม้น้ำมันจะพุ่งขึ้น ตัวเลข CPI วันศุกร์น่าจะเป็นตัวชี้ขาด สำหรับลูกค้าของคุณ: เมื่อผลตอบแทนอยู่ในระดับสูงสุดในรอบหลายปี และยังมีอีกหนึ่งเซสชันที่ผันผวนก่อนตัวเร่ง CPI นี่ยังคงเป็น <b>จังหวะดีในการล็อกรายได้จากพันธบัตร</b> — และเหตุผลให้ตั้งรับต่อไปจนถึงวันศุกร์`},

    watchnote:{en:`September hike odds have swung between roughly 50% and 66% over the past two weeks as Iran-tanker escalation competes with data surprises for control of the narrative — easing slightly to ~57% Wednesday even as oil posted its sharpest move yet. <b style="color:var(--muted)">Friday's August CPI print</b> is the last major data point before the Fed's Sep 16 decision, and must now be read alongside an oil shock still pushing higher.`,
      th:`โอกาสขึ้นดอกเบี้ยเดือน ก.ย. แกว่งตัวระหว่างราว 50% ถึง 66% ในช่วงสองสัปดาห์ที่ผ่านมา ขณะการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านแย่งชิงการนำกระแสข่าวกับตัวเลขเศรษฐกิจที่ผิดคาด — ลดลงเล็กน้อยสู่ราว 57% วันพุธ แม้น้ำมันจะเคลื่อนไหวรุนแรงที่สุดครั้งหนึ่ง <b style="color:var(--muted)">ตัวเลข CPI เดือน ส.ค. วันศุกร์</b> คือข้อมูลสำคัญสุดท้ายก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย. และต้องตีความควบคู่กับแรงกระแทกราคาน้ำมันที่ยังคงปรับขึ้นต่อเนื่อง`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,636.36", chg:-0.48, series:[7673.52,7636.36],
      txt:{en:`<b>US stocks fell a third straight session Wednesday — the S&P 500 -0.48% to 7,636.36, the Dow -0.77% (-405.41 pts) to 52,380.66, the Nasdaq -0.64% to 26,253.34 —</b> as Brent crude settled above $101 and the 10-year Treasury yield hit 4.857%, its highest since November 2023.`, th:`<b>หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกันวันพุธ — S&P 500 ลดลง 0.48% สู่ 7,636.36, Dow ลดลง 0.77% (-405.41 จุด) สู่ 52,380.66, Nasdaq ลดลง 0.64% สู่ 26,253.34 —</b> ขณะน้ำมันดิบเบรนท์ปิดเหนือ $101 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023`},
      why:{en:`Three straight down days is the market pricing a real, unresolved shock — not noise. The US destroyed five Iranian tankers Tuesday and Iran hit back at ten ships Wednesday, the worst wave of attacks since the war began, yet hike odds actually eased slightly to ~57%. That divergence is the argument for clients: don't assume the Fed story and the oil story will resolve together — Friday's CPI could easily move each in a different direction.`, th:`การปรับลงสามวันติดต่อกันคือตลาดที่กำลังสะท้อนราคาความเสี่ยงจริงที่ยังไม่คลี่คลาย ไม่ใช่สัญญาณรบกวน สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำวันพุธ นับเป็นคลื่นโจมตีรุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้น แต่โอกาสขึ้นดอกเบี้ยกลับลดลงเล็กน้อยสู่ราว 57% ความแตกต่างนี้คือเหตุผลสำหรับลูกค้า: อย่าคิดว่าประเด็นเฟดและประเด็นน้ำมันจะคลี่คลายไปในทิศทางเดียวกัน CPI วันศุกร์อาจขยับทั้งสองเรื่องไปคนละทาง`},
      full:{en:`US stocks closed lower Wednesday for a third straight session as rising Treasury yields and oil prices continued to rattle investors. The S&P 500 fell 0.48% to close at 7,636.36, the Dow Jones Industrial Average dropped 405.41 points (-0.77%) to 52,380.66, and the Nasdaq Composite eased 0.64% to 26,253.34. The declines followed a sharp escalation in the Iran-US tanker war: US forces destroyed five Iranian crude tankers Tuesday in response to attempted attacks on an American warship, and Iran retaliated Wednesday by striking ten ships near the Strait of Hormuz — the biggest wave of attacks on shipping since the six-month conflict began. Brent crude settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%), with the national average for gasoline reaching $4.22/gallon and diesel a record $5.94/gallon. The 10-year Treasury yield touched 4.857%, its highest since November 2023, and the 30-year rose to 5.30%. Even so, CME-tracked odds of a September 16 rate hike eased slightly to roughly 57%, from near 60% earlier in the week, as traders await Friday's August CPI report — the last major data point before the Fed's decision.`, th:`หุ้นสหรัฐฯ ปิดตลาดปรับลงวันพุธเป็นวันที่สามติดต่อกัน ขณะผลตอบแทนพันธบัตรและราคาน้ำมันที่สูงขึ้นยังคงสร้างความกังวลให้นักลงทุน ดัชนี S&P 500 ลดลง 0.48% ปิดที่ 7,636.36 ดัชนี Dow Jones ลดลง 405.41 จุด (-0.77%) สู่ 52,380.66 และดัชนี Nasdaq Composite อ่อนตัวลง 0.64% สู่ 26,253.34 การปรับลงนี้ตามหลังการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันสหรัฐฯ-อิหร่าน: กองกำลังสหรัฐฯ ทำลายเรือบรรทุกน้ำมันดิบอิหร่าน 5 ลำวันอังคาร ตอบโต้ความพยายามโจมตีเรือรบสหรัฐฯ และอิหร่านตอบโต้กลับวันพุธด้วยการโจมตีเรือ 10 ลำใกล้ช่องแคบฮอร์มุซ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่ความขัดแย้งหกเดือนเริ่มต้น น้ำมันดิบเบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 และ 30 ปีขึ้นสู่ 5.30% กระนั้น โอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. ตามข้อมูล CME ลดลงเล็กน้อยสู่ราว 57% จากใกล้ 60% ช่วงต้นสัปดาห์ ขณะนักลงทุนรอตัวเลข CPI เดือน ส.ค. วันศุกร์ ข้อมูลสำคัญสุดท้ายก่อนการตัดสินใจของเฟด`},
      sources:[{l:"TheStreet — Sept 9 close",u:"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-09-2026"},{l:"CNBC — Live updates",u:"https://www.cnbc.com/2026/09/08/stock-market-today-live-updates.html"},{l:"Japan Times — tanker attacks",u:"https://www.japantimes.co.jp/news/2026/09/10/world/iran-us-tankers-attacks/"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,554", chg:-1.74, series:[26007,25554],
      txt:{en:`<b>DAX slid 1.74% to 25,554 Wednesday, a one-month low,</b> as soaring oil prices and Middle East tensions rekindled inflation concerns ahead of major central-bank decisions.`, th:`<b>DAX ร่วง 1.74% สู่ 25,554 วันพุธ จุดต่ำสุดในรอบเดือน</b> เมื่อราคาน้ำมันที่พุ่งสูงและความตึงเครียดตะวันออกกลางจุดกระแสกังวลเงินเฟ้อขึ้นอีกครั้งก่อนการตัดสินใจของธนาคารกลางสำคัญ`},
      why:{en:`A one-month low — not a modest pullback like last week — shows Europe is now pricing the tanker-war escalation as a real economic threat, not background noise. That's a shift worth flagging: the "Iran risk is contained" narrative clients may still be holding onto no longer matches what European equities are doing.`, th:`จุดต่ำสุดในรอบเดือน ไม่ใช่การปรับฐานเล็กน้อยเหมือนสัปดาห์ก่อน แสดงว่ายุโรปเริ่มมองการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันเป็นภัยคุกคามเศรษฐกิจจริงแล้ว ไม่ใช่แค่เสียงรบกวนพื้นหลัง เป็นการเปลี่ยนแปลงที่ควรแจ้งลูกค้า: มุมมองที่ว่า "ความเสี่ยงอิหร่านถูกจำกัดวงแล้ว" อาจไม่ตรงกับสิ่งที่หุ้นยุโรปกำลังสะท้อนอีกต่อไป`},
      full:{en:`European shares fell sharply Wednesday, with Germany's DAX closing down 1.74% at 25,554 — a fresh one-month low — as oil's surge past $101/bbl and the sharpest wave of Iran-tanker attacks yet rekindled inflation concerns ahead of the Fed's September 16 decision. Rheinmetall, Deutsche Boerse and Beiersdorf led the losses, while SAP, RWE and E.ON held up better. The move marks a clear escalation from the modest pullback seen earlier in the week, aligning European equities with the sell-off already under way on Wall Street.`, th:`หุ้นยุโรปปรับลงแรงวันพุธ ดัชนี DAX เยอรมนีปิดตลาดลง 1.74% ที่ 25,554 จุดต่ำสุดใหม่ในรอบเดือน ขณะน้ำมันที่พุ่งทะลุ $101 ต่อบาร์เรล และคลื่นโจมตีเรือบรรทุกน้ำมันอิหร่านที่รุนแรงที่สุดจุดกระแสกังวลเงินเฟ้อขึ้นอีกครั้งก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย. Rheinmetall, Deutsche Boerse และ Beiersdorf นำการปรับลง ขณะ SAP, RWE และ E.ON ยืนได้ดีกว่า การเคลื่อนไหวนี้เป็นการทวีความรุนแรงชัดเจนจากการปรับฐานเล็กน้อยช่วงต้นสัปดาห์ ทำให้หุ้นยุโรปเคลื่อนไหวสอดคล้องกับการเทขายที่เกิดขึ้นแล้วในวอลล์สตรีท`},
      sources:[{l:"Investing.com — DAX",u:"https://www.investing.com/news/stock-market-news/germany-stocks-lower-at-close-of-trade-dax-down-174-4894150"},{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"65,142.78", chg:-0.19, series:[66399.84,65142.78],
      txt:{en:`<b>Nikkei 225 eased 0.19% to 65,142.78 Wednesday,</b> giving back a small part of Monday's record AI-driven rally as oil's surge past $101 and the tanker war's biggest escalation yet weighed on sentiment.`, th:`<b>Nikkei 225 อ่อนตัวลง 0.19% สู่ 65,142.78 วันพุธ</b> คืนกำไรบางส่วนจากแรงบวก AI ที่ทำสถิติใหม่เมื่อวันจันทร์ ขณะน้ำมันที่ทะลุ $101 และการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันกดดันบรรยากาศ`},
      why:{en:`A modest 0.19% dip after Monday's 2.12% surge suggests Japan is treating this as a pause, not a reversal — the AI story is still intact. But with oil now posting its sharpest move of the conflict, that resilience will be tested again once Thursday's Asia session fully digests the news.`, th:`การปรับลงเพียง 0.19% หลังพุ่งขึ้น 2.12% เมื่อวันจันทร์ แสดงว่าญี่ปุ่นมองนี่เป็นการหยุดพักชั่วคราว ไม่ใช่การพลิกกลับ — เรื่องราว AI ยังคงอยู่ แต่เมื่อน้ำมันเคลื่อนไหวรุนแรงที่สุดของความขัดแย้งนี้ ความแข็งแกร่งนี้จะถูกทดสอบอีกครั้งเมื่อตลาดเอเชียวันพฤหัสฯ ย่อยข่าวเต็มที่`},
      full:{en:`Japanese equities eased Wednesday, with the Nikkei 225 down 0.19% to close at 65,142.78, pulling back modestly from Monday's record 66,399.84 close as oil's surge past $101/bbl and the biggest wave of Iran-tanker attacks since the war began weighed on regional sentiment. South Korea's Kospi bucked the trend, rising 1.40% to 7,051.64, while Australia's ASX 200 eased 0.11% to 8,911.40. Markets now look to Thursday's Asia session for the first full read on the overnight escalation, with Friday's US CPI report the next major catalyst.`, th:`หุ้นญี่ปุ่นอ่อนตัวลงวันพุธ ดัชนี Nikkei 225 ลดลง 0.19% ปิดที่ 65,142.78 ปรับฐานเล็กน้อยจากระดับปิดสูงสุดใหม่ 66,399.84 เมื่อวันจันทร์ ขณะน้ำมันที่ทะลุ $101 ต่อบาร์เรล และคลื่นโจมตีเรือบรรทุกน้ำมันอิหร่านที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นกดดันบรรยากาศภูมิภาค ดัชนี Kospi เกาหลีใต้สวนทาง เพิ่มขึ้น 1.40% สู่ 7,051.64 ขณะ ASX 200 ออสเตรเลียลดลง 0.11% สู่ 8,911.40 ตลาดตอนนี้จับตาตลาดเอเชียวันพฤหัสฯ เพื่อดูปฏิกิริยาเต็มที่ต่อการทวีความรุนแรงข้ามคืน โดยตัวเลข CPI สหรัฐฯ วันศุกร์เป็นตัวเร่งปฏิกิริยาสำคัญถัดไป`},
      sources:[{l:"CNBC — Dow futures/oil",u:"https://www.cnbc.com/2026/09/08/stock-market-today-live-updates.html"},{l:"Trading Economics",u:"https://tradingeconomics.com/japan/stock-market"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,275", chg:-0.17, series:[25428,25275],
      txt:{en:`<b>Hang Seng slipped 0.17% to 25,275 Wednesday, while the Shanghai Composite edged up 0.28% to 3,951.51</b> — a split session as $100+ oil and US market losses weighed on Hong Kong more than the mainland.`, th:`<b>Hang Seng ลดลง 0.17% สู่ 25,275 วันพุธ ขณะ Shanghai Composite เพิ่มขึ้น 0.28% สู่ 3,951.51</b> — เซสชันที่แยกทิศทาง เมื่อน้ำมันเหนือ $100 และการปรับลงของตลาดสหรัฐฯ กดดันฮ่องกงมากกว่าจีนแผ่นดินใหญ่`},
      why:{en:`Hong Kong's decline stayed contained even as oil topped $101 and Wall Street fell a third day — a sign the market may still be underpricing how far this escalation could go. Worth watching closely into Thursday and Friday's CPI.`, th:`การปรับลงของฮ่องกงยังคงจำกัดวง แม้น้ำมันจะทะลุ $101 และวอลล์สตรีทปรับลงเป็นวันที่สาม — สัญญาณว่าตลาดอาจยังสะท้อนราคาความเสี่ยงจากการทวีความรุนแรงนี้ไม่เต็มที่ ควรจับตาใกล้ชิดเข้าสู่วันพฤหัสฯ และ CPI วันศุกร์`},
      full:{en:`Hong Kong and mainland China diverged again Wednesday: the Hang Seng fell 0.17% to close at 25,275 as $100+ oil and rising Treasury yields weighed on rate-sensitive names, while the Shanghai Composite edged up 0.28% to 3,951.51, staying comparatively insulated. The moves were relatively contained given the scale of the overnight tanker-war escalation, suggesting regional markets have not yet fully priced the risk that Thursday's session — and Friday's US CPI print — could still deliver.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่แยกทิศทางกันอีกครั้งวันพุธ: ดัชนี Hang Seng ลดลง 0.17% ปิดที่ 25,275 ขณะน้ำมันเหนือ $100 และผลตอบแทนพันธบัตรที่สูงขึ้นกดดันหุ้นที่อ่อนไหวต่อดอกเบี้ย ส่วนดัชนี Shanghai Composite เพิ่มขึ้น 0.28% สู่ 3,951.51 ยังคงค่อนข้างเป็นอิสระ การเคลื่อนไหวค่อนข้างจำกัดเมื่อเทียบกับขนาดการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันข้ามคืน แสดงว่าตลาดภูมิภาคอาจยังไม่ได้สะท้อนราคาความเสี่ยงที่เซสชันวันพฤหัสฯ — และตัวเลข CPI สหรัฐฯ วันศุกร์ — อาจนำมาได้เต็มที่`},
      sources:[{l:"Al Jazeera — oil surge",u:"https://qz.com/oil-prices-iran-tanker-attacks-strait-hormuz-090926"},{l:"Trading Economics",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,617.89", chg:-0.25, series:[1618.82,1617.89],
      txt:{en:`<b>SET Index eased 0.25% to 1,617.89 Wednesday (-4.00pts),</b> on turnover of about THB 81.33bn, giving back a small part of Monday's AI-driven gain as oil's surge past $101 weighed on regional sentiment.`, th:`<b>ดัชนี SET ลดลง 0.25% สู่ 1,617.89 วันพุธ (-4.00 จุด)</b> มูลค่าการซื้อขายราว 8.133 หมื่นล้านบาท คืนกำไรบางส่วนจากแรงบวกที่ขับเคลื่อนโดย AI เมื่อวันจันทร์ ขณะน้ำมันที่ทะลุ $101 กดดันบรรยากาศภูมิภาค`},
      why:{en:`A shallow 0.25% pullback after Monday's 1.46% gain shows Thai equities absorbing the oil shock relatively well so far. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity, but Friday's CPI and the oil trajectory are the near-term swing factors to watch.`, th:`การปรับลงเพียง 0.25% หลังพุ่งขึ้น 1.46% เมื่อวันจันทร์ แสดงว่าหุ้นไทยดูดซับแรงกระแทกจากน้ำมันได้ค่อนข้างดีจนถึงตอนนี้ เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว แต่ CPI วันศุกร์และทิศทางราคาน้ำมันคือปัจจัยแกว่งตัวระยะสั้นที่ต้องจับตา`},
      full:{en:`Thailand's SET Index closed Wednesday at 1,617.89, down 4.00 points (-0.25%), on turnover of about THB 81.33 billion, giving back a small part of Monday's AI-driven gain as oil's surge past $101/bbl and the biggest wave of Iran-tanker attacks since the war began weighed on regional sentiment. The pullback was modest relative to the scale of the overnight escalation, and modest relative to the declines on Wall Street and in Europe. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity.`, th:`ดัชนี SET ของไทยปิดตลาดวันพุธที่ 1,617.89 ลดลง 4.00 จุด (-0.25%) มูลค่าการซื้อขายราว 8.133 หมื่นล้านบาท คืนกำไรบางส่วนจากแรงบวกที่ขับเคลื่อนโดย AI เมื่อวันจันทร์ ขณะน้ำมันที่ทะลุ $101 ต่อบาร์เรล และคลื่นโจมตีเรือบรรทุกน้ำมันอิหร่านที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นกดดันบรรยากาศภูมิภาค การปรับลงค่อนข้างจำกัดเมื่อเทียบกับขนาดการทวีความรุนแรงข้ามคืน และเมื่อเทียบกับการปรับลงในวอลล์สตรีทและยุโรป เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว`},
      sources:[{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/590380"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil surged to its worst escalation yet — Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%) — after the US destroyed five Iranian tankers and Iran struck back at ten ships near Hormuz, while gold held near $4,400/oz,</b> volatile but roughly flat as safe-haven demand offset a weaker dollar.`, th:`<b>น้ำมันพุ่งขึ้นจากการทวีความรุนแรงที่สุด — เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) — หลังสหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำ และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซ ขณะทองคำทรงตัวใกล้ $4,400 ต่อออนซ์</b> ผันผวนแต่ค่อนข้างทรงตัว เมื่อดีมานด์สินทรัพย์ปลอดภัยชดเชยค่าเงินดอลลาร์ที่อ่อนลง`},
     why:{en:`Gold barely moving while oil posts its sharpest surge of the conflict is a real signal: the market still isn't treating this as a systemic safe-haven trigger, just an energy-supply shock. That gap won't last if the tanker war escalates further — a case for adding gold exposure now, before the market repricing catches up.`, th:`การที่ทองคำแทบไม่ขยับ ขณะน้ำมันพุ่งแรงที่สุดของความขัดแย้งนี้ เป็นสัญญาณที่แท้จริง: ตลาดยังไม่ได้มองนี่เป็นตัวจุดชนวนสินทรัพย์ปลอดภัยเชิงระบบ เพียงแค่แรงกระแทกด้านอุปทานพลังงาน ช่องว่างนี้จะไม่คงอยู่นานหากสงครามเรือบรรทุกน้ำมันทวีความรุนแรงขึ้นอีก — เป็นเหตุผลให้เพิ่มสัดส่วนทองคำตอนนี้ ก่อนที่ตลาดจะปรับราคาตามทัน`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>September hike odds eased slightly to ~57% Wednesday, from near 60% earlier in the week, even as the 10-year Treasury yield hit 4.857% — its highest since November 2023 — and the 30-year rose to 5.30%.</b> Trump, the Vice President and Treasury Secretary launched a full-court press on the Fed 10 days before its meeting, renewing the threat to cut trade with surplus countries if rates aren't lowered.`, th:`<b>โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57% วันพุธ จากใกล้ 60% ช่วงต้นสัปดาห์ แม้ผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 และ 30 ปีขึ้นสู่ 5.30%</b> ทรัมป์ รองประธานาธิบดี และรัฐมนตรีคลัง กดดันเฟดเต็มที่ก่อนการประชุม 10 วัน พร้อมย้ำคำขู่จะหยุดค้าขายกับประเทศที่เกินดุลหากไม่ลดดอกเบี้ย`},
     why:{en:`Yields at multi-year highs even as hike odds ease is the key nuance: the bond market is pricing term risk and inflation risk from the oil shock, not just the Fed's next move. That combination — elevated coupons, an unresolved rate debate, and a president openly pressuring the Fed — argues for locking in income now rather than waiting for Friday's CPI to add more noise.`, th:`ผลตอบแทนที่สูงสุดในรอบหลายปี แม้โอกาสขึ้นดอกเบี้ยจะลดลง คือจุดสำคัญที่ต้องอธิบาย: ตลาดตราสารหนี้กำลังสะท้อนราคาความเสี่ยงระยะยาวและความเสี่ยงเงินเฟ้อจากแรงกระแทกน้ำมัน ไม่ใช่แค่การตัดสินใจครั้งต่อไปของเฟด ความผสมผสานนี้ — คูปองที่สูง การถกเถียงเรื่องดอกเบี้ยที่ยังไม่คลี่คลาย และประธานาธิบดีที่กดดันเฟดอย่างเปิดเผย — สนับสนุนให้ล็อกรายได้ตอนนี้ แทนที่จะรอให้ CPI วันศุกร์เพิ่มความไม่แน่นอนเข้ามาอีก`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Ten days ahead of the Fed's September 16 meeting, the Trump administration launched a full-court press to stop a hike: Trump, the Vice President, Treasury Secretary and senior economic advisors are all now urging the Fed to hold or cut, with Trump renewing his threat to "stop trading with every country the US runs a deficit against" if the Fed doesn't move. Section 338 tariffs remain in effect and the ~7.5% China "overcapacity" tariff still looms ahead of a planned Trump-Xi summit.`, th:`ก่อนการประชุมเฟดวันที่ 16 ก.ย. 10 วัน รัฐบาลทรัมป์กดดันเฟดเต็มที่เพื่อหยุดการขึ้นดอกเบี้ย: ทรัมป์ รองประธานาธิบดี รัฐมนตรีคลัง และที่ปรึกษาเศรษฐกิจระดับสูง ต่างเรียกร้องให้เฟดคงหรือลดดอกเบี้ย โดยทรัมป์ย้ำคำขู่ว่าจะ "หยุดค้าขายกับทุกประเทศที่สหรัฐฯ ขาดดุลการค้าด้วย" หากเฟดไม่ดำเนินการ มาตรการภาษีมาตรา 338 ยังคงมีผลบังคับใช้ และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้`}, w:{en:`A president publicly pressuring the Fed 10 days before a live-odds meeting, at the same time as the sharpest oil-driven inflation risk of the conflict, is two forces pulling the rate debate in opposite directions — reinforce with clients that Friday's CPI, not political pressure, will likely settle it.`, th:`ประธานาธิบดีที่กดดันเฟดต่อสาธารณะ 10 วันก่อนการประชุมที่ยังไม่แน่นอน ในเวลาเดียวกับความเสี่ยงเงินเฟ้อจากน้ำมันที่รุนแรงที่สุดของความขัดแย้งนี้ คือสองแรงที่ดึงการถกเถียงเรื่องดอกเบี้ยไปคนละทาง ควรย้ำกับลูกค้าว่า CPI วันศุกร์ ไม่ใช่แรงกดดันทางการเมือง น่าจะเป็นตัวชี้ขาดจริง`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`The Iran-US tanker war just posted its worst escalation yet: US forces destroyed five Iranian crude tankers Tuesday, and Iran retaliated Wednesday by striking ten ships near the Strait of Hormuz — the biggest wave of attacks on shipping by both sides since the six-month conflict began. Brent crude settled at $101.21 and WTI at $96.05, both up more than 60% year-to-date; national gasoline hit $4.22/gallon and diesel a record $5.94/gallon. Yet equity markets have so far reacted in a fairly measured way — a third straight down day on Wall Street and a one-month DAX low, but no outright panic.`, th:`สงครามเรือบรรทุกน้ำมันสหรัฐฯ-อิหร่านเพิ่งทวีความรุนแรงที่สุดเท่าที่เคยมีมา: กองกำลังสหรัฐฯ ทำลายเรือบรรทุกน้ำมันดิบอิหร่าน 5 ลำวันอังคาร และอิหร่านตอบโต้กลับวันพุธด้วยการโจมตีเรือ 10 ลำใกล้ช่องแคบฮอร์มุซ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดของทั้งสองฝ่ายนับตั้งแต่ความขัดแย้งหกเดือนเริ่มต้น น้ำมันดิบเบรนท์ปิดที่ $101.21 และ WTI ที่ $96.05 ทั้งคู่เพิ่มขึ้นกว่า 60% นับจากต้นปี ราคาน้ำมันเบนซินทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน กระนั้น ตลาดหุ้นตอบสนองค่อนข้างพอประมาณจนถึงตอนนี้ — วอลล์สตรีทปรับลงวันที่สามติดต่อกันและ DAX แตะจุดต่ำสุดในรอบเดือน แต่ยังไม่ถึงขั้นตื่นตระหนก`}, w:{en:`A "biggest wave of attacks since the war began" headline paired with only a moderate equity reaction is the gap worth flagging directly: either markets believe this de-escalates from here, or they haven't fully priced it yet. Given the trend of the last week, don't assume the calm holds — position for more volatility into Friday's CPI.`, th:`พาดหัวข่าว "คลื่นโจมตีรุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้น" ควบคู่กับปฏิกิริยาของตลาดหุ้นที่ยังพอประมาณ คือช่องว่างที่ควรย้ำกับลูกค้าโดยตรง: ไม่ว่าตลาดจะเชื่อว่าจะคลี่คลายจากนี้ หรือยังไม่ได้สะท้อนราคาความเสี่ยงเต็มที่ จากแนวโน้มสัปดาห์ที่ผ่านมา อย่าคิดว่าความสงบนี้จะคงอยู่ — เตรียมรับความผันผวนที่มากขึ้นก่อนถึง CPI วันศุกร์`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`September hike odds eased slightly to roughly 57% Wednesday, from near 60% earlier in the week, even as the oil shock intensified — a sign the market sees Friday's August CPI report, not the geopolitical headlines, as the decisive input before the Fed's September 16 decision. The 10-year Treasury yield hit 4.857%, its highest since November 2023, and the 30-year rose to 5.30%, both new highs for the cycle.`, th:`โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57% วันพุธ จากใกล้ 60% ช่วงต้นสัปดาห์ แม้แรงกระแทกราคาน้ำมันจะรุนแรงขึ้น เป็นสัญญาณว่าตลาดมองตัวเลข CPI เดือน ส.ค. วันศุกร์ ไม่ใช่ข่าวภูมิรัฐศาสตร์ เป็นปัจจัยชี้ขาดก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย. ผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 และ 30 ปีขึ้นสู่ 5.30% ทั้งคู่เป็นจุดสูงสุดใหม่ของรอบนี้`}, w:{en:`Yields hitting multi-year highs while hike odds actually ease is a real divergence — the bond market is pricing term and inflation risk from the oil shock independently of the Fed's next move. That argues for locking in today's elevated coupons now, rather than waiting to see how Friday's CPI resolves the rate debate.`, th:`ผลตอบแทนที่แตะจุดสูงสุดในรอบหลายปี ขณะโอกาสขึ้นดอกเบี้ยกลับลดลง คือความแตกต่างที่แท้จริง — ตลาดตราสารหนี้กำลังสะท้อนราคาความเสี่ยงระยะยาวและเงินเฟ้อจากแรงกระแทกน้ำมันแยกต่างหากจากการตัดสินใจครั้งต่อไปของเฟด สนับสนุนให้ล็อกคูปองที่สูงอยู่ตอนนี้ แทนที่จะรอดู CPI วันศุกร์ชี้ขาดการถกเถียงเรื่องดอกเบี้ย`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`Oil's sharpest surge of the conflict — Brent settling above $101, up more than 60% year-to-date, with national diesel at a record $5.94/gallon — is now the dominant near-term inflation risk, arriving just two days before Friday's August CPI report. Fed officials have flagged that inflation has run above target for five years, with signs of pressure now visible beyond tariffs and energy.`, th:`น้ำมันที่พุ่งขึ้นแรงที่สุดของความขัดแย้งนี้ — เบรนท์ปิดเหนือ $101 เพิ่มขึ้นกว่า 60% นับจากต้นปี พร้อมดีเซลทั่วประเทศทำสถิติใหม่ที่ $5.94 ต่อแกลลอน — ตอนนี้เป็นความเสี่ยงเงินเฟ้อระยะสั้นหลัก มาถึงเพียงสองวันก่อนตัวเลข CPI เดือน ส.ค. วันศุกร์ เจ้าหน้าที่เฟดระบุว่าเงินเฟ้อสูงกว่าเป้าหมายมาห้าปีแล้ว โดยเริ่มเห็นสัญญาณกดดันนอกเหนือจากภาษีและพลังงาน`}, w:{en:`With oil now posting its biggest move of the entire conflict just before the CPI print, a hot inflation surprise on Friday would land on top of an already-live energy shock — not a scenario the market has fully priced given hike odds actually eased this week. Worth reiterating to clients that "sticky inflation" risk is rising, not falling, into the weekend.`, th:`เมื่อน้ำมันเพิ่งเคลื่อนไหวรุนแรงที่สุดของความขัดแย้งทั้งหมด เพียงก่อนตัวเลข CPI ตัวเลขเงินเฟ้อที่ร้อนเกินคาดในวันศุกร์จะซ้อนทับบนแรงกระแทกพลังงานที่ยังดำเนินอยู่ — ไม่ใช่สถานการณ์ที่ตลาดสะท้อนราคาเต็มที่แล้ว เมื่อพิจารณาว่าโอกาสขึ้นดอกเบี้ยกลับลดลงในสัปดาห์นี้ ควรย้ำกับลูกค้าว่าความเสี่ยง "เงินเฟ้อเหนียว" กำลังเพิ่มขึ้น ไม่ใช่ลดลง เข้าสู่ช่วงสุดสัปดาห์`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 7 Sep",th:"จันทร์ 7 ก.ย."}, imp:"h", t:{en:"Asia splits: AI rally lifts Nikkei +2.12%, SET +1.46%; Hang Seng falls 0.9% on Fed hike fears; oil nears $98",th:"เอเชียแยกทิศทาง: กระแส AI หนุน Nikkei เพิ่มขึ้น 2.12%, SET เพิ่มขึ้น 1.46%; Hang Seng ลดลง 0.9% จากความกังวลขึ้นดอกเบี้ย; น้ำมันใกล้ $98"}, d:{en:"Japan and Thailand rallied on AI/semiconductor enthusiasm — Nikkei 225 +2.12% to 66,399.84, SET +1.46% to 1,618.82 — largely independent of the weekend's Iran-tanker war. Hong Kong's Hang Seng fell 0.9% to 25,428 as September Fed hike odds rose to ~60%, and Shanghai was flat. Brent crude pushed toward $98/bbl and gold eased to ~$4,415. US and Thai bond markets stayed closed for Labor Day.",th:"ญี่ปุ่นและไทยปรับขึ้นจากกระแส AI/เซมิคอนดักเตอร์ — Nikkei 225 เพิ่มขึ้น 2.12% สู่ 66,399.84, SET เพิ่มขึ้น 1.46% สู่ 1,618.82 — ส่วนใหญ่เป็นอิสระจากสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ Hang Seng ของฮ่องกงลดลง 0.9% สู่ 25,428 ขณะโอกาสขึ้นดอกเบี้ยเฟดเดือน ก.ย. ปรับขึ้นสู่ราว 60% และ Shanghai แทบไม่เปลี่ยนแปลง ราคาน้ำมันเบรนท์ปรับขึ้นสู่ใกล้ $98 ต่อบาร์เรล และทองคำอ่อนตัวลงสู่ราว $4,415 ตลาดพันธบัตรสหรัฐฯ และไทยยังคงปิดทำการวันแรงงาน"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 8 Sep",th:"อังคาร 8 ก.ย."}, imp:"h", t:{en:"Wall Street reopens for the first time since the tanker war, with hike odds near 60%",th:"วอลล์สตรีทเปิดตลาดอีกครั้งเป็นครั้งแรกหลังสงครามเรือบรรทุกน้ำมัน ขณะโอกาสขึ้นดอกเบี้ยใกล้ 60%"}, d:{en:"US markets reopen Tuesday after the Labor Day break, giving the first direct pricing of both the weekend's Iran-tanker escalation and the climb in September rate-hike odds to roughly 60%. Oil (Brent near $98, WTI above $92) and the elevated 10-year yield (~4.79%) will be the key signals to watch as trading resumes.",th:"ตลาดสหรัฐฯ เปิดทำการอีกครั้งวันอังคารหลังหยุดวันแรงงาน เป็นการสะท้อนราคาโดยตรงครั้งแรกทั้งการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ขยับขึ้นสู่ราว 60% ราคาน้ำมัน (เบรนท์ใกล้ $98, WTI เหนือ $92) และผลตอบแทนพันธบัตร 10 ปีที่สูงขึ้น (~4.79%) จะเป็นสัญญาณสำคัญที่ต้องจับตาเมื่อการซื้อขายกลับมาดำเนินต่อ"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 9 Sep",th:"พุธ 9 ก.ย."}, imp:"h", t:{en:"Oil tops $101 as tanker war's worst wave yet hits Wall St a third day",th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"}, d:{en:"The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%); national gas hit $4.22/gal and diesel a record $5.94/gal. The S&P 500 fell 0.48% to 7,636.36 (a third straight down day), the DAX slid 1.74% to a one-month low of 25,554, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. September hike odds eased slightly to ~57%.",th:"สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ดัชนี S&P 500 ลดลง 0.48% สู่ 7,636.36 (ปรับลงวันที่สามติดต่อกัน) ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือนที่ 25,554 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57%"}},
    {day:{en:"Today",th:"วันนี้"}, date:{en:"Thu 10 Sep",th:"พฤหัสฯ 10 ก.ย."}, imp:"h", t:{en:"Asia opens to the aftermath; Friday's CPI is now the decisive catalyst",th:"เอเชียเปิดตลาดรับผลกระทบ CPI วันศุกร์คือตัวชี้ขาด"}, d:{en:"Asia trades through the overnight escalation and the sharpest oil move in weeks, with Thailand's SET and Hong Kong still digesting Wednesday's Wall Street losses. All eyes now turn to Friday's August CPI report — the last major data point before the Fed's September 16 decision — which must be read alongside an oil shock still pushing higher.",th:"เอเชียซื้อขายผ่านการทวีความรุนแรงข้ามคืนและการเคลื่อนไหวของราคาน้ำมันที่รุนแรงที่สุดในรอบหลายสัปดาห์ ขณะ SET ไทยและฮ่องกงยังคงย่อยข่าวการปรับลงของวอลล์สตรีทเมื่อวันพุธ ทุกสายตาตอนนี้จับจ้องรายงาน CPI เดือน ส.ค. วันศุกร์ — ข้อมูลสำคัญสุดท้ายก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย. — ซึ่งต้องตีความควบคู่กับแรงกระแทกราคาน้ำมันที่ยังคงปรับขึ้นต่อเนื่อง"}},
  ];




  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
