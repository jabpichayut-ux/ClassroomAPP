<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Nvidia Soars 31% as Jensen Huang Is Reinstated — S&P 500 Jumps 4.7% and Nasdaq 6.5% in Best Day Since April 2025", th:"Nvidia พุ่ง 31% หลัง Jensen Huang กลับมาเป็น CEO — S&P 500 ขึ้น 4.7% และ Nasdaq ขึ้น 6.5% ดีที่สุดตั้งแต่เมษายน 2025"},
    heroDeck:{en:`Monday snapped the seven-day slide with a violent rebound. Nvidia's board unanimously reinstated Jensen Huang as CEO, and the stock closed up about 31%; President Trump said he had urged the board, and an independent board investigation continues. The S&P 500 rose 326.78 points (+4.73%) to 7,237.17, its best day since April 2025 but still about 7.4% below its October peak; the Nasdaq Composite jumped 6.51% to 24,089.56; and the Dow gained 1,447.98 points (+3.01%) to 49,595.31. Anthropic (ANT) did not join in, slipping 1.4% to $87.64, still above its $83 IPO price. Bonds gave back a little: the 2-year yield rose about 6 bp to ~4.69–4.70%, the 10-year held near 4.93% and the 30-year ~5.30%, and futures now price a ~98% chance of a quarter-point Fed hike on 9 December. Gold bounced about 2.3–2.8% to ~$3,610–3,635. Oil fell sharply as Trump signalled more time for diplomacy with Iran: WTI −4.5% to $80.17, Brent −3.5% to $89.37. Asia traded before the US rebound: Japan was closed for a holiday, the Kospi fell 3.3% to 4,708.54 as Seoul vowed to stabilise the market, the Hang Seng slipped 0.1% to 22,383.74 and Shanghai rose 0.2% to 3,538.95. The DAX rose 2.15% to 25,337.27, and the SET edged up 1.21 points (+0.08%) to 1,454.49 as foreigners bought about THB 682m.`, th:`วันจันทร์หุ้นหยุดการลดลง 7 วันติดด้วยการดีดกลับแรง คณะกรรมการ Nvidia มีมติเป็นเอกฉันท์ให้ Jensen Huang กลับมาเป็น CEO หุ้นปิดบวกราว 31% ประธานาธิบดีทรัมป์ระบุว่าได้คุยกับคณะกรรมการ และการสอบสวนอิสระของคณะกรรมการยังดำเนินต่อ S&P 500 ขึ้น 326.78 จุด (+4.73%) สู่ 7,237.17 ดีที่สุดตั้งแต่เมษายน 2025 แต่ยังต่ำกว่าจุดสูงสุดเดือนตุลาคมราว 7.4% Nasdaq พุ่ง 6.51% สู่ 24,089.56 และ Dow ขึ้น 1,447.98 จุด (+3.01%) สู่ 49,595.31 Anthropic (ANT) ไม่ขึ้นตาม ลดลง 1.4% สู่ $87.64 ยังสูงกว่าราคา IPO $83 บอนด์ย่อลงเล็กน้อย: ผลตอบแทน 2 ปีขึ้นราว 0.06% สู่ราว 4.69–4.70% 10 ปีทรงตัวราว 4.93% และ 30 ปีราว 5.30% ตลาดให้โอกาสราว 98% ที่เฟดจะขึ้นดอกเบี้ย 0.25% วันที่ 9 ธ.ค. ทองคำดีดกลับราว 2.3–2.8% สู่ราว $3,610–3,635 น้ำมันลดลงแรงเพราะทรัมป์ส่งสัญญาณให้เวลาการเจรจากับอิหร่าน: WTI −4.5% สู่ $80.17 Brent −3.5% สู่ $89.37 เอเชียซื้อขายก่อนสหรัฐฯ ดีดกลับ: ญี่ปุ่นปิดวันหยุด Kospi ลดลง 3.3% สู่ 4,708.54 ขณะที่รัฐบาลเกาหลีใต้ประกาศพยุงตลาด Hang Seng ลดลง 0.1% สู่ 22,383.74 และเซี่ยงไฮ้ขึ้น 0.2% สู่ 3,538.95 DAX ขึ้น 2.15% สู่ 25,337.27 และ SET ขึ้น 1.21 จุด (+0.08%) สู่ 1,454.49 โดยต่างชาติซื้อสุทธิราว 682 ล้านบาท`},

    dbNext:{en:"Next", th:"ถัดไป"}, dbNextVal:{en:"Watch whether Monday's rebound holds on Tuesday, Nvidia follow-through and the board's ongoing investigation, Wednesday's October PCE inflation and Q3 GDP revision (moved up because of Thursday's Thanksgiving closure), and whether a firm PCE cements a 9 December Fed hike.", th:"จับตาว่าการดีดกลับวันจันทร์จะยืนได้ในวันอังคารหรือไม่ แรงซื้อต่อเนื่องใน Nvidia และการสอบสวนของคณะกรรมการที่ยังดำเนินอยู่ ตัวเลขเงินเฟ้อ PCE เดือนตุลาคมและ GDP ไตรมาส 3 ฉบับปรับปรุงวันพุธ (เลื่อนขึ้นเพราะวันพฤหัสฯ ตลาดปิดวัน Thanksgiving) และ PCE ที่สูงจะยืนยันการขึ้นดอกเบี้ยของเฟดวันที่ 9 ธ.ค. หรือไม่"},

    leadtxt:{en:`<b>Stocks snapped a seven-day losing run with their best day since April 2025 after Nvidia reinstated Jensen Huang as CEO.</b> The <b>S&P 500 rose 4.73% to 7,237.17</b>, the <b>Nasdaq jumped 6.51% to 24,089.56</b> and the <b>Dow gained 1,448 points (+3.01%) to 49,595</b>. <b>Nvidia closed up about 31%</b>, but <b>Anthropic slipped 1.4% to $87.64</b>. One rebound day doesn't end a correction: the S&P 500 is still about 7.4% below its peak. <b>Yields edged up (2-year ~4.70%, 10-year ~4.93%)</b> and markets price a <b>~98% chance of a 9 December Fed hike</b>. <b>Gold bounced to ~$3,620</b>, while <b>oil fell (WTI $80.17, −4.5%)</b> as Trump gave Iran diplomacy more time. Asia missed the rally (<b>Kospi −3.3%</b>, Japan closed), Europe joined it (<b>DAX +2.15%</b>), and the <b>SET was flat at 1,454.49</b> as foreigners turned buyers (~THB 682m). <b>For you:</b> don't chase Monday's spike — quality bond income stays the core, add to tech only gradually, and keep gold as a small hedge now that it is behaving like one again.`, th:`<b>หุ้นหยุดการลดลง 7 วันติด ด้วยวันที่ดีที่สุดตั้งแต่เมษายน 2025 หลัง Nvidia ให้ Jensen Huang กลับมาเป็น CEO</b> <b>S&P 500 ขึ้น 4.73% สู่ 7,237.17</b> <b>Nasdaq พุ่ง 6.51% สู่ 24,089.56</b> และ <b>Dow ขึ้น 1,448 จุด (+3.01%) สู่ 49,595</b> <b>Nvidia ปิดบวกราว 31%</b> แต่ <b>Anthropic ลดลง 1.4% สู่ $87.64</b> การดีดกลับวันเดียวยังไม่จบภาวะปรับฐาน: S&P 500 ยังต่ำกว่าจุดสูงสุดราว 7.4% <b>ผลตอบแทนบอนด์ขยับขึ้น (2 ปีราว 4.70% 10 ปีราว 4.93%)</b> และตลาดให้ <b>โอกาสราว 98% ที่เฟดจะขึ้นดอกเบี้ยวันที่ 9 ธ.ค.</b> <b>ทองคำดีดกลับสู่ราว $3,620</b> ส่วน <b>น้ำมันลดลง (WTI $80.17, −4.5%)</b> เพราะทรัมป์ให้เวลาการเจรจากับอิหร่าน เอเชียพลาดการดีดกลับ (<b>Kospi −3.3%</b> ญี่ปุ่นปิดวันหยุด) ยุโรปขึ้นตาม (<b>DAX +2.15%</b>) และ <b>SET ทรงตัวที่ 1,454.49</b> โดยต่างชาติกลับมาซื้อ (ราว 682 ล้านบาท) <b>สำหรับคุณ:</b> อย่าไล่ซื้อตามการพุ่งวันจันทร์ — รายได้จากบอนด์คุณภาพยังเป็นแกนหลัก ทยอยเพิ่มหุ้นเทคทีละน้อย และถือทองคำสัดส่วนเล็กเป็นตัวป้องกันความเสี่ยง เพราะกลับมาทำหน้าที่นั้นได้อีกครั้ง`},

    watchnote:{en:`Monday's rebound was huge — S&P 500 +4.73%, Nasdaq +6.51%, Nvidia +31% on Jensen Huang's reinstatement — but the S&P 500 is still in correction territory, about 7.4% below its October peak. The three things that matter most this holiday-shortened week: whether the rebound holds beyond one day, Wednesday's PCE inflation and GDP data, and whether the Fed hikes on 9 December into a still-fragile market.`,
      th:`การดีดกลับวันจันทร์แรงมาก — S&P 500 +4.73% Nasdaq +6.51% Nvidia +31% จากการที่ Jensen Huang กลับมาเป็น CEO — แต่ S&P 500 ยังอยู่ในภาวะปรับฐาน ต่ำกว่าจุดสูงสุดเดือนตุลาคมราว 7.4% สามเรื่องที่สำคัญที่สุดในสัปดาห์ที่มีวันหยุดนี้: การดีดกลับจะยืนได้เกินหนึ่งวันหรือไม่ ตัวเลขเงินเฟ้อ PCE และ GDP วันพุธ และเฟดจะขึ้นดอกเบี้ยวันที่ 9 ธ.ค. ในขณะที่ตลาดยังเปราะบางหรือไม่`},

    disc:{en:`<b>Please read.</b> This is a personal, private morning summary to help you stay on top of the market — <b>not investment advice, a research report, or a solicitation</b>, and not an official document of UOB, UOBAM, Prudential or any issuer. Equity indices, Treasury yields, oil and gold levels are last-available closes as of the Mon 23 Nov US, Europe, Asia and Thailand close; Japan was closed for a holiday, so the Nikkei shows Friday's close. Treasury yields and gold are approximate (sources differ slightly by timing), the DAX close comes from a single market recap, and the Nvidia leadership news is as reported in the press. Prices may be delayed and are <b>not live quotes</b>. The cover is an illustration, not a photo; news photos stay at the linked source (copyright). Verify every number against your firm's approved systems.`,

      txt:{en:`<b>US stocks staged their best day since April 2025 on Monday: the S&P 500 rose 4.73% to 7,237.17, ending a seven-day losing run; the Nasdaq jumped 6.51% to 24,089.56 and the Dow 3.01% (+1,447.98 pts) to 49,595.31.</b> Nvidia surged about 31% after reinstating Jensen Huang as CEO; Anthropic slipped 1.4% to $87.64.`, th:`<b>หุ้นสหรัฐฯ มีวันที่ดีที่สุดตั้งแต่เมษายน 2025 ในวันจันทร์: S&P 500 ขึ้น 4.73% สู่ 7,237.17 หยุดการลดลง 7 วันติด Nasdaq พุ่ง 6.51% สู่ 24,089.56 และ Dow ขึ้น 3.01% (+1,447.98 จุด) สู่ 49,595.31</b> Nvidia พุ่งราว 31% หลังให้ Jensen Huang กลับมาเป็น CEO ส่วน Anthropic ลดลง 1.4% สู่ $87.64`},
      why:{en:`Nvidia's leadership uncertainty was a big part of last week's rout, so its reversal triggered short-covering across AI stocks. But a one-day snap-back after a 10% drop is common in corrections and doesn't prove the low is in: the S&P 500 is still about 7.4% below its October peak, the board's independent investigation is ongoing, and the Fed still looks set to hike on 9 December. Anthropic falling on a 6.5% Nasdaq day shows investors are still picky about new AI names.`, th:`ความไม่แน่นอนเรื่องผู้บริหาร Nvidia เป็นส่วนสำคัญของการเทขายสัปดาห์ก่อน การกลับลำครั้งนี้จึงทำให้เกิดการซื้อคืนหุ้น AI ทั้งกลุ่ม แต่การดีดกลับแรงวันเดียวหลังลดลง 10% เกิดขึ้นบ่อยในช่วงปรับฐาน และยังไม่พิสูจน์ว่าผ่านจุดต่ำสุดแล้ว: S&P 500 ยังต่ำกว่าจุดสูงสุดเดือนตุลาคมราว 7.4% การสอบสวนอิสระของคณะกรรมการยังไม่จบ และเฟดยังดูจะขึ้นดอกเบี้ยวันที่ 9 ธ.ค. การที่ Anthropic ลดลงในวันที่ Nasdaq ขึ้น 6.5% แสดงว่านักลงทุนยังเลือกหุ้น AI ใหม่อย่างระมัดระวัง`},
      full:{en:`US stocks rebounded sharply on Monday, November 23. The S&P 500 rose 326.78 points (+4.73%) to 7,237.17, its best day since April 2025, snapping a seven-session losing streak; it remains about 7.4% below its October 6 peak. The Dow Jones Industrial Average gained 1,447.98 points (+3.01%) to 49,595.31, and the Nasdaq Composite climbed 6.51% to 24,089.56; the Russell 2000 added 3.40% to 2,669.66, according to AP/Yahoo Finance and CNN. Nvidia's board unanimously reinstated Jensen Huang as president, CEO and director, saying directors were satisfied after meetings with him; interim CEO Colette Kress remains CFO, and an independent board committee's investigation continues. President Trump said he had spoken with the board. Nvidia shares closed up about 31%. Anthropic (ANT) fell 1.4% to $87.64, versus its $83 IPO price.`, th:`หุ้นสหรัฐฯ ดีดกลับแรงวันจันทร์ที่ 23 พ.ย. S&P 500 ขึ้น 326.78 จุด (+4.73%) สู่ 7,237.17 ดีที่สุดตั้งแต่เมษายน 2025 หยุดการลดลง 7 วันติด ยังต่ำกว่าจุดสูงสุดเมื่อ 6 ต.ค. ราว 7.4% Dow Jones ขึ้น 1,447.98 จุด (+3.01%) สู่ 49,595.31 และ Nasdaq ขึ้น 6.51% สู่ 24,089.56 Russell 2000 ขึ้น 3.40% สู่ 2,669.66 ตามรายงานของ AP/Yahoo Finance และ CNN คณะกรรมการ Nvidia มีมติเป็นเอกฉันท์ให้ Jensen Huang กลับมาเป็นประธานเจ้าหน้าที่บริหารและกรรมการ โดยระบุว่าพอใจหลังการประชุมกับเขา CEO ชั่วคราว Colette Kress กลับไปเป็น CFO ตามเดิม และการสอบสวนของคณะกรรมการอิสระยังดำเนินต่อ ประธานาธิบดีทรัมป์ระบุว่าได้คุยกับคณะกรรมการ หุ้น Nvidia ปิดบวกราว 31% Anthropic (ANT) ลดลง 1.4% สู่ $87.64 เทียบราคา IPO $83`},
      sources:[{l:"Yahoo Finance (AP) — How major US stock indexes fared Monday 11/23/2026",u:"https://finance.yahoo.com/markets/world-indices/articles/major-us-stock-indexes-fared-213053319.html"},{l:"CNBC — Jensen Huang reinstated as Nvidia CEO; stock skyrockets 31%",u:"https://www.cnbc.com/2026/11/23/nvidia-jensen-huang-ceo.html"},{l:"NVIDIA Newsroom — Board reinstates Jensen Huang as President, CEO and Board Director",u:"https://nvidianews.nvidia.com/news/nvidia-board-reinstates-jensen-huang-as-president-ceo-and-board-director"},{l:"CNN — Nvidia shares soar more than 30% after Huang reinstated as CEO",u:"https://www.cnn.com/2026/11/23/markets/us-stocks-rebound-intl"},{l:"Motley Fool — The Nasdaq had its best day since April 2025; Anthropic fell anyway",u:"https://www.fool.com/investing/2026/11/23/the-nasdaq-just-had-its-best-day-since-april-2025-anthropic-stock-fell-anyway/"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,337.27", chg:2.15, series:[24802.78,25337.27],
      txt:{en:`<b>Germany's DAX rose 2.15% (+534.49 pts) to 25,337.27 Monday,</b> snapping a five-day losing run and reclaiming 25,000 as the Nvidia news lifted global tech.`, th:`<b>ดัชนี DAX เยอรมนีขึ้น 2.15% (+534.49 จุด) สู่ 25,337.27 วันจันทร์</b> หยุดการลดลง 5 วันติด และกลับขึ้นเหนือ 25,000 เพราะข่าว Nvidia หนุนหุ้นเทคทั่วโลก`},
      why:{en:`Europe fell less than the US last week and bounced well on Monday. Lower oil (Brent below $90) also helps Europe's energy-importing economies. The DAX is still about 6% below its 12 November record above 27,000, so this is a recovery start, not a new uptrend.`, th:`ยุโรปลดลงน้อยกว่าสหรัฐฯ ในสัปดาห์ก่อน และดีดกลับได้ดีวันจันทร์ น้ำมันที่ถูกลง (Brent ต่ำกว่า $90) ยังช่วยเศรษฐกิจยุโรปที่นำเข้าพลังงาน DAX ยังต่ำกว่าสถิติเหนือ 27,000 เมื่อ 12 พ.ย. ราว 6% จึงเป็นแค่จุดเริ่มฟื้นตัว ยังไม่ใช่ขาขึ้นใหม่`},
      full:{en:`Germany's DAX closed 534.49 points (+2.15%) higher at 25,337.27 on Monday, November 23, according to Armstrong Economics' market recap, ending a five-session decline. Some other reports cited a smaller gain of about 1.45%, so treat the exact close as provisional. The index set a record above 27,000 on November 12.`, th:`ดัชนี DAX เยอรมนีปิดเพิ่มขึ้น 534.49 จุด (+2.15%) ที่ 25,337.27 วันจันทร์ที่ 23 พ.ย. ตามรายงานสรุปตลาดของ Armstrong Economics หยุดการลดลง 5 วันติด รายงานอื่นบางแหล่งระบุว่าขึ้นน้อยกว่าราว 1.45% จึงถือว่าราคาปิดยังเป็นตัวเลขเบื้องต้น ดัชนีทำสถิติสูงสุดเหนือ 27,000 เมื่อ 12 พ.ย.`},
      sources:[{l:"Armstrong Economics — Market Talk, November 23, 2026",u:"https://www.armstrongeconomics.com/market-talk/market-talk-november-23-2026/"},{l:"Trading Economics — Germany stock market (DAX)",u:"https://tradingeconomics.com/germany/stock-market"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"56,436.65", chg:-5.06, series:[59444.21,56436.65],
      txt:{en:`<b>Japan was closed Monday for Labour Thanksgiving Day, so the Nikkei 225 still shows Friday's 56,436.65 (−5.06%).</b> Korea's Kospi fell another 3.3% to 4,708.54 (down as much as 5.8% intraday) as Seoul vowed to stabilise the market.`, th:`<b>ตลาดญี่ปุ่นปิดวันจันทร์เนื่องในวันขอบคุณแรงงาน Nikkei 225 จึงยังแสดงราคาปิดวันศุกร์ที่ 56,436.65 (−5.06%)</b> Kospi เกาหลีลดลงอีก 3.3% สู่ 4,708.54 (ระหว่างวันลดลงถึง 5.8%) ขณะที่รัฐบาลเกาหลีใต้ประกาศพยุงตลาด`},
      why:{en:`Asia traded before Wall Street's rebound and before the Nvidia news fully landed, so Korea took another hit. Tuesday is the test: Japan reopens and has two days of global moves to price in, and Asia's chip-heavy markets have the most to gain if the Nvidia rally holds.`, th:`เอเชียซื้อขายก่อนวอลล์สตรีทดีดกลับและก่อนที่ข่าว Nvidia จะออกมาเต็มที่ เกาหลีจึงโดนอีกรอบ วันอังคารคือบททดสอบ: ญี่ปุ่นกลับมาเปิดและต้องสะท้อนความเคลื่อนไหวทั่วโลก 2 วัน และตลาดเอเชียที่มีหุ้นชิปมากจะได้ประโยชน์มากที่สุดหากการขึ้นของ Nvidia ยืนได้`},
      full:{en:`Tokyo's market was closed on Monday, November 23, for a public holiday; the Nikkei 225's last close is 56,436.65 from Friday, November 20, down 5.06% on the day. South Korea's Kospi fell 3.3% to 4,708.54 on Monday after touching about 4,586.80 (−5.8%) intraday, and Seoul pledged steps to stabilise the market, according to AP and Reuters reports.`, th:`ตลาดโตเกียวปิดวันจันทร์ที่ 23 พ.ย. เนื่องในวันหยุดราชการ ราคาปิดล่าสุดของ Nikkei 225 คือ 56,436.65 จากวันศุกร์ที่ 20 พ.ย. ลดลง 5.06% ในวันนั้น Kospi เกาหลีใต้ลดลง 3.3% สู่ 4,708.54 วันจันทร์ หลังระหว่างวันลงไปราว 4,586.80 (−5.8%) และรัฐบาลเกาหลีใต้ให้คำมั่นจะพยุงตลาด ตามรายงานของ AP และ Reuters`},
      sources:[{l:"KSAT (AP) — US futures climb and world shares are mixed as big tech stocks fall in Asia",u:"https://www.ksat.com/business/2026/11/23/us-futures-climb-and-asian-shares-mostly-decline-as-some-tech-stocks-fall/"},{l:"24/7 Wall St. — Taiwan falls 6.2% to cap its worst week since 1991; Nikkei −5.1% (Fri)",u:"https://247wallst.com/investing/2026/11/20/taiwan-stock-market-falls-6-2-to-cap-its-worst-week-since-1991-as-kospi-closes-down-5-2-and-nikkei-225-drops-5-1-in-ai-chip-selloff/"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"22,383.74", chg:-0.12, series:[22410.80,22383.74],
      txt:{en:`<b>Hong Kong's Hang Seng slipped 0.1% to 22,383.74 Monday,</b> a fifth straight small loss; the Shanghai Composite rose 0.2% to 3,538.95 after briefly dipping below 3,500.`, th:`<b>ดัชนี Hang Seng ฮ่องกงลดลง 0.1% สู่ 22,383.74 วันจันทร์</b> ลดลงเล็กน้อยวันที่ 5 ติด ส่วน Shanghai Composite ขึ้น 0.2% สู่ 3,538.95 หลังหลุด 3,500 ชั่วคราวระหว่างวัน`},
      why:{en:`China held up better than Korea because it owns fewer US-linked AI chip names, and buyers stepped in after Shanghai briefly broke 3,500. It may gain less than Japan, Korea and Taiwan from an Nvidia-led rebound, and Washington's closer look at Nvidia's chip sales to China and Southeast Asia is a reminder that the US–China tech contest still caps upside.`, th:`จีนยืนได้ดีกว่าเกาหลีเพราะมีหุ้นชิป AI ที่ผูกกับสหรัฐฯ น้อยกว่า และมีแรงซื้อหลังเซี่ยงไฮ้หลุด 3,500 ชั่วคราว แต่อาจได้ประโยชน์น้อยกว่าญี่ปุ่น เกาหลี และไต้หวันจากการดีดกลับที่นำโดย Nvidia และการที่สหรัฐฯ ตรวจสอบการขายชิป Nvidia ไปจีนและเอเชียตะวันออกเฉียงใต้เข้มขึ้น ย้ำว่าการแข่งขันด้านเทคโนโลยีสหรัฐฯ–จีนยังจำกัดการขึ้น`},
      full:{en:`Hong Kong's Hang Seng Index closed down about 0.1% at 22,383.74 on Monday, November 23 (sources range 22,372–22,389), its fifth consecutive decline. The Shanghai Composite rose about 0.2% to 3,538.95, recovering from an early drop of more than 1% that took it below 3,500.`, th:`ดัชนี Hang Seng ฮ่องกงปิดลดลงราว 0.1% ที่ 22,383.74 วันจันทร์ที่ 23 พ.ย. (แต่ละแหล่งอยู่ในช่วง 22,372–22,389) ลดลงวันที่ 5 ติด Shanghai Composite ขึ้นราว 0.2% สู่ 3,538.95 ฟื้นจากการลดลงกว่า 1% ช่วงเช้าที่ทำให้หลุด 3,500`},
      sources:[{l:"KSAT (AP) — US futures climb and world shares are mixed as big tech stocks fall in Asia",u:"https://www.ksat.com/business/2026/11/23/us-futures-climb-and-asian-shares-mostly-decline-as-some-tech-stocks-fall/"},{l:"Longbridge — Shanghai Composite drops 1%, falling below 3,500 (morning)",u:"https://longbridge.com/en/news/306418806"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,454.49", chg:0.08, series:[1453.28,1454.49],
      txt:{en:`<b>SET Index edged up 1.21 pts (+0.08%) to 1,454.49 Monday</b> on turnover of about THB 56.4bn, trading in a 1,444.50–1,458.55 range; electronics rebounded and foreigners bought about THB 682m.`, th:`<b>ดัชนี SET ขึ้น 1.21 จุด (+0.08%) สู่ 1,454.49 วันจันทร์</b> มูลค่าซื้อขายราว 56,406 ล้านบาท แกว่งในกรอบ 1,444.50–1,458.55 หุ้นอิเล็กทรอนิกส์ฟื้น และต่างชาติซื้อสุทธิราว 682 ล้านบาท`},
      why:{en:`Thailand held its 1,445–1,455 support zone for a second day and foreigners switched to buying after weeks of selling. The Nvidia rally came after Thailand closed, so DELTA and other electronics names could get a further lift on Tuesday. Brokers see a sideways 1,435–1,475 range; lower oil is a plus for Thailand's import bill.`, th:`ไทยยืนแนวรับ 1,445–1,455 ได้เป็นวันที่ 2 และต่างชาติกลับมาซื้อหลังขายมาหลายสัปดาห์ การขึ้นของ Nvidia เกิดขึ้นหลังตลาดไทยปิด DELTA และหุ้นอิเล็กทรอนิกส์อื่นจึงอาจได้แรงหนุนเพิ่มวันอังคาร โบรกเกอร์มองกรอบไซด์เวย์ 1,435–1,475 และน้ำมันที่ถูกลงเป็นผลดีต่อค่านำเข้าของไทย`},
      full:{en:`Thailand's SET Index rose 1.21 points (+0.08%) to close at 1,454.49 on Monday, November 23, with trading value of about THB 56.41 billion and an intraday range of 1,444.50–1,458.55, according to Kaohoon, Hoonsmart and The Bangkok Insight. The index was slightly lower at the midday break (1,452.75) before electronics and value plays lifted it in the afternoon. Foreign investors were net buyers of THB 682.39 million and local retail investors bought about THB 737 million, while local institutions sold about THB 1.2 billion. Brokers expect sideways trade in a 1,435–1,475 range.`, th:`ดัชนี SET ขึ้น 1.21 จุด (+0.08%) ปิดที่ 1,454.49 วันจันทร์ที่ 23 พ.ย. มูลค่าซื้อขายราว 56,406 ล้านบาท กรอบระหว่างวัน 1,444.50–1,458.55 ตามรายงานของข่าวหุ้น Hoonsmart และ The Bangkok Insight ดัชนีปิดภาคเช้าลดลงเล็กน้อยที่ 1,452.75 ก่อนหุ้นอิเล็กทรอนิกส์และหุ้น Value Play ช่วยพยุงช่วงบ่าย นักลงทุนต่างชาติซื้อสุทธิ 682.39 ล้านบาท รายย่อยในประเทศซื้อสุทธิราว 737 ล้านบาท ส่วนสถาบันในประเทศขายสุทธิราว 1,197 ล้านบาท โบรกเกอร์คาดว่าตลาดแกว่งไซด์เวย์ในกรอบ 1,435–1,475`},
      sources:[{l:"Kaohoon International — Market Roundup 23 November 2026",u:"https://www.kaohooninternational.com/markets/595298"},{l:"Kaohoon — SET closes up 1 pt as electronics and value plays lift; sideways tomorrow",u:"https://www.kaohoon.com/summary/883731"},{l:"Hoonsmart — SET up 1.21 pts; foreigners buy THB 682m",u:"https://hoonsmart.com/archives/450086"},{l:"The Bangkok Insight — Thai stocks 23 Nov close slightly higher",u:"https://www.thebangkokinsight.com/news/stock-finance/stock/1723544/"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold bounced about 2.3–2.8% Monday to roughly $3,610–3,635/oz</b> after Friday's 12-month low near $3,526, as the dash for cash eased. <b>Oil fell sharply: WTI settled at $80.17 (−4.5%) and Brent at $89.37 (−3.5%)</b> as President Trump signalled more time for diplomacy with Iran; Brent is down about a fifth this month.`, th:`<b>ทองคำดีดกลับราว 2.3–2.8% วันจันทร์ สู่ราว $3,610–3,635 ต่อออนซ์</b> หลังลงไปต่ำสุดในรอบ 12 เดือนราว $3,526 วันศุกร์ เพราะแรงขายเพื่อหาเงินสดเบาลง <b>น้ำมันลดลงแรง: WTI ปิดที่ $80.17 (−4.5%) และ Brent ที่ $89.37 (−3.5%)</b> เพราะประธานาธิบดีทรัมป์ส่งสัญญาณให้เวลาการเจรจากับอิหร่าน Brent ลดลงราว 1 ใน 5 ในเดือนนี้`},
     why:{en:`Gold rising with stocks shows the forced selling has paused, which is when gold usually starts working again — a small hedge position is back to doing its job. Oil near $80 is good news for Thailand's import bill and for inflation, but Iran's weekend attack on Bahrain shows the headline risk hasn't gone away.`, th:`การที่ทองคำขึ้นพร้อมหุ้นแสดงว่าการบังคับขายหยุดพักแล้ว ซึ่งมักเป็นช่วงที่ทองคำเริ่มทำหน้าที่อีกครั้ง — การถือสัดส่วนเล็กเพื่อป้องกันความเสี่ยงกลับมาใช้ได้ น้ำมันใกล้ $80 เป็นข่าวดีต่อค่านำเข้าของไทยและเงินเฟ้อ แต่การที่อิหร่านโจมตีบาห์เรนช่วงสุดสัปดาห์แสดงว่าความเสี่ยงจากข่าวยังไม่หมดไป`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Treasuries gave back a little Monday: the 2-year yield rose about 6 bp to ~4.69–4.70%, the 10-year held near 4.93% and the 30-year ~5.30%.</b> With stocks rebounding, futures priced a ~98% chance of a quarter-point Fed hike on 9 December, up from ~88% Friday (CME FedWatch via CNBC).`, th:`<b>บอนด์สหรัฐฯ ย่อลงเล็กน้อยวันจันทร์: ผลตอบแทน 2 ปีขึ้นราว 0.06% สู่ราว 4.69–4.70% 10 ปีทรงตัวราว 4.93% และ 30 ปีราว 5.30%</b> เมื่อหุ้นดีดกลับ ตลาดให้โอกาสราว 98% ที่เฟดจะขึ้นดอกเบี้ย 0.25% วันที่ 9 ธ.ค. เพิ่มจากราว 88% วันศุกร์ (CME FedWatch ผ่าน CNBC)`},
     why:{en:`The stock rebound put the Fed hike back on the table — a quarter point looks nearly certain, while a half point now looks very unlikely. Yields near 4.7% (2-year) and 4.9% (10-year) still lock in attractive income, and bonds proved last Friday they can cushion a sell-off. Wednesday's PCE inflation reading (core seen +0.3% m/m, 3.2% y/y) is the next big test.`, th:`การดีดกลับของหุ้นทำให้การขึ้นดอกเบี้ยของเฟดกลับมาอีกครั้ง — การขึ้น 0.25% ดูเกือบแน่นอน ส่วนการขึ้น 0.50% ดูมีโอกาสน้อยมาก ผลตอบแทนราว 4.7% (2 ปี) และ 4.9% (10 ปี) ยังให้รายได้ที่น่าสนใจ และบอนด์พิสูจน์แล้วเมื่อวันศุกร์ว่าช่วยรองรับการเทขายได้ ตัวเลขเงินเฟ้อ PCE วันพุธ (คาด core +0.3% ต่อเดือน 3.2% ต่อปี) คือบททดสอบถัดไป`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Trump moved markets directly on Monday, saying he had spoken with Nvidia's board before it reinstated Jensen Huang. Washington is also stepping up scrutiny of Nvidia chip sales to China and Southeast Asia, and the US licence rule for advanced chips going to data centres in Thailand, Malaysia and Singapore still awaits final text. Democrats, who won both chambers on Nov 3, still plan a bill to roll back Section 301 tariffs.`, th:`ทรัมป์ขยับตลาดโดยตรงวันจันทร์ โดยระบุว่าได้คุยกับคณะกรรมการ Nvidia ก่อนมีมติให้ Jensen Huang กลับมา วอชิงตันยังตรวจสอบการขายชิป Nvidia ไปจีนและเอเชียตะวันออกเฉียงใต้เข้มขึ้น และกฎใบอนุญาตส่งออกชิปขั้นสูงไปยังศูนย์ข้อมูลในไทย มาเลเซีย และสิงคโปร์ยังรอรายละเอียดฉบับสุดท้าย พรรคเดโมแครตที่ชนะทั้งสองสภาเมื่อ 3 พ.ย. ยังวางแผนเสนอกฎหมายลดภาษีตามมาตรา 301`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Trump signalled he is in no rush on an Iran decision and is giving diplomacy more time, sending oil down 3.5–4.5% as traders unwound hedges against a weekend escalation. Risks remain: Iran again attacked Bahrain, which hosts US forces, over the weekend. In Asia, Seoul vowed to stabilise its market after the Kospi fell as much as 5.8%.`, th:`ทรัมป์ส่งสัญญาณว่าไม่รีบตัดสินใจเรื่องอิหร่านและให้เวลาการเจรจา ทำให้น้ำมันลดลง 3.5–4.5% เพราะเทรดเดอร์ถอนการป้องกันความเสี่ยงที่ตั้งไว้รับการยกระดับความขัดแย้งช่วงสุดสัปดาห์ แต่ความเสี่ยงยังอยู่: อิหร่านโจมตีบาห์เรนซึ่งมีฐานทัพสหรัฐฯ อีกครั้งช่วงสุดสัปดาห์ ในเอเชีย รัฐบาลเกาหลีใต้ประกาศพยุงตลาดหลัง Kospi ลดลงถึง 5.8%`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The stock rebound pushed the 2-year yield up about 6 bp to ~4.70%, with the 10-year steady near 4.93% and the 30-year ~5.30%. Futures price a ~98% chance of a quarter-point hike at the 8–9 Dec meeting (target now 3.75–4.00%); a half-point move looks very unlikely. NY Fed President Williams is the last scheduled Fed speaker before the blackout. Quality bond income remains the anchor.`, th:`การดีดกลับของหุ้นดันผลตอบแทน 2 ปีขึ้นราว 0.06% สู่ราว 4.70% ส่วน 10 ปีทรงตัวราว 4.93% และ 30 ปีราว 5.30% ตลาดให้โอกาสราว 98% ที่เฟดจะขึ้นดอกเบี้ย 0.25% ในการประชุม 8–9 ธ.ค. (กรอบปัจจุบัน 3.75–4.00%) การขึ้น 0.50% ดูมีโอกาสน้อยมาก ประธานเฟดนิวยอร์ก Williams เป็นผู้พูดคนสุดท้ายก่อนช่วงงดให้ความเห็น รายได้จากบอนด์คุณภาพยังเป็นหลักยึดของพอร์ต`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
