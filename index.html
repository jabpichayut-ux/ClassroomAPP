<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"The Fed Hikes Rates for the First Time in Three Years — Wall Street Slides and the 10-Year Yield Tops 5% Again", th:"เฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี — วอลล์สตรีทปรับลง ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 5% อีกครั้ง"},
    heroDeck:{en:`The Federal Reserve raised its benchmark rate a quarter point to 3.75%-4.00% on Wednesday — its first hike in three years — in a unanimous 12-0 vote. Chair Kevin Warsh said inflation "is too high, and has been for too long," and the Fed's updated dot plot showed most officials expect at least one more hike this year. Wall Street's first reaction was negative: the Dow Jones Industrial Average tumbled 631.21 points (-1.21%) to 51,461.90, the S&P 500 fell 0.45% to 7,551.81, and the Nasdaq Composite was essentially flat, down 0.01% to 25,978.42. The 10-year Treasury yield climbed back above 5% to 5.016% as Warsh's hawkish inflation comments outweighed the hike itself, with the 2-year near 4.74% and the 30-year near 5.35%. Oil jumped on fresh Middle East supply fears — Houthi attacks and a shutdown of Saudi Arabia's East-West pipeline suspended loadings at Yanbu port — with WTI up 4.2% to $104.25/bbl and Brent up 4.14% to $108.94/bbl, while gold slipped 1.2% to $4,240.10/oz as the hawkish tone lifted the dollar. Asia and Europe, which closed hours before the Fed's 2pm ET announcement, only had time to trade on anticipation: Germany's DAX rose 0.62% to roughly 25,265, Japan's Nikkei 225 jumped 0.69% (+438.90 pts) to 63,923.00 on futures-led buying, Hong Kong's Hang Seng edged up 0.19% to 24,713.78, and mainland China's Shanghai Composite gained 0.80% to roughly 3,895. Thailand's SET Index fell 1.01% (-15.93 pts) to 1,562.73 on turnover of about THB 75.54bn, weighed down by an Energy Policy Administration Committee cut to the ex-refinery diesel price and reports that the "Thai Travel Plus" tourism-stimulus rollout has been delayed — domestic drivers, unrelated to the Fed. Next up: the Bank of Japan's own decision, due September 17-18.`, th:`ธนาคารกลางสหรัฐฯ (เฟด) ขึ้นอัตราดอกเบี้ยนโยบาย 0.25% สู่ระดับ 3.75%-4.00% ในวันพุธ — เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี — ด้วยมติเอกฉันท์ 12 เสียงของกรรมการ FOMC ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ "สูงเกินไป และสูงมานานเกินไป" ขณะ dot plot ฉบับปรับใหม่ของเฟดแสดงว่ากรรมการส่วนใหญ่คาดว่าจะมีการขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ ปฏิกิริยาแรกของวอลล์สตรีทเป็นไปในทางลบ — ดัชนี Dow Jones ร่วง 631.21 จุด (-1.21%) สู่ 51,461.90 ดัชนี S&P 500 ลดลง 0.45% สู่ 7,551.81 และดัชนี Nasdaq Composite แทบไม่เปลี่ยนแปลง ลดลง 0.01% สู่ 25,978.42 ผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% เมื่อถ้อยแถลงเรื่องเงินเฟ้อที่สายเหยี่ยวของวอร์ชมีน้ำหนักมากกว่าการขึ้นดอกเบี้ยเอง ขณะพันธบัตร 2 ปียืนใกล้ 4.74% และพันธบัตร 30 ปียืนใกล้ 5.35% ราคาน้ำมันพุ่งขึ้นจากความกังวลด้านอุปทานในตะวันออกกลางรอบใหม่ — กลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันสายตะวันออก-ตะวันตกของซาอุดีอาระเบียถูกปิด ทำให้การขนถ่ายน้ำมันที่ท่าเรือยันบูถูกระงับ — โดย WTI เพิ่มขึ้น 4.2% สู่ $104.25 ต่อบาร์เรล และเบรนท์เพิ่มขึ้น 4.14% สู่ $108.94 ต่อบาร์เรล ขณะทองคำลดลง 1.2% สู่ $4,240.10 ต่อออนซ์ เมื่อท่าทีสายเหยี่ยวของเฟดหนุนดอลลาร์แข็งค่า ตลาดเอเชียและยุโรปซึ่งปิดตลาดหลายชั่วโมงก่อนเฟดจะประกาศเวลาบ่ายสองตามเวลาสหรัฐฯ มีเวลาเทรดเพียงตามการคาดการณ์เท่านั้น — ดัชนี DAX เยอรมนีเพิ่มขึ้น 0.62% สู่ราว 25,265 ดัชนี Nikkei 225 ญี่ปุ่นพุ่งขึ้น 0.69% (+438.90 จุด) สู่ 63,923.00 จากแรงซื้อที่นำโดยฟิวเจอร์ส ดัชนี Hang Seng ฮ่องกงขยับขึ้น 0.19% สู่ 24,713.78 และดัชนี Shanghai Composite จีนแผ่นดินใหญ่เพิ่มขึ้น 0.80% สู่ราว 3,895 ดัชนี SET ไทยลดลง 1.01% (-15.93 จุด) สู่ 1,562.73 มูลค่าการซื้อขายราว 7.554 หมื่นล้านบาท กดดันจากมติคณะกรรมการบริหารนโยบายพลังงานที่ปรับลดราคาน้ำมันดีเซลหน้าโรงกลั่น และรายงานว่าโครงการกระตุ้นท่องเที่ยว "Thai Travel Plus" ถูกเลื่อนออกไป — ปัจจัยภายในประเทศ ไม่เกี่ยวกับเฟด ก้าวต่อไปคือการตัดสินใจของธนาคารกลางญี่ปุ่น (BOJ) เองในวันที่ 17-18 กันยายน`},

    leadtxt:{en:`<b>The Fed's first rate hike in three years is now confirmed — a quarter-point move to 3.75%-4.00%, approved 12-0 — and Wall Street's first reaction was a clear risk-off day, not a relief rally.</b> The Dow fell 631.21 points (-1.21%) to 51,461.90, the S&P 500 dropped 0.45% to 7,551.81, and the Nasdaq was roughly flat at 25,978.42. Chair Kevin Warsh's post-decision comments that inflation "is too high, and has been for too long" pushed the 10-year Treasury yield back above 5% to 5.016%, with the 2-year near 4.74% and the 30-year near 5.35% — confirmation that rates, not the equity selloff, are still the dominant story. Oil jumped on fresh Middle East supply disruptions (WTI +4.2% to $104.25, Brent +4.14% to $108.94) after Houthi attacks and a Saudi pipeline shutdown, while gold slipped 1.2% to $4,240.10 as the hawkish tone lifted the dollar. Asia and Europe, which closed hours before the Fed's announcement, only had time to trade on anticipation — DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80% — while Thailand's SET fell 1.01% to 1,562.73 on domestic drivers (a diesel price cut and a delayed tourism-stimulus program), unrelated to the Fed. For your clients: <b>the dot plot's signal of at least one more hike this year, not Wednesday's move itself, is what should reset rate expectations into year-end — with the Bank of Japan's own decision (Sep 17-18) the next catalyst.</b>`, th:`<b>การขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปีของเฟดได้รับการยืนยันแล้ว — ปรับขึ้น 0.25% สู่ระดับ 3.75%-4.00% ด้วยมติเอกฉันท์ 12 เสียง — และปฏิกิริยาแรกของวอลล์สตรีทคือวันที่ตลาดปิดรับความเสี่ยงอย่างชัดเจน ไม่ใช่การดีดตัวจากความโล่งใจ</b> ดัชนี Dow ลดลง 631.21 จุด (-1.21%) สู่ 51,461.90 ดัชนี S&P 500 ลดลง 0.45% สู่ 7,551.81 และดัชนี Nasdaq ทรงตัวใกล้เคียงเดิมที่ 25,978.42 ถ้อยแถลงของประธานเควิน วอร์ช หลังการตัดสินใจที่ว่าเงินเฟ้อ "สูงเกินไป และสูงมานานเกินไป" ผลักดันให้ผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% ขณะพันธบัตร 2 ปียืนใกล้ 4.74% และพันธบัตร 30 ปียืนใกล้ 5.35% — ยืนยันว่าอัตราดอกเบี้ยยังคงเป็นเรื่องราวหลัก มากกว่าแรงเทขายหุ้น ราคาน้ำมันพุ่งขึ้นจากการหยุดชะงักด้านอุปทานในตะวันออกกลางรอบใหม่ (WTI +4.2% สู่ $104.25, เบรนท์ +4.14% สู่ $108.94) หลังกลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันของซาอุดีอาระเบียถูกปิด ขณะทองคำลดลง 1.2% สู่ $4,240.10 เมื่อท่าทีสายเหยี่ยวหนุนดอลลาร์แข็งค่า ตลาดเอเชียและยุโรปซึ่งปิดตลาดหลายชั่วโมงก่อนเฟดจะประกาศ มีเวลาเทรดเพียงตามการคาดการณ์ — DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80% — ขณะ SET ไทยลดลง 1.01% สู่ 1,562.73 จากปัจจัยภายในประเทศ (การปรับลดราคาดีเซลและโครงการกระตุ้นท่องเที่ยวที่ถูกเลื่อนออกไป) ซึ่งไม่เกี่ยวกับเฟด สำหรับลูกค้าของคุณ: <b>สัญญาณจาก dot plot ที่บ่งชี้การขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ ไม่ใช่การขึ้นดอกเบี้ยวันพุธเอง คือสิ่งที่ควรใช้ปรับความคาดหวังอัตราดอกเบี้ยช่วงปลายปี โดยมีการตัดสินใจของธนาคารกลางญี่ปุ่น (17-18 ก.ย.) เป็นปัจจัยกระตุ้นถัดไป</b>`},

    watchnote:{en:`The Fed delivered its first hike in three years Wednesday — a quarter point to 3.75%-4.00%, approved 12-0 — with Chair Kevin Warsh's inflation warnings and an updated dot plot pointing to at least one more hike this year. A day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting: a rare back-to-back week for the world's two most-watched central banks, and still pending as of this morning. US equities fell on the news (Dow -1.21%, S&P -0.45%, Nasdaq flat), while Asia and Europe — which closed hours before the announcement — only reacted after the fact. <b style="color:var(--muted)">The Bank of Japan's decision</b> is the key event left this week — watch whether Thursday's session brings a fuller market reaction to the Fed once Asia and Europe reopen.`,
      th:`เฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปีเมื่อวันพุธ — ปรับขึ้น 0.25% สู่ระดับ 3.75%-4.00% ด้วยมติเอกฉันท์ 12 เสียง — โดยคำเตือนเรื่องเงินเฟ้อของประธานเควิน วอร์ช และ dot plot ฉบับปรับใหม่บ่งชี้การขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ หนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก และยังไม่ประกาศผล ณ เช้านี้ หุ้นสหรัฐฯ ปรับลงรับข่าว (Dow -1.21%, S&P -0.45%, Nasdaq ทรงตัว) ขณะตลาดเอเชียและยุโรปซึ่งปิดตลาดก่อนการประกาศหลายชั่วโมง เพิ่งจะได้ตอบสนองภายหลัง <b style="color:var(--muted)">การตัดสินใจของธนาคารกลางญี่ปุ่น</b> คือเหตุการณ์สำคัญที่เหลืออยู่ของสัปดาห์นี้ — ควรจับตาว่าเซสชันวันพฤหัสบดีจะเห็นปฏิกิริยาของตลาดต่อเฟดเต็มรูปแบบหรือไม่ เมื่อตลาดเอเชียและยุโรปเปิดทำการอีกครั้ง`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป เอเชีย และไทย วันพุธที่ 16 ก.ย. หลังผลการตัดสินใจอัตราดอกเบี้ยของเฟด ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

      txt:{en:`<b>The Fed hiked rates a quarter point to 3.75%-4.00% Wednesday — its first hike in three years, approved 12-0 — and Wall Street sold off: the Dow -1.21% (-631.21 pts) to 51,461.90, the S&P 500 -0.45% to 7,551.81, the Nasdaq roughly flat at 25,978.42.</b> Chair Kevin Warsh said inflation "is too high, and has been for too long," pushing the 10-year Treasury yield back above 5% to 5.016%.`, th:`<b>เฟดขึ้นดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% วันพุธ — เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ด้วยมติเอกฉันท์ 12 เสียง — และวอลล์สตรีทปรับลง: Dow -1.21% (-631.21 จุด) สู่ 51,461.90, S&P 500 -0.45% สู่ 7,551.81, Nasdaq ทรงตัวใกล้เคียงเดิมที่ 25,978.42</b> ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ "สูงเกินไป และสูงมานานเกินไป" ผลักดันให้ผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016%`},
      why:{en:`With the hike itself fully priced in, it's Warsh's hawkish inflation language and the dot plot's signal of at least one more hike this year that actually moved markets — the Dow's -1.21% day is a bigger reaction than the rate move alone would justify. The key question for clients now is how many more hikes the Fed delivers before year-end, with the Bank of Japan's own decision (Sep 17-18) the next test of central-bank resolve.`, th:`เมื่อการขึ้นดอกเบี้ยเองถูกสะท้อนในราคาตลาดไปแล้ว สิ่งที่ขยับตลาดจริงคือถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของวอร์ช และสัญญาณจาก dot plot ที่บ่งชี้การขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ — การที่ Dow ร่วง 1.21% ถือเป็นปฏิกิริยาที่รุนแรงกว่าที่การขึ้นดอกเบี้ยเพียงอย่างเดียวจะอธิบายได้ คำถามสำคัญสำหรับลูกค้าตอนนี้คือเฟดจะขึ้นดอกเบี้ยอีกกี่ครั้งก่อนสิ้นปี โดยมีการตัดสินใจของธนาคารกลางญี่ปุ่น (17-18 ก.ย.) เป็นบททดสอบถัดไปของความมุ่งมั่นของธนาคารกลาง`},
      full:{en:`The Federal Reserve raised the federal funds rate a quarter point to a target range of 3.75%-4.00% on Wednesday, its first hike in three years, with all 12 FOMC members voting in favor. Chair Kevin Warsh said in his post-decision press conference that inflation "is too high, and has been for too long," and that this summer's readings do not show underlying trends have meaningfully improved. The Fed's updated Summary of Economic Projections showed 16 of 18 officials see at least one more quarter-point hike as likely later this year, with four penciling in two more. US stocks fell on the news: the S&P 500 dropped 0.45% to close at 7,551.81, the Dow Jones Industrial Average tumbled 631.21 points (-1.21%) to 51,461.90, and the Nasdaq Composite was essentially unchanged, down 0.01% to 25,978.42. The 10-year Treasury yield climbed back above 5% to 5.016% as Warsh's hawkish tone outweighed the hike itself, with the 2-year near 4.74% and the 30-year near 5.35%. Oil jumped on fresh Middle East supply concerns — Houthi attacks and a shutdown of Saudi Arabia's East-West pipeline halted loadings at Yanbu port — with WTI up 4.2% to $104.25/bbl and Brent up 4.14% to $108.94/bbl. Gold slipped 1.2% to $4,240.10/oz as the hawkish dot plot lifted the dollar. The Bank of Japan holds its own two-day meeting September 17-18.`, th:`ธนาคารกลางสหรัฐฯ (เฟด) ขึ้นอัตราดอกเบี้ยนโยบาย 0.25% สู่ระดับ 3.75%-4.00% ในวันพุธ เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ด้วยมติเอกฉันท์ของกรรมการ FOMC ทั้ง 12 คน ประธานเควิน วอร์ช กล่าวในการแถลงข่าวหลังการตัดสินใจว่าเงินเฟ้อ "สูงเกินไป และสูงมานานเกินไป" และตัวเลขในช่วงฤดูร้อนที่ผ่านมายังไม่แสดงว่าแนวโน้มพื้นฐานดีขึ้นอย่างมีนัยสำคัญ ประมาณการเศรษฐกิจฉบับปรับใหม่ของเฟดแสดงว่ากรรมการ 16 จาก 18 คนเห็นว่ามีความเป็นไปได้ที่จะขึ้นดอกเบี้ยอีก 0.25% อย่างน้อยหนึ่งครั้งในปีนี้ โดย 4 คนคาดว่าจะขึ้นอีกสองครั้ง หุ้นสหรัฐฯ ปรับลงรับข่าว โดยดัชนี S&P 500 ลดลง 0.45% ปิดที่ 7,551.81 ดัชนี Dow Jones ร่วง 631.21 จุด (-1.21%) สู่ 51,461.90 และดัชนี Nasdaq Composite แทบไม่เปลี่ยนแปลง ลดลง 0.01% สู่ 25,978.42 ผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% เมื่อท่าทีสายเหยี่ยวของวอร์ชมีน้ำหนักมากกว่าการขึ้นดอกเบี้ยเอง ขณะพันธบัตร 2 ปียืนใกล้ 4.74% และพันธบัตร 30 ปียืนใกล้ 5.35% ราคาน้ำมันพุ่งขึ้นจากความกังวลด้านอุปทานในตะวันออกกลางรอบใหม่ — กลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันสายตะวันออก-ตะวันตกของซาอุดีอาระเบียถูกปิด ทำให้การขนถ่ายน้ำมันที่ท่าเรือยันบูหยุดชะงัก — โดย WTI เพิ่มขึ้น 4.2% สู่ $104.25 ต่อบาร์เรล และเบรนท์เพิ่มขึ้น 4.14% สู่ $108.94 ต่อบาร์เรล ทองคำลดลง 1.2% สู่ $4,240.10 ต่อออนซ์ เมื่อ dot plot สายเหยี่ยวหนุนดอลลาร์แข็งค่า ธนาคารกลางญี่ปุ่นจะจัดการประชุมสองวันของตัวเองวันที่ 17-18 กันยายน`},
      sources:[{l:"CNBC — Fed approves interest rate hike, signals one more to come this year",u:"https://www.cnbc.com/2026/09/16/fed-rate-decision-september-2026.html"},{l:"CNBC — 10-year Treasury yield climbs back to 5% after Fed hikes rates, Warsh highlights inflation risks",u:"https://www.cnbc.com/2026/09/16/treasury-yield-bond-market-fed-decision.html"},{l:"CNBC — Dow drops as Fed rate hike and Warsh's inflation talk unnerve investors",u:"https://www.cnbc.com/2026/09/15/stock-market-today-live-updates.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"25,264.88", chg:0.62, series:[25109.20,25264.88],
      txt:{en:`<b>DAX rose 0.62% to roughly 25,265 Wednesday,</b> but the session closed hours before the Fed's 2pm ET decision — so the move reflects positioning ahead of the hike, not a reaction to it.`, th:`<b>DAX เพิ่มขึ้น 0.62% สู่ราว 25,265 วันพุธ</b> แต่ตลาดปิดก่อนเฟดจะประกาศผลการตัดสินใจเวลาบ่ายสองตามเวลาสหรัฐฯ หลายชั่วโมง จึงเป็นการเคลื่อนไหวจากการจัดพอร์ตล่วงหน้า ไม่ใช่ปฏิกิริยาต่อการขึ้นดอกเบี้ย`},
      why:{en:`Europe's modest gain ahead of the Fed, followed by Wall Street's sharp Dow -1.21% reaction after the hike, is the clearest sign yet of the timezone gap: European investors positioned for a well-telegraphed hike, but had no chance to price Warsh's hawkish inflation tone. Watch Thursday's European open for the fuller reaction.`, th:`การที่ยุโรปปรับขึ้นเล็กน้อยก่อนเฟด ตามด้วยปฏิกิริยาที่รุนแรงของวอลล์สตรีท (Dow ร่วง 1.21%) หลังการขึ้นดอกเบี้ย คือสัญญาณที่ชัดเจนที่สุดของช่องว่างเขตเวลา — นักลงทุนยุโรปจัดพอร์ตรับการขึ้นดอกเบี้ยที่คาดการณ์ไว้ล่วงหน้าแล้ว แต่ยังไม่มีโอกาสสะท้อนท่าทีสายเหยี่ยวเรื่องเงินเฟ้อของวอร์ช ควรจับตาตลาดยุโรปเปิดวันพฤหัสบดีเพื่อดูปฏิกิริยาเต็มรูปแบบ`},
      full:{en:`European shares rose Wednesday, with Germany's DAX closing up 0.62% at roughly 25,265, as investors positioned ahead of the Fed's widely expected rate decision. Because the European session closes hours before the Fed's 2pm ET announcement, Wednesday's DAX move reflects anticipation rather than a reaction to the hike or to Chair Kevin Warsh's hawkish inflation comments. Attention now turns to how European markets react at Thursday's open once the region has had a full session to digest the Fed's decision and updated dot plot.`, th:`หุ้นยุโรปปรับขึ้นวันพุธ ดัชนี DAX เยอรมนีปิดตลาดเพิ่มขึ้น 0.62% สู่ราว 25,265 ขณะนักลงทุนจัดพอร์ตล่วงหน้ารับการตัดสินใจอัตราดอกเบี้ยของเฟดที่ตลาดคาดการณ์ไว้แล้ว เนื่องจากตลาดยุโรปปิดทำการก่อนเฟดจะประกาศเวลาบ่ายสองตามเวลาสหรัฐฯ หลายชั่วโมง การเคลื่อนไหวของ DAX วันพุธจึงสะท้อนการคาดการณ์ล่วงหน้า ไม่ใช่ปฏิกิริยาต่อการขึ้นดอกเบี้ยหรือถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของประธานเควิน วอร์ช ตอนนี้ต้องจับตาว่าตลาดยุโรปจะตอบสนองอย่างไรเมื่อเปิดทำการวันพฤหัสบดี หลังภูมิภาคมีเวลาเต็มเซสชันในการย่อยข้อมูลการตัดสินใจของเฟดและ dot plot ฉบับปรับใหม่`},
      sources:[{l:"Investing.com — Germany stocks higher at close of trade; DAX up 0.62%",u:"https://www.investing.com/news/stock-market-news/germany-stocks-higher-at-close-of-trade-dax-up-062-4904137"},{l:"CNBC — Fed meeting recap: Warsh says inflation is still too high",u:"https://www.cnbc.com/2026/09/16/fed-meeting-today-live-updates.html"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"63,923.00", chg:0.69, series:[63484.10,63923.00],
      txt:{en:`<b>Nikkei 225 jumped 0.69% (+438.90 pts) to 63,923.00 Wednesday,</b> on futures-led buying into the Fed's widely expected decision — a session that closed well before Washington's 2pm ET announcement.`, th:`<b>Nikkei 225 พุ่งขึ้น 0.69% (+438.90 จุด) สู่ 63,923.00 วันพุธ</b> จากแรงซื้อที่นำโดยฟิวเจอร์สก่อนเฟดจะประกาศผลการตัดสินใจที่ตลาดคาดการณ์ไว้แล้ว — เซสชันนี้ปิดก่อนวอชิงตันจะประกาศเวลาบ่ายสองตามเวลาสหรัฐฯ มาก`},
      why:{en:`Tokyo's futures-led rally ahead of a hike that was already ~fully priced shows the region was positioning for relief, not for Warsh's hawkish inflation tone — which landed after Tokyo's close. Watch whether Thursday's session gives back some of Wednesday's gain once Japan can react to the actual outcome, with the Bank of Japan's own decision (Sep 17-18) now the bigger swing factor.`, th:`การที่โตเกียวปรับขึ้นจากแรงซื้อฟิวเจอร์สก่อนการขึ้นดอกเบี้ยที่แทบถูกสะท้อนในราคาแล้ว แสดงว่าภูมิภาคนี้จัดพอร์ตรับความโล่งใจ ไม่ใช่รับท่าทีสายเหยี่ยวเรื่องเงินเฟ้อของวอร์ชที่ประกาศหลังตลาดโตเกียวปิดไปแล้ว ควรจับตาว่าเซสชันวันพฤหัสบดีจะคืนกำไรบางส่วนของวันพุธหรือไม่ เมื่อญี่ปุ่นมีโอกาสตอบสนองต่อผลจริง โดยการตัดสินใจของธนาคารกลางญี่ปุ่นเอง (17-18 ก.ย.) เป็นปัจจัยชี้ขาดที่ใหญ่กว่าตอนนี้`},
      full:{en:`Japanese equities rallied Wednesday, with the Nikkei 225 climbing 0.69% (+438.90 points) to close at 63,923.00, driven by futures-led buying ahead of the Fed's widely expected quarter-point hike. Because Tokyo's session closes well before the Fed's 2pm ET announcement, Wednesday's gain reflects positioning rather than a reaction to the actual decision or to Chair Kevin Warsh's hawkish inflation comments afterward. Attention now turns to the Bank of Japan's own two-day meeting September 17-18, and to how Japanese markets react at Thursday's open once they can price in the Fed's outcome.`, th:`หุ้นญี่ปุ่นปรับขึ้นวันพุธ ดัชนี Nikkei 225 พุ่งขึ้น 0.69% (+438.90 จุด) ปิดที่ 63,923.00 จากแรงซื้อที่นำโดยฟิวเจอร์สก่อนการขึ้นดอกเบี้ย 0.25% ของเฟดที่ตลาดคาดการณ์ไว้แล้ว เนื่องจากตลาดโตเกียวปิดทำการก่อนเฟดจะประกาศเวลาบ่ายสองตามเวลาสหรัฐฯ มาก การปรับขึ้นวันพุธจึงสะท้อนการจัดพอร์ตล่วงหน้า ไม่ใช่ปฏิกิริยาต่อผลการตัดสินใจจริงหรือถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของประธานเควิน วอร์ชในเวลาต่อมา ตอนนี้ต้องจับตาการประชุมสองวันของธนาคารกลางญี่ปุ่นเองวันที่ 17-18 ก.ย. และปฏิกิริยาของตลาดญี่ปุ่นเมื่อเปิดทำการวันพฤหัสบดี หลังสามารถสะท้อนผลของเฟดในราคาได้แล้ว`},
      sources:[{l:"Trading Economics — Japan",u:"https://tradingeconomics.com/japan/stock-market"},{l:"CNBC — Fed rate decision live updates, Sept 16",u:"https://www.cnbc.com/2026/09/16/fed-meeting-today-live-updates.html"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,713.78", chg:0.19, series:[24667.24,24713.78],
      txt:{en:`<b>Hang Seng edged up 0.19% to 24,713.78 Wednesday, while the Shanghai Composite gained a firmer 0.80% to roughly 3,895</b> — both sessions closed well before the Fed's announcement, so the moves reflect pre-decision positioning, not a reaction to the hike.`, th:`<b>Hang Seng ขยับขึ้น 0.19% สู่ 24,713.78 วันพุธ ขณะ Shanghai Composite เพิ่มขึ้นแข็งแกร่งกว่าที่ 0.80% สู่ราว 3,895</b> — ทั้งสองตลาดปิดทำการก่อนเฟดจะประกาศผลหลายชั่วโมง การเคลื่อนไหวจึงสะท้อนการจัดพอร์ตล่วงหน้า ไม่ใช่ปฏิกิริยาต่อการขึ้นดอกเบี้ย`},
      why:{en:`Shanghai outpacing Hang Seng again suggests mainland-specific buying, not a China-wide reaction to the Fed — since neither market had a chance to price Warsh's hawkish inflation comments before their close. Watch Thursday's open for the actual regional read-through on the hike and dot plot.`, th:`การที่เซี่ยงไฮ้ปรับขึ้นแรงกว่าฮ่องกงอีกครั้ง บ่งชี้ว่าเป็นแรงซื้อเฉพาะของจีนแผ่นดินใหญ่ ไม่ใช่ปฏิกิริยาทั่วทั้งจีนต่อเฟด เนื่องจากทั้งสองตลาดยังไม่มีโอกาสสะท้อนถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของวอร์ชก่อนปิดตลาด ควรจับตาตลาดเปิดวันพฤหัสบดีเพื่อดูปฏิกิริยาที่แท้จริงของภูมิภาคต่อการขึ้นดอกเบี้ยและ dot plot`},
      full:{en:`Hong Kong and mainland China both edged higher Wednesday: the Hang Seng rose 0.19% to close at 24,713.78, while the Shanghai Composite gained a firmer 0.80% to roughly 3,895. Because both markets close hours before the Fed's 2pm ET announcement, Wednesday's gains reflect positioning ahead of the widely expected quarter-point hike rather than any reaction to the decision itself or to Chair Kevin Warsh's hawkish inflation comments afterward. Both markets remain on watch for how they react at Thursday's open once they can fully price in the Fed's outcome and updated dot plot.`, th:`ฮ่องกงและจีนแผ่นดินใหญ่ปรับขึ้นทั้งคู่วันพุธ: ดัชนี Hang Seng เพิ่มขึ้น 0.19% ปิดที่ 24,713.78 ขณะดัชนี Shanghai Composite เพิ่มขึ้นแข็งแกร่งกว่าที่ 0.80% สู่ราว 3,895 เนื่องจากทั้งสองตลาดปิดทำการก่อนเฟดจะประกาศเวลาบ่ายสองตามเวลาสหรัฐฯ หลายชั่วโมง การปรับขึ้นวันพุธจึงสะท้อนการจัดพอร์ตล่วงหน้ารับการขึ้นดอกเบี้ย 0.25% ที่ตลาดคาดการณ์ไว้แล้ว มากกว่าปฏิกิริยาต่อผลการตัดสินใจเองหรือถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของประธานเควิน วอร์ชในเวลาต่อมา ทั้งสองตลาดยังคงต้องจับตาปฏิกิริยาเมื่อเปิดทำการวันพฤหัสบดี หลังสามารถสะท้อนผลของเฟดและ dot plot ฉบับปรับใหม่ในราคาได้เต็มที่`},
      sources:[{l:"Trading Economics — China",u:"https://tradingeconomics.com/china/stock-market"},{l:"24/7 Wall St. — Hang Seng closes higher as Shanghai leads Hong Kong",u:"https://247wallst.com/cards/hong-kong-held-onto-a-0-22-gain-at-the-bell-but-mainland-b-hsi-market-bell-01m2mkwh9nnwr7b2e9qwswz7hr"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,562.73", chg:-1.01, series:[1591.07,1562.73],
      txt:{en:`<b>SET Index fell 1.01% to 1,562.73 Wednesday (-15.93pts),</b> on turnover of about THB 75.54bn — a domestic-driven decline, unrelated to the Fed, which had yet to announce its decision when Bangkok's session closed.`, th:`<b>ดัชนี SET ลดลง 1.01% สู่ 1,562.73 วันพุธ (-15.93 จุด)</b> มูลค่าการซื้อขายราว 7.554 หมื่นล้านบาท — เป็นการปรับลงจากปัจจัยภายในประเทศ ไม่เกี่ยวกับเฟด ซึ่งยังไม่ประกาศผลการตัดสินใจ ณ ตอนที่ตลาดกรุงเทพฯ ปิดทำการ`},
      why:{en:`Unlike the US, Europe and the rest of Asia, Thailand's move today is a purely local story: an Energy Policy Administration Committee resolution to cut the ex-refinery diesel price pressured energy-sector stocks, while reports that the "Thai Travel Plus" tourism-stimulus rollout has been delayed weighed on tourism names. Flag to clients that the SET's weakness has nothing to do with the Fed hike or global rates.`, th:`ต่างจากสหรัฐฯ ยุโรป และเอเชียส่วนที่เหลือ การเคลื่อนไหวของไทยวันนี้เป็นเรื่องราวภายในประเทศล้วนๆ: มติคณะกรรมการบริหารนโยบายพลังงาน (กบง.) ที่ปรับลดราคาน้ำมันดีเซลหน้าโรงกลั่นกดดันหุ้นกลุ่มพลังงาน ขณะรายงานว่าโครงการกระตุ้นท่องเที่ยว "Thai Travel Plus" ถูกเลื่อนออกไปกดดันหุ้นกลุ่มท่องเที่ยว ควรแจ้งลูกค้าว่าความอ่อนแอของ SET ไม่เกี่ยวข้องกับการขึ้นดอกเบี้ยของเฟดหรืออัตราดอกเบี้ยโลก`},
      full:{en:`Thailand's SET Index closed Wednesday at 1,562.73, down 15.93 points (-1.01%), on turnover of about THB 75.54 billion. The decline was domestically driven: an Energy Policy Administration Committee resolution to cut the ex-refinery diesel price pressured energy-sector stocks, while reports that the government's "Thai Travel Plus" tourism-stimulus program rollout has been delayed weighed on tourism-linked names. Because Bangkok's session closed before the Fed's 2pm ET announcement, Wednesday's SET move reflects local drivers rather than any reaction to the Fed's rate decision. Attention now turns to the Bank of Japan's Sep 17-18 decision and to how Thai markets digest the Fed's outcome once trading resumes Thursday.`, th:`ดัชนี SET ของไทยปิดตลาดวันพุธที่ 1,562.73 ลดลง 15.93 จุด (-1.01%) มูลค่าการซื้อขายราว 7.554 หมื่นล้านบาท การปรับลงครั้งนี้มาจากปัจจัยภายในประเทศ: มติคณะกรรมการบริหารนโยบายพลังงาน (กบง.) ที่ปรับลดราคาน้ำมันดีเซลหน้าโรงกลั่นกดดันหุ้นกลุ่มพลังงาน ขณะรายงานว่าโครงการกระตุ้นท่องเที่ยวของรัฐบาล "Thai Travel Plus" ถูกเลื่อนการดำเนินการออกไปกดดันหุ้นกลุ่มท่องเที่ยว เนื่องจากตลาดกรุงเทพฯ ปิดทำการก่อนเฟดจะประกาศเวลาบ่ายสองตามเวลาสหรัฐฯ การเคลื่อนไหวของ SET วันพุธจึงสะท้อนปัจจัยภายในประเทศ ไม่ใช่ปฏิกิริยาต่อผลการตัดสินใจอัตราดอกเบี้ยของเฟด ตอนนี้ต้องจับตาการตัดสินใจของธนาคารกลางญี่ปุ่นวันที่ 17-18 ก.ย. และการที่ตลาดไทยย่อยผลของเฟดเมื่อการซื้อขายกลับมาดำเนินต่อวันพฤหัสบดี`},
      sources:[{l:"Kaohoon International — Market Roundup 16 Sep",u:"https://www.kaohooninternational.com/markets/590667"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil jumped Wednesday after Houthi attacks and a shutdown of Saudi Arabia's East-West pipeline suspended loadings at Yanbu port — WTI rose 4.2% to $104.25/bbl, Brent rose 4.14% to $108.94/bbl. Gold slipped 1.2% to $4,240.10/oz,</b> as the Fed's hawkish dot plot lifted the dollar and outweighed the initial post-decision safe-haven bid.`, th:`<b>ราคาน้ำมันพุ่งขึ้นวันพุธ หลังกลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันสายตะวันออก-ตะวันตกของซาอุดีอาระเบียถูกปิด ทำให้การขนถ่ายน้ำมันที่ท่าเรือยันบูถูกระงับ — WTI เพิ่มขึ้น 4.2% สู่ $104.25 ต่อบาร์เรล เบรนท์เพิ่มขึ้น 4.14% สู่ $108.94 ต่อบาร์เรล ทองคำลดลง 1.2% สู่ $4,240.10 ต่อออนซ์</b> เมื่อ dot plot สายเหยี่ยวของเฟดหนุนดอลลาร์แข็งค่าและมีน้ำหนักมากกว่าแรงซื้อสินทรัพย์ปลอดภัยช่วงแรกหลังการตัดสินใจ`},
     why:{en:`Oil surging on a fresh supply shock while gold falls on a hawkish Fed is not a contradiction — it shows two separate forces at work: Middle East supply risk for crude, and rate expectations for gold. Together they argue for treating this as a genuine geopolitical escalation layered on top of a monetary-policy story, not a single "risk-off" narrative. Watch Saudi pipeline repair timelines alongside the Fed's next moves.`, th:`การที่น้ำมันพุ่งขึ้นจากช็อกด้านอุปทานรอบใหม่ ขณะทองคำลดลงจากท่าทีสายเหยี่ยวของเฟด ไม่ใช่เรื่องขัดแย้งกัน — แต่แสดงว่ามีสองปัจจัยแยกกันทำงาน: ความเสี่ยงด้านอุปทานตะวันออกกลางสำหรับน้ำมันดิบ และความคาดหวังอัตราดอกเบี้ยสำหรับทองคำ ทั้งสองปัจจัยรวมกันชี้ว่าควรมองนี่เป็นการทวีความรุนแรงทางภูมิรัฐศาสตร์ที่แท้จริง ซ้อนทับกับเรื่องราวนโยบายการเงิน ไม่ใช่แค่ภาวะ "หลีกเลี่ยงความเสี่ยง" เพียงอย่างเดียว ควรจับตากรอบเวลาซ่อมท่อส่งน้ำมันของซาอุดีอาระเบียควบคู่กับการเคลื่อนไหวถัดไปของเฟด`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The Fed hiked rates a quarter point to 3.75%-4.00% Wednesday, its first hike in three years, in a unanimous 12-0 vote.</b> Chair Kevin Warsh said inflation "is too high, and has been for too long," pushing the 10-year Treasury yield back above 5% to 5.016%, with the 2-year near 4.74% and the 30-year near 5.35%. The updated dot plot showed most officials expect at least one more hike this year. A day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting — a rare back-to-back week for the world's two most-watched central banks.`, th:`<b>เฟดขึ้นดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% วันพุธ เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ด้วยมติเอกฉันท์ 12 เสียง</b> ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ "สูงเกินไป และสูงมานานเกินไป" ผลักดันให้ผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% ขณะพันธบัตร 2 ปียืนใกล้ 4.74% และพันธบัตร 30 ปียืนใกล้ 5.35% dot plot ฉบับปรับใหม่แสดงว่ากรรมการส่วนใหญ่คาดว่าจะมีการขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ หนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญที่สุดของโลกสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก`},
     why:{en:`With the hike itself fully priced in, Warsh's hawkish inflation language and the dot plot's signal of more hikes to come are what actually moved markets — hence Wall Street's outsized reaction (Dow -1.21%) to a well-telegraphed move. Have a scenario ready for one, or possibly two, further hikes before year-end, with the Bank of Japan's decision the next test of central-bank resolve.`, th:`เมื่อการขึ้นดอกเบี้ยเองถูกสะท้อนในราคาตลาดไปแล้ว สิ่งที่ขยับตลาดจริงคือถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของวอร์ช และสัญญาณจาก dot plot ที่บ่งชี้การขึ้นดอกเบี้ยเพิ่มเติม จึงเป็นเหตุให้วอลล์สตรีทตอบสนองรุนแรงเกินคาด (Dow -1.21%) ต่อการขึ้นดอกเบี้ยที่ตลาดรับรู้ล่วงหน้าแล้ว ควรเตรียมสถานการณ์รับการขึ้นดอกเบี้ยอีกหนึ่งหรืออาจถึงสองครั้งก่อนสิ้นปี โดยมีการตัดสินใจของธนาคารกลางญี่ปุ่นเป็นบททดสอบถัดไปของความมุ่งมั่นของธนาคารกลาง`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Trump's pressure campaign on the Fed continued right up to Wednesday's hike, with the Vice President and Treasury Secretary having urged a hold or cut — the Fed hiked anyway, 12-0. Section 338 tariffs remain in effect and the ~7.5% China "overcapacity" tariff still looms ahead of a planned Trump-Xi summit.`, th:`แคมเปญกดดันเฟดของทรัมป์ดำเนินต่อเนื่องจนถึงการขึ้นดอกเบี้ยวันพุธ โดยรองประธานาธิบดีและรัฐมนตรีคลังเคยเรียกร้องให้คงหรือลดดอกเบี้ย — แต่เฟดก็ขึ้นดอกเบี้ยอยู่ดี ด้วยมติเอกฉันท์ 12 เสียง มาตรการภาษีมาตรา 338 ยังคงมีผลบังคับใช้ และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้`}, w:{en:`A unanimous 12-0 hike despite sustained White House pressure confirms political jawboning didn't move the committee — Chair Warsh's hawkish inflation language, not politics, is now the dominant signal for the path of rates into year-end.`, th:`การขึ้นดอกเบี้ยด้วยมติเอกฉันท์ 12 เสียง แม้ทำเนียบขาวจะกดดันต่อเนื่อง ยืนยันว่าแรงกดดันทางการเมืองไม่มีผลต่อกรรมการ ถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของประธานวอร์ช ไม่ใช่การเมือง คือสัญญาณหลักสำหรับทิศทางดอกเบี้ยช่วงปลายปีนี้`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`Oil jumped Wednesday after Houthi militants renewed attacks on Saudi Arabia and a shutdown of the kingdom's East-West pipeline suspended crude loadings at Yanbu port — WTI rose 4.2% to $104.25/bbl and Brent rose 4.14% to $108.94/bbl, a sharp escalation after last week's brief de-escalation on Oman-mediated Hormuz talks.`, th:`ราคาน้ำมันพุ่งขึ้นวันพุธ หลังกลุ่มกบฏฮูตีโจมตีซาอุดีอาระเบียซ้ำ และท่อส่งน้ำมันสายตะวันออก-ตะวันตกของซาอุดีอาระเบียถูกปิด ทำให้การขนถ่ายน้ำมันที่ท่าเรือยันบูถูกระงับ — WTI เพิ่มขึ้น 4.2% สู่ $104.25 ต่อบาร์เรล และเบรนท์เพิ่มขึ้น 4.14% สู่ $108.94 ต่อบาร์เรล เป็นการทวีความรุนแรงอย่างรวดเร็ว หลังคลี่คลายลงชั่วคราวจากการเจรจาที่โอมานเรื่องช่องแคบฮอร์มุซเมื่อสัปดาห์ก่อน`}, w:{en:`This is a fresh supply shock, not a continuation of last week's story — Saudi infrastructure being hit directly raises the stakes beyond shipping-lane harassment. Flag to clients that oil's re-acceleration is now running alongside a hawkish Fed, a combination that could keep headline inflation stickier than the Fed's own projections assume.`, th:`นี่คือช็อกด้านอุปทานรอบใหม่ ไม่ใช่การต่อเนื่องของเรื่องราวสัปดาห์ก่อน — การที่โครงสร้างพื้นฐานของซาอุดีอาระเบียถูกโจมตีโดยตรง ยกระดับความเสี่ยงเกินกว่าการก่อกวนเส้นทางเดินเรือ ควรแจ้งลูกค้าว่าน้ำมันที่กลับมาเร่งตัวขึ้น กำลังเกิดขึ้นพร้อมกับท่าทีสายเหยี่ยวของเฟด ซึ่งอาจทำให้เงินเฟ้อทั่วไปติดสูงกว่าที่ประมาณการของเฟดเองคาดไว้`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`The Fed hiked rates a quarter point to 3.75%-4.00% Wednesday — its first hike in three years, approved 12-0. Chair Kevin Warsh said inflation "is too high, and has been for too long," and the updated dot plot showed 16 of 18 officials see at least one more hike likely this year. A day after the Fed, on Sep 17-18, the Bank of Japan holds its own meeting — a rare back-to-back week for the two most-watched central banks.`, th:`เฟดขึ้นดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% วันพุธ — เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ด้วยมติเอกฉันท์ 12 เสียง ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ "สูงเกินไป และสูงมานานเกินไป" และ dot plot ฉบับปรับใหม่แสดงว่ากรรมการ 16 จาก 18 คนเห็นว่ามีความเป็นไปได้ที่จะขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ หนึ่งวันหลังเฟด วันที่ 17-18 ก.ย. ธนาคารกลางญี่ปุ่น (BOJ) ก็มีการประชุมของตัวเอง นับเป็นสัปดาห์ที่ธนาคารกลางสำคัญสองแห่งประชุมต่อเนื่องกันซึ่งพบได้ยาก`}, w:{en:`With the hike itself fully priced, the dot plot's signal of more hikes to come is the real swing factor — it explains why Wall Street fell as much as it did (Dow -1.21%) on a decision that was never really in doubt. Have a scenario ready for one to two further hikes before year-end, and flag BOJ as the next live risk right behind it.`, th:`เมื่อการขึ้นดอกเบี้ยเองถูกสะท้อนในราคาตลาดแล้ว สัญญาณจาก dot plot ที่บ่งชี้การขึ้นดอกเบี้ยเพิ่มเติมคือปัจจัยชี้ขาดจริง — อธิบายได้ว่าทำไมวอลล์สตรีทจึงปรับลงมากขนาดนี้ (Dow -1.21%) ต่อการตัดสินใจที่แทบไม่มีใครสงสัยอยู่แล้ว ควรเตรียมสถานการณ์รับการขึ้นดอกเบี้ยอีกหนึ่งถึงสองครั้งก่อนสิ้นปี และแจ้งเตือนว่า BOJ คือความเสี่ยงถัดไปที่ต้องจับตาติดๆ`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`No new CPI data has landed since last week's hotter-than-expected core reading, but Chair Kevin Warsh's own words did the talking Wednesday: inflation "is too high, and has been for too long," he said, adding that this summer's readings don't show underlying trends have meaningfully improved — comments that pushed the 10-year Treasury yield back above 5% to 5.016%.`, th:`ยังไม่มีตัวเลข CPI ใหม่นับตั้งแต่ Core CPI ที่ร้อนแรงกว่าคาดเมื่อสัปดาห์ก่อน แต่ถ้อยแถลงของประธานเควิน วอร์ช เองได้สื่อสารแทนในวันพุธ: เขากล่าวว่าเงินเฟ้อ "สูงเกินไป และสูงมานานเกินไป" พร้อมเสริมว่าตัวเลขในช่วงฤดูร้อนที่ผ่านมายังไม่แสดงว่าแนวโน้มพื้นฐานดีขึ้นอย่างมีนัยสำคัญ — ถ้อยแถลงนี้ผลักดันให้ผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016%`}, w:{en:`A central bank hiking rates while its chair simultaneously warns inflation isn't improving is an unusually hawkish combination. Frame client conversations around "one hike delivered, more flagged" as the base case, with the FOMC's updated inflation projections — showing most officials expecting further tightening — as the number to watch.`, th:`ธนาคารกลางที่ขึ้นดอกเบี้ย ขณะประธานเตือนพร้อมกันว่าเงินเฟ้อยังไม่ดีขึ้น ถือเป็นการผสมผสานที่สายเหยี่ยวผิดปกติ ควรวางกรอบการสนทนากับลูกค้าโดยยึด "ขึ้นดอกเบี้ยไปแล้วหนึ่งครั้ง และส่งสัญญาณว่าจะมีอีก" เป็นกรณีฐาน โดยจับตาตัวเลขประมาณการเงินเฟ้อที่ปรับใหม่ของ FOMC ซึ่งแสดงว่ากรรมการส่วนใหญ่คาดว่าจะคุมเข้มนโยบายเพิ่มเติม เป็นตัวเลขสำคัญที่ต้องติดตาม`}},

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 8 Sep",th:"อังคาร 8 ก.ย."}, imp:"h", t:{en:"Wall Street reopens for the first time since the tanker war, with hike odds near 60%",th:"วอลล์สตรีทเปิดตลาดอีกครั้งเป็นครั้งแรกหลังสงครามเรือบรรทุกน้ำมัน ขณะโอกาสขึ้นดอกเบี้ยใกล้ 60%"}, d:{en:"US markets reopen Tuesday after the Labor Day break, giving the first direct pricing of both the weekend's Iran-tanker escalation and the climb in September rate-hike odds to roughly 60%. Oil (Brent near $98, WTI above $92) and the elevated 10-year yield (~4.79%) will be the key signals to watch as trading resumes.",th:"ตลาดสหรัฐฯ เปิดทำการอีกครั้งวันอังคารหลังหยุดวันแรงงาน เป็นการสะท้อนราคาโดยตรงครั้งแรกทั้งการทวีความรุนแรงของสงครามเรือบรรทุกน้ำมันอิหร่านช่วงสุดสัปดาห์ และโอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ขยับขึ้นสู่ราว 60% ราคาน้ำมัน (เบรนท์ใกล้ $98, WTI เหนือ $92) และผลตอบแทนพันธบัตร 10 ปีที่สูงขึ้น (~4.79%) จะเป็นสัญญาณสำคัญที่ต้องจับตาเมื่อการซื้อขายกลับมาดำเนินต่อ"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 9 Sep",th:"พุธ 9 ก.ย."}, imp:"h", t:{en:"Oil tops $101 as tanker war's worst wave yet hits Wall St a third day",th:"น้ำมันทะลุ $101 จากคลื่นโจมตีเรือบรรทุกน้ำมันรุนแรงสุด วอลล์สตรีทร่วงวันที่สาม"}, d:{en:"The US destroyed five Iranian tankers Tuesday and Iran struck back at ten ships near Hormuz Wednesday — the biggest wave of shipping attacks since the six-month war began. Brent settled at $101.21 (+3.4%) and WTI at $96.05 (+3.3%); national gas hit $4.22/gal and diesel a record $5.94/gal. The S&P 500 fell 0.48% to 7,636.36 (a third straight down day), the DAX slid 1.74% to a one-month low of 25,554, and the 10-year Treasury yield hit 4.857% — its highest since November 2023. September hike odds eased slightly to ~57%.",th:"สหรัฐฯ ทำลายเรือบรรทุกน้ำมันอิหร่าน 5 ลำวันอังคาร และอิหร่านโจมตีเรือ 10 ลำใกล้ฮอร์มุซวันพุธ นับเป็นคลื่นโจมตีเรือขนส่งที่รุนแรงที่สุดนับตั้งแต่สงครามเริ่มต้นหกเดือนก่อน เบรนท์ปิดที่ $101.21 (+3.4%) และ WTI ที่ $96.05 (+3.3%) ราคาน้ำมันเบนซินเฉลี่ยทั่วประเทศแตะ $4.22 ต่อแกลลอน และดีเซลทำสถิติใหม่ที่ $5.94 ต่อแกลลอน ดัชนี S&P 500 ลดลง 0.48% สู่ 7,636.36 (ปรับลงวันที่สามติดต่อกัน) ดัชนี DAX ร่วง 1.74% สู่จุดต่ำสุดในรอบเดือนที่ 25,554 และผลตอบแทนพันธบัตร 10 ปีแตะ 4.857% สูงสุดตั้งแต่พฤศจิกายน 2023 โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ลดลงเล็กน้อยสู่ราว 57%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Thu 10 Sep",th:"พฤหัสฯ 10 ก.ย."}, imp:"h", t:{en:"Wall St falls a fourth day; hike odds jump to ~72% as yields near 5%",th:"วอลล์สตรีทร่วงวันที่สี่ โอกาสขึ้นดอกเบี้ยพุ่งสู่ราว 72% ผลตอบแทนใกล้ 5%"}, d:{en:"US stocks fell a fourth straight session — S&P 500 -0.58% to 7,591.70, Dow -0.6% to 52,064.10, Nasdaq -0.65% to 26,081.72 — as the 10-year Treasury yield pushed above 4.9% and Wednesday's in-line PPI kept inflation in focus. September hike odds jumped to roughly 72%, from ~57% a day earlier. Germany's DAX fell 0.8% to 25,401 after the ECB hiked 25bp; Hong Kong's Hang Seng dropped 1.27% while Japan's Nikkei edged up 0.20% and Thailand's SET eased 0.17% on profit-taking. Oil held near $101 and gold rose to $4,405.88.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สี่ติดต่อกัน — S&P 500 ลดลง 0.58% สู่ 7,591.70, Dow ลดลง 0.6% สู่ 52,064.10, Nasdaq ลดลง 0.65% สู่ 26,081.72 — ขณะผลตอบแทนพันธบัตร 10 ปีทะลุ 4.9% และ PPI วันพุธที่ออกมาตามคาดยังตอกย้ำแรงกดดันเงินเฟ้อ โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นสู่ราว 72% จากราว 57% เมื่อวันก่อน ดัชนี DAX เยอรมนีลดลง 0.8% สู่ 25,401 หลัง ECB ขึ้นดอกเบี้ย 25bp ดัชนี Hang Seng ฮ่องกงลดลง 1.27% ขณะ Nikkei ญี่ปุ่นขยับขึ้น 0.20% และ SET ไทยลดลง 0.17% จากแรงขายทำกำไร น้ำมันยืนใกล้ $101 และทองคำเพิ่มขึ้นสู่ $4,405.88"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Fri 11 Sep",th:"ศุกร์ 11 ก.ย."}, imp:"h", t:{en:"Hot core CPI pushes Sep 16 hike odds to ~90%; stocks rally, oil tumbles",th:"Core CPI ร้อนแรงดันโอกาสขึ้นดอกเบี้ย 16 ก.ย. สู่ราว 90% หุ้นดีดตัว น้ำมันร่วง"}, d:{en:"August headline CPI matched forecasts (+0.4% m/m, +3.4% y/y) but core CPI ran hot (+0.3% m/m vs +0.2% expected, +2.4% y/y), pushing Sep 16 hike odds to roughly 90% from ~72% Thursday. The S&P 500 rose 0.86% to 7,656.98, the Dow gained 509.19 pts (+0.98%) to 52,573.29, and the Nasdaq added 0.96% to 26,333.04. The 10-year yield touched 4.98% before easing to ~4.92%, and Brent tumbled 2.8% to $104.61 after Iran signaled Oman talks over the Strait of Hormuz. Earlier, before the print, Asia and Europe stayed mixed: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%.",th:"CPI ทั่วไปเดือน ส.ค. ตรงตามคาด (+0.4% เทียบเดือนก่อน, +3.4% เทียบปีก่อน) แต่ Core CPI ร้อนแรงกว่าคาด (+0.3% เทียบเดือนก่อน เทียบคาดการณ์ 0.2%, +2.4% เทียบปีก่อน) ดันโอกาสขึ้นดอกเบี้ยวันที่ 16 ก.ย. สู่ราว 90% จากราว 72% เมื่อวันพฤหัสบดี ดัชนี S&P 500 เพิ่มขึ้น 0.86% สู่ 7,656.98 ดัชนี Dow เพิ่มขึ้น 509.19 จุด (+0.98%) สู่ 52,573.29 และดัชนี Nasdaq เพิ่มขึ้น 0.96% สู่ 26,333.04 ผลตอบแทนพันธบัตร 10 ปีแตะ 4.98% ก่อนย่อตัวสู่ราว 4.92% และเบรนท์ร่วง 2.8% สู่ $104.61 หลังอิหร่านส่งสัญญาณเจรจาที่โอมานเรื่องช่องแคบฮอร์มุซ ก่อนหน้านั้น ก่อนตัวเลขจะประกาศ ตลาดเอเชียและยุโรปเคลื่อนไหวคละกัน: DAX +0.66%, Nikkei -1.93%, Hang Seng -0.60%, SET -0.65%"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon 14 Sep",th:"จันทร์ 14 ก.ย."}, imp:"h", t:{en:"AI-slowdown selloff runs a full session; 10-year yield tops 5% intraday",th:"แรงเทขาย AI ดำเนินต่อเนื่องเต็มเซสชัน ผลตอบแทน 10 ปีทะลุ 5% ระหว่างวัน"}, d:{en:"US stocks fell a second straight session — S&P 500 -0.48% to 7,619.98, Dow -0.29% to 52,421.20, Nasdaq -0.56% to 26,186.41 — as the weekend's AI-slowdown warnings ran through a full session and the 10-year Treasury yield touched 5.01% intraday before easing to ~4.96%. DAX fell 0.66% to 25,398.75, Nikkei dropped 0.81% to 63,492.99, Hang Seng fell 0.48% to 24,687 (a 4th straight losing session), Shanghai eased 0.07% to 3,885, and Thailand's SET fell 0.84% to 1,591.07 on a DELTA-led electronics selloff. Brent settled $108.34 (+3.6%) and gold fell 1.25% to $4,284.48, its lowest since August.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สองติดต่อกัน — S&P 500 ลดลง 0.48% สู่ 7,619.98, Dow ลดลง 0.29% สู่ 52,421.20, Nasdaq ลดลง 0.56% สู่ 26,186.41 — ขณะคำเตือนชะลอ AI ช่วงสุดสัปดาห์ดำเนินต่อเนื่องเต็มเซสชัน และผลตอบแทนพันธบัตร 10 ปีแตะ 5.01% ระหว่างวัน ก่อนย่อตัวสู่ราว 4.96% ดัชนี DAX ลดลง 0.66% สู่ 25,398.75 ดัชนี Nikkei ลดลง 0.81% สู่ 63,492.99 ดัชนี Hang Seng ลดลง 0.48% สู่ 24,687 (ปรับลงติดต่อกันเป็นเซสชันที่สี่) ดัชนี Shanghai ลดลง 0.07% สู่ 3,885 และดัชนี SET ไทยลดลง 0.84% สู่ 1,591.07 จากแรงเทขายหุ้นอิเล็กทรอนิกส์ที่นำโดย DELTA เบรนท์ปิดที่ $108.34 (+3.6%) และทองคำลดลง 1.25% สู่ $4,284.48 ต่ำสุดตั้งแต่เดือนสิงหาคม"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Tue 15 Sep",th:"อังคาร 15 ก.ย."}, imp:"h", t:{en:"Wall St falls a third day as the 10-year yield hits its highest since 2007",th:"วอลล์สตรีทร่วงวันที่สาม ผลตอบแทน 10 ปีแตะจุดสูงสุดนับตั้งแต่ปี 2007"}, d:{en:"US stocks fell a third straight session — S&P 500 -0.45% to 7,585.73, Dow -0.63% to 52,093.11, Nasdaq -0.78% to 25,981.57 — even as AI chip names Qualcomm and AMD bounced. The 10-year Treasury yield touched 5.04% intraday, its highest since 2007, before easing to ~5.00%, and CME FedWatch pushed hike odds to roughly 92% from 88% Monday. DAX fell 1.14% to ~25,109, Nikkei was flat at 63,484.10, Hang Seng eased 0.08% to 24,667 (a 5th straight losing session), and Shanghai fell 0.54% to 3,864.28. WTI rose to $105.49 while Brent held near $107.46, and gold fell 1.23% to a six-week low of $4,263.19.",th:"หุ้นสหรัฐฯ ปรับลงเป็นวันที่สามติดต่อกัน — S&P 500 ลดลง 0.45% สู่ 7,585.73, Dow ลดลง 0.63% สู่ 52,093.11, Nasdaq ลดลง 0.78% สู่ 25,981.57 — แม้หุ้นชิปกลุ่ม AI อย่าง Qualcomm และ AMD จะดีดตัวขึ้น ผลตอบแทนพันธบัตร 10 ปีแตะ 5.04% ระหว่างวัน สูงสุดนับตั้งแต่ปี 2007 ก่อนย่อตัวสู่ราว 5.00% และ CME FedWatch ปรับโอกาสขึ้นดอกเบี้ยขึ้นสู่ราว 92% จาก 88% เมื่อวันจันทร์ ดัชนี DAX ลดลง 1.14% สู่ราว 25,109 ดัชนี Nikkei ทรงตัวที่ 63,484.10 ดัชนี Hang Seng ลดลง 0.08% สู่ 24,667 (ปรับลงติดต่อกันเป็นเซสชันที่ห้า) และดัชนี Shanghai ลดลง 0.54% สู่ 3,864.28 WTI เพิ่มขึ้นสู่ $105.49 ขณะเบรนท์ยืนใกล้ $107.46 และทองคำลดลง 1.23% สู่ระดับต่ำสุดในรอบหกสัปดาห์ที่ $4,263.19"}},
    {day:{en:"Done",th:"แล้ว"}, date:{en:"Wed 16 Sep",th:"พุธ 16 ก.ย."}, imp:"h", t:{en:"Fed hikes rates for the first time in three years; Wall Street falls, 10-year tops 5% again",th:"เฟดขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี วอลล์สตรีทปรับลง ผลตอบแทน 10 ปีทะลุ 5% อีกครั้ง"}, d:{en:"The FOMC voted 12-0 to raise the fed funds rate a quarter point to 3.75%-4.00%, its first hike in three years. Chair Kevin Warsh said inflation \"is too high, and has been for too long,\" and the updated dot plot showed most officials expect at least one more hike this year. US stocks fell on the news — Dow -1.21% (-631.21 pts) to 51,461.90, S&P 500 -0.45% to 7,551.81, Nasdaq roughly flat at 25,978.42 — and the 10-year Treasury yield climbed back above 5% to 5.016%. Oil jumped on fresh Middle East supply fears (WTI +4.2% to $104.25, Brent +4.14% to $108.94) after Houthi attacks and a Saudi pipeline shutdown, while gold slipped 1.2% to $4,240.10. Asia and Europe, which closed hours before the announcement, only traded on anticipation: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80%. Thailand's SET fell 1.01% to 1,562.73 on domestic drivers (a diesel price cut and a delayed tourism-stimulus program), unrelated to the Fed.",th:"FOMC ลงมติเอกฉันท์ 12 เสียง ขึ้นอัตราดอกเบี้ย 0.25% สู่ระดับ 3.75%-4.00% เป็นการขึ้นดอกเบี้ยครั้งแรกในรอบ 3 ปี ประธานเควิน วอร์ช กล่าวว่าเงินเฟ้อ \"สูงเกินไป และสูงมานานเกินไป\" และ dot plot ฉบับปรับใหม่แสดงว่ากรรมการส่วนใหญ่คาดว่าจะมีการขึ้นดอกเบี้ยอีกอย่างน้อยหนึ่งครั้งในปีนี้ หุ้นสหรัฐฯ ปรับลงรับข่าว — Dow -1.21% (-631.21 จุด) สู่ 51,461.90, S&P 500 -0.45% สู่ 7,551.81, Nasdaq ทรงตัวใกล้เคียงเดิมที่ 25,978.42 — และผลตอบแทนพันธบัตร 10 ปีไต่กลับขึ้นเหนือ 5% สู่ 5.016% ราคาน้ำมันพุ่งขึ้นจากความกังวลด้านอุปทานในตะวันออกกลางรอบใหม่ (WTI +4.2% สู่ $104.25, เบรนท์ +4.14% สู่ $108.94) หลังกลุ่มฮูตีโจมตีซ้ำและท่อส่งน้ำมันของซาอุดีอาระเบียถูกปิด ขณะทองคำลดลง 1.2% สู่ $4,240.10 ตลาดเอเชียและยุโรปซึ่งปิดตลาดก่อนการประกาศหลายชั่วโมง เทรดตามการคาดการณ์เท่านั้น: DAX +0.62%, Nikkei +0.69%, Hang Seng +0.19%, Shanghai +0.80% ดัชนี SET ไทยลดลง 1.01% สู่ 1,562.73 จากปัจจัยภายในประเทศ (การลดราคาดีเซลและโครงการกระตุ้นท่องเที่ยวที่ถูกเลื่อนออกไป) ซึ่งไม่เกี่ยวกับเฟด"}},
    {day:{en:"Today",th:"วันนี้"}, date:{en:"Thu-Fri 17-18 Sep",th:"พฤหัสฯ-ศุกร์ 17-18 ก.ย."}, imp:"h", t:{en:"Bank of Japan meets as markets get their first full session to react to the Fed",th:"ธนาคารกลางญี่ปุ่นประชุม ขณะตลาดมีเซสชันเต็มรูปแบบครั้งแรกในการตอบสนองต่อเฟด"}, d:{en:"The Bank of Japan holds its own two-day meeting Sep 17-18 — a rare back-to-back week with the Fed — its decision still pending as of this morning. With Asia and Europe having closed hours before Wednesday's FOMC announcement, today's sessions are the first chance for those markets to fully price in the hike and Chair Warsh's hawkish inflation comments.",th:"ธนาคารกลางญี่ปุ่น (BOJ) จัดการประชุมสองวันของตัวเองวันที่ 17-18 ก.ย. นับเป็นสัปดาห์ที่ประชุมต่อเนื่องกันกับเฟดซึ่งพบได้ยาก โดยผลการตัดสินใจยังไม่ประกาศ ณ เช้านี้ เนื่องจากตลาดเอเชียและยุโรปปิดทำการก่อนเฟดจะประกาศผลวันพุธหลายชั่วโมง เซสชันวันนี้จึงเป็นโอกาสแรกที่ตลาดเหล่านั้นจะสะท้อนการขึ้นดอกเบี้ยและถ้อยแถลงสายเหยี่ยวเรื่องเงินเฟ้อของประธานวอร์ชในราคาได้เต็มที่"}},
  ];




  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
