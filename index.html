<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
    <div class="grid g2" id="countrygrid"></div>
    <div class="grid g2" style="margin-top:14px" id="extragrid"></div>
    <div class="rule"></div>
    <div class="sechead"><h2 id="s-themes"></h2></div>
    <div class="grid g4" id="themegrid"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Trade Truce Collapses as Trump Vows New Canada Tariffs — Wall Street Slips, Gold Hits Fresh High", th:"ข้อตกลงการค้าพังทลาย ทรัมป์ขู่ภาษีแคนาดารอบใหม่ — วอลล์สตรีทอ่อนตัว ทองคำทำสถิติสูงสุดใหม่"},
    heroDeck:{en:"US stocks slipped Monday as chip names sank — S&P 500 −0.28% (−21.51pts) to 7,652.86, Nasdaq −0.76% to 25,980.19, Dow +0.26% (+140.15pts) to 53,417.16 — after the Canada-US trade truce collapsed over the weekend: Trump vowed a fresh 50% tariff on Canadian autos, parts and steel, PM Carney suspended talks and vowed dollar-for-dollar retaliation, and Washington separately floated a new 7.5% tariff on China over goods 'overcapacity.' The administration also unveiled a sweeping Iran-sanctions push it dubbed 'Operation Economic Outcast' — Treasury Secretary Bessent called it an 'economic D-Day' — though Brent still eased 2.5% to $92.06 on profit-taking. Gold pushed to a fresh multi-month high near $4,646/oz on the fiscal and trade-war jitters, while the 30-year Treasury yield eased to 5.24%. Asia and Thailand followed Wall Street lower — Nikkei −0.74%, Hang Seng −1.89%, Shanghai −0.59%, SET −0.79% to 1,601.05 — as a pivotal week builds: Nvidia earnings and July PCE inflation data land Wednesday, then Fed Chair Kevin Warsh's first Jackson Hole keynote as chair on Friday.", th:"หุ้นสหรัฐฯ อ่อนตัวลงวันจันทร์ จากแรงขายหุ้นกลุ่มชิป — S&P 500 ลดลง 0.28% (−21.51 จุด) สู่ 7,652.86, Nasdaq ลดลง 0.76% สู่ 25,980.19, Dow เพิ่มขึ้น 0.26% (+140.15 จุด) สู่ 53,417.16 — หลังข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลายลงช่วงสุดสัปดาห์: ทรัมป์ขู่เก็บภาษี 50% รอบใหม่กับรถยนต์ ชิ้นส่วน และเหล็กจากแคนาดา นายกฯ Carney ระงับการเจรจาและขู่ตอบโต้แบบดอลลาร์ต่อดอลลาร์ ขณะสหรัฐฯ ยังส่งสัญญาณอาจเก็บภาษีจีนใหม่ 7.5% จากปัญหา 'กำลังผลิตล้นตลาด' รัฐบาลยังเปิดเผยมาตรการคว่ำบาตรอิหร่านระลอกใหญ่ที่เรียกว่า 'Operation Economic Outcast' — รมว.คลัง Bessent เรียกว่าเป็น 'D-Day ทางเศรษฐกิจ' — แม้ราคาน้ำมันเบรนท์จะย่อลง 2.5% สู่ $92.06 จากการขายทำกำไร ทองคำพุ่งขึ้นทำสถิติสูงสุดในรอบหลายเดือนใกล้ $4,646 ต่อออนซ์ จากความกังวลด้านการคลังและสงครามการค้า ขณะผลตอบแทนพันธบัตร 30 ปีย่อลงสู่ 5.24% เอเชียและไทยปรับลงตามวอลล์สตรีท — Nikkei ลดลง 0.74%, Hang Seng ลดลง 1.89%, Shanghai ลดลง 0.59%, SET ลดลง 0.79% สู่ 1,601.05 — ขณะสัปดาห์นี้มีปัจจัยสำคัญรออยู่: ผลประกอบการ Nvidia และดัชนีเงินเฟ้อ PCE เดือน ก.ค. จะออกวันพุธ ตามด้วยสุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh วันศุกร์"},

    leadtxt:{en:`<b>Wall Street slipped Monday as chip names sold off: the S&P 500 fell 0.28% to 7,652.86, the Nasdaq dropped 0.76% to 25,980.19 on Nvidia (−2.9%), Micron (−5.8%) and Broadcom (−2.6%) weakness, while the Dow added 0.26% to 53,417.16.</b> The move came after <b>the Canada-US trade truce collapsed over the weekend — Trump vowed a fresh 50% tariff on Canadian autos, parts and steel, and PM Carney suspended negotiations and promised dollar-for-dollar retaliation,</b> a sharp reversal from Friday's tariff-relief deal. Washington separately floated a new 7.5% "overcapacity" tariff on China ahead of planned Xi-Trump talks. On the geopolitical front, <b>the administration unveiled a sweeping Iran-sanctions campaign dubbed "Operation Economic Outcast," which Treasury Secretary Bessent called an "economic D-Day,"</b> yet oil still eased on profit-taking: <b>Brent fell 2.5% to $92.06/bbl, WTI down about 2.5% to $84.89.</b> Treasury yields eased on the flight to safety — <b>the 10-year held near 4.71% and the 30-year eased to 5.24%,</b> both off their recent highs — while <b>gold pushed to a fresh multi-month high near $4,646/oz</b> as fiscal and trade-war jitters both stayed live. Europe's DAX slipped about 0.3% to roughly 26,058, tracking Wall Street. Asia followed the risk-off tone lower: <b>Hang Seng −1.89% to 25,517.33, Shanghai −0.59% to 3,882.01, Nikkei −0.74% to 65,528.09.</b> Thailand's SET fell 0.79% to 1,601.05 on turnover of about THB 60.9 billion, tracking regional chip-linked weakness in DELTA and HANA. It's a pivotal week ahead: <b>Nvidia reports Q2 earnings and the July PCE inflation report lands Wednesday,</b> then <b>Fed Chair Kevin Warsh's first Jackson Hole keynote as chair (Friday 28 August)</b> is the last major scheduled signal before the 16 September FOMC. For your clients: <b>yields easing even as trade and sanctions risk escalates is a classic flight-to-quality signal — the bond-lock-in case remains fully live,</b> and gold's fresh high is again doing double duty as both a trade-war and fiscal-credibility hedge. Monday's equity dip is a reset on renewed tariff and geopolitical risk, not a verdict on the underlying AI or growth story — Wednesday's Nvidia print is the real near-term test.`, th:`<b>วอลล์สตรีทอ่อนตัวลงวันจันทร์ จากแรงขายหุ้นกลุ่มชิป: ดัชนี S&P 500 ลดลง 0.28% สู่ 7,652.86 ดัชนี Nasdaq ร่วง 0.76% สู่ 25,980.19 จากแรงกดดันของ Nvidia (−2.9%), Micron (−5.8%) และ Broadcom (−2.6%) ขณะ Dow เพิ่มขึ้น 0.26% สู่ 53,417.16</b> การเคลื่อนไหวนี้เกิดขึ้นหลัง <b>ข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลายลงช่วงสุดสัปดาห์ — ทรัมป์ขู่เก็บภาษี 50% รอบใหม่กับรถยนต์ ชิ้นส่วน และเหล็กจากแคนาดา นายกฯ Carney ระงับการเจรจาและขู่ตอบโต้แบบดอลลาร์ต่อดอลลาร์</b> ซึ่งเป็นการกลับตัวอย่างรุนแรงจากข้อตกลงคลายภาษีเมื่อวันศุกร์ สหรัฐฯ ยังส่งสัญญาณแยกต่างหากว่าอาจเก็บภาษีจีนใหม่ 7.5% จากปัญหา "กำลังผลิตล้นตลาด" ก่อนการเจรจาสี-ทรัมป์ที่วางแผนไว้ ด้านภูมิรัฐศาสตร์ <b>รัฐบาลเปิดเผยมาตรการคว่ำบาตรอิหร่านระลอกใหญ่ที่เรียกว่า "Operation Economic Outcast" ซึ่ง รมว.คลัง Bessent เรียกว่าเป็น "D-Day ทางเศรษฐกิจ"</b> แต่ราคาน้ำมันยังคงย่อตัวจากการขายทำกำไร: <b>เบรนท์ลดลง 2.5% สู่ $92.06 ต่อบาร์เรล WTI ลดลงราว 2.5% สู่ $84.89</b> ผลตอบแทนพันธบัตรย่อลงจากแรงซื้อสินทรัพย์ปลอดภัย — <b>10 ปียืนใกล้ 4.71% และ 30 ปีย่อลงสู่ 5.24%</b> ทั้งคู่ลดลงจากระดับสูงล่าสุด ขณะ <b>ทองคำพุ่งขึ้นทำสถิติสูงสุดในรอบหลายเดือนใกล้ $4,646 ต่อออนซ์</b> จากความกังวลด้านการคลังและสงครามการค้าที่ยังคงอยู่ทั้งคู่ ดัชนี DAX ยุโรปย่อลงราว 0.3% สู่ราว 26,058 ตามทิศทางวอลล์สตรีท เอเชียปรับลงตามบรรยากาศ risk-off เช่นกัน: <b>Hang Seng ลดลง 1.89% สู่ 25,517.33, Shanghai ลดลง 0.59% สู่ 3,882.01, Nikkei ลดลง 0.74% สู่ 65,528.09</b> ดัชนี SET ไทยลดลง 0.79% สู่ 1,601.05 มูลค่าการซื้อขายราว 6.09 หมื่นล้านบาท ตามแรงกดดันหุ้นกลุ่มชิปในภูมิภาคที่กระทบ DELTA และ HANA สัปดาห์นี้มีปัจจัยสำคัญรออยู่: <b>ผลประกอบการไตรมาส 2 ของ Nvidia และดัชนีเงินเฟ้อ PCE เดือน ก.ค. จะออกวันพุธ</b> ตามด้วย <b>สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh (ศุกร์ที่ 28 ส.ค.)</b> ซึ่งเป็นสัญญาณสำคัญครั้งสุดท้ายที่กำหนดไว้ก่อนการประชุมเฟด 16 ก.ย. สำหรับลูกค้าของคุณ: <b>การที่ผลตอบแทนพันธบัตรย่อลงแม้ความเสี่ยงการค้าและคว่ำบาตรจะทวีขึ้น เป็นสัญญาณ flight-to-quality แบบคลาสสิก — จุดขายล็อกพันธบัตรยังใช้ได้เต็มที่</b> และทองคำที่ทำสถิติใหม่ก็ทำหน้าที่สองต่อทั้งเป็นตัวป้องกันความเสี่ยงสงครามการค้าและความน่าเชื่อถือทางการคลังอีกครั้ง การปรับลงของหุ้นวันจันทร์คือการปรับฐานจากความเสี่ยงภาษีและภูมิรัฐศาสตร์ที่กลับมา ไม่ใช่บทสรุปของเรื่องราว AI หรือการเติบโตที่แท้จริง — ผลประกอบการ Nvidia วันพุธคือบททดสอบระยะสั้นที่แท้จริง`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,652.86", chg:-0.28, series:[7674.37,7652.86],
      txt:{en:`<b>US stocks slipped Monday as chip names sold off (S&P −0.28% to 7,652.86, Nasdaq −0.76% to 25,980.19, Dow +0.26% to 53,417.16),</b> after the Canada-US trade truce collapsed over the weekend — Trump vowed a fresh 50% tariff on Canadian autos and steel — and Washington unveiled a sweeping new Iran-sanctions push. Nvidia (−2.9%), Micron (−5.8%) and Broadcom (−2.6%) led tech lower ahead of Wednesday's Nvidia earnings and PCE inflation data.`, th:`<b>หุ้นสหรัฐฯ อ่อนตัวลงวันจันทร์ จากแรงขายหุ้นกลุ่มชิป (S&P ลดลง 0.28% สู่ 7,652.86, Nasdaq ลดลง 0.76% สู่ 25,980.19, Dow เพิ่มขึ้น 0.26% สู่ 53,417.16)</b> หลังข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลายลงช่วงสุดสัปดาห์ — ทรัมป์ขู่เก็บภาษี 50% รอบใหม่กับรถยนต์และเหล็กแคนาดา — และสหรัฐฯ เปิดเผยมาตรการคว่ำบาตรอิหร่านระลอกใหญ่ Nvidia (−2.9%), Micron (−5.8%) และ Broadcom (−2.6%) นำหุ้นเทคปรับลง ก่อนผลประกอบการ Nvidia และข้อมูลเงินเฟ้อ PCE วันพุธ`},
      why:{en:`Monday's dip is a reset on renewed tariff and geopolitical risk, not a verdict on the AI growth story — yields easing even as sanctions escalate is a flight-to-quality tell, keeping the bond-lock-in case live while Wednesday's Nvidia print stays the real near-term catalyst for tech-heavy clients.`, th:`การปรับลงวันจันทร์คือการปรับฐานจากความเสี่ยงภาษีและภูมิรัฐศาสตร์ที่กลับมา ไม่ใช่บทสรุปของเรื่องราวการเติบโต AI — ผลตอบแทนพันธบัตรที่ย่อลงแม้ความเสี่ยงคว่ำบาตรจะทวีขึ้น เป็นสัญญาณ flight-to-quality ทำให้จุดขายล็อกพันธบัตรยังใช้ได้ ขณะผลประกอบการ Nvidia วันพุธยังเป็นปัจจัยขับเคลื่อนระยะสั้นที่แท้จริงสำหรับลูกค้าที่ถือหุ้นเทค`},
      full:{en:`US stocks slipped Monday. The S&P 500 fell 0.28% (−21.51pts) to 7,652.86, the Nasdaq Composite dropped 0.76% (−200.26pts) to 25,980.19, and the Russell 2000 fell 0.8% to 2,995.08, while the Dow Jones Industrial Average bucked the trend, adding 0.26% (+140.15pts) to 53,417.16. Chip stocks led the tech-sector weakness: Nvidia dropped 2.9%, Micron Technology fell 5.8% and Broadcom slid 2.6%, pressuring the S&P 500 Information Technology index ahead of Nvidia's Wednesday earnings report. The selloff followed the collapse of the Canada-US trade truce over the weekend — Trump vowed a 50% tariff on Canadian autos, car parts and steel starting next year after talks broke down, and PM Mark Carney suspended negotiations and vowed dollar-for-dollar retaliation, while Ontario's premier threatened to cut off electricity and critical minerals to the US. Separately, Washington moved toward a new 7.5% tariff on China over goods "overcapacity," and the Trump administration unveiled a sweeping Iran-sanctions campaign dubbed "Operation Economic Outcast," which Treasury Secretary Bessent called an "economic D-Day." Bond yields eased on the flight to safety, with the 10-year holding near 4.71% and the 30-year easing to 5.24%. Investors are awaiting Nvidia's earnings and the July PCE inflation report Wednesday, then Fed Chair Kevin Warsh's first Jackson Hole keynote as chair on Friday.`, th:`หุ้นสหรัฐฯ อ่อนตัวลงวันจันทร์ ดัชนี S&P 500 ลดลง 0.28% (−21.51 จุด) สู่ 7,652.86 ดัชนี Nasdaq Composite ร่วง 0.76% (−200.26 จุด) สู่ 25,980.19 และดัชนี Russell 2000 ลดลง 0.8% สู่ 2,995.08 ขณะดัชนี Dow Jones สวนทางปรับขึ้น 0.26% (+140.15 จุด) สู่ 53,417.16 หุ้นกลุ่มชิปนำการอ่อนตัวของภาคเทค: Nvidia ลดลง 2.9% Micron Technology ลดลง 5.8% และ Broadcom ลดลง 2.6% กดดันดัชนีกลุ่มเทคโนโลยีสารสนเทศของ S&P 500 ก่อนผลประกอบการ Nvidia วันพุธ การเทขายเกิดขึ้นหลังข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลายลงช่วงสุดสัปดาห์ — ทรัมป์ขู่เก็บภาษี 50% กับรถยนต์ ชิ้นส่วนรถยนต์ และเหล็กจากแคนาดา เริ่มปีหน้า หลังการเจรจาล่มลง และนายกฯ Mark Carney ระงับการเจรจาและขู่ตอบโต้แบบดอลลาร์ต่อดอลลาร์ ขณะนายกรัฐมนตรีรัฐออนแทรีโอขู่ตัดไฟฟ้าและแร่ธาตุสำคัญต่อสหรัฐฯ นอกจากนี้ สหรัฐฯ ยังส่งสัญญาณอาจเก็บภาษีจีนใหม่ 7.5% จากปัญหา "กำลังผลิตล้นตลาด" และรัฐบาลทรัมป์เปิดเผยมาตรการคว่ำบาตรอิหร่านระลอกใหญ่ที่เรียกว่า "Operation Economic Outcast" ซึ่ง รมว.คลัง Bessent เรียกว่าเป็น "D-Day ทางเศรษฐกิจ" ผลตอบแทนพันธบัตรย่อลงจากแรงซื้อสินทรัพย์ปลอดภัย โดย 10 ปียืนใกล้ 4.71% และ 30 ปีย่อลงสู่ 5.24% นักลงทุนกำลังรอผลประกอบการ Nvidia และดัชนีเงินเฟ้อ PCE เดือน ก.ค. วันพุธ ตามด้วยสุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh วันศุกร์`},
      sources:[{l:"AP / Washington Post",u:"https://www.washingtonpost.com/business/2026/08/24/wall-street-stocks-dow-nasdaq/27d744ee-9ff9-11f1-8606-1d40ad00172e_story.html"},{l:"Reuters",u:"https://www.investing.com/news/economy-news/sp-nasdaq-futures-slip-as-markets-await-iran-sanctions-nvidia-results-4873000"},{l:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-24/trump-vows-to-double-tariffs-on-canadian-autos-escalating-fight"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"~26,058", chg:-0.3, series:[26137,26058],
      txt:{en:`<b>DAX slipped about 0.3% to roughly 26,058 Monday,</b> reversing Friday's gain and tracking Wall Street's chip-led weakness, as the Canada-US trade truce collapsed and nerves built ahead of Nvidia's Wednesday earnings.`, th:`<b>DAX ย่อลงราว 0.3% สู่ราว 26,058 วันจันทร์</b> คืนกำไรที่ทำได้วันศุกร์ ตามแรงกดดันจากหุ้นกลุ่มชิปในวอลล์สตรีท หลังข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลาย และตลาดกังวลก่อนผลประกอบการ Nvidia วันพุธ`},
      why:{en:`A mild DAX pullback on renewed tariff risk and pre-earnings nerves — far calmer than Wall Street's chip-led selloff — reinforces that European equity exposure can be a steadier ballast for clients while the AI-earnings story plays out in the US this week.`, th:`DAX ที่ย่อลงเล็กน้อยจากความเสี่ยงภาษีที่กลับมาและความกังวลก่อนผลประกอบการ — สงบกว่าการเทขายหุ้นกลุ่มชิปในวอลล์สตรีทมาก — ตอกย้ำว่าหุ้นยุโรปเป็นตัวถ่วงสมดุลที่นิ่งกว่าให้ลูกค้าได้ ขณะเรื่องราวผลประกอบการ AI ในสหรัฐฯ กำลังจะเปิดเผยสัปดาห์นี้`},
      full:{en:`European equities slipped Monday. Germany's DAX fell about 0.3% to close below 26,100, reversing gains from the prior session as technology stocks — Volkswagen, Siemens Energy and SAP among the biggest decliners — tracked Wall Street's chip-led weakness. The move came as the Canada-US trade truce collapsed over the weekend and Washington floated a fresh China tariff, while investors stayed cautious ahead of Nvidia's earnings and the Jackson Hole symposium later in the week; markets broadly expect the ECB to hold policy steady into September.`, th:`หุ้นยุโรปอ่อนตัวลงวันจันทร์ ดัชนี DAX เยอรมนีลดลงราว 0.3% ปิดต่ำกว่า 26,100 คืนกำไรจากวันก่อนหน้า โดยหุ้นกลุ่มเทคโนโลยี — Volkswagen, Siemens Energy และ SAP ปรับลงมากสุด — ตามแรงกดดันหุ้นกลุ่มชิปในวอลล์สตรีท การเคลื่อนไหวนี้เกิดขึ้นหลังข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลายลงช่วงสุดสัปดาห์ และสหรัฐฯ ส่งสัญญาณภาษีจีนใหม่ ขณะนักลงทุนยังระมัดระวังก่อนผลประกอบการ Nvidia และงานสัมมนา Jackson Hole ช่วงปลายสัปดาห์ ตลาดส่วนใหญ่คาดว่า ECB จะคงนโยบายไว้จนถึงเดือน ก.ย.`},
      sources:[{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"},{l:"CNBC Markets",u:"https://www.cnbc.com/markets/"},{l:"Bloomberg Europe",u:"https://www.bloomberg.com/europe"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"65,528.09", chg:-0.74, series:[66016.36,65528.09],
      txt:{en:`<b>Nikkei fell 0.74% to 65,528.09 Monday,</b> tracking Wall Street's chip-led weakness and the collapse of the Canada-US trade truce, as investors braced for a pivotal week with Nvidia earnings, PCE inflation data, and Fed Chair Warsh's Jackson Hole debut all landing within days.`, th:`<b>Nikkei ลดลง 0.74% สู่ 65,528.09 วันจันทร์</b> ตามแรงกดดันหุ้นกลุ่มชิปในวอลล์สตรีทและข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ ที่พังทลาย ขณะนักลงทุนเตรียมรับมือสัปดาห์สำคัญ ทั้งผลประกอบการ Nvidia ข้อมูลเงินเฟ้อ PCE และสุนทรพจน์ Jackson Hole ครั้งแรกของประธานเฟด Warsh ที่จะทยอยมาภายในไม่กี่วัน`},
      why:{en:`A broad-based Asia pullback tracking renewed US trade and geopolitical risk, ahead of a data- and earnings-heavy week, argues for staying diversified across regions and asset classes rather than chasing any single market's recent strength — volatility looks likely to pick up again before it settles.`, th:`การปรับลงทั่วภูมิภาคเอเชีย ตามความเสี่ยงการค้าและภูมิรัฐศาสตร์สหรัฐฯ ที่กลับมา ก่อนสัปดาห์ที่มีทั้งข้อมูลเศรษฐกิจและผลประกอบการสำคัญ สนับสนุนให้กระจายการลงทุนทั้งภูมิภาคและประเภทสินทรัพย์ มากกว่าไล่ตามความแข็งแกร่งล่าสุดของตลาดใดตลาดหนึ่ง — ความผันผวนมีแนวโน้มจะกลับมาอีกครั้งก่อนจะสงบลง`},
      full:{en:`Asian equities fell broadly Monday, tracking Friday's after-hours news that the Canada-US trade truce had collapsed and Wall Street's chip-led weakness. Japan's Nikkei 225 fell 0.74% to close at 65,528.09, while South Korea's chip-heavy benchmarks and Hong Kong's Hang Seng saw sharper declines as the regional AI/semiconductor trade came under pressure ahead of Nvidia's Wednesday earnings. The moves came as Trump vowed a fresh 50% tariff on Canadian autos and steel, Washington floated a new China tariff, and the administration unveiled a sweeping Iran-sanctions campaign, adding to a stack of catalysts — Nvidia earnings, July PCE inflation, and Fed Chair Warsh's first Jackson Hole keynote as chair — all due before the week is out.`, th:`หุ้นเอเชียปรับลงทั่วภูมิภาควันจันทร์ ตามข่าวช่วงเย็นวันศุกร์ว่าข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลายลง และแรงกดดันหุ้นกลุ่มชิปในวอลล์สตรีท ดัชนี Nikkei 225 ญี่ปุ่นลดลง 0.74% ปิดที่ 65,528.09 ขณะดัชนีเกาหลีใต้ที่มีสัดส่วนหุ้นชิปสูงและ Hang Seng ฮ่องกงปรับลงแรงกว่า เนื่องจากธีมหุ้น AI/เซมิคอนดักเตอร์ในภูมิภาคถูกกดดัน ก่อนผลประกอบการ Nvidia วันพุธ การเคลื่อนไหวนี้เกิดขึ้นหลังทรัมป์ขู่เก็บภาษี 50% รอบใหม่กับรถยนต์และเหล็กแคนาดา สหรัฐฯ ส่งสัญญาณภาษีจีนใหม่ และรัฐบาลเปิดเผยมาตรการคว่ำบาตรอิหร่านระลอกใหญ่ เพิ่มเติมจากปัจจัยสำคัญที่รออยู่ — ผลประกอบการ Nvidia, เงินเฟ้อ PCE เดือน ก.ค. และสุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Warsh — ที่จะเกิดขึ้นก่อนสิ้นสัปดาห์`},
      sources:[{l:"CNBC Asia Markets",u:"https://www.cnbc.com/markets/asia-markets/"},{l:"Yahoo Finance",u:"https://finance.yahoo.com/markets/live/stock-market-today-monday-august-24-dow-sp-500-nasdaq-080306047.html"},{l:"Bloomberg Markets",u:"https://www.bloomberg.com/markets"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,517.33", chg:-1.89, series:[26009.46,25517.33],
      txt:{en:`<b>Hang Seng dropped 1.89% Monday to 25,517.33,</b> the region's sharpest decline, while mainland China's <b>Shanghai Composite fell 0.59% to 3,882.01.</b> Greater China led Asia's selloff as Washington moved toward a new 7.5% "overcapacity" tariff on China, on top of the collapsed Canada-US trade truce and a broad chip-stock rout.`, th:`<b>Hang Seng ร่วง 1.89% วันจันทร์ สู่ 25,517.33</b> ปรับลงแรงสุดในภูมิภาค ขณะ <b>Shanghai Composite จีนแผ่นดินใหญ่ลดลง 0.59% สู่ 3,882.01</b> จีนแผ่นดินใหญ่/ฮ่องกงนำการเทขายของเอเชีย หลังสหรัฐฯ ส่งสัญญาณภาษีจีนใหม่ 7.5% จากปัญหา "กำลังผลิตล้นตลาด" เพิ่มเติมจากข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ ที่พังทลาย และการเทขายหุ้นกลุ่มชิปในวงกว้าง`},
      why:{en:`Hong Kong and Shanghai both falling together, on a fresh China-specific tariff threat rather than just externally-driven risk-off, is a reminder that the US-China trade track remains the single largest idiosyncratic risk for China/HK-exposed clients — keep favouring diversified Asia-ex-China and fixed income over a concentrated bet.`, th:`ฮ่องกงและเซี่ยงไฮ้ที่ปรับลงพร้อมกัน จากภัยคุกคามภาษีจีนโดยตรงมากกว่าแค่บรรยากาศ risk-off ทั่วไป เป็นเครื่องเตือนใจว่าเส้นทางการค้าสหรัฐ-จีนยังคงเป็นความเสี่ยงเฉพาะตัวที่ใหญ่ที่สุดสำหรับลูกค้าที่ถือสินทรัพย์จีน/ฮ่องกง — ควรยังคงแนะนำให้กระจายลงทุนเอเชียไม่รวมจีนและตราสารหนี้ มากกว่าเดิมพันแบบเข้มข้น`},
      full:{en:`Greater China led Asia's Monday selloff. The Hang Seng fell 1.89% to close at 25,517.33, its steepest drop among major regional benchmarks, while the Shanghai Composite lost 0.59% to 3,882.01. The declines came as the Trump administration moved toward levying a new tariff — reportedly around 7.5% — on China over goods "overcapacity" ahead of planned Xi-Trump talks, a move that would push Washington's effective China tariff rate back toward 20%, a level Beijing has said is consistent with the current trade truce. The selloff compounded the region's broader chip-stock weakness and the collapse of the separate Canada-US trade truce over the weekend, reinforcing the case for diversified Asia-ex-China strategies and fixed income over concentrated single-country exposure.`, th:`จีนแผ่นดินใหญ่และฮ่องกงนำการเทขายของเอเชียวันจันทร์ ดัชนี Hang Seng ลดลง 1.89% ปิดที่ 25,517.33 ปรับลงแรงสุดในบรรดาดัชนีหลักของภูมิภาค ขณะดัชนี Shanghai Composite ลดลง 0.59% สู่ 3,882.01 การปรับลงนี้เกิดขึ้นหลังรัฐบาลทรัมป์เคลื่อนไหวสู่การเก็บภาษีใหม่ — มีรายงานว่าราว 7.5% — กับจีนจากปัญหา "กำลังผลิตล้นตลาด" ก่อนการเจรจาสี-ทรัมป์ที่วางแผนไว้ ซึ่งจะดันอัตราภาษีจีนที่แท้จริงของสหรัฐฯ กลับสู่ราว 20% ระดับที่ปักกิ่งเคยระบุว่าสอดคล้องกับข้อตกลงสงบศึกการค้าปัจจุบัน การเทขายนี้ซ้ำเติมความอ่อนแอของหุ้นกลุ่มชิปในภูมิภาค และการพังทลายของข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ แยกต่างหากช่วงสุดสัปดาห์ ตอกย้ำเหตุผลให้เลือกกลยุทธ์เอเชียไม่รวมจีนแบบกระจายความเสี่ยงและตราสารหนี้มากกว่าการเดิมพันประเทศเดียว`},
      sources:[{l:"CNBC Asia Markets",u:"https://www.cnbc.com/markets/asia-markets/"},{l:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-24/us-eyes-china-overcapacity-tariffs-of-7-5-before-xi-trump-talks"},{l:"US News",u:"https://www.usnews.com/news/business/articles/2026-08-24/trump-moves-toward-levying-new-tariff-on-china-for-flooding-market-with-cheap-goods-ap-sources-say"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,601.05", chg:-0.79, series:[1613.78,1601.05],
      txt:{en:`<b>SET Index fell 0.79% to 1,601.05 Monday (−12.73pts),</b> on turnover of about THB 60.9 billion, tracking the regional selloff as DELTA and HANA faced selling pressure from semiconductor weakness following soaring US bond yields and Middle East volatility.`, th:`<b>ดัชนี SET ลดลง 0.79% สู่ 1,601.05 วันจันทร์ (−12.73 จุด)</b> มูลค่าการซื้อขายราว 6.09 หมื่นล้านบาท ตามการเทขายในภูมิภาค โดย DELTA และ HANA เผชิญแรงขายจากความอ่อนแอของกลุ่มเซมิคอนดักเตอร์ หลังผลตอบแทนพันธบัตรสหรัฐฯ พุ่งขึ้นและความผันผวนในตะวันออกกลาง`},
      why:{en:`The SET's decline tracking a regional chip-stock selloff and renewed trade-war risk, rather than any Thailand-specific news, keeps the case for looking offshore for diversified income and growth intact — UBS's 1,680 SET target for 2026 suggests the local dip is a valuation opportunity rather than a trend change.`, th:`การปรับลงของ SET ที่ตามหลังการเทขายหุ้นกลุ่มชิปในภูมิภาคและความเสี่ยงสงครามการค้าที่กลับมา มากกว่าข่าวเฉพาะของไทย ยังคงเหตุผลให้มองหาการลงทุนต่างประเทศเพื่อกระจายรายได้และการเติบโต — เป้าหมาย SET ปี 2026 ที่ 1,680 ของ UBS บ่งชี้ว่าการย่อตัวในประเทศเป็นโอกาสด้านมูลค่า มากกว่าการเปลี่ยนแนวโน้ม`},
      full:{en:`Thailand's SET Index closed Monday at 1,601.05, down 12.73 points (−0.79%), on turnover of about THB 60.9 billion. The Thai market slumped along with the regional trend, as DELTA and HANA faced selling pressure from semiconductor weakness following soaring US bond yields earlier in August and renewed Middle East volatility, alongside the collapse of the Canada-US trade truce and a fresh US tariff threat toward China. The move follows a roughly flat Friday session (+0.01% to 1,609.99) and leaves the index within its recent 1,600–1,610 range. UBS has raised its 2026 SET Index target by 16% to 1,680, while JPMorgan sees a bull case as high as 2,000, suggesting longer-term upside even as near-term sentiment tracks global risk appetite.`, th:`ดัชนี SET ของไทยปิดตลาดวันจันทร์ที่ 1,601.05 ลดลง 12.73 จุด (−0.79%) มูลค่าการซื้อขายราว 6.09 หมื่นล้านบาท ตลาดหุ้นไทยปรับลงตามแนวโน้มภูมิภาค โดย DELTA และ HANA เผชิญแรงขายจากความอ่อนแอของกลุ่มเซมิคอนดักเตอร์ หลังผลตอบแทนพันธบัตรสหรัฐฯ พุ่งขึ้นช่วงต้นเดือน ส.ค. และความผันผวนในตะวันออกกลางที่กลับมา ควบคู่กับข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ ที่พังทลาย และภัยคุกคามภาษีสหรัฐฯ รอบใหม่ต่อจีน การเคลื่อนไหวนี้ต่อจากวันศุกร์ที่แทบไม่เปลี่ยนแปลง (+0.01% สู่ 1,609.99) ทำให้ดัชนียังอยู่ในกรอบล่าสุด 1,600-1,610 UBS ปรับเป้าหมายดัชนี SET ปี 2026 ขึ้น 16% สู่ 1,680 ขณะ JPMorgan มองกรณีขาขึ้นสูงถึง 2,000 บ่งชี้ถึงโอกาสในระยะยาว แม้ความเชื่อมั่นระยะสั้นจะยังตามความเสี่ยงทั่วโลก`},
      sources:[{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/589357"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/589123"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Gold pushed to a fresh multi-month high near $4,646/oz Monday,</b> up roughly 1.4% on the day, as the collapsed Canada-US trade truce and sweeping new Iran sanctions stoked both trade-war and fiscal-credibility concerns. <b>Brent still eased 2.5% to $92.06/bbl (WTI −2.5% to $84.89),</b> as investors booked profits on last week's sanctions-driven jump even as Washington unveiled its "Operation Economic Outcast" campaign against Iran, which Treasury Secretary Bessent called an "economic D-Day."`, th:`<b>ทองคำพุ่งขึ้นทำสถิติสูงสุดในรอบหลายเดือนใกล้ $4,646 ต่อออนซ์วันจันทร์</b> เพิ่มขึ้นราว 1.4% ระหว่างวัน หลังข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลาย และมาตรการคว่ำบาตรอิหร่านระลอกใหญ่ จุดความกังวลทั้งสงครามการค้าและความน่าเชื่อถือทางการคลัง <b>เบรนท์ยังคงย่อลง 2.5% สู่ $92.06 ต่อบาร์เรล (WTI ลดลง 2.5% สู่ $84.89)</b> ขณะนักลงทุนขายทำกำไรจากที่พุ่งขึ้นสัปดาห์ก่อนจากข่าวคว่ำบาตร แม้สหรัฐฯ จะเปิดตัวมาตรการ "Operation Economic Outcast" ต่ออิหร่าน ซึ่ง รมว.คลัง Bessent เรียกว่าเป็น "D-Day ทางเศรษฐกิจ"`},
     why:{en:`Gold making a fresh high while oil eases on profit-taking despite escalating sanctions shows the two hedges are decoupling — gold is now pricing trade-war and fiscal risk more than geopolitics alone, making it the sharper talking point this week, with oil's dip a reminder not to over-read any single day's move.`, th:`การที่ทองคำทำสถิติใหม่ ขณะน้ำมันย่อลงจากการขายทำกำไรแม้มาตรการคว่ำบาตรจะทวีขึ้น แสดงว่าตัวป้องกันความเสี่ยงทั้งสองกำลังแยกทางกัน — ทองคำตอนนี้สะท้อนความเสี่ยงสงครามการค้าและการคลังมากกว่าภูมิรัฐศาสตร์เพียงอย่างเดียว ทำให้เป็นประเด็นที่คมกว่าสัปดาห์นี้ ขณะการย่อตัวของน้ำมันเป็นเครื่องเตือนใจไม่ให้ตีความการเคลื่อนไหววันเดียวเกินจริง`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`Treasury yields <b>eased Monday on a flight to safety — the 10-year held near 4.71% and the 30-year eased to 5.24%,</b> both off their recent highs, even as trade and sanctions risk escalated. All eyes now turn to a stacked week: <b>Nvidia's earnings and the July PCE inflation report land Wednesday,</b> then <b>Fed Chair Kevin Warsh's first Jackson Hole keynote as chair (27–29 Aug, speech Friday 28th)</b> — the last major scheduled opportunity to shape expectations before the 16 September FOMC. Warsh has said the speech will focus on "big picture" structural questions rather than near-term guidance, and has stressed Fed independence from market pricing.`, th:`ผลตอบแทนพันธบัตร <b>ย่อลงวันจันทร์จากแรงซื้อสินทรัพย์ปลอดภัย — 10 ปียืนใกล้ 4.71% และ 30 ปีย่อลงสู่ 5.24%</b> ทั้งคู่ลดลงจากระดับสูงล่าสุด แม้ความเสี่ยงการค้าและคว่ำบาตรจะทวีขึ้น ทุกสายตาตอนนี้จับจ้องไปที่สัปดาห์ที่มีปัจจัยสำคัญเรียงราย: <b>ผลประกอบการ Nvidia และดัชนีเงินเฟ้อ PCE เดือน ก.ค. จะออกวันพุธ</b> ตามด้วย <b>สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh (27-29 ส.ค. สุนทรพจน์วันศุกร์ที่ 28)</b> — โอกาสสำคัญครั้งสุดท้ายที่กำหนดไว้ในการกำหนดทิศทางความคาดหวังก่อนการประชุมเฟด 16 ก.ย. Warsh ระบุว่าสุนทรพจน์นี้จะเน้นคำถามเชิงโครงสร้าง "ภาพใหญ่" มากกว่าแนวทางระยะสั้น และย้ำความเป็นอิสระของเฟดจากการตั้งราคาของตลาด`},
     why:{en:`Yields easing even as trade-war and sanctions risk escalates is a classic flight-to-quality signal, not a dovish Fed pivot — the coupon-lock window remains open but Warsh's Jackson Hole debut this Friday, plus Wednesday's PCE print, are the next events that could move it either way, making this a good week to act rather than wait.`, th:`ผลตอบแทนที่ย่อลงแม้ความเสี่ยงสงครามการค้าและคว่ำบาตรจะทวีขึ้น เป็นสัญญาณ flight-to-quality แบบคลาสสิก ไม่ใช่ท่าทีผ่อนคลายของเฟด — หน้าต่างโอกาสล็อกคูปองยังคงเปิดอยู่ แต่สุนทรพจน์ Jackson Hole ของ Warsh ศุกร์นี้ บวกกับดัชนี PCE วันพุธ คือเหตุการณ์ถัดไปที่อาจขยับสถานการณ์ไปทางใดทางหนึ่ง ทำให้สัปดาห์นี้เป็นจังหวะที่ดีจะลงมือ มากกว่ารอ`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`<b>The Canada-US trade truce collapsed over the weekend, reversing Friday's tariff-relief deal:</b> Trump vowed a 50% tariff on Canadian autos, car parts and steel starting next year after talks broke down, and PM Mark Carney suspended negotiations and vowed dollar-for-dollar retaliation, while Ontario's premier threatened to cut off electricity and critical minerals to the US. Separately, <b>Washington moved toward a new ~7.5% tariff on China over goods "overcapacity"</b> ahead of planned Xi-Trump talks — a move that would push the effective China rate back toward 20%.`, th:`<b>ข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลายลงช่วงสุดสัปดาห์ กลับตัวจากข้อตกลงคลายภาษีวันศุกร์:</b> ทรัมป์ขู่เก็บภาษี 50% กับรถยนต์ ชิ้นส่วนรถยนต์ และเหล็กจากแคนาดา เริ่มปีหน้า หลังการเจรจาล่มลง นายกฯ Mark Carney ระงับการเจรจาและขู่ตอบโต้แบบดอลลาร์ต่อดอลลาร์ ขณะนายกรัฐมนตรีรัฐออนแทรีโอขู่ตัดไฟฟ้าและแร่ธาตุสำคัญต่อสหรัฐฯ แยกต่างหาก <b>สหรัฐฯ ยังเคลื่อนไหวสู่การเก็บภาษีจีนใหม่ราว 7.5% จากปัญหา "กำลังผลิตล้นตลาด"</b> ก่อนการเจรจาสี-ทรัมป์ที่วางแผนไว้ — ซึ่งจะดันอัตราภาษีจีนที่แท้จริงกลับสู่ราว 20%`}, w:{en:`A trade deal reversing within days of being struck is the clearest sign yet that tariff risk is structurally elevated, not a one-off — both Canada and China fronts are now live simultaneously, reinforcing the case for bonds and diversified global exposure over single-country or single-sector bets.`, th:`ข้อตกลงการค้าที่กลับตัวภายในไม่กี่วันหลังบรรลุ เป็นสัญญาณที่ชัดเจนที่สุดว่าความเสี่ยงภาษีสูงขึ้นในเชิงโครงสร้าง ไม่ใช่เหตุการณ์ครั้งเดียว — ทั้งแนวรบแคนาดาและจีนกำลังคุกรุ่นพร้อมกันตอนนี้ ตอกย้ำเหตุผลเรื่องตราสารหนี้และกระจายลงทุนทั่วโลก มากกว่าเดิมพันประเทศเดียวหรือกลุ่มเดียว`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>The Trump administration unveiled a sweeping new Iran-sanctions campaign Monday, dubbed "Operation Economic Outcast":</b> Treasury Secretary Bessent called it an "economic D-Day" and "the single greatest financial offensive ever marshaled against an adversary," with the plan explicitly targeting countries — including China — that keep doing business with Iran. Despite the escalation, <b>oil eased on profit-taking: Brent fell 2.5% to $92.06/bbl,</b> as shipping through the Strait of Hormuz stayed relatively steady.`, th:`<b>รัฐบาลทรัมป์เปิดเผยมาตรการคว่ำบาตรอิหร่านระลอกใหญ่วันจันทร์ ในชื่อ "Operation Economic Outcast":</b> รมว.คลัง Bessent เรียกว่าเป็น "D-Day ทางเศรษฐกิจ" และ "การรุกทางการเงินครั้งใหญ่ที่สุดเท่าที่เคยมีต่อคู่ปรับ" โดยแผนนี้เจาะจงเล่นงานประเทศที่ยังค้าขายกับอิหร่าน — รวมถึงจีน — แม้จะมีการทวีความรุนแรงขึ้น แต่ <b>ราคาน้ำมันย่อลงจากการขายทำกำไร: เบรนท์ลดลง 2.5% สู่ $92.06 ต่อบาร์เรล</b> ขณะการเดินเรือผ่านช่องแคบฮอร์มุซยังค่อนข้างทรงตัว`}, w:{en:`Oil easing even as sanctions escalate to their most aggressive point yet suggests the market sees this as more of a financial/diplomatic offensive than an imminent supply shock — but a strategy explicitly targeting China's Iran trade adds a fresh wildcard to the US-China relationship, worth flagging alongside the tariff story.`, th:`การที่ราคาน้ำมันย่อลงแม้มาตรการคว่ำบาตรจะทวีความรุนแรงถึงจุดสูงสุด บ่งชี้ว่าตลาดมองเรื่องนี้เป็นการรุกทางการเงิน/การทูตมากกว่าความเสี่ยงอุปทานที่ใกล้เกิดขึ้น แต่กลยุทธ์ที่เจาะจงเล่นงานการค้าอิหร่านของจีน เพิ่มปัจจัยไม่แน่นอนใหม่ให้ความสัมพันธ์สหรัฐ-จีน ควรระบุไว้คู่กับประเด็นภาษีการค้า`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`Treasury yields <b>eased Monday on a flight to safety: the 10-year held near 4.71% and the 30-year eased to 5.24%,</b> both off their recent highs, even as trade and sanctions risk escalated sharply. <b>Fed Chair Kevin Warsh's first Jackson Hole keynote as chair lands Friday 28 August,</b> immediately after Wednesday's Nvidia earnings and July PCE inflation report — the last major scheduled signal ahead of the 16 September FOMC.`, th:`ผลตอบแทนพันธบัตร <b>ย่อลงวันจันทร์จากแรงซื้อสินทรัพย์ปลอดภัย: 10 ปียืนใกล้ 4.71% และ 30 ปีย่อลงสู่ 5.24%</b> ทั้งคู่ลดลงจากระดับสูงล่าสุด แม้ความเสี่ยงการค้าและคว่ำบาตรจะทวีขึ้นแรง <b>สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Kevin Warsh จะมีขึ้นวันศุกร์ที่ 28 ส.ค.</b> ทันทีหลังผลประกอบการ Nvidia และดัชนีเงินเฟ้อ PCE เดือน ก.ค. วันพุธ — สัญญาณสำคัญครั้งสุดท้ายที่กำหนดไว้ก่อนการประชุมเฟด 16 ก.ย.`}, w:{en:`Yields easing on safe-haven demand rather than rate-cut hopes means the coupon-lock window is still open on its own merits — but Wednesday's PCE print and Friday's Warsh speech are back-to-back events that could move it quickly, making this week a better window to act than to wait.`, th:`ผลตอบแทนที่ย่อลงจากแรงซื้อสินทรัพย์ปลอดภัย ไม่ใช่ความหวังลดดอกเบี้ย หมายความว่าหน้าต่างโอกาสล็อกคูปองยังคงเปิดอยู่ด้วยเหตุผลของตัวเอง — แต่ดัชนี PCE วันพุธและสุนทรพจน์ของ Warsh วันศุกร์ เป็นเหตุการณ์ต่อเนื่องที่อาจขยับสถานการณ์อย่างรวดเร็ว ทำให้สัปดาห์นี้เป็นจังหวะที่ดีกว่าจะลงมือ มากกว่ารอ`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`All eyes turn to <b>Wednesday's July PCE inflation report — the Fed's preferred gauge —</b> landing the same day as Nvidia's earnings, in a five-day stretch that also includes the Jackson Hole symposium. Gold's push to a fresh multi-month high near $4,646/oz is itself a market signal of rising inflation and trade-war-cost concern, not just a safe-haven trade, as tariff escalation on two fronts (Canada, China) raises the risk of imported-price pressure feeding back into US inflation.`, th:`ทุกสายตาจับจ้องไปที่ <b>ดัชนีเงินเฟ้อ PCE เดือน ก.ค. วันพุธ — มาตรวัดที่เฟดให้น้ำหนักมากที่สุด —</b> ที่จะออกวันเดียวกับผลประกอบการ Nvidia ในช่วง 5 วันที่มีทั้งงานสัมมนา Jackson Hole ด้วย การที่ทองคำพุ่งขึ้นทำสถิติสูงสุดในรอบหลายเดือนใกล้ $4,646 ต่อออนซ์ เป็นสัญญาณตลาดที่บ่งชี้ความกังวลเงินเฟ้อและต้นทุนสงครามการค้าที่เพิ่มขึ้น ไม่ใช่แค่การเทรดสินทรัพย์ปลอดภัย เนื่องจากการทวีภาษีทั้งสองแนวรบ (แคนาดา จีน) เพิ่มความเสี่ยงที่แรงกดดันราคานำเข้าจะป้อนกลับเข้าสู่เงินเฟ้อสหรัฐฯ`}, w:{en:`With tariff escalation on two fronts landing right before the Fed's preferred inflation gauge, any upside surprise in Wednesday's PCE print would land on especially fertile ground — support a "stay nimble, don't assume rates stay low" narrative and use gold's fresh high as visible proof clients can point to.`, th:`เมื่อการทวีภาษีทั้งสองแนวรบเกิดขึ้นก่อนมาตรวัดเงินเฟ้อที่เฟดให้น้ำหนักมากที่สุดเพียงไม่กี่วัน หากดัชนี PCE วันพุธออกมาสูงกว่าคาด จะยิ่งส่งผลกระทบรุนแรงขึ้น ควรสนับสนุนแนวคิด "ต้องพร้อมปรับตัว อย่าคิดว่าดอกเบี้ยจะอยู่ในระดับต่ำตลอด" และใช้สถิติใหม่ของทองคำเป็นหลักฐานที่จับต้องได้ให้ลูกค้าเห็น`}},
  ];

  const WATCH=[
    {day:{en:"Thu",th:"พฤ."}, date:{en:"last wk",th:"สัปดาห์ที่แล้ว"}, imp:"m", t:{en:"Trump announces 'most crushing' new Iran sanctions; Tehran vows resistance",th:"ทรัมป์ประกาศมาตรการคว่ำบาตรอิหร่านรอบใหม่ 'รุนแรงที่สุด' อิหร่านประกาศต้านทาน"}, d:{en:"Trump unveiled fresh sanctions he called the most crushing yet; Iran said the \"economic warfare\" would fail. Oil stayed bid into the weekend, with Brent on track for a second straight weekly gain of over 5%.",th:"ทรัมป์เปิดเผยมาตรการคว่ำบาตรรอบใหม่ที่เขาเรียกว่ารุนแรงที่สุดเท่าที่เคยมี อิหร่านระบุว่า \"สงครามเศรษฐกิจ\" จะล้มเหลว ราคาน้ำมันยังยืนแข็งแกร่งเข้าสู่สุดสัปดาห์ โดยเบรนท์มีแนวโน้มปิดบวกรายสัปดาห์เป็นสัปดาห์ที่ 2 ติดต่อกันกว่า 5%"}},
    {day:{en:"Fri",th:"ศ."}, date:{en:"last wk",th:"สัปดาห์ที่แล้ว"}, imp:"h", t:{en:"Canada and US strike tariff deal ahead of deadline — autos cut to 15%",th:"แคนาดาและสหรัฐฯ บรรลุข้อตกลงภาษีก่อนเส้นตาย — ภาษีรถยนต์ลดเหลือ 15%"}, d:{en:"The disputed auto tariff falls to 15% from 25%, with a US-content exemption preserved, and steel/aluminum tariffs are halved to 25%. Ottawa didn't get a full carve-out for Canadian/Mexican content; VP Vance called Carney's framing a \"climb-down,\" and provincial leaders criticized the concessions. The deal wouldn't survive the weekend.",th:"ภาษีรถยนต์ที่เป็นข้อพิพาทลดเหลือ 15% จาก 25% พร้อมคงการยกเว้นสัดส่วนวัตถุดิบสหรัฐฯ และภาษีเหล็ก/อะลูมิเนียมลดลงครึ่งหนึ่งเหลือ 25% ออตตาวาไม่ได้รับการยกเว้นเต็มรูปแบบสำหรับสัดส่วนวัตถุดิบแคนาดา/เม็กซิโก รองประธานาธิบดี Vance เรียกท่าทีของ Carney ว่าเป็นการ \"ยอมถอย\" และผู้นำระดับมณฑลวิจารณ์การประนีประนอมนี้ ข้อตกลงนี้อยู่ไม่ถึงสุดสัปดาห์"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Canada-US trade truce collapses — Trump vows 50% tariff on Canadian autos and steel",th:"ข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ พังทลาย — ทรัมป์ขู่ภาษี 50% กับรถยนต์และเหล็กแคนาดา"}, d:{en:"Trump said the US will impose a 50% tariff on Canadian autos, car parts and steel starting next year after weekend talks broke down. PM Mark Carney suspended negotiations and vowed dollar-for-dollar retaliation; Ontario's premier threatened to cut off electricity and critical minerals to the US.",th:"ทรัมป์ระบุสหรัฐฯ จะเก็บภาษี 50% กับรถยนต์ ชิ้นส่วนรถยนต์ และเหล็กจากแคนาดา เริ่มปีหน้า หลังการเจรจาช่วงสุดสัปดาห์ล่มลง นายกฯ Mark Carney ระงับการเจรจาและขู่ตอบโต้แบบดอลลาร์ต่อดอลลาร์ ขณะนายกรัฐมนตรีรัฐออนแทรีโอขู่ตัดไฟฟ้าและแร่ธาตุสำคัญต่อสหรัฐฯ"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"US unveils Iran-sanctions blitz \"Operation Economic Outcast\"; floats new 7.5% China tariff",th:"สหรัฐฯ เปิดมาตรการคว่ำบาตรอิหร่านชุดใหญ่ \"Operation Economic Outcast\" ส่งสัญญาณภาษีจีนใหม่ 7.5%"}, d:{en:"Treasury Secretary Bessent called the sweeping Iran-sanctions push an \"economic D-Day,\" targeting countries — including China — that keep trading with Iran. Separately, Washington moved toward a new ~7.5% tariff on China over goods \"overcapacity\" ahead of planned Xi-Trump talks. Oil still eased on profit-taking despite the escalation.",th:"รมว.คลัง Bessent เรียกมาตรการคว่ำบาตรอิหร่านระลอกใหญ่นี้ว่าเป็น \"D-Day ทางเศรษฐกิจ\" เจาะจงเล่นงานประเทศที่ยังค้าขายกับอิหร่าน รวมถึงจีน แยกต่างหาก สหรัฐฯ เคลื่อนไหวสู่การเก็บภาษีจีนใหม่ราว 7.5% จากปัญหา \"กำลังผลิตล้นตลาด\" ก่อนการเจรจาสี-ทรัมป์ที่วางแผนไว้ ราคาน้ำมันยังคงย่อลงจากการขายทำกำไร แม้จะมีการทวีความรุนแรงขึ้น"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"h", t:{en:"Chip stocks sink — Nvidia −2.9%, Micron −5.8%, Broadcom −2.6% — dragging Nasdaq −0.76%",th:"หุ้นกลุ่มชิปร่วง — Nvidia −2.9%, Micron −5.8%, Broadcom −2.6% — ฉุด Nasdaq ลดลง 0.76%"}, d:{en:"The S&P 500 fell 0.28% to 7,652.86 and the Nasdaq dropped 0.76% to 25,980.19 on tech weakness, while the Dow added 0.26% to 53,417.16. The selloff came two days ahead of Nvidia's Q2 earnings report.",th:"ดัชนี S&P 500 ลดลง 0.28% สู่ 7,652.86 และ Nasdaq ร่วง 0.76% สู่ 25,980.19 จากแรงกดดันหุ้นเทค ขณะ Dow เพิ่มขึ้น 0.26% สู่ 53,417.16 การเทขายนี้เกิดขึ้นสองวันก่อนผลประกอบการไตรมาส 2 ของ Nvidia"}},
    {day:{en:"Mon",th:"จ."}, date:{en:"today",th:"วันนี้"}, imp:"m", t:{en:"Gold pushes to a fresh multi-month high near $4,646/oz on fiscal and trade-war jitters",th:"ทองคำพุ่งขึ้นทำสถิติสูงสุดในรอบหลายเดือนใกล้ $4,646 ต่อออนซ์ จากความกังวลการคลังและสงครามการค้า"}, d:{en:"Gold rose roughly 1.4% as the collapsed Canada-US trade truce and the Iran-sanctions escalation both fed safe-haven demand, even as Treasury yields eased and oil fell on profit-taking.",th:"ทองคำเพิ่มขึ้นราว 1.4% หลังข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ ที่พังทลาย และการทวีมาตรการคว่ำบาตรอิหร่าน ต่างหนุนแรงซื้อสินทรัพย์ปลอดภัย แม้ผลตอบแทนพันธบัตรจะย่อลงและราคาน้ำมันจะลดลงจากการขายทำกำไร"}},
    {day:{en:"Wed 26 Aug",th:"พ. 26 ส.ค."}, date:{en:"ahead",th:"ข้างหน้า"}, imp:"h", t:{en:"Nvidia Q2 earnings & July PCE inflation report",th:"ผลประกอบการไตรมาส 2 ของ Nvidia และดัชนีเงินเฟ้อ PCE เดือน ก.ค."}, d:{en:"Nvidia reports after the close, with Wall Street expecting revenue near $93–95bn (~95% y/y growth); the same day brings the Fed's preferred inflation gauge. Two of the week's biggest catalysts land back-to-back, just ahead of Jackson Hole.",th:"Nvidia รายงานผลประกอบการหลังตลาดปิด โดยวอลล์สตรีทคาดรายได้ราว $93-95 พันล้านดอลลาร์ (เติบโตราว 95% เทียบปีก่อน) วันเดียวกันยังมีดัชนีเงินเฟ้อที่เฟดให้น้ำหนักมากที่สุดออกด้วย สองปัจจัยขับเคลื่อนใหญ่ของสัปดาห์มาติดกัน ก่อนถึง Jackson Hole"}},
    {day:{en:"Fri 28 Aug",th:"ศ. 28 ส.ค."}, date:{en:"ahead",th:"ข้างหน้า"}, imp:"h", t:{en:"Fed Chair Warsh's first Jackson Hole keynote as chair",th:"สุนทรพจน์ Jackson Hole ครั้งแรกในฐานะประธานเฟดของ Warsh"}, d:{en:"The Jackson Hole symposium runs 27–29 August; Warsh's debut speech as Fed chair lands Friday morning. He says it will focus on 'big picture' structural questions rather than near-term guidance — but it's the last major scheduled signal before the 16 September FOMC.",th:"งานสัมมนา Jackson Hole จัดขึ้น 27-29 ส.ค. โดยสุนทรพจน์เปิดตัวของ Warsh ในฐานะประธานเฟดจะมีขึ้นเช้าวันศุกร์ เขาระบุว่าจะเน้นคำถามเชิงโครงสร้าง 'ภาพใหญ่' มากกว่าแนวทางระยะสั้น แต่นี่คือสัญญาณสำคัญครั้งสุดท้ายที่กำหนดไว้ก่อนการประชุมเฟด 16 ก.ย."}},
    {day:{en:"Sep",th:"ก.ย."}, date:{en:"ahead",th:"ข้างหน้า"}, imp:"h", t:{en:"Fed policy meeting (16 Sep)",th:"การประชุมนโยบายเฟด (16 ก.ย.)"}, d:{en:"The decision all this data feeds into. Warsh's Jackson Hole speech on 28 August is the last major scheduled catalyst before the meeting — the biggest driver for bond yields into September.",th:"การตัดสินใจที่ข้อมูลทั้งหมดส่งผลถึง สุนทรพจน์ Jackson Hole ของ Warsh วันที่ 28 ส.ค. คือปัจจัยขับเคลื่อนสำคัญครั้งสุดท้ายที่กำหนดไว้ก่อนการประชุม — ปัจจัยใหญ่สุดต่อผลตอบแทนพันธบัตรก่อนถึงเดือน ก.ย."}},

    {code:"UUSTECH", name:{en:"United US Technology Fund",th:"United US Technology Fund"}, rk:{en:"US tech · high risk",th:"หุ้นเทคสหรัฐ · เสี่ยงสูง"}, desc:{en:"US technology & semiconductor leaders — the AI / chip growth theme, bought in baht.",th:"ผู้นำเทคโนโลยีและเซมิคอนดักเตอร์สหรัฐ — ธีมการเติบโต AI / ชิป ซื้อได้ด้วยเงินบาท"}, now:{en:"The Nasdaq fell 0.76% Monday as Nvidia (−2.9%), Micron (−5.8%) and Broadcom (−2.6%) sold off two days ahead of Nvidia's Wednesday earnings, with the collapsed Canada-US trade truce adding to the risk-off tone. Frame the pullback as pre-earnings positioning and a rates-driven reset, not a fundamentals shock — Wednesday's print (Street expects ~95% y/y revenue growth) is the real near-term catalyst, with Warsh's Friday Jackson Hole speech the next event that could reopen volatility either way.",th:"ดัชนี Nasdaq ลดลง 0.76% วันจันทร์ หลัง Nvidia (−2.9%), Micron (−5.8%) และ Broadcom (−2.6%) ถูกเทขายสองวันก่อนผลประกอบการ Nvidia วันพุธ ขณะข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ ที่พังทลายยิ่งเพิ่มบรรยากาศ risk-off ควรนำเสนอการปรับลงนี้เป็นการจัดพอร์ตก่อนผลประกอบการและการปรับฐานจากปัจจัยดอกเบี้ย ไม่ใช่ปัจจัยพื้นฐานสั่นคลอน — ผลประกอบการวันพุธ (ตลาดคาดรายได้เติบโตราว 95% เทียบปีก่อน) คือปัจจัยขับเคลื่อนระยะสั้นที่แท้จริง โดยสุนทรพจน์ Jackson Hole ของ Warsh วันศุกร์คือเหตุการณ์ถัดไปที่อาจจุดความผันผวนกลับมาได้ทั้งสองทาง"}, hold:["US tech","Semis","AI"]},
    {code:"UGQG", name:{en:"United Global Quality Growth",th:"United Global Quality Growth"}, rk:{en:"Global equity",th:"หุ้นทั่วโลก"}, desc:{en:"High-quality global growth companies. A steadier core-equity sleeve than a pure-tech play.",th:"บริษัทเติบโตคุณภาพสูงทั่วโลก แกนหุ้นที่นิ่งกว่ากองเทคล้วน"}, now:{en:"Monday's selloff was unusually broad-based — US, Europe, and every major Asian market fell together, from a 0.28% S&P dip to Hang Seng's 1.89% drop — as the collapsed Canada-US truce, fresh China tariff threat and chip weakness hit simultaneously. A rare day where nothing was a safe harbour except bonds and gold reinforces the case for a steadier, diversified quality-growth core over chasing any single stock, sector or country this week.",th:"การเทขายวันจันทร์กระจายตัวผิดปกติ — สหรัฐฯ ยุโรป และตลาดหลักเกือบทุกแห่งในเอเชียปรับลงพร้อมกัน ตั้งแต่ S&P ที่ลดลง 0.28% ไปจนถึง Hang Seng ที่ร่วง 1.89% — หลังข้อตกลงสงบศึกแคนาดา-สหรัฐฯ พังทลาย ภัยคุกคามภาษีจีนใหม่ และความอ่อนแอของหุ้นกลุ่มชิปเกิดขึ้นพร้อมกัน วันที่หายากซึ่งแทบไม่มีที่หลบภัยนอกจากตราสารหนี้และทองคำ ตอกย้ำเหตุผลให้เลือกแกนหุ้นเติบโตคุณภาพที่นิ่งกว่าและกระจายการลงทุน มากกว่าไล่ตามหุ้น กลุ่ม หรือประเทศใดประเทศหนึ่งสัปดาห์นี้"}, hold:["Global quality","Growth"]},
    {code:"UOBSG", name:{en:"UOB Smart Gold",th:"UOB Smart Gold"}, rk:{en:"Gold · alternative",th:"ทองคำ · ทางเลือก"}, desc:{en:"Tracks the gold price — a diversifier and safe-haven talking point.",th:"อิงราคาทองคำ — เป็นตัวกระจายความเสี่ยงและจุดคุยเรื่องสินทรัพย์ปลอดภัย"}, now:{en:"Gold pushed to a fresh multi-month high near $4,646/oz Monday, up roughly 1.4%, as the collapsed Canada-US trade truce and the sweeping new \"Operation Economic Outcast\" Iran-sanctions campaign both fed safe-haven demand at once. That's a sharper, more concrete talking point than a generic safe-haven pitch: gold is now pricing trade-war escalation and fiscal-credibility risk simultaneously, even as oil itself eased on profit-taking.",th:"ทองคำพุ่งขึ้นทำสถิติสูงสุดในรอบหลายเดือนใกล้ $4,646 ต่อออนซ์วันจันทร์ เพิ่มขึ้นราว 1.4% หลังข้อตกลงสงบศึกการค้าแคนาดา-สหรัฐฯ ที่พังทลาย และมาตรการคว่ำบาตรอิหร่านระลอกใหญ่ \"Operation Economic Outcast\" ต่างหนุนแรงซื้อสินทรัพย์ปลอดภัยพร้อมกัน นี่คือประเด็นที่คมและจับต้องได้กว่าจุดขายสินทรัพย์ปลอดภัยทั่วไป: ทองคำตอนนี้กำลังสะท้อนทั้งความเสี่ยงสงครามการค้าที่ทวีขึ้นและความน่าเชื่อถือทางการคลังไปพร้อมกัน แม้ราคาน้ำมันเองจะย่อลงจากการขายทำกำไร"}, hold:["Gold","Safe-haven","Diversifier"]},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-themes').textContent=t(S.sThemes); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('s-prices').textContent=t(S.sPrices); $('h-prices').textContent=t(S.hPrices); $('pricenote').textContent=t(S.pricenote);
    $('b-sell').textContent=t(S.bSell); $('s-funds').textContent=t(S.sFunds); $('h-funds').textContent=t(S.hFunds);
    $('sh-off').innerHTML=`${t(S.shOff)} <small>${t(S.shOffSub)}</small>`; $('sh-on').innerHTML=`${t(S.shOn)} <small>${t(S.shOnSub)}</small>`;
    $('s-talk').textContent=t(S.sTalk); $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('countrygrid').innerHTML=COUNTRIES.map((c,i)=>`
      <div class="card ccard">
        <div class="chdr"><div class="ci"><h3 style="margin:0"><span class="flag">${c.flag}</span> ${t(c.name)}</h3><span class="ix">${c.ix}</span></div>
          <div style="text-align:right"><div class="val">${c.val}</div>${chgPill(c.chg)}</div></div>
        <div class="chartbox" data-series='${JSON.stringify(c.series)}' data-chg="${c.chg}"></div>
        <div class="chartcap">${t(S.recent)}</div>
        <p>${t(c.txt)}</p>
        <div class="why"><span>${t(S.foryou)}</span> ${t(c.why)}</div>
        <button class="expand">${t(S.readfull)} <span class="cv">▾</span></button>
        <div class="full" hidden><p style="margin:0">${t(c.full)}</p>
          <div class="srcline"><span class="srclabel">${t(S.sources)}</span>${c.sources.map(s=>`<a class="srcpill" href="${s.u}" target="_blank" rel="noopener">${s.l} ↗</a>`).join('')}</div></div>
      </div>`).join('');
    $('extragrid').innerHTML=EXTRA.map(e=>`<div class="card"><h3><span class="flag">${e.flag}</span> ${t(e.h)}</h3><p>${t(e.txt)}</p><div class="why"><span>${t(S.foryou)}</span> ${t(e.why)}</div></div>`).join('');
    $('themegrid').innerHTML=THEMES.map(x=>`<div class="card themecard"><h3>${t(x.h)}</h3><p>${t(x.p)}</p><div class="why"><span>${t(S.impact)}</span> ${t(x.w)}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`<div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div><div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div><div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน':'US Treasuries, gold & oil',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p>${f.now?`<div class="fnow"><span>${L==='th'?'ทำไมตอนนี้':'Why now'}</span>${t(f.now)}</div>`:''}<div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');
    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
