<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>

  <section id="prices">
    <div class="sechead"><h2 id="s-prices"></h2><span class="hint" id="h-prices"></span></div>
    <div class="prices" id="priceboard"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="pricenote"></p>
  </section>

  <section id="spotlight">
    <div class="spotlight">
      <div class="sechead" style="border-bottom-color:var(--accent)"><span class="badge" id="b-sell"></span><h2 style="margin-left:4px" id="s-funds"></h2><span class="hint" id="h-funds"></span></div>
      <h3 class="subhead" id="sh-off"></h3>
      <div class="grid g2" style="margin-bottom:18px" id="offgrid"></div>
      <div class="rule"></div>
      <h3 class="subhead" id="sh-on"></h3>
      <div class="grid g2" id="ongrid"></div>
    </div>
  </section>

  <section id="talk">
    <div class="sechead"><h2 id="s-talk"></h2></div>
    <div class="talk" id="talkgrid"></div>
  </section>

  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"10-Year Treasury Yield Tops 4.75%, Highest Since Jan 2025, as Trump Threatens Iran With More Strikes and Oil Extends Surge", th:"ผลตอบแทนพันธบัตร 10 ปีทะลุ 4.75% สูงสุดตั้งแต่ ม.ค. 2025 หลังทรัมป์ขู่โจมตีอิหร่านเพิ่ม น้ำมันพุ่งต่อเนื่อง"},
    heroDeck:{en:"Wall Street closed out a red Monday — S&P 500 −0.33% to 7,686.14, Dow −0.7% to 53,185.90, Nasdaq −0.12% to 26,370.89 — after President Trump threatened Iran with additional attacks following Sunday's US strike near the Strait of Hormuz, and oil benchmarks extended their jump to more than 3% intraday (WTI above $86, Brent near $91). The renewed energy-inflation risk pushed the 10-year Treasury yield above 4.75% for the first time since January 2025, and CME FedWatch now shows a 66% chance of a September Fed hike, up sharply from ~56% on Friday. Gold extended Friday's slide, dipping below $4,450/oz even with the Mideast risk still live.", th:"วอลล์สตรีทปิดตลาดวันจันทร์เป็นลบ — S&P 500 ลดลง 0.33% สู่ 7,686.14, Dow ลดลง 0.7% สู่ 53,185.90, Nasdaq ลดลง 0.12% สู่ 26,370.89 — หลังประธานาธิบดีทรัมป์ขู่โจมตีอิหร่านเพิ่มเติม ต่อจากที่สหรัฐฯ โจมตีใกล้ช่องแคบฮอร์มุซเมื่อวันอาทิตย์ และราคาน้ำมันขยับขึ้นต่อกว่า 3% ระหว่างวัน (WTI เหนือ $86, เบรนท์ใกล้ $91) ความเสี่ยงเงินเฟ้อจากพลังงานระลอกใหม่ดันผลตอบแทนพันธบัตร 10 ปีทะลุ 4.75% เป็นครั้งแรกนับตั้งแต่เดือน ม.ค. 2025 และ CME FedWatch ตอนนี้ชี้โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ 66% เพิ่มขึ้นมากจากราว 56% เมื่อวันศุกร์ ทองคำร่วงต่อจากวันศุกร์ ลงต่ำกว่า $4,450 ต่อออนซ์ แม้ความเสี่ยงตะวันออกกลางจะยังคุกรุ่นอยู่"},

    leadtxt:{en:`<b>Markets have now fully repriced the weekend's Iran escalation, and it isn't a one-day story: Wall Street fell Monday (S&P 500 −0.33% to 7,686.14) after Trump threatened Iran with further attacks, oil extended its jump to more than 3% intraday, and the 10-year Treasury yield broke above 4.75% — its highest since January 2025.</b> September rate-hike odds jumped again to 66% (from ~56% Friday) per CME FedWatch, while gold extended Friday's slide to below $4,450/oz. Asia and Europe closed mixed Monday (Shanghai +0.86%, SET +0.44%; DAX −0.6%, Nikkei −0.14%, Hang Seng −0.07%), showing the damage is concentrated in the US rate-sensitive names rather than broad risk-off. For your clients: with a Fed hike now odds-on and oil-driven inflation risk compounding it, <b>locking in today's still-elevated bond coupons</b> is even more time-sensitive than it was Friday, while gold's second straight down session — against a backdrop of live Mideast escalation — keeps looking more like an entry point than a value trap.`, th:`<b>ตลาดตอนนี้สะท้อนเหตุการณ์อิหร่านช่วงสุดสัปดาห์เต็มที่แล้ว และไม่ใช่แค่เรื่องวันเดียว: วอลล์สตรีทปรับลงวันจันทร์ (S&P 500 ลดลง 0.33% สู่ 7,686.14) หลังทรัมป์ขู่โจมตีอิหร่านเพิ่มเติม น้ำมันขยับขึ้นต่อกว่า 3% ระหว่างวัน และผลตอบแทนพันธบัตร 10 ปีทะลุ 4.75% สูงสุดตั้งแต่เดือน ม.ค. 2025</b> โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นอีกครั้งสู่ 66% (จากราว 56% วันศุกร์) ตามข้อมูล CME FedWatch ขณะทองคำร่วงต่อจากวันศุกร์ ลงต่ำกว่า $4,450 ต่อออนซ์ เอเชียและยุโรปปิดตลาดวันจันทร์แบบผสม (Shanghai เพิ่มขึ้น 0.86%, SET เพิ่มขึ้น 0.44%; DAX ลดลง 0.6%, Nikkei ลดลง 0.14%, Hang Seng ลดลง 0.07%) แสดงว่าความเสียหายกระจุกตัวอยู่ที่หุ้นสหรัฐฯ กลุ่มอ่อนไหวต่อดอกเบี้ย มากกว่าเป็นการเทขายเสี่ยงทั่วโลก สำหรับลูกค้าของคุณ: เมื่อการขึ้นดอกเบี้ยของเฟดเกือบจะแน่นอนแล้ว บวกกับความเสี่ยงเงินเฟ้อจากน้ำมันที่ซ้อนทับเข้ามา <b>การล็อกคูปองพันธบัตรที่ยังสูงอยู่วันนี้</b> ยิ่งเร่งด่วนกว่าวันศุกร์ ขณะทองคำที่ร่วงต่อเนื่องเป็นวันที่สอง ท่ามกลางความตึงเครียดตะวันออกกลางที่ยังคุกรุ่นอยู่ ก็ยิ่งดูเหมือนจังหวะเข้าซื้อมากกว่ากับดักราคาถูก`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,686.14", chg:-0.33, series:[7711.76,7686.14],
      txt:{en:`<b>US stocks fell Monday — the S&P 500 −0.33% to 7,686.14, the Dow −0.7% (−374 pts) to 53,185.90, the Nasdaq −0.12% to 26,370.89 —</b> after President Trump threatened Iran with additional attacks, extending oil's jump past 3% intraday and pushing the 10-year Treasury yield above 4.75%, its highest since January 2025.`, th:`<b>หุ้นสหรัฐฯ ปรับลงวันจันทร์ — S&P 500 ลดลง 0.33% สู่ 7,686.14, Dow ลดลง 0.7% (−374 จุด) สู่ 53,185.90, Nasdaq ลดลง 0.12% สู่ 26,370.89 —</b> หลังประธานาธิบดีทรัมป์ขู่โจมตีอิหร่านเพิ่มเติม ดันน้ำมันขยับขึ้นต่อกว่า 3% ระหว่างวัน และผลตอบแทนพันธบัตร 10 ปีทะลุ 4.75% สูงสุดตั้งแต่เดือน ม.ค. 2025`},
      why:{en:`This is the second straight session where an oil/rates shock, not earnings or growth data, is driving US price action — and the size of the move (10-year at a 19-month high, hike odds at 66%) argues clients should stop thinking of this as a one-off headline and start treating today's coupons as a genuinely limited-time offer.`, th:`นี่เป็นวันที่สองติดต่อกันที่แรงกระแทกจากน้ำมัน/ดอกเบี้ย ไม่ใช่ผลประกอบการหรือข้อมูลการเติบโต เป็นตัวขับเคลื่อนราคาหุ้นสหรัฐฯ — และขนาดของการเคลื่อนไหว (พันธบัตร 10 ปีสูงสุดในรอบ 19 เดือน โอกาสขึ้นดอกเบี้ยที่ 66%) สนับสนุนให้ลูกค้าเลิกมองว่านี่เป็นแค่พาดหัวข่าวครั้งเดียว และเริ่มมองคูปองวันนี้เป็นข้อเสนอที่มีเวลาจำกัดจริง ๆ`},
      full:{en:`US stocks fell Monday as President Trump threatened Iran with additional attacks, a day after the first US-Iran military exchange in weeks near the Strait of Hormuz. The S&P 500 dropped 0.33% to close at 7,686.14, the Dow Jones Industrial Average lost 374.09 points (-0.7%) to 53,185.90, and the Nasdaq Composite slipped 0.12% to 26,370.89 — all three still finished August with monthly gains. Oil benchmarks rose more than 3% intraday on the renewed threat, and that energy-driven inflation risk, layered onto Friday's hawkish Warsh speech, pushed the 10-year Treasury yield above 4.75% for the first time since January 2025 and the 5-year above 4.50%, also a 19-month high. CME FedWatch now shows a 66% chance of a September rate hike, up from ~56% Friday and ~35% before Jackson Hole. The 2-year yield ticked up to 4.35%, the 30-year held near 5.21%, and gold extended Friday's slide to below $4,450/oz even as Mideast risk stayed elevated.`, th:`หุ้นสหรัฐฯ ปรับลงวันจันทร์ หลังประธานาธิบดีทรัมป์ขู่โจมตีอิหร่านเพิ่มเติม หนึ่งวันหลังการปะทะทางทหารระหว่างสหรัฐฯ-อิหร่านครั้งแรกในรอบหลายสัปดาห์ใกล้ช่องแคบฮอร์มุซ ดัชนี S&P 500 ลดลง 0.33% ปิดที่ 7,686.14 ดัชนี Dow Jones ลดลง 374.09 จุด (-0.7%) สู่ 53,185.90 และดัชนี Nasdaq Composite ลดลง 0.12% สู่ 26,370.89 — ทั้งสามดัชนียังปิดเดือน ส.ค. เป็นบวก ราคาน้ำมันปรับขึ้นกว่า 3% ระหว่างวันจากการขู่ครั้งใหม่ และความเสี่ยงเงินเฟ้อจากพลังงานนี้ เมื่อซ้อนทับกับสุนทรพจน์ที่ส่งสัญญาณเหยี่ยวของวอร์ชเมื่อวันศุกร์ ดันผลตอบแทนพันธบัตร 10 ปีทะลุ 4.75% เป็นครั้งแรกนับตั้งแต่เดือน ม.ค. 2025 และพันธบัตร 5 ปีทะลุ 4.50% ซึ่งเป็นระดับสูงสุดในรอบ 19 เดือนเช่นกัน CME FedWatch ตอนนี้ชี้โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ 66% เพิ่มขึ้นจากราว 56% วันศุกร์ และราว 35% ก่อน Jackson Hole ผลตอบแทนพันธบัตร 2 ปีขยับขึ้นสู่ 4.35% พันธบัตร 30 ปียืนใกล้ 5.21% และทองคำร่วงต่อจากวันศุกร์ ลงต่ำกว่า $4,450 ต่อออนซ์ แม้ความเสี่ยงตะวันออกกลางจะยังสูงอยู่`},

    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,404", chg:-0.62, series:[26570,26404],
      txt:{en:`<b>DAX fell 0.6% to 26,404 Monday,</b> pulling back from Friday's record-adjacent close as Trump's threat of further Iran strikes and the oil-driven rise in global bond yields hit European equities alongside Wall Street.`, th:`<b>DAX ลดลง 0.6% สู่ 26,404 วันจันทร์</b> ย่อตัวจากระดับใกล้สถิติสูงสุดเมื่อวันศุกร์ หลังทรัมป์ขู่โจมตีอิหร่านเพิ่ม และผลตอบแทนพันธบัตรทั่วโลกที่ปรับขึ้นจากราคาน้ำมัน กระทบหุ้นยุโรปเช่นเดียวกับวอลล์สตรีท`},
      why:{en:`Europe trading down in sympathy with the US this time — rather than decoupling as it did Friday — shows this latest escalation is being read as a genuine global risk event, not a US-only story; that broadens the case for the bond-lock conversation beyond just US-dollar clients.`, th:`ครั้งนี้ยุโรปปรับลงตามสหรัฐฯ — แทนที่จะแยกทิศทางเหมือนวันศุกร์ — แสดงว่าความตึงเครียดระลอกล่าสุดนี้ถูกมองว่าเป็นความเสี่ยงระดับโลกจริง ๆ ไม่ใช่แค่เรื่องของสหรัฐฯ ซึ่งขยายเหตุผลของบทสนทนาเรื่องล็อกตราสารหนี้ให้กว้างกว่าลูกค้าที่ถือดอลลาร์เท่านั้น`},
      full:{en:`European shares pulled back Monday after Germany's DAX had briefly touched a record intraday high near 26,619 points. The index closed down about 0.6% at 26,404, giving back some of Friday's close near 26,570, as President Trump's threat of additional Iran strikes lifted oil and global bond yields, denting risk appetite across the region alongside a weaker Wall Street. The softer tone was closely linked to the same energy and rates dynamics hitting US markets, with investors now watching the US August jobs report (Sep 4) for the next signal on the Fed's path.`, th:`หุ้นยุโรปย่อตัววันจันทร์ หลังดัชนี DAX เยอรมนีเคยแตะจุดสูงสุดระหว่างวันที่ราว 26,619 จุด ดัชนีปิดตลาดลดลงราว 0.6% สู่ 26,404 คืนกำไรบางส่วนจากระดับปิดใกล้ 26,570 เมื่อวันศุกร์ หลังทรัมป์ขู่โจมตีอิหร่านเพิ่มเติม ดันราคาน้ำมันและผลตอบแทนพันธบัตรทั่วโลกให้สูงขึ้น กดดันความเสี่ยงในการลงทุนทั่วภูมิภาคเช่นเดียวกับวอลล์สตรีทที่อ่อนแอลง บรรยากาศที่นุ่มลงนี้เชื่อมโยงกับปัจจัยพลังงานและดอกเบี้ยเดียวกันที่กระทบตลาดสหรัฐฯ ขณะนักลงทุนตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ (4 ก.ย.) เป็นสัญญาณถัดไปสำหรับทิศทางเฟด`},
      sources:[{l:"24/7 Wall St.",u:"https://247wallst.com/cards/frankfurt-gives-back-57-points-at-the-open-a-shallow-dip-th-gdaxi-market-bell-01m1bbsd34s9bjvdvg1p6r0mmp"},{l:"Trading Economics",u:"https://tradingeconomics.com/germany/stock-market"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"66,311.93", chg:-0.14, series:[66406,66312],
      txt:{en:`<b>Nikkei 225 slipped 0.14% to 66,311.93 Monday,</b> a modest pullback from Friday's close as investors weighed Trump's threat of further Iran strikes and higher US yields, though the decline was far smaller than Wall Street's.`, th:`<b>Nikkei 225 ลดลง 0.14% สู่ 66,311.93 วันจันทร์</b> ย่อตัวเล็กน้อยจากระดับปิดวันศุกร์ ขณะนักลงทุนประเมินการขู่โจมตีอิหร่านเพิ่มของทรัมป์และผลตอบแทนพันธบัตรสหรัฐฯ ที่สูงขึ้น แม้การปรับลงจะน้อยกว่าวอลล์สตรีทมาก`},
      why:{en:`Japan giving back only a fraction of what US stocks lost is another sign this Iran/oil/rates shock is hitting rate-sensitive US names hardest rather than broad global equities — useful context for clients who assume a US selloff automatically means Asia sells off in equal measure.`, th:`การที่ญี่ปุ่นคืนกำไรเพียงเศษเสี้ยวของที่หุ้นสหรัฐฯ เสียไป เป็นอีกสัญญาณว่าแรงกระแทกจากอิหร่าน/น้ำมัน/ดอกเบี้ยครั้งนี้กระทบหุ้นสหรัฐฯ กลุ่มอ่อนไหวต่อดอกเบี้ยหนักที่สุด มากกว่าหุ้นโลกในวงกว้าง — เป็นบริบทที่มีประโยชน์สำหรับลูกค้าที่คิดว่าหุ้นสหรัฐฯ ร่วง เอเชียต้องร่วงตามในสัดส่วนเท่ากัน`},
      full:{en:`Asian equities were mostly softer but resilient Monday after President Trump threatened Iran with additional attacks, extending Sunday's US strike near the Strait of Hormuz. Japan's Nikkei 225 fell 93.63 points (-0.14%) to close at 66,311.93, a far smaller decline than the 0.7% drop in the Dow, as investors weighed the oil-driven inflation risk against still-solid corporate earnings. The move came even as US-listed chip names stayed under pressure from the same rate repricing that has pushed September Fed hike odds to 66%. Markets across the region now look to the US August jobs report on September 4 and the Fed's September 16 meeting for the next signal.`, th:`หุ้นเอเชียส่วนใหญ่อ่อนตัวลงแต่ยังคงแข็งแกร่งวันจันทร์ หลังประธานาธิบดีทรัมป์ขู่โจมตีอิหร่านเพิ่มเติม ต่อจากที่สหรัฐฯ โจมตีใกล้ช่องแคบฮอร์มุซเมื่อวันอาทิตย์ ดัชนี Nikkei 225 ญี่ปุ่นลดลง 93.63 จุด (-0.14%) ปิดที่ 66,311.93 ลดลงน้อยกว่า Dow ที่ร่วง 0.7% มาก ขณะนักลงทุนชั่งน้ำหนักความเสี่ยงเงินเฟ้อจากน้ำมันเทียบกับผลประกอบการบริษัทที่ยังแข็งแกร่ง การเคลื่อนไหวนี้เกิดขึ้นแม้หุ้นชิปที่จดทะเบียนในสหรัฐฯ จะยังถูกกดดันจากการปรับคาดการณ์ดอกเบี้ยเดียวกันที่ดันโอกาสขึ้นดอกเบี้ยเดือน ก.ย. สู่ 66% ตลาดทั่วภูมิภาคตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. และการประชุมเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"Investing.com",u:"https://www.investing.com/news/stock-market-news/japan-stocks-lower-at-close-of-trade-nikkei-225-down-023-4882198"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"},{l:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-31/treasury-10-year-yield-tops-4-75-highest-since-january-2025"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"25,566.99", chg:-0.07, series:[25585,25567],
      txt:{en:`<b>Hang Seng edged down 0.07% to 25,566.99 Monday,</b> essentially flat despite Trump's threat of further Iran strikes, while mainland China's <b>Shanghai Composite rallied 0.86% to 3,986.3</b> on continued domestic buying.`, th:`<b>Hang Seng ลดลงเล็กน้อย 0.07% สู่ 25,566.99 วันจันทร์</b> แทบไม่เปลี่ยนแปลง แม้ทรัมป์จะขู่โจมตีอิหร่านเพิ่มเติม ขณะ <b>Shanghai Composite จีนแผ่นดินใหญ่พุ่งขึ้น 0.86% สู่ 3,986.3</b> จากแรงซื้อในประเทศที่ยังต่อเนื่อง`},
      why:{en:`A Shanghai rally on the same day oil-driven risk hit Wall Street and Europe again underlines that onshore China positioning is still being driven mainly by domestic flows, not the US rate/oil shock — a useful distinction when clients ask whether the Iran/Fed story changes their China thesis.`, th:`การที่ Shanghai ปรับขึ้นในวันเดียวกับที่ความเสี่ยงจากน้ำมันกระทบวอลล์สตรีทและยุโรปอีกครั้ง ตอกย้ำว่าการลงทุนในจีนตอนนี้ยังขับเคลื่อนจากกระแสเงินในประเทศเป็นหลัก ไม่ใช่แรงกระแทกจากดอกเบี้ย/น้ำมันของสหรัฐฯ — เป็นข้อแตกต่างที่มีประโยชน์เมื่อลูกค้าถามว่าเรื่องอิหร่าน/เฟดเปลี่ยนมุมมองต่อจีนหรือไม่`},
      full:{en:`Greater China markets diverged from the rest of the world Monday even as President Trump's threat of additional Iran strikes and rising US Treasury yields pressured Wall Street and Europe. Hong Kong's Hang Seng edged down 0.07% to 25,566.99, essentially flat, while the Shanghai Composite jumped 0.86% to 3,986.3 as onshore investors kept buying into domestic growth and policy themes largely insulated from the Mideast/rates story. Markets across the region now look to the US August jobs report on September 4 and the Fed's September 16 meeting for the next signal.`, th:`ตลาดจีนและฮ่องกงเคลื่อนไหวสวนทางกับตลาดโลกวันจันทร์ แม้ทรัมป์จะขู่โจมตีอิหร่านเพิ่มเติม และผลตอบแทนพันธบัตรสหรัฐฯ ที่สูงขึ้นจะกดดันวอลล์สตรีทและยุโรป ดัชนี Hang Seng ฮ่องกงลดลงเล็กน้อย 0.07% สู่ 25,566.99 แทบไม่เปลี่ยนแปลง ขณะ Shanghai Composite พุ่งขึ้น 0.86% สู่ 3,986.3 หลังนักลงทุนในประเทศยังคงซื้อธีมการเติบโตและนโยบายภายในประเทศ ซึ่งค่อนข้างแยกตัวจากเรื่องตะวันออกกลาง/ดอกเบี้ย ตลาดทั่วภูมิภาคตอนนี้จับตารายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. และการประชุมเฟดวันที่ 16 ก.ย. เป็นสัญญาณถัดไป`},
      sources:[{l:"24/7 Wall St.",u:"https://247wallst.com/cards/china-exposure-now-splits-by-market-not-by-country-shangha-hsi-market-bell-01m1bdgx0692yq554hh1hb3d9c"},{l:"Trading Economics",u:"https://tradingeconomics.com/china/stock-market"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,595.16", chg:0.44, series:[1588.22,1595.16],
      txt:{en:`<b>SET Index rebounded 0.44% to 1,595.16 Monday (+6.94pts),</b> on turnover of about THB 75.81bn, snapping a two-session losing streak even as Trump's threat of further Iran strikes weighed on Western markets.`, th:`<b>ดัชนี SET ฟื้นตัว 0.44% สู่ 1,595.16 วันจันทร์ (+6.94 จุด)</b> มูลค่าการซื้อขายราว 7.581 หมื่นล้านบาท หยุดการปรับลงต่อเนื่องสองวัน แม้การขู่โจมตีอิหร่านเพิ่มของทรัมป์จะกดดันตลาดตะวันตก`},
      why:{en:`The SET bouncing while Wall Street and Europe fell on the same Iran/oil headline is a reminder that Thai equities aren't simply a leveraged play on global risk sentiment right now — useful for clients who assume every US-driven selloff automatically hits their local holdings equally.`, th:`การที่ SET ฟื้นตัวขณะวอลล์สตรีทและยุโรปปรับลงจากข่าวอิหร่าน/น้ำมันเดียวกัน เป็นเครื่องเตือนใจว่าหุ้นไทยตอนนี้ไม่ได้เคลื่อนไหวตามความเสี่ยงโลกแบบทวีคูณเสมอไป — มีประโยชน์สำหรับลูกค้าที่คิดว่าการเทขายที่นำโดยสหรัฐฯ ทุกครั้งต้องกระทบพอร์ตในประเทศเท่า ๆ กัน`},
      full:{en:`Thailand's SET Index closed Monday at 1,595.16, up 6.94 points (+0.44%), on turnover of about THB 75.81 billion, snapping two straight lower sessions even as President Trump's threat of additional Iran strikes and rising US Treasury yields weighed on Wall Street and Europe. The rebound came as local investors looked past the external headline risk, though brokers continue to flag the Fed's rate path as the key swing factor for regional flows. UBS's 2026 target of 1,680 and JPMorgan's bull case of 2,000 still frame the longer-term opportunity, with the next major catalyst being the US August jobs report on September 4 ahead of the Fed's September 16 decision.`, th:`ดัชนี SET ของไทยปิดตลาดวันจันทร์ที่ 1,595.16 เพิ่มขึ้น 6.94 จุด (+0.44%) มูลค่าการซื้อขายราว 7.581 หมื่นล้านบาท หยุดการปรับลงต่อเนื่องสองวัน แม้ทรัมป์จะขู่โจมตีอิหร่านเพิ่มเติม และผลตอบแทนพันธบัตรสหรัฐฯ ที่สูงขึ้นจะกดดันวอลล์สตรีทและยุโรป การฟื้นตัวนี้เกิดขึ้นขณะนักลงทุนในประเทศมองข้ามความเสี่ยงจากพาดหัวข่าวภายนอก แม้โบรกเกอร์จะยังคงระบุว่าทิศทางดอกเบี้ยของเฟดเป็นปัจจัยแกว่งสำคัญของกระแสเงินในภูมิภาค เป้าหมายปี 2026 ของ UBS ที่ 1,680 และกรณีขาขึ้นของ JPMorgan ที่ 2,000 ยังคงเป็นกรอบโอกาสระยะยาว โดยปัจจัยขับเคลื่อนสำคัญถัดไปคือรายงานการจ้างงานเดือน ส.ค. ของสหรัฐฯ วันที่ 4 ก.ย. ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`},
      sources:[{l:"Kaohoon International",u:"https://www.kaohooninternational.com/markets/589773"},{l:"SET Official",u:"https://www.set.or.th/en/market/index/set/overview"},{l:"CNBC",u:"https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil extended its jump Monday — Brent near $91/bbl (+2.93% to $90.69), WTI above $86 —</b> after President Trump threatened Iran with additional attacks, its biggest gain in three weeks, layering fresh energy-inflation risk on top of Sunday's US strike near the Strait of Hormuz. <b>Gold extended Friday's slide, dipping below $4,450/oz</b> even with the Mideast risk still live, as a stronger dollar and rate-hike bets kept outweighing the safe-haven bid.`, th:`<b>น้ำมันขยับขึ้นต่อวันจันทร์ — เบรนท์ใกล้ $91 ต่อบาร์เรล (เพิ่มขึ้น 2.93% สู่ $90.69), WTI เหนือ $86</b> หลังประธานาธิบดีทรัมป์ขู่โจมตีอิหร่านเพิ่มเติม ปรับขึ้นแรงที่สุดในรอบสามสัปดาห์ ซ้อนทับความเสี่ยงเงินเฟ้อด้านพลังงานใหม่บนการโจมตีของสหรัฐฯ ใกล้ช่องแคบฮอร์มุซเมื่อวันอาทิตย์ <b>ทองคำร่วงต่อจากวันศุกร์ ลงต่ำกว่า $4,450 ต่อออนซ์</b> แม้ความเสี่ยงตะวันออกกลางจะยังคุกรุ่นอยู่ เนื่องจากดอลลาร์ที่แข็งค่าและแรงเดิมพันขึ้นดอกเบี้ยยังคงมีน้ำหนักมากกว่าแรงซื้อสินทรัพย์ปลอดภัย`},
     why:{en:`A US president publicly threatening more strikes, not just a single acknowledged action, is a step up in escalation risk — and gold still falling despite it tells clients the market currently weighs the rate story above the geopolitical one, which is exactly the kind of gap that can close fast and violently if either side blinks.`, th:`การที่ประธานาธิบดีสหรัฐฯ ขู่โจมตีเพิ่มเติมต่อสาธารณะ ไม่ใช่แค่ปฏิบัติการเดียวที่ยืนยันแล้ว เป็นการยกระดับความเสี่ยงขึ้นไปอีกขั้น และการที่ทองคำยังคงร่วงแม้จะมีเหตุการณ์นี้ บอกลูกค้าว่าตลาดตอนนี้ให้น้ำหนักเรื่องดอกเบี้ยมากกว่าภูมิรัฐศาสตร์ ซึ่งเป็นช่องว่างที่อาจปิดลงอย่างรวดเร็วและรุนแรงได้ หากฝ่ายใดฝ่ายหนึ่งอ่อนข้อหรือยกระดับต่อ`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>The 10-year Treasury yield topped 4.75% Monday, its highest since January 2025,</b> and the 5-year broke above 4.50%, a 19-month high, as oil-driven inflation risk compounded Friday's hawkish Warsh shock. <b>CME FedWatch now shows a 66% chance of a September hike, up from ~56% Friday and ~35% before Jackson Hole.</b> The <b>2-year yield ticked up to 4.35%,</b> and the <b>30-year held near 5.21%.</b>`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีทะลุ 4.75% วันจันทร์ สูงสุดตั้งแต่เดือน ม.ค. 2025</b> และพันธบัตร 5 ปีทะลุ 4.50% ระดับสูงสุดในรอบ 19 เดือน หลังความเสี่ยงเงินเฟ้อจากน้ำมันซ้อนทับแรงกระแทกจากสุนทรพจน์ที่ส่งสัญญาณเหยี่ยวของวอร์ชเมื่อวันศุกร์ <b>CME FedWatch ตอนนี้ชี้โอกาสขึ้นดอกเบี้ยเดือน ก.ย. ที่ 66% เพิ่มขึ้นจากราว 56% วันศุกร์ และราว 35% ก่อน Jackson Hole</b> ผลตอบแทนพันธบัตร <b>2 ปีขยับขึ้นสู่ 4.35%</b> และ <b>30 ปียืนใกล้ 5.21%</b>`},
     why:{en:`A near-certain hike is no longer a forecast, it's what the market is now pricing — and a 19-month-high 10-year print means the "closing window" on today's coupons just got measurably narrower. This is the moment to move client bond conversations from "consider" to "act."`, th:`การขึ้นดอกเบี้ยที่เกือบจะแน่นอนแล้วไม่ใช่แค่การคาดการณ์อีกต่อไป แต่เป็นสิ่งที่ตลาดกำลังสะท้อนอยู่จริง — และตัวเลขพันธบัตร 10 ปีที่สูงสุดในรอบ 19 เดือน หมายความว่า "หน้าต่างโอกาสที่กำลังจะปิด" ของคูปองวันนี้แคบลงอย่างเห็นได้ชัด นี่คือจังหวะที่ควรเปลี่ยนบทสนทนาเรื่องตราสารหนี้กับลูกค้าจาก "พิจารณา" เป็น "ลงมือทำ"`}},
  ];

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Tariff risk hasn't gone away — Section 338 tariffs on Canadian imports took effect Aug 22, and a possible new ~7.5% China "overcapacity" tariff remains live ahead of a planned Trump-Xi summit — but the president's focus Monday was Iran, not trade: <b>his threat of further strikes, not tariff news, drove the day's oil and rates moves.</b> A reminder that clients' portfolios face several live, largely independent risks right now: tariffs, rates and geopolitics.`, th:`ความเสี่ยงภาษียังไม่หายไป — มาตรการภาษีมาตรา 338 ต่อสินค้านำเข้าจากแคนาดามีผลบังคับใช้ตั้งแต่ 22 ส.ค. และภาษีจีน "กำลังผลิตล้นตลาด" ที่อาจเก็บใหม่ราว 7.5% ยังคงคุกรุ่นอยู่ก่อนการประชุมสุดยอดทรัมป์-สี จิ้นผิงที่วางแผนไว้ — แต่ประเด็นหลักของทรัมป์วันจันทร์คืออิหร่าน ไม่ใช่การค้า <b>การขู่โจมตีเพิ่มเติมของเขา ไม่ใช่ข่าวภาษี คือปัจจัยที่ขับเคลื่อนความเคลื่อนไหวของน้ำมันและดอกเบี้ยวันนี้</b> เป็นเครื่องเตือนใจว่าพอร์ตของลูกค้ากำลังเผชิญความเสี่ยงที่ยังคุกรุ่นอยู่หลายด้านซึ่งค่อนข้างเป็นอิสระต่อกัน คือภาษี ดอกเบี้ย และภูมิรัฐศาสตร์`}, w:{en:`With tariff risk still simmering in the background, the Fed now hawkish, and Iran escalating again, this is a good week to reinforce that diversified, bond-anchored portfolios remain the right hedge against any of these headlines resurfacing — clients shouldn't assume one risk cancels out the others.`, th:`เมื่อความเสี่ยงภาษียังคุกรุ่นอยู่เบื้องหลัง เฟดก็หันมาส่งสัญญาณเหยี่ยว และอิหร่านก็ยกระดับความตึงเครียดอีกครั้ง สัปดาห์นี้เป็นจังหวะดีที่จะย้ำกับลูกค้าว่าพอร์ตที่กระจายความเสี่ยงและมีตราสารหนี้เป็นหลักยังคงเป็นเกราะป้องกันที่เหมาะสมหากข่าวใดข่าวหนึ่งกลับมา ลูกค้าไม่ควรคิดว่าความเสี่ยงหนึ่งจะหักล้างความเสี่ยงอื่น ๆ`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`<b>The Iran war escalated further Monday:</b> a day after US forces struck Iranian rocket and sea-mine launchers near the Strait of Hormuz, <b>President Trump publicly threatened Iran with additional attacks,</b> pushing oil benchmarks up more than 3% intraday. Brent closed near $90.69 (+2.93%), its biggest one-day gain in three weeks.`, th:`<b>สงครามอิหร่านยกระดับต่อวันจันทร์:</b> หนึ่งวันหลังกองกำลังสหรัฐฯ โจมตีฐานยิงจรวดและทุ่นระเบิดของอิหร่านใกล้ช่องแคบฮอร์มุซ <b>ประธานาธิบดีทรัมป์ขู่โจมตีอิหร่านเพิ่มเติมต่อสาธารณะ</b> ดันราคาน้ำมันขึ้นกว่า 3% ระหว่างวัน เบรนท์ปิดที่ราว $90.69 (เพิ่มขึ้น 2.93%) ปรับขึ้นแรงที่สุดในรอบสามสัปดาห์ในวันเดียว`}, w:{en:`This is no longer a single acknowledged strike — it's an open presidential threat of more to come, which raises the odds of further oil spikes rather than a quick de-escalation. That's the clearest argument yet for keeping both gold and bond ballast in client portfolios rather than treating the Iran war as a one-day story that's already priced in.`, th:`นี่ไม่ใช่แค่การโจมตีครั้งเดียวที่ยืนยันแล้วอีกต่อไป — แต่เป็นการขู่โจมตีเพิ่มเติมอย่างเปิดเผยจากประธานาธิบดี ซึ่งเพิ่มโอกาสที่น้ำมันจะพุ่งขึ้นอีก มากกว่าจะคลี่คลายอย่างรวดเร็ว นี่คือเหตุผลที่ชัดเจนที่สุดจนถึงตอนนี้ให้คงทั้งทองคำและตราสารหนี้เป็นตัวถ่วงสมดุลในพอร์ตลูกค้า แทนที่จะมองว่าสงครามอิหร่านเป็นแค่ข่าววันเดียวที่ราคาสะท้อนไปหมดแล้ว`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`<b>The 10-year Treasury yield topped 4.75% Monday, its highest since January 2025,</b> as oil-driven inflation risk compounded Friday's hawkish Warsh shock. <b>September rate-hike odds jumped again to 66%,</b> from ~56% Friday and ~35% before Jackson Hole, per CME FedWatch. The 2-year yield ticked up to 4.35%, and the 5-year broke above 4.50%, a 19-month high.`, th:`<b>ผลตอบแทนพันธบัตร 10 ปีทะลุ 4.75% วันจันทร์ สูงสุดตั้งแต่เดือน ม.ค. 2025</b> หลังความเสี่ยงเงินเฟ้อจากน้ำมันซ้อนทับแรงกระแทกจากท่าทีเหยี่ยวของวอร์ชเมื่อวันศุกร์ <b>โอกาสขึ้นดอกเบี้ยเดือน ก.ย. พุ่งขึ้นอีกครั้งสู่ 66%</b> จากราว 56% วันศุกร์ และราว 35% ก่อน Jackson Hole ตามข้อมูล CME FedWatch ผลตอบแทนพันธบัตร 2 ปีขยับขึ้นสู่ 4.35% และพันธบัตร 5 ปีทะลุ 4.50% ระดับสูงสุดในรอบ 19 เดือน`}, w:{en:`A near coin-flip has become a near-certainty in just three trading days — that's the fastest repricing of the month, and it argues for locking in today's still-elevated coupons now, ahead of the next major catalyst: the August jobs report on September 4, before the Fed's September 16 decision.`, th:`จากครึ่งต่อครึ่งกลายเป็นเกือบแน่นอนภายในเวลาเพียงสามวันทำการ — เป็นการปรับคาดการณ์ที่เร็วที่สุดของเดือนนี้ สนับสนุนให้ล็อกคูปองที่ยังสูงอยู่วันนี้ ก่อนปัจจัยขับเคลื่อนสำคัญถัดไป: รายงานการจ้างงานเดือน ส.ค. วันที่ 4 ก.ย. ก่อนการตัดสินใจของเฟดวันที่ 16 ก.ย.`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`Oil's renewed surge — up more than 3% intraday Monday on Trump's Iran threat — adds a fresh, independent inflation risk on top of Fed Chair Warsh's warning Friday that recent PCE and CPI readings <b>"do not tell me that underlying trends have meaningfully improved."</b> Two separate inflation drivers, energy and "underlying" price pressure, are now pointing the same direction at once.`, th:`น้ำมันที่พุ่งขึ้นอีกระลอก — เพิ่มขึ้นกว่า 3% ระหว่างวันจันทร์จากการขู่อิหร่านของทรัมป์ — เพิ่มความเสี่ยงเงินเฟ้อใหม่ที่เป็นอิสระต่อกัน ซ้อนทับคำเตือนของประธานเฟดวอร์ชเมื่อวันศุกร์ที่ว่าตัวเลข PCE และ CPI ล่าสุด <b>"ไม่ได้บอกผมว่าแนวโน้มพื้นฐานดีขึ้นอย่างมีนัยสำคัญ"</b> ตอนนี้ปัจจัยเงินเฟ้อสองด้านที่แยกจากกัน คือพลังงานและแรงกดดันราคา "พื้นฐาน" กำลังชี้ไปทิศทางเดียวกันพร้อมกัน`}, w:{en:`When an energy shock and a hawkish Fed chair are both flagging inflation risk in the same week, that's the clearest "don't get complacent on rates" talking point so far this year — pair any growth-fund conversation with a reminder that the bond case hasn't weakened, it's gotten measurably stronger.`, th:`เมื่อแรงกระแทกจากพลังงานและประธานเฟดที่ส่งสัญญาณเหยี่ยวต่างชี้ความเสี่ยงเงินเฟ้อในสัปดาห์เดียวกัน นี่คือประเด็นที่ชัดเจนที่สุดให้ "อย่าประมาทเรื่องดอกเบี้ย" ของปีนี้จนถึงตอนนี้ — เมื่อคุยเรื่องกองทุนเติบโตกับลูกค้า ควรย้ำด้วยว่าเหตุผลด้านตราสารหนี้ไม่ได้อ่อนลง แต่แข็งแกร่งขึ้นอย่างชัดเจน`}},
  ];

    {day:{en:"Done",th:"แล้ว"}, date:{en:"Mon",th:"จันทร์"}, imp:"h", t:{en:"Trump threatens more Iran strikes; 10Y yield tops 4.75%, hike odds hit 66%",th:"ทรัมป์ขู่โจมตีอิหร่านเพิ่ม พันธบัตร 10 ปีทะลุ 4.75% โอกาสขึ้นดอกเบี้ยแตะ 66%"}, d:{en:"Oil jumped over 3% intraday (Brent $90.69, WTI above $86) on the president's threat, pushing the 10-year Treasury yield above 4.75% for the first time since Jan 2025. US stocks fell (S&P −0.33%, Dow −0.7%); gold extended its slide below $4,450/oz.",th:"น้ำมันพุ่งขึ้นกว่า 3% ระหว่างวัน (เบรนท์ $90.69, WTI เหนือ $86) จากการขู่ของประธานาธิบดี ดันผลตอบแทนพันธบัตร 10 ปีทะลุ 4.75% เป็นครั้งแรกนับตั้งแต่ ม.ค. 2025 หุ้นสหรัฐฯ ปรับลง (S&P ลดลง 0.33%, Dow ลดลง 0.7%) ทองคำร่วงต่อลงต่ำกว่า $4,450 ต่อออนซ์"}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');

    const pg=(title,rows)=>`<div class="pgroup-h">${title}</div>`+rows.map(r=>`<div class="prow"><div class="tk"><b>${r.tk}</b><small>${t(r.sub)}</small></div><div class="spark">${spark(r.series,r.chg)}</div><div class="px num">${r.px}</div><div class="meta">${chgPill(r.chg)}<br>${L==='th'?'ณ':'as of'} ${r.asof}</div></div>`).join('');
    $('priceboard').innerHTML=pg(L==='th'?'เทคโนโลยี':'Technology',TECH)+pg(L==='th'?'การเงิน':'Financials',FIN)+pg(L==='th'?'สุขภาพ':'Healthcare',HEALTH)+pg(L==='th'?'พันธบัตรสหรัฐ ทองคำ น้ำมัน และค่าเงิน':'US Treasuries, gold, oil & FX',RATES);

    const fh=f=>`<div class="fund"><div class="top"><div class="code">${f.code}<small>${t(f.name)}</small></div><span class="rk">${t(f.rk)}</span></div><p>${t(f.desc)}</p>${f.now?`<div class="fnow"><span>${L==='th'?'ทำไมตอนนี้':'Why now'}</span>${t(f.now)}</div>`:''}<div class="hold">${f.hold.map(h=>`<span class="chip">${h}</span>`).join('')}</div></div>`;
    $('offgrid').innerHTML=OFFSHORE.map(fh).join(''); $('ongrid').innerHTML=ONSHORE.map(fh).join('');
    $('talkgrid').innerHTML=TALK.map(c=>`<div class="card"><h3>${t(c.h)}</h3><ol>${t(c.li).map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');

    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
