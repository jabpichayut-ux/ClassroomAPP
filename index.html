<title>Morning Market Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#13110F; --muted:#57534E; --faint:#8B857E;
    --line:#E5E2DD; --line-strong:#D5D1C9;
    --accent:#C8102E; --accent-soft:#FBEAEC;
    --up:#0E7C45; --up-bg:#E4F2EA; --down:#C0102E; --down-bg:#FBEAEC;
    --shadow:0 1px 2px rgba(19,17,15,.05), 0 10px 26px rgba(19,17,15,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{
    --paper:#121110; --surface:#1A1917; --surface-2:#242220;
    --ink:#F4F1ED; --muted:#A9A29A; --faint:#736C64;
    --line:#2C2A27; --line-strong:#3A3733;
    --accent:#F0384C; --accent-soft:#2a1315;
    --up:#37C77E; --up-bg:#0f2a1d; --down:#F0384C; --down-bg:#2a1315;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; font-size:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}
  a{color:var(--accent)}

  /* Forbes-style black masthead (always dark) */
  .topbar{position:sticky; top:0; z-index:20; background:#0c0b0a; border-bottom:3px solid var(--accent)}
  .topbar .row{display:flex; align-items:center; gap:10px; padding:12px 0}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:22px; font-weight:700; color:#fff; letter-spacing:-.01em}
  .brand .mk{display:inline-block; width:16px; height:16px; background:var(--accent)}
  .spacer{flex:1}
  .stamp{font-size:12px; color:#b8b2ab; display:flex; align-items:center; gap:7px; margin-right:4px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#37C77E;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,199,126,.5)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .tbtn{border:1px solid #3a3733; background:transparent; color:#e8e4de; border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans); white-space:nowrap}
  .tbtn:hover{border-color:#666}
  .tbtn.lang{color:#fff; font-weight:700; border-color:var(--accent)}
  @media(max-width:560px){.stamp{display:none}}

  /* Breaking-news cover (always dark, magazine style) */
  .cover{position:relative; margin-top:22px; border-radius:4px; overflow:hidden; background:#141210; color:#fff; min-height:280px; display:flex; align-items:flex-end; border:1px solid #241f1c}
  .coverbg{position:absolute; inset:0; opacity:.55}
  .coverbg svg{width:100%; height:100%}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,18,16,.15) 0%,rgba(20,18,16,.55) 55%,rgba(20,18,16,.92) 100%)}
  .coverinner{position:relative; z-index:2; padding:26px 26px 24px; width:100%}
  .coverkicker{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:2px}
  .covertitle{font-family:var(--serif); font-size:clamp(26px,4.6vw,44px); line-height:1.04; margin:14px 0 8px; color:#fff; letter-spacing:-.015em}
  .coverdeck{margin:0; font-size:15.5px; color:#e2ddd6; max-width:60ch; line-height:1.5}
  .covermeta{margin-top:14px; font-size:11.5px; color:#a49d95; letter-spacing:.04em; text-transform:uppercase}
  .covernote{position:absolute; top:12px; right:14px; z-index:2; font-size:10px; color:#8a837b; letter-spacing:.04em}

  .stripbar{display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .stripbar b{color:var(--ink); font-weight:700}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:800}

  section{margin:34px 0}
  .sechead{display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:8px}
  .sechead h2{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
  .sechead .hint{font-size:12px; color:var(--faint); margin-left:auto; font-weight:400}
  .rule{height:1px; background:var(--line); margin:16px 0}

  .lead{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead .tag{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .lead p{margin:8px 0 0; font-size:17px; line-height:1.62}
  .lead b{font-weight:700}

  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:840px){.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g4{grid-template-columns:1fr}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 17px; box-shadow:var(--shadow)}
  .card h3{font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .flag{font-size:16px}
  .card p{margin:0; font-size:14px; color:var(--muted); line-height:1.55}
  .card p b{color:var(--ink); font-weight:700}
  .why{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px; color:var(--muted)}
  .why span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}

  .ccard .chdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .ccard .ci{display:flex; flex-direction:column}
  .ccard .ci .ix{font-size:11.5px; color:var(--faint)}
  .ccard .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; text-align:right}
  .chartbox{position:relative; width:100%; height:96px; margin:4px 0 2px; touch-action:pan-y}
  .chartbox svg{display:block}
  .chartcap{font-size:10.5px; color:var(--faint); margin-bottom:8px}
  .ctip{position:absolute; top:0; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:3px; pointer-events:none; opacity:0; white-space:nowrap; transition:opacity .1s; z-index:3}
  .cvline{position:absolute; top:0; bottom:0; width:1px; background:var(--line-strong); pointer-events:none; opacity:0}
  .expand{margin-top:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); color:var(--accent); font-family:var(--sans); font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .expand:hover{border-color:var(--accent)}
  .full{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:12px}
  .full .srcline{margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .srcpill{font-size:11.5px; border:1px solid var(--accent); color:var(--accent); border-radius:2px; padding:3px 10px; text-decoration:none; font-weight:700}
  .srcpill:hover{background:var(--accent-soft)}
  .srclabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:800}

  .themecard{border-top:3px solid var(--accent)}

  .watch{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .wrow{display:grid; grid-template-columns:82px 1fr auto; gap:14px; align-items:center; padding:15px 18px; border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:0}
  .wrow .wd{display:flex; flex-direction:column; gap:2px}
  .wrow .wd b{font-family:var(--mono); font-size:13px} .wrow .wd small{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .wrow .wt b{font-size:14px} .wrow .wt p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .imp{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:2px; white-space:nowrap}
  .imp.h{color:#fff; background:var(--accent)} .imp.m{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent)} .imp.l{color:var(--muted); background:var(--surface-2)}
  @media(max-width:560px){.wrow{grid-template-columns:64px 1fr}.wrow .imp{grid-column:2; justify-self:start; margin-top:4px}}

  .chg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:2px; width:max-content}
  .chg.u{color:var(--up); background:var(--up-bg)} .chg.d{color:var(--down); background:var(--down-bg)} .chg.f{color:var(--muted); background:var(--surface-2)}

  .prices{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}
  .pgroup-h{display:flex; align-items:center; gap:10px; padding:11px 18px; background:var(--ink); color:var(--paper); font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:800}
  .prow{display:grid; grid-template-columns:1.7fr 96px 1fr 1.1fr; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .tk{display:flex; flex-direction:column}
  .prow .tk b{font-size:14.5px} .prow .tk small{color:var(--faint); font-size:12px}
  .prow .px{text-align:right; font-size:15px; font-weight:700}
  .prow .spark{display:flex; justify-content:center}
  .prow .meta{text-align:right; font-size:11.5px; color:var(--faint)}
  @media(max-width:620px){.prow{grid-template-columns:1.4fr 70px 1fr}.prow .meta{display:none}}
  .prow.slim{grid-template-columns:1.7fr 1fr auto 100px}
  @media(max-width:620px){.prow.slim{grid-template-columns:1.5fr 1fr auto}.prow.slim .meta{display:none}}
  .newscard h3{font-family:var(--serif); font-size:16px; margin-bottom:10px}
  .newslist{margin:0; padding-left:16px; font-size:13px; color:var(--muted); line-height:1.5}
  .newslist li{margin:8px 0} .newslist li b{color:var(--ink); font-weight:700}

  .spotlight{background:var(--surface-2); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:4px; padding:22px; box-shadow:var(--shadow)}
  .badge{background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:2px}
  .subhead{font-family:var(--serif); font-size:18px; margin:6px 0 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .subhead small{font-family:var(--sans); font-size:11.5px; font-weight:400; color:var(--muted)}
  .fund{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:8px}
  .fund .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .fund .code{font-weight:800; font-size:15px} .fund .code small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px}
  .fund .rk{font-size:10.5px; color:var(--accent); font-weight:800; border:1px solid var(--accent); border-radius:2px; padding:2px 7px; white-space:nowrap; text-align:center}
  .fund p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.5}
  .fund .hold{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:2px; padding:2px 9px; color:var(--muted)}
  .fnow{font-size:12px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
  .fnow span{color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10px; margin-right:5px}

  .talk{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.talk{grid-template-columns:1fr}}
  .talk .card{border-top:3px solid var(--ink)}
  .talk ol{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--muted)} .talk li{margin:6px 0}

  footer{border-top:3px solid var(--ink); margin-top:44px; padding:26px 0 60px; font-size:12.5px; color:var(--faint)}
  footer h4{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:800}
  .srcs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .src{border:1px solid var(--line); border-radius:2px; padding:3px 11px; color:var(--muted); font-size:12px}
  .disc{background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:13px 15px; line-height:1.6}
</style>

<div class="topbar">
  <div class="wrap row">
    <div class="brand"><span class="mk"></span>The Morning Desk</div>
    <div class="spacer"></div>
    <div class="stamp"><span class="pulse"></span><span id="stamp"></span></div>
    <button class="tbtn lang" id="lang">ไทย</button>
    <button class="tbtn" id="theme">◐ <span id="themelbl">Theme</span></button>
  </div>
</div>

<div class="wrap">
  <section class="cover">
    <div class="coverbg" aria-hidden="true">
      <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMid slice">
        <g>
          <rect x="60" y="150" width="18" height="120" fill="#5b5750"/><rect x="66" y="120" width="6" height="30" fill="#5b5750"/>
          <rect x="110" y="110" width="18" height="160" fill="#6d6860"/><rect x="116" y="90" width="6" height="20" fill="#6d6860"/>
          <rect x="160" y="175" width="18" height="95" fill="#4f4b45"/>
          <rect x="210" y="130" width="18" height="140" fill="#6d6860"/>
          <rect x="820" y="160" width="18" height="110" fill="#7a2530"/>
          <rect x="870" y="120" width="18" height="150" fill="#9c2030"/><rect x="876" y="96" width="6" height="24" fill="#9c2030"/>
          <rect x="920" y="185" width="18" height="85" fill="#7a2530"/>
          <rect x="970" y="140" width="18" height="130" fill="#9c2030"/>
          <rect x="1020" y="170" width="18" height="100" fill="#7a2530"/>
        </g>
        <path d="M0 220 L120 190 L240 205 L360 160 L480 175 L600 120 L720 145 L840 95 L960 120 L1080 70"
              fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
    <span class="covernote" id="hero-note"></span>
    <div class="coverinner">
      <span class="coverkicker" id="hero-kicker"></span>
      <h1 class="covertitle" id="hero-title"></h1>
      <p class="coverdeck" id="hero-deck"></p>
      <div class="covermeta" id="hero-meta"></div>
    </div>
  </section>

  <div class="stripbar">
    <span id="db-ed"></span><span id="db-cov"></span><span id="db-next"></span>
  </div>

  <section id="brief">
    <div class="sechead"><h2 id="s-brief"></h2><span class="hint" id="h-brief"></span></div>
    <div class="lead"><span class="tag" id="leadtag"></span><p id="leadtxt"></p></div>
  </section>

  <section id="news">
    <div class="sechead"><h2 id="s-news"></h2><span class="hint" id="h-news"></span></div>
    <div class="grid g2" id="newsgrid"></div>
  </section>

  <section id="indices">
    <div class="sechead"><h2 id="s-indices"></h2><span class="hint" id="h-indices"></span></div>
    <div class="prices" id="indexboard"></div>
  </section>

  <section id="watch">
    <div class="sechead"><h2 id="s-watch"></h2><span class="hint" id="h-watch"></span></div>
    <div class="watch" id="watchlist"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 0" id="watchnote"></p>
  </section>




  <footer>
    <h4 id="f-src"></h4>
    <div class="srcs">
      <span class="src">CNBC</span><span class="src">Bloomberg</span><span class="src">Trading Economics</span>
      <span class="src">Kaohoon Intl</span><span class="src">UOB Asset Management</span><span class="src">Federal Reserve H.15</span>
    </div>
    <div class="disc" id="disc"></div>
    <p style="margin-top:14px" id="f-foot"></p>
  </footer>
</div>

<script>
  let L='en';
  const $=id=>document.getElementById(id);

  const S={
    stamp:{en:"Auto-updates hourly · market hours · Bangkok", th:"อัปเดตอัตโนมัติทุกชั่วโมง · ช่วงตลาดเปิด · กรุงเทพฯ"},
    themelbl:{en:"Theme", th:"ธีม"},
    heroKicker:{en:"Breaking · Markets", th:"ข่าวด่วน · ตลาด"},
    heroTitle:{en:"Hot October CPI Sends the 10-Year Back to 5% and Puts a Half-Point Fed Hike on the Table — Wall Street Slips Despite Fading Oil on Iran Peace Hopes", th:"เงินเฟ้อเดือน ต.ค. ร้อนแรง ดันบอนด์ 10 ปีกลับไปแตะ 5% และทำให้เฟดอาจขึ้นดอกเบี้ยถึง 0.50% — หุ้นสหรัฐฯ ปรับลง แม้ราคาน้ำมันจะอ่อนตัวจากความหวังสันติภาพกับอิหร่าน"},
    heroDeck:{en:`Tuesday's October CPI ran hot: headline prices rose 0.4% (vs 0.3% expected) and core rose 0.3% for a third straight month (vs 0.2%). That hit exactly the line Fed Governor Waller had set for weighing a half-point December hike, and he said a 50bp move should be considered. The 2-year yield jumped 17bp to 4.73%, the 10-year rose 10bp to 4.98% after briefly topping 5%, and the 30-year climbed to 5.35%. The S&P 500 fell 0.38% to 7,520.93 and the Nasdaq lost 0.74%. Oil kept sliding: Brent settled at $91.49 after briefly dipping below $90 for the first time since August, as Trump said the Iran war could end "fairly soon." Asia had rallied earlier in the day (Nikkei +2.87%, SET +1.58%) before the CPI print.`, th:`ตัวเลขเงินเฟ้อ (CPI) เดือนตุลาคมที่ออกวันอังคารสูงกว่าคาด: ราคาสินค้าโดยรวมขึ้น 0.4% (คาด 0.3%) และเงินเฟ้อพื้นฐานขึ้น 0.3% เป็นเดือนที่ 3 ติดกัน (คาด 0.2%) ซึ่งตรงกับเกณฑ์ที่ผู้ว่าการเฟด Waller เคยบอกไว้ว่าจะพิจารณาขึ้นดอกเบี้ย 0.50% ในเดือนธันวาคม และเขาก็บอกว่าควรพิจารณาขึ้น 0.50% จริง ผลตอบแทนบอนด์ 2 ปีพุ่ง 0.17% สู่ 4.73% บอนด์ 10 ปีขึ้น 0.10% สู่ 4.98% หลังแตะเกิน 5% ระหว่างวัน และบอนด์ 30 ปีขึ้นสู่ 5.35% ดัชนี S&P 500 ลดลง 0.38% สู่ 7,520.93 และ Nasdaq ลดลง 0.74% ส่วนน้ำมันยังอ่อนตัวต่อ: Brent ปิดที่ $91.49 หลังหลุด $90 ระหว่างวันเป็นครั้งแรกตั้งแต่เดือนสิงหาคม เพราะทรัมป์บอกว่าสงครามกับอิหร่านอาจจบ "ในเร็วๆ นี้" ตลาดเอเชียบวกแรงก่อนตัวเลข CPI ออก (Nikkei +2.87%, SET +1.58%)`},

    leadtag:{en:"Bottom line", th:"สรุปสั้น"},
    leadtxt:{en:`<b>The story has flipped from oil to inflation and the Fed.</b> October core CPI rose 0.3% for a third month, Governor Waller said a <b>half-point December hike</b> should be considered, and the <b>10-year yield touched 5% again</b> (closed 4.98%, 2-year +17bp to 4.73%). US stocks slipped (S&P 500 −0.38%, Nasdaq −0.74%, tech the worst sector). Oil is no longer the main threat: <b>Brent fell to $91.49</b> as Trump said the Iran war could end soon and Hormuz flows have largely recovered. After Democrats won both houses in last week's midterms, the White House says <b>tariffs stay</b> (now under Section 301). <b>For clients: rates are the risk to watch, not oil — favour short-duration bonds and quality over long-duration and high-valuation tech.</b>`, th:`<b>ประเด็นหลักเปลี่ยนจากน้ำมันมาเป็นเงินเฟ้อและเฟด</b> เงินเฟ้อพื้นฐานเดือน ต.ค. ขึ้น 0.3% เป็นเดือนที่ 3 ผู้ว่าการเฟด Waller บอกว่าควรพิจารณา<b>ขึ้นดอกเบี้ย 0.50% ในเดือนธันวาคม</b> และ<b>บอนด์ 10 ปีกลับไปแตะ 5%</b> (ปิด 4.98%, บอนด์ 2 ปี +0.17% สู่ 4.73%) หุ้นสหรัฐฯ ปรับลง (S&P 500 −0.38%, Nasdaq −0.74%, หุ้นเทคลงมากสุด) น้ำมันไม่ใช่ภัยหลักแล้ว: <b>Brent ลงมาที่ $91.49</b> เพราะทรัมป์บอกว่าสงครามกับอิหร่านอาจจบเร็วๆ นี้ และการขนส่งผ่านฮอร์มุซกลับมาเกือบปกติ หลังพรรคเดโมแครตชนะทั้งสองสภาในการเลือกตั้งกลางเทอมสัปดาห์ก่อน ทำเนียบขาวยืนยันว่า<b>ภาษีนำเข้ายังอยู่</b> (ย้ายมาใช้มาตรา 301) <b>สำหรับลูกค้า: ความเสี่ยงหลักตอนนี้คือดอกเบี้ย ไม่ใช่น้ำมัน — เน้นตราสารหนี้อายุสั้นและหุ้นคุณภาพ มากกว่าบอนด์อายุยาวและหุ้นเทคที่แพง</b>`},

    watchnote:{en:`October CPI came in hot (core +0.3% for a third month) and Governor Waller now says a 50bp December hike should be considered; a Reuters poll shows all 101 economists expect at least a quarter-point hike to 4.00–4.25%. The 10-year is back at ~5%. Oil, by contrast, is easing (Brent ~$91.5) on Iran peace hopes. The three things that matter most: how big the December hike is, whether the 10-year breaks and holds above 5%, and whether an Iran deal actually gets signed.`,
      th:`เงินเฟ้อเดือน ต.ค. สูงกว่าคาด (เงินเฟ้อพื้นฐาน +0.3% เป็นเดือนที่ 3) และผู้ว่าการเฟด Waller บอกว่าควรพิจารณาขึ้นดอกเบี้ย 0.50% ในเดือนธันวาคม ผลสำรวจของ Reuters พบว่านักเศรษฐศาสตร์ทั้ง 101 คนคาดว่าเฟดจะขึ้นอย่างน้อย 0.25% สู่ 4.00–4.25% บอนด์ 10 ปีกลับมาอยู่ราว 5% ขณะที่น้ำมันกลับอ่อนตัวลง (Brent ราว $91.5) จากความหวังสันติภาพกับอิหร่าน 3 เรื่องสำคัญที่สุด: เฟดจะขึ้นดอกเบี้ยมากแค่ไหนในเดือนธันวาคม, บอนด์ 10 ปีจะทะลุและยืนเหนือ 5% ได้หรือไม่ และข้อตกลงกับอิหร่านจะเกิดขึ้นจริงหรือไม่`},

      th:`<b>โปรดอ่าน</b> นี่คือสรุปตลาดส่วนตัวเพื่อช่วยให้คุณตามตลาดได้ทัน — <b>ไม่ใช่คำแนะนำการลงทุน บทวิเคราะห์ หรือการชักชวนลงทุน</b> และไม่ใช่เอกสารทางการของ UOB, UOBAM, Prudential หรือผู้ออกใด ๆ ดัชนีหุ้น ผลตอบแทนพันธบัตร ราคาน้ำมันและทองคำ เป็นราคาปิดล่าสุดที่มี ณ ราคาปิดตลาดสหรัฐฯ ยุโรป ญี่ปุ่น จีน ฮ่องกง และไทย วันอังคารที่ 10 พ.ย. ราคาอาจล่าช้า และ <b>ไม่ใช่ราคาเรียลไทม์</b> ภาพหน้าปกเป็นภาพจำลองไม่ใช่ภาพถ่ายจริง ภาพข่าวอยู่ที่ลิงก์แหล่งข่าวต้นทาง (ลิขสิทธิ์) และตรวจสอบทุกตัวเลขกับระบบที่บริษัทรับรอง`},

    {flag:"🇺🇸", name:{en:"United States",th:"สหรัฐอเมริกา"}, ix:"S&P 500", val:"7,520.93", chg:-0.38, series:[7549.62,7520.93],
      txt:{en:`<b>US stocks fell Tuesday after a hot October CPI: the S&P 500 lost 0.38% to 7,520.93, the Nasdaq Composite dropped 0.74% to 25,065.87, and the Dow slipped 0.30% (−157.86 pts) to 52,231.89.</b> Tech was the weakest sector (−1.13%) as the 10-year yield briefly topped 5%.`, th:`<b>หุ้นสหรัฐฯ ปรับลงวันอังคารหลัง CPI เดือน ต.ค. สูงกว่าคาด: S&P 500 ลดลง 0.38% สู่ 7,520.93, Nasdaq ลดลง 0.74% สู่ 25,065.87 และ Dow ลดลง 0.30% (−157.86 จุด) สู่ 52,231.89</b> หุ้นเทคลงมากสุด (−1.13%) ขณะบอนด์ 10 ปีแตะเกิน 5% ระหว่างวัน`},
      why:{en:`The drop was modest, but it came right after Monday's big rally on Iran peace hopes, so it shows rates have taken over from oil as the main driver. Tech fell most because high-valuation growth stocks are the most sensitive to a 5% 10-year. If the Fed hikes 50bp in December, this pressure on growth stocks can continue.`, th:`การปรับลงไม่มาก แต่เกิดขึ้นทันทีหลังวันจันทร์ที่บวกแรงจากความหวังสันติภาพกับอิหร่าน แสดงว่าตอนนี้ดอกเบี้ยกลายเป็นตัวขับเคลื่อนหลักแทนน้ำมัน หุ้นเทคลงมากสุดเพราะหุ้นเติบโตที่ราคาแพงไวต่อบอนด์ 10 ปีที่ 5% มากที่สุด ถ้าเฟดขึ้น 0.50% ในเดือนธันวาคม แรงกดดันต่อหุ้นเติบโตอาจต่อเนื่อง`},
      full:{en:`US stocks closed lower Tuesday after the Bureau of Labor Statistics reported that October consumer prices rose 0.4% (vs 0.3% expected) and core prices rose 0.3% for a third straight month (vs 0.2%). The S&P 500 fell 0.38% to 7,520.93, the Nasdaq Composite dropped 0.74% to 25,065.87, and the Dow Jones Industrial Average slipped 157.86 points (−0.30%) to 52,231.89. The S&P 500 technology sector fell 1.13%. Fed Governor Christopher Waller said he leans toward a quarter-point December hike but that a half-point move should be considered with core inflation at 0.3% or higher. Treasury yields jumped: the 2-year rose 17bp to 4.73%, the 10-year rose 10bp to 4.98% after briefly trading above 5%, and the 30-year climbed 9bp to 5.35%. The selloff followed a strong Monday session driven by hopes that the Iran war is close to ending.`, th:`หุ้นสหรัฐฯ ปิดลบวันอังคาร หลังสำนักงานสถิติแรงงานรายงานว่าราคาผู้บริโภคเดือนตุลาคมขึ้น 0.4% (คาด 0.3%) และเงินเฟ้อพื้นฐานขึ้น 0.3% เป็นเดือนที่ 3 ติดกัน (คาด 0.2%) S&P 500 ลดลง 0.38% สู่ 7,520.93, Nasdaq ลดลง 0.74% สู่ 25,065.87 และ Dow ลดลง 157.86 จุด (−0.30%) สู่ 52,231.89 หุ้นกลุ่มเทคใน S&P 500 ลดลง 1.13% ผู้ว่าการเฟด Christopher Waller บอกว่าตนเอนเอียงไปทางขึ้นดอกเบี้ย 0.25% ในเดือนธันวาคม แต่ควรพิจารณาขึ้น 0.50% หากเงินเฟ้อพื้นฐานอยู่ที่ 0.3% ขึ้นไป ผลตอบแทนพันธบัตรพุ่ง: บอนด์ 2 ปีขึ้น 0.17% สู่ 4.73%, 10 ปีขึ้น 0.10% สู่ 4.98% หลังแตะเกิน 5% และ 30 ปีขึ้น 0.09% สู่ 5.35% การปรับลงเกิดหลังวันจันทร์ที่ตลาดบวกแรงจากความหวังว่าสงครามกับอิหร่านใกล้จบ`},
      sources:[{l:"TheStreet — Nasdaq falls after key inflation report derails strong start to week",u:"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-10-2026"},{l:"CNBC — 10-year Treasury yield races back to 5%",u:"https://www.cnbc.com/2026/11/10/us-bonds-treasurys-yields.html"},{l:"CNBC — CPI inflation report: October 2026",u:"https://www.cnbc.com/2026/11/10/cpi-inflation-report-october-2026.html"}]},
    {flag:"🇪🇺", name:{en:"Europe",th:"ยุโรป"}, ix:"DAX (Germany)", val:"26,347.45", chg:0.31, series:[26267.19,26347.45],
      txt:{en:`<b>Germany's DAX rose 0.31% (+80.26 pts) to 26,347.45 Tuesday,</b> but closed at its session low after the US inflation data erased most of an earlier 1.4% gain.`, th:`<b>ดัชนี DAX เยอรมนีเพิ่มขึ้น 0.31% (+80.26 จุด) สู่ 26,347.45 วันอังคาร</b> แต่ปิดที่จุดต่ำสุดของวัน หลังตัวเลขเงินเฟ้อสหรัฐฯ ลบกำไรเกือบทั้งหมดจากที่เคยบวกถึง 1.4%`},
      why:{en:`Europe was enjoying the drop in oil, which helps an energy-importing region, until the US CPI reminded everyone that higher US yields pull global bond yields up too. The DAX is still close to its record, so the trend is intact, but the late fade shows how quickly US rate news can override local good news.`, th:`ยุโรปได้ประโยชน์จากราคาน้ำมันที่ลดลง (เพราะเป็นภูมิภาคที่นำเข้าพลังงาน) จนกระทั่ง CPI สหรัฐฯ เตือนว่าบอนด์สหรัฐฯ ที่สูงขึ้นจะดึงผลตอบแทนบอนด์ทั่วโลกขึ้นด้วย DAX ยังอยู่ใกล้ระดับสูงสุดเป็นประวัติการณ์ แนวโน้มจึงยังดี แต่การที่บวกหายไปช่วงท้ายแสดงว่าข่าวดอกเบี้ยสหรัฐฯ กลบข่าวดีในประเทศได้เร็วมาก`},
      full:{en:`European shares gave back most of their early gains Tuesday. Germany's DAX had been up about 1.4% on lower oil prices and Iran peace hopes, but the hotter-than-expected US October CPI pushed Treasury yields higher and the index closed at its session low, up 0.31% (+80.26 points) at 26,347.45 from Monday's 26,267.19. The index remains near its record territory.`, th:`หุ้นยุโรปคืนกำไรช่วงเช้าเกือบทั้งหมดวันอังคาร ดัชนี DAX เคยบวกราว 1.4% จากราคาน้ำมันที่ลดลงและความหวังสันติภาพกับอิหร่าน แต่ CPI สหรัฐฯ เดือน ต.ค. ที่สูงกว่าคาดดันผลตอบแทนบอนด์สหรัฐฯ ขึ้น ทำให้ดัชนีปิดที่จุดต่ำสุดของวัน บวก 0.31% (+80.26 จุด) ที่ 26,347.45 จาก 26,267.19 ของวันจันทร์ ดัชนียังอยู่ใกล้ระดับสูงสุดเป็นประวัติการณ์`},
      sources:[{l:"CappNotes — Closing Look, Tuesday, November 10, 2026",u:"https://cappnotes.substack.com/p/closing-look-tuesday-november-10"},{l:"Yahoo Finance — DAX (^GDAXI)",u:"https://finance.yahoo.com/quote/%5EGDAXI/"}]},
    {flag:"🌏", name:{en:"Asia-Pacific",th:"เอเชีย-แปซิฟิก"}, ix:"Nikkei 225 (Japan)", val:"60,459.58", chg:2.87, series:[58772.3,60459.58],
      txt:{en:`<b>Tokyo's Nikkei 225 jumped 2.87% to 60,459.58 Tuesday</b> as tech shares rebounded across Asia and lower crude prices helped. This was before the hot US CPI, so Wednesday may give some back.`, th:`<b>ดัชนี Nikkei 225 ญี่ปุ่นพุ่ง 2.87% สู่ 60,459.58 วันอังคาร</b> จากหุ้นเทคที่ฟื้นตัวทั่วเอเชียและราคาน้ำมันที่ลดลง แต่เป็นการปิดก่อน CPI สหรัฐฯ ที่ร้อนแรง วันพุธจึงอาจคืนกำไรบางส่วน`},
      why:{en:`Japan is very sensitive to oil (it imports almost all of it) and to chip stocks, so falling oil plus a tech rebound is the best mix for the Nikkei. The risk now is that the US CPI and a 5% 10-year hit chip stocks again in Wednesday's trading.`, th:`ญี่ปุ่นอ่อนไหวต่อราคาน้ำมันมาก (นำเข้าเกือบทั้งหมด) และต่อหุ้นชิป ดังนั้นน้ำมันลดลงบวกกับหุ้นเทคฟื้นจึงเป็นส่วนผสมที่ดีที่สุดสำหรับ Nikkei ความเสี่ยงตอนนี้คือ CPI สหรัฐฯ และบอนด์ 10 ปีที่ 5% อาจกดหุ้นชิปอีกครั้งในการซื้อขายวันพุธ`},
      full:{en:`Japanese stocks surged Tuesday, with the Nikkei 225 rising 2.87% to close at 60,459.58. Technology shares rebounded across Asia and falling crude prices supported sentiment after Trump said the Iran war could end soon. The close came before the US October CPI release, which later pushed Treasury yields sharply higher and weighed on US tech.`, th:`หุ้นญี่ปุ่นพุ่งแรงวันอังคาร Nikkei 225 ขึ้น 2.87% ปิดที่ 60,459.58 หุ้นเทคฟื้นตัวทั่วเอเชีย และราคาน้ำมันที่ลดลงช่วยหนุนบรรยากาศ หลังทรัมป์บอกว่าสงครามกับอิหร่านอาจจบเร็วๆ นี้ การปิดตลาดเกิดก่อนการประกาศ CPI สหรัฐฯ เดือน ต.ค. ซึ่งต่อมาดันผลตอบแทนบอนด์สหรัฐฯ ขึ้นแรงและกดดันหุ้นเทคสหรัฐฯ`},
      sources:[{l:"The Weekend Spread — The Open: Tuesday, November 10, 2026",u:"https://theweekendspread.substack.com/p/the-open-tuesday-november-10-2026"},{l:"Yahoo Finance — Nikkei 225 (^N225)",u:"https://finance.yahoo.com/quote/%5EN225/"}]},
    {flag:"🇨🇳", name:{en:"China / Hong Kong",th:"จีน / ฮ่องกง"}, ix:"Hang Seng", val:"24,557.04", chg:0.44, series:[24448.95,24557.04],
      txt:{en:`<b>Hong Kong's Hang Seng rose 0.44% (+108.09 pts) to 24,557.04 Tuesday, led by HSBC and chip stocks, while the Shanghai Composite edged up 0.08% to about 3,663.7.</b>`, th:`<b>ดัชนี Hang Seng ฮ่องกงเพิ่มขึ้น 0.44% (+108.09 จุด) สู่ 24,557.04 วันอังคาร นำโดย HSBC และหุ้นชิป ขณะที่ดัชนี Shanghai Composite ขยับขึ้น 0.08% สู่ราว 3,663.7</b>`},
      why:{en:`China and Hong Kong joined the regional tech rebound but much more weakly than Japan, which suggests investors still prefer Japan for the chip theme. Hong Kong's banks like HSBC actually benefit from higher US rates because the HK dollar is pegged to the US dollar.`, th:`จีนและฮ่องกงบวกตามหุ้นเทคในภูมิภาค แต่น้อยกว่าญี่ปุ่นมาก แสดงว่านักลงทุนยังชอบญี่ปุ่นมากกว่าสำหรับธีมชิป ส่วนธนาคารฮ่องกงอย่าง HSBC ได้ประโยชน์จากดอกเบี้ยสหรัฐฯ ที่สูงขึ้น เพราะเงินดอลลาร์ฮ่องกงผูกค่ากับดอลลาร์สหรัฐฯ`},
      full:{en:`Hong Kong's Hang Seng Index closed at 24,557.04 on Tuesday, up 108.09 points (+0.44%) from Monday's 24,448.95, with HSBC and chip stocks leading. In mainland China, the Shanghai Composite edged up 0.08% to about 3,663.7 and the Shenzhen Component gained 0.86% to 11,241.5.`, th:`ดัชนี Hang Seng ฮ่องกงปิดที่ 24,557.04 วันอังคาร เพิ่มขึ้น 108.09 จุด (+0.44%) จาก 24,448.95 ของวันจันทร์ นำโดย HSBC และหุ้นชิป ส่วนจีนแผ่นดินใหญ่ ดัชนี Shanghai Composite ขยับขึ้น 0.08% สู่ราว 3,663.7 และดัชนี Shenzhen Component เพิ่มขึ้น 0.86% สู่ 11,241.5`},
      sources:[{l:"BBN Times — Hang Seng Index rises to 24,557.04 as HSBC and chip stocks lead",u:"https://www.bbntimes.com/financial/hong-kong-stock-exchange-hang-seng-index-rises-to-24-557-04-as-hsbc-and-chip-stocks-lead"},{l:"Trading Economics — Shanghai Composite",u:"https://tradingeconomics.com/china/stock-market"}]},
    {flag:"🇹🇭", name:{en:"Thailand",th:"ไทย"}, ix:"SET Index", val:"1,496.31", chg:1.58, series:[1473.07,1496.31],
      txt:{en:`<b>SET Index jumped 1.58% (+23.24 pts) to 1,496.31 Tuesday</b> on turnover of THB 70.81bn, lifted by regional strength, lower oil, a strong move in DELTA, and Cabinet approval of data-centre rules that boosted industrial-estate and power stocks.`, th:`<b>ดัชนี SET พุ่ง 1.58% (+23.24 จุด) สู่ 1,496.31 วันอังคาร</b> มูลค่าซื้อขาย 70,810 ล้านบาท หนุนโดยตลาดภูมิภาคที่แข็งแรง น้ำมันที่ลดลง หุ้น DELTA ที่ขึ้นแรง และการที่ ครม. อนุมัติแนวทางกำกับดูแลศูนย์ข้อมูล (ดาต้าเซ็นเตอร์) ซึ่งหนุนหุ้นนิคมอุตสาหกรรมและโรงไฟฟ้า`},
      why:{en:`The SET broke above the 1,490 resistance level analysts had flagged, on good volume, and the data-centre approval gives a real local theme beyond DELTA. But the rally happened before the hot US CPI, so foreign flows could turn cautious on Wednesday if US yields stay near 5%.`, th:`SET ทะลุแนวต้าน 1,490 จุดที่นักวิเคราะห์ระบุไว้ พร้อมมูลค่าซื้อขายที่ดี และการอนุมัติเรื่องดาต้าเซ็นเตอร์ก็เป็นธีมในประเทศที่จับต้องได้นอกเหนือจาก DELTA แต่การขึ้นนี้เกิดก่อน CPI สหรัฐฯ ที่ร้อนแรง เงินทุนต่างชาติจึงอาจระวังมากขึ้นวันพุธหากบอนด์สหรัฐฯ ยังอยู่ใกล้ 5%`},
      full:{en:`Thailand's SET Index rose 23.24 points (+1.58%) to close at 1,496.31 on Tuesday, with turnover of THB 70.81 billion. Kaohoon International's analyst attributed the rally to regional strength, lower crude prices and a notable gain in DELTA. A Cabinet approval of regulatory guidelines for data centres lifted the industrial-estate and power sectors, and speculative buying ahead of 3Q26 earnings in selected stocks also helped. The analyst expected a sideways-up market next and flagged the US CPI report as the key risk. Asia Plus Securities had set resistance at 1,490 and support at 1,460.`, th:`ดัชนี SET เพิ่มขึ้น 23.24 จุด (+1.58%) ปิดที่ 1,496.31 วันอังคาร มูลค่าซื้อขาย 70,810 ล้านบาท นักวิเคราะห์ของ Kaohoon International ระบุว่าการขึ้นมาจากตลาดภูมิภาคที่แข็งแรง ราคาน้ำมันที่ลดลง และหุ้น DELTA ที่ขึ้นโดดเด่น การที่ ครม. อนุมัติแนวทางกำกับดูแลศูนย์ข้อมูลหนุนหุ้นกลุ่มนิคมอุตสาหกรรมและโรงไฟฟ้า และมีแรงเก็งกำไรก่อนประกาศงบไตรมาส 3/2569 ในบางหุ้น นักวิเคราะห์คาดว่าตลาดจะแกว่งตัวขึ้นต่อ และชี้ว่า CPI สหรัฐฯ คือความเสี่ยงหลัก บล. เอเซีย พลัส ให้แนวต้าน 1,490 และแนวรับ 1,460`},
      sources:[{l:"Kaohoon International — Market Roundup 10 November 2026",u:"https://www.kaohooninternational.com/markets/594341"},{l:"Kaohoon International — Thai Stock Market Outlook on 10 November 2026",u:"https://www.kaohooninternational.com/markets/594245"}]},
  ];

  const EXTRA=[
    {flag:"🛢️", h:{en:"Commodities & risk",th:"สินค้าโภคภัณฑ์และความเสี่ยง"},
     txt:{en:`<b>Oil kept falling Tuesday: Brent settled down 1.17% at $91.49/bbl after briefly dipping below $90 for the first time since August, and WTI eased to about $86.</b> Trump said the Iran war could end "fairly soon" and Hormuz flows have largely recovered. Gold retreated from Monday's ~$4,123/oz as yields jumped.`, th:`<b>น้ำมันลดลงต่อวันอังคาร: Brent ปิดลดลง 1.17% ที่ $91.49 ต่อบาร์เรล หลังหลุด $90 ระหว่างวันเป็นครั้งแรกตั้งแต่เดือนสิงหาคม และ WTI อ่อนลงสู่ราว $86</b> ทรัมป์บอกว่าสงครามกับอิหร่านอาจจบ "ในเร็วๆ นี้" และการขนส่งผ่านฮอร์มุซกลับมาเกือบปกติ ทองคำอ่อนตัวจากราว $4,123 ต่อออนซ์ของวันจันทร์ เพราะผลตอบแทนบอนด์พุ่งขึ้น`},
     why:{en:`Falling oil is good for inflation later, but it has not stopped core prices rising, so the Fed is not relaxing. Analysts warn a real deal is uncertain because Iran may not accept pre-war levels of open passage. Gold is caught between geopolitical relief (bad for gold) and high real yields (also bad for gold).`, th:`น้ำมันที่ลดลงช่วยเงินเฟ้อในอนาคต แต่ยังไม่ได้หยุดเงินเฟ้อพื้นฐานที่เพิ่มขึ้น เฟดจึงยังไม่ผ่อนคลาย นักวิเคราะห์เตือนว่าข้อตกลงจริงยังไม่แน่นอน เพราะอิหร่านอาจไม่ยอมเปิดช่องแคบให้ผ่านได้เต็มที่เหมือนก่อนสงคราม ส่วนทองคำโดนกดจากสองทาง: ความเสี่ยงภูมิรัฐศาสตร์ที่ลดลง และผลตอบแทนที่แท้จริงที่สูง`}},
    {flag:"💵", h:{en:"Rates & the Fed",th:"ดอกเบี้ยและเฟด"},
     txt:{en:`<b>Yields jumped after CPI: 2-year +17bp to 4.73%, 10-year +10bp to 4.98% (briefly above 5%), 30-year +9bp to 5.35%.</b> Governor Waller said a 50bp December hike should be considered; Dallas Fed's Logan sees two more hikes, and a Reuters poll shows all 101 economists expect a December hike to 4.00–4.25%.`, th:`<b>ผลตอบแทนบอนด์พุ่งหลัง CPI: บอนด์ 2 ปี +0.17% สู่ 4.73%, 10 ปี +0.10% สู่ 4.98% (แตะเกิน 5% ระหว่างวัน), 30 ปี +0.09% สู่ 5.35%</b> ผู้ว่าการเฟด Waller บอกว่าควรพิจารณาขึ้นดอกเบี้ย 0.50% ในเดือนธันวาคม ประธานเฟดสาขาดัลลัส Logan มองว่าจะขึ้นอีก 2 ครั้ง และผลสำรวจ Reuters พบว่านักเศรษฐศาสตร์ทั้ง 101 คนคาดว่าเฟดจะขึ้นสู่ 4.00–4.25% ในเดือนธันวาคม`},
     why:{en:`The 2-year moving much more than the 10-year means the market is pricing more hikes soon, not just long-term worry. For clients, short-dated bonds now offer high yields with less price risk, while long-duration bonds can still fall if a 50bp hike becomes the base case.`, th:`การที่บอนด์ 2 ปีขยับมากกว่าบอนด์ 10 ปีมาก หมายความว่าตลาดคาดว่าจะขึ้นดอกเบี้ยเพิ่มในเร็วๆ นี้ ไม่ใช่แค่กังวลระยะยาว สำหรับลูกค้า ตราสารหนี้อายุสั้นให้ผลตอบแทนสูงโดยมีความเสี่ยงด้านราคาน้อยกว่า ขณะที่บอนด์อายุยาวยังอาจราคาลงได้อีกหากการขึ้น 0.50% กลายเป็นกรณีหลัก`}},

  const THEMES=[
    {h:{en:"Trump & tariffs",th:"ทรัมป์และภาษี"}, p:{en:`Democrats won both the House and Senate in the Nov 3 midterms and plan a bill to undo Trump's tariffs, but the White House says it will press ahead: the tariffs now sit under Section 301 of trade law (after the Supreme Court struck down the emergency tariffs), so they don't depend on Congress. A Reuters/Ipsos poll found 62% of Americans back ending them. Expect tariffs to keep adding to goods prices.`, th:`พรรคเดโมแครตชนะทั้งสภาผู้แทนฯ และวุฒิสภาในการเลือกตั้งกลางเทอมวันที่ 3 พ.ย. และวางแผนเสนอกฎหมายยกเลิกภาษีนำเข้าของทรัมป์ แต่ทำเนียบขาวยืนยันจะเดินหน้าต่อ เพราะภาษีถูกย้ายไปใช้มาตรา 301 ของกฎหมายการค้า (หลังศาลสูงสุดล้มภาษีฉุกเฉิน) จึงไม่ต้องพึ่งรัฐสภา ผลสำรวจ Reuters/Ipsos พบว่าคนอเมริกัน 62% อยากให้ยกเลิก คาดว่าภาษีจะยังดันราคาสินค้าขึ้นต่อไป`}},
    {h:{en:"Geopolitics",th:"ภูมิรัฐศาสตร์"}, p:{en:`The Iran war looks closer to ending: Trump says it could finish "fairly soon" and rejected concerns about widening military action after the midterms. Hormuz flows have largely recovered and Brent briefly fell below $90. The catch: experts doubt Iran will accept pre-war levels of open passage, so a signed deal is not yet certain.`, th:`สงครามกับอิหร่านดูใกล้จบมากขึ้น: ทรัมป์บอกว่าอาจจบ "ในเร็วๆ นี้" และปฏิเสธข้อกังวลว่าจะขยายปฏิบัติการทางทหารหลังการเลือกตั้งกลางเทอม การขนส่งผ่านฮอร์มุซกลับมาเกือบปกติ และ Brent หลุด $90 ชั่วคราว แต่ผู้เชี่ยวชาญยังสงสัยว่าอิหร่านจะยอมเปิดช่องแคบเต็มที่เหมือนก่อนสงครามหรือไม่ ข้อตกลงจริงจึงยังไม่แน่นอน`}},
    {h:{en:"Interest rates",th:"อัตราดอกเบี้ย"}, p:{en:`A December Fed hike is now near-certain; the debate is 25bp vs 50bp. Waller opened the door to 50bp after core CPI hit 0.3%, and Logan sees two more hikes. The 10-year is back at ~5% and the 2-year jumped 17bp in a day. High yields are attractive for new bond money, but long-duration bonds and expensive growth stocks remain exposed.`, th:`การที่เฟดจะขึ้นดอกเบี้ยในเดือนธันวาคมแทบแน่นอนแล้ว คำถามคือ 0.25% หรือ 0.50% Waller เปิดทางให้ 0.50% หลังเงินเฟ้อพื้นฐานแตะ 0.3% และ Logan มองว่าจะขึ้นอีก 2 ครั้ง บอนด์ 10 ปีกลับมาราว 5% และบอนด์ 2 ปีพุ่ง 0.17% ในวันเดียว ผลตอบแทนที่สูงน่าสนใจสำหรับเงินลงทุนใหม่ในตราสารหนี้ แต่บอนด์อายุยาวและหุ้นเติบโตที่แพงยังมีความเสี่ยง`}},
    {h:{en:"Inflation",th:"เงินเฟ้อ"}, p:{en:`October headline CPI rose 0.4% and core 0.3% (a third straight month), both above forecasts. The BLS did not publish a 12-month rate this time; one economist's estimate puts headline near 4.0% and core near 2.8% (an estimate, not official). Cheaper oil should help headline over coming months, but tariffs and sticky services keep core firm.`, th:`CPI เดือนตุลาคมขึ้น 0.4% และเงินเฟ้อพื้นฐานขึ้น 0.3% (เป็นเดือนที่ 3 ติดกัน) สูงกว่าคาดทั้งคู่ ครั้งนี้สำนักงานสถิติแรงงานไม่ได้ประกาศอัตราเทียบปี นักเศรษฐศาสตร์รายหนึ่งประมาณว่าเงินเฟ้อทั่วไปราว 4.0% และพื้นฐานราว 2.8% (เป็นค่าประมาณ ไม่ใช่ตัวเลขทางการ) น้ำมันที่ถูกลงน่าจะช่วยเงินเฟ้อทั่วไปในช่วงหลายเดือนข้างหน้า แต่ภาษีนำเข้าและราคาค่าบริการทำให้เงินเฟ้อพื้นฐานยังสูง`}},

  function spark(series, chg){
    const w=84,h=26,p=3;
    if(!series||series.length===0) return `<span style="font-size:11px;color:var(--faint)">—</span>`;
    const col=chg>0?'var(--up)':chg<0?'var(--down)':'var(--muted)';
    if(series.length===1) return `<svg width="${w}" height="${h}"><circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${col}"/><line x1="8" y1="${h/2}" x2="${w-8}" y2="${h/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((w-2*p)/(series.length-1)), h-p-((v-min)/rng)*(h-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
  }
  function chgPill(chg){
    if(chg===null||chg===undefined) return `<span class="chg f">n/a</span>`;
    const c=chg>0?'u':chg<0?'d':'f', a=chg>0?'▲':chg<0?'▼':'●';
    return `<span class="chg ${c}">${a} ${(chg>0?'+':'')+chg.toFixed(2)}%</span>`;
  }
  const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toLocaleString('en-US',{maximumFractionDigits:3});
  const getVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawChart(box){
    const series=JSON.parse(box.dataset.series), chg=parseFloat(box.dataset.chg);
    const W=Math.max(box.clientWidth,120), H=96, p=8;
    const col=chg>0?getVar('--up'):chg<0?getVar('--down'):getVar('--muted');
    if(series.length<2){ box.innerHTML=`<svg width="${W}" height="${H}"><line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><circle cx="${W/2}" cy="${H/2}" r="3.4" fill="${col}"/></svg>`; return; }
    const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
    const pts=series.map((v,i)=>[p+i*((W-2*p)/(series.length-1)), H-p-((v-min)/rng)*(H-2*p)]);
    const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    const gid='bg'+Math.random().toString(36).slice(2,7);
    box.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".20"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${(H-p).toFixed(1)}" x2="${W}" y2="${(H-p).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${d} L ${pts.at(-1)[0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" fill="${col}"/></svg><div class="cvline"></div><div class="ctip"></div>`;
    box._pts=pts; box._series=series;
  }
  function wireChart(box){
    const move=e=>{ if(!box._pts)return; const r=box.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, n=box._series.length, p=8, W=r.width;
      let i=Math.round((x-p)/((W-2*p)/(n-1))); i=Math.max(0,Math.min(n-1,i));
      const [px,py]=box._pts[i], vl=box.querySelector('.cvline'), tip=box.querySelector('.ctip'), dot=box.querySelector('.dot');
      vl.style.left=px+'px'; vl.style.opacity='.7'; tip.style.left=Math.max(20,Math.min(W-20,px))+'px'; tip.style.opacity='1';
      tip.textContent=fmtNum(box._series[i])+(i===n-1?(L==='th'?'  · ล่าสุด':'  · latest'):''); if(dot){dot.setAttribute('cx',px);dot.setAttribute('cy',py);} };
    const leave=()=>{ const vl=box.querySelector('.cvline'),tip=box.querySelector('.ctip'),dot=box.querySelector('.dot');
      if(vl)vl.style.opacity='0'; if(tip)tip.style.opacity='0'; if(dot&&box._pts){dot.setAttribute('cx',box._pts.at(-1)[0]);dot.setAttribute('cy',box._pts.at(-1)[1]);} };
    box.addEventListener('pointermove',move); box.addEventListener('pointerleave',leave);
    box.addEventListener('touchmove',move,{passive:true}); box.addEventListener('touchend',leave);
  }

  function render(){
    document.documentElement.lang=L;
    $('stamp').textContent=t(S.stamp); $('themelbl').textContent=t(S.themelbl); $('lang').textContent=L==='en'?'ไทย':'EN';
    $('hero-kicker').textContent=t(S.heroKicker); $('hero-title').textContent=t(S.heroTitle); $('hero-deck').textContent=t(S.heroDeck); $('hero-note').textContent=t(S.heroNote);
    $('hero-meta').innerHTML = (L==='th'?'ครอบคลุมการซื้อขาย ':'Covering the session of ')+'<b>'+t(S.dbCovVal)+'</b> &nbsp;·&nbsp; '+t(S.updatedLbl)+': <b>'+t(S.updatedAt)+'</b>';
    $('db-ed').innerHTML=`${t(S.dbEd)}: <b>${new Date().toLocaleDateString(L==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`;
    $('db-cov').innerHTML=`${t(S.dbCov)} <b>${t(S.dbCovVal)}</b>`; $('db-next').innerHTML=`${t(S.dbNext)}: <b>${t(S.dbNextVal)}</b>`;
    $('s-brief').textContent=t(S.sBrief); $('h-brief').textContent=t(S.hBrief); $('leadtag').textContent=t(S.leadtag); $('leadtxt').innerHTML=t(S.leadtxt);
    $('s-news').textContent=t(S.sNews); $('h-news').textContent=t(S.hNews); $('s-indices').textContent=t(S.sIndices); $('h-indices').textContent=t(S.hIndices); $('s-watch').textContent=t(S.sWatch); $('h-watch').textContent=t(S.hWatch); $('watchnote').innerHTML=t(S.watchnote);
    $('f-src').textContent=t(S.fSrc); $('disc').innerHTML=t(S.disc); $('f-foot').textContent=t(S.foot);

    $('newsgrid').innerHTML =
      `<div class="card newscard"><h3>${t(S.macroH)}</h3><ul class="newslist">${NEWS.macro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`+
      `<div class="card newscard"><h3>${t(S.microH)}</h3><ul class="newslist">${NEWS.micro.map(x=>`<li><b>${t(x.h)}</b> — ${t(x.d)}</li>`).join('')}</ul></div>`;
    $('indexboard').innerHTML=`<div class="pgroup-h">${L==='th'?'ดัชนีหุ้นทั่วโลก':'Global equity indices'}</div>`+INDEXES.map(i=>`<div class="prow slim"><div class="tk"><b><span class="flag">${i.flag}</span> ${i.tk}</b><small>${t(i.rg)}</small></div><div class="px num">${i.val}</div><div>${chgPill(i.chg)}</div><div class="meta">${L==='th'?'ณ':'as of'} ${i.asof}</div></div>`).join('');
    $('watchlist').innerHTML=WATCH.map(w=>`<div class="wrow"><div class="wd"><b>${t(w.day)}</b><small>${t(w.date)}</small></div><div class="wt"><b>${t(w.t)}</b><p>${t(w.d)}</p></div><span class="imp ${w.imp}">${w.imp==='h'?(L==='th'?'สูง':'High'):w.imp==='m'?(L==='th'?'กลาง':'Medium'):(L==='th'?'ต่ำ':'Low')}</span></div>`).join('');



    document.querySelectorAll('.chartbox').forEach(b=>{drawChart(b);wireChart(b);});
    document.querySelectorAll('.expand').forEach(btn=>btn.onclick=()=>{ const full=btn.nextElementSibling, cv=btn.querySelector('.cv'); if(full.hasAttribute('hidden')){full.removeAttribute('hidden');cv.textContent='▴';}else{full.setAttribute('hidden','');cv.textContent='▾';} });
  }
  const renderCharts=()=>document.querySelectorAll('.chartbox').forEach(drawChart);

  $('lang').onclick=()=>{ L=L==='en'?'th':'en'; render(); };
  $('theme').onclick=()=>{ const r=document.documentElement, cur=r.getAttribute('data-theme'), sd=matchMedia('(prefers-color-scheme:dark)').matches; r.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sd?'light':'dark')); renderCharts(); };
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,150);});
  render();
</script>
